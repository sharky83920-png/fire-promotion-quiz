opts": {"A": "a＞b＞c", "B": "c＞b＞a", "C": "c＞a＞b", "D": "a＝b＝c"}, "answer": "A", "explain": "甲烷約0.28 mJ、乙烯約0.07 mJ、乙炔約0.02 mJ，不飽和程度愈高愈容易點燃，故a＞b＞c。", "ref": "【110專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-006", "topic": "火災", "stem": "阿里山發生森林火災，已知火災當天的相對濕度為60.0%，前一天相對濕度為50.0%，再前一天相對濕度為40.0%，試求火災當天的實效濕度？", "opts": {"A": "31.3%", "B": "34.4%", "C": "40.0%", "D": "47.5%"}, "answer": "D", "explain": "書上答案採係數r＝0.5：He＝(1－r)(H₀＋rH₁＋r²H₂)＝0.5×(60＋25＋10)＝47.5%。但日本常用r＝0.7，算得0.3×(60＋35＋19.6)≈34.4%（即選項B），題目未給r，答案具爭議。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【110專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-007", "topic": "燃燒", "stem": "己烷在閃火點時的飽和蒸氣壓為9.12mmHg，根據Burgess-Wheeler定理其燃燒熱約為多少kcal/mol？", "opts": {"A": "682", "B": "782", "C": "882", "D": "982"}, "answer": "C", "explain": "閃火點時蒸氣濃度約等於燃燒下限：9.12/760≈1.2%。Burgess-Wheeler：L×Q≈1059，Q≈1059/1.2≈882 kcal/mol。", "ref": "【110專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-008", "topic": "危險物品", "stem": "根據美國防火協會（NFPA）危險物品標示規定，將危險類別記載於菱形方塊上，其中「有害健康毒性」以何種顏色表示？", "opts": {"A": "黃色", "B": "藍色", "C": "白色", "D": "紅色"}, "answer": "B", "explain": "NFPA 704菱形標示：藍色＝健康危害、紅色＝易燃性、黃色＝反應性、白色＝特殊危害。", "ref": "【110專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-009", "topic": "危險物品", "stem": "碳化鈣（CaC₂，俗稱電石）常用於水果的催熟，屬於公共危險物品，遇水會起激烈反應產生下列何種可燃性氣體？", "opts": {"A": "氫氣", "B": "乙烷", "C": "乙烯", "D": "乙炔"}, "answer": "D", "explain": "CaC₂＋2H₂O→C₂H₂＋Ca(OH)₂，產生的是乙炔；乙烯雖是催熟激素，但並非電石遇水的產物。", "ref": "【110專技士 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-010", "topic": "危險物品", "stem": "甲基乙基酮過氧化物（MEKPO）常用於聚合物的生產，加熱至100°C時會發生爆炸，此化合物屬於那一類公共危險物品？", "opts": {"A": "第三類", "B": "第四類", "C": "第五類", "D": "第六類"}, "answer": "C", "explain": "MEKPO為有機過氧化物，屬第五類（自反應物質及有機過氧化物）；第六類是氧化性液體，第三類為自燃及禁水性物質。", "ref": "【110專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-011", "topic": "熱傳", "stem": "輻射熱是造成木造建築物延燒原因之一，下列何者正確？", "opts": {"A": "輻射量與火焰面積成正比、與輻射時間成正比", "B": "輻射量與火焰面積成正比、與輻射時間成反比", "C": "輻射量與火焰面積成反比、與輻射時間成正比", "D": "輻射量與火焰面積成反比、與輻射時間成反比"}, "answer": "A", "explain": "火焰面積愈大、照射時間愈長，受熱面累積的輻射熱量愈多，兩者皆成正比。", "ref": "【110專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-012", "topic": "防火與特殊現象", "stem": "根據NFPA 265對閃燃現象（flashover）之定義，下列敘述何者錯誤？", "opts": {"A": "上層煙氣之溫度達500～600°C", "B": "到達地面之輻射熱通量達20kW/m²", "C": "火焰總熱釋放率最少達到2MW", "D": "火焰到達開口"}, "answer": "C", "explain": "NFPA 265判定閃燃的熱釋放率門檻為1MW，而非2MW；其餘上層煙溫、地面20kW/m²、火焰竄出開口皆為判定條件。", "ref": "【110專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-013", "topic": "火災", "stem": "有一開口面積為10.0m²，開口高度為1.44m之居室，當其發生火災而形成通風控制燃燒時，根據P.H.Thomas之研究結果，則燃燒速度為多少kg/min？", "opts": {"A": "R＝25.0～27.3", "B": "R＝39.6～43.2", "C": "R＝66.0～72.0", "D": "R＝79.2～86.4"}, "answer": "C", "explain": "R＝(5.5～6.0)A√H＝(5.5～6.0)×10×1.2＝66.0～72.0 kg/min。", "ref": "【110專技士 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-014", "topic": "危險物品", "stem": "自然發火性物質中的原棉，主要是因為下列何種熱之蓄積而發火？", "opts": {"A": "分解熱", "B": "氧化熱", "C": "吸著熱", "D": "發酵熱"}, "answer": "B", "explain": "原棉、乾性油、石炭等屬氧化熱蓄積；分解熱如硝化棉，吸著熱如活性碳，發酵熱如稻草、牧草。", "ref": "【110專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-015", "topic": "危險物品", "stem": "下列有關液化天然氣（LNG）與液化石油氣（LPG）之比較，何者正確？", "opts": {"A": "液化天然氣燃燒產生的燃燒熱小於液化石油氣", "B": "液化天然氣燃燒所需的理論空氣量大於液化石油氣", "C": "液化天然氣的燃燒下限小於液化石油氣", "D": "液化天然氣的比重較空氣重，液化石油氣的比重較空氣輕"}, "answer": "A", "explain": "LNG主成分甲烷，分子小，每莫耳燃燒熱與理論空氣量均小於丙烷、丁烷為主的LPG；甲烷下限約5%高於LPG約2%，且甲烷比空氣輕、LPG比空氣重，D顛倒。", "ref": "【110專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-016", "topic": "滅火", "stem": "市面上販售的ABC乾粉滅火器內充填的乾粉滅火藥劑主要成分為", "opts": {"A": "碳酸氫鉀（KHCO₃）及尿素（CH₄N₂O）化合物", "B": "碳酸氫鈉（NaHCO₃）", "C": "碳酸氫鉀（KHCO₃）", "D": "磷酸二氫銨（NH₄H₂PO₄）"}, "answer": "D", "explain": "第三種（ABC）乾粉為磷酸二氫銨，可覆蓋A類固體表面；碳酸氫鈉為第一種、碳酸氫鉀為第二種、碳酸氫鉀加尿素為第四種乾粉。", "ref": "【110專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-017", "topic": "滅火", "stem": "下列惰性氣體類海龍替代滅火藥劑中，何者的比重小於1？", "opts": {"A": "IG-01", "B": "IG-100", "C": "IG-541", "D": "IG-55"}, "answer": "B", "explain": "IG-100為純氮氣，比重約0.97小於空氣；IG-01為氬氣（約1.38），IG-541與IG-55含氬或CO₂，比重皆大於1。", "ref": "【110專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-018", "topic": "危險物品", "stem": "根據「危害物質災害現場搶救標準作業程序」之規定，其首要工作為何？", "opts": {"A": "擬定行動方案", "B": "區域管制", "C": "建立管理系統", "D": "危害辨識"}, "answer": "D", "explain": "危害物質事故須先辨識是何種物質與其危害，才能據以劃定管制區、擬定行動方案。", "ref": "【110專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-019", "topic": "危險物品", "stem": "當發生危害物質災害時，為降低對民眾及搶救人員的危害，應迅速劃定管制區域，下列區域何者一般以黃色標示？", "opts": {"A": "支援區", "B": "影響區", "C": "污染區", "D": "禁區"}, "answer": "B", "explain": "管制區由內而外為禁區（熱區，紅）、影響區（暖區，黃，進行除污）、支援區（冷區，綠）。", "ref": "【110專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-020", "topic": "煙與熱流", "stem": "某室內場所的煙層厚度為1公尺，若此時光學密度為0.173，則該場域中避難反光指標之能見度為多少公尺？", "opts": {"A": "7.5", "B": "10", "C": "15", "D": "20"}, "answer": "A", "explain": "減光係數Cs＝2.303×D/L＝2.303×0.173/1≈0.398 m⁻¹；反光型標示K≈3，V＝3/0.398≈7.5 m。", "ref": "【110專技士 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-021", "topic": "熱傳", "stem": "下列物質在常溫時，何者的熱傳導係數（W/m·K）較低？", "opts": {"A": "玻璃", "B": "水", "C": "木材", "D": "空氣"}, "answer": "D", "explain": "空氣約0.026 W/m·K，遠低於木材（約0.1～0.2）、水（約0.6）與玻璃（約1）。", "ref": "【110專技士 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-022", "topic": "熱傳", "stem": "火災中所產生的輻射熱量與下列何者成正比？", "opts": {"A": "輻射物體攝氏溫度的二次方", "B": "外界溫差的四次方", "C": "輻射物體攝氏溫度的四次方", "D": "輻射物體絕對溫度的四次方"}, "answer": "D", "explain": "依史蒂芬－波茲曼定律q＝εσT⁴，T為絕對溫度；用攝氏溫度或溫差的四次方都不正確。", "ref": "【110專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-023", "topic": "燃燒", "stem": "請問2公斤的氫氣（H₂）完全燃燒，所需要的理論空氣量為多少公斤？（空氣中氧重量比以23%計）", "opts": {"A": "139.2", "B": "104.4", "C": "69.6", "D": "34.8"}, "answer": "C", "explain": "2 kg H₂＝1 kmol，需O₂ 0.5 kmol＝16 kg；理論空氣量＝16/0.23≈69.6 kg。", "ref": "【110專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-024", "topic": "燃燒", "stem": "在充足的能量下，下列何種濃度（vol%）的氫氣（H₂）為燃燒界限範圍內？", "opts": {"A": "100%", "B": "80%", "C": "50%", "D": "2%"}, "answer": "C", "explain": "氫氣燃燒範圍約4～75 vol%，僅50%落在其中；2%低於下限，80%、100%高於上限。", "ref": "【110專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-025", "topic": "燃燒", "stem": "請依據可燃性氣體完全燃燒時的化學理論濃度，計算丙烷的燃燒下限？", "opts": {"A": "1.34%", "B": "1.64%", "C": "1.84%", "D": "2.21%"}, "answer": "D", "explain": "C₃H₈需5 mol O₂，Cst＝100/(1＋4.773×5)≈4.02%；燃燒下限≈0.55×Cst≈2.21%。", "ref": "【110專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-026", "topic": "燃燒", "stem": "易燃性氣體受到壓縮後溫度會有升高的狀況發生，可能會發火導致火災的發生，此現象為何？", "opts": {"A": "高溫壓縮", "B": "等溫壓縮", "C": "斷熱壓縮", "D": "等熵壓縮"}, "answer": "C", "explain": "氣體被快速壓縮而來不及散熱（斷熱壓縮），溫度上升可達發火溫度；等溫壓縮溫度不變。", "ref": "【110專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-027", "topic": "火災", "stem": "某建築物的插座電壓為110伏特，在其延長線上的插座同時插上800瓦的電磁爐、110瓦的電風扇及1100瓦的電熱器，請問該延長線之額定電流至少需多少安培？", "opts": {"A": "209", "B": "110", "C": "19", "D": "9"}, "answer": "C", "explain": "總功率2010 W，I＝P/V＝2010/110≈18.3 A，額定電流至少需19 A。原OCR「8瓦」依答案回推應為800瓦。", "ref": "【110專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-028", "topic": "火災", "stem": "下列有關電器用品「焦耳熱」之敘述，何者錯誤？", "opts": {"A": "電流通過有電阻的導體所產生的熱", "B": "焦耳熱與電流成正比", "C": "電流增加造成的焦耳熱大於導體表面逸散之熱時，易生危險", "D": "焦耳熱與電阻及時間成正比"}, "answer": "B", "explain": "焦耳熱H＝I²Rt，與電流的平方成正比而非一次方；與電阻、時間則為一次方正比。", "ref": "【110專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-029", "topic": "危險物品", "stem": "工廠使用之乙炔（C₂H₂），為防止爆炸引起火災，常利用裝有某化學物質與多孔性物質充填物之鋼瓶加壓保存，請問該化學物質為何？", "opts": {"A": "氮氣（N₂）", "B": "氦氣（He）", "C": "丙酮（CH₃COCH₃）", "D": "二氧化碳（CO₂）"}, "answer": "C", "explain": "乙炔加壓易分解爆炸，故溶於多孔性物質中的丙酮（溶解乙炔）以降低分解爆炸危險。", "ref": "【110專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-030", "topic": "煙與熱流", "stem": "某建築物火場產生大量煙霧，正向煙囪效應在中性帶以上10公尺處的壓力差為12Pa，若建築物內、外的溫度差不變，請問中性帶以上20公尺處的壓力差為何？", "opts": {"A": "20Pa", "B": "24Pa", "C": "28Pa", "D": "32Pa"}, "answer": "B", "explain": "煙囪效應壓力差ΔP與距中性帶高度成正比，高度加倍則ΔP＝12×2＝24 Pa。", "ref": "【110專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-031", "topic": "爆炸", "stem": "有關影響粉塵爆炸的因素，下列何者錯誤？", "opts": {"A": "粉塵粒子的比表面積愈大，爆炸可能性愈高", "B": "粉塵粒徑愈小，其最小發火能量變大", "C": "空氣中含水量增加，粉塵爆炸危險性下降", "D": "粉塵中灰分增加，爆炸危險性下降"}, "answer": "B", "explain": "粒徑愈小比表面積愈大，最小發火能量反而愈小、愈易爆炸，B說反了。", "ref": "【110專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-032", "topic": "爆炸", "stem": "有關爆炸性物質之特性，下列何者正確？", "opts": {"A": "物質所需之最大起爆能，即為該物質之敏感度", "B": "物質之密度愈大，其敏感度愈小", "C": "物質的化學結構分子中之硝基（－NO₂）愈多，敏感度愈低", "D": "起爆溫度愈低者，其敏感度愈低"}, "answer": "B", "explain": "密度大時分子間空隙少、較不易起爆，敏感度較小。敏感度以最小（非最大）起爆能衡量；硝基愈多、起爆溫度愈低都表示愈敏感。", "ref": "【110專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-033", "topic": "爆炸", "stem": "當一小爆炸發生時，其壓力波將全廠之粉塵揚起，再被隨後而至之燃燒引爆所引起之全廠性爆炸，此現象為何？", "opts": {"A": "閃燃", "B": "複燃", "C": "塵爆", "D": "二次塵爆"}, "answer": "D", "explain": "初次爆炸揚起堆積粉塵形成粉塵雲，再被引燃造成更大範圍爆炸，即二次粉塵爆炸。", "ref": "【110專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-034", "topic": "爆炸", "stem": "液體變化為氣體之物理現象中，若變化速度至為急速時，因能量於極短的時間內大量放出，即形成爆炸現象，此現象之名稱為何？", "opts": {"A": "蒸氣爆炸", "B": "分解爆炸", "C": "高壓氣體爆炸", "D": "粉塵爆炸"}, "answer": "A", "explain": "液體急速相變為蒸氣造成體積暴增屬物理性的蒸氣爆炸；分解爆炸與粉塵爆炸皆為化學性。", "ref": "【110專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-035", "topic": "滅火", "stem": "面對廚房油鍋起火燃燒，下列何項應對動作的風險最大？", "opts": {"A": "打電話通知消防隊", "B": "以濕布覆蓋", "C": "關閉瓦斯開關", "D": "以水澆灌降溫"}, "answer": "D", "explain": "水潑入高溫油中會瞬間汽化並將燃油噴濺，使火勢擴大；濕布覆蓋可窒息，關瓦斯可斷燃料。", "ref": "【110專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-036", "topic": "防火與特殊現象", "stem": "為防止靜電發生放電時引火造成火災，請問下列有關靜電災害之防止對策何者錯誤？", "opts": {"A": "使用導電性材料製造之零件或器具", "B": "使用除電劑", "C": "改用塑膠管件，防止導電", "D": "接地"}, "answer": "C", "explain": "塑膠為絕緣體，會使電荷無法洩放而蓄積，反而增加靜電危險；防制原則是讓電荷導走。", "ref": "【110專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-037", "topic": "防火與特殊現象", "stem": "有關電氣火災防範對策中，電器設備之正確使用非常重要，在潮濕場所使用電器時，插頭應加裝何種裝置以防止感電發生？", "opts": {"A": "延長線", "B": "開關", "C": "漏電斷路器", "D": "緊急電源"}, "answer": "C", "explain": "漏電斷路器偵測到漏電流即跳脫斷電，可防止潮濕場所感電；其餘選項沒有漏電保護功能。", "ref": "【110專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-038", "topic": "滅火", "stem": "常見泡沫滅火藥劑含有界面活性劑成分，請問下列何者不是泡沫滅火藥劑滅火時界面活性劑的主要作用？", "opts": {"A": "起泡作用", "B": "乳化作用", "C": "減低表面張力作用", "D": "降低溫度作用"}, "answer": "D", "explain": "界面活性劑負責起泡、乳化與降低表面張力；冷卻主要來自泡沫中的水分，不是界面活性劑本身的作用。", "ref": "【110專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-039", "topic": "煙與熱流", "stem": "某建築物內部的空氣溫度為27°C，發生火災的房間溫度為627°C，流入該起火房間的空氣體積流量為4m³/s，若忽略燃燒熱分解過程中產生的質量流率，請計算流出起火房間的煙霧體積流量約為多少？", "opts": {"A": "4 m³/s", "B": "8 m³/s", "C": "12 m³/s", "D": "16 m³/s"}, "answer": "C", "explain": "質量守恆且定壓下體積與絕對溫度成正比：4×(900/300)＝12 m³/s。", "ref": "【110專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-040", "topic": "煙與熱流", "stem": "常見吸入火場中的煙霧而中毒者，其最主要之原因即為吸入太多一氧化碳（CO），一氧化碳往往是火場的致命殺手，其濃度達多少時可以讓人在1分鐘內死亡？", "opts": {"A": "1%", "B": "0.5%", "C": "0.2%", "D": "0.07%"}, "answer": "A", "explain": "CO濃度約1%（10000 ppm）時可在1～3分鐘內致死；0.2%約需數十分鐘，0.07%則需數小時才出現嚴重症狀。", "ref": "【110專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-041", "topic": "滅火", "stem": "近年來已有水滅火器經型式認可，下列敘述何者正確？", "opts": {"A": "水滅火器就是強化液滅火器", "B": "水滅火器噴射距離大於6公尺以上", "C": "水滅火器不可適用B類火災", "D": "水滅火器僅為添加濕潤劑之滅火器"}, "answer": "B", "explain": "依書上答案，水滅火器噴射距離達6公尺以上。水滅火器與強化液滅火器為不同類別，其藥劑可含濕潤劑等添加物且部分可適用B類火災，故A、C、D錯。此題涉及認可基準細節，信心較低。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【111專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-042", "topic": "爆炸", "stem": "有關爆燃與爆轟，下列敘述何者錯誤？", "opts": {"A": "焰面傳播速度爆燃＞爆轟", "B": "二者有可能皆屬可燃性氣體的混合燃燒", "C": "焰面（燃燒波）與衝擊波合一，稱為爆轟波", "D": "爆轟波通常伴隨機械的破壞作用"}, "answer": "A", "explain": "爆燃焰面傳播低於音速，爆轟則超過音速，應為爆轟＞爆燃，A說反了。", "ref": "【111專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-043", "topic": "火災", "stem": "實效濕度低於多少時，日本即發布火災警報？", "opts": {"A": "90%", "B": "80%", "C": "70%", "D": "60%"}, "answer": "D", "explain": "日本以實效濕度60%以下（搭配最小濕度與風速條件）作為發布火災警報的判斷基準。", "ref": "【111專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-044", "topic": "危險物品", "stem": "日本京都動畫製作所及大阪精神科診所火災起因為縱火，請問汽油在空氣中的燃燒下限為何？", "opts": {"A": "1.4%", "B": "7.6%", "C": "1.3%", "D": "2.6%"}, "answer": "A", "explain": "汽油燃燒範圍約1.4～7.6%，下限為1.4%；7.6%是上限。題幹背景字句OCR殘缺，已依事件補正。", "ref": "【111專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-045", "topic": "防火與特殊現象", "stem": "在苯中置入油酸鎂等金屬皂，係採取下列何種防止靜電發生的方法？", "opts": {"A": "使用除電劑", "B": "使用導電性材料", "C": "藉中和以防止電荷蓄積", "D": "增加周圍空氣相對濕度"}, "answer": "A", "explain": "在絕緣性液體中添加金屬皂等抗靜電添加劑以提高導電度，屬於使用除電劑的方法。", "ref": "【111專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-046", "topic": "防火與特殊現象", "stem": "火災成長歷程中，下列何者非閃燃之現象？", "opts": {"A": "火場狀況為缺氧燃燒，因某種特殊的原因導致新鮮的空氣流入之現象", "B": "閃燃係從火災成長期移向旺盛期之短暫現象", "C": "閃燃時地板的熱通量達20kW/m²", "D": "上層煙氣溫度達到500～600°C"}, "answer": "A", "explain": "缺氧燃燒後因新鮮空氣突然流入而爆燃，描述的是複燃（backdraft），不是閃燃。", "ref": "【111專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-047", "topic": "火災", "stem": "油類火災為何種火災？", "opts": {"A": "A類火災", "B": "B類火災", "C": "C類火災", "D": "D類（金屬）火災"}, "answer": "B", "explain": "可燃性液體及油脂火災屬B類；A類為一般固體，C類為電氣，D類為金屬火災。", "ref": "【111專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-048", "topic": "燃燒", "stem": "空氣中氧之重量占整體之23%，故1公斤碳完全燃燒需要多少空氣？", "opts": {"A": "11.6kg", "B": "32kg", "C": "23kg", "D": "12kg"}, "answer": "A", "explain": "C＋O₂→CO₂，1 kg碳需氧32/12≈2.67 kg，空氣量＝2.67/0.23≈11.6 kg。", "ref": "【111專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-049", "topic": "爆炸", "stem": "有關粉塵爆炸的敘述，下列何者錯誤？", "opts": {"A": "粉塵爆炸之燃燒反應在粒子表面進行，粒子直徑愈大愈易發火", "B": "粉塵與可燃性氣體在空氣中共存時，爆炸下限將下降", "C": "粉塵發火之最低溫度一般為300至700°C", "D": "粉塵粒子愈小，其最小發火能量亦變小"}, "answer": "A", "explain": "燃燒在粒子表面進行，粒徑愈小比表面積愈大才愈易發火，A說反了；混有可燃氣體（混成粉塵）會使爆炸下限降低。", "ref": "【111專技士 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-050", "topic": "煙與熱流", "stem": "火場當中煙毒危害，下列敘述何者錯誤？", "opts": {"A": "火場燃燒物毒性最大是CO₂", "B": "火場生成物HCN會造成細胞呼吸停止", "C": "吸入煙而危害生命主要原因為一氧化碳", "D": "HCHO為強烈刺激性無色氣體，主要為刺激黏膜及麻醉中樞神經"}, "answer": "A", "explain": "CO₂毒性相對低，主要以高濃度造成窒息；毒性強的是HCN、CO、光氣等。", "ref": "【111專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-051", "topic": "防火與特殊現象", "stem": "下列何者非為影響閃燃的因素？", "opts": {"A": "空氣密度", "B": "開口位置", "C": "開口面積", "D": "可燃物表面積"}, "answer": "A", "explain": "閃燃發生時間受開口大小與位置、內裝材料及可燃物表面積等影響，空氣密度不是主要影響因素。", "ref": "【111專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-052", "topic": "熱傳", "stem": "密閉空間燃燒中天花板會向地面放射大量輻射熱促進地面可燃物燃燒速度，此現象為何？", "opts": {"A": "熱傳導回饋", "B": "熱輻射回饋", "C": "熱對流回饋", "D": "閃燃效應"}, "answer": "B", "explain": "高溫煙層與天花板以輻射方式將熱回饋至地面可燃物，稱熱輻射回饋，是導致閃燃的前因。", "ref": "【111專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-053", "topic": "火災", "stem": "高層建築物火災特性下列何者錯誤？", "opts": {"A": "多為密閉建築，內部燃燒熱易蓄積", "B": "內部垂直管道及樓梯若熱煙流入易形成煙囪效應", "C": "內部有電梯故逃生迅速", "D": "受限雲梯車高度，搶救策略需賴緊急用昇降機"}, "answer": "C", "explain": "火災時一般電梯不可用於避難，高層建築避難路徑長、逃生困難，C錯。", "ref": "【111專技士 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-054", "topic": "防火與特殊現象", "stem": "普通木造建築物旁欲蓋9公尺高之建築物，其延燒係數為3級（係數為0.15），其防火間隔應保持多少公尺？", "opts": {"A": "6.32", "B": "7.74", "C": "3.21", "D": "8.56"}, "answer": "B", "explain": "依H＝p·D²，D＝√(H/p)＝√(9/0.15)≈7.74 m。", "ref": "【111專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-055", "topic": "燃燒", "stem": "下列發火源在理化現象歸類上，何者與其他不同類別？", "opts": {"A": "香煙", "B": "火星", "C": "靜電", "D": "線香"}, "answer": "C", "explain": "香煙、火星、線香皆屬高溫物體（燃燒或熾熱顆粒）類發火源，靜電屬電氣能量類。", "ref": "【111專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-056", "topic": "防火與特殊現象", "stem": "比較積污導電與金原現象之差異，下列何者錯誤？", "opts": {"A": "因電解質等物質附著而通電者，為積污導電現象", "B": "積污導電又稱電痕", "C": "金原現象又稱為沿面洩漏放電", "D": "金原現象為有機絕緣體石墨化"}, "answer": "C", "explain": "金原現象是有機絕緣體受電火花作用而碳化（石墨化）導電；沿面洩漏放電描述的是積污導電（電痕）類現象，C錯。", "ref": "【111專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-057", "topic": "防火與特殊現象", "stem": "有關閃燃（Flashover）與複燃（Backdraft）的敘述，何者錯誤？", "opts": {"A": "閃燃是一種爆炸現象，釋放的能量常造成門窗破壞；複燃是火勢快速發展的現象", "B": "依火災發展時期，閃燃常發生在成長期；複燃常發生在成長期或衰退期", "C": "閃燃發生的原因為「熱能」；複燃發生的原因為「助燃物」", "D": "火場中，閃燃有可能比複燃早發生"}, "answer": "A", "explain": "A把兩者對調了：複燃才具爆炸性、會破壞門窗，閃燃是火勢急速擴大到全室的現象。", "ref": "【111專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-058", "topic": "火災", "stem": "下列何者非電線走火之原因？", "opts": {"A": "過負載", "B": "短路", "C": "接觸不良", "D": "接地"}, "answer": "D", "explain": "接地是防止感電與靜電的安全措施，不是走火原因；過負載、短路、接觸不良皆會造成局部過熱。", "ref": "【111專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-059", "topic": "煙與熱流", "stem": "有關火羽流及天花板噴射流的敘述，下列何者錯誤？", "opts": {"A": "間歇火焰區上方溫度維持不變", "B": "火羽流通常由火焰及熱流組成", "C": "火羽流上升遇天花板沿天花板水平移動，形成天花板噴射流", "D": "天花板噴射流對地面放射輻射熱，促進可燃物燃燒速度"}, "answer": "A", "explain": "溫度大致維持定值的是連續火焰區；間歇火焰區以上的浮力羽流區溫度隨高度遞減，A錯。", "ref": "【111專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-061", "topic": "熱傳", "stem": "下列有關熱量傳遞的敘述，何者正確？", "opts": {"A": "無論熱傳導、熱對流或熱輻射，熱量由高處往低處傳遞過程皆需有媒介物質", "B": "若距離輻射物體2公尺時，輻射熱量為q，則距離輻射物體縮短為1公尺時，輻射熱量為4q", "C": "通風口所處位置的高低不會影響對流速度", "D": "在火災發展過程中，傳導、對流及輻射不會同時存在"}, "answer": "B", "explain": "輻射熱與距離平方成反比，距離減半熱量變4倍。輻射不需介質；通風口高低會影響對流；火災中三種熱傳常同時存在。", "ref": "【111專技士 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-062", "topic": "滅火", "stem": "連棟式木造建築物引發火災，消防隊射水同時拆除未受火勢波及房屋，請問其採取的滅火方法係下列何者？", "opts": {"A": "窒息法＋冷卻法", "B": "冷卻法＋移除法", "C": "冷卻法＋抑制反應", "D": "抑制反應＋窒息法"}, "answer": "B", "explain": "射水降溫屬冷卻法，拆除鄰房以斷絕可燃物屬移除法。", "ref": "【111專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-063", "topic": "防火與特殊現象", "stem": "建築物起火後，對於防止火焰由下層窗戶往上層延燒，下列敘述何者錯誤？", "opts": {"A": "窗戶「寬度/高度」之值愈小，火焰愈容易向上層延燒", "B": "增加窗間牆（側壁）高度", "C": "減少室內可燃物量", "D": "設置突出屋簷"}, "answer": "A", "explain": "寬度/高度比值大（寬扁窗）時噴出火焰較貼附外牆而易向上延燒；比值小（瘦高窗）火焰較會向外噴離，A說反了。", "ref": "【111專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-064", "topic": "煙與熱流", "stem": "下列何者非影響建築物中煙霧流動與蔓延的主要因素？", "opts": {"A": "煙囪效應", "B": "浮力作用", "C": "相對濕度", "D": "空氣膨脹"}, "answer": "C", "explain": "煙流動的驅動力主要為煙囪效應、浮力、熱膨脹、風及空調系統，相對濕度影響不大。", "ref": "【111專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-065", "topic": "煙與熱流", "stem": "近來消防機關大力推行安裝住宅用火災警報器，其安裝位置在天花板或牆壁上緣，主要考量因素為何？", "opts": {"A": "起火空間的火載量", "B": "天花板噴射流的溫度與速度", "C": "持續燃燒時間", "D": "輻射回饋效應"}, "answer": "B", "explain": "熱煙上升後沿天花板形成噴射流，其溫度與速度決定探測器能否及早感知，故裝在天花板或牆上緣。", "ref": "【111專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-066", "topic": "燃燒", "stem": "一公克水完全汽化成水蒸氣，溫度327°C時水蒸氣體積為V1，溫度727°C時水蒸氣體積為V2，則V2/V1值？", "opts": {"A": "1700", "B": "2.22", "C": "1.67", "D": "4555"}, "answer": "C", "explain": "定壓下體積與絕對溫度成正比：V2/V1＝1000/600≈1.67。", "ref": "【111專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-067", "topic": "危險物品", "stem": "下列關於乙炔的敘述，何者錯誤？", "opts": {"A": "乙炔氣體常由電石加水反應產生，其反應式：CaC₂＋2H₂O→C₂H₂＋Ca(OH)₂", "B": "乙炔易產生分解爆炸，加入非分解爆炸性氣體可形成阻止火焰傳播之界限，稀釋之氣體分子熱愈大效果愈小", "C": "液化之乙炔較固態乙炔危險", "D": "最小起爆能量與乙炔之壓力成反比"}, "answer": "B", "explain": "稀釋氣體的分子熱（熱容量）愈大，吸熱能力愈強，抑制分解爆炸效果愈好，B說反了。", "ref": "【111專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-068", "topic": "火災", "stem": "通風控制燃燒下，居室內有可燃物1200kg，該居室有一開口面積6m²，高度2m，則火災持續時間約幾分鐘？", "opts": {"A": "20", "B": "30", "C": "36", "D": "26"}, "answer": "D", "explain": "R＝5.5A√H＝5.5×6×√2≈46.7 kg/min，持續時間＝1200/46.7≈26 min。", "ref": "【111專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-069", "topic": "防火與特殊現象", "stem": "建築物內部裝潢材料對閃燃時間（F.O.T.）的影響，下列敘述何者錯誤？", "opts": {"A": "熱傳導度低的材料縮短F.O.T.", "B": "同材質等面積的材料，位於牆面較天花板影響大", "C": "材料厚度較薄縮短F.O.T.", "D": "採用不燃材料可延遲F.O.T."}, "answer": "B", "explain": "天花板直接受高溫煙層加熱，內裝位於天花板對閃燃時間的影響大於牆面，B說反了。", "ref": "【111專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-070", "topic": "防火與特殊現象", "stem": "下列對高樓逃生通道設計原則的描述，何者錯誤？", "opts": {"A": "逃生通道應簡單明瞭，路短比路直重要", "B": "逃生以固定設施為主，可搬式器具、裝置為輔", "C": "逃生對策應重視直覺，故以圖形或箭頭等簡單符號指示避難方向或出口較佳", "D": "建築物出口數目，視收容人數多寡而定"}, "answer": "A", "explain": "避難設計強調路徑單純易辨，原則是路直比路短重要，以免煙中迷失方向，A說反了。", "ref": "【111專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-071", "topic": "火災", "stem": "常見消防機關宣導，使用延長線勿將其綑綁，以免引發火災，究其原因為何？", "opts": {"A": "易造成過負載", "B": "使溫度升高絕緣被覆熔解，造成電線短路", "C": "易累積灰塵、水分造成積污導電", "D": "電線間接觸不良，電流流通時產生局部過熱"}, "answer": "B", "explain": "綑綁使電線散熱不良而蓄熱，絕緣被覆劣化熔解後導線相碰造成短路。", "ref": "【111專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-072", "topic": "防火與特殊現象", "stem": "下列何者非油槽火災發生沸溢或濺溢的主要因素？", "opts": {"A": "熱波", "B": "輻射熱", "C": "地震", "D": "水蒸氣"}, "answer": "C", "explain": "沸溢（boilover）由熱波下傳至底部水層、使水急速汽化將油推出；地震並非其形成機制。", "ref": "【111專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-073", "topic": "危險物品", "stem": "執行危害性化學品災害搶救指導原則（HAZMAT），下列有關區域管制（Zoning）敘述何者錯誤？", "opts": {"A": "民眾、媒體記者應管制於冷區外", "B": "事故地點周圍可能遭受污染之區域，稱為熱區", "C": "暖區一般以黃色標示，主要功用為除污", "D": "從熱區搶救出來的傷者，為爭取時效，應直接送醫"}, "answer": "D", "explain": "熱區傷者須先經暖區除污再送醫，否則會把污染帶至醫院與救護人員。", "ref": "【111專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-074", "topic": "滅火", "stem": "下列何者非細水霧滅火系統的特性？", "opts": {"A": "兼具水系統與氣體滅火系統滅火特性", "B": "屬水系統滅火設備，易造成水損", "C": "可適用於A、B、C類火災", "D": "無毒性兼顧環保"}, "answer": "B", "explain": "細水霧用水量極少，水損遠小於一般撒水系統，此為其優點，故B錯。", "ref": "【111專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-075", "topic": "滅火", "stem": "下列何者為乾粉最主要滅火原理？", "opts": {"A": "抑制", "B": "冷卻", "C": "遮斷", "D": "稀釋"}, "answer": "A", "explain": "乾粉受熱分解產生的粒子能捕捉燃燒鏈鎖反應中的自由基，主要為抑制作用，窒息、冷卻為輔。", "ref": "【111專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-076", "topic": "火災", "stem": "下列有關燃燒速度之敘述，何者錯誤？", "opts": {"A": "火災全盛期時，燃燒速度快速增加", "B": "燃燒速度指室內可燃物量因燃燒逐漸減少其重量的速度", "C": "與開口部面積有關", "D": "與開口部高度之平方根成正比"}, "answer": "A", "explain": "全盛期多為通風控制燃燒，燃燒速度由開口A√H決定而大致維持定值，並非快速增加。", "ref": "【111專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-077", "topic": "滅火", "stem": "存放乙醇倉庫發生火災，下列那一種泡沫滅火劑較適當？", "opts": {"A": "化學泡沫", "B": "界面活性劑系泡沫", "C": "高膨脹性泡沫", "D": "耐酒精型泡沫"}, "answer": "D", "explain": "乙醇等水溶性極性溶劑會破壞一般泡沫，須使用耐酒精型泡沫。", "ref": "【111專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-078", "topic": "煙與熱流", "stem": "在長10m、寬8m、高3m的居室燃燒1kg的乳膠枕頭，其Dm＝0.65m²/g，估算此場所出口標示燈能見度？", "opts": {"A": "3.20m", "B": "0.48m", "C": "1.28m", "D": "2.56m"}, "answer": "C", "explain": "D＝Dm·M/V＝0.65×1000/240≈2.71 m⁻¹，Cs＝2.303×2.71≈6.24 m⁻¹；發光型標示K≈8，V＝8/6.24≈1.28 m。", "ref": "【111專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-079", "topic": "防火與特殊現象", "stem": "撕下新購的電視機螢幕保護封膜時遭受靜電，其原因為下列何者？", "opts": {"A": "摩擦帶電", "B": "流動帶電", "C": "剝離帶電", "D": "撞擊帶電"}, "answer": "C", "explain": "密合的兩物體分離時電荷分離而帶電，撕除保護膜屬剝離帶電。", "ref": "【111專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-080", "topic": "危險物品", "stem": "沾有油類之毛屑，集中堆置於塑膠籃而產生自然發火，其原因為下列何者？", "opts": {"A": "發酵熱之蓄積", "B": "吸著熱之蓄積", "C": "分解熱之蓄積", "D": "氧化熱之蓄積"}, "answer": "D", "explain": "沾附油類（尤其乾性油）的纖維與空氣接觸面大，緩慢氧化放熱蓄積而自燃，屬氧化熱。", "ref": "【111專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-001", "topic": "煙與熱流", "stem": "建築物火災造成人命傷亡的原因，主要是煙與有毒氣體，下列何者為防煙最好的方法？", "opts": {"A": "做好防煙區劃，阻止煙的流動", "B": "選用發煙性小的建築材料，抑制煙的發生源", "C": "使用防火閘門，做好防火區劃", "D": "設置排煙效果良好之排煙室"}, "answer": "B", "explain": "從源頭減少煙的產生是最根本的防煙對策；區劃、閘門、排煙都是煙已產生後的控制手段，屬次要。", "ref": "【112專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-002", "topic": "危險物品", "stem": "下列何者屬於準自然發火性物質？", "opts": {"A": "鈉", "B": "赤磷", "C": "乙醇", "D": "過碘酸"}, "answer": "A", "explain": "準自然發火性物質指遇水或濕氣即反應發熱、甚至起火的禁水性物質，鈉為代表；赤磷為易燃固體，乙醇為易燃液體，過碘酸為氧化性物質。", "ref": "【112專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-003", "topic": "火災", "stem": "下列何者非為火災之特性？", "opts": {"A": "傳導性", "B": "不定性", "C": "偶發性", "D": "成長性"}, "answer": "A", "explain": "火災的特性一般歸納為成長性、不定性與偶發性；傳導性是熱傳方式，不是火災本身的特性。", "ref": "【112專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-004", "topic": "燃燒", "stem": "若空氣中的氧氣體積百分比為21%，則甲烷完全燃燒的化學理論濃度為多少%？", "opts": {"A": "5.2", "B": "9.4", "C": "11.0", "D": "15.4"}, "answer": "B", "explain": "CH₄ + 2O₂ → CO₂ + 2H₂O，需空氣 2/0.21 ≈ 9.52 莫耳；理論濃度 = 1/(1+9.52) ≈ 9.5%，最接近 9.4。", "ref": "【112專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-005", "topic": "燃燒", "stem": "鄰二甲苯的閃火點為157°C，若鄰二甲苯於157°C時的飽和蒸氣壓為2.0 mmHg，試求其燃燒下限為何？", "opts": {"A": "1.52%", "B": "2.0%", "C": "0.26%", "D": "0.52%"}, "answer": "C", "explain": "閃火點時的飽和蒸氣濃度即約等於燃燒下限：2.0/760 × 100% ≈ 0.26%。", "ref": "【112專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-006", "topic": "燃燒", "stem": "在標準狀態下，下列氣體中何者之爆炸範圍最廣？", "opts": {"A": "氮", "B": "甲烷", "C": "氨", "D": "氫"}, "answer": "D", "explain": "氫的爆炸範圍約 4～75%，遠大於甲烷（約 5～15%）與氨（約 15～28%）；氮不可燃，無爆炸範圍。", "ref": "【112專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-007", "topic": "爆炸", "stem": "高壓氣體之爆炸界限，通常較常壓下為廣，下列何種氣體之爆炸界限，會呈現加壓時上、下限初呈狹窄，但繼續加壓後又變廣的現象？", "opts": {"A": "H₂", "B": "CH₄", "C": "C₂H₄", "D": "CO"}, "answer": "A", "explain": "氫是典型特例：壓力由常壓升高時爆炸範圍先變窄，壓力再升高後又擴大；甲烷、乙烯多隨壓力升高而上限擴大，CO 則隨加壓而變窄。", "ref": "【112專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-008", "topic": "危險物品", "stem": "赤磷和黃磷分屬我國法定公共危險物品哪一類？", "opts": {"A": "第二類、第三類", "B": "第二類、第五類", "C": "第三類、第四類", "D": "均屬於第二類"}, "answer": "A", "explain": "赤磷為第二類易燃固體；黃磷會在空氣中自燃，屬第三類發火性液體、發火性固體及禁水性物質。", "ref": "【112專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-009", "topic": "危險物品", "stem": "下列何者屬於我國法定公共危險物品中的易燃固體？", "opts": {"A": "固態酒精", "B": "烷基鋁", "C": "黃磷", "D": "三氯矽甲烷"}, "answer": "A", "explain": "固態酒精屬第二類中的引火性固體；烷基鋁、黃磷、三氯矽甲烷均屬第三類。", "ref": "【112專技士 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-010", "topic": "危險物品", "stem": "依據NFPA（美國防火協會）危險性物品標示，有關「反應性」的敘述，下列何者正確？", "opts": {"A": "紅色代表反應性", "B": "反應性區分為1、2、3、4、5級", "C": "反應性3級：遇火也甚安定，或遇水產生爆炸者", "D": "反應性4級：常溫常壓下，便會自行爆炸或引起爆炸的物質"}, "answer": "D", "explain": "NFPA 704 中反應性以黃色表示、分 0～4 共五級；4 級為常溫常壓即可能爆炸者。紅色代表燃燒性，3 級則是需強起爆源或加熱密閉才會爆炸，非「遇火安定」。", "ref": "【112專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-011", "topic": "燃燒", "stem": "氮（N₂）雖可與氧化合，但不屬於可燃物，主要原因是下列何者？", "opts": {"A": "氧化時產生吸熱反應", "B": "閃火點太高", "C": "無法產生連鎖反應", "D": "熱傳導度過高"}, "answer": "A", "explain": "可燃物必須在氧化時放熱才能維持燃燒；氮與氧化合為吸熱反應，無法自我維持，故不視為可燃物。", "ref": "【112專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-012", "topic": "燃燒", "stem": "下列何種化合物不是可燃性物質？", "opts": {"A": "二硫化碳（CS₂）", "B": "苯（C₆H₆）", "C": "二溴二氟甲烷（CBr₂F₂）", "D": "乙烷（C₂H₆）"}, "answer": "C", "explain": "CBr₂F₂ 即海龍 1202，屬鹵化烴滅火劑，不可燃；其餘三者皆為可燃物。", "ref": "【112專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-013", "topic": "煙與熱流", "stem": "依據Alpert之天花板噴射流（Ceiling Jet Flow）經驗公式，若在 R/H ≤ 0.18 時，該熱氣流溫度與環境溫度之差（ΔT）和 R 的幾次方成正比？（R：天花板位置與中心軸間的距離，H：天花板距可燃物之距離）", "opts": {"A": "0", "B": "1/3", "C": "2/3", "D": "1"}, "answer": "A", "explain": "R/H ≤ 0.18 為火羽直上方的撞擊區，ΔT = 16.9Q^(2/3)/H^(5/3)，式中不含 R，即與 R 的 0 次方成正比。", "ref": "【112專技士 第13題】（原題 OCR 缺漏變數，依公式與答案補為 R）", "subject": "火災學", "src": "old"}, {"id": "F-X4-014", "topic": "熱傳", "stem": "依史蒂芬-波茲曼（Stefan-Boltzmann）公式之定義，輻射熱量與輻射物體絕對溫度的幾次方成正比？", "opts": {"A": "一次方", "B": "二次方", "C": "三次方", "D": "四次方"}, "answer": "D", "explain": "Stefan-Boltzmann 定律：E = εσT⁴，輻射能與絕對溫度四次方成正比。", "ref": "【112專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-015", "topic": "煙與熱流", "stem": "在煙控系統設計中，兩開口面積均為1.0 m²，相互串聯後，其等效流動面積為何？（√2 = 1.414）", "opts": {"A": "0.7 m²", "B": "1.0 m²", "C": "1.4 m²", "D": "2.0 m²"}, "answer": "A", "explain": "串聯開口：1/A² = 1/1² + 1/1² = 2，A = 1/√2 ≈ 0.707 m²；1.4 m² 是誤用並聯觀念。", "ref": "【112專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-016", "topic": "燃燒", "stem": "假設空氣中的氧占整體重量的23%，欲使1公斤的丁烷完全燃燒時，需要多少理論空氣量？", "opts": {"A": "3.6 kg", "B": "10.9 kg", "C": "15.7 kg", "D": "27.8 kg"}, "answer": "C", "explain": "C₄H₁₀ + 6.5O₂：58 g 需 O₂ 6.5×32 = 208 g；1 kg 需 O₂ ≈ 3.59 kg，空氣 = 3.59/0.23 ≈ 15.6 kg，最接近 15.7。3.6 kg 只是氧氣量。", "ref": "【112專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-017", "topic": "爆炸", "stem": "下列哪一種爆炸屬於物理性爆炸？", "opts": {"A": "玉米粉粉塵爆炸", "B": "蒸氣爆炸", "C": "環氧乙烷分解爆炸", "D": "硝化甘油爆炸"}, "answer": "B", "explain": "蒸氣爆炸是液體急速相變造成的體積膨脹，無化學反應；粉塵爆炸、分解爆炸、炸藥爆炸皆為化學性爆炸。", "ref": "【112專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-018", "topic": "危險物品", "stem": "若硝化纖維之化學式為 C₂₄H₃₂O₁₂(NO₃)₈，則其硝化度為多少%？", "opts": {"A": "8.02", "B": "11.11", "C": "13.44", "D": "15.01"}, "answer": "B", "explain": "硝化度即含氮重量百分比。分子式相當於 C₂₄H₃₂N₈O₃₆，分子量 = 288+32+112+576 = 1008，N% = 112/1008 ≈ 11.11%。", "ref": "【112專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-019", "topic": "火災", "stem": "建築物火災中，在所謂通風控制燃燒（Ventilation Controlled）情形下，可燃物燃燒速度主要受何因素決定？", "opts": {"A": "自由基數量", "B": "可燃物重量", "C": "可燃物表面積", "D": "流入空氣量"}, "answer": "D", "explain": "通風控制時燃料充足、氧氣不足，燃燒速度取決於開口流入的空氣量（約與 A√H 成正比）；可燃物表面積是燃料控制燃燒的主導因素。", "ref": "【112專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-020", "topic": "燃燒", "stem": "當物質進行完全氧化燃燒時，下列何者的理論空氣需求量最高？", "opts": {"A": "丙三醇（甘油，HOCH₂CHOHCH₂OH）", "B": "丙烯（C₃H₆）", "C": "丙烷（C₃H₈）", "D": "丙酮（CH₃COCH₃）"}, "answer": "C", "explain": "每莫耳需氧量：甘油 3.5、丙烯 4.5、丙烷 5、丙酮 4 莫耳 O₂；丙烷氫最多且不含氧，需氧最多，以單位重量計亦最高。", "ref": "【112專技士 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-021", "topic": "燃燒", "stem": "已知乙烷的完全燃燒反應如下：2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O + 3120 kJ，若其燃燒熱與燃燒下限的關係適用Burgess-Wheeler定理，其燃燒下限約為多少%？（提示：1 cal = 4.2 J）", "opts": {"A": "1.4", "B": "2.9", "C": "0.34", "D": "0.68"}, "answer": "B", "explain": "每莫耳乙烷燃燒熱 = 3120/2 = 1560 kJ ≈ 371 kcal；Burgess-Wheeler：L × Q ≈ 1050～1100，L ≈ 1100/371 ≈ 2.9%。選 1.4 是誤把 3120 kJ 當成每莫耳。", "ref": "【112專技士 第21題】（原題 OCR 熱量數值破損，依答案還原為 3120 kJ）", "subject": "火災學", "src": "old"}, {"id": "F-X4-022", "topic": "燃燒", "stem": "兩種可燃性氣體以等比例混合，其燃燒下限分別為1.5%、4.5%，則該混合氣體的燃燒下限約為多少%？", "opts": {"A": "2.25", "B": "3.00", "C": "3.55", "D": "1.5"}, "answer": "A", "explain": "Le Chatelier 定律：L = 100/(50/1.5 + 50/4.5) = 100/44.44 ≈ 2.25%；3.00 是錯用算術平均。", "ref": "【112專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-023", "topic": "燃燒", "stem": "在最小發火壓力以上，可燃性氣體的最小發火能量，會隨著下列哪一種條件改變而下降？", "opts": {"A": "降低環境壓力", "B": "提高環境氧氣濃度", "C": "降低可燃性氣體濃度", "D": "提高鈍性氣體添加濃度"}, "answer": "B", "explain": "氧濃度升高使反應更容易，最小發火能量下降；降低壓力、偏離最適濃度或加入鈍性氣體都會使最小發火能量上升。", "ref": "【112專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-024", "topic": "燃燒", "stem": "於空氣中加入氧氣會改變空氣組成，進而影響可燃性氣體的某些燃燒特性，下列何者所受的影響較為明顯？", "opts": {"A": "熱傳導係數（Thermal conductivity）", "B": "莫耳燃燒熱（kcal/mol）", "C": "可以燃燒的濃度下限", "D": "可以燃燒的濃度上限"}, "answer": "D", "explain": "燃燒上限處燃料過剩、氧氣不足，增氧會使上限大幅提高；下限處氧已過剩，幾乎不受影響，燃燒熱與熱傳導係數則是物質本身性質。", "ref": "【112專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-025", "topic": "燃燒", "stem": "對可燃性氣體而言，下列哪一種特性或條件所衍生的燃燒或爆炸危險相對較高？", "opts": {"A": "較低的環境氧氣濃度", "B": "較低的環境壓力", "C": "較低的燃燒上限", "D": "較低的燃燒下限"}, "answer": "D", "explain": "燃燒下限越低，少量洩漏就能形成可燃混合氣，危險性越高；低氧、低壓會降低危險，燃燒上限則是越高越危險。", "ref": "【112專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-026", "topic": "防火與特殊現象", "stem": "下列何種靜電災害預防措施旨在防止靜電蓄積，而與其他旨在減少靜電產生的措施有所不同？", "opts": {"A": "接地", "B": "選擇比電容率相近的材料", "C": "降低材料間的摩擦", "D": "儘量使用導電性材料"}, "answer": "A", "explain": "接地是把已產生的電荷導入大地，屬防止蓄積；選用相近材料、降低摩擦都在減少電荷產生。", "ref": "【112專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-027", "topic": "防火與特殊現象", "stem": "下列何種措施於室內發生火災時有助於防止或延緩閃燃的發生？", "opts": {"A": "使用熱傳導係數較低的裝潢材料", "B": "使用保溫效果較佳的裝潢材料", "C": "提高牆壁開口率", "D": "儘量減少室內的火載量"}, "answer": "D", "explain": "減少火載量可降低熱釋放與熱蓄積，延緩或避免閃燃；低熱傳導、保溫材料表面升溫快反而促成閃燃，開口率增加則提供更多空氣。", "ref": "【112專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-028", "topic": "防火與特殊現象", "stem": "下列哪一種前期現象比較可能因後續的消防滅火或救援作為而引發複燃？", "opts": {"A": "天花板下熱煙層的輻射回饋使可燃物快速升溫", "B": "火勢快速成長而呈現旺盛燃燒現象", "C": "天花板下熱煙層的濃度處於燃燒範圍內", "D": "火場持續處於封閉式高溫悶燒的狀態"}, "answer": "D", "explain": "封閉悶燒累積大量高溫可燃氣體但缺氧，破門或開窗導入空氣時即可能引發複燃（backdraft）；輻射回饋與煙層進入燃燒範圍則與閃燃有關。", "ref": "【112專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-029", "topic": "防火與特殊現象", "stem": "有關重油油槽發生火災時可能產生的大規模沸溢（boilover）現象，下列敘述何者錯誤？", "opts": {"A": "槽底水層因受熱升溫產生過熱氣化是關鍵機制", "B": "向下沉降的高溫熱波是導致沸溢的重要熱源", "C": "肇因於油層中的乳化水受熱沸騰", "D": "在火災過程中可能重複發生"}, "answer": "C", "explain": "Boilover 是高溫熱波下傳至槽底水層，使水過熱汽化將油品大量噴出；油層中乳化水受熱沸騰造成的是較小規模的溢流現象，而非大規模沸溢。", "ref": "【112專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-030", "topic": "滅火", "stem": "滅火藥劑的供給率關乎火災初期的滅火成敗、滅火時間與藥劑使用量，下列敘述何者錯誤？", "opts": {"A": "供給率需高於界限供給率始可滅火", "B": "供給率越大則滅火藥劑所需必要量越低", "C": "供給率越大則滅火時間越短", "D": "燃燒面積越大則界限供給率越高"}, "answer": "B", "explain": "必要藥劑量 = 供給率 × 滅火時間，存在一個最適供給率使用量最低；超過後供給率再增加，時間縮短有限而總量反而上升，故不是越大越省。", "ref": "【112專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-031", "topic": "滅火", "stem": "在長寬高為10×10×4公尺的密閉空間中以高壓式二氧化碳作為滅火防護設備。若欲將空間中的氧氣濃度降至15%以下以達到窒息效果，至少應加入多少立方公尺的二氧化碳？", "opts": {"A": "40", "B": "100", "C": "160", "D": "200"}, "answer": "C", "explain": "密閉空間體積 400 m³，氧量固定：21% × 400 = 15% × (400 + X)，X = 400 × (21/15 − 1) = 160 m³。", "ref": "【112專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-032", "topic": "燃燒", "stem": "將大塊的木頭切碎為小片的木屑時，下列敘述何者錯誤？", "opts": {"A": "與空氣接觸的比表面積變大", "B": "木柴的熱傳導係數變小", "C": "受熱時升溫速率變快", "D": "受熱時起燃時間縮短"}, "answer": "B", "explain": "熱傳導係數是材料本身的物性，不因切碎而改變；切碎後比表面積增加、熱容量小，升溫快、起燃時間縮短。", "ref": "【112專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-033", "topic": "煙與熱流", "stem": "當防火門兩側的壓力差加倍時，其透過門縫所流出的氣體體積流量有何變化？", "opts": {"A": "大約倍增", "B": "大約減半", "C": "大約增為4倍", "D": "大約增為1.4倍"}, "answer": "D", "explain": "孔口流量 Q = CA√(2ΔP/ρ)，與壓差平方根成正比；壓差加倍，流量變為 √2 ≈ 1.4 倍。", "ref": "【112專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-034", "topic": "爆炸", "stem": "對於具有分解爆炸性質的可燃性氣體，下列敘述何者錯誤？", "opts": {"A": "分解爆炸大多發生於高壓狀態下", "B": "在界限壓力之上，分解爆炸下限隨壓力升高而下降", "C": "分解爆炸界限與其燃燒界限一致", "D": "分解爆炸可能因聚合升溫而觸發，未必需由氧氣啟動"}, "answer": "C", "explain": "分解爆炸不需氧氣，其界限由壓力與分解熱決定，與和空氣混合的燃燒界限是不同概念，兩者並不一致。", "ref": "【112專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-035", "topic": "爆炸", "stem": "相較於氣體爆炸，一般的粉塵爆炸具有下列哪種性質？", "opts": {"A": "起火能量較低", "B": "起火溫度較低", "C": "爆炸壓力上升速率較低", "D": "破壞力較低"}, "answer": "C", "explain": "粉塵爆炸的起火能量與起火溫度較氣體高，壓力上升速率較慢；但燃燒持續時間長、總能量大，破壞力反而較大。", "ref": "【112專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-036", "topic": "爆炸", "stem": "下列哪一種措施有助於提高粉塵爆炸的防護作用以增加其安全性？", "opts": {"A": "提高粉塵濃度", "B": "提高環境溫度", "C": "提高環境濕度", "D": "提高環境壓力"}, "answer": "C", "explain": "提高濕度可使粉塵吸濕凝聚、不易飛揚，並減少靜電蓄積，降低粉塵爆炸機率；升溫與加壓都會提高危險。", "ref": "【112專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-037", "topic": "爆炸", "stem": "升高環境溫度對於環氧乙烷的分解爆炸有何影響？", "opts": {"A": "提高分解爆炸的起爆能量", "B": "擴大可發生分解爆炸的濃度範圍", "C": "提高可發生分解爆炸的濃度上限", "D": "提高可發生分解爆炸的濃度下限"}, "answer": "B", "explain": "溫度升高使分子內能增加，分解反應更易傳播，可分解爆炸的範圍擴大、所需起爆能量降低。", "ref": "【112專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-038", "topic": "煙與熱流", "stem": "當外部風的風向不變而風速加倍時，對處於煙囪效應下的大樓而言，下列敘述何者正確？", "opts": {"A": "迎風面定點所受的風壓加倍", "B": "迎風面的中性帶下降", "C": "背風面的排煙速率提升", "D": "大樓從煙囪效應轉為逆煙囪效應"}, "answer": "C", "explain": "風壓與風速平方成正比，風速加倍風壓約增為4倍而非加倍；背風面負壓增強，由該側開口排出的煙量因而增加。迎風面正壓增大使中性帶上升，風也不會改變室內外溫差造成的煙囪效應方向。", "ref": "【112專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-039", "topic": "燃燒", "stem": "假設定量乙醇（C₂H₅OH）與理論空氣量混合後產生完全燃燒，若將燃燒廢氣冷卻至常溫，則其中二氧化碳的濃度約為多少%？", "opts": {"A": "12.3", "B": "14.0", "C": "15.1", "D": "16.2"}, "answer": "C", "explain": "C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O，伴隨 N₂ = 3×79/21 ≈ 11.29 莫耳；冷卻後水凝結，CO₂ = 2/(2+11.29) ≈ 15.1%。", "ref": "【112專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-040", "topic": "煙與熱流", "stem": "已知距離光源2公尺處的減光率為20%，則當與光源的距離加倍時，其減光率約為多少%？（提示：log 80 ≈ 1.903，log 64 ≈ 1.806）", "opts": {"A": "44", "B": "40", "C": "36", "D": "32"}, "answer": "C", "explain": "依 Lambert-Beer 定律，2 m 透光率 80%，4 m 透光率 = 0.8² = 64%，減光率 = 1 − 0.64 = 36%；40% 是誤把減光率直接加倍。", "ref": "【112專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-041", "topic": "火災", "stem": "有關風與飛火之敘述，下列何者錯誤？", "opts": {"A": "飛火之發生，除風速外，並視火場建築物之高度而定", "B": "飛火星之種類約有粉狀火星、棒狀火星、葉狀火星及板狀火星", "C": "自風速5 m/sec開始，風速越大，火場燃燒愈猛烈，其發生飛火之可能性也愈大", "D": "風速若超過16 m/sec以上時，飛火距離反而減少"}, "answer": "A", "explain": "依書上答案，飛火發生除風速外應是視火場燃燒規模與火勢而定，並非取決於建築物高度（此點教材說法不一，列為低信心）；火星種類、風速5 m/s起飛火漸增、風速過大反使飛火距離縮短，均與教材相符。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-042", "topic": "熱傳", "stem": "在常壓大氣條件下及溫度100°C時，下列何者之熱傳導度最高？", "opts": {"A": "氫", "B": "空氣", "C": "二氧化碳", "D": "水蒸氣"}, "answer": "A", "explain": "書上答案為 D，但查物性表，100°C 時氫的熱傳導度約 0.2 W/m·K，遠高於空氣（約 0.03）、水蒸氣（約 0.025）與二氧化碳（約 0.022）；氫分子量最小、分子運動最快，是熱傳導度最高的氣體。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-043", "topic": "熱傳", "stem": "下列何者為依據牛頓之熱對流公式計算固體表面與流體間之熱量傳遞，所使用之對流換熱係數單位？", "opts": {"A": "W²/m·K", "B": "W/m²·K", "C": "W/m^(1/2)·K", "D": "W^(1/2)/m·K"}, "answer": "B", "explain": "牛頓冷卻定律 q = hAΔT，h = q/(AΔT)，單位為 W/(m²·K)；W/(m·K) 形式則是熱傳導係數。", "ref": "【112消佐 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-044", "topic": "燃燒", "stem": "在假定壓力、溫度等外部條件一定的狀況下，下列何者在空氣中之燃燒界限範圍最大？", "opts": {"A": "CO", "B": "(C₂H₅)₂O", "C": "H₂", "D": "CS₂"}, "answer": "C", "explain": "燃燒範圍寬度：H₂ 約 4～75%（71）、CO 約 12.5～74%（61.5）、CS₂ 約 1.3～50%、乙醚約 1.9～36%；以寬度論氫最大。", "ref": "【112消佐 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-045", "topic": "爆炸", "stem": "在常溫常壓下，氣體之爆轟速度（m/sec），下列何者最高？", "opts": {"A": "C₃H₈ + 3O₂", "B": "CH₄ + 2O₂", "C": "C₂H₆ + 3.5O₂", "D": "C₂H₄ + 3O₂"}, "answer": "A", "explain": "依教材爆轟速度表，C₃H₈ + 3O₂（富燃料組成）約 2600 m/s 為四者最高；CH₄ + 2O₂ 約 2150 m/s 最低，乙烷、乙烯與氧的混合氣介於其間。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第5題】（B 選項 OCR 為 CH₂，依化學計量還原為 CH₄）", "subject": "火災學", "src": "old"}, {"id": "F-X4-046", "topic": "煙與熱流", "stem": "當風速（V）為10 m/s，風壓係數（Cw）為0.6，環境大氣密度（ρ₀）為1.2 kg/m³時，建築物迎風面所產生之風壓（Pw）約為多少Pa？", "opts": {"A": "12", "B": "24", "C": "36", "D": "48"}, "answer": "C", "explain": "Pw = Cw × ½ρ₀V² = 0.6 × 0.5 × 1.2 × 10² = 36 Pa。", "ref": "【112消佐 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-047", "topic": "火災", "stem": "電線燃燒過程中，其著火階段最小熔斷電流值之電流密度為多少A/mm²以上？", "opts": {"A": "40", "B": "45", "C": "75", "D": "120"}, "answer": "B", "explain": "電線過電流依電流密度分為赤熱、著火、熔斷等階段；教材所列著火階段之下限約為 45 A/mm²，120 A/mm² 以上則屬瞬間熔斷。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-048", "topic": "滅火", "stem": "下列何者之鹵化烴的海龍（Halon）代碼為1301？", "opts": {"A": "CH₂BrCl", "B": "CH₃Br", "C": "CF₃Br", "D": "CH₃I"}, "answer": "C", "explain": "海龍代碼依序為 C、F、Cl、Br 原子數：1301 = 1 個 C、3 個 F、0 個 Cl、1 個 Br，即 CF₃Br。", "ref": "【112消佐 第8題】（A 選項 OCR 破損，依原意還原為 CH₂BrCl）", "subject": "火災學", "src": "old"}, {"id": "F-X4-049", "topic": "滅火", "stem": "下列海龍替代藥劑何者儲存狀態為液體？", "opts": {"A": "FM-200", "B": "NN-100", "C": "INERGEN", "D": "Argotec"}, "answer": "A", "explain": "FM-200（HFC-227ea）屬鹵化烴類，加壓液化儲存；NN-100（氮氣）、INERGEN、Argotec 屬惰性氣體，以高壓氣體儲存。", "ref": "【112消佐 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-050", "topic": "燃燒", "stem": "一般廚房用瓦斯器具的火焰溫度會隨著燃料種類和空氣供應情形而有所變化，但若不預混空氣，僅賴火焰周圍之空氣燃燒瓦斯，其火焰溫度最高只能達到攝氏幾度？", "opts": {"A": "700", "B": "800", "C": "900", "D": "1,000"}, "answer": "C", "explain": "未預混的擴散火焰靠周圍空氣擴散供氧，燃燒不完全，最高約 900°C；預混空氣的本生燈火焰可達更高溫。", "ref": "【112消佐 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-051", "topic": "火災", "stem": "電熨斗放在衣服上太久導致起火燃燒是屬於下列何者？", "opts": {"A": "電氣火災", "B": "斷熱壓縮", "C": "有焰火源", "D": "高溫固體"}, "answer": "D", "explain": "起火源是電熨斗高溫的金屬底板直接加熱衣物，依起火源分類屬高溫固體；雖然熨斗是電器，但並非電氣故障（短路、漏電）引起。", "ref": "【112消佐 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-052", "topic": "熱傳", "stem": "在常溫下，下述何者的熱傳導係數最大？", "opts": {"A": "混凝土", "B": "石膏", "C": "石棉", "D": "空氣"}, "answer": "A", "explain": "常溫熱傳導係數約：混凝土 1.0～1.5、石膏 0.2～0.4、石棉約 0.1～0.2、空氣約 0.026 W/m·K，混凝土最大。", "ref": "【112消佐 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-053", "topic": "危險物品", "stem": "聯氨的化學式為下列何者？", "opts": {"A": "C₂H₄O", "B": "N₂H₄", "C": "C₂H₄", "D": "C₂H₂"}, "answer": "B", "explain": "聯氨（hydrazine）為 N₂H₄；C₂H₄O 為環氧乙烷或乙醛，C₂H₄ 為乙烯，C₂H₂ 為乙炔。", "ref": "【112消佐 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-055", "topic": "燃燒", "stem": "一般可燃物燃燒時所需最低氧氣濃度為下列何者？", "opts": {"A": "18%", "B": "15%", "C": "12%", "D": "9%"}, "answer": "B", "explain": "一般可燃物在氧濃度降至約 15% 以下即難以維持燃燒，這也是窒息滅火的基準；18% 是人員缺氧的警戒值。", "ref": "【112消佐 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-056", "topic": "爆炸", "stem": "中度爆炸性粉塵在相同氣孔比（f²/100 ft³）之容器條件下，下列何者之爆炸壓力最大？", "opts": {"A": "粗粉鎂", "B": "酚樹脂", "C": "粉碎鋁", "D": "大豆粉"}, "answer": "C", "explain": "金屬粉塵燃燒熱高，爆炸壓力通常大於有機粉塵；依教材之粉塵爆炸試驗表，粉碎鋁的爆炸壓力為四者最高。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第16題】（原題氣孔比單位 OCR 破損）", "subject": "火災學", "src": "old"}, {"id": "F-X4-057", "topic": "火災", "stem": "普通木造建築物當等溫度線之區分與等級為曲線3級，其等溫曲線之值（延燒係數）為下列何者？", "opts": {"A": "0.04", "B": "0.15", "C": "0.82", "D": "∞"}, "answer": "B", "explain": "依教材木造建築延燒等溫曲線表，曲線3級對應之延燒係數為 0.15；係數越小代表延燒危險距離越近。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-059", "topic": "燃燒", "stem": "何謂 Critical Heat Flux？", "opts": {"A": "冷卻材料所需之最小熱通量", "B": "抑制材料所需之最大熱通量", "C": "加熱材料所需之最大熱通量", "D": "點燃材料所需之最小熱通量"}, "answer": "D", "explain": "臨界熱通量（CHF）是材料在長時間受熱下能被引燃的最低入射熱通量，低於此值無論加熱多久都不會起火。", "ref": "【112消佐 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-060", "topic": "煙與熱流", "stem": "厚度為1.8 m之煙層，測得有60%之光穿過，試估算其消光係數？", "opts": {"A": "0.111 m⁻¹", "B": "0.123 m⁻¹", "C": "0.225 m⁻¹", "D": "0.284 m⁻¹"}, "answer": "D", "explain": "Lambert-Beer：I/I₀ = e^(−KL)，K = −ln(0.6)/1.8 = 0.511/1.8 ≈ 0.284 m⁻¹；0.123 是誤用常用對數 log 計算。", "ref": "【112消佐 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-001", "topic": "熱傳", "stem": "熱傳導係數是材料導熱能力重要的影響因素之一，有關熱傳導係數，下列敘述何者正確？", "opts": {"A": "固體物質比液體具有較高熱傳導係數", "B": "氣體比液體具有較高熱傳導係數", "C": "熱傳導係數愈大，物質傳熱速度愈慢", "D": "金屬材料熱傳導係數比非金屬材料熱傳導係數小"}, "answer": "A", "explain": "一般而言熱傳導係數為固體＞液體＞氣體。係數愈大傳熱愈快，且金屬的導熱係數遠大於非金屬，故B、C、D皆錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-002", "topic": "滅火", "stem": "海龍滅火藥劑主要的滅火原理，係控制下列何種燃燒要素？", "opts": {"A": "可燃物", "B": "氧氣", "C": "連鎖反應", "D": "熱能"}, "answer": "C", "explain": "海龍（鹵化烷）受熱分解出鹵素自由基，捕捉燃燒中的H·、OH·自由基，屬抑制（負催化）作用，中斷連鎖反應。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-003", "topic": "煙與熱流", "stem": "燃燒產生的高溫氣體向上浮起，為下列何種力造成的？", "opts": {"A": "重力", "B": "庫倫力", "C": "表面張力", "D": "強作用力"}, "answer": "A", "explain": "高溫氣體密度較周圍空氣小，在重力場中產生浮力而上升；浮力本質上源自重力造成的密度差與壓力差。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-004", "topic": "煙與熱流", "stem": "建築物發生火災時，煙的流動方向，主要受到下列何種因素的影響？", "opts": {"A": "濃度", "B": "亮度", "C": "可視度", "D": "壓力"}, "answer": "D", "explain": "煙由高壓處流向低壓處，煙囪效應、浮力、熱膨脹、外部風與空調都是透過造成壓力差來驅動煙的流動。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-005", "topic": "防火與特殊現象", "stem": "有關高樓防火避難安全設計原則，下列敘述何者錯誤？", "opts": {"A": "內部裝潢儘量不燃化", "B": "足夠的結構耐火性能", "C": "適當的防火區劃", "D": "「單一方向避難原則」的逃生設計"}, "answer": "D", "explain": "高樓避難設計應採「雙向避難」原則，確保一條路線受阻時仍有另一條可用；單一方向避難是錯誤的設計。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-006", "topic": "爆炸", "stem": "有關粉塵爆炸，下列敘述何者正確？", "opts": {"A": "粉塵爆炸係發生於粒子內部之燃燒反應", "B": "浮游粉塵含水分超過一定程度時，爆炸威力會降低", "C": "粉塵爆炸可如氣體般均勻濃度分布", "D": "浮游粉塵，粒徑愈小，發火溫度愈高"}, "answer": "B", "explain": "水分會吸熱並使粒子凝聚，降低爆炸威力。粉塵燃燒是粒子表面反應、濃度分布不均勻，且粒徑愈小發火溫度愈低，故A、C、D錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-007", "topic": "危險物品", "stem": "有關硫化氫（H₂S）之性質，下列敘述何者錯誤？", "opts": {"A": "具毒性", "B": "具可燃性", "C": "密度同甲烷，易自然散失", "D": "易產生靜電火花引火"}, "answer": "C", "explain": "硫化氫蒸氣比重約1.19，比空氣重，易滯留低窪處；甲烷比重約0.55較輕易散失，兩者不同，故C錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-008", "topic": "熱傳", "stem": "下列何種材料之熱傳導係數最低？", "opts": {"A": "銅", "B": "岩棉", "C": "混凝土", "D": "低碳鋼"}, "answer": "B", "explain": "岩棉為多孔隔熱材，內含大量靜止空氣，熱傳導係數遠低於混凝土，更低於銅與鋼等金屬。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-009", "topic": "熱傳", "stem": "有關固體表面與流體間之熱量傳遞，可依牛頓熱對流公式估算，其中自然對流的熱對流係數（W/(m²·K)）範圍為：", "opts": {"A": "10～500", "B": "100～1,000", "C": "5～25", "D": "0.1～1"}, "answer": "C", "explain": "氣體自然對流的熱對流係數約在5～25 W/(m²·K)；強制對流才會達數十至數百。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-010", "topic": "熱傳", "stem": "高溫物體與低溫物體之間，無媒介物質，熱直接傳至對方之現象稱為：", "opts": {"A": "熱輻射", "B": "熱對流", "C": "熱傳導", "D": "熱反應"}, "answer": "A", "explain": "熱輻射以電磁波傳遞能量，不需介質，真空中亦可進行；傳導與對流都需要介質。", "ref": "【110警察四等 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-011", "topic": "熱傳", "stem": "物體溫度為227°C，輻射率為0.1，其輻射強度約為：", "opts": {"A": "0.015 kW/m²", "B": "15 kW/m²", "C": "0.354 kW/m²", "D": "354 kW/m²"}, "answer": "C", "explain": "E＝εσT⁴＝0.1×5.67×10⁻⁸×(500)⁴≈354 W/m²＝0.354 kW/m²；注意溫度需換成絕對溫度500 K。", "ref": "【110警察四等 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-012", "topic": "燃燒", "stem": "某烷類氣體燃燒時與理論氧氣量的體積比為1：2，該氣體的燃燒下限約為多少？", "opts": {"A": "18.3%", "B": "9.5%", "C": "5.2%", "D": "0.052%"}, "answer": "C", "explain": "需氧2倍為甲烷。化學理論濃度Cst＝1/(1+2/0.21)≈9.5%，燃燒下限約0.55×Cst≈5.2%。9.5%是理論濃度而非下限。", "ref": "【110警察四等 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-013", "topic": "燃燒", "stem": "有關有焰燃燒，下列敘述何者正確？", "opts": {"A": "分解燃燒與蒸發燃燒不屬於有焰燃燒", "B": "火焰係發生於氣相燃燒區", "C": "僅發生於可燃性氣體", "D": "僅發生於可燃性液體"}, "answer": "B", "explain": "火焰是可燃氣體與氧在氣相中反應發光的區域；固體分解燃燒、液體蒸發燃燒都會產生可燃氣體而形成有焰燃燒。", "ref": "【110警察四等 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-014", "topic": "燃燒", "stem": "有關混合燃燒與擴散燃燒的一般特性，下列敘述何者正確？", "opts": {"A": "混合燃燒的燃燒速度比擴散燃燒慢", "B": "室內火災引燃天花板煙氣所致之閃燃現象，可視為混合燃燒型", "C": "蠟燭燃燒為混合燃燒", "D": "瓦斯漏氣燃燒後引起爆炸為擴散燃燒"}, "answer": "B", "explain": "閃燃時天花板下已與空氣預混的可燃氣體瞬間著火，屬混合（預混）燃燒。混合燃燒比擴散燃燒快；蠟燭是擴散燃燒，瓦斯漏氣後爆炸是預混燃燒。", "ref": "【110警察四等 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-015", "topic": "燃燒", "stem": "下列哪一個易燃性氣體之燃燒範圍，其危險性相對較高？", "opts": {"A": "10%～60%", "B": "6.0%～75%", "C": "16%～50%", "D": "8%～70%"}, "answer": "B", "explain": "燃燒範圍愈寬、下限愈低，危險性愈高。B範圍寬達69%且下限最低，危險度最高。", "ref": "【110警察四等 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-016", "topic": "燃燒", "stem": "下列何種物質的特性，有較高的可燃性傾向？", "opts": {"A": "較高的熱傳導係數（thermal conductivity）", "B": "較低的比熱（specific heat capacity）", "C": "較高的密度（density）", "D": "較高的熱慣性（thermal inertia）"}, "answer": "B", "explain": "比熱低則吸少量熱即升溫，易達著火溫度。熱傳導係數高、密度高、熱慣性（kρc）高都會使表面升溫變慢而較難點燃。", "ref": "【110警察四等 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-017", "topic": "防火與特殊現象", "stem": "室內發生閃燃（Flashover）或複燃（Backdraft）時，下列敘述何者正確？", "opts": {"A": "閃燃觸發主因是氧氣", "B": "複燃引發的關鍵機制是輻射熱", "C": "閃燃一般發生於火災衰退期", "D": "複燃發生前一般處於悶燒狀態"}, "answer": "D", "explain": "複燃發生於缺氧悶燒、累積可燃氣體後突然導入空氣時。閃燃主因是熱（輻射回饋），發生於成長期末；複燃關鍵是氧氣供給。", "ref": "【110警察四等 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-018", "topic": "防火與特殊現象", "stem": "可燃性物質置於室內燃燒時，可發生閃燃，置於室外燃燒時則否；造成此種差異現象，與下列何者關聯性較高？", "opts": {"A": "兩者火勢大小之差異", "B": "兩者燃燒速率高低之差異", "C": "兩者火焰是否產生熱輻射", "D": "兩者是否產生輻射能回饋效應"}, "answer": "D", "explain": "室內有天花板與牆面，高溫煙層及壁面會把輻射熱回饋給可燃物，使其全面熱分解而閃燃；室外熱量散失，無此回饋。", "ref": "【110警察四等 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-019", "topic": "防火與特殊現象", "stem": "當非導體之帶電物體接近接地體時，除帶電物體與接地體之間發生放電外，幾乎同一時間，沿著非導體表面發生如樹枝狀發光之放電，此現象稱為：", "opts": {"A": "火花放電", "B": "條狀放電", "C": "電暈放電", "D": "沿面放電"}, "answer": "D", "explain": "沿著絕緣體表面呈樹枝狀擴展的放電稱沿面放電，能量較大、引火危險高；火花放電發生於兩導體間，電暈放電發生於尖端附近。", "ref": "【110警察四等 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-020", "topic": "防火與特殊現象", "stem": "不易累積靜電之導體，係指體積電阻係數（Ω·cm）為多少以下之物質？", "opts": {"A": "10¹⁵", "B": "10¹³", "C": "10¹¹", "D": "10⁹"}, "answer": "D", "explain": "體積電阻率愈低愈容易讓電荷洩漏；一般以10⁹ Ω·cm以下視為不易蓄積靜電的導電性物質，電阻率愈高愈易蓄電。", "ref": "【110警察四等 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-021", "topic": "燃燒", "stem": "影響自然發火之因素，下列敘述何者正確？", "opts": {"A": "熱傳導度愈大，愈容易傳導熱，愈易起火", "B": "氣體熱傳導度大於液體及固體，故愈易引起燃燒", "C": "同一物質，粉狀蓄熱條件較整塊為佳，故較易起火", "D": "物質含大量水分時，熱傳導度小，故易蓄熱起火"}, "answer": "C", "explain": "粉狀堆積內部形成斷熱狀態，熱不易散失而蓄積。熱傳導度大反而易散熱；氣體熱傳導度最小；含水多則熱傳導度大、不易蓄熱。", "ref": "【110警察四等 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-022", "topic": "危險物品", "stem": "有關乙炔及其容器之危險性，下列敘述何者錯誤？", "opts": {"A": "乙炔之分解爆炸，壓力越高，最小點火能量越小", "B": "高壓情況下，乙炔易生聚合反應，升溫發熱，促使分解爆炸", "C": "當乙炔噴出時，丙酮粒子亦一併噴出而發生靜電，其電荷可達10,000 V以上", "D": "界限壓力隨容器管徑增加而上升"}, "answer": "D", "explain": "乙炔分解爆炸的界限壓力隨管徑增大而降低（管徑大散熱少、較易傳播），故D錯。", "ref": "【110警察四等 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-023", "topic": "爆炸", "stem": "有關家用天然氣事故之處置方式，下列敘述何者錯誤？", "opts": {"A": "關閉天然氣開關", "B": "熄滅附近火源", "C": "迅速打開門窗，使室內空氣流通", "D": "立即關閉電氣開關並拔除電源"}, "answer": "D", "explain": "操作電氣開關或拔插頭可能產生電氣火花而引爆瓦斯，漏氣時不可碰觸任何電器開關。", "ref": "【110警察四等 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-024", "topic": "爆炸", "stem": "下列無外力加工之事故現象，何者非屬蒸氣爆炸？", "opts": {"A": "鍋爐破裂", "B": "原油槽之沸溢（Boilover）", "C": "熔鹽槽爆炸", "D": "天然氣管線外洩爆炸"}, "answer": "D", "explain": "蒸氣爆炸是液體急速相變為蒸氣的物理爆炸；天然氣外洩爆炸是可燃氣體與空氣混合後的化學（燃燒）爆炸。", "ref": "【110警察四等 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-025", "topic": "爆炸", "stem": "爆炸對於消防救災產生潛在之危害，下列敘述何者正確？", "opts": {"A": "依能量大小分為爆燃及爆轟", "B": "火焰面和衝擊波發展成同一波，稱為爆轟", "C": "氣體燃燒形成之爆炸主要是指擴散燃燒", "D": "爆燃對於人體及周遭物體造成之影響大於爆轟"}, "answer": "B", "explain": "爆轟時火焰面與衝擊波耦合、以超音速傳播。爆燃與爆轟是依傳播速度區分；氣體爆炸屬預混燃燒；爆轟破壞力大於爆燃。", "ref": "【110警察四等 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-026", "topic": "燃燒", "stem": "可燃性氣體在同一狀態下，下列熱源何者可造成最低之發火溫度？", "opts": {"A": "全面加熱", "B": "高溫固體", "C": "加熱電阻線", "D": "高溫氣體"}, "answer": "A", "explain": "全面加熱時整體混合氣均勻受熱、熱損失最少，所測得的發火溫度最低；局部熱源因熱散失需較高溫度才能引燃。", "ref": "【111警察四等 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-027", "topic": "燃燒", "stem": "從管線洩漏之可燃性氣體，立即與周圍空氣混合而燃燒之現象為：", "opts": {"A": "擴散燃燒", "B": "混合燃燒", "C": "蒸發燃燒", "D": "分解燃燒"}, "answer": "A", "explain": "可燃氣體從管口噴出，邊擴散邊與空氣混合邊燃燒，屬擴散燃燒；混合燃燒是事先與空氣預混後才點燃。", "ref": "【111警察四等 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-028", "topic": "熱傳", "stem": "地板上鋪設兩片材質不同但厚度、面積、密度、比熱以及點燃溫度均相同的厚木板，火災時同時接受高溫煙層的輻射熱而先後點燃，假設兩片木板完全吸收輻射熱，而且地板與木板接觸面無熱損失，則先被點燃的木板：", "opts": {"A": "熱傳導率較大", "B": "熱傳導率較小", "C": "含碳量較大", "D": "含碳量較小"}, "answer": "B", "explain": "熱傳導率小則熱不易往內部傳，熱量集中在表面，表面升溫快而先達點燃溫度（熱慣性kρc較小）。", "ref": "【111警察四等 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-029", "topic": "煙與熱流", "stem": "有一居室內設有小型會議室，該居室與內部小型會議室皆為單一開口，分別為2平方公尺及4平方公尺的開口，二者開口前後串聯，等效流動面積為多少平方公尺？", "opts": {"A": "0.93", "B": "1.79", "C": "2.38", "D": "3.15"}, "answer": "B", "explain": "串聯開口：1/A²＝1/2²＋1/4²＝5/16，A＝4/√5≈1.79 m²。", "ref": "【111警察四等 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-030", "topic": "煙與熱流", "stem": "因為大樓設有空調而使其溫度較外界為低，此時建築物垂直通道會形成一股往下之氣流，此現象為：", "opts": {"A": "自然對流", "B": "強制對流", "C": "正煙囪效應", "D": "逆煙囪效應"}, "answer": "D", "explain": "室內溫度低於室外時，垂直通道內空氣較重而向下流動，稱逆煙囪效應；正煙囪效應是室內較熱而向上流。", "ref": "【111警察四等 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-031", "topic": "防火與特殊現象", "stem": "對於不同形態物質之靜電條件，下列敘述何者錯誤？", "opts": {"A": "滾輪與皮帶、粉體與其輸送之導管等為固體摩擦帶電之情形", "B": "液體與管路或過濾裝置等固體表面流動摩擦為液體摩擦帶電之情形", "C": "氣體含有管路金屬氧化物等不純物，與管壁流動摩擦為氣體摩擦帶電之情形", "D": "氣體導管為絕緣者，不易蓄積電荷"}, "answer": "D", "explain": "導管若為絕緣體，電荷無法經由接地洩漏，反而容易蓄積，故D錯。", "ref": "【111警察四等 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-032", "topic": "爆炸", "stem": "下列何者不是影響粉塵爆炸的因素？", "opts": {"A": "化學組成", "B": "粒徑大小", "C": "最大發火能量", "D": "爆炸界限"}, "answer": "C", "explain": "影響粉塵爆炸的是化學組成、粒徑、濃度（爆炸界限）與「最小」發火能量等；「最大發火能量」並非影響因素。", "ref": "【111警察四等 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-033", "topic": "危險物品", "stem": "環氧乙烷是容易產生分解爆炸的物質，下列何者不屬分解反應的主要產物？", "opts": {"A": "甲烷", "B": "乙烯", "C": "乙烷", "D": "氫氣"}, "answer": "C", "explain": "環氧乙烷分解主要生成一氧化碳、甲烷，並有少量乙烯、氫氣等；乙烷不是其主要分解產物。", "ref": "【111警察四等 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-034", "topic": "燃燒", "stem": "下列何種因素，為粉狀固體較塊狀固體容易燃燒的原因？", "opts": {"A": "粉狀固體之空氣供給較不足", "B": "粉狀固體之燃燒熱增大", "C": "粉狀固體之熱傳導較低", "D": "塊狀固體因局部氧化所產生的熱容易蓄積"}, "answer": "C", "explain": "粉狀固體顆粒間充滿空氣，整體熱傳導低、熱易蓄積於局部，且與空氣接觸面積大；燃燒熱不因形狀改變。", "ref": "【111警察四等 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-035", "topic": "熱傳", "stem": "隔牆厚度為0.2 m、面積10 m²，牆體兩邊溫度分別為20°C及520°C，熱傳導係數為1.0 W/(m·K)，通過此隔牆的熱通量為多少？", "opts": {"A": "0.1 kW/m²", "B": "0.625 kW/m²", "C": "1.25 kW/m²", "D": "2.5 kW/m²"}, "answer": "D", "explain": "熱通量q＝kΔT/L＝1.0×500/0.2＝2500 W/m²＝2.5 kW/m²；熱通量是單位面積的量，不需乘面積。", "ref": "【111警察四等 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-036", "topic": "危險物品", "stem": "下列何者為第二石油類之物質？", "opts": {"A": "汽油", "B": "煤油", "C": "鍋爐油", "D": "活塞油"}, "answer": "B", "explain": "第二石油類指閃火點21°C以上、未滿70°C者，如煤油、柴油；汽油屬第一石油類，鍋爐油（重油）屬第三石油類，活塞油屬第四石油類。", "ref": "【111警察四等 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-037", "topic": "熱傳", "stem": "關於熱對流之敘述，下列何者錯誤？", "opts": {"A": "通風口的面積越大，熱對流之速度越快", "B": "使用鼓風機協助氣體流動屬於自然對流", "C": "火場溫度越高，熱對流之速度越快", "D": "建築物火災中之煙囪效應為熱對流所引起"}, "answer": "B", "explain": "以鼓風機、風扇等外力驅動流體屬強制對流；自然對流是由溫差造成的密度差（浮力）驅動。", "ref": "【111警察四等 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-038", "topic": "熱傳", "stem": "下列何種顏色之物體，具有最好之輻射熱吸收能力？", "opts": {"A": "金色", "B": "銀色", "C": "黑色", "D": "白色"}, "answer": "C", "explain": "黑色物體吸收率（及放射率）接近1，吸收輻射熱能力最好；金、銀、白色表面反射率高。", "ref": "【111警察四等 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-039", "topic": "滅火", "stem": "惰性氣體滅火藥劑及鹵化物滅火藥劑，各自滅火原理分別是針對燃燒四要素中哪一種？", "opts": {"A": "惰性氣體主要抑制連鎖反應、鹵化物主要降低助燃物濃度", "B": "惰性氣體主要降低助燃物濃度、鹵化物主要降低可燃物發熱量", "C": "惰性氣體主要降低助燃物濃度、鹵化物主要抑制連鎖反應", "D": "惰性氣體主要抑制連鎖反應、鹵化物主要降低起火源溫度"}, "answer": "C", "explain": "惰性氣體（如IG541）稀釋氧濃度屬窒息作用；鹵化物分解出鹵素自由基捕捉燃燒自由基，屬抑制連鎖反應。", "ref": "【111警察四等 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-040", "topic": "燃燒", "stem": "氫氣、甲烷、丁烷的最小發火壓力分別為甲、乙、丙（mmHg），下列何者正確？", "opts": {"A": "甲＞乙＞丙", "B": "乙＞丙＞甲", "C": "丙＞甲＞乙", "D": "丙＞乙＞甲"}, "answer": "D", "explain": "氫氣最小發火能量極低，在很低壓力下仍可發火，最小發火壓力最低；依書上答案，碳數愈多者所需壓力愈高，故丙＞乙＞甲。此排序（尤其甲烷與丁烷之間）可查的數據有限，存疑。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【111警察四等 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-041", "topic": "燃燒", "stem": "電氣火花使混合氣體發火，需有足夠能量，此稱為「最小發火能量」，其單位為何？", "opts": {"A": "帕斯卡（Pa）", "B": "焦耳（J）", "C": "溫度（°C）", "D": "瓦特（W）"}, "answer": "B", "explain": "最小發火能量是能量，單位為焦耳（常用mJ）；Pa是壓力、W是功率。", "ref": "【111警察四等 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-042", "topic": "防火與特殊現象", "stem": "建築物發生火災時，天花板向地面放射出大量輻射熱，致使地面可燃物燃燒，此種加速火災燃燒現象稱為：", "opts": {"A": "輻射能損失效果", "B": "輻射能回饋效果", "C": "對流能損失效果", "D": "對流能回饋效果"}, "answer": "B", "explain": "高溫煙層與天花板將輻射熱回送至地面可燃物，加速熱分解與燃燒，稱輻射能回饋效果，是閃燃的主因。", "ref": "【111警察四等 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-043", "topic": "燃燒", "stem": "下列燃燒要素中，何者與自由基之變化有關？", "opts": {"A": "可燃物", "B": "助燃物", "C": "熱能", "D": "連鎖反應"}, "answer": "D", "explain": "連鎖反應是指燃燒中自由基不斷生成、傳遞與增殖的過程，抑制法即針對此要素。", "ref": "【111警察四等 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-044", "topic": "煙與熱流", "stem": "某大樓於外部無風時，內部煙囪效應之中性帶位於5樓；當面臨強勁的北風吹襲時，下列敘述何者正確？", "opts": {"A": "北面樓層的中性帶下降", "B": "南面5樓的內部氣壓較外部高", "C": "南面樓層的排氣效率下降", "D": "北面4樓的氣流方向受到逆轉"}, "answer": "B", "explain": "北風使南面成為背風面、外部呈負壓，南面5樓外部壓力下降而室內相對較高，氣體向外流出、排氣增加；北面迎風正壓使中性帶上移。", "ref": "【111警察四等 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-045", "topic": "防火與特殊現象", "stem": "有關電器保護裝置，下列敘述何者正確？", "opts": {"A": "若負載為電動機，其斷路器的額定電流不應大於導線安培容量的數倍以上", "B": "進屋線之過電流保護裝置，不得設於接戶開關之負載側", "C": "緊急電源插座之專用迴路，不得設置漏電斷路器", "D": "裝置熔絲為目前最可靠的漏電保護方法"}, "answer": "C", "explain": "緊急電源插座須確保火災時持續供電，專用迴路不得設漏電斷路器以免跳脫斷電；熔絲是過電流保護而非漏電保護，進屋線過電流保護裝置應設於接戶開關負載側。", "ref": "【111警察四等 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-046", "topic": "防火與特殊現象", "stem": "建築物發生閃燃（Flashover）現象，下列敘述何者錯誤？", "opts": {"A": "延遲建築物火災到達閃燃階段，為最重要的避難對策", "B": "發生閃燃現象時，居室內的人生存機會低", "C": "同種類等面積之裝潢材料中，壁面影響閃燃時間（F.O.T.）最大", "D": "閃燃現象通常發生在建築物火災的成長期"}, "answer": "C", "explain": "對閃燃時間影響最大的是天花板裝修材料（高溫煙層直接加熱），而非壁面，故C錯。", "ref": "【111警察四等 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-047", "topic": "燃燒", "stem": "有關自然發火之物質，下列敘述何者正確？", "opts": {"A": "硝化棉為分解熱蓄積而發火之物質，在缺氧環境下，不會燃燒", "B": "油渣、塗料為氧化熱蓄積而發火之物質", "C": "活性碳為發酵熱蓄積而發火之物質", "D": "乾草堆為吸著熱蓄積而發火之物質"}, "answer": "B", "explain": "油渣、塗料含乾性油，氧化發熱蓄積而自燃。硝化棉分子含氧可自行燃燒；活性碳屬吸著熱；乾草堆屬發酵熱。", "ref": "【111警察四等 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-048", "topic": "爆炸", "stem": "有關沸騰液體膨脹蒸氣爆炸（BLEVE）之事故現象，下列敘述何者錯誤？", "opts": {"A": "專指沸騰狀態之液化瓦斯，氣化膨脹而爆炸之現象", "B": "為儲槽內平衡狀態之氣相與液相失控，液相迅速蒸發成氣相形成衝擊蒸氣之情形", "C": "火球是可燃性物質BLEVE之事故現象", "D": "BLEVE事故之特色為破片飛散"}, "answer": "A", "explain": "BLEVE泛指任何加壓液化液體（含水等不燃液體）儲槽破裂時急速汽化的爆炸，並非專指液化瓦斯，故A錯。", "ref": "【111警察四等 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-049", "topic": "爆炸", "stem": "鍋爐因為受腐蝕或發生溝狀侵蝕，導致鍋爐破裂，鍋爐內壓力急速回復為大氣壓力，導致爐內之水激烈氣化，使鍋爐裂縫繼續擴大，其噴出水蒸氣之推進作用使鍋爐體飛向空中。此類爆炸應歸類為：", "opts": {"A": "分解爆炸", "B": "機械爆炸", "C": "蒸氣爆炸", "D": "粉塵爆炸"}, "answer": "C", "explain": "過熱水因壓力驟降而急速相變為水蒸氣造成的爆炸，屬蒸氣爆炸（物理爆炸）。", "ref": "【111警察四等 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-050", "topic": "爆炸", "stem": "一般可燃性氣體，在高壓下之爆炸範圍大多與壓力成正向關係，下列何種氣體例外？", "opts": {"A": "C₃H₈", "B": "C₂H₄", "C": "CH₄", "D": "CO"}, "answer": "D", "explain": "一氧化碳是例外，壓力升高時其爆炸範圍反而變窄；多數烴類壓力升高時爆炸上限上升、範圍擴大。", "ref": "【111警察四等 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-051", "topic": "熱傳", "stem": "下列何者之熱傳導係數最小？", "opts": {"A": "銅", "B": "鐵", "C": "水", "D": "二氧化碳"}, "answer": "D", "explain": "熱傳導係數一般為金屬＞非金屬固體＞液體＞氣體；二氧化碳為氣體，最小。", "ref": "【112警察四等 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-052", "topic": "熱傳", "stem": "居室空間中引發全面性燃燒，下列何者為最主要的熱傳原因？", "opts": {"A": "自然對流", "B": "強制對流", "C": "熱輻射", "D": "熱傳導"}, "answer": "C", "explain": "全面燃燒（閃燃）主要由高溫煙層與天花板的輻射熱回饋，使室內可燃物同時熱分解起火。", "ref": "【112警察四等 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-053", "topic": "滅火", "stem": "下列何種氣體，非為INERGEN（IG541）滅火藥劑的主要成分？", "opts": {"A": "氮", "B": "氬", "C": "二氧化碳", "D": "氟"}, "answer": "D", "explain": "IG541由氮52%、氬40%、二氧化碳8%組成，不含氟；含氟的是FM200等鹵化烴藥劑。", "ref": "【112警察四等 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-054", "topic": "滅火", "stem": "在密閉空間注入不燃性氣體，使空間氧氣之濃度降低，進而使燃燒無法持續而熄滅，此種滅火方法為：", "opts": {"A": "移除法", "B": "冷卻法", "C": "窒息法", "D": "抑制法"}, "answer": "C", "explain": "以不燃性氣體稀釋或隔絕氧氣，降低助燃物濃度，屬窒息法。", "ref": "【112警察四等 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-055", "topic": "燃燒", "stem": "當100克的碳完全燃燒時，理論上需要大約多少立方公尺的空氣？", "opts": {"A": "0.9", "B": "1.9", "C": "2.9", "D": "3.9"}, "answer": "A", "explain": "C＋O₂→CO₂，100/12≈8.33 mol需O₂ 8.33 mol×22.4 L≈186.7 L；空氣量＝0.1867/0.21≈0.89 m³，約0.9。", "ref": "【112警察四等 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-056", "topic": "危險物品", "stem": "植物油中，一般碘價數大者，油脂越容易氧化，起火之危險也越大；相同環境條件下，下列何者最易氧化發熱起火？", "opts": {"A": "亞麻仁油", "B": "樟腦油", "C": "葵花油", "D": "花生油"}, "answer": "A", "explain": "亞麻仁油是典型乾性油，碘價最高（約170以上），最易氧化蓄熱自燃；花生油為不乾性油，葵花油為半乾性油。", "ref": "【112警察四等 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-057", "topic": "危險物品", "stem": "與水接觸能放出易燃性氣體的物質稱為：", "opts": {"A": "親水性物質", "B": "禁水性物質", "C": "水溶性物質", "D": "自熱物質"}, "answer": "B", "explain": "遇水產生可燃氣體（如鈉產生氫氣、碳化鈣產生乙炔）的物質稱禁水性物質，屬第三類公共危險物品。", "ref": "【112警察四等 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-058", "topic": "煙與熱流", "stem": "大樓起火後因產生煙氣溫度較外界為高，此時可能會造成大樓內一股向上的氣流，此現象稱為：", "opts": {"A": "拉穿效應", "B": "複燃現象", "C": "閃燃現象", "D": "煙囪效應"}, "answer": "D", "explain": "室內溫度高於室外時，垂直通道內熱氣上升、下方補氣，稱（正）煙囪效應。", "ref": "【112警察四等 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-059", "topic": "爆炸", "stem": "可燃性固體之微粒子浮游於空氣中，遇到火焰或放電火花而產生爆炸之現象稱為：", "opts": {"A": "高壓氣體爆炸", "B": "粉塵爆炸", "C": "蒸氣爆炸", "D": "分解爆炸"}, "answer": "B", "explain": "可燃固體微粒懸浮於空氣中達爆炸濃度並遇火源而爆炸，即粉塵爆炸。", "ref": "【112警察四等 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-060", "topic": "熱傳", "stem": "有關熱傳導，下列敘述何者錯誤？", "opts": {"A": "熱傳導為熱流在固體內部傳遞的過程", "B": "熱傳導對於固體表面火勢之蔓延具有影響", "C": "兩個不同溫度之物體相互接觸時，熱由低溫物體流向高溫物體", "D": "傳導物體的截面積越大，傳導的熱量越多"}, "answer": "C", "explain": "熱只會自發地由高溫物體流向低溫物體，C方向相反。依傅立葉定律，截面積愈大傳熱量愈多。", "ref": "【112警察四等 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-061", "topic": "熱傳", "stem": "熱透過流動介質，將熱量由一處傳到另一處的現象稱為：", "opts": {"A": "熱輻射", "B": "熱傳導", "C": "熱對流", "D": "熱變化"}, "answer": "C", "explain": "藉流體（氣體、液體）流動帶走熱量的傳熱方式為熱對流。", "ref": "【112警察四等 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-062", "topic": "熱傳", "stem": "甲、乙輻射體的溫度分別為1000 K、250 K，甲輻射體之輻射熱為乙之幾倍？", "opts": {"A": "4倍", "B": "16倍", "C": "64倍", "D": "256倍"}, "answer": "D", "explain": "輻射熱與絕對溫度四次方成正比：(1000/250)⁴＝4⁴＝256倍。", "ref": "【112警察四等 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-063", "topic": "燃燒", "stem": "若把空氣中的氮氣換成氦氣，其對於甲烷的燃燒性質有何明顯影響？", "opts": {"A": "發火溫度降低", "B": "燃燒上限升高", "C": "燃燒範圍擴大", "D": "最小發火能量升高"}, "answer": "D", "explain": "氦的熱傳導率遠大於氮，火花能量易散失，所需最小發火能量升高；惰性氣體熱傳導率愈大，抑制效果愈好。", "ref": "【112警察四等 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-064", "topic": "燃燒", "stem": "可燃物如獲充分之氧氣供應，其可燃成分燃燒殆盡，稱為何種燃燒型態？", "opts": {"A": "定常燃燒", "B": "完全燃燒", "C": "蒸發燃燒", "D": "均一系燃燒"}, "answer": "B", "explain": "氧氣充足、可燃成分全部氧化（如碳生成CO₂）稱完全燃燒；氧氣不足會產生CO等為不完全燃燒。", "ref": "【112警察四等 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-065", "topic": "火災", "stem": "木造屋火災非完全燃燒時的產物，下列敘述何者錯誤？", "opts": {"A": "會產生CO", "B": "會產生水氣", "C": "燃燒過程中會產生可燃性中間產物", "D": "不產生CO₂"}, "answer": "D", "explain": "不完全燃燒時部分碳仍會完全氧化，因此CO₂與CO同時存在，說不產生CO₂是錯的。", "ref": "【112警察四等 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-066", "topic": "燃燒", "stem": "引火源種類中，下列何者不是微火源？", "opts": {"A": "線香", "B": "火柴燃燒", "C": "熔接火花", "D": "香煙"}, "answer": "B", "explain": "微火源指線香、香菸、熔接火花等無焰或能量小的火源；火柴燃燒有明火焰，屬有焰火源。", "ref": "【112警察四等 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-067", "topic": "熱傳", "stem": "定溫式探測器於火災發生時作動，熱主要是以何種方式傳遞？", "opts": {"A": "傳導熱", "B": "對流熱", "C": "輻射熱", "D": "蒸發熱"}, "answer": "B", "explain": "火羽流把高溫氣體帶到天花板並沿頂棚流動，加熱天花板上的感熱元件，主要為對流傳熱。", "ref": "【112警察四等 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-068", "topic": "火災", "stem": "空氣在某一溫度下，實際所含水蒸氣量與飽和蒸氣量之比，稱為：", "opts": {"A": "有效濕度", "B": "絕對濕度", "C": "實效濕度", "D": "相對濕度"}, "answer": "D", "explain": "相對濕度＝實際水蒸氣量／同溫度飽和水蒸氣量×100%；絕對濕度是單位體積空氣所含的水蒸氣質量。", "ref": "【112警察四等 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-069", "topic": "火災", "stem": "對於半斷線處，下列敘述何者錯誤？", "opts": {"A": "截面積增加", "B": "電阻值增加", "C": "易產生過熱", "D": "易產生電氣火花"}, "answer": "A", "explain": "半斷線處導體部分斷裂，有效截面積減少，電阻增加而局部過熱並可能產生火花，故A錯。", "ref": "【112警察四等 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-070", "topic": "防火與特殊現象", "stem": "有關液體之帶電，下列敘述何者正確？", "opts": {"A": "燈油、汽油、酒精等可燃性液體均容易產生液體帶電", "B": "液體與管路、油槽壁或過濾固體表面流動摩擦所發生", "C": "液體靜止中，不會因氣泡上昇或沉澱而發生靜電", "D": "液體不會因流動與其他液體表面發生摩擦而發生靜電"}, "answer": "B", "explain": "液體帶電主要來自與管壁、槽壁、過濾器等流動摩擦。酒精導電度高不易蓄電；靜置時氣泡上升、沉澱或液液摩擦也可能帶電。", "ref": "【112警察四等 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-071", "topic": "危險物品", "stem": "爆炸性物質含下列何種成分愈多，敏感性愈高？", "opts": {"A": "羰基（CO）", "B": "硝基（NO₂）", "C": "胺基（NH₂）", "D": "磺基（SO₂）"}, "answer": "B", "explain": "硝基為爆炸性原子團，分子中硝基愈多，自身含氧愈多、敏感度與爆炸威力愈高（如TNT、硝化甘油）。", "ref": "【112警察四等 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-072", "topic": "火災", "stem": "有關建築火災t²理論，快速火災成長係指多少秒內達到約1 MW？", "opts": {"A": "75秒", "B": "100秒", "C": "150秒", "D": "300秒"}, "answer": "C", "explain": "t²火災成長分級（達約1 MW）：超快速75秒、快速150秒、中速300秒、慢速600秒。", "ref": "【112警 <script>
const DATA = JSON.parse(document.getElementById('bank').textContent);
const Q = DATA.questions;
const byId = Object.fromEntries(Q.map(q => [q.id, q]));
const SUBJECTS = DATA.subjects;
const EXAM_DAY = new Date('2026-11-07T08:40:00+08:00');
const KEY = 'fire-promo-drill-v1';

let S = {seen:{}, wrong:{}, right:{}, history:[], filters:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 1800); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function daysLeft(){ return Math.max(0, Math.ceil((EXAM_DAY - new Date()) / 86400000)); }

function pool(subj){
  const f = S.filters[subj.key] || {};
  return Q.filter(q => q.subject === subj.key
    && (!f.topic || f.topic === '全部' || q.topic === f.topic)
    && (!f.src || f.src === '全部' || (f.src === '考古題' && q.src === 'old') || (f.src === '新題' && q.src === 'new') || (f.src === '修法重點' && q.amend)));
}
function subjStats(key){
  const qs = Q.filter(q => q.subject === key);
  const seen = qs.filter(q => S.seen[q.id]).length;
  const r = qs.reduce((a, q) => a + (S.right[q.id] || 0), 0), w = qs.reduce((a, q) => a + (S.wrong[q.id] || 0), 0);
  const wrongNow = qs.filter(q => S.wrong[q.id] > 0 && !(S.cleared||{})[q.id]).length;
  return {total: qs.length, old: qs.filter(q => q.src === 'old').length, neu: qs.filter(q => q.src === 'new').length,
          amend: qs.filter(q => q.amend).length, seen, acc: r + w ? Math.round(100 * r / (r + w)) : null, wrongNow};
}
function wrongList(key){ return Q.filter(q => q.subject === key && S.wrong[q.id] > 0 && !(S.cleared||{})[q.id]); }

/* ---------- home ---------- */
function home(){
  const d = daysLeft();
  let h = `<header class="top"><div><h1>消防升官等刷題</h1><div class="sub">115 年警正・消防人員類科｜選擇題三科＋火災學</div></div>
    <div class="count"><b>${d}</b><span>天後開考 11/7</span></div></header><div class="subjects">`;
  for (const s of SUBJECTS){
    const st = subjStats(s.key), f = S.filters[s.key] || {};
    const chip = (group, v) => `<button class="chip" aria-pressed="${(f[group] || '全部') === v}" data-s="${s.key}" data-g="${group}" data-v="${v}">${v}</button>`;
    h += `<section class="subj"><div class="subj-head"><h2>${esc(s.name)}</h2><span class="meta">${esc(s.when)}</span></div>
      <div class="bar"><i style="width:${st.total ? 100 * st.seen / st.total : 0}%"></i></div>
      <div class="stat"><span>做過 <b>${st.seen}</b>/${st.total}</span><span>正確率 <b>${st.acc === null ? '—' : st.acc + '%'}</b></span>
        <span>考古 <b>${st.old}</b></span><span>新題 <b>${st.neu}</b></span>${st.amend ? `<span>修法 <b>${st.amend}</b></span>` : ''}</div>
      <div class="chips"><span class="chiplabel">範圍</span>${['全部', ...s.topics].map(v => chip('topic', v)).join('')}</div>
      ${s.key !== '國文' ? `<div class="chips"><span class="chiplabel">題源</span>${(s.key === '火災學' ? ['全部','考古題','新題'] : ['全部','考古題','新題','修法重點']).map(v => chip('src', v)).join('')}</div>` : ''}
      <div class="actions">
        <button class="btn primary" data-act="drill" data-s="${s.key}">練 10 題<small>範圍內 ${pool(s).length} 題</small></button>
        <button class="btn" data-act="mock" data-s="${s.key}">模擬考試<small>${s.mockN} 題・${s.mockMin} 分鐘</small></button>
        <button class="btn wide" data-act="wrong" data-s="${s.key}" ${st.wrongNow ? '' : 'disabled'}>錯題本 ${st.wrongNow} 題</button>
      </div></section>`;
  }
  h += `</div><div class="foot">
    <div>考古題：107、109、111、113 年考選部原卷（已剔除因修法而過時的題目）。新題：依 2026-09-22 現行法條命題，「修法」標籤＝113 年考試後才修、還沒考過的條文。</div>
    <div>火災學：考古題取自火災學題庫書收錄之歷屆試題（題目照原題、解析自行重寫）；新題依上課影片筆記之名詞解釋與計算題自編，計算題皆經程式驗算。</div>
    <div class="row"><button class="linkbtn" id="copyWrong">複製錯題清單（貼給 AI 老師分析）</button><button class="linkbtn" id="reset">清除作答紀錄</button></div>
    ${S.history.length ? `<div>最近：${S.history.slice(-3).reverse().map(x => `${x.d} ${x.s}${x.m === 'mock' ? '模擬考' : '練習'} ${x.c}/${x.n}`).join('｜')}</div>` : ''}
  </div>`;
  $app.innerHTML = h;
  window.scrollTo(0, 0);
}
$app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('chip')){
    const f = S.filters[b.dataset.s] = S.filters[b.dataset.s] || {};
    f[b.dataset.g] = b.dataset.v; save(); home(); return;
  }
  if (b.dataset.act){ start(b.dataset.act, SUBJECTS.find(s => s.key === b.dataset.s)); return; }
  if (b.id === 'copyWrong') copyWrong();
  if (b.id === 'reset' && confirm('確定清除所有作答紀錄與錯題本？')){ S = {seen:{}, wrong:{}, right:{}, history:[], filters:S.filters}; save(); home(); }
});
function copyWrong(){
  const ws = Q.filter(q => S.wrong[q.id] > 0 && !(S.cleared||{})[q.id]);
  if (!ws.length){ toast('目前沒有錯題'); return; }
  const txt = '【消防升官等錯題清單】\n' + ws.map(q => `${q.id}｜${q.topic}｜錯${S.wrong[q.id]}次｜${q.stem.slice(0, 30)}…`).join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(`已複製 ${ws.length} 題`), () => { prompt('複製下面文字：', txt); });
}

/* ---------- session ---------- */
let R = null;
function pickDrill(subj){
  const p = pool(subj);
  const unseen = shuffle(p.filter(q => !S.seen[q.id])), wrong = shuffle(p.filter(q => S.seen[q.id] && S.wrong[q.id] > 0)), rest = shuffle(p.filter(q => S.seen[q.id] && !(S.wrong[q.id] > 0)));
  return [...unseen, ...wrong, ...rest].slice(0, 10);
}
function pickMock(subj){
  const out = [];
  for (const [topic, n] of Object.entries(subj.mockMix)){
    const all = Q.filter(q => q.subject === subj.key && q.topic === topic);
    if (topic === '英文'){ // keep passage groups together
      const groups = {}; all.forEach(q => { const k = q.passage ? q.id.slice(0, q.id.lastIndexOf('-')) + '|' + q.passage.slice(0, 20) : q.id; (groups[k] = groups[k] || []).push(q); });
      const singles = shuffle(Object.values(groups).filter(g => g.length === 1).flat()), multi = shuffle(Object.values(groups).filter(g => g.length > 1));
      const got = []; for (const g of multi){ if (got.length + g.length <= Math.ceil(n / 2)) got.push(...g); }
      got.push(...singles.slice(0, n - got.length)); out.push(...got);
    } else out.push(...shuffle(all).slice(0, n));
  }
  return out;
}
function start(mode, subj){
  let qs = mode === 'drill' ? pickDrill(subj) : mode === 'mock' ? pickMock(subj) : shuffle(wrongList(subj.key)).slice(0, 10);
  if (!qs.length){ toast('這個範圍沒有題目'); return; }
  R = {mode, subj, qs, i:0, ans:{}, done:false, t0:Date.now(), limit: mode === 'mock' ? subj.mockMin * 60 : 0};
  if (R.limit) tick();
  render();
}
function tick(){
  clearInterval(tick._h);
  tick._h = setInterval(() => {
    if (!R || !R.limit || R.done){ clearInterval(tick._h); return; }
    const left = R.limit - Math.floor((Date.now() - R.t0) / 1000);
    const el = document.getElementById('timer');
    if (el){ el.textContent = fmt(Math.max(0, left)); el.classList.toggle('low', left < 300); }
    if (left <= 0){ clearInterval(tick._h); toast('時間到，自動交卷'); finish(); }
  }, 1000);
}
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function record(q, choice){
  const ok = isRight(q, choice);
  S.seen[q.id] = (S.seen[q.id] || 0) + 1;
  if (ok){ S.right[q.id] = (S.right[q.id] || 0) + 1; if (R.mode === 'wrong'){ S.cleared = S.cleared || {}; S.cleared[q.id] = 1; } }
  else { S.wrong[q.id] = (S.wrong[q.id] || 0) + 1; if (S.cleared) delete S.cleared[q.id]; }
  return ok;
}
function isRight(q, c){ return q.accept ? q.accept.includes(c) : c === q.answer; }

function srcBadges(q){
  let b = q.src === 'old' ? `<span class="badge">${q.year} 年考古題 第 ${q.n} 題</span>` : `<span class="badge new">新題</span>`;
  b += `<span class="badge">${esc(q.topic)}</span>`;
  if (q.amend) b += `<span class="badge amend">修法 ${esc(q.amend)}</span>`;
  return b;
}
function explainBlock(q){
  return `<div class="explain">${esc(q.explain)}
    ${q.note ? `<div class="reason">${esc(q.note)}</div>` : ''}
    ${q.evidence ? `<blockquote>${esc(q.evidence)}</blockquote>` : ''}
    ${q.ref ? `<div class="ref">依據：${esc(q.ref)}</div>` : ''}</div>`;
}
function render(){
  const q = R.qs[R.i], mock = R.mode === 'mock', chosen = R.ans[q.id], reveal = (!mock && chosen) || R.done;
  const title = `${R.subj.name}｜${mock ? '模擬考試' : R.mode === 'wrong' ? '錯題本' : '練習'}`;
  let h = `<div class="qbar"><div class="left"><button class="back" id="quit">返回</button><span class="title">${esc(title)}</span></div>
    <span class="${R.limit && !R.done ? 'timer' : 'qnum'}" id="timer">${R.limit && !R.done ? fmt(Math.max(0, R.limit - Math.floor((Date.now() - R.t0) / 1000))) : `${R.i + 1}/${R.qs.length}`}</span></div>
    <div class="progress"><i style="width:${100 * (R.i + 1) / R.qs.length}%"></i></div>
    <article class="qcard"><div class="badges"><span class="qnum">第 ${R.i + 1} 題</span>${reveal ? srcBadges(q) : ''}</div>
    ${q.passage ? `<div class="passage">${esc(q.passage)}</div>` : ''}
    <div class="stem">${esc(q.stem || '（依上文作答）')}</div><div class="opts">`;
  for (const k of ['A','B','C','D']){
    let cls = 'opt';
    if (reveal){ if (isRight(q, k)) cls += ' right'; else if (chosen === k) cls += ' wrong'; }
    else if (chosen === k) cls += ' sel';
    h += `<button class="${cls}" data-k="${k}" ${reveal ? 'disabled' : ''}><span class="k">${k}</span><span>${esc(q.opts[k])}</span></button>`;
  }
  h += `</div>`;
  if (reveal){
    const ok = isRight(q, chosen);
    h += `<div class="verdict ${ok ? 'ok' : 'no'}">${chosen ? (ok ? '答對' : `答錯，正解 ${q.answer}`) : `未作答，正解 ${q.answer}`}</div>${explainBlock(q)}`;
  }
  h += `</article><div class="nav">
    <button class="btn" id="prev" ${R.i === 0 ? 'disabled' : ''}>上一題</button>
    ${R.i < R.qs.length - 1 ? `<button class="btn primary" id="next" ${!mock && !reveal ? 'disabled' : ''}>下一題</button>`
      : R.done ? `<button class="btn primary" id="toResult">看成績</button>` : `<button class="btn primary" id="finish" ${!mock && !reveal ? 'disabled' : ''}>${mock ? '交卷' : '完成'}</button>`}
    </div>`;
  if (mock) h += `<div class="grid">${R.qs.map((x, j) => `<button data-j="${j}" class="${j === R.i ? 'cur ' : ''}${R.done ? (isRight(x, R.ans[x.id]) ? 'r' : 'w') : (R.ans[x.id] ? 'done' : '')}">${j + 1}</button>`).join('')}</div>`;
  $app.innerHTML = h;
  window.scrollTo(0, 0);
}
$app.addEventListener('click', e => {
  if (!R || !$app.querySelector('.qcard')) return;
  const b = e.target.closest('button'); if (!b) return;
  const q = R.qs[R.i];
  if (b.dataset.k && !b.disabled){
    if (R.mode === 'mock'){ R.ans[q.id] = b.dataset.k; render(); }
    else { R.ans[q.id] = b.dataset.k; record(q, b.dataset.k); save(); render(); }
    return;
  }
  if (b.dataset.j !== undefined){ R.i = +b.dataset.j; render(); return; }
  if (b.id === 'prev'){ R.i--; render(); }
  if (b.id === 'next'){ R.i++; render(); }
  if (b.id === 'finish'){
    if (R.mode === 'mock'){ const blank = R.qs.filter(x => !R.ans[x.id]).length; if (blank && !confirm(`還有 ${blank} 題沒作答，確定交卷？`)) return; }
    finish();
  }
  if (b.id === 'toResult') result();
  if (b.id === 'quit'){ if (R.mode === 'mock' && !R.done && !confirm('模擬考還沒交卷，確定離開？')) return; R = null; clearInterval(tick._h); home(); }
});
function finish(){
  if (R.mode === 'mock' && !R.done){ R.qs.forEach(q => { if (R.ans[q.id]) record(q, R.ans[q.id]); else { S.seen[q.id] = (S.seen[q.id] || 0) + 1; S.wrong[q.id] = (S.wrong[q.id] || 0) + 1; } }); }
  R.done = true;
  const c = R.qs.filter(q => isRight(q, R.ans[q.id])).length;
  S.history.push({d: new Date().toLocaleDateString('zh-TW', {month:'numeric', day:'numeric'}), s: R.subj.short, m: R.mode, c, n: R.qs.length});
  S.history = S.history.slice(-50); save();
  result();
}
function result(){
  const c = R.qs.filter(q => isRight(q, R.ans[q.id])).length, n = R.qs.length;
  const by = {};
  R.qs.forEach(q => { const t = by[q.topic] = by[q.topic] || [0, 0]; t[1]++; if (isRight(q, R.ans[q.id])) t[0]++; });
  const mins = Math.round((Date.now() - R.t0) / 60000);
  const scoreTxt = R.mode === 'mock' && R.subj.key !== '國文' ? `${c * 2}` : `${c}/${n}`;
  $app.innerHTML = `<div class="qbar"><div class="left"><button class="back" id="home2">回首頁</button><span class="title">${esc(R.subj.name)}</span></div><span class="qnum">${mins} 分鐘</span></div>
    <div class="result"><div class="score">${scoreTxt}</div><div class="of">${R.mode === 'mock' && R.subj.key !== '國文' ? `答對 ${c}/${n} 題・每題 2 分` : `答對 ${c} 題，共 ${n} 題`}</div></div>
    <div class="breakdown">${Object.entries(by).map(([t, [a, b]]) => `<div><span>${esc(t)}</span><span class="mono">${a}/${b}</span></div>`).join('')}</div>
    <div class="actions"><button class="btn primary" id="review">逐題檢討${n - c ? `（錯 ${n - c} 題）` : ''}</button><button class="btn" id="again">再來一回</button></div>`;
  window.scrollTo(0, 0);
}
$app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !R) return;
  if (b.id === 'home2'){ R = null; home(); }
  if (b.id === 'again'){ const m = R.mode, s = R.subj; start(m, s); }
  if (b.id === 'review'){ R.done = true; const firstWrong = R.qs.findIndex(q => !isRight(q, R.ans[q.id])); R.i = Math.max(0, firstWrong); render(); }
});
home();
</script>
</html>
