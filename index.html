一千公升或二千公升。", "ref": "公危辦法§6Ⅰ③", "evidence": "室內儲槽場所：在建築物內設置容量超過六百公升且不可移動之儲槽儲存六類物品之場所", "tag": "子法", "src": "new"}, {"id": "N-公危-004", "subject": "刑事法", "topic": "消防法", "stem": "某場所販賣裝於容器之六類物品，其數量達管制量二十倍。依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，該場所應屬下列何者？", "opts": {"A": "第一種販賣場所", "B": "第二種販賣場所", "C": "一般處理場所", "D": "室內儲存場所"}, "answer": "B", "explain": "本辦法第7條第1項第1款規定，販賣裝於容器之六類物品其數量未達管制量十五倍者為第一種販賣場所；達管制量十五倍以上、未達四十倍者為第二種販賣場所。本題二十倍落於十五倍以上未達四十倍之區間，故屬第二種販賣場所，（B）正確。（C）一般處理場所係指販賣場所以外，其他一日處理六類物品數量達管制量以上之場所；（D）室內儲存場所屬儲存場所而非處理場所。", "ref": "公危辦法§7Ⅰ①(二)", "evidence": "第二種販賣場所：販賣裝於容器之六類物品，其數量達管制量十五倍以上，未達四十倍之場所", "tag": "子法", "src": "new"}, {"id": "N-公危-005", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，所稱可燃性高壓氣體之「容器串接使用場所」，指使用液化石油氣作為燃氣來源，其串接使用量達多少以上之場所？", "opts": {"A": "四十公斤", "B": "八十公斤", "C": "一百二十公斤", "D": "三百公斤"}, "answer": "B", "explain": "本辦法第7條第2項第3款明定，容器串接使用場所指使用液化石油氣作為燃氣來源，其串接使用量達「八十公斤以上」之場所，故（B）正確。（A）四十公斤係第73條第3項供家庭使用之液化石油氣備用量上限；（C）一百二十公斤與（D）三百公斤則為第73條之1第1項各款依串接使用量分級加嚴安全設施之級距上限，均非本場所之認定門檻。", "ref": "公危辦法§7Ⅱ③", "evidence": "容器串接使用場所：使用液化石油氣作為燃氣來源，其串接使用量達八十公斤以上之場所", "tag": "子法", "src": "new"}, {"id": "N-公危-006", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第8條規定，下列敘述何者錯誤？", "opts": {"A": "高閃火點物品，指閃火點在攝氏一百度以上之第四類公共危險物品", "B": "擋牆設置位置應距離場所外牆或相當於該外牆之設施外側二公尺以上", "C": "擋牆得以厚度在十五公分以上之鋼筋或鋼骨混凝土牆建造", "D": "擋牆得以堆高斜度不超過四十五度之土堤建造"}, "answer": "D", "explain": "本辦法第8條第2項第3款規定，擋牆之構造為厚度在十五公分以上之鋼筋或鋼骨混凝土牆、厚度在二十公分以上之鋼筋或鋼骨補強空心磚牆，或「堆高斜度不超過六十度之土堤」，（D）誤為四十五度。（A）為同條第1項；（B）為第2項第1款；（C）為第2項第3款前段，均屬正確。另同條第5項規定應設超過三公尺保留空地寬度之場所，其保留空地面臨海洋、湖泊、水堰或河川者，得縮減為三公尺。", "ref": "公危辦法§8Ⅱ③", "evidence": "厚度在二十公分以上之鋼筋或鋼骨補強空心磚牆；或堆高斜度不超過六十度之土堤", "tag": "子法", "src": "new"}, {"id": "N-公危-007", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，六類物品製造場所及一般處理場所外牆或相當於該外牆之設施外側，與廠區外鄰近場所之安全距離，下列敘述何者錯誤？", "opts": {"A": "與古蹟之距離，應在五十公尺以上", "B": "與加油站、加氣站及其他危險性類似場所之距離，應在二十公尺以上", "C": "與電壓超過三萬五千伏特之高架電線之距離，應在三公尺以上", "D": "與前述各款所列場所以外場所之距離，應在十公尺以上"}, "answer": "C", "explain": "本辦法第13條第1項第5款規定，與電壓超過三萬五千伏特之高架電線之距離應在「五公尺以上」；同項第6款所定三公尺以上者，係電壓超過七千伏特、三萬五千伏特以下之高架電線，（C）將二者混淆而錯誤。（A）為同項第1款；（B）為第3款；（D）為第4款，均屬正確。另同條第2項規定設有擋牆防護或具同等以上防護性能者，安全距離得減半計算。", "ref": "公危辦法§13Ⅰ⑤", "evidence": "與電壓超過三萬五千伏特之高架電線之距離，應在五公尺以上", "tag": "子法", "src": "new"}, {"id": "N-公危-008", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第14條，有關六類物品製造場所或一般處理場所四周保留空地寬度之規定，下列敘述何者正確？", "opts": {"A": "原則應在三公尺以上；儲存量達管制量十倍以上者，應在五公尺以上", "B": "原則應在三公尺以上；儲存量達管制量五倍以上者，應在五公尺以上", "C": "不論儲存量多寡，四周保留空地寬度一律應在五公尺以上", "D": "設有高於屋頂、為不燃材料建造且具一小時以上防火時效之防火牆者，即得不受保留空地規定限制"}, "answer": "A", "explain": "本辦法第14條第1項明定，六類物品製造場所或一般處理場所四周保留空地寬度應在三公尺以上；儲存量達管制量十倍以上者，四周保留空地寬度應在五公尺以上，故（A）正確、（B）誤為五倍、（C）忽略分級。（D）錯誤，同條第2項須設有高於屋頂、為不燃材料建造且具「二小時以上」防火時效之防火牆並與相鄰場所有效隔開，且限於僅製造或處理高閃火點物品且操作溫度未滿攝氏一百度，或作業流程具連接性等情形。", "ref": "公危辦法§14Ⅰ", "evidence": "四周保留空地寬度應在三公尺以上；儲存量達管制量十倍以上者，四周保留空地寬度應在五公尺以上", "tag": "子法", "src": "new"}, {"id": "N-公危-009", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第16條，六類物品製造場所或一般處理場所之設備，下列敘述何者錯誤？", "opts": {"A": "有積存可燃性蒸氣或粉塵之虞之建築物，應設置將蒸氣或粉塵有效排至屋簷以上或室外距地面四公尺以上高處之設備", "B": "六類物品之加熱或乾燥設備，原則應採不直接用火加熱之構造", "C": "處理六類物品達管制量五倍者，原則應設置符合CNS一二八七二規定之避雷設備", "D": "製造或處理六類物品之設備有發生靜電蓄積之虞者，應設置有效消除靜電之裝置"}, "answer": "C", "explain": "本辦法第16條第1項第8款規定，處理六類物品達「管制量十倍」者，避雷設備應符合CNS一二八七二規定或以接地方式達同等以上防護性能，（C）誤為五倍。（A）為同項第2款；（B）為第5款；（D）為第7款（但僅處理高閃火點物品且操作溫度未滿攝氏一百度者除外），均屬正確。另因周圍環境無致生危險之虞者，得免設避雷設備。", "ref": "公危辦法§16Ⅰ⑧", "evidence": "處理六類物品達管制量十倍者，避雷設備應符合中華民國國家標準", "tag": "子法", "src": "new"}, {"id": "N-公危-010", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第17條，第一種販賣場所內設六類物品調配室者，下列敘述何者錯誤？", "opts": {"A": "第一種販賣場所應設於建築物之地面層", "B": "調配室樓地板面積應在六平方公尺以上，十平方公尺以下", "C": "調配室地板應為不滲透構造，並設置適當傾斜度及集液設施", "D": "調配室出入口應設置三十分鐘以上防火時效之防火門"}, "answer": "D", "explain": "本辦法第17條第4款第4目規定，第一種販賣場所內六類物品調配室之「出入口應設置一小時以上防火時效之防火門」，（D）誤為三十分鐘（三十分鐘以上防火時效之防火門窗係同條第3款第4目對販賣場所窗戶及出入口之要求）。（A）為同條第1款；（B）為第4款第1目；（C）為第4款第3目，均屬正確。", "ref": "公危辦法§17④(四)", "evidence": "出入口應設置一小時以上防火時效之防火門", "tag": "子法", "src": "new"}, {"id": "N-公危-011", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第21條，六類物品室內儲存場所之位置、構造及設備，下列敘述何者錯誤？", "opts": {"A": "儲存倉庫應為獨立、專用之建築物", "B": "儲存倉庫應為一層建築物，其高度不得超過六公尺", "C": "每一儲存倉庫樓地板面積不得超過一千五百平方公尺", "D": "儲存量達管制量十倍以上之儲存倉庫，原則應設置符合CNS一二八七二規定之避雷設備"}, "answer": "C", "explain": "本辦法第21條第5款明定，「每一儲存倉庫樓地板面積不得超過一千平方公尺」，（C）誤為一千五百平方公尺。（A）為同條第3款；（B）為第4款本文（儲存第二類或第四類公共危險物品並符合防火構造等要件者，高度得為二十公尺以下）；（D）為第14款，均屬正確。另同條第2款第1目規定儲存量超過管制量二十倍之室內儲存場所，其與同一建築基地內其他儲存場所間之保留空地寬度得縮減至三分之一，最小以三公尺為限。", "ref": "公危辦法§21⑤", "evidence": "每一儲存倉庫樓地板面積不得超過一千平方公尺", "tag": "子法", "src": "new"}, {"id": "N-公危-012", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第28條，室內儲存場所儲存第五類公共危險物品分級屬A型或B型者，下列敘述何者錯誤？", "opts": {"A": "儲存倉庫應以分隔牆區劃，每一區劃面積應在一百五十平方公尺以下", "B": "分隔牆應突出屋頂五十公分以上、二側外壁一公尺以上", "C": "儲存倉庫外壁應為厚度二十公分以上之鋼筋或鋼骨混凝土構造", "D": "儲存倉庫窗戶距離地板應在二公尺以上，且每一窗戶之面積不得超過一平方公尺"}, "answer": "D", "explain": "本辦法第28條第7款規定，儲存倉庫窗戶距離地板應在二公尺以上，設於同一壁面窗戶之總面積不得超過該壁面面積之八十分之一，且「每一窗戶之面積不得超過零點四平方公尺」，（D）誤為一平方公尺。（A）（B）為同條第3款（分隔牆並應為厚度三十公分以上鋼筋或鋼骨混凝土構造）；（C）為第4款，均屬正確。", "ref": "公危辦法§28⑦", "evidence": "每一窗戶之面積不得超過零點四平方公尺", "tag": "子法", "src": "new"}, {"id": "N-公危-013", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第33條，室內儲槽場所之位置、構造及設備，下列敘述何者錯誤？", "opts": {"A": "儲槽專用室之儲槽側板外壁與室內牆面之距離應在五十公分以上", "B": "儲槽容量不得超過管制量之四十倍；儲存第四類公共危險物品時，除第四石油類及動植物油類外，不得超過二萬公升", "C": "儲槽材質應為厚度三點二毫米以上之鋼板或具有同等以上性能者", "D": "儲槽專用室出入口應設置十公分以上之門檻，或設置具有同等以上效能之防止流出措施"}, "answer": "D", "explain": "本辦法第33條第1項第16款規定，「儲槽專用室出入口應設置二十公分以上之門檻」或設置具有同等以上效能之防止流出措施，（D）誤為十公分。（A）為同項第2款；（B）為第3款；（C）為第4款，均屬正確。另同項第1款要求室內儲槽場所應設置於一層建築物之儲槽專用室，第6款規定壓力儲槽應設安全裝置、非壓力儲槽應設通氣管。", "ref": "公危辦法§33Ⅰ⑯", "evidence": "儲槽專用室出入口應設置二十公分以上之門檻", "tag": "子法", "src": "new"}, {"id": "N-公危-014", "subject": "刑事法", "topic": "消防法", "stem": "某室外儲槽場所儲存閃火點未達攝氏二十一度之公共危險物品，儲槽容量為二十公秉。依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，該儲槽周圍保留空地寬度應在多少以上？", "opts": {"A": "二公尺", "B": "三公尺", "C": "五公尺", "D": "十公尺"}, "answer": "C", "explain": "本辦法第37條第1項第3款第1目規定，儲存閃火點未達攝氏二十一度之六類物品，其容量未達二公秉者一公尺以上、二公秉以上未達四公秉者二公尺以上、四公秉以上未達十公秉者三公尺以上、十公秉以上未達四十公秉者五公尺以上、四十公秉以上者十公尺以上。本題二十公秉落於十公秉以上未達四十公秉之區間，故應在五公尺以上，（C）正確。", "ref": "公危辦法§37Ⅰ③(一)", "evidence": "十公秉以上未達四十公秉者，應在五公尺以上", "tag": "子法", "src": "new"}, {"id": "N-公危-015", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第38條，室外儲槽場所儲槽儲存第四類公共危險物品者，其防液堤之規定，下列敘述何者錯誤？", "opts": {"A": "同一地區設有二座以上儲槽者，其周圍所設防液堤之容量應為最大儲槽容量百分之一百十以上", "B": "防液堤之高度應在五十公分以上；但儲槽容量合計超過二十萬公秉者，高度應在一公尺以上", "C": "防液堤內面積不得超過八萬平方公尺", "D": "防液堤周圍應設道路並與區內道路連接，道路寬度不得小於四公尺"}, "answer": "D", "explain": "本辦法第38條第1項第5款明定，「防液堤周圍應設道路並與區內道路連接，道路寬度不得小於六公尺」，（D）誤為四公尺。（A）為同項第1款；（B）為第2款；（C）為第3款，均屬正確。另同項第4款規定防液堤內部設置儲槽原則不得超過十座；第8款規定儲槽容量超過一萬公秉者應設分隔堤，高度在三十公分以上且至少低於防液堤二十公分。", "ref": "公危辦法§38Ⅰ⑤", "evidence": "防液堤周圍應設道路並與區內道路連接，道路寬度不得小於六公尺", "tag": "子法", "src": "new"}, {"id": "N-公危-016", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，六類物品製造、儲存及處理場所之安全管理，下列敘述何者錯誤？", "opts": {"A": "集液設施或油水分離裝置內如有積存公共危險物品時，得於每月自主檢查時一併清理", "B": "應指派專人每月對場所之位置、構造及設備自主檢查，檢查紀錄至少留存一年", "C": "室內儲存場所容器堆積高度，不得超過三公尺", "D": "室內儲存場所應保持六類物品在攝氏五十五度以下之溫度"}, "answer": "A", "explain": "本辦法第46條第7款明定，「集液設施或油水分離裝置內如有積存公共危險物品時，應隨時清理」，並非得延至每月自主檢查時一併處理，（A）錯誤。（B）為同條第11款；（C）為第46條之2第4款；（D）為第46條之2第5款，均屬正確。另第46條第8款規定廢棄之公共危險物品應適時清理，第10款規定有積存可燃性蒸氣或粉塵之虞場所不得使用易產生火花之設備。", "ref": "公危辦法§46⑦", "evidence": "集液設施或油水分離裝置內如有積存公共危險物品時，應隨時清理", "tag": "子法", "src": "new"}, {"id": "N-公危-017", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第65條規定，下列何者屬「第一類保護物」？", "opts": {"A": "醫院，其收容人員在二十人以上者", "B": "車站，每日平均有一萬人以上出入者", "C": "百貨商場，總樓地板面積在五百平方公尺以上者", "D": "第一類保護物以外供人居住或使用之建築物"}, "answer": "A", "explain": "本辦法第65條第1款第3目規定，設備標準第12條第1款第6目（含醫院、療養院等）、第2款第3目及第12目所列場所，其收容人員在二十人以上者屬第一類保護物，故（A）正確。（B）錯誤，車站屬設備標準第12條第2款第1目，須每日平均有「二萬人」以上出入；（C）錯誤，百貨商場屬第12條第1款第4目，須總樓地板面積在「一千平方公尺」以上；（D）為同條第2款所定之第二類保護物。", "ref": "公危辦法§65①(三)", "evidence": "設備標準第十二條第一款第六目、第二款第三目及第十二目所列之場所，其收容人員在二十人以上者", "tag": "子法", "src": "new"}, {"id": "N-公危-018", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第70條，可燃性高壓氣體儲存場所之構造、設備及安全管理，下列敘述何者錯誤？", "opts": {"A": "採用不燃材料構造之地面一層建築物，屋頂應以輕質金屬板或其他輕質不燃材料覆蓋，屋簷並應距離地面二點五公尺以上", "B": "應保持攝氏四十度以下之溫度，容器並應防止日光之直射", "C": "通路面積至少應占儲存場所面積之百分之十以上", "D": "灌氣容器與殘氣容器應分開儲存，並直立放置，且不可重疊堆放"}, "answer": "C", "explain": "本辦法第70條第7款明定，「通路面積至少應占儲存場所面積之百分之二十以上」，（C）誤為百分之十。（A）為同條第4款；（B）為第5款；（D）為第6款，均屬正確。另同條第8款規定周圍二公尺範圍內應嚴禁煙火且不得存放任何可燃性物質，但儲存場所牆壁以厚度九公分以上鋼筋混凝土造或具同等以上強度構築防護牆者，不在此限。", "ref": "公危辦法§70⑦", "evidence": "通路面積至少應占儲存場所面積之百分之二十以上", "tag": "子法", "src": "new"}, {"id": "N-公危-019", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第73條，有關液化石油氣販賣場所儲放液化石油氣之規定，下列敘述何者錯誤？", "opts": {"A": "容器保管室外牆以厚度十五公分以上鋼筋混凝土造構築防爆牆者，其安全距離得縮減為二公尺", "B": "總儲氣量不得超過一二八公斤，超過部分得設容器保管室儲放之，但總儲氣量以一千公斤為限", "C": "容器保管室外牆與第一類保護物及第二類保護物之安全距離應在八公尺以上", "D": "液化石油氣備用量供營業使用者不得超過八十公斤，供家庭使用者不得超過四十公斤"}, "answer": "A", "explain": "本辦法第73條第2項第6款但書規定，容器保管室外牆牆壁以厚度十五公分以上鋼筋混凝土造或具同等以上強度構築防爆牆者，其安全距離「得縮減為一公尺」，（A）誤為二公尺。（B）為同條第1項；（C）為第2項第6款本文；（D）為第3項，均屬正確。另第2項第7款規定容器保管室出入口應設置三十分鐘以上防火時效之防火門。", "ref": "公危辦法§73Ⅱ⑥", "evidence": "以厚度十五公分以上鋼筋混凝土造或具有同等以上強度構築防爆牆者，其安全距離得縮減為一公尺", "tag": "子法", "src": "new"}, {"id": "N-公危-020", "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第73條之1，有關容器串接使用場所供應設備之安全設施及管理，下列敘述何者錯誤？", "opts": {"A": "串接使用量超過一百二十公斤至三百公斤以下者，容器應與用火設備保持三公尺以上距離", "B": "容器串接使用場所串接使用量不得超過一千公斤", "C": "串接使用量在八十公斤以上至一百二十公斤以下者，燃氣用軟管長度不得超過一點八公尺", "D": "串接使用量超過三百公斤至一千公斤以下者，應設置自動緊急遮斷裝置"}, "answer": "A", "explain": "本辦法第73條之1第1項第2款明定，串接使用量超過一百二十公斤至三百公斤以下者，除應符合前款規定外，「容器並應與用火設備保持二公尺以上距離」，（A）誤為三公尺。（B）為同項本文；（C）為第1款第6目（並規定最小彎曲半徑一百十毫米以上）；（D）為第3款第1目，均屬正確。另同條第2項規定販賣場所經營者應於燃氣導管竣工檢查完成後十五日內，將資料報請當地消防機關備查。", "ref": "公危辦法§73-1Ⅰ②", "evidence": "容器並應與用火設備保持二公尺以上距離", "tag": "子法", "src": "new"}, {"id": "N-檢修-001", "subject": "刑事法", "topic": "消防法", "stem": "依消防安全設備檢修及申報辦法規定，下列何者非屬該辦法所定之消防安全設備檢修項目？", "opts": {"A": "滅火設備", "B": "警報設備", "C": "消防搶救上之必要設備", "D": "防火避難設施"}, "answer": "D", "explain": "依本辦法第2條，檢修項目為滅火設備、警報設備、避難逃生設備、消防搶救上之必要設備，以及其他經中央主管機關認定之消防安全設備或必要檢修項目等五類。防火避難設施（如防火區劃、直通樓梯、安全門）屬建築法令規範之範圍，並非本辦法所定之檢修項目，故D非屬之；應注意「避難逃生設備」與「防火避難設施」用語不同，不可混淆。", "ref": "檢修及申報辦法§2", "evidence": "五、其他經中央主管機關認定之消防安全設備或必要檢修項目。", "tag": "子法", "src": "new", "amend": "115-02-25 修正"}, {"id": "N-檢修-002", "subject": "刑事法", "topic": "消防法", "stem": "依消防安全設備檢修及申報辦法規定，「經由操作判別消防安全設備之性能是否正常」者，屬於下列何種檢修方式？", "opts": {"A": "外觀檢查", "B": "性能檢查", "C": "綜合檢查", "D": "機能檢查"}, "answer": "B", "explain": "依本辦法第3條，檢修方式分為三種：外觀檢查係經由外觀判別設備有無毀損及其配置是否適當；性能檢查係經由操作判別設備之性能是否正常；綜合檢查係經由設備整體性之運作或使用判別其機能。題幹所述「經由操作判別性能」即性能檢查（B）。本辦法並無「機能檢查」之檢修方式，D為虛構選項。", "ref": "檢修及申報辦法§3", "evidence": "二、性能檢查：經由操作判別消防安全設備之性能是否正常。", "tag": "子法", "src": "new", "amend": "115-02-25 修正"}, {"id": "N-檢修-003", "subject": "刑事法", "topic": "消防法", "stem": "依消防安全設備檢修及申報辦法規定，檢修人員及檢修機構於辦理消防安全設備檢修前，應確認其必要設備與器具已依中央主管機關公告之項目、週期，並由下列何者辦理檢驗或校準？", "opts": {"A": "場所所在地主管機關", "B": "消防設備師（士）公會", "C": "國內外第三公證機構", "D": "原設備製造或輸入廠商"}, "answer": "C", "explain": "依本辦法第6條第2項，檢修人員及檢修機構辦理檢修前，應確認辦理檢修之必要設備與器具（如附表二所列）已依中央主管機關公告之項目、週期及「國內外第三公證機構」辦理檢驗或校準，以確保量測數據可信，故選C。此為115年2月25日修正後強化檢修品質之重點規定，選項A、B、D均非法定之檢驗校準主體。", "ref": "檢修及申報辦法§6", "evidence": "應確認必要設備與器具已依中央主管機關公告之項目、週期及國內外第三公證機構辦理檢驗或校準", "tag": "子法", "src": "new", "amend": "115-02-25 修正"}, {"id": "N-檢修-004", "subject": "刑事法", "topic": "消防法", "stem": "依消防安全設備檢修及申報辦法關於檢修完成標示之規定，下列敘述何者錯誤？", "opts": {"A": "標示之規格、樣式應符合該辦法附表三規定", "B": "附加標示時，得覆蓋或換貼原新品出廠時之資訊", "C": "應以不易脫落之方式，於該辦法附表四規定位置附加標示", "D": "已附加檢修完成標示者，應先清除後再予附加標示"}, "answer": "B", "explain": "依本辦法第7條第1項，附加檢修完成標示時「不得」覆蓋、換貼或變更原新品出廠時之資訊，故B錯誤。其餘均為法定要求：標示規格樣式應符合附表三、以不易脫落方式於附表四規定位置附加、已附加者應先清除後再附加且不得混淆或不易辨識。未附加或經查有不實檢修者，場所所在地主管機關應命其附加或除去。", "ref": "檢修及申報辦法§7", "evidence": "附加標示時，不得覆蓋、換貼或變更原新品出廠時之資訊", "tag": "子法", "src": "new", "amend": "115-02-25 修正"}, {"id": "N-檢修-005", "subject": "刑事法", "topic": "消防法", "stem": "受託辦理檢修之檢修人員完成消防安全設備檢修後，除檢修報告書外，下列何者非屬應交付管理權人之文件？", "opts": {"A": "各該消防安全設備之種類及數量表", "B": "標註尺寸及面積之配置平面圖", "C": "檢修人員之執業執照影本", "D": "管理權人之身分證明文件影本"}, "answer": "D", "explain": "依本辦法第8條第1項，受託檢修者應將檢修報告書（附表五）及四項文件交付管理權人：設備種類及數量表、標註尺寸面積之配置平面圖、檢修人員執業執照影本（檢修機構並加附檢修機構證書影本）、檢修人員加入直轄市縣（市）消防設備師（士）公會之會員證書影本。管理權人身分證明文件影本係第9條管理權人向主管機關申報時應檢附者，非交付文件，故D。", "ref": "檢修及申報辦法§8", "evidence": "並將檢修報告書（如附表五）及下列文件交付管理權人", "tag": "子法", "src": "new", "amend": "115-02-25 修正"}, {"id": "N-檢修-006", "subject": "刑事法", "topic": "消防法", "stem": "依消防安全設備檢修及申報辦法規定，關於檢修報告書之填具及應檢修設備之範圍，下列敘述何者正確？", "opts": {"A": "管理權人自行檢修滅火器、標示設備或緊急照明燈者，免填具檢修報告書", "B": "於會勘通過之合法場所，應檢修者為該場所現有之消防安全設備", "C": "管理權人依規定檢修滅火器、標示設備或緊急照明燈，應填具檢修報告書", "D": "於違規使用場所，應檢修者為消防安全設備竣工圖說所載之項目"}, "answer": "C", "explain": "依本辦法第8條第2項，管理權人依第3條及第4條規定自行檢修滅火器、標示設備或緊急照明燈者，仍「應填具」前項檢修報告書，故C正確、A錯誤。同條第3項規定：於主管機關會勘通過之合法場所，應檢修者為消防安全設備「竣工圖說所載項目」；於違規使用場所，則為該場所「現有」之消防安全設備，故B、D恰好對調而錯誤。", "ref": "檢修及申報辦法§8", "evidence": "管理權人依第三條及第四條規定檢修滅火器、標示設備或緊急照明燈消防安全設備，應填具前項檢修報告書", "tag": "子法", "src": "new", "amend": "115-02-25 修正"}, {"id": "N-檢修-007", "subject": "刑事法", "topic": "消防法", "stem": "檢修結果有消防安全設備不符規定者，管理權人應立即改善並檢附改善完成證明文件。下列何種情形致立即改善有困難，得先行檢附消防安全設備改善計畫書代之？", "opts": {"A": "集合住宅改善消防安全設備，應經召開管理委員會或區分所有權人會議之程序", "B": "場所因營業旺季無法暫停營業，而自行決定延後施工改善", "C": "場所管理權人與受託檢修之消防設備士就改善費用尚有爭議", "D": "場所已委託檢修機構辦理下一次定期消防安全設備檢修"}, "answer": "A", "explain": "依本辦法第9條第2款，檢修結果不符規定者原則應立即改善並檢附改善完成證明文件；僅於三種情形致立即改善有困難時，得先檢附改善計畫書（附表七）代之：集合住宅須經管理委員會或區分所有權人會議程序、政府機關（構）或公營事業機構須依政府採購法招標程序、其他經場所所在地主管機關同意之事由。B、C、D均非法定事由。", "ref": "檢修及申報辦法§9", "evidence": "集合住宅改善消防安全設備，應經召開管理委員會或區分所有權人會議之程序。", "tag": "子法", "src": "new", "amend": "115-02-25 修正"}, {"id": "N-檢修-008", "subject": "刑事法", "topic": "消防法", "stem": "各類場所所在之建築物整棟已無使用，而欲免定期辦理消防安全設備檢修及申報者，下列敘述何者正確？", "opts": {"A": "管理權人應檢具申請書等文件，報請場所所在地主管機關審核同意後，始得免辦", "B": "只要建築物內部之場所均已歇業或停業，即當然免予檢修及申報", "C": "應向中央主管機關申請核准，並由中央主管機關公告免辦場所名單", "D": "因地震致建築物毀損無法使用者，不屬於整棟已無使用之認定情形"}, "answer": "A", "explain": "依本辦法第11條第2項，管理權人應檢具申請書（附表九）、建築物所有權狀影本、身分證明文件影本、符合使用狀態及管理狀態之證明文件或照片、整棟建築物自主安全管理措施等，報請「場所所在地主管機關」審核同意後，始得免定期辦理檢修及申報，故A正確、C錯誤。另同條第1項須同時符合使用狀態與管理狀態基準，並非歇業即當然免辦（B錯）；因地震毀損無法使用正屬認定情形之一（D錯）。", "ref": "檢修及申報辦法§11", "evidence": "管理權人應檢具下列文件報請場所所在地主管機關審核同意後，始得免定期辦理消防安全設備檢修及申報", "tag": "子法", "src": "new", "amend": "115-02-25 修正"}, {"id": "N-檢修-009", "subject": "刑事法", "topic": "消防法", "stem": "經主管機關會勘通過並依法取得使用執照等證明文件之合法場所，於該證明文件申請範圍內之消防安全設備，管理權人免辦理當次檢修及申報之期間，下列何者正確？", "opts": {"A": "甲類場所距申報期限在三個月以內；甲類以外場所在六個月以內", "B": "甲類及甲類以外場所，一律以距申報期限在一年以內者為限", "C": "甲類場所距申報期限在一年以內；甲類以外場所在二年以內", "D": "甲類場所距申報期限在六個月以內；甲類以外場所在一年以內"}, "answer": "D", "explain": "依本辦法第12條，經會勘通過並取得使用執照、變更使用執照或室內裝修許可等證明文件之合法場所，於該文件申請範圍內之消防安全設備，自證明文件核發日起算，甲類場所距申報期限在六個月以內、甲類以外場所距申報期限在一年以內者，管理權人免辦理當次檢修及申報，故D正確。因會勘時設備已經查驗，短期內重複檢修並無實益，故明定免辦當次。", "ref": "檢修及申報辦法§12", "evidence": "一、甲類場所：自該證明文件核發之日期起算，距申報期限在六個月以內。", "tag": "子法", "src": "new", "amend": "115-02-25 修正"}, {"id": "N-檢修-010", "subject": "刑事法", "topic": "消防法", "stem": "消防安全設備檢修及申報辦法於中華民國一百十五年二月二十五日修正發布，關於其施行日期之規定，下列何者正確？", "opts": {"A": "全部條文一律自發布日施行", "B": "全部條文一律自一百十五年九月一日施行", "C": "除第七條附表三自一百十五年九月一日施行外，自發布日施行", "D": "除第七條附表三自一百十六年一月一日施行外，自發布日施行"}, "answer": "C", "explain": "依本辦法第13條，本辦法除中華民國一百十五年二月二十五日修正發布之第七條附表三自一百十五年九月一日施行外，自發布日施行，故C正確。第7條附表三為檢修完成標示之規格、樣式，因業者須重新製作標示、消耗既有庫存，故給予緩衝期而延至同年九月一日始施行，其餘條文則自發布日生效。", "ref": "檢修及申報辦法§13", "evidence": "本辦法除中華民國一百十五年二月二十五日修正發布之第七條附表三自一百十五年九月一日施行外，自發布日施行", "tag": "子法", "src": "new", "amend": "115-02-25 修正"}, {"id": "N-防管-001", "subject": "刑事法", "topic": "消防法", "stem": "依防火管理人訓練與專業機構登錄及管理辦法規定，防火管理人初訓之訓練時數及退訓標準，下列何者正確？", "opts": {"A": "訓練時數不得少於十二小時，缺課時數達二小時以上者應予退訓", "B": "訓練時數不得少於十二小時，缺課時數達一小時以上者應予退訓", "C": "訓練時數不得少於十四小時，缺課時數達二小時以上者應予退訓", "D": "訓練時數不得少於十六小時，缺課時數達四小時以上者應予退訓"}, "answer": "A", "explain": "依本辦法第4條，防火管理人初訓訓練時數不得少於十二小時，項目含消防知識及火災預防、消防安全設備及防火避難設施、員工教育及自衛消防編組訓練、消防防護計畫與測驗；未參與測驗或缺課時數達二小時以上者應予退訓，故A正確。十四小時為服勤人員初訓、十六小時為液化石油氣零售業安全技術人員初訓之時數，切勿混淆。", "ref": "防火管理人訓練辦法§4", "evidence": "前條第一項初訓訓練時數不得少於十二小時，其訓練項目如下", "tag": "子法", "src": "new"}, {"id": "N-防管-002", "subject": "刑事法", "topic": "消防法", "stem": "依防火管理人訓練與專業機構登錄及管理辦法規定，取得防火管理人資格者之複訓期程與複訓訓練時數，下列何者正確？", "opts": {"A": "自初訓結束之日起每二年至少複訓一次，複訓時數不得少於八小時", "B": "自初訓結束之日起每三年至少複訓一次，複訓時數不得少於六小時", "C": "自初訓結束之日起每三年至少複訓一次，複訓時數不得少於七小時", "D": "自初訓結束之日起每二年至少複訓一次，複訓時數不得少於六小時"}, "answer": "B", "explain": "依本辦法第3條第2項，取得防火管理人資格者應自初訓結束之日起每三年至少接受複訓一次；第5條規定複訓訓練時數不得少於六小時，項目為防火管理對策、自衛消防編組實施要領及測驗，未參與測驗或缺課達一小時以上者應予退訓，故B正確。每二年複訓、複訓八小時者為液化石油氣零售業安全技術人員；複訓七小時者為服勤人員。", "ref": "防火管理人訓練辦法§5", "evidence": "第三條第一項複訓訓練時數不得少於六小時，其訓練項目如下", "tag": "子法", "src": "new"}, {"id": "N-防管-003", "subject": "刑事法", "topic": "消防法", "stem": "下列何者不符合防火管理人訓練與專業機構登錄及管理辦法所定防火管理人訓練講師之資格？", "opts": {"A": "於大專校院教授消防相關學程，並有五年以上授課經驗", "B": "具有消防設備士執業執照，並有三年以上相關工作經驗", "C": "任職於主管機關，並有五年以上辦理防火管理業務經驗", "D": "具有消防系所碩士以上學位，並有二年以上消防相關工作經驗"}, "answer": "B", "explain": "依本辦法第6條第1項，講師資格為：大專校院教授消防相關學程五年以上授課經驗、任職主管機關五年以上辦理防火管理業務經驗、具「消防設備師」執業執照三年以上相關工作經驗、消防系所碩士以上學位二年以上工作經驗、消防科系副學士以上學位或消防警佐班結業並任警正三階或薦任七職等以上職務一年以上年資。條文限於消防設備師，不及於消防設備士，故B不符。", "ref": "防火管理人訓練辦法§6", "evidence": "三、具有消防設備師執業執照，並有三年以上相關工作經驗。", "tag": "子法", "src": "new"}, {"id": "N-防管-004", "subject": "刑事法", "topic": "消防法", "stem": "依防火管理人訓練與專業機構登錄及管理辦法規定，關於防火管理人訓練之測驗方式與合格證書，下列何者正確？", "opts": {"A": "測驗採筆試及實作測驗方式，測驗成績均以六十分為合格", "B": "測驗以筆試行之，成績以七十分為合格，合格證書有效期間為二年", "C": "測驗以筆試行之，成績以六十分為合格，合格證書有效期間為三年", "D": "測驗採筆試及術科實作方式，合格證書有效期間為二年"}, "answer": "C", "explain": "依本辦法第8條，防火管理人訓練之測驗方式「以筆試行之」，測驗成績以六十分為合格，筆試題目由中央主管機關統一製作題庫於網頁公告；第9條第1項規定合格證書應載明初訓或複訓，生效日自訓練結束之日起算，有效期間為三年，故C正確。採筆試及實作測驗者為服勤人員訓練，採筆試及術科實作且證書二年者為液化石油氣零售業安全技術人員訓練。", "ref": "防火管理人訓練辦法§8", "evidence": "防火管理人訓練之測驗方式以筆試行之，測驗成績以六十分為合格", "tag": "子法", "src": "new"}, {"id": "N-防管-005", "subject": "刑事法", "topic": "消防法", "stem": "主管機關施予防火管理人訓練，其學員名冊、成績冊及測驗卷等資料之最低保存年限，與受訓學員一覽表等資料之上傳期限，下列何者正確？", "opts": {"A": "自訓練結束之日起至少保存三年；應於每月二十五日前上傳", "B": "自訓練結束之日起至少保存三年；應於每月十五日前上傳", "C": "自訓練結束之日起至少保存四年；應於每月二十五日前上傳", "D": "自訓練結束之日起至少保存五年；應於每月二十五日前上傳"}, "answer": "C", "explain": "依本辦法第10條，主管機關施予防火管理人訓練之學員名冊、成績冊及測驗卷，課程表、講師及學員簽到紀錄，發給合格證書清冊等資料，自訓練結束之日起至少應保存四年；並應於每月二十五日前，將前一月受訓學員一覽表、授課滿意度問卷及授課滿意度月報表上傳至中央主管機關指定之資訊系統，故C正確。保存三年者為液化石油氣零售業安全技術人員訓練。", "ref": "防火管理人訓練辦法§10", "evidence": "主管機關 為三年", "B": "由直轄市、縣（市）主管機關發給，有效期間為二年", "C": "由專業機構發給，有效期間為三年，生效日自發證之日起算", "D": "由專業機構發給，有效期間為二年，生效日自訓練結束之日起算"}, "answer": "D", "explain": "依本辦法第17條第1項，經安全技術人員訓練合格者，由「專業機構」發給合格證書，載明初訓或複訓，生效日自訓練結束之日起算，有效期間為二年，故D正確。證書遺失或毀損者向原發給之專業機構申請補發或換發，該機構不得拒絕。相對地，防火管理人及服勤人員之合格證書係由主管機關發給，有效期間為三年，發證主體與年限均不同。", "ref": "液石安全技術人員訓練辦法§17", "evidence": "專業機構應發給合格證書，載明初訓或複訓，其生效日自訓練結束之日起算，有效期間為二年", "tag": "子法", "src": "new"}, {"id": "N-液石-006", "subject": "刑事法", "topic": "消防法", "stem": "專業機構施予液化石油氣零售業安全技術人員訓練之學員名冊、成績冊及測驗卷等資料，自訓練結束之日起應至少保存多久？並應於每月何時前上傳受訓學員一覽表等資料？", "opts": {"A": "保存二年；每月十五日前", "B": "保存三年；每月二十五日前", "C": "保存四年；每月二十五日前", "D": "保存五年；每月十五日前"}, "answer": "B", "explain": "依本辦法第18條，專業機構施予安全技術人員訓練之學員名冊、成績冊及測驗卷，課程表、講師及學員簽到紀錄，發給合格證書清冊等資料，自訓練結束之日起應至少保存三年；並應於每月二十五日前，將前一月受訓學員一覽表、授課滿意度問卷及授課滿意度月報表上傳至中央主管機關指定之資訊系統，故B正確。防火管理人及服勤人員訓練之資料保存年限則為四年。", "ref": "液石安全技術人員訓練辦法§18", "evidence": "專業機構施予安全技術人員訓練之下列資料，自訓練結束之日起，應至少保存三年", "tag": "子法", "src": "new"}, {"id": "N-液石-007", "subject": "刑事法", "topic": "消防法", "stem": "下列何者不符合液化石油氣零售業安全技術人員訓練專業機構登錄及管理辦法所定訓練講師之資格？", "opts": {"A": "現任或曾任警正或薦任以上公務人員，並有二年以上辦理液化石油氣業務經驗", "B": "於大專校院教授液化石油氣相關學程，並有二年以上授課經驗", "C": "具有液化石油氣業五年以上工作經驗，並經產業相關同業公會推薦", "D": "具有消防設備師執業執照，並有三年以上相關工作經驗"}, "answer": "D", "explain": "依本辦法第12條第1項，安全技術人員訓練講師資格限於三種：現任或曾任警正或薦任以上公務人員並有二年以上辦理液化石油氣業務經驗、於大專校院教授液化石油氣相關學程並有二年以上授課經驗、具液化石油氣業五年以上工作經驗並經產業相關同業公會推薦。「具消防設備師執業執照三年以上工作經驗」係防火管理人及服勤人員訓練講師之資格，本辦法並未列入，故D不符。", "ref": "液石安全技術人員訓練辦法§12", "evidence": "一、現任或曾任警正或薦任以上公務人員，並有二年以上辦理液化石油氣業務經驗。", "tag": "子法", "src": "new"}, {"id": "N-服勤-001", "subject": "刑事法", "topic": "消防法", "stem": "依服勤人員訓練與專業機構登錄及管理辦法規定，服勤人員初訓之訓練時數不得少於多少小時？缺課時數達多久以上者應予退訓？", "opts": {"A": "十四小時；二小時", "B": "十二小時；二小時", "C": "十四小時；四小時", "D": "十六小時；一小時"}, "answer": "A", "explain": "依本辦法第4條，服勤人員初訓訓練時數不得少於十四小時，項目含防火管理與防災管理之意義及制度、服勤人員角色與職責、基礎救護（含實作測驗）、綜合操作裝置與消防安全設備及防火避難設施之知識及操作、火災及地震之緊急應變綜合訓練（含實作測驗）、筆試測驗；未參與實作或筆試測驗、或缺課達二小時以上者應予退訓，故A正確。", "ref": "服勤人員訓練辦法§4", "evidence": "前條第一項初訓訓練時數不得少於十四小時，其訓練項目如下", "tag": "子法", "src": "new"}, {"id": "N-服勤-002", "subject": "刑事法", "topic": "消防法", "stem": "依服勤人員訓練與專業機構登錄及管理辦法規定，服勤人員之複訓期程與複訓訓練時數，下列何者正確？", "opts": {"A": "每二年至少複訓一次，複訓訓練時數不得少於七小時", "B": "每三年至少複訓一次，複訓訓練時數不得少於六小時", "C": "每三年至少複訓一次，複訓訓練時數不得少於七小時", "D": "每三年至少複訓一次，複訓訓練時數不得少於八小時"}, "answer": "C", "explain": "依本辦法第3條第2項，取得服勤人員資格者應自初訓結束之日起每三年至少接受複訓一次；第5條規定複訓訓練時數不得少於七小時，項目含防火管理、防災管理及消防安全設備法規制度、火災及地震案例分析、綜合操作裝置與消防安全設備及防火避難設施之操作、火災及地震之緊急應變綜合訓練（含實作測驗）、筆試測驗，故C正確。六小時為防火管理人、八小時為液化石油氣安全技術人員之複訓時數。", "ref": "服勤人員訓練辦法§5", "evidence": "第三條第一項複訓訓練時數不得少於七小時，其訓練項目如下", "tag": "子法", "src": "new"}, {"id": "N-服勤-003", "subject": "刑事法", "topic": "消防法", "stem": "依服勤人員訓練與專業機構登錄及管理辦法規定，服勤人員訓練之測驗方式與合格標準，下列何者正確？", "opts": {"A": "測驗以筆試行之，測驗成績以六十分為合格", "B": "初訓採筆試及實作測驗，複訓僅採筆試，均以六十分為合格", "C": "測驗採筆試及實作測驗方式，測驗成績均以七十分為合格", "D": "測驗採筆試及實作測驗方式，測驗成績均以六十分為合格"}, "answer": "D", "explain": "依本辦法第8條，服勤人員訓練之測驗「採筆試及實作測驗方式」，測驗成績均以六十分為合格，筆試題目由中央主管機關統一製作題庫於網頁公告並不定期更新，故D正確。防火管理人訓練僅以筆試行之（A）；初訓採筆試及術科實作、複訓僅採筆試者為液化石油氣零售業安全技術人員訓練（B），三者之測驗方式設計不同，但合格分數均為六十分。", "ref": "服勤人員訓練辦法§8", "evidence": "服勤人員訓練之測驗採筆試及實作測驗方式，測驗成績均以六十分為合格", "tag": "子法", "src": "new"}, {"id": "N-服勤-004", "subject": "刑事法", "topic": "消防法", "stem": "申請服勤人員訓練專業機構登錄者，其訓練場地應符合之規定，下列何者正確？", "opts": {"A": "設有二組以上不同廠牌之綜合操作裝置，面積應超過六十平方公尺", "B": "設有一組以上之綜合操作裝置，面積應超過四十五平方公尺", "C": "設有二組以上同一廠牌之綜合操作裝置，面積應超過四十五平方公尺", "D": "設有三組以上不同廠牌之綜合操作裝置，面積應超過一百平方公尺"}, "answer": "A", "explain": "依本辦法第11條第2項，服勤人員訓練場地應設有二組以上「不同廠牌」之綜合操作裝置供分組上課使用，並可監控或操作火警自動警報設備受信總機、緊急廣播設備、緊急發電機、各式滅火設備加壓送水裝置、排煙設備等；面積應超過六十平方公尺，且每一學員平均使用面積在一點五平方公尺以上，故A正確。面積超過四十五平方公尺者為防火管理人及液化石油氣訓練場地之要求。", "ref": "服勤人員訓練辦法§11", "evidence": "設有二組以上不同廠牌之綜合操作裝置，供分組上課使用", "tag": "子法", "src": "new"}, {"id": "N-服勤-005", "subject": "刑事法", "topic": "消防法", "stem": "下列何者不符合服勤人員訓練與專業機構登錄及管理辦法所定服勤人員訓練講師之資格？", "opts": {"A": "綜合操作裝置開發、製造、測試或操作專業人員，並有三年以上相關工作經驗", "B": "具有機械、電機或電子工程技師證書，並有三年以上相關工作經驗", "C": "救護技術員管理辦法所定之初級救護技術員，並有三年以上緊急醫療救護工作經驗", "D": "於大專校院教授消防或防災相關學程，並有五年以上授課經驗"}, "answer": "C", "explain": "依本辦法第6條第1項第5款，講師資格中與救護相關者，限於醫師、護理人員，或救護技術員管理辦法所定之「高級、中級」救護技術員，並有三年以上緊急醫療救護工作經驗；初級救護技術員並未列入，故C不符。其餘選項均為法定資格：綜合操作裝置專業人員三年以上經驗、機械電機電子工程技師三年以上經驗、大專校院教授消防或防災相關學程五年以上授課經驗。", "ref": "服勤人員訓練辦法§6", "evidence": "醫師、護理人員或救護技術員管理辦法所定之高級、中級救護技術員，並有三年以上緊急醫療救護工作經驗", "tag": "子法", "src": "new"}, {"id": "N-服勤-006", "subject": "刑事法", "topic": "消防法", "stem": "依服勤人員訓練與專業機構登錄及管理辦法規定，關於專業機構之處分，下列何者正確？", "opts": {"A": "一年內累計警告達二次以上者，中央主管機關即應停止其施予訓練", "B": "經廢止登錄者，自廢止登錄之日起一年內不得申請登錄", "C": "受廢止登錄者，應於受廢止登錄之次日起十五日內繳回登錄證書", "D": "一年內累計警告達三次以上者，應停止其施予訓練三個月以上六個月以下"}, "answer": "D", "explain": "依本辦法第23條，專業機構一年內累計警告達三次以上、經通知限期改善屆期未改善、委託未經登錄之機構辦理招生及訓練、由未經審查合格之講師授課者，中央主管機關應停止其施予服勤人員訓練三個月以上六個月以下，故D正確、A錯誤。依第24條，因詐欺脅迫賄賂申請登錄或有該條第1項第3款至第8款情形遭撤銷或廢止登錄者，三年內不得申請登錄，並應於次日起三十日內繳回登錄證書，故B、C錯誤。", "ref": "服勤人員訓練辦法§23", "evidence": "中央主管機關應停止其施予服勤人員訓練三個月以上六個月以下", "tag": "子法", "src": "new"}, {"id": "N-住警-001", "subject": "刑事法", "topic": "消防法", "stem": "依住宅用火災警報器設置辦法規定，住宅用火災警報器之安裝方式，下列何者錯誤？", "opts": {"A": "裝置於天花板或樓板者，警報器下端距離天花板或樓板六十公分以內", "B": "裝置於天花板或樓板者，應裝設於距離牆面或樑六十公分以上之位置", "C": "裝置於牆面者，應距天花板或樓板下方十五公分以上五十公分以下", "D": "應距離出風口一公尺以上，並以裝置於居室出入口處為原則"}, "answer": "D", "explain": "依本辦法第4條，住宅用火災警報器應距離出風口「一點五公尺」以上，且以裝置於「居室中心」為原則，故D之一公尺及出入口處均錯誤；設定距出風口距離之目的在避免氣流稀釋煙流而延誤動作。A、B、C均為法定安裝方式：裝於天花板或樓板者下端距天花板或樓板六十公分以內、距牆面或樑六十公分以上；裝於牆面者距天花板或樓板下方十五公分以上五十公分以下。", "ref": "住宅用火災警報器設置辦法§4", "evidence": "三、距離出風口一點五公尺以上。", "tag": "子法", "src": "new"}, {"id": "N-住警-002", "subject": "刑事法", "topic": "消防法", "stem": "依住宅用火災警報器設置辦法規定，住宅用火災警報器之安裝位置，下列敘述何者正確？", "opts": {"A": "僅需安裝於寢室及廚房，樓梯部分一律不必設置", "B": "有寢室之樓層樓梯應設置，但該樓層為避難層者，不在此限", "C": "任一樓層有超過五平方公尺之居室達七間以上者，設於走廊", "D": "僅避難層有寢室者，設於通往上層樓梯之最底層"}, "answer": "B", "explain": "依本辦法第3條第1項，住宅用火災警報器應安裝於寢室、旅館客房或其他供就寢用之居室、廚房及樓梯；其中樓梯部分，有寢室之樓層應設置，但該樓層為避難層者不在此限，故B正確、A錯誤。僅避難層有寢室者，設於通往上層樓梯之「最頂層」（D錯）；非屬前三款且任一樓層有超過「七平方公尺」之居室達「五間」以上者設於走廊，無走廊者設於樓梯，故C之數字對調而錯誤。", "ref": "住宅用火災警報器設置辦法§3", "evidence": "有寢室之樓層。但該樓層為避難層者，不在此限。", "tag": "子法", "src": "new"}, {"id": "N-住警-003", "subject": "刑事法", "topic": "消防法", "stem": "依住宅用火災警報器設置辦法規定，設有符合各類場所消防安全設備設置標準之自動撒水設備者，於該有效範圍內得免設住宅用火災警報器，其密閉型撒水頭應符合下列何項條件？", "opts": {"A": "標示溫度在七十五度以下，動作時間在六十秒以內", "B": "標示溫度在七十五度以下，動作時間在三十秒以內", "C": "標示溫度在九十六度以下，動作時間在六十秒以內", "D": "標示溫度在六十度以下，動作時間在九十秒以內"}, "answer": "A", "explain": "依本辦法第3條第2項，設有符合各類場所消防安全設備設置標準之自動撒水設備或同等性能以上之滅火設備者，於該有效範圍內得免設住宅用火災警報器，但限使用標示溫度在七十五度以下、動作時間在六十秒以內之密閉型撒水頭，故A正確。此係因唯有低標示溫度且速動型之撒水頭，方能在火災初期即動作而達到與警報器相當之早期反應效果。", "ref": "住宅用火災警報器設置辦法§3", "evidence": "限使用標示溫度在七十五度以下，動作時間在六十秒以內之密閉型撒水頭", "tag": "子法", "src": "new"}, {"id": "N-住警-004", "subject": "刑事法", "topic": "消防法", "stem": "依住宅用火災警報器設置辦法規定，關於住宅用火災警報器之電源、維護及更換，下列何者錯誤？", "opts": {"A": "以電池為電源者，於達電壓下限發出提示或聲響時，管理權人即更換電池", "B": "具備自動試驗功能者，於出現功能異常訊息時更換之", "C": "不具備自動試驗功能者，於使用期限屆滿前更換之", "D": "使用電池以外之外部電源者，其電源和分電盤間之配線應設置專用開關"}, "answer": "D", "explain": "依本辦法第7條第2項，使用電池以外外部電源者，其電源和分電盤間之配線「不得設置插座或開關」，並應符合屋內配線裝置規則規定，以免遭誤切斷而喪失功能，故D錯誤。A為第6條規定；B、C為第8條第1項規定：具自動試驗功能者於出現功能異常訊息時更換，不具備者於使用期限屆滿前更換；此外管理權人並應依使用說明書檢查並維持功能正常。", "ref": "住宅用火災警報器設置辦法§7", "evidence": "前項電源和分電盤間之配線，不得設置插座或開關，並符合屋內配線裝置規則規定", "tag": "子法", "src": "new"}, {"id": "N-住警-005", "subject": "刑事法", "topic": "消防法", "stem": "依住宅用火災警報器設置辦法規定，消防法第六條第四項所定之場所，於該法中華民國九十九年五月二十一日修正生效前既設者，應於何時以前設置住宅用火災警報器？", "opts": {"A": "一百年三月三十一日", "B": "一百年十二月三十一日", "C": "一百零一年十二月三十一日", "D": "一百零六年十二月三十一日"}, "answer": "B", "explain": "依本辦法第9條第1項，消防法第六條第四項規定之場所，於該法九十九年五月二十一日修正生效前既設者，應於一百年十二月三十一日以前設置住宅用火災警報器，故B正確。同條第2項規定，該等場所於九十九年五月二十一日至本辦法發布生效前有新建、增建、改建或用途變更者，應於一百年三月三十一日以前設置（A）；第10條所定消防法第六條第五項場所既設者，則為一百零六年十二月三十一日（D）。", "ref": "住宅用火災警報器設置辦法§9", "evidence": "應於一百年十二月三十一日以前設置住宅用火災警報器", "tag": "子法", "src": "new"}, {"id": "N-明火-001", "subject": "刑事法", "topic": "消防法", "stem": "依明火表演安全管理辦法規定，管理權人申請明火表演許可，表演期間應投保公共意外責任險，其最低保險金額下列何者錯誤？", "opts": {"A": "每一個人身體傷亡：新臺幣一百萬元", "B": "每一事故身體傷亡：新臺幣五百萬元", "C": "每一事故財產損失：新臺幣三百萬元", "D": "表演期間總保險金額：新臺幣一千二百萬元"}, "answer": "C", "explain": "依本辦法第3條第3款，申請明火表演許可者，表演期間應投保公共意外責任險，最低保險金額為：每一個人身體傷亡新臺幣一百萬元、每一事故身體傷亡新臺幣五百萬元、每一事故財產損失新臺幣一百萬元、表演期間總保險金額新臺幣一千二百萬元。故C之三百萬元錯誤，應為一百萬元。另依第5條，取得防火標章證明文件者，得免附保險證明文件。", "ref": "明火表演安全管理辦法§3", "evidence": "每一事故財產損失：新臺幣一百萬元。", "tag": "子法", "src": "new"}, {"id": "N-明火-002", "subject": "刑事法", "topic": "消防法", "stem": "依明火表演安全管理辦法規定，明火表演許可之有效期限及其展延，下列何者正確？", "opts": {"A": "有效期限為三個月，期限屆滿十五日前得申請展延，展延期限為三個月", "B": "有效期限為一個月，期限屆滿十五日前得申請展延，展延期限為一個月", "C": "有效期限為三個月，期限屆滿三十日前得申請展延，展延期限為六個月", "D": "有效期限為六個月，期限屆滿十五日前得申請展延，展延期限為三個月"}, "answer": "A", "explain": "依本辦法第5條第4項，明火表演許可之有效期限為三個月；期限屆滿十五日前，得檢附同條第1項所定文件申請展延，展延期限為三個月，故A正確。應注意申請許可本身係「於表演活動開始三十日前」檢具文件報請轄區主管機關審查，取得許可書後始得為之，與展延之十五日前期間不同，易生混淆。", "ref": "明火表演安全管理辦法§5", "evidence": "第一項許可之有效期限為三個月。期限屆滿十五日前，得檢附第一項文件申請展延，展延期限為三個月。", "tag": "子法", "src": "new"}, {"id": "N-明火-003", "subject": "刑事法", "topic": "消防法", "stem": "主管機關受理明火表演申請，除採書面審核外，得會同相關機關於受理申請次日起多久內實地勘查？該表演場所之管理權人應如何配合？", "opts": {"A": "七日內實地勘查；僅需事先提供書面安全防護措施計畫即可", "B": "三十日內實地勘查；應派員說明安全防護措施，無須演練應變機制", "C": "三十日內實地勘查；得由防火管理人以書面代為說明表演情形", "D": "十五日內實地勘查；應派員說明安全防護措施及表演情形，並演練災害發生時之應變機制"}, "answer": "D", "explain": "依本辦法第9條第1項，主管機關受理明火表演申請，除書面審核外，得會同都市計畫、建築管理或其他目的事業主管機關等單位，於受理申請次日起十五日內實地勘查；表演場所管理權人應派員說明相關安全防護措施及表演情形，並演練災害發生時之應變機制，故D正確。同條第2項並規定主管機關於許可後得派員抽查第6條至第8條、第10條至第12條規定內容及現場督導防火安全機制。", "ref": "明火表演安全管理辦法§9", "evidence": "於受理申請次日起十五日內實地勘查，該表演場所之管理權人，應派員說明相關安全防護措施及表演情形", "tag": "子法", "src": "new"}, {"id": "N-明火-004", "subject": "刑事法", "topic": "消防法", "stem": "依明火表演安全管理辦法規定，明火表演所在樓層關於直通樓梯及步行路徑之要求，下列何者正確？", "opts": {"A": "應有一座以上直通樓梯通達避難層，步行路徑重複部分不得大於最大容許步行距離二分之一", "B": "應有二座以上直通樓梯通達避難層，步行路徑重複部分不得大於最大容許步行距離三分之一", "C": "應有二座以上直通樓梯通達避難層，任一點至該樓梯之步行路徑重複部分不得大於最大容許步行距離二分之一", "D": "應有三座以上直通樓梯通達避難層，且任一點至該樓梯之步行路徑不得有重複之情形"}, "answer": "C", "explain": "依本辦法第3條第2款第2目，明火表演所在樓層應有二座以上直通樓梯通達避難層，且任一點至該樓梯之步行路徑重複部分之長度，不得大於最大容許步行距離二分之一，故C正確。此即雙向避難原則之具體化，避免避難路徑過度重疊而形成單一瓶頸。同款另要求場所應符合土地使用管制及建築法令、已依原有合法建築物防火避難設施及消防設備改善辦法改善完竣、五年內未曾經撤銷或廢止明火表演許可。", "ref": "明火表演安全管理辦法§3", "evidence": "明火表演所在樓層應有二座以上直通樓梯通達避難層", "tag": "子法", "src": "new"}, {"id": "N-明火-005", "subject": "刑事法", "topic": "消防法", "stem": "依明火表演安全管理辦法規定，下列何種情形之表演場所管理權人，不得申請明火表演許可？", "opts": {"A": "曾違反本辦法規定，依消防法第四十一條之一規定裁處未滿五年者", "B": "曾違反本辦法規定，依消防法第四十一條之一規定裁處未滿三年者", "C": "八年前曾經主管機關廢止明火表演許可，其後未再違規者", "D": "曾未經許可擅自從事明火表演，經主管機關勸導後已改善完竣者"}, "answer": "A", "explain": "依本辦法第4條，表演場所管理權人曾違反本辦法規定，依消防法第四十一條之一規定裁處未滿五年者，不得申請明火表演許可，故A正確、B之三年錯誤。另依第3條第2款第4目，表演場所應符合「五年內未曾經主管機關撤銷或廢止明火表演許可」，八年前遭廢止者已逾五年，不受限制，故C非不得申請之情形；D亦非法定不得申請之事由。", "ref": "明火表演安全管理辦法§4", "evidence": "依本法第四十一條之一規定裁處未滿五年者，不得申請明火表演許可", "tag": "子法", "src": "new"}, {"id": "F-N1-001", "topic": "燃燒", "stem": "從火災學的立場，「燃燒」最適切的定義為何？", "opts": {"A": "只要有氧化反應發生即屬之", "B": "伴同發熱與發光之氧化現象", "C": "伴同發熱但不需發光之還原現象", "D": "物質吸收熱量後產生之相變化"}, "answer": "B", "explain": "火災學定義燃燒為伴同發熱與發光的氧化現象，必須同時發熱、發光且為氧化；單純氧化或吸熱相變都不符合。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-002", "topic": "燃燒", "stem": "下列何種現象依火災學定義屬於燃燒？", "opts": {"A": "鐵板在潮濕環境中生銹", "B": "鎳線通電後的赤熱現象", "C": "酒精點火後產生火焰", "D": "食鹽溶於水中"}, "answer": "C", "explain": "酒精燃燒同時發熱發光且為氧化；鐵生銹沒有發熱發光、鎳線赤熱並非伴同發光之氧化燃燒，故均非燃燒。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-003", "topic": "滅火", "stem": "燃燒四要素與滅火方法的對應，下列何者正確？", "opts": {"A": "可燃物－窒息法", "B": "熱能－移除法", "C": "助燃物－冷卻法", "D": "連鎖反應－抑制法"}, "answer": "D", "explain": "可燃物對移除法、助燃物（氧）對窒息法、熱能對冷卻法、連鎖反應對抑制法。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-004", "topic": "滅火", "stem": "下列四種滅火方法中，何者屬於化學性滅火？", "opts": {"A": "冷卻法", "B": "窒息法", "C": "抑制法", "D": "移除法"}, "answer": "C", "explain": "抑制法是移除火場自由基以中斷連鎖反應，屬化學作用；其餘三者都是物理作用。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-005", "topic": "滅火", "stem": "森林火災時開闢防火巷以避免林木延燒，係運用何種滅火原理？", "opts": {"A": "窒息法", "B": "移除法（隔離法）", "C": "冷卻法", "D": "抑制法"}, "answer": "B", "explain": "開闢防火巷是把可燃物移開、斷絕供應，屬移除法（隔離法）。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-006", "topic": "滅火", "stem": "以惰性氣體進行窒息滅火時，一般認為須將空氣中氧濃度由 21% 降至約多少，火即熄滅？", "opts": {"A": "18%", "B": "10%", "C": "5%", "D": "15%"}, "answer": "D", "explain": "窒息法是加入惰性氣體使氧濃度由 21% 降至 15% 左右，火即熄滅。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-007", "topic": "燃燒", "stem": "以莫耳燃燒熱與熱傳導率定義可燃物時，其條件為何？", "opts": {"A": "發熱量 100 kcal/mole 以上，且熱傳導率約 0.001 kcal/cm·sec·℃ 以下", "B": "發熱量 100 kcal/mole 以下，且熱傳導率約 0.001 kcal/cm·sec·℃ 以上", "C": "發熱量 10 kcal/mole 以上，且熱傳導率約 0.01 kcal/cm·sec·℃ 以下", "D": "發熱量 100 kcal/mole 以上，或熱傳導率約 0.001 kcal/cm·sec·℃ 以下"}, "answer": "A", "explain": "發熱量須在 100 kcal/mole「以上」、熱傳導率約 0.001 kcal/cm·sec·℃「以下」，且兩條件必須同時成立（不是「或」）。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-008", "topic": "燃燒", "stem": "反應熱 ΔH 定義為（生成物總熱含量）－（反應物總熱含量），則燃燒反應的 ΔH 應為何？", "opts": {"A": "ΔH ＞ 0", "B": "ΔH ＝ 0", "C": "視可燃物種類而正負不定", "D": "ΔH ＜ 0"}, "answer": "D", "explain": "燃燒是放熱反應，生成物熱含量低於反應物，故 ΔH ＜ 0；ΔH ＞ 0 為吸熱反應。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-009", "topic": "熱傳", "stem": "一般物質熱傳導率大小的順序為何？", "opts": {"A": "氣態 ＞ 液態 ＞ 固態", "B": "液態 ＞ 固態 ＞ 氣態", "C": "三態熱傳導率大致相同", "D": "固態 ＞ 液態 ＞ 氣態"}, "answer": "D", "explain": "熱傳導率為物質直接傳導熱量的能力，固態最大、氣態最小；燃燒難易則相反，氣體最易燃。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-010", "topic": "熱傳", "stem": "同為固體，粉狀物質比塊狀物質容易燃燒，其主要原因為何？", "opts": {"A": "熱傳導率增高，熱容易傳遞至內部", "B": "熱傳導率減低，熱容易蓄積而增高溫度", "C": "粉狀物質之莫耳燃燒熱較大", "D": "粉狀物質之活化能較高"}, "answer": "B", "explain": "物質分割得愈細小，熱傳導率愈低、熱不易散失而蓄積，溫度快速上升，故較易點燃。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-011", "topic": "燃燒", "stem": "反應式 H₂ ＋ Cl₂ → 2HCl 中，扮演助燃物角色的是何者？", "opts": {"A": "Cl₂", "B": "H₂", "C": "HCl", "D": "此反應無助燃物"}, "answer": "A", "explain": "氫氣在氯中燃燒，H₂ 為可燃物、Cl₂ 為助燃物，說明助燃物不限於氧。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-012", "topic": "燃燒", "stem": "所謂「活化能」係指下列何者？", "opts": {"A": "發生化學反應所需的最低能量", "B": "化學反應放出的總熱量", "C": "生成物與反應物的熱含量差", "D": "維持燃燒持續五秒以上所需之能量"}, "answer": "A", "explain": "活化能是反應物越過能障所需的最低能量；不論吸熱或放熱反應都須克服，與反應熱 ΔH 不同。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-013", "topic": "燃燒", "stem": "連鎖反應的三個步驟中，「傳播步驟」代表自由基的何種反應？", "opts": {"A": "增值反應", "B": "生成反應", "C": "消除反應", "D": "中和反應"}, "answer": "A", "explain": "起始步驟為自由基生成、傳播步驟為自由基增值、終止步驟為自由基消除。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-014", "topic": "爆炸", "stem": "一個自由基消失後能產生二個或多個新自由基的連鎖反應稱為分支鏈鎖反應，此種反應有何特性？", "opts": {"A": "易造成爆炸現象", "B": "反應速率固定不變", "C": "屬一般火災之燃燒型態", "D": "反應無法自行持續"}, "answer": "A", "explain": "分支鏈鎖反應自由基數目倍增，易造成爆炸（如 H₂ 與 O₂）；一般火災屬非分支（直鏈）反應。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-015", "topic": "燃燒", "stem": "氫氣與氯氣之連鎖反應中，屬於起始步驟的反應式為何？", "opts": {"A": "H₂ ＋ Cl· → HCl ＋ H·", "B": "Cl₂ ＋ hν → 2Cl·", "C": "H· ＋ Cl₂ → HCl ＋ Cl·", "D": "H· ＋ Cl· → HCl"}, "answer": "B", "explain": "起始步驟是 Cl₂ 受光裂解生成 Cl·；後兩式之 H₂＋Cl·、H·＋Cl₂ 為傳播步驟，H·＋Cl· 為終止步驟。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-016", "topic": "爆炸", "stem": "氫氣與氧氣之分支鏈鎖反應中，何者為「消失一個自由基、產生兩個自由基」的分支點？", "opts": {"A": "OH· ＋ H₂ → H₂O ＋ H·", "B": "H· ＋ O₂ → OH· ＋ O·", "C": "H· ＋ H· → H₂", "D": "HO₂· ＋ OH· → H₂O ＋ O₂"}, "answer": "B", "explain": "H· 與 O₂ 反應生成 OH· 與 O· 兩個自由基，為分支點；其餘分別為一對一傳播或終止步驟。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-017", "topic": "燃燒", "stem": "可燃物與氧要起化合作用必須達到一定溫度，此種供給熱能之物稱為何？", "opts": {"A": "助燃物", "B": "氧化劑", "C": "觸媒", "D": "點火源（發火源）"}, "answer": "D", "explain": "供給熱能使可燃物達到反應溫度者稱為點火源（發火源）。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-018", "topic": "燃燒", "stem": "空氣中氧氣的重量百分比濃度，一般慣用值為何？", "opts": {"A": "21%", "B": "79%", "C": "23.2%", "D": "15%"}, "answer": "C", "explain": "空氣中氧的體積百分比為 21%、重量百分比為 23.2%；79% 為氮之體積百分比、15% 為窒息滅火之氧濃度。", "ref": "火災學筆記第2講", "subject": "火災學", "src": "new"}, {"id": "F-N1-019", "topic": "燃燒", "stem": "所謂標準狀態（STP）及該狀態下 1 莫耳理想氣體之體積，下列何者正確？", "opts": {"A": "1 atm、0℃，22.4 公升", "B": "1 atm、20℃，22.4 公升", "C": "1 atm、25℃，24 公升", "D": "2 atm、0℃，11.2 公升"}, "answer": "A", "explain": "標準狀態為 1 atm、0℃，1 莫耳氣體 22.4 公升；1 atm、20℃ 為 24 公升，25℃ 為 24.45 公升。", "ref": "火災學筆記第2講", "subject": "火災學", "src": "new"}, {"id": "F-N1-020", "topic": "燃燒", "stem": "下列何者「不是」正確的溫度表示符號？", "opts": {"A": "℃", "B": "°K", "C": "℉", "D": "K"}, "answer": "B", "explain": "絕對溫度只寫 K，不加「度」，因此 °K 為錯誤寫法。", "ref": "火災學筆記第2講", "subject": "火災學", "src": "new"}, {"id": "F-N1-021", "topic": "燃燒", "stem": "理想氣體方程式 PV ＝ nRT 中，若 R 取 0.082，則各量的單位何者正確？", "opts": {"A": "P 用 atm、V 用公升、T 用絕對溫度 K", "B": "P 用 mmHg、V 用 m³、T 用 ℃", "C": "P 用 atm、V 用 m³、T 用 ℃", "D": "P 用 Pa、V 用公升、T 用 ℉"}, "answer": "A", "explain": "R ＝ 0.082 atm·L/mol·K，故 P 用 atm、V 用公升、T 用絕對溫度（K ＝ ℃ ＋ 273）。", "ref": "火災學筆記第2講", "subject": "火災學", "src": "new"}, {"id": "F-N1-022", "topic": "爆炸", "stem": "爆炸屬於下列何種燃燒形式？", "opts": {"A": "非定常燃燒", "B": "定常燃燒", "C": "表面燃燒", "D": "不發焰燃燒"}, "answer": "A", "explain": "爆炸時產生之熱超過逸散之熱，熱蓄積使反應加速形成惡性循環，屬非定常燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-023", "topic": "燃燒", "stem": "紙張燃燒後留有灰燼，就燃燒形式而言下列敘述何者正確？", "opts": {"A": "只要有灰燼就屬不完全燃燒", "B": "若可燃成分已燒淨，仍屬完全燃燒", "C": "屬非定常燃燒", "D": "屬均一系燃燒"}, "answer": "B", "explain": "完全燃燒是指可燃成分燃燒淨盡，灰燼為不可燃成分，因此留有灰燼仍可能是完全燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-024", "topic": "燃燒", "stem": "木材、紙張、纖維、石蠟四者中，何者屬於蒸發燃燒？", "opts": {"A": "木材", "B": "石蠟", "C": "紙張", "D": "纖維"}, "answer": "B", "explain": "石蠟受熱熔化後復蒸發而燃燒，屬蒸發燃燒；木材、紙張、纖維經熱分解產生可燃氣體，屬分解燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-025", "topic": "燃燒", "stem": "硫磺、石蠟、樟腦、塑膠四者中，何者屬於分解燃燒？", "opts": {"A": "塑膠", "B": "硫磺", "C": "石蠟", "D": "樟腦"}, "answer": "A", "explain": "塑膠經熱分解產生可燃性氣體而燃燒；硫磺、石蠟熔化後蒸發，樟腦昇華，皆屬蒸發燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-026", "topic": "燃燒", "stem": "木炭、焦碳燃燒時表面發紅而無火焰，此種燃燒屬於下列何者？", "opts": {"A": "蒸發燃燒", "B": "分解燃燒", "C": "表面燃燒（不發焰燃燒）", "D": "預混合燃燒"}, "answer": "C", "explain": "木炭、焦碳加熱後不液化、不分解蒸發，由氧直接在表面化合燃燒，不生火焰，稱表面燃燒或不發焰燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-027", "topic": "燃燒", "stem": "可燃物與生成物形態均屬氣體者稱為均一系燃燒，下列何者屬之？", "opts": {"A": "汽油燃燒", "B": "都市瓦斯燃燒", "C": "木材燃燒", "D": "木炭燃燒"}, "answer": "B", "explain": "燃燒生成物皆為氣體，故可燃物為氣體（氫氣、都市瓦斯）即屬均一系；液體、固體燃燒為非均一系。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-028", "topic": "燃燒", "stem": "瓦斯先洩漏並與空氣混合至一定濃度，遇開燈火花而發生爆炸，屬於何種燃燒？", "opts": {"A": "擴散燃燒", "B": "表面燃燒", "C": "預混合燃燒", "D": "分解燃燒"}, "answer": "C", "explain": "可燃性氣體與空氣在燃燒前已預先混合成一定濃度，遇火源而燃燒，即預混合燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-029", "topic": "燃燒", "stem": "預混合火焰結構中，大部分（95%～98%）燃燒反應發生於哪一區域？", "opts": {"A": "反應區", "B": "預熱區", "C": "後火焰區", "D": "近場區"}, "answer": "A", "explain": "反應區發生 95%～98% 的燃燒反應，溫度由燃點升至理論燃燒溫度；預熱區是將混合氣由室溫加熱至燃點。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-030", "topic": "燃燒", "stem": "主張「火焰中的自由基向新鮮冷混合氣體中擴散，使其發生鏈鎖反應」而使火焰傳播的是何種理論？", "opts": {"A": "擴散理論", "B": "熱理論", "C": "碰撞理論", "D": "浮力理論"}, "answer": "A", "explain": "火焰傳播機制有熱理論（反應熱傳至新鮮氣體）與擴散理論（自由基擴散引發鏈鎖反應）兩種。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-031", "topic": "燃燒", "stem": "關於影響預混合火焰傳播速度的因素，下列敘述何者正確？", "opts": {"A": "以 He 取代空氣中的 N₂，火焰傳播速度降低", "B": "以 CO₂ 取代空氣中的 N₂，火焰傳播速度降低", "C": "初始溫度愈高，火焰傳播速度愈慢", "D": "管徑愈小，火焰傳播速度愈大"}, "answer": "B", "explain": "CO₂ 比熱容比 N₂ 大約 60%，取代後傳播變慢；He 比熱容小、熱傳導率大，傳播變快；初始溫度愈高愈快；管徑愈大愈快。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-032", "topic": "燃燒", "stem": "預混合氣體之火焰傳播速度，在可燃性氣體濃度為何時最大？", "opts": {"A": "稍高於化學計量濃度", "B": "恰等於燃燒下限", "C": "恰等於燃燒上限", "D": "遠低於化學計量濃度"}, "answer": "A", "explain": "可燃性氣體濃度稍高於化學計量濃度時，恰可彌補自由基向外散失的影響，火焰傳播速度最大。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-033", "topic": "燃燒", "stem": "可燃氣從噴口噴出，在噴口處與空氣分子互相擴散混合，於濃度達燃燒範圍處生成火焰持續燃燒，稱為？", "opts": {"A": "預混合燃燒", "B": "擴散燃燒", "C": "表面燃燒", "D": "自己燃燒"}, "answer": "B", "explain": "邊擴散混合邊燃燒者為擴散燃燒（如都市瓦斯、氫氣由管口噴出燃燒）；預混合燃燒則是先混合再點火。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-034", "topic": "燃燒", "stem": "雷諾數（Re）所代表的物理意義為何？", "opts": {"A": "流體黏性力與慣性力之比值", "B": "流體浮力與重力之比值", "C": "火焰高度與火源直徑之比值", "D": "流體慣性力與黏性力之比值"}, "answer": "D", "explain": "雷諾數表示流體的慣性力與黏性力之比值，用以區分層流與紊流。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-035", "topic": "燃燒", "stem": "動量射流火焰依噴口雷諾數區分，下列何者正確？", "opts": {"A": "Re ＜ 4000 為層流火焰，Re ＞ 2100 為紊流火焰", "B": "Re ＞ 2100 為層流火焰，Re ＜ 4000 為紊流火焰", "C": "Re ＜ 2100 為層流火焰，Re ＞ 4000 為紊流火焰", "D": "Re ＜ 1000 為層流火焰，Re ＞ 2100 為紊流火焰"}, "answer": "C", "explain": "層流 Re ＜ 2100，火勢小、形狀少變；紊流 Re ＞ 4000，產生渦流、形狀激烈改變。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-036", "topic": "燃燒", "stem": "一般建築火災之火焰，依流動型態屬於何者？", "opts": {"A": "層流火焰", "B": "預混合火焰", "C": "表面燃燒", "D": "紊流火焰"}, "answer": "D", "explain": "建築火災氣流受牆壁、構造物影響而流動不均，產生渦流，屬紊流火焰。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-037", "topic": "燃燒", "stem": "浮升火羽流之間歇火焰區，流體溫度 T 與高度 Z 的關係為何？", "opts": {"A": "T ∝ 1/Z", "B": "T 大體為定值", "C": "T ∝ 1/Z^(5/3)", "D": "T ∝ √Z"}, "answer": "A", "explain": "持續火焰區溫度大體為定值；間歇火焰區 T ∝ 1/Z；無火焰熱氣流區 T ∝ 1/Z^(5/3)。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-038", "topic": "燃燒", "stem": "浮升火羽流三區中，流體速度呈「加速狀態」的是哪一區？", "opts": {"A": "間歇火焰區", "B": "無火焰熱氣流區", "C": "近場區（持續火焰區）", "D": "三區皆為等速"}, "answer": "C", "explain": "近場區靠近噴口受後方氣體推送而加速；間歇火焰區等速；無火焰熱氣流區減速。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-039", "topic": "燃燒", "stem": "「實際所需空氣量」較理論空氣量多，其主要考量為何？", "opts": {"A": "燃料中含有不可燃成分", "B": "燃燒生成物需要稀釋", "C": "可燃物與空氣中的氧在不完全碰撞反應", "D": "空氣中含有 79% 的氮氣"}, "answer": "C", "explain": "化學反應是碰撞反應，實際燃燒時可燃物與氧不一定碰得到，故須多給空氣，此即實際所需空氣量之定義。", "ref": "火災學筆記第5講", "subject": "火災學", "src": "new"}, {"id": "F-N1-040", "topic": "燃燒", "stem": "依烷類通式 CnH₂n₊₂，丁烷的分子式為何？", "opts": {"A": "C₄H₈", "B": "C₄H₆", "C": "C₃H₈", "D": "C₄H₁₀"}, "answer": "D", "explain": "丁烷 n ＝ 4，H 數 ＝ 2×4＋2 ＝ 10；C₄H₈ 為烯類通式、C₃H₈ 為丙烷。", "ref": "火災學筆記第5講", "subject": "火災學", "src": "new"}, {"id": "F-N1-041", "topic": "燃燒", "stem": "配平燃燒反應的化學平衡式時，正確的順序為何？", "opts": {"A": "可燃物係數定為 1 → 先配碳 → 再配氫 → 最後配氧", "B": "先配氧 → 再配碳 → 最後配氫", "C": "先配氫 → 再配氧 → 最後配碳", "D": "氧係數定為 1 → 先配碳 → 再配氫"}, "answer": "A", "explain": "燃燒反應先把可燃物係數定為 1，再依碳、氫、氧順序配平，先配氧會配不出來。", "ref": "火災學筆記第5講", "subject": "火災學", "src": "new"}, {"id": "F-N1-042", "topic": "燃燒", "stem": "就物質形態對燃燒之影響，下列敘述何者正確？", "opts": {"A": "不燃性固體具積極抑制燃燒作用", "B": "不燃性液體會助長燃燒", "C": "不燃性固體屬消極抵抗力，不燃性液體（如水）具積極抑制作用", "D": "可燃性液體為抑制燃燒之消極力量"}, "answer": "C", "explain": "不燃性固體僅改變火焰行進方向，屬消極抵抗；水等不燃性液體能冷卻而積極抑制；可燃性液體為助長燃燒之積極力量。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-043", "topic": "燃燒", "stem": "同一可燃性固體，以下列何種方式擺放最容易燃燒？", "opts": {"A": "平鋪狀態", "B": "豎立狀態", "C": "緊密堆疊成塊", "D": "浸濕後平放"}, "answer": "B", "explain": "豎立時熱氣流上升方向與蔓延方向一致，可預熱未燃材料，故比平鋪容易燃燒。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-044", "topic": "燃燒", "stem": "火焰擴展延伸時，若空間有體積差，火焰會如何延伸？此稱為何？", "opts": {"A": "朝空間體積小的方向延伸，稱為氣積差", "B": "朝溫度低的方向延伸，稱為溫度差", "C": "朝空間體積大的方向延伸，稱為氣積差", "D": "朝空間體積大的方向延伸，稱為溫度差"}, "answer": "C", "explain": "空間體積愈大，空氣的反抗力愈小，火焰自然朝體積大的方向延伸，此即氣積差；溫度差則是密度差產生浮力對流。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-045", "topic": "燃燒", "stem": "火柴、打火機、蠟燭等有焰火源，其火焰溫度約為多少？", "opts": {"A": "200～300℃", "B": "400～600℃", "C": "1500～2000℃", "D": "800～1200℃"}, "answer": "D", "explain": "有焰火源火焰溫度約 800～1200℃，為燃燒最直接之發火源；200～300℃ 為香煙表面溫度。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-046", "topic": "燃燒", "stem": "發火源依理化現象分為七類，下列何者「不」屬之？", "opts": {"A": "斷熱壓縮", "B": "靜電", "C": "撞擊摩擦", "D": "等溫壓縮"}, "answer": "D", "explain": "七類為微火源、有焰火源、高溫固體、撞擊摩擦、斷熱壓縮、靜電、自然發火；等溫壓縮溫度不變，不會發火。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-047", "topic": "燃燒", "stem": "二帶電序位差大之絕緣物質因摩擦、撥離、流動等作用生成電荷，累積後與周圍產生電位差而放電，簡稱為何？", "opts": {"A": "MIE", "B": "LFL", "C": "ESD", "D": "STP"}, "answer": "C", "explain": "靜電放電英文 ElectroStatic Discharge，簡稱 ESD；MIE 為最小發火能量、LFL 為燃燒下限。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-048", "topic": "燃燒", "stem": "可燃性物質在常溫下自然發熱而終至自燃，其關鍵條件為何？", "opts": {"A": "散熱速度較發熱速度為快", "B": "須有外部火焰接觸", "C": "環境溫度須高於沸點", "D": "發熱速度較散熱速度為快"}, "answer": "D", "explain": "自然發火是物質與氧化合產熱，若發熱速度大於散熱速度，溫度逐漸升高達自燃溫度而自燃。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-049", "}, "answer": "C", "explain": "由物質內部氧化、分解、吸附、發酵、聚合等反應放熱蓄積而自燃者為本身自燃；受熱自燃是外部熱源使其達自燃溫度。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-063", "topic": "燃燒", "stem": "關於最小發火能量（MIE），下列敘述何者正確？", "opts": {"A": "通常以火焰直接加熱試驗，以 kcal 表示", "B": "通常以電容器放出不同能量的火花試驗，常以 mJ 表示", "C": "數值通常很大，以 kJ 表示", "D": "指液體蒸氣持續燃燒五秒所需能量"}, "answer": "B", "explain": "MIE 是以電氣火花使混合氣發火所需能量，以電容器放電試驗，因數值很小常以毫焦耳（mJ）表示。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-064", "topic": "燃燒", "stem": "最小發火能量與壓力的關係為何？", "opts": {"A": "與壓力成正比", "B": "與壓力平方成正比", "C": "與壓力無關", "D": "與壓力平方成反比"}, "answer": "D", "explain": "發火能量與壓力平方成反比（h ∝ 1/P²），壓力增大時 MIE 降低。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-065", "topic": "燃燒", "stem": "空氣中的 N₂ 分別以 He 及 Ar 替代時，最小發火能量如何變化？", "opts": {"A": "He 替代則增大，Ar 替代則降低", "B": "He 替代則降低，Ar 替代則增大", "C": "兩者皆增大", "D": "兩者皆降低"}, "answer": "A", "explain": "熱傳導率愈大發火能量愈高：He（0.1513）＞ N₂ ＞ Ar（0.01772 W/m·K），故 He 替代時 MIE 增大、Ar 替代時降低。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-066", "topic": "燃燒", "stem": "壓力過低時，即使給予再大的能量亦不致發火，此尚可發火之最低壓力稱為？", "opts": {"A": "壓力界限", "B": "可燃性峰值", "C": "飽和蒸氣壓", "D": "最小發火壓力"}, "answer": "D", "explain": "最小發火壓力是尚可發火的最低壓力（如甲烷 19 mmHg）；壓力界限則是壓力降低至燃燒上下限一致之點。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-067", "topic": "燃燒", "stem": "依化學構造與發火能量之關係，碳化氫的發火能量大小順序為何？", "opts": {"A": "炔烴 ＞ 烯烴 ＞ 烷烴", "B": "烷烴 ＞ 烯烴 ＞ 炔烴", "C": "烯烴 ＞ 烷烴 ＞ 炔烴", "D": "三者相同"}, "answer": "B", "explain": "碳化氫發火能量依 Alkane（烷烴）＞ Alkene（烯烴）＞ Alkyne（炔烴）。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-068", "topic": "燃燒", "stem": "依化學構造與發火能量之關係，官能基使發火能量逐次增加的順序為何？", "opts": {"A": "胺 ＜ 氯化物 ＜ 醇 ＜ 硫醇", "B": "醇 ＜ 硫醇 ＜ 胺 ＜ 氯化物", "C": "氯化物 ＜ 胺 ＜ 硫醇 ＜ 醇", "D": "硫醇 ＜ 醇 ＜ 氯化物 ＜ 胺"}, "answer": "D", "explain": "官能基影響依硫醇＜醇＜氯化物＜胺順序逐次增加，其中以氯化物及胺類影響最大。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-069", "topic": "燃燒", "stem": "可燃性液體在空氣中產生可燃性蒸氣到達燃燒下限時的最低溫度，稱為？", "opts": {"A": "燃燒點（火焰點）", "B": "引火點（閃火點）", "C": "發火溫度", "D": "沸點"}, "answer": "B", "explain": "蒸氣濃度恰達燃燒下限的最低溫度為引火點，點火只閃一下即熄，故又稱閃火點。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-070", "topic": "燃燒", "stem": "關於燃燒點（火焰點）的敘述，下列何者正確？", "opts": {"A": "蒸氣引火後能持續一秒以上，通常較閃火點低 5～20℃", "B": "與發火溫度為同一溫度", "C": "通常較沸點為高", "D": "蒸氣引火後能持續五秒以上，通常較閃火點高 5～20℃"}, "answer": "D", "explain": "燃燒點是引火後能持續燃燒五秒以上之溫度，通常比閃火點高 5～20℃，且低於沸點與自燃溫度。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-071", "topic": "燃燒", "stem": "引火點、燃燒點、沸點、自燃溫度四者，溫度由低至高的順序為何？", "opts": {"A": "燃燒點 ＜ 引火點 ＜ 沸點 ＜ 自燃溫度", "B": "引火點 ＜ 沸點 ＜ 燃燒點 ＜ 自燃溫度", "C": "引火點 ＜ 燃燒點 ＜ 沸點 ＜ 自燃溫度", "D": "自燃溫度 ＜ 沸點 ＜ 燃燒點 ＜ 引火點"}, "answer": "C", "explain": "溫度順序為引火點＜燃燒點＜沸點＜自燃溫度（例如乙醇閃火點 13℃、沸點 78.4℃、自燃點 363℃）。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-072", "topic": "燃燒", "stem": "依克拉伯壤－克勞秀士方程式 dP/dT ＝ ΔH/（T×ΔV），液體氣化時 dP/dT ＞ 0 的原因為何？", "opts": {"A": "ΔH ＜ 0 且 ΔV ＜ 0", "B": "ΔH ＞ 0 且 ΔV ＞ 0", "C": "ΔH ＞ 0 且 ΔV ＜ 0", "D": "ΔH ＜ 0 且 ΔV ＞ 0"}, "answer": "B", "explain": "液體氣化為吸熱（ΔH ＞ 0）且體積膨脹（ΔV ＞ 0），故 dP/dT ＞ 0，液－氣曲線為正斜率。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-073", "topic": "燃燒", "stem": "阿瑞尼氏方程式 V ＝ A × e^(−E/RT) 用以說明固體發火，其意義為何？", "opts": {"A": "溫度愈高，熱分解速率愈慢", "B": "溫度愈高，熱分解速率愈快", "C": "活化能愈大，反應速率愈快", "D": "反應速率與溫度無關"}, "answer": "B", "explain": "T 增大使 E/RT 變小，e^(−E/RT) 變大，反應速率常數 V 增大，故溫度愈高熱分解愈快。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-074", "topic": "燃燒", "stem": "硝化棉、塞璐璐等硝酸酯類物質熱分解時同時產生可燃性氣體與氧氣，不需空氣中氧即可燃燒，稱為？", "opts": {"A": "表面燃燒", "B": "自己燃燒", "C": "蒸發燃燒", "D": "悶燒"}, "answer": "B", "explain": "硝酸酯類分子本身釋出氧而燃燒，不需空氣中氧助燃，稱為自己燃燒。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-075", "topic": "燃燒", "stem": "比較悶燒與表面燃燒，下列敘述何者正確？", "opts": {"A": "兩者皆屬發焰燃燒", "B": "表面燃燒屬完全燃燒，悶燒屬不完全燃燒", "C": "悶燒產生的有害成分較表面燃燒少", "D": "表面燃燒屬不完全燃燒，悶燒屬完全燃燒"}, "answer": "B", "explain": "兩者皆為不發焰、定常、非均一系燃燒；差別在表面燃燒為完全燃燒，悶燒為不完全燃燒且有害成分較多。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-076", "topic": "燃燒", "stem": "悶燒之所以造成嚴重火災危害，下列何者為其理由之一？", "opts": {"A": "燃燒溫度比有焰燃燒更高", "B": "比一般尚未燃燒的物質需要更少的熱源即可產生火焰性燃燒", "C": "產生的有害成分比火焰性燃燒少", "D": "只發生於氣體可燃物"}, "answer": "B", "explain": "悶燒危害有二：將燃料轉換成更多有害成分；比未燃物質需要更少熱源即可轉為火焰性燃燒。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-077", "topic": "燃燒", "stem": "液體打破後在密閉空間內達到平衡，若室內「仍有液體殘留」，應如何求空間中蒸氣的最大濃度？", "opts": {"A": "以液體重量換算莫耳數再求氣體體積", "B": "以飽和蒸氣壓除以總壓", "C": "以液體體積直接除以空間體積", "D": "以閃火點除以沸點"}, "answer": "B", "explain": "有液體殘留代表已達飽和蒸氣壓，濃度＝飽和蒸氣壓／總壓 ×100；無殘留時才用重量→莫耳→氣體體積計算。", "ref": "火災學筆記 題型10", "subject": "火災學", "src": "new"}, {"id": "F-N1-078", "topic": "燃燒", "stem": "某密閉空間內有空氣 80 公升，其中氧氣約有多少公升？", "opts": {"A": "16.8 公升", "B": "18.6 公升", "C": "63.2 公升", "D": "381 公升"}, "answer": "A", "explain": "氧氣體積＝80 × 0.21＝16.8 公升；誤用重量百分比 0.232 得 18.6，63.2 為氮氣體積，381 為誤除 0.21。", "ref": "火災學筆記 題型1", "subject": "火災學", "src": "new"}, {"id": "F-N1-079", "topic": "燃燒", "stem": "已知某空間之空氣中含氧氣 42 m³，則該空間之空氣體積約為多少？", "opts": {"A": "200 m³", "B": "8.8 m³", "C": "181 m³", "D": "53.2 m³"}, "answer": "A", "explain": "空氣體積＝氧體積 ÷ 0.21＝42 ÷ 0.21＝200 m³；誤乘 0.21 得 8.8，誤除 0.232 得 181，誤除 0.79 得 53.2。", "ref": "火災學筆記 題型1", "subject": "火災學", "src": "new"}, {"id": "F-N1-080", "topic": "燃燒", "stem": "某混合氣體僅由 O₂ 與 N₂ 組成，體積百分比分別為 30% 與 70%，則 O₂ 之重量百分比約為多少？", "opts": {"A": "32.9%", "B": "30.0%", "C": "19.7%", "D": "67.1%"}, "answer": "A", "explain": "O₂ 份額＝32×0.30＝9.6，N₂ 份額＝28×0.70＝19.6，重量百分比＝9.6÷29.2×100≒32.9%；氧原子量未乘 2 得 19.7%，67.1% 為 N₂ 之重量百分比。", "ref": "火災學筆記 題型2", "subject": "火災學", "src": "new"}, {"id": "F-N1-081", "topic": "燃燒", "stem": "某混合氣體僅由 O₂ 40% 與 N₂ 60%（體積百分比）組成，O₂ 之重量百分比約為多少？", "opts": {"A": "40.0%", "B": "27.6%", "C": "43.2%", "D": "53.3%"}, "answer": "C", "explain": "重量百分比＝（32×0.40）÷（32×0.40＋28×0.60）×100＝12.8÷29.6×100≒43.2%；O₂ 分子量誤用 16 得 27.6%，40.0% 為體積百分比。", "ref": "火災學筆記 題型2", "subject": "火災學", "src": "new"}, {"id": "F-N1-082", "topic": "滅火", "stem": "以 CO₂ 滅火時，若 CO₂ 設計濃度為 30%，則防護空間內的氧濃度約為多少？", "opts": {"A": "14.7%", "B": "6.3%", "C": "12.6%", "D": "16.8%"}, "answer": "A", "explain": "CO₂＝（21－O₂）÷21×100 → 30＝（21－O₂）÷21×100 → O₂＝21×0.7＝14.7%；6.3% 為 21×0.3 之誤算。", "ref": "火災學筆記 題型3", "subject": "火災學", "src": "new"}, {"id": "F-N1-083", "topic": "滅火", "stem": "以惰性氣體 CO₂ 將防護空間之氧濃度降至 13%，此時 CO₂ 濃度約為多少？", "opts": {"A": "8.0%", "B": "61.9%", "C": "38.1%", "D": "87.0%"}, "answer": "C", "explain": "CO₂＝（21－13）÷21×100≒38.1%；8.0% 為只算 21－13，61.9% 為 13÷21，87.0% 為 100－13。", "ref": "火災學筆記 題型3", "subject": "火災學", "src": "new"}, {"id": "F-N1-084", "topic": "滅火", "stem": "200 m³ 密閉空間內為標準狀態之空氣，須加入多少 m³ 的 CO₂，才能使 CO₂ 體積濃度成為 25%？", "opts": {"A": "50.0 m³", "B": "150.0 m³", "C": "66.7 m³", "D": "33.3 m³"}, "answer": "C", "explain": "25＝X÷（200＋X）×100 → 4X＝200＋X → X≒66.7 m³；50.0 m³ 是誤以 200×25%，忽略加入後總體積變為 V＋X。", "ref": "火災學筆記 題型4", "subject": "火災學", "src": "new"}, {"id": "F-N1-085", "topic": "滅火", "stem": "500 m³ 的防護空間，欲以 CO₂ 將氧濃度降至 14%，須加入 CO₂ 多少 m³？", "opts": {"A": "250 m³", "B": "166.7 m³", "C": "35 m³", "D": "750 m³"}, "answer": "A", "explain": "X＝（21－O₂）V÷O₂＝（21－14）×500÷14＝250 m³；166.7 m³ 誤以 CO₂ 濃度（1/3）×V，35 m³ 為 0.07×500。", "ref": "火災學筆記 題型4", "subject": "火災學", "src": "new"}, {"id": "F-N1-086", "topic": "滅火", "stem": "一密閉空間體積為 V，欲加入不燃性氣體使氧氣體積濃度成為 15%，須加入多少不燃性氣體？（假設一般空氣之氧氣體積濃度為 20%）", "opts": {"A": "0.33V", "B": "0.40V", "C": "0.25V", "D": "0.75V"}, "answer": "A", "explain": "15＝0.20V÷（V＋X）×100 → 15X＝5V → X≒0.33V；0.40V 是誤用 21% 計算，0.25V 為（20－15）/20。", "ref": "火災學筆記 題型4", "subject": "火災學", "src": "new"}, {"id": "F-N1-087", "topic": "滅火", "stem": "某場所體積 20 m³，滅火之氧濃度設定為 15%，以標準狀態（1 atm、0℃）考量，所需 CO₂ 約為多少公斤？", "opts": {"A": "14.67 kg", "B": "11.22 kg", "C": "8.00 kg", "D": "15.71 kg"}, "answer": "D", "explain": "X＝（21－15）×20÷15＝8 m³ → 8000÷22.4×44≒15714 g≒15.71 kg；誤用 24 L 得 14.67，誤以 CO₂ 濃度 28.6%×V 得 11.22。", "ref": "火災學筆記 題型5", "subject": "火災學", "src": "new"}, {"id": "F-N1-088", "topic": "滅火", "stem": "某場所體積 50 m³，欲以 CO₂ 將氧濃度降至 14%，在 1 atm、20℃（1 莫耳氣體 24 公升）下，所需 CO₂ 約為多少公斤？", "opts": {"A": "49.11 kg", "B": "30.56 kg", "C": "25.00 kg", "D": "45.83 kg"}, "answer": "D", "explain": "X＝（21－14）×50÷14＝25 m³ → 25000÷24×44≒45.83 kg；誤用標準狀態 22.4 L 得 49.11，誤以 CO₂ 濃度×V 得 30.56，25.00 為把 m³ 當 kg。", "ref": "火災學筆記 題型5", "subject": "火災學", "src": "new"}, {"id": "F-N1-089", "topic": "滅火", "stem": "標準狀態（1 atm、0℃）下，11.2 m³ 的 CO₂ 重量約為多少？", "opts": {"A": "20.5 kg", "B": "492.8 kg", "C": "0.022 kg", "D": "22.0 kg"}, "answer": "D", "explain": "11.2 m³＝11200 L → 11200÷22.4＝500 mol → 500×44＝22000 g＝22.0 kg；誤用 24 L 得 20.5，m³ 未換公升得 0.022。", "ref": "火災學筆記 題型5", "subject": "火災學", "src": "new"}, {"id": "F-N1-090", "topic": "燃燒", "stem": "某燃料含 C 80%、H 15%、S 5%（重量百分比，不含氧），1 kg 完全燃燒於標準狀態下所需理論空氣量約為多少 m³？", "opts": {"A": "14.71 m³", "B": "7.29 m³", "C": "12.10 m³", "D": "11.29 m³"}, "answer": "D", "explain": "Lv＝（8.9×80＋26.7×15＋3.3×5）÷100＝（712＋400.5＋16.5）÷100≒11.29 m³；14.71 為誤用重量版係數，12.10 為誤換算成 20℃。", "ref": "火災學筆記 題型6", "subject": "火災學", "src": "new"}, {"id": "F-N1-091", "topic": "燃燒", "stem": "某燃料含 C 70%、H 10%、O 8%、S 2%（重量百分比），1 kg 完全燃燒所需理論空氣重量約為多少 kg？", "opts": {"A": "11.69 kg", "B": "11.34 kg", "C": "8.90 kg", "D": "8.70 kg"}, "answer": "B", "explain": "Lw＝〔11.6×70＋34.8×（10－8/8）＋4.3×2〕÷100≒11.34 kg；未扣燃料含氧得 11.69，把 O 整個扣掉（H－O）得 8.90，8.70 為體積公式結果。", "ref": "火災學筆記 題型6", "subject": "火災學", "src": "new"}, {"id": "F-N1-092", "topic": "燃燒", "stem": "160 公克甲烷（CH₄）完全燃燒，於標準狀態下所需空氣量約為多少 m³？", "opts": {"A": "0.45 m³", "B": "2.13 m³", "C": "13.33 m³", "D": "1.07 m³"}, "answer": "B", "explain": "CH₄＋2O₂→CO₂＋2H₂O；O₂＝160/16×2＝20 mol → 20×22.4÷0.21÷1000≒2.13 m³；未除 0.21 得 0.45（只是氧氣量），O₂ 係數誤用 1 得 1.07。", "ref": "火災學筆記 題型6", "subject": "火災學", "src": "new"}, {"id": "F-N1-093", "topic": "燃燒", "stem": "各 1 公克的碳（C）、氫（H）、硫（S）元素完全燃燒，所需空氣量分別為 a、b、c，其大小順序為何？", "opts": {"A": "a ＝ c ＞ b", "B": "b ＞ a ＞ c", "C": "a ＞ b ＞ c", "D": "c ＞ a ＞ b"}, "answer": "B", "explain": "1 g 各元素莫耳數 C＝1/12、H＝1、S＝1/32；所需 O₂：C＝1/12、H＝1/4、S＝1/32，故 b＞a＞c；a＝c＞b 是「各 1 莫耳」的答案。", "ref": "火災學筆記 題型6", "subject": "火災學", "src": "new"}, {"id": "F-N1-094", "topic": "燃燒", "stem": "某燃料之理論空氣量為 12 m³，空氣比 m＝1.3，則實際空氣量為多少？", "opts": {"A": "3.6 m³", "B": "9.2 m³", "C": "15.6 m³", "D": "13.3 m³"}, "answer": "C", "explain": "La＝m×Lo＝1.3×12＝15.6 m³；3.6 m³ 為空氣過剩量（m－1）Lo，9.2 為誤除以 m。", "ref": "火災學筆記 題型7", "subject": "火災學", "src": "new"}, {"id": "F-N1-095", "topic": "燃燒", "stem": "某燃料理論空氣量 10 m³、實際供給空氣量 12.5 m³，則空氣過剩率為多少？", "opts": {"A": "125%", "B": "20%", "C": "25%", "D": "80%"}, "answer": "C", "explain": "m＝12.5/10＝1.25，過剩率＝m－1＝0.25（25%）；20% 是誤以實際空氣量為分母（2.5/12.5）。", "ref": "火災學筆記 題型7", "subject": "火災學", "src": "new"}, {"id": "F-N1-096", "topic": "燃燒", "stem": "某燃料含 C 85%、H 15%（重量百分比），空氣比 m＝1.2，1 kg 於標準狀態下完全燃燒之實際空氣量約為多少 m³？", "opts": {"A": "11.57 m³", "B": "2.31 m³", "C": "13.88 m³", "D": "18.10 m³"}, "answer": "C", "explain": "Lo＝（8.9×85＋26.7×15）÷100≒11.57 m³，La＝1.2×Lo≒13.88 m³；11.57 為理論空氣量，2.31 為過剩量，最後一項誤用重量係數。", "ref": "火災學筆記 題型7", "subject": "火災學", "src": "new"}, {"id": "F-N1-097", "topic": "燃燒", "stem": "空氣（γ＝1.4）在 1 atm、20℃ 下絕熱壓縮至 10 atm，壓縮後溫度約為多少？", "opts": {"A": "736.0 K", "B": "293.0 K", "C": "565.7 K", "D": "38.6 K"}, "answer": "C", "explain": "（T/T₀）^γ＝（P₀/P）^(1－γ) → T＝293×10^(0.4/1.4)≒565.7 K；736.0 K 為誤用指數 γ－1，293 K 為等溫假設，38.6 為未換算絕對溫度。", "ref": "火災學筆記 題型8", "subject": "火災學", "src": "new"}, {"id": "F-N1-098", "topic": "燃燒", "stem": "27℃ 的空氣（γ＝1.4）絕熱壓縮使體積變為原來的 1/5（V₀/V＝5），壓縮後溫度約為多少？", "opts": {"A": "2855.5 K", "B": "475.1 K", "C": "51.4 K", "D": "571.1 K"}, "answer": "D", "explain": "T/T₀＝（V₀/V）^(γ－1) → T＝300×5^0.4≒571.1 K；指數誤用 γ 得 2855.5，誤套壓力比公式得 475.1，未換 K 得 51.4。", "ref": "火災學筆記 題型8", "subject": "火災學", "src": "new"}, {"id": "F-N1-099", "topic": "燃燒", "stem": "定溫下 1 atm、6 公升的氣體加壓至 3 atm，其體積變為多少？", "opts": {"A": "18 公升", "B": "0.5 公升", "C": "2 公升", "D": "3 公升"}, "answer": "C", "explain": "等溫壓縮 P₀V₀＝PV → 1×6＝3×V → V＝2 公升；18 公升是誤以為成正比。", "ref": "火災學筆記 題型8", "subject": "火災學", "src": "new"}, {"id": "F-N1-100", "topic": "燃燒", "stem": "依 Burgess-Wheeler Law，某飽和碳化氫之莫耳燃燒熱為 2220 kJ/mol，其燃燒下限約為多少？（1 cal＝4.18 J）", "opts": {"A": "0.48%", "B": "0.11%", "C": "1.99%", "D": "5.00%"}, "answer": "C", "explain": "ΔHc＝2220÷4.18≒531.1 kcal/mol → LFL＝1059÷531.1≒1.99%；未換算 kJ 直接代入得 0.48%，換算方向相反得 0.11%。", "ref": "火災學筆記 題型9", "subject": "火災學", "src": "new"}, {"id": "F-N1-101", "topic": "燃燒", "stem": "乙烷（C₂H₆）完全燃燒式為 C₂H₆＋3.5O₂→2CO₂＋3H₂O，依 Jone's Rule 估算其燃燒下限約為多少？", "opts": {"A": "3.11%", "B": "12.2%", "C": "19.8%", "D": "5.66%"}, "answer": "A", "explain": "Co＝1÷（1＋3.5/0.21）×100≒5.66%，LFL＝0.55×Co≒3.11%；忘了除 0.21 得 12.2%，19.8% 為 Lloyd's 上限，5.66% 為 Co 本身。", "ref": "火災學筆記 題型9", "subject": "火災學", "src": "new"}, {"id": "F-N1-102", "topic": "燃燒", "stem": "丙烷（C₃H₈）完全燃燒式為 C₃H₈＋5O₂→3CO₂＋4H₂O，依 Lloyd's Rule 估算其燃燒上限約為多少？", "opts": {"A": "2.22%", "B": "14.1%", "C": "4.03%", "D": "58.3%"}, "answer": "B", "explain": "Co＝1÷（1＋5/0.21）×100≒4.03%，UFL＝3.5×Co≒14.1%；2.22% 為 Jone's 下限，最後一項為忘了除 0.21。", "ref": "火災學筆記 題型9", "subject": "火災學", "src": "new"}, {"id": "F-N1-103", "topic": "燃燒", "stem": "某可燃性液體在閃火點下之飽和蒸氣壓為 38 mmHg，混合氣體壓力為 1 atm，其燃燒下限約為多少？", "opts": {"A": "3.8%", "B": "0.05%", "C": "5.0%", "D": "38.0%"}, "answer": "C", "explain": "LFL＝P/P₀×100＝38/760×100＝5.0%；0.05% 為漏乘 100，38.0% 為 P 與 P₀ 單位不一致（誤把 P₀ 當 100）。", "ref": "火災學筆記 題型9", "subject": "火災學", "src": "new"}, {"id": "F-N1-104", "topic": "燃燒", "stem": "某混合氣體由 A、B、C 組成，體積比例 20%、30%、50%，其燃燒下限分別為 5%、3%、2%，依 Le Châtelier 定律此混合氣體燃燒下限約為多少？", "opts": {"A": "2.56%", "B": "2.90%", "C": "3.33%", "D": "0.39%"}, "answer": "A", "explain": "Lm＝1÷（20/5＋30/3＋50/2）×100＝100÷39≒2.56%；2.90% 為加權平均之誤，3.33% 為算術平均。", "ref": "火災學筆記 題型9", "subject": "火災學", "src": "new"}, {"id": "F-N1-105", "topic": "爆炸", "stem": "苯（C₆H₆）完全燃燒式為 C₆H₆＋7.5O₂→6CO₂＋3H₂O，依 Jone's Rule 估算其爆炸下限約為多少？", "opts": {"A": "2.72%", "B": "9.53%", "C": "6.47%", "D": "1.50%"}, "answer": "D", "explain": "Co＝1÷（1＋7.5/0.21）×100≒2.72%，LEL＝0.55×Co≒1.50%；9.53% 為 Lloyd's 上限，最後一項為忘了除 0.21。", "ref": "火災學筆記 題型10", "subject": "火災學", "src": "new"}, {"id": "F-N1-106", "topic": "爆炸", "stem": "密閉空間（760 mmHg、25℃）內某可燃性液體打破，平衡後仍有液體殘留；該液體 25℃ 飽和蒸氣壓為 57 mmHg，爆炸範圍經估算為 1.2%～7.0%。下列判斷何者正確？", "opts": {"A": "蒸氣濃度 7.5%，在範圍內，有火災爆炸危險", "B": "蒸氣濃度 0.075%，低於下限，無火災爆炸危險", "C": "蒸氣濃度 57%，高於上限，無火災爆炸危險", "D": "蒸氣濃度 7.5%，高於上限，無火災爆炸危險"}, "answer": "D", "explain": "有液體殘留時濃度＝57/760×100＝7.5%，高於爆炸上限 7.0%，故不在範圍內、無火災爆炸危險；0.075% 為漏乘 100。", "ref": "火災學筆記 題型10", "subject": "火災學", "src": "new"}, {"id": "F-N1-107", "topic": "爆炸", "stem": "500 m³ 密閉空間（1 atm、25℃，1 莫耳氣體 24.45 公升）內，200 ml 某液體（分子量 78、密度 0.88 g/ml）打破後全部蒸發無殘留，空間內蒸氣濃度約為多少？", "opts": {"A": "0.0101%", "B": "0.0110%", "C": "0.00004%", "D": "1.10%"}, "answer": "B", "explain": "重量＝200×0.88＝176 g → 2.256 mol → ×24.45 L≒55.2 L＝0.0552 m³ → 濃度≒0.0110%；誤用 22.4 L 得 0.0101%，把液體 0.2 L 直接當氣體體積得 0.00004%。", "ref": "火災學筆記 題型10", "subject": "火災學", "src": "new"}, {"id": "F-N1-108", "topic": "燃燒", "stem": "電容量 100 pF 的電容器充電至 2000 V 後放電，其放電能量為多少？", "opts": {"A": "0.4 mJ", "B": "200 mJ", "C": "0.2 mJ", "D": "0.0001 mJ"}, "answer": "C", "explain": "h＝½CV²＝½×100×10⁻¹²×2000²＝2×10⁻⁴ J＝0.2 mJ；0.4 mJ 為漏乘 ½，200 mJ 為 pF 誤換成 10⁻⁹ F，0.0001 mJ 為誤用 ½CV。", "ref": "火災學筆記 題型11", "subject": "火災學", "src": "new"}, {"id": "F-N1-109", "topic": "燃燒", "stem": "某電容器帶電荷量 2×10⁻⁶ 庫侖、電壓 500 V，放電時所釋放的能量為多少？", "opts": {"A": "0.5 mJ", "B": "1.0 mJ", "C": "0.25 mJ", "D": "5.0 mJ"}, "answer": "A", "explain": "h＝½QV＝½×2×10⁻⁶×500＝5×10⁻⁴ J＝0.5 mJ；1.0 mJ 為漏乘 ½。", "ref": "火災學筆記 題型11", "subject": "火災學", "src": "new"}, {"id": "F-N1-110", "topic": "燃燒", "stem": "某可燃性氣體最小發火能量為 0.25 mJ，以 200 pF 之電容器放電，至少需充電至約多少伏特才可能點燃？", "opts": {"A": "1118 V", "B": "2500 V", "C": "1581 V", "D": "2.5×10⁶ V"}, "answer": "C", "explain": "h＝½CV² → V＝√（2h/C）＝√（2×0.25×10⁻³÷200×10⁻¹²）≒1581 V；漏了 2 得 1118 V，2.5×10⁶ V 為未開根號。", "ref": "火災學筆記 題型11", "subject": "火災學", "src": "new"}, {"id": "F-N2-001", "topic": "火災", "stem": "依火災學之定義，所謂「火災」係指下列何者？", "opts": {"A": "違反人的意思或縱火而有滅火必要的燃燒現象", "B": "凡造成財物損失之一切燃燒現象", "C": "經消防機關出動並實施滅火之燃燒現象", "D": "燃燒物經濟價值達一定金額以上之燃燒現象"}, "answer": "A", "explain": "火災須同時具備「違反人的意思或縱火」與「有滅火必要」兩條件；不以財損、是否出動或經濟價值為準。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-002", "topic": "火災", "stem": "火災定義中「有滅火必要的燃燒現象」，其判斷依據下列何者正確？", "opts": {"A": "以失火者或縱火者本人之主觀認定為依據", "B": "依社會常理客觀判斷，以產生或可能產生公共危險加以認定", "C": "以燃燒物之經濟價值高低為判斷依據", "D": "以現場實際有無實施滅火動作為認定依據"}, "answer": "B", "explain": "有滅火必要不以本人主觀、不以經濟價值、也不以實際有無滅火動作認定，而是依社會常理客觀判斷有無公共危險及延燒危險。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-003", "topic": "火災", "stem": "依 104 年修訂公布之 CNS 1387 火災分類，C 類火災係與下列何者有關？", "opts": {"A": "通電中之電氣設備", "B": "金屬", "C": "氣體", "D": "烹調用植物或動物油脂"}, "answer": "C", "explain": "CNS 1387 之 C 類與氣體有關；「通電中之電氣設備」是滅火器認可基準的 C 類，兩者易混淆。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-004", "topic": "火災", "stem": "依 CNS 1387 火災分類，與炊煮器具所用之烹調用介質（如植物或動物油或脂肪）有關之火災屬於何類？", "opts": {"A": "B 類", "B": "D 類", "C": "K 類", "D": "F 類"}, "answer": "D", "explain": "CNS 1387 將烹調用油脂獨立為 F 類；B 類為液體或可液化之固體，D 類為金屬。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-005", "topic": "火災", "stem": "依內政部「滅火器認可基準」之火災分類，C 類火災係指下列何者？", "opts": {"A": "通電中之電氣機械器具及電氣設備引起之火災", "B": "可燃性氣體洩漏引起之火災", "C": "鈉、鉀、鎂等金屬物質引起之火災", "D": "石油類、有機溶劑等可燃性液體引起之火災"}, "answer": "A", "explain": "滅火器認可基準之 C 類為電氣火災（須為通電中）；可燃性氣體是 CNS 1387 的 C 類。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-006", "topic": "火災", "stem": "依火災對象物分類，棉被在行駛中之貨車車斗上起火燃燒，應歸類為何種火災？", "opts": {"A": "建築物火災", "B": "車輛火災", "C": "其他火災", "D": "森林田野火災"}, "answer": "B", "explain": "依對象物分類看「燒在哪裡」而非燒什麼；棉被在貨車上燒損屬車輛（或其裝載物品）火災。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-007", "topic": "火災", "stem": "我國火災統計新制中，所謂「A1 類火災案件」係指下列何者？", "opts": {"A": "造成人員受傷之火災案件", "B": "涉及縱火之火災案件", "C": "造成人員死亡之火災案件", "D": "起火原因待查之火災案件"}, "answer": "C", "explain": "A1 為造成人員死亡；受傷、糾紛、縱火或原因待查屬 A2；其餘為 A3。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-008", "topic": "火災", "stem": "火災受氣象、燃燒物體、建築物構造及地形地物等因素影響，呈現異常複雜之現象，火場為極不安定之場所，消防人員必須隨時提高警覺。此描述屬於火災之何種特性？", "opts": {"A": "成長性", "B": "偶發性", "C": "延燒性", "D": "不定性"}, "answer": "D", "explain": "受多種因素影響而極不安定為不定性；成長性指面積與時間平方成正比，偶發性指無法事先預測。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-009", "topic": "火災", "stem": "釋熱率公式 Q ＝（t/K）² 中，快速成長（fast）之火災成長常數 K（sec/MW^½）為下列何者？", "opts": {"A": "150", "B": "600", "C": "300", "D": "75"}, "answer": "A", "explain": "K＝600 慢速、300 中速、150 快速、75 極快速。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-010", "topic": "火災", "stem": "有關 t² 火災釋熱率公式 Q ＝（t/K）² 之敘述，下列何者正確？", "opts": {"A": "K 值越大，火災成長越快", "B": "K 值越小，火災成長越快", "C": "K 之單位為 kW/s²", "D": "式中 Q 之單位為 kW"}, "answer": "B", "explain": "K 越小，短時間即達高釋熱率；此式 Q 用 MW、K 單位 sec/MW^½，kW/s² 是 Q＝αt² 中 α 的單位。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-011", "topic": "火災", "stem": "釋熱率之單位「瓦特（W）」等於下列何者？", "opts": {"A": "cal/s", "B": "J/min", "C": "J/s", "D": "cal/min"}, "answer": "C", "explain": "瓦特為釋熱「率」，1 W＝1 J/s；熱量本身的單位才是 J、cal、BTU。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-012", "topic": "火災", "stem": "NFPA 92B 係以火災到達多少釋熱率所需之燃燒時間，來區分 t² 火災之成長類型？", "opts": {"A": "1000 kW（1 MW）", "B": "5 MW", "C": "100 BTU/sec", "D": "1055 kW（1000 BTU/sec）"}, "answer": "D", "explain": "NFPA 92B 與 NFPA 72 皆以到達 1055 kW（1000 BTU/s）的時間區分成長類型。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-013", "topic": "火災", "stem": "有關 NFPA 92B（2009 Edition）與 NFPA 72（2013 Edition）之 t² 火災分類，下列敘述何者正確？", "opts": {"A": "92B 分四類且給固定值，72 分三類且給區間", "B": "92B 分三類且給區間，72 分四類且給固定值", "C": "兩者皆分四類，僅成長係數不同", "D": "兩者皆以到達 1 MW 之時間為分類基準"}, "answer": "A", "explain": "92B 分慢、中、快、極快四類固定值；72 只分慢、中、快三類且以區間表示。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-014", "topic": "火災", "stem": "依 NFPA 92B，中速（Medium）成長之 t² 火災，其火災成長係數 α（kW/s²）約為多少？", "opts": {"A": "0.00293", "B": "0.01172", "C": "0.0469", "D": "0.1876"}, "answer": "B", "explain": "α＝1055/t²，中速 t＝300 s → 0.01172；0.00293 為慢速、0.0469 快速、0.1876 極快速。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-015", "topic": "火災", "stem": "有關氣象因素與火災之關係，下列敘述何者正確？", "opts": {"A": "氣溫越高火災發生次數越多", "B": "風速越大火災發生次數越多", "C": "氣溫及風與火災發生次數無關", "D": "相對濕度越大火災發生頻率越高"}, "answer": "C", "explain": "氣溫、風與發生次數無關，風影響的是延燒形狀與速度；相對濕度越小火災頻率越高。", "ref": "火災學筆記第10講", "subject": "火災學", "src": "new"}, {"id": "F-N2-016", "topic": "火災", "stem": "依矢島安雄之研究，風速超過多少 m/s 時，火場上風處之延燒速度為 0？", "opts": {"A": "5 m/s", "B": "7 m/s", "C": "16 m/s", "D": "13 m/s"}, "answer": "D", "explain": "風速超過 13 m/s 上風延燒速度為 0；5 m/s 為下風倍數分界，16 m/s 為飛火距離正反比分界。", "ref": "火災學筆記第10講", "subject": "火災學", "src": "new"}, {"id": "F-N2-017", "topic": "火災", "stem": "依矢島安雄對飛火之研究，飛火距離與風速之關係為何？", "opts": {"A": "風速 16 m/s 以下與風速成正比，超過則成反比", "B": "風速 13 m/s 以下與風速成正比，超過則成反比", "C": "風速 16 m/s 以下與風速成反比，超過則成正比", "D": "飛火距離與風速平方成正比，無上限"}, "answer": "A", "explain": "飛火距離以 16 m/s 為界，以下正比、以上反比；13 m/s 是上風延燒為 0 的數值。", "ref": "火災學筆記第10講", "subject": "火災學", "src": "new"}, {"id": "F-N2-018", "topic": "火災", "stem": "依濱田稔之延燒實驗公式，上風處延燒時間 t′ 之分母為下列何者？（V：風速 m/s）", "opts": {"A": "1 ＋ 0.1V", "B": "1 ＋ 0.002V²", "C": "1 ＋ 0.005V²", "D": "1 ＋ 0.2V"}, "answer": "B", "explain": "下風分母 1＋0.1V、上風 1＋0.002V²、火場兩側 1＋0.005V²；0.2V 是上風 D′＝5＋0.2V 之係數。", "ref": "火災學筆記第10講", "subject": "火災學", "src": "new"}, {"id": "F-N2-019", "topic": "火災", "stem": "所謂「絕對濕度」係指下列何者？", "opts": {"A": "某溫度下實際蒸氣量與飽和蒸氣量之百分比", "B": "當日濕度加上過去相對濕度影響值之濕度", "C": "每立方公尺空氣所含水蒸氣量（g/m³）", "D": "每公斤乾空氣所含水蒸氣之體積"}, "answer": "C", "explain": "絕對濕度單位 g/m³；百分比者為相對濕度；加入過去影響值者為實效濕度。", "ref": "火災學筆記第10講", "subject": "火災學", "src": "new"}, {"id": "F-N2-020", "topic": "火災", "stem": "計算實效濕度時所用之影響值 r，下列何者正確？", "opts": {"A": "森林火災 0.7，其他火災 0.5", "B": "森林火災 0.3，其他火災 0.5", "C": "一律採用 0.7", "D": "森林火災 0.5，其他火災 0.7"}, "answer": "D", "explain": "r 值森林火災 0.5、其他（如建築物）0.7。", "ref": "火災學筆記第10講", "subject": "火災學", "src": "new"}, {"id": "F-N2-021", "topic": "火災", "stem": "日本京都市發佈火災警報之條件，下列何者正確？", "opts": {"A": "當日實效濕度 60% 以下或相對濕度 35% 以下，且風速 7 m/s 以上", "B": "當日實效濕度 35% 以下或相對濕度 60% 以下，且風速 7 m/s 以上", "C": "當日實效濕度 60% 以下或相對濕度 35% 以下，且風速 13 m/s 以上", "D": "當日相對濕度 50% 以下，且風速 5 m/s 以上"}, "answer": "A", "explain": "京都警報：實效濕度≦60% 或相對濕度≦35%，且風速≧7 m/s。", "ref": "火災學筆記第10講", "subject": "火災學", "src": "new"}, {"id": "F-N2-022", "topic": "火災", "stem": "有關濕度與火災之關係，下列敘述何者正確？", "opts": {"A": "實效濕度值愈大，火災發生頻率愈高", "B": "實效濕度值愈小，火災發生頻率愈高且愈容易延燒", "C": "相對濕度值愈大，火災發生頻率愈高", "D": "濕度與物質燃燒之困難度無關"}, "answer": "B", "explain": "空氣濕度高時燃燒困難；相對濕度與實效濕度愈小，火災頻率愈高。", "ref": "火災學筆記第10講", "subject": "火災學", "src": "new"}, {"id": "F-N2-023", "topic": "火災", "stem": "火災防救 P.S.P 對策中，當火勢無法立即撲滅時，事先以防火門、防火樓板做區劃，將火災控制在一定範圍內，此屬何種對策？", "opts": {"A": "預防對策（Prevention）", "B": "工程對策（Engineering）", "C": "防護對策（Protection）", "D": "執法對策（Enforcement）"}, "answer": "C", "explain": "「做最壞之打算」、以區劃控制範圍為防護對策；預防對策是在火警發生前使火無從燒起。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-024", "topic": "火災", "stem": "火災預防「三 E 政策」中，都市消防水源系統、街道消防栓、報案系統及消防車輛機械等，係屬於何者？", "opts": {"A": "防火教育（Education）", "B": "防火執法（Enforcement）", "C": "熱心（Enthusiasm）", "D": "防火工程（Engineering）"}, "answer": "D", "explain": "消防水源、消防栓、報案系統、車輛機械以及建築防火構造與消防安全設備皆屬防火工程。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-025", "topic": "火災", "stem": "火災猛烈度（fire severity）通常以下列何者表示該火災之破壞潛力？", "opts": {"A": "溫度－時間曲線下與基礎線之上所圍成之面積", "B": "火場之最高溫度值", "C": "溫度－時間曲線之最大斜率", "D": "不利事件發生之機率"}, "answer": "A", "explain": "猛烈度以溫度－時間曲線下、基礎線（安全溫度）以上的面積表示；以機率表示者為火災危險度。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-026", "topic": "火災", "stem": "提出「兩個不同時間溫度曲線下之火災，若在某一溫度基礎線以上擁有相等面積，即具有相同火災猛烈度」（等價火災猛烈度）概念者為何人？", "opts": {"A": "Heskestad", "B": "Ingberg（1928 年）", "C": "Alpert", "D": "濱田稔"}, "answer": "B", "explain": "Ingberg 於 1928 年提出等價火災猛烈度；Heskestad 為火焰高度、Alpert 為天花板噴射流、濱田稔為延燒公式。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-027", "topic": "火災", "stem": "影響火災猛烈度之二大因素為何？", "opts": {"A": "可燃物種類及建築物用途", "B": "開口面積及風速", "C": "火場最高溫度及持續時間", "D": "煙濃度及能見度"}, "answer": "C", "explain": "二大因素為最高溫度與持續時間，其餘可燃物性質、數量、排列、空間形狀、開口、絕熱性則影響此二者。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-028", "topic": "火災", "stem": "有關火災危險度（fire risk）之敘述，下列何者正確？", "opts": {"A": "以溫度－時間曲線下之面積呈現", "B": "為衡量火災強度之單位", "C": "與火災猛烈程度無關", "D": "通常以不欲或不利事件發生之機率型態呈現"}, "answer": "D", "explain": "火災危險度為猛烈度的結果量度，常以結構抗火失敗、逃生失敗等機率呈現；面積與強度是火災猛烈度。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-029", "topic": "熱傳", "stem": "依傅立葉導熱定律 q ＝ ΔT ÷（d/KA），若類比電學之歐姆定律，則下列何者相當於「熱阻」？", "opts": {"A": "d/KA", "B": "KA/d", "C": "ΔT/d", "D": "KAΔT"}, "answer": "A", "explain": "溫度差類比電壓、熱流類比電流，d/KA 即為熱阻；ΔT/d 為溫度梯度。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-030", "topic": "熱傳", "stem": "有關熱傳導之敘述，下列何者正確？", "opts": {"A": "一般而言，熱傳導係數：氣體 ＞ 液體 ＞ 固體", "B": "一般而言，熱傳導係數：固體 ＞ 液體 ＞ 氣體", "C": "溫度梯度越大，熱傳導量越小", "D": "截面積越大，熱傳導量越小"}, "answer": "B", "explain": "熱傳導係數固＞液＞氣；溫度梯度、截面積越大，熱傳導量越大。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-031", "topic": "熱傳", "stem": "固體傳導熱能之兩種形式為何？", "opts": {"A": "電磁波與分子擴散", "B": "自然對流與強制對流", "C": "自由電子遷移與晶格振動", "D": "分子擴散與蒸發"}, "answer": "C", "explain": "導電體靠大量自由電子傳熱，絕緣體只能靠晶格振動，故良好導電體多為良好導熱體。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-032", "topic": "熱傳", "stem": "有關熱對流係數 h 之數值範圍，下列何者正確？（單位 W/m²·K）", "opts": {"A": "自然對流 10～500，強制對流 5～25", "B": "自然對流 0.4～100，強制對流 100～1000", "C": "自然對流 1～5，強制對流 25～50", "D": "自然對流 5～25，強制對流 10～500"}, "answer": "D", "explain": "自然對流 h 5～25、強制對流 10～500；0.4～100 為熱輻射波長（μm）。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-033", "topic": "熱傳", "stem": "有關熱輻射之敘述，下列何者正確？", "opts": {"A": "不需媒介物質，以電磁波形式傳遞", "B": "必須藉由流動介質傳遞", "C": "僅能在固體內部傳遞", "D": "其傳播速度與聲速相同"}, "answer": "A", "explain": "熱輻射無需媒介，為電磁波，以光速傳播，波長約 0.4～100 μm。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-034", "topic": "熱傳", "stem": "史帝芬-波茲曼常數 σ 之值為下列何者？", "opts": {"A": "5.67×10⁻⁶ W/m²·K⁴", "B": "5.67×10⁻⁸ W/m²·K⁴", "C": "3×10⁸ W/m²·K⁴", "D": "8.31×10⁻⁸ W/m²·K⁴"}, "answer": "B", "explain": "σ＝5.67×10⁻⁸ W/m²·K⁴；3×10⁸ 是光速（m/s）。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-035", "topic": "熱傳", "stem": "有關輻射率（emissivity）之敘述，下列何者正確？", "opts": {"A": "一般物體輻射率大於 1，稱為灰體", "B": "黑體之輻射率為 0", "C": "依克西荷夫定律，物體之吸收率與輻射率相同", "D": "輻射率為物體輻射能量與同溫度灰體輻射能量之比值"}, "answer": "C", "explain": "輻射率為與同溫度黑體之比值，黑體 ε＝1、一般灰體＜1；Kirchhoff 定律：吸收率＝輻射率。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-036", "topic": "熱傳", "stem": "某輻射源在距離 2 m 處之輻射熱通量為 18 kW/m²，若受輻射物體移至 6 m 處（其他條件不變），其接受之輻射熱通量約為多少？", "opts": {"A": "6 kW/m²", "B": "0.67 kW/m²", "C": "54 kW/m²", "D": "2 kW/m²"}, "answer": "D", "explain": "輻射熱與距離平方成反比：距離 3 倍 → 1/9，18/9＝2；6 為誤用 1/d，0.67 為誤用 1/d³。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-037", "topic": "熱傳", "stem": "受輻射物體接受之輻射熱隨輻射角 θ 之餘弦變化（q′ ＝ q cosθ）。若輻射角由 0° 改為 60°，其接受之輻射熱變為原來之幾倍？", "opts": {"A": "1/2 倍", "B": "√3/2 倍", "C": "1/√2 倍", "D": "2 倍"}, "answer": "A", "explain": "cos60°＝1/2；0° 時（平行位置）承受熱量最高。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-038", "topic": "熱傳", "stem": "物體之絕對溫度由 400 K 升高至 800 K，其他條件不變，依史帝芬-波茲曼公式其熱輻射量變為原來之幾倍？", "opts": {"A": "2 倍", "B": "16 倍", "C": "4 倍", "D": "8 倍"}, "answer": "B", "explain": "q∝T⁴，溫度 2 倍 → 2⁴＝16 倍。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-039", "topic": "熱傳", "stem": "熱貫流係指熱由流體 A 通過固體牆壁傳向流體 B，其熱傳遞三階段依序為何？", "opts": {"A": "傳導 → 對流 → 傳導", "B": "輻射 → 傳導 → 輻射", "C": "對流 → 傳導 → 對流", "D": "對流 → 輻射 → 對流"}, "answer": "C", "explain": "流體 A 與壁面間熱傳達（對流）、壁內熱傳導、壁面與流體 B 間熱傳達（對流），三段熱阻串聯。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-040", "topic": "煙與熱流", "stem": "有關「煙」之定義，下列何者正確？", "opts": {"A": "僅指燃燒所生之固體碳粒子", "B": "僅指可燃物燃燒所生之氣體產物", "C": "僅指水蒸氣冷凝所形成之液滴", "D": "浮游於空中之固體或液體微粒子，以及材料分解或燃燒所生之氣體混合物"}, "answer": "D", "explain": "煙為微粒子與氣體的混合物，含未完全燃燒微粒、氣體燃燒產物、未燃蒸氣與捲吸空氣三類。", "ref": "火災學筆記第12講", "subject": "火災學", "src": "new"}, {"id": "F-N2-041", "topic": "煙與熱流", "stem": "下列何者屬於煙濃度之「光學濃度」表示方法？", "opts": {"A": "遮光率", "B": "單位空間體積之煙粒子重量", "C": "單位空間體積之煙粒子數", "D": "每立方公分煙粒子毫克數"}, "answer": "A", "explain": "光學濃度有遮光率與光學密度；以重量或粒子數表示者為化學濃度。", "ref": "火災學筆記第12講", "subject": "火災學", "src": "new"}, {"id": "F-N2-042", "topic": "煙與熱流", "stem": "有關光學密度（Optical Density）之敘述，下列何者正確？", "opts": {"A": "單位為 m⁻¹，為透射光與入射光比值之自然對數", "B": "無單位，為入射光強度與透射光強度比值之常用對數", "C": "單位為 %，即不透明度百分比", "D": "無單位，為透射光強度與入射光強度之比值"}, "answer": "B", "explain": "D＝log(I₀/I)，以 10 為底且無單位；不透明度百分比是遮光率。", "ref": "火災學筆記第12講", "subject": "火災學", "src": "new"}, {"id": "F-N2-043", "topic": "煙與熱流", "stem": "光學密度之各種表示法中，下列單位之對應何者正確？", "opts": {"A": "單位長度光學密度 D_L：無單位", "B": "比光學密度 D_S：m⁻¹", "C": "質量光學密度 D_m：m²/g", "D": "光學密度 D：m²/g"}, "answer": "C", "explain": "D 無單位、D_L 為 m⁻¹、D_S 無單位、D_m 為 m²/g。", "ref": "火災學筆記第12講", "subject": "火災學", "src": "new"}, {"id": "F-N2-044", "topic": "煙與熱流", "stem": "人要辨別物體，物體與背景須有一定對比度。一般認為能清楚辨別物體之對比度臨界值為多少？", "opts": {"A": "－0.2", "B": "0.02", "C": "－2", "D": "－0.02"}, "answer": "D", "explain": "對比度 C＝B/B₀－1，臨界值 －0.02；能見度定義為對比度減至 －0.02 的距離。", "ref": "火災學筆記第12講", "subject": "火災學", "src": "new"}, {"id": "F-N2-045", "topic": "煙與熱流", "stem": "火場能見度之經驗公式中，發光體與反光體之 K × S 值分別為何？", "opts": {"A": "發光體 8，反光體 3", "B": "發光體 3，反光體 8", "C": "發光體 2.3，反光體 8", "D": "發光體 8，反光體 2.3"}, "answer": "A", "explain": "發光體 KS＝8、反光體 KS＝3，發光體看得較遠；2.3 是 D＝KL/2.3 的係數。", "ref": "火災學筆記第12講", "subject": "火災學", "src": "new"}, {"id": "F-N2-046", "topic": "煙與熱流", "stem": "火場中煙之主要危害有三，下列何者不屬之？", "opts": {"A": "煙的毒性", "B": "煙的導電性", "C": "煙的高熱", "D": "煙造成的視覺障礙"}, "answer": "B", "explain": "煙的三大危害為毒性、高熱、視覺障礙。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-047", "topic": "煙與熱流", "stem": "一氧化碳（CO）造成人體窒息之機轉為何？", "opts": {"A": "妨礙細胞中氧化酵素之活性", "B": "直接腐蝕氣道黏膜造成壞死", "C": "與血液中之血色素結合，阻礙紅血球的輸氧功能", "D": "使蛋白質沈澱引起組織發炎"}, "answer": "C", "explain": "CO 與血色素結合阻礙輸氧；妨礙氧化酵素為 HCN，腐蝕氣道為 HCl，蛋白質沈澱為甲醛。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-048", "topic": "煙與熱流", "stem": "空氣中一氧化碳濃度達 3000～5000 ppm 時，人體可能出現之情形為何？", "opts": {"A": "8 小時內尚無感覺", "B": "1 小時內感覺頭痛、噁心", "C": "1 分鐘內即死亡", "D": "20～30 分鐘內即死亡"}, "answer": "D", "explain": "3000～5000 ppm（0.5%）20～30 分內死亡；10000 ppm（1%）1 分鐘內死亡。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-049", "topic": "煙與熱流", "stem": "空氣中一氧化碳濃度達 1%（10000 ppm）時，人體可能出現之情形為何？", "opts": {"A": "1 分鐘內即死亡", "B": "20～30 分鐘內即死亡", "C": "2 小時內意識朦朧、逾 2 小時死亡", "D": "1 小時內尚無感覺"}, "answer": "A", "explain": "CO 1% 時 1 分鐘內即死亡。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-050", "topic": "煙與熱流", "stem": "對一氧化碳中毒者之現場處理，下列何者不正確？", "opts": {"A": "將中毒者移至通風良好之處所", "B": "讓中毒者留在原處靜臥，等待自行恢復", "C": "寬鬆中毒者衣物", "D": "中毒者呼吸困難時儘速施予人工呼吸並緊急送醫"}, "answer": "B", "explain": "正確處置為移至通風處、寬鬆衣物、呼吸困難施予人工呼吸、緊急送醫；留在原處會持續吸入 CO。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-051", "topic": "煙與熱流", "stem": "火災煙中何種毒性氣體會妨礙細胞中氧化酵素之活性，造成細胞呼吸停止？", "opts": {"A": "一氧化碳（CO）", "B": "氯化氫（HCl）", "C": "氰酸（HCN）", "D": "二氧化碳（CO₂）"}, "answer": "C", "explain": "HCN 抑制細胞氧化酵素致細胞呼吸停止，來源為木、絲、尼龍、聚胺甲酸酯燃燒。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-052", "topic": "煙與熱流", "stem": "火災中氯化氫（HCl）之主要來源為下列何種材料之燃燒？", "opts": {"A": "聚胺甲酸酯", "B": "硝酸纖維素", "C": "聚丙烯", "D": "聚氯乙烯（PVC）"}, "answer": "D", "explain": "HCl 主要來自 PVC；聚胺甲酸酯生 HCN、硝酸纖維素生 NO₂、聚丙烯多生甲醛與丙烯醛。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-053", "topic": "煙與熱流", "stem": "有機物燃燒時均可能產生，尤以聚乙烯、聚丙烯、乙烯龍（Vinylon）等物質發生量最大，且會強烈刺激眼睛、呼吸器及皮膚之無色氣體為何？", "opts": {"A": "丙烯醛", "B": "二氧化氮", "C": "氯化氫", "D": "氰酸"}, "answer": "A", "explain": "丙烯醛（Acrolein）以聚乙烯、聚丙烯、乙烯龍發生量最大；NO₂ 來自硝酸纖維素、HCl 來自 PVC。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-054", "topic": "煙與熱流", "stem": "人受放射熱之忍耐時間，與放射熱及熱慣性之關係為何？", "opts": {"A": "與放射熱之平方成正比，與熱慣性成反比", "B": "與放射熱之平方成反比，與熱慣性成正比", "C": "與放射熱成反比，與熱慣性之平方成正比", "D": "與放射熱之平方成反比，與熱慣性成反比"}, "answer": "B", "explain": "忍耐時間 ∝ 熱慣性 ／ 放射熱²。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-055", "topic": "煙與熱流", "stem": "有關熱慣性（thermal inertia）之敘述，下列何者正確？", "opts": {"A": "為熱傳導係數、密度與熱容量之乘積，值越高越容易被點燃", "B": "為熱傳導係數與密度之比值，值越高越不易被點燃", "C": "為熱傳導係數、密度與熱容量之乘積，值越高越不易被點燃", "D": "為熱傳導係數與熱容量之和，與點燃難易無關"}, "answer": "C", "explain": "熱慣性＝kρc，值越大內部越不易升溫，需更多能量才點燃。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-056", "topic": "煙與熱流", "stem": "依燒傷分級，傷及真皮深層、外觀為淺紅或白色大水泡、稍痛不敏感，需 21 天以上癒合且留有疤痕者，屬於何級？", "opts": {"A": "一度", "B": "淺二度", "C": "三度", "D": "深二度"}, "answer": "D", "explain": "深二度：真皮深層、21 天以上、留疤；淺二度 14 天內無疤；三度疼痛消失需植皮。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-057", "topic": "煙與熱流", "stem": "依 NFPA 101 熱忍限值標準，避難區域內煙層高度在距地板 1.5 公尺以下時，其熱忍限值為多少？", "opts": {"A": "49℃", "B": "93℃", "C": "60℃", "D": "120℃"}, "answer": "A", "explain": "煙層在 1.5 m 之上為 93℃，之下為 49℃。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-058", "topic": "煙與熱流", "stem": "影響煙霧流動與蔓延之六種主要因素，下列何者不屬之？", "opts": {"A": "煙囪效應", "B": "輻射熱回饋效應", "C": "升降機活塞效應", "D": "空調系統效應"}, "answer": "B", "explain": "六因素為煙囪效應、浮力作用、熱膨脹、自然風、空調系統、升降機活塞；輻射熱回饋是角落火源效應的原因。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-059", "topic": "煙與熱流", "stem": "在火災初期，冬季與夏季（使用冷氣）之建築物，分別較易產生何種效應？", "opts": {"A": "冬季逆煙囪效應，夏季煙囪效應", "B": "冬夏皆為煙囪效應", "C": "冬季煙囪效應，夏季逆煙囪效應", "D": "冬夏皆為逆煙囪效應"}, "answer": "C", "explain": "冬天外冷內暖為煙囪效應；夏天冷氣房內涼外熱為逆煙囪效應。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-060", "topic": "煙與熱流", "stem": "在正煙囪效應下，若起火居室位於中性面以下，煙霧之流動情形為何？", "opts": {"A": "煙直接由起火居室開口流出建築物外，其他樓層相對無煙", "B": "煙向下方樓層流動，上方樓層無煙", "C": "煙停留於起火居室內不會流動", "D": "煙被擠入垂直通道向上浮升，從上方樓層開口流出，蔓延整棟建築物"}, "answer": "D", "explain": "中性面以下起火，煙進入垂直通道上升而蔓延整棟；中性面以上起火則煙直接往外流出。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-061", "topic": "煙與熱流", "stem": "浮力作用之壓力差公式 ΔP ＝ Ks（1/T₀ － 1/T₁）h 中，有關各項之敘述何者正確？", "opts": {"A": "Ks 為 3460 Pa·K/m，h 在中性面以上為正", "B": "Ks 為 3460 Pa·K/m，h 在中性面以上為負", "C": "Ks 為 0.839，溫度可直接使用攝氏", "D": "T₀ 為火場溫度，T₁ 為外界溫度"}, "answer": "A", "explain": "Ks＝3460 Pa·K/m；T₀ 外、T₁ 內（火場），均用 K；h 中性面以上正、以下負。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-062", "topic": "煙與熱流", "stem": "有關熱膨脹效應對煙霧流動之影響，下列敘述何者正確？", "opts": {"A": "門窗敞開之起火居室影響最大，密閉房間可忽略", "B": "門窗敞開之起火居室可忽略，密閉性較好之房間則須考慮", "C": "任何起火居室皆可忽略", "D": "流出煙霧與流入空氣體積流量比等於溫度比之平方"}, "answer": "B", "explain": "開放居室膨脹壓力可忽略，密閉房間須考慮；Q₁/Q₀＝T₁/T₀（一次方）。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-063", "topic": "煙與熱流", "stem": "有關自然風效應之風壓 Pw ＝ CwρV²/2，下列敘述何者正確？", "opts": {"A": "迎風面承受負壓，背風面承受正壓", "B": "風壓係數 Cw 恆為正值", "C": "迎風面承受正壓，背風面承受負壓", "D": "空氣密度 ρ 通常取 1000 kg/m³"}, "answer": "C", "explain": "Cw 介於 －0.8～0.8，迎風正、背風負；空氣密度取 1.2 kg/m³（1000 是水）。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-064", "topic": "煙與熱流", "stem": "為避免煙沿空調通風管道擴散，於通風管穿越防火牆、防火樓板等處所，必須設置何種設備？", "opts": {"A": "排煙口", "B": "防火門", "C": "撒水頭", "D": "防火閘門（Fire Damper）"}, "answer": "D", "explain": "通風管穿越防火區劃須設防火閘門；防火門是阻斷走廊、樓梯的路徑。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-065", "topic": "煙與熱流", "stem": "所謂中性面（帶），係指下列何者？", "opts": {"A": "建築物上下層所受外力方向相反，於某高度所受力量為零之水平橫切面", "B": "建築物內溫度最高之水平面", "C": "煙層與空氣層之交界面", "D": "建築物外牆迎風面與背風面之交界"}, "answer": "A", "explain": "中性面為內外壓差為零之高度的水平橫切面。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-066", "topic": "煙與熱流", "stem": "依中性面位置關係 h₁A₁²T₀ ＝ h₂A₂²T₁，若建築物上方開口面積增大，中性面將如何變化？", "opts": {"A": "下移", "B": "上移", "C": "不變", "D": "先上移後下移"}, "answer": "B", "explain": "A₁ 變大則 h₁（中性面至上開口距離）變小，中性面上移。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-067", "topic": "煙與熱流", "stem": "依中性面位置關係 h₁A₁²T₀ ＝ h₂A₂²T₁，若火場溫度 T₁ 升高，中性面將如何變化？", "opts": {"A": "上移", "B": "不變", "C": "下移", "D": "移至建築物頂部"}, "answer": "C", "explain": "T₁ 變大則 h₂（中性面至下開口距離）變小，中性面下移。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-068", "topic": "煙與熱流", "stem": "考慮外部風壓時，在正煙囪效應下，建築物迎風面與背風面之中性面高度如何變化？", "opts": {"A": "迎風面下降，背風面上升", "B": "兩面皆上升", "C": "兩面皆下降", "D": "迎風面上升，背風面下降"}, "answer": "D", "explain": "正煙囪效應下，迎（逆）風面中性面上升、背風面中性面下降。", "ref": "火災學筆記第15講", "subject": "火災學", "src": "new"}, {"id": "F-N2-069", "topic": "煙與熱流", "stem": "有關煙霧管理與煙霧控制之區別，下列何者正確？", "opts": {"A": "煙霧控制係將擋煙物與機械風機產生之氣流和壓差共同使用", "B": "煙霧管理必須使用機械風機產生壓差", "C": "煙霧控制僅以擋煙物、排煙豎井抑制煙氣", "D": "兩者定義完全相同"}, "answer": "A", "explain": "煙霧管理如擋煙物、排煙口、排煙豎井；煙霧控制再加上機械風機的氣流與壓差。", "ref": "火災學筆記第15講", "subject": "火災學", "src": "new"}, {"id": "F-N2-070", "topic": "煙與熱流", "stem": "對走廊、樓梯間等避難通道提供新鮮空氣，使避難通道之空氣壓力高於起火居室，煙霧因而無法逸入，此為何種排煙方式？", "opts": {"A": "排煙室排煙法", "B": "避難通道加壓排煙法", "C": "自然排煙法", "D": "逆煙囪排煙法"}, "answer": "B", "explain": "此為避難通道加壓排煙法；排煙室排煙法是在樓梯間前室設進氣與排煙設備。", "ref": "火災學筆記第15講", "subject": "火災學", "src": "new"}, {"id": "F-N2-071", "topic": "煙與熱流", "stem": "有關避難通道加壓之等效流動面積，下列敘述何者正確？", "opts": {"A": "開口並聯時，等效流動面積比任一開口小", "B": "開口串聯時，等效流動面積為各開口面積之和", "C": "開口並聯時，等效流動面積比任一開口大", "D": "開口串聯時，等效流動面積比任一開口大"}, "answer": "C", "explain": "並聯 Aₑ＝ΣA，比任一開口大；串聯 1/Aₑ²＝Σ1/A²，比任一開口小。", "ref": "火災學筆記第15講", "subject": "火災學", "src": "new"}, {"id": "F-N2-072", "topic": "煙與熱流", "stem": "依 NFPA 規範，開門所需最大力量及門兩側壓差之限制為何？", "opts": {"A": "100 N 及低於 133 Pa", "B": "133 N 及低於 50 Pa", "C": "200 N 及低於 100 Pa", "D": "133 N 及低於 100 Pa"}, "answer": "D", "explain": "NFPA：開門力量 133 N、壓差低於 100 Pa。", "ref": "火災學筆記第15講", "subject": "火災學", "src": "new"}, {"id": "F-N2-073", "topic": "煙與熱流", "stem": "火災熱流現象之四種類型，下列何者不屬之？", "opts": {"A": "煙囪效應", "B": "浮升火柱", "C": "天花板噴射流", "D": "牆壁熱流"}, "answer": "A", "explain": "火災熱流四種：浮升火柱、天花板噴射流、牆壁熱流、開口部熱流；煙囪效應屬影響煙霧流動因素。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-074", "topic": "煙與熱流", "stem": "浮升火柱（fire plume）形成之主要原因為何？", "opts": {"A": "空調系統送風造成之強制對流", "B": "燃燒熱能使居室溫度及壓力變化而產生浮力作用", "C": "升降機運行產生之活塞效應", "D": "外部風壓作用於迎風面"}, "answer": "B", "explain": "燃燒生熱使溫度壓力改變產生浮力，使燃燒生成物、火焰與空氣混合上升形成浮升火柱。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-075", "topic": "煙與熱流", "stem": "Heskestad 火焰平均高度公式 L ＝ －1.02D ＋ 0.235Q^(2/5) 中，Q 之單位為何？", "opts": {"A": "MW", "B": "W", "C": "kW", "D": "kJ"}, "answer": "C", "explain": "Heskestad
