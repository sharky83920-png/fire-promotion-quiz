.775 m²；Q＝378×2.025×1.5＋7.8×44.775≒1148.2＋349.2≒1497 kW。", "ref": "火災學筆記 題型27", "subject": "火災學", "src": "new"}, {"id": "F-N4-065", "topic": "火災", "stem": "某區劃有兩個開口：開口一面積 2 m²、高 2 m；開口二面積 1 m²、高 0.5 m，其等效開口高度約為多少？", "opts": {"A": "1.25 m", "B": "1.50 m", "C": "2.50 m", "D": "4.50 m"}, "answer": "B", "explain": "H＝(A₁H₁＋A₂H₂)÷(A₁＋A₂)＝(4＋0.5)÷3＝1.5 m；1.25 為高度簡單平均。", "ref": "火災學筆記 題型27", "subject": "火災學", "src": "new"}, {"id": "F-N4-066", "topic": "火災", "stem": "某耐火構造倉庫內木材總表面積 30 m²，有一開口寬 3 m、高 2 m，取 ρ＝1.2 kg/m³、g＝9.8 m/s²，依 Harmathy 判斷式，該倉庫火災較易成為何種燃燒型態？", "opts": {"A": "約 1.06，燃料控制燃燒", "B": "約 1.06，通風控制燃燒", "C": "約 0.34，通風控制燃燒", "D": "約 0.75，通風控制燃燒"}, "answer": "A", "explain": "1.2×√9.8×(3×2)×√2÷30≒1.06＞0.29，屬燃料控制燃燒。", "ref": "火災學筆記 題型27", "subject": "火災學", "src": "new"}, {"id": "F-N4-067", "topic": "火災", "stem": "某房間長 6 m、寬 5 m、高 3 m，開口寬 1.5 m、高 2 m，以室內天花板、牆壁、地板全表面積計算溫度因子 A√H／Aₜ，下列何者正確？", "opts": {"A": "約 0.048，火災溫度曲線與標準曲線相同", "B": "約 0.034，火災溫度曲線較標準曲線低", "C": "約 0.034，火災溫度曲線較標準曲線高", "D": "約 0.141，火災溫度曲線較標準曲線高"}, "answer": "B", "explain": "Aₜ＝2×(30＋18＋15)＝126 m²，A√H＝3×√2≒4.243，溫度因子≒0.034＜0.06，溫度曲線較標準低；0.141 為誤用地板面積 30 m²。", "ref": "火災學筆記 題型27", "subject": "火災學", "src": "new"}, {"id": "F-N4-068", "topic": "火災", "stem": "某房間長 4 m、寬 4 m、高 3 m，開口寬 2 m、高 2 m，以室內全表面積計算溫度因子 A√H／Aₜ，下列何者正確？", "opts": {"A": "約 14.1，室內溫度較標準溫度曲線低", "B": "約 0.100，室內溫度較標準溫度曲線低", "C": "約 0.071，室內溫度較標準溫度曲線低", "D": "約 0.071，室內溫度較標準溫度曲線高"}, "answer": "D", "explain": "Aₜ＝2×(16＋12＋12)＝80 m²，A√H＝4×√2≒5.657，溫度因子≒0.071＞0.06，溫度曲線較標準高。", "ref": "火災學筆記 題型27", "subject": "火災學", "src": "new"}, {"id": "F-N4-069", "topic": "火災", "stem": "某耐火建築物區劃內可燃物總表面積為 60 m²，有一開口寬 1 m、高 2 m，取空氣密度 1.2 kg/m³、g＝9.8 m/s²，依 Harmathy 判斷式 ρg^½A√H／A_F，下列何者正確？", "opts": {"A": "約 0.15，屬通風控制燃燒", "B": "約 0.18，屬通風控制燃燒", "C": "約 0.25，屬燃料控制燃燒", "D": "約 0.18，屬燃料控制燃燒"}, "answer": "B", "explain": "1.2×√9.8×(1×2)×√2÷60≒0.177＜0.235，屬通風控制燃燒；把 √H 誤作 H 會得 0.25。", "ref": "火災學筆記 題型27", "subject": "火災學", "src": "new"}, {"id": "F-N4-070", "topic": "火災", "stem": "有關爆燃過程之室內溫度變化，下列何者正確？", "opts": {"A": "開口被打開時稍降為 400～500℃，發生爆燃時又達 700～800℃", "B": "開口被打開時降至 150～200℃，發生爆燃時達 600℃", "C": "開口被打開時升高至 1000℃，發生爆燃時降至 500℃", "D": "全程維持於 260℃ 左右"}, "answer": "A", "explain": "爆燃：開口打開時室溫稍降為 400～500℃，爆燃發生時又達 700～800℃。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-071", "topic": "火災", "stem": "有關閃燃與爆燃之比較（Dunn，2000），下列敘述何者錯誤？", "opts": {"A": "閃燃發生於成長期", "B": "爆燃發生之機率較閃燃少", "C": "閃燃為火勢快速發展之現象", "D": "閃燃是一種爆炸現象"}, "answer": "D", "explain": "爆燃才是一種爆炸現象；閃燃為火勢快速發展之現象且較常發生。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-072", "topic": "防火與特殊現象", "stem": "若以消防救災立場而言，地下建築物除地下街外，尚包含下列何者？", "opts": {"A": "地下室及地下道", "B": "高架道路及橋樑", "C": "捷運高架車站", "D": "地下管線及涵洞"}, "answer": "A", "explain": "消防救災立場之地下建築物包含地下街、地下室及地下道。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-073", "topic": "火災", "stem": "依 Dunn（2000）之比較，爆燃（Backdraft）可能發生於火災之何時期？", "opts": {"A": "僅於初期", "B": "最盛期", "C": "僅於成長期", "D": "成長期或衰退期"}, "answer": "D", "explain": "爆燃發生於成長期或衰退期；閃燃發生於成長期。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-074", "topic": "防火與特殊現象", "stem": "火災時人員遇到危險不願逃生，而只躲入浴室、廁所、床下等處，屬於何種避難行為特性？", "opts": {"A": "向光性", "B": "潛力性", "C": "歸巢性", "D": "鴕鳥性"}, "answer": "D", "explain": "鴕鳥性：不願逃生而躲藏；潛力性：發揮潛能作出平時不可能的事。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-075", "topic": "防火與特殊現象", "stem": "高樓逃生通道設計之「直覺原則」，下列何者為其應用之例？", "opts": {"A": "設置出口標示燈、避難方向指標", "B": "備置緊急電源", "C": "採二方向避難設計", "D": "設置第二種備援手段"}, "answer": "A", "explain": "直覺原則：意識混沌時仍能憑直覺行動，如避難方向指標、出口標示燈；緊急電源、二方向避難屬萬全原則。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-076", "topic": "火災", "stem": "火場開口部空隙流出之黑煙帶有黃褐色，有時以間歇性煙與火焰混雜噴出，且縫隙周圍可見煤渣粒子與焦油污垢，最可能是何種現象之前兆？", "opts": {"A": "輻射能回饋", "B": "閃燃", "C": "滾燃", "D": "爆燃"}, "answer": "D", "explain": "黃褐色、間歇噴出、煤渣焦油為爆燃之目測特徵；閃燃前則是黑煙帶黃色並有喘息現象。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-077", "topic": "防火與特殊現象", "stem": "建築物逃生設計強調「二方向避難原則」，係屬下列何種原則之運用？", "opts": {"A": "習慣性原則", "B": "直覺原則", "C": "萬全原則", "D": "向光性原則"}, "answer": "C", "explain": "萬全原則：某手段故障時另備第二、第三種手段，如緊急電源、二方向避難。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-078", "topic": "防火與特殊現象", "stem": "救火人員進入地下層時，因新鮮空氣突然侵入而可能造成易燃氣體之何種現象？", "opts": {"A": "煙囪效應", "B": "閃燃（Flashover）", "C": "滾燃（Rollover）", "D": "爆燃（Backdraft）"}, "answer": "D", "explain": "地下建築物搶救危險重重，新鮮空氣突然侵入可能造成爆燃。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-079", "topic": "防火與特殊現象", "stem": "依建築技術規則第幾條規定，地下建築物係指供地下使用單元、地下通道、地下通道之直通樓梯、專用直通樓梯、地下公共設施等及附設之必要構造物？", "opts": {"A": "第 179 條", "B": "第 162 條", "C": "第 241 條", "D": "第 227 條"}, "answer": "A", "explain": "地下建築物定義見建築技術規則第 179 條；第 227 條為高層建築物。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-080", "topic": "防火與特殊現象", "stem": "火災避難時，人員遇災害往往有折返原來途徑之本能，此屬於避難逃生之何種行為特性？", "opts": {"A": "習慣性", "B": "從眾性", "C": "開闊性", "D": "歸巢性"}, "answer": "D", "explain": "歸巢性：折返原來途徑；習慣性：往日常熟悉方向逃生。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-081", "topic": "防火與特殊現象", "stem": "依美國防火協會（NFPA）之定義，所謂高樓（High Rise Building）係指下列何者？", "opts": {"A": "高度在 50 公尺或樓層在十六層以上之建築物", "B": "由建築物外部消防車輛無法到達之樓層", "C": "上層樓地板高度已超越雲梯車所能達到之最大高度，而須由內部進行搶救之建築物", "D": "高度超過 100 公尺之建築物"}, "answer": "C", "explain": "NFPA：超越雲梯車最大高度、須由內部搶救；EFPA：外部消防車輛無法到達之樓層；50 m／16 層為我國高層建築物定義。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-082", "topic": "火災", "stem": "有關滾流燃燒（Rollover）與閃燃（Flashover）之比較，下列何者錯誤？", "opts": {"A": "滾燃之火焰可蔓延至鄰近區域", "B": "閃燃發生於成長期末期", "C": "滾燃是閃燃發生之先決條件", "D": "滾燃僅引燃天花板下方之可燃性氣體"}, "answer": "C", "explain": "滾燃通常發生在閃燃之前，但並不是閃燃發生的先決條件。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-083", "topic": "火災", "stem": "依美國學者 Dunn（2000）之比較，閃燃與爆燃發生之「原因」分別為何？", "opts": {"A": "閃燃為熱，爆燃為空氣", "B": "閃燃為空氣，爆燃為熱", "C": "兩者皆為空氣", "D": "兩者皆為熱"}, "answer": "A", "explain": "Dunn：爆燃原因是空氣，閃燃原因是熱（而不是空氣）。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-084", "topic": "防火與特殊現象", "stem": "依建築技術規則第 227 條，高層建築物係指下列何者？", "opts": {"A": "上層樓地板高度超越雲梯車最大高度之建築物", "B": "高度在 50 公尺或樓層在十六層以上之建築物", "C": "高度在 60 公尺或樓層在二十層以上之建築物", "D": "高度在 31 公尺或樓層在十一層以上之建築物"}, "answer": "B", "explain": "建築技術規則第 227 條：高度 50 公尺或樓層十六層以上。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-085", "topic": "火災", "stem": "閃燃發生時，室內氣體濃度約為下列何者？", "opts": {"A": "O₂ 約 15%、CO 約 1%、CO₂ 約 5%", "B": "O₂ 約 1%、CO 5～10%、CO₂ 20% 以上", "C": "O₂ 至少 10%、CO 約 5%、CO₂ 約 10%", "D": "O₂ 約 2～3%、CO 約 15%、CO₂ 約 20%"}, "answer": "B", "explain": "閃燃時 O₂ 約 1%、CO 5～10%、CO₂ 20% 以上；O₂ 2～3%、CO 15% 為爆燃開口打開前之濃度。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-086", "topic": "防火與特殊現象", "stem": "下列何者「不屬於」筆記所列高樓建築物火災之五項特性？", "opts": {"A": "高溫灼熱", "B": "水損嚴重", "C": "濃煙密佈", "D": "搶救困難"}, "answer": "B", "explain": "高樓火災五特性：濃煙密佈、高溫灼熱、延燒快速、逃生不易、搶救困難；水損嚴重為地下建築物火災之特殊之處。", "ref": "火災學筆記第23講", "subject": "火災學", "src": "new"}, {"id": "F-N4-087", "topic": "火災", "stem": "下列何者「不屬於」船舶火災之特性？", "opts": {"A": "船艙開口多、散熱容易，火點易於發現", "B": "大量射水可能導致進水沉沒", "C": "鋼質材質傳導性佳，伴隨高溫濃煙", "D": "內部結構複雜、隔艙不易通風排氣"}, "answer": "A", "explain": "船舶鋼質傳導佳且船艙開口少、散熱不易，高溫濃煙使火點難找。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-088", "topic": "火災", "stem": "車輛火災時，車內裝飾材料、輪胎、座椅等燃燒後，溫度最高可達約多少？", "opts": {"A": "600℃", "B": "1500℃", "C": "800℃", "D": "1100℃"}, "answer": "D", "explain": "車輛火災可燃物多且供氧充足，最高可達 1100℃。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-089", "topic": "火災", "stem": "森林中燃料之燃燒點約為多少，因此極易受天然或人為影響而產生火災？", "opts": {"A": "100～150℃", "B": "490～600℃", "C": "250～300℃", "D": "400～450℃"}, "answer": "C", "explain": "山林火災基本條件之熱源：森林燃料燃燒點約 250～300℃。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-090", "topic": "危險物品", "stem": "依筆記所述，鋰電池回收廠發生鋰電池火災時，最好之滅火方法為何？", "opts": {"A": "以水持續降溫至鋰反應完畢", "B": "以乾砂完全覆蓋隔絕空氣", "C": "移除後任其自然燒盡", "D": "以二氧化碳窒息滅火"}, "answer": "A", "explain": "筆記指出降溫係最好的滅火方法，持續以水降溫至鋰反應完畢，火即熄滅。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-091", "topic": "火災", "stem": "依火災統計新制，造成人員受傷、涉及糾紛、縱火案件或起火原因待查之火災案件，屬於何類？", "opts": {"A": "A1 類", "B": "A2 類", "C": "A3 類", "D": "B 類"}, "answer": "B", "explain": "A2 類：人員受傷、涉及糾紛、縱火或起火原因待查之案件。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-092", "topic": "火災", "stem": "依 106 年火災統計，火災類型中發生次數最多者為何？", "opts": {"A": "其他", "B": "車輛", "C": "建築物", "D": "森林田野"}, "answer": "D", "explain": "106 年森林田野火災 13,241 次（43.5%）最高，其次為建築物 9,094 次。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-093", "topic": "火災", "stem": "依自 106 年 1 月 1 日起實施之火災統計新制，「A1 類」火災係指下列何者？", "opts": {"A": "涉及縱火或起火原因待查之案件", "B": "造成人員死亡之火災案件", "C": "由分隊填具搶救出勤紀錄表完成之案件", "D": "造成人員受傷之火災案件"}, "answer": "B", "explain": "A1 類為造成人員死亡；A2 類為受傷、糾紛、縱火或原因待查；A3 類為非屬 A1、A2，由分隊填具出勤紀錄表者。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-094", "topic": "火災", "stem": "地表火遇強風或遇到針葉樹群、枯立木或低垂樹枝，燒至樹冠並沿樹冠順風擴展，此稱為何？", "opts": {"A": "地表火", "B": "飛火", "C": "地下火", "D": "樹冠火"}, "answer": "D", "explain": "樹冠火（crown fire）由地表火遇強風或針葉樹群等燒至樹冠而成。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-095", "topic": "火災", "stem": "航空器火災「火勢發展快速」之主要原因為何？", "opts": {"A": "飛機精密度高、造價高", "B": "機艙內座椅毛毯等可燃物密閉性低", "C": "機艙通道狹窄，艙門數量有限", "D": "含大量航空用油，且合金機身導熱良好"}, "answer": "D", "explain": "大量航空用油激烈燃燒，合金機身導熱良好使火勢迅速傳遞；艙門有限屬逃生不易，造價高屬火損嚴重。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-096", "topic": "火災", "stem": "有關山林火災中「地下火」之敘述，下列何者正確？", "opts": {"A": "多發生於潮濕季節之闊葉林，破壞力小", "B": "遇強風燒至樹冠並順風擴展", "C": "於根系土壤表層有機質及泥炭層燃燒，蔓延慢、溫度高、持續時間長", "D": "沿地表地被物蔓延，蔓延速度最快"}, "answer": "C", "explain": "地下火多發生於乾旱季節針葉林內，在有機質及泥炭層燃燒，蔓延慢、溫度高、持續久、破壞力極強。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-097", "topic": "火災", "stem": "依 106 年全國火災起火原因統計，前三名依序為何？", "opts": {"A": "電氣因素＞遺留火種＞爐火烹調", "B": "爐火烹調＞電氣因素＞遺留火種", "C": "遺留火種＞電氣因素＞縱火", "D": "遺留火種＞爐火烹調＞電氣因素"}, "answer": "D", "explain": "106 年遺留火種 9,574 次（53.1%）第 1，爐火烹調 20.3% 第 2，電氣因素 19% 第 3。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-098", "topic": "危險物品", "stem": "鋰電池起火原因中所稱之「外部短路」，其「外部」係指何者？", "opts": {"A": "電池芯的外部（電池組內部絕緣不良）", "B": "充電器之外部線路", "C": "電池組外殼以外之環境", "D": "使用者裝置之外部接頭"}, "answer": "A", "explain": "外部短路之外部指電池芯外部，即電池組內部絕緣不良引起之短路，電解液汽化撐大撐破外殼後燃燒。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-099", "topic": "火災", "stem": "山林火災之蔓延，有飛火時火蔓延速度可超過 10 m/min，甚至可達多少？", "opts": {"A": "1000 m/min", "B": "50 m/min", "C": "20 m/min", "D": "100 m/min 或更大"}, "answer": "D", "explain": "無飛火時一般不超過 10 m/min，有飛火時可達 100 m/min 或更大。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N4-100", "topic": "危險物品", "stem": "鋰電池「過充」導致起火之機制，下列何者正確？", "opts": {"A": "正極鋰離子數量增加，使正極儲存格膨脹破裂", "B": "鋰金屬堆積於負極表面長出樹枝狀結晶，穿破隔膜紙造成正負極短路", "C": "電池組外部絕緣不良，使電池芯外殼直接燃燒", "D": "電解液凝固使內阻降低而產生火花"}, "answer": "B", "explain": "過充使正極鋰子不到一半、儲存格垮掉，再充電鋰金屬堆積負極長出樹枝狀結晶，穿破隔膜而短路燃燒。", "ref": "火災學筆記第24講", "subject": "火災學", "src": "new"}, {"id": "F-N5-001", "topic": "火災", "stem": "電氣火災之發生，主要是因電能產生異常轉變而發生熱，此種熱包括下列哪兩種？", "opts": {"A": "輻射熱與對流熱", "B": "斷熱壓縮熱與摩擦熱", "C": "異常焦耳熱與放電火花發生的熱", "D": "分解熱與氧化熱"}, "answer": "C", "explain": "電氣火災係電能異常轉變為熱所致，熱的種類分為異常焦耳熱與放電火花之熱兩種；其餘選項為其他起火機制的熱源。", "ref": "火災學筆記第25講", "subject": "火災學", "src": "new"}, {"id": "F-N5-002", "topic": "火災", "stem": "下列何者屬於「電氣條件改變」中的「局部電阻值增加」現象？", "opts": {"A": "氧化亞銅增殖發熱", "B": "電容器絕緣劣化", "C": "線圈層間短路", "D": "銀離子的移動"}, "answer": "A", "explain": "局部電阻值增加包括半斷線、接觸電阻值增加、氧化亞銅增殖發熱；線圈層間短路與電容器絕緣劣化屬電阻值降低，銀離子移動屬回路外電流流通。", "ref": "火災學筆記第25講", "subject": "火災學", "src": "new"}, {"id": "F-N5-003", "topic": "火災", "stem": "下列何者屬於電氣因素所造成絕緣破壞中的「絕緣體變質」現象？", "opts": {"A": "異極導體直接接觸之短路", "B": "積污導電現象", "C": "銀離子的移動", "D": "部份放電造成的絕緣破壞"}, "answer": "D", "explain": "絕緣體變質包括金原現象與部份放電；積污導電與銀離子移動屬絕緣物表面附著導電性物質，短路屬通電導體的接觸。", "ref": "火災學筆記第25講", "subject": "火災學", "src": "new"}, {"id": "F-N5-004", "topic": "火災", "stem": "積污導電現象與金原現象初期成因不同，但依日本電氣學會定義，二者最後皆形成下列何者？", "opts": {"A": "短路熔珠", "B": "碳化導電通路（石墨化現象）", "C": "銀離子遷移路徑", "D": "氧化亞銅增殖層"}, "answer": "B", "explain": "積污導電初期因電解質污染物附著、金原現象為絕緣體本身導電化，但最後都使有機絕緣體石墨化，統稱石墨化現象（碳化導電通路）。", "ref": "火災學筆記第25講", "subject": "火災學", "src": "new"}, {"id": "F-N5-005", "topic": "火災", "stem": "單相三線式（1φ3w）配線於有負載時發生中性線斷線，會產生下列何種現象？", "opts": {"A": "負載較大之系統電壓增高，致負載發熱起火", "B": "負載較小之系統電壓增高，致負載發熱起火", "C": "兩系統電壓同時降低，電動機停止運轉", "D": "線電流變為原相電流之 √3 倍而過載"}, "answer": "B", "explain": "1φ3w 中性線斷線時，負載較小之一側電壓升高，使線圈或電阻類負載發熱起火；√3 倍線電流是 3φ3w 一線斷線（單相運轉）的特徵。", "ref": "火災學筆記第25講", "subject": "火災學", "src": "new"}, {"id": "F-N5-006", "topic": "火災", "stem": "運轉中之三相三線式電動機突然一線斷線而成單相運轉，若原相電流為 10 A，則線電流約為多少？", "opts": {"A": "17.3 A", "B": "30 A", "C": "10 A", "D": "14.1 A"}, "answer": "A", "explain": "單相（欠相）運轉時線電流為原相電流之 √3 倍：10 × 1.732 ≒ 17.3 A。", "ref": "火災學筆記第25講", "subject": "火災學", "src": "new"}, {"id": "F-N5-007", "topic": "火災", "stem": "靜電之氣中放電中，帶電物體或其附近接地體有突出部分或刃狀部分時，在其前端附近出現之微弱發光放電，稱為？", "opts": {"A": "沿面放電", "B": "火花放電", "C": "條狀放電", "D": "電暈放電"}, "answer": "D", "explain": "突出、刃狀、微弱發光為電暈放電；條狀放電伴隨爆音與樹狀發光；火花放電發生於平滑金屬導體與接地體間隔甚小時。", "ref": "火災學筆記第25講", "subject": "火災學", "src": "new"}, {"id": "F-N5-008", "topic": "火災", "stem": "樹木受到直擊雷後，因樹木電位高，再向附近建築物放電者，屬於何種落雷？", "opts": {"A": "誘導雷", "B": "側擊雷", "C": "直擊雷", "D": "侵入雷"}, "answer": "B", "explain": "側擊雷係主放電之分歧放電路通過建築物，或樹木受直擊雷後再向附近建築物放電；侵入雷則經送配電線進入。", "ref": "火災學筆記第25講", "subject": "火災學", "src": "new"}, {"id": "F-N5-009", "topic": "火災", "stem": "電線走火之發生原因約有六種，下列何者不在其中？", "opts": {"A": "銀離子的移動", "B": "半斷線", "C": "接地（漏電）", "D": "接觸不良"}, "answer": "A", "explain": "電線走火六原因：短路、過負載、半斷線、接觸不良、積污導電現象、接地（漏電）；銀離子移動不在其列。", "ref": "火災學筆記第26講", "subject": "火災學", "src": "new"}, {"id": "F-N5-010", "topic": "火災", "stem": "通電中電線之絕緣被覆劣化或破損產生短路而造成火災，其熔痕於火災發生前即已產生，稱為？", "opts": {"A": "漏電熔痕", "B": "熱痕", "C": "一次痕（原因痕）", "D": "二次痕（結果痕）"}, "answer": "C", "explain": "一次痕是短路引起火災所留、火災前已存在，故稱原因痕；二次痕是火災燒毀被覆後才短路，為結果痕。", "ref": "火災學筆記第26講", "subject": "火災學", "src": "new"}, {"id": "F-N5-011", "topic": "火災", "stem": "有關「熱痕」之敘述，下列何者正確？", "opts": {"A": "呈圓球形、具光澤，為起火原因之證據", "B": "由短路瞬間高溫形成，組織較密", "C": "表面粗糙、呈水滴垂狀，與火災原因無關", "D": "僅在溫度低於 1083℃ 時才會形成"}, "answer": "C", "explain": "熱痕由火災之熱緩慢熔解形成，受熱範圍大，表面粗糙呈水滴垂狀，與起火原因無關；圓球形具光澤者為短路痕。", "ref": "火災學筆記第26講", "subject": "火災學", "src": "new"}, {"id": "F-N5-012", "topic": "火災", "stem": "漏電熔痕之三點關係中，導電途徑上電阻較大處稱為？", "opts": {"A": "漏電點", "B": "接地點", "C": "短路點", "D": "發熱點"}, "answer": "D", "explain": "電流漏出導電體之處為漏電點、電阻較大處為發熱點、與大地接觸處為接地點。", "ref": "火災學筆記第26講", "subject": "火災學", "src": "new"}, {"id": "F-N5-013", "topic": "火災", "stem": "過大電流引起電線燃燒的過程中，「橡膠成為液狀激烈噴出，不久整個被覆著火，其後灰化剝落露出赤熱芯線」屬於哪一階段？", "opts": {"A": "引火階段", "B": "著火階段", "C": "發火階段", "D": "瞬間熔斷"}, "answer": "B", "explain": "著火階段特徵為橡膠液狀噴出、被覆自行著火、芯線赤熱但未斷；發火階段則於芯線熔斷前被覆發火。", "ref": "火災學筆記第26講", "subject": "火災學", "src": "new"}, {"id": "F-N5-014", "topic": "火災", "stem": "若電流為 20 A、電阻為 0.5 Ω，通電時間 30 秒，依焦耳定律其發熱量為多少焦耳？", "opts": {"A": "300 J", "B": "3000 J", "C": "6000 J", "D": "12000 J"}, "answer": "C", "explain": "H ＝ I²Rt ＝ 20² × 0.5 × 30 ＝ 6000 J。", "ref": "火災學筆記第26講", "subject": "火災學", "src": "new"}, {"id": "F-N5-015", "topic": "火災", "stem": "家用電壓 110 V，延長線容許電流 15 A，則該延長線最多可承受之電功率為多少？", "opts": {"A": "1100 W", "B": "2200 W", "C": "1650 W", "D": "1500 W"}, "answer": "C", "explain": "W ＝ V × I ＝ 110 × 15 ＝ 1650 W；接上電器總功率超過此值即超過負荷。", "ref": "火災學筆記第26講", "subject": "火災學", "src": "new"}, {"id": "F-N5-016", "topic": "火災", "stem": "PVC 電線絕緣物最高容許溫度 60℃，電線電阻 5 × 10⁻⁵ Ω、熱抗阻 400，周圍溫度 30℃，則通過約多少電流時絕緣物溫度將超過容許值？", "opts": {"A": "約 54.8 A", "B": "約 44.7 A", "C": "約 27.4 A", "D": "約 38.7 A"}, "answer": "D", "explain": "ΔT ＝ 60 － 30 ＝ 30℃；ΔT ＝ I²R × W → I² ＝ 30 ÷（5×10⁻⁵ × 400）＝ 1500，I ≒ 38.7 A。", "ref": "火災學筆記第26講", "subject": "火災學", "src": "new"}, {"id": "F-N5-017", "topic": "火災", "stem": "依摩擦帶電序列，頭髮與綿布相互摩擦時，下列敘述何者正確？", "opts": {"A": "二者皆不帶電", "B": "二者皆帶正電", "C": "頭髮帶負電、綿布帶正電", "D": "頭髮帶正電、綿布帶負電"}, "answer": "D", "explain": "帶電序列中位置靠前者帶正電、靠後者帶負電；頭髮排在綿布之前，故頭髮帶正電。", "ref": "火災學筆記第27講", "subject": "火災學", "src": "new"}, {"id": "F-N5-018", "topic": "火災", "stem": "帶電導體放電能量 H 與靜電容量 C、電壓 V、電荷 Q 之關係，下列何者錯誤？", "opts": {"A": "H ＝ ½QV", "B": "H ＝ ½Q²/C", "C": "H ＝ ½QC", "D": "H ＝ ½CV²"}, "answer": "C", "explain": "由 Q ＝ CV 可得 H ＝ ½CV² ＝ ½Q²/C ＝ ½QV；½QC 單位不合，為錯誤式。", "ref": "火災學筆記第27講", "subject": "火災學", "src": "new"}, {"id": "F-N5-019", "topic": "火災", "stem": "靜電放電而生火災之過程，下列排列順序何者正確？", "opts": {"A": "發生靜電 → 發生放電火花 → 內部產生分極 → 可燃物且 MIE 高於火花熱能", "B": "發生靜電 → 內部產生分極 → 發生放電火花 → 可燃物且 MIE 低於火花熱能", "C": "發生放電火花 → 發生靜電 → 內部產生分極 → 可燃物且 MIE 低於火花熱能", "D": "內部產生分極 → 發生靜電 → 可燃物且 MIE 低於火花熱能 → 發生放電火花"}, "answer": "B", "explain": "過程為：發生靜電、帶電體內部分極、異極間或與接地導體間放電火花、火花處有可燃物且其最小點火能量低於火花熱能。", "ref": "火災學筆記第27講", "subject": "火災學", "src": "new"}, {"id": "F-N5-020", "topic": "防火與特殊現象", "stem": "增加周圍空氣相對濕度以防止靜電災害，一般相對濕度需達多少以上方能在物體表面形成水膜使電荷洩漏？", "opts": {"A": "60～70%", "B": "30%", "C": "40～50%", "D": "90～95%"}, "answer": "A", "explain": "相對濕度達 60～70% 以上時表面形成水膜使靜電荷洩漏；30% 以下時電荷蓄積反而增加。", "ref": "火災學筆記第27講", "subject": "火災學", "src": "new"}, {"id": "F-N5-021", "topic": "防火與特殊現象", "stem": "靜電災害防止方法中，「高壓離子化方法」係利用何種放電使空氣離子化，屬於哪一類防止方法？", "opts": {"A": "條狀放電；使空間不活性化", "B": "火花放電；藉洩漏防止電荷蓄積", "C": "電暈放電；藉中和防止電荷蓄積", "D": "沿面放電；防止靜電發生"}, "answer": "C", "explain": "高壓離子化與靜電誘導離子化都是利用電暈放電使周圍空氣離子化，以中和帶電體電荷，屬「藉中和防止電荷蓄積」。", "ref": "火災學筆記第27講", "subject": "火災學", "src": "new"}, {"id": "F-N5-022", "topic": "防火與特殊現象", "stem": "使可燃性蒸氣空間「不活性化」，即使發生靜電火花亦不致引火，下列何者為其方法之一？", "opts": {"A": "以壓縮空氣吹散帶電體電荷", "B": "使空間可燃性蒸氣濃度達到爆炸界限以上", "C": "使空間可燃性蒸氣濃度恰在燃燒範圍中央", "D": "提高空間氧濃度至 25% 以上"}, "answer": "B", "explain": "不使引火之方法：以不活性氣體代替氧使氧濃度低於極限氧濃度，或使蒸氣濃度高於爆炸界限。", "ref": "火災學筆記第27講", "subject": "火災學", "src": "new"}, {"id": "F-N5-023", "topic": "火災", "stem": "某金屬容器靜電容量為 200 pF，帶電電位 5000 V，若放電時能量悉數放出，其放電能量為多少？", "opts": {"A": "2.5 × 10⁻³ J", "B": "2.5 × 10⁻⁶ J", "C": "5.0 × 10⁻⁴ J", "D": "5.0 × 10⁻³ J"}, "answer": "A", "explain": "H ＝ ½CV² ＝ ½ × 200×10⁻¹² × 5000² ＝ 2.5 × 10⁻³ J。", "ref": "火災學筆記第27講", "subject": "火災學", "src": "new"}, {"id": "F-N5-024", "topic": "火災", "stem": "金屬罐分裝洗淨油，測得流出量 1000 mL 時帶電壓 8 V、1400 mL 時 11 V（呈直線關係）。若最大流出量 3000 mL、靜電容量 2 nF，其放電能量為多少？", "opts": {"A": "2.3 × 10⁻⁸ J", "B": "5.29 × 10⁻⁷ J", "C": "1.06 × 10⁻⁶ J", "D": "4.6 × 10⁻⁸ J"}, "answer": "B", "explain": "V ＝ aQ ＋ b：a ＝ 3/400 ＝ 0.0075、b ＝ 0.5；Q ＝ 3000 時 V ＝ 23 V；H ＝ ½ × 2×10⁻⁹ × 23² ＝ 5.29 × 10⁻⁷ J。", "ref": "火災學筆記第27講", "subject": "火災學", "src": "new"}, {"id": "F-N5-025", "topic": "防火與特殊現象", "stem": "縱火防範「三從四得」中，「從消防死角做起」之具體做法為何？", "opts": {"A": "學會滅火方法以初期撲滅", "B": "注意有無可疑人、事、物", "C": "設置監視設備或照明燈具", "D": "清除雜物避免被引燃"}, "answer": "C", "explain": "從消防死角做起＝設監視或照明；從守望相助著手＝注意可疑人事物；從消除雜物動手＝避免被引燃。", "ref": "火災學筆記第28講", "subject": "火災學", "src": "new"}, {"id": "F-N5-026", "topic": "防火與特殊現象", "stem": "縱火防範「四得」中，「監視設備要捨得」之目的為何？", "opts": {"A": "提早發現可疑人、事、物", "B": "避免雜物被縱火引燃", "C": "火災初期即能撲滅", "D": "避免人員闖入縱火"}, "answer": "A", "explain": "監視設備要捨得＝提早發現可疑人事物；大門上鎖要記得＝避免闖入；滅火方法要曉得＝初期撲滅。", "ref": "火災學筆記第28講", "subject": "火災學", "src": "new"}, {"id": "F-N5-027", "topic": "火災", "stem": "一般香煙燃燒時，中心部與表面之溫度約各為多少？", "opts": {"A": "中心 1000～1100℃、表面 500～600℃", "B": "中心 400～600℃、表面 100～150℃", "C": "中心 200～300℃、表面 700～800℃", "D": "中心 700～800℃、表面 200～300℃"}, "answer": "D", "explain": "香煙中心部約 700～800℃，表面約 200～300℃；氧濃度降至 16% 以下即難持續燃燒。", "ref": "火災學筆記第28講", "subject": "火災學", "src": "new"}, {"id": "F-N5-028", "topic": "火災", "stem": "點燃中的香煙在周圍氧氣濃度降至多少以下時，即難以持續燃燒？", "opts": {"A": "16%", "B": "12%", "C": "8%", "D": "19%"}, "answer": "A", "explain": "香煙燃燒在氧濃度 16% 以下時即難持續。", "ref": "火災學筆記第28講", "subject": "火災學", "src": "new"}, {"id": "F-N5-029", "topic": "火災", "stem": "香煙中心溫度雖達 700～800℃，但攜帶點燃中之香煙「移動」進入汽油蒸氣爆炸界限內之處所，為何不易起火？", "opts": {"A": "香煙燃燒產生之 CO₂ 使氧濃度降至 10% 以下", "B": "香煙中心溫度低於汽油發火點", "C": "表面熱量被氣體奪取且火點時刻移動，表面溫度不易達汽油發火點", "D": "汽油蒸氣濃度必然低於燃燒下限"}, "answer": "C", "explain": "移動狀態下香煙表面受空氣或 CO₂ 包圍、熱被奪取，火點又不斷移動，表面溫度難達汽油發火點 280～300℃；靜置時則有起火危險。", "ref": "火災學筆記第28講", "subject": "火災學", "src": "new"}, {"id": "F-N5-030", "topic": "火災", "stem": "東京消防廳以塑膠垃圾桶進行之菸蒂起火實驗，投入菸蒂後約多久出現火焰？", "opts": {"A": "5 分鐘", "B": "15 分鐘", "C": "20 分鐘", "D": "30 秒"}, "answer": "B", "explain": "實驗：30 秒無焰燃燒移轉、5 分鐘輕微白煙、15 分鐘火焰出現、20 分鐘垃圾桶完全燒熔。", "ref": "火災學筆記第28講", "subject": "火災學", "src": "new"}, {"id": "F-N5-031", "topic": "火災", "stem": "石油醚燃燒範圍 1.1～5.9%、自動發火溫度 288℃。某室內石油醚濃度 3.5%，有人攜帶點燃之香煙進入，判斷是否起火之關鍵為何？", "opts": {"A": "濃度高於燃燒上限，必不起火", "B": "只要有香煙即必然爆炸，與溫度無關", "C": "濃度低於燃燒下限，必不起火", "D": "組成條件已成立，取決於香煙能否使其達到 288℃"}, "answer": "D", "explain": "3.5% 在 1.1～5.9% 內，組成條件成立；能否起火看能量條件，即香煙能否使石油醚達 288℃：移動時不易、靜置時可能。", "ref": "火災學筆記第28講", "subject": "火災學", "src": "new"}, {"id": "F-N5-032", "topic": "防火與特殊現象", "stem": "有關菸蒂火災預防措施，下列何者正確？", "opts": {"A": "菸蒂熄滅後直接倒入垃圾桶", "B": "睡前吸菸後將菸灰缸置於床頭", "C": "走路吸菸時將菸蒂丟入水溝", "D": "菸灰缸內放水並定時清理"}, "answer": "D", "explain": "預防措施：不亂丟、不亂放、不走路吸菸、不睡覺吸菸，並正確使用菸灰缸（放水、定時定量清理），勿將菸蒂直接倒入垃圾桶。", "ref": "火災學筆記第28講", "subject": "火災學", "src": "new"}, {"id": "F-N5-033", "topic": "危險物品", "stem": "依公共危險物品相關設置標準，第三類公共危險物品之名稱為何？", "opts": {"A": "易燃固體", "B": "自反應物質及有機過氧化物", "C": "發火性液體、發火性固體及禁水性物質", "D": "氧化性固體"}, "answer": "C", "explain": "六類依序為氧化性固體、易燃固體、發火性液體固體及禁水性物質、易燃液體及可燃液體、自反應物質及有機過氧化物、氧化性液體。", "ref": "火災學筆記第29講", "subject": "火災學", "src": "new"}, {"id": "F-N5-034", "topic": "危險物品", "stem": "下列何者為第一類公共危險物品（氧化性固體）之特性？", "opts": {"A": "含 -O-O- 結構，自加速分解", "B": "本身易燃，較低溫即著火", "C": "與空氣接觸即自燃", "D": "本身不燃，受熱、衝擊、摩擦分解釋出氧氣"}, "answer": "D", "explain": "氧化性固體本身不燃但氧化性強，受熱、衝擊、摩擦分解放氧，使接觸之可燃物急速氧化燃燒。", "ref": "火災學筆記第29講", "subject": "火災學", "src": "new"}, {"id": "F-N5-035", "topic": "危險物品", "stem": "第一類公共危險物品中，下列何者滅火時不可用水？", "opts": {"A": "硝酸鹽類", "B": "無機過氧化物", "C": "氯酸鹽類", "D": "過錳酸鹽類"}, "answer": "B", "explain": "第一類一般以冷卻抑制氧之分解，但無機過氧化物遇水放氧放熱，不可用水。", "ref": "火災學筆記第29講", "subject": "火災學", "src": "new"}, {"id": "F-N5-036", "topic": "危險物品", "stem": "有關第二類公共危險物品（易燃固體）之滅火方式，下列何者正確？", "opts": {"A": "一般用水冷卻、不可用窒息，但金屬粉不可用水", "B": "一律以乾砂窒息、禁止用水", "C": "以二氧化碳窒息為主，不可冷卻", "D": "一律用水冷卻，金屬粉亦同"}, "answer": "A", "explain": "易燃固體滅火以用水冷卻為原則、不可用窒息方式；但金屬粉遇水危險，不可用水撲滅。", "ref": "火災學筆記第29講", "subject": "火災學", "src": "new"}, {"id": "F-N5-037", "topic": "危險物品", "stem": "第二類公共危險物品中之「易燃性固體」係指下列何者？", "opts": {"A": "自燃溫度 100℃ 以下之固體", "B": "閃火點未達 21℃ 之固體", "C": "硫化磷、赤磷及硫磺", "D": "固態酒精或一大氣壓下閃火點未達 40℃ 之固體"}, "answer": "D", "explain": "易燃性固體係固態酒精或閃火點未達 40℃ 之固體，管制量 1000 kg；硫化磷、赤磷、硫磺另列，管制量 100 kg。", "ref": "火災學筆記第29講", "subject": "火災學", "src": "new"}, {"id": "F-N5-038", "topic": "危險物品", "stem": "第三類公共危險物品中，管制量為 10 kg 者，不包括下列何者？", "opts": {"A": "烷基鋁", "B": "鉀", "C": "烷基鋰", "D": "黃磷"}, "answer": "D", "explain": "鉀、鈉、烷基鋁、烷基鋰管制量 10 kg；黃磷為 20 kg。", "ref": "火災學筆記第29講", "subject": "火災學", "src": "new"}, {"id": "F-N5-039", "topic": "危險物品", "stem": "第三類公共危險物品（禁水性物質）之滅火，下列何者最適當？", "opts": {"A": "乾砂或膨脹蛭石", "B": "機械泡沫覆蓋", "C": "大量水霧冷卻", "D": "強化液噴灑"}, "answer": "A", "explain": "第三類滅火用乾砂、輕石（膨脹蛭石），禁用水；泡沫與強化液皆含水。", "ref": "火災學筆記第29講", "subject": "火災學", "src": "new"}, {"id": "F-N5-040", "topic": "危險物品", "stem": "第一類公共危險物品分三級，其第一級之管制量為多少？", "opts": {"A": "10 kg", "B": "50 kg", "C": "1000 kg", "D": "300 kg"}, "answer": "B", "explain": "第一類管制量：第一級 50 kg、第二級 300 kg、第三級 1000 kg。", "ref": "火災學筆記第29講", "subject": "火災學", "src": "new"}, {"id": "F-N5-041", "topic": "危險物品", "stem": "依規定，「易燃液體」係指一大氣壓時閃火點在多少以下之液體？", "opts": {"A": "70℃", "B": "93℃", "C": "250℃", "D": "21℃"}, "answer": "B", "explain": "易燃液體閃火點 93℃ 以下；超過 93℃ 未滿 250℃ 者為可燃液體。", "ref": "火災學筆記第30講", "subject": "火災學", "src": "new"}, {"id": "F-N5-042", "topic": "危險物品", "stem": "第四類公共危險物品中之「特殊易燃物」，其定義為何？", "opts": {"A": "自燃溫度 100℃ 以下，或閃火點低於 －20℃ 且沸點 40℃ 以下", "B": "閃火點在 21℃ 以上未達 70℃", "C": "自燃溫度 200℃ 以下，或閃火點低於 0℃ 且沸點 60℃ 以下", "D": "閃火點未達 21℃"}, "answer": "A", "explain": "特殊易燃物：自燃溫度 100℃ 以下，或閃火點低於 －20℃ 且沸點在 40℃ 以下，如乙醚、二硫化碳。", "ref": "火災學筆記第30講", "subject": "火災學", "src": "new"}, {"id": "F-N5-043", "topic": "危險物品", "stem": "某非酒精類液體於一大氣壓時閃火點為 50℃，依第四類公共危險物品分類屬於何者？", "opts": {"A": "第二石油類", "B": "第一石油類", "C": "第三石油類", "D": "第四石油類"}, "answer": "A", "explain": "第一石油類未達 21℃；第二石油類 21℃ 以上未達 70℃；第三石油類 70～200℃；第四石油類 200～250℃。50℃ 屬第二石油類。", "ref": "火災學筆記第30講", "subject": "火災學", "src": "new"}, {"id": "F-N5-044", "topic": "危險物品", "stem": "第四類公共危險物品中之「酒精類」，係指一個分子之碳原子數在多少之間，並含有一個飽和羥基者？", "opts": {"A": "三到六", "B": "二到四", "C": "一到五", "D": "一到三"}, "answer": "D", "explain": "酒精類指碳原子數一到三、含一個飽和羥基者（如甲醇、乙醇、丙醇），含量未達 60% 之水溶液除外。", "ref": "火災學筆記第30講", "subject": "火災學", "src": "new"}, {"id": "F-N5-045", "topic": "危險物品", "stem": "含有二個氧原子以單鍵鍵結（-O-O-）結構之液態或固態有機物質，屬熱不穩定而可自加速分解者，稱為？", "opts": {"A": "無機過氧化物", "B": "有機過氧化物", "C": "氧化性液體", "D": "自反應物質"}, "answer": "B", "explain": "有機過氧化物具 -O-O- 結構，可視為過氧化氫之衍生物，熱不穩定、放熱自加速分解；屬第五類。", "ref": "火災學筆記第30講", "subject": "火災學", "src": "new"}, {"id": "F-N5-046", "topic": "危險物品", "stem": "下列何者不屬於第六類公共危險物品（氧化性液體）？", "opts": {"A": "硝酸", "B": "過氧化鈉", "C": "過氧化氫", "D": "過氯酸"}, "answer": "B", "explain": "氧化性液體如過氯酸、過氧化氫、硝酸；過氧化鈉為固體無機過氧化物，屬第一類。", "ref": "火災學筆記第30講", "subject": "火災學", "src": "new"}, {"id": "F-N5-047", "topic": "危險物品", "stem": "NFPA 704M 物料火災危險標誌中，黃色方塊代表何種危險性？", "opts": {"A": "反應性", "B": "可燃性", "C": "禁水性等其他特性", "D": "有害健康的毒性"}, "answer": "A", "explain": "紅色表可燃性、藍色表有害健康、黃色表反應性，最下方表示禁水性（W）、氧化劑（OXY）等其他特性。", "ref": "火災學筆記第30講", "subject": "火災學", "src": "new"}, {"id": "F-N5-048", "topic": "危險物品", "stem": "依 104 年修訂之 CNS 1387 火災分類，第四類公共危險物品中之「動植物油類」火災屬於何類？", "opts": {"A": "A 類", "B": "B 類", "C": "F 類", "D": "C 類"}, "answer": "C", "explain": "CNS 1387：A 固體、B 液體、C 氣體、D 金屬、F 烹調用油脂；動植物油類屬 F 類，其餘第四類屬 B 類。", "ref": "火災學筆記第30講", "subject": "火災學", "src": "new"}, {"id": "F-N5-049", "topic": "危險物品", "stem": "自然發火與準自然發火二者之主要相異點為何？", "opts": {"A": "是否需要化學反應熱", "B": "發火時間之過程不同", "C": "是否需要可燃物", "D": "發火之熱源本質不同"}, "answer": "B", "explain": "二者本質相同，皆因化學反應熱而發火；差別在發火時間——自然發火需長期蓄熱，準自然發火在空氣中立即發火或因水分而發火。", "ref": "火災學筆記第31講", "subject": "火災學", "src": "new"}, {"id": "F-N5-050", "topic": "危險物品", "stem": "下列何種情況最不易發生自然發火？", "opts": {"A": "薄片狀物質重疊堆放", "B": "粉末狀物質大量堆積", "C": "物質置於空氣流動良好之通風處所", "D": "熱傳導度小之物質"}, "answer": "C", "explain": "空氣流動大則對流散熱、熱蓄積變差，故通風處較不易自然發火；堆積、重疊、熱傳導度小皆利於蓄熱。", "ref": "火災學筆記第31講", "subject": "火災學", "src": "new"}, {"id": "F-N5-051", "topic": "危險物品", "stem": "有關「水分」對自然發火之影響，下列敘述何者正確？", "opts": {"A": "水分與自然發火完全無關", "B": "水分多不利熱之蓄積，但作為觸媒可加快熱之發生速度", "C": "水分一律有利於熱之蓄積", "D": "水分一律不利於自然發火"}, "answer": "B", "explain": "熱之蓄積方面，水分多則散熱快、不利蓄熱；熱的發生速度方面，適量水分作為觸媒降低活化能，有利自然發火。", "ref": "火災學筆記第31講", "subject": "火災學", "src": "new"}, {"id": "F-N5-052", "topic": "危險物品", "stem": "依「新舊程度」對自然發火之影響，下列何者「愈久」愈容易發生自然發火？", "opts": {"A": "活性碳", "B": "石碳", "C": "硝化綿", "D": "油煙"}, "answer": "C", "explain": "石碳、活性碳、油煙、煤灰愈新者愈易發熱；賽璐珞、硝化綿等不安定物則愈久愈易分解。", "ref": "火災學筆記第31講", "subject": "火災學", "src": "new"}, {"id": "F-N5-053", "topic": "危險物品", "stem": "活性碳等碳類粉末表面仍具活性，吸著空氣中氣體而發熱蓄積導致自然發火，屬於何種熱？", "opts": {"A": "分解熱", "B": "吸著熱", "C": "聚合熱", "D": "氧化熱"}, "answer": "B", "explain": "碳類粉末（活性碳、素灰、還元鎳）因吸著熱而自然發火；賽璐珞為分解熱、油脂為氧化熱。", "ref": "火災學筆記第31講", "subject": "火災學", "src": "new"}, {"id": "F-N5-054", "topic": "危險物品", "stem": "以碘價判斷不飽和油脂之自然發火危險性，碘價在多少以上者可視為危險？", "opts": {"A": "200", "B": "100", "C": "50", "D": "130"}, "answer": "D", "explain": "碘價為 100 g 脂肪吸收碘之克數，130 以上可視為危險；亞麻仁油高達 200。", "ref": "火災學筆記第31講", "subject": "火災學", "src": "new"}, {"id": "F-N5-055", "topic": "危險物品", "stem": "碳化鈣（CaC₂）與水反應所生成之可燃性氣體為何？", "opts": {"A": "氫氣", "B": "磷化氫", "C": "乙炔", "D": "甲烷"}, "answer": "C", "explain": "CaC₂ ＋ 2H₂O → Ca(OH)₂ ＋ C₂H₂（乙炔）；碳化鋁生甲烷、磷化鈣生磷化氫、鈉生氫氣。", "ref": "火災學筆記第31講", "subject": "火災學", "src": "new"}, {"id": "F-N5-056", "topic": "危險物品", "stem": "下列何者屬於「物質本身發熱而使接觸之可燃物發火」之準自然發火物質？", "opts": {"A": "金屬鈉", "B": "磷化鈣", "C": "生石灰", "D": "碳化鈣"}, "answer": "C", "explain": "生石灰、漂白粉、五氧化二磷、鹼金屬過氧化物本身不燃，遇水發熱使接觸之可燃物發火；其餘選項遇水生成可燃性氣體。", "ref": "火災學筆記第31講", "subject": "火災學", "src": "new"}, {"id": "F-N5-057", "topic": "危險物品", "stem": "依公共危險物品之混合危險性，下列哪一組合「無混合危險」？", "opts": {"A": "第一類與第四類", "B": "第三類與第四類", "C": "第四類與第六類", "D": "第二類與第四類"}, "answer": "D", "explain": "僅第二類（易燃固體）與第四類（易燃液體）無混合危險；III＆IV、IV＆VI 危險性小但仍視為有危險，第一類與任何類皆有危險。", "ref": "火災學筆記第32講", "subject": "火災學", "src": "new"}, {"id": "F-N5-058", "topic": "危險物品", "stem": "依公共危險物品之混合危險性，下列哪一組合屬「有危險，應禁止混合載運」？", "opts": {"A": "第二類與第五類", "B": "第四類與第五類", "C": "第三類與第四類", "D": "第一類與第二類"}, "answer": "D", "explain": "危險性小者為 II＆V、III＆IV、IV＆V、IV＆VI；第一類為供氧方，與第二類混合屬有危險應禁止混載。", "ref": "火災學筆記第32講", "subject": "火災學", "src": "new"}, {"id": "F-N5-059", "topic": "危險物品", "stem": "有關影響混合危險之因子，下列敘述何者正確？", "opts": {"A": "混合物種越多，發火時間越長", "B": "一般在加壓情況下，發火時間將縮短", "C": "呋喃甲醇與硝酸混合，硝酸濃度越高發火時間越長", "D": "容器形狀與試料量不影響混合危險"}, "answer": "B", "explain": "加壓時氣體發生速度大於逸散速度，發火時間縮短；混合物種越多、硝酸濃度越高，發火時間越短；容器與試料量亦有影響。", "ref": "火災學筆記第32講", "subject": "火災學", "src": "new"}, {"id": "F-N5-060", "topic": "燃燒", "stem": "所謂「引火點」，係指可燃性液體在空氣中產生之可燃性蒸氣到達何種濃度時之液體表面溫度？", "opts": {"A": "燃燒下限", "B": "燃燒上限", "C": "化學理論濃度", "D": "飽和蒸氣濃度"}, "answer": "A", "explain": "引火點（閃火點）為液體蒸氣達燃燒下限時之液面溫度。", "ref": "火災學筆記第32講", "subject": "火災學", "src": "new"}, {"id": "F-N5-061", "topic": "燃燒", "stem": "有關影響引火之因素，下列敘述何者正確？", "opts": {"A": "燃燒下限愈大者，愈容易引火", "B": "熔點愈高者，愈容易引火", "C": "蒸發熱（氣化熱）愈小者，愈容易引火", "D": "沸點愈高者，愈容易引火"}, "answer": "C", "explain": "氣化熱小、沸點低、熔點低、燃燒下限小且範圍廣、最小發火能量小者，皆愈易引火。", "ref": "火災學筆記第32講", "subject": "火災學", "src": "new"}, {"id": "F-N5-062", "topic": "燃燒", "stem": "可燃性氣體之最小發火能量，若以氦（He）替代空氣中之氮（N₂），發火能量將如何變化？原因為何？", "opts": {"A": "減小；He 熱傳導率較大", "B": "增大；He 熱傳導率較大", "C": "增大；He 分子量較大", "D": "不變；He 為惰性氣體"}, "answer": "B", "explain": "熱傳導率愈大者發火能量愈高：He 熱傳導率大於 N₂，故以 He 替代時發火能量增大；以 Ar 替代則降低。", "ref": "火災學筆記第32講", "subject": "火災學", "src": "new"}, {"id": "F-N5-063", "topic": "燃燒", "stem": "發火能量與壓力平方成反比，但壓力過低時此關係崩潰，即使給予再大能量亦不發火；尚可發火之最低壓力稱為？", "opts": {"A": "臨界壓力", "B": "最小發火壓力", "C": "可燃性峰值", "D": "壓力界限"}, "answer": "B", "explain": "最小發火壓力為尚可發火之最低壓力（如氫 11.5 mmHg、甲烷 19 mmHg）；壓力界限是燃燒上下限一致之點。", "ref": "火災學筆記第32講", "subject": "火災學", "src": "new"}, {"id": "F-N5-064", "topic": "燃燒", "stem": "某可燃性氣體燃燒下限 5%、上限 15%，其危險指數為多少？", "opts": {"A": "2", "B": "3", "C": "10", "D": "0.33"}, "answer": "A", "explain": "危險指數 ＝（U － L）/ L ＝（15 － 5）/ 5 ＝ 2。", "ref": "火災學筆記第32講", "subject": "火災學", "src": "new"}, {"id": "F-N5-065", "topic": "爆炸", "stem": "BLEVE 一詞之意義為何？", "opts": {"A": "非密閉空間蒸氣雲爆炸", "B": "粉塵雲爆炸", "C": "液體混合放熱爆炸", "D": "沸騰液體膨脹蒸氣爆炸"}, "answer": "D", "explain": "BLEVE ＝ Boiling Liquid Expanding Vapor Explosion，指沸騰狀態液體氣化膨脹而產生爆炸之現象；非密閉空間蒸氣雲爆炸為 UVCE。", "ref": "火災學筆記第33講", "subject": "火災學", "src": "new"}, {"id": "F-N5-066", "topic": "爆炸", "stem": "防止 BLEVE 之方法中，對可燃性液化瓦斯容器作外部斷熱處理，可使熱侵入容器之速度降為多少？", "opts": {"A": "1/10", "B": "1/5", "C": "1/100", "D": "1/2"}, "answer": "A", "explain": "BLEVE 防止三法：防液堤作成斜坡、容器外部斷熱處理（熱侵入速度降為 1/10）、設固定式冷卻撒水設備。", "ref": "火災學筆記第33講", "subject": "火災學", "src": "new"}, {"id": "F-N5-067", "topic": "爆炸", "stem": "有關油池火災與火球火災之比較，下列何者正確？", "opts": {"A": "油池火災屬擴散燃燒；火球火災屬混合燃燒", "B": "火球火災燃燒發生於液體表面上方", "C": "油池火災以 LPG、LNG 為主", "D": "油池火災屬混合燃燒；火球火災屬擴散燃燒"}, "answer": "A", "explain": "油池火災為擴散燃燒、發生於液面上方、以石油類居多；火球為混合燃燒、發生於空間蒸氣雲、以 LPG、LNG 為主。", "ref": "火災學筆記第33講", "subject": "火災學", "src": "new"}, {"id": "F-N5-068", "topic": "防火與特殊現象", "stem": "重質油類儲槽火災之「溢流（slopover）」現象，其水之來源為何？", "opts": {"A": "消防射水之水柱", "B": "槽底之水墊層", "C": "空氣中之水蒸氣凝結", "D": "油中之乳化水"}, "answer": "D", "explain": "溢流係油中乳化水受熱汽化膨脹所致；突沸則是熱波遇槽底水墊層所致。", "ref": "火災學筆記第33講", "subject": "火災學", "src": "new"}, {"id": "F-N5-069", "topic": "爆炸", "stem": "重質油槽火災中，熱波向下移動且速度大於燃燒速度，遇到槽底水墊層而大量汽化，衝破油層向上猛烈噴出之現象稱為？", "opts": {"A": "突沸（boilover）", "B": "閃燃", "C": "溢流（slopover）", "D": "BLEVE"}, "answer": "A", "explain": "突沸為熱波到達槽底水墊層，蒸氣壓超過上部油層重量而衝破油層猛烈噴出。", "ref": "火災學筆記第33講", "subject": "火災學", "src": "new"}, {"id": "F-N5-070", "topic": "防火與特殊現象", "stem": "有關溢流與突沸之比較，下列何者正確？", "opts": {"A": "二者必定同時發生", "B": "一般先發生突沸再溢流，溢流危害較大", "C": "二者之水來源皆為乳化水", "D": "一般先發生溢流再突沸，突沸危害較大"}, "answer": "D", "explain": "一般先溢流後突沸，突沸高度與範圍較大、危害較大；有時僅發生其一；水源分別為乳化水與水墊層。", "ref": "火災學筆記第33講", "subject": "火災學", "src": "new"}, {"id": "F-N5-071", "topic": "防火與特殊現象", "stem": "液面面積 2 m² 之油池，100 秒內燒掉 10 kg 之液體，其質量燃燒速度為多少？", "opts": {"A": "0.1 kg/(m²·s)", "B": "0.5 kg/(m²·s)", "C": "0.05 kg/(m²·s)", "D": "5 kg/(m²·s)"}, "answer": "C", "explain": "G ＝ g/(A·t) ＝ 10 ÷（2 × 100）＝ 0.05 kg/(m²·s)。", "ref": "火災學筆記第33講", "subject": "火災學", "src": "new"}, {"id": "F-N5-072", "topic": "防火與特殊現象", "stem": "油池質量燃燒速度 0.05 kg/(m²·s)、液面面積 4 m²、燃燒熱 40 MJ/kg，其熱釋放率為多少？", "opts": {"A": "8 kW", "B": "80000 kW", "C": "8000 kW", "D": "800 kW"}, "answer": "C", "explain": "Q ＝ G × A × ΔH ＝ 0.05 × 4 × 40000 kJ/kg ＝ 8000 kW（燃燒熱須換成 kJ/kg）。", "ref": "火災學筆記第33講", "subject": "火災學", "src": "new"}, {"id": "F-N5-073", "topic": "滅火", "stem": "乾粉滅火藥劑最主要之滅火作用為何？", "opts": {"A": "遮斷作用", "B": "冷卻作用", "C": "抑制作用", "D": "稀釋作用"}, "answer": "C", "explain": "乾粉最大的滅火作用為抑制燃燒，金屬 M 作催化劑使 OH· 與 H· 結合成水；冷卻、遮斷、稀釋因停留時間短效果不大。", "ref": "火災學筆記第34講", "subject": "火災學", "src": "new"}, {"id": "F-N5-074", "topic": "滅火", "stem": "第三種乾粉（ABC 乾粉）之主成分為何？", "opts": {"A": "磷酸二氫銨（NH₄H₂PO₄）70% 以上", "B": "碳酸氫鉀與尿素之反應物", "C": "碳酸氫鉀（KHCO₃）85% 以上", "D": "碳酸氫鈉（NaHCO₃）90% 以上"}, "answer": "A", "explain": "BC 乾粉為碳酸氫鈉 90% 以上、KBC 為碳酸氫鉀 85% 以上、ABC 為磷酸二氫銨 70% 以上、第四種為碳酸氫鉀與尿素反應物。", "ref": "火災學筆記第34講", "subject": "火災學", "src": "new"}, {"id": "F-N5-075", "topic": "滅火", "stem": "第二種乾粉（紫焰乾粉，KBC）之著色為何？", "opts": {"A": "淺紫色", "B": "灰白色", "C": "白色", "D": "粉紅色"}, "answer": "A", "explain": "BC 白色、KBC 淺紫色、ABC 通常粉紅色、第四種（Monnex）灰白色。", "ref": "火災學筆記第34講", "subject": "火災學", "src": "new"}, {"id": "F-N5-076", "topic": "滅火", "stem": "俗稱「錳鈉克斯（Monnex）」之第四種乾粉，其成分為何？", "opts": {"A": "碳酸氫鈉與硫酸鉀之混合物", "B": "磷酸二氫銨與白土之混合物", "C": "碳酸氫鉀與尿素之化學反應物", "D": "氯化鈉與石墨之混合物"}, "answer": "C", "explain": "第四種乾粉（XBC、Monnex）為碳酸氫鉀與尿素之化學反應物，鉀 27～29%、氮 14～17%，灰白色。", "ref": "火災學筆記第34講", "subject": "火災學", "src": "new"}, {"id": "F-N5-077", "topic": "滅火", "stem": "第三種乾粉受熱之反應生成物，依序下列何者正確？", "opts": {"A": "偏磷酸 → 焦磷酸 → 磷酸 → 五氧化二磷", "B": "磷酸 → 偏磷酸 → 五氧化二磷 → 焦磷酸", "C": "磷酸 → 焦磷酸 → 偏磷酸 → 五氧化二磷", "D": "焦磷酸 → 磷酸 → 五氧化二磷 → 偏磷酸"}, "answer": "C", "explain": "NH₄H₂PO₄ 受熱生成磷酸與氨，磷酸脫水成焦磷酸、再成偏磷酸，最後成五氧化二磷。", "ref": "火災學筆記第34講", "subject": "火災學", "src": "new"}, {"id": "F-N5-078", "topic": "滅火", "stem": "D 類（金屬火災）乾粉中，主要成分為氯化鈉（83～88%）者為何？", "opts": {"A": "Met-L-X", "B": "Monnex", "C": "TEC", "D": "Lith-X"}, "answer": "A", "explain": "Met-L-X 主成分 NaCl 83～88%；TEC 為 BaCl₂、KCl、NaCl 混合物；Lith-X 主要為石墨顆粒。", "ref": "火災學筆記第34講", "subject": "火災學", "src": "new"}, {"id": "F-N5-079", "topic": "滅火", "stem": "依 NFPA 2010，由固體混合藥劑經化學反應產生直徑小於 10 微米之固體微粒及氣體所組成之滅火媒介物，屬於何種系統？", "opts": {"A": "分散型氣霧系統", "B": "濃縮型氣霧系統", "C": "惰性氣體系統", "D": "細水霧系統"}, "answer": "B", "explain": "濃縮型氣霧由固體藥劑經化學反應產生；分散型則先存放於鹵化碳或惰性氣體加壓容器中，再散佈至防護區。", "ref": "火災學筆記第34講", "subject": "火災學", "src": "new"}, {"id": "F-N5-080", "topic": "滅火", "stem": "氣霧式滅火系統真正產生滅火作用者為何？", "opts": {"A": "二氧化碳之稀釋作用", "B": "固體微粒子之吸熱與抑制作用", "C": "水蒸氣之冷卻作用", "D": "惰性氣體降低氧濃度之窒息作用"}, "answer": "B", "explain": "氣霧中惰性氣體量對氧濃度幾乎無影響，真正滅火的是固體微粒子（以碳酸鉀為主）之吸熱與抑制自由基作用。", "ref": "火災學筆記第34講", "subject": "火災學", "src": "new"}, {"id": "F-N5-081", "topic": "滅火", "stem": "依 NFPA 750，細水霧之定義為何？", "opts": {"A": "50% 體積之水滴粒徑小於或等於 1000 μm", "B": "99% 體積之水滴粒徑小於或等於 100 μm", "C": "99% 體積之水滴粒徑小於或等於 1000 μm", "D": "90% 體積之水滴粒徑小於或等於 100 μm"}, "answer": "C", "explain": "NFPA 750 定義細水霧為 Dv0.99 ≦ 1000 μm，即 99% 體積之水滴粒徑不大於 1000 μm。", "ref": "火災學筆記第35講", "subject": "火災學", "src": "new"}, {"id": "F-N5-082", "topic": "滅火", "stem": "細水霧系統依管系壓力區分，高壓系統之壓力為何？", "opts": {"A": "500 psi（34.5 bars）以上", "B": "1000 psi 以上", "C": "175 psi（12.1 bars）以下", "D": "175～500 psi 之間"}, "answer": "A", "explain": "高壓系統 ≧ 500 psi；中壓系統介於 175～500 psi；低壓系統 ≦ 175 psi。", "ref": "火災學筆記第35講", "subject": "火災學", "src": "new"}, {"id": "F-N5-083", "topic": "滅火", "stem": "下列何者不屬於細水霧之滅火作用機制？", "opts": {"A": "中斷連鎖反應之化學抑制作用", "B": "遮斷輻射熱作用", "C": "冷卻作用", "D": "蒸氣膨脹之稀釋作用"}, "answer": "A", "explain": "細水霧滅火機制為冷卻、遮斷（吸收輻射熱）與稀釋（蒸氣膨脹推開空氣降氧），不包括化學抑制。", "ref": "火災學筆記第35講", "subject": "火災學", "src": "new"}, {"id": "F-N5-084", "topic": "滅火", "stem": "酸鹼滅火藥劑中，硫酸與碳酸氫鈉反應產生何種氣體作為驅動壓力？", "opts": {"A": "二氧化碳", "B": "氧氣", "C": "氮氣", "D": "氫氣"}, "answer": "A", "explain": "2NaHCO₃ ＋ H₂SO₄ → Na₂SO₄ ＋ 2H₂O ＋ 2CO₂，以 CO₂ 作為驅動壓力噴出水溶液。", "ref": "火災學筆記第35講", "subject": "火災學", "src": "new"}, {"id": "F-N5-085", "topic": "滅火", "stem": "以添加界面活性劑之水霧噴射重質油類火災，油表面形成水與重油之乳狀液體而減少蒸發，此為界面活性劑之何種作用？", "opts": {"A": "起泡作用", "B": "乳化作用", "C": "減低表面張力作用", "D": "抑制作用"}, "answer": "B", "explain": "界面活性劑三作用：減低表面張力（增加滲透）、乳化作用（重質油形成乳狀液遮斷蒸發）、起泡作用（製泡沫）。", "ref": "火災學筆記第35講", "subject": "火災學", "src": "new"}, {"id": "F-N5-086", "topic": "滅火", "stem": "化學泡沫之乙種藥劑主成分為何？", "opts": {"A": "硫酸鋁", "B": "碳酸氫鉀", "C": "碳酸氫鈉", "D": "磷酸二氫銨"}, "answer": "A", "explain": "化學泡沫甲種藥劑主成分碳酸氫鈉，乙種藥劑主成分硫酸鋁（氧化鋁 16% 以上），反應產生含 CO₂、Al(OH)₃ 之膠狀泡沫。", "ref": "火災學筆記第35講", "subject": "火災學", "src": "new"}, {"id": "F-N5-087", "topic": "滅火", "stem": "利用特殊瞄子將水成膜或界面活性劑等滅火劑產生之泡沫，又稱為？", "opts": {"A": "機械泡沫", "B": "化學泡沫", "C": "酸鹼泡沫", "D": "乳化泡沫"}, "answer": "A", "explain": "空氣泡沫（Air Foam）以特殊瞄子產生泡沫，又稱機械泡沫；化學泡沫則靠甲乙兩種藥劑化學反應。", "ref": "火災學筆記第35講", "subject": "火災學", "src": "new"}, {"id": "F-N5-088", "topic": "滅火", "stem": "1957 年美國海軍研發、藉附著於燃燒金屬表面隔絕空氣之液體滅火藥劑為何？", "opts": {"A": "高沸點酯類", "B": "TMBX（三甲氧基環硼氧烷）", "C": "AFFF", "D": "Met-L-X"}, "answer": "B", "explain": "TMBX 為 1957 年美國海軍研發，附著於金屬表面產生遮斷作用而隔絕空氣。", "ref": "火災學筆記第35講", "subject": "火災學", "src": "new"}, {"id": "F-N5-089", "topic": "滅火", "stem": "依海龍命名法 CₓFᵧClzBrw → Halon xyzw，CF₃Br 之海龍編號為何？", "opts": {"A": "海龍 1211", "B": "海龍 1031", "C": "海龍 3101", "D": "海龍 1301"}, "answer": "D", "explain": "CF₃Br：C 1、F 3、Cl 0、Br 1 → Halon 1301，為海龍系中毒性最低、適合裝載於飛機上者。", "ref": "火災學筆記第36講", "subject": "火災學", "src": "new"}, {"id": "F-N5-090", "topic": "滅火", "stem": "二氧化碳滅火藥劑不適用於金屬火災之原因為何？", "opts": {"A": "CO₂ 遇金屬生成氫氣而爆炸", "B": "高溫金屬可奪取 CO₂ 中之氧繼續燃燒", "C": "CO₂ 會導電造成危險", "D": "CO₂ 放射時膨脹倍數不足"}, "answer": "B", "explain": "高溫金屬可奪取 CO₂ 之氧而繼續燃燒，CO₂ ＋ C → 2CO 反而供給燃料，故禁用於金屬火災。", "ref": "火災學筆記第36講", "subject": "火災學", "src": "new"}, {"id": "F-N5-091", "topic": "滅火", "stem": "海龍替代品 IG-541（Inergen）之組成為何？", "opts": {"A": "N₂ 52%、CO₂ 40%、Ar 8%", "B": "N₂ 40%、Ar 52%、CO₂ 8%", "C": "N₂ 80%、Ar 12%、CO₂ 8%", "D": "N₂ 52%、Ar 40%、CO₂ 8%"}, "answer": "D", "explain": "IG-541 由氮 52%、氬 40%、二氧化碳 8% 組成，以窒息稀釋滅火，不產生 HF。", "ref": "火災學筆記第36講", "subject": "火災學", "src": "new"}, {"id": "F-N5-092", "topic": "滅火", "stem": "有關海龍替代品 FM-200 之敘述，下列何者正確？", "opts": {"A": "由 N₂、Ar、CO₂ 組成", "B": "ODP 大於海龍 1301", "C": "化學式 CF₃CHFCF₃，高溫分解會產生 HF", "D": "為純惰性氣體，不會產生分解物"}, "answer": "C", "explain": "FM-200（HFC-227ea）為七氟丙烷，ODP ＝ 0，但仍屬鹵化烴，高溫分解會產生 HF。", "ref": "火災學筆記第36講", "subject": "火災學", "src": "new"}, {"id": "F-N5-093", "topic": "滅火", "stem": "有關海龍替代品之選擇條件，下列何者錯誤？", "opts": {"A": "毒性愈低愈好", "B": "ODP 愈低愈好", "C": "GWP 愈低愈好", "D": "大氣滯留時間愈長愈好"}, "answer": "D", "explain": "替代品條件：滅火效能高、ODP 與 GWP 低、大氣滯留時間愈短愈好、毒性低、與原系統相容。", "ref": "火災學筆記第36講", "subject": "火災學", "src": "new"}, {"id": "F-N5-094", "topic": "滅火", "stem": "有關良好滅火劑之具備條件，下列何者錯誤？", "opts": {"A": "本身為不燃性", "B": "沸點高於一般固體燃料熱分解溫度", "C": "具較高之潛熱", "D": "常溫下為流體"}, "answer": "B", "explain": "良好滅火劑須低沸點（沸點低於固體燃料熱分解溫度），另須不燃、高潛熱、常溫為流體、無毒、低損失。", "ref": "火災學筆記第36講", "subject": "火災學", "src": "new"}, {"id": "F-N5-095", "topic": "滅火", "stem": "二氧化碳滅火時，欲使空間氧濃度由 21% 降至 14%，所需 CO₂ 濃度約為多少？", "opts": {"A": "50.0%", "B": "14.0%", "C": "7.0%", "D": "33.3%"}, "answer": "D", "explain": "CO₂% ＝（21 － O₂）/21 × 100 ＝（21 － 14）/21 × 100 ≒ 33.3%。", "ref": "火災學筆記第36講", "subject": "火災學", "src": "new"}, {"id": "F-N5-096", "topic": "滅火", "stem": "依滅火藥劑適用性，下列何種滅火藥劑不適用於 A 類火災？", "opts": {"A": "水", "B": "機械泡沫", "C": "BC 乾粉", "D": "ABC 乾粉"}, "answer": "C", "explain": "A 類適用水、機械泡沫、ABC 乾粉；CO₂ 與 BC 乾粉不適用 A 類。", "ref": "火災學筆記第36講", "subject": "火災學", "src": "new"}, {"id": "F-N5-097", "topic": "燃燒", "stem": "甲烷燃燒反應 CH₄ ＋ 2O₂ → CO₂ ＋ 2H₂O，燃燒下限 5.2%，其限氧濃度為多少？", "opts": {"A": "2.6%", "B": "5.2%", "C": "7.2%", "D": "10.4%"}, "answer": "D", "explain": "LOC ＝ LFL × O₂ 係數 ＝ 5.2 × 2 ＝ 10.4%。", "ref": "火災學筆記第37講", "subject": "火災學", "src": "new"}, {"id": "F-N5-098", "topic": "燃燒", "stem": "正己烷燃燒反應 C₆H₁₄ ＋ 19/2 O₂ → 6CO₂ ＋ 7H₂O，若燃燒下限為 1.2%，其限氧濃度為多少？", "opts": {"A": "7.2%", "B": "8.4%", "C": "22.8%", "D": "11.4%"}, "answer": "D", "explain": "LOC ＝ 1.2 × 9.5 ＝ 11.4%；係數為分數時須照乘。", "ref": "火災學筆記第37講", "subject": "火災學", "src": "new"}, {"id": "F-N5-099", "topic": "燃燒", "stem": "依 NFPA 富氧環境（OEA）之定義，下列何者屬於富氧環境？", "opts": {"A": "0.6 大氣壓下，氧為 30%", "B": "1.0 大氣壓下，氧為 20%", "C": "0.9 大氣壓下，氧為 22%", "D": "2.0 大氣壓下，氧為 12%"}, "answer": "D", "explain": "氧分壓 ＝ 總壓 × 氧濃度：2×0.12 ＝ 0.24（＞0.21，富氧）；0.9×0.22 ＝ 0.198；1×0.20 ＝ 0.20；0.6×0.30 ＝ 0.18。", "ref": "火災學筆記第37講", "subject": "火災學", "src": "new"}, {"id": "F-N5-100", "topic": "燃燒", "stem": "某飽和碳化氫之燃燒下限為 4%，依 Zabetakis 式估算其燃燒上限約為多少？", "opts": {"A": "8%", "B": "13%", "C": "14%", "D": "26%"}, "answer": "B", "explain": "UFL ＝ 6.5 × LFL^(1/2) ＝ 6.5 × √4 ＝ 13%。", "ref": "火災學筆記第37講", "subject": "火災學", "src": "new"}, {"id": "F-N5-101", "topic": "煙與熱流", "stem": "依對比度定義 C ＝ B/B₀ － 1，若物體亮度 B 為 40、背景亮度 B₀ 為 50，其對比度為多少？", "opts": {"A": "1.25", "B": "0.2", "C": "－0.8", "D": "－0.2"}, "answer": "D", "explain": "C ＝ 40/50 － 1 ＝ －0.2；對比度 －0.02 為能清楚辨別物體之臨界值。", "ref": "火災學筆記第37講", "subject": "火災學", "src": "new"}, {"id": "F-N5-102", "topic": "煙與熱流", "stem": "火場中煙之減光係數 K 為 0.5 m⁻¹，依經驗公式，反光體之能見度約為多少？", "opts": {"A": "6 m", "B": "16 m", "C": "1.5 m", "D": "4 m"}, "answer": "A", "explain": "反光體 K × S ＝ 3 → S ＝ 3 ÷ 0.5 ＝ 6 m；發光體 K × S ＝ 8 則為 16 m。", "ref": "火災學筆記第37講", "subject": "火災學", "src": "new"}, {"id": "F-N5-103", "topic": "煙與熱流", "stem": "火源大小 3 m × 2 m，煙層下方淨高 y ＝ 4 m，依 M ＝ 0.188Py^(3/2) 估算煙之生成率約為多少？", "opts": {"A": "30.08 kg/s", "B": "9.02 kg/s", "C": "15.04 kg/s", "D": "6.02 kg/s"}, "answer": "C", "explain": "周界 P ＝（3 ＋ 2）× 2 ＝ 10 m；M ＝ 0.188 × 10 × 4^1.5 ＝ 0.188 × 10 × 8 ＝ 15.04 kg/s。", "ref": "火災學筆記第37講", "subject": "火災學", "src": "new"}, {"id": "F-N5-104", "topic": "熱傳", "stem": "有關熱慣性（kρc）之敘述，下列何者正確？", "opts": {"A": "熱慣性越高，物體越容易被點燃", "B": "熱慣性為熱傳導係數、密度與熱容量之和", "C": "熱慣性越高，物體越不易升溫、越難點燃", "D": "人受放射熱之忍耐時間與熱慣性成反比"}, "answer": "C", "explain": "熱慣性為 k、ρ、c 三者之乘積，越高越不易升溫、需更多能量點燃；人之忍耐時間與熱慣性成正比、與放射熱平方成反比。", "ref": "火災學筆記第37講", "subject": "火災學", "src": "new"}, {"id": "F-C2-001", "topic": "燃燒", "stem": "下列有關燃燒的定義或敘述何者正確？", "opts": {"A": "「還原」之化學反應與「熱流動」之物理形態，二者組合之錯綜複雜現象", "B": "伴同發熱與發光之還原現象", "C": "鎳線之赤熱現象非屬燃燒", "D": "鐵板之生鏽現象屬燃燒"}, "answer": "C", "explain": "燃燒是伴隨發熱發光的激烈氧化反應，A、B 誤寫成還原。鎳線赤熱只是通電發熱、未與氧劇烈化合；鐵生鏽是緩慢氧化、不發光，兩者都不算燃燒。", "ref": "【89警技、90士、91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-003", "topic": "燃燒", "stem": "下列何者非屬可燃物所構成的燃燒反應？", "opts": {"A": "CO + 1/2 O₂ → CO₂", "B": "H₂S + Cl₂ → 2HCl + S", "C": "H₂ + 1/2 O₂ → H₂O", "D": "I₂ + 1/2 O₂ → I₂O"}, "answer": "D", "explain": "碘（I₂）與氧化合的反應不具可燃物條件，不屬燃燒；CO、H₂S、H₂ 皆為可燃物（H₂S 可在氯氣中燃燒）。", "ref": "【88警技】（原題五選項，刪去 C + 1/2 O₂ → CO 改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-004", "topic": "熱傳", "stem": "下列物質之熱傳導度大小之順序何者正確？", "opts": {"A": "一氧化碳>酒精>石墨>鐵塊", "B": "酒精>一氧化碳>石墨>鐵塊", "C": "鐵塊>石墨>一氧化碳>酒精", "D": "鐵塊>石墨>酒精>一氧化碳"}, "answer": "D", "explain": "熱傳導度一般為金屬固體>非金屬固體>液體>氣體，對應鐵塊>石墨>酒精>一氧化碳；C 把氣體排在液體前面是錯的。", "ref": "【89警技、91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-006", "topic": "熱傳", "stem": "在常溫下，下列何者物質其熱傳導係數最低？", "opts": {"A": "銅", "B": "橡膠", "C": "空氣", "D": "石膏板"}, "answer": "C", "explain": "熱傳導係數：金屬>非金屬固體>液體>氣體；銅最大，氣體（空氣）最小。", "ref": "【91警技、87、89、94消佐】（原 A 選項 OCR 缺字已刪，改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-007", "topic": "熱傳", "stem": "在一般穩定狀態的熱傳導（steady state conduction），所謂傅立葉熱傳公式（Fourier's law of heat conduction）為何？（q″：單位面積熱傳導量 W/m²；k：熱傳導係數 W/m·K；ΔT：溫度差 K；Δx：兩者距離 m）", "opts": {"A": "q″ = −k ΔT/Δx", "B": "q″ = −k Δx/ΔT", "C": "q″ = −k ΔT²/Δx", "D": "q″ = −k (ΔT/Δx)⁴"}, "answer": "A", "explain": "傅立葉定律：熱通量與溫度梯度成正比、方向與梯度相反，故 q″ = −k·ΔT/Δx；其他選項把分子分母顛倒或多加次方。", "ref": "【89消佐、93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-008", "topic": "熱傳", "stem": "下列有關「熱傳導係數」之敘述何者有誤？", "opts": {"A": "具方向性", "B": "與溫度有關", "C": "與材質有關", "D": "空氣在常壓下之熱傳導係數為零"}, "answer": "D", "explain": "空氣熱傳導係數很小（約 0.026 W/m·K）但不是零。熱傳導係數隨材質、溫度而變，異向性材料（如木材）也具方向性。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-009", "topic": "熱傳", "stem": "下列有關「熱」之敘述何者有誤？", "opts": {"A": "具方向性", "B": "因溫度差而存在", "C": "任何單一系統皆具有熱", "D": "為能量的一種"}, "answer": "C", "explain": "熱是因溫度差而在系統間傳遞的能量，屬「過程中」的量，單一系統只具有內能而不「具有熱」；熱由高溫流向低溫，所以具方向性。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-010", "topic": "燃燒", "stem": "可燃物之條件是指當其氧化之際，需具有 100 kcal/mole 以上之發熱量，且熱傳導度約在多少以下者才可充當之？", "opts": {"A": "1.0 cal/cm·sec·℃", "B": "0.1 kcal/cm·sec·℃", "C": "0.1 kJ/cm·sec·℃", "D": "1.0 kJ/cm·sec·℃"}, "answer": "A", "explain": "可燃物條件之一是熱傳導度約 0.001 kcal/cm·sec·℃ 以下，即 1.0 cal/cm·sec·℃；其餘選項都大了 100 倍以上。", "ref": "【87、89消佐、92、94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-011", "topic": "燃燒", "stem": "凡不能與氧化合之物質均非可燃物，但氮氣（N₂）可與氧化合，亦被視為非可燃物，是因為其反應過程具何者因素？", "opts": {"A": "發熱反應", "B": "吸熱反應", "C": "閃火點太高", "D": "熱傳導度過低"}, "answer": "B", "explain": "氮與氧化合為吸熱反應，無法自行放熱維持反應，所以不算可燃物；可燃物須為放熱的氧化反應。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89、93消佐、91警技】（原題五選項，刪去「無法產生連鎖反應」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-012", "topic": "熱傳", "stem": "熱透過流動介質，將熱量由空間中的一處傳到另一處的現象稱之為：", "opts": {"A": "傳導", "B": "對流", "C": "輻射", "D": "擴散"}, "answer": "B", "explain": "靠流體（氣體、液體）流動攜帶熱量的是對流；傳導靠分子接觸，輻射不需介質。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-013", "topic": "熱傳", "stem": "煙囪效應屬那一種熱量的傳遞？", "opts": {"A": "熱傳導", "B": "熱對流", "C": "熱輻射", "D": "以上皆非"}, "answer": "B", "explain": "煙囪效應是豎井內熱氣因密度差上升形成的流動，屬熱對流。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-014", "topic": "熱傳", "stem": "靠近熱固體的熱氣流以及火焰中的熱氣流，由浮力驅使的流動稱之為：", "opts": {"A": "自然對流", "B": "強制對流", "C": "正煙囪效應", "D": "逆煙囪效應"}, "answer": "A", "explain": "由溫差造成密度差、以浮力驅動的流動為自然對流；強制對流需風扇、泵浦等外力。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-016", "topic": "熱傳", "stem": "一般而言，區劃空間火災肇始時（不考慮爆炸），熱傳形式主要是：", "opts": {"A": "熱傳導和熱輻射", "B": "熱傳導和熱對流", "C": "熱對流和熱輻射", "D": "熱傳導、熱對流和熱輻射"}, "answer": "B", "explain": "起火初期火勢小、火焰輻射弱，熱主要經接觸傳導與火羽流對流傳遞；進入成長期後才以輻射為主。此題書上無答案，依一般教材判定。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-017", "topic": "熱傳", 蠟、脂肪油、紙都歸在受熱分解產生可燃氣的分解燃燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-043", "topic": "燃燒", "stem": "硫黃固體之燃燒屬於下列何種燃燒型態？", "opts": {"A": "爆炸燃燒", "B": "分解燃燒", "C": "蒸發燃燒", "D": "表面燃燒"}, "answer": "C", "explain": "硫黃、萘受熱昇華或熔融後蒸發成可燃氣再燃燒，屬蒸發燃燒，並未經熱分解。", "ref": "【87警技、89消佐、89士】（原 C 選項 OCR 缺字已刪，改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-044", "topic": "燃燒", "stem": "木材、紙張、石蠟等固體燃料，經加熱生出可燃性氣體引起之燃燒，應歸類為何種燃燒形態？", "opts": {"A": "蒸發燃燒", "B": "均一系燃燒", "C": "表面燃燒", "D": "分解燃燒"}, "answer": "D", "explain": "固體受熱先熱分解產生可燃性氣體再燃燒，稱分解燃燒；表面燃燒則是固體表面直接與氧反應。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士、87、89、91、94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-046", "topic": "燃燒", "stem": "燃燒之形態中，石油類之燃燒係屬下列何種形態燃燒：", "opts": {"A": "擴散燃燒", "B": "分解燃燒", "C": "均一系燃燒", "D": "非均一系燃燒"}, "answer": "D", "explain": "石油是液體蒸發成氣體後燃燒，燃料與氧化劑相態不同，屬非均一系燃燒（亦屬蒸發燃燒）。", "ref": "【87消佐、89士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-047", "topic": "燃燒", "stem": "木炭、焦炭、金屬粉等固體可燃物，其燃燒之現象稱為：", "opts": {"A": "表面燃燒", "B": "蒸發燃燒", "C": "混合燃燒", "D": "分解燃燒"}, "answer": "A", "explain": "木炭、焦炭、金屬粉不產生可燃氣，直接在固體表面與氧反應、無焰發光，屬表面燃燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】（C 選項原文缺字，補為混合燃燒）", "subject": "火災學", "src": "old"}, {"id": "F-C2-049", "topic": "燃燒", "stem": "那一種燃燒的燃燒速度會愈來愈慢？", "opts": {"A": "混合燃燒", "B": "蒸發燃燒", "C": "擴散燃燒", "D": "表面燃燒"}, "answer": "D", "explain": "表面燃燒時灰分逐漸覆蓋在表面、阻礙氧氣接觸，反應面積也逐漸縮小，燃燒速度愈來愈慢。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-052", "topic": "燃燒", "stem": "某些物質如賽璐珞（Celluloid）起熱分解後，除會產生可燃性氣體外，同時亦會產生氧，此類物質不需空氣之氧助燃，只依賴分子內之氧即可燃燒，此種燃燒稱為：", "opts": {"A": "自己燃燒", "B": "分解燃燒", "C": "蒸發燃燒", "D": "表面燃燒"}, "answer": "A", "explain": "分子內含氧、不需外部空氣即可燃燒（硝化棉、賽璐珞等）稱自己燃燒（內部燃燒）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89警技、94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-053", "topic": "燃燒", "stem": "決定混合燃燒之火焰蔓延速率之要素，並不包括下列那項：", "opts": {"A": "壓力", "B": "溫度", "C": "閃燃點", "D": "氣體組成成分"}, "answer": "C", "explain": "預混合火焰傳播速度受壓力、初溫、組成（濃度）影響；閃燃點（引火點）是液體性質，與已混合氣體的火焰速度無關。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐、89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-054", "topic": "燃燒", "stem": "下列有關擴散火焰的敘述，何者正確？", "opts": {"A": "擴散火焰的燃燒型態，往往是爆炸式的燃燒", "B": "間歇火焰區域（the intermittent zone）內的流體處於加速狀態", "C": "浮升羽柱（the buoyant plume）內的流體溫度隨高度增加而遞增", "D": "浮升羽柱區域內的流體狀態，與撒水頭的動作有關"}, "answer": "D", "explain": "撒水頭與偵煙探測器設在天花板，是否動作取決於火羽流到達處的溫度與流速。爆炸式燃燒屬預混合火焰；加速區是持續火焰區；羽柱溫度隨高度遞減。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-055", "topic": "燃燒", "stem": "下列有關預混合火焰燃燒速度的敘述，何者正確？", "opts": {"A": "組成複雜的氣體，燃燒速度較快", "B": "氣體的濃度稍高於化學理論濃度時，燃燒速度最大", "C": "可燃混合氣體的初始溫度越低，燃燒速度越快", "D": "管路直徑越大，火焰傳播的速度越小"}, "answer": "B", "explain": "燃燒速度在略濃於化學計量濃度時最大。初溫越高越快；管徑越大熱損失越小、傳播越快；組成越簡單通常越快。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【93士】（D 選項原文缺字，依題意補「越大」）", "subject": "火災學", "src": "old"}, {"id": "F-C2-056", "topic": "燃燒", "stem": "擴散火焰的流體處於加速狀態的區域為：", "opts": {"A": "燃氣區域", "B": "間歇火焰區域（the intermittent zone）", "C": "浮升羽柱區域（the buoyant plume zone）", "D": "持續火焰區域"}, "answer": "D", "explain": "McCaffrey 火羽流分區：持續火焰區流體加速上升，間歇火焰區速度約略恆定，浮升羽柱區速度隨高度遞減。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-057", "topic": "燃燒", "stem": "對於引火與發火之區別，下列敘述何者正確？", "opts": {"A": "自可燃物產生蒸氣時，由火焰能引燃之最低溫度稱為發火點", "B": "可燃物受熱時不藉火焰或電氣火花點火時，也能自燃之現象稱為引火", "C": "若利用加熱包圍間接加熱或給予溫度緩慢加熱至被加熱物由本身起燃所需之最低溫度稱為發火點", "D": "甲烷在空氣中之發火點為 68℃"}, "answer": "C", "explain": "不靠外部火源、加熱到本身起燃的最低溫度是發火點；A 描述的是引火點，B 描述的是發火。甲烷發火點約 537℃，遠高於 68℃。", "ref": "【88警技、89士】（原題五選項，刪去「以上皆非」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-058", "topic": "燃燒", "stem": "以火焰等熱能接觸液體表面，使液溫上昇至液體之蒸發量達到燃燒之下限，並使之燃燒。此時之液面溫度一般稱為：", "opts": {"A": "熔點", "B": "臨界溫度", "C": "引火溫度", "D": "發火溫度"}, "answer": "C", "explain": "液面蒸氣濃度達燃燒下限、可被外部火焰點燃的最低液溫稱引火溫度（引火點）；發火溫度不需外部火源。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐、91消佐、91警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-059", "topic": "燃燒", "stem": "以一小火焰接觸液體表面，使其表面蒸氣（vapour）能夠開始點燃（ignite），此時之液體溫度，一般稱之為：", "opts": {"A": "沸點（boiling point）", "B": "引火點（flash point）", "C": "降伏點（yielding point）", "D": "自燃溫度（auto-ignition temperature）"}, "answer": "B", "explain": "以小火焰接近液面能引燃蒸氣的最低液溫即引火點（閃火點）；自燃溫度不需外部火焰。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士、89、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-060", "topic": "燃燒", "stem": "可燃液體之溫度昇高，蒸氣之發生速度增加，液面上之混合氣引火後始能繼續不輟，此一能使燃燒持續之溫度稱為：", "opts": {"A": "沸點（boiling point）", "B": "引火點（flash point）", "C": "火焰點（fire point）", "D": "自燃溫度（auto-ignition temperature）"}, "answer": "C", "explain": "引火點只能瞬間閃燃；溫度再高到蒸氣供應足以使火焰持續不熄，稱火焰點（燃燒點），通常比引火點高數度。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-061", "topic": "燃燒", "stem": "可燃性液體之溫度昇高，蒸氣發生之速度增加，液面上之混合氣引火後始能繼續燃燒，此能使燃燒持續之溫度稱為：", "opts": {"A": "引火點（Pilot ignition point）", "B": "發火點（Self-ignition point）", "C": "沸點（Boiling point）", "D": "燃燒點（Burning point）"}, "answer": "D", "explain": "能使引火後燃燒持續下去的最低液溫是燃燒點（火焰點）；引火點只會瞬間閃火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題五選項，刪去「閃火點（Flash point）」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-062", "topic": "燃燒", "stem": "欲使混合氣體發火，而使用加熱之固體者，必須該固體之表面溫度達至一定溫度以上，此特定之溫度之名稱為何？", "opts": {"A": "發火點", "B": "閃燃點", "C": "引火點", "D": "以上皆是"}, "answer": "A", "explain": "以高溫固體（無火焰）使混合氣體起燃，所需的最低溫度屬發火點的概念；引火點需外部火焰。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-063", "topic": "燃燒", "stem": "對於一般的汽油（gasoline），其引火點溫度（flash point）、沸點溫度（boiling point）、自燃溫度（auto-ignition）分別為 a、b、c，請問 a、b、c 之關係為何？", "opts": {"A": "c>b>a", "B": "a>b>c", "C": "b>a>c", "D": "a>c>b"}, "answer": "A", "explain": "汽油引火點約 −43℃、沸點約 30~200℃、自燃溫度約 250℃ 以上，故 c>b>a。", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-064", "topic": "燃燒", "stem": "對含等量甲烷分別添加不活潑性氣體氮（N₂）、氦（He）、氬（Ar）等三種，在相同濃度及氣壓條件下，其所需最小發火能量大小分別為 a、b、c，請問 a、b、c 之關係為何？", "opts": {"A": "a<b<c", "B": "a=b=c", "C": "b>a>c", "D": "a>b>c"}, "answer": "C", "explain": "惰性氣體熱傳導度越高，越易帶走熱，所需發火能量越大；熱傳導度 He>N₂>Ar，故 b>a>c。", "ref": "【91警技】（原題五選項，刪去「a>c>b」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-069", "topic": "燃燒", "stem": "火焰溫度通常會依位置不同而有所變化，以蠟燭火焰為例，其那個位置溫度最高？", "opts": {"A": "中部", "B": "前端", "C": "下部", "D": "以上皆是"}, "answer": "A", "explain": "本書指出定常燃燒的火焰（如本生燈、瓦斯器具）以中部溫度最高，蠟燭火焰同屬定常燃燒，依此判定中部。但一般理化教材常說外焰最高，說法有出入。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【92士】（A 選項原文缺字，補為中部）", "subject": "火災學", "src": "old"}, {"id": "F-C2-070", "topic": "熱傳", "stem": "火焰中所發出的輻射熱量與下列何者成正比？", "opts": {"A": "其攝氏溫度的四次方", "B": "其絕對溫度的四次方", "C": "與外界溫差", "D": "與外界溫差的四次方"}, "answer": "B", "explain": "史蒂芬－波茲曼定律用的是絕對溫度（K），輻射量與 T⁴ 成正比；以攝氏溫度計算會出錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-071", "topic": "燃燒", "stem": "本生燈燃燒之火焰溫度，以何處為最高？", "opts": {"A": "焰上端", "B": "焰中", "C": "焰底部", "D": "溫度一致"}, "answer": "B", "explain": "本生燈屬定常燃燒，火焰中部（內焰尖端上方）氧氣與燃料反應最完全、溫度最高，底部尚未充分反應，上端已散熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-073", "topic": "燃燒", "stem": "任何化學反應從反應物能階到生成物能階之過程中，須經由一個較高能階的活性錯合物（體），其與反應物能階的差值，其名稱為何？", "opts": {"A": "熱能", "B": "活化能", "C": "熵", "D": "自由能"}, "answer": "B", "explain": "反應物需跨越到活性錯合物的能量障壁才能反應，此能量差即活化能；自由能與熵描述的是反應是否自發。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-074", "topic": "熱傳", "stem": "材料的熱慣性，不包括下列那一項？", "opts": {"A": "密度", "B": "熱傳導係數", "C": "溫度", "D": "比熱"}, "answer": "C", "explain": "熱慣性定義為 kρc（熱傳導係數×密度×比熱），屬材料性質，不含溫度。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-075", "topic": "燃燒", "stem": "氣體本身受到壓縮，增高溫度時，亦可發火，此稱為：", "opts": {"A": "高溫壓縮", "B": "加溫壓縮", "C": "引火壓縮", "D": "斷熱壓縮"}, "answer": "D", "explain": "氣體被快速壓縮、來不及散熱，溫度急升而起火，稱斷熱（絕熱）壓縮，柴油引擎即應用此原理。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題五選項，刪去一個 OCR 缺字的錯誤選項改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-076", "topic": "燃燒", "stem": "氫氣與氯氣作用生成氯化氫為一連鎖反應，組成此連鎖反應之步驟，何者正確？", "opts": {"A": "二個起始步驟（Initiation Step）", "B": "一個繁衍步驟（Propagation Step）", "C": "四個終了步驟（Termination Step）", "D": "二個繁衍步驟（Propagation Step）"}, "answer": "D", "explain": "H₂＋Cl₂ 連鎖反應為 1 個起始（Cl₂→2Cl·）、2 個繁衍（Cl·＋H₂、H·＋Cl₂）、3 個終了步驟。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題五選項，刪去「二個終了步驟」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-077", "topic": "燃燒", "stem": "氫氣在氯氣中燃燒為一連鎖反應，而此連鎖反應係由下列何者所組成？", "opts": {"A": "二個起始步驟、二個繁衍步驟及二個終了步驟", "B": "一個起始步驟、二個繁衍步驟及三個終了步驟", "C": "二個起始步驟、一個繁衍步驟及二個終了步驟", "D": "一個起始步驟、二個繁衍步驟及一個終了步驟"}, "answer": "B", "explain": "起始 1（Cl₂ 解離）、繁衍 2（Cl·＋H₂→HCl＋H·；H·＋Cl₂→HCl＋Cl·）、終了 3（H·＋H·、Cl·＋Cl·、H·＋Cl· 再結合）。", "ref": "【87警技】（原題五選項，刪去「一個起始、三個繁衍及二個終了步驟」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-078", "topic": "燃燒", "stem": "關於燃燒最直接之發火源為何？", "opts": {"A": "有焰源", "B": "高溫固體", "C": "撞擊摩擦", "D": "斷熱壓縮"}, "answer": "A", "explain": "明火（有焰源）直接提供火焰與高溫，是最直接的發火源；其餘需先把能量轉成熱才會發火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-080", "topic": "燃燒", "stem": "下列有關燃燒範圍的敘述，何者是錯誤的？", "opts": {"A": "燃燒範圍是指：可燃性氣體與空氣的混合比例，達可能燃燒之濃度範圍", "B": "利用二氧化碳滅火的原理，係在改變起火物質的燃燒範圍", "C": "燃燒範圍會隨壓力或溫度不同而變化", "D": "可燃性混合氣體的燃燒下限愈低，危險性愈高"}, "answer": "B", "explain": "二氧化碳滅火主要是稀釋氧濃度（窒息）並兼冷卻，一般不說成改變物質的燃燒範圍；燃燒範圍確實隨溫度、壓力而變，下限愈低愈危險。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【9?消佐】（年份 OCR 缺字）", "subject": "火災學", "src": "old"}, {"id": "F-C2-082", "topic": "煙與熱流", "stem": "關於可燃性氣體對燃燒的影響，除本身燃燒性外，其燃燒時受熱之氣體，受何因素影響，產生浮力上昇而引起對流，並依建築物方向產生氣流，此因素稱為？", "opts": {"A": "氣積差", "B": "溫度差", "C": "理論空氣量", "D": "過剩空氣"}, "answer": "B", "explain": "受熱氣體因溫度差造成密度差而上升，形成對流與氣流；氣積差則是指火焰往容積大的方向擴展。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91警技】（原題五選項，刪去「輻射熱」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-083", "topic": "煙與熱流", "stem": "任何可燃性氣體引火後，必成為增大火焰及燃燒力之積極力量，除本身之燃燒性外，火焰擴展時，容易朝空間容積大的方向流動，此種現象係因何種因素所造成？", "opts": {"A": "溫度差", "B": "質量差", "C": "氣積差", "D": "時間差"}, "answer": "C", "explain": "火焰朝空間容積大的方向擴展，書上歸因於氣積差；溫度差造成的是浮力上升。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89、91、94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-085", "topic": "燃燒", "stem": "關於可燃性固體燃燒難易程度之決定因素，下列敘述何者為非？", "opts": {"A": "稻草數量愈多，燃燒力愈強", "B": "形狀愈細薄小的物質，吸熱愈迅速，燃燒力愈差", "C": "紙張橫放比直立之燃燒力差", "D": "氧氣供給充足比供給不足燃燒力強"}, "answer": "B", "explain": "細薄的物質熱容量小、吸熱快，升溫快而更容易燃燒，燃燒力應該愈強，B 講反了。", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-086", "topic": "燃燒", "stem": "可燃性固體之燃燒，下列何者有誤？", "opts": {"A": "燃燒時之溫度受質與量決定", "B": "粉末形狀較薄易燃", "C": "豎立狀態比平鋪狀態難燃", "D": "加熱緩慢者較不易著火"}, "answer": "C", "explain": "豎立時火焰向上預熱上方材料、空氣也易補充，比平鋪容易燃燒，C 講反了；加熱緩慢時熱量有時間散失，較不易著火。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【94士】（C、D 選項原文缺字，依題意還原）", "subject": "火災學", "src": "old"}, {"id": "F-C2-087", "topic": "燃燒", "stem": "在絕熱壓縮中壓縮比為 1，壓力為 1 大氣壓及溫度為 20℃ 之情形下，若空氣之 γ 值為 1.4，則當壓縮比變為 20 時，溫度會上昇至多少？（20^1.4 = 66.29，20^0.4 = 3.31）", "opts": {"A": "594℃", "B": "697℃", "C": "792℃", "D": "998℃"}, "answer": "B", "explain": "絕熱壓縮 T₂ = T₁ × ε^(γ−1) = 293 × 20^0.4 = 293 × 3.31 ≈ 970 K ≈ 697℃。", "ref": "【92警技】（原題五選項，刪去 OCR 缺字的 D 選項改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-088", "topic": "燃燒", "stem": "物質燃燒時實際所需的空氣量為 A，該值遠超過理論空氣量 B，A−B 的差值稱為：", "opts": {"A": "過剩空氣量", "B": "損失空氣量", "C": "理想空氣量", "D": "燃燒空氣量"}, "answer": "A", "explain": "實際空氣量減去理論空氣量即過剩空氣量。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89、90、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-089", "topic": "燃燒", "stem": "下列關於空氣性質的描述何者正確？", "opts": {"A": "氧氣在空氣中之體積比約 23%", "B": "氧氣在空氣中之重量比約 21%", "C": "空氣的平均分子量約為 28.8 g/mole", "D": "氧氣濃度若低於 18% 以下則燃燒甚難持續"}, "answer": "C", "explain": "空氣平均分子量約 28.8。氧氣體積比約 21%、重量比約 23%，A、B 數值對調；燃燒難以持續的氧濃度界線約 15%。", "ref": "【90警技、91消佐】（A 選項數值 OCR 缺字，依題意還原）", "subject": "火災學", "src": "old"}, {"id": "F-C2-090", "topic": "燃燒", "stem": "若物質完全燃燒，我們可以由廢氣中之那種成分估算過剩空氣量？", "opts": {"A": "一氧化碳", "B": "二氧化碳", "C": "水蒸氣", "D": "氮氣"}, "answer": "B", "explain": "完全燃燒時，過剩空氣越多，廢氣中 CO₂ 濃度被稀釋得越低，所以可由 CO₂ 含量推算過剩空氣率；完全燃燒廢氣中無 CO。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-091", "topic": "燃燒", "stem": "欲使兩公斤的氫氣完全燃燒所需的空氣容積為：", "opts": {"A": "53.4 立方公尺", "B": "69.6 立方公尺", "C": "34.8 立方公尺", "D": "26.7 立方公尺"}, "answer": "A", "explain": "2 kg H₂ = 1 kmol，需 O₂ 0.5 kmol = 11.2 m³；空氣 = 11.2 ÷ 0.21 ≈ 53.3 m³（約 53.4）。", "ref": "【89消佐、90警技】（原題五選項，刪去「80.1 立方公尺」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-092", "topic": "燃燒", "stem": "標準狀態下（0℃，1 atm），1 kmol 氣體容積為 22.4 m³，則 1 公斤（kg）之碳要完全燃燒所需的空氣容積為下列何者？", "opts": {"A": "1.6 m³", "B": "8.9 m³", "C": "11.6 m³", "D": "89.0 m³"}, "answer": "B", "explain": "C + O₂ → CO₂，1 kg C = 1/12 kmol，需 O₂ 22.4/12 ≈ 1.87 m³；空氣 = 1.87 ÷ 0.21 ≈ 8.9 m³。", "ref": "（書上未標考試年份）", "subject": "火災學", "src": "old"}, {"id": "F-C2-094", "topic": "燃燒", "stem": "同溫、同壓、同體積的乙烷、乙烯、乙炔完全燃燒所需的理論空氣量分別為 a、b、c，請問 a、b、c 之關係為：", "opts": {"A": "a>b>c", "B": "a=b=c", "C": "c>a>b", "D": "a>c>b"}, "answer": "A", "explain": "同溫同壓同體積→莫耳數相同；每 mol 需 O₂：乙烷 3.5、乙烯 3、乙炔 2.5，故 a>b>c。", "ref": "【90警技】（原題五選項，刪去「c>b>a」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-095", "topic": "燃燒", "stem": "等重的乙烷、乙烯、乙炔完全燃燒所需的理論空氣量分別為 a、b、c，請問 a、b、c 之關係為：", "opts": {"A": "a>b>c", "B": "a=b=c", "C": "c>a>b", "D": "a>c>b"}, "answer": "A", "explain": "每克需 O₂ 莫耳數：乙烷 3.5/30 ≈ 0.117、乙烯 3/28 ≈ 0.107、乙炔 2.5/26 ≈ 0.096，故 a>b>c。", "ref": "【90警技】（原題五選項，刪去「c>b>a」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-096", "topic": "燃燒", "stem": "等莫耳數的酒精、汽油、柴油完全燃燒所產生的熱量分別為 a、b、c，請問 a、b、c 之關係為：", "opts": {"A": "a>b>c", "B": "a=b=c", "C": "c>a>b", "D": "c>b>a"}, "answer": "D", "explain": "同莫耳數時分子越大、含碳氫越多，放熱越多；柴油（約 C₁₆）>汽油（約 C₈）>酒精（C₂），故 c>b>a。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題五選項，刪去「a>c>b」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-097", "topic": "燃燒", "stem": "假設一公斤燃料所需之理論空氣量為 Lo，實際需要空氣量為 La，則 La = K × Lo（K>1），則此 K 值稱為：", "opts": {"A": "空氣過剩率", "B": "空氣容積", "C": "空氣比", "D": "廢氣量"}, "answer": "C", "explain": "實際空氣量與理論空氣量之比 K 稱空氣比（過剩空氣係數）；空氣過剩率為 K−1。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-098", "topic": "燃燒", "stem": "假設一公斤燃料所需之理論空氣量為 Lo，實際需要空氣量為 La，則 La = K × Lo（其中 K 值為空氣比，K>1），假如空氣中氧重量佔整體之 23%，試問一公斤之硫（S）完全燃燒，K = 1.5 時，約需多少空氣？", "opts": {"A": "4.35 公斤", "B": "6.52 公斤", "C": "11.6 公斤", "D": "18.8 公斤"}, "answer": "B", "explain": "S + O₂ → SO₂，1 kg S 需 O₂ 1 kg；理論空氣 = 1 ÷ 0.23 ≈ 4.35 kg；實際 = 1.5 × 4.35 ≈ 6.52 kg。A 是忘了乘 K。", "ref": "【91、93、94警技】（原題五選項，刪去「34.8 公斤」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-099", "topic": "燃燒", "stem": "依亞佛加厥定律（Avogadro's Theory），同溫同壓同體積之一切氣體含有相同分子數，在標準狀態下（0℃，1 atm），1000 克分子氣體之容積為：", "opts": {"A": "11.2 立方公尺", "B": "22.4 立方公尺", "C": "33.6 立方公尺", "D": "44.8 立方公尺"}, "answer": "B", "explain": "1000 克分子 = 1 kmol，標準狀態下 1 mol 為 22.4 L，故 1 kmol 為 22.4 m³。", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-100", "topic": "燃燒", "stem": "等重的碳（C）、氫（H₂）、硫（S）完全燃燒時所需的理論空氣量，分別為 A、B、C，請問 A、B、C 之關係為何？", "opts": {"A": "A>B>C", "B": "A=B=C", "C": "C>A>B", "D": "B>A>C"}, "answer": "D", "explain": "每 kg 需 O₂：C 為 32/12 ≈ 2.67 kg、H₂ 為 16/2 = 8 kg、S 為 32/32 = 1 kg，故 B>A>C。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-101", "topic": "燃燒", "stem": "下列何種物質，一公斤燃燒時所需的理論空氣量（kg）最重？", "opts": {"A": "氫氣（H₂）", "B": "甲烷（CH₄）", "C": "碳（C）", "D": "硫（S）"}, "answer": "A", "explain": "每 kg 需 O₂：H₂ 8 kg、CH₄ 4 kg、C 2.67 kg、S 1 kg，氫最多。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-102", "topic": "燃燒", "stem": "下列不同重量之燃料燃燒時，何者之理論空氣量最小？", "opts": {"A": "12 公斤的碳（C）", "B": "32 公斤的硫（S）", "C": "4 公斤的氫氣（H₂）", "D": "28 公斤的一氧化碳（CO）"}, "answer": "D", "explain": "四者各為 C 1 kmol、S 1 kmol、H₂ 2 kmol、CO 1 kmol；需 O₂ 分別 1、1、1、0.5 kmol，CO 最少。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-103", "topic": "燃燒", "stem": "在同溫、同壓下，同體積的氣體：乙烷（C₂H₆）、乙烯（C₂H₄）、乙炔（C₂H₂），完全燃燒時所需的理論空氣量分別為 a、b、c，問 a、b、c 之關係為：", "opts": {"A": "a>b>c", "B": "b>a>c", "C": "c>a>b", "D": "c>b>a"}, "answer": "A", "explain": "同體積即同莫耳數；每 mol 需 O₂：乙烷 3.5、乙烯 3、乙炔 2.5，氫越多需氧越多，故 a>b>c。", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-104", "topic": "燃燒", "stem": "在同溫、同壓下，同體積的氣體：甲烷（CH₄）、乙烷（C₂H₆）、丙烷（C₃H₈），完全燃燒時所需的理論空氣量分別為 a、b、c，請問 a、b、c 之關係為：", "opts": {"A": "a>b>c", "B": "b>a>c", "C": "c>a>b", "D": "c>b>a"}, "answer": "D", "explain": "每 mol 需 O₂：CH₄ 2、C₂H₆ 3.5、C₃H₈ 5，碳數越多需氧越多，故 c>b>a。", "ref": "【94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-105", "topic": "燃燒", "stem": "在一大氣壓力、20℃ 狀態下，假設空氣中氧之重量佔整體的 23%，試問 1.0 kg 之硫完全燃燒，約需多少公斤之空氣？", "opts": {"A": "34.8 kg", "B": "11.6 kg", "C": "4.35 kg", "D": "8.9 kg"}, "answer": "C", "explain": "S + O₂ → SO₂，1 kg S 需 O₂ 1 kg；空氣 = 1 ÷ 0.23 ≈ 4.35 kg。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-106", "topic": "燃燒", "stem": "燃料的發熱量與有效利用熱量之比，稱為：", "opts": {"A": "燃燒效率", "B": "熱損失", "C": "空氣過剩率", "D": "廢氣產生率"}, "answer": "A", "explain": "有效利用的熱量占燃料發熱量的比例即燃燒效率。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-107", "topic": "燃燒", "stem": "下列有關燃燒範圍的敘述，何者是錯誤的？", "opts": {"A": "燃燒範圍是指可燃性氣體與空氣的混合比例，達可能發火的濃度範圍", "B": "可燃性混合氣體的燃燒下限愈低，危險性愈高", "C": "燃燒範圍會隨壓力、溫度不同而變化", "D": "利用二氧化碳滅火的原理，係在改變起火物質的燃燒範圍"}, "answer": "D", "explain": "CO₂ 滅火主要靠稀釋氧濃度（窒息）與冷卻，一般不說成改變燃燒範圍；其餘三項為燃燒範圍的正確敘述。（與第 80 題同一考點）（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-108", "topic": "燃燒", "stem": "根據下列所列之燃燒範圍判斷，那一種可燃性氣體的危險度比較大？", "opts": {"A": "異己烷：1.0~7.2%", "B": "苯：1.4~7.1%", "C": "戊烷：1.5~7.8%", "D": "汽油：1.4~7.6%"}, "answer": "A", "explain": "危險度 H = (上限−下限)/下限：異己烷 6.2、苯約 4.1、戊烷 4.2、汽油約 4.4；異己烷下限最低、H 最大。", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-109", "topic": "燃燒", "stem": "某天然氣其組成如下：甲烷 80%（燃燒下限 5.3%）、乙烷 15%（燃燒下限 3.2%）、丙烷 4%（燃燒下限 2.2%）、丁烷 1%（燃燒下限 1.9%），則天然氣的燃燒下限為多少？", "opts": {"A": "1%", "B": "3.02%", "C": "4.52%", "D": "5.02%"}, "answer": "C", "explain": "勒夏特列公式：L = 1 / (0.8/5.3 + 0.15/3.2 + 0.04/2.2 + 0.01/1.9) ≈ 4.52%。", "ref": "【89士、90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-111", "topic": "燃燒", "stem": "下列何者氣體在空氣中之燃燒界限最大？", "opts": {"A": "甲烷", "B": "乙炔", "C": "丙烷", "D": "苯"}, "answer": "B", "explain": "乙炔燃燒範圍約 2.5~81%（甚至可分解爆炸），遠寬於甲烷 5~15%、丙烷 2.1~9.5%、苯 1.3~7.1%。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-112", "topic": "燃燒", "stem": "某氣體含有 70% 之氫（燃燒下限 4%），30% 之一氧化碳（燃燒下限 12.5%），試求該氣體之燃燒下限？", "opts": {"A": "4%", "B": "5%", "C": "6%", "D": "7%"}, "answer": "B", "explain": "L = 1 / (0.7/4 + 0.3/12.5) = 1 / 0.199 ≈ 5.03% ≈ 5%。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92警技】（原題五選項，刪去「8%」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-113", "topic": "燃燒", "stem": "某混合氣體由甲、乙二種氣體組成，混合時組成氣體不進行反應，且燃燒時無催化作用，其中甲氣體占 70%（燃燒下限 7.00%），乙氣體占 30%（燃燒下限 3.00%），則此氣體燃燒下限為多少？", "opts": {"A": "4.50%", "B": "5.00%", "C": "5.50%", "D": "6.00%"}, "answer": "B", "explain": "L = 1 / (0.7/7 + 0.3/3) = 1 / 0.2 = 5.00%。不可用濃度加權平均（會得 5.8%）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-114", "topic": "燃燒", "stem": "某混合氣體由甲、乙、丙等三種氣體組成，混合時組成氣體不進行反應且燃燒時無催化作用，其中甲氣體占 60%（燃燒下限 5.00%），乙氣體占 32%（燃燒下限 4.0%），丙氣體占 8%（燃燒下限 1.60%），則此氣體燃燒下限為多少？", "opts": {"A": "3.00%", "B": "3.20%", "C": "3.50%", "D": "4.00%"}, "answer": "D", "explain": "L = 1 / (0.6/5 + 0.32/4 + 0.08/1.6) = 1 / (0.12 + 0.08 + 0.05) = 4.00%。", "ref": "【91、93、94警技】（原題五選項，刪去「4.50%」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-115", "topic": "燃燒", "stem": "如有一可燃性液體，其閃火點下的飽和蒸氣壓為 76 mmHg，試求其燃燒下限？（一大氣壓為 760 mmHg）", "opts": {"A": "5%", "B": "10%", "C": "15%", "D": "20%"}, "answer": "B", "explain": "閃火點時液面蒸氣濃度恰為燃燒下限：L = 76/760 × 100% = 10%。", "ref": "【89消佐】（B 選項 OCR 誤為 1%，依解析還原為 10%）", "subject": "火災學", "src": "old"}, {"id": "F-C2-116", "topic": "燃燒", "stem": "辛烷的閃火點為 13℃，其相對應的飽和蒸氣壓為 7 mmHg，試求其燃燒下限？", "opts": {"A": "0.86%", "B": "0.88%", "C": "0.90%", "D": "0.92%"}, "answer": "D", "explain": "L = 7/760 × 100% ≈ 0.92%。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-117", "topic": "燃燒", "stem": "烷類之燃燒下限有公式可計算（L₀ = 0.55 C₀，C₀ 為化學理論濃度），依該公式計算乙烷之燃燒下限值為多少？", "opts": {"A": "5.2%", "B": "4.3%", "C": "3.1%", "D": "2.2%"}, "answer": "C", "explain": "C₂H₆ + 3.5 O₂，C₀ = 1/(1 + 3.5/0.21) ≈ 5.66%；L₀ = 0.55 × 5.66 ≈ 3.1%。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92警技】（原題五選項，刪去「1.3%」改編為單選；公式依下一題補入題幹）", "subject": "火災學", "src": "old"}, {"id": "F-C2-118", "topic": "燃燒", "stem": "烷類的燃燒下限計算公式為：L₀ = 0.55 C₀（L₀：燃燒下限 %；C₀：氣體完全燃燒時的化學理論濃度 %），依該公式計算，標準狀態下丙烷的燃燒下限值約為多少？", "opts": {"A": "5.2%", "B": "4.3%", "C": "3.1%", "D": "2.2%"}, "answer": "D", "explain": "C₃H₈ + 5 O₂，C₀ = 1/(1 + 5/0.21) ≈ 4.03%；L₀ = 0.55 × 4.03 ≈ 2.2%。", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-119", "topic": "燃燒", "stem": "烷類的燃燒下限計算公式為：L₀ = 0.55 C₀（L₀：燃燒下限 %；C₀：氣體完全燃燒時的化學理論濃度 %），則依該公式計算結果，在標準狀態下丁烷（C₄H₁₀）的燃燒下限大約多少？", "opts": {"A": "1.1%", "B": "1.7%", "C": "2.5%", "D": "5.3%"}, "answer": "B", "explain": "C₄H₁₀ + 6.5 O₂，C₀ = 1/(1 + 6.5/0.21) ≈ 3.13%；L₀ = 0.55 × 3.13 ≈ 1.7%。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C34-002", "topic": "爆炸", "stem": "對於爆炸的描述，下列何者正確？", "opts": {"A": "爆炸時按照火焰的大小及型態可以區分成爆轟及爆燃二種", "B": "爆轟時其火焰的傳播速度在音速以下，爆燃時火焰的傳播速度則在音速以上", "C": "由爆燃轉為爆轟時與溫度、容積或距離等條件無關", "D": "都市瓦斯爆炸必須依賴氧氣作用再生成爆炸，因此產生爆轟的情況較少"}, "answer": "A", "explain": "爆炸依火焰傳播型態可分為爆燃與爆轟。爆轟才是超音速、爆燃為次音速，B 顛倒；爆燃轉爆轟受溫度、容積、距離影響，C 錯；都市瓦斯使用不當仍可能發生爆轟，D 錯。", "ref": "【88警技】（改編為單選，刪除原(D)OCR不全之選項）", "subject": "火災學", "src": "old"}, {"id": "F-C34-003", "topic": "爆炸", "stem": "下列何者屬於化學性爆炸(Chemical Explosion)？", "opts": {"A": "一般炸藥或代拿邁炸藥的爆炸", "B": "鋼鐵廠熱鐵與水碰觸事故", "C": "鈾235與鈽239的分裂爆炸", "D": "鍋爐過熱爆炸事故"}, "answer": "A", "explain": "炸藥爆炸是劇烈氧化分解反應，屬化學性爆炸。熱鐵遇水與鍋爐過熱屬物理性（蒸氣）爆炸，核分裂屬核子爆炸。", "ref": "【88警技】（改編為單選，刪除原(B)鑄造場管路破裂）", "subject": "火災學", "src": "old"}, {"id": "F-C34-004", "topic": "爆炸", "stem": "安全工學上阻止爆炸過程有三種方法，其中最後防止第三過程為抑制所生之熱、壓力及衝擊效果，稱為：", "opts": {"A": "預防", "B": "抑制", "C": "防護", "D": "排洩"}, "answer": "C", "explain": "阻止爆炸三步驟：預防（防止起火）、抑制（阻止成長）、防護（減輕熱、壓力及衝擊效果）。排洩不屬三步驟之一。", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-006", "topic": "爆炸", "stem": "關於爆炸性物質，下列敘述何者為非？", "opts": {"A": "爆炸性物質具有化學不穩定性，能以極快的速度發生猛烈性之化學反應", "B": "許多爆炸性之物質具毒性與吸濕性", "C": "爆炸性之物質，並不需要外界供給一定的能量才能爆炸", "D": "某些爆炸性物質與金屬反應後，會生成更易爆炸之物質"}, "answer": "C", "explain": "爆炸性物質雖不穩定，仍需外界供給熱、衝擊或摩擦等起爆能量才會爆炸，故 C 錯。其餘皆為爆炸性物質的特性。", "ref": "【87、89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-007", "topic": "爆炸", "stem": "液化瓦斯(LPG)與60～70℃之水接觸時所發生之爆炸屬？", "opts": {"A": "分解爆炸", "B": "機械爆炸", "C": "粉塵爆炸", "D": "蒸氣爆炸"}, "answer": "D", "explain": "低溫液化氣體接觸溫度較高的水，瞬間大量汽化使體積急遽膨脹，屬蒸氣爆炸（物理性），並非分解或粉塵爆炸。", "ref": "【89警技】（改編為單選，刪除原(E)化學爆炸）", "subject": "火災學", "src": "old"}, {"id": "F-C34-008", "topic": "爆炸", "stem": "呈定比率之可燃性氣體與助燃氣體在一起，遇火迅速著火爆炸，稱為：", "opts": {"A": "混合氣體爆炸", "B": "氣體分解爆炸", "C": "混合危險爆炸", "D": "化合爆炸"}, "answer": "A", "explain": "可燃性氣體與助燃氣體在爆炸範圍內混合後遇火源爆炸，即混合氣體爆炸。分解爆炸是單一氣體分解放熱，混合危險是不相容物質混合引發。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-009", "topic": "爆炸", "stem": "液體變化為氣體之速度極為快速時，因能量之放出在極短時間內，即形成之爆炸現象，稱為：", "opts": {"A": "蒸氣爆炸", "B": "分解爆炸", "C": "瓦斯爆炸", "D": "粉塵爆炸"}, "answer": "A", "explain": "液體急速相變為氣體、體積驟增而釋放能量，屬蒸氣爆炸，與化學反應無關。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-010", "topic": "爆炸", "stem": "過大電流通過時，所產生之電氣爆炸是屬於下列何者？", "opts": {"A": "固態爆炸", "B": "液態爆炸", "C": "氣態爆炸", "D": "瓦斯爆炸"}, "answer": "A", "explain": "過大電流使金屬導線急速熔融汽化而爆炸，爆炸源為固體導線，歸類為固相（固態）爆炸。", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-011", "topic": "爆炸", "stem": "炸藥在製造、加工及使用過程中，不慎引起之爆炸稱為？", "opts": {"A": "氣體分解爆炸", "B": "混合危險爆炸", "C": "混合氣體爆炸", "D": "化合物爆炸"}, "answer": "B", "explain": "依本書分類，炸藥在製造、加工、使用過程中因物質混合或操作不慎引起的爆炸歸為混合危險爆炸；其餘選項指氣體類爆炸。", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-014", "topic": "爆炸", "stem": "可燃性固體之微粒子浮游於空氣中，遇有火焰或放電火花而產生爆炸現象者，稱為：", "opts": {"A": "分解爆炸", "B": "粉塵爆炸", "C": "光氣爆炸", "D": "原子爆炸"}, "answer": "B", "explain": "可燃性固體微粒懸浮於空氣中達爆炸濃度，遇火源而爆炸，即粉塵爆炸。", "ref": "【87消佐、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-015", "topic": "爆炸", "stem": "在一大氣壓力、20℃狀態下，影響粉塵爆炸的因素不包括：", "opts": {"A": "化學組成", "B": "粒徑大小", "C": "毒性", "D": "與可燃性氣體共存"}, "answer": "C", "explain": "粉塵爆炸受化學組成、粒徑、是否與可燃性氣體共存等影響；毒性與是否爆炸無關。", "ref": "【92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-016", "topic": "爆炸", "stem": "下列何者非影響粉塵爆炸之因子？", "opts": {"A": "化學組成", "B": "粒子大小", "C": "溫度", "D": "最大發火能量"}, "answer": "D", "explain": "影響粉塵爆炸的是「最小」發火能量，不是最大發火能量；化學組成、粒徑、溫度均為影響因子。", "ref": "【92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-017", "topic": "爆炸", "stem": "粉塵爆炸與可燃性氣體相同，亦須存有「最小發火能量」始可能引起粉塵爆炸，下列有關粉塵爆炸「最小發火能量」之敘述何者為非？", "opts": {"A": "比可燃性氣體大約100～1000倍", "B": "粒子越小，最小發火能量亦越小", "C": "在空氣中的值比在氧氣中的值大", "D": "大氣中水分含量越多，最小發火能量亦變小"}, "answer": "D", "explain": "水分會吸熱並使粒子凝聚，水分越多越難點燃，最小發火能量應變大，故 D 錯。", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-018", "topic": "爆炸", "stem": "引起粉塵爆炸的最小點火能量約為：", "opts": {"A": "0.1～1.0 mJ", "B": "1.0～10 mJ", "C": "10～100 mJ", "D": "100～1000 mJ"}, "answer": "C", "explain": "粉塵最小點火能量約 10～100 mJ，約為可燃性氣體（約 0.1 mJ 等級）的 100～1000 倍。", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-020", "topic": "爆炸", "stem": "有關粉塵爆炸之敘述，下列何者錯誤？", "opts": {"A": "粉塵爆炸具有爆炸界限", "B": "粉塵之最小發火能量一般比可燃性氣體大", "C": "粒子之直徑愈小，粉塵爆炸之最小發火能量愈低", "D": "有機過氧化物之灰分含量愈高，愈易產生粉塵爆炸"}, "answer": "D", "explain": "灰分屬不燃成分，含量愈高愈難爆炸，故 D 錯。粉塵有爆炸界限、最小發火能量大於氣體、粒徑愈小愈易點燃皆正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C34-021", "topic": "爆炸", "stem": "影響粉塵爆炸的因素敘述，下列何者正確？", "opts": {"A": "粉塵爆炸與粒徑大小無關", "B": "粉塵之中，含微小粒子愈多者，爆炸可能性愈低", "C": "粉塵若與可燃性氣體在空氣中共存時（例如：煤塵中混有甲烷），其爆炸下限將上升", "D": "粉塵爆炸界限與溫度及壓力有關"}, "answer": "D", "explain": "溫度、壓力上升時粉塵爆炸界限會變寬，故 D 正確。粒徑愈小愈易爆炸；與可燃性氣體共存時爆炸下限是下降而非上升。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】（改編為單選，刪除原(A)與化學組成無關）", "subject": "火災學", "src": "old"}, {"id": "F-C34-023", "topic": "爆炸", "stem": "對於影響粉塵爆炸的因素敘述，下列何者正確？", "opts": {"A": "粉塵之化學組成與爆炸無關", "B": "處理乾燥粉塵，無須特別注意", "C": "粉塵之中，含微小粒子愈多者，爆炸可能性愈高", "D": "粉塵無所謂爆炸界限"}, "answer": "C", "explain": "粒徑愈小、比表面積愈大，愈易氧化點燃，爆炸可能性愈高。化學組成有關、乾燥粉塵更危險、粉塵也有爆炸界限。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89、91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-024", "topic": "爆炸", "stem": "下列何種金屬類粉塵物質並不會產生粉塵爆炸：", "opts": {"A": "銅", "B": "鋁", "C": "鎂", "D": "鋅"}, "answer": "A", "explain": "鋁、鎂、鋅粉均為可燃性金屬粉塵；銅不易燃燒，屬不燃性粉塵。", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-025", "topic": "爆炸", "stem": "下列粉塵何者不致引起爆炸？", "opts": {"A": "木屑", "B": "小麥粉", "C": "鋁粉", "D": "岩粉"}, "answer": "D", "explain": "岩粉為無機礦物，屬不燃性粉塵（礦坑中甚至用來抑制煤塵爆炸）；其餘皆為可燃性粉塵。", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-026", "topic": "爆炸", "stem": "下列何種金屬類粉塵物質，不會產生粉塵爆炸的危險？", "opts": {"A": "鎂", "B": "鈦", "C": "鋅", "D": "鉛"}, "answer": "D", "explain": "鎂、鈦、鋅粉皆易燃，可發生粉塵爆炸；本書將鉛列為不會產生粉塵爆炸者。", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-028", "topic": "滅火", "stem": "滅火方法約略可概分為物理方法及化學方法兩大類，下列何者屬化學法：", "opts": {"A": "冷卻法", "B": "窒息法", "C": "移除法", "D": "抑制法"}, "answer": "D", "explain": "抑制法是中斷燃燒的連鎖反應（自由基），屬化學滅火；冷卻、窒息、移除皆屬物理方法。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-029", "topic": "滅火", "stem": "比較不適用於A類火災的滅火劑？", "opts": {"A": "水", "B": "化學泡沫", "C": "二氧化碳", "D": "機械泡沫"}, "answer": "C", "explain": "A 類深層火災需冷卻浸潤，二氧化碳冷卻力小、放射後易散逸而復燃；水與泡沫含水分可冷卻。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-030", "topic": "滅火", "stem": "根據美國防火協會（NFPA）定義：石油製品、引火性液體或固體油脂等B類火災中運用何種滅火作用最為有效？", "opts": {"A": "電絕緣", "B": "冷卻", "C": "窒息", "D": "抑制連鎖反應"}, "answer": "C", "explain": "NFPA 對 B 類火災以隔絕空氣（窒息、覆蓋）為最有效的滅火作用；水冷卻易使油火擴散。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-031", "topic": "滅火", "stem": "下列何種火災以窒息作用可達最佳之滅火效果？", "opts": {"A": "普通火災", "B": "油類火災", "C": "電氣火災", "D": "金屬火災"}, "answer": "B", "explain": "油類火災以覆蓋隔絕空氣（窒息）最有效；普通火災以冷卻為主，金屬火災需專用乾粉或乾砂。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-032", "topic": "滅火", "stem": "密閉之空間若注入不燃性氣體，造成氧氣之濃度減低，進而使燃燒現象無法持續者，屬下列何種滅火法？", "opts": {"A": "冷卻法", "B": "窒息法", "C": "移除法", "D": "抑制法"}, "answer": "B", "explain": "注入不燃性氣體稀釋氧濃度，使其低於燃燒所需，屬窒息法。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-033", "topic": "滅火", "stem": "下列何種滅火劑不適用於一般A類火災？", "opts": {"A": "酸鹼劑", "B": "機械泡沫", "C": "碳酸氫鈉乾粉", "D": "水（霧狀）"}, "answer": "C", "explain": "碳酸氫鈉乾粉屬 BC 乾粉，對 A 類固體深層火災效果差、易復燃；酸鹼劑、泡沫、水霧都有冷卻作用。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92、94士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-034", "topic": "滅火", "stem": "下列何種滅火劑不適用於可燃性液體火災？", "opts": {"A": "不燃性氣體", "B": "水（柱狀）", "C": "化學泡沫", "D": "碳酸氫鉀乾粉"}, "answer": "B", "explain": "柱狀水射入油面會使油液飛濺、擴大燃燒面；其餘可窒息或抑制。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-035", "topic": "滅火", "stem": "下列何者最適用於油類火災之滅火以獲較佳之滅火效果？", "opts": {"A": "水", "B": "不導體滅火劑", "C": "泡沫", "D": "輕水"}, "answer": "C", "explain": "油類火災以泡沫覆蓋油面、隔絕空氣並冷卻最為適合。輕水（AFFF）也屬泡沫類且效能佳，本題依一般考法選泡沫，答案存疑。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-036", "topic": "滅火", "stem": "向火焰區噴射鹵化烴的滅火法主要是控制何種燃燒要素？", "opts": {"A": "氧氣", "B": "熱能", "C": "可燃物", "D": "連鎖反應"}, "answer": "D", "explain": "鹵化烴受熱分解出鹵素自由基，捕捉 H·、OH· 等活性基，中斷連鎖反應。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92、93士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-038", "topic": "滅火", "stem": "碳化鈣火災不可用何種滅火劑？", "opts": {"A": "砂", "B": "乾粉", "C": "二氧化碳", "D": "水"}, "answer": "D", "explain": "碳化鈣遇水產生乙炔並放熱，可能引燃乙炔而爆炸：CaC₂ + 2H₂O → Ca(OH)₂ + C₂H₂↑。", "ref": "【86警技】（改編為單選，刪除原(E)麵粉；原(D)選項OCR缺字依解析補為「水」）", "subject": "火災學", "src": "old"}, {"id": "F-C34-040", "topic": "滅火", "stem": "深入火場感覺現場高溫高熱難耐時，為促進所處位置的氣流流通，舒緩不佳的救災環境，下列何者方式較佳：", "opts": {"A": "強力直線水柱射水", "B": "脫去消防衣", "C": "全部撤退離開現場休息", "D": "利用水霧方式射水帶動氣流"}, "answer": "D", "explain": "水霧射水可吸熱降溫並帶動周邊空氣流動（水霧帶風）；直線水柱帶動氣流效果差，脫去消防衣則危及安全。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-043", "topic": "滅火", "stem": "二氧化碳放射時，由液化轉變為氣化，體積約膨脹為幾倍？", "opts": {"A": "250倍", "B": "350倍", "C": "450倍", "D": "500倍"}, "answer": "C", "explain": "液態二氧化碳 1 kg 氣化後在常壓下約 0.5 m³，換算體積膨脹約 400～500 倍，一般教材取約 450 倍；不同溫度下液體密度不同，數值有出入。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-044", "topic": "滅火", "stem": "下列有關二氧化碳滅火劑之敘述何者錯誤？", "opts": {"A": "滅火後可不留痕跡", "B": "稍加壓力便可液化，故可大量儲存而不占太多空間", "C": "適用於電氣設備火災", "D": "適用於金屬鈉火災"}, "answer": "D", "explain": "鈉等活性金屬可在二氧化碳中繼續燃燒（奪取其中的氧），故不適用。CO₂不導電、無殘跡、易液化儲存皆正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-045", "topic": "滅火", "stem": "海龍(Halon)1211之化學式為：", "opts": {"A": "CCl₄", "B": "CF₂ClBr", "C": "CF₂BrI", "D": "CH₂BrCl"}, "answer": "B", "explain": "海龍編號依序為 C、F、Cl、Br 的原子數：1211 表示 1 個 C、2 個 F、1 個 Cl、1 個 Br，即 CF₂ClBr。", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-046", "topic": "滅火", "stem": "海龍滅火劑CF₃Br若以數字代碼命名應為下列何者？", "opts": {"A": "1301", "B": "1211", "C": "1011", "D": "2402"}, "answer": "A", "explain": "CF₃Br：C=1、F=3、Cl=0、Br=1，故為海龍 1301。", "ref": "【88警技】（改編為單選，刪除原(E)1031）", "subject": "火災學", "src": "old"}, {"id": "F-C34-048", "topic": "滅火", "stem": "下列有關選擇海龍（Halon）替代品考量因素之敘述，何者有誤？", "opts": {"A": "滅火效能要高", "B": "破壞臭氧層指數（O.D.P.）必須越接近零越好", "C": "在大氣滯留時間（Life Time）越長越好", "D": "溫室效應值（G.W.P.）越低越好"}, "answer": "C", "explain": "替代品在大氣中滯留時間越短越好，以減少對環境的長期影響，故 C 錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-049", "topic": "滅火", "stem": "下列何種滅火劑成分被用以作為海龍滅火劑之替代品？", "opts": {"A": "CF₂BrCl", "B": "CHF₃", "C": "CF₃Br", "D": "CCl₄"}, "answer": "B", "explain": "CHF₃ 即 FE-13（HFC-23），不含溴、氯，ODP 為零；CF₂BrCl、CF₃Br 本身就是海龍，CCl₄ 已淘汰。", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-051", "topic": "滅火", "stem": "下列何種海龍替代品滅火劑其熱分解物不至於產生氟化氫（HF）？", "opts": {"A": "PFC-410（CEA-410）", "B": "FM-200", "C": "FE-13（HFC-23）", "D": "Inergen（IG-541）"}, "answer": "D", "explain": "IG-541 由氮、氬、二氧化碳組成，不含氟，不會分解產生 HF；其餘鹵烴類受熱均會分解出 HF。", "ref": "【87警技、91消佐】（改編為單選，刪除原(D)NAFS-III）", "subject": "火災學", "src": "old"}, {"id": "F-C34-052", "topic": "滅火", "stem": "下列海龍替代品滅火藥劑何者之臭氧層破壞指數(ODP)最大？", "opts": {"A": "NAFS-III", "B": "FM-200", "C": "INERGEN（IG541）", "D": "CEA-410"}, "answer": "A", "explain": "NAFS-III 含 HCFC（含氯），ODP 約 0.044；FM-200、IG541、CEA-410 的 ODP 皆為 0。", "ref": "【89警技、94士】（改編為單選，刪除原(E)FE-13）", "subject": "火災學", "src": "old"}, {"id": "F-C34-053", "topic": "滅火", "stem": "就海龍替代品FM-200以a表示，FE-13以b表示，NAFS-III以c表示，三者之溫室效應值（G.W.P.）之高低為何？", "opts": {"A": "a>b>c", "B": "b>a>c", "C": "c>a>b", "D": "a>c>b"}, "answer": "B", "explain": "FE-13（HFC-23）GWP 約一萬以上最高，FM-200 約數千次之，NAFS-III 約一千多最低，故 b>a>c。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92警技】（改編為單選，刪除原(E)b>c>a）", "subject": "火災學", "src": "old"}, {"id": "F-C34-054", "topic": "滅火", "stem": "下列那一種海龍替代品所需的滅火濃度最高？", "opts": {"A": "FM-200", "B": "FE-13", "C": "CEA-410", "D": "NAFS-III"}, "answer": "B", "explain": "FE-13 滅火效率較低，設計濃度約 16% 以上，高於 FM-200（約 7%）、CEA-410（約 6%）、NAFS-III（約 9%）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-055", "topic": "滅火", "stem": "下列那一種鹵烴海龍替代品的化學式，由4種元素所構成？", "opts": {"A": "NAFS-III", "B": "FE-13", "C": "CEA-410", "D": "FM-200"}, "answer": "A", "explain": "NAFS-III 為 HCFC 混合物，含 C、H、Cl、F 四種元素；FE-13（CHF₃）、FM-200（C₃HF₇）為三種，CEA-410（C₄F₁₀）僅兩種。", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-056", "topic": "滅火", "stem": "一般而言，下列有關鹵烴海龍替代品的敘述，何者不正確？", "opts": {"A": "為電的非導體", "B": "撲滅火勢時，比海龍1301更不易產生HF", "C": "所需的儲存空間，比海龍1301大", "D": "除HFC-23外，皆以氮氣增壓"}, "answer": "B", "explain": "鹵烴替代品滅火濃度較高、滅火時間較長，分解產生的 HF 比海龍 1301 更多，故 B 錯。其用量大所以儲存空間較大。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "書中未標出處（原(C)選項缺字，依文意補「大」）", "subject": "火災學", "src": "old"}, {"id": "F-C34-057", "topic": "滅火", "stem": "利用水作
