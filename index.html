"是否對違反兵員召集的行為課予刑罰", "C": "是否排除生理女性的服兵役義務", "D": "是否採計任公務員前服義務役之年資為公務員退休年資"}, "answer": "D", "explain": "釋字第490號認兵役義務之履行方式、是否因宗教理由免除、是否僅男性服役，屬立法形成自由（A、C）；違反召集是否課以刑罰亦屬立法裁量（B）。釋字第455號則認為義務役年資與志願役年資之採計，涉及平等原則，國家對服義務役之年資不得恣意排除，非完全屬立法形成自由，故選D。", "ref": "釋字第490號；釋字第455號", "evidence": ""}, {"id": "113-法學-09", "src": "old", "year": 113, "n": 9, "subject": "法學", "topic": "憲法", "stem": "依憲法本文及增修條文之規定，有關總統之敘述，下列何者正確？", "opts": {"A": "總統不得為減刑權之行使，蓋減刑權乃司法院之職權", "B": "總統有報告國情之義務，因此須接受立法委員的質詢", "C": "總統雖具有刑事豁免權，然於必要時，仍得搜索總統之處所及身體", "D": "總統就行政院對立法院決議之法律案提出覆議，有核可權"}, "answer": "D", "explain": "增修條文第3條第2項第2款規定行政院對立法院決議之法律案認窒礙難行時，「得經總統之核可」移請覆議，D正確。A減刑權依憲法第40條屬總統；B總統赴立法院國情報告，立委不得質詢（增修§4第3項）；C依釋字第627號，總統享刑事豁免，不得對總統之身體進行搜索。", "ref": "增修條文§3", "evidence": "得經總統之核可，於該決議案送達行政院十日內，移請立法院覆議"}, {"id": "113-法學-10", "src": "old", "year": 113, "n": 10, "subject": "法學", "topic": "憲法", "stem": "依憲法第 105 條規定，行政院所提出之決算案，應由下列何者依法完成其審核，並提出審核報告於立法院？", "opts": {"A": "監察委員", "B": "審計長", "C": "監察院國家人權委員會", "D": "主計長"}, "answer": "B", "explain": "憲法第105條規定審計長應於行政院提出決算後三個月內，依法完成其審核，並提出審核報告於立法院，故選B。審計長隸屬監察院（憲法§104），但審核主體為審計長而非監察委員；主計長則負責預算編製與決算編造，非審核者。", "ref": "憲法§105", "evidence": "審計長應於行政院提出決算後三個月內，依法完成其審核，並提出審核報告於立法院。"}, {"id": "113-法學-11", "src": "old", "year": 113, "n": 11, "subject": "法學", "topic": "憲法", "stem": "憲法訴訟法沒有明文規定下列何者？", "opts": {"A": "法院審判權爭議之統一見解", "B": "暫時處分", "C": "裁判效力", "D": "政黨違憲解散案件之審理"}, "answer": "A", "explain": "憲法訴訟法（2022-01-04施行）明定暫時處分（§43）、裁判效力（§38以下）及政黨違憲解散案件（第四章），B、C、D均有規定。法院審判權爭議之解決，改由法院組織法第7條之1以下等規定，由各法院裁定移送及終審法院處理，不再由大法官處理，憲訴法無此規定，選A。2024年憲訴法修正未改變此點。", "ref": "憲法訴訟法§38、§43；法院組織法§7-1", "evidence": ""}, {"id": "113-法學-12", "src": "old", "year": 113, "n": 12, "subject": "法學", "topic": "憲法", "stem": "關於憲法基本權利，下列敘述何者錯誤？", "opts": {"A": "基本權利乃一個人生存所不可或缺，且其核心為永久不可侵犯之權利", "B": "為達公共利益目的，國家權力作用即得限制基本權利", "C": "基本權利對於立法權、司法權或行政權，皆具有拘束力", "D": "基本權利受到侵害時，可以請求司法救濟"}, "answer": "B", "explain": "基本權利之核心不可侵犯（A）；基本權拘束所有國家權力（C）；受侵害時得依憲法第16條請求司法救濟（D）。國家欲限制基本權，除具公益目的外，尚須符合憲法第23條之必要要件（比例原則）並以法律為之（法律保留），並非有公益目的即得限制，B錯誤當選。", "ref": "憲法§23", "evidence": ""}, {"id": "113-法學-13", "src": "old", "year": 113, "n": 13, "subject": "法學", "topic": "憲法", "stem": "衛生福利部以「嚴重特殊傳染性肺炎防治及紓困振興特別條例」施行期間屆滿，擬停止企業紓困及振興等措施。甲認為我國經濟景氣不佳的狀況，依然嚴峻，乃向衛生福利部請求繼續實施前述措施。甲係行使下列何種憲法權利？", "opts": {"A": "訴願權", "B": "請願權", "C": "訴訟權", "D": "創制權"}, "answer": "B", "explain": "請願權係人民對國家政策、公共利害或其權益之維護，向職權所屬機關表示願望之權利（請願法§2）。甲請求衛福部繼續實施紓困措施，屬對政策表達願望，行使請願權，選B。訴願、訴訟係對違法或不當之行政處分等請求救濟；創制權為對法律之直接民權，均不符。", "ref": "憲法§16；請願法§2", "evidence": ""}, {"id": "113-法學-14", "src": "old", "year": 113, "n": 14, "subject": "法學", "topic": "憲法", "stem": "甲原為大學教授，經任命為大法官。依現行規定及相關司法院大法官解釋，下列敘述何者正確？", "opts": {"A": "甲享有憲法第 81 條所定非依法律不得減俸之保障", "B": "甲從大法官退職後，享有終身職待遇之保障", "C": "甲任大法官 3 年後辭職，繼任其職位之大法官任期為 5 年", "D": "甲為隨政黨更迭之政務人員"}, "answer": "A", "explain": "釋字第601號認大法官無論是否由法官轉任，均為憲法上之法官，享有憲法第81條非依法律不得減俸之保障，A正確。B依增修條文第5條第1項，非法官轉任者不適用終身職待遇；C大法官任期八年、個別計算，繼任者任期為完整八年；D大法官依據憲法獨立審判，非隨政黨更迭之政務人員。", "ref": "增修條文§5；釋字第601號", "evidence": "司法院大法官任期八年，不分屆次，個別計算，並不得連任。"}, {"id": "113-法學-15", "src": "old", "year": 113, "n": 15, "subject": "法學", "topic": "憲法", "stem": "依憲法本文及增修條文中關於中央與地方權限之規定，下列何者目前已不適用？", "opts": {"A": "航空、國道、國有鐵路、航政、郵政及電政等事項，由中央立法並執行之", "B": "省縣自治通則由中央立法並執行之，或交由省縣執行之", "C": "直轄市之自治，以法律定之", "D": "縣農林、水利、漁牧及工程等事項，由縣立法並執行之"}, "answer": "B", "explain": "增修條文第9條第1項規定省、縣地方制度以法律定之，不受憲法第108條第1項第1款（省縣自治通則）等之限制，故B已停止適用，選B。A為憲法第107條、C為第118條、D為第110條，現仍適用。", "ref": "增修條文§9；憲法§108", "evidence": "不受憲法第一百零八條第一項第一款、第一百零九條、第一百十二條至第一百十五條及第一百二十二條之限制"}, {"id": "113-法學-16", "src": "old", "year": 113, "n": 16, "subject": "法學", "topic": "法學緒論", "stem": "下列關於強行法與任意法的敘述，何者錯誤？", "opts": {"A": "強行法與任意法的區分標準，在於是否容許基於當事人之自由意思，決定該法律應否加以適用", "B": "凡是法律之規定與公共利益直接相關或有重大影響者，多半定為強行法", "C": "民法及商事法之規定，多半為任意法之規定", "D": "凡屬公法性質之法律，其內容均為強行法規定，完全不存在有任意法之規定"}, "answer": "D", "explain": "強行法與任意法之區分，在於法律能否因當事人意思排除適用（A正確）；與公益直接相關者多為強行法（B正確）；民商法重私法自治，多為任意法（C正確）。公法雖多為強行規定，但亦有容許當事人約定之任意規定（如行政契約相關規定），並非完全不存在任意法，D錯誤當選。", "ref": "法學緒論", "evidence": ""}, {"id": "113-法學-17", "src": "old", "year": 113, "n": 17, "subject": "法學", "topic": "法學緒論", "stem": "依據勞動基準法之規定，下列何種情形，雇主不得未經預告終止勞動契約？", "opts": {"A": "勞工無正當理由繼續曠工 3 日", "B": "勞工患有法定傳染病，對共同工作之勞工有傳染之虞", "C": "勞工受有期徒刑以上刑之宣告確定，而未諭知緩刑或未准易科罰金", "D": "勞工對於雇主家屬為重大侮辱之行為"}, "answer": "B", "explain": "勞動基準法第12條第1項雇主得不經預告終止契約之事由，包括受有期徒刑以上刑之宣告確定而未諭知緩刑或易科罰金（C）、對雇主家屬重大侮辱（D）、無正當理由繼續曠工三日（A）。「患有法定傳染病，對共同工作勞工有傳染之虞」係第14條第1項勞工得不經預告終止契約之事由，雇主不得據此不經預告終止，選B。", "ref": "勞動基準法§12、§14", "evidence": ""}, {"id": "113-法學-18", "src": "old", "year": 113, "n": 18, "subject": "法學", "topic": "法學緒論", "stem": "公職人員選舉罷免法所稱之「中央公職人員」，係指下列何者？", "opts": {"A": "總統", "B": "省諮議員", "C": "立法委員", "D": "監察委員"}, "answer": "C", "explain": "公職人員選舉罷免法第2條規定，中央公職人員為立法院立法委員；地方公職人員為直轄市議員、縣市議員、鄉鎮市民代表、直轄市長、縣市長、鄉鎮市長、原住民區長及村里長，故選C。總統另依總統副總統選舉罷免法；監察委員改由總統提名、立法院同意；省諮議員非選舉產生。", "ref": "公職人員選舉罷免法§2", "evidence": ""}, {"id": "113-法學-19", "src": "old", "year": 113, "n": 19, "subject": "法學", "topic": "法學緒論", "stem": "下列何種行政行為，不適用行政程序法之程序規定？", "opts": {"A": "監察院公告調查報告", "B": "外交部領事事務局依國民申請核發護照", "C": "內政部營建署發布違章建築處理辦法", "D": "衛生福利部中央健康保險署與醫療院所締結全民健康保險特約醫事服務機構合約"}, "answer": "A", "explain": "行政程序法第3條第2項規定，各級民意機關、司法機關及監察機關之行政行為，不適用本法之程序規定，故監察院公告調查報告不適用，選A。B核發護照屬行政處分；C發布辦法屬法規命令；D締結健保特約屬行政契約（釋字第533號），均適用行政程序法。", "ref": "行政程序法§3", "evidence": ""}, {"id": "113-法學-20", "src": "old", "year": 113, "n": 20, "subject": "法學", "topic": "法學緒論", "stem": "我國私立學校屬於下列何種法律主體？", "opts": {"A": "公司", "B": "非法人團體", "C": "社團法人", "D": "財團法人"}, "answer": "D", "explain": "私立學校法規定，私立學校由學校法人設立，學校法人應依法申請登記為財團法人（私立學校法§2、§9），故私立學校之法律主體屬財團法人，選D。社團法人以人之集合為基礎，公司為營利社團法人，非法人團體則不具法人格，均不符。", "ref": "私立學校法", "evidence": ""}, {"id": "113-法學-21", "src": "old", "year": 113, "n": 21, "subject": "法學", "topic": "法學緒論", "stem": "關於平等原則，下列敘述何者錯誤？", "opts": {"A": "平等原則並不禁止差別待遇", "B": "平等原則保障人民法律上地位之實質平等", "C": "恣意禁止為平等原則之保障內涵", "D": "平等原則僅適用於給付行政領域"}, "answer": "D", "explain": "平等原則並非禁止一切差別待遇，而是禁止無正當理由之差別待遇（A正確）；保障實質平等（B正確，釋字第485號）；恣意禁止為其核心內涵（C正確）。平等原則拘束所有國家權力之行使，干涉行政與給付行政均有適用（行政程序法§6），D錯誤當選。", "ref": "行政程序法§6；釋字第485號", "evidence": ""}, {"id": "113-法學-22", "src": "old", "year": 113, "n": 22, "subject": "法學", "topic": "法學緒論", "stem": "關於假釋之敘述，下列何者錯誤？", "opts": {"A": "假釋可以撤銷", "B": "假釋撤銷後，其出獄日數不計入刑期內", "C": "假釋中因故意再犯罪，受有期徒刑以上之宣告者，得撤銷其假釋", "D": "假釋中因故意或過失再犯罪而遭撤銷其假釋者，應成立累犯"}, "answer": "D", "explain": "刑法第78條規定假釋得撤銷（A正確），第4項撤銷後出獄日數不算入刑期（B正確）；第2項假釋中故意更犯罪受六月以下有期徒刑宣告，有必要時得撤銷（C正確）。累犯依第47條須受徒刑執行完畢或一部執行而赦免後五年內「故意」再犯，假釋期間刑未執行完畢，且過失犯罪亦不成立累犯，D錯誤當選。", "ref": "刑法§47、§78", "evidence": ""}, {"id": "113-法學-23", "src": "old", "year": 113, "n": 23, "subject": "法學", "topic": "法學緒論", "stem": "依我國著作權法規定，下列行為，何者不侵害或不視為侵害著作權？", "opts": {"A": "於公司業務上使用之電腦中安裝未經授權之電腦程式，供員工營業上使用", "B": "出國旅遊時，於國外購買一本外文小說，放在自己的行李箱內攜帶回國", "C": "明知是未經授權重製之電腦程式，而出借給不特定多數人", "D": "未經著作財產權人同意而輸入二十本在國外合法重製的原文教科書"}, "answer": "B", "explain": "著作權法第87條第1項第4款未經授權輸入真品平行輸入屬視為侵害，但第87條之1第1項第3款規定，屬入境人員行李之一部分而輸入一定數量重製物者不在此限，故B不侵害。A業務上使用盜版程式、C明知盜版而出借、D輸入二十本原文書供非個人使用，均構成侵害或視為侵害。", "ref": "著作權法§87、§87-1", "evidence": ""}, {"id": "113-法學-24", "src": "old", "year": 113, "n": 24, "subject": "法學", "topic": "法學緒論", "stem": "依公職人員選舉罷免法第 4 條規定，有關候選人年齡之計算，以算至下列何期日之前一日為準？", "opts": {"A": "選舉公告日", "B": "登記截止日", "C": "投票日", "D": "法定就職日"}, "answer": "C", "explain": "公職人員選舉罷免法第4條第1項規定，選舉人、候選人年齡及居住期間之計算，均以算至投票日前一日為準，故選C。其餘選舉公告日、登記截止日、法定就職日均非法定計算基準。", "ref": "公職人員選舉罷免法§4", "evidence": ""}, {"id": "113-法學-25", "src": "old", "year": 113, "n": 25, "subject": "法學", "topic": "法學緒論", "stem": "依憲法訴訟法規定，人民聲請裁判憲法審查案件，得由下列何者以一致決裁定不受理？", "opts": {"A": "大法庭", "B": "職務法庭", "C": "審查庭", "D": "憲法法庭"}, "answer": "C", "explain": "憲法訴訟法第61條第2項規定，審查庭就承辦大法官分受之裁判憲法審查聲請案件，得以一致決為不受理之裁定並附理由；不能達成一致決者由憲法法庭評決受理與否，選C。經查2025-01-23修正公布之現行條文，本條仍維持審查庭一致決不受理之機制。", "ref": "憲法訴訟法§61", "evidence": ""}, {"id": "113-法學-26", "src": "old", "year": 113, "n": 26, "subject": "法學", "topic": "法學緒論", "stem": "依憲法訴訟法規定，下列何者非屬人民聲請裁判憲法審查之要件？", "opts": {"A": "須依法定程序用盡審級救濟", "B": "聲請案件必須具憲法重要性或為貫徹聲請人基本權利所必要者", "C": "聲請人必須指摘該裁判本身牴觸憲法", "D": "聲請人必須指摘該裁判所表示之見解，與不同審判權終審法院已表示之見解有異"}, "answer": "D", "explain": "憲法訴訟法第59條第1項規定人民須依法定程序用盡審級救濟（A），並指摘確定終局裁判或其所適用之法規範牴觸憲法（C）；第61條第1項須具憲法重要性或為貫徹基本權所必要（B）。D「與不同審判權終審法院見解有異」係第84條統一解釋法律及命令之要件，非裁判憲法審查要件，選D。", "ref": "憲法訴訟法§59、§61、§84", "evidence": ""}, {"id": "113-法學-27", "src": "old", "year": 113, "n": 27, "subject": "法學", "topic": "法學緒論", "stem": "有關夫妻之住所，下列敘述何者正確？", "opts": {"A": "妻以夫之住所為住所", "B": "協議不成時，得聲請戶政機關定之", "C": "若規定以夫之住所為住所，違反平等及比例原則", "D": "法院裁定前，推定為無住所"}, "answer": "C", "explain": "釋字第452號認舊民法第1002條「妻以夫之住所為住所」違反男女平等及比例原則，C正確。現行民法第1002條第1項規定夫妻之住所由雙方共同協議，協議不成或未為協議時，得聲請「法院」定之（B錯）；第2項法院裁定前，以共同戶籍地推定為住所（D錯）；A為舊法規定，已刪除。", "ref": "民法§1002；釋字第452號", "evidence": ""}, {"id": "113-法學-28", "src": "old", "year": 113, "n": 28, "subject": "法學", "topic": "法學緒論", "stem": "下列何者之行政行為應適用行政程序法之程序規定？", "opts": {"A": "民意機關", "B": "監察機關", "C": "司法機關", "D": "獨立行政機關"}, "answer": "D", "explain": "行政程序法第3條第2項規定，各級民意機關、司法機關及監察機關之行政行為不適用本法程序規定，故A、B、C排除適用。獨立行政機關（如公平會、NCC、中選會）仍屬行政機關，其行政行為應適用行政程序法，選D。", "ref": "行政程序法§3", "evidence": ""}, {"id": "113-法學-29", "src": "old", "year": 113, "n": 29, "subject": "法學", "topic": "法學緒論", "stem": "甲於開放的網路公開論壇上以不雅文字公然侮辱乙，致乙名譽受損及心理受創。關於乙在法律上可主張權利之敘述，下列何者錯誤？", "opts": {"A": "乙得就甲侵害名譽權請求損害賠償", "B": "乙得請求甲停止侵害，並移除該網站上之侮辱性文字", "C": "乙得請求法院命甲回復名譽之適當處分", "D": "依民法第 18 條規定，侵害人格權得請求慰撫金者，以法律有特別規定者為限，故乙不得對甲請求慰撫金"}, "answer": "D", "explain": "名譽權受侵害，得依民法第184條、第195條請求損害賠償（A）；依第18條第1項請求除去侵害（B）；依第195條第1項後段請求回復名譽之適當處分（C）。第18條第2項固規定慰撫金以法律有特別規定者為限，但第195條第1項即為侵害名譽得請求非財產上損害賠償之特別規定，故乙得請求慰撫金，D錯誤當選。", "ref": "民法§18、§195", "evidence": ""}, {"id": "113-法學-30", "src": "old", "year": 113, "n": 30, "subject": "法學", "topic": "法學緒論", "stem": "甲男與乙女結婚，乙於婚後懷胎丙，懷孕期間甲因丁之過失發生車禍死亡。關於胎兒丙之權利，下列敘述何者正確？", "opts": {"A": "因丙不具權利能力，絕對無繼承權", "B": "丙雖有權利能力，但因尚未出生無繼承權", "C": "丙有權利能力，但不得向丁請求損害賠償", "D": "若丙胎死腹中，則丙喪失權利能力"}, "answer": "D", "explain": "民法第7條規定，胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生，故丙就繼承（民法§1166）及對丁請求扶養費損害賠償（§192第2項）均有權利能力，A、B、C錯誤。若丙死產，即不符「非死產」要件，溯及不享有權利能力，官方以D為正解。", "ref": "民法§7、§192、§1166", "evidence": ""}, {"id": "113-法學-31", "src": "old", "year": 113, "n": 31, "subject": "法學", "topic": "英文", "stem": "Others might cry or get bent out of shape when their personal tastes are ____ and ridiculed, but not this young lady with a strong mind of her own.", "opts": {"A": "launched", "B": "announced", "C": "pronounced", "D": "denounced"}, "answer": "D", "explain": "句意：別人的個人品味被「譴責」與嘲笑時可能會哭或生氣，但這位有主見的年輕女士不會。denounce＝公開指責，與 ridiculed 並列。launch 發起；announce 宣布；pronounce 發音、宣告。", "ref": "英文", "evidence": ""}, {"id": "113-法學-32", "src": "old", "year": 113, "n": 32, "subject": "法學", "topic": "英文", "stem": "Susan used the ____ control to turn off the TV in the living room right before she stepped out of the door of her apartment.", "opts": {"A": "dramatic", "B": "normal", "C": "remote", "D": "technical"}, "answer": "C", "explain": "句意：Susan 出門前用「遙控器」關掉客廳電視。remote control＝遙控器，固定搭配。dramatic 戲劇性的；normal 正常的；technical 技術的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-33", "src": "old", "year": 113, "n": 33, "subject": "法學", "topic": "英文", "stem": "Weeks after being hit by a 7.2 earthquake, the entire county, unfortunately, still faced many ____ situations that had left more than two million people homeless.", "opts": {"A": "disastrous", "B": "lucrative", "C": "majestic", "D": "tedious"}, "answer": "A", "explain": "句意：遭7.2級地震襲擊數週後，全郡仍面臨許多「災難性」處境，逾兩百萬人無家可歸。disastrous＝災難性的。lucrative 有利可圖的；majestic 雄偉的；tedious 冗長乏味的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-34", "src": "old", "year": 113, "n": 34, "subject": "法學", "topic": "英文", "stem": "The company’s overhead costs have increased in recent months, leading to a decrease in profits despite higher sales ____ .", "opts": {"A": "faculty", "B": "facility", "C": "avenue", "D": "revenue"}, "answer": "D", "explain": "句意：公司近月間接成本增加，儘管銷售「收入」提高，利潤仍下滑。sales revenue＝銷售收入。faculty 全體教員、能力；facility 設施；avenue 大道、途徑。", "ref": "英文", "evidence": ""}, {"id": "113-法學-35", "src": "old", "year": 113, "n": 35, "subject": "法學", "topic": "英文", "stem": "The head office of this international company is located in New York, and they have set up several ____ in different cities around the world.", "opts": {"A": "compartments", "B": "branches", "C": "supplements", "D": "ranches"}, "answer": "B", "explain": "句意：這家跨國公司總部設在紐約，並在世界各城市設立數個「分公司」。branch＝分支機構。compartment 隔間；supplement 補充品；ranch 大牧場（易與 branch 混淆）。", "ref": "英文", "evidence": ""}, {"id": "113-法學-36", "src": "old", "year": 113, "n": 36, "subject": "法學", "topic": "英文", "stem": "Apart from engendering widespread ecological disorders, pesticides have contributed to the ____ of a new breed of chemical-resistant, highly lethal superbugs.", "opts": {"A": "emergence", "B": "exclusion", "C": "savage", "D": "seduction"}, "answer": "A", "explain": "句意：農藥除造成生態失調外，也促成抗藥性、高致命超級細菌的「出現」。emergence＝出現、興起，contribute to the emergence of。exclusion 排除；savage 野蠻的；seduction 誘惑。", "ref": "英文", "evidence": ""}, {"id": "113-法學-37", "src": "old", "year": 113, "n": 37, "subject": "法學", "topic": "英文", "stem": "The athlete’s tenacious spirit showed amazing ____ and determination, thereby allowing her to overcome the obstacles in her path.", "opts": {"A": "relaxation", "B": "permanence", "C": "reminiscence", "D": "perseverance"}, "answer": "D", "explain": "句意：運動員頑強的精神展現驚人的「毅力」與決心，使她克服障礙。perseverance＝堅持不懈。relaxation 放鬆；permanence 永久性；reminiscence 回憶。", "ref": "英文", "evidence": ""}, {"id": "113-法學-38", "src": "old", "year": 113, "n": 38, "subject": "法學", "topic": "英文", "stem": "Researchers anticipated the slowdown of economy. The ____ outlook scared investors away from the stock market.", "opts": {"A": "gleaming", "B": "glaring", "C": "glamorous", "D": "gloomy"}, "answer": "D", "explain": "句意：研究人員預期經濟放緩，這種「悲觀的」前景嚇跑了股市投資人。gloomy outlook＝悲觀前景。gleaming 閃亮的；glaring 刺眼的、明顯的；glamorous 迷人的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-39", "src": "old", "year": 113, "n": 39, "subject": "法學", "topic": "英文", "stem": "The secretary told the manager that the schedule she arranged was a ____ one, not finalized yet.", "opts": {"A": "tentative", "B": "provincial", "C": "constant", "D": "visual"}, "answer": "A", "explain": "句意：秘書告訴經理她安排的行程是「暫定的」，尚未定案。tentative＝暫時的、試驗性的，與 not finalized yet 呼應。provincial 地方的；constant 持續的；visual 視覺的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-40", "src": "old", "year": 113, "n": 40, "subject": "法學", "topic": "英文", "stem": "One effect caused by drinking too much alcoholic beverage is that our feeling is so stimulated that action and speech seem to be ____ up.", "opts": {"A": "looked", "B": "made", "C": "passed", "D": "speeded"}, "answer": "D", "explain": "句意：飲酒過量的影響之一是感覺受刺激，使動作與言語似乎「加速」。speed up＝加快（過去分詞 speeded/sped up）。look up 查閱；make up 編造；pass up 放棄。", "ref": "英文", "evidence": ""}, {"id": "113-法學-41", "src": "old", "year": 113, "n": 41, "subject": "法學", "topic": "英文", "stem": "The artist spent months refining the intricate details of his latest painting, striving for ____ .", "opts": {"A": "remedy", "B": "summary", "C": "perfection", "D": "recreation"}, "answer": "C", "explain": "句意：藝術家花數月修飾最新畫作的精細細節，力求「完美」。strive for perfection＝追求完美。remedy 補救；summary 摘要；recreation 娛樂。", "ref": "英文", "evidence": ""}, {"id": "113-法學-42", "src": "old", "year": 113, "n": 42, "subject": "法學", "topic": "英文", "stem": "In poor region where people usually die from hunger and diseases, infant ____ is higher than you can imagine.", "opts": {"A": "morality", "B": "mortality", "C": "mortification", "D": "multiplication"}, "answer": "B", "explain": "句意：在人們常死於飢餓與疾病的貧窮地區，嬰兒「死亡率」高得超乎想像。infant mortality＝嬰兒死亡率。morality 道德（易混淆）；mortification 羞辱；multiplication 乘法、增加。", "ref": "英文", "evidence": ""}, {"id": "113-法學-43", "src": "old", "year": 113, "n": 43, "subject": "法學", "topic": "英文", "stem": "The discovery of a potential cure for the disease marked a ____ moment in medical research, offering hope to countless patients worldwide.", "opts": {"A": "total", "B": "pivotal", "C": "conventional", "D": "indefinite"}, "answer": "B", "explain": "句意：發現某疾病的潛在療法，是醫學研究上的「關鍵」時刻，為全球無數病人帶來希望。pivotal＝關鍵的。total 全部的；conventional 傳統的；indefinite 不確定的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-44", "src": "old", "year": 113, "n": 44, "subject": "法學", "topic": "英文", "stem": "Mary’s commitment to her students’ education was evident in her ____ care for her students’ academic and personal growth.", "opts": {"A": "impotent", "B": "reckless", "C": "genuine", "D": "fatal"}, "answer": "C", "explain": "句意：Mary 對學生教育的投入，展現在她對學生學業與個人成長的「真誠」關懷。genuine＝真誠的。impotent 無力的；reckless 魯莽的；fatal 致命的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-45", "src": "old", "year": 113, "n": 45, "subject": "法學", "topic": "英文", "stem": "In order to improve the air quality in the room, it is important to regularly ____ by opening the windows and allowing fresh air to circulate.", "opts": {"A": "ventilate", "B": "penetrate", "C": "perspire", "D": "vocalize"}, "answer": "A", "explain": "句意：為改善室內空氣品質，重要的是定期打開窗戶「通風」，讓新鮮空氣流通。ventilate＝使通風。penetrate 穿透；perspire 流汗；vocalize 發聲。", "ref": "英文", "evidence": ""}, {"id": "113-法學-46", "src": "old", "year": 113, "n": 46, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "as long as", "B": "whatever", "C": "whether", "D": "as recent as"}, "answer": "A", "explain": "句意：融合料理可能已存在數世紀，「只要」人類一直在交流文化面向（就會有）。as long as 表條件或時間長度。whatever、whether 語意不合；as recent as 表「最近至」，不通。", "ref": "英文", "evidence": "", "passage": "What is fusion food? Essentially, this term means bringing together ingredients from different cultures and merging\ntheir recipes. Fusion food has likely been around for centuries, 46 humans have been exchanging facets of their\nculture.\nChinese-American fare is perhaps one of the longest-standing examples of fusion cuisine in the United States. It is\nthought to have 47 in San Francisco in the late 1800’s, as Chinese foods in the US were developed to suit the\nmiddle-class American taste. What many Americans consider to be \" 48 \" would likely never pass the test of\nauthenticity in China.\nTrying out new combinations and seeing what works – and what 49 – is at the heart of 免除其刑", "D": "屬行為不能發生犯罪結果又無危險，不罰"}, "answer": "C", "explain": "甲已著手放火，因己意中止並防止結果發生，依刑法第27條第1項，減輕或免除其刑；第173條第3項亦處罰放火之未遂犯，C正確。A住宅未達燒燬，非既遂；B非因己意而不遂者，始依第25條得減輕；D甲行為足以燒燬住宅，非第26條之不能犯。", "ref": "刑法§27", "evidence": "已著手於犯罪行為之實行，而因己意中止或防止其結果之發生者，減輕或免除其刑。", "src": "new"}, {"id": "N-刑法-007", "subject": "刑事法", "topic": "刑法", "stem": "非公務員甲與某消防局公務員乙，共同實行僅具公務員身分始能成立之瀆職犯罪。依刑法第31條規定，甲應如何論處？", "opts": {"A": "甲不具公務員身分，不成立該罪", "B": "甲僅能論以幫助犯，並應減輕其刑", "C": "甲科以通常之刑，不得減輕其刑", "D": "甲仍以正犯論，但得減輕其刑"}, "answer": "D", "explain": "依刑法第31條第1項，因身分或其他特定關係成立之罪，其共同實行、教唆或幫助者，雖無特定關係，仍以正犯或共犯論，但得減輕其刑，D正確。A忽略本項規定；B甲係共同實行，應論正犯；C「科以通常之刑」係第31條第2項針對因身分致刑有重輕或免除之情形，與本題身分成立之罪不同。", "ref": "刑法§31", "evidence": "因身分或其他特定關係成立之罪，其共同實行、教唆或幫助者，雖無特定關係，仍以正犯或共犯論。但得減輕其刑。", "src": "new"}, {"id": "N-刑法-008", "subject": "刑事法", "topic": "刑法", "stem": "關於刑法犯罪所得之沒收，下列敘述何者正確？", "opts": {"A": "犯罪所得僅限違法行為所得本身，不包括其變得之物及孳息", "B": "第三人因他人違法行為而無償取得犯罪所得者，亦屬沒收之對象", "C": "犯罪所得已實際合法發還被害人者，法院仍應宣告沒收", "D": "犯罪所得全部不能沒收時，即不得再為追徵或其他處置"}, "answer": "B", "explain": "依刑法第38條之1第2項第2款，犯罪行為人以外之自然人、法人或非法人團體，因他人違法行為而無償或以顯不相當之對價取得犯罪所得者，亦沒收之，B正確。A依第4項，犯罪所得包括其變得之物或財產上利益及其孳息；C依第5項，不予宣告沒收或追徵；D依第3項，應追徵其價額。", "ref": "刑法§38-1", "evidence": "因他人違法行為而無償或以顯不相當之對價取得。", "src": "new"}, {"id": "N-刑法-009", "subject": "刑事法", "topic": "刑法", "stem": "依115年3月增訂之刑法第78條之1規定，關於無期徒刑受刑人經撤銷假釋之效果，下列敘述何者正確？", "opts": {"A": "應執行原無期徒刑，如假釋期間有更犯之罪，併執行之", "B": "經撤銷假釋後，一律不得再許假釋", "C": "因假釋期間故意更犯罪，受五年以上有期徒刑之宣告確定者，執行滿十五年後得再許假釋", "D": "依其他法律規定撤銷假釋者，須執行滿二十年後始得再許假釋"}, "answer": "A", "explain": "依刑法第78條之1第1項，無期徒刑受刑人經撤銷假釋者，應執行原無期徒刑，假釋期間有更犯之罪，併執行之，A正確。B依第2項，除更犯之罪經宣告無期徒刑確定者外，有悛悔實據者得再許假釋；C受五年以上有期徒刑宣告確定者，須執行滿二十五年；D依其他法律規定撤銷假釋者為十年。", "ref": "刑法§78-1", "evidence": "無期徒刑受刑人經撤銷假釋者，應執行原無期徒刑。如假釋期間有更犯之罪，併執行之。", "src": "new", "amend": "115-03-13 增訂"}, {"id": "N-刑法-010", "subject": "刑事法", "topic": "刑法", "stem": "甲因殺人罪受無期徒刑之執行後獲假釋，假釋期間故意犯傷害罪，經判處有期徒刑二年確定，其假釋遭撤銷。依刑法第78條之1規定，甲如有悛悔實據，應於執行原無期徒刑滿幾年後，始得由監獄報請法務部再許假釋？", "opts": {"A": "二十五年", "B": "二十年", "C": "十年", "D": "十五年"}, "answer": "D", "explain": "依刑法第78條之1 , "D": "自乙提出告訴之日起，始開始起算"}, "answer": "B", "explain": "依刑法第80條第3項，犯第221條至第227條等罪者，於被害人滿二十歲前，不計入第1項期間，B正確。A忽略本項特別規定；C年齡門檻為二十歲而非十八歲；D依第2項，追訴權期間原則上自犯罪成立之日起算，並非自提出告訴之日起算。", "ref": "刑法§80", "evidence": "之罪者，於被害人滿二十歲前，不計入第一項期間。", "src": "new", "amend": "115-07-22 修正"}, {"id": "N-刑法-015", "subject": "刑事法", "topic": "刑法", "stem": "消防機關公務員廢弛職務釀成災害者，依刑法第130條規定，其法定刑為何？", "opts": {"A": "一年以上七年以下有期徒刑", "B": "五年以下有期徒刑", "C": "七年以上有期徒刑", "D": "三年以上十年以下有期徒刑"}, "answer": "D", "explain": "依刑法第130條，公務員廢弛職務釀成災害者，處三年以上十年以下有期徒刑，D正確。本罪以具公務員身分者為行為主體，須有廢弛職務之行為並因而釀成災害之結果；A、B、C之刑度均與條文不符，本罪亦無拘役或罰金之選科規定。", "ref": "刑法§130", "evidence": "公務員廢弛職務釀成災害者，處三年以上十年以下有期徒刑。", "src": "new"}, {"id": "N-刑法-016", "subject": "刑事法", "topic": "刑法", "stem": "民眾甲不滿消防車停放占道，竟駕駛自用小客車衝撞正依法執行救災職務之消防員乙，惟乙及時閃避未受傷。依刑法第135條規定，甲妨害公務行為之法定刑為何？", "opts": {"A": "六月以上五年以下有期徒刑", "B": "三年以下有期徒刑、拘役或三十萬元以下罰金", "C": "一年以上七年以下有期徒刑", "D": "無期徒刑或七年以上有期徒刑"}, "answer": "A", "explain": "依刑法第135條第3項第1款，犯前二項之罪而以駕駛動力交通工具犯之者，處六月以上五年以下有期徒刑，A正確。B為同條第1項基本犯之刑；C非本條所定刑度；D為第4項因而致公務員於死之刑，本題乙未受傷，無加重結果。", "ref": "刑法§135", "evidence": "犯前二項之罪而有下列情形之一者，處六月以上五年以下有期徒刑", "src": "new"}, {"id": "N-刑法-017", "subject": "刑事法", "topic": "刑法", "stem": "依114年5月修正之刑法第161條脫逃罪，下列敘述何者正確？", "opts": {"A": "損壞拘禁處所械具而脫逃者，處六月以上五年以下有期徒刑", "B": "依法逮捕、拘禁之人單純脫逃之未遂犯，不罰", "C": "聚眾以強暴脅迫脫逃，在場助勢之人處一年以上七年以下有期徒刑", "D": "依法逮捕、拘禁之人脫逃者，處三年以下有期徒刑"}, "answer": "D", "explain": "依刑法第161條第1項，依法逮捕、拘禁之人脫逃者，處三年以下有期徒刑，D正確。A依第2項應處一年以上七年以下有期徒刑；B第4項明定前三項之未遂犯罰之；C依第3項，在場助勢之人處三年以上十年以下有期徒刑，首謀及下手實施強暴脅迫者處五年以上有期徒刑。", "ref": "刑法§161", "evidence": "依法逮捕、拘禁之人脫逃者，處三年以下有期徒刑。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-刑法-018", "subject": "刑事法", "topic": "刑法", "stem": "依114年5月增訂之刑法第161條之1規定，下列何種情形該當本條之構成要件？", "opts": {"A": "甲經法官命限制出境，經合法傳喚無正當理由不到庭，但尚未經發布通緝", "B": "乙經檢察官命具保，經合法傳喚無正當理由不到庭，並經發布通緝", "C": "丙經檢察官命限制住居，因住院開刀有正當理由未到庭，嗣經發布通緝", "D": "丁經法官裁定羈押後，於提解途中趁隙脫離看管而逃逸"}, "answer": "B", "explain": "刑法第161條之1規定，經檢察官或法官命具保、責付、限制住居或限制出境、出海，經合法傳喚無正當理由不到庭，並經發布通緝者，處三年以下有期徒刑，B三要件均具備，B正確。A尚未經發布通緝；C有正當理由不到庭；D丁屬依法拘禁之人脫逃 第1款至第4款之未遂犯罰之，第5款剝奪被害人行動自由七日以上者未列入，A錯誤，為本題答案。B為第1項第1款及其法定刑；C為第1項第2款攜帶兇器犯之；D為第1項第3款對精神、身體障礙或其他心智缺陷之人犯之，均正確。", "ref": "刑法§302-1", "evidence": "第一項第一款至第四款之未遂犯罰之。", "src": "new", "amend": "112-05-31 增訂"}, {"id": "N-刑訴-001", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依現行刑事訴訟法第101條之1（預防性羈押）規定，被告犯下列何罪，經法官訊問後認嫌疑重大，有事實足認有反覆實行同一犯罪之虞而有羈押必要者，得羈押之？", "opts": {"A": "刑法第335條之普通侵占罪", "B": "刑法第185條之3之不能安全駕駛罪", "C": "刑法第309條之公然侮辱罪", "D": "刑法第284條之過失傷害罪"}, "answer": "B", "explain": "115年5月修正之第101條之1第1項第1款，已將刑法第185條之3不能安全駕駛罪列入預防性羈押罪名，B正確。普通侵占罪、公然侮辱罪及過失傷害罪均未列於該條第1項各款，縱有反覆實行之虞，亦不得依本條羈押，A、C、D均錯誤。", "ref": "刑訴§101-1Ⅰ①", "evidence": "第一百八十五條之一之劫持交通工具罪、第一百八十五條之三不能安全駕駛罪", "src": "new", "amend": "115-05-13 修正"}, {"id": "N-刑訴-002", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "甲多次持棍毆打鄰居乙成傷，涉犯刑法第277條第1項傷害罪（告訴乃論之罪），檢察官以甲有反覆實行同一犯罪之虞，聲請依刑事訴訟法第101條之1羈押。下列敘述何者正確？", "opts": {"A": "傷害罪不在預防性羈押罪名之列，法院應逕予駁回", "B": "甲只要犯罪嫌疑重大，縱無羈押必要亦得羈押", "C": "乙未提出告訴者，法院不得依該條羈押甲", "D": "預防性羈押無須經法官訊問，得依書面審查為之"}, "answer": "C", "explain": "第101條之1第1項第2款已列入刑法第277條第1項傷害罪，A錯誤；但同款但書規定，須告訴乃論而未經告訴、告訴已撤回或逾告訴期間者不在此限，故乙未告訴即不得羈押，C正確。本條須「經法官訊問」且「有羈押之必要」，B、D均錯誤。", "ref": "刑訴§101-1Ⅰ②但書", "evidence": "但其須告訴乃論，而未經告訴或其告訴已經撤回或已逾告訴期間者，不在此限。", "src": "new", "amend": "115-05-13 修正"}, {"id": "N-刑訴-003", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "法院許可停止羈押時，依刑事訴訟法第116條之2命被告應遵守之事項，下列敘述何者錯誤？", "opts": {"A": "法院得命被告接受適當之科技設備監控", "B": "法院得命被告交付護照、旅行文件", "C": "被告違背法院所定應遵守之事項者，得逕行拘提", "D": "應遵守事項一經法院裁定，即不得再變更、延長或撤銷"}, "answer": "D", "explain": "依第116條之2第2項，第1項各款應遵守事項「得依聲請或依職權變更、延長或撤銷之」，D謂不得變更，錯誤，為本題答案。接受科技設備監控（第1項第4款）、交付護照旅行文件（第6款）均為法定事項；違背應遵守事項者，依第4項得逕行拘提，A、B、C均正確。", "ref": "刑訴§116-2", "evidence": "前項各款規定，得依聲請或依職權變更、延長或撤銷之。", "src": "new", "amend": "114-11-11 修正"}, {"id": "N-刑訴-004", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察逮捕販毒現行犯甲後，有相當理由認為採取尿液得作為犯罪證據，且有非即時採尿無法有效保全證據之急迫情況，逕以非侵入方式採尿。依刑事訴訟法規定，應於採取後多久內報請檢察官許可？檢察官認為不應准許者，應於多久內撤銷之？", "opts": {"A": "12小時內；3日內", "B": "24小時內；3日內", "C": "24小時內；5日內", "D": "3日內；5日內"}, "answer": "B", "explain": "依第205條之2第3項，急迫情況逕以非侵入方式採尿者，應於採取後24小時內報請檢察官許可，檢察官認為不應准許者，應於3日內撤銷之，B正確。A報請時限過短，C撤銷期限誤為5日（係第131條第3項法院撤銷逕行搜索之期間），D報請時限錯誤。", "ref": "刑訴§205-2Ⅲ", "evidence": "應於採取後二十四小時內報請檢察官許可，檢察官認為不應准許者，應於三日內撤銷之", "src": "new", "amend": "114-11-11 修正"}, {"id": "N-刑訴-005", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於司法警察對經拘提或逮捕到案之犯罪嫌疑人採取身體跡證，下列敘述何者錯誤？", "opts": {"A": "得違反其意思，採取其指紋、掌紋、腳印，予以照相", "B": "報請許可採取尿液時，其許可書應由法官簽名", "C": "有相當理由認為採取毛髮、唾液或吐氣得作為證據時，並得採取之", "D": "依許可採取尿液時，應出示許可書及可證明其身分之文件"}, "answer": "B", "explain": "依第205條之2第2項，採尿係「報請檢察官許可」，第205條之3第2項並規定許可書由檢察官簽名，B誤為法官，錯誤，為本題答案。第205條之2第1項得違反意思採取指紋、掌紋、腳印、照相，有相當理由時並得採取毛髮、唾液、吐氣；第205條之3第3項應出示許可書及身分文件，其餘選項均正確。", "ref": "刑訴§205-2、§205-3", "evidence": "得違反其意思，報請檢察官許可，以非侵入方式採取之", "src": "new", "amend": "114-11-11 修正增訂"}, {"id": "N-刑訴-006", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "受採取人對於司法警察依刑事訴訟法第205條之2第2項後段逕行以非侵入方式採取尿液不服者，其救濟方式為何？", "opts": {"A": "向該管法院聲請撤銷，期間為10日，自採取之日起算", "B": "向該管檢察署檢察長聲明異議，期間為5日", "C": "向該管法院提起抗告，期間為5日，自送達後起算", "D": "向上級法院提起再抗告，期間為20日"}, "answer": "A", "explain": "依第205條之4第1項、第2項，受採取人不服逕行採尿者，得向該管法院聲請撤銷，聲請期間為10日，自採取之日起算，法院不得以已執行終結而無實益為由駁回，A正確。救濟對象為法院而非檢察長，B錯誤；方式為聲請撤銷而非抗告，期間亦非5日，C錯誤；第4項規定對該裁定不得抗告，D錯誤。", "ref": "刑訴§205-4", "evidence": "前項聲請期間為十日，自採取之日起算。法院不得以已執行終結而無實益為由駁回。", "src": "new", "amend": "114-11-11 增訂"}, {"id": "N-刑訴-007", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察官為調查犯罪，於犯罪嫌疑人使用之車輛裝設全球衛星定位系統（GPS）追蹤位置。依刑事訴訟法規定，下列敘述何者正確？", "opts": {"A": "未經法院核發許可書，實施期間不得逾連續48小時或累計逾5日", "B": "未經法院核發許可書，實施期間不得逾連續24小時或累計逾2日", "C": "經法院核發許可書者，每次許可期間不得逾60日", "D": "有繼續實施之必要者，至遲應於期間屆滿之5日前聲請許可書"}, "answer": "B", "explain": "依第153條之1第3項，GPS追蹤實施期間不得逾連續24小時或累計逾2日，實施當日不足24小時以1日計，逾此須向法院聲請許可書，B正確，A錯誤。同條第5項規定法院許可期間每次不得逾30日，繼續實施至遲應於期間屆滿之2日前聲請，C、D均錯誤。", "ref": "刑訴§153-1Ⅲ、Ⅴ", "evidence": "前二項實施期間，不得逾連續二十四小時或累計逾二日，實施當日不足二十四小時，以一日計。", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-008", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依刑事訴訟法第153條之3規定，對具隱私或秘密合理期待之空間內之人或物實施監看及攝錄影像，下列敘述何者正確？", "opts": {"A": "限於調查最重本刑三年以上有期徒刑之罪，始得為之", "B": "得以實體侵入該空間內裝設攝錄器材之方式實施調查", "C": "對第三人管領之空間實施時，以有事實足認與被告等有所關連時為限", "D": "司法警察官得逕向法院聲請許可書，無須報請檢察官許可"}, "answer": "C", "explain": "第153條之3第2項規定，對第三人管領之空間實施，以「有事實足認」與被告、犯罪嫌疑人等有所關連時為限，C正確。同條第1項限於最重本刑「五年」以上之罪，且須從空間外以非實體侵入性科技方法為之，A、B錯誤；第3項規定司法警察官應報請檢察官許可後聲請，D錯誤。", "ref": "刑訴§153-3", "evidence": "以有事實足認與被告、犯罪嫌疑人、證人或應扣押之物或電磁紀錄有所關連時為限", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-009", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於刑事訴訟法第一編第十一章之一「特殊強制處分」之規定，下列敘述何者錯誤？", "opts": {"A": "追蹤位置得使用GPS或其他非以辨識個人生物特徵之科技方法", "B": "調查被告使用之行動通訊設備位置，應向該管法院聲請許可書", "C": "調查手機位置時無可避免取得非受調查人個資，結束後應即刪除", "D": "對軍事上應秘密之處所實施監看攝錄，該管長官得任意拒絕"}, "answer": "D", "explain": "第153條之4第1項雖規定對軍事上應秘密之處所非得該管長官允許不得實施，但第2項明定除有妨害國家重大利益者外不得拒絕，D謂得任意拒絕，錯誤，為本題答案。A見第153條之1第1項；B見第153條之2第3項；C見第153條之2第5項，均正確。", "ref": "刑訴§153-4", "evidence": "前項情形，除有妨害國家重大利益者外，不得拒絕。", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-010", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察有相當理由認為情況急迫，依刑事訴訟法第153條之6逕行調查犯罪嫌疑人使用之行動通訊設備位置者，下列敘述何者正確？", "opts": {"A": "應於實施後24小時內以書面聲請該管檢察官補發許可書", "B": "法院補發許可書者，實施期間自補發之日起算", "C": "法院駁回補發許可書之聲請者，得提起抗告", "D": "應於實施後3日內以書面聲請該管法院補發許可書"}, "answer": "D", "explain": "依第153條之6第1項，急迫逕行實施者，應於實施後3日內依各該條規定以書面聲請「該管法院」補發許可書，D正確，A時限與機關均錯誤。同條第3項規定法院補發者實施期間自「實施之日」起算，B錯誤；第4項規定聲請經法院駁回者不得聲明不服，C錯誤。", "ref": "刑訴§153-6", "evidence": "得逕行實施，並應於實施後三日內依各該條規定以書面聲請該管法院補發許可書", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-011", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依刑事訴訟法第153條之7規定，經法院核發許可書實施之特殊強制處分調查結束後，執行機關逾多久未向法院陳報，法院應於幾日內主動通知受調查人？", "opts": {"A": "逾1個月；14日內", "B": "逾1個月；30日內", "C": "逾2個月；14日內", "D": "逾3個月；10日內"}, "answer": "A", "explain": "第153條之7第2項規定，調查結束或停止實施後，執行機關逾1個月未為陳報者，法院應於14日內主動通知受調查人，A正確，其餘選項期間均不符。另同條第4項規定不通知原因未消滅者，應每3個月向法院陳報，亦為常見混淆數字。", "ref": "刑訴§153-7Ⅱ", "evidence": "調查結束或停止實施後，執行機關逾一個月未為前項之陳報者，法院應於十四日內主動通知受調查人。", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-012", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "警方依法院許可書對甲實施GPS追蹤以偵辦毒品案，意外取得乙涉犯另一詐欺案之資料。依刑事訴訟法規定，該另案資料得否作為證據？", "opts": {"A": "一律不得作為證據，並應於調查結束後即時銷燬或刪除之", "B": "經該管檢察官核准後，即得於另案作為證據使用", "C": "於實施期間屆滿後7日內補行陳報檢察官並經核准者，得為證據", "D": "於實施期間屆滿後30日內補行陳報法院並經審查認可者，得為證據"}, "answer": "D", "explain": "依第153條之8第2項，調查所得其他案件資料原則不得作為證據，但於實施期間屆滿後30日內補行陳報法院，經法院審查認可該案件與本案具關連性或為最重本刑五年以上之罪者，不在此限，D正確。A忽略但書；B、C審查機關應為法院而非檢察官，且期間不符，均錯誤。", "ref": "刑訴§153-8Ⅱ", "evidence": "但於實施期間屆滿後三十日內補行陳報法院，並經法院審查認可該案件與本案具有關連性或為最重本刑五年以上之罪者，不在此限。", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-013", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於刑事訴訟法特殊強制處分之救濟，下列敘述何者正確？", "opts": {"A": "受調查人對法官依本章所為之裁定，得於10日內提起抗告，自送達後起算", "B": "檢察官聲請核發GPS追蹤許可書經法院駁回者，得提起抗告", "C": "受調查人提起抗告，法院得以已執行終結而無實益為由駁回", "D": "法院就受調查人聲請撤銷檢察官處分所為之裁定，得再抗告"}, "answer": "A", "explain": "第153條之10第1項、第2項規定，受調查人對法官、檢察官依本章所為之裁定或處分，得抗告或聲請撤銷變更，期間10日自送達後起算，A正確；法院不得以已執行終結無實益為由駁回，C錯誤；第4項規定對該裁定不得聲明不服，D錯誤。第153條之5第3項規定許可書聲請經駁回者不得聲明不服，B錯誤。", "ref": "刑訴§153-10、§153-5Ⅲ", "evidence": "前項提起抗告或聲請期間為十日，自送達後起算。法院不得以已執行終結而無實益為由駁回。", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-014", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察詢問犯罪嫌疑人甲時，以甲之辯護人有勾串共犯之虞為由，禁止其在場，致甲無其他辯護人陪同。依刑事訴訟法規定，下列敘述何者錯誤？", "opts": {"A": "禁止辯護人在場之事由，應記明於筆錄", "B": "應再行告知甲得保持緘默及得選任辯護人", "C": "甲非因過失遲誤聲請撤銷之期間者，不得聲請回復原狀", "D": "甲或其辯護人不服者，得於10日內向該管法院聲請撤銷或變更"}, "answer": "C", "explain": "第70條之1規定，第67條至第69條回復原狀之規定，於遲誤聲請撤銷或變更司法警察官或司法警察處分之期間者準用之，C錯誤，為本題答案。第245條第3項規定禁止事由應記明筆錄；第4項規定應再行告知第95條第1項第2、3款事項；第245條之1規定得於10日內向法院聲請撤銷或變更，其餘選項均正確。", "ref": "刑訴§70-1、§245、§245-1", "evidence": "第六十七條至第六十九條之規定，於遲誤聲請撤銷或變更檢察事務官、司法警察官或司法警察處分之期間者，準用之。", "src": "new", "amend": "113-07-31 增訂（§70-1、§245-1）"}, {"id": "N-刑訴-015", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依112年12月修正之刑事訴訟法鑑定制度，下列敘述何者正確？", "opts": {"A": "被告於偵查中無權請求鑑定，僅得於審判中聲請法院為之", "B": "被告、辯護人於偵查中得請求檢察官選任具專業能力之人為鑑定", "C": "檢察官於偵查中選任鑑定人前，應予被告及其辯護人陳述意見之機會", "D": "審判長於審判中選任鑑定人前，僅檢察官得陳述意見"}, "answer": "B", "explain": "第198條之1第1項規定，被告、辯護人及得為被告輔佐人之人於偵查中得請求鑑定，並得請求檢察官選任具專業能力之人為鑑定，B正確，A錯誤。第198條之2第1項係規定檢察官「得」予陳述意見之機會，非「應」，C錯誤；同條第2項當事人、代理人、辯護人或輔佐人均得陳述意見，D錯誤。", "ref": "刑訴§198-1、§198-2", "evidence": "被告、辯護人及得為被告輔佐人之人於偵查中得請求鑑定，並得請求檢察官選任前條第一項之人為鑑定。", "src": "new", "amend": "112-12-15 增訂"}, {"id": "N-刑訴-016", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於刑事訴訟法鑑定報告之規定，下列敘述何者錯誤？", "opts": {"A": "以書面報告者，縱經當事人明示同意，仍須實施鑑定之人到庭說明始得為證據", "B": "鑑定人有數人而意見不同者，應使其各別報告", "C": "鑑定報告應包括鑑定係以可靠之原理及方法作成", "D": "以書面報告者，於審判中原則上應使實施鑑定之人到庭以言詞說明"}, "answer": "A", "explain": "第206條第4項規定，以書面報告者，審判中應使實施鑑定之人到庭以言詞說明，但經當事人明示同意書面報告得為證據者不在此限，A謂縱經同意仍須到庭，錯誤，為本題答案。B見同條第2項但書；C見第3項第3款；D見第4項本文，均正確。", "ref": "刑訴§206", "evidence": "以書面報告者，於審判中應使實施鑑定之人到庭以言詞說明。但經當事人明示同意書面報告得為證據者，不在此限。", "src": "new", "amend": "112-12-15 修正"}, {"id": "N-刑訴-017", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "法院或檢察官囑託醫院、學校或其他相當之機關、機構為鑑定所提出之書面報告，依刑事訴訟法第208條規定，下列何種情形得為證據？", "opts": {"A": "未經認證之民間機構所為，且當事人明示不同意", "B": "被告親友自行委託醫院所出具之鑑定意見", "C": "經主管機關認證之機構或團體所實施之鑑定", "D": "告訴人自行委請民間機構所出具之意見"}, "answer": "C", "explain": "第208條第3項規定，囑託鑑定之書面報告於當事人明示同意、依法令具執掌鑑定鑑識檢驗業務之機關所為、或經主管機關認證之機構或團體所為者得為證據，C正確。未經認證之民間機構且當事人明示不同意，不符任一款，A錯誤；B、D均非法院或檢察官囑託，被告親友及告訴人亦非得依第5項委任鑑定之當事人，均錯誤。", "ref": "刑訴§208Ⅲ", "evidence": "經主管機關認證之機構或團體所實施之鑑定", "src": "new", "amend": "112-12-15 修正"}, {"id": "N-刑訴-018", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察逮捕犯罪嫌疑人後，依刑事訴訟法第93條之1規定，下列經過時間不計入24小時之法定障礙事由，何者敘述正確？", "opts": {"A": "經檢察官命具保之被告在候保中，候保時間不得逾4小時", "B": "因表示選任辯護人而等候其到場，等候時間不得逾6小時", "C": "須由通譯傳譯而等候通譯到場，等候時間不得逾4小時", "D": "犯罪嫌疑人經法院提審之期間，仍應計入24小時"}, "answer": "A", "explain": "第93條之1第1項第7款規定，經檢察官命具保或責付之被告在候保或候責付中，但時間不得逾4小時，A正確。第5款等候辯護人不得逾「4小時」，B錯誤；第6款等候通譯不得逾「6小時」，C錯誤；第8款經法院提審之期間不予計入，D錯誤。", "ref": "刑訴§93-1Ⅰ", "evidence": "經檢察官命具保或責付之被告，在候保或候責付中。但候保或候責付時間不得逾四小時。", "src": "new", "amend": "112-12-15 修正"}, {"id": "N-刑訴-019", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "犯罪嫌疑人甲具原住民身分，於司法警察詢問時未選任辯護人，亦未主動請求立即詢問。依刑事訴訟法規定，下列敘述何者正確？", "opts": {"A": "偵查中無強制辯護之規定，司法警察得逕行詢問", "B": "應等候律師到場，無論等候多久均不得逕行詢問", "C": "應通知依法設立之法律扶助機構指派律師到場為其辯護", "D": "應報請檢察官指定公設辯護人到場為其辯護"}, "answer": "C", "explain": "第31條第5項規定，被告或犯罪嫌疑人具原住民身分，於偵查中未經選任辯護人，司法警察應通知依法設立之法律扶助機構指派律師到場為其辯護，C正確，A、D錯誤。同項但書規定，主動請求立即詢問或等候律師逾4小時未到場者，得逕行詢問，B謂無論多久均不得詢問，錯誤。", "ref": "刑訴§31Ⅴ", "evidence": "檢察官、司法警察官或司法警察應通知依法設立之法律扶助機構指派律師到場為其辯護", "src": "new", "amend": "112-12-15 修正"}, {"id": "N-刑訴-020", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列何者屬於刑事訴訟法第88條第3項所定「以現行犯論」之準現行犯？", "opts": {"A": "犯罪在實施中或實施後即時發覺者", "B": "於身體、衣服等處露有犯罪痕跡，顯可疑為犯罪人者", "C": "犯罪後數日經監視器影像比對查獲者", "D": "經被害人事後於警局指認為犯罪人者"}, "answer": "B", "explain": "第88條第3項規定以現行犯論者為：被追呼為犯罪人者；因持有兇器、贓物或其他物件，或於身體、衣服等處露有犯罪痕跡，顯可疑為犯罪人者，B正確。A為同條第2項之現行犯本身，非準現行犯；C、D均非犯罪實施中或實施後即時發覺，亦不符準現行犯要件，不得逕行逮捕。", "ref": "刑訴§88Ⅲ", "evidence": "因持有兇器、贓物或其他物件，或於身體、衣服等處露有犯罪痕跡，顯可疑為犯罪人者", "src": "new"}, {"id": "N-刑訴-021", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察偵查犯罪，於情況急迫時，下列何種情形得依刑事訴訟法第88條之1逕行拘提犯罪嫌疑人？", "opts": {"A": "經盤查而逃逸，惟所犯顯係最重本刑一年以下有期徒刑之罪者", "B": "經合法通知，無正當理由不到場者", "C": "犯罪嫌疑人無一定之住、居所者", "D": "因現行犯之供述，且有事實足認為共犯嫌疑重大者"}, "answer": "D", "explain": "第88條之1第1項第1款規定，因現行犯之供述，且有事實足認為共犯嫌疑重大者，情況急迫得逕行拘提，D正確。第3款但書排除最重本刑一年以下之罪，A錯誤；經合法通知不到場者依第71條之1應報請檢察官核發拘票，B錯誤；無一定住居所屬第76條逕行拘提事由，非本條，C錯誤。", "ref": "刑訴§88-1Ⅰ①", "evidence": "因現行犯之供述，且有事實足認為共犯嫌疑重大者", "src": "new"}, {"id": "N-刑訴-022", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於偵查中羈押被告之期間，依刑事訴訟法規定，下列敘述何者正確？", "opts": {"A": "偵查中羈押被告不得逾3月", "B": "偵查中延長羈押期間不得逾2月，以延長一次為限", "C": "檢察官至遲應於期間屆滿之3日前聲請延長羈押", "D": "羈押期間自被告經逮捕之時起算"}, "answer": "B", "explain": "第108條第5項規定，延長羈押期間偵查中不得逾2月，以延長一次為限，B正確。同條第1項規定偵查中不得逾2月（審判中始為3月），A錯誤；檢察官至遲應於期間屆滿之5日前聲請，C錯誤；第4項規定羈押期間自簽發押票之日起算，逮捕拘提期間另以一日折算一日，D錯誤。", "ref": "刑訴§108", "evidence": "延長羈押期間，偵查中不得逾二月，以延長一次為限。", "src": "new"}, {"id": "N-刑訴-023", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "偵查中檢察官限制被告出境、出海，依刑事訴訟法規定，下列敘述何者正確？", "opts": {"A": "檢察官逕行限制出境、出海，不得逾6月", "B": "有繼續限制必要者，至遲應於期間屆滿之10日前聲請法院裁定", "C": "聲請延長者，第一次不得逾4月，第二次不得逾2月，以延長二次為限", "D": "被告逃匿而通緝之期間，仍應計入限制出境、出海期間"}, "answer": "C", "explain": "第93條之3第2項規定，偵查中檢察官聲請延長限制出境、出海，第一次不得逾4月，第二次不得逾2月，以延長二次為限，C正確。同條第1項規定檢察官限制不得逾8月，且至遲應於期間屆滿之20日前聲請，A、B錯誤；第3項規定逃匿通緝期間不予計入，D錯誤。", "ref": "刑訴§93-3", "evidence": "偵查中檢察官聲請延長限制出境、出海，第一次不得逾四月，第二次不得逾二月，以延長二次為限。", "src": "new"}, {"id": "N-刑訴-024", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察依法逮捕現行犯甲時，未持有搜索票。依刑事訴訟法第130條規定，下列敘述何者正確？", "opts": {"A": "得逕行搜索甲住處之全部房間及處所，以發現其他犯罪證據", "B": "附帶搜索須經甲出於自願性同意，並將同意意旨記載於筆錄", "C": "附帶搜索應於事前以書面報請檢察官許可後，始得為之", "D": "得逕行搜索其身體、隨身物件、所用交通工具及立即可觸及之處所"}, "answer": "D", "explain": "第130條規定，司法警察逮捕被告、犯罪嫌疑人時，雖無搜索票，得逕行搜索其身體、隨身攜帶之物件、所使用之交通工具及其立即可觸及之處所，D正確。附帶搜索範圍限於立即可觸及處所，A逾越範圍；附帶搜索無須受搜索人同意（同意搜索係第131條之1），亦無須事前報請許可，B、C錯誤。", "ref": "刑訴§130", "evidence": "得逕行搜索其身體、隨身攜帶之物件、所使用之交通工具及其立即可觸及之處所", "src": "new"}, {"id": "N-刑訴-025", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察官逮捕現行犯後，依刑事訴訟法第92條規定，下列何種情形得經檢察官之許可，不予解送？", "opts": {"A": "所犯為最重本刑三年以下有期徒刑之罪者", "B": "所犯為告訴乃論之罪，其告訴已經撤回者", "C": "現行犯於詢問時已坦承全部犯行者", "D": "現行犯係由一般民眾逮捕後送交者"}, "answer": "B", "explain": "第92條第2項規定，司法警察官逮捕或接受現行犯應即解送檢察官，但所犯最重本刑為一年以下有期徒刑、拘役或專科罰金之罪，或告訴乃論之罪其告訴已撤回或已逾告訴期間者，得經檢察官許可不予解送，B正確。A刑度門檻誤為三年；坦承犯行或由民眾逮捕送交均非法定事由，C、D錯誤。", "ref": "刑訴§92Ⅱ", "evidence": "告訴或請求乃論之罪，其告訴或請求已經撤回或已逾告訴期間者，得經檢察官之許可，不予解送", "src": "new"}, {"id": "N-刑訴-026", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "某消防分隊小隊長於火災現場勘查時，發現跡證顯示有人故意縱火燒燬住宅。依刑事訴訟法規定，下列敘述何者正確？", "opts": {"A": "其因執行職務知有犯罪嫌疑，應為告發", "B": "其非犯罪被害人，得視個人意願決定是否告發", "C": "放火罪須由屋主提出告訴，消防人員無從告發", "D": "應俟法院判決確定後，始得向檢察官告發"}, "answer": "A", "explain": "第241條規定，公務員因執行職務知有犯罪嫌疑者，應為告發。消防人員為公務員，於火災現場勘查係執行職務，知有放火犯罪嫌疑即負告發義務，A正確，B錯誤。放火燒燬住宅罪非告訴乃論，任何人均得告發，C錯誤；告發係促使偵查開始，無須待判決確定，D錯誤。", "ref": "刑訴§241", "evidence": "公務員因執行職務知有犯罪嫌疑者，應為告發。", "src": "new"}, {"id": "N-刑訴-027", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "消防機關救護人員執行勤務時依規定製作之救護紀錄表，於刑事審判中作為證據，依刑事訴訟法傳聞例外規定，下列敘述何者正確？", "opts": {"A": "除顯有不可信之情況外，公務員職務上製作之紀錄文書得為證據", "B": "屬被告以外之人於審判外之書面陳述，一律無證據能力", "C": "須經製作之救護人員到庭具結後，始得為證據", "D": "須經被告於審判程序中明示同意，始得為證據"}, "answer": "A", "explain": "第159條之4第1款規定，除顯有不可信之情況外，公務員職務上製作之紀錄文書、證明文書亦得為證據，消防救護人員依規定製作之救護紀錄表屬之，A正確。本條為傳聞法則之例外，並非一律無證據能力，B錯誤；本款不以製作人到庭具結或當事人同意（第159條之5）為要件，C、D錯誤。", "ref": "刑訴§159-4①", "evidence": "除顯有不可信之情況外，公務員職務上製作之紀錄文書、證明文書。", "src": "new"}, {"id": "N-刑訴-028", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於被告以外之人於審判外陳述之證據能力，依刑事訴訟法規定，下列敘述何者錯誤？", "opts": {"A": "被告以外之人於審判外向法官所為之陳述，得為證據", "B": "於偵查中向檢察官所為之陳述，除顯有不可信之情況者外，得為證據", "C": "警詢陳述與審判中不符，先前陳述具較可信之特別情況且有必要者，得為證據", "D": "到庭後無正當理由拒絕陳述者，其於警詢之陳述一律不得為證據"}, "answer": "D", "explain": "第159條之3第4款規定，被告以外之人到庭後無正當理由拒絕陳述者，其於司法警察調查中之陳述，經證明具有可信之特別情況且為證明犯罪事實存否所必要者，得為證據，D謂一律不得為證據，錯誤，為本題答案。A、B見第159條之1第1、2項；C見第159條之2，均正確。", "ref": "刑訴§159-1～§159-3", "evidence": "其於檢察事務官、司法警察官或司法警察調查中所為之陳述，經證明具有可信之特別情況，且為證明犯罪事實之存否所必要者，得為證據", "src": "new"}, {"id": "N-刑訴-029", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "甲酒後駕車撞死路人乙，經檢察官提起公訴。依刑事訴訟法被害人訴訟參與之規定，下列敘述何者正確？", "opts": {"A": "訴訟參與限於第一審言詞辯論終結前聲請，第二審即不得再聲請", "B": "乙既已死亡，其配偶或直系血親均無從聲請參與本案訴訟", "C": "乙之配偶得於起訴後第二審言詞辯論終結前，向法院聲請參與訴訟", "D": "法院駁回訴訟參與聲請之裁定，聲請人得於法定期間內提起抗告"}, "answer": "C", "explain": "第455條之38第1項第1款，因過失犯罪致人於死之被害人得於提起公訴後第二審言詞辯論終結前向法院聲請參與訴訟；第2項規定被害人死亡者得由其配偶等為之，C正確，A、B錯誤。第455條之40第4項規定准駁訴訟參與之裁定不得抗告，D錯誤。", "ref": "刑訴§455-38、§455-40", "evidence": "得於檢察官提起公訴後第二審言詞辯論終結前，向該管法院聲請參與本案訴訟", "src": "new"}, {"id": "N-刑訴-030", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於刑事訴訟法之簡易程序，下列敘述何者正確？", "opts": {"A": "所科之刑以宣告緩刑、得易科罰金或得易服社會勞動之有期徒刑及拘役或罰金為限", "B": "檢察官依通常程序起訴之案件，法院一律不得改以簡易判決處刑", "C": "法院以簡易判決處刑前，無論有無必要，均應先行訊問被告", "D": "對簡易判決不服者，應自判決送達之日起10日內向管轄法院提起上訴"}, "answer": "A", "explain": "第449條第3項規定簡易判決所科之刑以宣告緩刑、得易科罰金或得易服社會勞動之有期徒刑及拘役或罰金為限，A正確。同條第2項規定通常程序起訴經被告自白者得改以簡易判決，B錯誤；第1項但書僅「有必要時」應訊問被告，C錯誤；第454條第1項第5款上訴期間為20日，D錯誤。", "ref": "刑訴§449、§454", "evidence": "依前二項規定所科之刑以宣告緩刑、得易科罰金或得易服社會勞動之有期徒刑及拘役或罰金為限。", "src": "new"}, {"id": "N-義消-001", "subject": "刑事法", "topic": "消防法", "stem": "依義勇消防組織編組訓練演習服勤辦法規定，關於新進義勇消防人員應具備之資格，下列敘述何者正確？", "opts": {"A": "須年滿二十歲之中華民國國民，外國人一律不得擔任義勇消防人員", "B": "中華民國國民於五年內未曾受有期徒刑以上刑之宣告確定即為合格", "C": "須年滿十八歲，且居住當地並未參加其他義勇或民防組織", "D": "擔任顧問者仍須受居住當地之限制，並無例外規定之適用"}, "answer": "C", "explain": "依義消辦法§4Ⅰ，新進人員須年滿十八歲之中華民國國民或依法領有居留許可之外國人、大陸地區人民、香港或澳門居民（A 錯，年齡為十八歲且外國人可擔任）；須居住當地且未參加其他義勇或民防組織（C 正確）；受刑宣告之清白期間為「十年內」而非五年（B 錯）；同條第二項明定擔任顧問者不受居住當地之限制（D 錯）。", "ref": "義消辦法§4Ⅰ、§4Ⅱ", "evidence": "二、居住當地且未參加其他義勇或民防組織。", "tag": "子法", "src": "new", "amend": "114-08-05 修正"}, {"id": "N-義消-002", "subject": "刑事法", "topic": "消防法", "stem": "某甲為依法領有居留許可之外國人，經遴聘擔任義勇消防分隊隊員。依義勇消防組織編組訓練演習服勤辦法規定，下列敘述何者錯誤？", "opts": {"A": "其須年滿十八歲，且居住當地並未參加其他義勇或民防組織", "B": "其在臺期間須未曾受有期徒刑以上刑之宣告確定，始具備資格", "C": "其聘期以在臺合法居留為限，居留原因消失者應予解聘", "D": "其應優先納入支援軍事勤務之人力動員編組，以充實動員能量"}, "answer": "D", "explain": "依義消辦法§4Ⅳ，外國人、大陸地區人民、香港或澳門居民之新進人員，「不納入」支援軍事勤務之人力動員編組，D 之敘述與條文相反。A、B 為§4Ⅰ第一款至第三款之資格要件；C 為§7Ⅰ但書（聘期以在臺合法居留為限）及§8第一款（居留原因消失應予解聘）之規定，均屬正確。", "ref": "義消辦法§4Ⅳ、§7Ⅰ、§8①", "evidence": "外國人、大陸地區人民、香港或澳門居民之新進人員，不納入支援軍事勤務之人力動員編組。", "tag": "子法", "src": "new", "amend": "114-08-05 修正"}, {"id": "N-義消-003", "subject": "刑事法", "topic": "消防法", "stem": "依義勇消防組織編組訓練演習服勤辦法規定，義勇消防人員（總隊長、副總隊長及顧問除外）之年齡上限，下列何者正確？", "opts": {"A": "總隊之人員為六十八歲以下，大隊之人員為七十歲以下", "B": "中隊之人員為六十歲以下，分隊之人員為六十五歲以下", "C": "專責協助防災教育宣導之人員為六十八歲以下", "D": "各級人員一律為六十五歲以下，不因所屬層級而有差異"}, "answer": "C", "explain": "依義消辦法§6，年齡上限為：總隊七十歲、大隊六十八歲、中隊六十五歲、分隊六十歲，另專責協助防災教育宣導之人員為六十八歲以下（C 正確）。A 將總隊與大隊之歲數顛倒；B 將中隊與分隊之歲數顛倒；D 誤認各級一律相同。年齡逾本條各款規定者，依§8第五款應予解聘。", "ref": "義消辦法§6", "evidence": "五、專責協助防災教育宣導之人員為六十八歲以下。", "tag": "子法", "src": "new", "amend": "114-08-05 修正"}, {"id": "N-義消-004", "subject": "刑事法", "topic": "消防法", "stem": "依義勇消防組織編組訓練演習服勤辦法規定，關於經聘任義勇消防人員之聘期，下列敘述何者正確？", "opts": {"A": "聘期為二年，成績優良者得予續聘，並以三次為限", "B": "聘期為三年，成績優良者得予續聘，並以二次為限", "C": "聘期為三年，成績優良者得不限次數繼續續聘之", "D": "顧問及分隊之隊員，其聘期亦一律為三年並得續聘"}, "answer": "B", "explain": "依義消辦法§7Ⅰ，經聘任之義勇消防人員（顧問、分隊之幹事、助理幹事、小隊長、副小隊長及隊員除外），聘期為三年，成績優良者得予續聘，並以二次為限，故 B 正確、A 之年數與次數均錯、C 誤為不限次數。D 錯在顧問與分隊隊員等人員本即排除於三年聘期規定之外。", "ref": "義消辦法§7Ⅰ", "evidence": "其聘期為三年，成績優良者得予續聘，並以二次為限。", "tag": "子法", "src": "new"}, {"id": "N-義消-005", "subject": "刑事法", "topic": "消防法", "stem": "義勇消防分隊長某乙於聘期中因故出缺，由某丙繼任，繼任後實際任職期間為二年六個月。依義勇消防組織編組訓練演習服勤辦法規定，下列敘述何者正確？", "opts": {"A": "某丙之聘期應自繼任之日起重新起算三年，不受原聘期限制", "B": "某丙以補足原聘期為限，且因聘期逾二年，以聘任一次計之", "C": "某丙以補足原聘期為限，該段期間一概不計入聘任之次數", "D": "某丙須重新經審議小組評審，並將聘期起算為二年後續聘"}, "answer": "B", "explain": "依義消辦法§7Ⅱ，義勇消防人員於聘期中因故出缺，繼任人員以補足其聘期為限；繼任人員聘期逾二年者，以聘任一次計之。某丙繼任後任職二年六個月已逾二年，故應計為聘任一次（B 正確）。A 誤認重新起算三年；C 忽略逾二年即計一次之規定；D 之重新起算二年並無條文依據。", "ref": "義消辦法§7Ⅱ", "evidence": "繼任人員聘期逾二年者，以聘任一次計之。", "tag": "子法", "src": "new"}, {"id": "N-義消-006", "subject": "刑事法", "topic": "消防法", "stem": "依義勇消防組織編組訓練演習服勤辦法規定，關於新進義勇消防人員基本訓練之敘述，下列何者正確？", "opts": {"A": "由內政部消防署辦理，集中新進人員施以二十四小時以上訓練", "B": "由消防局辦理，集中新進人員施以四十八小時以上之訓練", "C": "由消防局辦理，於專業訓練結束後施以二十四小時以上訓練", "D": "新進人員具退休消防人員身分者，仍不得免參加基本訓練"}, "answer": "B", "explain": "依義消辦法§10Ⅰ，基本訓練由消防局辦理，集中新進人員施以四十八小時以上之訓練（B 正確），故 A 之辦理機關與時數均錯。依§11，專業訓練係於「基本訓練結束後」辦理，C 之先後順序顛倒。依§10Ⅱ，新進人員具退休消防人員身分者得免參加基本訓練，D 錯誤。", "ref": "義消辦法§10", "evidence": "基本訓練由消防局辦理，集中新進人員施以四十八小時以上之訓練。", "tag": "子法", "src": "new"}, {"id": "N-義消-007", "subject": "刑事法", "topic": "消防法", "stem": "依義勇消防組織編組訓練演習服勤辦法規定，下列關於義勇消防人員專業訓練及常年訓練之敘述，何者錯誤？", "opts": {"A": "專業訓練由消防局於基本訓練結束後，施以二十四小時以上訓練", "B": "專業訓練依編組勤務特性分別辦理，而非全體人員一體施訓", "C": "常年訓練以分隊、中隊或大隊為單位集中訓練，由消防局辦理", "D": "常年訓練由內政部消防署辦理，全年訓練時數應達四十八小時"}, "answer": "D", "explain": "依義消辦法§13，常年訓練由「消防局」辦理，以分隊、中隊或大隊為單位集中訓練，全年訓練時數應達「二十四小時」以上，D 之辦理機關與時數均與條文不符。A、B 為§11 專業訓練之規定（基本訓練結束後、依編組勤務特性、二十四小時以上）；C 亦與§13 相符。", "ref": "義消辦法§11、§13", "evidence": "常年訓練由消防局辦理，以分隊、中隊或大隊為單位，集中訓練，全年訓練時數應達二十四小時以上。", "tag": "子法", "src": "new"}, {"id": "N-義消-008", "subject": "刑事法", "topic": "消防法", "stem": "依義勇消防組織編組訓練演習服勤辦法規定，義勇消防人員幹部訓練各講習班之訓練時數，下列何者正確？", "opts": {"A": "高級幹部講習班十二小時以上、基礎幹部講習班二十四小時以上", "B": "高級幹部講習班二十四小時以上、基礎幹部講習班十二小時以上", "C": "中級幹部講習班二十小時以上、初級幹部講習班十六小時以上", "D": "四種幹部講習班之訓練時數，一律規定為二十小時以上"}, "answer": "A", "explain": "依義消辦法§12，幹部訓練時數為：高級幹部講習班十二小時以上、中級十六小時以上、初級二十小時以上、基礎二十四小時以上，呈現「層級越高、時數越少」之遞減特徵，故 A 正確。B 將高級與基礎顛倒；C 將中級與初級之時數顛倒；D 誤認四班時數相同。", "ref": "義消辦法§12", "evidence": "四、基礎幹部講習班：由消防局辦理，就曾任或現任義勇消防隊員（含顧問職）滿一年以上之人員，施予二十四小時以上之講習訓練。", "tag": "子法", "src": "new"}, {"id": "N-義消-009", "subject": "刑事法", "topic": "消防法", "stem": "依義勇消防組織編組訓練演習服勤辦法規定，關於幹部訓練之辦理機關與受訓資格，下列敘述何者正確？", "opts": {"A": "高級幹部講習班由內政部消防署辦理，對象為曾任或現任中隊長以上職務合計滿三年以上者", "B": "中級幹部講習班由內政部消防署辦理，對象為曾任或現任分隊長以上職務合計滿一年以上者", "C": "初級幹部講習班由內政部消防署辦理，對象為曾任或現任分隊長以上職務合計滿二年以上者", "D": "基礎幹部講習班由內政部消防署辦理，對象為曾任或現任小隊長以上職務合計滿三年以上者"}, "answer": "A", "explain": "依義消辦法§12，僅高級幹部講習班由內政部消防署（本署）辦理，對象為曾任或現任義勇消防中隊長以上職務（含顧問職）合計滿三年以上者（A 正確）；中級、初級、基礎三班均由消防局辦理，B、C、D 之辦理機關均錯。中級對象為分隊長以上滿二年、初級為小隊長以上滿一年、基礎為隊員滿一年。", "ref": "義消辦法§12①", "evidence": "一、高級幹部講習班：由本署辦理，就曾任或現任義勇消防中隊長以上職務（含顧問職）合計滿三年以上之人員，施予十二小時以上之講習訓練。", "tag": "子法", "src": "new"}, {"id": "N-義消-010", "subject": "刑事法", "topic": "消防法", "stem": "義勇消防隊員某丁於一年內無故未參加消防局所辦理之常年訓練及勤務演練，合計達三次。依義勇消防組織編組訓練演習服勤辦法規定，聘任機關應如何處理？", "opts": {"A": "應由聘任機關予以解聘，不待聘期屆滿", "B": "應予停止服勤一年，期滿後始得再行續聘", "C": "僅得記錄其勤惰優劣，不得據此予以解聘", "D": "應先報請內政部核准後，始得予以解聘之"}, "answer": "A", "explain": "依義消辦法§8第六款，義勇消防人員無故不參加§10 至§14 規定之訓練、§16 規定之演練（習）或§18 規定之服勤，一年內達三次以上者，由聘任機關予以解聘，故 A 正確。條文並無停止服勤一年之處分（B 錯）；解聘為法定應為事項而非僅供考核（C 錯）；解聘由聘任機關逕為，無須報請內政部核准（D 錯）。", "ref": "義消辦法§8⑥", "evidence": "無故不參加第十條至第十四條規定之訓練、第十六條規定之演練（習）或第十八條規定之服勤，一年內達三次以上。", "tag": "子法", "src": "new"}, {"id": "N-義消-011", "subject": "刑事法", "topic": "消防法", "stem": "依義勇消防組織編組訓練演習服勤辦法規定，義勇消防組織應配置供義勇消防人員使用之協勤裝備，不包括下列何者？", "opts": {"A": "消防衣、消防帽、消防鞋及雨衣等個人穿著裝備", "B": "空氣呼吸器或其他必要之個人防護裝備器材", "C": "拆卸器材及其他協助消防所必要之各類裝備", "D": "火災原因調查鑑定所需之採證與鑑識器材"}, "answer": "D", "explain": "依義消辦法§20，義勇消防組織應配置之協勤裝備為：消防衣、帽、鞋、雨衣；空氣呼吸器或防護裝備；拆卸器材；其他協助消防必要之裝備，故 A、B、C 均屬條文所列。火災原因調查鑑定屬消防機關依消防法之職權事項，並非義勇消防人員之協勤裝備，D 為應選答案。", "ref": "義消辦法§20", "evidence": "義勇消防組織應配置下列協勤裝備，供義勇消防人員使用", "tag": "子法", "src": "new"}, {"id": "N-義消-012", "subject": "刑事法", "topic": "消防法", "stem": "依義勇消防組織編組訓練演習服勤辦法規定，下列敘述何者錯誤？", "opts": {"A": "內政部消防署每三年至少應對義勇消防總隊實施考評、點閱各一次", "B": "義勇消防組織之旗幟及人員之服務證，統一由消防局製發之", "C": "義勇消防組織於業務必要時，得以其名義獨立對外行文", "D": "港務消防大隊得比照消防局編組義勇消防組織，協助消防工作"}, "answer": "C", "explain": "依義消辦法§22，義勇消防組織「不得」獨立對外行文，C 與條文相反。A 為§24 之規定（本署每三年至少考評、點閱各一次）；B 為§21Ⅰ（旗幟及服務證由消防局統一製發，式樣由本署定之）；D 為§26（港務消防大隊得比照辦理編組、訓練、演習及服勤），均屬正確。", "ref": "義消辦法§21、§22、§24、§26", "evidence": "義勇消防組織不得獨立對外行文。", "tag": "子法", "src": "new"}, {"id": "N-救護-001", "subject": "刑事法", "topic": "消防法", "stem": "依緊急救護辦法規定，關於救護車輛及裝載物品之消毒或去污處理，下列敘述何者正確？", "opts": {"A": "定期消毒為每週一次，並應將情形記入消毒實施表", "B": "定期消毒為每月一次，使用後之消毒則為每次使用後", "C": "定期消毒為每季一次，去污處理則為每月實施一次", "D": "僅運送法定傳染病患後實施消毒，平時免予定期消毒"}, "answer": "B", "explain": "依緊急救護辦法§13Ⅰ，消毒或去污處理分三種：定期消毒為每月一次；使用後之消毒為每次使用後；去污處理為每次運送受化學、輻射物質污染之傷病患後，故 B 正確、A 與 C 之週期均錯。定期消毒為常態義務，D 錯誤；另依同條第二項，實施定期消毒應將情形記入消毒實施表。", "ref": "緊急救護辦法§13", "evidence": "一、定期消毒：每月一次。\n　　二、使用後之消毒：每次使用後。", "tag": "子法", "src": "new"}, {"id": "N-救護-002", "subject": "刑事法", "topic": "消防法", "stem": "依緊急救護辦法規定，關於救護人員之訓練及資格，下列敘述何者正確？", "opts": {"A": "消防機關應訓練救護人員，使具初級、中級或高級救護技術員資格", "B": "救護技術員訓練之時數及考試取得資格，由中央消防主管機關定之", "C": "救護人員僅須具備初級救護技術員資格，即得執行全部救護項目", "D": "救護人員之訓練由各急救責任醫院辦理，消防機關不負訓練之責"}, "answer": "A", "explain": "依緊急救護辦法§10Ⅰ，消防機關應訓練救護人員，使具初級、中級或高級救護技術員資格，以執行緊急救護工作（A 正確，訓練義務在消防機關，D 錯）。依同條第二項，其訓練資格、課程、時數、師資及考試取得資格，應符合「中央衛生主管機關」之規定，B 之主管機關錯誤。各級技術員救護項目範圍不同，C 亦錯。", "ref": "緊急救護辦法§10", "evidence": "消防機關應訓練救護人員，使具初級、中級或高級救護技術員資格，以執行緊急救護工作。", "tag": "子法", "src": "new"}, {"id": "N-救護-003", "subject": "刑事法", "topic": "消防法", "stem": "依緊急救護辦法規定，下列關於緊急救護相關作業辦理期程之敘述，何者錯誤？", "opts": {"A": "消防機關應每年舉辦教育訓練，使救護人員保持必要之技能及知識", "B": "就特殊意外災害緊急救護執行計畫，每年應實施訓練或演習一次", "C": "緊急救護品質考核及評估每三年辦理一次，由中央衛生主管機關單獨辦理", "D": "中央主管機關應會同中央衛生主管機關每年辦理緊急救護品質考核及評估"}, "answer": "C", "explain": "依緊急救護辦法§18，為確保緊急救護品質，「中央主管機關應會同中央衛生主管機關每年」辦理緊急救護品質考核及評估，故 D 正確而 C 之週期（三年）與辦理機關（衛生機關單獨）均錯。A 為§11 每年舉辦教育訓練之規定；B 為§15 就特殊意外災害執行計畫每年實施訓練或演習乙次之規定。", "ref": "緊急救護辦法§11、§15、§18", "evidence": "中央主管機關應會同中央衛生主管機關每年辦理緊急救護品質考核及評估。", "tag": "子法", "src": "new"}, {"id": "N-救護-004", "subject": "刑事法", "topic": "消防法", "stem": "依緊急救護辦法規定，救護人員執行救護所填具之救護紀錄表，於送抵急救醫院時應如何處理？", "opts": {"A": "由救護人員自行簽章後，逕送救災救護指揮中心彙整存查", "B": "應由醫護人員簽章確認救護紀錄表所載之各項事項", "C": "由緊急傷病患本人或其家屬簽章確認後始生效力", "D": "由醫院留存正本，並於三日內函送消防機關備查"}, "answer": "B", "explain": "依緊急救護辦法§14，救護人員執行救護應填具救護紀錄表，於送抵急救醫院時，應由「醫護人員」簽章確認紀錄表所載事項，其目的在於使院前處置與到院交接之內容獲得醫療端確認，故 B 正確。條文並未規定由指揮中心存查（A）、由病患或家屬簽章確認（C），亦無正本留存及三日內函送之程序（D）。", "ref": "緊急救護辦法§14", "evidence": "救護人員執行救護應填具救護紀錄表，於送抵急救醫院時，應由醫護人員簽章確認紀錄表所載事項。", "tag": "子法", "src": "new"}, {"id": "N-救護-005", "subject": "刑事法", "topic": "消防法", "stem": "救護人員將一名路倒傷病患送醫，該傷病患意識不清且身分無法立即查明。依緊急救護辦法規定，下列處理方式何者正確？", "opts": {"A": "應先向當地警察機關查明其身分後，始得運送就醫", "B": "由救護人員先行填具救護紀錄表，運送至急救責任醫院或就近適當醫療機構先行救治", "C": "其入院手續及醫藥費用，一律由運送之消防機關先行代為墊付", "D": "應送至最近之衛生所暫留觀察，待身分查明後再行轉送醫院"}, "answer": "B", "explain": "依緊急救護辦法§6Ⅱ，緊急傷病患身分不及查明時，由救護人員先行填具救護紀錄表，運送至急救責任醫院或就近適當醫療機構先行救治，並向當地警察機關查明身分後再依規定辦理，可見救治優先於身分查明（B 正確、A 錯）。依同條第一項，醫藥費用原則由本人或家屬負責，身分無法查明者或低收入戶依社會救助法辦理（C 錯）；送醫地點為急救責任醫院或就近適當醫療機構（D 錯）。", "ref": "緊急救護辦法§6", "evidence": "緊急傷病患身分不及查明時，由救護人員先行填具救護紀錄表，運送至急救責任醫院或就近適當醫療機構先行救治", "tag": "子法", "src": "new"}, {"id": "N-救護-006", "subject": "刑事法", "topic": "消防法", "stem": "依緊急救護辦法規定，關於運送疑患有法定傳染病緊急傷病患之處理，下列敘述何者錯誤？", "opts": {"A": "應注意避免救護人員及救護車輛受到污染，並立即依規定實施消毒", "B": "其處理情形應逐級陳報相關機關，不得逕行結案而未陳報", "C": "受理之醫院僅須通知衛生主管機關，無須通知運送之消防機關", "D": "受理之醫院經診斷為法定傳染病患時，應即將診斷結果通知消防機關"}, "answer": "C", "explain": "依緊急救護辦法§8Ⅱ，受理該緊急傷病患之醫院，經診斷為法定傳染病患時，應即將診斷結果通知消防機關，以採取必要措施，故 D 正確而 C 錯誤；此通知義務之目的在使消防機關得對接觸之救護人員及車輛採取消毒、健康監測等處置。A、B 均為同條第一項之規定（避免污染、立即消毒、逐級陳報）。", "ref": "緊急救護辦法§8", "evidence": "應即將診斷結果通知消防機關，以採取必要措施。", "tag": "子法", "src": "new"}, {"id": "N-救護-007", "subject": "刑事法", "topic": "消防法", "stem": "依緊急救護辦法規定，直轄市、縣（市）消防機關為實施救護業務，應就所轄區域進行調查之事項，不包括下列何者？", "opts": {"A": "轄區之地勢及交通狀況等救護出勤環境條件", "B": "有急救事故發生之虞之對象物，其位置及構造", "C": "轄內民眾之全民健康保險投保情形及個人病歷資料", "D": "醫療機構等之位置及其他經消防主管機關認為必要之事項"}, "answer": "C", "explain": "依緊急救護辦法§16，應調查之事項為：地勢及交通狀況；有急救事故發生之虞之對象物之位置及構造；醫療機構等之位置及其他必要事項；其他經消防主管機關認為必要之事項，故 A、B、D 均屬條文所列。個人之健保投保情形與病歷屬個人資料，受個人資料保護法規範，非本條調查範圍，C 為應選答案。", "ref": "緊急救護辦法§16", "evidence": "二、有急救事故發生之虞之對象物，其位置及構造。", "tag": "子法", "src": "new"}, {"id": "N-救護-008", "subject": "刑事法", "topic": "消防法", "stem": "救護人員到場實施緊急救護，緊急傷病患意識清楚且明確表示拒絕接受運送。依緊急救護辦法規定，救護人員應如何處理？", "opts": {"A": "應要求其於救護紀錄表中簽名後，不予運送", "B": "應會同警察機關強制運送至急救責任醫院救治", "C": "應請家屬另立切結書，並報指揮中心核准後為之", "D": "應向當地衛生主管機關報備後，始得不予運送"}, "answer": "A", "explain": "依緊急救護辦法§7，救護人員實施緊急救護時，如緊急傷病患或其家屬拒絕接受運送，應要求其於救護紀錄表中簽名後，不予運送，以尊重病患自主並留存紀錄作為日後責任釐清之依據，故 A 正確。條文並未賦予強制運送之權（B 錯），亦無另立切結書、報請指揮中心核准（C）或向衛生主管機關報備（D）之程序。", "ref": "緊急救護辦法§7", "evidence": "如緊急傷病患或其家屬拒絕接受運送，應要求其於救護紀錄表中簽名後，不予運送。", "tag": "子法", "src": "new"}, {"id": "N-救護-009", "subject": "刑事法", "topic": "消防法", "stem": "依緊急救護辦法規定，消防機關受理緊急傷病事故之申請或知悉有緊急事故發生時，下列敘述何者錯誤？", "opts": {"A": "應確認該事故之發生場所、緊急傷病患之人數及程度等事項", "B": "應立即出動所需之救護隊前往救護，不待上級機關指示", "C": "運送由救護隊負責，其受理申請及就醫聯絡由救災救護指揮中心負責", "D": "運送及受理申請、就醫聯絡等事項，均一律由救災救護指揮中心負責"}, "answer": "D", "explain": "依緊急救護辦法§4Ⅱ，緊急傷病患之運送由「救護隊」負責，其受理申請及就醫聯絡則由「救災救護指揮中心」負責，兩者分工明確，故 C 正確而 D 錯誤。A、B 為同條第一項之規定：受理或知悉時應確認發生場所、傷病患人數及程度等，並立即出動所需之救護隊前往救護。", "ref": "緊急救護辦法§4", "evidence": "前項緊急傷病患之運送，由救護隊負責，其受理申請及就醫聯絡由救災救護指揮中心負責。", "tag": "子法", "src": "new"}, {"id": "N-救護-010", "subject": "刑事法", "topic": "消防法", "stem": "依緊急救護辦法規定，下列敘述何者錯誤？", "opts": {"A": "本辦法所指救護人員，為直轄市、縣（市）消防機關執行緊急救護任務之人員", "B": "救護人員執行救護，應依衛生主管機關所定救護項目範圍及救護作業程序施行", "C": "救護人員執行救護勤務時，應著制式服裝，以利辨識及維持勤務紀律", "D": "消防機關為因應大量傷病患救護需要，應與鄰近直轄市、縣（市）訂定相互支援計畫"}, "answer": "D", "explain": "依緊急救護辦法§17，直轄市、縣（市）消防機關為因應大量傷病患救護需要，「得」訂定相互支援計畫，屬授權裁量而非強制義務，D 誤將「得」寫為「應」。A 為§2 救護人員之定義；B 為§9 應依衛生主管機關所定救護項目範圍及作業程序施行之規定；C 為§12 著制式服裝之規定，均屬正確。", "ref": "緊急救護辦法§2、§9、§12、§17", "evidence": "直轄市、縣（市）消防機關為因應大量傷病患救護需要，得訂定相互支援計畫。", "tag": "子法", "src": "new"}, {"id": "N-車輛-001", "subject": "刑事法", "topic": "消防法", "stem": "依直轄市縣（市）消防車輛裝備及其人力配置標準規定，關於消防車輛種類之歸類，下列敘述何者正確？", "opts": {"A": "消防救災機車與勤務機車，均屬「救災車」之車輛種類", "B": "高塔訓練車與地震體驗車，均屬「救災車」之車輛種類", "C": "水庫消防車與超高壓消防車，均屬「消防車」之車輛種類", "D": "消防警備車與災害預防宣導車，均屬「消防勤務車」之種類"}, "answer": "C", "explain": "依本標準§3Ⅰ，車輛分消防車、救災車、消防勤務車三類。消防車含雲梯、化學、水箱、水庫、泡沫、幫浦及超高壓消防車（C 正確）。消防救災機車屬救災車、勤務機車屬消防勤務車（A 錯）；高塔訓練車、地震體驗車均屬消防勤務車（B 錯）；消防警備車屬救災車、災害預防宣導車屬消防勤務車（D 錯）。", "ref": "車輛裝備人力配置標準§3Ⅰ", "evidence": "直轄市、縣（市）消防機關消防車輛及裝備，得視轄區特性、消防人力等實際狀況配置，其種類如下。", "tag": "子法", "src": "new", "amend": "115-07-28 修正"}, {"id": "N-車輛-002", "subject": "刑事法", "topic": "消防法", "stem": "依直轄市縣（市）消防車輛裝備及其人力配置標準規定，關於消防車之配置基準，下列敘述何者正確？", "opts": {"A": "三萬人以上之鄉（鎮、市、區）每五千人配置消防車一輛，並以十萬人為上限", "B": "未達三萬人之鄉（鎮、市、區）配置消防車一輛，每分隊基本配置至少一輛", "C": "每分隊消防車基本配置至少三輛，其餘依轄區人口數按比例增加配置之", "D": "每一萬人配置消防車一輛，每分隊轄區人口數上限以六萬人計"}, "answer": "D", "explain": "依本標準§4第一款，直轄市、縣（市）及三萬人以上之鄉（鎮、市、區）每一萬人配置消防車一輛，且每分隊轄區人口數上限以六萬人計（D 正確，A 之人口級距與上限均錯）。未達三萬人之鄉（鎮、市、區）配置消防車二輛，且每分隊消防車基本配置至少二輛，故 B 之輛數錯誤、C 之「至少三輛」亦錯。", "ref": "車輛裝備人力配置標準§4①", "evidence": "直轄市、縣（市）及三萬人以上之鄉（鎮、市、區）每一萬人配置消防車一輛，每分隊轄區人口數上限以六萬人計", "tag": "子法", "src": "new", "amend": "115-07-28 修正"}, {"id": "N-車輛-003", "subject": "刑事法", "topic": "消防法", "stem": "依直轄市縣（市）消防車輛裝備及其人力配置標準規定，消防機關依大隊轄區六層樓以上建築物棟數配置雲梯消防車，下列敘述何者正確？", "opts": {"A": "建築物棟數十八棟以上未達一百八十棟者，配置雲梯消防車一輛", "B": "建築物棟數十棟以上未達一百棟者，配置雲梯消防車一輛", "C": "建築物棟數一百八十棟以上者，一律配置雲梯消防車三輛", "D": "離島地區亦應依建築物棟數配置，並無得視需要配置之例外"}, "answer": "A", "explain": "依本標準§4第一款第一目，各消防機關依大隊轄區六層樓以上建築物棟數配置雲梯消防車：十八棟以上未達一百八十棟者配置一輛（A 正確，B 之級距錯誤）；一百八十棟以上未達二百七十棟者配置二輛，二百七十棟以上者得視實際救災需要增加配置，故 C 之「一律三輛」錯誤。離島地區得視實際救災需要配置，屬明文例外，D 錯誤。", "ref": "車輛裝備人力配置標準§4①（一）", "evidence": "建築物棟數十八棟以上未達一百八十棟者，配置一輛。", "tag": "子法", "src": "new", "amend": "115-07-28 修正"}, {"id": "N-車輛-004", "subject": "刑事法", "topic": "消防法", "stem": "某縣轄內依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法所定第四類公共危險物品達管制量十倍以上之製造、儲存及處理場所，扣除室內儲槽場所及地下儲槽場所後共計六百處。依直轄市縣（市）消防車輛裝備及其人力配置標準規定，該縣應配置化學消防車幾輛？", "opts": {"A": "應配置化學消防車一輛", "B": "應配置化學消防車二輛", "C": "應配置化學消防車三輛", "D": "應配置化學消防車四輛"}, "answer": "B", "explain": "依本標準§4第一款第二目之一，按場所數量配置化學消防車：未達五百處者配置一輛（未達五十處者得以具備泡沫比例混合功能之消防車替代）；五百處以上未達一千處者配置二輛；一千處以上未達二千處者配置三輛，二千處以上者每滿一千處增加一輛。本題六百處落於五百至一千處區間，應配置二輛，故選 B。", "ref": "車輛裝備人力配置標準§4①（二）1", "evidence": "（2）場所數量五百處以上未達一千處者，配置二輛。", "tag": "子法", "src": "new", "amend": "115-07-28 修正"}, {"id": "N-車輛-005", "subject": "刑事法", "topic": "消防法", "stem": "某直轄市轄內依安全管理辦法所定第四類公共危險物品製造、儲存及處理場所，合計其最大儲存及處理之第四類公共危險物品數量達管制量五百萬倍。依直轄市縣（市）消防車輛裝備及其人力配置標準規定，該市應配置化學消防車幾輛？", "opts": {"A": "應配置化學消防車一輛", "B": "應配置化學消防車二輛", "C": "應配置化學消防車三輛", "D": "應配置化學消防車四輛"}, "answer": "C", "explain": "依本標準§4第一款第二目之二，按第四類公共危險物品合計數量配置化學消防車：未達管制量二百四十萬倍者配置一輛（未達二十四萬倍者得以具泡沫比例混合功能之消防車替代）；二百四十萬倍以上未達四百八十萬倍者配置二輛；四百八十萬倍以上者配置三輛。本題五百萬倍已逾四百八十萬倍，應配置三輛，故選 C。", "ref": "車輛裝備人力配置標準§4①（二）2", "evidence": "（3）公共危險物品合計數量達管制量四百八十萬倍以上者，配置三輛。", "tag": "子法", "src": "new", "amend": "115-07-28 修正"}, {"id": "N-車輛-006", "subject": "刑事法", "topic": "消防法", "stem": "依直轄市縣（市）消防車輛裝備及其人力配置標準規定，關於救助器材車之配置基準，下列敘述何者正確？", "opts": {"A": "人口數未達二十五萬人者，應配置救助器材車二輛", "B": "人口數一百萬以上未達三百十萬人者，每四十萬人增加配置一輛", "C": "人口數三百十萬人以上者，每十五萬人增加配置一輛", "D": "人口數二十五萬以上未達一百萬人者，每十五萬人增加配置一輛"}, "answer": "D", "explain": "依本標準§4第二款第一目，救助器材車之配置採人口級距遞增：未達二十五萬人者配置一輛（A 之二輛錯）；二十五萬以上未達一百萬人者每十五萬人增加一輛（D 正確）；一百萬以上未達三百十萬人者每三十萬人增加一輛（B 之四十萬錯）；三百十萬人以上者每四十萬人增加一輛（C 之十五萬錯）。", "ref": "車輛裝備人力配置標準§4②（一）", "evidence": "人口數二十五萬以上未達一百萬人者，每十五萬人增加配置一輛", "tag": "子法", "src": "new", "amend": "115-07-28 修正"}, {"id": "N-車輛-007", "subject": "刑事法", "topic": "消防法", "stem": "依直轄市縣（市）消防車輛裝備及其人力配置標準規定，關於救災指揮車及勤務機車之配置，下列敘述何者正確？", "opts": {"A": "救災指揮車於消防局局本部配置一輛，大（中）隊配置三輛或四輛", "B": "救災指揮車於消防局局本部配置二輛或三輛，大（中）隊配置一輛或二輛", "C": "勤務機車由中央消防機關統一配置，大（分）隊基本配置至少五輛", "D": "勤務機車應按轄區人口數每一萬人配置一輛，無基本配置之規定"}, "answer": "B", "explain": "依本標準§4第二款第二目，救災指揮車於直轄市、縣（市）政府消防局局本部配置二輛或三輛，大（中）隊配置一輛或二輛，故 B 正確、A 之輛數錯誤。依同款第三目，勤務機車由直轄市、縣（市）消防機關按業（勤）務需要配置，大（分）隊基本配置至少二輛，並非中央統一配置或按人口數計算，C、D 均錯。", "ref": "車輛裝備人力配置標準§4②（二）（三）", "evidence": "救災指揮車：直轄市、縣（市）政府消防局局本部配置二輛或三輛，大（中）隊配置一輛或二輛。", "tag": "子法", "src": "new", "amend": "115-07-28 修正"}, {"id": "N-車輛-008", "subject": "刑事法", "topic": "消防法", "stem": "依直轄市縣（市）消防車輛裝備及其人力配置標準規定，關於消防車輛配置消防隊員員額之敘述，下列何者正確？", "opts": {"A": "水箱消防車每車配置八人至十人，為各類消防車中最多者", "B": "救助器材車每車配置五人或六人，與水箱消防車相同", "C": "救災指揮車每車配置五人或六人，以利編成指揮幕僚群", "D": "雲梯消防車每車配置八人至十人，為各類車輛中員額最高"}, "answer": "D", "explain": "依本標準§5Ⅰ，雲梯消防車每車配置八人至十人，為各款中員額最高者（D 正確，A 之車種錯誤）；化學、水箱、水庫、泡沫、幫浦、超高壓消防車每車五人或六人；救助器材車、排煙車、照明車、空氣壓縮車等每車二人（B 錯）；救災指揮車每車一人或二人（C 錯）。同條第二項並規定員額得按勤休比例增置。", "ref": "車輛裝備人力配置標準§5", "evidence": "一、雲梯消防車：每車配置八人至十人。", "tag": "子法", "src": "new", "amend": "115-07-28 修正"}, {"id": "N-危救-001", "subject": "刑事法", "topic": "消防法", "stem": "依危險性救災行動認定標準規定，災害搶救現場有下列何種情形，並非該標準所認定之危險性救災行動？", "opts": {"A": "進入核生化災害現場之熱區實施人命搜救行動", "B": "進入一般鋼筋混凝土集合住宅之地面層執行滅火行動", "C": "進入長隧道、地下軌道、地下 報緊急求救口令。", "tag": "子法", "src": "new"}, {"id": "N-憲法-001", "subject": "法學", "topic": "憲法", "stem": "人民因犯罪嫌疑被逮捕拘禁時，依憲法第8條規定，逮捕拘禁機關至遲應於多久內將其移送該管法院審問？", "opts": {"A": "十二小時內", "B": "十六小時內", "C": "二十四小時內", "D": "四十八小時內"}, "answer": "C", "explain": "憲法第8條第2項規定，人民因犯罪嫌疑被逮捕拘禁時，逮捕拘禁機關應以書面告知本人及其指定之親友，並至遲於二十四小時內移送該管法院審問；本人或他人亦得聲請法院於二十四小時內向逮捕機關提審。此為人身自由之憲法保留規定，故選C。", "ref": "憲法§8", "evidence": "並至遲於二十四小時內移送該管法院審問", "src": "new"}, {"id": "N-憲法-002", "subject": "法學", "topic": "憲法", "stem": "依憲法第24條規定，公務員違法侵害人民之自由或權利者，下列敘述何者正確？", "opts": {"A": "除依法律受懲戒外，並應負刑事及民事責任", "B": "僅負行政懲戒責任，不另負刑事責任", "C": "被害人民僅得向該公務員個人請求賠償", "D": "須經監察院彈劾成立後，始負民事責任"}, "answer": "A", "explain": "憲法第24條規定公務員違法侵害人民自由或權利者，除依法律受懲戒外，應負刑事及民事責任，被害人民並得依法律向國家請求賠償，此即國家賠償法之憲法依據。公務員責任並非僅限懲戒，被害人亦非只能向個人求償，且民事責任不以監察院彈劾為前提，故選A。", "ref": "憲法§24", "evidence": "除依法律受懲戒外，應負刑事及民事責任。被害人民就其所受損害，並得依法律向國家請求賠償", "src": "new"}, {"id": "N-憲法-003", "subject": "法學", "topic": "憲法", "stem": "依憲法第23條規定，下列何者不屬於該條明文列舉得以法律限制人民自由權利之目的？", "opts": {"A": "防止妨礙他人自由", "B": "避免緊急危難", "C": "維持社會秩序", "D": "維護國家元首尊嚴"}, "answer": "D", "explain": "憲法第23條明定，人民之自由權利，除為防止妨礙他人自由、避免緊急危難、維持社會秩序，或增進公共利益所必要者外，不得以法律限制之，此即法律保留原則與比例原則之依據。「維護國家元首尊嚴」並非該條列舉之目的，故選D。", "ref": "憲法§23", "evidence": "除為防止妨礙他人自由、避免緊急危難、維持社會秩序，或增進公共利益所必要者外，不得以法律限制之", "src": "new"}, {"id": "N-憲法-004", "subject": "法學", "topic": "憲法", "stem": "依憲法本文規定，下列何者同時屬於人民之權利及義務？", "opts": {"A": "受國民教育", "B": "依法律納稅", "C": "依法律服兵役", "D": "應考試服公職"}, "answer": "A", "explain": "憲法第21條規定人民有受國民教育之權利與義務，為憲法本文中唯一同時定為權利與義務者。第19條納稅、第20條服兵役僅規定為「義務」；第18條應考試服公職則規定為「權利」。故選A。", "ref": "憲法§21", "evidence": "人民有受國民教育之權利與義務", "src": "new"}, {"id": "N-憲法-005", "subject": "法學", "topic": "憲法", "stem": "總統依憲法增修條文規定，經行政院會議之決議發布緊急命令後，應於多久期間內提交立法院追認？", "opts": {"A": "七日內", "B": "十日內", "C": "十五日內", "D": "一個月內"}, "answer": "B", "explain": "憲法增修條文第2條第3項規定，總統為避免國家或人民遭遇緊急危難或應付財政經濟上重大變故，得經行政院會議之決議發布緊急命令，不受憲法第43條之限制，但須於發布命令後十日內提交立法院追認，立法院不同意時該命令立即失效，故選B。", "ref": "增修條文§2", "evidence": "但須於發布命令後十日內提交立法院追認，如立法院不同意時，該緊急命令立即失效", "src": "new"}, {"id": "N-憲法-006", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，關於總統解散立法院，下列敘述何者正確？", "opts": {"A": "總統得於不信任案通過後十日內，逕行宣告解散，無須諮詢任何人", "B": "總統於緊急命令生效期間，仍得宣告解散立法院", "C": "新選出之立法委員，其任期接續原屆立法委員任期計算", "D": "立法院解散後，應於六十日內舉行立法委員選舉"}, "answer": "D", "explain": "增修條文第2條第5項：總統於立法院通過不信任案後十日內，經諮詢立法院院長後，得宣告解散立法院；戒嚴或緊急命令生效期間不得解散。立法院解散後應於六十日內選舉，選舉結果確認後十日內自行集會，其任期重新起算，故選D。", "ref": "增修條文§2", "evidence": "立法院解散後，應於六十日內舉行立法委員選舉，並於選舉結果確認後十日內自行集會，其任期重新起算", "src": "new"}, {"id": "N-憲法-007", "subject": "法學", "topic": "憲法", "stem": "副總統缺位時，依憲法增修條文規定應如何處理？", "opts": {"A": "由行政院院長兼任副總統至任期屆滿", "B": "總統應於三個月內提名候選人，由立法院補選", "C": "總統應於六個月內提名候選人，由人民直接補選", "D": "由立法院院長代行其職權至任期屆滿"}, "answer": "B", "explain": "增修條文第2條第7項規定，副總統缺位時，總統應於三個月內提名候選人，由立法院補選，繼任至原任期屆滿為止。另總統、副總統均缺位時，始由行政院院長代行職權，並依第1項由人民直接補選，兩者不可混淆，故選B。", "ref": "增修條文§2", "evidence": "副總統缺位時，總統應於三個月內提名候選人，由立法院補選，繼任至原任期屆滿為止", "src": "new"}, {"id": "N-憲法-008", "subject": "法學", "topic": "憲法", "stem": "行政院對立法院決議之法律案認為窒礙難行，經總統核可移請覆議；立法院於非休會期間，應於覆議案送達後幾日內作成決議？", "opts": {"A": "七日", "B": "十日", "C": "十五日", "D": "三十日"}, "answer": "C", "explain": "增修條文第3條第2項第2款：行政院應於決議案送達十日內移請覆議；立法院應於送達十五日內作成決議，休會期間應於七日內自行集會並於開議十五日內決議。逾期未議決者原決議失效；經全體立委二分之一以上決議維持原案，行政院院長應即接受，故選C。", "ref": "增修條文§3", "evidence": "立法院對於行政院移請覆議案，應於送達十五日內作成決議", "src": "new"}, {"id": "N-憲法-009", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，關於立法院對行政院院長提出不信任案，下列敘述何者正確？", "opts": {"A": "須經全體立法委員三分之一以上連署", "B": "不信任案提出二十四小時後，應於七十二小時內表決", "C": "須經出席委員三分之二以上贊成始為通過", "D": "不信任案未獲通過者，六個月內不得對同一院長再提"}, "answer": "A", "explain": "增修條文第3條第2項第3款：不信任案須全體立委三分之一以上連署；提出七十二小時後，應於四十八小時內記名投票表決；經全體立委二分之一以上贊成通過，院長應於十日內辭職；未獲通過者，一年內不得對同一院長再提，故選A。", "ref": "增修條文§3", "evidence": "立法院得經全體立法委員三分之一以上連署，對行政院院長提出不信任案", "src": "new"}, {"id": "N-憲法-010", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，關於立法院立法委員自第七屆起之名額，下列何者正確？", "opts": {"A": "總額一百二十五人", "B": "自由地區直轄市、縣市選出七十九人", "C": "平地原住民及山地原住民合計四人", "D": "全國不分區及僑居國外國民共三十四人"}, "answer": "D", "explain": "增修條文第4條第1項：立法委員自第七屆起一百一十三人，任期四年，包括自由地區直轄市、縣市七十三人（每縣 ，命令位階不得逾二年"}, "answer": "C", "explain": "憲法訴訟法第52條規定，判決宣告法規範違憲且應失效者，自判決生效日起失效，但主文另有諭知溯及失效或定期失效者依其諭知；定期失效之期間，法律位階法規範不得逾二年，命令位階法規範不得逾一年。例如113年憲判字第6號即諭知至遲屆滿1年失效，故選C。", "ref": "憲法訴訟法§52", "evidence": "", "src": "new"}, {"id": "N-憲法-029", "subject": "法學", "topic": "憲法", "stem": "依憲法訴訟法規定，關於各類案件之聲請期間，下列敘述何者正確？", "opts": {"A": "人民聲請裁判憲法審查，應自用盡審級救濟之最終裁判送達後翌日起六個月不變期間內為之", "B": "人民聲請統一解釋法律及命令，應於不利確定終局裁判送達後六個月內為之", "C": "國家最高機關聲請機關爭議判決，應於協商未果之日起三個月內為之", "D": "地方自治團體聲請地方自治保障案件，應於確定終局裁判送達後一年內為之"}, "answer": "A", "explain": "憲法訴訟法第59條第2項：人民聲請法規範及裁判憲法審查，應自用盡審級救濟之最終裁判送達後翌日起六個月不變期間內為之。第84條統一解釋為三個月；第65條機關爭議為協商未果之日起六個月；第83條地方自治保障為確定終局裁判送達後六個月，故選A。", "ref": "憲法訴訟法§59、§65、§83、§84", "evidence": "", "src": "new"}, {"id": "N-憲法-030", "subject": "法學", "topic": "憲法", "stem": "依憲法訴訟法規定，關於憲法法庭之暫時處分，下列敘述何者錯誤？", "opts": {"A": "憲法法庭得依聲請或依職權為暫時處分之裁定", "B": "須為避免憲法所保障之權利或公益遭受難以回復之重大損害，且有急迫必要性", "C": "聲請案件業經裁判者，暫時處分失其效力", "D": "暫時處分之裁定，自裁定後逾一年始失其效力"}, "answer": "D", "explain": "憲法訴訟法第43條：聲請案件繫屬中，為避免憲法所保障之權利或公益遭受難以回復之重大損害，且有急迫必要性而無其他手段可資防免時，得依聲請或依職權為暫時處分。暫時處分於聲請案件業經裁判、裁定後已逾六個月或經裁定撤銷時失其效力，並非一年，故D錯誤。", "ref": "憲法訴訟法§43", "evidence": "", "src": "new"}, {"id": "N-消防-001", "subject": "刑事法", "topic": "消防法", "stem": "依現行消防法第1條所定之立法目的，下列何者「未」列入？", "opts": {"A": "預防火災、搶救災害及緊急救護", "B": "維護公共安全，確保人民生命財產", "C": "防護消防人員執行職務之安全及衛生", "D": "促進消防安全設備產業之發展"}, "answer": "D", "explain": "現行第1條（113年11月修正）明定立法目的為預防火災、搶救災害及緊急救護，以維護公共安全、確保人民生命財產，並防護消防人員執行職務之安全及衛生，後者並配合新增第三章之一「消防人員安全衛生防護」。「促進消防安全設備產業之發展」非條文所列目的，故為答案。", "ref": "消防法§1", "evidence": "為預防火災、搶救災害及緊急救護，以維護公共安全，確保人民生命財產，並防護消防人員執行職務之安全及衛生", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-002", "subject": "刑事法", "topic": "消防法", "stem": "有關消防法所定「消防人員職務安全衛生諮詢會」，下列敘述何者正確？", "opts": {"A": "由直轄市、縣（市）政府遴聘消防機關代表、公務人員協會代表及學者專家組成", "B": "諮詢會委員任一性別比例不得少於四分之一", "C": "諮詢會之組成、任務及委員遴聘方式等辦法，由行政院定之", "D": "應就消防人員之職務安全衛生政策、安全衛生管理系統、防護設備及措施等事項提供建議"}, "answer": "D", "explain": "依§25-1，諮詢會由「中央主管機關」遴聘消防機關代表、公務人員協會代表及學者專家組成，並非地方政府；委員任一性別比例不得少於「三分之一」而非四分之一；其組成、任務、遴聘方式等辦法由「中央主管機關」定之，非行政院。諮詢會之任務為就職務安全衛生政策、管理系統、防護設備及措施提供建議，故該敘述正確。", "ref": "消防法§25-1", "evidence": "諮詢會應就消防人員之職務安全衛生政策、安全衛生管理系統、安全衛生防護設備及措施等事項提供建議", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-003", "subject": "刑事法", "topic": "消防法", "stem": "依消防法第25條之2規定，各級消防機關應設安全衛生專責單位及置專責人員；但預算員額數未滿多少人者，得僅置安全衛生專責人員？", "opts": {"A": "200人", "B": "100人", "C": "300人", "D": "500人"}, "answer": "A", "explain": "§25-2第1項規定各級消防機關應設安全衛生專責單位及置專責人員，但預算員額數未滿二百人者，得僅置安全衛生專責人員，不必另設專責單位。100人、300人、500人均非條文所定門檻。另未依規定設單位或置人員，經通知限期改善屆期未改善者，依§43-2處罰。", "ref": "消防法§25-2", "evidence": "但預算員額數未滿二百人者，得僅置安全衛生專責人員", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-004", "subject": "刑事法", "topic": "消防法", "stem": "各級消防機關依公務人員保障法第19條相關規定組成安全及衛生防護小組，依消防法規定，其成員比例之要求為何？", "opts": {"A": "任一性別比例不得低於四分之一，消防基層人員比例不得低於三分之一", "B": "任一性別比例不得低於三分之一，消防基層人員比例不得低於二分之一", "C": "任一性別比例不得低於五分之一，消防基層人員比例不得低於三分之一", "D": "任一性別比例不得低於三分之一，消防基層人員比例不得低於五分之一"}, "answer": "D", "explain": "§25-3明定安全及衛生防護小組成員，任一性別比例不得低於三分之一，消防基層人員比例不得低於五分之一。其餘選項將性別比例誤為四分之一或五分之一、或將基層人員比例誤為三分之一或二分之一，均與條文不符。另諮詢會委員之性別比例同為三分之一（§25-1），易與本條混淆。", "ref": "消防法§25-3", "evidence": "任一性別比例不得低於三分之一，其消防基層人員比例不得低於五分之一", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-005", "subject": "刑事法", "topic": "消防法", "stem": "有關各級消防機關消防人員安全衛生管理系統之評估與查核，依消防法規定，下列敘述何者錯誤？", "opts": {"A": "各級消防機關應定期統計及評估安全衛生管理系統之建置成效，並報請中央主管機關備查", "B": "消防人員因職業上原因引發疾病、傷害、失能或死亡之事故，應即時通報並作成調查紀錄", "C": "查核結果執行不力者，中央主管機關得逕予撤換該消防機關首長", "D": "中央主管機關得委託團體、機關（構）及學校，查核各級消防機關安全衛生管理系統之建置情形"}, "answer": "C", "explain": "依§25-4，定期統計評估建置成效及職業事故即時通報、作成調查紀錄，均應報中央主管機關備查；依§25-5第1項，中央主管機關或其委託之團體、機關（構）及學校得查核建置情形。同條第2項規定執行不力者僅「得令其改善及提出懲處建議」，並無逕予撤換首長之規定，故該敘述錯誤。", "ref": "消防法§25-5", "evidence": "績效良好者，中央主管機關得予獎勵及公開表揚；執行不力者，得令其改善及提出懲處建議", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-006", "subject": "刑事法", "topic": "消防法", "stem": "有關消防人員之健康檢查，依消防法規定，下列敘述何者錯誤？", "opts": {"A": "健康檢查應由中央衛生主管機關評鑑合格之地區醫院以上醫療機構為之", "B": "消防人員有接受消防機關所實施健康檢查之義務", "C": "實施臨時健康檢查時，消防機關應提供救災作業經歷資料予醫院", "D": "健康檢查紀錄由各級消防機關保存，並由其負擔健康檢查費用"}, "answer": "A", "explain": "§25-6第3項規定健康檢查應由中央衛生主管機關評鑑合格之「區域醫院或醫學中心」為之，地區醫院不在其列，故該敘述錯誤。同條第2項明定消防人員有接受健康檢查之義務；第3項並規定紀錄由各級消防機關保存、負擔費用，實施臨時健檢時應提供救災作業經歷資料予醫院，其餘敘述均正確。", "ref": "消防法§25-6", "evidence": "第一項健康檢查應由中央衛生主管機關評鑑合格之區域醫院或醫學中心為之", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-007", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，各級消防機關對於女性妊娠中或分娩後未滿多久之消防人員，除提供適當之環境與防護設備外，並應依醫師適性評估建議，採取勤務調整或必要之健康保護措施？", "opts": {"A": "二年", "B": "六個月", "C": "一年", "D": "三年"}, "answer": "A", "explain": "§25-8第2項規定，各級消防機關對於女性妊娠中或分娩後未滿二年之消防人員，除應提供適當之環境、安全衛生防護設備及措施外，並應依醫師適性評估建議，採取勤務調整或必要之健康保護措施。六個月、一年、三年均非條文所定期間。同條第1項另要求考量性別、年齡、身心障礙等特殊需要。", "ref": "消防法§25-8", "evidence": "對於女性妊娠中或分娩後未滿二年之消防人員", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-008", "subject": "刑事法", "topic": "消防法", "stem": "有關消防人員安全衛生防護之規定，依消防法，下列敘述何者正確？", "opts": {"A": "安全衛生教育及訓練為消防人員之權利，是否參加由其自行決定", "B": "安全衛生教育與訓練事項及訓練單位資格條件之規則，由直轄市、縣（市）政府定之", "C": "消防機關提供防護設備時應考量性別、年齡因素，但身心障礙因素不在考量範圍", "D": "各級政府辦理消防人員安全衛生防護設備、措施及健康檢查所需經費，應優先編列預算支應"}, "answer": "D", "explain": "§25-9明定相關經費應優先編列預算支應，故該敘述正確。依§25-7，消防人員對安全衛生教育及訓練「有接受之義務」，並非自由選擇；其規則由「中央主管機關」定之，非地方政府。§25-8第1項明定應考量性別、年齡、身心障礙等因素之特殊需要，身心障礙亦在考量之列。", "ref": "消防法§25-9", "evidence": "各級政府辦理消防人員之安全衛生防護設備、措施及健康檢查所需經費，應優先編列預算支應", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-009", "subject": "刑事法", "topic": "消防法", "stem": "某縣消防局未依規定建置消防人員安全衛生管理系統，經中央主管機關通知限期改善，屆期仍未改善，依消防法應處新臺幣多少罰鍰？", "opts": {"A": "2萬元以上10萬元以下", "B": "3萬元以上15萬元以下", "C": "6千元以上10萬元以下", "D": "3萬元以上30萬元以下"}, "answer": "D", "explain": "113年增訂之§43-2規定，各級消防機關未依§25-2設安全衛生專責單位或置專責人員，或未建置安全衛生管理系統、未提供必要防護設備或措施，經中央主管機關或上級機關通知限期改善，屆期未改善者，處3萬元以上30萬元以下罰鍰。本條係以行政機關為處罰對象，且以「先通知限期改善」為前提，其餘金額均非本條所定。", "ref": "消防法§43-2", "evidence": "經中央主管機關或上級機關通知限期改善，屆期未改善者，處新臺幣三萬元以上三十萬元以下罰鍰", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-010", "subject": "刑事法", "topic": "消防法", "stem": "某儲存化學品之倉庫管理權人，對於具有危害性之化學品，未於該場所明顯位置設置危害風險標示板，依消防法應處管理權人新臺幣多少罰鍰？", "opts": {"A": "2萬元以上150萬元以下", "B": "2萬元以上30萬元以下", "C": "5萬元以上300萬元以下", "D": "10萬元以上500萬元以下"}, "answer": "A", "explain": "113年增訂§21-2，工廠、儲存化學品之倉庫及儲存場所之管理權人應於明顯位置設置危害風險標示板，並於風險變動時即時更新。違反者依§43-1第4項，處管理權人2萬元以上150萬元以下罰鍰。5萬至300萬為火災時未提供平面配置圖，10萬至500萬為未提供化學品種類數量等資訊之罰鍰，易混淆。", "ref": "消防法§43-1", "evidence": "或設置標示板違反同條第二項公告有關等級、內容、顏色、大小或設置位置之規定者，處管理權人新臺幣二萬元以上一百五十萬元以下罰鍰", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-011", "subject": "刑事法", "topic": "消防法", "stem": "依消防法第21條之1規定，消防指揮人員搶救火災時，其管理權人負有提供搶救必要資訊義務之「一定規模以上之實驗室或倉庫」，由何者公告之？", "opts": {"A": "中央目的事業主管機關會同中央主管機關", "B": "直轄市、縣（市）主管機關", "C": "行政院", "D": "中央主管機關會商目的事業主管機關"}, "answer": "D", "explain": "現行§21-1第1項將適用場所及於「一定規模以上之實驗室或倉庫」，同條第2項規定其範圍由中央主管機關會商目的事業主管機關公告之。主辦者為中央主管機關（內政部），非由目的事業主管機關主辦，亦非地方主管機關或行政院。同條第1項第3款並要求必要資訊依規定更新上傳至指定之網路平臺。", "ref": "消防法§21-1", "evidence": "前項一定規模以上之實驗室或倉庫，由中央主管機關會商目的事業主管機關公告之", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-012", "subject": "刑事法", "topic": "消防法", "stem": "某化學工廠發生火災，管理權人向消防指揮人員提供之場所化學品種類、數量資訊內容虛偽不實，依消防法應處管理權人新臺幣多少罰鍰？", "opts": {"A": "5萬元以上300萬元以下", "B": "50萬元以上1,000萬元以下", "C": "10萬元以上500萬元以下", "D": "2萬元以上150萬元以下"}, "answer": "C", "explain": "§43-1第2項規定，違反§21-1第1項第2款，火災時未提供化學品之種類、數量、位置平面配置圖及搶救必要資訊，或提供資訊虛偽不實者，處10萬元以上500萬元以下罰鍰。5萬至300萬係未提供場所平面配置圖（第1項）；50萬至1,000萬係未立即指派專人到場協助救災（第3項）；2萬至150萬係危害風險標示板（第4項）。", "ref": "消防法§43-1", "evidence": "或提供資訊內容虛偽不實者，處管理權人新臺幣十萬元以上五百萬元以下罰鍰", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-013", "subject": "刑事法", "topic": "消防法", "stem": "某KTV（供營業使用場所）管理權人未依規定維護消防安全設備，於發生火災時致人於死，依消防法其刑責為何？", "opts": {"A": "處6月以上5年以下有期徒刑，得併科新臺幣50萬元以上250萬元以下罰金", "B": "處1年以上7年以下有期徒刑，得併科新臺幣50萬元以上250萬元以下罰金", "C": "處1年以上7年以下有期徒刑，得併科新臺幣100萬元以上500萬元以下罰金", "D": "處3年以上10年以下有期徒刑，得併科新臺幣100萬元以上500萬元以下罰金"}, "answer": "C", "explain": "§35規定場所管理權人有該條各款情形之一，於發生火災時致人於死者，處1年以上7年以下有期徒刑，得併科100萬元以上500萬元以下罰金；致重傷者，處6月以上5年以下有期徒刑，得併科50萬元以上250萬元以下罰金。其餘選項將致死與致重傷之刑度、罰金交錯組合或自創刑度，均屬錯誤。", "ref": "消防法§35", "evidence": "於發生火災時致人於死者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以上五百萬元以下罰金", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-014", "subject": "刑事法", "topic": "消防法", "stem": "依消防法第35條規定，場所之管理權人有下列何種情形，於發生火災時致人於死或重傷者，「不」在該條處罰範圍內？", "opts": {"A": "應設置住宅用火災警報器之旅館、老人福利機構場所，未設置或維護住宅用火災警報器", "B": "一定規模以上之建築物，未依消防防護計畫執行有關避難引導必要之業務", "C": "一定規模以上之場所未依第9條規定委託消防設備師（士）定期檢修消防安全設備", "D": "公共危險物品合計達管制量30倍以上場所，未訂定消防防災計畫"}, "answer": "C", "explain": "§35列舉五款：供營業使用場所未設置或維護消防安全設備、§6第4項場所未設置或維護住宅用火災警報器、一定規模以上建築物未訂消防防護計畫或未執行避難引導、達管制量場所位置構造設備不合規定、30倍以上場所未訂消防防災計畫或未執行避難引導。未依§9定期檢修申報不在列舉之中，屬§38第2項行政罰範圍。", "ref": "消防法§35", "evidence": "第六條第四項所定應設置住宅用火災警報器之場所，未依規定設置或維護住宅用火災警報器", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-015", "subject": "刑事法", "topic": "消防法", "stem": "有關違反消防安全設備、住宅用火災警報器或防焰物品使用規定之處罰，依消防法，下列敘述何者正確？", "opts": {"A": "非供營業使用之場所未設置消防安全設備，逕處管理權人2萬元以上30萬元以下罰鍰，無須先通知限期改善", "B": "地面樓層達11層以上之供營業使用建築物未使用附有防焰標示之窗簾，處管理權人2萬元以上30萬元以下罰鍰，並通知限期改善", "C": "處罰鍰後經通知限期改善，屆期仍不改善者，得予60日以下之停業或停止其使用之處分", "D": "規避、妨礙或拒絕消防機關依法所為之檢查、複查者，處新臺幣1萬元以上5萬元以下罰鍰"}, "answer": "B", "explain": "§37第1項第1款規定供營業使用場所違反§6第1項、第4項或§11第1項者，處2萬元以上30萬元以下罰鍰並通知限期改善，該敘述正確。非供營業使用場所須先通知限期改善、屆期未改善始處罰（第2款）；屆期仍不改善得按次處罰並予「30日以下」停業（第2項）；規避檢查為6千元以上10萬元以下（第3項）。", "ref": "消防法§37", "evidence": "供營業使用之場所，處場所管理權人新臺幣二萬元以上三十萬元以下罰鍰，並通知限期改善", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-016", "subject": "刑事法", "topic": "消防法", "stem": "某一定規模以上之百貨公司（供營業使用）進行室內裝修，致影響原有系統式消防安全設備功能，管理權人卻未責由防火管理人另定施工中消防防護計畫。依消防法，下列何者正確？", "opts": {"A": "應先通知限期改善，屆期未改善者，始處管理權人2萬元以上10萬元以下罰鍰", "B": "處管理權人1萬元以上5萬元以下罰鍰，並得按次處罰", "C": "處管理權人2萬元以上30萬元以下罰鍰；有發生火災致生重大損害之虞者，並得勒令停工", "D": "經勒令停工後，管理權人補訂施工中消防防護計畫即得自行復工，無須報請備查"}, "answer": "C", "explain": "§40第1項規定一定規模以上且供營業使用場所未訂定施工中消防防護計畫者，處管理權人2萬元以上30萬元以下罰鍰；有發生火災致生重大損害之虞者，並得勒令停工，且施工中計畫非經依§13第4項備查不得擅自復工。先限期改善再處2萬至10萬，係非供營業使用場所之規定（§40第3項）。", "ref": "消防法§40", "evidence": "處其管理權人新臺幣二萬元以上三十萬元以下罰鍰；有發生火災致生重大損害之虞者，並得勒令管理權人停工", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-017", "subject": "刑事法", "topic": "消防法", "stem": "有關達管制量公共危險物品及可燃性高壓氣體場所違規之處罰，依消防法，下列敘述何者正確？", "opts": {"A": "儲存、處理或搬運未符合安全管理規定者，僅得處罰管理權人，不得處罰行為人", "B": "場所之位置、構造或設備未符合設置標準規定者，處其管理權人2萬元以上150萬元以下罰鍰", "C": "達管制量30倍以上場所之管理權人未責由保安監督人訂定消防防災計畫，處1萬元以上5萬元以下罰鍰", "D": "經處罰鍰並通知限期改善，屆期仍未改善者，得予6個月以下之停業處分"}, "answer": "B", "explain": "§42第2項規定位置、構造或設備未符合設置標準者，處管理權人2萬元以上150萬元以下罰鍰，該敘述正確。同條第1項儲存、處理或搬運違規，得處「管理權人或行為人」2萬元以上30萬元以下；第4項未責由保安監督人訂定消防防災計畫為2萬元以上30萬元以下；第3項屆期未改善得予「30日以下」停業。", "ref": "消防法§42", "evidence": "其位置、構造或設備未符合同條第二項所定辦法中有關設置標準規定者，處其管理權人新臺幣二萬元以上一百五十萬元以下罰鍰", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-018", "subject": "刑事法", "topic": "消防法", "stem": "受託實施儲存液體公共危險物品儲槽定期檢查之專業機構為不實檢查紀錄，經依法處罰鍰並通知限期改善，屆期仍未改善者，依消防法並得予何種處分？", "opts": {"A": "1個月以上1年以下停止執行業務或廢止許可", "B": "30日以下停止執行業務或廢止許可", "C": "6個月以上2年以下停止執行業務", "D": "沒入其檢查設備並廢止許可"}, "answer": "A", "explain": "§42-3第1項第4款規定專業機構未依規定檢查或為不實檢查紀錄者，處2萬元以上10萬元以下罰鍰並通知限期改善；同條第3項規定屆期未改善者，並得予1個月以上1年以下停止執行業務或廢止許可之處分。「30日以下停止執行業務或廢止許可」係第1項第5款違反執行業務規範等之效果（第4項），易混淆。", "ref": "消防法§42-3", "evidence": "屆期未改善者，並得予一個月以上一年以下停止執行業務或廢止許可之處分", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-019", "subject": "刑事法", "topic": "消防法", "stem": "依消防法第28條規定，參加義勇消防組織人員之安全衛生防護事項，下列何者「不」在得準用之列？", "opts": {"A": "提供執行職務必要之安全衛生防護設備及措施", "B": "職業上原因引發疾病、傷害或死亡事故之即時通報及作成調查紀錄", "C": "消防機關應設安全衛生專責單位及置專責人員", "D": "定期實施特定項目之健康檢查"}, "answer": "C", "explain": "113年修正§28增訂第3項，義勇消防組織人員之安全衛生防護事項，得準用§25-2第2項（建置管理系統、提供防護設備及措施）、§25-4（成效評估、事故通報調查）、§25-6第1項及第3項（健康檢查及其實施方式）。§25-2第1項設專責單位及置專責人員之規定，並未列入準用範圍，故為答案。", "ref": "消防法§28", "evidence": "參加第一項義勇消防組織人員之安全衛生防護事項，得準用第二十五條之二第二項、第二十五條之四、第二十五條之六第一項及第三項規定", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-020", "subject": "刑事法", "topic": "消防法", "stem": "依現行消防法第27條之1有關災害事故調查會之規定，下列敘述何者正確？", "opts": {"A": "僅中央主管機關得組成調查會，直轄市、縣（市）主管機關不得為之", "B": "調查範圍限於消防人員因災害搶救致死亡之事故，義勇消防人員不包括在內", "C": "調查會由相關機關代表及學者專家組成，基層消防團體代表不得參與", "D": "調查之事故包括受傷程度符合公教人員保險失能給付標準之失能等級者"}, "answer": "D",
