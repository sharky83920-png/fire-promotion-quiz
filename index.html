 "第19條之1所定應立即完成通報之廠區，係以公共危險物品合計達管制量300倍以上為標準", "B": "製造、儲存及處理公共危險物品合計達管制量30倍以上場所之管理權人，應遴用保安監督人及保安檢查員", "C": "依第13條遴用之防火管理人，縱具備保安監督人資格，亦不得兼任保安監督人", "D": "保安監督人及保安檢查員遴用後，應於次日起30日內報請場所所在地主管機關備查"}, "answer": "B", "explain": "§15-6第1項規定合計達管制量30倍以上場所應遴用保安監督人及保安檢查員，該敘述正確。§19-1第1項第2款之通報門檻為管制量「三千倍」以上；§15-6第5項規定防火管理人具備保安監督人資格者「得兼任」；同條第4項報請備查期限為遴用之次日起「15日」內。", "ref": "消防法§15-6", "evidence": "製造、儲存及處理公共危險物品合計達管制量三十倍以上場所之管理權人，應遴用保安監督人及保安檢查員辦理下列事項", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-034", "subject": "刑事法", "topic": "消防法", "stem": "某石油化工原料製造業廠區發生公共危險物品漏逸，管理權人未立即依中央主管機關公告之對象、方式完成通報，依消防法應處管理權人新臺幣多少罰鍰？", "opts": {"A": "2萬元以上10萬元以下", "B": "5萬元以上300萬元以下", "C": "50萬元以上1,000萬元以下", "D": "10萬元以上50萬元以下"}, "answer": "D", "explain": "§19-1第1項規定石油煉製業、石油化工原料製造業等廠區發生火災、爆炸或公共危險物品漏逸時，管理權人應立即完成通報。§35-1第1項規定未立即通報者處管理權人10萬元以上50萬元以下罰鍰；同條第2項規避、妨礙或拒絕主管機關人員車輛進入者，處2萬元以上10萬元以下，兩者易混淆。", "ref": "消防法§35-1", "evidence": "未立即依中央主管機關公告之對象、方式或內容完成通報者，處管理權人新臺幣十萬元以上五十萬元以下罰鍰", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-035", "subject": "刑事法", "topic": "消防法", "stem": "主管機關為執行緊急救護任務，依法向電信事業調取待救者通信紀錄；經辦人員無正當理由洩漏其所知悉資料之內容者，依消防法應處新臺幣多少罰鍰？", "opts": {"A": "1萬元以上5萬元以下", "B": "2萬元以上10萬元以下", "C": "6千元以上3萬元以下", "D": "10萬元以上50萬元以下"}, "answer": "B", "explain": "§18第3項授權主管機關得向電信事業調取待救者通信紀錄及個人相關資訊；第4項課予主管機關及電信事業經辦人員保密義務。違反者依§35-2，處2萬元以上10萬元以下罰鍰。1萬至5萬為無故撥打報案電話或謊報之罰鍰（§36）；10萬至50萬為未立即通報之罰鍰（§35-1）。", "ref": "消防法§35-2", "evidence": "無正當理由洩漏其經辦相關作業之過程或所知悉資料之內容者，處新臺幣二萬元以上十萬元以下罰鍰", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-036", "subject": "刑事法", "topic": "消防法", "stem": "消防人員為搶救火災，破壞某民宅鐵門進入救人，依消防法第19條規定，下列敘述何者正確？", "opts": {"A": "消防人員須先取得屋主同意，始得損壞其建築物", "B": "人民財產因此遭受特別犧牲之損失時得請求補償，但因可歸責於該人民之事由者，不予補償", "C": "人民財產之損失，由執行搶救之消防人員個人負賠償責任", "D": "人民不論有無可歸責之事由，均得請求全額補償"}, "answer": "B", "explain": "§19第1項規定消防人員因緊急救護、搶救火災，非進入、使用、損壞或限制使用人民財產不能達目的時，得逕為之，無須事先取得同意。第2項規定人民因此致財產遭受特別犧牲之損失時得請求補償，但因可歸責於該人民之事由者不予補償，屬國家損失補償，非由消防人員個人賠償。", "ref": "消防法§19", "evidence": "致其財產遭受特別犧牲之損失時，得請求補償。但因可歸責於該人民之事由者，不予補償", "src": "new"}, {"id": "N-消防-037", "subject": "刑事法", "topic": "消防法", "stem": "民眾違反主管機關依消防法第14條所定施放天燈之禁止區域、時間規定，依消防法應處新臺幣多少罰鍰？", "opts": {"A": "3千元以上1萬5千元以下", "B": "1萬元以上5萬元以下", "C": "3千元以下", "D": "3萬元以上15萬元以下"}, "answer": "C", "explain": "§14第1項規定田野引火燃燒、施放天燈等易致火災之行為，非經許可不得為之；第2項授權主管機關訂定禁止從事之區域、時間等法規。違反者依§41處3千元以下罰鍰。3萬至15萬係違反§14-1以產生火焰方式進行表演之許可辦法者之罰鍰（§41-1），考生易混淆。", "ref": "消防法§41", "evidence": "禁止從事之區域、時間、方式或應遵行事項之規定者，處新臺幣三千元以下罰鍰", "src": "new"}, {"id": "N-消防-038", "subject": "刑事法", "topic": "消防法", "stem": "消防設備師為消防安全設備不實檢修報告，依消防法之處罰，下列何者正確？", "opts": {"A": "處新臺幣3萬元以上15萬元以下罰鍰，並得按次處罰；必要時並得廢止其證書", "B": "處新臺幣1萬元以上5萬元以下罰鍰，並通知限期改善；屆期未改善者得按次處罰", "C": "處新臺幣2萬元以上10萬元以下罰鍰；必要時並得予30日以下停止執行業務", "D": "處新臺幣2萬元以上10萬元以下罰鍰，並得按次處罰；必要時並得予1個月以上1年以下停止執行業務"}, "answer": "D", "explain": "§38第3項規定檢修專業機構、消防設備師或消防設備士未依規定檢修或為不實檢修報告者，處2萬元以上10萬元以下罰鍰並得按次處罰，必要時並得予1個月以上1年以下停止執行業務或停業。3萬至15萬為無資格從事設計檢修者（第1項）；1萬至5萬為管理權人未依§9檢修申報者（第2項）。", "ref": "消防法§38", "evidence": "或為消防安全設備不實檢修報告者，處新臺幣二萬元以上十萬元以下罰鍰，並得按次處罰；必要時，並得予以一個月以上一年以下停止執行業務或停業之處分", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-039", "subject": "刑事法", "topic": "消防法", "stem": "有關消防法災害搶救之規定，下列敘述何者正確？", "opts": {"A": "現場各級搶救人員衡酌搶救目的與救災風險後，如現場無人命危害之虞，得不執行危險性救災行動", "B": "救護車輛、裝備、人力配置標準及緊急救護辦法，由直轄市、縣（市）政府定之", "C": "消防栓之保養、維護，由直轄市、縣（市）政府負責", "D": "救災救護指揮中心僅於中央主管機關設置，統籌全國救災救護事宜"}, "answer": "A", "explain": "§20-1第1項規定現場各級搶救人員應於救災安全前提下衡酌搶救目的與風險，如無人命危害之虞得不執行危險性救災行動，該敘述正確。§24第2項救護車輛等配置標準及緊急救護辦法由中央主管機關會同中央目的事業主管機關定之；§17消防栓由自來水事業機構保養維護；§16規定各級消防機關均應設救災救護指揮中心。", "ref": "消防法§20-1", "evidence": "如現場無人命危害之虞，得不執行危險性救災行動", "src": "new"}, {"id": "N-消防-040", "subject": "刑事法", "topic": "消防法", "stem": "某夜店欲於店內以噴出火焰之方式進行表演，依消防法規定，下列敘述何者正確？", "opts": {"A": "由表演者自行向主管機關報備後即可為之", "B": "僅須事前通報轄區消防分隊，無須經許可", "C": "應由場所之管理權人申請主管機關許可後，始得為之", "D": "違反許可辦法所定安全防護措施者，處新臺幣3千元以下罰鍰"}, "answer": "C", "explain": "§14-1第1項規定供公眾使用建築物及中央主管機關公告之場所，非經場所之管理權人申請主管機關許可，不得使用產生火焰、火花或火星等方式進行表演性質活動；申請人為管理權人，且採許可制而非報備制。違反許可辦法之安全防護措施者，依§41-1處3萬元以上15萬元以下罰鍰，3千元以下係§41施放天燈等之罰鍰。", "ref": "消防法§14-1", "evidence": "非經場所之管理權人申請主管機關許可，不得使用以產生火焰、火花或火星等方式，進行表演性質之活動", "src": "new"}, {"id": "N-災防-001", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，震災（含土壤液化）之中央災害防救業務主管機關為下列何者？", "opts": {"A": "經濟部", "B": "內政部", "C": "農業部", "D": "國家科學及技術委員會"}, "answer": "B", "explain": "依第3條第1項第1款，風災、震災（含土壤液化）、火災、爆炸、火山災害之中央災害防救業務主管機關為內政部。A經濟部主管水災、旱災、礦災、工業管線等；C農業部主管寒害、土石流及大規模崩塌、森林火災、動植物疫災；D國家科學及技術委員會非本條所列之主管機關。", "ref": "災防法§3Ⅰ①", "evidence": "風災、震災（含土壤液化）、火災、爆炸、火山災害：內政部。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-002", "subject": "刑事法", "topic": "災害防救法", "stem": "某工業區發生事故，致懸浮微粒物質大量產生、空氣品質嚴重惡化。依災害防救法規定，此類災害之中央災害防救業務主管機關為何？", "opts": {"A": "衛生福利部", "B": "經濟部", "C": "內政部", "D": "環境部"}, "answer": "D", "explain": "依第3條第1項第5款，毒性及關注化學物質災害、懸浮微粒物質災害之中央災害防救業務主管機關為環境部。A衛生福利部主管生物病原災害；B經濟部主管工業管線、公用氣體與油料管線等災害；C內政部主管風災、震災、火災、爆炸、火山災害，均非懸浮微粒物質災害之主管機關。", "ref": "災防法§3Ⅰ⑤", "evidence": "毒性及關注化學物質災害、懸浮微粒物質災害：環境部。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-003", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，輻射災害之中央災害防救業務主管機關為下列何者？", "opts": {"A": "核能安全委員會", "B": "環境部", "C": "經濟部", "D": "國家科學及技術委員會"}, "answer": "A", "explain": "依第3條第1項第7款，輻射災害之中央災害防救業務主管機關為核能安全委員會。B環境部主管毒性及關注化學物質災害、懸浮微粒物質災害；C經濟部主管水災、旱災、礦災、輸電線路災害等；D國家科學及技術委員會並非本條列舉之中央災害防救業務主管機關。", "ref": "災防法§3Ⅰ⑦", "evidence": "七、輻射災害：核能安全委員會。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-004", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，下列災害與其中央災害防救業務主管機關之對應，何者錯誤？", "opts": {"A": "工業管線災害－經濟部", "B": "森林火災－農業部", "C": "火山災害－內政部", "D": "大規模崩塌災害－內政部"}, "answer": "D", "explain": "依第3條第1項第3款，寒害、土石流及大規模崩塌災害、森林火災、動植物疫災之主管機關為農業部，故D大規模崩塌災害對應內政部錯誤。A工業管線災害屬經濟部（第2款）；B森林火災屬農業部（第3款）；C火山災害屬內政部（第1款），均正確。", "ref": "災防法§3Ⅰ", "evidence": "寒害、土石流及大規模崩塌災害、森林火災、動植物疫災：農業部。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-005", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第3條第2項規定，中央災害防救業務主管機關就其主管災害防救業務之權責，下列何者錯誤？", "opts": {"A": "災害防救業務計畫訂定與修正之研擬及執行", "B": "非屬地方行政轄區之災害防救相關業務之執行、協調", "C": "核定全國緊急災害之應變措施", "D": "災害區域跨越二以上直轄市、縣（市）時之協調及處理"}, "answer": "C", "explain": "「核定全國緊急災害之應變措施」係第6條第4款所定行政院中央災害防救會報之任務，並非第3條第2項中央災害防救業務主管機關之權責，故C錯誤。A為第3條第2項第2款；B為第4款；D為第5款所定權責，均正確。", "ref": "災防法§3Ⅱ、§6", "evidence": "四、核定全國緊急災害之應變措施。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-006", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第3條第2項規定，中央災害防救業務主管機關執行災害資源統籌、資訊彙整與防救業務，並應協同下列何機關及相關機關執行全民防救災教育？", "opts": {"A": "內政部", "B": "文化部", "C": "教育部", "D": "國家發展委員會"}, "answer": "C", "explain": "依第3條第2項第6款，中央災害防救業務主管機關應執行災害資源統籌、資訊彙整與防救業務，並應協同教育部及相關機關執行全民防救災教育。A內政部本身即為部分災害之主管機關，非條文所定協同對象；B文化部、D國家發展委員會均非條文明定之協同機關。", "ref": "災防法§3Ⅱ⑥", "evidence": "執行災害資源統籌、資訊彙整與防救業務，並應協同教育部及相關機關執行全民防救災教育。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-007", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，本法第3條第1項未列舉之「其他災害」，其中央災害防救業務主管機關如何決定？", "opts": {"A": "由內政部公告指定之", "B": "依法律規定或由中央災害防救會報指定", "C": "由中央災害防救委員會決議指定", "D": "由行政院災害防救辦公室指定之"}, "answer": "B", "explain": "依第3條第1項第8款，其他災害依法律規定或由中央災害防救會報指定其中央災害防救業務主管機關；第6條第7款亦將此列為中央災害防救會報之任務。A內政部、C中央災害防救委員會、D行政院災害防救辦公室均無指定權限。", "ref": "災防法§3Ⅰ⑧、§6⑦", "evidence": "其他災害：依法律規定或由中央災害防救會報指定之中央災害防救業務主管機關。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-008", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第22條規定，下列何者屬於各級政府平時應依權責實施之「減災」事項？", "opts": {"A": "國際救災支援之配合", "B": "災害防救物資、器材之儲備及檢查", "C": "危險建築物之緊急評估", "D": "老舊建築物之檢查、補強及維護"}, "answer": "D", "explain": "依第22條第1項第5款，老舊建築物、重要公共建築物與災害防救設施、設備之檢查、補強、維護屬減災事項。A國際救災支援之配合、B物資器材之儲備及檢查，均屬第23條整備事項；C危險建築物之緊急評估屬第27條應變事項。", "ref": "災防法§22Ⅰ⑤", "evidence": "五、老舊建築物、重要公共建築物與災害防救設施、設備之檢查、補強、維護及都市災害防救機能之改善。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-009", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第22條規定，有關災害潛勢之公開資料種類、區域、作業程序及其他相關事項之辦法，由下列何者定之？", "opts": {"A": "各中央災害防救業務主管機關", "B": "內政部", "C": "行政院", "D": "直轄市、縣（市）政府"}, "answer": "A", "explain": "依第22條第4項，同條第1項第7款有關災害潛勢之公開資料種類、區域、作業程序等辦法，由各中央災害防救業務主管機關定之，因各類災害潛勢專業不同而分由各主管機關訂定。B內政部僅主管部分災害，C行政院、D直轄市、縣（市）政府均非授權訂定機關。", "ref": "災防法§22Ⅳ", "evidence": "有關災害潛勢之公開資料種類、區域、作業程序及其他相關事項之辦法，由各中央災害防救業務主管機關定之。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-010", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第22條有關減災之規定，下列敘述何者正確？", "opts": {"A": "公共事業應依地區災害防救計畫實施有關減災事項", "B": "減災事項，各級政府應列入各該災害防救計畫", "C": "災害防救志願組織之促進及輔導屬應變事項", "D": "企業持續營運能力之規劃及推動屬整備事項"}, "answer": "B", "explain": "依第22條第2項，減災事項各級政府應列入各該災害防救計畫，B正確。A錯，第3項規定公共事業應依「其災害防救業務計畫」實施減災事項；C錯，災害防救志願組織之促進、輔導屬第1項第9款減災事項；D錯，企業持續營運能力之規劃及推動屬第1項第16款減災事項。", "ref": "災防法§22Ⅱ", "evidence": "前項所定減災事項，各級政府應列入各該災害防救計畫。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-011", "subject": "刑事法", "topic": "災害防救法", "stem": "某天然氣事業經指定為公共事業，未依其災害防救業務計畫實施第22條第3項所定減災事項，致發生重大損害。依災害防救法規定，應處新臺幣多少罰鍰？", "opts": {"A": "3萬元以上15萬元以下", "B": "5萬元以上25萬元以下", "C": "6萬元以上30萬元以下", "D": "10萬元以上50萬元以下"}, "answer": "A", "explain": "依第56條第2款，公共事業違反第22條第3項等規定，未依其災害防救業務計畫實施減災、整備、應變或復原重建事項，致發生重大損害者，處3萬元以上15萬元以下罰鍰。B為第55條違反警戒區域等之額度；D為第54條規避徵用等之額度；C法無此額度。", "ref": "災防法§56②、§22Ⅲ", "evidence": "有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-012", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第48條規定，金融機構承受災區農業相關設施擔保品而由政府補助者，其承受補助之範圍、方式、程序等辦法，由下列何者定之？", "opts": {"A": "農業部會商金融監督管理委員會", "B": "金融監督管理委員會會商農業部", "C": "財政部會商農業部", "D": "內政部會商金融監督管理委員會"}, "answer": "A", "explain": "依第48條第2項後段，承受補助之範圍、方式、程序及其他相關事項之辦法，由農業部會商金融監督管理委員會定之。B主從顛倒；C財政部、D內政部均非本條授權之訂定機關。注意第43條借款展延之辦法才是由金融監督管理委員會會商相關機關定之，勿混淆。", "ref": "災防法§48Ⅱ", "evidence": "有關承受補助之範圍、方式、程序及其他相關事項之辦法，由農業部會商金融監督管理委員會定之。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-013", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第48條規定，有關災區農地、漁塭等農業相關設施貸款擔保品之承受，下列敘述何者正確？", "opts": {"A": "擔保品部分毀損者，金融機構即得予以承受", "B": "金融機構應依擔保品之市價予以承受", "C": "政府就承受金額最高八成之範圍內予以補助", "D": "適用範圍僅限於農地，不包括漁塭"}, "answer": "C", "explain": "依第48條第2項，金融機構承受者，由政府就其承受金額最高八成之範圍內予以補助，C正確。A錯，須擔保品「全部毀損或滅失」；B錯，係「依貸款餘額」予以承受，非依市價；D錯，第1項明定適用於農地、漁塭及其他農業相關設施。", "ref": "災防法§48Ⅰ、Ⅱ", "evidence": "金融機構依前項規定承受者，由政府就其承受金額最高八成之範圍內予以補助。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-014", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第2條之災害定義，下列何者屬於「天然災害」？", "opts": {"A": "森林火災", "B": "動植物疫災", "C": "大規模崩塌災害", "D": "懸浮微粒物質災害"}, "answer": "C", "explain": "依第2條第1款第1目，天然災害包括風災、水災、震災（含土壤液化）、旱災、寒害、土石流及大規模崩塌災害、火山災害，C正確。A森林火災、B動植物疫災、D懸浮微粒物質災害均列於同款第2目，非屬天然災害。森林火災雖與自然環境相關，仍屬第2目之災害。", "ref": "災防法§2①", "evidence": "風災、水災、震災（含土壤液化）、旱災、寒害、土石流及大規模崩塌災害、火山災害等天然災害。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-015", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第2條用詞定義，「災害防救業務計畫」係由下列何者就其掌理業務或事務擬訂之災害防救計畫？", "opts": {"A": "中央災害防救委員會", "B": "直轄市、縣（市）災害防救會報", "C": "行政院災害防救辦公室", "D": "中央災害防救業務主管機關及公共事業"}, "answer": "D", "explain": "依第2條第5款，災害防救業務計畫指由中央災害防救業務主管機關及公共事業就其掌理業務或事務擬訂之災害防救計畫。A中央災害防救委員會負責擬訂災害防救基本計畫；B直轄市、縣（市）災害防救會報核定地區災害防救計畫；C行政院災害防救辦公室為幕僚單位。", "ref": "災防法§2⑤", "evidence": "指由中央災害防救業務主管機關及公共事業就其掌理業務或事務擬訂之災害防救計畫。", "src": "new"}, {"id": "N-災防-016", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關中央災害防救組織之規定，下列敘述何者正確？", "opts": {"A": "中央災害防救會報召集人由內政部部長兼任", "B": "中央災害防救委員會主任委員由行政院副院長兼任", "C": "國家災害防救科技中心執行人員搜救及緊急救護運送", "D": "行政院災害防救辦公室以兼職人員處理有關業務"}, "answer": "B", "explain": "依第7條第2項，行政院設中央災害防救委員會，置主任委員一人，由行政院副院長兼任，B正確。A錯，會報召集人由行政院院長兼任；C錯，執行人員搜救及緊急救護運送任務者為行政院國家搜救指揮中心，科技中心僅提供諮詢；D錯，災害防救辦公室置專職人員。", "ref": "災防法§7", "evidence": "行政院設中央災害防救委員會，置主任委員一人，由行政院副院長兼任", "src": "new"}, {"id": "N-災防-017", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，有關災害防救基本計畫之擬訂與核定，下列何者正確？", "opts": {"A": "由中央災害防救會報擬訂，經行政院核定", "B": "由內政部擬訂，經中央災害防救委員會核定", "C": "由中央災害防救委員會擬訂，經中央災害防救會報核定", "D": "由行政院災害防救辦公室擬訂，經立法院核定"}, "answer": "C", "explain": "依第17條第1項，災害防救基本計畫由中央災害防救委員會擬訂，經中央災害防救會報核定後，由行政院函送各中央災害防救業務主管機關及直轄市、縣（市）政府據以辦理，C正確。A、B將擬訂與核定機關錯置；D立法院僅收受行政院每年送交之災害防救白皮書，並無核定權。", "ref": "災防法§17Ⅰ", "evidence": "災害防救基本計畫由中央災害防救委員會擬訂，經中央災害防救會報核定後", "src": "new"}, {"id": "N-災防-018", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法施行細則規定，中央災害防救委員會檢討災害防救基本計畫，以及直轄市、縣（市）政府檢討地區災害防救計畫，原則上分別應每幾年辦理一次？", "opts": {"A": "每五年；每二年", "B": "每三年；每一年", "C": "每四年；每二年", "D": "每五年；每三年"}, "answer": "A", "explain": "依施行細則第6條，中央災害防救委員會每五年應檢討災害防救基本計畫；依第8條，直轄市、縣（市）政府及鄉（鎮、市）、山地原住民區公所每二年應檢討地區災害防救計畫，必要時均得隨時辦理，A正確。災害防救業務計畫依第7條亦為每二年檢討。B、C、D年數均與規定不符。", "ref": "災防法施行細則§6、§8", "evidence": "中央災害防救委員會每五年應依本法第十七條第二項規定", "src": "new"}, {"id": "N-災防-019", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關災害防救計畫核定與備查之規定，下列何者正確？", "opts": {"A": "公共事業擬訂之災害防救業務計畫，送請中央災害防救會報核定", "B": "中央災害防救業務主管機關之業務計畫，報請行政院院會核定", "C": "直轄市、縣（市）地區災害防救計畫，報中央災害防救委員會備查", "D": "鄉（鎮、市）地區災害防救計畫經會報核定後，報所屬上級會報備查"}, "answer": "D", "explain": "依第20條第4項，鄉（鎮、市）、山地原住民區地區災害防救計畫經各該會報核定後實施，並報所屬上級災害防救會報備查，D正確。A錯，公共事業之業務計畫送請中央目的事業主管機關核定；B錯，應報請中央災害防救會報核定；C錯，直轄市、縣（市）地區計畫應報中央災害防救會報備查。", "ref": "災防法§19、§20", "evidence": "經各該災害防救會報核定後實施，並報所屬上級災害防救會報備查。", "src": "new"}, {"id": "N-災防-020", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，災區範圍公告前，遇有大量受災傷病患須收治之情形時，得由下列何機關劃定大量受災傷病患區域，使該區域受災民眾就醫準用受災就醫醫療費用之規定？", "opts": {"A": "行政院", "B": "內政部", "C": "衛生福利部", "D": "直轄市、縣（市）政府"}, "answer": "C", "explain": "依第45條第2項，災區範圍公告前，遇有大量受災傷病患須收治之情形時，衛生福利部得劃定大量受災傷病患區域，該區域受災民眾就醫準用第1項規定，C正確。A行政院係負責公告災區範圍（第51條）；B內政部、D直轄市、縣（市）政府均無本項劃定權限。", "ref": "災防法§45Ⅱ", "evidence": "災區範圍公告前，遇有大量受災傷病患須收治之情形時，衛生福利部得劃定大量受災傷病患區域", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-021", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，中央災害應變中心得視災情研判情況或聯繫需要，於地方災害應變中心或適當地點成立下列何者，以整合救災資源，協助地方政府執行救災事宜？", "opts": {"A": "前進指揮所", "B": "前進協調所", "C": "緊急應變小組", "D": "備援應變中心"}, "answer": "B", "explain": "依第13條第2項，中央災害應變中心得於地方災害應變中心或適當地點成立前進協調所，B正確。A前進指揮所係第12條由地方政府及公所視需要成立；C緊急應變小組係第14條由計畫指定之機關、單位或公共事業設置；D備援應變中心係第28條第3項為免中央災害應變中心無法運作而異地設置。", "ref": "災防法§13Ⅱ", "evidence": "於地方災害應變中心或適當地點成立前進協調所，整合救災資源，協助地方政府執行救災事宜。", "src": "new"}, {"id": "N-災防-022", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關地方災害應變中心之規定，下列敘述何者錯誤？", "opts": {"A": "直轄市、縣（市）政府首長應視災害規模成立並擔任指揮官", "B": "得視需要成立前進指揮所，就近處理救災及後勤支援", "C": "其成立時機、程序及編組，由內政部統一定之", "D": "鄉（鎮、市）公所首長亦應視災害規模成立災害應變中心"}, "answer": "C", "explain": "依第12條第2項，地方災害應變中心或前進指揮所之成立時機、程序及編組，由直轄市、縣（市）政府及鄉（鎮、市）、山地原住民區公所定之，非由內政部統一訂定，故C錯誤。A、D見第12條第1項首長應視災害規模成立並擔任指揮官；B同項後段得視需要成立前進指揮所。", "ref": "災防法§12", "evidence": "前項災害應變中心或前進指揮所成立時機、程序及編組，由直轄市、縣（市）政府及鄉（鎮、市）、山地原住民區公所定之。", "src": "new"}, {"id": "N-災防-023", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關各級災害應變中心運作之規定，下列敘述何者錯誤？", "opts": {"A": "參與編組機關首長應依規定親自或指派權責人員進駐", "B": "各級災害應變中心應有固定之運作處所並作定期演練", "C": "為免中央災害應變中心無法運作，應異地設置備援應變中心", "D": "中央災害應變中心指揮官由該業務主管機關首長當然擔任"}, "answer": "D", "explain": "依第13條第1項，中央災害防救業務主管機關首長決定中央災害應變中心開設時機及分級，成立後立即報告中央災害防救會報召集人，並由召集人指定指揮官，非由首長當然擔任，故D錯誤。A為第28條第1項；B為第28條第2項；C為第28條第3項，均正確。", "ref": "災防法§13Ⅰ、§28", "evidence": "應於成立後，立即報告中央災害防救會報召集人，並由召集人指定指揮官。", "src": "new"}, {"id": "N-災防-024", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法施行細則規定，各級政府應充實災害應變中心固定運作處所之資訊、通信等災害防救器材、設備，其功能測試及演練之最低頻率為何？", "opts": {"A": "每月測試一次；每半年演練一次", "B": "每週測試一次；每季演練一次", "C": "每月測試一次；每年演練一次", "D": "每季測試一次；每年演練一次"}, "answer": "A", "explain": "依施行細則第13條，各級政府應依本法第28條第2項，充實災害應變中心固定運作處所之資訊、通信等器材設備，隨時保持堪用狀態，並每月至少實施功能測試一次，每半年至少舉辦演練一次，並得隨時為之，A正確。B、C、D之頻率均與規定不符。", "ref": "災防法施行細則§13", "evidence": "每月至少實施功能測試一次，每半年至少舉辦演練一次", "src": "new"}, {"id": "N-災防-025", "subject": "刑事法", "topic": "災害防救法", "stem": "颱風即將登陸，某鎮公所研判轄內山區聚落有發生土石流之虞，擬依災害防救法第24條第1項處理居民撤離事宜。下列敘述何者正確？", "opts": {"A": "勸告或強制撤離之權限，專屬於中央災害應變中心指揮官", "B": "鎮公所於有發生災害之虞時，即應勸告或強制居民撤離並作適當安置", "C": "居民拒絕撤離者，得依第55條處新臺幣5萬元以上25萬元以下罰鍰", "D": "強制撤離須先報經中央災害防救會報核定後，始得為之"}, "answer": "B", "explain": "依第24條第1項，直轄市、縣（市）政府及鄉（鎮、市、區）公所於災害發生或有發生之虞時，應勸告或強制其撤離並作適當安置，B正確。A錯，鎮公所即有權限；C錯，第55條第1款僅處罰違反第24條第2項之強制措施或處置，未及於第1項撤離；D錯，法無須先經核定之規定。", "ref": "災防法§24Ⅰ", "evidence": "山地原住民區公所於災害發生或有發生之虞時，應勸告或強制其撤離，並作適當之安置。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-026", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第30條規定，各級政府成立災害應變中心後，指揮官於災害應變範圍內得實施之事項，下列何者錯誤？", "opts": {"A": "徵用、徵購民間搜救犬、救災機具等裝備", "B": "國外救災組織來臺協助救災之申請、接待及協調聯繫", "C": "災情之彙整、統計、陳報及評估", "D": "捐贈物資、款項之分配與管理及救助金之發放"}, "answer": "D", "explain": "「捐贈物資、款項之分配與管理及救助金之發放」係第37條第1項第4款災後復原重建事項，非第30條第1項指揮官於應變範圍內實施之事項，故D錯誤。A為第30條第1項第5款；B為第9款；C為第10款，均屬指揮官得實施之事項。", "ref": "災防法§30Ⅰ、§37Ⅰ④", "evidence": "四、捐贈物資、款項之分配與管理及救助金之發放。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-027", "subject": "刑事法", "topic": "災害防救法", "stem": "颱風期間，某登山客未取得臨時通行證，擅自進入應變中心指揮官依法劃定之警戒區域，受困後經災害應變中心搜救獲救。依災害防救法規定，下列敘述何者正確？", "opts": {"A": "各級政府得就搜救所生費用，以書面命獲救者繳納", "B": "搜救屬政府法定職責，所生費用一律不得向獲救者求償", "C": "搜救費用之計算、分擔等辦法，由交通部定之", "D": "須經法院判決確定後，始得命獲救者繳納搜救費用"}, "answer": "A", "explain": "依第30條第3項，違反第1項第2款、第3款規定致遭遇危難，經各級災害應變中心搜救獲救者，各級政府得就搜救所生費用，以書面命獲救者或可歸責之業者繳納，A正確。B錯，法有明文得命繳納；C錯，辦法由內政部定之；D錯，以書面命繳納即可，無須法院判決。", "ref": "災防法§30Ⅲ", "evidence": "各級政府得就搜救所生費用，以書面命獲救者或可歸責之業者繳納", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-028", "subject": "刑事法", "topic": "災害防救法", "stem": "颱風期間，某縣政府為實施災害應變措施，依災害防救法第31條第1項命轄內某倉儲業者保管救災所需之沙包及飲用水，該業者拒絕之。依法應處新臺幣多少罰鍰？", "opts": {"A": "3萬元以上15萬元以下", "B": "5萬元以上25萬元以下", "C": "10萬元以上50萬元以下", "D": "30萬元以上50萬元以下"}, "answer": "C", "explain": "依第54條第2款，違反第31條第3項規定，規避、妨礙或拒絕各級政府依同條第1項所為徵用、徵購或命其保管之處分者，處10萬元以上50萬元以下罰鍰，C正確。A為拒絕第31條第2項檢查之額度（第56條）；B為第55條之額度；D為第53條第2項明知不實而通報之罰金額度。", "ref": "災防法§54②", "evidence": "有下列情形之一者，處新臺幣十萬元以上五十萬元以下罰鍰：", "src": "new"}, {"id": "N-災防-029", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法罰則規定，下列違規行為與罰鍰額度之對應，何者正確？", "opts": {"A": "擅自使用緊急應變警報訊號：3萬元以上15萬元以下", "B": "規避指揮官所為之徵調處分：5萬元以上25萬元以下", "C": "拒絕政府派員進入業者處所檢查：3萬元以上15萬元以下", "D": "拒絕危險建築物之拆除處分：10萬元以上50萬元以下"}, "answer": "C", "explain": "依第56條第1款，規避、妨礙或拒絕各級政府依第31條第2項所為之檢查，處3萬元以上15萬元以下罰鍰，C正確。A錯，擅用警報訊號依第55條第5款處5萬元以上25萬元以下；B錯，規避徵調依第54條第1款處10萬元以上50萬元以下；D錯，拒絕拆除依第55條第4款處5萬元以上25萬元以下。", "ref": "災防法§54～§56", "evidence": "違反第三十一條第三項規定，規避、妨礙或拒絕各級政府依同條第二項規定所為之檢查。", "src": "new"}, {"id": "N-災防-030", "subject": "刑事法", "topic": "災害防救法", "stem": "重大震災後，某甲於社群媒體散播「水庫即將潰堤」之災害謠言，足生損害於公眾。依災害防救法規定，某甲之法定刑為何？", "opts": {"A": "1年以下有期徒刑、拘役或新臺幣30萬元以下罰金", "B": "2年以下有期徒刑、拘役或新臺幣50萬元以下罰金", "C": "3年以下有期徒刑、拘役或新臺幣100萬元以下罰金", "D": "5年以下有期徒刑、拘役或新臺幣300萬元以下罰金"}, "answer": "C", "explain": "依第53條第3項，散播有關災害之謠言或不實訊息，足生損害於公眾或他人者，處3年以下有期徒刑、拘役或新臺幣100萬元以下罰金，C正確。A、B、D刑度與罰金額度均與規定不符。另須區辨同條第2項明知不實而通報消防或警察單位者，係科30萬元以上50萬元以下罰金。", "ref": "災防法§53Ⅲ", "evidence": "散播有關災害之謠言或不實訊息，足生損害於公眾或他人者，處三年以下有期徒刑、拘役或新臺幣一百萬元以下罰金。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-031", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，散播有關災害之謠言或不實訊息足生損害於公眾或他人，因而致人於死或致重傷者，其法定刑分別為何？", "opts": {"A": "致死：無期徒刑或10年以上有期徒刑；致重傷：5年以上12年以下有期徒刑", "B": "致死：無期徒刑或7年以上有期徒刑；致重傷：3年以上10年以下有期徒刑", "C": "致死：死刑、無期徒刑或10年以上有期徒刑；致重傷：3年以上10年以下有期徒刑", "D": "致死：7年以上有期徒刑；致重傷：1年以上7年以下有期徒刑"}, "answer": "B", "explain": "依第53條第4項，犯同條第3項散播災害謠言或不實訊息之罪，因而致人於死者，處無期徒刑或7年以上有期徒刑；致重傷者，處3年以上10年以下有期徒刑，B正確。A、C、D之刑度均與規定不符，其中C之死刑並非本項法定刑。", "ref": "災防法§53Ⅳ", "evidence": "處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-032", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第53條第1項規定，乘災害之際而故犯下列何罪，不在「得依刑法之規定，加重其刑至二分之一」之列？", "opts": {"A": "竊盜罪", "B": "詐欺罪", "C": "恐嚇取財罪", "D": "侵占罪"}, "answer": "D", "explain": "依第53條第1項，乘災害之際而故犯竊盜、詐欺、恐嚇取財、搶奪、強盜之罪者，得依刑法之規定加重其刑至二分之一。侵占罪不在列舉範圍內，故D為正解。A竊盜、B詐欺、C恐嚇取財均為本項明定得加重之罪；加重上限為二分之一，亦為常考數字。", "ref": "災防法§53Ⅰ", "evidence": "乘災害之際而故犯竊盜、詐欺、恐嚇取財、搶奪、強盜之罪者，得依刑法之規定，加重其刑至二分之一。", "src": "new"}, {"id": "N-災防-033", "subject": "刑事法", "topic": "災害防救法", "stem": "人民因災害應變中心指揮官劃定警戒區域之處分，致其財產遭受損失而請求補償。依災害防救法規定，下列敘述何者正確？", "opts": {"A": "損失補償得以實物或勞務代替金錢為之", "B": "損失補償以補償實際所受之損失為限", "C": "損失可歸責於該人民者，仍得請求全額補償", "D": "應向中央災害防救會報請求損失補償"}, "answer": "B", "explain": "依第34條第2項，損失補償應以金錢為之，並以補償實際所受之損失為限，B正確。A錯，應以金錢為之；C錯，第1項但書規定因可歸責於該人民之事由者，不得請求；D錯，第3項規定應以書面敘明理由向「該執行機關」請求，非向中央災害防救會報。", "ref": "災防法§34", "evidence": "前項損失補償，應以金錢為之，並以補償實際所受之損失為限。", "src": "new"}, {"id": "N-災防-034", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關支援協助及國軍支援之規定，下列敘述何者正確？", "opts": {"A": "縣（市）政府無法因應災害時得申請國軍支援，但重大災害時國軍應主動協助", "B": "國防部依災害防救需要，不得運用應召之後備軍人支援災害防救", "C": "申請國軍支援或國軍主動協助救災之辦法，由內政部會同國防部定之", "D": "鄉（鎮、市）公所無法因應災害時，由中央主管機關主動派員協助"}, "answer": "A", "explain": "依第35條第4項，直轄市、縣（市）政府及中央災害防救業務主管機關無法因應時得申請國軍支援，但發生重大災害時國軍應主動協助，A正確。B錯，第5項國防部得運用應召之後備軍人；C錯，辦法由國防部會同內政部定之；D錯，第1項規定由直轄市、縣政府主動派員協助。", "ref": "災防法§35", "evidence": "無法因應災害處理時，得申請國軍支援。但發生重大災害時，國軍應主動協助災害防救。", "src": "new"}, {"id": "N-災防-035", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第43條規定，金融機構對災區受災居民於災害前已辦理之借款，其本金償還期限予以展延，致其放款期限超過多少年者，不受銀行法第38條規定之限制？", "opts": {"A": "三十年", "B": "二十年", "C": "二十五年", "D": "四十年"}, "answer": "A", "explain": "依第43條第2項，本金償還期限展延致其放款期限超過三十年者，不受銀行法第三十八條規定之限制，A正確。B、C、D年數均與規定不符。另同條第1項規定展延期間之利息應免予計收並由中央政府補貼，相關辦法由金融監督管理委員會會商相關機關定之。", "ref": "災防法§43Ⅱ", "evidence": "前項本金償還期限展延致其放款期限超過三十年者，不受銀行法第三十八條規定之限制。", "src": "new"}, {"id": "N-災防-036", "subject": "刑事法", "topic": "災害防救法", "stem": "災區受災企業於其復工營業計畫範圍內所需營業資金向金融機構貸款，必要時由相關信用保證基金提供信用保證。依災害防救法規定，其信用保證成數及保證手續費為何？", "opts": {"A": "八成；保證手續費減半計收", "B": "九成；保證手續費免向受災企業計收", "C": "七成；保證手續費由政府補貼半數", "D": "十成；保證手續費照常計收"}, "answer": "B", "explain": "依第49條第7項，前項貸款必要時由相關信用保證基金提供信用保證，信用保證成數為九成，送保期間保證手續費免向受災企業計收，B正確。A、C、D之成數及手續費處理方式均與規定不符。另須區辨第48條農業擔保品承受之政府補助上限為最高八成。", "ref": "災防法§49Ⅶ", "evidence": "信用保證成數為九成，送保期間保證手續費免向受災企業計收。", "src": "new"}, {"id": "N-災防-037", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關災區受災居民稅捐優惠及災區之規定，下列敘述何者錯誤？", "opts": {"A": "災區範圍由行政院公告並刊登政府公報", "B": "受災居民自政府或民間領取之救助金、慰問金免納所得稅", "C": "前述救助金不得作為扣押、抵銷或強制執行之標的", "D": "災區土地及建築物減免地價稅、房屋稅之條件，由財政部定之"}, "answer": "D", "explain": "依第44條第4項，災區土地及建築物減免地價稅及房屋稅之一定條件、減免期限及範圍，由災區之直轄市、縣（市）政府以自治條例定之，並報財政部備查，非由財政部訂定，故D錯誤。A見第51條；B見第44條第1項；C見第44條第5項，均正確。", "ref": "災防法§44Ⅳ", "evidence": "前項一定條件、減免期限及範圍，由災區之直轄市、縣（市）政府以自治條例定之，並報財政部備查。", "src": "new"}, {"id": "N-災防-038", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第61條規定，執行災害防救事項人員因執行職務死亡，或因傷病致重度身心障礙以上者，分別給與一次撫卹金或一次身心障礙給付多少基數？", "opts": {"A": "90個基數；36個基數", "B": "100個基數；40個基數", "C": "90個基數；30個基數", "D": "72個基數；36個基數"}, "answer": "A", "explain": "依第61條第1項第3款，死亡者給與一次撫卹金九十個基數；依第2款第1目，重度身心障礙以上者給與三十六個基數，A正確。中度為十八個基數、輕度為八個基數；基數以公務人員委任第五職等年功俸最高級月支俸額為準。B、C、D之基數均與規定不符。", "ref": "災防法§61Ⅰ②③", "evidence": "三、死亡者：給與一次撫卹金九十個基數。", "src": "new"}, {"id": "N-災防-039", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第62條規定，對因災害失蹤之人聲請法院確定其死亡及死亡時間，其聲請期限及法院公示催告之陳報期間，下列何者正確？", "opts": {"A": "災害發生後6個月內；2星期以上1個月以下", "B": "災害發生後1年內；3星期以上2個月以下", "C": "災害發生後1年內；1個月以上3個月以下", "D": "災害發生後2年內；3星期以上2個月以下"}, "answer": "B", "explain": "依第62條第2項，聲請應於災害發生後一年內為之；依第5項，法院准許聲請者應公示催告，其陳報期間應定為自揭示之日起三星期以上二個月以下，B正確。A、C、D之期限或陳報期間均與規定不符。另失蹤人以法院裁定所確定死亡之時，推定其為死亡。", "ref": "災防法§62Ⅱ、Ⅴ", "evidence": "其陳報期間，應定為自揭示之日起三星期以上二個月以下。", "src": "new"}, {"id": "N-災防-040", "subject": "刑事法", "topic": "災害防救法", "stem": "災區受災民眾對就其所受損害依法應負賠償責任之人提起民事訴訟，為保全強制執行而聲請假扣押時，依災害防救法規定，法院所命供之擔保不得高於請求標的金額或價額之多少？", "opts": {"A": "二分之一", "B": "三分之一", "C": "五分之一", "D": "十分之一"}, "answer": "D", "explain": "依第50條第2項，受災民眾為保全強制執行而聲請假扣押或假處分者，法院所命供之擔保不得高於請求標的金額或價額之十分之一，D正確；該擔保並得由主管機關出具保證書代之。A、B、C比例均與規定不符。另同條第1項規定起訴暫免繳納裁判費。", "ref": "災防法§50Ⅱ", "evidence": "法院依民事訴訟法所命供之擔保，不得高於請求標的金額或價額之十分之一。", "src": "new"}, {"id": "F-N1-001", "topic": "燃燒", "stem": "從火災學的立場，「燃燒」最適切的定義為何？", "opts": {"A": "只要有氧化反應發生即屬之", "B": "伴同發熱與發光之氧化現象", "C": "伴同發熱但不需發光之還原現象", "D": "物質吸收熱量後產生之相變化"}, "answer": "B", "explain": "火災學定義燃燒為伴同發熱與發光的氧化現象，必須同時發熱、發光且為氧化；單純氧化或吸熱相變都不符合。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-002", "topic": "燃燒", "stem": "下列何種現象依火災學定義屬於燃燒？", "opts": {"A": "鐵板在潮濕環境中生銹", "B": "鎳線通電後的赤熱現象", "C": "酒精點火後產生火焰", "D": "食鹽溶於水中"}, "answer": "C", "explain": "酒精燃燒同時發熱發光且為氧化；鐵生銹沒有發熱發光、鎳線赤熱並非伴同發光之氧化燃燒，故均非燃燒。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-003", "topic": "滅火", "stem": "燃燒四要素與滅火方法的對應，下列何者正確？", "opts": {"A": "可燃物－窒息法", "B": "熱能－移除法", "C": "助燃物－冷卻法", "D": "連鎖反應－抑制法"}, "answer": "D", "explain": "可燃物對移除法、助燃物（氧）對窒息法、熱能對冷卻法、連鎖反應對抑制法。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-004", "topic": "滅火", "stem": "下列四種滅火方法中，何者屬於化學性滅火？", "opts": {"A": "冷卻法", "B": "窒息法", "C": "抑制法", "D": "移除法"}, "answer": "C", "explain": "抑制法是移除火場自由基以中斷連鎖反應，屬化學作用；其餘三者都是物理作用。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-005", "topic": "滅火", "stem": "森林火災時開闢防火巷以避免林木延燒，係運用何種滅火原理？", "opts": {"A": "窒息法", "B": "移除法（隔離法）", "C": "冷卻法", "D": "抑制法"}, "answer": "B", "explain": "開闢防火巷是把可燃物移開、斷絕供應，屬移除法（隔離法）。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-006", "topic": "滅火", "stem": "以惰性氣體進行窒息滅火時，一般認為須將空氣中氧濃度由 21% 降至約多少，火即熄滅？", "opts": {"A": "18%", "B": "10%", "C": "5%", "D": "15%"}, "answer": "D", "explain": "窒息法是加入惰性氣體使氧濃度由 21% 降至 15% 左右，火即熄滅。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-007", "topic": "燃燒", "stem": "以莫耳燃燒熱與熱傳導率定義可燃物時，其條件為何？", "opts": {"A": "發熱量 100 kcal/mole 以上，且熱傳導率約 0.001 kcal/cm·sec·℃ 以下", "B": "發熱量 100 kcal/mole 以下，且熱傳導率約 0.001 kcal/cm·sec·℃ 以上", "C": "發熱量 10 kcal/mole 以上，且熱傳導率約 0.01 kcal/cm·sec·℃ 以下", "D": "發熱量 100 kcal/mole 以上，或熱傳導率約 0.001 kcal/cm·sec·℃ 以下"}, "answer": "A", "explain": "發熱量須在 100 kcal/mole「以上」、熱傳導率約 0.001 kcal/cm·sec·℃「以下」，且兩條件必須同時成立（不是「或」）。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-008", "topic": "燃燒", "stem": "反應熱 ΔH 定義為（生成物總熱含量）－（反應物總熱含量），則燃燒反應的 ΔH 應為何？", "opts": {"A": "ΔH ＞ 0", "B": "ΔH ＝ 0", "C": "視可燃物種類而正負不定", "D": "ΔH ＜ 0"}, "answer": "D", "explain": "燃燒是放熱反應，生成物熱含量低於反應物，故 ΔH ＜ 0；ΔH ＞ 0 為吸熱反應。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-009", "topic": "熱傳", "stem": "一般物質熱傳導率大小的順序為何？", "opts": {"A": "氣態 ＞ 液態 ＞ 固態", "B": "液態 ＞ 固態 ＞ 氣態", "C": "三態熱傳導率大致相同", "D": "固態 ＞ 液態 ＞ 氣態"}, "answer": "D", "explain": "熱傳導率為物質直接傳導熱量的能力，固態最大、氣態最小；燃燒難易則相反，氣體最易燃。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-010", "topic": "熱傳", "stem": "同為固體，粉狀物質比塊狀物質容易燃燒，其主要原因為何？", "opts": {"A": "熱傳導率增高，熱容易傳遞至內部", "B": "熱傳導率減低，熱容易蓄積而增高溫度", "C": "粉狀物質之莫耳燃燒熱較大", "D": "粉狀物質之活化能較高"}, "answer": "B", "explain": "物質分割得愈細小，熱傳導率愈低、熱不易散失而蓄積，溫度快速上升，故較易點燃。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-011", "topic": "燃燒", "stem": "反應式 H₂ ＋ Cl₂ → 2HCl 中，扮演助燃物角色的是何者？", "opts": {"A": "Cl₂", "B": "H₂", "C": "HCl", "D": "此反應無助燃物"}, "answer": "A", "explain": "氫氣在氯中燃燒，H₂ 為可燃物、Cl₂ 為助燃物，說明助燃物不限於氧。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-012", "topic": "燃燒", "stem": "所謂「活化能」係指下列何者？", "opts": {"A": "發生化學反應所需的最低能量", "B": "化學反應放出的總熱量", "C": "生成物與反應物的熱含量差", "D": "維持燃燒持續五秒以上所需之能量"}, "answer": "A", "explain": "活化能是反應物越過能障所需的最低能量；不論吸熱或放熱反應都須克服，與反應熱 ΔH 不同。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-013", "topic": "燃燒", "stem": "連鎖反應的三個步驟中，「傳播步驟」代表自由基的何種反應？", "opts": {"A": "增值反應", "B": "生成反應", "C": "消除反應", "D": "中和反應"}, "answer": "A", "explain": "起始步驟為自由基生成、傳播步驟為自由基增值、終止步驟為自由基消除。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-014", "topic": "爆炸", "stem": "一個自由基消失後能產生二個或多個新自由基的連鎖反應稱為分支鏈鎖反應，此種反應有何特性？", "opts": {"A": "易造成爆炸現象", "B": "反應速率固定不變", "C": "屬一般火災之燃燒型態", "D": "反應無法自行持續"}, "answer": "A", "explain": "分支鏈鎖反應自由基數目倍增，易造成爆炸（如 H₂ 與 O₂）；一般火災屬非分支（直鏈）反應。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-015", "topic": "燃燒", "stem": "氫氣與氯氣之連鎖反應中，屬於起始步驟的反應式為何？", "opts": {"A": "H₂ ＋ Cl· → HCl ＋ H·", "B": "Cl₂ ＋ hν → 2Cl·", "C": "H· ＋ Cl₂ → HCl ＋ Cl·", "D": "H· ＋ Cl· → HCl"}, "answer": "B", "explain": "起始步驟是 Cl₂ 受光裂解生成 Cl·；後兩式之 H₂＋Cl·、H·＋Cl₂ 為傳播步驟，H·＋Cl· 為終止步驟。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-016", "topic": "爆炸", "stem": "氫氣與氧氣之分支鏈鎖反應中，何者為「消失一個自由基、產生兩個自由基」的分支點？", "opts": {"A": "OH· ＋ H₂ → H₂O ＋ H·", "B": "H· ＋ O₂ → OH· ＋ O·", "C": "H· ＋ H· → H₂", "D": "HO₂· ＋ OH· → H₂O ＋ O₂"}, "answer": "B", "explain": "H· 與 O₂ 反應生成 OH· 與 O· 兩個自由基，為分支點；其餘分別為一對一傳播或終止步驟。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-017", "topic": "燃燒", "stem": "可燃物與氧要起化合作用必須達到一定溫度，此種供給熱能之物稱為何？", "opts": {"A": "助燃物", "B": "氧化劑", "C": "觸媒", "D": "點火源（發火源）"}, "answer": "D", "explain": "供給熱能使可燃物達到反應溫度者稱為點火源（發火源）。", "ref": "火災學筆記第1講", "subject": "火災學", "src": "new"}, {"id": "F-N1-018", "topic": "燃燒", "stem": "空氣中氧氣的重量百分比濃度，一般慣用值為何？", "opts": {"A": "21%", "B": "79%", "C": "23.2%", "D": "15%"}, "answer": "C", "explain": "空氣中氧的體積百分比為 21%、重量百分比為 23.2%；79% 為氮之體積百分比、15% 為窒息滅火之氧濃度。", "ref": "火災學筆記第2講", "subject": "火災學", "src": "new"}, {"id": "F-N1-019", "topic": "燃燒", "stem": "所謂標準狀態（STP）及該狀態下 1 莫耳理想氣體之體積，下列何者正確？", "opts": {"A": "1 atm、0℃，22.4 公升", "B": "1 atm、20℃，22.4 公升", "C": "1 atm、25℃，24 公升", "D": "2 atm、0℃，11.2 公升"}, "answer": "A", "explain": "標準狀態為 1 atm、0℃，1 莫耳氣體 22.4 公升；1 atm、20℃ 為 24 公升，25℃ 為 24.45 公升。", "ref": "火災學筆記第2講", "subject": "火災學", "src": "new"}, {"id": "F-N1-020", "topic": "燃燒", "stem": "下列何者「不是」正確的溫度表示符號？", "opts": {"A": "℃", "B": "°K", "C": "℉", "D": "K"}, "answer": "B", "explain": "絕對溫度只寫 K，不加「度」，因此 °K 為錯誤寫法。", "ref": "火災學筆記第2講", "subject": "火災學", "src": "new"}, {"id": "F-N1-021", "topic": "燃燒", "stem": "理想氣體方程式 PV ＝ nRT 中，若 R 取 0.082，則各量的單位何者正確？", "opts": {"A": "P 用 atm、V 用公升、T 用絕對溫度 K", "B": "P 用 mmHg、V 用 m³、T 用 ℃", "C": "P 用 atm、V 用 m³、T 用 ℃", "D": "P 用 Pa、V 用公升、T 用 ℉"}, "answer": "A", "explain": "R ＝ 0.082 atm·L/mol·K，故 P 用 atm、V 用公升、T 用絕對溫度（K ＝ ℃ ＋ 273）。", "ref": "火災學筆記第2講", "subject": "火災學", "src": "new"}, {"id": "F-N1-022", "topic": "爆炸", "stem": "爆炸屬於下列何種燃燒形式？", "opts": {"A": "非定常燃燒", "B": "定常燃燒", "C": "表面燃燒", "D": "不發焰燃燒"}, "answer": "A", "explain": "爆炸時產生之熱超過逸散之熱，熱蓄積使反應加速形成惡性循環，屬非定常燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-023", "topic": "燃燒", "stem": "紙張燃燒後留有灰燼，就燃燒形式而言下列敘述何者正確？", "opts": {"A": "只要有灰燼就屬不完全燃燒", "B": "若可燃成分已燒淨，仍屬完全燃燒", "C": "屬非定常燃燒", "D": "屬均一系燃燒"}, "answer": "B", "explain": "完全燃燒是指可燃成分燃燒淨盡，灰燼為不可燃成分，因此留有灰燼仍可能是完全燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-024", "topic": "燃燒", "stem": "木材、紙張、纖維、石蠟四者中，何者屬於蒸發燃燒？", "opts": {"A": "木材", "B": "石蠟", "C": "紙張", "D": "纖維"}, "answer": "B", "explain": "石蠟受熱熔化後復蒸發而燃燒，屬蒸發燃燒；木材、紙張、纖維經熱分解產生可燃氣體，屬分解燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-025", "topic": "燃燒", "stem": "硫磺、石蠟、樟腦、塑膠四者中，何者屬於分解燃燒？", "opts": {"A": "塑膠", "B": "硫磺", "C": "石蠟", "D": "樟腦"}, "answer": "A", "explain": "塑膠經熱分解產生可燃性氣體而燃燒；硫磺、石蠟熔化後蒸發，樟腦昇華，皆屬蒸發燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-026", "topic": "燃燒", "stem": "木炭、焦碳燃燒時表面發紅而無火焰，此種燃燒屬於下列何者？", "opts": {"A": "蒸發燃燒", "B": "分解燃燒", "C": "表面燃燒（不發焰燃燒）", "D": "預混合燃燒"}, "answer": "C", "explain": "木炭、焦碳加熱後不液化、不分解蒸發，由氧直接在表面化合燃燒，不生火焰，稱表面燃燒或不發焰燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-027", "topic": "燃燒", "stem": "可燃物與生成物形態均屬氣體者稱為均一系燃燒，下列何者屬之？", "opts": {"A": "汽油燃燒", "B": "都市瓦斯燃燒", "C": "木材燃燒", "D": "木炭燃燒"}, "answer": "B", "explain": "燃燒生成物皆為氣體，故可燃物為氣體（氫氣、都市瓦斯）即屬均一系；液體、固體燃燒為非均一系。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-028", "topic": "燃燒", "stem": "瓦斯先洩漏並與空氣混合至一定濃度，遇開燈火花而發生爆炸，屬於何種燃燒？", "opts": {"A": "擴散燃燒", "B": "表面燃燒", "C": "預混合燃燒", "D": "分解燃燒"}, "answer": "C", "explain": "可燃性氣體與空氣在燃燒前已預先混合成一定濃度，遇火源而燃燒，即預混合燃燒。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-029", "topic": "燃燒", "stem": "預混合火焰結構中，大部分（95%～98%）燃燒反應發生於哪一區域？", "opts": {"A": "反應區", "B": "預熱區", "C": "後火焰區", "D": "近場區"}, "answer": "A", "explain": "反應區發生 95%～98% 的燃燒反應，溫度由燃點升至理論燃燒溫度；預熱區是將混合氣由室溫加熱至燃點。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-030", "topic": "燃燒", "stem": "主張「火焰中的自由基向新鮮冷混合氣體中擴散，使其發生鏈鎖反應」而使火焰傳播的是何種理論？", "opts": {"A": "擴散理論", "B": "熱理論", "C": "碰撞理論", "D": "浮力理論"}, "answer": "A", "explain": "火焰傳播機制有熱理論（反應熱傳至新鮮氣體）與擴散理論（自由基擴散引發鏈鎖反應）兩種。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-031", "topic": "燃燒", "stem": "關於影響預混合火焰傳播速度的因素，下列敘述何者正確？", "opts": {"A": "以 He 取代空氣中的 N₂，火焰傳播速度降低", "B": "以 CO₂ 取代空氣中的 N₂，火焰傳播速度降低", "C": "初始溫度愈高，火焰傳播速度愈慢", "D": "管徑愈小，火焰傳播速度愈大"}, "answer": "B", "explain": "CO₂ 比熱容比 N₂ 大約 60%，取代後傳播變慢；He 比熱容小、熱傳導率大，傳播變快；初始溫度愈高愈快；管徑愈大愈快。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-032", "topic": "燃燒", "stem": "預混合氣體之火焰傳播速度，在可燃性氣體濃度為何時最大？", "opts": {"A": "稍高於化學計量濃度", "B": "恰等於燃燒下限", "C": "恰等於燃燒上限", "D": "遠低於化學計量濃度"}, "answer": "A", "explain": "可燃性氣體濃度稍高於化學計量濃度時，恰可彌補自由基向外散失的影響，火焰傳播速度最大。", "ref": "火災學筆記第3講", "subject": "火災學", "src": "new"}, {"id": "F-N1-033", "topic": "燃燒", "stem": "可燃氣從噴口噴出，在噴口處與空氣分子互相擴散混合，於濃度達燃燒範圍處生成火焰持續燃燒，稱為？", "opts": {"A": "預混合燃燒", "B": "擴散燃燒", "C": "表面燃燒", "D": "自己燃燒"}, "answer": "B", "explain": "邊擴散混合邊燃燒者為擴散燃燒（如都市瓦斯、氫氣由管口噴出燃燒）；預混合燃燒則是先混合再點火。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-034", "topic": "燃燒", "stem": "雷諾數（Re）所代表的物理意義為何？", "opts": {"A": "流體黏性力與慣性力之比值", "B": "流體浮力與重力之比值", "C": "火焰高度與火源直徑之比值", "D": "流體慣性力與黏性力之比值"}, "answer": "D", "explain": "雷諾數表示流體的慣性力與黏性力之比值，用以區分層流與紊流。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-035", "topic": "燃燒", "stem": "動量射流火焰依噴口雷諾數區分，下列何者正確？", "opts": {"A": "Re ＜ 4000 為層流火焰，Re ＞ 2100 為紊流火焰", "B": "Re ＞ 2100 為層流火焰，Re ＜ 4000 為紊流火焰", "C": "Re ＜ 2100 為層流火焰，Re ＞ 4000 為紊流火焰", "D": "Re ＜ 1000 為層流火焰，Re ＞ 2100 為紊流火焰"}, "answer": "C", "explain": "層流 Re ＜ 2100，火勢小、形狀少變；紊流 Re ＞ 4000，產生渦流、形狀激烈改變。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-036", "topic": "燃燒", "stem": "一般建築火災之火焰，依流動型態屬於何者？", "opts": {"A": "層流火焰", "B": "預混合火焰", "C": "表面燃燒", "D": "紊流火焰"}, "answer": "D", "explain": "建築火災氣流受牆壁、構造物影響而流動不均，產生渦流，屬紊流火焰。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-037", "topic": "燃燒", "stem": "浮升火羽流之間歇火焰區，流體溫度 T 與高度 Z 的關係為何？", "opts": {"A": "T ∝ 1/Z", "B": "T 大體為定值", "C": "T ∝ 1/Z^(5/3)", "D": "T ∝ √Z"}, "answer": "A", "explain": "持續火焰區溫度大體為定值；間歇火焰區 T ∝ 1/Z；無火焰熱氣流區 T ∝ 1/Z^(5/3)。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-038", "topic": "燃燒", "stem": "浮升火羽流三區中，流體速度呈「加速狀態」的是哪一區？", "opts": {"A": "間歇火焰區", "B": "無火焰熱氣流區", "C": "近場區（持續火焰區）", "D": "三區皆為等速"}, "answer": "C", "explain": "近場區靠近噴口受後方氣體推送而加速；間歇火焰區等速；無火焰熱氣流區減速。", "ref": "火災學筆記第4講", "subject": "火災學", "src": "new"}, {"id": "F-N1-039", "topic": "燃燒", "stem": "「實際所需空氣量」較理論空氣量多，其主要考量為何？", "opts": {"A": "燃料中含有不可燃成分", "B": "燃燒生成物需要稀釋", "C": "可燃物與空氣中的氧在不完全碰撞反應", "D": "空氣中含有 79% 的氮氣"}, "answer": "C", "explain": "化學反應是碰撞反應，實際燃燒時可燃物與氧不一定碰得到，故須多給空氣，此即實際所需空氣量之定義。", "ref": "火災學筆記第5講", "subject": "火災學", "src": "new"}, {"id": "F-N1-040", "topic": "燃燒", "stem": "依烷類通式 CnH₂n₊₂，丁烷的分子式為何？", "opts": {"A": "C₄H₈", "B": "C₄H₆", "C": "C₃H₈", "D": "C₄H₁₀"}, "answer": "D", "explain": "丁烷 n ＝ 4，H 數 ＝ 2×4＋2 ＝ 10；C₄H₈ 為烯類通式、C₃H₈ 為丙烷。", "ref": "火災學筆記第5講", "subject": "火災學", "src": "new"}, {"id": "F-N1-041", "topic": "燃燒", "stem": "配平燃燒反應的化學平衡式時，正確的順序為何？", "opts": {"A": "可燃物係數定為 1 → 先配碳 → 再配氫 → 最後配氧", "B": "先配氧 → 再配碳 → 最後配氫", "C": "先配氫 → 再配氧 → 最後配碳", "D": "氧係數定為 1 → 先配碳 → 再配氫"}, "answer": "A", "explain": "燃燒反應先把可燃物係數定為 1，再依碳、氫、氧順序配平，先配氧會配不出來。", "ref": "火災學筆記第5講", "subject": "火災學", "src": "new"}, {"id": "F-N1-042", "topic": "燃燒", "stem": "就物質形態對燃燒之影響，下列敘述何者正確？", "opts": {"A": "不燃性固體具積極抑制燃燒作用", "B": "不燃性液體會助長燃燒", "C": "不燃性固體屬消極抵抗力，不燃性液體（如水）具積極抑制作用", "D": "可燃性液體為抑制燃燒之消極力量"}, "answer": "C", "explain": "不燃性固體僅改變火焰行進方向，屬消極抵抗；水等不燃性液體能冷卻而積極抑制；可燃性液體為助長燃燒之積極力量。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-043", "topic": "燃燒", "stem": "同一可燃性固體，以下列何種方式擺放最容易燃燒？", "opts": {"A": "平鋪狀態", "B": "豎立狀態", "C": "緊密堆疊成塊", "D": "浸濕後平放"}, "answer": "B", "explain": "豎立時熱氣流上升方向與蔓延方向一致，可預熱未燃材料，故比平鋪容易燃燒。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-044", "topic": "燃燒", "stem": "火焰擴展延伸時，若空間有體積差，火焰會如何延伸？此稱為何？", "opts": {"A": "朝空間體積小的方向延伸，稱為氣積差", "B": "朝溫度低的方向延伸，稱為溫度差", "C": "朝空間體積大的方向延伸，稱為氣積差", "D": "朝空間體積大的方向延伸，稱為溫度差"}, "answer": "C", "explain": "空間體積愈大，空氣的反抗力愈小，火焰自然朝體積大的方向延伸，此即氣積差；溫度差則是密度差產生浮力對流。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-045", "topic": "燃燒", "stem": "火柴、打火機、蠟燭等有焰火源，其火焰溫度約為多少？", "opts": {"A": "200～300℃", "B": "400～600℃", "C": "1500～2000℃", "D": "800～1200℃"}, "answer": "D", "explain": "有焰火源火焰溫度約 800～1200℃，為燃燒最直接之發火源；200～300℃ 為香煙表面溫度。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-046", "topic": "燃燒", "stem": "發火源依理化現象分為七類，下列何者「不」屬之？", "opts": {"A": "斷熱壓縮", "B": "靜電", "C": "撞擊摩擦", "D": "等溫壓縮"}, "answer": "D", "explain": "七類為微火源、有焰火源、高溫固體、撞擊摩擦、斷熱壓縮、靜電、自然發火；等溫壓縮溫度不變，不會發火。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-047", "topic": "燃燒", "stem": "二帶電序位差大之絕緣物質因摩擦、撥離、流動等作用生成電荷，累積後與周圍產生電位差而放電，簡稱為何？", "opts": {"A": "MIE", "B": "LFL", "C": "ESD", "D": "STP"}, "answer": "C", "explain": "靜電放電英文 ElectroStatic Discharge，簡稱 ESD；MIE 為最小發火能量、LFL 為燃燒下限。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-048", "topic": "燃燒", "stem": "可燃性物質在常溫下自然發熱而終至自燃，其關鍵條件為何？", "opts": {"A": "散熱速度較發熱速度為快", "B": "須有外部火焰接觸", "C": "環境溫度須高於沸點", "D": "發熱速度較散熱速度為快"}, "answer": "D", "explain": "自然發火是物質與氧化合產熱，若發熱速度大於散熱速度，溫度逐漸升高達自燃溫度而自燃。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-049", "topic": "燃燒", "stem": "斷熱壓縮公式 P₀V₀^γ ＝ PV^γ 中，對空氣等雙原子氣體，γ 值一般取多少？", "opts": {"A": "1.4", "B": "5/3", "C": "1.0", "D": "0.4"}, "answer": "A", "explain": "γ ＝ Cp/Cv，雙原子氣體（O₂、N₂、空氣）取 7/5 ＝ 1.4；單原子氣體（如 He）為 5/3。", "ref": "火災學筆記第6講", "subject": "火災學", "src": "new"}, {"id": "F-N1-050", "topic": "燃燒", "stem": "燃燒界限的表示方式，下列何者正確？", "opts": {"A": "一律以重量 % 表示", "B": "氣體以 mg/l 表示，固體以體積 % 表示", "C": "一律以 ppm 表示", "D": "可燃物為氣體時以體積 % 表示，固體、液體以 mg/l 或 g/m³ 表示"}, "answer": "D", "explain": "氣體燃燒界限通常以氣體佔體積之 % 表示，固體、液體則以 mg/l 或 g/m³ 表示。", "ref": "火災學筆記第7講", "subject": "火災學", "src": "new"}, {"id": "F-N1-051", "topic": "燃燒", "stem": "危險指數 D 的計算式為何（UFL：燃燒上限；LFL：燃燒下限）？", "opts": {"A": "D ＝（UFL － LFL）／UFL", "B": "D ＝（UFL － LFL）／LFL", "C": "D ＝ UFL／LFL", "D": "D ＝ LFL／（UFL － LFL）"}, "answer": "B", "explain": "危險指數 D ＝（UFL － LFL）／LFL，值愈大愈容易發火、愈危險。", "ref": "火災學筆記第7講", "subject": "火災學", "src": "new"}, {"id": "F-N1-052", "topic": "燃燒", "stem": "同碳數的碳氫化合物，燃燒下限（LFL）的大小順序為何？", "opts": {"A": "炔類 ＞ 烯類 ＞ 烷類", "B": "烯類 ＞ 烷類 ＞ 炔類", "C": "烷類 ＞ 烯類 ＞ 炔類", "D": "三者相同"}, "answer": "C", "explain": "同碳數時燃燒下限為烷＞烯＞炔；同類則碳數愈多下限愈小。", "ref": "火災學筆記第7講", "subject": "火災學", "src": "new"}, {"id": "F-N1-053", "topic": "燃燒", "stem": "乙醚、乙炔、氫、甲烷四種可燃性氣體中，燃燒下限最小者為何？", "opts": {"A": "乙炔", "B": "氫", "C": "甲烷", "D": "乙醚"}, "answer": "D", "explain": "燃燒下限順序：乙醚（1.9%）＜ 乙炔（2.5%）＜ 氫（4.0%）＜ 甲烷（5.3%）。", "ref": "火災學筆記第7講", "subject": "火災學", "src": "new"}, {"id": "F-N1-054", "topic": "燃燒", "stem": "可燃性氣體在空氣中，當溫度升高時燃燒界限的變化為何？", "opts": {"A": "下限變小、上限變大，燃燒範圍變廣", "B": "下限變大、上限變小，燃燒範圍變窄", "C": "下限無顯著變化、上限明顯增加", "D": "上下限均不變"}, "answer": "A", "explain": "溫度升高時下限變小、上限變大，燃燒範圍變廣；「下限無顯著變化、上限明顯增加」是壓力增大的情形。", "ref": "火災學筆記第7講", "subject": "火災學", "src": "new"}, {"id": "F-N1-055", "topic": "燃燒", "stem": "可燃性氣體在空氣中，當壓力增大時燃燒界限的變化為何？", "opts": {"A": "上限明顯增加，下限無顯著變化", "B": "下限明顯降低，上限無顯著變化", "C": "上下限同時顯著降低", "D": "燃燒範圍變窄"}, "answer": "A", "explain": "壓力增大時燃燒上限明顯增加、下限無顯著變化，燃燒範圍變廣。", "ref": "火災學筆記第7講", "subject": "火災學", "src": "new"}, {"id": "F-N1-056", "topic": "燃燒", "stem": "於可燃性氣體與空氣之混合氣中添加惰性氣體，燃燒界限如何變化？", "opts": {"A": "下限變化不大，上限顯著下降，範圍變窄", "B": "下限顯著下降，上限變化不大，範圍變廣", "C": "上下限同時上升", "D": "上限顯著增加，範圍變廣"}, "answer": "A", "explain": "添加惰性氣體時下限變化不大、上限顯著下降，燃燒範圍變窄，添加到一定量上下限一致即為可燃性峰值。", "ref": "火災學筆記第7講", "subject": "火災學", "src": "new"}, {"id": "F-N1-057", "topic": "燃燒", "stem": "壓力降低使燃燒範圍變小，最後上下限一致的點稱為壓力界限，下列何者為其例外？", "opts": {"A": "CH₄ 與 C₂H₆", "B": "C₃H₈ 與 C₄H₁₀", "C": "乙醚與丙酮", "D": "CO 與 H₂"}, "answer": "D", "explain": "壓力界限的現象有例外，即一氧化碳（CO）與氫（H₂）。", "ref": "火災學筆記第7講", "subject": "火災學", "src": "new"}, {"id": "F-N1-058", "topic": "滅火", "stem": "關於可燃性峰值（Inflammability Peak），下列敘述何者正確？", "opts": {"A": "此值愈高的惰性氣體，其添加效果愈大", "B": "N₂ 的添加效果優於 CO₂", "C": "指壓力降低至上下限一致時之壓力", "D": "此值愈低的惰性氣體，其添加效果愈大"}, "answer": "D", "explain": "可燃性峰值愈低代表較少添加量即可使上下限一致，效果愈好；效果為鹵化烴＞CO₂＞N₂；壓力降至上下限一致者為壓力界限。", "ref": "火災學筆記第7講", "subject": "火災學", "src": "new"}, {"id": "F-N1-059", "topic": "燃燒", "stem": "以閃火點下之蒸氣壓估算燃燒下限（LFL ＝ P/P₀ × 100）的理由為何？", "opts": {"A": "閃火點時的蒸氣濃度即為燃燒上限", "B": "蒸氣壓與濃度成反比", "C": "閃火點與蒸氣壓無關，此式為經驗式", "D": "閃火點時的蒸氣濃度即為燃燒下限，而蒸氣壓與濃度成正比"}, "answer": "D", "explain": "蒸氣壓除以總壓即蒸氣濃度，而閃火點時蒸氣濃度恰達燃燒下限，故可求 LFL；P 與 P₀ 單位須一致。", "ref": "火災學筆記第7講", "subject": "火災學", "src": "new"}, {"id": "F-N1-060", "topic": "燃燒", "stem": "可燃性混合氣體不藉由他處火焰或電氣火花等火種引燃，在空氣中可自行點燃維持燃燒之最低溫度，稱為？", "opts": {"A": "引火點（閃火點）", "B": "發火溫度（自燃溫度）", "C": "燃燒點（火焰點）", "D": "沸點"}, "answer": "B", "explain": "不藉外來火種即可自行點燃維持燃燒的最低溫度為發火溫度，亦稱自燃溫度；閃火點需有點火源引火。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-061", "topic": "燃燒", "stem": "熱源使可燃性物質達自燃溫度時，所需熱源自身溫度由低至高的順序為何？", "opts": {"A": "高溫氣體 ＜ 加熱電阻線 ＜ 高溫固體 ＜ 全面加熱", "B": "高溫固體 ＜ 全面加熱 ＜ 高溫氣體 ＜ 加熱電阻線", "C": "全面加熱 ＜ 高溫固體 ＜ 加熱電阻線 ＜ 高溫氣體", "D": "全面加熱 ＜ 高溫氣體 ＜ 高溫固體 ＜ 加熱電阻線"}, "answer": "C", "explain": "全面加熱所需溫度最低，高溫氣體熱傳最慢、所需溫度最高；一般公布之自燃溫度即以全面加熱測得。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-062", "topic": "燃燒", "stem": "稻草大量堆積因發酵產熱蓄積而起火，屬於何種自燃？", "opts": {"A": "受熱自燃", "B": "斷熱壓縮", "C": "本身自燃", "D": "撞擊摩擦發火"}, "answer": "C", "explain": "由物質內部氧化、分解、吸附、發酵、聚合等反應放熱蓄積而自燃者為本身自燃；受熱自燃是外部熱源使其達自燃溫度。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-063", "topic": "燃燒", "stem": "關於最小發火能量（MIE），下列敘述何者正確？", "opts": {"A": "通常以火焰直接加熱試驗，以 kcal 表示", "B": "通常以電容器放出不同能量的火花試驗，常以 mJ 表示", "C": "數值通常很大，以 kJ 表示", "D": "指液體蒸氣持續燃燒五秒所需能量"}, "answer": "B", "explain": "MIE 是以電氣火花使混合氣發火所需能量，以電容器放電試驗，因數值很小常以毫焦耳（mJ）表示。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-064", "topic": "燃燒", "stem": "最小發火能量與壓力的關係為何？", "opts": {"A": "與壓力成正比", "B": "與壓力平方成正比", "C": "與壓力無關", "D": "與壓力平方成反比"}, "answer": "D", "explain": "發火能量與壓力平方成反比（h ∝ 1/P²），壓力增大時 MIE 降低。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-065", "topic": "燃燒", "stem": "空氣中的 N₂ 分別以 He 及 Ar 替代時，最小發火能量如何變化？", "opts": {"A": "He 替代則增大，Ar 替代則降低", "B": "He 替代則降低，Ar 替代則增大", "C": "兩者皆增大", "D": "兩者皆降低"}, "answer": "A", "explain": "熱傳導率愈大發火能量愈高：He（0.1513）＞ N₂ ＞ Ar（0.01772 W/m·K），故 He 替代時 MIE 增大、Ar 替代時降低。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-066", "topic": "燃燒", "stem": "壓力過低時，即使給予再大的能量亦不致發火，此尚可發火之最低壓力稱為？", "opts": {"A": "壓力界限", "B": "可燃性峰值", "C": "飽和蒸氣壓", "D": "最小發火壓力"}, "answer": "D", "explain": "最小發火壓力是尚可發火的最低壓力（如甲烷 19 mmHg）；壓力界限則是壓力降低至燃燒上下限一致之點。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-067", "topic": "燃燒", "stem": "依化學構造與發火能量之關係，碳化氫的發火能量大小順序為何？", "opts": {"A": "炔烴 ＞ 烯烴 ＞ 烷烴", "B": "烷烴 ＞ 烯烴 ＞ 炔烴", "C": "烯烴 ＞ 烷烴 ＞ 炔烴", "D": "三者相同"}, "answer": "B", "explain": "碳化氫發火能量依 Alkane（烷烴）＞ Alkene（烯烴）＞ Alkyne（炔烴）。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-068", "topic": "燃燒", "stem": "依化學構造與發火能量之關係，官能基使發火能量逐次增加的順序為何？", "opts": {"A": "胺 ＜ 氯化物 ＜ 醇 ＜ 硫醇", "B": "醇 ＜ 硫醇 ＜ 胺 ＜ 氯化物", "C": "氯化物 ＜ 胺 ＜ 硫醇 ＜ 醇", "D": "硫醇 ＜ 醇 ＜ 氯化物 ＜ 胺"}, "answer": "D", "explain": "官能基影響依硫醇＜醇＜氯化物＜胺順序逐次增加，其中以氯化物及胺類影響最大。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-069", "topic": "燃燒", "stem": "可燃性液體在空氣中產生可燃性蒸氣到達燃燒下限時的最低溫度，稱為？", "opts": {"A": "燃燒點（火焰點）", "B": "引火點（閃火點）", "C": "發火溫度", "D": "沸點"}, "answer": "B", "explain": "蒸氣濃度恰達燃燒下限的最低溫度為引火點，點火只閃一下即熄，故又稱閃火點。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-070", "topic": "燃燒", "stem": "關於燃燒點（火焰點）的敘述，下列何者正確？", "opts": {"A": "蒸氣引火後能持續一秒以上，通常較閃火點低 5～20℃", "B": "與發火溫度為同一溫度", "C": "通常較沸點為高", "D": "蒸氣引火後能持續五秒以上，通常較閃火點高 5～20℃"}, "answer": "D", "explain": "燃燒點是引火後能持續燃燒五秒以上之溫度，通常比閃火點高 5～20℃，且低於沸點與自燃溫度。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-071", "topic": "燃燒", "stem": "引火點、燃燒點、沸點、自燃溫度四者，溫度由低至高的順序為何？", "opts": {"A": "燃燒點 ＜ 引火點 ＜ 沸點 ＜ 自燃溫度", "B": "引火點 ＜ 沸點 ＜ 燃燒點 ＜ 自燃溫度", "C": "引火點 ＜ 燃燒點 ＜ 沸點 ＜ 自燃溫度", "D": "自燃溫度 ＜ 沸點 ＜ 燃燒點 ＜ 引火點"}, "answer": "C", "explain": "溫度順序為引火點＜燃燒點＜沸點＜自燃溫度（例如乙醇閃火點 13℃、沸點 78.4℃、自燃點 363℃）。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-072", "topic": "燃燒", "stem": "依克拉伯壤－克勞秀士方程式 dP/dT ＝ ΔH/（T×ΔV），液體氣化時 dP/dT ＞ 0 的原因為何？", "opts": {"A": "ΔH ＜ 0 且 ΔV ＜ 0", "B": "ΔH ＞ 0 且 ΔV ＞ 0", "C": "ΔH ＞ 0 且 ΔV ＜ 0", "D": "ΔH ＜ 0 且 ΔV ＞ 0"}, "answer": "B", "explain": "液體氣化為吸熱（ΔH ＞ 0）且體積膨脹（ΔV ＞ 0），故 dP/dT ＞ 0，液－氣曲線為正斜率。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-073", "topic": "燃燒", "stem": "阿瑞尼氏方程式 V ＝ A × e^(−E/RT) 用以說明固體發火，其意義為何？", "opts": {"A": "溫度愈高，熱分解速率愈慢", "B": "溫度愈高，熱分解速率愈快", "C": "活化能愈大，反應速率愈快", "D": "反應速率與溫度無關"}, "answer": "B", "explain": "T 增大使 E/RT 變小，e^(−E/RT) 變大，反應速率常數 V 增大，故溫度愈高熱分解愈快。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-074", "topic": "燃燒", "stem": "硝化棉、塞璐璐等硝酸酯類物質熱分解時同時產生可燃性氣體與氧氣，不需空氣中氧即可燃燒，稱為？", "opts": {"A": "表面燃燒", "B": "自己燃燒", "C": "蒸發燃燒", "D": "悶燒"}, "answer": "B", "explain": "硝酸酯類分子本身釋出氧而燃燒，不需空氣中氧助燃，稱為自己燃燒。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-075", "topic": "燃燒", "stem": "比較悶燒與表面燃燒，下列敘述何者正確？", "opts": {"A": "兩者皆屬發焰燃燒", "B": "表面燃燒屬完全燃燒，悶燒屬不完全燃燒", "C": "悶燒產生的有害成分較表面燃燒少", "D": "表面燃燒屬不完全燃燒，悶燒屬完全燃燒"}, "answer": "B", "explain": "兩者皆為不發焰、定常、非均一系燃燒；差別在表面燃燒為完全燃燒，悶燒為不完全燃燒且有害成分較多。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-076", "topic": "燃燒", "stem": "悶燒之所以造成嚴重火災危害，下列何者為其理由之一？", "opts": {"A": "燃燒溫度比有焰燃燒更高", "B": "比一般尚未燃燒的物質需要更少的熱源即可產生火焰性燃燒", "C": "產生的有害成分比火焰性燃燒少", "D": "只發生於氣體可燃物"}, "answer": "B", "explain": "悶燒危害有二：將燃料轉換成更多有害成分；比未燃物質需要更少熱源即可轉為火焰性燃燒。", "ref": "火災學筆記第8講", "subject": "火災學", "src": "new"}, {"id": "F-N1-077", "topic": "燃燒", "stem": "液體打破後在密閉空間內達到平衡，若室內「仍有液體殘留」，應如何求空間中蒸氣的最大濃度？", "opts": {"A": "以液體重量換算莫耳數再求氣體體積", "B": "以飽和蒸氣壓除以總壓", "C": "以液體體積直接除以空間體積", "D": "以閃火點除以沸點"}, "answer": "B", "explain": "有液體殘留代表已達飽和蒸氣壓，濃度＝飽和蒸氣壓／總壓 ×100；無殘留時才用重量→莫耳→氣體體積計算。", "ref": "火災學筆記 題型10", "subject": "火災學", "src": "new"}, {"id": "F-N1-078", "topic": "燃燒", "stem": "某密閉空間內有空氣 80 公升，其中氧氣約有多少公升？", "opts": {"A": "16.8 公升", "B": "18.6 公升", "C": "63.2 公升", "D": "381 公升"}, "answer": "A", "explain": "氧氣體積＝80 × 0.21＝16.8 公升；誤用重量百分比 0.232 得 18.6，63.2 為氮氣體積，381 為誤除 0.21。", "ref": "火災學筆記 題型1", "subject": "火災學", "src": "new"}, {"id": "F-N1-079", "topic": "燃燒", "stem": "已知某空間之空氣中含氧氣 42 m³，則該空間之空氣體積約為多少？", "opts": {"A": "200 m³", "B": "8.8 m³", "C": "181 m³", "D": "53.2 m³"}, "answer": "A", "explain": "空氣體積＝氧體積 ÷ 0.21＝42 ÷ 0.21＝200 m³；誤乘 0.21 得 8.8，誤除 0.232 得 181，誤除 0.79 得 53.2。", "ref": "火災學筆記 題型1", "subject": "火災學", "src": "new"}, {"id": "F-N1-080", "topic": "燃燒", "stem": "某混合氣體僅由 O₂ 與 N₂ 組成，體積百分比分別為 30% 與 70%，則 O₂ 之重量百分比約為多少？", "opts": {"A": "32.9%", "B": "30.0%", "C": "19.7%", "D": "67.1%"}, "answer": "A", "explain": "O₂ 份額＝32×0.30＝9.6，N₂ 份額＝28×0.70＝19.6，重量百分比＝9.6÷29.2×100≒32.9%；氧原子量未乘 2 得 19.7%，67.1% 為 N₂ 之重量百分比。", "ref": "火災學筆記 題型2", "subject": "火災學", "src": "new"}, {"id": "F-N1-081", "topic": "燃燒", "stem": "某混合氣體僅由 O₂ 40% 與 N₂ 60%（體積百分比）組成，O₂ 之重量百分比約為多少？", "opts": {"A": "40.0%", "B": "27.6%", "C": "43.2%", "D": "53.3%"}, "answer": "C", "explain": "重量百分比＝（32×0.40）÷（32×0.40＋28×0.60）×100＝12.8÷29.6×100≒43.2%；O₂ 分子量誤用 16 得 27.6%，40.0% 為體積百分比。", "ref": "火災學筆記 題型2", "subject": "火災學", "src": "new"}, {"id": "F-N1-082", "topic": "滅火", "stem": "以 CO₂ 滅火時，若 CO₂ 設計濃度為 30%，則防護空間內的氧濃度約為多少？", "opts": {"A": "14.7%", "B": "6.3%", "C": "12.6%", "D": "16.8%"}, "answer": "A", "explain": "CO₂＝（21－O₂）÷21×100 → 30＝（21－O₂）÷21×100 → O₂＝21×0.7＝14.7%；6.3% 為 21×0.3 之誤算。", "ref": "火災學筆記 題型3", "subject": "火災學", "src": "new"}, {"id": "F-N1-083", "topic": "滅火", "stem": "以惰性氣體 CO₂ 將防護空間之氧濃度降至 13%，此時 CO₂ 濃度約為多少？", "opts": {"A": "8.0%", "B": "61.9%", "C": "38.1%", "D": "87.0%"}, "answer": "C", "explain": "CO₂＝（21－13）÷21×100≒38.1%；8.0% 為只算 21－13，61.9% 為 13÷21，87.0% 為 100－13。", "ref": "火災學筆記 題型3", "subject": "火災學", "src": "new"}, {"id": "F-N1-084", "topic": "滅火", "stem": "200 m³ 密閉空間內為標準狀態之空氣，須加入多少 m³ 的 CO₂，才能使 CO₂ 體積濃度成為 25%？", "opts": {"A": "50.0 m³", "B": "150.0 m³", "C": "66.7 m³", "D": "33.3 m³"}, "answer": "C", "explain": "25＝X÷（200＋X）×100 → 4X＝200＋X → X≒66.7 m³；50.0 m³ 是誤以 200×25%，忽略加入後總體積變為 V＋X。", "ref": "火災學筆記 題型4", "subject": "火災學", "src": "new"}, {"id": "F-N1-085", "topic": "滅火", "stem": "500 m³ 的防護空間，欲以 CO₂ 將氧濃度降至 14%，須加入 CO₂ 多少 m³？", "opts": {"A": "250 m³", "B": "166.7 m³", "C": "35 m³", "D": "750 m³"}, "answer": "A", "explain": "X＝（21－O₂）V÷O₂＝（21－14）×500÷14＝250 m³；166.7 m³ 誤以 CO₂ 濃度（1/3）×V，35 m³ 為 0.07×500。", "ref": "火災學筆記 題型4", "subject": "火災學", "src": "new"}, {"id": "F-N1-086", "topic": "滅火", "stem": "一密閉空間體積為 V，欲加入不燃性氣體使氧氣體積濃度成為 15%，須加入多少不燃性氣體？（假設一般空氣之氧氣體積濃度為 20%）", "opts": {"A": "0.33V", "B": "0.40V", "C": "0.25V", "D": "0.75V"}, "answer": "A", "explain": "15＝0.20V÷（V＋X）×100 → 15X＝5V → X≒0.33V；0.40V 是誤用 21% 計算，0.25V 為（20－15）/20。", "ref": "火災學筆記 題型4", "subject": "火災學", "src": "new"}, {"id": "F-N1-087", "topic": "滅火", "stem": "某場所體積 20 m³，滅火之氧濃度設定為 15%，以標準狀態（1 atm、0℃）考量，所需 CO₂ 約為多少公斤？", "opts": {"A": "14.67 kg", "B": "11.22 kg", "C": "8.00 kg", "D": "15.71 kg"}, "answer": "D", "explain": "X＝（21－15）×20÷15＝8 m³ → 8000÷22.4×44≒15714 g≒15.71 kg；誤用 24 L 得 14.67，誤以 CO₂ 濃度 28.6%×V 得 11.22。", "ref": "火災學筆記 題型5", "subject": "火災學", "src": "new"}, {"id": "F-N1-088", "topic": "滅火", "stem": "某場所體積 50 m³，欲以 CO₂ 將氧濃度降至 14%，在 1 atm、20℃（1 莫耳氣體 24 公升）下，所需 CO₂ 約為多少公斤？", "opts": {"A": "49.11 kg", "B": "30.56 kg", "C": "25.00 kg", "D": "45.83 kg"}, "answer": "D", "explain": "X＝（21－14）×50÷14＝25 m³ → 25000÷24×44≒45.83 kg；誤用標準狀態 22.4 L 得 49.11，誤以 CO₂ 濃度×V 得 30.56，25.00 為把 m³ 當 kg。", "ref": "火災學筆記 題型5", "subject": "火災學", "src": "new"}, {"id": "F-N1-089", "topic": "滅火", "stem": "標準狀態（1 atm、0℃）下，11.2 m³ 的 CO₂ 重量約為多少？", "opts": {"A": "20.5 kg", "B": "492.8 kg", "C": "0.022 kg", "D": "22.0 kg"}, "answer": "D", "explain": "11.2 m³＝11200 L → 11200÷22.4＝500 mol → 500×44＝22000 g＝22.0 kg；誤用 24 L 得 20.5，m³ 未換公升得 0.022。", "ref": "火災學筆記 題型5", "subject": "火災學", "src": "new"}, {"id": "F-N1-090", "topic": "燃燒", "stem": "某燃料含 C 80%、H 15%、S 5%（重量百分比，不含氧），1 kg 完全燃燒於標準狀態下所需理論空氣量約為多少 m³？", "opts": {"A": "14.71 m³", "B": "7.29 m³", "C": "12.10 m³", "D": "11.29 m³"}, "answer": "D", "explain": "Lv＝（8.9×80＋26.7×15＋3.3×5）÷100＝（712＋400.5＋16.5）÷100≒11.29 m³；14.71 為誤用重量版係數，12.10 為誤換算成 20℃。", "ref": "火災學筆記 題型6", "subject": "火災學", "src": "new"}, {"id": "F-N1-091", "topic": "燃燒", "stem": "某燃料含 C 70%、H 10%、O 8%、S 2%（重量百分比），1 kg 完全燃燒所需理論空氣重量約為多少 kg？", "opts": {"A": "11.69 kg", "B": "11.34 kg", "C": "8.90 kg", "D": "8.70 kg"}, "answer": "B", "explain": "Lw＝〔11.6×70＋34.8×（10－8/8）＋4.3×2〕÷100≒11.34 kg；未扣燃料含氧得 11.69，把 O 整個扣掉（H－O）得 8.90，8.70 為體積公式結果。", "ref": "火災學筆記 題型6", "subject": "火災學", "src": "new"}, {"id": "F-N1-092", "topic": "燃燒", "stem": "160 公克甲烷（CH₄）完全燃燒，於標準狀態下所需空氣量約為多少 m³？", "opts": {"A": "0.45 m³", "B": "2.13 m³", "C": "13.33 m³", "D": "1.07 m³"}, "answer": "B", "explain": "CH₄＋2O₂→CO₂＋2H₂O；O₂＝160/16×2＝20 mol → 20×22.4÷0.21÷1000≒2.13 m³；未除 0.21 得 0.45（只是氧氣量），O₂ 係數誤用 1 得 1.07。", "ref": "火災學筆記 題型6", "subject": "火災學", "src": "new"}, {"id": "F-N1-093", "topic": "燃燒", "stem": "各 1 公克的碳（C）、氫（H）、硫（S）元素完全燃燒，所需空氣量分別為 a、b、c，其大小順序為何？", "opts": {"A": "a ＝ c ＞ b", "B": "b ＞ a ＞ c", "C": "a ＞ b ＞ c", "D": "c ＞ a ＞ b"}, "answer": "B", "explain": "1 g 各元素莫耳數 C＝1/12、H＝1、S＝1/32；所需 O₂：C＝1/12、H＝1/4、S＝1/32，故 b＞a＞c；a＝c＞b 是「各 1 莫耳」的答案。", "ref": "火災學筆記 題型6", "subject": "火災學", "src": "new"}, {"id": "F-N1-094", "topic": "燃燒", "stem": "某燃料之理論空氣量為 12 m³，空氣比 m＝1.3，則實際空氣量為多少？", "opts": {"A": "3.6 m³", "B": "9.2 m³", "C": "15.6 m³", "D": "13.3 m³"}, "answer": "C", "explain": "La＝m×Lo＝1.3×12＝15.6 m³；3.6 m³ 為空氣過剩量（m－1）Lo，9.2 為誤除以 m。", "ref": "火災學筆記 題型7", "subject": "火災學", "src": "new"}, {"id": "F-N1-095", "topic": "燃燒", "stem": "某燃料理論空氣量 10 m³、實際供給空氣量 12.5 m³，則空氣過剩率為多少？", "opts": {"A": "125%", "B": "20%", "C": "25%", "D": "80%"}, "answer": "C", "explain": "m＝12.5/10＝1.25，過剩率＝m－1＝0.25（25%）；20% 是誤以實際空氣量為分母（2.5/12.5）。", "ref": "火災學筆記 題型7", "subject": "火災學", "src": "new"}, {"id": "F-N1-096", "topic": "燃燒", "stem": "某燃料含 C 85%、H 15%（重量百分比），空氣比 m＝1.2，1 kg 於標準狀態下完全燃燒之實際空氣量約為多少 m³？", "opts": {"A": "11.57 m³", "B": "2.31 m³", "C": "13.88 m³", "D": "18.10 m³"}, "answer": "C", "explain": "Lo＝（8.9×85＋26.7×15）÷100≒11.57 m³，La＝1.2×Lo≒13.88 m³；11.57 為理論空氣量，2.31 為過剩量，最後一項誤用重量係數。", "ref": "火災學筆記 題型7", "subject": "火災學", "src": "new"}, {"id": "F-N1-097", "topic": "燃燒", "stem": "空氣（γ＝1.4）在 1 atm、20℃ 下絕熱壓縮至 10 atm，壓縮後溫度約為多少？", "opts": {"A": "736.0 K", "B": "293.0 K", "C": "565.7 K", "D": "38.6 K"}, "answer": "C", "explain": "（T/T₀）^γ＝（P₀/P）^(1－γ) → T＝293×10^(0.4/1.4)≒565.7 K；736.0 K 為誤用指數 γ－1，293 K 為等溫假設，38.6 為未換算絕對溫度。", "ref": "火災學筆記 題型8", "subject": "火災學", "src": "new"}, {"id": "F-N1-098", "topic": "燃燒", "stem": "27℃ 的空氣（γ＝1.4）絕熱壓縮使體積變為原來的 1/5（V₀/V＝5），壓縮後溫度約為多少？", "opts": {"A": "2855.5 K", "B": "475.1 K", "C": "51.4 K", "D": "571.1 K"}, "answer": "D", "explain": "T/T₀＝（V₀/V）^(γ－1) → T＝300×5^0.4≒571.1 K；指數誤用 γ 得 2855.5，誤套壓力比公式得 475.1，未換 K 得 51.4。", "ref": "火災學筆記 題型8", "subject": "火災學", "src": "new"}, {"id": "F-N1-099", "topic": "燃燒", "stem": "定溫下 1 atm、6 公升的氣體加壓至 3 atm，其體積變為多少？", "opts": {"A": "18 公升", "B": "0.5 公升", "C": "2 公升", "D": "3 公升"}, "answer": "C", "explain": "等溫壓縮 P₀V₀＝PV → 1×6＝3×V → V＝2 公升；18 公升是誤以為成正比。", "ref": "火災學筆記 題型8", "subject": "火災學", "src": "new"}, {"id": "F-N1-100", "topic": "燃燒", "stem": "依 Burgess-Wheeler Law，某飽和碳化氫之莫耳燃燒熱為 2220 kJ/mol，其燃燒下限約為多少？（1 cal＝4.18 J）", "opts": {"A": "0.48%", "B": "0.11%", "C": "1.99%", "D": "5.00%"}, "answer": "C", "explain": "ΔHc＝2220÷4.18≒531.1 kcal/mol → LFL＝1059÷531.1≒1.99%；未換算 kJ 直接代入得 0.48%，換算方向相反得 0.11%。", "ref": "火災學筆記 題型9", "subject": "火災學", "src": "new"}, {"id": "F-N1-101", "topic": "燃燒", "stem": "乙烷（C₂H₆）完全燃燒式為 C₂H₆＋3.5O₂→2CO₂＋3H₂O，依 Jone's Rule 估算其燃燒下限約為多少？", "opts": {"A": "3.11%", "B": "12.2%", "C": "19.8%", "D": "5.66%"}, "answer": "A", "explain": "Co＝1÷（1＋3.5/0.21）×100≒5.66%，LFL＝0.55×Co≒3.11%；忘了除 0.21 得 12.2%，19.8% 為 Lloyd's 上限，5.66% 為 Co 本身。", "ref": "火災學筆記 題型9", "subject": "火災學", "src": "new"}, {"id": "F-N1-102", "topic": "燃燒", "stem": "丙烷（C₃H₈）完全燃燒式為 C₃H₈＋5O₂→3CO₂＋4H₂O，依 Lloyd's Rule 估算其燃燒上限約為多少？", "opts": {"A": "2.22%", "B": "14.1%", "C": "4.03%", "D": "58.3%"}, "answer": "B", "explain": "Co＝1÷（1＋5/0.21）×100≒4.03%，UFL＝3.5×Co≒14.1%；2.22% 為 Jone's 下限，最後一項為忘了除 0.21。", "ref": "火災學筆記 題型9", "subject": "火災學", "src": "new"}, {"id": "F-N1-103", "topic": "燃燒", "stem": "某可燃性液體在閃火點下之飽和蒸氣壓為 38 mmHg，混合氣體壓力為 1 atm，其燃燒下限約為多少？", "opts": {"A": "3.8%", "B": "0.05%", "C": "5.0%", "D": "38.0%"}, "answer": "C", "explain": "LFL＝P/P₀×100＝38/760×100＝5.0%；0.05% 為漏乘 100，38.0% 為 P 與 P₀ 單位不一致（誤把 P₀ 當 100）。", "ref": "火災學筆記 題型9", "subject": "火災學", "src": "new"}, {"id": "F-N1-104", "topic": "燃燒", "stem": "某混合氣體由 A、B、C 組成，體積比例 20%、30%、50%，其燃燒下限分別為 5%、3%、2%，依 Le Châtelier 定律此混合氣體燃燒下限約為多少？", "opts": {"A": "2.56%", "B": "2.90%", "C": "3.33%", "D": "0.39%"}, "answer": "A", "explain": "Lm＝1÷（20/5＋30/3＋50/2）×100＝100÷39≒2.56%；2.90% 為加權平均之誤，3.33% 為算術平均。", "ref": "火災學筆記 題型9", "subject": "火災學", "src": "new"}, {"id": "F-N1-105", "topic": "爆炸", "stem": "苯（C₆H₆）完全燃燒式為 C₆H₆＋7.5O₂→6CO₂＋3H₂O，依 Jone's Rule 估算其爆炸下限約為多少？", "opts": {"A": "2.72%", "B": "9.53%", "C": "6.47%", "D": "1.50%"}, "answer": "D", "explain": "Co＝1÷（1＋7.5/0.21）×100≒2.72%，LEL＝0.55×Co≒1.50%；9.53% 為 Lloyd's 上限，最後一項為忘了除 0.21。", "ref": "火災學筆記 題型10", "subject": "火災學", "src": "new"}, {"id": "F-N1-106", "topic": "爆炸", "stem": "密閉空間（760 mmHg、25℃）內某可燃性液體打破，平衡後仍有液體殘留；該液體 25℃ 飽和蒸氣壓為 57 mmHg，爆炸範圍經估算為 1.2%～7.0%。下列判斷何者正確？", "opts": {"A": "蒸氣濃度 7.5%，在範圍內，有火災爆炸危險", "B": "蒸氣濃度 0.075%，低於下限，無火災爆炸危險", "C": "蒸氣濃度 57%，高於上限，無火災爆炸危險", "D": "蒸氣濃度 7.5%，高於上限，無火災爆炸危險"}, "answer": "D", "explain": "有液體殘留時濃度＝57/760×100＝7.5%，高於爆炸上限 7.0%，故不在範圍內、無火災爆炸危險；0.075% 為漏乘 100。", "ref": "火災學筆記 題型10", "subject": "火災學", "src": "new"}, {"id": "F-N1-107", "topic": "爆炸", "stem": "500 m³ 密閉空間（1 atm、25℃，1 莫耳氣體 24.45 公升）內，200 ml 某液體（分子量 78、密度 0.88 g/ml）打破後全部蒸發無殘留，空間內蒸氣濃度約為多少？", "opts": {"A": "0.0101%", "B": "0.0110%", "C": "0.00004%", "D": "1.10%"}, "answer": "B", "explain": "重量＝200×0.88＝176 g → 2.256 mol → ×24.45 L≒55.2 L＝0.0552 m³ → 濃度≒0.0110%；誤用 22.4 L 得 0.0101%，把液體 0.2 L 直接當氣體體積得 0.00004%。", "ref": "火災學筆記 題型10", "subject": "火災學", "src": "new"}, {"id": "F-N1-108", "topic": "燃燒", "stem": "電容量 100 pF 的電容器充電至 2000 V 後放電，其放電能量為多少？", "opts": {"A": "0.4 mJ", "B": "200 mJ", "C": "0.2 mJ", "D": "0.0001 mJ"}, "answer": "C", "explain": "h＝½CV²＝½×100×10⁻¹²×2000²＝2×10⁻⁴ J＝0.2 mJ；0.4 mJ 為漏乘 ½，200 mJ 為 pF 誤換成 10⁻⁹ F，0.0001 mJ 為誤用 ½CV。", "ref": "火災學筆記 題型11", "subject": "火災學", "src": "new"}, {"id": "F-N1-109", "topic": "燃燒", "stem": "某電容器帶電荷量 2×10⁻⁶ 庫侖、電壓 500 V，放電時所釋放的能量為多少？", "opts": {"A": "0.5 mJ", "B": "1.0 mJ", "C": "0.25 mJ", "D": "5.0 mJ"}, "answer": "A", "explain": "h＝½QV＝½×2×10⁻⁶×500＝5×10⁻⁴ J＝0.5 mJ；1.0 mJ 為漏乘 ½。", "ref": "火災學筆記 題型11", "subject": "火災學", "src": "new"}, {"id": "F-N1-110", "topic": "燃燒", "stem": "某可燃性氣體最小發火能量為 0.25 mJ，以 200 pF 之電容器放電，至少需充電至約多少伏特才可能點燃？", "opts": {"A": "1118 V", "B": "2500 V", "C": "1581 V", "D": "2.5×10⁶ V"}, "answer": "C", "explain": "h＝½CV² → V＝√（2h/C）＝√（2×0.25×10⁻³÷200×10⁻¹²）≒1581 V；漏了 2 得 1118 V，2.5×10⁶ V 為未開根號。", "ref": "火災學筆記 題型11", "subject": "火災學", "src": "new"}, {"id": "F-N2-001", "topic": "火災", "stem": "依火災學之定義，所謂「火災」係指下列何者？", "opts": {"A": "違反人的意思或縱火而有滅火必要的燃燒現象", "B": "凡造成財物損失之一切燃燒現象", "C": "經消防機關出動並實施滅火之燃燒現象", "D": "燃燒物經濟價值達一定金額以上之燃燒現象"}, "answer": "A", "explain": "火災須同時具備「違反人的意思或縱火」與「有滅火必要」兩條件；不以財損、是否出動或經濟價值為準。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-002", "topic": "火災", "stem": "火災定義中「有滅火必要的燃燒現象」，其判斷依據下列何者正確？", "opts": {"A": "以失火者或縱火者本人之主觀認定為依據", "B": "依社會常理客觀判斷，以產生或可能產生公共危險加以認定", "C": "以燃燒物之經濟價值高低為判斷依據", "D": "以現場實際有無實施滅火動作為認定依據"}, "answer": "B", "explain": "有滅火必要不以本人主觀、不以經濟價值、也不以實際有無滅火動作認定，而是依社會常理客觀判斷有無公共危險及延燒危險。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-003", "topic": "火災", "stem": "依 104 年修訂公布之 CNS 1387 火災分類，C 類火災係與下列何者有關？", "opts": {"A": "通電中之電氣設備", "B": "金屬", "C": "氣體", "D": "烹調用植物或動物油脂"}, "answer": "C", "explain": "CNS 1387 之 C 類與氣體有關；「通電中之電氣設備」是滅火器認可基準的 C 類，兩者易混淆。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-004", "topic": "火災", "stem": "依 CNS 1387 火災分類，與炊煮器具所用之烹調用介質（如植物或動物油或脂肪）有關之火災屬於何類？", "opts": {"A": "B 類", "B": "D 類", "C": "K 類", "D": "F 類"}, "answer": "D", "explain": "CNS 1387 將烹調用油脂獨立為 F 類；B 類為液體或可液化之固體，D 類為金屬。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-005", "topic": "火災", "stem": "依內政部「滅火器認可基準」之火災分類，C 類火災係指下列何者？", "opts": {"A": "通電中之電氣機械器具及電氣設備引起之火災", "B": "可燃性氣體洩漏引起之火災", "C": "鈉、鉀、鎂等金屬物質引起之火災", "D": "石油類、有機溶劑等可燃性液體引起之火災"}, "answer": "A", "explain": "滅火器認可基準之 C 類為電氣火災（須為通電中）；可燃性氣體是 CNS 1387 的 C 類。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-006", "topic": "火災", "stem": "依火災對象物分類，棉被在行駛中之貨車車斗上起火燃燒，應歸類為何種火災？", "opts": {"A": "建築物火災", "B": "車輛火災", "C": "其他火災", "D": "森林田野火災"}, "answer": "B", "explain": "依對象物分類看「燒在哪裡」而非燒什麼；棉被在貨車上燒損屬車輛（或其裝載物品）火災。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-007", "topic": "火災", "stem": "我國火災統計新制中，所謂「A1 類火災案件」係指下列何者？", "opts": {"A": "造成人員受傷之火災案件", "B": "涉及縱火之火災案件", "C": "造成人員死亡之火災案件", "D": "起火原因待查之火災案件"}, "answer": "C", "explain": "A1 為造成人員死亡；受傷、糾紛、縱火或原因待查屬 A2；其餘為 A3。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-008", "topic": "火災", "stem": "火災受氣象、燃燒物體、建築物構造及地形地物等因素影響，呈現異常複雜之現象，火場為極不安定之場所，消防人員必須隨時提高警覺。此描述屬於火災之何種特性？", "opts": {"A": "成長性", "B": "偶發性", "C": "延燒性", "D": "不定性"}, "answer": "D", "explain": "受多種因素影響而極不安定為不定性；成長性指面積與時間平方成正比，偶發性指無法事先預測。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-009", "topic": "火災", "stem": "釋熱率公式 Q ＝（t/K）² 中，快速成長（fast）之火災成長常數 K（sec/MW^½）為下列何者？", "opts": {"A": "150", "B": "600", "C": "300", "D": "75"}, "answer": "A", "explain": "K＝600 慢速、300 中速、150 快速、75 極快速。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-010", "topic": "火災", "stem": "有關 t² 火災釋熱率公式 Q ＝（t/K）² 之敘述，下列何者正確？", "opts": {"A": "K 值越大，火災成長越快", "B": "K 值越小，火災成長越快", "C": "K 之單位為 kW/s²", "D": "式中 Q 之單位為 kW"}, "answer": "B", "explain": "K 越小，短時間即達高釋熱率；此式 Q 用 MW、K 單位 sec/MW^½，kW/s² 是 Q＝αt² 中 α 的單位。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-011", "topic": "火災", "stem": "釋熱率之單位「瓦特（W）」等於下列何者？", "opts": {"A": "cal/s", "B": "J/min", "C": "J/s", "D": "cal/min"}, "answer": "C", "explain": "瓦特為釋熱「率」，1 W＝1 J/s；熱量本身的單位才是 J、cal、BTU。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-012", "topic": "火災", "stem": "NFPA 92B 係以火災到達多少釋熱率所需之燃燒時間，來區分 t² 火災之成長類型？", "opts": {"A": "1000 kW（1 MW）", "B": "5 MW", "C": "100 BTU/sec", "D": "1055 kW（1000 BTU/sec）"}, "answer": "D", "explain": "NFPA 92B 與 NFPA 72 皆以到達 1055 kW（1000 BTU/s）的時間區分成長類型。", "ref": "火災學筆記第9講", "subject": "火災學", "src": "new"}, {"id": "F-N2-013", "topic": "火災", "stem": "有關 NFPA 92B（2009 Edition）與 NFPA 72（2013 Edition）之 t² 火災分類，下列敘述何者正確？", "opts": {"A": "92B 分四類且給固定值，72 分三類且給區間", "B": "92B 分三類且給區間，72 分四類且給固定值", "C": 等面積，即具有相同火災猛烈度」（等價火災猛烈度）概念者為何人？", "opts": {"A": "Heskestad", "B": "Ingberg（1928 年）", "C": "Alpert", "D": "濱田稔"}, "answer": "B", "explain": "Ingberg 於 1928 年提出等價火災猛烈度；Heskestad 為火焰高度、Alpert 為天花板噴射流、濱田稔為延燒公式。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-027", "topic": "火災", "stem": "影響火災猛烈度之二大因素為何？", "opts": {"A": "可燃物種類及建築物用途", "B": "開口面積及風速", "C": "火場最高溫度及持續時間", "D": "煙濃度及能見度"}, "answer": "C", "explain": "二大因素為最高溫度與持續時間，其餘可燃物性質、數量、排列、空間形狀、開口、絕熱性則影響此二者。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-028", "topic": "火災", "stem": "有關火災危險度（fire risk）之敘述，下列何者正確？", "opts": {"A": "以溫度－時間曲線下之面積呈現", "B": "為衡量火災強度之單位", "C": "與火災猛烈程度無關", "D": "通常以不欲或不利事件發生之機率型態呈現"}, "answer": "D", "explain": "火災危險度為猛烈度的結果量度，常以結構抗火失敗、逃生失敗等機率呈現；面積與強度是火災猛烈度。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-029", "topic": "熱傳", "stem": "依傅立葉導熱定律 q ＝ ΔT ÷（d/KA），若類比電學之歐姆定律，則下列何者相當於「熱阻」？", "opts": {"A": "d/KA", "B": "KA/d", "C": "ΔT/d", "D": "KAΔT"}, "answer": "A", "explain": "溫度差類比電壓、熱流類比電流，d/KA 即為熱阻；ΔT/d 為溫度梯度。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-030", "topic": "熱傳", "stem": "有關熱傳導之敘述，下列何者正確？", "opts": {"A": "一般而言，熱傳導係數：氣體 ＞ 液體 ＞ 固體", "B": "一般而言，熱傳導係數：固體 ＞ 液體 ＞ 氣體", "C": "溫度梯度越大，熱傳導量越小", "D": "截面積越大，熱傳導量越小"}, "answer": "B", "explain": "熱傳導係數固＞液＞氣；溫度梯度、截面積越大，熱傳導量越大。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-031", "topic": "熱傳", "stem": "固體傳導熱能之兩種形式為何？", "opts": {"A": "電磁波與分子擴散", "B": "自然對流與強制對流", "C": "自由電子遷移與晶格振動", "D": "分子擴散與蒸發"}, "answer": "C", "explain": "導電體靠大量自由電子傳熱，絕緣體只能靠晶格振動，故良好導電體多為良好導熱體。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-032", "topic": "熱傳", "stem": "有關熱對流係數 h 之數值範圍，下列何者正確？（單位 W/m²·K）", "opts": {"A": "自然對流 10～500，強制對流 5～25", "B": "自然對流 0.4～100，強制對流 100～1000", "C": "自然對流 1～5，強制對流 25～50", "D": "自然對流 5～25，強制對流 10～500"}, "answer": "D", "explain": "自然對流 h 5～25、強制對流 10～500；0.4～100 為熱輻射波長（μm）。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-033", "topic": "熱傳", "stem": "有關熱輻射之敘述，下列何者正確？", "opts": {"A": "不需媒介物質，以電磁波形式傳遞", "B": "必須藉由流動介質傳遞", "C": "僅能在固體內部傳遞", "D": "其傳播速度與聲速相同"}, "answer": "A", "explain": "熱輻射無需媒介，為電磁波，以光速傳播，波長約 0.4～100 μm。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-034", "topic": "熱傳", "stem": "史帝芬-波茲曼常數 σ 之值為下列何者？", "opts": {"A": "5.67×10⁻⁶ W/m²·K⁴", "B": "5.67×10⁻⁸ W/m²·K⁴", "C": "3×10⁸ W/m²·K⁴", "D": "8.31×10⁻⁸ W/m²·K⁴"}, "answer": "B", "explain": "σ＝5.67×10⁻⁸ W/m²·K⁴；3×10⁸ 是光速（m/s）。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-035", "topic": "熱傳", "stem": "有關輻射率（emissivity）之敘述，下列何者正確？", "opts": {"A": "一般物體輻射率大於 1，稱為灰體", "B": "黑體之輻射率為 0", "C": "依克西荷夫定律，物體之吸收率與輻射率相同", "D": "輻射率為物體輻射能量與同溫度灰體輻射能量之比值"}, "answer": "C", "explain": "輻射率為與同溫度黑體之比值，黑體 ε＝1、一般灰體＜1；Kirchhoff 定律：吸收率＝輻射率。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-036", "topic": "熱傳", "stem": "某輻射源在距離 2 m 處之輻射熱通量為 18 kW/m²，若受輻射物體移至 6 m 處（其他條件不變），其接受之輻射熱通量約為多少？", "opts": {"A": "6 kW/m²", "B": "0.67 kW/m²", "C": "54 kW/m²", "D": "2 kW/m²"}, "answer": "D", "explain": "輻射熱與距離平方成反比：距離 3 倍 → 1/9，18/9＝2；6 為誤用 1/d，0.67 為誤用 1/d³。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-037", "topic": "熱傳", "stem": "受輻射物體接受之輻射熱隨輻射角 θ 之餘弦變化（q′ ＝ q cosθ）。若輻射角由 0° 改為 60°，其接受之輻射熱變為原來之幾倍？", "opts": {"A": "1/2 倍", "B": "√3/2 倍", "C": "1/√2 倍", "D": "2 倍"}, "answer": "A", "explain": "cos60°＝1/2；0° 時（平行位置）承受熱量最高。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-038", "topic": "熱傳", "stem": "物體之絕對溫度由 400 K 升高至 800 K，其他條件不變，依史帝芬-波茲曼公式其熱輻射量變為原來之幾倍？", "opts": {"A": "2 倍", "B": "16 倍", "C": "4 倍", "D": "8 倍"}, "answer": "B", "explain": "q∝T⁴，溫度 2 倍 → 2⁴＝16 倍。", "ref": "火災學筆記第11講", "subject": "火災學", "src": "new"}, {"id": "F-N2-039", "topic": "熱傳", "stem": "熱貫流係指熱由流體 A 通過固體牆壁傳向流體 B，其熱傳遞三階段依序為何？", "opts": {"A": "傳導 → 對流 → 傳導", "B": "輻射 → 傳導 → 輻射", "C": "對流 → 傳導 → 對流", "D": "對流 → 輻射 → 對流"}, "answer": "C", "explain": "流體 A 與壁面間熱傳達（對流）、壁內熱傳導、 explain": "煙的三大危害為毒性、高熱、視覺障礙。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-047", "topic": "煙與熱流", "stem": "一氧化碳（CO）造成人體窒息之機轉為何？", "opts": {"A": "妨礙細胞中氧化酵素之活性", "B": "直接腐蝕氣道黏膜造成壞死", "C": "與血液中之血色素結合，阻礙紅血球的輸氧功能", "D": "使蛋白質沈澱引起組織發炎"}, "answer": "C", "explain": "CO 與血色素結合阻礙輸氧；妨礙氧化酵素為 HCN，腐蝕氣道為 HCl，蛋白質沈澱為甲醛。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-048", "topic": "煙與熱流", "stem": "空氣中一氧化碳濃度達 3000～5000 ppm 時，人體可能出現之情形為何？", "opts": {"A": "8 小時內尚無感覺", "B": "1 小時內感覺頭痛、噁心", "C": "1 分鐘內即死亡", "D": "20～30 分鐘內即死亡"}, "answer": "D", "explain": "3000～5000 ppm（0.5%）20～30 分內死亡；10000 ppm（1%）1 分鐘內死亡。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-049", "topic": "煙與熱流", "stem": "空氣中一氧化碳濃度達 1%（10000 ppm）時，人體可能出現之情形為何？", "opts": {"A": "1 分鐘內即死亡", "B": "20～30 分鐘內即死亡", "C": "2 小時內意識朦朧、逾 2 小時死亡", "D": "1 小時內尚無感覺"}, "answer": "A", "explain": "CO 1% 時 1 分鐘內即死亡。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-050", "topic": "煙與熱流", "stem": "對一氧化碳中毒者之現場處理，下列何者不正確？", "opts": {"A": "將中毒者移至通風良好之處所", "B": "讓中毒者留在原處靜臥，等待自行恢復", "C": "寬鬆中毒者衣物", "D": "中毒者呼吸困難時儘速施予人工呼吸並緊急送醫"}, "answer": "B", "explain": "正確處置為移至通風處、寬鬆衣物、呼吸困難施予人工呼吸、緊急送醫；留在原處會持續吸入 CO。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-051", "topic": "煙與熱流", "stem": "火災煙中何種毒性氣體會妨礙細胞中氧化酵素之活性，造成細胞呼吸停止？", "opts": {"A": "一氧化碳（CO）", "B": "氯化氫（HCl）", "C": "氰酸（HCN）", "D": "二氧化碳（CO₂）"}, "answer": "C", "explain": "HCN 抑制細胞氧化酵素致細胞呼吸停止，來源為木、絲、尼龍、聚胺甲酸酯燃燒。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-052", "topic": "煙與熱流", "stem": "火災中氯化氫（HCl）之主要來源為下列何種材料之燃燒？", "opts": {"A": "聚胺甲酸酯", "B": "硝酸纖維素", "C": "聚丙烯", "D": "聚氯乙烯（PVC）"}, "answer": "D", "explain": "HCl 主要來自 PVC；聚胺甲酸酯生 HCN、硝酸纖維素生 NO₂、聚丙烯多生甲醛與丙烯醛。", "ref": "火災學筆記第13講", "subject": "火災學", "src": "new"}, {"id": "F-N2-053", "topic": "煙與熱流", "stem": "有機物燃燒時均可能產生，尤以聚乙烯、聚丙烯、乙烯龍（Vinylon）等物質發生量最大，且會強烈刺激眼睛、呼吸器及皮膚之無色氣體為何？", "opts": {"A": "丙烯醛", "B": "二氧化氮", "C": "氯化氫", "D": "氰酸"}, "a ", "src": "new"}, {"id": "F-N2-067", "topic": "煙與熱流", "stem": "依中性面位置關係 h₁A₁²T₀ ＝ h₂A₂²T₁，若火場溫度 T₁ 升高，中性面將如何變化？", "opts": {"A": "上移", "B": "不變", "C": "下移", "D": "移至建築物頂部"}, "answer": "C", "explain": "T₁ 變大則 h₂（中性面至下開口距離）變小，中性面下移。", "ref": "火災學筆記第14講", "subject": "火災學", "src": "new"}, {"id": "F-N2-068", "topic": "煙與熱流", "stem": "考慮外部風壓時，在正煙囪效應下，建築物迎風面與背風面之中性面高度如何變化？", "opts": {"A": "迎風面下降，背風面上升", "B": "兩面皆上升", "C": "兩面皆下降", "D": "迎風面上升，背風面下降"}, "answer": "D", "explain": "正煙囪效應下，迎（逆）風面中性面上升、背風面中性面下降。", "ref": "火災學筆記第15講", "subject": "火災學", "src": "new"}, {"id": "F-N2-069", "topic": "煙與熱流", "stem": "有關煙霧管理與煙霧控制之區別，下列何者正確？", "opts": {"A": "煙霧控制係將擋煙物與機械風機產生之氣流和壓差共同使用", "B": "煙霧管理必須使用機械風機產生壓差", "C": "煙霧控制僅以擋煙物、排煙豎井抑制煙氣", "D": "兩者定義完全相同"}, "answer": "A", "explain": "煙霧管理如擋煙物、排煙口、排煙豎井；煙霧控制再加上機械風機的氣流與壓差。", "ref": "火災學筆記第15講", "subject": "火災學", "src": "new"}, {"id": "F-N2-070", "topic": "煙與熱流", "stem": "對走廊、樓梯間等避難通道提供新鮮空氣，使避難通道之空氣壓力高於起火居室，煙霧因而無法逸入，此為何種排煙方式？", "opts": {"A": "排煙室排煙法", "B": "避難通道加壓排煙法", "C": "自然排煙法", "D": "逆煙囪排煙法"}, "answer": "B", "explain": "此為避難通道加壓排煙法；排煙室排煙法是在樓梯間前室設進氣與排煙設備。", "ref": "火災學筆記第15講", "subject": "火災學", "src": "new"}, {"id": "F-N2-071", "topic": "煙與熱流", "stem": "有關避難通道加壓之等效流動面積，下列敘述何者正確？", "opts": {"A": "開口並聯時，等效流動面積比任一開口小", "B": "開口串聯時，等效流動面積為各開口面積之和", "C": "開口並聯時，等效流動面積比任一開口大", "D": "開口串聯時，等效流動面積比任一開口大"}, "answer": "C", "explain": "並聯 Aₑ＝ΣA，比任一開口大；串聯 1/Aₑ²＝Σ1/A²，比任一開口小。", "ref": "火災學筆記第15講", "subject": "火災學", "src": "new"}, {"id": "F-N2-072", "topic": "煙與熱流", "stem": "依 NFPA 規範，開門所需最大力量及門兩側壓差之限制為何？", "opts": {"A": "100 N 及低於 133 Pa", "B": "133 N 及低於 50 Pa", "C": "200 N 及低於 100 Pa", "D": "133 N 及低於 100 Pa"}, "answer": "D", "explain": "NFPA：開門力量 133 N、壓差低於 100 Pa。", "ref": "火災學筆記第15講", "subject": "火災學", "src": "new"}, {"id": "F-N2-073", "topic": "煙與熱流", "stem": "火災熱流現象之四種類型，下列何者不屬之？", "opts": {"A": "煙囪效應", "B": "浮升火柱", "C": "天花板噴射流", "D": "牆壁熱流"}, "answer": "A", "explain": "火災熱流四種：浮升火柱、天花板噴射流、牆壁熱流、開口部熱流；煙囪效應屬影響煙霧流動因素。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-074", "topic": "煙與熱流", "stem": "浮升火柱（fire plume）形成之主要原因為何？", "opts": {"A": "空調系統送風造成之強制對流", "B": "燃燒熱能使居室溫度及壓力變化而產生浮力作用", "C": "升降機運行產生之活塞效應", "D": "外部風壓作用於迎風面"}, "answer": "B", "explain": "燃燒生熱使溫度壓力改變產生浮力，使燃燒生成物、火焰與空氣混合上升形成浮升火柱。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-075", "topic": "煙與熱流", "stem": "Heskestad 火焰平均高度公式 L ＝ －1.02D ＋ 0.235Q^(2/5) 中，Q 之單位為何？", "opts": {"A": "MW", "B": "W", "C": "kW", "D": "kJ"}, "answer": "C", "explain": "Heskestad 式 Q 用 kW；t² 火災 Q＝(t/K)² 才用 MW，須看清楚。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-076", "topic": "煙與熱流", "stem": "浮升火柱上升撞擊天花板後，熱氣流沿天花板下水平移動，使天花板上之探測器及撒水頭感應動作，此熱流稱為何？", "opts": {"A": "牆壁熱流（wall flow）", "B": "開口部熱流", "C": "捲吸氣流", "D": "天花板噴射流（ceiling jet）"}, "answer": "D", "explain": "撞擊天花板後水平移動者為天花板噴射流；受牆阻擋沿牆下流者為牆壁熱流。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-077", "topic": "煙與熱流", "stem": "依 Ronald Alpert 穩態火災之天花板噴射流關係，若火源熱釋放率 Q 變為原來之 8 倍（其他條件不變），則熱流溫度上升量 ΔT 與流體速度 U 分別變為原來之幾倍？", "opts": {"A": "ΔT 4 倍，U 2 倍", "B": "ΔT 2 倍，U 4 倍", "C": "ΔT 8 倍，U 8 倍", "D": "ΔT 4 倍，U 4 倍"}, "answer": "A", "explain": "ΔT∝Q^(2/3) → 8^(2/3)＝4；U∝Q^(1/3) → 8^(1/3)＝2。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-078", "topic": "煙與熱流", "stem": "Alpert 天花板噴射流公式中，判斷使用近火羽中心或遠離中心之溫度公式，其 R/H 分界值為何？", "opts": {"A": "0.15", "B": "0.18", "C": "0.25", "D": "0.5"}, "answer": "B", "explain": "溫度公式以 R/H＝0.18 為界，速度公式以 0.15 為界。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-079", "topic": "煙與熱流", "stem": "依 Alpert 公式考量火源位置效應，火源擺設於 90 度牆角時，應以原熱釋放率之幾倍帶入計算？其原因為何？", "opts": {"A": "2 倍，因輻射熱回饋效應", "B": "4 倍，因煙囪效應", "C": "4 倍，因輻射熱回饋效應", "D": "2 倍，因熱膨脹效應"}, "answer": "C", "explain": "輻射熱回饋使角落與牆邊火焰成長較快：90° 角落 4 倍、僅靠一面牆 2 倍。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-080", "topic": "煙與熱流", "stem": "牆壁熱流一般採用雙層區域模式探討，浮力誘導產生之牆壁熱流流動方向為何？", "opts": {"A": "在下層下降，在上層上升", "B": "上下層皆上升", "C": "上下層皆下降", "D": "在下層上升，在上層下降"}, "answer": "D", "explain": "下層牆溫高於下層空氣、低於上層空氣，故牆壁熱流在下層上升、上層下降。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-081", "topic": "煙與熱流", "stem": "可燃性液體油池火災之「質量燃燒速度」，其單位可表示為下列何者？", "opts": {"A": "g/m²·s", "B": "mm/s", "C": "kJ/g", "D": "kW"}, "answer": "A", "explain": "質量燃燒速度為單位時間、單位面積燒掉的質量；mm/s 為直線燃燒速度。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-082", "topic": "防火與特殊現象", "stem": "防止火焰經由窗戶向上延燒之對策中，採用「縱形窗」之理由為何？", "opts": {"A": "縱形窗面積較大，可加速排煙", "B": "火焰向外噴出時尾端遠離側壁，不致順外壁上升", "C": "縱形窗可使火焰沿側壁向上流動而散熱", "D": "縱形窗之玻璃較耐高溫"}, "answer": "B", "explain": "縱形窗火焰尾端遠離外壁，上層窗承受溫度較低；橫形窗火焰沿外壁上升易燒破上層玻璃。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-083", "topic": "防火與特殊現象", "stem": "防止火焰經由窗戶向上延燒時，所需側壁（Spandrel）之長度與下列何者有關？", "opts": {"A": "建築物總高度及樓層數", "B": "外部風速及濕度", "C": "開口大小 A√H 及可燃物量", "D": "窗框材質及玻璃厚度"}, "answer": "C", "explain": "側壁長度需求與開口因子 A√H 及可燃物量有關。", "ref": "火災學筆記第16講", "subject": "火災學", "src": "new"}, {"id": "F-N2-084", "topic": "火災", "stem": "若某火災在可燃物綿延不斷且無阻斷因素下，起火後 4 分鐘需 3 輛消防車方可滅火，則起火後 12 分鐘約需多少輛消防車？", "opts": {"A": "9 輛", "B": "81 輛", "C": "18 輛", "D": "27 輛"}, "answer": "D", "explain": "面積∝t²：(12/4)²＝9，需 3×9＝27 輛；9 輛是誤用時間一次方（3×3），81 是誤把倍數再平方。", "ref": "火災學筆記 題型12", "subject": "火災學", "src": "new"}, {"id": "F-N2-085", "topic": "火災", "stem": "某 t² 火災成長至 1 MW 需時 150 秒。在火載量充足且未受干預下，自起火至成長至 4 MW 為止，共放出多少能量？", "opts": {"A": "400 MJ", "B": "600 MJ", "C": "1200 MJ", "D": "200 MJ"}, "answer": "A", "explain": "K＝150/√1＝150；4＝(t/150)² → t＝300 s；E＝⅓×300×4＝400 MJ。600 為誤用 ½，1200 為 Q×t，200 為誤用 t＝150 s。", "ref": "火災學筆記 題型12", "subject": "火災學", "src": "new"}, {"id": "F-N2-086", "topic": "火災", "stem": "依 NFPA 72 之規定，某一火災成長至 1055 kW 所需時間為 120 秒，該火災屬何種成長類型？", "opts": {"A": "中速成長", "B": "快速成長", "C": "慢速成長", "D": "極快速成長"}, "answer": "B", "explain": "NFPA 72 只分三類：t＜150 s 為快速（α＝1055/120²≒0.0733＞0.0469）；NFPA 72 無極快速類別。", "ref": "火災學筆記 題型12", "subject": "火災學", "src": "new"}, {"id": "F-N2-087", "topic": "火災", "stem"
