<style>
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunk:#E9ECE8; --ink:#1A2023; --muted:#5B666B; --line:#D5DAD6;
  --accent:#16466B; --accent-ink:#FFFFFF; --accent-soft:#DCE7F0;
  --amend:#8A5A0B; --amend-soft:#F6E7C8;
  --ok:#2F7A4B; --ok-soft:#DDEFE3; --bad:#B3261E; --bad-soft:#F7DEDB;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121719; --surface:#1B2225; --sunk:#232C30; --ink:#E6EAEB; --muted:#9AA6AB; --line:#2F3A3F;
    --accent:#7FB0D8; --accent-ink:#0E1A24; --accent-soft:#1F3344;
    --amend:#E7B25A; --amend-soft:#3A2E17;
    --ok:#6CC38D; --ok-soft:#18321F; --bad:#F08A80; --bad-soft:#3A1B18;
  }
}
:root[data-theme="dark"]{
    --bg:#121719; --surface:#1B2225; --sunk:#232C30; --ink:#E6EAEB; --muted:#9AA6AB; --line:#2F3A3F;
    --accent:#7FB0D8; --accent-ink:#0E1A24; --accent-soft:#1F3344;
    --amend:#E7B25A; --amend-soft:#3A2E17;
    --ok:#6CC38D; --ok-soft:#18321F; --bad:#F08A80; --bad-soft:#3A1B18;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:12px 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 16px;border-bottom:1px solid var(--line)}
.top h1{font-family:var(--serif);font-size:1.45rem;letter-spacing:.02em}
.top .sub{color:var(--muted);font-size:.8rem}
.count{text-align:right}
.count b{font-family:var(--mono);font-size:1.9rem;line-height:1;color:var(--accent)}
.count span{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em}

/* subject panels */
.subjects{display:grid;gap:14px;margin-top:18px}
.subj{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.subj-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.subj h2{font-size:1.1rem}
.subj .meta{font-size:.78rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);margin-block:10px 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.stat{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.stat b{color:var(--ink);font-family:var(--mono);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:.8rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chiplabel{font-size:.7rem;color:var(--muted);letter-spacing:.08em;width:100%;margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-weight:500;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{grid-column:1/-1}
.btn:disabled{opacity:.45;cursor:default}
.btn small{display:block;font-weight:400;font-size:.72rem;opacity:.8}

.foot{margin-top:22px;font-size:.78rem;color:var(--muted);display:grid;gap:8px}
.foot .row{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--accent);padding:0;text-decoration:underline;font-size:.78rem}

/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.qbar .left{display:flex;align-items:center;gap:10px;min-width:0}
.qbar .title{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:.85rem}
.timer{font-family:var(--mono);font-size:1.05rem}
.timer.low{color:var(--bad)}
.progress{height:3px;background:var(--sunk)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qcard{margin-top:16px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:.7rem;padding:1px 8px;border-radius:4px;background:var(--sunk);color:var(--muted);letter-spacing:.03em}
.badge.amend{background:var(--amend-soft);color:var(--amend);font-weight:700}
.badge.new{background:var(--accent-soft);color:var(--accent)}
.qnum{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.9rem;max-height:40vh;overflow:auto;white-space:pre-wrap;margin-bottom:12px}
.stem{font-family:var(--serif);font-size:1.12rem;line-height:1.75;margin:4px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.55}
.opt .k{font-family:var(--mono);width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.verdict{margin-top:14px;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.explain{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.93rem}
.explain .ref{font-size:.78rem;color:var(--muted);margin-top:8px}
.explain blockquote{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--sunk);font-family:var(--serif);font-size:.86rem}
.explain .reason{margin-top:8px;font-size:.82rem;color:var(--amend)}
.nav{display:flex;gap:8px;margin-top:16px}
.nav .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:18px}
.grid button{font-family:var(--mono);font-size:.72rem;padding:5px 0;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--accent)}
.grid button.r{background:var(--ok-soft);border-color:var(--ok)}
.grid button.w{background:var(--bad-soft);border-color:var(--bad)}

/* result */
.result{text-align:center;padding-block:28px 10px}
.result .score{font-family:var(--mono);font-size:3.2rem;line-height:1;color:var(--accent)}
.result .of{color:var(--muted);font-size:.9rem;margin-top:6px}
.breakdown{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.breakdown div{display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--line);font-size:.9rem}
.breakdown div:first-child{border-top:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.85rem;z-index:20}
@media (max-width:420px){.grid{grid-template-columns:repeat(8,1fr)}.stem{font-size:1.05rem}}
@media (display-mode:standalone){
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .qbar{top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="application/json" id="bank">{"subjects": [{"key": "刑事法", "name": "刑事法與消防法規", "short": "刑事法", "when": "11/8（日）13:00・1 小時", "topics": ["災害防救法", "消防法", "刑法", "刑事訴訟法"], "mockN": 50, "mockMin": 60, "mockMix": {"災害防救法": 15, "刑法": 13, "刑事訴訟法": 12, "消防法": 10}}, {"key": "法學", "name": "法學知識與英文", "short": "法學", "when": "11/7（六）13:00・1 小時", "topics": ["憲法", "法學緒論", "英文"], "mockN": 50, "mockMin": 60, "mockMix": {"憲法": 15, "法學緒論": 15, "英文": 20}}, {"key": "國文", "name": "國文（測驗）", "short": "國文", "when": "11/7（六）09:00・與作文同節", "topics": ["國文"], "mockN": 10, "mockMin": 20, "mockMix": {"國文": 10}}], "questions": [{"id": "107-刑事法-01", "src": "old", "year": 107, "n": 1, "subject": "刑事法", "topic": "刑法", "stem": "甲計畫在餐廳毒殺乙。因餐廳內人潮眾多，甲一時不察將毒藥錯放至鄰座顧客丙的湯品中。丙食用後毒發身亡。試問下列敘述何者正確？", "opts": {"A": "甲殺丙係因等價客體錯誤，並不影響殺人故意，成立殺人既遂罪", "B": "基於打擊錯誤，甲殺乙之行為成立殺人未遂罪，殺丙之行為則是成立過失致死罪", "C": "甲誤認丙為乙而殺之，因客體錯誤而僅成立殺人未遂罪", "D": "甲誤認丙為乙而殺之，因客體錯誤而僅成立過失致死罪"}, "answer": "B", "explain": "甲欲毒殺乙，卻因操作失誤把毒放進丙的湯，屬「打擊錯誤」（行為失誤），非客體錯誤（甲並未把丙誤認為乙）。通說及實務採具體符合說：對原欲侵害之乙成立殺人未遂，對實際受害之丙則視有無過失論過失致死，二者想像競合。A、C、D 都把本案錯當客體錯誤處理，所以都錯，答案選 B。", "ref": "刑法§13、§25、§276；學說（打擊錯誤）", "evidence": "已著手於犯罪行為之實行而不遂者，為未遂犯。"}, {"id": "107-刑事法-02", "src": "old", "year": 107, "n": 2, "subject": "刑事法", "topic": "刑法", "stem": "甲、乙二人為土地產權糾紛而有恩怨。某日，甲計畫持槍射殺乙。當甲走向乙之時，乙突然拿出預藏之手槍朝甲射擊。甲因反應不及而遭乙射殺身亡。實際上，乙根本不知甲的殺人計畫。試問乙之行為屬於下列何者？", "opts": {"A": "緊急避難", "B": "誤想防衛", "C": "誤想避難", "D": "偶然防衛"}, "answer": "D", "explain": "乙開槍時客觀上確實有甲「現在不法之侵害」（甲正持槍要殺乙），但乙主觀上完全不知道，欠缺防衛意思，學說稱為「偶然防衛」，多數說認為成立未遂或既遂仍有爭議，但名稱上即為偶然防衛。誤想防衛是主觀以為有侵害、客觀其實沒有，情形剛好相反；緊急避難與誤想避難也都不符合本題情境。", "ref": "刑法§23；學說（偶然防衛）", "evidence": "對於現在不法之侵害，而出於防衛自己或他人權利之行為，不罰。"}, {"id": "107-刑事法-03", "src": "old", "year": 107, "n": 3, "subject": "刑事法", "topic": "刑法", "stem": "依刑法第 227 條第 1 項規定，與未滿 14 歲之男女為性交者，處 3 年以上 10 年以下有期徒刑。12 歲的甲經父母同意而與 13 歲的乙為性交。下列敘述何者正確？", "opts": {"A": "甲、乙均未滿 14 歲，依刑法第 18 條第 1 項規定不罰", "B": "甲因得父母同意而與乙從事性交，可主張得父母同意而阻卻不法", "C": "假設甲、乙心智與外觀均已相當成熟，即應處罰", "D": "依刑法第 227 條之 1 規定，18 歲以下之人犯刑法第 227 條第 1 項之罪，減輕或免除其刑。甲、乙因而不適用刑法第 18 條第 1 項"}, "answer": "A", "explain": "甲 12 歲，未滿 14 歲，依刑法§18Ⅰ屬無責任能力人，行為不罰；乙 13 歲同樣不罰。§227 是在保護未滿 14 歲的人，父母同意不能阻卻違法（B 錯）；責任能力依年齡一律判斷，不因心智成熟而改變（C 錯）；§227-1 是「減輕或免除其刑」的規定，並不排除§18 的適用（D 錯）。", "ref": "刑法§18Ⅰ、§227、§227-1", "evidence": "未滿十四歲人之行為，不罰。"}, {"id": "107-刑事法-04", "src": "old", "year": 107, "n": 4, "subject": "刑事法", "topic": "刑法", "stem": "依最高法院之見解，下列有關刑法第 185 條之 4 肇事逃逸罪的敘述，何者為正確？", "opts": {"A": "本罪目的在於保護交通安全及加強救護，減少被害人之死傷，促使駕駛人於肇事後即時救護，駕駛人肇事因而至少應有過失", "B": "逃逸僅限於積極逃亡或隱匿等阻礙犯罪偵查行為，單純停留於現場非屬逃逸", "C": "肇事不以行為人對事故發生負有過失責任，但仍以非出於故意為必要", "D": "蓄意運用駕駛車輛招致事故發生且逃逸者，仍應成立本罪"}, "answer": "C", "explain": "肇事逃逸罪不以駕駛人對事故有過失為要件，現行§185-4Ⅱ明定無過失時「減輕或免除其刑」，可見無過失也會成立本罪；但實務認為故意製造事故屬故意犯罪，並非「交通事故」，不適用本條（C 正確）。A 說必須有過失，錯；B 說單純停留非逃逸，但本罪處罰的正是未留在現場救護、離開的行為，錯；D 故意製造事故後逃逸應論故意犯罪，不成立本罪，錯。", "ref": "刑法§185-4", "evidence": "犯前項之罪，駕駛人於發生交通事故致人死傷係無過失者，減輕或免除其刑。"}, {"id": "107-刑事法-05", "src": "old", "year": 107, "n": 5, "subject": "刑事法", "topic": "刑法", "stem": "下列何種情形屬於中止犯的己意中止：", "opts": {"A": "甲欲竊取乙背包內的財物，卻因無法即時拉開背包拉鍊而放棄犯行", "B": "甲於砍殺乙後，心生悔意，委請丙將乙送醫急救，乙幸無大礙", "C": "甲持刀欲砍殺乙之時，乙突然大聲呼救，因而驚動鄰居，甲見狀隨即棄刀自首", "D": "甲持槍欲射殺乙，瞄準後發現是丙，甲立刻收手"}, "answer": "B", "explain": "中止犯須「己意」中止或防止結果發生。B 甲出於悔意，主動委請他人送醫，防止了死亡結果，屬己意防止結果，成立中止犯。A 拉不開拉鍊、C 被呼救驚動，都是受外在障礙影響而放棄，屬障礙未遂；D 發現對象不是乙而收手，是因為犯罪計畫無法實現而放棄，並非己意中止。", "ref": "刑法§27Ⅰ", "evidence": "已著手於犯罪行為之實行，而因己意中止或防止其結果之發生者，減輕或免除其刑。"}, {"id": "107-刑事法-06", "src": "old", "year": 107, "n": 6, "subject": "刑事法", "topic": "刑法", "stem": "下列何種情形，非屬禁止錯誤？", "opts": {"A": "外國人甲在臺灣吸食大麻，其不知在臺灣吸食大麻為違法行為", "B": "丈夫甲誤以為使用強暴手段迫使妻子乙行房，不構成強制性交罪", "C": "醫師甲誤以為只要告知病患乙藥物療效，即表示乙同意接受藥物之副作用", "D": "甲誤以為將現行犯乙逮捕後，得將其監禁數日，藉此讓其知所悔改"}, "answer": "C", "explain": "禁止錯誤指行為人對行為的「違法性」認識錯誤。A 不知吸食大麻違法（直接禁止錯誤）、B 誤以為強迫配偶性交不構成犯罪（涵攝／禁止錯誤）、D 誤以為逮捕現行犯後可以監禁數日（對阻卻違法事由的「範圍」認識錯誤，屬間接禁止錯誤），都屬禁止錯誤。C 醫師誤以為病患已同意承擔副作用，是對阻卻違法「事實前提」（同意事實）的誤認，屬容許構成要件錯誤，並非禁止錯誤。", "ref": "刑法§16；學說", "evidence": "除有正當理由而無法避免者外，不得因不知法律而免除刑事責任。"}, {"id": "107-刑事法-07", "src": "old", "year": 107, "n": 7, "subject": "刑事法", "topic": "刑法", "stem": "甲夜間騎腳踏車行經某公園，突見乙男將手伸入丙女之背包。甲誤認乙正竊取丙的財物，因而加速騎車將乙撞倒。實際上乙、丙為夫妻關係，乙伸手只是為了幫丙從背包拿取手機。試問甲之行為應如何評價？", "opts": {"A": "偶然防衛", "B": "緊急避難", "C": "誤想防衛", "D": "等價客體錯誤"}, "answer": "C", "explain": "乙只是幫太太拿手機，客觀上並沒有現在不法之侵害；甲卻誤以為有竊盜正在發生而出手，屬「誤想防衛」（容許構成要件錯誤）。偶然防衛則是客觀上有侵害、行為人主觀不知道，情形相反；本案沒有避難情境，也不是對行為客體的認識錯誤，所以 A、B、D 都不對。", "ref": "刑法§23；學說（誤想防衛）", "evidence": "對於現在不法之侵害，而出於防衛自己或他人權利之行為，不罰。"}, {"id": "107-刑事法-08", "src": "old", "year": 107, "n": 8, "subject": "刑事法", "topic": "刑法", "stem": "依最高法院之見解，下列有關刑法第 294 條違背義務遺棄罪之敘述，何者為正確？", "opts": {"A": "甲在醫院生下嬰兒乙。甲因經濟困頓而不願扶養，便趁夜間醫療人員不注意時離開醫院。甲成立違背義務遺棄罪", "B": "甲駕駛汽車不慎將行人乙撞倒。乙頭部受到撞擊，當場血流不止。雖甲預見乙有生命危險，卻仍盡速駕車駛離現場。甲應成立刑法第 185 條之 4 肇事致死傷逃逸罪，而非違背義務遺棄罪", "C": "殘廢、老弱、欠缺資金、技能或未受教育之人，均屬本罪規定的無自救力之人", "D": "甲對父親乙負有扶養義務，卻不履行。乙平日仍有積蓄可供生活所需，因此僅可依據民法向甲請求救濟。甲不成立違背義務遺棄罪"}, "answer": "D", "explain": "違背義務遺棄罪的對象限於「無自救力之人」，實務認為必須是欠缺維持生存所必要能力的人。父親乙有積蓄足以維持生活，不是無自救力之人，甲只負民法上的扶養責任，不成立本罪（D 正確）。C 說欠缺資金或技能就算無自救力，範圍過寬，錯；A 嬰兒留在醫院受照護，生命尚無危險，實務不認定成立；B 實務認為肇事逃逸與遺棄罪可以併存，不是只成立逃逸罪。", "ref": "刑法§294", "evidence": "對於無自救力之人，依法令或契約應扶助、養育或保護而遺棄之"}, {"id": "107-刑事法-09", "src": "old", "year": 107, "n": 9, "subject": "刑事法", "topic": "刑法", "stem": "依最高法院之判例見解，下列何者敘述為正確？", "opts": {"A": "甲乙丙三人共同謀議進入丁宅竊取財物。行竊當日，乙、丙二人進入丁宅，甲則是在二公里外的超商等待。若乙、丙有突發事件，即刻驅車前往將其二人載離現場。乙丙順利竊得財物，步行離開丁宅一段距離後，始由甲開車載走。甲乙丙三人成立刑法第 321 條第 1 項第 4 款結夥三人竊盜罪", "B": "甲乙丙三人攜帶兇器且結夥竊取丁之財物。甲乙丙均成立兩個刑法第 321 條第 1 項之加重竊盜罪", "C": "甲擬破壞乙宅的門窗進入行竊。正當準備破壞之際，隨即被屋內的乙發現。甲隨即快跑離開現場。甲成立刑法第 321 條第 2 項之加重竊盜未遂罪", "D": "甲在公寓大廈的樓梯間竊取置於乙宅門口的雨傘。甲成立刑法第 321 條第 1 項第 1 款侵入住宅之加重竊盜罪"}, "answer": "D", "explain": "實務認為公寓大廈的樓梯間屬於住宅的一部分，進入樓梯間竊取住戶門口物品，屬侵入住宅加重竊盜（D）。A 結夥三人須三人都在場，甲在 2 公里外不算；B 同一竊盜行為兼具數款加重事由，只成立一個加重竊盜罪；C 甲還沒著手毀越門窗就逃離，只到預備階段，不成立未遂。（註：判例制度已於 108 年改制，但這個見解仍被沿用。）", "ref": "刑法§321Ⅰ①", "evidence": "侵入住宅或有人居住之建築物、船艦或隱匿其內而犯之。"}, {"id": "107-刑事法-10", "src": "old", "year": 107, "n": 10, "subject": "刑事法", "topic": "刑法", "stem": "依司法院大法官解釋及最高法院判例，下列有關刑法第 329 條準強盜罪之解釋，何者為正確？", "opts": {"A": "依司法院大法官釋字第 630 號解釋，雖準強盜罪之法定刑同於強盜罪，但依法條文義，其強暴、脅迫無需達到使人難以抗拒", "B": "準強盜罪之既未遂應以竊盜或搶奪之既未遂為標準", "C": "行為人於行竊時，復以強暴脅迫手段奪取他人之物為己有，應成立準強盜罪", "D": "行為人於竊取既遂後，迅速離開盜所。然於途中與被害人撞遇。行為人為脫免逮捕而對被害人施以強暴，應成立準強盜罪"}, "answer": "B", "explain": "實務認為準強盜罪的既遂或未遂，應以前行為（竊盜或搶奪）是否既遂為準（B）。A 錯：釋字 630 號要求強暴脅迫須達到使人難以抗拒的程度，才符合罪刑相當；C 行竊時直接用強暴脅迫奪取財物，應成立強盜罪，不是準強盜；D 竊得財物、離開現場後在途中巧遇被害人，已不符合「當場」要件。", "ref": "刑法§329", "evidence": "竊盜或搶奪，因防護贓物、脫免逮捕或湮滅罪證，而當場施以強暴脅迫者，以強盜論。"}, {"id": "107-刑事法-11", "src": "old", "year": 107, "n": 11, "subject": "刑事法", "topic": "刑法", "stem": "甲涉嫌殺害乙。在檢警追捕的過程，甲致電好友丙，告知其殺人其實是為了正當防衛，並且請求丙讓其借宿或協助安排旅館。丙一時心軟，卻又不願招惹過多麻煩，因此幫甲安排 A 旅館留宿三晚，並且付清旅館費用。下列敘述何者正確？", "opts": {"A": "雖甲基於正當防衛而殺人，仍屬刑法第 164 條藏匿人犯罪之「犯人」", "B": "丙協助安排甲在Ａ旅館過夜且幫其付清旅館費用，成立幫助藏匿人犯罪", "C": "丙相信甲之所為乃是出於正當防衛，因而不具備藏匿人犯之故意", "D": "甲致電丙，請求丙讓其借宿或安排旅館，成立教唆藏匿人犯罪"}, "answer": "A", "explain": "藏匿人犯罪中的「犯人」，實務認為包括犯罪嫌疑人，不以經判決確定有罪為必要，甲主張正當防衛也不影響其為犯人（A）。丙安排旅館並代付費用，是自己實行藏匿，屬正犯而非幫助犯（B 錯）；丙明知甲涉嫌殺人仍助其躲避，已有藏匿故意（C 錯）；犯人自行隱避不罰，教唆他人藏匿自己，實務也認為不另成立教唆罪（D 錯）。", "ref": "刑法§164Ⅰ", "evidence": "藏匿犯人或依法逮捕、拘禁之脫逃人或使之隱避者"}, {"id": "107-刑事法-12", "src": "old", "year": 107, "n": 12, "subject": "刑事法", "topic": "刑法", "stem": "依最高法院之判例見解，下列有關刑法第 168 條偽證罪之敘述，何者正確？", "opts": {"A": "證人甲向檢察官虛偽表示，被告乙為道貌岸然的偽君子，應成立偽證罪", "B": "被告甲、乙二人為夫妻，其共同教唆丙作偽證，應成立偽證罪之共同正犯", "C": "檢察官訊問證人甲，未踐行證人有拒絕證言權利之告知義務。證人甲所為之虛偽證言，不成立偽證罪", "D": "依刑事訴訟法第 186 條第 1 項第 1 款規定，未滿 16 歲者，不得令其具結。檢察官訊問 15 歲的證人甲並令其具結。甲所為之虛偽證言，仍成立偽證罪"}, "answer": "C", "explain": "證人有拒絕證言權時，依刑訴§186Ⅱ應告知得拒絕證言；實務認為未告知就命具結，程序有瑕疵，證人即使作虛偽陳述，也不成立偽證罪（C）。A「偽君子」屬意見評價，不是與案情有重要關係的事實；B 被告教唆他人為自己作偽證，實務不論以偽證罪的共同正犯；D 未滿 16 歲的人依法不得令其具結，具結無效，自然不成立偽證罪。", "ref": "刑法§168；刑訴§186Ⅱ", "evidence": "證人、鑑定人、通譯於案情有重要關係之事項，供前或供後具結，而為虛偽陳述者"}, {"id": "107-刑事法-13", "src": "old", "year": 107, "n": 13, "subject": "刑事法", "topic": "刑法", "stem": "甲竊取乙之提款卡，預計從乙戶頭提領 1 萬元之後，便將卡片歸還於原處。甲使用超商的提款機，插入卡片並輸入卡片密碼，順利取得 1 萬元現金。試問以下敘述何者正確？", "opts": {"A": "甲從提款機提領現金 1 萬元，屬未經乙同意而竊取其動產", "B": "甲從提款機提領現金 1 萬元，屬未經銀行同意而竊取其動產", "C": "甲擅自輸入卡片密碼提領現金，屬冒名提領而成立刑法第 339 條第 1 項詐欺罪", "D": "甲擅自輸入卡片密碼提領現金，成立刑法第 339 條之 2 不正利用自動付款設備罪"}, "answer": "D", "explain": "持他人提款卡並輸入密碼，從自動提款機取得現金，屬「以不正方法由自動付款設備取得他人之物」，成立§339-2（D）。提款機是機器，不會陷於錯誤，所以不成立詐欺（C 錯）；本條是針對自動付款設備的特別規定，應優先於竊盜罪適用（A、B 錯）。", "ref": "刑法§339-2Ⅰ", "evidence": "以不正方法由自動付款設備取得他人之物者"}, {"id": "107-刑事法-14", "src": "old", "year": 107, "n": 14, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "張三（住所於臺北市）犯有竊盜罪，李四（居所於基隆）犯有詐欺罪，並一同於桃園犯強盜罪。臺北地方法院、基隆地方法院及桃園地方法院分別就竊盜罪、詐欺罪及強盜罪都提起了公訴。試問，下列敘述，何者正確？", "opts": {"A": "張三的強盜罪案件不得合併由臺北地方法院審判，因為該罪的犯罪地不在臺北市", "B": "李四的詐欺罪案件不得合併由桃園地方法院審判，因為該罪的犯罪地不在桃園", "C": "竊盜罪、詐欺罪及強盜罪案件是否得移送於一法院合併審判，以各法院裁定先後而定", "D": "竊盜罪、詐欺罪及強盜罪案件是否得移送於一法院合併審判，各該法院不同意時，由臺灣高等法院裁定之"}, "answer": "D", "explain": "張三、李四共同犯強盜罪，與各自另犯的竊盜罪、詐欺罪之間，有一人犯數罪或數人共犯之相牽連關係。案件已分別繫屬於數個同級法院時，經各法院同意，得裁定移送一法院合併審判；有法院不同意時，由共同的直接上級法院（臺灣高等法院）裁定（D）。A、B 誤以為必須是犯罪地法院才能合併；C 誤以為依裁定先後決定。", "ref": "刑訴§6Ⅱ、§7", "evidence": "有不同意者，由共同之直接上級法院裁定之。"}, {"id": "107-刑事法-15", "src": "old", "year": 107, "n": 15, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "原住民張三是竊盜罪現行犯，被逮捕後，移送至警察局進行詢問。試問，下列敘述，何者正確？", "opts": {"A": "司法警察官員無須通知依法設立之法律扶助機構指派律師到場為其辯護，因為張三所涉犯的不是最輕本刑為 3 年以上有期徒刑之罪", "B": "司法警察官員應通知依法設立之法律扶助機構指派律師到場為其辯護，因為張三是原住民", "C": "若無律師到場，即便張三主動請求立即詢問，司法警察仍不得進行詢問", "D": "等候律師逾 4 小時未到場，未經檢察官同意，仍不得逕行訊問或詢問"}, "answer": "B", "explain": "依刑訴§31Ⅴ，犯罪嫌疑人具原住民身分，偵查中未經選任辯護人者，司法警察應通知法律扶助機構指派律師到場，不論所犯何罪（B 對、A 錯）。同項但書規定，嫌疑人主動請求立即詢問，或等候律師逾 4 小時仍未到場，都可以逕行詢問，不需檢察官同意，所以 C、D 錯。", "ref": "刑訴§31Ⅴ", "evidence": "或具原住民身分，於偵查中未經選任辯護人，檢察官、司法警察官或司法警察應通知依法設立之法律扶助機構指派律師到場為其辯護"}, {"id": "107-刑事法-17", "src": "old", "year": 107, "n": 17, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "張三滿身是血，手上持刀。試問，下列敘述，何者正確？", "opts": {"A": "非司法警察官員不得逮捕張三，因其並非現行犯", "B": "不得逮捕張三，因為其未被追呼為犯罪之人", "C": "未經檢察官同意，司法警察官員不得逮捕張三", "D": "任何人均得逮捕張三，因其持有兇器且於身體、衣服等處露有犯罪痕跡，顯可疑為犯罪之人"}, "answer": "D", "explain": "依§88Ⅲ②，持有兇器、贓物或其他物件，或身體、衣服等處露有犯罪痕跡，顯可疑為犯罪人者，以現行犯論（準現行犯）；而現行犯不問何人都可以逕行逮捕（D）。張三雖不是真正的現行犯，但屬準現行犯；逮捕不以被追呼為要件，也不需要經檢察官同意，所以 A、B、C 都錯。", "ref": "刑訴§88Ⅰ、Ⅲ②", "evidence": "因持有兇器、贓物或其他物件，或於身體、衣服等處露有犯罪痕跡，顯可疑為犯罪人者。"}, {"id": "107-刑事法-18", "src": "old", "year": 107, "n": 18, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "張三因涉嫌犯罪，但自認清白，故自行至警察局接受詢問。試問，下列敘述，何者正確？", "opts": {"A": "司法警察於詢問中，無須全程錄音，因只有被告接受檢察官訊問時，才有此等要求", "B": "因張三是自行到場接受詢問，所以無須全程錄音", "C": "因張三未有律師陪同，所以於詢問中應全程錄音", "D": "詢問張三應全程連續錄音，但有急迫情況且經記明筆錄者，不在此限"}, "answer": "D", "explain": "§100-1 規定訊問被告應全程連續錄音，並依§100-2 準用於司法警察詢問犯罪嫌疑人，不論是否自行到場、有沒有律師陪同都適用。但書規定，有急迫情況且記明筆錄者，可以不錄音（D）。A 誤以為只適用於檢察官訊問；B、C 誤以為依到場方式或有無律師而有差別。", "ref": "刑訴§100-1Ⅰ、§100-2", "evidence": "訊問被告，應全程連續錄音；必要時，並應全程連續錄影。但有急迫情況且經記明筆錄者，不在此限。"}, {"id": "107-刑事法-19", "src": "old", "year": 107, "n": 19, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "強盜罪的現行犯張三在移送至警察局後表示欲選任律師為辯護人。試問，下列敘述，何者正確？", "opts": {"A": "在律師到場前，司法警察可以詢問被告，但被告可以拒絕回答", "B": "在律師到場前，司法警察可以詢問被告，因張三所涉犯的是最輕本刑為 3 年以上有期徒刑之案件", "C": "在等待律師逾 4 小時後，司法警察便可以詢問被告", "D": "只要沒有律師在場，司法警察便不得詢問被告"}, "answer": "C", "explain": "無辯護人的被告表示要選任辯護人時，應即停止訊問（§95Ⅱ），所以 A、B 錯。依§93-1Ⅰ⑤，因等候辯護人到場而未詢問的時間，不計入 24 小時，但等候時間不得逾 4 小時；逾 4 小時律師仍未到，就可以進行詢問（C）。D 說沒有律師在場就一律不得詢問，錯誤。", "ref": "刑訴§93-1Ⅰ⑤、§95Ⅱ", "evidence": "被告或犯罪嫌疑人因表示選任辯護人之意思，而等候辯護人到場致未予訊問。但等候時間不得逾四小時。"}, {"id": "107-刑事法-20", "src": "old", "year": 107, "n": 20, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "檢察官向法院聲請羈押被告張三。試問，下列敘述，何者正確？", "opts": {"A": "於法官進行羈押審查程序時，檢察官得到場陳述聲請羈押之理由及提出必要之證據", "B": "於法官進行羈押審查程序時，檢察官請求法院限制或禁止被告及其辯護人獲知卷證時，得到場敘明理由，並指明限制或禁止之範圍", "C": "法院禁止被告及其辯護人獲知之卷證，仍可作為羈押決定之依據，但不得作為唯一的證據", "D": "法官認張三所犯為死刑、無期徒刑或最輕本刑為 5 年以上有期徒刑之罪，即應裁定羈押"}, "answer": "A", "explain": "§101Ⅱ前段規定，法官訊問時，檢察官「得」到場陳述聲請羈押之理由及提出必要之證據（A）。但依但書，檢察官請求限制卷證獲知時，「應」到場敘明理由並指明範圍，B 寫成「得」，錯；經禁止獲知的卷證依§101Ⅲ「不得作為羈押審查之依據」，C 錯；重罪羈押仍須有相當理由認為有逃亡、滅證之虞及羈押必要，不是一律羈押，D 錯。", "ref": "刑訴§101Ⅱ", "evidence": "檢察官得到場陳述聲請羈押之理由及提出必要之證據。"}, {"id": "107-刑事法-21", "src": "old", "year": 107, "n": 21, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "檢察官誤向法院起訴未成年人張三。試問，下列敘述，何者正確？", "opts": {"A": "法院應諭知不受理判決", "B": "法院應諭知免訴判決", "C": "法院應諭知管轄錯誤判決", "D": "法院應諭知無罪判決"}, "answer": "A", "explain": "少年刑事案件須先經少年法院依少年事件處理法移送檢察官，檢察官才能起訴。檢察官逕行向普通法院起訴未成年人，屬起訴之程序違背規定，應依§303①諭知不受理判決（A）。本案不涉及實體判斷（排除 D），也不屬於免訴事由（排除 B）或管轄錯誤（排除 C）。", "ref": "刑訴§303①", "evidence": "案件有下列情形之一者，應諭知不受理之判決："}, {"id": "107-刑事法-22", "src": "old", "year": 107, "n": 22, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於扣押，下列敘述，何者正確？", "opts": {"A": "非附隨於搜索之扣押，扣押標的為證據之物者，應經法官裁定", "B": "非附隨於搜索之扣押，即使經受扣押標的權利人同意，仍應經法官裁定", "C": "非附隨於搜索之扣押，由檢察官以命令為之", "D": "司法警察官員於偵查中有相當理由認為情況急迫，有立即扣押之必要時，得逕行扣押"}, "answer": "D", "explain": "依§133-2Ⅲ，檢察官、檢察事務官、司法警察官或司法警察於偵查中，有相當理由認為情況急迫、有立即扣押之必要時，得逕行扣押（D）。§133-1Ⅰ規定，非附隨於搜索的扣押原則上應經法官裁定，但為了取得證據而扣押，或經權利人同意者除外，所以 A、B 錯；C 說由檢察官以命令為之，也錯。", "ref": "刑訴§133-1Ⅰ、§133-2Ⅲ", "evidence": "於偵查中有相當理由認為情況急迫，有立即扣押之必要時，得逕行扣押"}, {"id": "107-刑事法-23", "src": "old", "year": 107, "n": 23, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "審理後，法院對於被告張三的竊盜案件諭知有罪判決，張三當庭表示捨棄上訴。試問，下列敘述，何者正確？", "opts": {"A": "張三的捨棄無效，因其非以書狀為之", "B": "張三的配偶仍可為張三上訴", "C": "張三仍可上訴，因為上訴權是重要的訴訟權利，被告不得捨棄", "D": "經法院同意後，張三仍可提起上訴"}, "answer": "B", "explain": "依§345，被告之配偶得為被告之利益「獨立」上訴，不受被告本人捨棄上訴的影響（B）。捨棄上訴原則上應以書狀為之，但依§358Ⅰ但書，於審判期日得以言詞為之，所以當庭捨棄有效（A 錯）；上訴權可以捨棄（C 錯）；捨棄後即喪失上訴權，也不能經法院同意再上訴（D 錯）。", "ref": "刑訴§345、§358Ⅰ", "evidence": "被告之法定代理人或配偶，得為被告之利益獨立上訴。"}, {"id": "107-刑事法-24", "src": "old", "year": 107, "n": 24, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於再審，下列敘述，何者正確？", "opts": {"A": "僅得為判決人之利益聲請再審", "B": "檢察官不得為受判決人的利益聲請再審", "C": "受判決人的配偶得聲請再審", "D": "聲請再審後，刑罰執行之效力停止"}, "answer": "C", "explain": "依§427③，受判決人的法定代理人或配偶，得為受判決人之利益聲請再審（C）。依§428，檢察官及自訴人也可以為受判決人之不利益聲請再審，所以 A 錯；檢察官也可以為受判決人之利益聲請（§427①），B 錯；§430 規定聲請再審無停止刑罰執行之效力，D 錯。", "ref": "刑訴§427③、§430", "evidence": "受判決人之法定代理人或配偶。"}, {"id": "107-刑事法-25", "src": "old", "year": 107, "n": 25, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "證人張三在調查中向司法警察陳明看到李四強盜，但是在審判中卻證稱不復記憶。試問，下列敘述，何者正確？", "opts": {"A": "張三在司法警察詢問時的陳述為被告以外之人在審判外的陳述，有證據能力", "B": "張三在審判中的陳述沒有證據能力，因為與其在司法警察詢問中的陳述不一致", "C": "張三在司法警察詢問時的陳述是在公務員前所為，所以有證據能力", "D": "張三在司法警察詢問時的陳述，若具有較可信之特別情況，且為證明犯罪事實存否所必要時，即有證據能力"}, "answer": "D", "explain": "證人在警詢的陳述屬審判外陳述（傳聞），原則上沒有證據能力。但依§159-2，證人在審判中的陳述與先前警詢陳述不符（包括推稱不復記憶）時，先前陳述具有較可信之特別情況，且為證明犯罪事實存否所必要者，得為證據（D）。A、C 說警詢陳述當然有證據能力，錯；證人在審判中的陳述本來就有證據能力，B 錯。", "ref": "刑訴§159-2", "evidence": "其先前之陳述具有較可信之特別情況，且為證明犯罪事實存否所必要者，得為證據。"}, {"id": "107-刑事法-27", "src": "old", "year": 107, "n": 27, "subject": "刑事法", "topic": "消防法", "stem": "依直轄市縣市消防車輛裝備及其人力配置標準之規定，下列何者屬於救災車？", "opts": {"A": "化學災害處理車", "B": "緊急修護車", "C": "幫浦消防車", "D": "超高壓消防車"}, "answer": "A", "explain": "依直轄市縣市消防車輛裝備及其人力配置標準§3（115-07-28 修正後仍同），消防車輛分為消防車、救災車、消防勤務車三類。化學災害處理車列於「救災車」第8目（A 正確）；幫浦消防車、超高壓消防車屬「消防車」（C、D 錯）；緊急修護車屬「消防勤務車」（B 錯）。", "ref": "直轄市縣市消防車輛裝備及其人力配置標準§3Ⅰ②", "evidence": "（七）災情勘查車。（八）化學災害處理車。（九）火災現場勘驗車。"}, {"id": "107-刑事法-31", "src": "old", "year": 107, "n": 31, "subject": "刑事法", "topic": "消防法", "stem": "下列何種物質為公共危險物品第一類「氧化性固體」？", "opts": {"A": "過碘酸", "B": "三氯矽甲烷", "C": "黃磷", "D": "赤磷"}, "answer": "A", "explain": "依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法§3及附表一，第一類氧化性固體種類包括過碘酸鹽類與「過碘酸」（A 正確）。三氯矽甲烷、黃磷屬第三類發火性液體、發火性固體及禁水性物質；赤磷屬第二類易燃固體。", "ref": "公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法§3、附表一", "evidence": "公共危險物品之範圍及分類如下：一、第一類：氧化性固體。"}, {"id": "107-刑事法-33", "src": "old", "year": 107, "n": 33, "subject": "刑事法", "topic": "消防法", "stem": "儲存六類物品數量未達管制量 50 倍之室內儲存場所，下列敘述何者正確？", "opts": {"A": "未達管制量 5 倍者，保留空地寬度應在 1 公尺以上", "B": "達管制量 30 倍者，保留空地寬度應在 2 公尺以上", "C": "儲存倉庫樓地板面積，不得超過 200 平方公尺", "D": "儲存倉庫之出入口，應設置 0.5 小時以上防火時效之常時關閉式防火門"}, "answer": "B", "explain": "依公共危險物品設置標準暨安全管理辦法§24Ⅰ，未達管制量50倍、高度6公尺以下的室內儲存場所：未達5倍免設保留空地（A 錯）；5倍以上未達20倍1公尺以上；20倍以上未達50倍2公尺以上（B 達30倍→2公尺，正確）；倉庫樓地板面積不得超過150平方公尺（C 錯）；出入口應設1小時以上防火時效之常時關閉式防火門（D 錯）。", "ref": "公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法§24", "evidence": "達管制量二十倍以上未達五十倍者，保留空地寬度應在二公尺以上。"}, {"id": "107-刑事法-34", "src": "old", "year": 107, "n": 34, "subject": "刑事法", "topic": "消防法", "stem": "依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，下述何種公共危險物品，不得儲放室外儲存場所？", "opts": {"A": "第二類公共危險物品中之閃火點在攝氏 21 度以上之易燃性固體", "B": "第三類公共危險物品中之烷基鋁", "C": "第四類公共危險物品中之動植物油類", "D": "第四類公共危險物品中之第三石油類"}, "answer": "B", "explain": "依公共危險物品設置標準暨安全管理辦法§30，室外儲存場所只能儲存第二類的硫磺、閃火點21℃以上之易燃性固體，以及第四類的第二、第三、第四石油類或動植物油類，並應以容器裝置。第三類的烷基鋁不在範圍內，不得儲放室外儲存場所（B）。", "ref": "公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法§30", "evidence": "室外儲存場所儲存之六類物品，以第二類公共危險物品中之硫磺、閃火點在攝氏二十一度以上之易燃性固體"}, {"id": "107-刑事法-35", "src": "old", "year": 107, "n": 35, "subject": "刑事法", "topic": "災害防救法", "stem": "有關風災震災火災爆炸災害救助種類及標準，下列敘述何者正確？", "opts": {"A": "災害救助金，由災害發生地之直轄市、縣（市）政府發給，所需經費由中央政府分別編列預算支應之", "B": "重傷救助之災害救助金，每人發給新臺幣 20 萬元", "C": "因地震造成之住屋屋頂倒塌或樓板毀損、塌陷面積達二分之一以上者，可給予安遷救助", "D": "重傷救助係指因災致重傷；或未致重傷，必須緊急救護住院治療，自住院之日起 30 日內（住院期間）所發生自行負擔之醫療費用總額達重傷救助金金額者"}, "answer": "C", "explain": "依風災震災火災爆炸火山災害救助種類及標準（111年10月20日修正），§4Ⅰ①地震造成「住屋屋頂倒塌或樓板毀損、塌陷面積達二分之一以上」者給予安遷救助（C 正確）。A 錯：§8經費由直轄市、縣（市）政府編列；B 錯：§5重傷救助每人10萬元；D 錯：§3重傷救助是自住院之日起15日內。", "ref": "風災震災火災爆炸火山災害救助種類及標準§3、§4、§5、§8", "evidence": "住屋屋頂倒塌或樓板毀損、塌陷面積達二分之一以上。"}, {"id": "107-刑事法-36", "src": "old", "year": 107, "n": 36, "subject": "刑事法", "topic": "災害防救法", "stem": "依「災害防救法」之規定，對於因災害失蹤之人，有事實足認其確已因災死亡而未發現其屍體者，法院得依利害關係人或檢察官之聲請，確定其死亡及死亡之時間。確定死亡與死亡時間之裁定及該裁定之撤銷、變更，準用何種法律宣告死亡事件之規定？", "opts": {"A": "民法", "B": "刑法", "C": "民事訴訟法", "D": "家事事件法"}, "answer": "D", "explain": "因災失蹤、有事實足認已因災死亡但未發現屍體者，法院可以依聲請確定其死亡及死亡時間。這項裁定及其撤銷、變更，本法未規定的部分，準用「家事事件法」宣告死亡事件之規定（D）。宣告死亡程序已從民事訴訟法移到家事事件法，所以 C 錯；民法與刑法都沒有這類程序規定。（現行條號為§62）", "ref": "災害防救法§62Ⅳ", "evidence": "準用家事事件法宣告死亡事件之規定。"}, {"id": "107-刑事法-37", "src": "old", "year": 107, "n": 37, "subject": "刑事法", "topic": "災害防救法", "stem": "為減少災害發生或防止災害擴大，依據災害防救法規定，下列何者非各級政府平時應依權責實施整備事項？", "opts": {"A": "災害防救物資、器材之儲備及檢查", "B": "地方政府及公共事業有關災害防救相互支援協定之訂定", "C": "對於妨礙災害應變措施之設施、物件，施以加固、移除或改善", "D": "災害防救之訓練、演習"}, "answer": "B", "explain": "「地方政府及公共事業有關災害防救相互支援協定之訂定」規定於§22Ⅰ⑧，屬平時的「減災」事項，不是整備事項（B）。物資器材之儲備及檢查、妨礙應變設施之加固移除改善、災害防救之訓練演習，分別規定於§23Ⅰ⑤、⑦、②，都屬於整備事項。", "ref": "災害防救法§22Ⅰ⑧、§23Ⅰ", "evidence": "地方政府及公共事業有關災害防救相互支援協定之訂定。"}, {"id": "107-刑事法-38", "src": "old", "year": 107, "n": 38, "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法之規定，下列何者屬中央災害防救會報之任務：①決定災害防救之基本方針  ②災害預警、監測、通報系統之協助督導  ③督導、考核中央及直轄市、縣（市）災害防救相關事項④關於災害辨識、危險度評估與災害境況模擬之推動事項", "opts": {"A": "①③", "B": "②③④", "C": "①②④", "D": "①②③④"}, "answer": "A", "explain": "依§6，中央災害防救會報的任務包括：①決定災害防救之基本方針，以及③督導、考核中央及直轄市、縣（市）災害防救相關事項，所以答案是 A。②災害預警、監測、通報系統的協助督導，以及④災害辨識、危險度評估與境況模擬的推動，都不在§6 的列舉任務內，性質上屬於科技研究或業務主管機關的工作。", "ref": "災害防救法§6", "evidence": "督導、考核中央及直轄市、縣（市）災害防救相關事項。"}, {"id": "107-刑事法-39", "src": "old", "year": 107, "n": 39, "subject": "刑事法", "topic": "消防法", "stem": "依明火表演安全管理辦法之規定，下列敘述何者正確？", "opts": {"A": "申請明火表演，應於表演活動開始 15 日前，檢具文件報請轄區主管機關審查，經取得許可書後，始得為之", "B": "許可之有效期限為 1 個月", "C": "表演區域及外緣 2 公尺內之地面、牆面及地面上方 6 公尺以內之天花板或樓板，不得有儲放公共危險物品", "D": "表演與觀眾之距離，應維持 5 公尺以上，產生之火焰高度不得超過表演區域淨高度"}, "answer": "C", "explain": "依明火表演安全管理辦法§8，表演區域及外緣2公尺內的地面、牆面，以及地面上方6公尺以內的天花板或樓板，不得有儲放公共危險物品或可燃性高壓氣體的情形（C 正確）。A 錯：§5應於表演前30日申請；B 錯：許可有效期限為3個月；D 錯：§12火焰高度不得超過表演區域淨高度二分之一。", "ref": "明火表演安全管理辦法§5、§8、§12", "evidence": "表演區域及外緣二公尺內之地面、牆面及地面上方六公尺以內之天花板或樓板，不得有下列情形之一"}, {"id": "107-刑事法-40", "src": "old", "year": 107, "n": 40, "subject": "刑事法", "topic": "消防法", "stem": "依「各級消防主管機關辦理消防安全檢查違法案件處理注意事項」之規定，下列何者不屬於燃氣熱水器及其配管承裝業「一般違規」之事項？", "opts": {"A": "未依燃氣熱水器及其配管安裝標準實施竣工檢查", "B": "未提供施工紀錄或故意填寫不確實", "C": "安裝完工後，未張貼施工標籤或記載不確實", "D": "技術士於任職期間，未依規定每 2 年參加中央主管機關或其委託之專業機構辦理之訓練，並領有證書"}, "answer": "D", "explain": "依各級消防主管機關辦理消防安全檢查違法案件處理注意事項（115年6月26日修正）表十三，燃氣熱水器承裝業的「一般違規」為：未實施竣工檢查、未提供施工紀錄或故意填寫不確實、未張貼施工標籤或記載不確實（A、B、C）。未僱用領有合格證照者（含未定期參加訓練）從事安裝，列為「嚴重違規」，所以D不屬一般違規。", "ref": "各級消防主管機關辦理消防安全檢查違法案件處理注意事項第六點表十三", "evidence": "未僱用領有合格證照（含未定期參加主管機關或其委託之專業機構辦理之訓練）者，從事熱水器及配管之安裝工作。"}, {"id": "107-刑事法-41", "src": "old", "year": 107, "n": 41, "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，經中央主管機關公告應實施認可之消防機具、器材及設備，非經中央主管機關所登錄機構之認可，並附加認可標示者，下列敘述何者錯誤？", "opts": {"A": "不得銷售", "B": "不得陳列", "C": "不得收藏", "D": "不得設置使用"}, "answer": "C", "explain": "依§12Ⅰ，經中央主管機關公告應實施認可的消防機具、器材及設備，未經登錄機構認可並附加認可標示者，「不得銷售、陳列或設置使用」。條文沒有禁止「收藏」，所以 C 是錯誤敘述。其餘 A、B、D 都是條文明定的禁止行為。", "ref": "消防法§12Ⅰ", "evidence": "不得銷售、陳列或設置使用。"}, {"id": "107-刑事法-43", "src": "old", "year": 107, "n": 43, "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，使用燃氣之熱水器及配管之承裝業，應向直轄市、縣（市）政府申請營業登記後，始得營業。並自何年 2 月 1 日起使用燃氣熱水器之安裝，非經僱用領有合格證照者，不得為之。", "opts": {"A": "中華民國 84 年", "B": "中華民國 95 年", "C": "中華民國 100 年", "D": "中華民國 104 年"}, "answer": "B", "explain": "依消防法§15-1Ⅰ，使用燃氣之熱水器及配管的承裝業，應向直轄市、縣（市）政府申請營業登記後才能營業；並自「中華民國 95 年 2 月 1 日」起，使用燃氣熱水器的安裝非經僱用領有合格證照者不得為之，所以答案是 B。其他年份都是干擾選項。", "ref": "消防法§15-1Ⅰ", "evidence": "並自中華民國九十五年二月一日起使用燃氣熱水器之安裝，非經僱用領有合格證照者，不得為之。"}, {"id": "107-刑事法-44", "src": "old", "year": 107, "n": 44, "subject": "刑事法", "topic": "消防法", "stem": "依消防法施行細則規定，有關消防防護計畫應包括事項，下列何者錯誤？", "opts": {"A": "滅火、通報及避難訓練之實施；每半年至少應舉辦一次，每次不得少於 4 小時，並應事先通報當地消防機關", "B": "防火避難設施之自行檢查：每半年至少檢查一次，檢查結果遇有缺失，應報告管理權人立即改善", "C": "火災及其他災害發生時之滅火行動、通報聯絡及避難引導等", "D": "防止縱火措施"}, "answer": "B", "explain": "依細則§5 第 2 款，防火避難設施的自行檢查「每月」至少一次，檢查結果遇有缺失，應報告管理權人立即改善。選項 B 寫成每半年，是錯誤敘述。A 訓練每半年至少一次、每次不少於 4 小時（現行條文改為事先通報主管機關）、C 滅火行動通報聯絡及避難引導、D 防止縱火措施，都是現行§5 列舉的事項。", "ref": "消防法§13；消防法施行細則§5", "evidence": "防火避難設施之自行檢查：每月至少檢查一次，檢查結果遇有缺失，應報告管理權人立即改善。"}, {"id": "107-刑事法-45", "src": "old", "year": 107, "n": 45, "subject": "刑事法", "topic": "災害防救法", "stem": "災害防救法於民國 106 年 11 月 22 日修正時，納入下列何種災害類別？", "opts": {"A": "震災（含土壤液化）", "B": "火山災害", "C": "生物病原災害", "D": "工業管線災害"}, "answer": "B", "explain": "災害防救法 106-11-22 修正時，把「火山災害」增列為天然災害，並以內政部為中央災害防救業務主管機關（B）。土壤液化、生物病原災害、工業管線災害，則是在 105 年修法時納入或早已存在。現行§2 第 1 款仍列有火山災害。", "ref": "災害防救法§2①", "evidence": "土石流及大規模崩塌災害、火山災害等天然災害。"}, {"id": "107-刑事法-46", "src": "old", "year": 107, "n": 46, "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，下列何者不屬於為減少災害發生或防止災害擴大，各級政府平時應依權責實施之減災事項？", "opts": {"A": "治山、防洪及其他國土保全", "B": "老舊建築物、重要公共建築物與災害防救設施、設備之檢查、補強、維護及都市災害防救機能之改善", "C": "災害潛勢、危險度、境況模擬與風險評估之調查分析，及適時公布其結果", "D": "災害防救組織之整備"}, "answer": "D", "explain": "§22Ⅰ列舉的平時「減災」事項，包括治山防洪與國土保全（A）、老舊建築物等的檢查補強（B）、災害潛勢與風險評估的調查分析及公布（C）。「災害防救組織之整備」規定於§23Ⅰ①，屬整備事項，不是減災事項，所以答案是 D。", "ref": "災害防救法§22Ⅰ、§23Ⅰ①", "evidence": "災害防救組織之整備。"}, {"id": "107-刑事法-47", "src": "old", "year": 107, "n": 47, "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法所稱災區，係指因風災、震災、火山災害或其他重大災害，造成嚴重人命傷亡之受創地區，其範圍由下列那一個單位公告並刊登政府公報？", "opts": {"A": "行政院", "B": "內政部", "C": "消防署", "D": "立法院"}, "answer": "A", "explain": "依現行§51，災區指因災害造成嚴重人命傷亡或建物毀損等的受創地區，範圍由「行政院」公告並刊登政府公報（A）。災區的認定涉及稅捐減免、健保、貸款補貼等跨部會措施，所以由行政院統一公告，不由內政部、消防署或立法院公告。（舊法條號為§44-1 以下，現行為§51）", "ref": "災害防救法§51", "evidence": "其範圍由行政院公告並刊登政府公報。"}, {"id": "107-刑事法-48", "src": "old", "year": 107, "n": 48, "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，對於因災害失蹤之人，有事實足認其確已因災死亡而未發現其屍體者，法院得依利害關係人或檢察官之聲請，確定其死亡及死亡之時間。其聲請，應於災害發生後多久內為之？", "opts": {"A": "3 個月內", "B": "半年內", "C": "1 年內", "D": "2 年內"}, "answer": "C", "explain": "依§62Ⅱ，對因災失蹤者聲請法院確定其死亡及死亡時間，應於災害發生後「1 年內」為之（C）。這個制度是為了縮短民法死亡宣告須等待的失蹤期間，讓家屬及早處理繼承、保險等事務，所以設有較短的聲請期限。", "ref": "災害防救法§62Ⅱ", "evidence": "前項聲請，應於災害發生後一年內為之。"}, {"id": "107-刑事法-49", "src": "old", "year": 107, "n": 49, "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法施行細則規定，所謂懸浮微粒物質災害係指因事故或氣象因素使懸浮微粒物質大量產生或大氣濃度升高，空氣品質達何種程度或造成人民健康重大危害者？", "opts": {"A": "一級嚴重惡化", "B": "二級嚴重惡化", "C": "三級嚴重惡化", "D": "四級嚴重惡化"}, "answer": "A", "explain": "依災害防救法施行細則§2 第 14 款，懸浮微粒物質災害是指因事故或氣象因素，使懸浮微粒物質大量產生或大氣濃度升高，空氣品質達「一級嚴重惡化」或造成人民健康重大危害者（A）。其餘等級都是干擾選項。", "ref": "災害防救法施行細則§2⑭", "evidence": "空氣品質達一級嚴重惡化或造成人民健康重大危害者。"}, {"id": "107-刑事法-50", "src": "old", "year": 107, "n": 50, "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，乘災害之際而故犯竊盜、詐欺、恐嚇取財、搶奪、強盜之罪者，得依刑法之規定，加重其刑至多少？", "opts": {"A": "一倍", "B": "二分之一", "C": "三分之一", "D": "四分之一"}, "answer": "B", "explain": "依災害防救法§53Ⅰ，乘災害之際而故犯竊盜、詐欺、恐嚇取財、搶奪、強盜之罪者，得依刑法之規定，加重其刑至「二分之一」（B）。這項規定是為了嚴懲趁災害發生、社會秩序混亂時犯罪的行為。", "ref": "災害防救法§53Ⅰ", "evidence": "加重其刑至二分之一。"}, {"id": "107-國文-01", "src": "old", "year": 107, "n": 1, "subject": "國文", "topic": "國文", "stem": "下列文句「  」內的成語，使用正確的是：", "opts": {"A": "身處「春秋鼎盛」的時代，我們青年應該積極向上，貢獻所長", "B": "他的見解雖有獨到之處，但酒醉駕車的行為卻「不足為訓」", "C": "考古學家希望能從「博古通今」的史料中，找到有關剛出土文物的記載", "D": "海洋資源已經到了「竭澤而漁」的地步，各界呼籲保護海洋的聲浪越來越高"}, "answer": "B", "explain": "B「不足為訓」指不能當作效法的準則，用於批評酒駕恰當。D「竭澤而漁」本喻只顧眼前、不留餘地地取用資源，形容海洋資源遭過度掠取亦說得通，故官方公告 B、D 均給分。A「春秋鼎盛」指人正值壯年，不可形容時代；C「博古通今」形容人學識淵博，不能修飾史料。", "ref": "成語", "evidence": "", "note": "官方公告 B 或 D 均給分", "accept": ["B", "D"]}, {"id": "107-國文-02", "src": "old", "year": 107, "n": 2, "subject": "國文", "topic": "國文", "stem": "「仲尼聖人，歷試於天下，苟非大無道之國，皆欲勉強扶持，庶幾一日得行其道」，下列選項所表達的態度，最接近上文旨意的是：", "opts": {"A": "不義而富且貴，於我如浮雲", "B": "沽之哉！沽之哉！我待賈者也", "C": "學而不厭，誨人不倦，何有於我哉", "D": "我非生而知之者，好古，敏以求之者也"}, "answer": "B", "explain": "引文言孔子周遊列國，只要不是極無道之國都願勉力扶持，盼能一日行其道，即積極求用於世。B「沽之哉！我待賈者也」（《論語．子罕》）以待價而沽喻願出仕行道，最相合。A 言不取不義富貴，C 言勤學誨人，D 言好古敏求（皆《論語．述而》），均與求行其道無關。", "ref": "蘇軾〈賈誼論〉；選項出自《論語》", "evidence": ""}, {"id": "107-國文-03", "src": "old", "year": 107, "n": 3, "subject": "國文", "topic": "國文", "stem": "「傳曰：『人心不同，譬若其面。』斯蓋謂大小窳隆醜美之形，至於鼻目眾竅毛髮之狀，未有不然者也。情之異者，剛柔舒急倨敬之間。至於趨利避害，畏死樂生，亦復均也。」（《後漢書．霍諝傳》）下列敘述最符合上文文意的是：", "opts": {"A": "人的長相不同，所以每個人的喜好不同", "B": "每個人長得不一樣，所以個性也不相同", "C": "人都有眼睛鼻子，就像每個人都有自己的個性一樣", "D": "每個人長相雖然不一樣，但趨吉避凶的心理卻相同"}, "answer": "D", "explain": "引文先說人心不同如其面，情性有剛柔舒急之別；但「至於趨利避害，畏死樂生，亦復均也」，即趨吉避凶之心人人相同，故選 D。A、B 把長相不同當成喜好、個性不同的原因，文中並無此因果；C 將五官共有類比個性各異，亦曲解文意。", "ref": "《後漢書．霍諝傳》", "evidence": ""}, {"id": "107-國文-04", "src": "old", "year": 107, "n": 4, "subject": "國文", "topic": "國文", "stem": "「春日百花之中，只有花瓣繁複碩大的牡丹花開得最晚，非要等到穀雨才開，因此牡丹才有穀雨花的別稱。牡丹雖晚開，卻也顯出牡丹的貴氣與獨樹一格，就像大明星都要壓軸演出一般。當年在長安，傳說武則天舉辦長安花博會，命令百花要同時在春分盛開，只有牡丹不從，才被貶抑到洛陽。年輕時讀湯顯祖的《牡丹亭》，並未察覺此劇用牡丹花命名之意，年紀稍長後才領悟牡丹花正是整齣劇的隱喻，柳夢梅和杜麗娘的情愛並未曾開得正時，是遲到的愛、遲來的團圓，只有牡丹才能代表這份遲，才象徵出兩人別具一格之情愛。」根據上文，作者認為湯顯祖以牡丹命名劇作的原因是：", "opts": {"A": "故事發生於牡丹盛開的洛陽城", "B": "牡丹為富貴之花以比喻杜麗娘為富家千金", "C": "故事發生於穀雨之日，而牡丹別名為穀雨花", "D": "杜麗娘的愛情經過波折之後方才成就，如同牡丹較百花開遲"}, "answer": "D", "explain": "關鍵句：「柳夢梅和杜麗娘的情愛並未曾開得正時，是遲到的愛、遲來的團圓，只有牡丹才能代表這份遲」，即以牡丹晚開喻愛情遲來成就，選 D。A 洛陽是武則天貶牡丹的傳說；B 富貴之說文中未用來解釋劇名；C 穀雨只是牡丹別名由來，非故事發生時間。", "ref": "文意判讀", "evidence": ""}, {"id": "107-國文-05", "src": "old", "year": 107, "n": 5, "subject": "國文", "topic": "國文", "stem": "陶淵明〈飲酒〉：「結廬在人境，而無車馬喧。問君何能爾？心遠地自偏。採菊東籬下，悠然見南山。山氣日夕佳，飛鳥相與還。此中有真意，欲辨已忘言。」根據詩意，淵明之所以「欲辨已忘言」的原因是：", "opts": {"A": "此刻的經驗只能自己體會，難以言詮", "B": "既已遁世隱居，則不必再以言語表白", "C": "語詞有限，完全無法形容大自然美景", "D": "身旁缺乏理解其意的知音，多言無益"}, "answer": "A", "explain": "「此中有真意，欲辨已忘言」化用《莊子》「得意而忘言」：詩人在山氣飛鳥中體悟自然真意，心領神會，此境只能自得而難以言語說明，故選 A。B 隱居與不必表白無關；C「完全無法形容美景」誤把重點放在景色；D 文中未提缺乏知音。", "ref": "陶淵明〈飲酒〉其五", "evidence": ""}, {"id": "107-國文-06", "src": "old", "year": 107, "n": 6, "subject": "國文", "topic": "國文", "stem": "「惟四代之學，考諸經可見已！秦以山西鏖六國，欲帝萬世，劉氏一呼而關門不守，武夫健將賣降恐後，何邪？《詩》《書》之道廢，人唯見利而不聞義焉耳。」（節錄自李覯〈袁州學記〉）下列敘述最符合上文主旨的是：", "opts": {"A": "以道事君，不可則止", "B": "君臣不和，帝業難久", "C": "仁義不施，教化不行", "D": "朋黨相爭，人心不古"}, "answer": "C", "explain": "文中以秦為例：秦雖併六國，劉邦一呼即關門不守、武將爭降，原因是「《詩》《書》之道廢，人唯見利而不聞義」，強調不行儒家仁義教化則人心只知趨利，主旨為 C。A 語出《論語．先進》，講臣事君之道；B 君臣不和、D 朋黨相爭，文中皆未提及。", "ref": "李覯〈袁州學記〉", "evidence": ""}, {"id": "107-國文-07", "src": "old", "year": 107, "n": 7, "subject": "國文", "topic": "國文", "stem": "「在臺北，我開始學習這兒的生活習慣，調適自己，擴展自己的生活圈，直到民國六十九年才考上我想要念的大學。考上大學之後，我回家了。興奮的心情，使我掩不住臉上的喜悅。看到海天一色的故鄉，令我想起自己荒廢的泳技；擁抱肌膚鬆弛的雙親，感覺到歲月不饒人的殘酷；而當長輩用他們那已經失去紋路、長滿肉繭的手掌，觸摸長髮披肩的我，我才發現自己終究是屬於這個島上的人。」下列敘述最符合上文文意的是：", "opts": {"A": "逐漸年邁衰老的長輩，是我對故鄉最深的依戀", "B": "臺北開啟我的雙眼，讓我發現自己終究屬於這個島", "C": "臺北不是我想像的黃金天堂，都市裡沒有我當初的夢想", "D": "故鄉的山水漸漸遠離了我，但我卻並不感到怎樣的留戀"}, "answer": "A", "explain": "文末「擁抱肌膚鬆弛的雙親」「長輩用……長滿肉繭的手掌，觸摸長髮披肩的我，我才發現自己終究是屬於這個島上的人」，可見年邁長輩的觸摸喚起對故鄉的歸屬與依戀，選 A。B 讓作者發現歸屬的是返鄉見長輩，不是臺北；C、D 文中未提對臺北失望，亦非不留戀故鄉。", "ref": "文意判讀", "evidence": ""}, {"id": "107-國文-08", "src": "old", "year": 107, "n": 8, "subject": "國文", "topic": "國文", "stem": "「對沉靜在作畫世界中的他來說，在那個當下佔據了整個工作室的每幅作品、每個顏料，都和他產生了緊密的連結。『畫畫能夠將我從憂鬱中解救，因為作畫時你的心理、精神、肉體都會參與其中，彷彿整個世界都靜止。』他表示從畫作中陰暗面能看見他的內在，光亮處卻又帶出他的嚮往，『我不太確定繪畫能教會我什麼，但它釋放了我，讓我遠離未來和過去，遠離我的懊悔與煩憂。』各式創作都成了紀錄印證他生活最好的物品，『我熱愛活著，而藝術就最佳證明』。」關於文中「它釋放了我」的涵義，詮釋最適當的是：", "opts": {"A": "繪畫是逃離現實的最好方法與途徑", "B": "繪畫過程應追求豐富的顏料與媒材", "C": "繪畫時身心專注，全心投入，可以忘憂解煩", "D": "繪畫時可以鎮定神經，用以取代藥物的效果"}, "answer": "C", "explain": "畫家說作畫時「心理、精神、肉體都會參與其中」，並「讓我遠離未來和過去，遠離我的懊悔與煩憂」，可知「它釋放了我」是指全心投入作畫而忘卻憂煩，選 C。A「逃離現實」過度推論；B 顏料媒材非重點；D 文中未提以繪畫取代藥物。", "ref": "文意判讀", "evidence": ""}, {"id": "107-國文-09", "src": "old", "year": 107, "n": 9, "subject": "國文", "topic": "國文", "stem": "「很多網站都能告訴你，你是左腦人還是右腦人，以及如何改變。……腦是由兩個半球組成的，剛開始，其中一個半球通常在活動、語言和感知上比另一個更活躍，但是兩邊的腦幾乎在所有的狀況、任務和過程下都是一起運作的。……有些人提出教育現在普遍注重左腦思考模式，也就是邏輯、分析和準確度，而不夠注重右腦思考模式，也就是創意、直覺、情感和主觀。教育當然應該包含各種任務、技能、學習和思考模式。但是，將這些稱為右腦或左腦不過是比喻。」下列敘述最符合上文推論的是：", "opts": {"A": "情感豐富的人，也能擁有良好分析能力", "B": "除了學習專業技能，更應訓練感知速度", "C": "應設法將慣用右腦、左腦改成雙腦並用", "D": "意外時建議優先護右腦，以免喪失創意"}, "answer": "A", "explain": "文中指出兩個半球「幾乎在所有的狀況、任務和過程下都是一起運作的」，左腦邏輯、右腦情感之分「不過是比喻」，故情感豐富與分析能力並不互斥，選 A。B 感知速度訓練文中未提；C 預設人有慣用單側腦，正是文中所否定的；D 護右腦保創意同樣誤信左右腦分工說。", "ref": "文意判讀", "evidence": ""}, {"id": "107-國文-10", "src": "old", "year": 107, "n": 10, "subject": "國文", "topic": "國文", "stem": "「一個公共議題運動若只容一種聲音、一種表述是很教我害怕的，就像我在意的是運動者的生活實踐，那不是資格（道德），而是誠意（有效性），你才有動能說服自己和別人，也才能深化已被喚起的人，而不止停留在要人表態。」下列敘述最符合本文主旨的是：", "opts": {"A": "感動大眾的力量在誠懇的躬行實踐，而不是天花亂墜的主張", "B": "聖人之道出於人心之同然，無妄生門戶異同之見，騰口說而遺踐履", "C": "運動的基礎在凝聚共識，雜音易干擾正論，更不能藉討論之名混淆共識", "D": "若人主以納百川自期，則多為異議所奪，雖有善法，何由立哉？故當飭令中外無得異議"}, "answer": "A", "explain": "作者在意公共議題運動者的「生活實踐」，認為那是「誠意（有效性）」，才能說服自己與別人並深化被喚起的人，而非只要人表態，主旨即以躬行實踐感動大眾，選 A。B 強調人心同然、反門戶之見，偏離主旨；C、D 主張排除異議，與作者害怕「只容一種聲音」的立場相反。", "ref": "文意判讀", "evidence": ""}, {"id": "107-法學-01", "src": "old", "year": 107, "n": 1, "subject": "法學", "topic": "憲法", "stem": "依司法院釋字第 499 號解釋，下列何者非屬憲法中具有本質重要性而為規範秩序賴以存立基礎之基本原則或規定？", "opts": {"A": "民主共和國原則", "B": "第二章保障人民權利之規定", "C": "五權分治，平等相維之體制", "D": "國民主權原則"}, "answer": "C", "explain": "釋字第499號指出，憲法中具本質重要性、為規範秩序存立基礎者，包括第1條民主共和國原則、第2條國民主權原則、第二章保障人民權利，以及有關權力分立與制衡之原則，修憲亦不得變更。解釋文列舉的是抽象的「權力分立與制衡原則」，並未把「五權分治、平等相維」之特定五院體制列為修憲界限，故選C。", "ref": "釋字第499號", "evidence": ""}, {"id": "107-法學-02", "src": "old", "year": 107, "n": 2, "subject": "法學", "topic": "憲法", "stem": "依憲法及司法院大法官解釋，下列何種事項，應先經立法院事前同意或決議後，始得為之？", "opts": {"A": "停止預算之執行", "B": "宣布戒嚴", "C": "發布緊急命令", "D": "任命審計長"}, "answer": "D", "explain": "依憲法§104，審計長由總統提名，經立法院同意任命，屬事前同意，故選D。B宣布戒嚴依憲法§39得「通過或追認」，可以事後為之；C緊急命令依增修§2Ⅲ於發布後10日內提交立法院追認，也是事後；A停止預算執行依釋字第520號，應向立法院提出報告並備質詢，並非事前同意。", "ref": "憲法§104、§39；增修條文§2", "evidence": "監察院設審計長，由總統提名，經立法院同意任命之。"}, {"id": "107-法學-03", "src": "old", "year": 107, "n": 3, "subject": "法學", "topic": "憲法", "stem": "根據司法院大法官解釋意旨，下列有關商業性言論之敘述，何者正確？", "opts": {"A": "廣告以獲取經濟利益為目的，不受言論自由之保障", "B": "商品標示旨在提供事實資訊，不受言論自由之保障", "C": "化妝品廣告受憲法保障之程度，並不低於政治性言論", "D": "藥物廣告事關高度公共利益，不受言論自由之保障"}, "answer": "C", "explain": "依釋字第414號、第623號、第744號，商業性言論只要提供的是真實、合法的資訊，仍受言論自由保障，故A、B、D說「不受保障」都錯。釋字第744號認為化妝品廣告的事前審查對言論自由限制重大，原則上違憲，並適用嚴格審查；在選項中只有C說法與大法官意旨相符。", "ref": "釋字第414號、第744號", "evidence": ""}, {"id": "107-法學-04", "src": "old", "year": 107, "n": 4, "subject": "法學", "topic": "憲法", "stem": "關於憲法保障財產權之敘述，下列何者錯誤？", "opts": {"A": "財產權之保障主體，不以自然人為限", "B": "公務人員退休金請求權屬憲法財產權之保障範圍", "C": "土地徵收補償費之發放雖有所延宕，但仍不違反憲法保障人民財產權之精神", "D": "大眾捷運系統路線軌道穿越人民土地之下方，形成特別犧牲者，土地所有權人請求主管機關辦理徵收地上權"}, "answer": "C", "explain": "釋字第516號指出，徵收補償費應儘速發給，若發放遲延且未加計遲延利息，即違反憲法保障財產權之意旨，故C錯誤。A法人亦為財產權主體；B退休金請求權受財產權保障（釋字第717、781號等）；D依釋字第747號，大眾捷運穿越土地上下空間形成特別犧牲時，所有權人得請求徵收地上權。", "ref": "憲法§15；釋字第516號、第747號", "evidence": "人民之生存權、工作權及財產權，應予保障。"}, {"id": "107-法學-05", "src": "old", "year": 107, "n": 5, "subject": "法學", "topic": "憲法", "stem": "依司法院大法官解釋意旨，下列何者不屬於公務人員得主張憲法服公職權之保障內涵？", "opts": {"A": "身分之存續", "B": "特定職位之選擇", "C": "依法晉敘及陞遷", "D": "俸給及退休金之請領"}, "answer": "B", "explain": "依釋字第605號、第658號等，憲法§18服公職權保障公務人員身分之存續、依法晉敘陞遷、俸給與退休金請領等權利；但公務人員並沒有要求擔任特定職位的權利，機關依法調任屬人事裁量，故選B。", "ref": "憲法§18；釋字第605號", "evidence": ""}, {"id": "107-法學-06", "src": "old", "year": 107, "n": 6, "subject": "法學", "topic": "憲法", "stem": "依司法院大法官解釋意旨，關於人民服兵役之義務，下列敘述何者錯誤？", "opts": {"A": "有關人民服兵役、應召集之事項及其違背義務之制裁手段，應以法律定之", "B": "課予後備軍人居住處所遷移之申報義務，涉及其居住遷徙自由之限制", "C": "依法僅男子有服兵役之義務，係鑑於男女生理差異及因此所生不同之社會生活功能角色，並未牴觸平等原則", "D": "人民無法基於其個人宗教信仰而免除服兵役之義務，並未違反人性尊嚴或動搖憲法價值體系之基礎"}, "answer": "B", "explain": "釋字第517號認為，要求後備軍人申報居住處所遷移，是為確保召集有效實現，並未限制其居住遷徙自由，故B錯誤。A兵役事項及違背義務的制裁應以法律定之（釋字第443號、第490號）；C、D依釋字第490號，僅男子服兵役不違反平等原則，不因宗教信仰免除兵役也不違反宗教自由。", "ref": "憲法§20；釋字第490號、第517號", "evidence": ""}, {"id": "107-法學-07", "src": "old", "year": 107, "n": 7, "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，關於立法院對行政院之不信任案，下列敘述何者正確？", "opts": {"A": "行政院之施政有明顯違憲時，立法院始得對之提出不信任案", "B": "立法院應以記名投票表決不信任案", "C": "不信任案如通過，行政院院長應即辭職，由行政院副院長繼任", "D": "立法院進行不信任案投票前，行政院院長得呈請總統解散立法院"}, "answer": "B", "explain": "依增修§3Ⅱ③，不信任案提出72小時後，應於48小時內以記名投票表決，故B正確。A提出不信任案不以施政違憲為要件；C通過後行政院院長應於10日內辭職，並不是由副院長繼任；D必須在不信任案「通過後」，行政院院長才能呈請總統解散立法院。", "ref": "增修條文§3", "evidence": "不信任案提出七十二小時後，應於四十八小時內以記名投票表決之"}, {"id": "107-法學-08", "src": "old", "year": 107, "n": 8, "subject": "法學", "topic": "憲法", "stem": "關於人身自由保障之規定，下列敘述何者錯誤？", "opts": {"A": "關於限制人身自由應遵守之法定程序，屬憲法保留之事項", "B": "行政執行法之管收處分，亦該當憲法第 8 條所稱之拘禁", "C": "僅適用於我國國民", "D": "行政執行分署之執行員亦屬於憲法第 8 條所稱警察機關之警察"}, "answer": "C", "explain": "依釋字第708號、第710號，人身自由屬人權，外國人同樣受憲法§8保障，故C錯誤。A限制人身自由的法定程序屬憲法保留（釋字第443號）；B、D依釋字第588號，管收屬於拘禁，行政執行分署的執行員也屬於憲法§8所稱的警察。", "ref": "憲法§8；釋字第588號、第708號", "evidence": "人民身體之自由應予保障。除現行犯之逮捕由法律另定外，非經司法或警察機關依法定程序，不得逮捕拘禁。"}, {"id": "107-法學-09", "src": "old", "year": 107, "n": 9, "subject": "法學", "topic": "憲法", "stem": "憲法第 7 條所揭示之平等原則，依司法院釋字第 485 號解釋之意旨，下列敘述何者正確？", "opts": {"A": "平等原則係指絕對、機械之平等", "B": "立法機關不得斟酌規範事物性質之差異而為差別待遇", "C": "立法者基於社會政策考量，非不得制定法律，將福利資源為限定性之分配", "D": "平等原則保障人民在法律上地位之形式平等"}, "answer": "C", "explain": "釋字第485號指出，平等原則並非絕對、機械的形式平等，而是保障人民在法律上地位的實質平等；立法機關可以斟酌事物性質的差異作合理的差別待遇，也可以基於社會政策考量，把福利資源作限定性的分配，故選C。A、B、D都與解釋意旨相反。", "ref": "憲法§7；釋字第485號", "evidence": "中華民國人民，無分男女、宗教、種族、階級、黨派，在法律上一律平等。"}, {"id": "107-法學-10", "src": "old", "year": 107, "n": 10, "subject": "法學", "topic": "憲法", "stem": "憲法第 13 條保障人民信仰宗教自由，下列敘述何者錯誤？", "opts": {"A": "宗教自由保障人民信仰與不信仰任何宗教", "B": "宗教自由保障人民參與或不參與任何宗教活動", "C": "國家不得對特定宗教獎勵", "D": "國家強制人民服兵役，乃屬妨礙宗教自由，當然違憲"}, "answer": "D", "explain": "釋字第490號指出，宗教自由包括信仰與不信仰、參與或不參與宗教活動的自由，國家也不得對特定宗教獎勵或禁制；但依法律服兵役不因宗教信仰而免除，並不違反宗教自由，故D說「當然違憲」錯誤。", "ref": "憲法§13；釋字第490號", "evidence": ""}, {"id": "107-法學-11", "src": "old", "year": 107, "n": 11, "subject": "法學", "topic": "憲法", "stem": "依憲法及增修條文規定，總統應先經行政院院會之決議，始得行使下列何種職權？", "opts": {"A": "行使大赦權", "B": "解散立法院", "C": "決定國家安全大政方針", "D": "任命內政部部長"}, "answer": "A", "explain": "依憲法§58Ⅱ，大赦案應提出於行政院會議議決；赦免法§6也規定總統行使大赦權應經行政院會議決議，故選A。B解散立法院依增修§2Ⅴ須經諮詢立法院院長；C國家安全大政方針由總統決定（增修§2Ⅳ）；D部長由行政院院長提請總統任命（憲法§56）。", "ref": "憲法§58；赦免法§6", "evidence": "須將應行提出於立法院之法律案、預算案、戒嚴案、大赦案、宣戰案、媾和案、條約案"}, {"id": "107-法學-12", "src": "old", "year": 107, "n": 12, "subject": "法學", "topic": "憲法", "stem": "下列關於總統、副總統罷免程序之敘述，何者錯誤？", "opts": {"A": "總統、副總統之罷免，應聯名同案罷免，不得分別罷免", "B": "總統、副總統之罷免案，應經立法院之提議、提出程序", "C": "總統、副總統之罷免公告及投票，由中央選舉委員會辦理", "D": "總統、副總統罷免案通過後，總統、副總統自罷免投票結果公告之日起，解除職務"}, "answer": "A", "explain": "增修§2Ⅸ及總統副總統選舉罷免法都沒有規定總統、副總統必須「聯名同案」罷免（聯名是選舉登記的規定），可以分別罷免，故A錯誤。B罷免案由立法院提議、提出；C由中央選舉委員會辦理公告與投票；D依總統副總統選罷法§77，罷免案通過者自公告之日起解除職務。", "ref": "增修條文§2；總統副總統選舉罷免法§70、§77", "evidence": "總統、副總統之罷免案，須經全體立法委員四分之一之提議，全體立法委員三分之二之同意後提出"}, {"id": "107-法學-13", "src": "old", "year": 107, "n": 13, "subject": "法學", "topic": "憲法", "stem": "依行政院組織法之規定，下列何者係行政院所屬機關？", "opts": {"A": "國史館", "B": "銓敘部", "C": "海洋委員會", "D": "中央研究院"}, "answer": "C", "explain": "依行政院組織法§4，海洋委員會是行政院所屬的委員會，故選C。A國史館、D中央研究院隸屬總統府；B銓敘部隸屬考試院。海洋委員會於107年4月28日成立，下設海巡署、海洋保育署等，負責海洋事務。", "ref": "行政院組織法§4", "evidence": ""}, {"id": "107-法學-14", "src": "old", "year": 107, "n": 14, "subject": "法學", "topic": "憲法", "stem": "依司法院釋字第 392 號解釋，下列敘述何者正確？", "opts": {"A": "廣義法院係指組織法意義上之法院", "B": "廣義法院與法官同義", "C": "廣義法院指從事審判權而具司法獨立之內涵者", "D": "廣義法院係指訴訟法意義上之法院"}, "answer": "A", "explain": "釋字第392號區分：狹義的法院指訴訟法意義上的法院，也就是獨任或合議的審判庭；廣義的法院則是組織法意義上的法院，包括行政管理在內的司法機關，故選A。B法官只是狹義法院的組成，不能等同；D是狹義法院。", "ref": "釋字第392號", "evidence": ""}, {"id": "107-法學-15", "src": "old", "year": 107, "n": 15, "subject": "法學", "topic": "憲法", "stem": "司法院釋字第 572 號解釋認為，法官如確信其審理之原因案件所擬適用之系爭法律違憲，顯然於該案件之裁判結果有影響，得聲請解釋憲法。此之「於該案件之裁判結果有影響」係指下列何者？", "opts": {"A": "管轄問題", "B": "先決問題", "C": "合法性問題", "D": "目的性問題"}, "answer": "B", "explain": "釋字第572號補充第371號，說明「對裁判結果有影響」是指系爭法律的違憲與否屬於該案裁判的「先決問題」，也就是法律違憲與否會使裁判結果不同，故選B。補充：現行憲法訴訟法§55改為由各法院「依其合理確信」，認為該法律違憲且「於該案件之裁判結果有直接影響」時，聲請憲法法庭判決；題目問的是釋字意旨，答案不受影響。", "ref": "釋字第572號；憲法訴訟法§55", "evidence": ""}, {"id": "107-法學-16", "src": "old", "year": 107, "n": 16, "subject": "法學", "topic": "法學緒論", "stem": "下列何者非屬法律解釋之方法？", "opts": {"A": "擴張解釋", "B": "實質解釋", "C": "限縮解釋", "D": "反面解釋"}, "answer": "B", "explain": "擴張解釋、限縮解釋、反面解釋都是法律解釋的方法（分別屬文義、目的解釋的運用與論理解釋）；「實質解釋」並不是法學方法論上公認的解釋方法，故選B。實質解釋一詞多見於稅法「實質課稅原則」，但那是課稅原則，不是法律解釋方法的分類。", "ref": "法學緒論（法律解釋方法）", "evidence": ""}, {"id": "107-法學-17", "src": "old", "year": 107, "n": 17, "subject": "法學", "topic": "法學緒論", "stem": "下列關於法律規範之敘述，何者正確？", "opts": {"A": "支配人類思想、活動與無理性之自然界定律", "B": "係關於人類生活之規範", "C": "凡屬於善惡判斷之規範，即為法律", "D": "審美規範亦屬法律規範"}, "answer": "B", "explain": "法律是規範人類社會生活的準則，以國家強制力為後盾，故B正確。A自然法則屬於「必然」法則，不是規範；C善惡判斷屬道德範疇，未必是法律；D審美規範屬藝術評價，不是法律規範。", "ref": "法學緒論（法律的意義）", "evidence": ""}, {"id": "107-法學-18", "src": "old", "year": 107, "n": 18, "subject": "法學", "topic": "法學緒論", "stem": "依著作權法規定，下列關於製版權之敘述，何者錯誤？", "opts": {"A": "係針對無著作財產權或著作財產權消滅之文字著述或美術著作", "B": "採登記主義", "C": "保護期間係自製版完成起 20 年", "D": "製版人就其版面，專有以影印、印刷或類似方式重製之權利"}, "answer": "C", "explain": "依著作權法§79，製版權是針對無著作財產權或著作財產權消滅的文字著述或美術著作，製版人經依法登記後，就其版面專有以影印、印刷或類似方式重製的權利；保護期間自製版完成時起算存續10年，不是20年，故C錯誤。", "ref": "著作權法§79", "evidence": ""}, {"id": "107-法學-19", "src": "old", "year": 107, "n": 19, "subject": "法學", "topic": "法學緒論", "stem": "有關家庭暴力防治法中，對於犯家庭暴力罪或違反保護令罪而受緩刑之宣告，下列何者錯誤？", "opts": {"A": "犯家庭暴力罪或違反保護令罪而受緩刑之宣告者，在緩刑期內應付保護管束", "B": "法院為緩刑宣告時，應即通知加害人及其住居所所在地之警察機關", "C": "法院為犯家庭暴力罪或違反保護令罪加害人緩刑宣告時，可以命被告於付緩刑保護管束期間內，完成加害人處遇計畫", "D": "法院命被告完成加害人處遇計畫前，得準用第 14 條第 3 項之規定"}, "answer": "B", "explain": "家庭暴力防治法§38：受緩刑宣告者在緩刑期內應付保護管束；法院可以命被告遵守完成加害人處遇計畫等事項；法院為緩刑宣告時，應即通知「被害人」及其住居所所在地的警察機關。B寫成通知「加害人」，所以錯誤。該條在112年修正後仍維持相同意旨。", "ref": "家庭暴力防治法§38", "evidence": ""}, {"id": "107-法學-20", "src": "old", "year": 107, "n": 20, "subject": "法學", "topic": "法學緒論", "stem": "租賃物為房屋，無押租金之給付下，其租金約定於每期開始時支付，則出租人在下列何種情況下，得終止租賃契約？", "opts": {"A": "承租人支付租金有遲延時", "B": "承租人遲付租金之總額，達 2 個月租額時", "C": "承租人遲付租金之總額，達 2 個月租額，且遲延給付逾 2 個月時", "D": "承租人遲付租金之總額，達 2 個月租額，且遲延給付逾 2 個月，經出租人定期催告，承租人仍不為支付時"}, "answer": "D", "explain": "依民法§440，承租人遲付租金時，出租人應先定相當期限催告；租賃物為房屋時，遲付租金總額須達2個月租額；若租金約定在每期開始時支付，還必須遲延給付逾2個月，才可以終止契約。三個要件都具備的只有D。", "ref": "民法§440", "evidence": ""}, {"id": "107-法學-21", "src": "old", "year": 107, "n": 21, "subject": "法學", "topic": "法學緒論", "stem": "下列法律概念或法律思想，何者並非從西方法制繼受而來？", "opts": {"A": "契約自由", "B": "卑親屬故意傷害尊親屬加重刑罰", "C": "所有權神聖", "D": "個人主義"}, "answer": "B", "explain": "契約自由、所有權神聖（絕對）、個人主義都是近代西方法制的基本原則，由繼受而來；卑親屬傷害尊親屬加重處罰（刑法§280），源自我國傳統禮教的倫常觀念，並非繼受西方，故選B。", "ref": "刑法§280", "evidence": ""}, {"id": "107-法學-22", "src": "old", "year": 107, "n": 22, "subject": "法學", "topic": "法學緒論", "stem": "中央法規標準法第 6 條規定「應以法律規定之事項，不得以命令定之」，係關於下列何種基本原則之規定？", "opts": {"A": "法律優位原則", "B": "法律保留原則", "C": "法律明確性原則", "D": "法律授權明確性原則"}, "answer": "B", "explain": "中央法規標準法§6「應以法律規定之事項，不得以命令定之」，是法律保留原則（積極依法行政）的明文；§5列舉應以法律定之的事項。法律優位是指命令不得牴觸法律（§11），故選B。", "ref": "中央法規標準法§5、§6", "evidence": ""}, {"id": "107-法學-23", "src": "old", "year": 107, "n": 23, "subject": "法學", "topic": "法學緒論", "stem": "有關法律優位原則之敘述，下列何者錯誤？", "opts": {"A": "法律優位原則要求一切行政活動必須有法律之明文依據", "B": "法律優位原則要求不違背法律之規定", "C": "法律優位原則要求行政應受一般法律原則之拘束", "D": "法律優位原則要求行政應受法律之拘束"}, "answer": "A", "explain": "法律優位原則是消極的依法行政，要求行政不得違背法律，並受法律及一般法律原則拘束；要求行政活動必須有法律明文依據的是「法律保留原則」，故A錯誤。簡單區分：法律優位是「不得違法」，法律保留是「須有法律依據」。", "ref": "行政程序法§4；中央法規標準法§11", "evidence": ""}, {"id": "107-法學-24", "src": "old", "year": 107, "n": 24, "subject": "法學", "topic": "法學緒論", "stem": "關於依法行政原則之敘述，下列何者錯誤？", "opts": {"A": "法治國原則之內容", "B": "支配行政權行使之原則", "C": "又可細分為法律優位原則與法律保留原則", "D": "共和國原則之具體化"}, "answer": "D", "explain": "依法行政原則是法治國原則的核心內容，拘束行政權的行使，可以再分成法律優位與法律保留兩個子原則；它是法治國原則的具體化，不是共和國原則（國家元首非世襲）的具體化，故D錯誤。", "ref": "行政程序法§4", "evidence": ""}, {"id": "107-法學-25", "src": "old", "year": 107, "n": 25, "subject": "法學", "topic": "法學緒論", "stem": "主管機關查獲業者違法排放廢水，除處以罰鍰外，並命其限期改善。主管機關於期限屆滿前，針對同一污染行為再次處以罰鍰，後罰鍰處分違反下列何種原則？", "opts": {"A": "比例原則", "B": "誠實信用原則", "C": "信賴保護原則", "D": "不當聯結禁止原則"}, "answer": "B", "explain": "主管機關已命業者限期改善，在期限屆滿前又就同一污染行為再次處罰，前後行為矛盾，使人民無所適從，違反行政程序法§8的誠實信用原則，故選B（官方答案）。學理上也可能涉及一行為不二罰的問題，但選項中最適合的是誠信原則。", "ref": "行政程序法§8", "evidence": ""}, {"id": "107-法學-26", "src": "old", "year": 107, "n": 26, "subject": "法學", "topic": "法學緒論", "stem": "甲、乙、丙、丁、戊共有 A 地，其應有部分為均等。下列敘述何者符合民法關於共有物處分及管理之規定？", "opts": {"A": "丁得單獨處分其應有部分", "B": "A 地的管理，應以全體共有人的同意行之", "C": "A 地的處分，得以應有部分合計逾三分之二的共有人之同意行之", "D": "A 地的處分，得以共有人過半數及其應有部分合計過半數之同意行之"}, "answer": "A", "explain": "依民法§819Ⅰ，各共有人得自由處分其應有部分，故A正確。B依§820Ⅰ，共有物的管理原則上以共有人過半數及應有部分合計過半數（或應有部分逾三分之二）決定，不必全體同意；C、D依§819Ⅱ，共有物的處分應得共有人全體同意。土地法§34-1的多數決是特別法，不屬於題目問的「民法規定」。", "ref": "民法§819、§820；土地法§34-1", "evidence": ""}, {"id": "107-法學-27", "src": "old", "year": 107, "n": 27, "subject": "法學", "topic": "法學緒論", "stem": "國人甲在日本殺害具有中華民國國籍之女留學生，下列關於依外國裁判服刑之效力敘述，何者正確？", "opts": {"A": "甲於日本服刑完畢，基於雙重處罰禁止，回臺不必服刑", "B": "回臺仍要重新審理，刑期不能抵免", "C": "我國係採折衷說，原則上仍得依中華民國刑法論處，但在外國已受刑之全部或一部執行者，得免其刑之全部或一部之執行", "D": "法無明文，屬於法官裁量範圍"}, "answer": "C", "explain": "刑法§9：同一行為雖經外國確定裁判，仍得依本法處斷；但在外國已受刑的全部或一部執行者，得免其刑的全部或一部之執行，屬於折衷說，故選C。A外國裁判不發生一事不再理的效力；B已執行部分可以免除；D法有明文。", "ref": "刑法§9", "evidence": ""}, {"id": "107-法學-28", "src": "old", "year": 107, "n": 28, "subject": "法學", "topic": "法學緒論", "stem": "有關共同正犯之敘述，下列何者正確？", "opts": {"A": "我國實務界承認過失共同正犯", "B": "我國實務界承認相續共同正犯", "C": "我國實務界不承認共謀共同正犯", "D": "我國實務界承認教唆犯之共同正犯"}, "answer": "B", "explain": "我國實務承認相續（承繼）共同正犯：後行為人在中途知情而參與，就參與後的行為與前行為人共同負責，故選B。A實務不承認過失共同正犯；C實務承認共謀共同正犯（釋字第109號）；D教唆犯屬於共犯，實務並不承認所謂「教唆犯之共同正犯」。", "ref": "刑法§28；釋字第109號", "evidence": ""}, {"id": "107-法學-29", "src": "old", "year": 107, "n": 29, "subject": "法學", "topic": "法學緒論", "stem": "依勞動基準法第 23 條之規定，對於工資清冊，雇主應保存期間為多久？", "opts": {"A": "應保存 2 年", "B": "應保存 3 年", "C": "應保存 5 年", "D": "應保存 6 年"}, "answer": "C", "explain": "勞動基準法§23Ⅱ：雇主應置備勞工工資清冊，記入發放工資、各項目計算方式明細、工資總額等事項；工資清冊應保存5年，故選C。另依§30Ⅵ，出勤紀錄也應保存5年；違反者依§79處罰鍰。", "ref": "勞動基準法§23", "evidence": ""}, {"id": "107-法學-30", "src": "old", "year": 107, "n": 30, "subject": "法學", "topic": "法學緒論", "stem": "法院於訴訟或調解程序中如認為有家庭暴力之情事時，下列何者不得進行和解或調解？", "opts": {"A": "其他行和解或調解之人，認為能使被害人免受加害人脅迫之程序", "B": "加害人及其家屬或關係人有高度之和解或調解之動機與誠意", "C": "准許被害人選定輔助人參與和解或調解", "D": "行和解或調解之人曾受家庭暴力防治之訓練，並以確保被害人安全之方式，進行和解或調解"}, "answer": "B", "explain": "家庭暴力防治法§47：法院在訴訟或調解程序中，如認為有家庭暴力情事，原則上不得進行和解或調解；例外是行和解或調解的人曾受家暴防治訓練並以確保被害人安全的方式進行、准許被害人選定輔助人參與，或其他能使被害人免受脅迫的程序。B「加害人有高度和解動機與誠意」不在例外之列。", "ref": "家庭暴力防治法§47", "evidence": ""}, {"id": "107-法學-31", "src": "old", "year": 107, "n": 31, "subject": "法學", "topic": "英文", "stem": "Sometimes _____ comments or looks exchanged between two guest groups at night clubs or KTVs eventually lead to a brutal fight between them.", "opts": {"A": "public", "B": "hilarious", "C": "justifiable", "D": "provocative"}, "answer": "D", "explain": "provocative＝挑釁的。句意：夜店或KTV裡兩群客人之間互相交換的挑釁言語或眼神，最後引發激烈鬥毆。hilarious（爆笑的）、justifiable（可辯護的）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "107-法學-32", "src": "old", "year": 107, "n": 32, "subject": "法學", "topic": "英文", "stem": "Hundreds of acres of forests in California alone are _____ due to the wild fires in summer.", "opts": {"A": "cautioned", "B": "approached", "C": "retaliated", "D": "ravaged"}, "answer": "D", "explain": "ravage＝嚴重破壞、蹂躪。句意：光是加州就有數百英畝森林因夏季野火而遭摧毀。caution（警告）、approach（接近）、retaliate（報復）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "107-法學-33", "src": "old", "year": 107, "n": 33, "subject": "法學", "topic": "英文", "stem": "Jane said at the job interview that with her excellent background in information science, she had what it takes to _____ to the company.", "opts": {"A": "contribute", "B": "declare", "C": "register", "D": "translate"}, "answer": "A", "explain": "contribute to＝對…有所貢獻。句意：Jane面試時說，憑她優秀的資訊科學背景，她有能力為公司做出貢獻。what it takes＝具備所需條件。", "ref": "英文", "evidence": ""}, {"id": "107-法學-34", "src": "old", "year": 107, "n": 34, "subject": "法學", "topic": "英文", "stem": "Among the ten competitors for the singing _____, one of them failed to show up because of a traffic jam.", "opts": {"A": "contact", "B": "context", "C": "content", "D": "contest"}, "answer": "D", "explain": "contest＝比賽、競賽。句意：歌唱比賽的10位參賽者中，有1位因塞車沒有到場。contact（聯絡）、context（上下文）、content（內容）都是字形相近的干擾選項。", "ref": "英文", "evidence": ""}, {"id": "107-法學-35", "src": "old", "year": 107, "n": 35, "subject": "法學", "topic": "英文", "stem": "In my family, all members clean the house together during the weekend. My duty is to sweep the floor and my younger brother’s _____ is to empty the dishwasher.", "opts": {"A": "assistant", "B": "chore", "C": "legacy", "D": "track"}, "answer": "B", "explain": "chore＝家務雜事。句意：我的工作是掃地，弟弟的家事則是清空洗碗機。assistant（助理）、legacy（遺產）、track（軌道）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "107-法學-36", "src": "old", "year": 107, "n": 36, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "who", "B": "while", "C": "whose", "D": "where"}, "answer": "A", "explain": "關係代名詞：先行詞是人（the Greeks and Romans），在子句中當主詞，而且前面有逗號，要用 who（非限定用法）。句意：希臘人與羅馬人相信自然現象是神明作為的結果。", "ref": "英文", "evidence": "", "passage": "Different  cultures  have  traditionally  held  differing  superstitious  beliefs,  beliefs  that  are  deemed  \"irrational.\"  Such \nbeliefs go back to ancient cultures such as the Greeks and Romans,      36      believed that natural occurrences were a \nresult of actions of the gods.   Such fear of the gods was what the Romans meant by superstition. \nIn Western cultures, some superstitions actually caused more bad luck such as the belief in England that cats were \nwitches and that they were the cause of the Plague.      37      killing off the cats, the English caused the rat population \nto flourish, and, thus increase disease. But cats have been part of superstitious beliefs for ages. The black cat crossing \none's path      38      bad luck, for example. Cats are also supposed to suck the breath away from babies, killing them. \nMany superstitious beliefs are connected to religion. For instance, if one holds out a cross or wears one, the person \ncan ward off evil. Certain talismans worn or hung in houses were to have warded off evil. Saint Gregory I the Great \nordered that people say \"God Bless You\" when someone sneezed      39      ward off disease. \nOne of the oddest superstitions seems that of wishing someone to \"break a leg\" when one actually wishes him/her \nwell. It all started a long while back when someone said, \"Good luck\" and some actor broke a leg. So now people say \npretty much the      40      to ward off bad luck. At least this one makes sense when one knows its origin. "}, {"id": "107-法學-37", "src": "old", "year": 107, "n": 37, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "At", "B": "By", "C": "Of", "D": "For"}, "answer": "B", "explain": "By + V-ing＝藉由…（手段）。句意：英國人藉由撲殺貓，反而讓老鼠數量大增，疾病也跟著增加。", "ref": "英文", "evidence": "", "passage": "Different  cultures  have  traditionally  held  differing  superstitious  beliefs,  beliefs  that  are  deemed  \"irrational.\"  Such \nbeliefs go back to ancient cultures such as the Greeks and Romans,      36      believed that natural occurrences were a \nresult of actions of the gods.   Such fear of the gods was what the Romans meant by superstition. \nIn Western cultures, some superstitions actually caused more bad luck such as the belief in England that cats were \nwitches and that they were the cause of the Plague.      37      killing off the cats, the English caused the rat population \nto flourish, and, thus increase disease. But cats have been part of superstitious beliefs for ages. The black cat crossing \none's path      38      bad luck, for example. Cats are also supposed to suck the breath away from babies, killing them. \nMany superstitious beliefs are connected to religion. For instance, if one holds out a cross or wears one, the person \ncan ward off evil. Certain talismans worn or hung in houses were to have warded off evil. Saint Gregory I the Great \nordered that people say \"God Bless You\" when someone sneezed      39      ward off disease. \nOne of the oddest superstitions seems that of wishing someone to \"break a leg\" when one actually wishes him/her \nwell. It all started a long while back when someone said, \"Good luck\" and some actor broke a leg. So now people say \npretty much the      40      to ward off bad luck. At least this one makes sense when one knows its or species  that  is  considered  in  immediate  danger  of  becoming  extinct.  Its \npopulation  is  very  small  and  it  needs  active      41      to  survive.  Extinction  has  occurred  throughout  history,  but \nincreased dramatically in recent times due to the growth of the human population. The species extinction rate is now \none species per day, which will lead to a dramatic decrease in the      42      of life on earth. \nMany marine mammal scientists are now becoming concerned with the drop in numbers of dolphins. River dolphins \nthat  live  in  Asia  and  the  Amazon  are      43      due  to  dam  building  and  habitat  destruction.  Another  concern  is  the \nnumber  of  dolphins  dying  in  the  tuna  fisheries  of  the  eastern  tropical  Pacific.  Historically, yellow-fin  tuna  has  been \ncaught by encircling the dolphins that swim above the tuna with purse seine nets. Over 100,000 dolphins per year died \nin  the  1970s and  early  1980s  after  being  caught  in tuna  nets,  and  several  species  of  dolphins  in  the  eastern  tropical \nPacific are now considered      44      under the Marine Mammal Protection Act. Efforts of environmental organizations \nand  consumers  led  to  \"dolphin-safe\"  labeling  of  canned  tuna,  and  a  98%  reduction  in  dolphin      45      since  1990. \nHowever, recent changes in US and international laws have reopened this complex issue, and the outcome is in doubt. \nFortunately, the major companies have all promised to sell only tuna that is caught without encircling dolphins. "}, {"id": "107-法學-42", "src": "old", "year": 107, "n": 42, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "adversity", "B": "diversity", "C": "necessity", "D": "intensity"}, "answer": "B", "explain": "diversity of life＝生物多樣性。句意：每天滅絕一個物種，會使地球生物多樣性大幅下降。adversity（逆境）、intensity（強度）都不合語意。", "ref": "英文", "evidence": "", "passage": "An  endangered  animal  or  plant  is  a  species  that  is  considered  in  immediate  dan reased dramatically in recent times due to the growth of the human population. The species extinction rate is now \none species per day, which will lead to a dramatic decrease in the      42      of life on earth. \nMany marine mammal scientists are now becoming concerned with the drop in numbers of dolphins. River dolphins \nthat  live  in  Asia  and  the  Amazon  are      43      due  to  dam  building  and  habitat  destruction.  Another  concern  is  the \nnumber  of  dolphins  dying  in  the  tuna  fisheries  of  the  eastern  tropical  Pacific.  Historically, yellow-fin  tuna  has  been \ncaught by encircling the dolphins that swim above the tuna with purse seine nets. Over 100,000 dolphins per year died \nin  the  1970s and  early  1980s  after  being  caught  in tuna  nets,  and  several  species  of  dolphins  in  the  eastern  tropical \nPacific are now considered      44      under the Marine Mammal Protection Act. Efforts of environmental organizations \nand  consumers  led  to  \"dolphin-safe\"  labeling  of  canned  tuna,  and  a  98%  reduction  in  dolphin      45      since  1990. \nHowever, recent changes in US and international laws have reopened this complex issue, and the outcome is in doubt. \nFortunately, the major companies have all promised to sell only tuna that is caught without encircling dolphins. "}, {"id": "107-法學-46", "src": "old", "year": 107, "n": 46, "subject": "法學", "topic": "英文", "stem": "According to the passage, which of the following statements is true about IQ？", "opts": {"A": "The traditional IQ test does not accurately measure the degree to which a person can make wise decisions.", "B": "The traditional IQ test includes verbal and mathematical questions but not visual processing tasks.", "C": "The acronym IQ stands for Intelligent Quotient; it measures a person's critical thinking.", "D": "A person with a high IQ score is more likely to have a satisfactory life."}, "answer": "A", "explain": "第一段說日常所謂聰明是指做出明智決定，但這與傳統 IQ 測量方式不一致（at odds with），故選A：傳統 IQ 測驗無法準確衡量明智決策的能力。B文中提到視覺搜尋；C IQ 不測批判思考；D文中說 IQ 不預測生活滿意度。", "ref": "英文", "evidence": "", "passage": "We all probably know someone who is intelligent, but does surprisingly stupid things. What does it mean to be smart \nor  intelligent？Our  everyday  use  of  the  term  is  meant  to  describe  someone  who  is  knowledgeable  and  makes  wise \ndecisions,  but  this  definition  is  at  odds  with  how  intelligence  is  traditionally  measured.  The  most  widely  known \nmeasure of intelligence is the intelligence quotient, more commonly known as the IQ test, which includes visuospatial \npuzzles, math problems, pattern recognition, vocabulary questions, and visual searches. \nThe  advantages  of  being  intelligent  are  undeniable.  Intelligent  people  are  more  likely  to  get  better  grades  and  go \nfarther  in  school.  They  are  more  likely  to  be  successful  at  work.  And  they  are  less  likely  to  get  into  trouble（e.g., \ncommit crimes）as adolescents. Given all the advantages of intelligence, though, you may be surprised to learn that it \ndoes not predict other life outcomes, such as well-being. You might imagine that doing well in school or at work might \nlead  to  greater  life  satisfaction,  but  several  large  scale  studies  have  failed  to  find  evidence  that  IQ  impacts  life \nsatisfaction  or  longevity.   Grossman  and  his  colleagues  argue  that  most  intelligence  tests  fail  to  capture  real-world \ndecision-making and our ability to interact well with others. This is, in other words, perhaps why “smart” people, do \n“dumb” things. \nThe  ability  to  think  critically,  on  the  other  hand,  has  been  associated  with  wellness  and  longevity.  Though  often \nconfused with intelligence, critical thinking is not intelligence. Critical thinking is a collection of cognitive skills that \nallow us to think rationally in a goal-orientated fashion, and a disposition to use those skills when nsatisfaction  or  longevity.   Grossman  and  his  colleagues  argue  that  most  intelligence  tests  fail  to  capture  real-world \ndecision-making and our ability to interact well with others. This is, in other words, perhaps why “smart” people, do \n“dumb” things. \nThe  ability  to  think  critically,  on  the  other  hand,  has  been  associated  with  wellness  and  longevity.  Though  often \nconfused with intelligence, critical thinking is not intelligence. Critical thinking is a collection of cognitive skills that \nallow us to think rationally in a goal-orientated fashion, and a disposition to use those skills when appropriate. Critical \nthinkers are amiable skeptics. They are flexible thinkers who require evidence to support their beliefs and recognize \nfallacious attempts to persuade them. Critical thinking means overcoming all sorts of cognitive biases. "}, {"id": "109-刑事法-01", "src": "old", "year": 109, "n": 1, "subject": "刑事法", "topic": "刑法", "stem": "關於罪刑法定及其衍生原則，下列敘述何者正確？", "opts": {"A": "對於被告有利之類推適用，原則仍被容許", "B": "為了呼應民情，刑罰的種類，例外可由法務部以教化需要創設", "C": "刑罰應該以絕對刑表現，因為法官的刑罰裁量權，不符合罪刑法定的精神", "D": "明確性原則為實質的人權保障原理，是禁止偵查機關濫權，與罪刑法定原則無關"}, "answer": "A", "explain": "罪刑法定原則禁止的是「不利於」行為人的類推適用；有利於被告的類推，原則上仍被容許（A）。刑罰種類須由法律規定，法務部不能以命令創設（B 錯）；相對法定刑並不違反罪刑法定，法官本來就有量刑空間（C 錯）；明確性原則正是罪刑法定原則的內涵之一（D 錯）。", "ref": "刑法§1；學說", "evidence": "行為之處罰，以行為時之法律有明文規定者為限。"}, {"id": "109-刑事法-02", "src": "old", "year": 109, "n": 2, "subject": "刑事法", "topic": "刑法", "stem": "關於刑法的意義與功能，下列敘述何者錯誤？", "opts": {"A": "刑法是規範私人民事間權利與義務的法律", "B": "刑法主要是規範犯罪行為的法律", "C": "刑法有保護法益的功能", "D": "刑法有保護人權的功能"}, "answer": "A", "explain": "刑法是規定犯罪與刑罰的公法，具有保護法益與保障人權（限制國家刑罰權）的功能。規範私人之間民事權利義務的是民法，不是刑法，所以 A 是錯誤敘述。B、C、D 都正確描述了刑法的意義與功能。", "ref": "學說", "evidence": "行為之處罰，以行為時之法律有明文規定者為限。"}, {"id": "109-刑事法-03", "src": "old", "year": 109, "n": 3, "subject": "刑事法", "topic": "刑法", "stem": "關於甲的行為，下列敘述何者不適用我國刑法處罰？", "opts": {"A": "甲在我國竊取日本外交使節之財物", "B": "甲在公海運送並販賣海洛英", "C": "甲在我國飛機上公然侮辱具有德國國籍之乘客", "D": "甲在法國詐欺我國國民"}, "answer": "D", "explain": "A 在我國領域內犯罪，依屬地原則適用我國刑法（外交豁免只是程序上的障礙）。B 毒品罪依§5⑧屬保護原則、世界法原則，在國外犯罪也適用。C 在我國航空器內犯罪，以在我國領域內犯罪論（§3）。D 在法國犯普通詐欺罪，最輕本刑未達 3 年，依§7、§8 都不適用我國刑法。", "ref": "刑法§3、§5、§7、§8", "evidence": "而其最輕本刑為三年以上有期徒刑者，適用之。"}, {"id": "109-刑事法-04", "src": "old", "year": 109, "n": 4, "subject": "刑事法", "topic": "刑法", "stem": "甲想殺 A，雖見 B 在 A 身後處，卻深信自己瞄準 A 後不會打中 B，進而開槍殺 A。但事與願違，甲槍法失準，仍誤射 B，B 因而死亡。關於甲的行為評價，下列敘述何者正確？", "opts": {"A": "甲誤殺 B 為等價客體錯誤", "B": "甲應同時成立殺人未遂罪，與過失致死罪", "C": "甲誤殺 B，為學理所稱之因果流程錯誤", "D": "甲只成立一故意殺人既遂罪"}, "answer": "B", "explain": "甲對 A 有殺人故意，但沒有打中，成立殺人未遂。對 B，甲雖然預見可能打中，卻確信不會發生，屬「有認識過失」，不是未必故意（§13Ⅱ要求結果發生不違背其本意），所以對 B 成立過失致死，二罪想像競合（B）。本案屬打擊錯誤，不是客體錯誤，也不是因果歷程錯誤，更不能只論一個殺人既遂。", "ref": "刑法§13Ⅱ、§14、§271、§276", "evidence": "預見其發生而其發生並不違背其本意者，以故意論。"}, {"id": "109-刑事法-05", "src": "old", "year": 109, "n": 5, "subject": "刑事法", "topic": "刑法", "stem": "對於累犯不分情節一律將最低本刑予以加重之作法，依據司法院釋字第 775 號解釋之說明，主要是違反下列何原則？", "opts": {"A": "罪疑唯輕原則", "B": "習慣法禁止原則", "C": "罪刑相當原則", "D": "法律明確性原則"}, "answer": "C", "explain": "釋字 775 號認為，§47 累犯規定不分情節，一律加重最低本刑，對於不符合刑法目的的個案會造成過苛，牴觸憲法罪刑相當原則（比例原則），所以答案是 C。解釋並未以罪疑唯輕、習慣法禁止或法律明確性原則作為宣告違憲的理由。", "ref": "刑法§47；釋字775", "evidence": "為累犯，加重本刑至二分之一。"}, {"id": "109-刑事法-06", "src": "old", "year": 109, "n": 6, "subject": "刑事法", "topic": "刑法", "stem": "下列行為何者非屬刑法第 10 條第 5 項規定之「性交」概念？", "opts": {"A": "以手指插入他人肛門之行為", "B": "以性器插入他人肛門之行為", "C": "以手指進入他人口腔之行為", "D": "以性器進入他人口腔之行為"}, "answer": "C", "explain": "依§10Ⅴ，性交包括：以性器進入他人性器、肛門或口腔；以及以性器以外的身體部位或器物進入他人「性器、肛門」。以手指進入他人口腔，不屬於上述情形（第 2 款不包括口腔），所以不是性交（C），至多視情形論猥褻。A、B、D 都符合性交的定義。", "ref": "刑法§10Ⅴ", "evidence": "以性器以外之其他身體部位或器物進入他人之性器、肛門，或使之接合之行為。"}, {"id": "109-刑事法-07", "src": "old", "year": 109, "n": 7, "subject": "刑事法", "topic": "刑法", "stem": "關於緊急避難的說明，下列敘述何者錯誤？", "opts": {"A": "緊急避難所拯救的利益，也可以是第三人的利益", "B": "只要是不得已的法益救助行為，皆可主張緊急避難", "C": "緊急避難是犧牲第三人利益而保全自己或他人利益", "D": "緊急避難應該符合利益衡量原則"}, "answer": "B", "explain": "緊急避難須是為了避免自己或他人「生命、身體、自由、財產」的緊急危難，而出於不得已之行為，且應符合利益衡量；並不是所有不得已的法益救助行為都能主張，依§24Ⅱ，公務上或業務上有特別義務的人也不適用（B 錯）。A、C、D 都是正確敘述。", "ref": "刑法§24", "evidence": "因避免自己或他人生命、身體、自由、財產之緊急危難而出於不得已之行為，不罰。"}, {"id": "109-刑事法-08", "src": "old", "year": 109, "n": 8, "subject": "刑事法", "topic": "刑法", "stem": "A 與女友 B 在街上嘻鬧，A 突然從背後抱住 B 的身體，B 假意驚慌，高喊「有色狼喔」，不料剛好騎車經過的甲聽見 B 的呼喊後，竟為了「救」B，甲直接以機車撞向 A，A 跌倒輕微挫傷。下列敘述，何者錯誤？", "opts": {"A": "本案並無現在不法侵害，甲不得主張正當防衛阻卻違法", "B": "甲誤認案例中有不法侵害，是對於阻卻違法事由的事實有誤認", "C": "所謂行為人對於阻卻違法事由的事實發生誤認，學理又稱為容許構成要件錯誤", "D": "甲基於防衛意思傷害 A，依實務見解，仍成立故意傷害罪"}, "answer": "D", "explain": "本案沒有現在不法之侵害，甲是誤想防衛，也就是對阻卻違法事由的事實前提有誤認（容許構成要件錯誤），A、B、C 都正確。實務（如最高法院 29 年上字第 509 號判例意旨）認為誤想防衛阻卻故意，不成立故意傷害罪，至多視有無過失論過失傷害。D 說仍成立故意傷害罪，是錯誤敘述。", "ref": "刑法§12、§23；實務見解", "evidence": "行為非出於故意或過失者，不罰。"}, {"id": "109-刑事法-09", "src": "old", "year": 109, "n": 9, "subject": "刑事法", "topic": "刑法", "stem": "關於故意犯與過失犯的說明，下列敘述何者正確？", "opts": {"A": "對於重大法益的破壞，不論故意犯或過失犯，刑法都有處罰未遂行為的規定", "B": "行為若非出於故意或過失，就不可能成立犯罪", "C": "刑法處罰故意犯的規定，是一種刑罰制裁的例外補充", "D": "破壞法益的行為如果不存在故意，仍應以過失犯論處"}, "answer": "B", "explain": "依§12Ⅰ，行為非出於故意或過失者不罰，所以 B 正確。過失犯沒有未遂的概念（A 錯）；刑法以處罰故意犯為原則，處罰過失犯才是例外，須有特別規定（§12Ⅱ），C、D 顛倒了原則與例外。", "ref": "刑法§12", "evidence": "行為非出於故意或過失者，不罰。"}, {"id": "109-刑事法-10", "src": "old", "year": 109, "n": 10, "subject": "刑事法", "topic": "刑法", "stem": "關於刑法不作為犯之敘述，下列何者錯誤？", "opts": {"A": "可分為「純正不作為犯」與「不純正不作為犯」", "B": "「不純正不作為犯」，必須探討行為人是否具備有作為義務", "C": "「純正不作為犯」係指不作為即違反命令或規範的犯罪", "D": "「不純正不作為犯」必減刑"}, "answer": "D", "explain": "不作為犯分為純正不作為犯（法律直接規定不作為即成罪，如§294 後段）與不純正不作為犯（以不作為實現作為犯的構成要件，須具有保證人地位及作為義務，§15），A、B、C 都正確。我國刑法沒有規定不純正不作為犯「必減刑」，§15 規定其與積極行為同，D 錯誤。", "ref": "刑法§15", "evidence": "能防止而不防止者，與因積極行為發生結果者同。"}, {"id": "109-刑事法-11", "src": "old", "year": 109, "n": 11, "subject": "刑事法", "topic": "刑法", "stem": "關於「教唆犯」與「幫助犯」的說明，下列敘述何者錯誤？", "opts": {"A": "教唆犯與幫助犯，均為共犯之犯罪類型", "B": "教唆犯與幫助犯，均適用共犯從屬的處罰原則", "C": "當被教唆者於實行犯罪時發生客體錯誤之情形，教唆者不成立犯罪", "D": "正犯既遂後，事後幫助的行為不成立幫助犯"}, "answer": "C", "explain": "教唆犯與幫助犯都屬於共犯（狹義），均採共犯從屬性原則（A、B 正確）。被教唆者發生客體錯誤時，通說與實務認為對教唆者而言屬於不重要的錯誤（或視為打擊錯誤），教唆者仍應依其所教唆之罪處罰，不是不成立犯罪（C 錯）。正犯既遂後才提供協助，屬事後幫助，不成立幫助犯（D 正確）。", "ref": "刑法§29、§30", "evidence": "教唆犯之處罰，依其所教唆之罪處罰之。"}, {"id": "109-刑事法-12", "src": "old", "year": 109, "n": 12, "subject": "刑事法", "topic": "刑法", "stem": "甲想殺乙對乙開槍，乙沒有被打中，卻因閃避摔倒在地，膝蓋挫傷流血不止。甲看到乙摔倒的痛苦表情，於心不忍，放棄繼續開槍離去，惟事後證明，甲的手槍也沒有子彈了，只是甲不知道。乙自行就醫不久便康復。下列敘述何者正確？", "opts": {"A": "甲開槍但沒打中乙，只能成立殺人預備罪", "B": "甲開槍行為可認定為構成要件行為的著手實行，但因死亡結果未發生，為學理所稱之未了未遂", "C": "甲之所以沒有繼續開槍，雖然是看到乙痛苦表情而改變殺乙的想法，但仍可論以中止未遂", "D": "因為事實上槍枝已無子彈，甲不能再開槍殺乙，甲的行為為不能未遂"}, "answer": "C", "explain": "甲已著手開槍，結果沒有發生；甲主觀上認為還可以繼續射擊卻放棄，是出於己意（同情），成立中止未遂（C）。中止與否依行為人的主觀認知判斷，甲不知道已經沒有子彈，不影響中止的成立。A 錯：開槍已經著手，不是預備；B 錯：未了未遂與既了未遂依行為人是否自認已完成必要行為區分，並非因結果未發生；D 錯：不能未遂須自始無危險，本案開槍當時有危險。", "ref": "刑法§27Ⅰ", "evidence": "已著手於犯罪行為之實行，而因己意中止或防止其結果之發生者，減輕或免除其刑。"}, {"id": "109-刑事法-13", "src": "old", "year": 109, "n": 13, "subject": "刑事法", "topic": "刑法", "stem": "甲受僱殺 A，甲計畫以安眠藥讓 A 睡著，並將其投入河中使其溺斃。但甲將睡著的 A 投入水中時，A 的頭撞到水中尖銳石頭，A 死亡。關於甲行為的論罪檢驗，下列敘述何者錯誤？", "opts": {"A": "甲之行為與 A 的死亡，具有條件理論的因果關係", "B": "甲對 A 製造溺死之風險，案例中 A 死於頭部撞擊石頭，不可將 A 死亡結果，歸責於甲將 A 投入水中的行為", "C": "甲之行為同時製造 A 溺斃與撞擊之風險，風險並於後續因果流程中實現", "D": "甲的行為與 A 的死亡並非因果歷程的重大偏離，行為與結果仍具因果關係"}, "answer": "B", "explain": "把昏睡的人投入河中，本來就包含頭部撞擊水中石塊的典型風險。實際的死因（撞石）與甲的預想（溺斃）雖有偏離，但不是重大偏離，屬不重要的因果歷程錯誤，結果仍可歸責於甲，所以 A、C、D 正確。B 說不能把 A 的死亡歸責於甲，是錯誤敘述。", "ref": "刑法§13；學說（客觀歸責、因果歷程錯誤）", "evidence": "行為人對於構成犯罪之事實，明知並有意使其發生者，為故意。"}, {"id": "109-刑事法-14", "src": "old", "year": 109, "n": 14, "subject": "刑事法", "topic": "刑法", "stem": "關於刑法沒收之規定，依我國實務見解，下列敘述何者錯誤？", "opts": {"A": "違禁物不論是否為犯人所有，均應宣告沒收", "B": "過失致人於死，如果具體案例存在有犯罪工具，該犯罪工具仍應沒收", "C": "對於犯罪之利得，行為人若已經完全賠償被害人損害，為避免雙重剝奪，法院不應再宣告利得沒收", "D": "計程車駕駛於載客時對他人犯強制性交罪，該計程車屬於犯罪工具，得宣告沒收"}, "answer": "B", "explain": "違禁物不論是否屬於犯罪行為人，都應沒收（A 正確，§38Ⅰ）。犯罪工具依§38Ⅱ是「得」沒收，並非「應」沒收，而且過失犯欠缺利用工具犯罪的意思，實務通常不沒收，所以 B 錯。實務認為行為人已完全賠償被害人時，比照§38-1Ⅴ不再宣告沒收利得（C 正確）；計程車是供犯罪所用之物，得沒收（D 正確）。", "ref": "刑法§38Ⅰ、Ⅱ、§38-1Ⅴ", "evidence": "供犯罪所用、犯罪預備之物或犯罪所生之物，屬於犯罪行為人者，得沒收之。"}, {"id": "109-刑事法-15", "src": "old", "year": 109, "n": 15, "subject": "刑事法", "topic": "刑法", "stem": "甲以自己使用的筆記型電腦對 A 公司之電腦植入病毒軟體，並藉此要脅公司給付 20 萬元。A 公司如約給付金額後，甲卻沒能依約完全解決病毒問題，A 公司報警後甲遭逮捕，在甲的身上並找到海洛英數包。下列關於沒收規定之敘述，何者正確？", "opts": {"A": "甲之筆記型電腦為犯罪工具，法院在判決中應宣告沒收", "B": "甲確實有嘗試幫公司解決病毒問題，20 萬元的不法利得，法官可以斟酌裁量，非義務沒收", "C": "海洛英數包屬於違禁物，非任何人可以持有，法官不得宣告沒收", "D": "法官得對海洛英單獨宣告沒收"}, "answer": "D", "explain": "依§40Ⅱ，違禁物或專科沒收之物得單獨宣告沒收，所以法官得對海洛英單獨宣告沒收（D）。筆電是犯罪工具，依§38Ⅱ是「得」沒收，不是「應」沒收（A 錯）；犯罪所得依§38-1Ⅰ屬於義務沒收，只有過苛等情形才依§38-2Ⅱ裁量不宣告（B 錯）；海洛英是違禁物，依§38Ⅰ應沒收（C 錯）。", "ref": "刑法§40Ⅱ", "evidence": "違禁物或專科沒收之物得單獨宣告沒收。"}, {"id": "109-刑事法-16", "src": "old", "year": 109, "n": 16, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "我國籍屏東東港之漁船自東港出海捕魚，漁船航行至公海時，高雄籍漁民甲與家住臺南的漁民乙發生衝突，甲憤而持刀砍傷乙，之後漁船趕緊於澎湖靠岸，將乙送醫治療。試問關於甲傷害乙之案件，以下何法院無管轄權？", "opts": {"A": "屏東地方法院", "B": "高雄地方法院", "C": "臺南地方法院", "D": "澎湖地方法院"}, "answer": "C", "explain": "依§5Ⅰ，犯罪地或被告住所、居所、所在地的法院有管轄權，所以被告甲住所地的高雄地院有管轄權。依§5Ⅱ，在我國船艦內犯罪，船艦本籍地（屏東）與犯罪後停泊地（澎湖）的法院也有管轄權。臺南只是被害人乙的住所地，不構成管轄連結，所以答案是 C。", "ref": "刑訴§5", "evidence": "船艦本籍地、航空機出發地或犯罪後停泊地之法院，亦有管轄權。"}, {"id": "109-刑事法-17", "src": "old", "year": 109, "n": 17, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "甲係連續對住宅縱火之縱火狂，因對自己的行為感到非常愧疚，遂直接至地檢署自首，並請檢察官立刻羈押他，否則他會忍不住繼續再縱火。以下敘述，何者正確？", "opts": {"A": "檢察官得以甲係犯最輕本刑五年以上有期徒刑之重罪為由，直接羈押甲", "B": "檢察官得以甲犯對住宅放火罪嫌疑重大且有事實足認為有反覆實行同一犯罪之虞為由，直接羈押甲", "C": "檢察官得逮捕甲，並以甲係犯最輕本刑五年以上有期徒刑之重罪為由，向法官聲請羈押甲", "D": "檢察官得逮捕甲，並以甲犯放火罪嫌疑重大且有事實足認有反覆實行同一犯罪之虞為由，向法官聲請羈押甲"}, "answer": "D", "explain": "羈押須由法官決定，檢察官不能直接羈押（A、B 錯）。依§228Ⅳ，被告自首時，檢察官訊問後認為有羈押必要，得予逮捕並聲請法院羈押。放火罪依§101-1Ⅰ①屬預防性羈押罪名，以「犯罪嫌疑重大且有事實足認有反覆實行同一犯罪之虞」為理由聲請羈押，是正確的（D）。C 單以重罪為由不夠，§101Ⅰ③還要求有相當理由認為有逃亡、滅證之虞。", "ref": "刑訴§101-1Ⅰ①、§228Ⅳ", "evidence": "但認有羈押之必要者，得予逮捕，並將逮捕所依據之事實告知被告後，聲請法院羈押之。"}, {"id": "109-刑事法-18", "src": "old", "year": 109, "n": 18, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察官至某餐廳欲逮捕毒品通緝犯甲，在該餐廳六樓包廂逮捕毒品通緝犯甲，警察立刻實施附帶搜索，本案中何種搜索係屬違法？", "opts": {"A": "搜索甲掛在其座椅的西裝外套", "B": "搜索甲褲子內的口袋", "C": "搜索甲停放在餐廳停車場的轎車", "D": "搜索甲放置在桌上的手提包"}, "answer": "C", "explain": "依§130，逮捕時的附帶搜索範圍限於被告的身體、隨身攜帶之物件、所使用之交通工具及其立即可觸及之處所。掛在座椅上的外套、褲子口袋、桌上的手提包，都在立即可觸及的範圍內；停在餐廳停車場的轎車，不是甲在六樓當時所使用、可以立即觸及的，搜索屬違法（C）。", "ref": "刑訴§130", "evidence": "得逕行搜索其身體、隨身攜帶之物件、所使用之交通工具及其立即可觸及之處所。"}, {"id": "109-刑事法-19", "src": "old", "year": 109, "n": 19, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "以下關於被告自白之敘述，何者錯誤？", "opts": {"A": "被告之自白不得作為有罪判決之唯一證據", "B": "非任意性自白是否具證據能力，應由法院審酌人權保障與公共利益的均衡維護加以認定", "C": "被告之自白，除有特別規定外，非於有關犯罪事實之其他證據調查完畢後，不得調查", "D": "若被告陳述其自白係出於不正之方法者，則自白應先於其他事證而調查"}, "answer": "B", "explain": "依§156Ⅰ，非任意性自白絕對沒有證據能力，不需再權衡（B 錯，B 所描述的是§158-4 違法取證的權衡法則）。A 是§156Ⅱ自白補強法則；C 是§161-3 自白最後調查原則；D 是§156Ⅲ，被告陳述自白出於不正方法時，應先於其他事證而為調查。", "ref": "刑訴§156Ⅰ、Ⅲ", "evidence": "被告陳述其自白係出於不正之方法者，應先於其他事證而為調查。"}, {"id": "109-刑事法-20", "src": "old", "year": 109, "n": 20, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "甲目擊黑道份子殺人之經過，回家後將其所目擊的事實鉅細靡遺的跟其太太乙講，但因擔心遭黑道威脅，甲並未聲張。事後，檢察官調出案發現場的監視器，發現甲為目擊證人，乃傳喚甲到庭作證，豈料甲在前往地檢署的路上出車禍身亡。之後，檢察官將涉嫌殺人之黑道份子起訴，乙則於審判中出庭，並於具結後作證甲跟其所講述的黑道殺人事實。依實務見解，以下敘述何者正確？", "opts": {"A": "乙在法庭上的證言具證據能力", "B": "乙之證言屬傳聞證據，不具證據能力", "C": "乙之證言雖屬傳聞證據，但適用刑事訴訟法第 159 條之 3 的規定，例外具有證據能力", "D": "乙之證言雖屬傳聞證據，但類推適用刑事訴訟法第 159 條之 3 的規定，例外具有證據能力"}, "answer": "D", "explain": "乙在法庭上轉述甲在審判外所說的內容，屬傳聞證據。甲已死亡，但甲的陳述不是在警詢中所為，不能直接適用§159-3。實務認為原陳述人死亡而無法到庭時，可以類推適用§159-3：經證明具有可信之特別情況，且為證明犯罪事實所必要者，例外有證據能力（D）。", "ref": "刑訴§159-3①；實務見解", "evidence": "經證明具有可信之特別情況，且為證明犯罪事實之存否所必要者，得為證據"}, {"id": "109-刑事法-21", "src": "old", "year": 109, "n": 21, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "以下關於「上訴」之敘述，何者錯誤？", "opts": {"A": "被告僅得為自己之利益而上訴", "B": "自訴人僅得為被告之不利益提起上訴", "C": "檢察官僅得為被告之不利益提起上訴", "D": "檢察官得為被告之利益或為被告之不利益而提起上訴"}, "answer": "C", "explain": "依§344Ⅳ，檢察官為被告之利益，也可以上訴；檢察官是公益代表人，可以為被告的利益或不利益提起上訴，所以 C 說「僅得為被告之不利益提起上訴」是錯誤敘述（D 正確）。被告上訴須為自己的利益；自訴人是被告的對立當事人，實務認為只能為被告之不利益上訴。", "ref": "刑訴§344Ⅳ", "evidence": "檢察官為被告之利益，亦得上訴。"}, {"id": "109-刑事法-22", "src": "old", "year": 109, "n": 22, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於「拒絕證言權」的敘述，依實務見解，以下何者錯誤：", "opts": {"A": "醫師就其因業務所知悉有關他人秘密之事項受訊問，除經本人允許者外，得拒絕證言", "B": "被告的未婚妻，得拒絕證言", "C": "新聞記者因其報導內容接受訊問者，關於其消息來源，得拒絕證言", "D": "證人恐因陳述致自己受刑事追訴或處罰者，得拒絕證言"}, "answer": "C", "explain": "§182 規定業務上可以拒絕證言的人，限於醫師、藥師、心理師、助產士、宗教師、律師、辯護人、公證人、會計師等，不包括新聞記者，所以 C 錯誤（實務不承認記者依本條享有拒絕證言權）。A 符合§182；B 與被告訂有婚約者，依§180Ⅰ②得拒絕證言；D 恐自己受刑事追訴者，依§181 得拒絕證言。", "ref": "刑訴§180、§181、§182", "evidence": "證人為醫師、藥師、心理師、助產士、宗教師、律師、辯護人、公證人、會計師"}, {"id": "109-刑事法-23", "src": "old", "year": 109, "n": 23, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "刑事訴訟法中關於對自訴之限制，以下敘述何者錯誤：", "opts": {"A": "夫對妻不得提自訴", "B": "父親對兒子不得提自訴", "C": "值勤中遭打傷的警察，得對行為人提出傷害罪與妨害公務罪之自訴", "D": "同一案件經檢察官開始偵查，原則上即不得再行自訴"}, "answer": "B", "explain": "§321 規定「對於直系尊親屬或配偶，不得提起自訴」，限制的是卑親屬告尊親屬，以及配偶之間互告。父親對兒子（直系卑親屬）提自訴不受限制，所以 B 是錯誤敘述；A 夫對妻不得自訴，正確。C 妨害公務與傷害為一行為觸犯數罪，依§319Ⅲ，較重的傷害罪可以自訴，全部得提起。D 符合§323Ⅰ。", "ref": "刑訴§321、§323Ⅰ", "evidence": "對於直系尊親屬或配偶，不得提起自訴。"}, {"id": "109-刑事法-24", "src": "old", "year": 109, "n": 24, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "以下何者非屬刑事訴訟法第 379 條所定之「當然違背法令事由」？", "opts": {"A": "選任辯護案件，辯護人未經到庭辯護而逕行審判", "B": "依法應於審判期日調查之證據而未予調查", "C": "未經參與審理之法官參與判決", "D": "未與被告以最後陳述之機會"}, "answer": "A", "explain": "§379⑦只限「依本法應用辯護人之案件或已經指定辯護人之案件」，辯護人未到庭而逕行審判，才屬當然違背法令。非強制辯護的選任辯護案件，辯護人未到庭，不在列舉範圍內（A）。B 為第 10 款、C 為第 13 款、D 為第 11 款，都屬當然違背法令事由。", "ref": "刑訴§379⑦", "evidence": "依本法應用辯護人之案件或已經指定辯護人之案件，辯護人未經到庭辯護而逕行審判者。"}, {"id": "109-刑事法-25", "src": "old", "year": 109, "n": 25, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "甲遭乙誣告犯竊盜罪，法院不察導致誤判甲竊盜罪，經甲上訴後仍遭判有罪判決確定。甲怒告乙誣告，經法院查明真相後判決乙誣告有罪判決確定。甲應透過何種救濟管道，以撤銷其遭誣告而被判竊盜罪的有罪確定判決？", "opts": {"A": "非常上訴", "B": "再審", "C": "聲請回復原狀", "D": "聲請赦免"}, "answer": "B", "explain": "依§420Ⅰ③，受有罪判決之人已證明其係被誣告者，得為受判決人之利益聲請再審；依同條第二項，這項證明以經判決確定為限，本題乙誣告罪已判決確定，符合要件（B）。非常上訴是針對審判違背法令，由檢察總長提起；回復原狀是針對遲誤期間；赦免屬總統權限，都不適用。", "ref": "刑訴§420Ⅰ③", "evidence": "受有罪判決之人，已證明其係被誣告者。"}, {"id": "109-刑事法-27", "src": "old", "year": 109, "n": 27, "subject": "刑事法", "topic": "消防法", "stem": "「消防法」有關液化石油氣容器（以下簡稱容器）之規定，何者正確？", "opts": {"A": "容器應定期檢驗，零售業者應於檢驗期限屆滿前，將容器送經中央主管機關登錄之容器檢驗機構實施檢驗，經檢驗合格，即可繼續使用", "B": "容器檢驗機構辦理容器檢驗所需費用，由零售業者負擔", "C": "容器輸入業者，應向中央主管機關直接申請個別認可", "D": "容器應經個別認可合格後，即可銷售"}, "answer": "B", "explain": "依§15-4Ⅱ，容器檢驗機構辦理容器檢驗所需費用，由零售業者負擔（B）。A 漏了「附加合格標示後」才能繼續使用；C 容器製造或輸入業者應先申請型式認可，取得證書後才能申請個別認可（§15-3Ⅰ），不能直接申請個別認可；D 個別認可合格後，還須附加合格標示才能銷售（§15-3Ⅱ）。", "ref": "消防法§15-3、§15-4Ⅱ", "evidence": "前項所定容器檢驗機構辦理容器檢驗所需費用，由零售業者負擔"}, {"id": "109-刑事法-29", "src": "old", "year": 109, "n": 29, "subject": "刑事法", "topic": "消防法", "stem": "依據「消防法」之規定，所謂「消防主管機關」，何者正確？①內政部  ②臺北市政府消防局③花蓮縣政府  ④基隆港務消防隊", "opts": {"A": "①②③④", "B": "①②③", "C": "①③", "D": "①"}, "answer": "C", "explain": "依§3，消防法的主管機關在中央為內政部，在直轄市為直轄市政府，在縣（市）為縣（市）政府，所以①內政部、③花蓮縣政府都是主管機關（C）。臺北市政府消防局只是業務承辦機關（細則§2），基隆港務消防隊也不是主管機關。", "ref": "消防法§3；消防法施行細則§2", "evidence": "本法所稱主管機關：在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。"}, {"id": "109-刑事法-30", "src": "old", "year": 109, "n": 30, "subject": "刑事法", "topic": "消防法", "stem": "依據「消防法」、「消防法施行細則」之規定，消防防護計畫應包括事項，何者正確？", "opts": {"A": "防火避難設施之自行檢查：每月至少檢查一次，檢查結果遇有缺失，應報告管理權人立即改善", "B": "滅火、通報及避難訓練之實施；每半季至少應舉辦一次，每次不得少於 4 小時，並應事先通報當地消防機關", "C": "場所之組織編制圖、分工圖及平面圖", "D": "自衛消防編組：員工在 15 人以上者，至少編組滅火班、通報班及避難引導班；員工在 50 人以上者，應增編安全防護班及救護班"}, "answer": "A", "explain": "依細則§5，防火避難設施的自行檢查每月至少一次，缺失應報告管理權人立即改善（A 正確）。B 訓練為「每半年」至少一次，不是每半季；C 應為場所之「位置圖、逃生避難圖及平面圖」；D 自衛消防編組的門檻為員工「10 人」以上，不是 15 人。", "ref": "消防法§13；消防法施行細則§5", "evidence": "防火避難設施之自行檢查：每月至少檢查一次"}, {"id": "109-刑事法-32", "src": "old", "year": 109, "n": 32, "subject": "刑事法", "topic": "災害防救法", "stem": "依據「災害防救法」之規定，為有效整合運用救災資源，中央災害防救委員會設何種單位，統籌、調度國內各搜救單位資源，執行災害事故之人員搜救及緊急救護之運送任務？", "opts": {"A": "內政部消防署", "B": "中央災害應變中心", "C": "行政院災害防救辦公室", "D": "行政院國家搜救指揮中心"}, "answer": "D", "explain": "依§7Ⅳ，為了有效整合運用救災資源，中央災害防救委員會設「行政院國家搜救指揮中心」，統籌、調度國內各搜救單位的資源，執行災害事故的人員搜救及緊急救護運送任務（D）。消防署是內政部所屬機關；中央災害應變中心是災時開設的任務編組；行政院災害防救辦公室負責處理委員會的業務。", "ref": "災害防救法§7Ⅳ", "evidence": "中央災害防救委員會設行政院國家搜救指揮中心"}, {"id": "109-刑事法-33", "src": "old", "year": 109, "n": 33, "subject": "刑事法", "topic": "災害防救法", "stem": "依據「災害防救法」之規定，鄉（鎮、市）層級設置的災害防救組織，何者正確？①災害防救會報  ②災害防救委員會  ③災害防救辦公室  ④災害應變中心", "opts": {"A": "①②③", "B": "①③④", "C": "②③④", "D": "①②③④"}, "answer": "B", "explain": "鄉（鎮、市）層級設有災害防救會報（§10）、災害防救辦公室（§11Ⅱ），以及災時成立的災害應變中心（§12
