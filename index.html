條規定假釋得撤銷（A正確），第4項撤銷後出獄日數不算入刑期（B正確）；第2項假釋中故意更犯罪受六月以下有期徒刑宣告，有必要時得撤銷（C正確）。累犯依第47條須受徒刑執行完畢或一部執行而赦免後五年內「故意」再犯，假釋期間刑未執行完畢，且過失犯罪亦不成立累犯，D錯誤當選。", "ref": "刑法§47、§78", "evidence": ""}, {"id": "113-法學-23", "src": "old", "year": 113, "n": 23, "subject": "法學", "topic": "法學緒論", "stem": "依我國著作權法規定，下列行為，何者不侵害或不視為侵害著作權？", "opts": {"A": "於公司業務上使用之電腦中安裝未經授權之電腦程式，供員工營業上使用", "B": "出國旅遊時，於國外購買一本外文小說，放在自己的行李箱內攜帶回國", "C": "明知是未經授權重製之電腦程式，而出借給不特定多數人", "D": "未經著作財產權人同意而輸入二十本在國外合法重製的原文教科書"}, "answer": "B", "explain": "著作權法第87條第1項第4款未經授權輸入真品平行輸入屬視為侵害，但第87條之1第1項第3款規定，屬入境人員行李之一部分而輸入一定數量重製物者不在此限，故B不侵害。A業務上使用盜版程式、C明知盜版而出借、D輸入二十本原文書供非個人使用，均構成侵害或視為侵害。", "ref": "著作權法§87、§87-1", "evidence": ""}, {"id": "113-法學-24", "src": "old", "year": 113, "n": 24, "subject": "法學", "topic": "法學緒論", "stem": "依公職人員選舉罷免法第 4 條規定，有關候選人年齡之計算，以算至下列何期日之前一日為準？", "opts": {"A": "選舉公告日", "B": "登記截止日", "C": "投票日", "D": "法定就職日"}, "answer": "C", "explain": "公職人員選舉罷免法第4條第1項規定，選舉人、候選人年齡及居住期間之計算，均以算至投票日前一日為準，故選C。其餘選舉公告日、登記截止日、法定就職日均非法定計算基準。", "ref": "公職人員選舉罷免法§4", "evidence": ""}, {"id": "113-法學-25", "src": "old", "year": 113, "n": 25, "subject": "法學", "topic": "法學緒論", "stem": "依憲法訴訟法規定，人民聲請裁判憲法審查案件，得由下列何者以一致決裁定不受理？", "opts": {"A": "大法庭", "B": "職務法庭", "C": "審查庭", "D": "憲法法庭"}, "answer": "C", "explain": "憲法訴訟法第61條第2項規定，審查庭就承辦大法官分受之裁判憲法審查聲請案件，得以一致決為不受理之裁定並附理由；不能達成一致決者由憲法法庭評決受理與否，選C。經查2025-01-23修正公布之現行條文，本條仍維持審查庭一致決不受理之機制。", "ref": "憲法訴訟法§61", "evidence": ""}, {"id": "113-法學-26", "src": "old", "year": 113, "n": 26, "subject": "法學", "topic": "法學緒論", "stem": "依憲法訴訟法規定，下列何者非屬人民聲請裁判憲法審查之要件？", "opts": {"A": "須依法定程序用盡審級救濟", "B": "聲請案件必須具憲法重要性或為貫徹聲請人基本權利所必要者", "C": "聲請人必須指摘該裁判本身牴觸憲法", "D": "聲請人必須指摘該裁判所表示之見解，與不同審判權終審法院已表示之見解有異"}, "answer": "D", "explain": "憲法訴訟法第59條第1項規定人民須依法定程序用盡審級救濟（A），並指摘確定終局裁判或其所適用之法規範牴觸憲法（C）；第61條第1項須具憲法重要性或為貫徹基本權所必要（B）。D「與不同審判權終審法院見解有異」係第84條統一解釋法律及命令之要件，非裁判憲法審查要件，選D。", "ref": "憲法訴訟法§59、§61、§84", "evidence": ""}, {"id": "113-法學-27", "src": "old", "year": 113, "n": 27, "subject": "法學", "topic": "法學緒論", "stem": "有關夫妻之住所，下列敘述何者正確？", "opts": {"A": "妻以夫之住所為住所", "B": "協議不成時，得聲請戶政機關定之", "C": "若規定以夫之住所為住所，違反平等及比例原則", "D": "法院裁定前，推定為無住所"}, "answer": "C", "explain": "釋字第452號認舊民法第1002條「妻以夫之住所為住所」違反男女平等及比例原則，C正確。現行民法第1002條第1項規定夫妻之住所由雙方共同協議，協議不成或未為協議時，得聲請「法院」定之（B錯）；第2項法院裁定前，以共同戶籍地推定為住所（D錯）；A為舊法規定，已刪除。", "ref": "民法§1002；釋字第452號", "evidence": ""}, {"id": "113-法學-28", "src": "old", "year": 113, "n": 28, "subject": "法學", "topic": "法學緒論", "stem": "下列何者之行政行為應適用行政程序法之程序規定？", "opts": {"A": "民意機關", "B": "監察機關", "C": "司法機關", "D": "獨立行政機關"}, "answer": "D", "explain": "行政程序法第3條第2項規定，各級民意機關、司法機關及監察機關之行政行為不適用本法程序規定，故A、B、C排除適用。獨立行政機關（如公平會、NCC、中選會）仍屬行政機關，其行政行為應適用行政程序法，選D。", "ref": "行政程序法§3", "evidence": ""}, {"id": "113-法學-29", "src": "old", "year": 113, "n": 29, "subject": "法學", "topic": "法學緒論", "stem": "甲於開放的網路公開論壇上以不雅文字公然侮辱乙，致乙名譽受損及心理受創。關於乙在法律上可主張權利之敘述，下列何者錯誤？", "opts": {"A": "乙得就甲侵害名譽權請求損害賠償", "B": "乙得請求甲停止侵害，並移除該網站上之侮辱性文字", "C": "乙得請求法院命甲回復名譽之適當處分", "D": "依民法第 18 條規定，侵害人格權得請求慰撫金者，以法律有特別規定者為限，故乙不得對甲請求慰撫金"}, "answer": "D", "explain": "名譽權受侵害，得依民法第184條、第195條請求損害賠償（A）；依第18條第1項請求除去侵害（B）；依第195條第1項後段請求回復名譽之適當處分（C）。第18條第2項固規定慰撫金以法律有特別規定者為限，但第195條第1項即為侵害名譽得請求非財產上損害賠償之特別規定，故乙得請求慰撫金，D錯誤當選。", "ref": "民法§18、§195", "evidence": ""}, {"id": "113-法學-30", "src": "old", "year": 113, "n": 30, "subject": "法學", "topic": "法學緒論", "stem": "甲男與乙女結婚，乙於婚後懷胎丙，懷孕期間甲因丁之過失發生車禍死亡。關於胎兒丙之權利，下列敘述何者正確？", "opts": {"A": "因丙不具權利能力，絕對無繼承權", "B": "丙雖有權利能力，但因尚未出生無繼承權", "C": "丙有權利能力，但不得向丁請求損害賠償", "D": "若丙胎死腹中，則丙喪失權利能力"}, "answer": "D", "explain": "民法第7條規定，胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生，故丙就繼承（民法§1166）及對丁請求扶養費損害賠償（§192第2項）均有權利能力，A、B、C錯誤。若丙死產，即不符「非死產」要件，溯及不享有權利能力，官方以D為正解。", "ref": "民法§7、§192、§1166", "evidence": ""}, {"id": "113-法學-31", "src": "old", "year": 113, "n": 31, "subject": "法學", "topic": "英文", "stem": "Others might cry or get bent out of shape when their personal tastes are ____ and ridiculed, but not this young lady with a strong mind of her own.", "opts": {"A": "launched", "B": "announced", "C": "pronounced", "D": "denounced"}, "answer": "D", "explain": "句意：別人的個人品味被「譴責」與嘲笑時可能會哭或生氣，但這位有主見的年輕女士不會。denounce＝公開指責，與 ridiculed 並列。launch 發起；announce 宣布；pronounce 發音、宣告。", "ref": "英文", "evidence": ""}, {"id": "113-法學-32", "src": "old", "year": 113, "n": 32, "subject": "法學", "topic": "英文", "stem": "Susan used the ____ control to turn off the TV in the living room right before she stepped out of the door of her apartment.", "opts": {"A": "dramatic", "B": "normal", "C": "remote", "D": "technical"}, "answer": "C", "explain": "句意：Susan 出門前用「遙控器」關掉客廳電視。remote control＝遙控器，固定搭配。dramatic 戲劇性的；normal 正常的；technical 技術的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-33", "src": "old", "year": 113, "n": 33, "subject": "法學", "topic": "英文", "stem": "Weeks after being hit by a 7.2 earthquake, the entire county, unfortunately, still faced many ____ situations that had left more than two million people homeless.", "opts": {"A": "disastrous", "B": "lucrative", "C": "majestic", "D": "tedious"}, "answer": "A", "explain": "句意：遭7.2級地震襲擊數週後，全郡仍面臨許多「災難性」處境，逾兩百萬人無家可歸。disastrous＝災難性的。lucrative 有利可圖的；majestic 雄偉的；tedious 冗長乏味的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-34", "src": "old", "year": 113, "n": 34, "subject": "法學", "topic": "英文", "stem": "The company’s overhead costs have increased in recent months, leading to a decrease in profits despite higher sales ____ .", "opts": {"A": "faculty", "B": "facility", "C": "avenue", "D": "revenue"}, "answer": "D", "explain": "句意：公司近月間接成本增加，儘管銷售「收入」提高，利潤仍下滑。sales revenue＝銷售收入。faculty 全體教員、能力；facility 設施；avenue 大道、途徑。", "ref": "英文", "evidence": ""}, {"id": "113-法學-35", "src": "old", "year": 113, "n": 35, "subject": "法學", "topic": "英文", "stem": "The head office of this international company is located in New York, and they have set up several ____ in different cities around the world.", "opts": {"A": "compartments", "B": "branches", "C": "supplements", "D": "ranches"}, "answer": "B", "explain": "句意：這家跨國公司總部設在紐約，並在世界各城市設立數個「分公司」。branch＝分支機構。compartment 隔間；supplement 補充品；ranch 大牧場（易與 branch 混淆）。", "ref": "英文", "evidence": ""}, {"id": "113-法學-36", "src": "old", "year": 113, "n": 36, "subject": "法學", "topic": "英文", "stem": "Apart from engendering widespread ecological disorders, pesticides have contributed to the ____ of a new breed of chemical-resistant, highly lethal superbugs.", "opts": {"A": "emergence", "B": "exclusion", "C": "savage", "D": "seduction"}, "answer": "A", "explain": "句意：農藥除造成生態失調外，也促成抗藥性、高致命超級細菌的「出現」。emergence＝出現、興起，contribute to the emergence of。exclusion 排除；savage 野蠻的；seduction 誘惑。", "ref": "英文", "evidence": ""}, {"id": "113-法學-37", "src": "old", "year": 113, "n": 37, "subject": "法學", "topic": "英文", "stem": "The athlete’s tenacious spirit showed amazing ____ and determination, thereby allowing her to overcome the obstacles in her path.", "opts": {"A": "relaxation", "B": "permanence", "C": "reminiscence", "D": "perseverance"}, "answer": "D", "explain": "句意：運動員頑強的精神展現驚人的「毅力」與決心，使她克服障礙。perseverance＝堅持不懈。relaxation 放鬆；permanence 永久性；reminiscence 回憶。", "ref": "英文", "evidence": ""}, {"id": "113-法學-38", "src": "old", "year": 113, "n": 38, "subject": "法學", "topic": "英文", "stem": "Researchers anticipated the slowdown of economy. The ____ outlook scared investors away from the stock market.", "opts": {"A": "gleaming", "B": "glaring", "C": "glamorous", "D": "gloomy"}, "answer": "D", "explain": "句意：研究人員預期經濟放緩，這種「悲觀的」前景嚇跑了股市投資人。gloomy outlook＝悲觀前景。gleaming 閃亮的；glaring 刺眼的、明顯的；glamorous 迷人的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-39", "src": "old", "year": 113, "n": 39, "subject": "法學", "topic": "英文", "stem": "The secretary told the manager that the schedule she arranged was a ____ one, not finalized yet.", "opts": {"A": "tentative", "B": "provincial", "C": "constant", "D": "visual"}, "answer": "A", "explain": "句意：秘書告訴經理她安排的行程是「暫定的」，尚未定案。tentative＝暫時的、試驗性的，與 not finalized yet 呼應。provincial 地方的；constant 持續的；visual 視覺的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-40", "src": "old", "year": 113, "n": 40, "subject": "法學", "topic": "英文", "stem": "One effect caused by drinking too much alcoholic beverage is that our feeling is so stimulated that action and speech seem to be ____ up.", "opts": {"A": "looked", "B": "made", "C": "passed", "D": "speeded"}, "answer": "D", "explain": "句意：飲酒過量的影響之一是感覺受刺激，使動作與言語似乎「加速」。speed up＝加快（過去分詞 speeded/sped up）。look up 查閱；make up 編造；pass up 放棄。", "ref": "英文", "evidence": ""}, {"id": "113-法學-41", "src": "old", "year": 113, "n": 41, "subject": "法學", "topic": "英文", "stem": "The artist spent months refining the intricate details of his latest painting, striving for ____ .", "opts": {"A": "remedy", "B": "summary", "C": "perfection", "D": "recreation"}, "answer": "C", "explain": "句意：藝術家花數月修飾最新畫作的精細細節，力求「完美」。strive for perfection＝追求完美。remedy 補救；summary 摘要；recreation 娛樂。", "ref": "英文", "evidence": ""}, {"id": "113-法學-42", "src": "old", "year": 113, "n": 42, "subject": "法學", "topic": "英文", "stem": "In poor region where people usually die from hunger and diseases, infant ____ is higher than you can imagine.", "opts": {"A": "morality", "B": "mortality", "C": "mortification", "D": "multiplication"}, "answer": "B", "explain": "句意：在人們常死於飢餓與疾病的貧窮地區，嬰兒「死亡率」高得超乎想像。infant mortality＝嬰兒死亡率。morality 道德（易混淆）；mortification 羞辱；multiplication 乘法、增加。", "ref": "英文", "evidence": ""}, {"id": "113-法學-43", "src": "old", "year": 113, "n": 43, "subject": "法學", "topic": "英文", "stem": "The discovery of a potential cure for the disease marked a ____ moment in medical research, offering hope to countless patients worldwide.", "opts": {"A": "total", "B": "pivotal", "C": "conventional", "D": "indefinite"}, "answer": "B", "explain": "句意：發現某疾病的潛在療法，是醫學研究上的「關鍵」時刻，為全球無數病人帶來希望。pivotal＝關鍵的。total 全部的；conventional 傳統的；indefinite 不確定的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-44", "src": "old", "year": 113, "n": 44, "subject": "法學", "topic": "英文", "stem": "Mary’s commitment to her students’ education was evident in her ____ care for her students’ academic and personal growth.", "opts": {"A": "impotent", "B": "reckless", "C": "genuine", "D": "fatal"}, "answer": "C", "explain": "句意：Mary 對學生教育的投入，展現在她對學生學業與個人成長的「真誠」關懷。genuine＝真誠的。impotent 無力的；reckless 魯莽的；fatal 致命的。", "ref": "英文", "evidence": ""}, {"id": "113-法學-45", "src": "old", "year": 113, "n": 45, "subject": "法學", "topic": "英文", "stem": "In order to improve the air quality in the room, it is important to regularly ____ by opening the windows and allowing fresh air to circulate.", "opts": {"A": "ventilate", "B": "penetrate", "C": "perspire", "D": "vocalize"}, "answer": "A", "explain": "句意：為改善室內空氣品質，重要的是定期打開窗戶「通風」，讓新鮮空氣流通。ventilate＝使通風。penetrate 穿透；perspire 流汗；vocalize 發聲。", "ref": "英文", "evidence": ""}, {"id": "113-法學-46", "src": "old", "year": 113, "n": 46, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "as long as", "B": "whatever", "C": "whether", "D": "as recent as"}, "answer": "A", "explain": "句意：融合料理可能已存在數世紀，「只要」人類一直在交流文化面向（就會有）。as long as 表條件或時間長度。whatever、whether 語意不合；as recent as 表「最近至」，不通。", "ref": "英文", "evidence": "", "passage": "What is fusion food? Essentially, this term means bringing together ingredients from different cultures and merging\ntheir recipes. Fusion food has likely been around for centuries, 46 humans have been exchanging facets of their\nculture.\nChinese-American fare is perhaps one of the longest-standing examples of fusion cuisine in the United States. It is\nthought to have 47 in San Francisco in the late 1800’s, as Chinese foods in the US were developed to suit the\nmiddle-class American taste. What many Americans consider to be \" 48 \" would likely never pass the test of\nauthenticity in China.\nTrying out new combinations and seeing what works – and what 49 – is at the heart of fusion cooking. Of course,\ntrying necessitates occasionally failing. Instead of beating yourself up over a failed dish, consider it a 50 experience.\nKeep in mind that you can learn as much from a failure as you can from a success."}, {"id": "113-法學-47", "src": "old", "year": 113, "n": 47, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "terminated", "B": "extinguished", "C": "invented", "D": "originated"}, "answer": "D", "explain": "句意：美式中餐被認為「起源於」19世紀末的舊金山。originate in＝起源於（不及物）。terminated 終止；extinguished 熄滅；invented 為及物動詞，此處缺受詞。", "ref": "英文", "evidence": "", "passage": "What is fusion food? Essentially, this term means bringing together ingredients from different cultures and merging\ntheir recipes. Fusion food has likely been around for centuries, 46 humans have been exchanging facets of their\nculture.\nChinese-American fare is perhaps one of the longest-standing examples of fusion cuisine in the United States. It is\nthought to have 47 in San Francisco in the late 1800’s, as Chinese foods in the US were developed to suit the\nmiddle-class American taste. What many Americans consider to be \" 48 \" would likely never pass the test of\nauthenticity in China.\nTrying out new combinations and seeing what works – and what 49 – is at the heart of fusion cooking. Of course,\ntrying necessitates occasionally failing. Instead of beating yourself up over a failed dish, consider it a 50 experience.\nKeep in mind that you can learn as much from a failure as you can from a success."}, {"id": "113-法學-48", "src": "old", "year": 113, "n": 48, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "fusion food", "B": "Chinese food", "C": "American food", "D": "San Francisco food"}, "answer": "B", "explain": "美式中餐是為迎合美國中產階級口味而發展，因此許多美國人心目中的「中國菜」大概無法通過在中國的道地性檢驗，選B。fusion、American、San Francisco food 皆與上下文邏輯不符。", "ref": "英文", "evidence": "", "passage": "What is fusion food? Essentially, this term means bringing together ingredients from different cultures and merging\ntheir recipes. Fusion food has likely been around for centuries, 46 humans have been exchanging facets of their\nculture.\nChinese-American fare is perhaps one of the longest-standing examples of fusion cuisine in the United States. It is\nthought to have 47 in San Francisco in the late 1800’s, as Chines 公共事務者。", "src": "new"}, {"id": "N-刑法-003", "subject": "刑事法", "topic": "刑法", "stem": "消防車駕駛甲載運隊員趕赴火場，行經人潮眾多之路口時，已預見高速通過可能撞及行人，但自恃駕駛技術純熟，確信不會發生，仍高速通過，終撞傷行人乙。依刑法第13條、第14條，甲對乙受傷之主觀心態應如何評價？", "opts": {"A": "明知並有意使其發生，為直接故意", "B": "預見其發生而其發生不違背其本意，以故意論", "C": "雖預見其能發生而確信其不發生，以過失論", "D": "按其情節應注意並能注意而不注意，而對結果毫無預見"}, "answer": "C", "explain": "依刑法第14條第2項，行為人對構成犯罪之事實，雖預見其能發生而確信其不發生者，以過失論。甲已預見但確信不會發生，C正確。A為第13條第1項之直接故意；B為第13條第2項，須結果發生不違背其本意；D描述對結果毫無預見之情形，與甲已預見之事實不符。", "ref": "刑法§14", "evidence": "行為人對於構成犯罪之事實，雖預見其能發生而確信其不發生者，以過失論。", "src": "new"}, {"id": "N-刑法-004", "subject": "刑事法", "topic": "刑法", "stem": "消防分隊員甲依分隊長乙之命令執行職務。依刑法第21條、第22條規定，下列敘述何者正確？", "opts": {"A": "依所屬上級公務員命令之職務上行為，縱明知命令違法，仍不罰", "B": "依所屬上級公務員命令之職務上行為不罰，但明知命令違法者，不在此限", "C": "依法令之行為，僅得減輕其刑，不能阻卻其違法", "D": "業務上之正當行為，僅得減輕或免除其刑"}, "answer": "B", "explain": "依刑法第21條第2項，依所屬上級公務員命令之職務上行為，不罰；但明知命令違法者，不在此限，B正確，A錯誤。C依第21條第1項，依法令之行為不罰，非僅得減輕其刑；D依第22條，業務上之正當行為不罰，並非僅得減輕或免除其刑。", "ref": "刑法§21", "evidence": "依所屬上級公務員命令之職務上行為，不罰。但明知命令違法者，不在此限。", "src": "new"}, {"id": "N-刑法-005", "subject": "刑事法", "topic": "刑法", "stem": "關於刑法第24條緊急避難規定於消防人員之適用，下列敘述何者正確？", "opts": {"A": "關於避免自己危難之規定，於公務上或業務上有特別義務者，不適用之", "B": "消防人員為避免他人之緊急危難，亦不得主張緊急避難", "C": "緊急避難所欲保護之法益，僅限於生命及身體", "D": "避難行為過當者，仍一律不罰"}, "answer": "A", "explain": "依刑法第24條第2項，前項關於避免自己危難之規定，於公務上或業務上有特別義務者，不適用之，A正確。B所排除者僅限「避免自己危難」，為他人避難仍有適用；C依第1項，保護法益包括生命、身體、自由、財產；D依第1項但書，避難行為過當者，得減輕或免除其刑，並非不罰。", "ref": "刑法§24", "evidence": "前項關於避免自己危難之規定，於公務上或業務上有特別義務者，不適用之。", "src": "new"}, {"id": "N-刑法-006", "subject": "刑事法", "topic": "刑法", "stem": "甲意圖放火燒燬乙現供人使用之住宅，點火後見火勢擴大心生悔悟，自行以滅火器將火撲滅，住宅未達燒燬程度。依刑法規定，甲應如何論處？", "opts": {"A": "成立放火燒燬現供人使用住宅罪之既遂犯", "B": "成立普通未遂犯，得按既遂犯之刑減輕", "C": "成立中止未遂犯，減輕或免除其刑", "D": "屬行為不能發生犯罪結果又無危險，不罰"}, "answer": "C", "explain": "甲已著手放火，因己意中止並防止結果發生，依刑法第27條第1項，減輕或免除其刑；第173條第3項亦處罰放火之未遂犯，C正確。A住宅未達燒燬，非既遂；B非因己意而不遂者，始依第25條得減輕；D甲行為足以燒燬住宅，非第26條之不能犯。", "ref": "刑法§27", "evidence": "已著手於犯罪行為之實行，而因己意中止或防止其結果之發生者，減輕或免除其刑。", "src": "new"}, {"id": "N-刑法-007", "subject": "刑事法", "topic": "刑法", "stem": "非公務員甲與某消防局公務員乙，共同實行僅具公務員身分始能成立之瀆職犯罪。依刑法第31條規定，甲應如何論處？", "opts": {"A": "甲不具公務員身分，不成立該罪", "B": "甲僅能論以幫助犯，並應減輕其刑", "C": "甲科以通常之刑，不得減輕其刑", "D": "甲仍以正犯論，但得減輕其刑"}, "answer": "D", "explain": "依刑法第31條第1項，因身分或其他特定關係成立之罪，其共同實行、教唆或幫助者，雖無特定關係，仍以正犯或共犯論，但得減輕其刑，D正確。A忽略本項規定；B甲係共同實行，應論正犯；C「科以通常之刑」係第31條第2項針對因身分致刑有重輕或免除之情形，與本題身分成立之罪不同。", "ref": "刑法§31", "evidence": "因身分或其他特定關係成立之罪，其共同實行、教唆或幫助者，雖無特定關係，仍以正犯或共犯論。但得減輕其刑。", "src": "new"}, {"id": "N-刑法-008", "subject": "刑事法", "topic": "刑法", "stem": "關於刑法犯罪所得之沒收，下列敘述何者正確？", "opts": {"A": "犯罪所得僅限違法行為所得本身，不包括其變得之物及孳息", "B": "第三人因他人違法行為而無償取得犯罪所得者，亦屬沒收之對象", "C": "犯罪所得已實際合法發還被害人者，法院仍應宣告沒收", "D": "犯罪所得全部不能沒收時，即不得再為追徵或其他處置"}, "answer": "B", "explain": "依刑法第38條之1第2項第2款，犯罪行為人以外之自然人、法人或非法人團體，因他人違法行為而無償或以顯不相當之對價取得犯罪所得者，亦沒收之，B正確。A依第4項，犯罪所得包括其變得之物或財產上利益及其孳息；C依第5項，不予宣告沒收或追徵；D依第3項，應追徵其價額。", "ref": "刑法§38-1", "evidence": "因他人違法行為而無償或以顯不相當之對價取得。", "src": "new"}, {"id": "N-刑法-009", "subject": "刑事法", "topic": "刑法", "stem": "依115年3月增訂之刑法第78條之1規定，關於無期徒刑受刑人經撤銷假釋之效果，下列敘述何者正確？", "opts": {"A": "應執行原無期徒刑，如假釋期間有更犯之罪，併執行之", "B": "經撤銷假釋後，一律不得再許假釋", "C": "因假釋期間故意更犯罪，受五年以上有期徒刑之宣告確定者，執行滿十五年後得再許假釋", "D": "依其他法律規定撤銷假釋者，須執行滿二十年後始得再許假釋"}, "answer": "A", "explain": "依刑法第78條之1第1項，無期徒刑受刑人經撤銷假釋者，應執行原無期徒刑，假釋期間有更犯之罪，併執行之，A正確。B依第2項，除更犯之罪經宣告無期徒刑確定者外，有悛悔實據者得再許假釋；C受五年以上有期徒刑宣告確定者，須執行滿二十五年；D依其他法律規定撤銷假釋者為十年。", "ref": "刑法§78-1", "evidence": "無期徒刑受刑人經撤銷假釋者，應執行原無期徒刑。如假釋期間有更犯之罪，併執行之。", "src": "new", "amend": "115-03-13 增訂"}, {"id": "N-刑法-010", "subject": "刑事法", "topic": "刑法", "stem": "甲因殺人罪受無期徒刑之執行後獲假釋，假釋期間故意犯傷害罪，經判處有期徒刑二年確定，其假釋遭撤銷。依刑法第78條之1規定，甲如有悛悔實據，應於執行原無期徒刑滿幾年後，始得由監獄報請法務部再許假釋？", "opts": {"A": "二十五年", "B": "二十年", "C": "十年", "D": "十五年"}, "answer": "D", "explain": "依刑法第78條之1第2項第2款，假釋期間故意更犯罪，受一年以上未滿五年有期徒刑之宣告確定者，執行滿十五年後得再許假釋；甲受有期徒刑二年之宣告，屬此款，D正確。十年適用於依其他法律撤銷或受未滿一年有期徒刑宣告者；二十五年適用於受五年以上有期徒刑宣告者；二十年非本條所定期間。", "ref": "刑法§78-1", "evidence": "假釋期間故意更犯罪，受一年以上未滿五年有期徒刑之宣告確定者，十五年。", "src": "new", "amend": "115-03-13 增訂"}, {"id": "N-刑法-011", "subject": "刑事法", "topic": "刑法", "stem": "依115年3月增訂之刑法第78條之2規定，關於有期徒刑經撤銷假釋後殘餘刑期之執行，下列敘述何者正確？", "opts": {"A": "殘餘刑期十年以下者，應與他刑合併計算最低應執行期間", "B": "殘餘刑期逾十年者，應全部執行完畢，不得再許假釋", "C": "殘餘刑期逾十年者，於執行滿五年後，所餘刑期之執行適用假釋規定", "D": "殘餘刑期十年以下者，於全部執行完畢後，再接續執行他刑"}, "answer": "D", "explain": "依刑法第78條之2第1項，殘餘刑期十年以下者，於全部執行完畢後，再接續執行他刑，不適用第79條之1第1項合併計算執行期間之規定，D正確，A錯誤。依第2項，殘餘刑期逾十年者，於執行滿十年後，所餘刑期之執行適用第77條第1項假釋規定，故B、C均錯誤。", "ref": "刑法§78-2", "evidence": "有期徒刑經撤銷假釋，殘餘刑期十年以下者，於全部執行完畢後，再接續執行他刑", "src": "new", "amend": "115-03-13 增訂"}, {"id": "N-刑法-012", "subject": "刑事法", "topic": "刑法", "stem": "依刑法第79條之1第2項規定，二以上有期徒刑合併刑期逾若干年，而接續執行逾若干年者，亦得許假釋？", "opts": {"A": "合併刑期逾三十年，接續執行逾十五年", "B": "合併刑期逾四十年，接續執行逾二十五年", "C": "合併刑期逾四十年，接續執行逾二十年", "D": "合併刑期逾五十年，接續執行逾二十五年"}, "answer": "C", "explain": "依刑法第79條之1第2項前段，二以上徒刑併執行，二以上有期徒刑合併刑期逾四十年，而接續執行逾二十年者，亦得許假釋，C正確。另115年3月修正後之但書明定，有第77條第2項第2款、第78條之1、第78條之2之情形者，不在此限。其餘選項之年數均與條文不符。", "ref": "刑法§79-1", "evidence": "二以上有期徒刑合併刑期逾四十年，而接續執行逾二十年者，亦得許假釋。", "src": "new", "amend": "115-03-13 修正"}, {"id": "N-刑法-013", "subject": "刑事法", "topic": "刑法", "stem": "依現行刑法第80條規定，關於追訴權時效期間，下列敘述何者正確？", "opts": {"A": "犯最重本刑為三年以上十年未滿有期徒刑之罪者，追訴權時效期間為十年", "B": "犯最重本刑為一年未滿有期徒刑、拘役或罰金之罪者，追訴權時效期間為三年", "C": "犯最重本刑為十年以上有期徒刑之罪而發生死亡結果者，不受三十年追訴權時效之限制", "D": "犯最重本刑為一年以上三年未滿有期徒刑之罪者，追訴權時效期間為十五年"}, "answer": "C", "explain": "依刑法第80條第1項第1款，犯最重本刑為死刑、無期徒刑或十年以上有期徒刑之罪者，追訴權時效為三十年，但發生死亡結果者，不在此限，C正確。A依第2款應為二十年；B依第4款應為五年；D依第3款應為十年。", "ref": "刑法§80", "evidence": "犯最重本刑為死刑、無期徒刑或十年以上有期徒刑之罪者，三十年。但發生死亡結果者，不在此限。", "src": "new", "amend": "115-07-22 修正"}, {"id": "N-刑法-014", "subject": "刑事法", "topic": "刑法", "stem": "甲對當時15歲之乙犯刑法第221條強制性交罪。依現行刑法第80條規定，關於甲犯行追訴權時效期間之計算，下列敘述何者正確？", "opts": {"A": "自犯罪成立之日起算，不因被害人年齡而有不同", "B": "於乙滿二十歲前之期間，不計入追訴權時效期間", "C": "於乙滿十八歲前之期間，不計入追訴權時效期間", "D": "自乙提出告訴之日起，始開始起算"}, "answer": "B", "explain": "依刑法第80條第3項，犯第221條至第227條等罪者，於被害人滿二十歲前，不計入第1項期間，B正確。A忽略本項特別規定；C年齡門檻為二十歲而非十八歲；D依第2項，追訴權期間原則上自犯罪成立之日起算，並非自提出告訴之日起算。", "ref": "刑法§80", "evidence": "之罪者，於被害人滿二十歲前，不計入第一項期間。", "src": "new", "amend": "115-07-22 修正"}, {"id": "N-刑法-015", "subject": "刑事法", "topic": "刑法", "stem": "消防機關公務員廢弛職務釀成災害者，依刑法第130條規定，其法定刑為何？", "opts": {"A": "一年以上七年以下有期徒刑", "B": "五年以下有期徒刑", "C": "七年以上有期徒刑", "D": "三年以上十年以下有期徒刑"}, "answer": "D", "explain": "依刑法第130條，公務員廢弛職務釀成災害者，處三年以上十年以下有期徒刑，D正確。本罪以具公務員身分者為行為主體，須有廢弛職務之行為並因而釀成災害之結果；A、B、C之刑度均與條文不符，本罪亦無拘役或罰金之選科規定。", "ref": "刑法§130", "evidence": "公務員廢弛職務釀成災害者，處三年以上十年以下有期徒刑。", "src": "new"}, {"id": "N-刑法-016", "subject": "刑事法", "topic": "刑法", "stem": "民眾甲不滿消防車停放占道，竟駕駛自用小客車衝撞正依法執行救災職務之消防員乙，惟乙及時閃避未受傷。依刑法第135條規定，甲妨害公務行為之法定刑為何？", "opts": {"A": "六月以上五年以下有期徒刑", "B": "三年以下有期徒刑、拘役或三十萬元以下罰金", "C": "一年以上七年以下有期徒刑", "D": "無期徒刑或七年以上有期徒刑"}, "answer": "A", "explain": "依刑法第135條第3項第1款，犯前二項之罪而以駕駛動力交通工具犯之者，處六月以上五年以下有期徒刑，A正確。B為同條第1項基本犯之刑；C非本條所定刑度；D為第4項因而致公務員於死之刑，本題乙未受傷，無加重結果。", "ref": "刑法§135", "evidence": "犯前二項之罪而有下列情形之一者，處六月以上五年以下有期徒刑", "src": "new"}, {"id": "N-刑法-017", "subject": "刑事法", "topic": "刑法", "stem": "依114年5月修正之刑法第161條脫逃罪，下列敘述何者正確？", "opts": {"A": "損壞拘禁處所械具而脫逃者，處六月以上五年以下有期徒刑", "B": "依法逮捕、拘禁之人單純脫逃之未遂犯，不罰", "C": "聚眾以強暴脅迫脫逃，在場助勢之人處一年以上七年以下有期徒刑", "D": "依法逮捕、拘禁之人脫逃者，處三年以下有期徒刑"}, "answer": "D", "explain": "依刑法第161條第1項，依法逮捕、拘禁之人脫逃者，處三年以下有期徒刑，D正確。A依第2項應處一年以上七年以下有期徒刑；B第4項明定前三項之未遂犯罰之；C依第3項，在場助勢之人處三年以上十年以下有期徒刑，首謀及下手實施強暴脅迫者處五年以上有期徒刑。", "ref": "刑法§161", "evidence": "依法逮捕、拘禁之人脫逃者，處三年以下有期徒刑。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-刑法-018", "subject": "刑事法", "topic": "刑法", "stem": "依114年5月增訂之刑法第161條之1規定，下列何種情形該當本條之構成要件？", "opts": {"A": "甲經法官命限制出境，經合法傳喚無正當理由不到庭，但尚未經發布通緝", "B": "乙經檢察官命具保，經合法傳喚無正當理由不到庭，並經發布通緝", "C": "丙經檢察官命限制住居，因住院開刀有正當理由未到庭，嗣經發布通緝", "D": "丁經法官裁定羈押後，於提解途中趁隙脫離看管而逃逸"}, "answer": "B", "explain": "刑法第161條之1規定，經檢察官或法官命具保、責付、限制住居或限制出境、出海，經合法傳喚無正當理由不到庭，並經發布通緝者，處三年以下有期徒刑，B三要件均具備，B正確。A尚未經發布通緝；C有正當理由不到庭；D丁屬依法拘禁之人脫逃，應論第161條脫逃罪。", "ref": "刑法§161-1", "evidence": "經檢察官或法官命具保、責付、限制住居或限制出境、出海，經合法傳喚無正當理由不到庭，並經發布通緝者，處三年以下有期徒刑。", "src": "new", "amend": "114-05-28 增訂"}, {"id": "N-刑法-019", "subject": "刑事法", "topic": "刑法", "stem": "關於刑法第168條偽證罪，下列敘述何者正確？", "opts": {"A": "證人未經具結而為虛偽陳述，亦成立本罪", "B": "具結限於供前為之，供後具結者不成立本罪", "C": "虛偽 重大，有事實足認有反覆實行同一犯罪之虞而有羈押必要者，得羈押之？", "opts": {"A": "刑法第335條之普通侵占罪", "B": "刑法第185條之3之不能安全駕駛罪", "C": "刑法第309條之公然侮辱罪", "D": "刑法第284條之過失傷害罪"}, "answer": "B", "explain": "115年5月修正之第101條之1第1項第1款，已將刑法第185條之3不能安全駕駛罪列入預防性羈押罪名，B正確。普通侵占罪、公然侮辱罪及過失傷害罪均未列於該條第1項各款，縱有反覆實行之虞，亦不得依本條羈押，A、C、D均錯誤。", "ref": "刑訴§101-1Ⅰ①", "evidence": "第一百八十五條之一之劫持交通工具罪、第一百八十五條之三不能安全駕駛罪", "src": "new", "amend": "115-05-13 修正"}, {"id": "N-刑訴-002", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "甲多次持棍毆打鄰居乙成傷，涉犯刑法第277條第1項傷害罪（告訴乃論之罪），檢察官以甲有反覆實行同一犯罪之虞，聲請依刑事訴訟法第101條之1羈押。下列敘述何者正確？", "opts": {"A": "傷害罪不在預防性羈押罪名之列，法院應逕予駁回", "B": "甲只要犯罪嫌疑重大，縱無羈押必要亦得羈押", "C": "乙未提出告訴者，法院不得依該條羈押甲", "D": "預防性羈押無須經法官訊問，得依書面審查為之"}, "answer": "C", "explain": "第101條之1第1項第2款已列入刑法第277條第1項傷害罪，A錯誤；但同款但書規定，須告訴乃論而未經告訴、告訴已撤回或逾告訴期間者不在此限，故乙未告訴即不得羈押，C正確。本條須「經法官訊問」且「有羈押之必要」，B、D均錯誤。", "ref": "刑訴§101-1Ⅰ②但書", "evidence": "但其須告訴乃論，而未經告訴或其告訴已經撤回或已逾告訴期間者，不在此限。", "src": "new", "amend": "115-05-13 修正"}, {"id": "N-刑訴-003", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "法院許可停止羈押時，依刑事訴訟法第116條之2命被告應遵守之事項，下列敘述何者錯誤？", "opts": {"A": "法院得命被告接受適當之科技設備監控", "B": "法院得命被告交付護照、旅行文件", "C": "被告違背法院所定應遵守之事項者，得逕行拘提", "D": "應遵守事項一經法院裁定，即不得再變更、延長或撤銷"}, "answer": "D", "explain": "依第116條之2第2項，第1項各款應遵守事項「得依聲請或依職權變更、延長或撤銷之」，D謂不得變更，錯誤，為本題答案。接受科技設備監控（第1項第4款）、交付護照旅行文件（第6款）均為法定事項；違背應遵守事項者，依第4項得逕行拘提，A、B、C均正確。", "ref": "刑訴§116-2", "evidence": "前項各款規定，得依聲請或依職權變更、延長或撤銷之。", "src": "new", "amend": "114-11-11 修正"}, {"id": "N-刑訴-004", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察逮捕販毒現行犯甲後，有相當理由認為採取尿液得作為犯罪證據，且有非即時採尿無法有效保全證據之急迫情況，逕以非侵入方式採尿。依刑事訴訟法規定，應於採取後多久內報請檢察官許可？檢察官認為不應准許者，應於多久內撤銷之？", "opts": {"A": "12小時內；3日內", "B": "24小時內；3日內", "C": "24小時內；5日內", "D": "3日內；5日內"}, "answer": "B", "explain": "依第205條之2第3項，急迫情況逕以非侵入方式採尿者，應於採取後24小時內報請檢察官許可，檢察官認為不應准許者，應於3日內撤銷之，B正確。A報請時限過短，C撤銷期限誤為5日（係第131條第3項法院撤銷逕行搜索之期間），D報請時限錯誤。", "ref": "刑訴§205-2Ⅲ", "evidence": "應於採取後二十四小時內報請檢察官許可，檢察官認為不應准許者，應於三日內撤銷之", "src": "new", "amend": "114-11-11 修正"}, {"id": "N-刑訴-005", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於司法警察對經拘提或逮捕到案之犯罪嫌疑人採取身體跡證，下列敘述何者錯誤？", "opts": {"A": "得違反其意思，採取其指紋、掌紋、腳印，予以照相", "B": "報請許可採取尿液時，其許可書應由法官簽名", "C": "有相當理由認為採取毛髮、唾液或吐氣得作為證據時，並得採取之", "D": "依許可採取尿液時，應出示許可書及可證明其身分之文件"}, "answer": "B", "explain": "依第205條之2第2項，採尿係「報請檢察官許可」，第205條之3第2項並規定許可書由檢察官簽名，B誤為法官，錯誤，為本題答案。第205條之2第1項得違反意思採取指紋、掌紋、腳印、照相，有相當理由時並得採取毛髮、唾液、吐氣；第205條之3第3項應出示許可書及身分文件，其餘選項均正確。", "ref": "刑訴§205-2、§205-3", "evidence": "得違反其意思，報請檢察官許可，以非侵入方式採取之", "src": "new", "amend": "114-11-11 修正增訂"}, {"id": "N-刑訴-006", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "受採取人對於司法警察依刑事訴訟法第205條之2第2項後段逕行以非侵入方式採取尿液不服者，其救濟方式為何？", "opts": {"A": "向該管法院聲請撤銷，期間為10日，自採取之日起算", "B": "向該管檢察署檢察長聲明異議，期間為5日", "C": "向該管法院提起抗告，期間為5日，自送達後起算", "D": "向上級法院提起再抗告，期間為20日"}, "answer": "A", "explain": "依第205條之4第1項、第2項，受採取人不服逕行採尿者，得向該管法院聲請撤銷，聲請期間為10日，自採取之日起算，法院不得以已執行終結而無實益為由駁回，A正確。救濟對象為法院而非檢察長，B錯誤；方式為聲請撤銷而非抗告，期間亦非5日，C錯誤；第4項規定對該裁定不得抗告，D錯誤。", "ref": "刑訴§205-4", "evidence": "前項聲請期間為十日，自採取之日起算。法院不得以已執行終結而無實益為由駁回。", "src": "new", "amend": "114-11-11 增訂"}, {"id": "N-刑訴-007", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察官為調查犯罪，於犯罪嫌疑人使用之車輛裝設全球衛星定位系統（GPS）追蹤位置。依刑事訴訟法規定，下列敘述何者正確？", "opts": {"A": "未經法院核發許可書，實施期間不得逾連續48小時或累計逾5日", "B": "未經法院核發許可書，實施期間不得逾連續24小時或累計逾2日", "C": "經法院核發許可書者，每次許可期間不得逾60日", "D": "有繼續實施之必要者，至遲應於期間屆滿之5日前聲請許可書"}, "answer": "B", "explain": "依第153條之1第3項，GPS追蹤實施期間不得逾連續24小時或累計逾2日，實施當日不足24小時以1日計，逾此須向法院聲請許可書，B正確，A錯誤。同條第5項規定法院許可期間每次不得逾30日，繼續實施至遲應於期間屆滿之2日前聲請，C、D均錯誤。", "ref": "刑訴§153-1Ⅲ、Ⅴ", "evidence": "前二項實施期間，不得逾連續二十四小時或累計逾二日，實施當日不足二十四小時，以一日計。", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-008", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依刑事訴訟法第153條之3規定，對具隱私或秘密合理期待之空間內之人或物實施監看及攝錄影像，下列敘述何者正確？", "opts": {"A": "限於調查最重本刑三年以上有期徒刑之罪，始得為之", "B": "得以實體侵入該空間內裝設攝錄器材之方式實施調查", "C": "對第三人管領之空間實施時，以有事實足認與被告等有所關連時為限", "D": "司法警察官得逕向法院聲請許可書，無須報請檢察官許可"}, "answer": "C", "explain": "第153條之3第2項規定，對第三人管領之空間實施，以「有事實足認」與被告、犯罪嫌疑人等有所關連時為限，C正確。同條第1項限於最重本刑「五年」以上之罪，且須從空間外以非實體侵入性科技方法為之，A、B錯誤；第3項規定司法警察官應報請檢察官許可後聲請，D錯誤。", "ref": "刑訴§153-3", "evidence": "以有事實足認與被告、犯罪嫌疑人、證人或應扣押之物或電磁紀錄有所關連時為限", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-009", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於刑事訴訟法第一編第十一章之一「特殊強制處分」之規定，下列敘述何者錯誤？", "opts": {"A": "追蹤位置得使用GPS或其他非以辨識個人生物特徵之科技方法", "B": "調查被告使用之行動通訊設備位置，應向該管法院聲請許可書", "C": "調查手機位置時無可避免取得非受調查人個資，結束後應即刪除", "D": "對軍事上應秘密之處所實施監看攝錄，該管長官得任意拒絕"}, "answer": "D", "explain": "第153條之4第1項雖規定對軍事上應秘密之處所非得該管長官允許不得實施，但第2項明定除有妨害國家重大利益者外不得拒絕，D謂得任意拒絕，錯誤，為本題答案。A見第153條之1第1項；B見第153條之2第3項；C見第153條之2第5項，均正確。", "ref": "刑訴§153-4", "evidence": "前項情形，除有妨害國家重大利益者外，不得拒絕。", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-010", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察有相當理由認為情況急迫，依刑事訴訟法第153條之6逕行調查犯罪嫌疑人使用之行動通訊設備位置者，下列敘述何者正確？", "opts": {"A": "應於實施後24小時內以書面聲請該管檢察官補發許可書", "B": "法院補發許可書者，實施期間自補發之日起算", "C": "法院駁回補發許可書之聲請者，得提起抗告", "D": "應於實施後3日內以書面聲請該管法院補發許可書"}, "answer": "D", "explain": "依第153條之6第1項，急迫逕行實施者，應於實施後3日內依各該條規定以書面聲請「該管法院」補發許可書，D正確，A時限與機關均錯誤。同條第3項規定法院補發者實施期間自「實施之日」起算，B錯誤；第4項規定聲請經法院駁回者不得聲明不服，C錯誤。", "ref": "刑訴§153-6", "evidence": "得逕行實施，並應於實施後三日內依各該條規定以書面聲請該管法院補發許可書", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-011", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依刑事訴訟法第153條之7規定，經法院核發許可書實施之特殊強制處分調查結束後，執行機關逾多久未向法院陳報，法院應於幾日內主動通知受調查人？", "opts": {"A": "逾1個月；14日內", "B": "逾1個月；30日內", "C": "逾2個月；14日內", "D": "逾3個月；10日內"}, "answer": "A", "explain": "第153條之7第2項規定，調查結束或停止實施後，執行機關逾1個月未為陳報者，法院應於14日內主動通知受調查人，A正確，其餘選項期間均不符。另同條第4項規定不通知原因未消滅者，應每3個月向法院陳報，亦為常見混淆數字。", "ref": "刑訴§153-7Ⅱ", "evidence": "調查結束或停止實施後，執行機關逾一個月未為前項之陳報者，法院應於十四日內主動通知受調查人。", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-012", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "警方依法院許可書對甲實施GPS追蹤以偵辦毒品案，意外取得乙涉犯另一詐欺案之資料。依刑事訴訟法規定，該另案資料得否作為證據？", "opts": {"A": "一律不得作為證據，並應於調查結束後即時銷燬或刪除之", "B": "經該管檢察官核准後，即得於另案作為證據使用", "C": "於實施期間屆滿後7日內補行陳報檢察官並經核准者，得為證據", "D": "於實施期間屆滿後30日內補行陳報法院並經審查認可者，得為證據"}, "answer": "D", "explain": "依第153條之8第2項，調查所得其他案件資料原則不得作為證據，但於實施期間屆滿後30日內補行陳報法院，經法院審查認可該案件與本案具關連性或為最重本刑五年以上之罪者，不在此限，D正確。A忽略但書；B、C審查機關應為法院而非檢察官，且期間不符，均錯誤。", "ref": "刑訴§153-8Ⅱ", "evidence": "但於實施期間屆滿後三十日內補行陳報法院，並經法院審查認可該案件與本案具有關連性或為最重本刑五年以上之罪者，不在此限。", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-013", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於刑事訴訟法特殊強制處分之救濟，下列敘述何者正確？", "opts": {"A": "受調查人對法官依本章所為之裁定，得於10日內提起抗告，自送達後起算", "B": "檢察官聲請核發GPS追蹤許可書經法院駁回者，得提起抗告", "C": "受調查人提起抗告，法院得以已執行終結而無實益為由駁回", "D": "法院就受調查人聲請撤銷檢察官處分所為之裁定，得再抗告"}, "answer": "A", "explain": "第153條之10第1項、第2項規定，受調查人對法官、檢察官依本章所為之裁定或處分，得抗告或聲請撤銷變更，期間10日自送達後起算，A正確；法院不得以已執行終結無實益為由駁回，C錯誤；第4項規定對該裁定不得聲明不服，D錯誤。第153條之5第3項規定許可書聲請經駁回者不得聲明不服，B錯誤。", "ref": "刑訴§153-10、§153-5Ⅲ", "evidence": "前項提起抗告或聲請期間為十日，自送達後起算。法院不得以已執行終結而無實益為由駁回。", "src": "new", "amend": "113-07-31 增訂"}, {"id": "N-刑訴-014", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察詢問犯罪嫌疑人甲時，以甲之辯護人有勾串共犯之虞為由，禁止其在場，致甲無其他辯護人陪同。依刑事訴訟法規定，下列敘述何者錯誤？", "opts": {"A": "禁止辯護人在場之事由，應記明於筆錄", "B": "應再行告知甲得保持緘默及得選任辯護人", "C": "甲非因過失遲誤聲請撤銷之期間者，不得聲請回復原狀", "D": "甲或其辯護人不服者，得於10日內向該管法院聲請撤銷或變更"}, "answer": "C", "explain": "第70條之1規定，第67條至第69條回復原狀之規定，於遲誤聲請撤銷或變更司法警察官或司法警察處分之期間者準用之，C錯誤，為本題答案。第245條第3項規定禁止事由應記明筆錄；第4項規定應再行告知第95條第1項第2、3款事項；第245條之1規定得於10日內向法院聲請撤銷或變更，其餘選項均正確。", "ref": "刑訴§70-1、§245、§245-1", "evidence": "第六十七條至第六十九條之規定，於遲誤聲請撤銷或變更檢察事務官、司法警察官或司法警察處分之期間者，準用之。", "src": "new", "amend": "113-07-31 增訂（§70-1、§245-1）"}, {"id": "N-刑訴-015", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依112年12月修正之刑事訴訟法鑑定制度，下列敘述何者正確？", "opts": {"A": "被告於偵查中無權請求鑑定，僅得於審判中聲請法院為之", "B": "被告、辯護人於偵查中得請求檢察官選任具專業能力之人為鑑定", "C": "檢察官於偵查中選任鑑定人前，應予被告及其辯護人陳述意見之機會", "D": "審判長於審判中選任鑑定人前，僅檢察官得陳述意見"}, "answer": "B", "explain": "第198條之1第1項規定，被告、辯護人及得為被告輔佐人之人於偵查中得請求鑑定，並得請求檢察官選任具專業能力之人為鑑定，B正確，A錯誤。第198條之2第1項係規定檢察官「得」予陳述意見之機會，非「應」，C錯誤；同條第2項當事人、代理人、辯護人或輔佐人均得陳述意見，D錯誤。", "ref": "刑訴§198-1、§198-2", "evidence": "被告、辯護人及得為被告輔佐人之人於偵查中得請求鑑定，並得請求檢察官選任前條第一項之人為鑑定。", "src": "new", "amend": "112-12-15 增訂"}, {"id": "N-刑訴-016", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於刑事訴訟法鑑定報告之規定，下列敘述何者錯誤？", "opts": {"A": "以書面報告者，縱經當事人明示同意，仍須實施鑑定之人到庭說明始得為證據", "B": "鑑定人有數人而意見不同者，應使其各別報告", "C": "鑑定報告應包括鑑定係以可靠之原理及方法作成", "D": "以書面報告者，於審判中原則上應使實施鑑定之人到庭以言詞說明"}, "answer": "A", "explain": "第206條第4項規定，以書面報告者，審判中應使實施鑑定之人到庭以言詞說明，但經當事人明示同意書面報告得為證據者不在此限，A謂縱經同意仍須到庭，錯誤，為本題答案。B見同條第2項但書；C見第3項第3款；D見第4項本文，均正確。", "ref": "刑訴§206", "evidence": "以書面報告者，於審判中應使實施鑑定之人到庭以言詞說明。但經當事人明示同意書面報告得為證據者，不在此限。", "src": "new", "amend": "112-12-15 修正"}, {"id": "N-刑訴-017", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "法院或檢察官囑託醫院、學校或其他相當之機關、機構為鑑定所提出之書面報告，依刑事訴訟法第208條規定，下列何種情形得為證據？", "opts": {"A": "未經認證之民間機構所為，且當事人明示不同意", "B": "被告親友自行委託醫院所出具之鑑定意見", "C": "經主管機關認證之機構或團體所實施之鑑定", "D": "告訴人自行委請民間機構所出具之意見"}, "answer": "C", "explain": "第208條第3項規定，囑託鑑定之書面報告於當事人明示同意、依法令具執掌鑑定鑑識檢驗業務之機關所為、或經主管機關認證之機構或團體所為者得為證據，C正確。未經認證之民間機構且當事人明示不同意，不符任一款，A錯誤；B、D均非法院或檢察官囑託，被告親友及告訴人亦非得依第5項委任鑑定之當事人，均錯誤。", "ref": "刑訴§208Ⅲ", "evidence": "經主管機關認證之機構或團體所實施之鑑定", "src": "new", "amend": "112-12-15 修正"}, {"id": "N-刑訴-018", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察逮捕犯罪嫌疑人後，依刑事訴訟法第93條之1規定，下列經過時間不計入24小時之法定障礙事由，何者敘述正確？", "opts": {"A": "經檢察官命具保之被告在候保中，候保時間不得逾4小時", "B": "因表示選任辯護人而等候其到場，等候時間不得逾6小時", "C": "須由通譯傳譯而等候通譯到場，等候時間不得逾4小時", "D": "犯罪嫌疑人經法院提審之期間，仍應計入24小時"}, "answer": "A", "explain": "第93條之1第1項第7款規定，經檢察官命具保或責付之被告在候保或候責付中，但時間不得逾4小時，A正確。第5款等候辯護人不得逾「4小時」，B錯誤；第6款等候通譯不得逾「6小時」，C錯誤；第8款經法院提審之期間不予計入，D錯誤。", "ref": "刑訴§93-1Ⅰ", "evidence": "經檢察官命具保或責付之被告，在候保或候責付中。但候保或候責付時間不得逾四小時。", "src": "new", "amend": "112-12-15 修正"}, {"id": "N-刑訴-019", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "犯罪嫌疑人甲具原住民身分，於司法警察詢問時未選任辯護人，亦未主動請求立即詢問。依刑事訴訟法規定，下列敘述何者正確？", "opts": {"A": "偵查中無強制辯護之規定，司法警察得逕行詢問", "B": "應等候律師到場，無論等候多久均不得逕行詢問", "C": "應通知依法設立之法律扶助機構指派律師到場為其辯護", "D": "應報請檢察官指定公設辯護人到場為其辯護"}, "answer": "C", "explain": "第31條第5項規定，被告或犯罪嫌疑人具原住民身分，於偵查中未經選任辯護人，司法警察應通知依法設立之法律扶助機構指派律師到場為其辯護，C正確，A、D錯誤。同項但書規定，主動請求立即詢問或等候律師逾4小時未到場者，得逕行詢問，B謂無論多久均不得詢問，錯誤。", "ref": "刑訴§31Ⅴ", "evidence": "檢察官、司法警察官或司法警察應通知依法設立之法律扶助機構指派律師到場為其辯護", "src": "new", "amend": "112-12-15 修正"}, {"id": "N-刑訴-020", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列何者屬於刑事訴訟法第88條第3項所定「以現行犯論」之準現行犯？", "opts": {"A": "犯罪在實施中或實施後即時發覺者", "B": "於身體、衣服等處露有犯罪痕跡，顯可疑為犯罪人者", "C": "犯罪後數日經監視器影像比對查獲者", "D": "經被害人事後於警局指認為犯罪人者"}, "answer": "B", "explain": "第88條第3項規定以現行犯論者為：被追呼為犯罪人者；因持有兇器、贓物或其他物件，或於身體、衣服等處露有犯罪痕跡，顯可疑為犯罪人者，B正確。A為同條第2項之現行犯本身，非準現行犯；C、D均非犯罪實施中或實施後即時發覺，亦不符準現行犯要件，不得逕行逮捕。", "ref": "刑訴§88Ⅲ", "evidence": "因持有兇器、贓物或其他物件，或於身體、衣服等處露有犯罪痕跡，顯可疑為犯罪人者", "src": "new"}, {"id": "N-刑訴-021", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察偵查犯罪，於情況急迫時，下列何種情形得依刑事訴訟法第88條之1逕行拘提犯罪嫌疑人？", "opts": {"A": "經盤查而逃逸，惟所犯顯係最重本刑一年以下有期徒刑之罪者", "B": "經合法通知，無正當理由不到場者", "C": "犯罪嫌疑人無一定之住、居所者", "D": "因現行犯之供述，且有事實足認為共犯嫌疑重大者"}, "answer": "D", "explain": "第88條之1第1項第1款規定，因現行犯之供述，且有事實足認為共犯嫌疑重大者，情況急迫得逕行拘提，D正確。第3款但書排除最重本刑一年以下之罪，A錯誤；經合法通知不到場者依第71條之1應報請檢察官核發拘票，B錯誤；無一定住居所屬第76條逕行拘提事由，非本條，C錯誤。", "ref": "刑訴§88-1Ⅰ①", "evidence": "因現行犯之供述，且有事實足認為共犯嫌疑重大者", "src": "new"}, {"id": "N-刑訴-022", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於偵查中羈押被告之期間，依刑事訴訟法規定，下列敘述何者正確？", "opts": {"A": "偵查中羈押被告不得逾3月", "B": "偵查中延長羈押期間不得逾2月，以延長一次為限", "C": "檢察官至遲應於期間屆滿之3日前聲請延長羈押", "D": "羈押期間自被告經逮捕之時起算"}, "answer": "B", "explain": "第108條第5項規定，延長羈押期間偵查中不得逾2月，以延長一次為限，B正確。同條第1項規定偵查中不得逾2月（審判中始為3月），A錯誤；檢察官至遲應於期間屆滿之5日前聲請，C錯誤；第4項規定羈押期間自簽發押票之日起算，逮捕拘提期間另以一日折算一日，D錯誤。", "ref": "刑訴§108", "evidence": "延長羈押期間，偵查中不得逾二月，以延長一次為限。", "src": "new"}, {"id": "N-刑訴-023", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "偵查中檢察官限制被告出境、出海，依刑事訴訟法規定，下列敘述何者正確？", "opts": {"A": "檢察官逕行限制出境、出海，不得逾6月", "B": "有繼續限制必要者，至遲應於期間屆滿之10日前聲請法院裁定", "C": "聲請延長者，第一次不得逾4月，第二次不得逾2月，以延長二次為限", "D": "被告逃匿而通緝之期間，仍應計入限制出境、出海期間"}, "answer": "C", "explain": "第93條之3第2項規定，偵查中檢察官聲請延長限制出境、出海，第一次不得逾4月，第二次不得逾2月，以延長二次為限，C正確。同條第1項規定檢察官限制不得逾8月，且至遲應於期間屆滿之20日前聲請，A、B錯誤；第3項規定逃匿通緝期間不予計入，D錯誤。", "ref": "刑訴§93-3", "evidence": "偵查中檢察官聲請延長限制出境、出海，第一次不得逾四月，第二次不得逾二月，以延長二次為限。", "src": "new"}, {"id": "N-刑訴-024", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察依法逮捕現行犯甲時，未持有搜索票。依刑事訴訟法第130條規定，下列敘述何者正確？", "opts": {"A": "得逕行搜索甲住處之全部房間及處所，以發現其他犯罪證據", "B": "附帶搜索須經甲出於自願性同意，並將同意意旨記載於筆錄", "C": "附帶搜索應於事前以書面報請檢察官許可後，始得為之", "D": "得逕行搜索其身體、隨身物件、所用交通工具及立即可觸及之處所"}, "answer": "D", "explain": "第130條規定，司法警察逮捕被告、犯罪嫌疑人時，雖無搜索票，得逕行搜索其身體、隨身攜帶之物件、所使用之交通工具及其立即可觸及之處所，D正確。附帶搜索範圍限於立即可觸及處所，A逾越範圍；附帶搜索無須受搜索人同意（同意搜索係第131條之1），亦無須事前報請許可，B、C錯誤。", "ref": "刑訴§130", "evidence": "得逕行搜索其身體、隨身攜帶之物件、所使用之交通工具及其立即可觸及之處所", "src": "new"}, {"id": "N-刑訴-025", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "司法警察官逮捕現行犯後，依刑事訴訟法第92條規定，下列何種情形得經檢察官之許可，不予解送？", "opts": {"A": "所犯為最重本刑三年以下有期徒刑之罪者", "B": "所犯為告訴乃論之罪，其告訴已經撤回者", "C": "現行犯於詢問時已坦承全部犯行者", "D": "現行犯係由一般民眾逮捕後送交者"}, "answer": "B", "explain": "第92條第2項規定，司法警察官逮捕或接受現行犯應即解送檢察官，但所犯最重本刑為一年以下有期徒刑、拘役或專科罰金之罪，或告訴乃論之罪其告訴已撤回或已逾告訴期間者，得經檢察官許可不予解送，B正確。A刑度門檻誤為三年；坦承犯行或由民眾逮捕送交均非法定事由，C、D錯誤。", "ref": "刑訴§92Ⅱ", "evidence": "告訴或請求乃論之罪，其告訴或請求已經撤回或已逾告訴期間者，得經檢察官之許可，不予解送", "src": "new"}, {"id": "N-刑訴-026", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "某消防分隊小隊長於火災現場勘查時，發現跡證顯示有人故意縱火燒燬住宅。依刑事訴訟法規定，下列敘述何者正確？", "opts": {"A": "其因執行職務知有犯罪嫌疑，應為告發", "B": "其非犯罪被害人，得視個人意願決定是否告發", "C": "放火罪須由屋主提出告訴，消防人員無從告發", "D": "應俟法院判決確定後，始得向檢察官告發"}, "answer": "A", "explain": "第241條規定，公務員因執行職務知有犯罪嫌疑者，應為告發。消防人員為公務員，於火災現場勘查係執行職務，知有放火犯罪嫌疑即負告發義務，A正確，B錯誤。放火燒燬住宅罪非告訴乃論，任何人均得告發，C錯誤；告發係促使偵查開始，無須待判決確定，D錯誤。", "ref": "刑訴§241", "evidence": "公務員因執行職務知有犯罪嫌疑者，應為告發。", "src": "new"}, {"id": "N-刑訴-027", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "消防機關救護人員執行勤務時依規定製作之救護紀錄表，於刑事審判中作為證據，依刑事訴訟法傳聞例外規定，下列敘述何者正確？", "opts": {"A": "除顯有不可信之情況外，公務員職務上製作之紀錄文書得為證據", "B": "屬被告以外之人於審判外之書面陳述，一律無證據能力", "C": "須經製作之救護人員到庭具結後，始得為證據", "D": "須經被告於審判程序中明示同意，始得為證據"}, "answer": "A", "explain": "第159條之4第1款規定，除顯有不可信之情況外，公務員職務上製作之紀錄文書、證明文書亦得為證據，消防救護人員依規定製作之救護紀錄表屬之，A正確。本條為傳聞法則之例外，並非一律無證據能力，B錯誤；本款不以製作人到庭具結或當事人同意（第159條之5）為要件，C、D錯誤。", "ref": "刑訴§159-4①", "evidence": "除顯有不可信之情況外，公務員職務上製作之紀錄文書、證明文書。", "src": "new"}, {"id": "N-刑訴-028", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於被告以外之人於審判外陳述之證據能力，依刑事訴訟法規定，下列敘述何者錯誤？", "opts": {"A": "被告以外之人於審判外向法官所為之陳述，得為證據", "B": "於偵查中向檢察官所為之陳述，除顯有不可信之情況者外，得為證據", "C": "警詢陳述與審判中不符，先前陳述具較可信之特別情況且有必要者，得為證據", "D": "到庭後無正當理由拒絕陳述者，其於警詢之陳述一律不得為證據"}, "answer": "D", "explain": "第159條之3第4款規定，被告以外之人到庭後無正當理由拒絕陳述者，其於司法警察調查中之陳述，經證明具有可信之特別情況且為證明犯罪事實存否所必要者，得為證據，D謂一律不得為證據，錯誤，為本題答案。A、B見第159條之1第1、2項；C見第159條之2，均正確。", "ref": "刑訴§159-1～§159-3", "evidence": "其於檢察事務官、司法警察官或司法警察調查中所為之陳述，經證明具有可信之特別情況，且為證明犯罪事實之存否所必要者，得為證據", "src": "new"}, {"id": "N-刑訴-029", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "甲酒後駕車撞死路人乙，經檢察官提起公訴。依刑事訴訟法被害人訴訟參與之規定，下列敘述何者正確？", "opts": {"A": "訴訟參與限於第一審言詞辯論終結前聲請，第二審即不得再聲請", "B": "乙既已死亡，其配偶或直系血親均無從聲請參與本案訴訟", "C": "乙之配偶得於起訴後第二審言詞辯論終結前，向法院聲請參與訴訟", "D": "法院駁回訴訟參與聲請之裁定，聲請人得於法定期間內提起抗告"}, "answer": "C", "explain": "第455條之38第1項第1款，因過失犯罪致人於死之被害人得於提起公訴後第二審言詞辯論終結前向法院聲請參與訴訟；第2項規定被害人死亡者得由其配偶等為之，C正確，A、B錯誤。第455條之40第4項規定准駁訴訟參與之裁定不得抗告，D錯誤。", "ref": "刑訴§455-38、§455-40", "evidence": "得於檢察官提起公訴後第二審言詞辯論終結前，向該管法院聲請參與本案訴訟", "src": "new"}, {"id": "N-刑訴-030", "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於刑事訴訟法之簡易程序，下列敘述何者正確？", "opts": {"A": "所科之刑以宣告緩刑、得易科罰金或得易服社會勞動之有期徒刑及拘役或罰金為限", "B": "檢察官依通常程序起訴之案件，法院一律不得改以簡易判決處刑", "C": "法院以簡易判決處刑前，無論有無必要，均應先行訊問被告", "D": "對簡易判決不服者，應自判決送達之日起10日內向管轄法院提起上訴"}, "answer": "A", "explain": "第449條第3項規定簡易判決所科之刑以宣告緩刑、得易科罰金或得易服社會勞動之有期徒刑及拘役或罰金為限，A正確。同條第2項規定通常程序起訴經被告自白者得改以簡易判決，B錯誤；第1項但書僅「有必要時」應訊問被告，C錯誤；第454條第1項第5款上訴期間為20日，D錯誤。", "ref": "刑訴§449、§454", "evidence": "依前二項規定所科之刑以宣告緩刑、得易科罰金或得易服社會勞動之有期徒刑及拘役或罰金為限。", "src": "new"}, {"id": "N-憲法-001", "subject": "法學", "topic": "憲法", "stem": "人民因犯罪嫌疑被逮捕拘禁時，依憲法第8條規定，逮捕拘禁機關至遲應於多久內將其移送該管法院審問？", "opts": {"A": "十二小時內", "B": "十六小時內", "C": "二十四小時內", "D": "四十八小時內"}, "answer": "C", "explain": "憲法第8條第2項規定，人民因犯罪嫌疑被逮捕拘禁時，逮捕拘禁機關應以書面告知本人及其指定之親友，並至遲於二十四小時內移送該管法院審問；本人或他人亦得聲請法院於二十四小時內向逮捕機關提審。此為人身自由之憲法保留規定，故選C。", "ref": "憲法§8", "evidence": "並至遲於二十四小時內移送該管法院審問", "src": "new"}, {"id": "N-憲法-002", "subject": "法學", "topic": "憲法", "stem": "依憲法第24條規定，公務員違法侵害人民之自由或權利者，下列敘述何者正確？", "opts": {"A": "除依法律受懲戒外，並應負刑事及民事責任", "B": "僅負行政懲戒責任，不另負刑事責任", "C": "被害人民僅得向該公務員個人請求賠償", "D": "須經監察院彈劾成立後，始負民事責任"}, "answer": "A", "explain": "憲法第24條規定公務員違法侵害人民自由或權利者，除依法律受懲戒外，應負刑事及民事責任，被害人民並得依法律向國家請求賠償，此即國家賠償法之憲法依據。公務員責任並非僅限懲戒，被害人亦非只能向個人求償，且民事責任不以監察院彈劾為前提，故選A。", "ref": "憲法§24", "evidence": "除依法律受懲戒外，應負刑事及民事責任。被害人民就其所受損害，並得依法律向國家請求賠償", "src": "new"}, {"id": "N-憲法-003", "subject": "法學", "topic": "憲法", "stem": "依憲法第23條規定，下列何者不屬於該條明文列舉得以法律限制人民自由權利之目的？", "opts": {"A": "防止妨礙他人自由", "B": "避免緊急危難", "C": "維持社會秩序", "D": "維護國家元首尊嚴"}, "answer": "D", "explain": "憲法第23條明定，人民之自由權利，除為防止妨礙他人自由、避免緊急危難、維持社會秩序，或增進公共利益所必要者外，不得以法律限制之，此即法律保留原則與比例原則之依據。「維護國家元首尊嚴」並非該條列舉之目的，故選D。", "ref": "憲法§23", "evidence": "除為防止妨礙他人自由、避免緊急危難、維持社會秩序，或增進公共利益所必要者外，不得以法律限制之", "src": "new"}, {"id": "N-憲法-004", "subject": "法學", "topic": "憲法", "stem": "依憲法本文規定，下列何者同時屬於人民之權利及義務？", "opts": {"A": "受國民教育", "B": "依法律納稅", "C": "依法律服兵役", "D": "應考試服公職"}, "answer": "A", "explain": "憲法第21條規定人民有受國民教育之權利與義務，為憲法本文中唯一同時定為權利與義務者。第19條納稅、第20條服兵役僅規定為「義務」；第18條應考試服公職則規定為「權利」。故選A。", "ref": "憲法§21", "evidence": "人民有受國民教育之權利與義務", "src": "new"}, {"id": "N-憲法-005", "subject": "法學", "topic": "憲法", "stem": "總統依憲法增修條文規定，經行政院會議之決議發布緊急命令後，應於多久期間內提交立法院追認？", "opts": {"A": "七日內", "B": "十日內", "C": "十五日內", "D": "一個月內"}, "answer": "B", "explain": "憲法增修條文第2條第3項規定，總統為避免國家或人民遭遇緊急危難或應付財政經濟上重大變故，得經行政院會議之決議發布緊急命令，不受憲法第43條之限制，但須於發布命令後十日內提交立法院追認，立法院不同意時該命令立即失效，故選B。", "ref": "增修條文§2", "evidence": "但須於發布命令後十日內提交立法院追認，如立法院不同意時，該緊急命令立即失效", "src": "new"}, {"id": "N-憲法-006", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，關於總統解散立法院，下列敘述何者正確？", "opts": {"A": "總統得於不信任案通過後十日內，逕行宣告解散，無須諮詢任何人", "B": "總統於緊急命令生效期間，仍得宣告解散立法院", "C": "新選出之立法委員，其任期接續原屆立法委員任期計算", "D": "立法院解散後，應於六十日內舉行立法委員選舉"}, "answer": "D", "explain": "增修條文第2條第5項：總統於立法院通過不信任案後十日內，經諮詢立法院院長後，得宣告解散立法院；戒嚴或緊急命令生效期間不得解散。立法院解散後應於六十日內選舉，選舉結果確認後十日內自行集會，其任期重新起算，故選D。", "ref": "增修條文§2", "evidence": "立法院解散後，應於六十日內舉行立法委員選舉，並於選舉結果確認後十日內自行集會，其任期重新起算", "src": "new"}, {"id": "N-憲法-007", "subject": "法學", "topic": "憲法", "stem": "副總統缺位時，依憲法增修條文規定應如何處理？", "opts": {"A": "由行政院院長兼任副總統至任期屆滿", "B": "總統應於三個月內提名候選人，由立法院補選", "C": "總統應於六個月內提名候選人，由人民直接補選", "D": "由立法院院長代行其職權至任期屆滿"}, "answer": "B", "explain": "增修條文第2條第7項規定，副總統缺位時，總統應於三個月內提名候選人，由立法院補選，繼任至原任期屆滿為止。另總統、副總統均缺位時，始由行政院院長代行職權，並依第1項由人民直接補選，兩者不可混淆，故選B。", "ref": "增修條文§2", "evidence": "副總統缺位時，總統應於三個月內提名候選人，由立法院補選，繼任至原任期屆滿為止", "src": "new"}, {"id": "N-憲法-008", "subject": "法學", "topic": "憲法", "stem": "行政院對立法院決議之法律案認為窒礙難行，經總統核可移請覆議；立法院於非休會期間，應於覆議案送達後幾日內作成決議？", "opts": {"A": "七日", "B": "十日", "C": "十五日", "D": "三十日"}, "answer": "C", "explain": "增修條文第3條第2項第2款：行政院應於決議案送達十日內移請覆議；立法院應於送達十五日內作成決議，休會期間應於七日內自行集會並於開議十五日內決議。逾期未議決者原決議失效；經全體立委二分之一以上決議維持原案，行政院院長應即接受，故選C。", "ref": "增修條文§3", "evidence": "立法院對於行政院移請覆議案，應於送達十五日內作成決議", "src": "new"}, {"id": "N-憲法-009", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，關於立法院對行政院院長提出不信任案，下列敘述何者正確？", "opts": {"A": "須經全體立法委員三分之一以上連署", "B": "不信任案提出二十四小時後，應於七十二小時內表決", "C": "須經出席委員三分之二以上贊成始為通過", "D": "不信任案未獲通過者，六個月內不得對同一院長再提"}, "answer": "A", "explain": "增修條文第3條第2項第3款：不信任案須全體立委三分之一以上連署；提出七十二小時後，應於四十八小時內記名投票表決；經全體立委二分之一以上贊成通過，院長應於十日內辭職；未獲通過者，一年內不得對同一院長再提，故選A。", "ref": "增修條文§3", "evidence": "立法院得經全體立法委員三分之一以上連署，對行政院院長提出不信任案", "src": "new"}, {"id": "N-憲法-010", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，關於立法院立法委員自第七屆起之名額，下列何者正確？", "opts": {"A": "總額一百二十五人", "B": "自由地區直轄市、縣市選出七十九人", "C": "平地原住民及山地原住民合計四人", "D": "全國不分區及僑居國外國民共三十四人"}, "answer": "D", "explain": "增修條文第4條第1項：立法委員自第七屆起一百一十三人，任期四年，包括自由地區直轄市、縣市七十三人（每縣市至少一人）、平地原住民及山地原住民各三人、全國不分區及僑居國外國民共三十四人；不分區由得票百分之五以上政黨依比率選出，故選D。", "ref": "增修條文§4", "evidence": "三、全國不分區及僑居國外國民共三十四人", "src": "new"}, {"id": "N-憲法-011", "subject": "法學", "topic": "憲法", "stem": "總統於立法院解散後發布緊急命令（非於新任立法委員選舉投票日後發布），依憲法增修條文規定，立法院應如何處理？", "opts": {"A": "由新任立法委員於就職後十日內追認", "B": "應於三日內自行集會，並於開議七日內追認", "C": "應於七日內自行集會，並於開議十日內追認", "D": "由立法院程序委員會先行追認，俟新任委員就職後確認"}, "answer": "B", "explain": "增修條文第4條第6項規定，總統於立法院解散後發布緊急命令，立法院應於三日內自行集會，並於開議七日內追認之；但於新任立委選舉投票日後發布者，由新任立委於就職後追認。立法院不同意時，該緊急命令立即失效，故選B。", "ref": "增修條文§4", "evidence": "總統於立法院解散後發布緊急命令，立法院應於三日內自行集會，並於開議七日內追認之", "src": "new"}, {"id": "N-憲法-012", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，立法院對總統、副總統提出彈劾案之門檻及程序為何？", "opts": {"A": "全體立法委員四分之一之提議，三分之二之決議，交由人民投票複決", "B": "全體立法委員三分之一之提議，二分之一之決議，移送監察院審查", "C": "全體立法委員二分之一以上之提議，三分之二以上之決議，聲請司法院大法官審理", "D": "全體立法委員三分之二以上之提議，四分之三以上之決議，聲請司法院大法官審理"}, "answer": "C", "explain": "增修條文第4條第7項：立法院對總統、副總統之彈劾案，須經全體立委二分之一以上提議、三分之二以上決議，聲請司法院大法官審理，經憲法法庭判決成立時被彈劾人應即解職。選項A為罷免案程序之混淆（罷免為四分之一提議、三分之二同意），故選C。", "ref": "增修條文§4", "evidence": "須經全體立法委員二分之一以上之提議，全體立法委員三分之二以上之決議，聲請司法院大法官審理", "src": "new"}, {"id": "N-憲法-013", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，關於司法院大法官，下列敘述何者正確？", "opts": {"A": "任期八年，不分屆次，個別計算，並不得連任", "B": "設大法官十七人，由總統提名，經立法院同意任命", "C": "任期九年，得連選連任一次", "D": "並為院長、副院長之大法官，亦受八年任期之保障"}, "answer": "A", "explain": "增修條文第5條：司法院設大法官十五人，含院長、副院長，由總統提名經立法院同意任命；大法官任期八年，不分屆次，個別計算，並不得連任；但並為院長、副院長之大法官，不受任期之保障。故選A。", "ref": "增修條文§5", "evidence": "司法院大法官任期八年，不分屆次，個別計算，並不得連任。但並為院長、副院長之大法官，不受任期之保障", "src": "new"}, {"id": "N-憲法-014", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，司法院所提出之年度司法概算，行政院應如何處理？", "opts": {"A": "得逕予刪減，但應附具理由送立法院審議", "B": "須經監察院審核同意後，始得刪減之", "C": "應先送考試院會商後，再編入總預算案", "D": "不得刪減，但得加註意見，編入中央政府總預算案"}, "answer": "D", "explain": "增修條文第5條第6項規定，司法院所提出之年度司法概算，行政院不得刪減，但得加註意見，編入中央政府總預算案，送立法院審議。此為確保司法預算獨立、維護審判獨立之制度設計，行政院並無刪減權，故選D。", "ref": "增修條文§5", "evidence": "司法院所提出之年度司法概算，行政院不得刪減，但得加註意見，編入中央政府總預算案，送立法院審議", "src": "new"}, {"id": "N-憲法-015", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文規定，監察院對於中央、地方公務人員提出彈劾案之門檻為何？", "opts": {"A": "監察委員一人以上之提議，五人以上之審查及決定", "B": "監察委員二人以上之提議，九人以上之審查及決定", "C": "監察委員三人以上之提議，十人以上之審查及決定", "D": "監察委員過半數之提議，全體三分之二之決定"}, "answer": "B", "explain": "增修條文第7條第3項規定，監察院對於中央、地方公務人員及司法院、考試院人員之彈劾案，須經監察委員二人以上之提議，九人以上之審查及決定，始得提出，不受憲法第98條之限制。監察院設監察委員二十九人，任期六年，故選B。", "ref": "增修條文§7", "evidence": "須經監察委員二人以上之提議，九人以上之審查及決定，始得提出", "src": "new"}, {"id": "N-憲法-016", "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文第6條規定，考試院就下列何項公務人員事項，僅掌理其「法制事項」？", "opts": {"A": "銓敘", "B": "保障", "C": "陞遷", "D": "退休"}, "answer": "C", "explain": "增修條文第6條第1項：考試院掌理考試；公務人員之銓敘、保障、撫卹、退休；以及公務人員任免、考績、級俸、陞遷、褒獎之「法制事項」。故陞遷僅限法制事項，其執行屬各用人機關；銓敘、保障、退休則由考試院全面掌理，故選C。", "ref": "增修條文§6", "evidence": "三、公務人員任免、考績、級俸、陞遷、褒獎之法制事項", "src": "new"}, {"id": "N-  "ref": "憲判字111年第1號", "evidence": "", "src": "new"}, {"id": "N-憲法-026", "subject": "法學", "topic": "憲法", "stem": "關於憲法法庭111年憲判字第13號判決（健保資料庫案），下列敘述何者錯誤？", "opts": {"A": "本案所涉之基本權，為憲法第22條保障之資訊隱私權", "B": "健保法就健保資料對外提供利用等重要事項欠缺明確規定，不符法律保留原則", "C": "欠缺當事人得請求停止目的外利用之規定，相關機關應於3年內修法", "D": "個人資料保護法第6條第1項但書第4款違反明確性原則，應立即失效"}, "answer": "D", "explain": "111年憲判字第13號認個資法第6條第1項但書第4款與法律明確性、比例原則尚屬無違；但欠缺個資保護獨立監督機制有違憲之虞；健保法欠缺資料提供利用之明確規定不符法律保留，欠缺請求停止目的外利用之規定亦違反憲法第22條資訊隱私權，均限3年內修法，故D錯誤。", "ref": "憲判字111年第13號", "evidence": "", "src": "new"}, {"id": "N-憲法-027", "subject": "法學", "topic": "憲法", "stem": "依憲法法庭113年憲判字第8號判決（死刑案）意旨，下列敘述何者正確？", "opts": {"A": "死刑侵害生命權之核心，刑法各罪以死刑為法定刑者應全面宣告違憲", "B": "故意殺人罪之死刑僅得適用於情節最嚴重且程序符合最嚴密正當程序之情形", "C": "88年修正之刑法第348條第1項唯一死刑規定，與憲法罪責原則無違", "D": "科處死刑之判決，經各級法院合議庭法官過半數同意即可作成"}, "answer": "B", "explain": "113年憲判字第8號：故意殺人罪以死刑為最重本刑部分，僅得適用於個案犯罪情節屬最嚴重，且刑事程序符合憲法最嚴密正當法律程序之情形，於此範圍內合憲；88年唯一死刑規定不符罪責原則；並要求偵查中辯護人在場、第三審強制辯護與言詞辯論，科處死刑應經合議庭一致決，故選B。", "ref": "憲判字113年第8號", "evidence": "", "src": "new"}, {"id": "N-憲法-028", "subject": "法學", "topic": "憲法", "stem": "依憲法訴訟法規定，憲法法庭判決宣告法規範「定期失效」者，其所定期間之上限為何？", "opts": {"A": "法律位階不得逾一年，命令位階不得逾六個月", "B": "法律位階與命令位階均不得逾二年", "C": "法律位階不得逾二年，命令位階不得逾一年", "D": "法律位階不得逾三年，命令位階不得逾二年"}, "answer": "C", "explain": "憲法訴訟法第52條規定，判決宣告法規範違憲且應失效者，自判決生效日起失效，但主文另有諭知溯及失效或定期失效者依其諭知；定期失效之期間，法律位階法規範不得逾二年，命令位階法規範不得逾一年。例如113年憲判字第6號即諭知至遲屆滿1年失效，故選C。", "ref": "憲法訴訟法§52", "evidence": "", "src": "new"}, {"id": "N-憲法-029", "subject": "法學", "topic": "憲法", "stem": "依憲法訴訟法規定，關於各類案件之聲請期間，下列敘述何者正確？", "opts": {"A": "人民聲請裁判憲法審查，應自用盡審級救濟之最終裁判送達後翌日起六個月不變期間內為之", "B": "人民聲請統一解釋法律及命令，應於不利確定終局裁判送達後六個月內為之", "C": "國家最高機關聲請機關爭議判決，應於協商未果之日起三個月內為之", "D": "地方自治團體聲請地方自治保障案件，應於確定終局裁判送達後一年內為之"}, "answer": "A", "explain": "憲法訴訟法第59條第2項：人民聲請法規範及裁判憲法審查，應自用盡審級救濟之最終裁判送達後翌日起六個月不變期間內為之。第84條統一解釋為三個月；第65條機關爭議為協商未果之日起六個月；第83條地方自治保障為確定終局裁判送達後六個月，故選A。", "ref": "憲法訴訟法§59、§65、§83、§84", "evidence": "", "src": "new"}, {"id": "N-憲法-030", "subject": "法學", "topic": "憲法", "stem": "依憲法訴訟法規定，關於憲法法庭之暫時處分，下列敘述何者 別比例不得低於四分之一，消防基層人員比例不得低於三分之一", "B": "任一性別比例不得低於三分之一，消防基層人員比例不得低於二分之一", "C": "任一性別比例不得低於五分之一，消防基層人員比例不得低於三分之一", "D": "任一性別比例不得低於三分之一，消防基層人員比例不得低於五分之一"}, "answer": "D", "explain": "§25-3明定安全及衛生防護小組成員，任一性別比例不得低於三分之一，消防基層人員比例不得低於五分之一。其餘選項將性別比例誤為四分之一或五分之一、或將基層人員比例誤為三分之一或二分之一，均與條文不符。另諮詢會委員之性別比例同為三分之一（§25-1），易與本條混淆。", "ref": "消防法§25-3", "evidence": "任一性別比例不得低於三分之一，其消防基層人員比例不得低於五分之一", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-005", "subject": "刑事法", "topic": "消防法", "stem": "有關各級消防機關消防人員安全衛生管理系統之評估與查核，依消防法規定，下列敘述何者錯誤？", "opts": {"A": "各級消防機關應定期統計及評估安全衛生管理系統之建置成效，並報請中央主管機關備查", "B": "消防人員因職業上原因引發疾病、傷害、失能或死亡之事故，應即時通報並作成調查紀錄", "C": "查核結果執行不力者，中央主管機關得逕予撤換該消防機關首長", "D": "中央主管機關得委託團體、機關（構）及學校，查核各級消防機關安全衛生管理系統之建置情形"}, "answer": "C", "explain": "依§25-4，定期統計評估建置成效及職業事故即時通報、作成調查紀錄，均應報中央主管機關備查；依§25-5第1項，中央主管機關或其委託之團體、機關（構）及學校得查核建置情形。同條第2項規定執行不力者僅「得令其改善及提出懲處建議」，並無逕予撤換首長之規定，故該敘述錯誤。", "ref": "消防法§25-5", "evidence": "績效良好者，中央主管機關得予獎勵及公開表揚；執行不力者，得令其改善及提出懲處建議", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-006", "subject": "刑事法", "topic": "消防法", "stem": "有關消防人員之健康檢查，依消防法規定，下列敘述何者錯誤？", "opts": {"A": "健康檢查應由中央衛生主管機關評鑑合格之地區醫院以上醫療機構為之", "B": "消防人員有接受消防機關所實施健康檢查之義務", "C": "實施臨時健康檢查時，消防機關應提供救災作業經歷資料予醫院", "D": "健康檢查紀錄由各級消防機關保存，並由其負擔健康檢查費用"}, "answer": "A", "explain": "§25-6第3項規定健康檢查應由中央衛生主管機關評鑑合格之「區域醫院或醫學中心」為之，地區醫院不在其列，故該敘述錯誤。同條第2項明定消防人員有接受健康檢查之義務；第3項並規定紀錄由各級消防機關保存、負擔費用，實施臨時健檢時應提供救災作業經歷資料予醫院，其餘敘述均正確。", "ref": "消防法§25-6", "evidence": "第一項健康檢查應由中央衛生主管機關評鑑合格之區域醫院或醫學中心為之", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-007", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，各級消防機關對於女性妊娠中或分娩後未滿多久之消防人員，除提供適當之環境與防護設備外，並應依醫師適性評估建議，採取勤務調整或必要之健康保護措施？", "opts": {"A": "二年", "B": "六個月", "C": "一年", "D": "三年"}, "answer": "A", "explain": "§25-8第2項規定，各級消防機關對於女性妊娠中或分娩後未滿二年之消防人員，除應提供適當之環境、安全衛生防護設備及措施外，並應依醫師適性評估建議，採取勤務調整或必要之健康保護措施。六個月、一年、三年均非條文所定期間。同條第1項另要求考量性別、年齡、身心障礙等特殊需要。", "ref": "消防法§25-8", "evidence": "對於女性妊娠中或分娩後未滿二年之消防人員", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-008", "subject": "刑事法", "topic": "消防法", "stem": "有關消防人員安全衛生防護之規定，依消防法，下列敘述何者正確？", "opts": {"A": "安全衛生教育及訓練為消防人員之權利，是否參加由其自行決定", "B": "安全衛生教育與訓練事項及訓練單位資格條件之規則，由直轄市、縣（市）政府定之", "C": "消防機關提供防護設備時應考量性別、年齡因素，但身心障礙因素不在考量範圍", "D": "各級政府辦理消防人員安全衛生防護設備、措施及健康檢查所需經費，應優先編列預算支應"}, "answer": "D", "explain": "§25-9明定相關經費應優先編列預算支應，故該敘述正確。依§25-7，消防人員對安全衛生教育及訓練「有接受之義務」，並非自由選擇；其規則由「中央主管機關」定之，非地方政府。§25-8第1項明定應考量性別、年齡、身心障礙等因素之特殊需要，身心障礙亦在考量之列。", "ref": "消防法§25-9", "evidence": "各級政府辦理消防人員之安全衛生防護設備、措施及健康檢查所需經費，應優先編列預算支應", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-009", "subject": "刑事法", "topic": "消防法", "stem": "某縣消防局未依規定建置消防人員安全衛生管理系統，經中央主管機關通知限期改善，屆期仍未改善，依消防法應處新臺幣多少罰鍰？", "opts": {"A": "2萬元以上10萬元以下", "B": "3萬元以上15萬元以下", "C": "6千元以上10萬元以下", "D": "3萬元以上30萬元以下"}, "answer": "D", "explain": "113年增訂之§43-2規定，各級消防機關未依§25-2設安全衛生專責單位或置專責人員，或未建置安全衛生管理系統、未提供必要防護設備或措施，經中央主管機關或上級機關通知限期改善，屆期未改善者，處3萬元以上30萬元以下罰鍰。本條係以行政機關為處罰對象，且以「先通知限期改善」為前提，其餘金額均非本條所定。", "ref": "消防法§43-2", "evidence": "經中央主管機關或上級機關通知限期改善，屆期未改善者，處新臺幣三萬元以上三十萬元以下罰鍰", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-010", "subject": "刑事法", "topic": "消防法", "stem": "某儲存化學品之倉庫管理權人，對於具有危害性之化學品，未於該場所明顯位置設置危害風險標示板，依消防法應處管理權人新臺幣多少罰鍰？", "opts": {"A": "2萬元以上150萬元以下", "B": "2萬元以上30萬元以下", "C": "5萬元以上300萬元以下", "D": "10萬元以上500萬元以下"}, "answer": "A", "explain": "113年增訂§21-2，工廠、儲存化學品之倉庫及儲存場所之管理權人應於明顯位置設置危害風險標示板，並於風險變動時即時更新。違反者依§43-1第4項，處管理權人2萬元以上150萬元以下罰鍰。5萬至300萬為火災時未提供平面配置圖，10萬至500萬為未提供化學品種類數量等資訊之罰鍰，易混淆。", "ref": "消防法§43-1", "evidence": "或設置標示板違反同條第二項公告有關等級、內容、顏色、大小或設置位置之規定者，處管理權人新臺幣二萬元以上一百五十萬元以下罰鍰", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-011", "subject": "刑事法", "topic": "消防法", "stem": "依消防法第21條之1規定，消防指揮人員搶救火災時，其管理權人負有提供搶救必要資訊義務之「一定規模以上之實驗室或倉庫」，由何者公告之？", "opts": {"A": "中央目的事業主管機關會同中央主管機關", "B": "直轄市、縣（市）主管機關", "C": "行政院", "D": "中央主管機關會商目的事業主管機關"}, "answer": "D", "explain": "現行§21-1第1項將適用場所及於「一定規模以上之實驗室或倉庫」，同條第2項規定其範圍由中央主管機關會商目的事業主管機關公告之。主辦者為中央主管機關（內政部），非由目的事業主管機關主辦，亦非地方主管機關或行政院。同條第1項第3款並要求必要資訊依規定更新上傳至指定之網路平臺。", "ref": "消防法§21-1", "evidence": "前項一定規模以上之實驗室或倉庫，由中央主管機關會商目的事業主管機關公告之", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-012", "subject": "刑事法", "topic": "消防法", "stem": "某化學工廠發生火災，管理權人向消防指揮人員提供之場所化學品種類、數量資訊內容虛偽不實，依消防法應處管理權人新臺幣多少罰鍰？", "opts": {"A": "5萬元以上300萬元以下", "B": "50萬元以上1,000萬元以下", "C": "10萬元以上500萬元以下", "D": "2萬元以上150萬元以下"}, "answer": "C", "explain": "§43-1第2項規定，違反§21-1第1項第2款，火災時未提供化學品之種類、數量、位置平面配置圖及搶救必要資訊，或提供資訊虛偽不實者，處10萬元以上500萬元以下罰鍰。5萬至300萬係未提供場所平面配置圖（第1項）；50萬至1,000萬係未立即指派專人到場協助救災（第3項）；2萬至150萬係危害風險標示板（第4項）。", "ref": "消防法§43-1", "evidence": "或提供資訊內容虛偽不實者，處管理權人新臺幣十萬元以上五百萬元以下罰鍰", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-013", "subject": "刑事法", "topic": "消防法", "stem": "某KTV（供營業使用場所）管理權人未依規定維護消防安全設備，於發生火災時致人於死，依消防法其刑責為何？", "opts": {"A": "處6月以上5年以下有期徒刑，得併科新臺幣50萬元以上250萬元以下罰金", "B": "處1年以上7年以下有期徒刑，得併科新臺幣50萬元以上250萬元以下罰金", "C": "處1年以上7年以下有期徒刑，得併科新臺幣100萬元以上500萬元以下罰金", "D": "處3年以上10年以下有期徒刑，得併科新臺幣100萬元以上500萬元以下罰金"}, "answer": "C", "explain": "§35規定場所管理權人有該條各款情形之一，於發生火災時致人於死者，處1年以上7年以下有期徒刑，得併科100萬元以上500萬元以下罰金；致重傷者，處6月以上5年以下有期徒刑，得併科50萬元以上250萬元以下罰金。其餘選項將致死與致重傷之刑度、罰金交錯組合或自創刑度，均屬錯誤。", "ref": "消防法§35", "evidence": "於發生火災時致人於死者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以上五百萬元以下罰金", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-014", "subject": "刑事法", "topic": "消防法", "stem": "依消防法第35條規定，場所之管理權人有下列何種情形，於發生火災時致人於死或重傷者，「不」在該條處罰範圍內？", "opts": {"A": "應設置住宅用火災警報器之旅館、老人福利機構場所，未設置或維護住宅用火災警報器", "B": "一定規模以上之建築物，未依消防防護計畫執行有關避難引導必要之業務", "C": "一定規模以上之場所未依第9條規定委託消防設備師（士）定期檢修消防安全設備", "D": "公共危險物品合計達管制量30倍以上場所，未訂定消防防災計畫"}, "answer": "C", "explain": "§35列舉五款：供營業使用場所未設置或維護消防安全設備、§6第4項場所未設置或維護住宅用火災警報器、一定規模以上建築物未訂消防防護計畫或未執行避難引導、達管制量場所位置構造設備不合規定、30倍以上場所未訂消防防災計畫或未執行避難引導。未依§9定期檢修申報不在列舉之中，屬§38第2項行政罰範圍。", "ref": "消防法§35", "evidence": "第六條第四項所定應設置住宅用火災警報器之場所，未依規定設置或維護住宅用火災警報器", "src": "new", "amend": "113-11-29 修正（114-06-01 施行）"}, {"id": "N-消防-015", "subject": "刑事法", "topic": "消防法", "stem": "有關 、時間等法規。違反者依§41處3千元以下罰鍰。3萬至15萬係違反§14-1以產生火焰方式進行表演之許可辦法者之罰鍰（§41-1），考生易混淆。", "ref": "消防法§41", "evidence": "禁止從事之區域、時間、方式或應遵行事項之規定者，處新臺幣三千元以下罰鍰", "src": "new"}, {"id": "N-消防-038", "subject": "刑事法", "topic": "消防法", "stem": "消防設備師為消防安全設備不實檢修報告，依消防法之處罰，下列何者正確？", "opts": {"A": "處新臺幣3萬元以上15萬元以下罰鍰，並得按次處罰；必要時並得廢止其證書", "B": "處新臺幣1萬元以上5萬元以下罰鍰，並通知限期改善；屆期未改善者得按次處罰", "C": "處新臺幣2萬元以上10萬元以下罰鍰；必要時並得予30日以下停止執行業務", "D": "處新臺幣2萬元以上10萬元以下罰鍰，並得按次處罰；必要時並得予1個月以上1年以下停止執行業務"}, "answer": "D", "explain": "§38第3項規定檢修專業機構、消防設備師或消防設備士未依規定檢修或為不實檢修報告者，處2萬元以上10萬元以下罰鍰並得按次處罰，必要時並得予1個月以上1年以下停止執行業務或停業。3萬至15萬為無資格從事設計檢修者（第1項）；1萬至5萬為管理權人未依§9檢修申報者（第2項）。", "ref": "消防法§38", "evidence": "或為消防安全設備不實檢修報告者，處新臺幣二萬元以上十萬元以下罰鍰，並得按次處罰；必要時，並得予以一個月以上一年以下停止執行業務或停業之處分", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-039", "subject": "刑事法", "topic": "消防法", "stem": "有關消防法災害搶救之規定，下列敘述何者正確？", "opts": {"A": "現場各級搶救人員衡酌搶救目的與救災風險後，如現場無人命危害之虞，得不執行危險性救災行動", "B": "救護車輛、裝備、人力配置標準及緊急救護辦法，由直轄市、縣（市）政府定之", "C": "消防栓之保養、維護，由直轄市、縣（市）政府負責", "D": "救災救護指揮中心僅於中央主管機關設置，統籌全國救災救護事宜"}, "answer": "A", "explain": "§20-1第1項規定現場各級搶救人員應於救災安全前提下衡酌搶救目的與風險，如無人命危害之虞得不執行危險性救災行動，該敘述正確。§24第2項救護車輛等配置標準及緊急救護辦法由中央主管機關會同中央目的事業主管機關定之；§17消防栓由自來水事業機構保養維護；§16規定各級消防機關均應設救災救護指揮中心。", "ref": "消防法§20-1", "evidence": "如現場無人命危害之虞，得不執行危險性救災行動", "src": "new"}, {"id": "N-消防-040", "subject": "刑事法", "topic": "消防法", "stem": "某夜店欲於店內以噴出火焰之方式進行表演，依消防法規定，下列敘述何者正確？", "opts": {"A": "由表演者自行向主管機關報備後即可為之", "B": "僅須事前通報轄區消防分隊，無須經許可", "C": "應由場所之管理權人申請主管機關許可後，始得為之", "D": "違反許可辦法所定安全防護措施者，處新臺幣3千元以下罰鍰"}, "answer": "C", "explain": "§14-1第1項規定供公眾使用建築物及中央主管機關公告之場所，非經場所之管理權人申請主管機關許可，不得使用產生火焰、火花或火星等方式進行表演性質活動；申請人為管理權人，且採許可制而非報備制。違反許可辦法之安全防護措施者，依§41-1處3萬元以上15萬元以下罰鍰，3千元以下係§41施放天燈等之罰鍰。", "ref": "消防法§14-1", "evidence": "非經場所之管理權人申請主管機關許可，不得使用以產生火焰、火花或火星等方式，進行表演性質之活動", "src": "new"}, {"id": "N-災防-001", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，震災（含土壤液化）之中央災害防救業務主管機關為下列何者？", "opts": {"A": "經濟部", "B": "內政部", "C": "農業部", "D": "國家科學及技術委員會"}, "answer": "B", "explain": "依第3條第1項第1款，風災、震災（含土壤液化）、火災、爆炸、火山災害之中央災害防救業務主管機關為內政部。A經濟部主管水災、旱災、礦災、工業管線等；C農業部主管寒害、土石流及大規模崩塌、森林火災、動植物疫災；D國家科學及技術委員會非本條所列之主管機關。", "ref": "災防法§3Ⅰ①", "evidence": "風災、震災（含土壤液化）、火災、爆炸、火山災害：內政部。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-002", "subject": "刑事法", "topic": "災害防救法", "stem": "某工業區發生事故，致懸浮微粒物質大量產生、空氣品質嚴重惡化。依災害防救法規定，此類災害之中央災害防救業務主管機關為何？", "opts": {"A": "衛生福利部", "B": "經濟部", "C": "內政部", "D": "環境部"}, "answer": "D", "explain": "依第3條第1項第5款，毒性及關注化學物質災害、懸浮微粒物質災害之中央災害防救業務主管機關為環境部。A衛生福利部主管生物病原災害；B經濟部主管工業管線、公用氣體與油料管線等災害；C內政部主管風災、震災、火災、爆炸、火山災害，均非懸浮微粒物質災害之主管機關。", "ref": "災防法§3Ⅰ⑤", "evidence": "毒性及關注化學物質災害、懸浮微粒物質災害：環境部。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-003", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，輻射災害之中央災害防救業務主管機關為下列何者？", "opts": {"A": "核能安全委員會", "B": "環境部", "C": "經濟部", "D": "國家科學及技術委員會"}, "answer": "A", "explain": "依第3條第1項第7款，輻射災害之中央災害防救業務主管機關為核能安全委員會。B環境部主管毒性及關注化學物質災害、懸浮微粒物質災害；C經濟部主管水災、旱災、礦災、輸電線路災害等；D國家科學及技術委員會並非本條列舉之中央災害防救業務主管機關。", "ref": "災防法§3Ⅰ⑦", "evidence": "七、輻射災害：核能安全委員會。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-004", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，下列災害與其中央災害防救業務主管機關之對應，何者錯誤？", "opts": {"A": "工業管線災害－經濟部", "B": "森林火災－農業部", "C": "火山災害－內政部", "D": "大規模崩塌災害－內政部"}, "answer": "D", "explain": "依第3條第1項第3款，寒害、土石流及大規模崩塌災害、森林火災、動植物疫災之主管機關為農業部，故D大規模崩塌災害對應內政部錯誤。A工業管線災害屬經濟部（第2款）；B森林火災屬農業部（第3款）；C火山災害屬內政部（第1款），均正確。", "ref": "災防法§3Ⅰ", "evidence": "寒害、土石流及大規模崩塌災害、森林火災、動植物疫災：農業部。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-005", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第3條第2項規定，中央災害防救業務主管機關就其主管災害防救業務之權責，下列何者錯誤？", "opts": {"A": "災害防救業務計畫訂定與修正之研擬及執行", "B": "非屬地方行政轄區之災害防救相關業務之執行、協調", "C": "核定全國緊急災害之應變措施", "D": "災害區域跨越二以上直轄市、縣（市）時之協調及處理"}, "answer": "C", "explain": "「核定全國緊急災害之應變措施」係第6條第4款所定行政院中央災害防救會報之任務，並非第3條第2項中央災害防救業務主管機關之權責，故C錯誤。A為第3條第2項第2款；B為第4款；D為第5款所定權責，均正確。", "ref": "災防法§3Ⅱ、§6", "evidence": "四、核定全國緊急災害之應變措施。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-006", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第3條第2項規定，中央災害防救業務主管機關執行災害資源統籌、資訊彙整與防救業務，並應協同下列何機關及相關機關執行全民防救災教育？", "opts": {"A": "內政部", "B": "文化部", "C": "教育部", "D": "國家發展委員會"}, "answer": "C", "explain": "依第3條第2項第6款，中央災害防救業務主管機關應執行災害資源統籌、資訊彙整與防救業務，並應協同教育部及相關機關執行全民防救災教育。A內政部本身即為部分災害之主管機關，非條文所定協同對象；B文化部、D國家發展委員會均非條文明定之協同機關。", "ref": "災防法§3Ⅱ⑥", "evidence": "執行災害資源統籌、資訊彙整與防救業務，並應協同教育部及相關機關執行全民防救災教育。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-007", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，本法第3條第1項未列舉之「其他災害」，其中央災害防救業務主管機關如何決定？", "opts": {"A": "由內政部公告指定之", "B": "依法律規定或由中央災害防救會報指定", "C": "由中央災害防救委員會決議指定", "D": "由行政院災害防救辦公室指定之"}, "answer": "B", "explain": "依第3條第1項第8款，其他災害依法律規定或由中央災害防救會報指定其中央災害防救業務主管機關；第6條第7款亦將此列為中央災害防救會報之任務。A內政部、C中央災害防救委員會、D行政院災害防救辦公室均無指定權限。", "ref": "災防法§3Ⅰ⑧、§6⑦", "evidence": "其他災害：依法律規定或由中央災害防救會報指定之中央災害防救業務主管機關。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-008", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第22條規定，下列何者屬於各級政府平時應依權責實施之「減災」事項？", "opts": {"A": "國際救災支援之配合", "B": "災害防救物資、器材之儲備及檢查", "C": "危險建築物之緊急評估", "D": "老舊建築物之檢查、補強及維護"}, "answer": "D", "explain": "依第22條第1項第5款，老舊建築物、重要公共建築物與災害防救設施、設備之檢查、補強、維護屬減災事項。A國際救災支援之配合、B物資器材之儲備及檢查，均屬第23條整備事項；C危險建築物之緊急評估屬第27條應變事項。", "ref": "災防法§22Ⅰ⑤", "evidence": "五、老舊建築物、重要公共建築物與災害防救設施、設備之檢查、補強、維護及都市災害防救機能之改善。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-009", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第22條規定，有關災害潛勢之公開資料種類、區域、作業程序及其他相關事項之辦法，由下列何者定之？", "opts": {"A": "各中央災害防救業務主管機關", "B": "內政部", "C": "行政院", "D": "直轄市、縣（市）政府"}, "answer": "A", "explain": "依第22條第4項，同條第1項第7款有關災害潛勢之公開資料種類、區域、作業程序等辦法，由各中央災害防救業務主管機關定之，因各類災害潛勢專業不同而分由各主管機關訂定。B內政部僅主管部分災害，C行政院、D直轄市、縣（市）政府均非授權訂定機關。", "ref": "災防法§22Ⅳ", "evidence": "有關災害潛勢之公開資料種類、區域、作業程序及其他相關事項之辦法，由各中央災害防救業務主管機關定之。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-010", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第22條有關減災之規定，下列敘述何者正確？", "opts": {"A": "公共事業應依地區災害防救計畫實施有關減災事項", "B": "減災事項，各級政府應列入各該災害防救計畫", "C": "災害防救志願組織之促進及輔導屬應變事項", "D": "企業持續營運能力之規劃及推動屬整備事項"}, "answer": "B", "explain": "依第22條第2項，減災事項各級政府應列入各該災害防救計畫，B正確。A錯，第3項規定公共事業應依「其災害防救業務計畫」實施減災事項；C錯，災害防救志願組織之促進、輔導屬第1項第9款減災事項；D錯，企業持續營運能力之規劃及推動屬第1項第16款減災事項。", "ref": "災防法§22Ⅱ", "evidence": "前項所定減災事項，各級政府應列入各該災害防救計畫。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-011", "subject": "刑事法", "topic": "災害防救法", "stem": "某天然氣事業經指定為公共事業，未依其災害防救業務計畫實施第22條第3項所定減災事項，致發生重大損害。依災害防救法規定，應處新臺幣多少罰鍰？", "opts": {"A": "3萬元以上15萬元以下", "B": "5萬元以上25萬元以下", "C": "6萬元以上30萬元以下", "D": "10萬元以上50萬元以下"}, "answer": "A", "explain": "依第56條第2款，公共事業違反第22條第3項等規定，未依其災害防救業務計畫實施減災、整備、應變或復原重建事項，致發生重大損害者，處3萬元以上15萬元以下罰鍰。B為第55條違反警戒區域等之額度；D為第54條規避徵用等之額度；C法無此額度。", "ref": "災防法§56②、§22Ⅲ", "evidence": "有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-012", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第48條規定，金融機構承受災區農業相關設施擔保品而由政府補助者，其承受補助之範圍、方式、程序等辦法，由下列何者定之？", "opts": {"A": "農業部會商金融監督管理委員會", "B": "金融監督管理委員會會商農業部", "C": "財政部會商農業部", "D": "內政部會商金融監督管理委員會"}, "answer": "A", "explain": "依第48條第2項後段，承受補助之範圍、方式、程序及其他相關事項之辦法，由農業部會商金融監督管理委員會定之。B主從顛倒；C財政部、D內政部均非本條授權之訂定機關。注意第43條借款展延之辦法才是由金融監督管理委員會會商相關機關定之，勿混淆。", "ref": "災防法§48Ⅱ", "evidence": "有關承受補助之範圍、方式、程序及其他相關事項之辦法，由農業部會商金融監督管理委員會定之。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-013", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第48條規定，有關災區農地、漁塭等農業相關設施貸款擔保品之承受，下列敘述何者正確？", "opts": {"A": "擔保品部分毀損者，金融機構即得予以承受", "B": "金融機構應依擔保品之市價予以承受", "C": "政府就承受金額最高八成之範圍內予以補助", "D": "適用範圍僅限於農地，不包括漁塭"}, "answer": "C", "explain": "依第48條第2項，金融機構承受者，由政府就其承受金額最高八成之範圍內予以補助，C正確。A錯，須擔保品「全部毀損或滅失」；B錯，係「依貸款餘額」予以承受，非依市價；D錯，第1項明定適用於農地、漁塭及其他農業相關設施。", "ref": "災防法§48Ⅰ、Ⅱ", "evidence": "金融機構依前項規定承受者，由政府就其承受金額最高八成之範圍內予以補助。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-014", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第2條之災害定義，下列何者屬於「天然災害」？", "opts": {"A": "森林火災", "B": "動植物疫災", "C": "大規模崩塌災害", "D": "懸浮微粒物質災害"}, "answer": "C", "explain": "依第2條第1款第1目，天然災害包括風災、水災、震災（含土壤液化）、旱災、寒害、土石流及大規模崩塌災害、火山災害，C正確。A森林火災、B動植物疫災、D懸浮微粒物質災害均列於同款 事法", "topic": "災害防救法", "stem": "依災害防救法有關災害防救計畫核定與備查之規定，下列何者正確？", "opts": {"A": "公共事業擬訂之災害防救業務計畫，送請中央災害防救會報核定", "B": "中央災害防救業務主管機關之業務計畫，報請行政院院會核定", "C": "直轄市、縣（市）地區災害防救計畫，報中央災害防救委員會備查", "D": "鄉（鎮、市）地區災害防救計畫經會報核定後，報所屬上級會報備查"}, "answer": "D", "explain": "依第20條第4項，鄉（鎮、市）、山地原住民區地區災害防救計畫經各該會報核定後實施，並報所屬上級災害防救會報備查，D正確。A錯，公共事業之業務計畫送請中央目的事業主管機關核定；B錯，應報請中央災害防救會報核定；C錯，直轄市、縣（市）地區計畫應報中央災害防救會報備查。", "ref": "災防法§19、§20", "evidence": "經各該災害防救會報核定後實施，並報所屬上級災害防救會報備查。", "src": "new"}, {"id": "N-災防-020", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，災區範圍公告前，遇有大量受災傷病患須收治之情形時，得由下列何機關劃定大量受災傷病患區域，使該區域受災民眾就醫準用受災就醫醫療費用之規定？", "opts": {"A": "行政院", "B": "內政部", "C": "衛生福利部", "D": "直轄市、縣（市）政府"}, "answer": "C", "explain": "依第45條第2項，災區範圍公告前，遇有大量受災傷病患須收治之情形時，衛生福利部得劃定大量受災傷病患區域，該區域受災民眾就醫準用第1項規定，C正確。A行政院係負責公告災區範圍（第51條）；B內政部、D直轄市、縣（市）政府均無本項劃定權限。", "ref": "災防法§45Ⅱ", "evidence": "災區範圍公告前，遇有大量受災傷病患須收治之情形時，衛生福利部得劃定大量受災傷病患區域", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-021", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，中央災害應變中心得視災情研判情況或聯繫需要，於地方災害應變中心或適當地點成立下列何者，以整合救災資源，協助地方政府執行救災事宜？", "opts": {"A": "前進指揮所", "B": "前進協調所", "C": "緊急應變小組", "D": "備援應變中心"}, "answer": "B", "explain": "依第13條第2項，中央災害應變中心得於地方災害應變中心或適當地點成立前進協調所，B正確。A前進指揮所係第12條由地方政府及公所視需要成立；C緊急應變小組係第14條由計畫指定之機關、單位或公共事業設置；D備援應變中心係第28條第3項為免中央災害應變中心無法運作而異地設置。", "ref": "災防法§13Ⅱ", "evidence": "於地方災害應變中心或適當地點成立前進協調所，整合救災資源，協助地方政府執行救災事宜。", "src": "new"}, {"id": "N-災防-022", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關地方災害應變中心之規定，下列敘述何者錯誤？", "opts": {"A": "直轄市、縣（市）政府首長應視災害規模成立並擔任指揮官", "B": "得視需要成立前進指揮所，就近處理救災及後勤支援", "C": "其成立時機、程序及編組，由內政部統一定之", "D": "鄉（鎮、市）公所首長亦應視災害規模成立災害應變中心"}, "answer": "C", "explain": "依第12條第2項，地方災害應變中心或前進指揮所之成立時機、程序及編組，由直轄市、縣（市）政府及鄉（鎮、市）、山地原住民區公所定之，非由內政部統一訂定，故C錯誤。A、D見第12條第1項首長應視災害規模成立並擔任指揮官；B同項後段得視需要成立前進指揮所。", "ref": "災防法§12", "evidence": "前項災害應變中心或前進指揮所成立時機、程序及編組，由直轄市、縣（市）政府及鄉（鎮、市）、山地原住民區公所定之。", "src": "new"}, {"id": "N-災防-023", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關各級災害應變中心運作之規定，下列敘述何者錯誤？", "opts": {"A": "參與編組機關首長應依規定親自或指派權責人員進駐", "B": "各級災害應變中心應有固定之運作處所並作定期演練", "C": "為免中央災害應變中心無法運作，應異地設置備援應變中心", "D": "中央災害應變中心指揮官由該業務主管機關首長當然擔任"}, "answer": "D", "explain": "依第13條第1項，中央災害防救業務主管機關首長決定中央災害應變中心開設時機及分級，成立後立即報告中央災害防救會報召集人，並由召集人指定指揮官，非由首長當然擔任，故D錯誤。A為第28條第1項；B為第28條第2項；C為第28條第3項，均正確。", "ref": "災防法§13Ⅰ、§28", "evidence": "應於成立後，立即報告中央災害防救會報召集人，並由召集人指定指揮官。", "src": "new"}, {"id": "N-災防-024", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法施行細則規定，各級政府應充實災害應變中心固定運作處所之資訊、通信等災害防救器材、設備，其功能測試及演練之最低頻率為何？", "opts": {"A": "每月測試一次；每半年演練一次", "B": "每週測試一次；每季演練一次", "C": "每月測試一次；每年演練一次", "D": "每季測試一次；每年演練一次"}, "answer": "A", "explain": "依施行細則第13條，各級政府應依本法第28條第2項，充實災害應變中心固定運作處所之資訊、通信等器材設備，隨時保持堪用狀態，並每月至少實施功能測試一次，每半年至少舉辦演練一次，並得隨時為之，A正確。B、C、D之頻率均與規定不符。", "ref": "災防法施行細則§13", "evidence": "每月至少實施功能測試一次，每半年至少舉辦演練一次", "src": "new"}, {"id": "N-災防-025", "subject": "刑事法", "topic": "災害防救法", "stem": "颱風即將登陸，某鎮公所研判轄內山區聚落有發生土石流之虞，擬依災害防救法第24條第1項處理居民撤離事宜。下列敘述何者正確？", "opts": {"A": "勸告或強制撤離之權限，專屬於中央災害應變中心指揮官", "B": "鎮公所於有發生災害之虞時，即應勸告或強制居民撤離並作適當安置", "C": "居民拒絕撤離者，得依第55條處新臺幣5萬元以上25萬元以下罰鍰", "D": "強制撤離須先報經中央災害防救會報核定後，始得為之"}, "answer": "B", "explain": "依第24條第1項，直轄市、縣（市）政府及鄉（鎮、市、區）公所於災害發生或有發生之虞時，應勸告或強制其撤離並作適當安置，B正確。A錯，鎮公所即有權限；C錯，第55條第1款僅處罰違反第24條第2項之強制措施或處置，未及於第1項撤離；D錯，法無須先經核定之規定。", "ref": "災防法§24Ⅰ", "evidence": "山地原住民區公所於災害發生或有發生之虞時，應勸告或強制其撤離，並作適當之安置。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-026", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第30條規定，各級政府成立災害應變中心後，指揮官於災害應變範圍內得實施之事項，下列何者錯誤？", "opts": {"A": "徵用、徵購民間搜救犬、救災機具等裝備", "B": "國外救災組織來臺協助救災之申請、接待及協調聯繫", "C": "災情之彙整、統計、陳報及評估", "D": "捐贈物資、款項之分配與管理及救助金之發放"}, "answer": "D", "explain": "「捐贈物資、款項之分配與管理及救助金之發放」係第37條第1項第4款災後復原重建事項，非第30條第1項指揮官於應變範圍內實施之事項，故D錯誤。A為第30條第1項第5款；B為第9款；C為第10款，均屬指揮官得實施之事項。", "ref": "災防法§30Ⅰ、§37Ⅰ④", "evidence": "四、捐贈物資、款項之分配與管理及救助金之發放。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-027", "subject": "刑事法", "topic": "災害防救法", "stem": "颱風期間，某登山客未取得臨時通行證，擅自進入應變中心指揮官依法劃定之警戒區域，受困後經災害應變中心搜救獲救。依災害防救法規定，下列敘述何者正確？", "opts": {"A": "各級政府得就搜救所生費用，以書面命獲救者繳納", "B": "搜救屬政府法定職責，所生費用一律不得向獲救者求償", "C": "搜救費用之計算、分擔等辦法，由交通部定之", "D": "須經法院判決確定後，始得命獲救者繳納搜救費用"}, "answer": "A", "explain": "依第30條第3項，違反第1項第2款、第3款規定致遭遇危難，經各級災害應變中心搜救獲救者，各級政府得就搜救所生費用，以書面命獲救者或可歸責之業者繳納，A正確。B錯，法有明文得命繳納；C錯，辦法由內政部定之；D錯，以書面命繳納即可，無須法院判決。", "ref": "災防法§30Ⅲ", "evidence": "各級政府得就搜救所生費用，以書面命獲救者或可歸責之業者繳納", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-028", "subject": "刑事法", "topic": "災害防救法", "stem": "颱風期間，某縣政府為實施災害應變措施，依災害防救法第31條第1項命轄內某倉儲業者保管救災所需之沙包及飲用水，該業者拒絕之。依法應處新臺幣多少罰鍰？", "opts": {"A": "3萬元以上15萬元以下", "B": "5萬元以上25萬元以下", "C": "10萬元以上50萬元以下", "D": "30萬元以上50萬元以下"}, "answer": "C", "explain": "依第54條第2款，違反第31條第3項規定，規避、妨礙或拒絕各級政府依同條第1項所為徵用、徵購或命其保管之處分者，處10萬元以上50萬元以下罰鍰，C正確。A為拒絕第31條第2項檢查之額度（第56條）；B為第55條之額度；D為第53條第2項明知不實而通報之罰金額度。", "ref": "災防法§54②", "evidence": "有下列情形之一者，處新臺幣十萬元以上五十萬元以下罰鍰：", "src": "new"}, {"id": "N-災防-029", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法罰則規定，下列違規行為與罰鍰額度之對應，何者正確？", "opts": {"A": "擅自使用緊急應變警報訊號：3萬元以上15萬元以下", "B": "規避指揮官所為之徵調處分：5萬元以上25萬元以下", "C": "拒絕政府派員進入業者處所檢查：3萬元以上15萬元以下", "D": "拒絕危險建築物之拆除處分：10萬元以上50萬元以下"}, "answer": "C", "explain": "依第56條第1款，規避、妨礙或拒絕各級政府依第31條第2項所為之檢查，處3萬元以上15萬元以下罰鍰，C正確。A錯，擅用警報訊號依第55條第5款處5萬元以上25萬元以下；B錯，規避徵調依第54條第1款處10萬元以上50萬元以下；D錯，拒絕拆除依第55條第4款處5萬元以上25萬元以下。", "ref": "災防法§54～§56", "evidence": "違反第三十一條第三項規定，規避、妨礙或拒絕各級政府依同條第二項規定所為之檢查。", "src": "new"}, {"id": "N-災防-030", "subject": "刑事法", "topic": "災害防救法", "stem": "重大震災後，某甲於社群媒體散播「水庫即將潰堤」之災害謠言，足生損害於公眾。依災害防救法規定，某甲之法定刑為何？", "opts": {"A": "1年以下有期徒刑、拘役或新臺幣30萬元以下罰金", "B": "2年以下有期徒刑、拘役或新臺幣50萬元以下罰金", "C": "3年以下有期徒刑、拘役或新臺幣100萬元以下罰金", "D": "5年以下有期徒刑、拘役或新臺幣300萬元以下罰金"}, "answer": "C", "explain": "依第53條第3項，散播有關災害之謠言或不實訊息，足生損害於公眾或他人者，處3年以下有期徒刑、拘役或新臺幣100萬元以下罰金，C正確。A、B、D刑度與罰金額度均與規定不符。另須區辨同條第2項明知不實而通報消防或警察單位者，係科30萬元以上50萬元以下罰金。", "ref": "災防法§53Ⅲ", "evidence": "散播有關災害之謠言或不實訊息，足生損害於公眾或他人者，處三年以下有期徒刑、拘役或新臺幣一百萬元以下罰金。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-031", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，散播有關災害之謠言或不實訊息足生損害於公眾或他人，因而致人於死或致重傷者，其法定刑分別為何？", "opts": {"A": "致死：無期徒刑或10年以上有期徒刑；致重傷：5年以上12年以下有期徒刑", "B": "致死：無期徒刑或7年以上有期徒刑；致重傷：3年以上10年以下有期徒刑", "C": "致死：死刑、無期徒刑或10年以上有期徒刑；致重傷：3年以上10年以下有期徒刑", "D": "致死：7年以上有期徒刑；致重傷：1年以上7年以下有期徒刑"}, "answer": "B", "explain": "依第53條第4項，犯同條第3項散播災害謠言或不實訊息之罪，因而致人於死者，處無期徒刑或7年以上有期徒刑；致重傷者，處3年以上10年以下有期徒刑，B正確。A、C、D之刑度均與規定不符，其中C之死刑並非本項法定刑。", "ref": "災防法§53Ⅳ", "evidence": "處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-032", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第53條第1項規定，乘災害之際而故犯下列何罪，不在「得依刑法之規定，加重其刑至二分之一」之列？", "opts": {"A": "竊盜罪", "B": "詐欺罪", "C": "恐嚇取財罪", "D": "侵占罪"}, "answer": "D", "explain": "依第53條第1項，乘災害之際而故犯竊盜、詐欺、恐嚇取財、搶奪、強盜之罪者，得依刑法之規定加重其刑至二分之一。侵占罪不在列舉範圍內，故D為正解。A竊盜、B詐欺、C恐嚇取財均為本項明定得加重之罪；加重上限為二分之一，亦為常考數字。", "ref": "災防法§53Ⅰ", "evidence": "乘災害之際而故犯竊盜、詐欺、恐嚇取財、搶奪、強盜之罪者，得依刑法之規定，加重其刑至二分之一。", "src": "new"}, {"id": "N-災防-033", "subject": "刑事法", "topic": "災害防救法", "stem": "人民因災害應變中心指揮官劃定警戒區域之處分，致其財產遭受損失而請求補償。依災害防救法規定，下列敘述何者正確？", "opts": {"A": "損失補償得以實物或勞務代替金錢為之", "B": "損失補償以補償實際所受之損失為限", "C": "損失可歸責於該人民者，仍得請求全額補償", "D": "應向中央災害防救會報請求損失補償"}, "answer": "B", "explain": "依第34條第2項，損失補償應以金錢為之，並以補償實際所受之損失為限，B正確。A錯，應以金錢為之；C錯，第1項但書規定因可歸責於該人民之事由者，不得請求；D錯，第3項規定應以書面敘明理由向「該執行機關」請求，非向中央災害防救會報。", "ref": "災防法§34", "evidence": "前項損失補償，應以金錢為之，並以補償實際所受之損失為限。", "src": "new"}, {"id": "N-災防-034", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關支援協助及國軍支援之規定，下列敘述何者正確？", "opts": {"A": "縣（市）政府無法因應災害時得申請國軍支援，但重大災害時國軍應主動協助", "B": "國防部依災害防救需要，不得運用應召之後備軍人支援災害防救", "C": "申請國軍支援或國軍主動協助救災之辦法，由內政部會同國防部定之", "D": "鄉（鎮、市）公所無法因應災害時，由中央主管機關主動派員協助"}, "answer": "A", "explain": "依第35條第4項，直轄市、縣（市）政府及中央災害防救業務主管機關無法因應時得申請國軍支援，但發生重大災害時國軍應主動協助，A正確。B錯，第5項國防部得運用應召之後備軍人；C錯，辦法由國防部會同內政部定之；D錯，第1項規定由直轄市、縣政府主動派員協助。", "ref": "災防法§35", "evidence": "無法因應災害處理時，得申請國軍支援。但發生重大災害時，國軍應主動協助災害防救。", "src": "new"}, {"id": "N-災防-035", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第43條規定，金融機構對災區受災居民於災害前已辦理之借款，其本金償還期限予以展延，致其放款期限超過多少年者，不受銀行法第38條規定之限制？", "opts": {"A": "三十年", "B": "二十年", "C": "二十五年", "D": "四十年"}, "answer": "A", "explain": "依第43條第2項，本金償還期限展延致其放款期限超過三十年者，不受銀行法第三十八條規定之限制，A正確。B、C、D年數均與規定不符。另同條第1項規定展延期間之利息應免予計收並由中央政府補貼，相關辦法由金融監督管理委員會會商相關機關定之。", "ref": "災防法§43Ⅱ", "evidence": "前項本金償還期限展延致其放款期限超過三十年者，不受銀行法第三十八條規定之限制。", "src": "new"}, {"id": "N-災防-036", "subject": "刑事法", "topic": "災害防救法", "stem": "災區受災企業於其復工營業計畫範圍內所需營業資金向金融機構貸款，必要時由相關信用保證基金提供信用保證。依災害防救法規定，其信用保證成數及保證手續費為何？", "opts": {"A": "八成；保證手續費減半計收", "B": "九成；保證手續費免向受災企業計收", "C": "七成；保證手續費由政府補貼半數", "D": "十成；保證手續費照常計收"}, "answer": "B", "explain": "依第49條第7項，前項貸款必要時由相關信用保證基金提供信用保證，信用保證成數為九成，送保期間保證手續費免向受災企業計收，B正確。A、C、D之成數及手續費處理方式均與規定不符。另須區辨第48條農業擔保品承受之政府補助上限為最高八成。", "ref": "災防法§49Ⅶ", "evidence": "信用保證成數為九成，送保期間保證手續費免向受災企業計收。", "src": "new"}, {"id": "N-災防-037", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關災區受災居民稅捐優惠及災區之規定，下列敘述何者錯誤？", "opts": {"A": "災區範圍由行政院公告並刊登政府公報", "B": "受災居民自政府或民間領取之救助金、慰問金免納所得稅", "C": "前述救助金不得作為扣押、抵銷或強制執行之標的", "D": "災區土地及建築物減免地價稅、房屋稅之條件，由財政部定之"}, "answer": "D", "explain": "依第44條第4項，災區土地及建築物減免地價稅及房屋稅之一定條件、減免期限及範圍，由災區之直轄市、縣（市）政府以自治條例定之，並報財政部備查，非由財政部訂定，故D錯誤。A見第51條；B見第44條第1項；C見第44條第5項，均正確。", "ref": "災防法§44Ⅳ", "evidence": "前項一定條件、減免期限及範圍，由災區之直轄市、縣（市）政府以自治條例定之，並報財政部備查。", "src": "new"}, {"id": "N-災防-038", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第61條規定，執行災害防救事項人員因執行職務死亡，或因傷病致重度身心障礙以上者，分別給與一次撫卹金或一次身心障礙給付多少基數？", "opts": {"A": "90個基數；36個基數", "B": "100個基數；40個基數", "C": "90個基數；30個基數", "D": "72個基數；36個基數"}, "answer": "A", "explain": "依第61條第1項第3款，死亡者給與一次撫卹金九十個基數；依第2款第1目，重度身心障礙以上者給與三十六個基數，A正確。中度為十八個基數、輕度為八個基數；基數以公務人員委任第五職等年功俸最高級月支俸額為準。B、C、D之基數均與規定不符。", "ref": "災防法§61Ⅰ②③", "evidence": "三、死亡者：給與一次撫卹金九十個基數。", "src": "new"}, {"id": "N-災防-039", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第62條規定，對因災害失蹤之人聲請法院確定其死亡及死亡時間，其聲請期限及法院公示催告之陳報期間，下列何者正確？", "opts": {"A": "災害發生後6個月內；2星期以上1個月以下", "B": "災害發生後1年內；3星期以上2個月以下", "C": "災害發生後1年內；1個月以上3個月以下", "D": "災害發生後2年內；3星期以上2個月以下"}, "answer": "B", "explain": "依第62條第2項，聲請應於災害發生後一年內為之；依第5項，法院准許聲請者應公示催告，其陳報期間應定為自揭示之日起三 <script>

try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
