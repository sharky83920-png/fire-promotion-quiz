, "D": "0.2 m"}, "answer": "B", "explain": "反光體 KS＝3 → S＝3/0.6＝5 m。13.3 m 誤用發光體 8，1.8 為 K×3，0.2 為 K/3。", "ref": "火災學筆記 題型15", "subject": "火災學", "src": "new"}, {"id": "F-N2-095", "topic": "煙與熱流", "stem": "厚度 4 m 之煙層測得僅 25% 之光穿過，則該煙層之減光係數 K 約為多少 m⁻¹？（log 2 ＝ 0.301）", "opts": {"A": "0.0654", "B": "1.385", "C": "0.346", "D": "0.151"}, "answer": "C", "explain": "D＝log(1/0.25)＝log4＝0.602；D_L＝0.602/4≒0.151 m⁻¹；K＝2.3×D_L≒0.346 m⁻¹。0.0654 誤除 2.3，1.385 漏除厚度，0.151 只算到 D_L。", "ref": "火災學筆記 題型15", "subject": "火災學", "src": "new"}, {"id": "F-N2-096", "topic": "煙與熱流", "stem": "室內發生大火（3 m × 3 m），在火場溫度 827℃、室溫 17℃、空氣密度 1.22 kg/m³ 條件下，煙層有效厚度為 2 m 時，煙生成率約為多少 kg/s？（M ＝ 0.188Py^(3/2)）", "opts": {"A": "4.79", "B": "9.02", "C": "4.51", "D": "6.38"}, "answer": "D", "explain": "P 為周界＝3×4＝12 m；M＝0.188×12×2^1.5≒6.38 kg/s。4.79 誤以面積 9 代 P，9.02 誤用 y²，4.51 漏掉 3/2 次方。", "ref": "火災學筆記 題型16", "subject": "火災學", "src": "new"}, {"id": "F-N2-097", "topic": "煙與熱流", "stem": "某室長 10 m、寬 6 m、天花板高 4 m，發生微火（1 m × 1 m），依 t ＝ 20A/(Pg^½) ×（1/√h － 1/√y），煙層底部下降至距地板 2 m 處約需多少秒？（g ＝ 9.8 m/s²）", "opts": {"A": "19.8 秒", "B": "79.4 秒", "C": "62.1 秒", "D": "24.0 秒"}, "answer": "A", "explain": "A＝60 m²、P＝4 m：t＝20×60÷(4×√9.8)×(1/√2－1/√4)≒19.8 秒。79.4 誤以火源面積 1 代 P，62.1 漏除 √g，24.0 未開根號。", "ref": "火災學筆記 題型16", "subject": "火災學", "src": "new"}, {"id": "F-N2-098", "topic": "煙與熱流", "stem": "厚度 2 m 之煙層測得僅 10% 之光穿過，則該煙層之消光係數約為多少 m⁻¹？", "opts": {"A": "0.50", "B": "1.15", "C": "0.217", "D": "2.30"}, "answer": "B", "explain": "D＝log(1/0.1)＝1；D_L＝1/2＝0.5 m⁻¹；K＝2.3×0.5＝1.15 m⁻¹。0.50 只算到 D_L，0.217 誤除 2.3，2.30 漏除厚度。", "ref": "火災學筆記 題型17", "subject": "火災學", "src": "new"}, {"id": "F-N2-099", "topic": "煙與熱流", "stem": "若某煙層之視覺密度（光學密度）為 2，則其遮光率為多少？", "opts": {"A": "98%", "B": "90%", "C": "99%", "D": "80%"}, "answer": "C", "explain": "D＝2－log(100－S) → log(100－S)＝0 → 100－S＝1 → S＝99%；90% 是 D＝1 的答案。", "ref": "火災學筆記 題型17", "subject": "火災學", "src": "new"}, {"id": "F-N2-100", "topic": "煙與熱流", "stem": "外界溫度 27℃、起火房間溫度 327℃，則在中性面以上 3 m 處，因浮力作用造成之室內外壓力差約為多少 Pa？（Ks ＝ 3460 Pa·K/m）", "opts": {"A": "352.7", "B": "51.9", "C": "5.77", "D": "17.3"}, "answer": "D", "explain": "T₀＝300 K、T₁＝600 K：ΔP＝3460×(1/300－1/600)×3≒17.3 Pa。352.7 為溫度未換 K，51.9 誤用相加，5.77 漏乘 h。", "ref": "火災學筆記 題型18", "subject": "火災學", "src": "new"}, {"id": "F-N2-101", "topic": "煙與熱流", "stem": "風速 10 m/s 吹向建築物迎風面，風壓係數 0.8，空氣密度 1.2 kg/m³，依 Pw ＝ CwρV²/2，迎風面所受風壓為多少 Pa？", "opts": {"A": "48", "B": "96", "C": "40000", "D": "4.8"}, "answer": "A", "explain": "Pw＝0.8×1.2×10²÷2＝48 Pa。96 漏除 2，40000 誤用水之密度 1000，4.8 風速未平方。", "ref": "火災學筆記 題型18", "subject": "火災學", "src": "new"}, {"id": "F-N2-102", "topic": "煙與熱流", "stem": "建築物內部溫度 27℃，起火房間溫度 627℃，流入起火房間之空氣體積流量為 2 m³/s，依熱膨脹效應，流出起火房間之煙霧體積流量約為多少 m³/s？", "opts": {"A": "46.4", "B": "6.0", "C": "0.67", "D": "3.0"}, "answer": "B", "explain": "Q₁＝Q₀×T₁/T₀＝2×900/300＝6 m³/s。46.4 為溫度未換 K，0.67 為溫度比倒置，3.0 漏乘 Q₀。", "ref": "火災學筆記 題型18", "subject": "火災學", "src": "new"}, {"id": "F-N2-103", "topic": "煙與熱流", "stem": "某門高 2.4 m，具有相同面積之門頂與門底開口，起火房間溫度 600 K，環境溫度 27℃，則中性面距門頂約多少公尺？", "opts": {"A": "0.8 m", "B": "1.2 m", "C": "1.6 m", "D": "2.0 m"}, "answer": "C", "explain": "A₁＝A₂ → h₁×300＝h₂×600 → h₁＝2h₂；h₁＋h₂＝2.4 → h₁＝1.6 m（距門頂）。0.8 m 為距門底，1.2 m 誤當中性面在中點。", "ref": "火災學筆記 題型19", "subject": "火災學", "src": "new"}, {"id": "F-N2-104", "topic": "煙與熱流", "stem": "避難通道加壓時，有面積 0.5 m² 與 1 m² 之兩開口呈串聯，則其等效流動面積約為多少 m²？", "opts": {"A": "1.50", "B": "0.33", "C": "0.75", "D": "0.45"}, "answer": "D", "explain": "串聯 1/Aₑ²＝1/0.5²＋1/1²＝5 → Aₑ≒0.45 m²（比任一開口小）。1.50 誤用並聯，0.33 誤用 1/Aₑ＝Σ1/A，0.75 取平均。", "ref": "火災學筆記 題型19", "subject": "火災學", "src": "new"}, {"id": "F-N2-105", "topic": "煙與熱流", "stem": "加壓避難通道之門縫流動面積為 0.05 m²，門兩側壓差為 25 Pa，依簡化式 Q ＝ 0.839AΔP^½，空氣供給量約為多少 m³/s？", "opts": {"A": "0.21", "B": "1.05", "C": "0.163", "D": "0.0084"}, "answer": "A", "explain": "Q＝0.839×0.05×√25≒0.21 m³/s。1.05 為壓差未開根號，0.163 只乘 C＝0.65 未乘 √(2/ρ)，0.0084 誤把 √ΔP 放分母。", "ref": "火災學筆記 題型19", "subject": "火災學", "src": "new"}, {"id": "F-N2-106", "topic": "煙與熱流", "stem": "某門高 2.0 m、寬 1.0 m，把手距靠近把手側門邊 0.1 m，門兩側壓差 50 Pa，克服自鎖力所需之力為 40 N，則開門所需力量約為多少 N？（K_d ＝ 1.0）", "opts": {"A": "55.6", "B": "95.6", "C": "90.0", "D": "151.1"}, "answer": "B", "explain": "F＝40＋1.0×2.0×50÷[2×(1.0－0.1)]＝40＋55.6≒95.6 N。55.6 漏加自鎖力，90.0 分母漏減 d，151.1 分母漏乘 2。", "ref": "火災學筆記 題型20", "subject": "火災學", "src": "new"}, {"id": "F-N2-107", "topic": "煙與熱流", "stem": "某避難門高 2.1 m、寬 0.9 m，把手距門邊 0.1 m，門兩側壓差 90 Pa，克服自鎖力需 45 N，則開門所需力量及是否符合 NFPA 規範，下列何者正確？", "opts": {"A": "約 96 N，未超過 133 N，符合規範", "B": "約 141 N，未超過 200 N，符合規範", "C": "約 141 N，超過 133 N，不符規範", "D": "約 130 N，未超過 133 N，符合規範"}, "answer": "C", "explain": "F＝45＋0.9×1.89×90÷(2×0.8)≒45＋95.7≒141 N＞133 N，不符（壓差 90 Pa 雖低於 100 Pa）。96 N 漏加自鎖力，130 N 分母漏減 d。", "ref": "火災學筆記 題型20", "subject": "火災學", "src": "new"}, {"id": "F-N2-108", "topic": "煙與熱流", "stem": "某油池火災之可燃物直徑為 2 m，燃燒釋熱率為 4000 kW，依 Heskestad 公式 L ＝ －1.02D ＋ 0.235Q^(2/5)，其火焰平均高度約為多少公尺？", "opts": {"A": "6.48 m", "B": "8.52 m", "C": "57.2 m", "D": "4.44 m"}, "answer": "D", "explain": "L＝－1.02×2＋0.235×4000^0.4≒－2.04＋6.48≒4.44 m。6.48 漏減 1.02D，8.52 符號用錯，57.2 誤用 2/3 次方。", "ref": "火災學筆記 題型21", "subject": "火災學", "src": "new"}, {"id": "F-N2-109", "topic": "煙與熱流", "stem": "某油池燃燒面直徑為 2 m，質量燃燒速度為 40 g/m²·s，燃燒熱為 44 MJ/kg，則其燃燒釋熱率約為多少 kW？", "opts": {"A": "5529 kW", "B": "22117 kW", "C": "1760 kW", "D": "5.53 kW"}, "answer": "A", "explain": "A＝π×1²≒3.14 m²；R＝40×3.14≒125.7 g/s；Q＝125.7×44 kJ/g≒5529 kW。22117 誤把直徑當半徑，1760 漏乘面積，5.53 單位多除 1000。", "ref": "火災學筆記 題型21", "subject": "火災學", "src": "new"}, {"id": "F-N2-110", "topic": "煙與熱流", "stem": "某居室天花板距火源 4 m，火源熱釋放率 1000 kW（位於室內中央），依 Alpert 公式，距火源正上方水平 2 m 處天花板噴射流之溫度上升量 ΔT 約為多少℃？", "opts": {"A": "167.7℃", "B": "84.7℃", "C": "104.7℃", "D": "213.5℃"}, "answer": "B", "explain": "R/H＝0.5＞0.18，用 ΔT＝5.38(Q/R)^(2/3)/H＝5.38×500^(2/3)÷4≒84.7℃。167.7 誤用近中心式，104.7 多加了環境溫度（題目問溫升），213.5 誤用角落 4 倍 Q。", "ref": "火災學筆記 題型21", "subject": "火災學", "src": "new"}, {"id": "F-N3-001", "topic": "爆炸", "stem": "下列何者最符合「爆炸」之定義？", "opts": {"A": "壓力急速產生並釋放至周圍壓力較低之環境，或因氣體急速膨脹擠壓周圍空氣而造成災害", "B": "可燃物與氧化劑緩慢氧化，持續放出光與熱而造成災害之現象", "C": "物質在無外部火源下因蓄熱升溫而自行起火之現象", "D": "高溫煙氣沿天花板水平流動並向開口部蔓延之現象"}, "answer": "A", "explain": "爆炸的核心是「壓力急速產生」或「氣體急速膨脹」；其餘選項分別是一般燃燒、自然發火與天花板噴射流。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-002", "topic": "爆炸", "stem": "關於物理爆炸之敘述，下列何者正確？", "opts": {"A": "必定伴隨物質之劇烈氧化反應", "B": "爆炸前後物質之化學成分均不改變", "C": "必定伴隨物質之分解放熱反應", "D": "爆炸後生成物之化學組成與原物質不同"}, "answer": "B", "explain": "物理爆炸是容器內液體或氣體體積迅速膨脹、壓力超過耐壓而爆炸，化學成分不變；伴隨氧化或分解反應者屬化學爆炸。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-003", "topic": "爆炸", "stem": "依生長過程之火焰傳播速度區分，燃燒放熱反應藉傳導、對流、輻射擴延至未反應物料，且速率低於音速者，稱為：", "opts": {"A": "爆轟（Detonation）", "B": "爆轟波", "C": "爆燃（Deflagration）", "D": "衝擊波"}, "answer": "C", "explain": "速率低於音速者為爆燃；產生震波且速率比音速更快者為爆轟。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-004", "topic": "爆炸", "stem": "爆轟發生時會產生強烈衝擊波，所謂「爆轟波」係指：", "opts": {"A": "火焰面落後於衝擊波而彼此分離者", "B": "傳播速率低於音速之燃燒波", "C": "爆炸後之反射波與膨脹波合一者", "D": "火焰面（燃燒波）與衝擊波合一者"}, "answer": "D", "explain": "火焰面與衝擊波合一稱為爆轟波，是爆炸中影響最大者，兼具衝擊壓力與機械破壞作用。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-005", "topic": "爆炸", "stem": "熱力學上處於何種狀態之物質，遇有輕微之擾亂作用即發生物理或化學變化，使周圍壓力激烈上升，而被稱為爆炸性物質？", "opts": {"A": "不安定平衡", "B": "穩定平衡", "C": "化學平衡", "D": "熱平衡"}, "answer": "A", "explain": "爆炸性物質定義的關鍵字是「不安定平衡」與「輕微擾亂」。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-006", "topic": "爆炸", "stem": "爆炸性物質之「敏感度」係指該物質之：", "opts": {"A": "最大爆炸壓力", "B": "最小起爆能", "C": "爆轟速度", "D": "爆炸總熱量"}, "answer": "B", "explain": "物質所需之最小起爆能即為其敏感度；最小起爆能愈小，敏感度愈高。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-007", "topic": "爆炸", "stem": "苦味酸（T.N.P）不可使用金屬容器盛裝，主要是基於爆炸性物質之何種特性？", "opts": {"A": "吸濕性強，受潮後會降低爆炸力", "B": "具有毒性，會腐蝕容器", "C": "與金屬反應，生成更易爆炸之物質", "D": "起爆溫度高，須以金屬散熱"}, "answer": "C", "explain": "苦味酸（2,4,6-三硝基苯酚）會與金屬反應生成更容易爆炸的物質，故不可用金屬容器；吸濕性降低爆炸力的例子是硝銨炸藥。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-008", "topic": "爆炸", "stem": "有關影響爆炸性物質敏感度之因素，下列敘述何者正確？", "opts": {"A": "起爆溫度愈高者，敏感度愈高", "B": "物質之密度愈大，敏感度愈大", "C": "T.N.T 中混入砂粒等固體雜質，敏感度降低", "D": "分子中硝基（－NO₂）愈多，敏感度愈高"}, "answer": "D", "explain": "硝基愈多敏感度愈高；起爆溫度愈低、敏感度愈高；密度愈大、敏感度愈小；固體雜質會提高敏感度。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-009", "topic": "爆炸", "stem": "下列有關爆炸性物質敏感度之敘述，何者錯誤？", "opts": {"A": "鬆軟或液態雜質會使炸藥之敏感度提高", "B": "硝化甘油凝固時，三斜晶系較斜方晶系敏感度高", "C": "物質之密度愈大，敏感度愈小", "D": "起爆溫度愈低者，敏感度愈高"}, "answer": "A", "explain": "固體雜質會提高敏感度，但鬆軟或液態雜質反而使敏感度降低，故該敘述錯誤。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-010", "topic": "爆炸", "stem": "有關 T.N.T 炸藥（三硝基甲苯）之性質，下列何者正確？", "opts": {"A": "爆速與爆力較其他硝基炸藥為高", "B": "為淡黃色柱狀結晶，照射日光則變為茶褐色", "C": "易溶於水且對撞擊甚為敏感", "D": "易與金屬作用，不可用金屬容器"}, "answer": "B", "explain": "T.N.T 爆速與爆力較其他硝基炸藥低、不溶於水、不敏感、與金屬不生作用；不可用金屬容器的是苦味酸。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-011", "topic": "爆炸", "stem": "硝化棉（Nitro Cellulose）之製造方式為：", "opts": {"A": "將甘油與硝酸反應，生成三硝酸甘油酯", "B": "將甲苯硝化，於苯環上導入三個硝基", "C": "將精製纖維浸於硫酸、硝酸與水之混酸中，使－OH 基酯化成－ONO₂", "D": "將苯酚硝化，生成 2,4,6-三硝基苯酚"}, "answer": "C", "explain": "硝化棉即纖維素硝酸酯，由纖維於混酸中酯化而得；其餘分別為硝化甘油、T.N.T、苦味酸之來源。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-012", "topic": "爆炸", "stem": "依含氮量（N%）區分硝化棉種類，「強棉藥」之含氮量為：", "opts": {"A": "9.15% 以上", "B": "9.15%～12.5%", "C": "9.15% 以下", "D": "12.5% 以上"}, "answer": "D", "explain": "強棉藥 N% 12.5 以上、弱棉藥 12.5～9.15、脆棉 9.15 以下。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-013", "topic": "爆炸", "stem": "某硝化棉經分析含氮量為 11.5%，依分類應屬於：", "opts": {"A": "弱棉藥", "B": "強棉藥", "C": "脆棉", "D": "依聚合度 n 而定，無法判斷"}, "answer": "A", "explain": "11.5% 介於 9.15% 與 12.5% 之間，屬弱棉藥；分類只看含氮量，與聚合度無關。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-014", "topic": "爆炸", "stem": "有關硝化棉之性質，下列敘述何者正確？", "opts": {"A": "對摩擦、撞擊極為敏感", "B": "在開放空間點燃時，只會燃燒而不會爆炸", "C": "不具吸濕性，受潮不影響性能", "D": "比重約 0.8，較水為輕"}, "answer": "B", "explain": "硝化棉亦稱無煙火藥，開放空間點燃只燃燒不爆炸，對摩擦撞擊不太敏感，具速燃性與吸濕性，比重 1.56～1.57。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-015", "topic": "爆炸", "stem": "所謂氧平衡（Oxygen Balance），係指化合物以多少量爆炸時，其氧之過剩或不足量以 g 表示之值？", "opts": {"A": "1 g", "B": "1 mol", "C": "100 g", "D": "1 kg"}, "answer": "C", "explain": "氧平衡以 100 g 化合物爆炸時的氧過剩或不足克數表示。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-016", "topic": "爆炸", "stem": "依據 W.C. Lothrop 之實驗，有關氧平衡（O.B.）與爆炸威力之關係，下列何者正確？", "opts": {"A": "O.B. 正值愈大者，爆炸威力愈大", "B": "O.B. 負值愈大者，爆炸威力愈大", "C": "O.B. 與爆炸威力無關，僅與分子排列有關", "D": "O.B. 值近於零者，爆炸威力較大"}, "answer": "D", "explain": "O.B. 值愈接近零，威力愈大、危險性愈高；氧過剩或不足都會降低威力。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-017", "topic": "爆炸", "stem": "若某硝化纖維之化學式為 C₂₄H₃₃O₁₃(NO₃)₇，則其硝化度（含氮量）約為多少？（C＝12、H＝1、N＝14、O＝16）", "opts": {"A": "10.18%", "B": "11.33%", "C": "1.45%", "D": "20.35%"}, "answer": "A", "explain": "分子量＝12×24＋1×33＋16×13＋62×7＝963；硝化度＝14×7÷963×100≒10.18%。11.33% 是分子量漏算 NO₃ 中的 N；1.45% 只算 1 個 N；20.35% 誤以為每個 NO₃ 含 2 個 N。", "ref": "火災學筆記 題型22", "subject": "火災學", "src": "new"}, {"id": "F-N3-018", "topic": "爆炸", "stem": "若某硝化纖維之化學式為 C₂₄H₃₀O₁₀(NO₃)₁₀，其硝化度及種類為何？（C＝12、H＝1、N＝14、O＝16）", "opts": {"A": "約 12.8%，屬弱棉藥", "B": "約 12.8%，屬強棉藥", "C": "約 14.6%，屬強棉藥", "D": "約 9.2%，屬脆棉"}, "answer": "B", "explain": "分子量＝288＋30＋160＋620＝1098；硝化度＝140÷1098×100≒12.75%，大於 12.5% 屬強棉藥。14.6% 為分子量漏算 N 之錯誤。", "ref": "火災學筆記 題型22", "subject": "火災學", "src": "new"}, {"id": "F-N3-019", "topic": "爆炸", "stem": "纖維素完全酯化時（酯化度 a＝3），其重複單元為 C₆H₇O₂(ONO₂)₃，則其硝化度約為多少？（C＝12、H＝1、N＝14、O＝16）", "opts": {"A": "16.47%", "B": "4.71%", "C": "14.14%", "D": "28.28%"}, "answer": "C", "explain": "C₆H₇N₃O₁₁ 分子量＝72＋7＋42＋176＝297；硝化度＝42÷297×100≒14.14%。16.47% 為分子量漏算 N；4.71% 只算 1 個 N。", "ref": "火災學筆記 題型22", "subject": "火災學", "src": "new"}, {"id": "F-N3-020", "topic": "爆炸", "stem": "以氧平衡法計算 T.N.T（C₇H₅N₃O₆）之 O.B. 值約為多少 g/100 g？（C＝12、H＝1、N＝14、O＝16；C→CO₂、H→H₂O、N→N₂）", "opts": {"A": "＋74.0", "B": "－37.0", "C": "－56.4", "D": "－74.0"}, "answer": "D", "explain": "分子量 227；完全分解需 O 原子 7×2＋5÷2＝16.5 個，分子內僅 6 個，不足 10.5 個 O；O.B.＝－10.5×16×100÷227≒－74.0。＋74.0 為正負號錯誤；－37.0 把 O₂ 莫耳數乘 16；－56.4 為忘了 H 也需要氧。", "ref": "火災學筆記 題型23", "subject": "火災學", "src": "new"}, {"id": "F-N3-021", "topic": "爆炸", "stem": "以氧平衡法計算硝化甘油（C₃H₅N₃O₉）之 O.B. 值約為多少 g/100 g？（C＝12、H＝1、N＝14、O＝16；C→CO₂、H→H₂O、N→N₂）", "opts": {"A": "＋3.5", "B": "－3.5", "C": "＋7.0", "D": "0"}, "answer": "A", "explain": "分子量 227；需 O 原子 3×2＋5÷2＝8.5 個，分子內有 9 個，過剩 0.5 個 O；O.B.＝＋0.5×16×100÷227≒＋3.5。氧過剩為正，－3.5 為正負號錯誤；＋7.0 把 O 原子當 O₂ 乘 32。", "ref": "火災學筆記 題型23", "subject": "火災學", "src": "new"}, {"id": "F-N3-022", "topic": "爆炸", "stem": "以氧平衡法比較下列四種爆炸性物質，何者爆炸威力最大？（硝化甘油 C₃H₅N₃O₉、T.N.T C₇H₅N₃O₆、苦味酸 C₆H₃N₃O₇、硝酸銨 NH₄NO₃）", "opts": {"A": "T.N.T", "B": "硝化甘油", "C": "苦味酸", "D": "硝酸銨"}, "answer": "B", "explain": "O.B. 分別約為：硝化甘油＋3.5、T.N.T －74.0、苦味酸 －45.4、硝酸銨＋20；硝化甘油最接近零，威力最大。", "ref": "火災學筆記 題型23", "subject": "火災學", "src": "new"}, {"id": "F-N3-023", "topic": "爆炸", "stem": "以氧平衡法計算苦味酸（C₆H₂(NO₂)₃(OH)，即 C₆H₃N₃O₇）之 O.B. 值約為多少 g/100 g？（C＝12、H＝1、N＝14、O＝16）", "opts": {"A": "＋45.4", "B": "－22.7", "C": "－45.4", "D": "－34.9"}, "answer": "C", "explain": "分子量 229；需 O 原子 6×2＋3÷2＝13.5 個，分子內 7 個，不足 6.5 個；O.B.＝－6.5×16×100÷229≒－45.4。－22.7 為 O₂ 莫耳數乘 16；－34.9 為忘了 H 需氧。", "ref": "火災學筆記 題型23", "subject": "火災學", "src": "new"}, {"id": "F-N3-024", "topic": "爆炸", "stem": "依高壓氣體勞工安全規則，在常用溫度下，表壓力達每平方公分多少公斤以上之壓縮氣體（不含壓縮乙炔氣）即屬高壓氣體？", "opts": {"A": "2 公斤", "B": "5 公斤", "C": "15 公斤", "D": "10 公斤"}, "answer": "D", "explain": "壓縮氣體（不含乙炔）為 10 kg/cm² 以上；壓縮乙炔氣與液化氣體則為 2 kg/cm² 以上。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-025", "topic": "爆炸", "stem": "依高壓氣體勞工安全規則對高壓氣體之定義，下列敘述何者正確？", "opts": {"A": "常用溫度下壓力達每平方公分 2 公斤以上之液化氣體", "B": "常用溫度下壓力達每平方公分 10 公斤以上之壓縮乙炔氣", "C": "常用溫度下壓力達每平方公分 2 公斤以上之壓縮氣體（乙炔除外）", "D": "常用溫度下壓力達每平方公分 10 公斤以上之液化氣體"}, "answer": "A", "explain": "壓縮氣體 10 kg/cm²；壓縮乙炔氣與液化氣體皆為 2 kg/cm²，選項將數字對調即為誤答。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-026", "topic": "爆炸", "stem": "依高壓氣體勞工安全規則第四條，「可燃性氣體」除列舉者外，係指下列何種氣體？", "opts": {"A": "爆炸下限在 20% 以下，或爆炸上限與下限之差在 10% 以上", "B": "爆炸下限在 10% 以下，或爆炸上限與下限之差在 20% 以上", "C": "爆炸下限在 10% 以下，且爆炸上限與下限之差在 20% 以上", "D": "爆炸上限在 10% 以上，或爆炸上限與下限之差在 20% 以下"}, "answer": "B", "explain": "兩條件為「或」：下限 ≦10% 或上下限差 ≧20% 即屬可燃性氣體。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-027", "topic": "爆炸", "stem": "某氣體在空氣中之爆炸界限為 12%～35%，依高壓氣體勞工安全規則，其是否屬於可燃性氣體？", "opts": {"A": "是，因爆炸下限在 10% 以下", "B": "否，因爆炸下限超過 10%", "C": "是，因爆炸上限與下限之差在 20% 以上", "D": "否，因爆炸上限未達 50%"}, "answer": "C", "explain": "下限 12% 雖超過 10%，但上下限差＝35－12＝23%，已達 20% 以上，符合其一即屬可燃性氣體。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-028", "topic": "爆炸", "stem": "內政部於 103 年 10 月 22 日依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，另行指定為可燃性高壓氣體者為：", "opts": {"A": "乙烯及乙烷", "B": "氫氣及甲烷", "C": "丙烷及丁烷", "D": "丙烯及丁二烯"}, "answer": "D", "explain": "氫氣、乙烯、甲烷、乙烷（壓縮氣體）與丙烷、丁烷、LPG（液化氣體）已明列於條文；103 年另行指定的是丙烯（C₃H₆）與丁二烯（C₄H₆）。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-029", "topic": "爆炸", "stem": "依 N.Anbratz 之研究，爆炸上限與壓力關係為 N＝A(P－B)^C。已知乙烷之 A＝52.5、B＝0.9、C＝0.045，則乙烷在 20 atm 時之爆炸上限約為多少？", "opts": {"A": "60.0%", "B": "47.4%", "C": "52.5%", "D": "198.0%"}, "answer": "A", "explain": "N＝52.5×(20－0.9)^0.045＝52.5×19.1^0.045≒60.0%。52.5% 為誤以為 N＝A；47.4% 為代入 P＝1 atm；198.0% 為 C 誤用 0.45。", "ref": "火災學筆記 題型24", "subject": "火災學", "src": "new"}, {"id": "F-N3-030", "topic": "爆炸", "stem": "依 N.Anbratz 公式 N＝A(P－B)^C，丙烯之 A＝43.5、B＝0.2、C＝0.095，則丙烯在 8 atm 時之爆炸上限約為多少？", "opts": {"A": "39.1%", "B": "52.9%", "C": "43.5%", "D": "76.0%"}, "answer": "B", "explain": "N＝43.5×(8－0.2)^0.095＝43.5×7.8^0.095≒52.9%。39.1% 為誤用丁烯常數；43.5% 為誤以為 N＝A；76.0% 為誤用乙烯常數。", "ref": "火災學筆記 題型24", "subject": "火災學", "src": "new"}, {"id": "F-N3-031", "topic": "爆炸", "stem": "依 N.Anbratz 公式 N＝A(P－B)^C，丁烷之 A＝41.5、B＝0.9、C＝0.045，則丁烷在 5 atm 時之爆炸上限約為多少？", "opts": {"A": "37.6%", "B": "41.5%", "C": "44.2%", "D": "55.9%"}, "answer": "C", "explain": "N＝41.5×(5－0.9)^0.045＝41.5×4.1^0.045≒44.2%。37.6% 為誤用丁烯常數；55.9% 為誤用乙烷常數；41.5% 為誤以為 N＝A。", "ref": "火災學筆記 題型24", "subject": "火災學", "src": "new"}, {"id": "F-N3-032", "topic": "爆炸", "stem": "有關天然氣（NG）之主要成分及其對空氣之比重，下列何者正確？", "opts": {"A": "主要成分為丙烷，比重約為空氣之 1.5 倍", "B": "主要成分為甲烷，比重約為空氣之 1.5 倍", "C": "主要成分為丙烷，比重約為空氣之 0.55 倍", "D": "主要成分為甲烷，比重約為空氣之 0.55 倍"}, "answer": "D", "explain": "NG 以甲烷為主，16÷28.84≒0.55，較空氣輕；LPG 以丙烷（70%）為主，約 1.5 倍，較空氣重。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-033", "topic": "爆炸", "stem": "液化石油氣（LPG）在空氣中之爆炸界限約為：", "opts": {"A": "1.8%～9.5%", "B": "5%～15%", "C": "5%～9.5%", "D": "1.8%～15%"}, "answer": "A", "explain": "LPG 為 1.8%～9.5%；NG 為 5%～15%。", "ref": "火災學筆記第17講", "subject": "火災學", "src": "new"}, {"id": "F-N3-034", "topic": "爆炸", "stem": "若空氣以 N₂ 79%、O₂ 21% 計算其平均分子量，則丁烷（C₄H₁₀）對空氣之比重約為多少？", "opts": {"A": "1.53", "B": "2.01", "C": "0.50", "D": "1.81"}, "answer": "B", "explain": "空氣平均分子量＝28×0.79＋32×0.21＝28.84；丁烷分子量 58，58÷28.84≒2.01。1.53 為丙烷之值；0.50 為分子分母顛倒；1.81 為誤以氧分子量 32 為基準。", "ref": "火災學筆記 題型24", "subject": "火災學", "src": "new"}, {"id": "F-N3-035", "topic": "爆炸", "stem": "以危險指數 D＝(UFL－LFL)／LFL 比較天然氣（5%～15%）與液化石油氣（1.8%～9.5%）之危險性，下列何者正確？", "opts": {"A": "NG 之危險指數為 2，較 LPG 危險", "B": "LPG 之危險指數約 0.19，較 NG 安全", "C": "LPG 之危險指數約 4.3，較 NG 危險", "D": "兩者危險指數相同，危險性相當"}, "answer": "C", "explain": "NG：(15－5)÷5＝2；LPG：(9.5－1.8)÷1.8≒4.28，LPG 危險指數較高，且比空氣重易積聚低處，較危險。", "ref": "火災學筆記第18講", "subject": "火災學", "src": "new"}, {"id": "F-N3-036", "topic": "爆炸", "stem": "天然氣或液化石油氣洩漏擴散至大氣中所產生之爆炸危險，其三階段依序為：", "opts": {"A": "洩漏區域內有著火源 → 與空氣混合達爆炸範圍 → 產生火焰或爆轟之傳播", "B": "產生火焰傳播 → 與空氣混合達爆炸範圍 → 洩漏區域內有著火源", "C": "與空氣混合達爆炸範圍 → 產生爆轟之傳播 → 洩漏區域內有著火源", "D": "與空氣混合達爆炸範圍 → 洩漏區域內有著火源 → 產生火焰或爆轟之傳播"}, "answer": "D", "explain": "先混合達燃燒（爆炸）範圍，再遇著火源，最後火焰或爆轟傳播、壓力上升向外造成破壞。", "ref": "火災學筆記第18講", "subject": "火災學", "src": "new"}, {"id": "F-N3-037", "topic": "爆炸", "stem": "瓦斯於戶外發生爆炸時，除第一時間之爆炸壓力及反射波外，通常還會出現何種現象，並以熱輻射危及人命與引起建築物火災？", "opts": {"A": "火球火災現象", "B": "粉塵二次爆炸", "C": "爆炸水現象", "D": "分解爆炸現象"}, "answer": "A", "explain": "瓦斯戶外爆炸常出現巨大火球昇空，熱輻射進一步造成傷亡及延燒。", "ref": "火災學筆記第18講", "subject": "火災學", "src": "new"}, {"id": "F-N3-038", "topic": "危險物品", "stem": "住宅內發現天然瓦斯洩漏時，下列處置何者錯誤？", "opts": {"A": "關閉瓦斯開關", "B": "立即開啟抽油煙機或電扇將瓦斯排出", "C": "熄滅附近火源", "D": "迅速打開門窗使空氣流通"}, "answer": "B", "explain": "瓦斯洩漏處置為關開關、熄火源、開門窗、勿動任何電氣開關；開啟抽油煙機、電扇屬操作電氣開關，可能產生火花引爆。", "ref": "火災學筆記第18講", "subject": "火災學", "src": "new"}, {"id": "F-N3-039", "topic": "危險物品", "stem": "天然氣管線洩漏起火而無法關閉其開關，且周圍可燃物可以搬離時，應採取之措施為：", "opts": {"A": "立即以滅火器將火焰撲滅，再尋找開關", "B": "立即撲滅火焰後，開啟電扇加速排氣", "C": "先將附近設備冷卻並移開可燃物，再行滅火", "D": "以大量水柱直接沖擊噴火口使火焰熄滅"}, "answer": "C", "explain": "若先滅火，繼續噴出的瓦斯與空氣混合後遇附近高溫固體會引發二次爆炸；故應先冷卻、移開可燃物再滅火。", "ref": "火災學筆記第18講", "subject": "火災學", "src": "new"}, {"id": "F-N3-040", "topic": "危險物品", "stem": "家用液化石油氣鋼瓶洩漏起火時，下列處置何者最適當？", "opts": {"A": "先將鋼瓶推倒使液體流出，以降低瓶內壓力", "B": "先以濕毛巾纏繞洩漏口，再以水冷卻周圍之可燃物", "C": "立即將鋼瓶搬入室內密閉空間以隔絕空氣", "D": "先對鋼瓶以水冷卻防止爆炸，滅火後以濕毛巾纏繞洩漏口並移至空曠處"}, "answer": "D", "explain": "鋼瓶起火應先以水冷卻鋼瓶以防爆炸，滅火後以濕毛巾纏繞洩漏口，並將鋼瓶移至空曠地區。", "ref": "火災學筆記第18講", "subject": "火災學", "src": "new"}, {"id": "F-N3-041", "topic": "爆炸", "stem": "下列何種氣體不屬於常見之易生分解爆炸氣體？", "opts": {"A": "甲烷（CH₄）", "B": "乙炔（C₂H₂）", "C": "環氧乙烷（C₂H₄O）", "D": "聯氨（N₂H₄）"}, "answer": "A", "explain": "常見易生分解爆炸氣體有乙炔、環氧乙烷、聯氨、乙烯及氧化氮；甲烷不在其列。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-042", "topic": "爆炸", "stem": "有關分解爆炸之發生條件，下列何者正確？", "opts": {"A": "分解反應必須為吸熱反應", "B": "系統初始壓力大於分解爆炸界限壓力", "C": "系統初始壓力小於分解爆炸界限壓力", "D": "系統中必須有氧氣存在"}, "answer": "B", "explain": "分解爆炸條件：分解反應為放熱反應、存在火源（熱源或加壓）、初始壓力大於分解爆炸界限壓力；分解爆炸不需氧。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-043", "topic": "爆炸", "stem": "工業用乙炔鋼瓶為避免乙炔產生分解爆炸，瓶內置入之物質為：", "opts": {"A": "活性碳多孔物質及水", "B": "矽酸鈣多孔物質及甲醇溶劑", "C": "以矽酸鈣為主之多孔性物質及丙酮溶劑", "D": "氮氣及二氧化碳混合氣體"}, "answer": "C", "explain": "鋼瓶內以矽酸鈣多孔性物質吸收丙酮，高壓下丙酮溶解乙炔，避免分解爆炸。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-044", "topic": "爆炸", "stem": "依職業安全衛生設施規則，使用溶解乙炔之氣體集合熔接裝置之配管及附屬器具，不得使用銅質及含銅百分之多少以上之銅合金製品？", "opts": {"A": "50%", "B": "60%", "C": "90%", "D": "70%"}, "answer": "D", "explain": "乙炔與銅長期接觸會生成紅色 Cu₂C₂ 爆炸性物質，故不得使用銅質及含銅 70% 以上之銅合金。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-045", "topic": "爆炸", "stem": "乙炔切割器切割完畢時，關閉之正確順序為：", "opts": {"A": "氧氣流量控制開關 → 乙炔氣延伸管開關 → 乙炔氣流量控制閥 → 氣瓶開關", "B": "氣瓶開關 → 乙炔氣流量控制閥 → 乙炔氣延伸管開關 → 氧氣流量控制開關", "C": "乙炔氣流量控制閥 → 氧氣流量控制開關 → 乙炔氣延伸管開關 → 氣瓶開關", "D": "乙炔氣延伸管開關 → 氣瓶開關 → 氧氣流量控制開關 → 乙炔氣流量控制閥"}, "answer": "A", "explain": "切割完畢須先關氧氣流量控制開關，最後才關氣瓶開關，順序不可錯，以防回火造成氣瓶爆炸。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-046", "topic": "爆炸", "stem": "乙炔容器火災搶救中，出現下列何種徵兆時應立即撤離現場？", "opts": {"A": "容器外表凝結水珠", "B": "安全閥發出之聲音提高或儲槽出現褪色現象", "C": "火焰顏色由黃轉青", "D": "安全閥聲音逐漸減弱"}, "answer": "B", "explain": "安全閥聲音提高或儲槽褪色，表示洩漏量大、容器溫度很高，即將爆炸，應立即撤離。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-047", "topic": "爆炸", "stem": "為抑制聯氨（N₂H₄）之分解爆炸而添加氣體，下列何者之效果較佳？", "opts": {"A": "氮氣優於芳香族碳化氫", "B": "兩者效果相同", "C": "芳香族碳化氫優於氮氣", "D": "兩者皆會促進分解爆炸"}, "answer": "C", "explain": "聯氨抑制分解爆炸可添加氮氣、芳香族碳化氫等，效果為芳香族碳化氫＞氮氣。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-048", "topic": "爆炸", "stem": "有關「熱穩定性（Heat Stability）」之敘述，下列何者正確？", "opts": {"A": "以耐熱試驗器測定，不生分解氧化之時間愈短，表示對熱愈穩定", "B": "以最小起爆能測定，數值愈小表示對熱愈穩定", "C": "主要用於測定粉塵之氧界限濃度", "D": "以耐熱試驗器加熱測定，不生分解氧化之時間愈長，表示對熱愈穩定"}, "answer": "D", "explain": "熱穩定性以耐熱試驗器測定硝化甘油、硝化纖維等硝酸酯類，在某溫度下加熱不致分解氧化的時間愈長，愈穩定。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-049", "topic": "爆炸", "stem": "浮游粉塵爆炸時，將堆積粉塵揚起而再次發生爆炸之現象，稱為：", "opts": {"A": "粉塵二次爆炸", "B": "分解爆炸", "C": "蒸氣爆炸", "D": "爆轟"}, "answer": "A", "explain": "浮游粉塵爆炸造成堆積粉塵揚起而再爆炸，稱為粉塵二次爆炸。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-050", "topic": "爆炸", "stem": "粉塵爆炸五要素中，除可燃性粉塵、氧化劑、點火源外，另外二項為：", "opts": {"A": "連鎖反應與侷限空間", "B": "粉塵懸浮擴散與侷限空間", "C": "粉塵懸浮擴散與連鎖反應", "D": "粉塵堆積與通風良好"}, "answer": "B", "explain": "粉塵爆炸在燃燒三要素之外，還需粉塵懸浮擴散（Dispersion）與侷限空間（Confinement）。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-051", "topic": "爆炸", "stem": "木炭、焦炭及部分金屬粉塵發生粉塵爆炸時，其機制為：", "opts": {"A": "受熱後揮發或分解出可燃氣體，再引燃發生有焰燃燒", "B": "粉塵受熱分解產生放熱，屬分解爆炸", "C": "受熱後不釋出可燃氣體，粒子直接與氧發生劇烈氧化放熱", "D": "粉塵內含液體過熱瞬間氣化，屬蒸氣爆炸"}, "answer": "C", "explain": "粉塵爆炸有兩種機制；木炭、焦炭與一些金屬屬第二類，不釋放可燃氣體，直接與氧劇烈氧化放熱。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-052", "topic": "爆炸", "stem": "粉塵中灰分含量達多少以上時，即不易發生粉塵爆炸？", "opts": {"A": "1%～5%", "B": "5%～10%", "C": "50%～60%", "D": "15%～30%"}, "answer": "D", "explain": "含水分或灰分者較不易爆炸，灰分含量達 15～30% 以上即不易爆炸。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-053", "topic": "爆炸", "stem": "有關影響粉塵爆炸之因素，下列敘述何者正確？", "opts": {"A": "粒徑愈小，愈易發生粉塵爆炸", "B": "發火溫度愈高，愈易發生粉塵爆炸", "C": "與可燃性氣體共存時，爆炸下限上升而不易爆炸", "D": "含水分愈多，愈易發生粉塵爆炸"}, "answer": "A", "explain": "粒徑愈小，最小點火能量與爆炸下限愈小，最大爆炸壓力與升壓速度愈大；其餘三者皆方向相反。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-054", "topic": "爆炸", "stem": "以不活潑性氣體添加法測定粉塵之氧界限濃度，下列何種粉塵最危險？", "opts": {"A": "煤塵（14.0%）", "B": "輕金屬粉塵（4.0～6.0%）", "C": "木粉（11.0%）", "D": "松香粉（10.0%）"}, "answer": "B", "explain": "氧界限濃度愈低者愈危險，代表氧要降得很低才燒不起來；輕金屬粉塵最低，最危險。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-055", "topic": "爆炸", "stem": "煤坑中撒佈岩粉以抑制煤塵爆炸，係應用何種方法之原理？其危險性判斷為何？", "opts": {"A": "不活潑性固體添加法；不活潑性粉塵添加率愈低者愈危險", "B": "不活潑性氣體添加法；氧界限濃度愈高者愈危險", "C": "不活潑性固體添加法；不活潑性粉塵添加率愈高者愈危險", "D": "不活潑性氣體添加法；氧界限濃度愈低者愈安全"}, "answer": "C", "explain": "撒岩粉屬不活潑性固體添加法，藉比熱吸熱冷卻及抑制浮游性；需添加愈多才不燃者愈危險。", "ref": "火災學筆記第19講", "subject": "火災學", "src": "new"}, {"id": "F-N3-056", "topic": "爆炸", "stem": "粉塵爆炸侷限措施中，預先於設備或建築物結構上建立一個或數個強度較弱之部分，使爆炸壓力由該處安全洩放者，稱為：", "opts": {"A": "耐爆設計", "B": "抑爆設計", "C": "爆炸阻隔設計", "D": "洩爆設計"}, "answer": "D", "explain": "洩爆設計利用強度較弱部分安全洩壓；耐爆設計是加強結構承受最大爆炸壓力。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-057", "topic": "爆炸", "stem": "利用壓力偵測器偵測爆炸初期之壓力，訊號傳至抑制器後迅速散佈抑制劑、破壞燃燒反應鏈者，屬於何種粉塵爆炸防護設計？", "opts": {"A": "抑爆設計", "B": "洩爆設計", "C": "耐爆設計", "D": "爆炸阻隔設計"}, "answer": "A", "explain": "抑爆系統以壓力偵測器配合抑制器散佈抑制劑，破壞化學反應鏈。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-058", "topic": "爆炸", "stem": "在一定距離以上之管線設置快速遮斷閥等爆炸隔離設備，以阻隔火焰擴大傳播，屬於何種設計？", "opts": {"A": "洩爆設計", "B": "爆炸阻隔設計", "C": "抑爆設計", "D": "耐爆設計"}, "answer": "B", "explain": "爆炸阻隔設計在早期消滅、阻隔火焰傳播，例如管線設置快速遮斷閥。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-059", "topic": "爆炸", "stem": "評估粉塵爆炸激烈性之爆炸強度指數 Kst，其計算式為：（(dP/dt)ₘₐₓ：最大升壓速度；V：試驗容器容積）", "opts": {"A": "Kst＝(dP/dt)ₘₐₓ ÷ V^(1/3)", "B": "Kst＝(dP/dt)ₘₐₓ × V²", "C": "Kst＝(dP/dt)ₘₐₓ × V^(1/3)", "D": "Kst＝(dP/dt)ₘₐₓ × V^(1/2)"}, "answer": "C", "explain": "Kst 為最大升壓速度乘以容器容積的立方根，Kst 愈大爆炸愈激烈。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-060", "topic": "爆炸", "stem": "某粉塵之爆炸強度指數 Kst 值為 250，依分級應屬於：", "opts": {"A": "St1，弱粉塵爆炸", "B": "St3，激烈粉塵爆炸", "C": "St0，不生粉塵爆炸", "D": "St2，一般性粉塵爆炸"}, "answer": "D", "explain": "St1＜200 弱、St2 200～300 一般性、St3＞300 激烈；250 屬 St2。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-061", "topic": "爆炸", "stem": "粉塵爆炸起爆所需之最小發火能量，約為瓦斯（氣體）爆炸之多少倍？", "opts": {"A": "10²～10³ 倍", "B": "10～50 倍", "C": "10⁴～10⁵ 倍", "D": "約 0.1 倍"}, "answer": "A", "explain": "粉塵爆炸所需最小發火能量約為瓦斯爆炸的 10²～10³ 倍。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-062", "topic": "爆炸", "stem": "有關粉塵爆炸與氣體（瓦斯）爆炸之比較，下列敘述何者錯誤？", "opts": {"A": "粉塵爆炸之燃燒時間較長，釋放能量較大", "B": "粉塵爆炸之燃燒速度與瞬間爆炸壓力均較氣體爆炸大", "C": "粉塵爆炸容易引起不完全燃燒而產生大量一氧化碳", "D": "粉塵爆炸所需最小發火能量較氣體爆炸大"}, "answer": "B", "explain": "粉塵爆炸燃燒速度與瞬間壓力較小，但燃燒時間長、能量（壓力×時間）大，破壞與燒毀程度較大。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-063", "topic": "爆炸", "stem": "水、有機液體或液化氣體呈過熱狀態而瞬間氣化，在極短時間內釋放大量能量所形成之爆炸，稱為：", "opts": {"A": "分解爆炸", "B": "粉塵爆炸", "C": "蒸氣爆炸", "D": "混合氣體爆炸"}, "answer": "C", "explain": "過熱液體瞬間氣化者為蒸氣爆炸，例如鍋爐破裂、熔融鐵落入水池。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-064", "topic": "爆炸", "stem": "火鍋店服務生於高溫容器中添加酒精膏時發生爆炸，此屬於何種爆炸？", "opts": {"A": "分解爆炸", "B": "混合氣體爆炸", "C": "粉塵爆炸", "D": "蒸氣爆炸"}, "answer": "D", "explain": "酒精膏加入高溫容器瞬間氣化膨脹而爆炸，並非先混合至燃燒範圍再點火，故屬蒸氣爆炸而非混合氣體爆炸。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-065", "topic": "爆炸", "stem": "一般鍋爐之運作壓力與內部水溫約為：", "opts": {"A": "2～15 kg/cm²，120～200℃", "B": "0.5～1 kg/cm²，80～100℃", "C": "20～50 kg/cm²，300～400℃", "D": "2～15 kg/cm²，300～400℃"}, "answer": "A", "explain": "一般鍋爐約以 2～15 kg/cm² 運作，水溫約 120～200℃，破裂時爐水激烈蒸發為約 1,700 倍之蒸氣。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-066", "topic": "爆炸", "stem": "所謂「爆炸水（Explosive Water）」係指：", "opts": {"A": "100℃ 以下、1 atm 以下之水", "B": "100℃ 以上、1 atm 以上之水", "C": "含溶解乙炔之水", "D": "含硝化物之廢水"}, "answer": "B", "explain": "爆炸水係指溫度 100℃ 以上、壓力 1 atm 以上之水。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-067", "topic": "爆炸", "stem": "鍋爐因水中含有二氧化碳、氧及鹽類，在高溫下產生腐蝕而導致破裂，此作用稱為：", "opts": {"A": "溝蝕（Grooving）", "B": "潛變（Creep）", "C": "點蝕（Pitting）", "D": "疲勞（Fatigue）"}, "answer": "C", "explain": "水中 CO₂、O₂、鹽類造成高溫腐蝕為點蝕；長期反覆加熱冷卻使材料應力受影響形成溝狀侵蝕為溝蝕。", "ref": "火災學筆記第20講", "subject": "火災學", "src": "new"}, {"id": "F-N3-068", "topic": "爆炸", "stem": "假設丁烷液體比重為 0.6、沸點為 0℃，氣體常數 R＝0.082 atm·L/(mol·K)，則 1 atm 下丁烷（C₄H₁₀）由液體變為沸點下氣體之理論膨脹比約為多少倍？", "opts": {"A": "386 倍", "B": "643 倍", "C": "0.23 倍", "D": "232 倍"}, "answer": "D", "explain": "1 g 液體體積＝1÷0.6≒1.67 mL；氣體 V＝(1/58)×0.082×273≒0.386 L＝386 mL；膨脹比＝386÷1.67≒232。386 為忘了除液體體積；643 為誤把 386 除以 0.6；0.23 為公升未換 mL。", "ref": "火災學筆記 題型25", "subject": "火災學", "src": "new"}, {"id": "F-N3-069", "topic": "爆炸", "stem": "某液化氣體分子量 30、液體比重 0.5、沸點 －88℃，R＝0.082 atm·L/(mol·K)，則 1 atm 下其由液體變為沸點下氣體之理論膨脹比約為多少倍？", "opts": {"A": "253 倍", "B": "120 倍", "C": "0.25 倍", "D": "1011 倍"}, "answer": "A", "explain": "1 g 液體＝1÷0.5＝2 mL；氣體 V＝(1/30)×0.082×(273－88)≒0.506 L＝506 mL；膨脹比≒253。120 為溫度未換成 K（以 88 代入）；0.25 為公升未換 mL；1011 為誤以液體體積 0.5 mL 計算。", "ref": "火災學筆記 題型25", "subject": "火災學", "src": "new"}, {"id": "F-N3-070", "topic": "爆炸", "stem": "36 g 之水在 1 atm、100℃ 下完全汽化，其水蒸氣體積約為多少公升？（R＝0.082 atm·L/(mol·K)）", "opts": {"A": "16.4 L", "B": "61.2 L", "C": "30.6 L", "D": "44.8 L"}, "answer": "B", "explain": "n＝36÷18＝2 mol；V＝2×0.082×373≒61.2 L。16.4 L 為溫度未換 K；30.6 L 為只算 1 mol；44.8 L 為誤用標準狀態 22.4 L/mol。", "ref": "火災學筆記 題型25", "subject": "火災學", "src": "new"}, {"id": "F-N4-001", "topic": "火災", "stem": "火災中「開口部仍有火焰噴出但顏色已淡，煙亦極為薄，室溫仍然極高」，屬於何時期之特徵？", "opts": {"A": "衰退期", "B": "成長期", "C": "初期", "D": "最盛期"}, "answer": "A", "explain": "衰退期可燃物燃燒殆盡、火勢轉弱，火焰顏色淡、煙薄，不久溫度急速下降形成餘燼。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-002", "topic": "火災", "stem": "下列何者屬於木材低溫著火之「物理」原因？", "opts": {"A": "老舊木材因腐朽菌作用溶解植物纖維素，僅留易熱分解之木質素", "B": "植物纖維素比木質素更容易產生熱分解", "C": "木材香油中所含松脂受熱即發熱", "D": "木材含水量增加使導熱性提高而蓄熱"}, "answer": "A", "explain": "物理原因：乾燥成多孔斷熱蓄熱、腐朽菌留下木質素；松脂發熱屬化學原因；木質素比纖維素易熱分解。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-003", "topic": "火災", "stem": "等溫線 h＝pd² 中，普通木造建築物之「曲線 3 級」其 p 值為何？", "opts": {"A": "0.82", "B": "∞", "C": "0.04", "D": "0.15"}, "answer": "D", "explain": "普通木造：1 級 ∞、2 級 0.82、3 級 0.15、4 級 0.04。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-004", "topic": "火災", "stem": "依影響木材碳化速率之「木材種類」因素，下列碳化速率大小排序何者正確？", "opts": {"A": "檜木＞松木＞杉木", "B": "松木＞杉木＞檜木", "C": "杉木＞檜木＞松木", "D": "杉木＞松木＞檜木"}, "answer": "D", "explain": "濱田稔公式中 K 值杉木 1.0、松木 0.78、檜木 0.6，故碳化速率杉木＞松木＞檜木。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-005", "topic": "火災", "stem": "木造建築物燃燒時之「等溫線」，係以何處為標準測定鄰接建築物壁面溫度？", "opts": {"A": "兩棟建築物之中線", "B": "火源棟外壁下端", "C": "鄰接建築物外壁中央", "D": "火源棟屋頂最高點"}, "answer": "B", "explain": "以火源棟外壁下端為標準，將鄰接建築物壁面同一溫度各點連成曲線即為等溫線。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-006", "topic": "火災", "stem": "木材碳化過程中，約於 170～180℃ 時之主要變化為何？", "opts": {"A": "表面開始變黑，尚無可燃氣體產生", "B": "水分蒸發完畢，木材完全乾燥", "C": "分解速度增加，產生 CO、CH₄、H₂ 等可燃性氣體", "D": "可燃氣體足以被明火點燃並維持穩定燃燒"}, "answer": "C", "explain": "170～180℃ 分解速度增加，生成 CO、CH₄、C₂H₂、H₂、有機酸等可燃氣體及 CO₂、H₂O；260℃ 明火雖可點燃但不能穩定燃燒。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-007", "topic": "火災", "stem": "木材在有點火源存在之情況下，通常約於多少溫度即可引火？", "opts": {"A": "350℃", "B": "260℃", "C": "490℃", "D": "150℃"}, "answer": "A", "explain": "有點火源時約 350℃ 可引火，溫度愈高引火所需時間愈短。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-008", "topic": "火災", "stem": "有關影響木材碳化速率因素之敘述，下列何者錯誤？", "opts": {"A": "比表面積越大之木材燃燒速度越快", "B": "密度較大之木材，因導熱性能較好，燃燒速度較快", "C": "含水量少者碳化速率較含水量多者快", "D": "垂直木紋方向碳化較順木紋方向為快"}, "answer": "B", "explain": "密度大的木材內部緊密、揮發成分較難析出，燃燒速度反而較慢；其餘三項均正確。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-009", "topic": "火災", "stem": "木材熱分解所生成之新多孔質碳素吸收空氣中之氧，表面產生氧化現象而呈炭火形態，此稱為何？", "opts": {"A": "無焰發火", "B": "引火", "C": "發火", "D": "閃燃"}, "answer": "A", "explain": "此為無焰發火；木材低溫加熱時最初先產生無焰發火，其熱使溫度劇升，終致發焰燃燒。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-010", "topic": "火災", "stem": "造成木造建築物延燒擴大之主要三種原因為何？", "opts": {"A": "飛火、爆燃、熱傳導", "B": "接焰、輻射熱、飛火", "C": "接焰、熱傳導、煙囪效應", "D": "輻射熱、熱對流、閃燃"}, "answer": "B", "explain": "木造建築物延燒擴大主要為接焰、輻射熱、飛火。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-011", "topic": "火災", "stem": "依日本學者濱田稔之研究，在固定加熱溫度下，木材碳化深度與加熱時間之關係為何？", "opts": {"A": "與加熱時間之平方根成正比", "B": "與加熱時間之平方成正比", "C": "與加熱時間成正比", "D": "與加熱時間成反比"}, "answer": "A", "explain": "X＝K(Q/100－2.5)√t，碳化深度 X 與 √t 成正比。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-012", "topic": "火災", "stem": "依火災溫度－時間曲線，火災之四個時期依序為何？", "opts": {"A": "初期→成長期→衰退期→最盛期", "B": "成長期→初期→最盛期→衰退期", "C": "初期→成長期→最盛期→衰退期", "D": "初期→最盛期→成長期→衰退期"}, "answer": "C", "explain": "四時期：初期（OA）、成長期（AB）、最盛期（BC）、衰退期（CD）。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-013", "topic": "火災", "stem": "有關木造建築物與耐火構造建築物火災溫度－時間曲線之比較，下列何者錯誤？", "opts": {"A": "木造建築物最盛期溫度變化較大", "B": "木造建築物之閃燃點（F.O.P）較高", "C": "木造建築物成長期溫度上升速率較快", "D": "木造建築物起火後到達閃燃之時間（F.O.T）較長"}, "answer": "D", "explain": "木造建築物 F.O.T 較短；其成長期升溫快、F.O.P 較高、最盛期因屋頂燒穿與牆壁倒塌而溫度變化大。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-014", "topic": "火災", "stem": "日本學者秋田一雄之研究指出，木材表面溫度約達多少時，即使無火源亦可滿足發火之條件？", "opts": {"A": "600℃", "B": "260℃", "C": "350℃", "D": "490℃"}, "answer": "D", "explain": "秋田一雄：表面溫度約 490℃ 即可發火，相當於自燃溫度。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-015", "topic": "火災", "stem": "木材受熱碳化過程中，約於何溫度時木材達到「完全乾燥」？", "opts": {"A": "100℃", "B": "200℃", "C": "170～180℃", "D": "150℃"}, "answer": "A", "explain": "木材碳化過程：100℃ 完全乾燥、150℃ 變黑、170～180℃ 分解加速、200℃ 更為焦黑。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-016", "topic": "火災", "stem": "木造建築物火災與耐火建築物火災之溫度型態，一般分別屬於何者？", "opts": {"A": "兩者皆為高溫短期型", "B": "木造為低溫長期型，耐火為高溫短期型", "C": "木造為低溫短期型，耐火為高溫長期型", "D": "木造為高溫短期型，耐火為低溫長期型"}, "answer": "D", "explain": "木造火災高溫短期；耐火建築物曲線較平緩、持續較久，屬低溫長期型。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-017", "topic": "火災", "stem": "木材類纖維質材料由外部加熱，因內部蓄熱使內部溫度高於外部，即使未達 260℃ 亦可發火，此現象稱為何？", "opts": {"A": "輻射能回饋效應", "B": "木材之危險溫度", "C": "木材長期低溫加熱之起火", "D": "木材之無焰發火"}, "answer": "C", "explain": "此即木材低溫著火（長期低溫加熱之起火）。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-018", "topic": "火災", "stem": "木材熱分解至何溫度時，可燃性氣體析出量迅速增加，明火可點燃但無法維持穩定燃燒，而被稱為木材之「危險溫度」？", "opts": {"A": "350℃", "B": "200℃", "C": "260℃", "D": "490℃"}, "answer": "C", "explain": "260℃ 相當於可燃性液體之引火點，稱木材之引火溫度或危險溫度；350℃ 為有火源引火、490℃ 為自行發火。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-019", "topic": "火災", "stem": "下列何處「較不屬於」易造成木材低溫起火之危險處所？", "opts": {"A": "煙囪等貫穿之屋頂", "B": "乾燥室內蒸氣管接觸之部分", "C": "室外通風良好處堆置之原木", "D": "三溫暖室暖爐等熱源之周圍"}, "answer": "C", "explain": "四個危險處所：煙囪貫穿之屋頂、爐灶接近之壁體與木台、乾燥室蒸氣管接觸部分、三溫暖暖爐周圍。", "ref": "火災學筆記第21講", "subject": "火災學", "src": "new"}, {"id": "F-N4-020", "topic": "火災", "stem": "依濱田稔之碳化深度公式，在加熱溫度固定下，若木材暴露於高溫之時間變為原來之 4 倍，其碳化深度變為原來之幾倍？", "opts": {"A": "1.41 倍", "B": "2.00 倍", "C": "4.00 倍", "D": "16.00 倍"}, "answer": "B", "explain": "X∝√t，時間 4 倍時碳化深度為 √4＝2 倍；誤把 X∝t 會得 4 倍。", "ref": "火災學筆記 題型26", "subject": "火災學", "src": "new"}, {"id": "F-N4-021", "topic": "火災", "stem": "依濱田稔之碳化深度公式，在加熱溫度固定下，若加熱時間變為原來之 3 倍，其碳化深度約變為原來之幾倍？", "opts": {"A": "1.50 倍", "B": "1.73 倍", "C": "3.00 倍", "D": "9.00 倍"}, "answer": "B", "explain": "X∝√t，√3≒1.73 倍；3 倍為把 X 當成與 t 成正比之錯誤。", "ref": "火災學筆記 題型26", "subject": "火災學", "src": "new"}, {"id": "F-N4-022", "topic": "火災", "stem": "依濱田稔之碳化深度公式，在加熱溫度固定下，欲使木材碳化深度變為原來之 3 倍，加熱時間須為原來之幾倍？", "opts": {"A": "1.73 倍", "B": "3.00 倍", "C": "6.00 倍", "D": "9.00 倍"}, "answer": "D", "explain": "X∝√t，X 變 3 倍則 √t 變 3 倍，t 須為 3²＝9 倍。", "ref": "火災學筆記 題型26", "subject": "火災學", "src": "new"}, {"id": "F-N4-023", "topic": "火災", "stem": "依濱田稔公式 X＝K(Q/100－2.5)√t，松木（K＝0.78）於 500℃ 固定加熱 16 分鐘，其碳化深度約為多少？", "opts": {"A": "6.0 mm", "B": "7.8 mm", "C": "10.0 mm", "D": "31.2 mm"}, "answer": "B", "explain": "X＝0.78×(500/100－2.5)×√16＝0.78×2.5×4＝7.8 mm；未開根號得 31.2 mm，K 誤用杉木 1.0 或檜木 0.6 則為 10.0、6.0 mm。", "ref": "火災學筆記 題型26", "subject": "火災學", "src": "new"}, {"id": "F-N4-024", "topic": "火災", "stem": "依濱田稔公式 X＝K(Q/100－2.5)√t，杉木於 700℃ 固定加熱 25 分鐘，其碳化深度約為多少？", "opts": {"A": "13.5 mm", "B": "17.6 mm", "C": "22.5 mm", "D": "112.5 mm"}, "answer": "C", "explain": "杉木 K＝1.0：X＝1.0×(7－2.5)×√25＝4.5×5＝22.5 mm；112.5 為未開根號，17.6、13.5 為 K 誤用松木、檜木。", "ref": "火災學筆記 題型26", "subject": "火災學", "src": "new"}, {"id": "F-N4-025", "topic": "火災", "stem": "在相同加熱溫度與加熱時間下，依濱田稔公式，杉木之碳化深度約為檜木之幾倍？", "opts": {"A": "0.60 倍", "B": "1.28 倍", "C": "1.30 倍", "D": "1.67 倍"}, "answer": "D", "explain": "X∝K，杉木 1.0、檜木 0.6，比值 1.0/0.6≒1.67 倍；1.28 為杉木對松木，1.30 為松木對檜木。", "ref": "火災學筆記 題型26", "subject": "火災學", "src": "new"}, {"id": "F-N4-026", "topic": "火災", "stem": "欲於木造建築物旁興建一棟 8 m 高之木造倉庫，其建材可抗拒二級加熱曲線（p＝0.82），依等溫線 h＝pd²，兩者安全距離至少約為多少？", "opts": {"A": "3.12 m", "B": "7.30 m", "C": "9.76 m", "D": "14.14 m"}, "answer": "A", "explain": "d＝√(h/p)＝√(8/0.82)≒3.12 m；9.76 為未開根號，7.30、14.14 為 p 誤用三級 0.15、四級 0.04。", "ref": "火災學筆記 題型26", "subject": "火災學", "src": "new"}, {"id": "F-N4-027", "topic": "火災", "stem": "鄰接建築物高度 6 m，若其建材可抗拒普通木造火源之三級加熱曲線（p＝0.15），依 h＝pd²，安全距離約為多少？", "opts": {"A": "2.71 m", "B": "6.32 m", "C": "12.25 m", "D": "40.00 m"}, "answer": "B", "explain": "d＝√(6/0.15)＝√40≒6.32 m；40 為未開根號，2.70 為誤用二級 0.82，12.25 為誤用四級 0.04。", "ref": "火災學筆記 題型26", "subject": "火災學", "src": "new"}, {"id": "F-N4-028", "topic": "火災", "stem": "鄰接建築物高度 4 m，若其建材可抗拒普通木造火源之四級加熱曲線（p＝0.04），依 h＝pd²，安全距離約為多少？", "opts": {"A": "2.21 m", "B": "5.16 m", "C": "10.00 m", "D": "100.00 m"}, "answer": "C", "explain": "d＝√(4/0.04)＝√100＝10 m；100 為未開根號，5.16、2.21 為 p 誤用 0.15、0.82。", "ref": "火災學筆記 題型26", "subject": "火災學", "src": "new"}, {"id": "F-N4-029", "topic": "火災", "stem": "依等溫線 h＝pd²，若與普通木造火源棟距離 3 m，且建材可抗拒二級加熱曲線（p＝0.82），則該處可允許之鄰接建築物高度約為多少？", "opts": {"A": "1.35 m", "B": "2.46 m", "C": "2.72 m", "D": "7.38 m"}, "answer": "D", "explain": "h＝0.82×3²＝7.38 m；2.46 為忘記平方，2.72 為 √p×d 之誤，1.35 為誤用三級 p＝0.15。", "ref": "火災學筆記 題型26", "subject": "火災學", "src": "new"}, {"id": "F-N4-030", "topic": "火災", "stem": "依 Thomas 及 Hedelden 之判斷方式，當可燃物燃燒速率 ṁ ＞ ṁ_air／r 時，屬於何種燃燒型式？", "opts": {"A": "通風控制燃燒", "B": "燃料控制燃燒", "C": "表面燃燒", "D": "擴散燃燒"}, "answer": "A", "explain": "ṁ＞ṁ_air/r 表示流入空氣不足以供應燃燒，屬通風控制；ṁ＜ṁ_air/r 為燃料控制。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-031", "topic": "火災", "stem": "1968 年美國學者 Waterman 提出閃燃時地面上所需之輻射熱通量，下列何者正確？", "opts": {"A": "0.02 MW/m²", "B": "2000 W/m²", "C": "2 MW/m²", "D": "200 W/m²"}, "answer": "A", "explain": "Waterman：20 kW/m²＝0.02 MW/m²＝20000 W/m²，須注意單位換算。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-032", "topic": "火災", "stem": "依 NFPA 265（2015），下列何者「不屬於」判定閃燃已發生之條件？", "opts": {"A": "火焰燒至門口外", "B": "地板之熱通量超過 20 kW/m²", "C": "熱釋放率超過 1 MW", "D": "室內氧氣濃度降至 1% 以下"}, "answer": "D", "explain": "NFPA 265 五條件：HRR＞1 MW、地板熱通量＞20 kW/m²、上層煙氣＞600℃、火焰燒至門口外、地板紙張自燃；O₂ 約 1% 是閃燃時的氣體濃度描述，不是判定條件。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-033", "topic": "火災", "stem": "依 Harmathy 之判斷方式，ρg^½A√H／A_F 之值小於多少時屬通風控制燃燒？", "opts": {"A": "0.235", "B": "0.36", "C": "0.06", "D": "0.29"}, "answer": "A", "explain": "Harmathy：＜0.235 通風控制、＞0.29 燃料控制；0.06 為標準溫度因子。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-034", "topic": "火災", "stem": "火勢由牆面上昇到達天花板時，火舌伸長並向下產生輻射，促進地面可燃物之燃燒速度，此現象稱為何？", "opts": {"A": "輻射能回饋效應", "B": "煙囪效應", "C": "滾流燃燒", "D": "無焰發火"}, "answer": "A", "explain": "此為密閉空間之輻射能回饋效果（Radiant Energy Feed Back）。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-035", "topic": "火災", "stem": "下列何者「不屬於」影響閃燃時間（F.O.T）之三大因素？", "opts": {"A": "火源之大小", "B": "內部裝潢之材料", "C": "建築物之樓層高度", "D": "開口率"}, "answer": "C", "explain": "影響 F.O.T 三大因素：內部裝潢材料、火源大小、開口率。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-036", "topic": "火災", "stem": "有關閃燃發生前之徵兆，下列敘述何者錯誤？", "opts": {"A": "每次火場在閃燃前必定可觀察到滾流燃燒", "B": "完全著裝之消防人員因熱累積而不得不蹲低", "C": "室內上部積滿濃煙，地面火舌已碰觸濃煙層", "D": "開口處煙之噴出可見喘息繼續之現象"}, "answer": "A", "explain": "滾流燃燒出現在閃燃前一或二分鐘，但並非每次火場都會看到。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-037", "topic": "火災", "stem": "火災在悶燒狀態時期因氧氣不足產生大量可燃性氣體，當開口破裂或被開啟使大量空氣湧入，可燃性氣體一舉燃燒並從窗口噴出火焰，此現象稱為何？", "opts": {"A": "閃燃（Flashover）", "B": "爆燃（Backdraft）", "C": "滾燃（Rollover）", "D": "輻射能回饋"}, "answer": "B", "explain": "悶燒缺氧後突然補入空氣而一舉燃燒，為爆燃（Backdraft，又稱複燃、回燃）。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-038", "topic": "火災", "stem": "依 NFPA 265（2015），下列五種情況須達到幾種，即應視為閃燃已發生？", "opts": {"A": "任一種", "B": "五種全部", "C": "任兩種", "D": "任三種"}, "answer": "C", "explain": "五條件中任兩種達到即視為閃燃發生。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-039", "topic": "火災", "stem": "耐火建築物最盛期燃燒速度 R＝K×A√H，其中通風控制燃燒之燃燒係數 K 約為多少？", "opts": {"A": "0.235～0.29", "B": "7.8～8.0", "C": "5.5～6.0", "D": "0.36～0.40"}, "answer": "C", "explain": "K：通風控制 5.5～6.0、燃料控制 0.36～0.40。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-040", "topic": "火災", "stem": "一般標準溫度曲線，其溫度因子之值為多少？", "opts": {"A": "0.06", "B": "0.235", "C": "0.6", "D": "0.29"}, "answer": "A", "explain": "標準溫度曲線之溫度因子為 0.06。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-041", "topic": "火災", "stem": "Thomas 閃燃公式 Q＝378A√H＋7.8Aₜ 中，「7.8Aₜ」項代表之意義為何？", "opts": {"A": "地板所接受之輻射熱通量", "B": "可燃物表面之熱釋放率", "C": "室內總表面積所引致之熱損失", "D": "開口部所流出之熱值"}, "answer": "C", "explain": "378A√H 為開口部流出熱值；7.8Aₜ 為室內總表面積（扣除開口）引致之熱損失。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-042", "topic": "火災", "stem": "開口率小到多少以下時，則不易出現閃燃？", "opts": {"A": "1/16", "B": "1/8", "C": "1/32", "D": "1/4"}, "answer": "A", "explain": "開口率小到 1/16 以下時空氣供給不足，不易有 F.O 出現。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-043", "topic": "火災", "stem": "裝潢材料使用之位置對閃燃時間（F.O.T）之影響，以何處最大？", "opts": {"A": "門窗框", "B": "天花板", "C": "地板", "D": "牆壁下部"}, "answer": "B", "explain": "使用位置影響：天花板＞牆壁＞地板，天花板影響最大。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-044", "topic": "火災", "stem": "火災之「持續時間因子」可以下列何式表示？（A：開口面積；H：開口高度；A_F：地板面積；Aₜ：室內全表面積）", "opts": {"A": "Aₜ／(A√H)", "B": "A_F／(A√H)", "C": "A√H／A_F", "D": "A√H／Aₜ"}, "answer": "B", "explain": "持續時間因子＝A_F/(A√H)，愈大火災持續愈久；A√H/Aₜ 為溫度因子。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-045", "topic": "火災", "stem": "耐火建築物火災最盛期，燃燒速度受流入之空氣量所決定，而與可燃物之表面積無關，此稱為何種燃燒型式？", "opts": {"A": "通風控制燃燒", "B": "表面燃燒", "C": "擴散控制燃燒", "D": "燃料控制燃燒"}, "answer": "A", "explain": "通風控制燃燒由流入空氣量決定、與表面積無關；燃料控制燃燒由可燃物表面積控制。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-046", "topic": "火災", "stem": "滾流燃燒（Rollover）一般出現在閃燃發生前多久？", "opts": {"A": "數秒至數十秒", "B": "閃燃發生後一或二分鐘", "C": "一或二分鐘", "D": "十至二十分鐘"}, "answer": "C", "explain": "滾流燃燒出現在閃燃前一或二分鐘；「數秒至數十秒後噴出火球」是爆燃的描述。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-047", "topic": "火災", "stem": "有關「火載量」與「火載量密度」之單位，下列何者正確？", "opts": {"A": "火載量 kg；火載量密度 MJ", "B": "火載量 MJ/m²；火載量密度 kg/m²", "C": "火載量 kg/m³；火載量密度 MJ/m³", "D": "火載量 kg/m²；火載量密度 MJ/m²"}, "answer": "D", "explain": "火載量為單位樓地板面積可燃物量（kg/m²）；火載量密度為單位樓地板面積所含燃燒熱（MJ/m²）。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-048", "topic": "火災", "stem": "滾燃（Rollover）又稱為下列何種現象？", "opts": {"A": "溢焰（Flameover）", "B": "複燃（Re-ignition）", "C": "回燃（Backdraft）", "D": "爆轟（Detonation）"}, "answer": "A", "explain": "滾燃又稱溢焰現象（Flameover）；回燃、複燃為爆燃（Backdraft）之別稱。", "ref": "火災學筆記第22講", "subject": "火災學", "src": "new"}, {"id": "F-N4-049", "topic": "火災", "stem": "某倉庫長 12 m、寬 10 m、高 3 m，內部儲存可燃物（木材）600 kg，其火載量為多少？", "opts": {"A": "0.20 kg/m²", "B": "1.67 kg/m²", "C": "5.00 kg/m²", "D": "80.00 kg/m²"}, "answer": "C", "explain": "火載量＝W′/樓地板面積＝600÷(12×10)＝5 kg/m²；除以體積得 1.67，乘燃燒熱 16 MJ/kg 得 80（為火載量密度 MJ/m² 之數值）。", "ref": "火災學筆記 題型27", "subject": "火災學", "src": "new"}, {"id": "F-N4-050", "topic": "火災", "stem": "某耐火建築物火災處於通風控制燃燒，開口寬 2 m、高 1.44 m，燃燒係數 K 取 5.5，依 R＝K×A√H，其燃燒速率約為多少？", "opts": {"A": "1.38 kg/min", "B": "13.20 kg/min", "C": "19.01 kg/min", "D": "22.81 kg/min"}, "answer": "C", "explain": "A＝2×1.44＝2.88 m²，R＝5.5×2.88×√1.44＝5.5×2.88×1.2≒19.01 kg/min；22.81 為 √H 當 H，1.38 為 K 誤用 0.4，13.20 為 A 誤用開口寬度。", "ref": "火災學筆記 題型27", "subject": "火災學", "src": "new"}, {"id": "F-N4-051", "topic": "火災", "stem": "某倉庫火災判定為燃料控制燃燒，開口寬 2 m、高 2.25 m，燃燒係數 K 取 0.4，依 R＝K×A√H，其燃燒速率約為多少？", "opts": {"A": "1.80 kg/min", "B": "2.70 kg/min", "C": "4.05 kg/min", "D": "37.12 kg/min"}, "answer": "B", "explain": "A＝4.5 m²，R＝0.4×4.5×√2.25＝0.4×4.5×1.5＝2.70 kg/min；37.13 為 K 誤用 5.5，4.05 為 √H 當 H，1.80 為漏乘 √H。", "ref": "火災學筆記 題型27", "subject": "火災學", "src": "new"}, {"id": "F-N4-052", "topic": "火災", "stem": "某倉庫樓地板面積 20 m × 10 m，火載量 30 kg/m²，開口寬 2 m、高 2 m，火災處於通風控制燃燒（K＝5.5），其火災持續時間約為多少？", "opts": {"A": "1.0 min", "B": "136.4 min", "C": "192.8 min", "D": "2651.7 min"}, "answer": "C", "explain": "W′＝30×200＝6000 kg；R＝5.5×4×√2≒31.11 kg/min；T＝6000÷31.11≒192.8 min。136.4 為 √H 當 H，2651.7 為 K 誤用 0.4，1.0 為漏乘樓地板面積。", "ref": "火災學筆記 題型27", "subject": "火災學", "src": "new"}, {"id": "F-N4-053", "topic": "火災", "stem": "某區劃可燃物總重 600 kg，開口寬 1 m、高 2.25 m，在通風控制燃燒（K＝5.5）下，其火災持續時間約為多少？", "opts": {"A": "0.54 min", "B": "21.55 min", "C": "32.32 min", "D": "444.44 min"}, "answer": "C", "explain": "R＝5.5×2.25×1.5≒18.56 kg/min，T＝600÷18.56≒32.32 min；21.55 為 √H 當 H，444.44 為 K 誤用 0.4，0.54 為誤將分鐘再除 60。
