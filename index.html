"id": "111-國文-05", "src": "old", "year": 111, "n": 5, "subject": "國文", "topic": "國文", "stem": "「人生中絕大多數場景不需要或無法運用統計和數據之類現代的理性工具，可是面對現實和日常生活的難題時大家可不傻，總是會想辦法找出路。當然，只停留在這個層次還不夠，既然有了更上一層樓的理性工具，好好理解並善加利用將能為個人及社會整體帶來更大福祉。」根據上文，下列選項何者正確？", "opts": {"A": "人生必須要積極運用統計和數據等現代的理性工具，才能尋找出路", "B": "人在現實和日常生活中，如遇到難題，利用理性工具就能達到目標", "C": "人面對難題時，除了本能，若善加利用理性工具，將帶來更大福祉", "D": "人必須不斷追求現代的理性工具，使自己能夠達到更高的生活層次"}, "answer": "C", "explain": "文中說人面對難題「總是會想辦法找出路」（本能），但「只停留在這個層次還不夠」，若理解並善用統計數據等理性工具，「將能為個人及社會整體帶來更大福祉」，選 C。A「必須」與文首「絕大多數場景不需要」矛盾；B「就能達到目標」過度推論；D「不斷追求」工具文中未提。", "ref": "文意判讀", "evidence": ""}, {"id": "111-國文-06", "src": "old", "year": 111, "n": 6, "subject": "國文", "topic": "國文", "stem": "「作品遭人毀罵，我們常能置之不理，說人家誤解了我們或根本不了解我們。作品有人讚美，我們無不欣然引為知音。但是讚美很可能跟毀罵一樣的盲目，而且往往對作家心理上的影響更壞。因為讚美是無形中的賄賂，沒有白受的道理。我們要保持這種不該受的讚美，要常博得這些人雖不中肯而頗中聽的讚美，便不知不覺中遷就迎合，逐漸損失了思想和創作的自主權。有自尊心的人應對不虞之譽跟求全之毀同樣的不屑理會——不過人的虛榮心總勝於他的驕傲。」下列選項，何者最符合上文的觀點？", "opts": {"A": "不虞之譽跟求全之毀，都難以讓人完全認同", "B": "大多數人對於別人的讚美，都缺乏抵抗能力", "C": "毀罵或讚譽同樣盲目，其危害實亦不相上下", "D": "被讚美的最大危險，是使人驕傲且無法自省"}, "answer": "B", "explain": "文末「人的虛榮心總勝於他的驕傲」，指人雖知應不屑理會不虞之譽，卻往往被讚美收買而遷就迎合，即多數人難以抵抗讚美，選 B。A 文中說有自尊者應同樣不理，非難以認同；C 文中明言讚美對作家影響「更壞」，非不相上下；D 危險在失去思想與創作自主權，而非驕傲。", "ref": "文意判讀", "evidence": ""}, {"id": "111-國文-07", "src": "old", "year": 111, "n": 7, "subject": "國文", "topic": "國文", "stem": "「我的俄語是鬱金香。平日球根深埋在土壤下，當俄裔朋友塔妮雅來臺灣旅行，捎我一塊玩，才會徐徐綻放。海、城市、七月、靜靜的、月亮，我的舌頭翻攪著繁複音節，吐出一尾尾小魚，在久別重逢的對話中扭動尾鰭，游回我們共同的少女時代。」根據上文，下列選項最適當的是：", "opts": {"A": "作者因迷戀鬱金香的美麗才學習俄語", "B": "作者和朋友只有在少女時代才說俄語", "C": "作者以小魚扭動形容俄語繁複的發音", "D": "作者很期待七月能去俄國與好友相聚"}, "answer": "C", "explain": "「我的舌頭翻攪著繁複音節，吐出一尾尾小魚，在……對話中扭動尾鰭」，以小魚扭動比喻說出俄語繁複音節的樣子，選 C。A 鬱金香是比喻俄語平日深埋、相聚才綻放，非學習原因；B 重逢時仍說俄語；D 「七月」只是作者說出的俄語單字，非計畫。", "ref": "文意判讀", "evidence": ""}, {"id": "111-國文-08", "src": "old", "year": 111, "n": 8, "subject": "國文", "topic": "國文", "stem": "「世人對某些戰爭慘況的知覺其實是建構出來的，而建構的工具主要是攝影機記錄的照片。它於黑暗中亮起，經由許多人分享，然後從眼前消失。與文字記錄相反——文章是以其思想、典故和辭藻的複雜性去吸引小眾或大眾——照片只有一種語言，而且是說給所有人聽。」根據上文，下列選項何者最符合旨意？", "opts": {"A": "對災難的描述與記錄，文章的表現比攝影機好", "B": "對災難的認知，照片常有特定選擇而加以建構", "C": "因為照片只是捕捉剎那的時刻，比較不夠客觀", "D": "文章的書寫比較複雜，因此，更容易打動人心"}, "answer": "B", "explain": "文中說世人對戰爭慘況的知覺「是建構出來的」，而建構工具主要是攝影照片，即照片經選擇而形塑人們對災難的認知，選 B。A、D 文中只說文字與照片吸引受眾方式不同，未比較優劣或感染力；C「不夠客觀」文中未論及。", "ref": "文意判讀", "evidence": ""}, {"id": "111-國文-09", "src": "old", "year": 111, "n": 9, "subject": "國文", "topic": "國文", "stem": "「我們穿過慾望街車，上了蒙馬特山丘，全巴黎市的最高點，往山下望，整座巴黎的市井端然於前，周遭是滿滿的遊客在山丘上拍紀念照或是在特托廣場一帶讓畫家們素描他們的臉。蒙馬特自 19 世紀就是藝術家嚮往的自由天堂，梵谷曾經一度在這裡賣畫飲酒酗咖啡，當時他的一幅畫僅夠他吃一頓白酒燒雞呀。我繞了一圈看著街上鬻畫為生的畫家，許多畫家來了又走了，臺灣畫家席德進就曾經在蒙馬特畫過街頭人像素描以維生，想必當年席德進是懷著極大的藝術夢想與熱情的。」文中所描述畫家追求夢想的熱情，與下列選項何者最為接近？", "opts": {"A": "君恩未報身何有，且寄扁舟夢想中", "B": "此情可待成追憶，只是當時已惘然", "C": "燈前一覺江南夢，惆悵起來山月斜", "D": "千磨萬擊還堅勁，任爾東西南北風"}, "answer": "D", "explain": "文中畫家如梵谷、席德進在蒙馬特賣畫維生，仍「懷著極大的藝術夢想與熱情」，是歷經困頓仍堅持理想。D「千磨萬擊還堅勁，任爾東西南北風」寫竹歷經磨難而堅定不移，最接近。A 寫報君恩未遂、寄情扁舟；B 寫追憶惘然；C 寫夢醒惆悵，皆非堅持追夢之熱情。", "ref": "D 出自鄭燮〈竹石〉；B 出自李商隱〈錦瑟〉", "evidence": ""}, {"id": "111-國文-10", "src": "old", "year": 111, "n": 10, "subject": "國文", "topic": "國文", "stem": "「每當景氣衰退，政府便會以擴大內需來提振經濟，當經濟連年低緩，也習慣地認為問題在投資低迷，至於失業升高，因應之道就是多辦職業訓練。長期以往，這些措施似乎成為解決經濟問題的必然政策。然而，經濟學家梭羅認為投資不是經濟成長的關鍵，真正的關鍵在於技術進步。民間投資對 GDP 的影響有兩個層面，其一是投資當期所進行的設備採購活動，其二是形成資本所帶來的生產活動。臺灣由於設備多自國外進口，第一層效果非常微小，至於第二層效果，從近年臺灣產業的起落證實，只有投資而沒有技術進步，成長是難以持久的。另一位經濟學家赫克曼更直指職業訓練的經濟效益近乎零。」下列選項，何者最合乎本文旨意？", "opts": {"A": "經濟成長的真正關鍵在於技術進步，許多慣性思維常常不是有效解決問題的方法", "B": "經濟學理論來自於觀察政府的施政，對政策的了解愈深入，愈能提出有效的模型", "C": "錯誤的政策比貪污更可怕，政府應該擴大內需投資，增加就業機會才能提振經濟", "D": "解決失業率過高的方法在於舉辦職業訓練班，培養勞工第二專長，提升就業能力"}, "answer": "A", "explain": "文中指出擴大內需、多辦職訓等「似乎成為解決經濟問題的必然政策」，但梭羅認為「真正的關鍵在於技術進步」，赫克曼更說職訓效益近乎零，旨在批評慣性政策，選 A。B 談理論來源，文中未提；C「擴大內需」正是被質疑的做法；D 與「職業訓練的經濟效益近乎零」相反。", "ref": "文意判讀", "evidence": ""}, {"id": "111-法學-01", "src": "old", "year": 111, "n": 1, "subject": "法學", "topic": "憲法", "stem": "關於秘密通訊自由，下列敘述何者錯誤？", "opts": {"A": "屬憲法所明文列舉保障之基本權利", "B": "於一定條件下，國家得以法律為合理必要之限制", "C": "通訊監察屬對秘密通訊自由之重大限制", "D": "主管機關應優先採行長期監聽手段，以充分掌握犯罪證據、預防犯罪"}, "answer": "D", "explain": "秘密通訊自由為憲法第12條明文列舉之基本權（A正確）；國家得依憲法第23條以法律為必要限制（B正確）。釋字第631號指出通訊監察係對秘密通訊自由之重大干預（C正確），故應嚴格遵守比例原則，採最小侵害手段，而非「優先採行長期監聽」，D錯誤，當選。", "ref": "憲法§12；釋字第631號", "evidence": ""}, {"id": "111-法學-02", "src": "old", "year": 111, "n": 2, "subject": "法學", "topic": "憲法", "stem": "依憲法增修條文之規定，下列何者於政治參與上無特別保障規定？", "opts": {"A": "澎湖地區人民", "B": "僑居國外國民", "C": "馬祖地區人民", "D": "蘭嶼地區人民"}, "answer": "D", "explain": "增修條文第10條第12項後段規定原住民族之保障「對於澎湖、金門及馬祖地區人民亦同」，第13項規定國家對僑居國外國民之政治參與應予保障，故A、B、C均有特別保障。蘭嶼地區人民並無地區性之特別保障規定（蘭嶼原住民族另依原住民族身分受保障），故選D。", "ref": "增修條文§10", "evidence": "對於澎湖、金門及馬祖地區人民亦同。"}, {"id": "111-法學-03", "src": "old", "year": 111, "n": 3, "subject": "法學", "topic": "憲法", "stem": "依據司法院大法官解釋意旨，下列何者應受到嚴格審查？", "opts": {"A": "菸品成分的強制標示", "B": "猥褻出版品的處罰", "C": "化妝品廣告的事前審查", "D": "菸品業者顯名贊助的禁止"}, "answer": "C", "explain": "釋字第744號認化妝品廣告之事前審查係對言論自由之重大干預，原則上應為違憲，須採嚴格審查，故選C。A菸品成分標示（釋字第577號）屬商業言論之強制揭露；B猥褻出版品處罰（釋字第617號）與D菸品業者顯名贊助禁止（釋字第794號）均採較寬鬆之審查，均經宣告合憲。", "ref": "釋字第744號", "evidence": ""}, {"id": "111-法學-04", "src": "old", "year": 111, "n": 4, "subject": "法學", "topic": "憲法", "stem": "國家法律如限制勞工組織工會，係干預下列何項基本權利？", "opts": {"A": "生存權", "B": "財產權", "C": "集會自由", "D": "結社自由"}, "answer": "D", "explain": "工會係勞工為特定目的組成之團體，組織工會屬憲法第14條結社自由之保障範圍，釋字第373號即以結社自由審查教育事業技工、工友不得組織工會之規定，故選D。集會自由保障的是暫時性聚集表達意見，生存權、財產權則與組織團體之自由無直接關係。", "ref": "憲法§14；釋字第373號", "evidence": ""}, {"id": "111-法學-05", "src": "old", "year": 111, "n": 5, "subject": "法學", "topic": "憲法", "stem": "監督寺廟條例第 8 條之規範對象，僅適用於佛、道等部分宗教，依司法院大法官之解釋意旨，系爭規定遭宣告違憲的主要理由是違反下列何種原則？", "opts": {"A": "政教分離原則", "B": "平等原則", "C": "比例原則", "D": "法律明確性原則"}, "answer": "B", "explain": "依釋字第573號，監督寺廟條例適用範圍僅及於佛、道等部分宗教，對其他宗教則無，形成對特定宗教之差別待遇，與國家對宗教應謹守中立及宗教平等之原則相悖，官方答案為B平等原則。同號解釋另認該條例第8條處分寺產須經主管機關許可之部分亦違反法律保留與比例原則，但題幹聚焦於「僅適用部分宗教」，故以平等原則為主。", "ref": "釋字第573號", "evidence": ""}, {"id": "111-法學-06", "src": "old", "year": 111, "n": 6, "subject": "法學", "topic": "憲法", "stem": "若選舉制度之設計，使某些地區之當選票數明顯低於其他地區，此種情況最容易違反下列何種選舉基本原則？", "opts": {"A": "普通原則", "B": "直接原則", "C": "平等原則", "D": "秘密原則"}, "answer": "C", "explain": "選舉平等原則要求「一人一票、票票等值」，若選區劃分使部分地區當選所需票數明顯低於其他地區，各票之影響力不等，最直接違反平等原則，選C。普通原則指凡達一定年齡之國民皆有選舉權；直接原則指選民直接選出代表；秘密原則指無記名投票，均與票值差距無關。", "ref": "憲法§129", "evidence": "以普通、平等、直接及無記名投票之方法行之"}, {"id": "111-法學-07", "src": "old", "year": 111, "n": 7, "subject": "法學", "topic": "憲法", "stem": "憲法及增修條文中關於「軍人」及「服兵役」之規定，下列敘述何者錯誤？", "opts": {"A": "服兵役為人民之義務", "B": "軍人亦屬監察院彈劾之對象", "C": "人民除現役軍人外，不受軍事審判", "D": "軍人應效忠領袖，愛護人民"}, "answer": "D", "explain": "憲法第138條規定全國陸海空軍應超出個人、地域及黨派關係以外，「效忠國家，愛護人民」，而非效忠領袖，D錯誤當選。A為憲法第20條；C為憲法第9條；B依釋字第262號，監察院對軍人亦得提出彈劾案，軍人屬公務員範圍。", "ref": "憲法§138", "evidence": "全國陸海空軍，須超出個人、地域及黨派關係以外，效忠國家，愛護人民。"}, {"id": "111-法學-08", "src": "old", "year": 111, "n": 8, "subject": "法學", "topic": "憲法", "stem": "未成年人甲之父親為中華民國國民，母親為外國人，因疫情而不被許可入境，致甲與母親相隔兩地，甲之下列何者權利最不可能受到上述隔絕措施之侵害？", "opts": {"A": "人格發展自由", "B": "人身自由", "C": "平等權", "D": "家庭團聚權"}, "answer": "B", "explain": "母親因防疫措施不得入境，使未成年子女與母親分隔兩地，涉及家庭團聚權、人格發展自由，並可能因國籍而生差別待遇（平等權）。人身自由則指身體不受非法逮捕、拘禁等限制，甲本身並未被拘束身體，故最不可能受侵害者為B。", "ref": "憲法§8、§22", "evidence": ""}, {"id": "111-法學-09", "src": "old", "year": 111, "n": 9, "subject": "法學", "topic": "憲法", "stem": "道路交通管理處罰條例規定：汽車駕駛人拒絕酒測者，吊銷其駕照、禁其三年內考領駕照，並吊銷所持各級車類駕照。甲持有職業大貨車駕照，因休息時駕駛重型機車外出拒絕酒測被吊銷各級駕照，而無法繼續工作。依據大法官解釋之意旨，下列關於前述規定之合憲性，何者最為正確？", "opts": {"A": "系爭規定未涉及人民之工作權，因我國採抽象審查，甲的工作權受限制為個案事實", "B": "吊銷駕照之手段，可促使駕駛人接受酒測，但拒絕酒測不等於酒駕，手段非屬於達成交通安全目的之最小侵害手段", "C": "職業駕駛人應有比一般人高的駕駛品德，故司法審查就吊銷駕照規定應採取嚴格審查標準", "D": "立法者宜給予執法者權限，使執法者能夠審酌甲是否有酒測紀錄、拒酒測時所駕駛的車輛種類，而為妥適處理"}, "answer": "D", "explain": "釋字第699號認拒絕酒測吊銷駕照、三年內不得考領及吊銷所持各級車類駕照之規定，目的在維護交通安全，未違反比例原則而合憲，並涉及工作權（A錯）；審查亦非嚴格審查（C錯），B所稱非最小侵害手段與大法官結論相反。官方答案D，係呼應解釋意旨：立法者宜衡酌個案情形（如車種、是否職業駕駛）適時檢討，使執法有妥適處理空間。", "ref": "釋字第699號", "evidence": ""}, {"id": "111-法學-10", "src": "old", "year": 111, "n": 10, "subject": "法學", "topic": "憲法", "stem": "依司法院大法官解釋意旨，關於預算，下列敘述何者錯誤？", "opts": {"A": "法定預算之形式雖與法律案相當，因其內容、規範對象及審議方式與法律案不同，又稱為措施性法律", "B": "歲入法定預算之執行須依據各種稅法、公共債務法等相關規定，始有實現之可能", "C": "歲出法定預算係對預算執行機關歲入及未來承諾之授權規範，故其得基於執行預算之彈性而自行選擇執行項目或停止執行", "D": "立法院於審議中央政府總預算案時刪除司法院大法官支領司法人員專業加給預算之情形，與憲法第 81條規定意旨不符"}, "answer": "C", "explain": "釋字第520號指出法定預算為措施性法律（A正確）；歲入預算須依稅法等規定始能實現（B正確）。歲出預算為執行機關支出之上限授權，但行政機關不得因政策考量任意停止執行法定預算中之重要政策項目，C所稱可自行選擇或停止執行錯誤，當選。D為釋字第601號見解，正確。", "ref": "釋字第520號；釋字第601號", "evidence": ""}, {"id": "111-法學-11", "src": "old", "year": 111, "n": 11, "subject": "法學", "topic": "憲法", "stem": "關於考試委員及監察委員之任期，下列何者正確？", "opts": {"A": "兩者都是 4 年", "B": "兩者都是 6 年", "C": "考試委員是 4 年，監察委員是 6 年", "D": "考試委員是 6 年，監察委員是 4 年"}, "answer": "C", "explain": "增修條文第7條第2項規定監察委員任期六年。考試委員任期原為六年，考試院組織法於2020年修正改為四年，現行考試院組織法第3條仍為四年，且委員人數改為七至九人，故「考試委員4年、監察委員6年」之C正確。本題依現行規定仍正確，但應注意考試委員任期是近年修法之考點。", "ref": "增修條文§7；考試院組織法§3", "evidence": "監察院設監察委員二十九人，並以其中一人為院長、一人為副院長，任期六年"}, {"id": "111-法學-12", "src": "old", "year": 111, "n": 12, "subject": "法學", "topic": "憲法", "stem": "依現行規定，有關法官地位之保障，下列敘述何者錯誤？", "opts": {"A": "法官非受刑事或懲戒處分、禁治產之宣告，不得免職", "B": "法官非依法律，不得停職、轉任或減俸", "C": "法官身分保障之對象，亦及於其所兼任之庭長職務", "D": "非由實任法官轉任之司法院大法官，不適用法官終身職待遇及優遇制度之規定"}, "answer": "C", "explain": "憲法第81條規定法官終身職、非受刑事或懲戒處分或禁治產宣告不得免職，非依法律不得停職、轉任或減俸（A、B正確；「禁治產」為憲法原文用語）。釋字第539號認庭長之職務非屬憲法第81條身分保障範圍，C錯誤當選。D依增修條文第5條第1項及釋字第601號，非法官轉任之大法官不適用終身職待遇。", "ref": "憲法§81；釋字第539號", "evidence": "法官為終身職，非受刑事或懲戒處分，或禁治產之宣告，不得免職。"}, {"id": "111-法學-13", "src": "old", "year": 111, "n": 13, "subject": "法學", "topic": "憲法", "stem": "下列何者，必須經大法官組成憲法法庭審理？", "opts": {"A": "政黨違憲解散案", "B": "總統罷免案", "C": "副總統繼任總統職位之確認", "D": "總統宣布戒嚴案"}, "answer": "A", "explain": "依增修條文第5條第4項，大法官組成憲法法庭審理總統、副總統彈劾及政黨違憲解散事項，故選A。總統罷免案由立法院提議、全體選民投票決定（增修§2第9項）；副總統繼任無須審理；總統宣布戒嚴依憲法第39條經立法院通過或追認。", "ref": "增修條文§5", "evidence": "並組成憲法法庭審理總統、副總統之彈劾及政黨違憲之解散事項"}, {"id": "111-法學-14", "src": "old", "year": 111, "n": 14, "subject": "法學", "topic": "憲法", "stem": "有關地方自治團體的敘述，下列敘述何者正確？", "opts": {"A": "中央依據法律使地方分擔保險費之補助，未涉及到地方財政自主權之事項", "B": "地方自治團體所屬公務員應到立法院備詢", "C": "地方自治團體享有自主組織權以及對自治事項制定法規並執行之權限", "D": "中央與地方權限分配，如有未列舉事項發生而產生爭議時，由司法院處理之"}, "answer": "C", "explain": "地方自治團體享有自主組織權及就自治事項制定規章並執行之權限（釋字第467、527號），C正確。A依釋字第550號，中央使地方分擔健保費補助涉及地方財政自主權；B依釋字第498號，地方公務員無赴立法院備詢之義務；D依憲法第111條，未列舉事項爭議由立法院解決，非司法院。", "ref": "釋字第527號；憲法§111", "evidence": "有一縣之性質者屬於縣。遇有爭議時，由立法院解決之。"}, {"id": "111-法學-15", "src": "old", "year": 111, "n": 15, "subject": "法學", "topic": "憲法", "stem": "依憲法本文規定，我國最高行政機關為何？", "opts": {"A": "行政院", "B": "國家安全會議", "C": "總統及行政院", "D": "總統"}, "answer": "A", "explain": "憲法第53條明定「行政院為國家最高行政機關」，故選A。總統雖為國家元首並有部分行政權限，但憲法本文未稱其為最高行政機關；國家安全會議為總統決定國家安全大政方針之諮詢機關（增修§2第4項），均非正解。", "ref": "憲法§53", "evidence": ""}, {"id": "111-法學-16", "src": "old", "year": 111, "n": 16, "subject": "法學", "topic": "憲法", "stem": "下列何者非屬行政機關？", "opts": {"A": "行政院人事行政總處", "B": "公平交易委員會", "C": "總統府第一局", "D": "臺北市政府衛生局"}, "answer": "C", "explain": "行政機關指代表國家或地方自治團體為意思表示、具單獨組織法規、獨立編制預算與印信之組織（行政程序法§2第2項）。總統府第一局為總統府內部單位，不能對外獨立為意思表示，非行政機關，選C。人事行政總處、公平會、臺北市政府衛生局皆為行政機關。", "ref": "行政程序法§2", "evidence": ""}, {"id": "111-法學-17", "src": "old", "year": 111, "n": 17, "subject": "法學", "topic": "憲法", "stem": "下列何種行政救濟制度現已不存在？", "opts": {"A": "復查", "B": "訴願", "C": "再訴願", "D": "行政訴訟"}, "answer": "C", "explain": "訴願法於1998年修正（2000年施行）廢除再訴願，行政訴訟並改為二級二審（現為三級二審），故「再訴願」已不存在，選C。復查為稅捐稽徵法等特別法規定之訴願前置程序，仍存在；訴願、行政訴訟亦均存在。", "ref": "訴願法", "evidence": ""}, {"id": "111-法學-18", "src": "old", "year": 111, "n": 18, "subject": "法學", "topic": "法學緒論", "stem": "下列有關故意與過失的說法，何者錯誤？", "opts": {"A": "刑法上之故意包含事前故意及事後故意", "B": "無認識過失係指行為人雖非故意，但按其情節應注意，並能注意，而不注意", "C": "未必故意係指行為人對於構成犯罪之事實，預見其發生而其發生並不違背其本意", "D": "行為非出於故意或過失，不罰"}, "answer": "A", "explain": "刑法第13條故意分為直接故意與未必故意（間接故意），C即未必故意之定義；第14條過失分為無認識過失（應注意能注意而不注意）與有認識過失，B正確；第12條行為非出於故意或過失不罰，D正確。「事前故意、事後故意」為學理上否定之概念，故意須存在於行為時，A錯誤當選。", "ref": "刑法§12~§14", "evidence": ""}, {"id": "111-法學-19", "src": "old", "year": 111, "n": 19, "subject": "法學", "topic": "法學緒論", "stem": "依民法有關物之規定，下列敘述何者錯誤？", "opts": {"A": "物分為不動產與動產", "B": "從物乃主物之成分", "C": "不動產分為土地與定著物", "D": "物為人力所得支配之有體物"}, "answer": "B", "explain": "民法第66條不動產為土地及其定著物；第67條不動產以外之物為動產，A、C正確。物指人力所能支配之有體物，D正確。民法第68條從物係非主物之成分，常助主物之效用而同屬一人者，故B「從物乃主物之成分」錯誤，當選。", "ref": "民法§66~§68", "evidence": ""}, {"id": "111-法學-20", "src": "old", "year": 111, "n": 20, "subject": "法學", "topic": "法學緒論", "stem": "權利人長期間不行使權利，使義務人依其狀況而認權利人放棄權利之行使，則該權利雖未消滅，亦不得再行使。此係源自於何種行政法一般法律原則？", "opts": {"A": "平等原則", "B": "誠實信用原則", "C": "比例原則", "D": "法律明確性原則"}, "answer": "B", "explain": "題幹描述「權利失效」原則：權利人長期不行使權利，致義務人正當信賴其不再行使，嗣後再行使即違反誠信。此原則源自誠實信用原則（行政程序法§8、民法§148第2項），故選B。平等原則、比例原則及法律明確性原則均與權利長期不行使無關。", "ref": "行政程序法§8", "evidence": ""}, {"id": "111-法學-21", "src": "old", "year": 111, "n": 21, "subject": "法學", "topic": "法學緒論", "stem": "關於行政機關為行政行為時應注意遵循之行政法原則，下列敘述何者錯誤？", "opts": {"A": "法律賦予行政機關裁量權，行政機關於此範圍即得自由為之，不受任何限制", "B": "行政行為如有正當理由，仍得為差別待遇", "C": "行政機關為行政行為應遵循誠信原則", "D": "行政機關為行政行為時，對當事人有利及不利的情形均應注意"}, "answer": "A", "explain": "行政程序法第10條規定行政機關行使裁量權，不得逾越法定裁量範圍，並應符合法規授權之目的，故裁量並非不受任何限制，A錯誤當選。B為第6條平等原則（非有正當理由不得差別待遇）；C為第8條誠信原則；D為第9條有利不利一律注意原則。", "ref": "行政程序法§6、§8~§10", "evidence": ""}, {"id": "111-法學-22", "src": "old", "year": 111, "n": 22, "subject": "法學", "topic": "法學緒論", "stem": "刑法第 126 條規定「有管收、解送或拘禁人犯職務之公務員，對於人犯施以凌虐者，處 1 年以上 7 年以下有期徒刑。」下列公務員何者不會成為本罪之行為主體？", "opts": {"A": "法警", "B": "看守所人員", "C": "法官", "D": "司法警察"}, "answer": "C", "explain": "刑法第126條凌虐人犯罪為身分犯，行為主體限於「有管收、解送或拘禁人犯職務之公務員」，如法警、看守所人員、司法警察等實際負責解送、拘禁人犯者。法官職務為審判，並無管收、解送或拘禁人犯之職務，故不會成為本罪主體，選C。", "ref": "刑法§126", "evidence": ""}, {"id": "111-法學-23", "src": "old", "year": 111, "n": 23, "subject": "法學", "topic": "法學緒論", "stem": "有關刑法第 135 條及第 136 條妨害公務罪之敘述，下列何者錯誤？", "opts": {"A": "在抗議現場靜坐或任由抬離，不構成刑法第 135 條妨害公務罪", "B": "威脅公務員將向其上級長官檢舉其行為，不構成刑法第 135 條妨害公務罪", "C": "公然聚眾而犯妨害公務罪者，其在場助勢之人亦成立刑法第 136 條第 1 項之罪", "D": "聚眾妨害公務罪之首謀，若構成妨害公務罪之共同正犯，應優先論以刑法第 135 條妨害公務罪之共同正犯"}, "answer": "D", "explain": "靜坐或任由抬離未施強暴脅迫（A正確）；向上級檢舉非屬足使人心生畏懼之脅迫（B正確）。刑法第136條處罰聚眾妨害公務之在場助勢者（C正確；2022年修法用語改為「在公共場所或公眾得出入之場所，聚集三人以上」，實質不變）。首謀應依第136條處斷，屬聚合犯之特別規定，而非優先論第135條共同正犯，D錯誤當選。", "ref": "刑法§135、§136", "evidence": ""}, {"id": "111-法學-24", "src": "old", "year": 111, "n": 24, "subject": "法學", "topic": "法學緒論", "stem": "依據我國公司法，股份有限公司合併時，下列那一個步驟並非法定必要程序？", "opts": {"A": "董事會應作成合併契約，提出於股東會", "B": "股東會應有代表已發行股份總數 3 分之 2 以上股東出席，以出席股東表決權過半數同意之", "C": "應載明於股東會召集事由", "D": "公司為合併之決議前，應向各債權人分別通知及公告"}, "answer": "D", "explain": "公司法第317條董事會應作成合併契約提出於股東會（A）；第316條合併決議須三分之二以上股份出席、出席股東表決權過半數同意（B）；第172條第5項合併應列舉於召集事由（C），均為法定程序。第73條規定公司「決議合併後」始應即向各債權人分別通知及公告，D「決議前」錯誤，選D。", "ref": "公司法§73、§172、§316、§317", "evidence": ""}, {"id": "111-法學-25", "src": "old", "year": 111, "n": 25, "subject": "法學", "topic": "法學緒論", "stem": "甲應聘於雇主Ａ時，雇主特別強調，該公司採取責任制，因此工時無上限，也無加班費，自己把工作做完再下班，甲迫於無奈，但為了生活也只能繼續上班。關於該公司加班費的設定方式，下列敘述何者正確？", "opts": {"A": "加班費規定合法，雇主應有權利規定其勞工之工作內容以及類型，採用無加班費的責任制", "B": "加班費規定違法，勞動基準法第 24 條之加班費屬於強制規定，雇主即便單方面設定無加班費的責任制規定，也不因此免除加班費的給付義務", "C": "加班費規定違法，但設定責任制工時無上限合法，只要依法定利率給付加班費即可", "D": "加班費規定合法，因為勞工甲在知悉沒有加班費之規定後，依然持續上班，已經默示同意"}, "answer": "B", "explain": "勞動基準法第24條延長工時工資之規定屬強制規定，為最低勞動條件（勞基法§1），雇主單方設定「責任制、無加班費」不能免除給付義務，選B。A、D以雇主權限或勞工默示同意為由主張合法，違反勞基法最低標準；C工時亦受第32條延長工時上限規範，非無上限。", "ref": "勞動基準法§24、§32", "evidence": ""}, {"id": "111-法學-26", "src": "old", "year": 111, "n": 26, "subject": "法學", "topic": "法學緒論", "stem": "依性別工作平等法之規定，受僱者任職至少滿多久才有資格申請育嬰留職停薪？", "opts": {"A": "3 個月", "B": "6 個月", "C": "9 個月", "D": "1 年"}, "answer": "B", "explain": "性別平等工作法（原性別工作平等法，2023年更名）第16條第1項規定：「受僱者任職滿六個月後，於每一子女滿三歲前，得申請育嬰留職停薪」，經查全國法規資料庫現行條文仍保留任職滿六個月要件，故選B。注意法規名稱已改為「性別平等工作法」。", "ref": "性別平等工作法§16", "evidence": ""}, {"id": "111-法學-27", "src": "old", "year": 111, "n": 27, "subject": "法學", "topic": "法學緒論", "stem": "關於地方自治團體之自治法規，下列敘述何者錯誤？", "opts": {"A": "自治條例係經地方立法機關通過", "B": "自治規則係由地方行政機關訂定", "C": "自治條例須報內政部核定，始生效力", "D": "自治條例得規定處以罰鍰或其他種類行政罰"}, "answer": "C", "explain": "地方制度法第25條自治條例經地方立法機關通過、自治規則由地方行政機關訂定（A、B正確）；第26條自治條例得規定罰鍰或其他種類行政罰（D正確）。自治條例原則上報中央主管機關「備查」，僅定有罰則者須報核定（直轄市報行政院、縣市報中央各該主管機關），非一律報內政部核定，C錯誤當選。", "ref": "地方制度法§25、§26", "evidence": ""}, {"id": "111-法學-28", "src": "old", "year": 111, "n": 28, "subject": "法學", "topic": "法學緒論", "stem": "買賣雙方約定種類之債買賣，買受人應於出賣人通知時至出賣人之住所處取貨，買受人於取貨時付款。嗣後出賣人業已通知買受人前來取貨，但買受人遲遲未至出賣人之住所處取貨，就在買受人取貨前，因不明火災，出賣人欲交付於買受人之物品燒毀。下列敘述何者正確？", "opts": {"A": "買賣標的物已特定，買受人仍必須繳款，價金危險由買受人承擔", "B": "買受人無須繳款，價金危險應由出賣人承擔", "C": "出賣人必須再發貨一次", "D": "因不可歸責雙方當事人，以致給付不能，故買受人免價金對待給付"}, "answer": "A", "explain": "種類之債經出賣人交付必要行為並通知買受人，依民法第200條第2項其給付物即特定；買受人未依約取貨構成受領遲延，依民法第237條債務人僅就故意或重大過失負責，而標的物之利益及危險依第373條及受領遲延法理移轉於買受人，故不明火災致滅失時，買受人仍須支付價金，選A。", "ref": "民法§200、§237、§373", "evidence": ""}, {"id": "111-法學-30", "src": "old", "year": 111, "n": 30, "subject": "法學", "topic": "法學緒論", "stem": "關於物權行為，下列敘述何者錯誤？", "opts": {"A": "稱物權行為者，乃以物權變動為直接內容之法律行為", "B": "不動產抵押權設定，乃物權行為", "C": "遺囑為物權行為", "D": "債權行為與物權行為是原因行為與履行行為之關係"}, "answer": "C", "explain": "物權行為指以物權之發生、變更、消滅為直接內容之法律行為（A正確），如抵押權設定（B正確）；債權行為常為物權行為之原因行為（D正確）。遺囑為死因、單獨之法律行為，本身並不直接發生物權變動，遺產係因繼承或遺贈之履行而移轉，故C「遺囑為物權行為」錯誤，當選。", "ref": "民法§1186以下", "evidence": ""}, {"id": "111-法學-31", "src": "old", "year": 111, "n": 31, "subject": "法學", "topic": "英文", "stem": "To avoid diagnostic errors, breast imaging subspecialists and general radiologists who ____ breast images should adhere to the unique lexicon of the handbook.", "opts": {"A": "interpret", "B": "paralyze", "C": "excerpt", "D": "provoke"}, "answer": "A", "explain": "句意：為避免診斷錯誤，「判讀」乳房影像的專科醫師與一般放射科醫師應遵循手冊的專用術語。interpret＝解讀、判讀。paralyze 使癱瘓；excerpt 摘錄；provoke 激怒。", "ref": "英文", "evidence": ""}, {"id": "111-法學-32", "src": "old", "year": 111, "n": 32, "subject": "法學", "topic": "英文", "stem": "She has been ____ with making money because she grew up in poverty.", "opts": {"A": "converted", "B": "obsessed", "C": "oscillated", "D": "contrived"}, "answer": "B", "explain": "句意：她因在貧困中長大而對賺錢「著迷」。be obsessed with＝沉迷於、執著於。converted 轉換；oscillated 擺動；contrived 設計、策劃。", "ref": "英文", "evidence": ""}, {"id": "111-法學-33", "src": "old", "year": 111, "n": 33, "subject": "法學", "topic": "英文", "stem": "The judge offered the criminal the ____ of a fine of ten thousand dollars or three months in prison.", "opts": {"A": "altercation", "B": "alternative", "C": "appreciation", "D": "appeasement"}, "answer": "B", "explain": "句意：法官給犯人「選擇」：罰款一萬元或入獄三個月。alternative＝可選擇之方案，常與 of A or B 連用。altercation 爭吵；appreciation 欣賞；appeasement 安撫。", "ref": "英文", "evidence": ""}, {"id": "111-法學-34", "src": "old", "year": 111, "n": 34, "subject": "法學", "topic": "英文", "stem": "It is fun for me to recruit new people, but letting workers go is the ____ enjoyable part of what I do.", "opts": {"A": "least", "B": "graphically", "C": "both", "D": "physically"}, "answer": "A", "explain": "句意：招募新人很有趣，但解僱員工是我工作中「最不」愉快的部分。least＋形容詞構成最高級否定，the least enjoyable＝最不令人愉快的。其他選項 graphically、both、physically 文法或語意皆不通。", "ref": "英文", "evidence": ""}, {"id": "111-法學-35", "src": "old", "year": 111, "n": 35, "subject": "法學", "topic": "英文", "stem": "Mountain-climbing is an opportunity to participate in a very individual ____ which pits the climber against nature.", "opts": {"A": "competition", "B": "finance", "C": "surveillance", "D": "punctuation"}, "answer": "A", "explain": "句意：登山是參與一項讓攀登者與大自然對抗的個人「競賽」。competition＝競爭、比賽，與 pits A against B（使對抗）呼應。finance 財務；surveillance 監視；punctuation 標點。", "ref": "英文", "evidence": ""}, {"id": "111-法學-36", "src": "old", "year": 111, "n": 36, "subject": "法學", "topic": "英文", "stem": "The company failed to meet its short-term ____ of expanding into Asia.", "opts": {"A": "commission", "B": "objective", "C": "liability", "D": "emigration"}, "answer": "B", "explain": "句意：該公司未能達成擴展至亞洲的短期「目標」。meet an objective＝達成目標。commission 佣金、委員會；liability 責任、負債；emigration 移居外國。", "ref": "英文", "evidence": ""}, {"id": "111-法學-37", "src": "old", "year": 111, "n": 37, "subject": "法學", "topic": "英文", "stem": "I was hoping my mother would say something first about my boyfriend. I had seen her expression when she opened the door and ____ him from head to toe, and I could anticipate what criticisms she would have.", "opts": {"A": "demonstrated", "B": "indulged", "C": "ignored", "D": "scrutinized"}, "answer": "D", "explain": "句意：母親開門時上下「仔細打量」我男友，我能預料她會有什麼批評。scrutinize＝仔細審視，from head to toe 從頭到腳。demonstrate 示範；indulge 縱容；ignore 忽視。", "ref": "英文", "evidence": ""}, {"id": "111-法學-38", "src": "old", "year": 111, "n": 38, "subject": "法學", "topic": "英文", "stem": "Joseph is always ____ by the amazing way those female supermodels move in high heels, swinging and turning their bodies so skillfully and gracefully, on the runway.", "opts": {"A": "contaminated", "B": "designated", "C": "fascinated", "D": "terminated"}, "answer": "C", "explain": "句意：Joseph 總是「著迷於」超模們穿高跟鞋在伸展台上優雅走動的方式。be fascinated by＝被吸引、著迷。contaminated 被污染；designated 被指定；terminated 被終止。", "ref": "英文", "evidence": ""}, {"id": "111-法學-39", "src": "old", "year": 111, "n": 39, "subject": "法學", "topic": "英文", "stem": "Professor Wu is good at ____ the spirits of the students in her Monday morning class with jokes and questions helping them chase away their Monday blues.", "opts": {"A": "arousing", "B": "exploring", "C": "invading", "D": "obtaining"}, "answer": "A", "explain": "句意：吳教授擅長用笑話與提問「激發」週一早上學生的精神，趕走週一憂鬱。arouse＝喚起、激起（arouse the spirits）。explore 探索；invade 侵略；obtain 獲得。", "ref": "英文", "evidence": ""}, {"id": "111-法學-40", "src": "old", "year": 111, "n": 40, "subject": "法學", "topic": "英文", "stem": "While the Congress’s investigation report did not conclude that the president had committed bribery, it did not him crimes related to obstruction of justice.", "opts": {"A": "abdicate", "B": "exonerate", "C": "interrogate", "D": "obligate"}, "answer": "B", "explain": "句意：國會調查報告雖未認定總統犯賄賂罪，但也未「免除」其妨礙司法相關罪嫌。exonerate A of/from＝宣告無罪、免除責任。abdicate 退位；interrogate 審問；obligate 使負義務。", "ref": "英文", "evidence": ""}, {"id": "111-法學-41", "src": "old", "year": 111, "n": 41, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "built", "B": "building", "C": "to be built", "D": "to have built"}, "answer": "A", "explain": "城堡由 Julia Morgan 設計，於1919至1947年間「建造」。空格為分詞片語，表被動且已完成，用過去分詞 built（＝which was built）。building 表主動；to be built 表未來。", "ref": "英文", "evidence": "", "passage": "Hearst Castle is a National Historic Landmark and California Historical Landmark mansion located on\nthe Central Coast of California in the U.S.A. It was designed by architect Julia Morgan, 41 between 1919\nand 1947, as a residence for newspaper magnate William Randolph Hearst, who died in 1951. In 1954, it\nbecame a California State Park. The site was opened to visitors in 1958. Since then it has been operated as the\nHearst San Simeon State Historical Monument, where the estate, along with its considerable collection of art\nand antiques, is open for public tours. 42 its location far from any urban center, the site attracts millions\nof travelers each year.\nInvitations to Hearst Castle were highly coveted during its heyday in the 1920s and 1930s. The Hollywood\nand political elite often visited. While guests were expected to attend the formal dinners each evening, they\nwere normally left to their own 43 during the day while Hearst directed his business affairs. Since the\nestate had so many facilities, including its own movie studio, guests were ____ 44 at a loss for things to do.\nAlthough the main estate is now a museum, the Hearst family continues to use an older Victorian house on\nthe property as a retreat. To uphold the estate’s non-profit image, 45 filming is not often at Hearst Castle\nand most requests are turned down. Since the property was donated to the state of California, only two projects\nhave been granted permission, namely, Stanley Kubrick’s film Spartacus and Lady Gaga’s music video for\n“G.U.Y.”!"}, {"id": "111-法學-42", "src": "old", "year": 111, "n": 42, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "Besides", "B": "Despite", "C": "Instead of", "D": "Along with"}, "answer": "B", "explain": "「儘管」位置遠離都市中心，每年仍吸引數百萬遊客。Despite＋名詞表讓步，前後語意相反。Besides 除…之外；Instead of 代替；Along with 連同，皆不符轉折語意。", "ref": "英文", "evidence": "", "passage": "Hearst Castle is a National Historic Landmark and California Historical Landmark mansion located on\nthe Central Coast of California in the U.S.A. It was designed by architect Julia Morgan, 41 between 1919\nand 1947, as a residence for newspaper magnate William Randolph Hearst, who died in 1951. In 1954, it\nbecame a California State Park. The site was opened to visitors in 1958. Since then it has been operated as the\nHearst San Simeon State Historical Monument, where the estate, along with its considerable collection of art\nand antiques, is open for public tours. 42 its location far from any urban center, the site attracts millions\nof travelers each year.\nInvitations to Hearst Castle were highly coveted during its heyday in the 1920s and 1930s. The Hollywood\nand political elite often visited. While guests were expected to attend the formal dinners each evening, they\nwere normally left to their own 43 during the day while Hearst directed his business affairs. Since the\nestate had so many facilities, including its own movie studio, guests were ____ 44 at a loss for things to do.\nAlthough the main estate is now a museum, the Hearst family continues to use an older Victorian house on\nthe property as a retreat. To uphold the estate’s non-profit image, 45 filming is not often at Hearst Castle\nand most requests are turned down. Since the property was donated to the state of California, only two projects\nhave been granted permission, namely, Stanley Kubrick’s film Spartacus and Lady Gaga’s music video for\n“G.U.Y.”!"}, {"id": "111-法學-43", "src": "old", "year": 111, "n": 43, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "categories", "B": "dwellings", "C": "segments", "D": "terminals"}, "answer": "B", "explain": "原文慣用語為 left to their own devices（任其自便）。選項中語意可通者為 dwellings（住處），指白天賓客各自在住處自由活動；categories、segments、terminals 皆不通。", "ref": "英文", "evidence": "", "passage": "Hearst Castle is a National Historic Landmark and California Historical Landmark mansion located on\nthe Central Coast of California in the U.S.A. It was designed by architect Julia Morgan, 41 between 1919\nand 1947, as a residence for newspaper magnate William Randolph Hearst, who died in 1951. In 1954, it\nbecame a California State Park. The site was opened to visitors in 1958. Since then it has been operated as the\nHearst San Simeon State Historical Monument, where the estate, along with its considerable collection of art\nand antiques, is open for public tours. 42 its location far from any urban center, the site attracts millions\nof travelers each year.\nInvitations to Hearst Castle were highly coveted during its heyday in the 1920s and 1930s. The Hollywood\nand political elite often visited. While guests were expected to attend the formal dinners each evening, they\nwere normally left to their own 43 during the day while Hearst directed his business affairs. Since the\nestate had so many facilities, including its own movie studio, guests were ____ 44 at a loss for things to do.\nAlthough the main estate is now a museum, the Hearst family continues to use an older Victorian house on\nthe property as a retreat. To uphold the estate’s non-profit image, 45 filming is not often at Hearst Castle\nand most requests are turned down. Since the property was donated to the state of California, only two projects\nhave been granted permission, namely, Stanley Kubrick’s film Spartacus and Lady Gaga’s music video for\n“G.U.Y.”!"}, {"id": "111-法學-44", "src": "old", "year": 111, "n": 44, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "briefly", "B": "nearly", "C": "partly", "D": "rarely"}, "answer": "D", "explain": "莊園設施眾多（甚至有電影攝影棚），賓客「很少」會不知道要做什麼。rarely＝很少，表示否定語意；be at a loss 不知所措。briefly 短暫地；nearly 幾乎；partly 部分地，與前文因果不合。", "ref": "英文", "evidence": "", "passage": "Hearst Castle is a National Historic Landmark and California Historical Landmark mansion located on\nthe Central Coast of California in the U.S.A. It was designed by architect Julia Morgan, 41 between 1919\nand 1947, as a residence for newspaper magnate William Randolph Hearst, who died in 1951. In 1954, it\nbecame a California State Park. The site was opened to visitors in 1958. Since then it has been operated as the\nHearst San Simeon State Historical Monument, where the estate, along with its considerable collection of art\nand antiques, is open for public tours. 42 its location far from any urban center, the site attracts millions\nof travelers each year.\nInvitations to Hearst Castle were highly coveted during its heyday in the 1920s and 1930s. The Hollywood\nand political elite often visited. While guests were expected to attend the formal dinners each evening, they\nwere normally left to their own 43 during the day while Hearst directed his business affairs. Since the\nestate had so many facilities, including its own movie studio, guests were ____ 44 at a loss for things to do.\nAlthough the main estate is now a museum, the Hearst family continues to use an older Victorian house on\nthe property as a retreat. To uphold the estate’s non-profit image, 45 filming is not often at Hearst Castle\nand most requests are turned down. Since the property was donated to the state of California, only two projects\nhave been granted permission, namely, Stanley Kubrick’s film Spartacus and Lady Gaga’s music video for\n“G.U.Y.”!"}, {"id": "111-法學-45", "src": "old", "year": 111, "n": 45, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "commercial", "B": "preliminary", "C": "reflective", "D": "spontaneous"}, "answer": "A", "explain": "為維持非營利形象，「商業」拍攝很少在此進行。commercial filming＝商業拍攝，與 non-profit image 對比。preliminary 初步的；reflective 反思的；spontaneous 自發的。", "ref": "英文", "evidence": "", "passage": "Hearst Castle is a National Historic Landmark and California Historical Landmark mansion located on\nthe Central Coast of California in the U.S.A. It was designed by architect Julia Morgan, 41 between 1919\nand 1947, as a residence for newspaper magnate William Randolph Hearst, who died in 1951. In 1954, it\nbecame a California State Park. The site was opened to visitors in 1958. Since then it has been operated as the\nHearst San Simeon State Historical Monument, where the estate, along with its considerable collection of art\nand antiques, is open for public tours. 42 its location far from any urban center, the site attracts millions\nof travelers each year.\nInvitations to Hearst Castle were highly coveted during its heyday in the 1920s and 1930s. The Hollywood\nand political elite often visited. While guests were expected to attend the formal dinners each evening, they\nwere normally left to their own 43 during the day while Hearst directed his business affairs. Since the\nestate had so many facilities, including its own movie studio, guests were ____ 44 at a loss for things to do.\nAlthough the main estate is now a museum, the Hearst family continues to use an older Victorian house on\nthe property as a retreat. To uphold the estate’s non-profit image, 45 filming is not often at Hearst Castle\nand most requests are turned down. Since the property was donated to the state of California, only two projects\nhave been granted permission, namely, Stanley Kubrick’s film Spartacus and Lady Gaga’s music video for\n“G.U.Y.”!"}, {"id": "111-法學-46", "src": "old", "year": 111, "n": 46, "subject": "法學", "topic": "英文", "stem": "What is most likely the author’s purpose for writing this news report?", "opts": {"A": "To urge people to respect the rights and interests of refugees.", "B": "To reveal the prevalent problem of immigrants.", "C": "To persuade people into helping solve the hygienic problem of illegal immigrants.", "D": "To value the financial aids carried out by the human rights groups."}, "answer": "A", "explain": "本文描述澳洲境外拘留難民政策遭聯合國及人權團體譴責、民眾遊行要求終止，並敘述難民的悲慘處境，作者目的在呼籲大眾尊重難民權益，選A。B、C、D 所述移民問題、衛生問題、財務援助皆非文章重點。", "ref": "英文", "evidence": "", "passage": "The Australian government has operated a policy since 2013, obstructing refugees from arriving in their\ncountry and seeking humanitarian aids. Those asylum-seekers and illegal migrants have been completely\nrejected and detained on distant Pacific islands like Manus and Nauru. This policy was formulated by Kevin\nRudd, the prime minister of Australia by then. The main objective of this plan is to prevent refugees from\nstaying in Australia and settle them instead in remote areas as part of the resettlement deal with Papua New\nGuinea. Thousands of those refugees were thus delivered there. Yet, after years of detention on those faraway\nPacific islands, the demeaning conditions those refugees are in and their agony are heard worldwide as the\nUnited Nations Refugee Agency and international human rights groups have condemned the Australian\ngovernment’s implementation of this policy. But the Australian government still sticks to its principle and has\ndone nothing to alter the plan.\nAs a remarkable way to “celebrate” the fifth anniversary of this policy’s renewal, thousands of protestors\nmarched across cities in Australia to ask for the termination of this offshore detention policy as they think that\nfive years are too long for the detention. Besides Sydney, demonstrations across the streets took place jointly\nin Melbourne, Adelaide, Brisbane, Canberra and Perth as well. The devastating stories of refugees detained on\ncamps on those islands were occasionally heard with a recent suicidal case of an Iranian refugee on Naura\nwhose body has reached Australia but would be buried in Naura or repatriated back to Iran. One of the advocacy\ngroups for human rights claimed that has been the fifth death on Nauru since Australia launched its offshore\ndetention project in July 2013, whereas there were also seven others who have passed away on Manus during\napproximately the same phase. The Australian government has attempted to arrange those refugees to third\ncountries such as the US, and over a hundred of them have been transported there, according to the Refugee\nAction Coalition. But there still remain around 1,600 refugees on Nauru and Manus."}, {"id": "111-法學-47", "src": "old", "year": 111, "n": 47, "subject": "法學", "topic": "英文", "stem": "What does “comdemned” mean in the first paragraph?", "opts": {"A": "encouraged", "B": "condoned", "C": "criticized", "D": "enforced"}, "answer": "C", "explain": "condemned（題目誤拼 comdemned）意為「譴責」，文中指聯合國難民署與人權團體譴責澳洲政府執行此政策，同義為 criticized（批評）。encouraged 鼓勵；condoned 寬恕、縱容；enforced 執行。", "ref": "英文", "evidence": "", "passage": "The Australian government has operated a policy since 2013, obstructing refugees from arriving in their\ncountry and seeking humanitarian aids. Those asylum-seekers and illegal migrants have been completely\nrejected and detained on distant Pacific islands like Manus and Nauru. This policy was formulated by Kevin\nRudd, the prime minister of Australia by then. The main objective of this plan is to prevent refugees from\nstaying in Australia and settle them instead in remote areas as part of the resettlement deal with Papua New\nGuinea. Thousands of those refugees were thus delivered there. Yet, after years of detention on those faraway\nPacific islands, the demeaning conditions those refugees are in and their agony are heard worldwide as the\nUnited Nations Refugee Agency and international human rights groups have condemned the Australian\ngovernment’s implementation of this policy. But the Australian government still sticks to its principle and has\ndone nothing to alter the plan.\nAs a remarkable way to “celebrate” the fifth anniversary of this policy’s renewal, thousands of protestors\nmarched across cities in Australia to ask for the termination of this offshore detention policy as they think that\nfive years are too long for the detention. Besides Sydney, demonstrations across the streets took place jointly\nin Melbourne, Adelaide, Brisbane, Canberra and Perth as well. The devastating stories of refugees detained on\ncamps on those islands were occasionally heard with a recent suicidal case of an Iranian refugee on Naura\nwhose body has reached Australia but would be buried in Naura or repatriated back to Iran. One of the advocacy\ngroups for human rights claimed that has been the fifth death on Nauru since Australia launched its offshore\ndetention project in July 2013, whereas there were also seven others who have passed away on Manus during\napproximately the same phase. The Australian government has attempted to arrange those refugees to third\ncountries such as the US, and over a hundred of them have been transported there, according to the Refugee\nAction Coalition. But there still remain around 1,600 refugees on Nauru and Manus."}, {"id": "111-法學-48", "src": "old", "year": 111, "n": 48, "subject": "法學", "topic": "英文", "stem": "According to the passage, which of the following statements is correct?", "opts": {"A": "Those refugees have called for the help of international human rights groups.", "B": "The news about the cases of death on those detention camps have been released to the world.", "C": "The Australian government allows the refugees who are asylum-seekers to stay in Melbourne.", "D": "None of the human rights groups supported the rescuing of those refugees in distress."}, "answer": "B", "explain": "文中提到拘留營難民的悲慘故事與自殺死亡案例已被世人得知，人權團體並統計諾魯與馬努斯島死亡人數，故B「死亡案例消息已向全世界披露」正確。文章未提到難民求助人權團體（A），也未允許難民留在墨爾本（C），D與文意相反。", "ref": "英文", "evidence": "", "passage": "The Australian government has operated a policy since 2013, obstructing refugees from arriving in their\ncountry and seeking humanitarian aids. Those asylum-seekers and illegal migrants have been completely\nrejected and detained on distant Pacific islands like Manus and Nauru. This policy was formulated by Kevin\nRudd, the prime minister of Australia by then. The main objective of this plan is to prevent refugees from\nstaying in Australia and settle them instead in remote areas as part of the resettlement deal with Papua New\nGuinea. Thousands of those refugees were thus delivered there. Yet, after years of detention on those faraway\nPacific islands, the demeaning conditions those refugees are in and their agony are heard worldwide as the\nUnited Nations Refugee Agency and international human rights groups have condemned the Australian\ngovernment’s implementation of this policy. But the Australian government still sticks to its principle and has\ndone nothing to alter the plan.\nAs a remarkable way to “celebrate” the fifth anniversary of this policy’s renewal, thousands of protestors\nmarched across cities in Australia to ask for the termination of this offshore detention policy as they think that\nfive years are too long for the detention. Besides Sydney, demonstrations across the streets took place jointly\nin Melbourne, Adelaide, Brisbane, Canberra and Perth as well. The devastating stories of refugees detained on\ncamps on those islands were occasionally heard with a recent suicidal case of an Iranian refugee on Naura\nwhose body has reached Australia but would be buried in Naura or repatriated back to Iran. One of the advocacy\ngroups for human rights claimed that has been the fifth death on Nauru since Australia launched its offshore\ndetention project in July 2013, whereas there were also seven others who have passed away on Manus during\napproximately the same phase. The Australian government has attempted to arrange those refugees to third\ncountries such as the US, and over a hundred of them have been transported there, according to the Refugee\nAction Coalition. But there still remain around 1,600 refugees on Nauru and Manus."}, {"id": "111-法學-49", "src": "old", "year": 111, "n": 49, "subject": "法學", "topic": "英文", "stem": "According to the passage, why did the demonstrators in Australia march across cities to protest against this detention policy?", "opts": {"A": "They want to celebrate the implementation of the detention policy.", "B": "They do not want Australia to become a disgraceful nation.", "C": "They welcome the arrival of the refugees in their country.", "D": "They think the detention has been too long and inappropriate."}, "answer": "D", "explain": "第二段指出抗議者遊行要求終止境外拘留政策，因為他們認為五年的拘留期間太長（five years are too long for the detention），故選D。A 的 celebrate 為反諷用法；B、C 文中未提及。", "ref": "英文", "evidence": "", "passage": "The Australian government has operated a policy since 2013, obstructing refugees from arriving in their\ncountry and seeking humanitarian aids. Those asylum-seekers and illegal migrants have been completely\nrejected and detained on distant Pacific islands like Manus and Nauru. This policy was formulated by Kevin\nRudd, the prime minister of Australia by then. The main objective of this plan is to prevent refugees from\nstaying in Australia and settle them instead in remote areas as part of the resettlement deal with Papua New\nGuinea. Thousands of those refugees were thus delivered there. Yet, after years of detention on those faraway\nPacific islands, the demeaning conditions those refugees are in and their agony are heard worldwide as the\nUnited Nations Refugee Agency and international human rights groups have condemned the Australian\ngovernment’s implementation of this policy. But the Australian government still sticks to its principle and has\ndone nothing to alter the plan.\nAs a remarkable way to “celebrate” the fifth anniversary of this policy’s renewal, thousands of protestors\nmarched across cities in Australia to ask for the termination of this offshore detention policy as they think that\nfive years are too long for the detention. Besides Sydney, demonstrations across the streets took place jointly\nin Melbourne, Adelaide, Brisbane, Canberra and Perth as well. The devastating stories of refugees detained on\ncamps on those islands were occasionally heard with a recent suicidal case of an Iranian refugee on Naura\nwhose body has reached Australia but would be buried in Naura or repatriated back to Iran. One of the advocacy\ngroups for human rights claimed that has been the fifth death on Nauru since Australia launched its offshore\ndetention project in July 2013, whereas there were also seven others who have passed away on Manus during\napproximately the same phase. The Australian government has attempted to arrange those refugees to third\ncountries such as the US, and over a hundred of them have been transported there, according to the Refugee\nAction Coalition. But there still remain around 1,600 refugees on Nauru and Manus."}, {"id": "111-法學-50", "src": "old", "year": 111, "n": 50, "subject": "法學", "topic": "英文", "stem": "What has the Australian government done to release the tension of the detention centers?", "opts": {"A": "They have assisted the human rights groups in deporting refugees back to their own countries.", "B": "They have attempted to terminate the offshore detention policy.", "C": "They have sent a number of refugees to third countries as asylum-seekers.", "D": "They have encouraged those detained refugees to stay in mainland Australia."}, "answer": "C", "explain": "文末提到澳洲政府嘗試將難民安置到美國等第三國，且已有一百多人被送往，故選C。A 遣返原籍國、B 終止政策、D 鼓勵留在澳洲本土，文中皆無此敘述，甚至與「政府堅持原則」相反。", "ref": "英文", "evidence": "", "passage": "The Australian government has operated a policy since 2013, obstructing refugees from arriving in their\ncountry and seeking humanitarian aids. Those asylum-seekers and illegal migrants have been completely\nrejected and detained on distant Pacific islands like Manus and Nauru. This policy was formulated by Kevin\nRudd, the prime minister of Australia by then. The main objective of this plan is to prevent refugees from\nstaying in Australia and settle them instead in remote areas as part of the resettlement deal with Papua New\nGuinea. Thousands of those refugees were thus delivered there. Yet, after years of detention on those faraway\nPacific islands, the demeaning conditions those refugees are in and their agony are heard worldwide as the\nUnited Nations Refugee Agency and international human rights groups have condemned the Australian\ngovernment’s implementation of this policy. But the Australian government still sticks to its principle and has\ndone nothing to alter the plan.\nAs a remarkable way to “celebrate” the fifth anniversary of this policy’s renewal, thousands of protestors\nmarched across cities in Australia to ask for the termination of this offshore detention policy as they think that\nfive years are too long for the detention. Besides Sydney, demonstrations across the streets took place jointly\nin Melbourne, Adelaide, Brisbane, Canberra and Perth as well. The devastating stories of refugees detained on\ncamps on those islands were occasionally heard with a recent suicidal case of an Iranian refugee on Naura\nwhose body has reached Australia but would be buried in Naura or repatriated back to Iran. One of the advocacy\ngroups for human rights claimed that has been the fifth death on Nauru since Australia launched its offshore\ndetention project in July 2013, whereas there were also seven others who have passed away on Manus during\napproximately the same phase. The Australian government has attempted to arrange those refugees to third\ncountries such as the US, and over a hundred of them have been transported there, according to the Refugee\nAction Coalition. But there still remain around 1,600 refugees on Nauru and Manus."}, {"id": "113-刑事法-01", "src": "old", "year": 113, "n": 1, "subject": "刑事法", "topic": "刑法", "stem": "下列何者不是罪刑法定原則之子原則？", "opts": {"A": "罪疑唯輕原則", "B": "明確性原則", "C": "禁止類推適用原則", "D": "禁止溯及既往原則"}, "answer": "A", "explain": "罪刑法定原則的子原則包括：習慣法禁止、類推適用禁止、溯及既往禁止（§1、§2）、法律明確性原則。「罪疑唯輕」是刑事訴訟上事實認定有疑時，作有利於被告認定的證據法則，不是罪刑法定原則的派生原則，所以選A。", "ref": "刑法§1、學說", "evidence": "行為之處罰，以行為時之法律有明文規定者為限"}, {"id": "113-刑事法-02", "src": "old", "year": 113, "n": 2, "subject": "刑事法", "topic": "刑法", "stem": "下列關於未遂犯的敘述，何者正確？", "opts": {"A": "未遂犯之處罰，均應按既遂犯之刑減輕之", "B": "行為不能發生犯罪之結果者，不罰", "C": "所有刑法分則之罪名，均處罰未遂犯", "D": "已著手於犯罪行為之實行，而因己意防止其結果之發生者，減輕或免除其刑"}, "answer": "D", "explain": "依§27Ⅰ，已著手實行犯罪，因己意中止或防止結果發生的（中止未遂），減輕或免除其刑（D）。A：普通未遂依§25是「得」減輕，不是「均應」減輕。B：§26不能未遂須「行為不能發生結果，又無危險」才不罰，選項漏了「無危險」。C：未遂犯以有特別規定者為限，才處罰。", "ref": "刑法§25、§26、§27", "evidence": "已著手於犯罪行為之實行，而因己意中止或防止其結果之發生者，減輕或免除其刑"}, {"id": "113-刑事法-03", "src": "old", "year": 113, "n": 3, "subject": "刑事法", "topic": "刑法", "stem": "下列有關緊急避難的敘述，何者錯誤？", "opts": {"A": "緊急避難係屬超法規阻卻違法事由", "B": "緊急避難之危難，亦包括他人之不法侵害", "C": "如果有其他可行的方式避免危難，就不能採取避難行為", "D": "當避難行為人依法在公務上或業務上負有特別危險承擔義務時，不能主張為自己利益之避難行為"}, "answer": "A", "explain": "緊急避難規定在刑法§24，是法定的阻卻違法事由，不是超法規事由，所以A錯。B：危難來源不限，包括他人的不法侵害。C：避難須出於不得已，也就是必要性（補充性）。D：依§24Ⅱ，公務上或業務上有特別義務者，不能主張為自己的避難。", "ref": "刑法§24", "evidence": "前項關於避免自己危難之規定，於公務上或業務上有特別義務者，不適用之。"}, {"id": "113-刑事法-04", "src": "old", "year": 113, "n": 4, "subject": "刑事法", "topic": "刑法", "stem": "甲對乙惡作劇，以掃把揮向乙，未料掃把擊中乙之眼睛，導致乙眼球破裂，一目失明，試問甲成立何罪？", "opts": {"A": "殺人未遂罪", "B": "過失致重傷罪", "C": "傷害致重傷罪", "D": "普通傷害罪"}, "answer": "B", "explain": "甲只是惡作劇揮掃把，沒有傷害或重傷的故意，但對可能擊中人有預見可能而未注意，屬過失。一目失明屬於§10Ⅳ①「毀敗一目之視能」的重傷，所以依§284後段成立過失致重傷罪（B）。傷害致重傷罪以基本傷害行為出於故意為前提，本題不符合。", "ref": "刑法§284、§10Ⅳ", "evidence": "致重傷者，處三年以下有期徒刑、拘役或三十萬元以下罰金"}, {"id": "113-刑事法-05", "src": "old", "year": 113, "n": 5, "subject": "刑事法", "topic": "刑法", "stem": "下列關於刑法沒收規定的敘述，何者錯誤？", "opts": {"A": "犯罪所得，屬於犯罪行為人者，沒收之。但有特別規定者，依其規定", "B": "違禁物，不問屬於犯罪行為人與否，沒收之", "C": "供犯罪所用、犯罪預備之物或犯罪所生之物，凡屬於犯罪行為人者，均應沒收", "D": "犯罪所得及追徵之範圍與價額，認定顯有困難時，得以估算認定之"}, "answer": "C", "explain": "依§38Ⅱ，供犯罪所用、犯罪預備之物或犯罪所生之物，屬於犯罪行為人的，「得」沒收，由法院裁量，不是「均應」沒收，所以C錯。A：§38-1Ⅰ規定犯罪所得原則上沒收。B：§38Ⅰ規定違禁物不問屬於誰都沒收。D：§38-2Ⅰ規定犯罪所得範圍與價額認定顯有困難時，得以估算認定。", "ref": "刑法§38Ⅱ", "evidence": "供犯罪所用、犯罪預備之物或犯罪所生之物，屬於犯罪行為人者，得沒收之"}, {"id": "113-刑事法-06", "src": "old", "year": 113, "n": 6, "subject": "刑事法", "topic": "刑法", "stem": "根據刑法中偽造文書印文罪的規定，下列敘述，何者正確？", "opts": {"A": "變造私文書，足以生損害於公眾或他人者，成立刑法第 210 條之罪；變造公文書者，由於勢必生損害於公眾，因此無論是否生損害於他人，均成立刑法第 211 條之罪", "B": "偽造護照，足以生損害於公眾或他人者，其法益侵害較偽造一般公文書或私文書為重，因此刑法第212 條設有加重處罰之規定", "C": "行使第 210 條至第 215 條之文書者，依偽造、變造文書或登載不實事項或使登載不實事項之規定處斷", "D": "從事業務之人，因故意或過失，將不實之事項登載於其業務上作成之文書，足以生損害於公眾或他人者，應成立刑法第 215 條之罪"}, "answer": "C", "explain": "§216規定，行使§210～§215的文書者，依各該偽造、變造或登載不實的規定處斷（C）。A：變造公文書依§211同樣須「足以生損害於公眾或他人」。B：§212偽造護照等特種文書的法定刑比一般文書「輕」，不是加重。D：§215業務登載不實以「明知」為要件，不處罰過失。", "ref": "刑法§216、§211、§212、§215", "evidence": "行使第二百一十條至第二百一十五條之文書者，依偽造、變造文書或登載不實事項或使登載不實事項之規定處斷。"}, {"id": "113-刑事法-07", "src": "old", "year": 113, "n": 7, "subject": "刑事法", "topic": "刑法", "stem": "依刑法殺人罪章與傷害罪章的規定，下列敘述，何者正確？", "opts": {"A": "聚眾鬥毆致人受輕傷、受重傷或死亡者，在場助勢之人應依刑法第 283 條規定處罰之", "B": "刑法第 281 條規定「施強暴於直系血親尊親屬，未成傷者」仍應成立犯罪，所謂「施強暴」包括施予有形的暴力和無形的脅迫在內", "C": "刑法第 278 條處罰使人受重傷的行為，所謂「重傷」包括使人嚴重減損嗅覺能力在內", "D": "父母因不得已之事由，於生產時或甫生產後，殺其子女者，刑法第 274 條設有較普通殺人罪為輕之法定刑規定"}, "answer": "C", "explain": "依§10Ⅳ③，重傷包括毀敗或嚴重減損語能、味能或「嗅能」，所以C正確。A：§283只處罰聚眾鬥毆「致人於死或重傷」時的在場助勢者，輕傷不包括在內。B：§281的「施強暴」限於有形暴力，不包括脅迫。D：§274限於「母」殺嬰，不包括父親。", "ref": "刑法§10Ⅳ、§278", "evidence": "毀敗或嚴重減損語能、味能或嗅能"}, {"id": "113-刑事法-08", "src": "old", "year": 113, "n": 8, "subject": "刑事法", "topic": "刑法", "stem": "下列關於刑法中妨害自由罪章的敘述，何者正確？", "opts": {"A": "意圖營利，以詐術使人出國者，無論既遂或未遂，均構成妨害自由罪章之犯罪", "B": "刑法第 298 條處罰「意圖使婦女與自己或他人結婚而略誘之」之行為，基於性別平等保護的考慮，解釋上應包括處罰「意圖使男性與自己或他人結婚而略誘之」之行為在內", "C": "刑法第 306 條處罰的侵入住居罪，限於無故侵入他人住宅、建築物等侵害居住安寧的行為，不包括侵入附連圍繞之土地者在內", "D": "刑法第 305 條處罰以加害生命、身體、自由、名譽、財產之事恐嚇他人，致生危害於安全之行為，但須告訴乃論"}, "answer": "A", "explain": "§297：意圖營利，以詐術使人出中華民國領域外者，處3～10年有期徒刑，且第2項處罰未遂犯，所以A正確。B：§298Ⅰ條文限於「婦女」，不能類推擴張到男性，否則違反罪刑法定。C：§306包括「附連圍繞之土地」。D：§305恐嚇危害安全罪不是告訴乃論。", "ref": "刑法§297", "evidence": "意圖營利，以詐術使人出中華民國領域外者"}, {"id": "113-刑事法-09", "src": "old", "year": 113, "n": 9, "subject": "刑事法", "topic": "刑法", "stem": "依刑法中「妨害性隱私及不實性影像罪章」之規定，下列敘述，何者正確？", "opts": {"A": "為保障個人生活私密領域最核心之性隱私，刑法第 319 條之 1 處罰未經他人同意，無故以照相、錄影、文字或圖畫等各種方法描繪其性影像之行為", "B": "刑法第 319 條之 4 處罰意圖散布、播送、交付、公然陳列，或以他法供人觀覽，以電腦合成或其他科技方法製作關於他人不實之性影像行為，但因涉及個人性隱私法益，須告訴乃論", "C": "刑法第 319 條之 4 處罰製作他人不實性影像之行為，例如以深度偽造技術，將被害人之臉部移接於他人之性影像即屬之", "D": "刑法第 319 條之 5 規定，第 319 條之 1 至第 319 條之 4 性影像之附著物及物品，若屬於犯罪行為人者，應沒收之。若非屬於犯罪行為人者，則由法院裁量是否需要沒收"}, "answer": "C", "explain": "§319-4處罰以電腦合成或其他科技方法，製作他人不實的性影像，例如深度偽造（Deepfake）換臉，所以C正確。A：§319-1限於照相、錄影、電磁紀錄或其他科技方法「攝錄」，不包括文字、圖畫。B：依§319-6，告訴乃論只限§319-1Ⅰ、§319-3Ⅰ，§319-4是非告訴乃論。D：依§319-5，性影像附著物不問屬於誰，都沒收。", "ref": "刑法§319-4、§319-5、§319-6", "evidence": "以電腦合成或其他科技方法製作關於他人不實之性影像"}, {"id": "113-刑事法-10", "src": "old", "year": 113, "n": 10, "subject": "刑事法", "topic": "刑法", "stem": "下列何種詐欺行為不構成刑法第 339 條之 4 的加重詐欺罪？", "opts": {"A": "冒稱是某法院書記官，要求不知情的民眾向自己繳納辦理訴訟費用的規費，實則據為己有的行為", "B": "父母子三人共同行使「金光黨」詐術，取得他人財物之行為", "C": "在網路上對公眾散布「投資某虛擬貨幣一本萬利，穩賺不賠」訊息，以詐取他人投資金額之行為", "D": "模仿他人之聲音，向其家人謊稱「被綁票」，因而詐取「贖金」之行為"}, "answer": "D", "explain": "§339-4加重詐欺的事由包括：冒用政府機關或公務員名義（A）、三人以上共同犯之（B）、以網路等傳播工具對公眾散布（C）、以電腦合成或其他科技方法製作他人不實影像或聲音（112年增訂）。D只是由人自己模仿聲音，沒有用科技合成，也不符合其他款，只成立普通詐欺罪。", "ref": "刑法§339-4", "evidence": "以電腦合成或其他科技方法製作關於他人不實影像、聲音或電磁紀錄之方法犯之"}, {"id": "113-刑事法-11", "src": "old", "year": 113, "n": 11, "subject": "刑事法", "topic": "刑法", "stem": "下列關於刑法中強盜相關犯罪要件的敘述，何者正確？", "opts": {"A": "攜帶美工刀用以強盜者，應成立刑法第 330 條的加重強盜罪", "B": "兩人結夥共同強盜者，應成立刑法第 330 條的加重強盜罪", "C": "竊盜、搶奪或詐欺，因防護贓物、脫免逮捕或湮滅罪證，而當場施以強暴脅迫者，依刑法第 329 條規定，以強盜論", "D": "犯強盜罪而故意傷害人者，應成立刑法第 332 條第 2 項之強盜傷害結合犯"}, "answer": "A", "explain": "§330加重強盜是準用§321Ⅰ各款，攜帶兇器（美工刀屬客觀上足以危害生命身體的兇器）屬於其中之一，所以A正確。B：結夥須「三人以上」。C：§329準強盜罪只限竊盜或搶奪，不包括詐欺。D：§332Ⅱ結合犯限於放火、強制性交、擄人勒贖、使人受重傷，普通傷害不在其中。", "ref": "刑法§330、§321、§329、§332", "evidence": "犯強盜罪而有第三百二十一條第一項各款情形之一者"}, {"id": "113-刑事法-12", "src": "old", "year": 113, "n": 12, "subject": "刑事法", "topic": "刑法", "stem": "甲男將鄰居乙女在公寓電梯口綁回家，強迫乙女自慰供己觀賞，問甲男應構成何罪？", "opts": {"A": "公然猥褻罪", "B": "強制性交罪", "C": "強制猥褻罪", "D": "侵入住居罪"}, "answer": "C", "explain": "強迫乙女自慰供甲觀賞，甲沒有以性器或身體、器物進入乙女的性器、肛門，實務上不屬於§10Ⅴ的性交，而是以強暴、脅迫違反其意願而為猥褻行為，成立§224強制猥褻罪（C）。行為發生在甲自己家，不是公然為之，也沒有侵入他人住居。", "ref": "刑法§224", "evidence": "對於男女以強暴、脅迫、恐嚇、催眠術或其他違反其意願之方法，而為猥褻之行為者"}, {"id": "113-刑事法-13", "src": "old", "year": 113, "n": 13, "subject": "刑事法", "topic": "刑法", "stem": "根據刑法規定，下列敘述，何者正確？", "opts": {"A": "公務員對於主管之事務，明知違背法令，直接或間接圖自己或其他私人不法利益者，不論是否獲得利益，均應成立圖利罪", "B": "有處罰犯罪職務之公務員，對於明知為有罪之人，卻無故不使其受處罰，並因而致人於死者，刑法定有加重處罰之規定", "C": "於未為公務員時，預以職務上之行為要求賄賂，而於為公務員後履行者，刑法規定應成立公務員要求賄賂罪，但得減輕處罰", "D": "有執行刑罰職務之公務員，違法執行刑罰者，應成立犯罪；違法不執行刑罰者，雖非屬犯罪，仍應予行政懲處"}, "answer": "B", "explain": "§125Ⅰ③：有追訴或處罰犯罪職務的公務員，明知為有罪之人而無故不使其受處罰，應處罰；第2項因而致人於死者加重處罰（B）。A：圖利罪須「因而獲得利益」才成罪。C：依§123，預以職務行為收賄，以收受賄賂論，沒有得減輕規定。D：依§127Ⅰ，違法「不執行」刑罰同樣構成犯罪。", "ref": "刑法§125、§131、§123、§127", "evidence": "明知為無罪之人，而使其受追訴或處罰，或明知為有罪之人，而無故不使其受追訴或處罰者"}, {"id": "113-刑事法-14", "src": "old", "year": 113, "n": 14, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於辯護人之權限，下列敘述，何者錯誤？", "opts": {"A": "辯護人得接見羈押之被告，並互通書信，不得限制之", "B": "辯護人於審判中得檢閱卷宗及證物並得抄錄、重製或攝影", "C": "辯護人於偵查中之羈押審查程序，除法律另有規定外，得檢閱卷宗及證物並得抄錄或攝影", "D": "辯護人得於法院訊問證人、鑑定人或通譯時在場"}, "answer": "A", "explain": "依§34Ⅰ，辯護人得接見羈押被告並互通書信；但有事證足認其有湮滅、偽造、變造證據或勾串共犯或證人時，可以限制。A說「不得限制之」，漏了這個但書，所以錯誤。B：§33Ⅰ、D：§168-1都正確。C是§33-1偵查中羈押審查閱卷的規定。", "ref": "刑訴§34Ⅰ", "evidence": "非有事證足認其有湮滅、偽造、變造證據或勾串共犯或證人者，不得限制之"}, {"id": "113-刑事法-15", "src": "old", "year": 113, "n": 15, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列有關無令狀搜索之敘述，何者錯誤？", "opts": {"A": "合法附帶搜索的前提是合法逮捕、執行拘提或羈押", "B": "司法警察於追捕現行犯時，親眼目睹現行犯躲入住宅中，司法警察得逕行搜索住宅", "C": "受搜索人若自願同意，司法警察即可進行搜索，但同意人得隨時撤回同意", "D": "刑事訴訟法第 131 條第 3 項無令狀搜索若有遲延 3 日內陳報之規定，不影響搜得證物之證據能力"}, "answer": "D", "explain": "依§131Ⅲ、Ⅳ，逕行搜索、緊急搜索執行後，應在3日內陳報法院；沒有陳報或經法院撤銷的，審判時法院「得宣告所扣得之物不得作為證據」，所以D說不影響證據能力是錯的。B是§131Ⅰ②追躡現行犯的逕行搜索；C是§131-1同意搜索，同意可以撤回。", "ref": "刑訴§131Ⅲ、Ⅳ", "evidence": "第一項、第二項之搜索執行後未陳報該管法院或經法院撤銷者，審判時法院得宣告所扣得之物，不得作為證據。"}, {"id": "113-刑事法-16", "src": "old", "year": 113, "n": 16, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列有關刑事訴訟法中交互詰問之敘述，何者錯誤？", "opts": {"A": "鑑定人對詰問者顯示敵意或反感者，得於主詰問時進行誘導詰問", "B": "被告原則上可以對假設性事項進行詰問", "C": "反詰問應就主詰問所顯現之事項及其相關事項或為辯明證人、鑑定人之陳述證明力所必要之事項行之", "D": "審判長對於交互詰問之異議，應立即處分"}, "answer": "B", "explain": "依§166-7Ⅱ⑤，詰問不得對假設性事項或無證據支持的事實為之，只有在有正當理由時才例外允許，所以B說「原則上可以」是錯的。A：§166-1Ⅲ⑥規定證人、鑑定人對詰問者顯示敵意時，主詰問得誘導。C：§166-2規定反詰問範圍。D：§167-1規定審判長應立即處分異議。", "ref": "刑訴§166-7Ⅱ", "evidence": "對假設性事項或無證據支持之事實為之者"}, {"id": "113-刑事法-17", "src": "old", "year": 113, "n": 17, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於刑事訴訟法中的抗告程序，下列敘述何者正確？", "opts": {"A": "證人、鑑定人、通譯及其他非當事人受裁定者，亦得抗告", "B": "當事人對於法院之裁定有不服者，除有特別規定外，得抗告於原審法院", "C": "不得上訴於第三審法院之案件，其第二審法院所為裁定，原則上仍得抗告", "D": "抗告法院認為抗告有理由者，應以裁定將原裁定撤銷，但不得自為裁定"}, "answer": "A", "explain": "§403Ⅱ規定證人、鑑定人、通譯及其他非當事人受裁定者，也得抗告（A）。B：抗告應向「直接上級法院」提出，不是原審法院。C：依§405，不得上訴三審的案件，二審裁定不得抗告。D：依§413，抗告有理由時，法院必要時得自為裁定。", "ref": "刑訴§403、§405、§413", "evidence": "證人、鑑定人、通譯及其他非當事人受裁定者，亦得抗告。"}, {"id": "113-刑事法-18", "src": "old", "year": 113, "n": 18, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列有關鑑定程序之進行，何者錯誤？", "opts": {"A": "鑑定人因鑑定之必要，得經審判長、受命法官或檢察官之許可，檢查被告之身體", "B": "因鑑定被告心神或身體之必要而進行鑑定留置，每次 2 個月，必要時得延長 1 次", "C": "行鑑定時，如有必要，法院或檢察官得通知當事人、代理人或辯護人到場", "D": "鑑定許可書偵查中由檢察官簽名，審判中由審判長或受命法官簽名"}, "answer": "B", "explain": "依§203Ⅲ，因鑑定被告心神或身體所需，只能預定「7日以下」期間送入醫院等處所，也就是鑑定留置。延長依§203-3須由法院裁定且不得逾2月，所以B說「每次2個月」是錯的。A是§204Ⅰ的規定；C是§206-1的規定；D：依§204-1Ⅲ，許可書偵查中由檢察官簽名，審判中由審判長或受命法官簽名。", "ref": "刑訴§203Ⅲ、§203-3、§204、§204-1", "evidence": "因鑑定被告心神或身體之必要，得預定七日以下之期間，將被告送入醫院或其他適當之處所"}, {"id": "113-刑事法-19", "src": "old", "year": 113, "n": 19, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列關於刑事訴訟法中搜索扣押的敘述，何者正確？", "opts": {"A": "對於第三人之身體、物件、電磁紀錄及住宅或其他處所，僅於必要時得搜索之", "B": "搜索應用搜索票。附隨於搜索之扣押，應用押票。兩者均應由法官簽名", "C": "非附隨於搜索之扣押，除以不得為證據之物而扣押或經受扣押標的權利人同意者外，應經法官裁定", "D": "經搜索而未發見應扣押之物者，應付與證明書於受搜索人"}, "answer": "D", "explain": "§125規定經搜索而沒有發現應扣押之物時，應付與證明書給受搜索人（D）。A：對第三人搜索須「有相當理由可信為被告或應扣押之物存在時」才可以。B：扣押沒有「押票」。C：依§133-1Ⅰ，例外是「以得為證據之物」而扣押，選項寫成「不得為證據之物」。", "ref": "刑訴§125、§133-1", "evidence": "經搜索而未發見應扣押之物者，應付與證明書於受搜索人。"}, {"id": "113-刑事法-20", "src": "old", "year": 113, "n": 20, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "就被告或犯罪嫌疑人之通知及拘提，下列敘述何者錯誤？", "opts": {"A": "司法警察因調查犯罪嫌疑人犯罪情形及蒐集證據之必要，得使用通知書，通知犯罪嫌疑人到場詢問", "B": "經合法通知犯罪嫌疑人，無正當理由不到場者，司法警察官或司法警察得逕行拘提之", "C": "拘提，由司法警察或司法警察官執行，並得限制其執行之期間", "D": "司法警察或司法警察官於必要時，得於管轄區域外執行拘提，或請求該地之司法警察官執行"}, "answer": "B", "explain": "依§71-1Ⅰ，經合法通知，犯罪嫌疑人無正當理由不到場時，司法警察只能「報請檢察官核發拘票」，不能自己逕行拘提，所以B錯誤。A是同條前段的規定；C、D分別是§78、§83關於執行拘提的規定。", "ref": "刑訴§71-1", "evidence": "經合法通知，無正當理由不到場者，得報請檢察官核發拘票。"}, {"id": "113-刑事法-21", "src": "old", "year": 113, "n": 21, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列關於限制出境、出海的敘述，何者錯誤？", "opts": {"A": "被告受無罪判決者，視為撤銷限制出境、出海。但上訴期間內或上訴中，如有必要，得繼續限制出境、出海", "B": "起訴或判決後案件繫屬法院或上訴審時，原限制出境、出海所餘期間未滿 1 月者，視為撤銷限制出境、出海", "C": "偵查中之撤銷限制出境、出海，除依檢察官聲請者外，應徵詢檢察官之意見", "D": "偵查及審判中法院所為之限制出境、出海，得由法院依職權撤銷或變更之"}, "answer": "B", "explain": "依§93-3Ⅴ，起訴或判決後案件繫屬法院或上訴審時，原限制出境、出海所餘期間未滿1個月的，「延長為一月」，不是視為撤銷，所以B錯誤。A是§93-4的規定；C是§93-5Ⅱ的規定；D是§93-5Ⅳ的規定，都正確。", "ref": "刑訴§93-3Ⅴ、§93-4、§93-5", "evidence": "起訴或判決後案件繫屬法院或上訴審時，原限制出境、出海所餘期間未滿一月者，延長為一月。"}, {"id": "113-刑事法-22", "src": "old", "year": 113, "n": 22, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "根據刑事訴訟法中關於羈押的規定，下列敘述，何者正確？", "opts": {"A": "羈押於其原因消滅時，應即停止羈押，將被告釋放", "B": "案件經上訴者，被告羈押期間如已逾原審判決之刑期者，應即停止羈押，將被告釋放", "C": "羈押被告，應用押票。押票應按被告指印，並由法官簽名", "D": "羈押被告之處所，法官應勤加視察，按旬將視察情形陳報主管長官，並通知檢察官"}, "answer": "C", "explain": "依§102，羈押應用押票；押票應按被告指印，並由法官簽名（C）。A：羈押原因消滅時，應「撤銷」羈押（§107），不是停止。B：羈押期間已逾原審判決刑期時，也是撤銷羈押（§109）。D：依§106，應勤加視察並按旬陳報主管長官的是「檢察官」，並通知法院。", "ref": "刑訴§102、§106、§107、§109", "evidence": "押票，由法官簽名。"}, {"id": "113-刑事法-23", "src": "old", "year": 113, "n": 23, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列關於刑事訴訟法中第一審審判之敘述，何者正確？", "opts": {"A": "為保障當事人權益，法院於審判期日前，不得調取或命提出證物", "B": "法院就被告本人之案件調查共同被告時，該共同被告準用有關被告之規定", "C": "告訴人得於審判中委任代理人到場陳述意見。但法院認為必要時，得命本人到場", "D": "審判期日參與之法官如有更易者，應更新審判程序。參與審判期日前準備程序之法官有更易者，亦同"}, "answer": "C", "explain": "§271-1Ⅰ規定告訴人得於審判中委任代理人到場陳述意見，但法院認為必要時，得命本人到場（C）。A：§274規定法院在審判期日前得調取或命提出證物。B：依§287-2，共同被告準用「人證」的規定，不是被告的規定。D：依§292，只有參與審判期日的法官更易時，才須更新審判；參與準備程序的法官更易不在此限。", "ref": "刑訴§271-1、§287-2", "evidence": "告訴人得於審判中委任代理人到場陳述意見。但法院認為必要時，得命本人到場。"}, {"id": "113-刑事法-24", "src": "old", "year": 113, "n": 24, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於刑事訴訟法中的被害人訴訟參與程序，下列敘述，何者正確？", "opts": {"A": "訴訟參與人得選任代理人，但應於準備程序終止前提出於法院", "B": "訴訟參與人之代理人，無論是否為律師，均得代理訴訟參與人於審判中檢閱卷宗及證物並得抄錄、重製或攝影", "C": "聲請訴訟參與，應於每審級向法院提出聲請書狀", "D": "無代理人之訴訟參與人於審判中得預納費用請求付與卷宗及證物之影本，法院不得限制之"}, "answer": "C", "explain": "依§455-39，聲請訴訟參與應於每一審級向法院提出聲請書狀（C）。A：依§455-41，代理人可以「隨時」選任。B：依§455-42Ⅰ，非律師代理人不得檢閱卷證。D：依§455-42Ⅱ但書，卷證與被訴事實無關或涉及隱私等情形時，法院可以限制。", "ref": "刑訴§455-39、§455-41、§455-42", "evidence": "無代理人或代理人為非律師之訴訟參與人於審判中得預納費用請求付與卷宗及證物之影本"}, {"id": "113-刑事法-25", "src": "old", "year": 113, "n": 25, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列有關簡易程序之敘述，何者錯誤？", "opts": {"A": "簡易判決處刑之聲請與起訴具有相同效力", "B": "簡易判決之判決書與通常程序相較，得以較為簡略之方式為之", "C": "簡易判決處刑有可能完全以書面進行審理", "D": "對簡易判決處刑不服者，不得上訴"}, "answer": "D", "explain": "依§455-1Ⅰ，對簡易判決不服的，可以上訴到管轄的第二審地方法院合議庭，所以D說「不得上訴」是錯的；只有依§451-1求刑或緩刑請求所為的判決才不得上訴。A：依§451，聲請簡易判決處刑與起訴有同一效力。B：依§454，判決書可以簡略記載。C：依§449，可以不經言詞辯論、完全書面審理。", "ref": "刑訴§455-1", "evidence": "對於簡易判決有不服者，得上訴於管轄之第二審地方法院合議庭。"}, {"id": "113-刑事法-26", "src": "old", "year": 113, "n": 26, "subject": "刑事法", "topic": "消防法", "stem": "依據消防法第 4 條規定，下列何者不屬於救火個人基本裝備？", "opts": {"A": "消防衣、帽、鞋", "B": "個人救命器", "C": "胸燈", "D": "熱顯像儀"}, "answer": "D", "explain": "依直轄市縣市消防車輛裝備及其人力配置標準§3附表一「消防裝備表」，救火個人基本裝備為：消防衣帽鞋、消防頭套、個人救命器、胸燈、面罩等空氣呼吸器組、救火用手套。熱顯像儀列在「救災裝備」及緊急救援小組裝備，不屬救火個人基本裝備，所以選D。", "ref": "直轄市縣市消防車輛裝備及其人力配置標準§3附表一", "evidence": "（一）消防衣、帽、鞋。（二）消防頭套。（三）個人救命器。（四）胸燈。"}, {"id": "113-刑事法-27", "src": "old", "year": 113, "n": 27, "subject": "刑事法", "topic": "消防法", "stem": "依據消防法第 6 條規定，不屬於各類場所消防安全設備設置標準應設置火警自動警報設備之旅館、老人福利機構場所及中央主管機關公告場所之管理權人，應設置何種設備並維護之？", "opts": {"A": "住宅用火災警報器", "B": "自動撒水設備", "C": "緩降機", "D": "滅火器"}, "answer": "A", "explain": "依§6Ⅳ，不屬於設置標準應設置火警自動警報設備的旅館、老人福利機構場所及中央主管機關公告場所，其管理權人應設置並維護「住宅用火災警報器」（A）。§6Ⅴ對住宅場所也有同樣規定。違反的，依§37處罰。", "ref": "消防法§6Ⅳ", "evidence": "應設置住宅用火災警報器並維護之"}, {"id": "113-刑事法-28", "src": "old", "year": 113, "n": 28, "subject": "刑事法", "topic": "消防法", "stem": "依據消防法第 9 條規定，下列何種情形可由管理權人自行辦理消防安全設備檢修及檢修結果申報？", "opts": {"A": "高層建築物", "B": "地下建築物", "C": "一定規模以上之場所", "D": "非高層建築物、地下建築物或中央主管機關公告之場所及一定規模以上之場所，僅設有滅火器、標示設備或緊急照明燈等非系統式消防安全設備之場所"}, "answer": "D", "explain": "依§9Ⅰ：高層建築物、地下建築物或公告場所，委託檢修專業機構辦理；一定規模以上場所，委託消防設備師（士）辦理；前兩款以外、只設有滅火器、標示設備或緊急照明燈等非系統式設備的場所，才可以由管理權人自行辦理（D）。", "ref": "消防法§9Ⅰ③", "evidence": "前二款以外僅設有滅火器、標示設備或緊急照明燈等非系統式消防安全設備之場所：委託消防設備師、消防設備士或由管理權人自行辦理"}, {"id": "113-刑事法-29", "src": "old", "year": 113, "n": 29, "subject": "刑事法", "topic": "災害防救法", "stem": "為實施災害應變措施，依災害防救法規定，各級政府應依權責實施事項，下列何者正確？", "opts": {"A": "有關弱勢族群災害防救援助必要事項", "B": "協助相驗、處理罹難者屍體、遺物", "C": "對於妨礙災害應變措施之設施、物件，施以加固、移除或改善", "D": "衛生醫療、防疫及心理輔導"}, "answer": "B", "explain": "§27Ⅰ應變措施第9款為「協助相驗、處理罹難者屍體、遺物」（B）。A：有關弱勢族群災害防救援助，是§22減災事項。C：對妨礙應變措施的設施、物件施以加固、移除或改善，是§23整備事項。D：衛生醫療、防疫及心理輔導，是§37復原重建事項。", "ref": "災防法§27Ⅰ⑨", "evidence": "協助相驗、處理罹難者屍體、遺物"}, {"id": "113-刑事法-31", "src": "old", "year": 113, "n": 31, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法第 8 條規定，下列何者不屬於直轄市、縣（市）政府設直轄市、縣（市）災害防救會報之任務？", "opts": {"A": "核定各該直轄市、縣（市）地區災害防救計畫", "B": "核定重要災害防救措施及對策", "C": "核定各該鄉（鎮、市）、山地原住民區地區災害防救計畫", "D": "核定轄區內災害之緊急應變措施"}, "answer": "C", "explain": "§8規定直轄市、縣（市）災害防救會報的任務，包括核定地區災害防救計畫、重要措施及對策、轄區內災害的緊急應變措施等（A、B、D）。「核定各該鄉（鎮、市）、山地原住民區地區災害防救計畫」是§10鄉（鎮、市）、山地原住民區災害防救會報的任務，所以選C。", "ref": "災防法§8、§10", "evidence": "核定各該鄉（鎮、市）、山地原住民區地區災害防救計畫"}, {"id": "113-刑事法-32", "src": "old", "year": 113, "n": 32, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法第 13 條規定，重大災害發生或有發生之虞時，中央災害防救業務主管機關首長應視災害之規模、性質、災情、影響層面及緊急應變措施等狀況，決定中央災害應變中心開設時機及其分級，試問若發生土石流及大規模崩塌災害時，應由下列那一部會首長決定中央災害應變中心開設時機及其分級？", "opts": {"A": "內政部", "B": "經濟部", "C": "行政院農業委員會（現為農業部）", "D": "交通部"}, "answer": "C", "explain": "依§3Ⅰ③，寒害、土石流及大規模崩塌災害、森林火災、動植物疫災的中央災害防救業務主管機關是農業部（原行政院農業委員會），所以選C。風災、震災、火災、爆炸是內政部；水災、旱災是經濟部；空難、海難、陸上交通事故是交通部。", "ref": "災防法§3Ⅰ③、§13", "evidence": "寒害、土石流及大規模崩塌災害、森林火災、動植物疫災：農業部"}, {"id": "113-刑事法-33", "src": "old", "year": 113, "n": 33, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法第 20 條規定，直轄市、縣（市）政府應依災害防救基本計畫、相關災害防救業務計畫及地區災害潛勢特性，擬訂地區災害防救計畫，經各該災害防救會報核定後實施，並報中央災害防救會報備查。另直轄市、縣（市）政府應配合地區災害防救計畫調整下列那一項計畫？", "opts": {"A": "土地使用計畫", "B": "防災計畫", "C": "搶救計畫", "D": "安置計畫"}, "answer": "A", "explain": "依§20Ⅲ，直轄市、縣（市）政府應配合地區災害防救計畫調整「土地使用計畫」（A），讓國土利用與災害潛勢相互配合。地區災害防救計畫經會報核定後實施，並報中央災害防救會報備查。", "ref": "災防法§20Ⅲ", "evidence": "直轄市、縣（市）政府應配合地區災害防救計畫調整土地使用計畫。"}, {"id": "113-刑事法-34", "src": "old", "year": 113, "n": 34, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法規定，有關「警戒區域劃設、交通管制、秩序維持及犯罪防治」係屬於下列那一階段之措施？", "opts": {"A": "減災", "B": "整備", "C": "應變", "D": "復原"}, "answer": "C", "explain": "「警戒區域劃設、交通管制、秩序維持及犯罪防治」是§27Ⅰ第2款規定的災害應變措施（C）。減災看§22，整備看§23，復原重建看§37。本款由各級政府依權責實施，並列入各該災害防救計畫（§27Ⅱ）；警察機關是主要執行單位。", "ref": "災防法§27Ⅰ②", "evidence": "警戒區域劃設、交通管制、秩序維持及犯罪防治"}, {"id": "113-刑事法-35", "src": "old", "year": 113, "n": 35, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法規定，下列敘述何者錯誤？", "opts": {"A": "依災害防救法執行徵調、徵用、徵購或優先使用，應給予適當之補償；其作業程序、補償基準、給付方式及其他相關事項之辦法，由行政院主計總處定之", "B": "人民因災害防救法第 24 條第 2 項、第 30 條第 1 項第 1 款至第 3 款、第 7 款與第 11 款之處分、強制措施或命令及第 31 條第 1 項命保管之處分，致其財產遭受損失時，得請求補償。但因可歸責於該人民之事由者，不在此限", "C": "各級政府得為依災害防救法執行災害防救事項人員、受徵調之相關專門職業、技術人員及所徵用物資之操作人員投保相關保險", "D": "各級政府對於救災所需必要物資之製造、運輸、販賣、保管、倉儲業者，得徵用、徵購或命其保管"}, "answer": "A", "explain": "依§33，執行徵調、徵用、徵購或優先使用時的補償辦法由「內政部」訂定，不是行政院主計總處，所以A錯誤。B是§34Ⅰ的規定；C是§32的規定；D是§31Ⅰ的規定，都正確。", "ref": "災防法§33", "evidence": "其作業程序、補償基準、給付方式及其他相關事項之辦法，由內政部定之"}, {"id": "113-刑事法-36", "src": "old", "year": 113, "n": 36, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法第 39 條規定，因災害發生，致聯絡受災地區交通中斷或公共設施毀壞有危害民眾之虞，各級政府為立即執行搶通或重建工作，如經過都市計畫區、山坡地、森林、河川、國家公園或其他有關區域，得簡化行政程序，不受區域計畫法、都市計畫法、水土保持法、山坡地保育利用條例、森林法、水利法、國家公園法及其他有關法律或法規命令之限制。前項簡化行政程序、不受有關法律或法規命令限制相關事項之辦法，應由下列何者定之？", "opts": {"A": "行政院", "B": "立法院", "C": "內政部", "D": "中央災害防救業務主管機關"}, "answer": "D", "explain": "依§39Ⅱ，受災地區搶通或重建時，簡化行政程序、不受相關法律或法規命令限制的辦法，由「各該中央災害防救業務主管機關」訂定（D），不是行政院或內政部統一訂定。§40安置受災民眾的簡化程序也是同樣設計。", "ref": "災防法§39Ⅱ", "evidence": "前項簡化行政程序、不受有關法律或法規命令限制相關事項之辦法，由各該中央災害防救業務主管機關定之。"}, {"id": "113-刑事法-37", "src": "old", "year": 113, "n": 37, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法第 41 條規定，中央災害防救委員會應協調金融機構，就受災地區民眾所需重建或修繕資金，予以低利貸款。前項貸款金額、利息補貼額度及作業程序應報請下列何者核定之？", "opts": {"A": "金融監督管理委員會", "B": "財政部", "C": "中央災害防救會報", "D": "國稅局"}, "answer": "C", "explain": "依§41，中央災害防救委員會協調金融機構，提供受災民眾重建或修繕的低利貸款；貸款金額、利息補貼額度及作業程序，應報請「中央災害防救會報」核定（C）。利息補貼額度由各級政府編列預算執行。", "ref": "災防法§41Ⅱ", "evidence": "前項貸款金額、利息補貼額度及作業程序應報請中央災害防救會報核定之"}, {"id": "113-刑事法-38", "src": "old", "year": 113, "n": 38, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法第 46～48 條規定，下列何者正確？", "opts": {"A": "災區受災之農民健康保險、國民年金保險、勞工保險及就業保險被保險人，於災後一定期間內應負擔之保險費，由地方政府支應", "B": "災區低收入戶未申請政府優惠融資或其他補助，經金融機構核放創業融資貸款者，得由衛生福利部對承辦該貸款之金融機構補貼利息，其貸款金額不得超過新臺幣 150 萬元", "C": "勞工保險被保險人因天然災害致傷病者，得請領傷病給付，其所需經費，由地方政府支應", "D": "災區之農地、漁塭及其他農業相關設施向金融機構貸款之擔保品全部毀損或滅失者，其擔保品得由金融機構依貸款餘額予以承受。金融機構依前項規定承受者，由政府就其承受金額最高九成之範圍內予以補助"}, "answer": "B", "explain": "§47規定災區低收入戶經金融機構核放創業融資貸款時，由衛福部補貼利息，貸款金額不得超過150萬元（B）。A、C：依§46，保險費及傷病給付經費都由「中央政府」支應。D：依§48Ⅱ，政府補助的是承受金額「最高八成」，不是九成。", "ref": "災防法§47Ⅰ、§46、§48", "evidence": "得由衛生福利部對承辦該貸款之金融機構補貼利息，其貸款金額不得超過新臺幣一百五十萬元"}, {"id": "113-刑事法-39", "src": "old", "year": 113, "n": 39, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法第 62 條規定，對於因災害失蹤之人，有事實足認其確已因災死亡而未發現其屍體者，法院得依利害關係人或何人之聲請，確定其死亡及死亡之時間？", "opts": {"A": "檢察官", "B": "警察", "C": "法官", "D": "律師"}, "answer": "A", "explain": "依§62Ⅰ，因災害失蹤、有事實足認確已因災死亡但未發現屍體的人，法院得依利害關係人或「檢察官」的聲請，確定其死亡及死亡時間（A）。聲請應於災害發生後1年內為之，這個期間也常考。", "ref": "災防法§62Ⅰ", "evidence": "法院得依利害關係人或檢察官之聲請，確定其死亡及死亡之時間"}, {"id": "113-刑事法-40", "src": "old", "year": 113, "n": 40, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法第 64 條規定，協助執行災害應變措施之災害防救團體或災害防救志願組織，應向直轄市、縣（市）政府申請登錄，下列相關事項何者錯誤？", "opts": {"A": "其申請登錄資格為成員在 20 人以上", "B": "其申請登錄資格為成員依直轄市、縣（市）政府或中央目的事業主管機關所定課程及時數，取得專業訓練合格證明者", "C": "其成員訓練由直轄市、縣（市）政府或經其認可之具相關救災專業之機關、團體或學校辦理之", "D": "災害防救團體或災害防救志願組織申請登錄時，跨直轄市、縣（市）轄區者，不得申請登錄"}, "answer": "D", "explain": "依災害防救團體或災害防救志願組織登錄辦法§2，申請資格為成員20人以上、成員取得專業訓練合格證明，訓練由直轄市、縣（市）政府或經認可的機關、團體、學校辦理（A、B、C 正確）。§3規定跨直轄市、縣（市）轄區者，依轄區劃分後向各轄區政府提出，並非不得申請登錄，D錯。", "ref": "災害防救法§64；災害防救團體或災害防救志願組織登錄辦法§2、§3", "evidence": "跨直轄市、縣（市）轄區者，應依直轄市、縣（市）轄區劃分後，向轄區直轄市、縣（市）政府提出"}, {"id": "113-刑事法-41", "src": "old", "year": 113, "n": 41, "subject": "刑事法", "topic": "消防法", "stem": "下列有關消防法及其施行細則之敘述，何者正確？", "opts": {"A": "主管機關：在中央為內政部消防署", "B": "消防栓設置以採用地上雙口式為限", "C": "直轄市、縣（市）政府，應每年定期舉辦防火教育及宣導", "D": "直轄市、縣（市）消防車輛、裝備及其人力配置標準，由直轄市、縣（市）主管機關定之"}, "answer": "C", "explain": "依§5，直轄市、縣（市）政府應「每年」定期舉辦防火教育及宣導（C）。A：中央主管機關是內政部（§3）。B：施行細則§9規定消防栓以採用地上雙口式「為原則」，不是「為限」。D：依§4，消防車輛、裝備及人力配置標準由「中央主管機關」訂定。", "ref": "消防法§5、§3、§4、細則§9", "evidence": "直轄市、縣（市）政府，應每年定期舉辦防火教育及宣導"}, {"id": "113-刑事法-42", "src": "old", "year": 113, "n": 42, "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，消防指揮人員搶救工廠火災時，有關工廠管理權人之必要作為，下列敘述何者錯誤?", "opts": {"A": "提供廠區化學品產地", "B": "提供廠區化學品種類", "C": "提供廠區化學品數量", "D": "提供廠區化學品位置平面配置圖"}, "answer": "A", "explain": "依§21-1Ⅰ，工廠火災時管理權人應提供場所平面配置圖及搶救必要資訊，以及化學品的「種類、數量、位置平面配置圖」，並立即指派專人到現場協助救災。化學品的「產地」與搶救無關，不在法定應提供事項中，所以選A。", "ref": "消防法§21-1Ⅰ②", "evidence": "提供該場所化學品之種類、數量、位置平面配置圖及搶救必要資訊"}, {"id": "113-刑事法-43", "src": "old", "year": 113, "n": 43, "subject": "刑事法", "topic": "消防法", "stem": "某場所設置未經認可或未附加認可標示之消防器具、器材或設備，可處新臺幣多少元的罰鍰？", "opts": {"A": "6 千元以上 10 萬元以下", "B": "1 萬元以上 5 萬元以下", "C": "2 萬元以上 10 萬元以下", "D": "3 萬元以上 15 萬元以下"}, "answer": "C", "explain": "依§39Ⅰ，銷售或設置未經認可或未附加認可標示的消防機具、器材、設備，處2萬元以上10萬元以下罰鍰，並得按次處罰（C）。如果只是「陳列」，經勸導仍不改善，則處1萬～5萬元，兩者要區分。", "ref": "消防法§39Ⅰ、§12Ⅰ", "evidence": "銷售或設置未經認可或未附加認可標示之消防器具、器材或設備者，處新臺幣二萬元以上十萬元以下罰鍰"}, {"id": "113-刑事法-44", "src": "old", "year": 113, "n": 44, "subject": "刑事法", "topic": "消防法", "stem": "督導轄內工廠，發現防火管理人任職期間未定期接受複訓，這種狀況屬於何種違規情形？", "opts": {"A": "輕微違規", "B": "一般違規", "C": "嚴重違規", "D": "逕行處罰違規"}, "answer": "B", "explain": "依§13Ⅶ，防火管理人任職期間應定期接受複訓。違反者屬於§40Ⅲ④的情形，須先經通知限期改善，屆期未改善才處2萬～10萬元罰鍰，屬「一般違規」（B）。和「未遴用防火管理人」這種直接處罰的較重違規不同。", "ref": "消防法§13Ⅶ、§40Ⅲ④", "evidence": "防火管理人或共同防火管理人非該場所之管理或監督層次人員，或任職期間未定期接受複訓"}, {"id": "113-刑事法-45", "src": "old", "year": 113, "n": 45, "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法之規定，有關中央災害防救會報敘述，下列何者正確？", "opts": {"A": "置召集人 1 人，由行政院副院長兼任", "B": "委員任期 2 年", "C": "任務包括：推動社區、部落災害防救事宜", "D": "委員人數：26 人"}, "answer": "B", "explain": "依中央災害防救會報設置要點（113年3月19日修正）第三點，委員任期2年，連聘得連任（B 正確）。A 錯：依災防法§7Ⅰ，召集人由行政院院長兼任，副院長是副召集人；C 錯：推動社區、部落災害防救是鄉（鎮、市）會報的任務；D 錯：委員為28至32人。", "ref": "災害防救法§7Ⅰ；中央災害防救會報設置要點第三點", "evidence": "本會報委員任期二年，連聘得連任。"}, {"id": "113-刑事法-46", "src": "old", "year": 113, "n": 46, "subject": "刑事法", "topic": "消防法", "stem": "下列有關防焰物品之敘述，何者正確？", "opts": {"A": "地面樓層達 9 層以上建築物，管理權人應使用", "B": "面積 2 平方公尺以上門墊及地墊之地坪鋪設物", "C": "室外展示用廣告合板", "D": "投影銀幕布"}, "answer": "B", "explain": "依防焰性能認證實施辦法§2，地毯類包括面積2平方公尺以上門墊及地墊的地坪鋪設物（B 正確）；展示用廣告板限「室內」展示用廣告合板及舞臺道具用合板（C 錯）；布幕限舞臺或攝影棚使用的布幕，不含投影銀幕布（D 錯）。A 錯：依消防法§11，應使用防焰物品的是地面樓層達11層以上建築物。", "ref": "消防法§11Ⅰ；防焰性能認證實施辦法§2", "evidence": "（三）面積二平方公尺以上門墊及地墊之地坪鋪設物。"}, {"id": "113-刑事法-47", "src": "old", "year": 113, "n": 47, "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，經營家用液化石油氣零售事業者未置領有合格證書之安全技術人員，執行供氣檢查，處新臺幣多少元的罰鍰？", "opts": {"A": "6 千元以上 10 萬元以下", "B": "1 萬元以上 5 萬元以下", "C": "2 萬元以上 10 萬元以下", "D": "2 萬元以上 30 萬元以下"}, "answer": "C", "explain": "依§15-2，零售業者應設置安全技術人員執行供氣檢查。未設置領有合格證書的安全技術人員的，依§42-3Ⅰ①處2萬元以上10萬元以下罰鍰，並通知限期改善（C）。如果是安全技術人員任職期間未定期複訓，則依§42-4處3千～1萬5千元。", "ref": "消防法§42-3Ⅰ①、§15-2", "evidence": "零售業者違反第十五條之二第一項規定，未置領有合格證書之安全技術人員"}, {"id": "113-刑事法-48", "src": "old", "year": 113, "n": 48, "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，下列何者為海難災害之中央災害防救業務主管機關？", "opts": {"A": "交通部", "B": "環境部", "C": "海洋委員會", "D": "海洋委員會海巡署"}, "answer": "A", "explain": "依§3Ⅰ④，空難、海難、陸上交通事故的中央災害防救業務主管機關是交通部（A）。海洋委員會及海巡署不是海難的業務主管機關；環境部主管的是毒性及關注化學物質災害、懸浮微粒物質災害。", "ref": "災防法§3Ⅰ④", "evidence": "空難、海難、陸上交通事故：交通部"}, {"id": "113-刑事法-49", "src": "old", "year": 113, "n": 49, "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，風災災害應變中心開設期間，違反規定擅自登山，處新臺幣多少元的罰鍰？", "opts": {"A": "3 萬元以上 15 萬元以下", "B": "5 萬元以上 25 萬元以下", "C": "10 萬元以上 50 萬元以下", "D": "30 萬元以上 50 萬元以下"}, "answer": "B", "explain": "風災應變中心開設後，指揮官依§30Ⅰ②劃定警戒區域（例如封山），限制或禁止人民進入。擅自登山屬於未取得臨時通行證而進入警戒區域，依§55②處5萬元以上25萬元以下罰鍰（B）。", "ref": "災防法§55②", "evidence": "處新臺幣五萬元以上二十五萬元以下罰鍰"}, {"id": "113-刑事法-50", "src": "old", "year": 113, "n": 50, "subject": "刑事法", "topic": "災害防救法", "stem": "災害防救法所稱公共事業，指經中央目的事業主管機關指定之事業，下列何者錯誤？", "opts": {"A": "大眾傳播事業", "B": "運輸業", "C": "石油業", "D": "液化石油氣業"}, "answer": "D", "explain": "依災害防救法施行細則§3，公共事業指經中央目的事業主管機關指定的大眾傳播事業、電業、自來水事業、電信事業、天然氣事業、石油業、運輸業及其他事業。「液化石油氣業」不在列舉範圍，所以選D。", "ref": "災防法施行細則§3", "evidence": "指經中央目的事業主管機關指定之大眾傳播事業、電業、自來水事業、電信事業、天然氣事業、石油業、運輸業及其他事業"}, {"id": "113-國文-01", "src": "old", "year": 113, "n": 1, "subject": "國文", "topic": "國文", "stem": "下列文句，沒有語病的選項為何？", "opts": {"A": "儘管爸媽如何指責小華，他好吃懶做的習慣總是不改", "B": "小美這次處罰的原因是因為小美今天忘記帶她的作業", "C": "政府為了達成能源轉型目標，將提高天然氣供電的比例", "D": "誰也不能否認整潔的生活環境不是靠人人共同認真維護整潔而來"}, "answer": "C", "explain": "C 語意通順無誤。A「儘管」表讓步，不能搭配「如何」，應改「不管／無論爸媽如何指責」；B「處罰」應為被動「被處罰」，且「原因是因為」語意重複；D「不能否認……不是……」多重否定使語意變成否定環境靠共同維護，應刪去「不」字。", "ref": "語病辨析", "evidence": ""}, {"id": "113-國文-02", "src": "old", "year": 113, "n": 2, "subject": "國文", "topic": "國文", "stem": "「思想，先在作者的腦袋安靜運轉，如果印刷成書，影響力就能向不特定的遠方展開——煽動共同的情感、甚至誘發集體的行動。印刷，正是思想的載體。印刷成書，傳統漢語世界稱作『刊行』或『付梓』，現代的專業概念則是『出版』。二詞似可混用，但其實在印刷發展史卻是不同的二件事。『刊』是拿刀將木材剉去廢料，留下有字的板即為『梓』，合起來就是雕版印刷（woodblock print）；而『出版』則翻譯自英文的 publish，原義是 make public（訴諸公眾），必須要快速大量，就得仰賴活字印刷（type print）的效力了。活字印刷雖然由北宋時代的畢昇所發明，但因傳統漢字文書不講時效、流通量不大，因此活字印刷反不如雕版印刷划算。所以元、明、清三朝七百餘年間，幾乎都是雕版刊行，只有極少數特殊案例使用活字印刷（例如《古今圖書集成》）。」根據上文，下列選項何者最不符合文意？", "opts": {"A": "作者將作品印刷成書，目的之一是為藉由書籍對不特定的讀者產生影響力", "B": "今日的「出版」一詞，翻譯自英文的 publish，原義是 make public（訴諸公眾）", "C": "傳統漢語詞彙中的「刊行」、「付梓」二詞，其詞義的詞源比較貼合雕版印刷", "D": "前人「刊行」、「付梓」二詞與今日的「出版」一詞，在詞義與使用上不曾混用"}, "answer": "D", "explain": "文中明言「刊行」「付梓」與「出版」「二詞似可混用」，只是在印刷發展史上是不同的兩件事，故 D「不曾混用」最不符文意。A 對應「影響力就能向不特定的遠方展開」；B 對應 publish 原義 make public；C「刊」剉木、「梓」為字板，合起來即雕版印刷，皆符合文意。", "ref": "文意判讀", "evidence": ""}, {"id": "113-國文-03", "src": "old", "year": 113, "n": 3, "subject": "國文", "topic": "國文", "stem": "承上題，下列選項所述，何者最不符合文意？", "opts": {"A": "北宋畢昇發明活字印刷術後，未能立刻成為近代書籍出版的主要方式", "B": "元、明、清三朝七百餘年間的書籍，因成本考量，幾乎都是雕版刊行", "C": "清人陳夢雷所編輯的《古今圖書集成》是以活字印刷的漢籍代表作之一", "D": "現今書籍，為了訴諸公眾，且必須要快速大量，應善用活字印刷的效力"}, "answer": "D", "explain": "文中只說出版因需快速大量而「得仰賴活字印刷的效力」，是說明「出版」一詞的歷史背景，並未主張現今書籍應善用活字印刷，D 最不符文意。A 活字印刷不如雕版划算故未普及；B 元明清「幾乎都是雕版刊行」；C《古今圖書集成》為少數活字特例，皆符合文意。", "ref": "文意判讀", "evidence": "", "passage": "「思想，先在作者的腦袋安靜運轉，如果印刷成書，影響力就能向不特定的遠方展開——煽動共同的情感、甚至誘發集體的行動。印刷，正是思想的載體。印刷成書，傳統漢語世界稱作『刊行』或『付梓』，現代的專業概念則是『出版』。二詞似可混用，但其實在印刷發展史卻是不同的二件事。『刊』是拿刀將木材剉去廢料，留下有字的板即為『梓』，合起來就是雕版印刷（woodblock print）；而『出版』則翻譯自英文的 publish，原義是 make public（訴諸公眾），必須要快速大量，就得仰賴活字印刷（type print）的效力了。活字印刷雖然由北宋時代的畢昇所發明，但因傳統漢字文書不講時效、流通量不大，因此活字印刷反不如雕版印刷划算。所以元、明、清三朝七百餘年間，幾乎都是雕版刊行，只有極少數特殊案例使用活字印刷（例如《古今圖書集成》）。」"}, {"id": "113-國文-04", "src": "old", "year": 113, "n": 4, "subject": "國文", "topic": "國文", "stem": "「兩個外型與顏色一模一樣的物件，要分辨其中的不同，大概就是質地。奇妙的是質地還會影響顏色與形狀，使同型同款的設計出現可以分辨的細微差異。一塊人造石做成的玄關桌，只要在真的石材邊一靠或用手一摸，光澤與溫度就無法矇騙你的感覺。一塊同色的綢靠墊、絨靠墊或棉靠墊，反光與受光的條件都不同，除了影響所見的輪廓，也影響與其他物件的搭配。至於品質則是檢視整體之後的評價，各種物件關係是否合適，呈現一個空間的設計品質。掌握物件的質地，考量施作後的質感，就算是常見普通的材質，還是能改變空間的品質，提升整體價值。」根據上文，下列選項何者正確？", "opts": {"A": "物件搭配影響設計品質", "B": "物件品質決定空間設計", "C": "質地的粗細與品質無關", "D": "顏色外形決定物件質地"}, "answer": "A", "explain": "文中說品質是「檢視整體之後的評價，各種物件關係是否合適，呈現一個空間的設計品質」，即物件搭配影響設計品質，選 A。B 倒因為果，空間品質由整體關係決定；C 文中說掌握質地能改變空間品質，二者有關；D 文中是說質地影響顏色與形狀，因果顛倒。", "ref": "文意判讀", "evidence": ""}, {"id": "113-國文-05", "src": "old", "year": 113, "n": 5, "subject": "國文", "topic": "國文", "stem": "「白粥又有一種平靜之美，一種謙遜的態度，淡泊，不張揚；一種閑適感。它像不器的君子，有著非常寬闊的胸襟，接納各種海陸食材。粥是生活的底色，可鹹可甜可稠可稀，又幾乎百搭，繁簡皆宜，任何菜餚在它面前都被贊揚了……最令人驚嘆的至味，是自然樸實的滋味，並非有心輕富貴；是不浮誇、不雕飾的清淡味道。裡面往往藏著深沉的感情。」根據上文，下列最適合用來說明「粥」特色的是：", "opts": {"A": "底層人民的樸實滋味", "B": "無所不容的含蓄味道", "C": "歷史悠久的沉厚之味", "D": "繁華落盡的豐盛至味"}, "answer": "B", "explain": "文中形容白粥「謙遜」「淡泊，不張揚」，又「像不器的君子，有著非常寬闊的胸襟，接納各種海陸食材」「幾乎百搭」，兼具包容與含蓄，選 B。A「底層人民」文中未提；C 未談歷史；D「豐盛」與「清淡」「不浮誇」相違。", "ref": "文意判讀", "evidence": ""}, {"id": "113-國文-06", "src": "old", "year": 113, "n": 6, "subject": "國文", "topic": "國文", "stem": "「世界上並不存在『最難』的語言，語言的學習困難度是相對的，要看它在族譜上，跟你的『母語』距離遠近而定。比方說，母語為臺語的人學習客家話或是國語，因為同樣是漢語方言，語法結構較相近，就會比較容易；又比如，因為日語在漢字上借用中文字，以日文為母語的人，學習中文字也會比英文為母語的人來得快速。」下列選項，何者最符合上文主旨？", "opts": {"A": "日本人學習中文比英文快", "B": "漢語方言包括臺語、客家話和國語", "C": "語言的學習難度取決於與母語的距離", "D": "學習語言的速度因個人的經驗和方法而異"}, "answer": "C", "explain": "首句即主旨：語言學習困難度是相對的，「要看它在族譜上，跟你的『母語』距離遠近而定」，選 C。A 是舉例且說法錯誤（原文是日語母語者學中文字比英語母語者快）；B 只是例證中的細節；D 個人經驗與方法文中未提。", "ref": "文意判讀", "evidence": ""}, {"id": "113-國文-07", "src": "old", "year": 113, "n": 7, "subject": "國文", "topic": "國文", "stem": "「行程第二天，小憩一家位於旗山的香蕉創意工坊，年輕的店主人為我們介紹香蕉品種，如何製作香蕉蛋糕、釀造香蕉酵素，一份非常平常的手冊，折口處以生動文案介紹旗山小鎮特色商店。我想起『社區營造』除環境美化妝點之外，另一個啟程是『在地創造』與『青年返鄉』，這兩者相輔相成，難以區分誰先、誰後。工坊以扼要但生動的 DM 為索引，出版小鎮特色旅遊書。我一邊試吃試飲，一邊震驚。」根據上文，下列選項何者正確？", "opts": {"A": "香蕉創意工坊的 DM 內容豐富翔實，成功扭轉了旗山小鎮的形象", "B": "作者覺得店主已經掌握了「社區營造」中「在地創造」的精神核心", "C": "作者感到震驚的主因，來自對年輕店主出版小鎮特色旅遊書的讚賞", "D": "香蕉創意工坊安排遊客實際體驗製作香蕉蛋糕與釀造香蕉酵素等活動"}, "answer": "B", "explain": "作者由工坊聯想到社區營造的「在地創造」與「青年返鄉」，年輕店主介紹在地香蕉產品並出版小鎮旅遊書，可見已掌握在地創造的精神，選 B。A DM 是「扼要」且「非常平常的手冊」，非豐富翔實，也未說扭轉形象；C 震驚原因文中未明言只因出書；D 店主是「介紹」如何製作，並非安排遊客體驗。", "ref": "文意判讀", "evidence": ""}, {"id": "113-國文-08", "src": "old", "year": 113, "n": 8, "subject": "國文", "topic": "國文", "stem": "「人工智慧和數位人文都是數位時代的重要領域，二者有著不同的焦點。人工智慧的焦點在於如何開發和應用智能系統，以模擬或超越人類智能，並應用於自動化、預測和決策等領域。而數位人文的焦點在於如何利用數位技術和工具，探索和研究人類文化、歷史和社會議題，並為人文學科的研究和教育帶來創新。但兩者也有許多交集，特別是在數據分析和可視化方面，這為跨學科合作和創新提供了很好的機會。」下列選項何者最接近本文意旨？", "opts": {"A": "人工智慧和數位人文的定義及發展", "B": "人工智慧在自動化、預測和決策等領域的應用", "C": "數位人文在研究人類文化、歷史和社會議題方面的創新方法", "D": "人工智慧和數位人文在數據分析和可視化方面的交集和合作"}, "answer": "D", "explain": "文章先分述兩者焦點不同，再以「但兩者也有許多交集，特別是在數據分析和可視化方面，這為跨學科合作和創新提供了很好的機會」收束，重點在交集與合作，選 D。A 文中未談發展歷程；B、C 各只是兩者焦點的分述，屬局部內容。", "ref": "文意判讀", "evidence": ""}, {"id": "113-國文-09", "src": "old", "year": 113, "n": 9, "subject": "國文", "topic": "國文", "stem": "「第二次世界大戰戰敗後，德國分裂為自由主義的西德，以及社會主義的東德。由於大量人口戰死，戰後西德重建必須大量引進外國勞工，彌補勞動力的不足。原本是從南歐及東歐招攬人力，不過柏林圍牆（一九六一年）建立後，除了南斯拉夫以外就再也沒有其他來自東歐的移工了。為填補空缺，西德將勞工來源鎖定土耳其。第一次世界大戰戰敗以來，土耳其經濟成長並不順利，西部與東部、沿岸與內陸之間有嚴重的貧富差距。直到現在土國政府依然帶頭鼓勵當地人民出國工作。雙方一拍即合，在柏林圍牆建立的那一年，土耳其與德國政府之間簽訂了勞工招募協定。原本勞動力流動是很自然的事，不過一九七三年第四次中東戰爭爆發，並釀成第一次石油危機後，連帶也改變了人口流向。」根據上文，下列敘述符合文意的是：", "opts": {"A": "柏林圍牆使得東德重建受阻", "B": "人才與勞動力的跨國移動並非正常", "C": "第四次中東戰爭影響前往西德的土耳其勞動力", "D": "第二次世界大戰後土耳其已克服國內貧富差距問題"}, "answer": "C", "explain": "文末指出 1973 年第四次中東戰爭引發石油危機後，「連帶也改變了人口流向」，即影響土耳其勞工前往西德，選 C。A 文中說圍牆使東歐移工無法到西德，非東德重建受阻；B 文中說「勞動力流動是很自然的事」；D 文中說土耳其「直到現在」仍鼓勵出國工作，貧富差距未解。", "ref": "文意判讀", "evidence": ""}, {"id": "113-國文-10", "src": "old", "year": 113, "n": 10, "subject": "國文", "topic": "國文", "stem": "「蓮產業最怕的天災是颱風，蟲害是薊馬，薊馬會啃食荷葉使其發育不良，影響光合作用生成澱粉的效益，嚴重時會使蓮藕欠收。友善耕作能在生態多樣性與產量間取得平衡，因此透過安全用藥與微生物菌進行病蟲害防治，保留田埂的草生環境，讓益蟲來制衡害蟲數量，並將水產養殖的知識用以製作液肥與育種，有效提高蓮藕的品質與產量。」根據上文，下列敘述何者最適當？", "opts": {"A": "農家結合跨域知識與生態環境平衡能夠有效防蟲", "B": "薊馬對蓮產業所帶來的病蟲傷害比颱風更為強大", "C": "友善耕作能加速光合作用，增加澱粉生成的效益", "D": "運用水產養殖知識製作液肥，藉以滅蟲提高產能"}, "answer": "A", "explain": "文中說友善耕作保留田埂草生環境讓益蟲制衡害蟲，並運用水產養殖知識製作液肥，兼顧生態平衡與跨域知識以防治蟲害，選 A。B 文中說「最怕的天災是颱風，蟲害是薊馬」，未比較強弱；C 友善耕作是防蟲以免光合作用受影響，非加速光合作用；D 液肥用於施肥育種，非滅蟲。", "ref": "文意判讀", "evidence": ""}, {"id": "113-法學-01", "src": "old", "year": 113, "n": 1, "subject": "法學", "topic": "憲法", "stem": "刑法第 310 條第 3 項前段規定：「對於所誹謗之事，能證明其為真實者，不罰。」依相關司法院大法官解釋及憲法法庭判決，下列敘述何者正確？", "opts": {"A": "行為人須自行證明其言論內容確屬真實，始得免於刑責", "B": "行為人明知其為不實或對於真實與否抱持輕率之疏忽者，才負誹謗之責", "C": "行為人於發表前經合理查證程序，依所取得之證據資料，客觀上可合理相信其言論內容為真實者，不罰", "D": "保護個人名譽應以民事責任為之，加諸刑罰已逾越必要限度"}, "answer": "C", "explain": "112年憲判字第8號補充釋字第509號：行為人雖不能證明言論為真實，但依其於發表前之合理查證程序，依所取得之證據資料，客觀上可合理相信其言論內容為真實者，即屬合於刑法第310條第3項前段，不罰，選C。A要求被告自證真實已被否定；B「真正惡意」原則非判決所採標準；D刑罰規定仍屬合憲。", "ref": "112年憲判字第8號；釋字第509號", "evidence": ""}, {"id": "113-法學-02", "src": "old", "year": 113, "n": 2, "subject": "法學", "topic": "憲法", "stem": "依司法院釋字第 711 號解釋，原藥師法第 11 條規定：「藥師經登記領照執業者，其執業處所應以一處為限。」違反下列何項原則？", "opts": {"A": "明確性原則", "B": "平等原則", "C": "比例原則", "D": "不當連結禁止原則"}, "answer": "C", "explain": "釋字第711號認原藥師法第11條規定藥師執業處所一律以一處為限，未就藥師於不同地點執業之例外情形（如支援偏鄉、醫療機構）設合理規範，對藥師工作權之限制已逾必要程度，違反憲法第23條比例原則，選C。本題並非因不明確或差別待遇而違憲。", "ref": "釋字第711號；憲法§23", "evidence": ""}, {"id": "113-法學-03", "src": "old", "year": 113, "n": 3, "subject": "法學", "topic": "憲法", "stem": "依司法院釋字第 499 號解釋，下列何種憲法條文，不得任意修改，以免破毀憲法所形成之整體自由民主憲政規範秩序？", "opts": {"A": "具有本質重要性", "B": "間接民主規範性", "C": "國家元首尊嚴性", "D": "五權分權絕對性"}, "answer": "A", "explain": "釋字第499號指出憲法條文中，諸如第一章基本原則之民主共和國原則、國民主權原則、保障人民權利及有關權力分立與制衡之原則，具有本質之重要性，為憲法整體基本原則之所在，不得任意修改，否則破毀憲政秩序而使修憲失其正當性，選A。其餘選項均非解釋文用語。", "ref": "釋字第499號", "evidence": ""}, {"id": "113-法學-04", "src": "old", "year": 113, "n": 4, "subject": "法學", "topic": "憲法", "stem": "學說上有認為憲法「基本國策」之規定具有「國家目標條款」之性質。下列關於「國家目標條款」之敘述，何者錯誤？", "opts": {"A": "國家目標條款除規定於憲法本文外，亦規定於憲法增修條文", "B": "國家目標條款所規定的內容，就是具體化的公共利益，可據以指出所有國家行為應遵循之方向", "C": "國家目標條款如何實踐，主要仰賴於立法者來具體型塑，立法者在此享有高度自由", "D": "國家目標條款賦予人民可據以請求司法實現的主觀公權利"}, "answer": "D", "explain": "國家目標條款規定於憲法本文第十三章基本國策及增修條文第10條（A正確），揭示國家行為應遵循之方向（B正確），其實現主要仰賴立法者形成，立法者享有高度形成自由（C正確）。國家目標條款僅具客觀法規範效力，原則上不賦予人民得據以請求司法實現之主觀公權利，D錯誤當選。", "ref": "憲法第十三章；增修條文§10", "evidence": ""}, {"id": "113-法學-05", "src": "old", "year": 113, "n": 5, "subject": "法學", "topic": "憲法", "stem": "因對抗新冠肺炎需投入大量第一線醫療人員防疫，因此衛生福利部下令醫事人員 A 禁止出國，以及從外國入境臺灣之 B 旅客須於防疫旅館隔離 14 天。請問 A、B 兩人之何種基本權受到干預？", "opts": {"A": "對 A 與 B 均構成其人身自由之干預", "B": "對 A 干預了人身自由，對 B 干預了遷徙自由", "C": "對 A 干預了遷徙自由，對 B 干預了人身自由", "D": "對 A 干預了遷徙自由，對 B 干預了隱私權"}, "answer": "C", "explain": "禁止醫事人員A出國，限制其自由出入國境，干預憲法第10條遷徙自由（釋字第443號、第558號）；要求入境旅客B於防疫旅館隔離14天，使其身體行動受拘束於特定處所，屬人身自由之干預（釋字第690號），故選C。", "ref": "憲法§10、§8；釋字第690號", "evidence": "人民身體之自由應予保障。除現行犯之逮捕由法律另定外"}, {"id": "113-法學-06", "src": "old", "year": 113, "n": 6, "subject": "法學", "topic": "憲法", "stem": "關於司法院大法官針對猥褻性言論所做的解釋，下列敘述何者錯誤？", "opts": {"A": "性言論之表現與性資訊之流通，不問是否出於營利，均應受憲法言論自由之保障", "B": "立法者欲對猥褻性言論加以限制，其規範應符合明確性原則", "C": "所謂「猥褻」，雖屬評價性規定，鑑於定義不清，應已違反法律明確性原則", "D": "判斷是否猥褻，應就出版品整體特性及其目的而為觀察，並依當時社會一般觀念定之"}, "answer": "C", "explain": "釋字第617號指出性言論與性資訊之流通，不問是否出於營利，均受言論自由保障（A）；限制猥褻言論應符合明確性原則（B）；判斷猥褻應就出版品整體特性及目的，依當時社會一般觀念定之（D）。該號解釋認「猥褻」雖為評價性不確定法律概念，但可經司法審查確認，未違反法律明確性原則，C錯誤當選。", "ref": "釋字第617號", "evidence": ""}, {"id": "113-法學-07", "src": "old", "year": 113, "n": 7, "subject": "法學", "topic": "憲法", "stem": "關於憲法第 7 條平等權保障的範圍與主體，下列敘述何者正確？", "opts": {"A": "憲法第 7 條所定男女、宗教、種族、階級、黨派，屬於列舉規定", "B": "中華民國人民、外國人、法人皆為平等權保障的主體", "C": "平等權的拘束僅限於司法、行政機關，不拘束立法機關", "D": "憲法第 7 條平等原則強調形式上平等"}, "answer": "B", "explain": "憲法第7條所列男女、宗教、種族、階級、黨派為例示規定，其他事由亦受平等權保障（A錯）；平等權拘束立法、行政、司法所有國家權力（C錯）；平等原則係保障實質平等，非機械之形式平等（D錯，釋字第485號）。平等權保障主體包括本國人民，並及於外國人與法人（性質上可適用者），選B。", "ref": "憲法§7；釋字第485號", "evidence": "中華民國人民，無分男女、宗教、種族、階級、黨派，在法律上一律平等。"}, {"id": "113-法學-08", "src": "old", "year": 113, "n": 8, "subject": "法學", "topic": "憲法", "stem": "依司法院大法官解釋，有關憲法上兵役義務，下列何者不屬於立法者的形成自由？", "opts": {"A": "是否以宗教理由而免除人民兵役義務", "B":
