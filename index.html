為滅火劑時，常利用水膨脹吸熱的原理進行滅火，請問水分轉變為蒸汽的膨脹比為何？", "opts": {"A": "1：500", "B": "1：1200", "C": "1：1500", "D": "1：1700"}, "answer": "D", "explain": "水在 100℃ 汽化為水蒸氣時，體積約膨脹 1700 倍，可稀釋氧氣並吸收大量熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技、88士】（改編為單選，刪除原(E)1：2000）", "subject": "火災學", "src": "old"}, {"id": "F-C34-060", "topic": "滅火", "stem": "下列何者非化學泡沫A劑之組成？", "opts": {"A": "碳酸氫鈉", "B": "碳酸鈉", "C": "甘草精", "D": "苛性鹼及蛋白質"}, "answer": "B", "explain": "化學泡沫 A 劑為碳酸氫鈉加起泡安定劑（甘草萃取物、蛋白質分解物等），不含碳酸鈉。原題「石精」疑為 OCR 錯字，依文意改為甘草精。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-064", "topic": "滅火", "stem": "在空氣泡沫之規格中，其起泡率需幾倍以上？", "opts": {"A": "3倍以上", "B": "5倍以上", "C": "7倍以上", "D": "9倍以上"}, "answer": "B", "explain": "依滅火器認可基準，機械（空氣）泡沫膨脹比需 5 倍以上；化學泡沫則需 7 倍以上，C 為誘答。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-065", "topic": "滅火", "stem": "最適合用於地下室火災的泡沫為何？", "opts": {"A": "高膨脹泡沫", "B": "空氣泡沫", "C": "界面活性劑泡沫", "D": "化學泡沫"}, "answer": "A", "explain": "地下室為封閉空間、人員難以進入，高膨脹泡沫可大量充滿整個空間，達到窒息冷卻效果。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-066", "topic": "滅火", "stem": "密閉式倉庫之火災適合以何種泡沫滅火劑滅火救災？", "opts": {"A": "空氣泡沫", "B": "界面活性劑系泡沫", "C": "高膨脹泡沫", "D": "耐酒精滅火泡沫"}, "answer": "C", "explain": "高膨脹泡沫可快速充填封閉空間，適合密閉倉庫、地下室等全區放射情境。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-067", "topic": "滅火", "stem": "甲醇儲槽之火災適合以何種泡沫滅火劑救災？", "opts": {"A": "化學泡沫", "B": "機械泡沫", "C": "界面活性劑系泡沫", "D": "耐酒精滅火泡沫"}, "answer": "D", "explain": "甲醇為水溶性（極性）液體，會吸收一般泡沫的水分使泡沫消泡，需使用耐酒精泡沫。", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-068", "topic": "滅火", "stem": "下列何者非固體滅火劑物質？", "opts": {"A": "溴氯甲烷", "B": "碳酸氫鈉", "C": "碳酸氫鉀", "D": "磷酸二氫銨"}, "answer": "A", "explain": "溴氯甲烷為鹵化烴液體滅火劑；碳酸氫鈉、碳酸氫鉀、磷酸二氫銨為乾粉（固體）滅火劑主成分。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-069", "topic": "滅火", "stem": "應用乾粉充作滅火劑在B類火災中使用，主要係利用其那一種的滅火效能：", "opts": {"A": "抑制連鎖反應", "B": "冷卻", "C": "窒息", "D": "隔離"}, "answer": "A", "explain": "乾粉在火焰中分解出的粒子可捕捉自由基，產生負催化作用中斷連鎖反應，是其撲滅油火迅速的主因。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-071", "topic": "滅火", "stem": "以氯化鈉為主要成分之Met-L-X固體滅火劑不適用於何種金屬火災？", "opts": {"A": "Li", "B": "Na", "C": "K", "D": "Mg"}, "answer": "A", "explain": "Met-L-X 可用於鈉、鉀、鎂、鈦等金屬火災，但對鋰效果不佳，故不適用 Li。", "ref": "【87警技、94消佐】（改編為單選，刪除原(E)Ti）", "subject": "火災學", "src": "old"}, {"id": "F-C34-072", "topic": "滅火", "stem": "鎂、鈾金屬之火災適合以何種乾粉滅火劑滅火救災？", "opts": {"A": "TEC滅火劑", "B": "磷酸二氫銨滅火劑", "C": "碳酸氫鈉滅火劑", "D": "碳酸氫鉀滅火劑"}, "answer": "A", "explain": "TEC（三元共晶鹽）為 D 類金屬火災專用乾粉，熔融覆蓋金屬表面隔絕空氣；其餘為 ABC 或 BC 乾粉，不適用金屬火災。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "消佐（年份OCR不清）", "subject": "火災學", "src": "old"}, {"id": "F-C34-073", "topic": "滅火", "stem": "關於空氣中氧含量與燃燒敘述，下列何者正確？", "opts": {"A": "通常空氣中氧之含量，約為其容積之15%", "B": "通常空氣中氧之含量，其濃度低於21%時，燃燒甚難持續", "C": "氫氣必須藉氧助燃，無法在氯氣中燃燒", "D": "在密閉空間中，若注入不燃性氣體，氧的濃度必然減低"}, "answer": "D", "explain": "密閉空間內注入不燃性氣體會稀釋氧氣，氧濃度必然下降。空氣含氧約 21%，低於約 15% 燃燒才難持續；氫可在氯中燃燒生成 HCl。", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-074", "topic": "滅火", "stem": "燃燒之際非但不能缺氧，且其濃度必須在一定比率以上；通常空氣中之氧含量，約為其容積之21%，以重量計則為23.2%，若氧濃度低於下列何者，則燃燒甚難維持？", "opts": {"A": "5%", "B": "10%", "C": "15%", "D": "以上皆是"}, "answer": "C", "explain": "一般可燃物在氧濃度低於約 15% 時燃燒難以持續，這是窒息法的依據。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-076", "topic": "滅火", "stem": "假設氧濃度低於14%燃燒就不可能繼續，則在密閉空間中加入不燃性氣體容積超過多少時，燃燒即因窒息告熄滅？", "opts": {"A": "0.4V", "B": "0.45V", "C": "0.5V", "D": "0.55V"}, "answer": "C", "explain": "設空間體積 V、加入不燃氣體 x：0.21V ÷ (V + x) = 0.14，解得 x = 0.5V。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92警技】（改編為單選，刪除原(E)0.6V）", "subject": "火災學", "src": "old"}, {"id": "F-C34-077", "topic": "滅火", "stem": "密閉空間中的氧低於某一濃度時，燃燒就不可能繼續，假設一般空氣氧容積佔20%，則在一密閉空間(體積為V)內加入不燃性氣體體積多少V時，此時的氧濃度為12.5%？", "opts": {"A": "0.4V", "B": "0.6V", "C": "0.825V", "D": "1.25V"}, "answer": "B", "explain": "0.20V ÷ (V + x) = 0.125，得 V + x = 1.6V，x = 0.6V。", "ref": "【94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C5-001", "topic": "危險物品", "stem": "依美國防火協會（NFPA）之規定，黃色在危險物品之表示法中代表何種危險性？", "opts": {"A": "有害健康性", "B": "化學反應性", "C": "禁水性", "D": "可燃性"}, "answer": "B", "explain": "NFPA 704 菱形標示：藍色＝健康危害、紅色＝可燃性、黃色＝反應性、白色＝特殊危險（如禁水 W、氧化 OX）。禁水性屬白色欄的特殊標記，不是黃色。", "ref": "【89警技、90消佐】第1題（改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C5-002", "topic": "危險物品", "stem": "依據美國防火協會（NFPA）對危險物品之標示，藍色菱形內之數字代表該危險物品何種性質之等級？", "opts": {"A": "禁水性", "B": "可燃性", "C": "反應性", "D": "有害健康毒性"}, "answer": "D", "explain": "藍色欄標示健康危害（毒性）等級 0～4；可燃性為紅色、反應性為黃色，禁水性則以白色欄的 W 符號表示。", "ref": "【91消佐】第2題", "subject": "火災學", "src": "old"}, {"id": "F-C5-003", "topic": "危險物品", "stem": "美國防火協會（NFPA）危險物品標示菱形中，上方欄為「2」、左方欄為「1」、右方欄為「3」、下方欄為「OXY」，其中數字「3」欄位所表示的是下列何者？", "opts": {"A": "反應性", "B": "可燃性", "C": "有害健康之毒性", "D": "附記其他特性"}, "answer": "A", "explain": "NFPA 菱形的配置是上紅（可燃性）、左藍（健康）、右黃（反應性）、下白（特殊危險）。右方欄的 3 即反應性等級；下方 OXY 才是附記的氧化性特性。", "ref": "【90士】第3題（原題附圖，已改為文字描述）", "subject": "火災學", "src": "old"}, {"id": "F-C5-005", "topic": "危險物品", "stem": "下列何者為我國法定公共危險物品中的第一類危險物品？", "opts": {"A": "P₄S₃", "B": "CaC₂", "C": "CH₃COCH₃", "D": "NH₄ClO₃"}, "answer": "D", "explain": "NH₄ClO₃（氯酸銨）屬氯酸鹽類，是第一類氧化性固體。P₄S₃ 為第二類易燃固體，CaC₂ 為第三類禁水性物質，丙酮為第四類易燃液體。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技】第5題（改編為單選，刪原選項 HSO₃Cl）", "subject": "火災學", "src": "old"}, {"id": "F-C5-008", "topic": "危險物品", "stem": "下列關於硫酸（H₂SO₄）起火危險性之敘述，何者有誤？", "opts": {"A": "濃硫酸若浸透可燃性有機物，會發熱發火", "B": "與氯酸鹽或碳化物接觸時，可能引起發火", "C": "各種金屬與稀硫酸接觸，皆會產生氫氣", "D": "以水注入濃硫酸而欲稀釋時，將產生激烈發熱而致硫酸飛濺"}, "answer": "C", "explain": "稀硫酸只與活性大於氫的金屬（如鋅、鐵）反應放出氫氣，銅、銀、金等不會反應，所以「各種金屬皆會」是錯的。其餘三項都是濃硫酸脫水、氧化及稀釋放熱的正確描述。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】第8題", "subject": "火災學", "src": "old"}, {"id": "F-C5-009", "topic": "危險物品", "stem": "第一類公共危險物品中何者具有可燃性？", "opts": {"A": "氯酸鹽類", "B": "硝酸鹽類", "C": "過錳酸鹽類", "D": "有機過氧化物"}, "answer": "D", "explain": "氯酸鹽、硝酸鹽、過錳酸鹽都是無機氧化劑，本身不燃只助燃；有機過氧化物分子中含碳氫，本身就可燃，還兼具氧化性。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】第9題", "subject": "火災學", "src": "old"}, {"id": "F-C5-011", "topic": "危險物品", "stem": "下列有關鈉、鉀之敘述何者有誤？", "opts": {"A": "一般保存於煤油中", "B": "火災時可用二氧化碳滅火", "C": "與水反應分別產生氫氧化鈉與氫氧化鉀", "D": "鉀於空氣中燃燒時會產生淡紫色火焰"}, "answer": "B", "explain": "鈉、鉀等活性金屬會奪取 CO₂ 中的氧繼續燃燒，不可用 CO₂、水或泡沫滅火，應以乾燥砂、金屬火災用乾粉覆蓋。浸煤油保存、遇水生成氫氧化物、鉀焰呈淡紫色都正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87警技】第12題（改編為單選，刪原選項「管制量為50公斤」，現行法令鉀鈉管制量為10公斤）", "subject": "火災學", "src": "old"}, {"id": "F-C5-013", "topic": "危險物品", "stem": "下列何種禁水性物質在水中可產生乙炔（C₂H₂）？", "opts": {"A": "金屬鈉", "B": "金屬鉀", "C": "磷化鈣", "D": "碳化鈣"}, "answer": "D", "explain": "CaC₂＋2H₂O→Ca(OH)₂＋C₂H₂，碳化鈣遇水生成乙炔。鈉、鉀遇水產生氫氣，磷化鈣遇水產生磷化氫。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】第16題", "subject": "火災學", "src": "old"}, {"id": "F-C5-015", "topic": "危險物品", "stem": "下列選項皆為禁水性物質，何者與水反應所生成之可燃性氣體與其他不同？", "opts": {"A": "金屬鉀（K）", "B": "碳化鈣（CaC₂）", "C": "金屬鈣（Ca）", "D": "金屬鎂（Mg）"}, "answer": "B", "explain": "鉀、鈣、鎂這類活性金屬與水反應都放出氫氣；碳化鈣與水反應生成的是乙炔，所以與其他三者不同。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】第18題", "subject": "火災學", "src": "old"}, {"id": "F-C5-018", "topic": "危險物品", "stem": "關於第四類公共危險物品的理化性，下列敘述何者正確？", "opts": {"A": "乙醇為第四類危險物品，其引火點為53℃，且冬天時與夏天相同，亦十分容易引火", "B": "汽油之蒸氣較空氣輕，故容易揮發引起火災", "C": "當可燃性液體之溫度高於其引火點時，引火危險性會加大", "D": "第四類可燃性液體除二硫化碳外，大多比水來得重，不易浮於水面"}, "answer": "C", "explain": "液溫一旦超過引火點，液面上方就有達燃燒下限的蒸氣，遇火源即可引燃，危險性升高。乙醇引火點約13℃而非53℃；汽油蒸氣比空氣重；第四類液體多比水輕，二硫化碳才是比水重的例外。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技、88士、91士】第21題（改編為單選，刪原(E)）", "subject": "火災學", "src": "old"}, {"id": "F-C5-019", "topic": "危險物品", "stem": "下列有關第四類危險物品的敘述，何者不正確？", "opts": {"A": "石油類流動時，易產生靜電", "B": "滅火時，以窒息和遮斷空氣最有效", "C": "醇類火災時，應使用抗醇型泡沫滅火劑", "D": "具引火性，最好能儲存於著火點以下的溫度"}, "answer": "D", "explain": "第四類的危險指標是引火點，應儲存在引火點以下的溫度；著火點（發火點）比引火點高得多，只控制在著火點以下仍可能被引燃。其餘三項都正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【士】第22題（年份OCR缺漏）", "subject": "火災學", "src": "old"}, {"id": "F-C5-020", "topic": "危險物品", "stem": "第四類公共危險物品其危險性與閃火點有很密切之關係，下列物質何者之閃火點最低？", "opts": {"A": "二硫化碳", "B": "丙酮", "C": "苯", "D": "煤油"}, "answer": "A", "explain": "二硫化碳屬特殊引火物，閃火點約 -30℃；丙酮約 -20℃、苯約 -11℃，煤油則在 40℃ 以上。", "ref": "【8?警技】第23題（改編為單選，刪原選項重油；年份OCR缺漏）", "subject": "火災學", "src": "old"}, {"id": "F-C5-021", "topic": "危險物品", "stem": "難溶於水之第四類公共危險物品中，除何者以外其他皆比水輕，會浮於水上？", "opts": {"A": "乙醚", "B": "二硫化碳", "C": "輕質石油類", "D": "中質石油類"}, "answer": "B", "explain": "二硫化碳比重約 1.26，比水重，所以常在上面覆水儲存以隔絕蒸氣；乙醚與各種石油類比重都小於 1。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【9?消佐】第24題（年份OCR缺漏）", "subject": "火災學", "src": "old"}, {"id": "F-C5-022", "topic": "危險物品", "stem": "半導體業界使用之矽甲烷（SiH₄）原料，屬何類危險物品？", "opts": {"A": "第一類氧化性物質", "B": "第三類禁水性物質", "C": "第四類易燃性液體", "D": "第六類強酸性物質"}, "answer": "B", "explain": "矽甲烷接觸空氣會自燃，依本書分類歸在第三類（自燃及禁水性物質）。它不是氧化劑，常溫下是氣體不是液體，也不是酸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【17期警專】第25題", "subject": "火災學", "src": "old"}, {"id": "F-C5-023", "topic": "危險物品", "stem": "下列有關第五類危險物品的敘述，何者不正確？", "opts": {"A": "屬含氧的可燃物，易起自燃作用", "B": "大部分為無機硝化物", "C": "長期間的儲存易因氧化作用而起熱分解", "D": "因燃燒速度快，不適合以窒息方式滅火"}, "answer": "B", "explain": "第五類自反應物質多為有機硝基化合物、硝酸酯或有機過氧化物，是有機物而非無機物。它們分子內含氧，隔絕空氣無效，所以不適用窒息滅火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】第26題", "subject": "火災學", "src": "old"}, {"id": "F-C5-024", "topic": "危險物品", "stem": "以金屬、紙或布類加入火藥、炸藥，藉其燃燒或爆炸以誘發其他火藥類燃燒爆炸之物，總稱為火工品。下列何種物質並非火工品？", "opts": {"A": "電雷管", "B": "導火線", "C": "信號焰管", "D": "雷汞"}, "answer": "D", "explain": "雷汞是起爆藥（炸藥）本身，不是經過加工組裝的製品；雷管、導火線、信號焰管都是把火藥裝進外殼製成的火工品。", "ref": "【87消佐】第27題", "subject": "火災學", "src": "old"}, {"id": "F-C5-026", "topic": "危險物品", "stem": "火藥係指爆炸性反應較為遲緩之火藥類，其中無煙火藥係以下列何種成分為主體？", "opts": {"A": "硝酸鹽", "B": "硝化纖維", "C": "疊氮化鉛", "D": "雷酸鹽"}, "answer": "B", "explain": "無煙火藥以硝化纖維（硝化棉）為主體，燃燒幾乎不產生固體殘渣。硝酸鹽是黑色火藥的主成分，疊氮化鉛和雷酸鹽則是起爆藥。", "ref": "【87消佐、89消佐、89警技】第29題", "subject": "火災學", "src": "old"}, {"id": "F-C5-029", "topic": "危險物品", "stem": "變質炸藥銷毀時，每次燃燒炸藥數量最多不得超過多少公斤？", "opts": {"A": "2公斤", "B": "35公斤", "C": "45公斤", "D": "55公斤"}, "answer": "C", "explain": "依書上所引的爆炸物銷毀規定，燒燬變質炸藥每次以 45 公斤為上限，以免量大時由燃燒轉為爆轟。", "ref": "【90士】第32題", "subject": "火災學", "src": "old"}, {"id": "F-C5-030", "topic": "危險物品", "stem": "黑色火藥中之主要成分為：", "opts": {"A": "硝酸鹽", "B": "雷汞", "C": "雷酸銀", "D": "硝化棉"}, "answer": "A", "explain": "黑色火藥由硝酸鉀（硝酸鹽，約75%）、硫黃和木炭混合而成，以硝酸鹽為主。雷汞、雷酸銀是起爆藥，硝化棉是無煙火藥的原料。", "ref": "【91消佐】第33題（題幹「黑色火藥」為OCR缺字補回）", "subject": "火災學", "src": "old"}, {"id": "F-C5-031", "topic": "危險物品", "stem": "下列何者非為黑色火藥內所含之成分之一？", "opts": {"A": "硝酸鹽", "B": "硝化棉", "C": "硫黃", "D": "木炭"}, "answer": "B", "explain": "黑色火藥＝硝酸鹽＋硫黃＋木炭；硝化棉是無煙火藥的主體，不屬於黑色火藥成分。", "ref": "【94消佐】第34題", "subject": "火災學", "src": "old"}, {"id": "F-C5-032", "topic": "危險物品", "stem": "下列有關TNT的敘述，何者不正確？", "opts": {"A": "化學式為 CH₃C₆H₂(NO₂)₃", "B": "為安全起見，常加入穩定劑", "C": "易溶於水，易與金屬產生作用", "D": "用水霧滅火，禁用砂土掩蓋"}, "answer": "C", "explain": "TNT（三硝基甲苯）難溶於水，化學性質安定，不易與金屬反應，這也是它常作為軍用炸藥的原因。掩蓋會造成蓄熱、由燃燒轉為爆炸，所以要用水霧冷卻。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【87警技、91士】第35題（選項 B、C 有 OCR 缺字，依原意補回）", "subject": "火災學", "src": "old"}, {"id": "F-C5-033", "topic": "危險物品", "stem": "爆炸性物質除與酸、鹼、金屬會起化學反應之爆炸特性外，尚有何性質？", "opts": {"A": "敏感性", "B": "有毒性", "C": "吸濕性", "D": "以上皆是"}, "answer": "D", "explain": "爆炸性物質通常對撞擊、摩擦敏感，很多具有毒性（如硝化甘油、雷汞），部分會吸濕而變質或結塊，三者都屬其特性。", "ref": "【88士】第36題", "subject": "火災學", "src": "old"}, {"id": "F-C5-034", "topic": "危險物品", "stem": "下列有關第六類危險物品的敘述，何者不正確？", "opts": {"A": "屬強酸或強氧化劑", "B": "與水接觸會發熱", "C": "易燃", "D": "與有機物混合時會起氧化作用"}, "answer": "C", "explain": "第六類氧化性液體（過氯酸、過氧化氫、硝酸等）本身不燃，只會助燃；說它易燃是錯的。", "ref": "【9?士】第37題（年份OCR缺漏）", "subject": "火災學", "src": "old"}, {"id": "F-C5-035", "topic": "危險物品", "stem": "下列何種分解爆炸的氣體於發生爆炸後將釋出一氧化碳？", "opts": {"A": "疊氮化鉛", "B": "丙烯", "C": "乙烯", "D": "環氧乙烷"}, "answer": "D", "explain": "環氧乙烷（C₂H₄O）分子內含氧，分解產生 CH₄＋CO 等產物。疊氮化鉛分解生成 Pb 與 N₂，丙烯、乙烯分解生成碳、甲烷與氫，都不含氧。", "ref": "【89警技】第38題（改編為單選，刪原選項聯氨）", "subject": "火災學", "src": "old"}, {"id": "F-C5-036", "topic": "危險物品", "stem": "下列何種可燃物發生爆炸時，不至於產生分解爆炸？", "opts": {"A": "氧化氮", "B": "環氧乙烷", "C": "聯氨", "D": "甲烷"}, "answer": "D", "explain": "甲烷結構穩定，只會與空氣混合後燃燒爆炸，不會自行分解爆炸；氧化氮、環氧乙烷、聯氨都是典型的分解爆炸性氣體。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87警技】第39題（改編為單選，刪原選項乙烯）", "subject": "火災學", "src": "old"}, {"id": "F-C5-037", "topic": "危險物品", "stem": "下列選項所列之化學工業經常處理的化合物中，何者不具有發生分解爆炸之可能性？", "opts": {"A": "甲烷", "B": "乙炔", "C": "環氧乙烷", "D": "聯氨"}, "answer": "A", "explain": "乙炔、環氧乙烷、聯氨都是吸熱或不穩定化合物，不需要氧也能分解爆炸；甲烷只有與空氣混合才會燃燒爆炸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、94消佐】第40題", "subject": "火災學", "src": "old"}, {"id": "F-C5-038", "topic": "危險物品", "stem": "關於混合危險，下列敘述何者正確？", "opts": {"A": "濃過氧化氫溶液與金屬氧化物混合不會產生發火或爆炸危險", "B": "氧化性鹽類與強酸混合易生不安定之游離酸，若再與還原性物質接觸，易生發火危險", "C": "碳化鈣與水接觸，會生成熱量與火花", "D": "鋁粉與氧化鐵混合易生成爆炸性物質"}, "answer": "B", "explain": "氯酸鹽等氧化性鹽類遇強酸會游離出氯酸這類極不安定的酸，氧化力更強，再碰到還原性物質就容易發火。濃過氧化氫遇金屬氧化物會催化分解，有危險；碳化鈣遇水產生的是乙炔與熱，不會產生火花；鋁粉與氧化鐵是鋁熱劑，點燃後放出高熱，並非生成爆炸性物質。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【88警技、88士】第41題（改編為單選，刪原(E)）", "subject": "火災學", "src": "old"}, {"id": "F-C5-040", "topic": "危險物品", "stem": "下述何者不具有混合發火之危險性？", "opts": {"A": "漂白粉與乙炔", "B": "鹵素與氨氣", "C": "過氧化物與硫黃", "D": "金屬鈉與煤油"}, "answer": "D", "explain": "金屬鈉本來就浸在煤油中隔絕空氣和水分保存，兩者不會反應；其餘三組都是氧化劑與可燃物（或會生成爆炸性化合物）的組合。", "ref": "【89警技】第43題（改編為單選，刪原選項無水鉻酸與醋酸）", "subject": "火災學", "src": "old"}, {"id": "F-C5-043", "topic": "危險物品", "stem": "下列何者係乙炔分解之反應式？", "opts": {"A": "C₂H₂ → 2C ＋ H₂ ＋ 54.2 kcal/mol", "B": "C₂H₄ → C ＋ CH₄ ＋ 30.4 kcal/mol", "C": "C₂H₄O → CH₄ ＋ CO ＋ 32.1 kcal/mol", "D": "H₂S ＋ Cl₂ → 2HCl ＋ S"}, "answer": "A", "explain": "乙炔（C₂H₂）分解成碳與氫並放出大量熱。B 是乙烯分解，C 是環氧乙烷分解，D 是硫化氫被氯氧化，都不是乙炔。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】第46題（選項 C 依OCR推定為環氧乙烷）", "subject": "火災學", "src": "old"}, {"id": "F-C5-044", "topic": "危險物品", "stem": "關於乙炔的性質及火災危險性，下列何者不正確？", "opts": {"A": "由電石加水所生成", "B": "無色、比空氣輕、易燃", "C": "爆炸界限為20%～60%", "D": "加壓時易起分解爆炸"}, "answer": "C", "explain": "乙炔的爆炸範圍約 2.5%～81%，是常見氣體中最寬的之一，不是 20%～60%。它由電石（碳化鈣）加水製得，分子量 26 比空氣輕，加壓時容易分解爆炸。", "ref": "【88警技】第47題（改編為單選，刪原(E)）", "subject": "火災學", "src": "old"}, {"id": "F-C5-045", "topic": "危險物品", "stem": "乙炔是一易分解爆炸之物質，下列敘述何者正確？", "opts": {"A": "化學式為 C₂H₄", "B": "處理高壓乙炔時，稀釋之氣體限用氮氣", "C": "高壓下，即不易生重合反應", "D": "工廠中使用之乙炔鋼瓶，常利用浸泡在丙酮之多孔質，使之溶解以防止其爆炸"}, "answer": "D", "explain": "溶解乙炔鋼瓶內填多孔物質並注入丙酮，讓乙炔溶解在丙酮中，以降低分解爆炸的危險。乙炔化學式是 C₂H₂；稀釋氣體不限氮氣（也可用 CO₂、甲烷等）；高壓下反而容易重合。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】第48題（選項A化學式OCR殘缺，依同系列題補為C₂H₄）", "subject": "火災學", "src": "old"}, {"id": "F-C5-047", "topic": "危險物品", "stem": "加壓下列何者氣體，會發生聚（重）合反應而有爆炸的危險？", "opts": {"A": "氫氣", "B": "液化石油氣（LPG）", "C": "甲烷", "D": "乙炔"}, "answer": "D", "explain": "乙炔含碳碳三鍵，加壓時容易重合並放出熱量，可能引發爆炸；氫氣、LPG、甲烷沒有這種重合性質。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第50題（選項A OCR缺字，暫補為氫氣）", "subject": "火災學", "src": "old"}, {"id": "F-C5-048", "topic": "危險物品", "stem": "物質之危險程度可以燃燒範圍之大小作為判斷之條件之一，下列物質何者之燃燒範圍最廣？", "opts": {"A": "酒精", "B": "乙炔", "C": "甲烷", "D": "丙烷"}, "answer": "B", "explain": "乙炔燃燒範圍約 2.5%～81%；酒精約 3.3%～19%、甲烷 5%～15%、丙烷 2.1%～9.5%，所以乙炔最廣。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【59期專修】第51題（改編為單選，刪原選項一氧化碳）", "subject": "火災學", "src": "old"}, {"id": "F-C5-049", "topic": "危險物品", "stem": "下述關於乙炔之性質何者錯誤？", "opts": {"A": "分子式為 C₂H₂", "B": "可利用不活性氣體稀釋防止其發生爆炸", "C": "高壓下易生重合反應", "D": "不可與鐵、鈷、鎳等金屬接觸，銅、銀等金屬則可"}, "answer": "D", "explain": "乙炔會與銅、銀、汞生成對撞擊敏感的乙炔化物，所以銅、銀等金屬正是要避免接觸的。其餘三項都正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】第52題", "subject": "火災學", "src": "old"}, {"id": "F-C5-051", "topic": "危險物品", "stem": "下列有關丙酮之敘述何者有誤？", "opts": {"A": "閃火點為零下20度左右", "B": "為無色液體", "C": "可與乙醚及酒精等任意混合", "D": "可用普通泡沫滅火"}, "answer": "D", "explain": "丙酮是水溶性溶劑，會破壞普通泡沫的泡膜，要用抗醇型泡沫。閃火點約 -20℃、無色、能與醚、醇任意互溶都正確。", "ref": "【89警技】第54題（改編為單選，刪原選項「化學式為CH₃COCH₃」）", "subject": "火災學", "src": "old"}, {"id": "F-C5-053", "topic": "危險物品", "stem": "下列何者為我國法定公共危險物品中的第五類危險物品？", "opts": {"A": "氯酸銨", "B": "黃磷", "C": "硝化甘油", "D": "鎂粉"}, "answer": "C", "explain": "硝化甘油屬硝酸酯類，是第五類自反應物質。氯酸銨為第一類，黃磷為第三類自燃物質，鎂粉為第二類易燃固體。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】第56題", "subject": "火災學", "src": "old"}, {"id": "F-C5-054", "topic": "危險物品", "stem": "以硝化甘油為主體之爆炸物，下列敘述何者不正確？", "opts": {"A": "一般將其製成固體", "B": "8℃以下即行凍結，在凍結進行中或溶解前後，不易爆炸", "C": "放置久者，有自然發火的可能性", "D": "是膠質炸藥的原料之一"}, "answer": "B", "explain": "硝化甘油在凍結過程中或半融解狀態下對衝擊特別敏感，極易爆炸，所以說不易爆炸是錯的。一般製成矽藻土或膠質炸藥等固體使用，久置分解也可能自燃。", "ref": "【89消佐】第57題", "subject": "火災學", "src": "old"}, {"id": "F-C5-055", "topic": "危險物品", "stem": "硝化甘油儲存溫度不得低於多少℃，以防凝固後再熔化時發生爆炸？", "opts": {"A": "45℃", "B": "35℃", "C": "25℃", "D": "15℃"}, "answer": "D", "explain": "硝化甘油約在 13℃ 附近凝固，所以儲存溫度要維持在 15℃ 以上，避免反覆凍結再熔化時變得敏感而爆炸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】第58題", "subject": "火災學", "src": "old"}, {"id": "F-C5-056", "topic": "危險物品", "stem": "下列有關硝化甘油的敘述，何者正確？", "opts": {"A": "可用水霧滅火", "B": "點火時形成淡黃色火焰", "C": "凍結時，對機械的作用亦敏感", "D": "即使少量也容易發生爆炸"}, "answer": "B", "explain": "少量硝化甘油點火時只會以黃色火焰燃燒，大量或受衝擊時才會爆轟，因此 D 不正確。完全凍結時敏感度反而降低；火災時爆炸危險高，一般不以水霧撲救而是撤離。本題正解有爭議。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【91士】第59題", "subject": "火災學", "src": "old"}, {"id": "F-C5-060", "topic": "危險物品", "stem": "下列之可燃性氣體的蒸氣比重何者最小？", "opts": {"A": "氨氣", "B": "一氧化碳", "C": "乙炔", "D": "乙烷"}, "answer": "A", "explain": "蒸氣比重≈分子量÷29：氨 17（約0.59）、乙炔 26（0.90）、一氧化碳 28（0.97）、乙烷 30（1.04），氨最小。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】第63題", "subject": "火災學", "src": "old"}, {"id": "F-C5-062", "topic": "危險物品", "stem": "關於LPG（液化石油氣）與LNG（液化天然氣）之性質，下列何者為非？", "opts": {"A": "LPG之主成分為C₃H₈、C₃H₆、C₄H₁₀、C₄H₈等氣體混合，LNG之主成分則為CH₄氣體", "B": "LPG與LNG均為無色、無臭之可燃性氣體", "C": "LPG氣態時較空氣重，而LNG氣態時則較空氣輕", "D": "LPG多以壓縮氣體狀態搬運，而LNG多以液化氣體狀態搬運"}, "answer": "D", "explain": "LPG 常溫下稍加壓就能液化，所以是以液化狀態儲運（桶裝瓦斯）；說它以壓縮氣體搬運是錯的。LPG 以丙烷、丁烷為主，比空氣重；LNG 以甲烷為主，比空氣輕，兩者本身都無色無臭。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技、士】第65題（改編為單選，刪原選項「LPG作桶裝瓦斯、LNG作都市瓦斯」）", "subject": "火災學", "src": "old"}, {"id": "F-C5-063", "topic": "危險物品", "stem": "近年來許多國家當作新能源之液化天然瓦斯（俗稱LNG），其主要成分為：", "opts": {"A": "甲烷", "B": "乙烷", "C": "丙烷", "D": "丁烷"}, "answer": "A", "explain": "天然氣主要成分為甲烷（約九成），冷卻到約 -162℃ 液化後就是 LNG；丙烷、丁烷則是 LPG 的主成分。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐、94士】第66題", "subject": "火災學", "src": "old"}, {"id": "F-C5-064", "topic": "危險物品", "stem": "請指出下列何種氣體的比重小於1：", "opts": {"A": "液化天然氣", "B": "乙烷", "C": "丙烷", "D": "液化石油氣"}, "answer": "A", "explain": "天然氣以甲烷為主，分子量 16，氣態比重約 0.55，比空氣輕；乙烷約 1.04，丙烷與 LPG 約 1.5～2，都比空氣重。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89士】第67題", "subject": "火災學", "src": "old"}, {"id": "F-C5-065", "topic": "危險物品", "stem": "液化石油氣的主要成分為：", "opts": {"A": "甲烷", "B": "乙烷", "C": "丙烷", "D": "丁烷"}, "answer": "C", "explain": "LPG 以丙烷、丁烷為主，本題依慣例取丙烷作答；甲烷是天然氣的主成分。丁烷也是 LPG 成分之一，因此本題有一定爭議。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【8?士】第68題（年份OCR缺漏）", "subject": "火災學", "src": "old"}, {"id": "F-C5-066", "topic": "危險物品", "stem": "當進行地下室火災搶救時發現有天然瓦斯外洩的跡象時，下列救災程序何者應優先進行？", "opts": {"A": "持續以強力水柱將火勢控制", "B": "使用破壞器具將牆壁打穿增進空氣流通", "C": "找出瓦斯遮斷器並立即予以關閉", "D": "使用泡沫滅火劑滅火"}, "answer": "C", "explain": "氣體外洩的首要原則是先切斷供氣源頭，否則不管是滅火或通風，洩漏都會持續累積，隨時可能再度引燃或爆炸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第69題", "subject": "火災學", "src": "old"}, {"id": "F-C5-067", "topic": "危險物品", "stem": "下列何種可燃性氣體或蒸氣比重較空氣小？", "opts": {"A": "液化石油氣", "B": "苯", "C": "丙酮", "D": "天然瓦斯"}, "answer": "D", "explain": "天然瓦斯主成分甲烷分子量 16，比空氣輕；LPG（44～58）、苯（78）、丙酮（58）的蒸氣都比空氣重。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第70題", "subject": "火災學", "src": "old"}, {"id": "F-C5-068", "topic": "危險物品", "stem": "處理家用天然瓦斯洩漏的方式，何者錯誤？", "opts": {"A": "關閉開關", "B": "儘速拔除電氣電源線", "C": "熄滅附近火源", "D": "緩慢打開門窗使空氣流通"}, "answer": "B", "explain": "拔插頭或開關電器時可能產生火花，引燃已經累積的瓦斯，所以不應該去動電源。關閉氣源、熄滅火源、緩慢開窗通風才是正確做法。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第71題", "subject": "火災學", "src": "old"}, {"id": "F-C5-070", "topic": "危險物品", "stem": "下列何種氣體之比重較空氣輕？", "opts": {"A": "液化瓦斯", "B": "甲烷", "C": "丙烷", "D": "丁烷"}, "answer": "B", "explain": "甲烷分子量 16，比重約 0.55，比空氣輕；液化瓦斯（丙烷、丁烷）的氣體都比空氣重。", "ref": "【86警技】第73題（改編為單選，刪原選項氧氣）", "subject": "火災學", "src": "old"}, {"id": "F-C5-071", "topic": "危險物品", "stem": "下列關於液化瓦斯（液化石油氣）之性質與事故發生之處置原則何者錯誤？", "opts": {"A": "洩漏時應立即關閉開關", "B": "因較空氣輕，容易漂浮於空中", "C": "以大量水加以冷卻", "D": "滅火後以濕毛巾纏繞洩漏口並移至空曠處"}, "answer": "B", "explain": "LPG 氣體約為空氣的 1.5～2 倍重，洩漏後會沉積在地面與低窪處，不會往上飄。其餘三項都是正確的處置方式。", "ref": "【91消佐】第74題", "subject": "火災學", "src": "old"}, {"id": "F-C67-001", "topic": "防火與特殊現象", "stem": "下列何者非高樓結構耐火設計上考慮之項目？", "opts": {"A": "內部之可燃物量", "B": "火災之燃燒時間", "C": "內部裝修之防焰規制", "D": "長期荷重之應力及安全率"}, "answer": "C", "explain": "結構耐火設計關心火災荷重（可燃物量）、燃燒持續時間與構材在荷重下的應力及安全率。防焰規制是針對窗簾、地毯等物品的防焰性能，屬於防止起火與延燒的對策，不是結構耐火設計項目。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】第六章選擇題第1題", "subject": "火災學", "src": "old"}, {"id": "F-C67-002", "topic": "防火與特殊現象", "stem": "下列何項物品不在消防法防焰規制之規定項目內？", "opts": {"A": "窗簾", "B": "防火門窗", "C": "展示用廣告看板", "D": "地毯"}, "answer": "B", "explain": "消防法規定應使用防焰物品者為地毯、窗簾、布幕、展示用廣告板等易燃裝飾品。防火門窗屬建築構造的防火設備，依建築法規管理，不屬防焰物品。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】第六章選擇題第2題", "subject": "火災學", "src": "old"}, {"id": "F-C67-003", "topic": "防火與特殊現象", "stem": "消防法所規範的防焰規制中，需有防焰標示的防焰物品不包括？", "opts": {"A": "門", "B": "地毯", "C": "窗簾", "D": "布幕"}, "answer": "A", "explain": "須附防焰標示的防焰物品為地毯、窗簾、布幕、展示用廣告板等纖維或薄片類裝飾物。門為建築構件，不在防焰物品之列。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第六章選擇題第3題", "subject": "火災學", "src": "old"}, {"id": "F-C67-005", "topic": "防火與特殊現象", "stem": "建築物防火區劃中之垂直區劃，主要係用以防止火災中的下列何種現象？", "opts": {"A": "上下蔓延", "B": "橫向擴散", "C": "全面轟燃", "D": "爆炸"}, "answer": "A", "explain": "垂直區劃是以樓地板、管道間及樓梯間的防火構造把各樓層上下隔開，目的在阻止火煙沿垂直方向往上層蔓延。防止橫向擴散靠的是水平（面積）區劃。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】第六章選擇題第5題", "subject": "火災學", "src": "old"}, {"id": "F-C67-006", "topic": "防火與特殊現象", "stem": "依我國建築技術規則之規定，十六層樓建築物之地面第一層，下列何種防火區劃構件具最短之防火時效？", "opts": {"A": "承重牆", "B": "分間牆", "C": "樑", "D": "柱"}, "answer": "B", "explain": "十六層樓建築物的一樓，自頂層起算屬第十五層以上，依建築技術規則第70條：柱與樑3小時，承重牆2小時，而分間牆只要求1小時，所以分間牆最短。", "ref": "【89警技】第六章選擇題第6題（改編為單選，刪除原選項(E)樓地板）", "subject": "火災學", "src": "old"}, {"id": "F-C67-007", "topic": "防火與特殊現象", "stem": "建築技術規則設計施工編規定，目前自頂層起算第15層以上各樓層「垂直區劃」中之「承重牆」，其防火時效為幾小時？", "opts": {"A": "2小時", "B": "1.5小時", "C": "1.0小時", "D": "0.5小時"}, "answer": "A", "explain": "依建築技術規則第70條，自頂層起算第十五層以上的樓層，承重牆防火時效要求2小時（柱與樑則為3小時）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】第六章選擇題第7題", "subject": "火災學", "src": "old"}, {"id": "F-C67-008", "topic": "防火與特殊現象", "stem": "在防火區劃中，自頂層起算不超過四層之各樓層樑構件的防火時效，建築技術規則建築設計施工編中之要求為何？", "opts": {"A": "1小時以上", "B": "2小時以上", "C": "3小時以上", "D": "4小時以上"}, "answer": "A", "explain": "依建築技術規則第70條，自頂層起算不超過四層的樓層，柱、樑、承重牆與樓地板的防火時效均為1小時以上；樓層越往下要求越高（2小時、3小時）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】第六章選擇題第8題", "subject": "火災學", "src": "old"}, {"id": "F-C67-009", "topic": "防火與特殊現象", "stem": "在建築技術規則建築設計施工編中所稱室內裝修材料為「耐火板」者，其係通過中國國家標準CNS 6532何種耐燃等級之測試？", "opts": {"A": "一級", "B": "二級", "C": "三級", "D": "級外"}, "answer": "B", "explain": "CNS 6532耐燃試驗中，耐燃一級為不燃材料，耐燃二級為耐火板，耐燃三級為耐燃材料。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】第六章選擇題第9題", "subject": "火災學", "src": "old"}, {"id": "F-C67-010", "topic": "防火與特殊現象", "stem": "為提昇高樓防火安全，高樓防火區劃設計中應作垂直空間區劃的場所為何？", "opts": {"A": "大面積賣場", "B": "樓梯間", "C": "防火牆", "D": "以上皆非"}, "answer": "B", "explain": "樓梯間、電梯道、管道間等貫穿樓層的空間，會像煙囪一樣讓火煙往上竄，必須做垂直區劃。大面積賣場要做的是面積區劃；防火牆本身是區劃構件，不是被區劃的場所。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第六章選擇題第10題", "subject": "火災學", "src": "old"}, {"id": "F-C67-012", "topic": "煙與熱流", "stem": "在捷運車站或機場航站等處可見防煙垂壁的設計，防煙垂壁的功能主要是？", "opts": {"A": "火災時控制煙流動的速度", "B": "火災時具排煙功能", "C": "增加探測器的靈敏度", "D": "具標示功能"}, "answer": "A", "explain": "防煙垂壁是從天花板往下突出的不燃隔板，把天花板下方的煙層擋住，延緩煙的水平擴散，爭取避難與排煙時間。它本身沒有排煙能力，排煙要靠排煙設備。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第六章選擇題第12題", "subject": "火災學", "src": "old"}, {"id": "F-C67-013", "topic": "煙與熱流", "stem": "防焰制度之實施係採取下列何種防煙之對策？", "opts": {"A": "抑制煙的發生源", "B": "加速煙的流動", "C": "阻止煙的流動", "D": "積極向外排煙"}, "answer": "A", "explain": "防焰物品不易著火、延燒慢，使煙從一開始就少產生，屬於從發生源抑制煙的對策。防火閘門、防煙垂壁屬阻止煙流動，排煙設備屬積極向外排煙。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、91消佐】第六章選擇題第13題", "subject": "火災學", "src": "old"}, {"id": "F-C67-014", "topic": "防火與特殊現象", "stem": "假設在一場火災中有實際總逃生人數100人，其中正常人占65%，小孩及殘障者占15%，老人占20%，若已知正常人之行動係數為1，小孩及殘障者的行動係數為0.75，老人的行動係數為0.5，則依學者Marchant的研究可知，本場火災中進行逃生避難的「有效人數」為何？", "opts": {"A": "100人", "B": "125人", "C": "140人", "D": "155人"}, "answer": "B", "explain": "有效人數＝各類人數÷行動係數之總和＝65/1＋15/0.75＋20/0.5＝65＋20＋40＝125人。行動較慢者會被換算成較多的等效人數。", "ref": "【88警技】第六章選擇題第14題（改編為單選，刪除原選項(E)170人）", "subject": "火災學", "src": "old"}, {"id": "F-C67-015", "topic": "防火與特殊現象", "stem": "有關火災中人類逃生避難的行為特性分析，下列敘述何者正確？", "opts": {"A": "火災中人類心理緊張狀況與其所處環境的可能危險情境成反比關係", "B": "經歷逃生困難的人，其緊張程度將更為嚴重，但與時間無關", "C": "當人們遇到意外災害時，往往有返回原來途徑的本能，此種特性稱為歸巢性", "D": "逃生者常會往較不明亮的地方逃生，以遠離火勢，也就是有背光的特性"}, "answer": "C", "explain": "沿著進來的原路逃出去的本能稱為歸巢性。緊張程度隨危險升高而升高（成正比），也會隨時間拉長而加劇；人在火場傾向往明亮處跑，是向光性，不是背光。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技、88士】第六章選擇題第15題（改編為單選，刪除原選項(C)「緊張程度與人群壅塞程度無關」）", "subject": "火災學", "src": "old"}, {"id": "F-C67-016", "topic": "防火與特殊現象", "stem": "火災中居民進行逃生避難的行動時，經常會往明亮的地方逃生，並且希望遠離火災中的黑暗狀態，此一特性稱之為？", "opts": {"A": "習慣性", "B": "歸巢性", "C": "向光性", "D": "潛力性"}, "answer": "C", "explain": "往亮處移動、避開黑暗的傾向稱為向光性，所以避難方向的照明與出口標示很重要。歸巢性是走原路，習慣性是走平常慣用的路線。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第六章選擇題第16題", "subject": "火災學", "src": "old"}, {"id": "F-C67-017", "topic": "防火與特殊現象", "stem": "根據日本學者藤本盛久等人之研究，火災時避難多往經常使用之出入口或樓梯逃生，此為何種人類避難行為之特性？", "opts": {"A": "向光性", "B": "歸巢性", "C": "習慣性", "D": "開闊性"}, "answer": "C", "explain": "平時慣用的出入口與樓梯，在緊急時最先被想到，這種依日常動線逃生的傾向稱為習慣性。歸巢性強調沿進入時的原路返回，向光性強調往亮處移動。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【91消佐】第六章選擇題第17題", "subject": "火災學", "src": "old"}, {"id": "F-C67-018", "topic": "煙與熱流", "stem": "下列火場濃煙所含之氣體，何者會對身體之表面與氣道之內面造成傷害，急性中毒者常造成氣管、支氣管壞死、浮腫或肺血管之損傷？", "opts": {"A": "一氧化碳（CO）", "B": "氰酸（HCN）", "C": "氯化氫（HCl）", "D": "二氧化碳（CO₂）"}, "answer": "C", "explain": "氯化氫遇水成鹽酸，具強烈刺激與腐蝕性，會直接傷害皮膚、眼睛與呼吸道黏膜，造成氣管壞死與肺水腫。CO與HCN是造成體內缺氧的窒息性氣體，CO₂主要是高濃度時的窒息作用。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】第七章選擇題第1題", "subject": "火災學", "src": "old"}, {"id": "F-C67-019", "topic": "煙與熱流", "stem": "火場中吸入一定量的何種氣體，會刺激黏膜及麻醉中樞神經系統，出現氣管炎、肺炎或導致肺水腫的症狀？", "opts": {"A": "甲醛", "B": "一氧化碳", "C": "二氧化碳", "D": "氯化氫"}, "answer": "A", "explain": "甲醛（HCHO）兼具刺激黏膜與麻醉中樞神經的作用，大量吸入會引起氣管炎、肺炎及肺水腫。氯化氫雖有刺激性，但沒有麻醉中樞的作用；CO屬血液毒。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90、92消佐、93警技】第七章選擇題第2題（原選項(C)OCR殘缺，依文意補為二氧化碳）", "subject": "火災學", "src": "old"}, {"id": "F-C67-020", "topic": "煙與熱流", "stem": "下列何種煙中所含之有毒氣體，會妨礙細胞中氧化酵素之活性，造成細胞呼吸之停止？", "opts": {"A": "HCl", "B": "CO", "C": "HCN", "D": "HCHO"}, "answer": "C", "explain": "HCN會與細胞色素氧化酶結合，使細胞無法利用氧氣，造成細胞層級的呼吸停止。CO是與血紅素結合阻礙運氧，HCl、HCHO則以刺激作用為主。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、94消佐、89警技、89士】第七章選擇題第3題", "subject": "火災學", "src": "old"}, {"id": "F-C67-021", "topic": "煙與熱流", "stem": "火災生成煙中，HCN成份對於人體的傷害屬於下列何種毒性？", "opts": {"A": "血液毒", "B": "抑制人體新陳代謝", "C": "呼吸毒", "D": "刺激性"}, "answer": "C", "explain": "HCN抑制細胞內的呼吸酵素，使組織無法利用氧，火災學一般將其歸為呼吸毒（細胞窒息）。血液毒指的是CO與血紅素結合；刺激性指HCl、HCHO等。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【88警技】第七章選擇題第4題（改編為單選，刪除原選項(E)使蛋白質沉澱）", "subject": "火災學", "src": "old"}, {"id": "F-C67-022", "topic": "煙與熱流", "stem": "在正常呼吸的情況下，空氣中一氧化碳的濃度達到多少以上時，可在一分鐘內致人於死？", "opts": {"A": "0.07%", "B": "0.2%", "C": "0.5%", "D": "1%"}, "answer": "D", "explain": "CO濃度越高致死越快：約0.2%時1小時左右危及生命，0.5%約20～30分鐘，達1%以上則1～2分鐘內即可致死。", "ref": "【90警技、90士、94士】第七章選擇題第5題（改編為單選，刪除原選項(A)0.05%）", "subject": "火災學", "src": "old"}, {"id": "F-C67-023", "topic": "煙與熱流", "stem": "能與血液中之血色素結合，阻礙紅血球輸氧之功能，造成人員窒息死亡，係指下列何種物質？", "opts": {"A": "NO", "B": "HCl", "C": "HCN", "D": "CO"}, "answer": "D", "explain": "CO與血紅素的親和力約為氧的200倍以上，形成碳氧血紅素後紅血球無法運氧，造成組織缺氧。HCN是阻斷細胞利用氧，HCl是刺激腐蝕作用。", "ref": "【87消佐、87警技、89士、89消佐、92士】第七章選擇題第6題", "subject": "火災學", "src": "old"}, {"id": "F-C67-024", "topic": "煙與熱流", "stem": "下列何者不屬於火災氣體（fire gas）對人體的危害效果？", "opts": {"A": "HNO₃之腐蝕作用", "B": "HCHO之刺激作用", "C": "CO之毒氣作用", "D": "Cl₂之毒氣作用"}, "answer": "A", "explain": "火災氣體中常見的危害包括CO、HCN的毒性、HCHO的刺激與Cl₂、HCl的毒性或腐蝕性。HNO₃（硝酸）是液態強酸，不是火災燃燒時生成的氣體，因此不列入火災氣體的危害效果。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【88警技】第七章選擇題第7題（改編為單選，刪除原選項(E)HCl之腐蝕作用）", "subject": "火災學", "src": "old"}, {"id": "F-C67-026", "topic": "火災", "stem": "火傷後立即或一日後出現水泡，淺者二週程度即可痊癒，深者可能殘留瘢狀傷痕，此為第幾級程度之火傷？", "opts": {"A": "第一級", "B": "第二級", "C": "第三級", "D": "第四級"}, "answer": "B", "explain": "出現水泡是第二級火傷（部分皮層）的特徵，淺層可在約兩週內癒合，深層可能留疤。第一級只有紅斑疼痛，第三級為皮膚全層壞死。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、91消佐、94士】第七章選擇題第9題", "subject": "火災學", "src": "old"}, {"id": "F-C67-027", "topic": "火災", "stem": "皮膚受熱後導致全層壞死、潰瘍化，此火傷程度為幾級火傷？", "opts": {"A": "一級", "B": "二級", "C": "三級", "D": "四級"}, "answer": "C", "explain": "依四級分類：一級紅斑、二級水泡、三級皮膚全層壞死並潰瘍化、四級則已炭化。全層壞死潰瘍屬第三級。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89警技】第七章選擇題第10題（改編為單選，刪除原選項(E)五級）", "subject": "火災學", "src": "old"}, {"id": "F-C67-028", "topic": "火災", "stem": "在無風、濕度低之130°C高溫下，人約可忍耐多少時間？", "opts": {"A": "數小時", "B": "1小時", "C": "15分鐘", "D": "5分鐘"}, "answer": "C", "explain": "在乾燥、無風的環境下，人體靠出汗蒸發散熱，約65°C可忍受數小時，溫度升到130°C時只能忍耐約15分鐘；溫度更高或濕度大時耐受時間會急速縮短。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90士】第七章選擇題第11題", "subject": "火災學", "src": "old"}, {"id": "F-C67-029", "topic": "火災", "stem": "依據實驗，穿著普通作業服時，其受熱之界限值約為多少？", "opts": {"A": "2400 kcal/m²·h", "B": "1800 kcal/m²·h", "C": "1200 kcal/m²·h", "D": "800 kcal/m²·h"}, "answer": "A", "explain": "實驗顯示穿普通作業服時，人體能承受的輻射受熱界限約為2400 kcal/m²·h，超過就會有灼痛與燒傷危險；未穿衣物的裸露皮膚界限更低。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90士】第七章選擇題第12題", "subject": "火災學", "src": "old"}, {"id": "F-C67-032", "topic": "煙與熱流", "stem": "關於火場濃煙之敘述，下列何者為非？", "opts": {"A": "火場人員死因多與濃煙有關，真正遭受火傷者反而較少", "B": "近年建築物裝潢材料多轉化為高分子物質，致使火場濃煙大量產生", "C": "火場濃煙之粒子密度大，故多沉於空氣底層", "D": "玻璃帷幕式大樓外觀好看，但並不有利於火場排煙"}, "answer": "C", "explain": "火場濃煙是被熱氣流帶著上升的微粒，會先積聚在天花板下方再向下擴展，並不是沉在底層，所以逃生時要壓低身體。其餘敘述皆正確：多數死者死於煙，高分子材料發煙量大，帷幕牆大樓難以開窗排煙。", "ref": "【87消佐】第七章選擇題第15題", "subject": "火災學", "src": "old"}, {"id": "F-C67-033", "topic": "煙與熱流", "stem": "下列何項措施，非屬實施防煙對策之範疇？", "opts": {"A": "設置防火閘門", "B": "設置排煙設備", "C": "防焰規制", "D": "防火管理"}, "answer": "D", "explain": "防火閘門阻止煙流動、排煙設備將煙排出、防焰規制從源頭減少發煙，三者都是防煙對策的硬體或制度。防火管理是涵蓋用火管理、訓練、編組等的整體管理制度，不屬於防煙對策本身。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【87消佐】第七章選擇題第16題", "subject": "火災學", "src": "old"}, {"id": "F-C67-034", "topic": "煙與熱流", "stem": "建築物火災中，導致煙霧蔓延的因素，不包括？", "opts": {"A": "火源種類", "B": "煙囪效應", "C": "空調系統管道間", "D": "空氣膨脹"}, "answer": "A", "explain": "煙在建築物內蔓延的驅動力包括煙囪效應、熱膨脹、浮力、風力與空調系統。火源種類影響發煙量與煙的成分，但不是推動煙在建築內移動的因素。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第七章選擇題第17題", "subject": "火災學", "src": "old"}, {"id": "F-C67-036", "topic": "煙與熱流", "stem": "在防煙對策中，何者屬於積極向外排煙方法？", "opts": {"A": "內部裝潢材料限制", "B": "採用防火閘門", "C": "防焰制度建立", "D": "排煙室排煙法"}, "answer": "D", "explain": "排煙室（特別安全梯前室）配置排煙設備把煙排出室外，屬於積極排煙。裝潢材料限制與防焰制度是抑制發煙源，防火閘門是阻止煙流動。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐、9X士（年份OCR缺字）】第七章選擇題第19題", "subject": "火災學", "src": "old"}, {"id": "F-C67-037", "topic": "煙與熱流", "stem": "火場之煙若有通過大樓內部空調管道時，應設置何種設備阻絕煙之流動？", "opts": {"A": "防火鐵捲門", "B": "防火閘門", "C": "防火隔板", "D": "自動除煙設備"}, "answer": "B", "explain": "風管貫穿防火區劃處應設防火閘門（防火風門），遇熱或偵煙時自動關閉，阻止火煙沿管道擴散。防火鐵捲門用於開口部，不能裝在風管內。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐、89士】第七章選擇題第20題", "subject": "火災學", "src": "old"}, {"id": "F-C67-038", "topic": "煙與熱流", "stem": "火災中煙霧濃度的計算，根據Lambert吸收法則，光學密度（Optical Density，ODₓ）定義為何？其中I₀、Iₓ分別為入射光強度及經過某一距離後之受光強度。", "opts": {"A": "ODₓ＝log₁₀(I₀/Iₓ − 2)", "B": "ODₓ＝log₁₀(2 − I₀/Iₓ)", "C": "ODₓ＝log₁₀(I₀/Iₓ)", "D": "ODₓ＝log₁₀(100 + I₀/Iₓ)"}, "answer": "C", "explain": "光學密度是入射光與透過光強度比值取常用對數，ODₓ＝log₁₀(I₀/Iₓ)；煙越濃，Iₓ越小，OD越大。其他選項在比值中加減常數，不符定義。", "ref": "【92消佐】第七章選擇題第21題", "subject": "火災學", "src": "old"}, {"id": "F-C67-039", "topic": "煙與熱流", "stem": "煙霧濃度計算中，遮光率（Light Obscuration，Sₓ）的定義為Sₓ＝100(1 − Iₓ/I₀)，其中I₀、Iₓ分別為入射光及受光強度，根據Lambert吸收法則，光學密度（Optical Density，ODₓ）定義為ODₓ＝log₁₀(I₀/Iₓ)，則兩者間的關係式可寫成？", "opts": {"A": "ODₓ＝2 − log₁₀(100 − Sₓ)", "B": "ODₓ＝2 − log₁₀(10 − Sₓ)", "C": "ODₓ＝1 − log₁₀(100 − Sₓ)", "D": "ODₓ＝2 − log₁₀(1 − Sₓ)"}, "answer": "A", "explain": "由Sₓ＝100(1 − Iₓ/I₀)得I₀/Iₓ＝100/(100 − Sₓ)，代入ODₓ＝log₁₀(I₀/Iₓ)＝log₁₀100 − log₁₀(100 − Sₓ)＝2 − log₁₀(100 − Sₓ)。", "ref": "【91警技】第七章選擇題第22題（改編為單選，刪除原選項(E)ODₓ＝1 − log₁₀(10 − Sₓ)）", "subject": "火災學", "src": "old"}, {"id": "F-C67-041", "topic": "煙與熱流", "stem": "在計算煙濃度中的可見距離時，須瞭解光學密度，根據Lambert吸收法則，光學密度（optical density，ODₓ）定義為ODₓ＝log₁₀(I₀/Iₓ)，其中I₀、Iₓ分別為原入射光強度及距離x時的受光強度，若已知ODₓ＝1.0，則其中入射光被遮蔽（obscured）多少？", "opts": {"A": "100%", "B": "90%", "C": "50%", "D": "10%"}, "answer": "B", "explain": "ODₓ＝1代表I₀/Iₓ＝10，即只有1/10的光透過；遮蔽率＝1 − Iₓ/I₀＝1 − 0.1＝90%。選10%是把透過率誤當遮蔽率。", "ref": "【93警技】第七章選擇題第24題", "subject": "火災學", "src": "old"}, {"id": "F-C67-042", "topic": "煙與熱流", "stem": "下列有關「火場能見度」之敘述，何者有誤？", "opts": {"A": "能夠清楚辨別物體之對比度C＝−0.02為其臨界值", "B": "發光物體之能見度為反光物體能見度之2～4倍", "C": "觀察者位置與物體間之距離愈遠，其感受之對比度愈小", "D": "物體之能見度乃對比度C減小至−0.05之距離"}, "answer": "D", "explain": "能見度的定義是物體與背景的對比度減小到臨界值−0.02時的距離，不是−0.05，故(D)錯。發光物體能見度約為8/Cs、反光物體約為3/Cs，相差約2～4倍；距離越遠對比度越小。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】第七章選擇題第25題（原選項(C)句末缺字，依文意補為「愈小」）", "subject": "火災學", "src": "old"}, {"id": "F-C67-044", "topic": "煙與熱流", "stem": "煙控分析中有關「等效流動面積」的定義為？", "opts": {"A": "在相同溫差下造成同樣流動之單一開口面積", "B": "在相同時差下造成同樣流動之單一開口面積", "C": "在相同壓差下造成同樣流動之單一開口面積", "D": "在不同溫差下造成同樣流動之單一開口面積"}, "answer": "C", "explain": "開口的流量由壓差驅動，等效流動面積是把多個串聯或並聯的開口，換算成在相同壓差下產生相同流量的單一開口面積，方便煙控計算。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐、91、94警技】第七章選擇題第27題（改編為單選，刪除原選項(E)相同濕差）", "subject": "火災學", "src": "old"}, {"id": "F-C67-045", "topic": "煙與熱流", "stem": "在火災模擬計算過程中，有時需要計算空氣質量流率的數據，假如在一大氣壓力、0°C的條件下，已知空氣密度為1.29 kg/m³，則以理想氣體方程式（PV＝nRT，一大氣壓力＝101325 N/m²，R＝8.31 J/K·mol，n：莫耳數，T：溫度（K））所求得一莫耳（mole）的空氣質量約為多少？", "opts": {"A": "1.290公斤", "B": "0.289公斤", "C": "0.129公斤", "D": "0.0289公斤"}, "answer": "D", "explain": "1莫耳體積V＝nRT/P＝8.31×273÷101325≈0.0224 m³，質量＝密度×體積＝1.29×0.0224≈0.0289 kg，與空氣平均分子量約29 g/mol相符。", "ref": "【94警技】第七章選擇題第28題", "subject": "火災學", "src": "old"}, {"id": "F-C67-046", "topic": "煙與熱流", "stem": "一個加壓空間中存在三個面積分別為0.10 m²、0.20 m²、0.30 m²的開口相互並聯時，其等效流動面積為？", "opts": {"A": "0.20 m²", "B": "0.50 m²", "C": "0.60 m²", "D": "0.90 m²"}, "answer": "C", "explain": "並聯開口的等效流動面積直接相加：0.10＋0.20＋0.30＝0.60 m²。若是串聯才要用Aₑ＝(1/A₁²＋1/A₂²＋1/A₃²)^(−1/2)計算。", "ref": "【91、93士】第七章選擇題第29題", "subject": "火災學", "src": "old"}, {"id": "F-C67-047", "topic": "煙與熱流", "stem": "已知建築物室內空間形狀為長8公尺、寬5公尺、高3公尺，今有一小規模火災（1.5公尺×1.5公尺）發生於室內某處，試預估當濃煙層（smoke layer）下降到離地板高度1.5公尺處約需10秒，若建築物空間形狀變為長10公尺、寬8公尺，其餘條件皆不改變，則煙層下降到離地板高度1.5公尺處，約需時多少？", "opts": {"A": "5秒", "B": "10秒", "C": "20秒", "D": "40秒"}, "answer": "C", "explain": "煙層下降時間與室內地板面積成正比，面積由40 m²變為80 m²加倍，時間也加倍：10×80/40＝20秒。", "ref": "【94消佐】第七章選擇題第30題", "subject": "火災學", "src": "old"}, {"id": "F-C8-001", "topic": "火災", "stem": "建築物由窗口噴出之火焰，向上層延燒者，下列何種窗形最為危險？", "opts": {"A": "縱形窗", "B": "橫形窗", "C": "正形窗", "D": "圓形窗"}, "answer": "B", "explain": "橫形窗（寬大於高）噴出的火焰容易貼附外牆垂直上升，直接威脅上層窗戶；縱形窗的火焰則較易離開牆面，危險性較低。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-002", "topic": "火災", "stem": "當建築物發生火災時，下列何種形狀之窗戶，火焰向外噴出時，尾端遠離側壁，不致順外壁上昇，因此上層窗玻璃承受之熱氣流溫度較低？", "opts": {"A": "橫形窗", "B": "縱形窗", "C": "正形窗", "D": "不定"}, "answer": "B", "explain": "縱形窗（高大於寬）噴出的火焰會向外彎離牆面，上層窗受熱較少；橫形窗則相反，火焰易吸附牆面上升。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-003", "topic": "火災", "stem": "窗之上層有建築物時，火焰流動軌跡與窗之寬度（W）／高度（H）之值關係密切。下列寬度／高度之比值中，何者上層被延燒之危險性最高？", "opts": {"A": "W/H＝1.0", "B": "W/H＝1.5", "C": "W/H＝2.0", "D": "W/H＝3.0"}, "answer": "D", "explain": "W/H 比值愈大（愈接近橫長窗），火焰愈容易貼著外牆向上竄，上層延燒危險愈高，故以 3.0 最危險。", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-004", "topic": "火災", "stem": "防火建築設計中，為防止下層窗戶火焰向上延燒，以何種方式最為有效？", "opts": {"A": "縮小窗口尺寸", "B": "增加側壁高度", "C": "設置屋簷突出物", "D": "改善窗框及用水幕撒水設備"}, "answer": "C", "explain": "外牆設置向外突出的屋簷（或陽台）可把噴出的火焰推離牆面，阻斷其貼牆上升路徑，是防止向上延燒最有效的做法；其他選項僅能部分改善。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-005", "topic": "火災", "stem": "建築物火災時火勢的擴大有時是經由外牆的窗戶向上延燒，下列防止火焰向上延燒的改善措施何者錯誤？", "opts": {"A": "窗戶加裝防火玻璃窗", "B": "窗戶加裝水幕撒水設備", "C": "縮小窗口尺寸", "D": "降低外牆側壁高度"}, "answer": "D", "explain": "上下層窗戶間的外牆（側壁）愈高，阻隔下層火焰的效果愈好；降低側壁高度反而使上層更易被延燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-008", "topic": "火災", "stem": "當室內發生火勢強烈的火災時，由於可燃物之熱分解，產生大量的可燃性氣體，蓄積於天花板附近，此種氣體與空氣混合，正好進入燃燒範圍之際，一舉引火形成鉅大之火焰，如同一片火海之狀態。此種現象為何？", "opts": {"A": "爆燃", "B": "轟燃", "C": "閃燃", "D": "全燃"}, "answer": "C", "explain": "題述為可燃氣體蓄積天花板後一舉引燃、全室陷入火海的閃燃（flashover）。注意：中國大陸用語「轟燃」亦指 flashover，與本題正解同義，作答時依台灣慣用語選閃燃。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-009", "topic": "火災", "stem": "木造建築物火災時，室內溫度達最高點時的溫度，稱為：", "opts": {"A": "發火點", "B": "引火點", "C": "燃點", "D": "閃燃點"}, "answer": "D", "explain": "發火點、引火點、燃點都是描述可燃物本身開始燃燒的溫度特性，與整棟建築火災溫度曲線無關；題意指火災溫度曲線上的峰值，依本書用語稱閃燃點。此題用語特殊，僅能依教材定義作答。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-010", "topic": "火災", "stem": "下列有關區劃空間發生閃燃時的敘述，何者不正確？", "opts": {"A": "氧氣濃度驟降至接近零", "B": "此時為燃料控制燃燒", "C": "室內溫度可達800℃以上", "D": "一氧化碳的濃度幾乎達最大值"}, "answer": "B", "explain": "閃燃後室內可燃氣體極多、空氣不足，燃燒速率受開口進氣量限制，屬通風控制燃燒而非燃料控制燃燒；此時氧氣急降、溫度升至800℃以上、一氧化碳濃度達峰值。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-011", "topic": "火災", "stem": "建築物房間開口部之尺寸與位置會影響閃燃發生時間，當開口率愈小，閃燃發生時間會如何？", "opts": {"A": "較長", "B": "較短", "C": "不變", "D": "不一定"}, "answer": "A", "explain": "開口率愈小，供氧愈受限，火勢成長慢，閃燃時間拉長；但開口率極大時熱量大量散失，閃燃時間也會變長。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【士（年份不詳）】", "subject": "火災學", "src": "old"}, {"id": "F-C8-012", "topic": "火災", "stem": "區劃空間中的火源位於下列何處時，火源上方天花板處的溫度最高？", "opts": {"A": "樓地板中央", "B": "牆壁下", "C": "牆角下", "D": "靠窗戶下"}, "answer": "C", "explain": "火源位於牆角時，兩面牆阻擋了火羽流捲入冷空氣，火焰拉長、溫度下降少，天花板溫度最高；位於中央時四周都能捲入空氣，溫度最低。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-014", "topic": "火災", "stem": "閃燃時間之長短與使用裝潢材料之位置有關，其中同種類等面積之裝潢材料裝修於何處時，影響閃燃時間最大？", "opts": {"A": "地板面", "B": "牆壁面上部", "C": "牆壁面下部", "D": "天花板面"}, "answer": "D", "explain": "天花板直接接觸上升的熱煙層，受熱最快、燃燒後又向下輻射，對閃燃時間影響最大；影響程度大致為天花板＞牆面＞地板。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐、89士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-019", "topic": "火災", "stem": "一般學者（如Babrauskas、Thomas等）在研究火災閃燃的過程中，經常會以「熱釋放率」（Heat release rate，HRR）來做為是否達到閃燃發生的判斷標準之一，試問熱釋放率的單位為：", "opts": {"A": "瓦特（W）", "B": "焦耳（J）", "C": "巴斯卡（Pa）", "D": "溫度（K）"}, "answer": "A", "explain": "熱釋放率是單位時間釋放的熱能（J/s），即功率單位瓦特；焦耳是能量、巴斯卡是壓力、K 是溫度單位。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-020", "topic": "火災", "stem": "消防人員於耐火建築物火災之搶救時，應避免隨意打開開口部，造成大量空氣湧入，因而可能使充滿室內之可燃性氣體一舉燃燒，火焰從窗口噴出，造成危險。此種動作係為避免下列何種現象發生？", "opts": {"A": "閃燃（Flash Over）", "B": "輻射能回饋效果（Radiant Energy Feedback）", "C": "複燃（Back Draft）", "D": "燃料控制燃燒（Fuel Controlled）"}, "answer": "C", "explain": "缺氧悶燒的密閉空間蓄積大量可燃氣體，一旦開口引入新鮮空氣即瞬間爆燃噴出，稱為複燃（backdraft）；閃燃是熱量累積引起，並非因突然進氣。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【消佐（年份不詳）】", "subject": "火災學", "src": "old"}, {"id": "F-C8-021", "topic": "火災", "stem": "火場中出現複燃（backdraft）現象時，經常造成現場救災人員的重大傷亡意外，試問在火場複燃發生前的密閉空間中，主要是缺哪一種燃燒要素？", "opts": {"A": "可燃物", "B": "熱能", "C": "氧氣", "D": "蒸氣"}, "answer": "C", "explain": "複燃前室內高溫、可燃氣體充足，唯獨氧氣不足而處於悶燒；開口引進氧氣後三要素齊備即猛烈燃燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-022", "topic": "煙與熱流", "stem": "在未發生火災之前，居室內部是呈現低溫的平衡狀態，但是當火災發生後，由於燃燒作用所生成的大量熱及能量釋放，會導致居室內部溫度及壓力變化，進而產生向上推昇的浮力作用，同時將燃燒所生成的各種生成物一起混合往上擠壓的現象，此種情形稱為火災熱流中的何種現象？", "opts": {"A": "火柱現象（fire plume）", "B": "複燃現象（back draft）", "C": "牆壁熱流現象（wall flow）", "D": "開口部熱流現象（vent flow）"}, "answer": "A", "explain": "火源上方熱氣因浮力上升並捲入周圍空氣與燃燒生成物，形成的上升柱狀熱流稱為火羽（火柱）；牆壁熱流、開口部熱流是熱流撞到牆或流經開口後的行為。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技】（改編為單選，刪除原(E)閃燃現象）", "subject": "火災學", "src": "old"}, {"id": "F-C8-023", "topic": "防火與特殊現象", "stem": "當油池內有積水，火災發生時，即可能發生何種現象？", "opts": {"A": "BLEVE", "B": "突沸（揚沸）（boilover）", "C": "爆轟", "D": "閃燃"}, "answer": "B", "explain": "油槽底部積水被向下傳遞的熱波加熱至沸騰，急速汽化膨脹把上方燃油噴出，稱為沸溢（boilover）；BLEVE 是壓力容器內液化氣體沸騰膨脹爆炸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-024", "topic": "燃燒", "stem": "依據日本學者秋田一雄之研究結果，木材種類與發火溫度之關係不大，通常其表面溫度達多少以上，即可滿足發火之條件？", "opts": {"A": "290℃", "B": "390℃", "C": "490℃", "D": "590℃"}, "answer": "C", "explain": "秋田一雄研究指出木材不論樹種，表面溫度達約490℃即可自行發火（無需火種）；約260℃則是木材的引火危險溫度，兩者勿混淆。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-025", "topic": "燃燒", "stem": "依據日本學者秋田一雄研究結果，木材種類與發火溫度之關係不大，通常只要其表面溫度達到多少℃左右，即可滿足發火之條件？", "opts": {"A": "100℃", "B": "260℃", "C": "350℃", "D": "490℃"}, "answer": "D", "explain": "木材表面發火溫度約490℃；260℃為木材的引火（低溫起火危險）溫度，是本題最常見的誘答。", "ref": "【87、89、90、94消佐、94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-026", "topic": "燃燒", "stem": "對木材而言有所謂之發火假設溫度為a，引火假設溫度為b及無焰發火假設溫度為c，此三者，其溫度之高低，下列何者為是？", "opts": {"A": "a＞b＞c", "B": "a＜b＜c", "C": "a＞c＞b", "D": "a＜c＜b"}, "answer": "C", "explain": "有火種引燃（引火）所需表面溫度最低，無火種時先出現無焰（赤熱）發火，最高的是無火種下的有焰發火（約490℃），故 a＞c＞b。本題依文獻推定，書上未附答案。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【92警技】（改編為單選，刪除原(E)b＜a＜c）", "subject": "火災學", "src": "old"}, {"id": "F-C8-027", "topic": "燃燒", "stem": "一般而言，火災中引發木材著火的最低輻射熱通量值，約為：", "opts": {"A": "12 kW/cm²", "B": "12 kW/m²", "C": "12 W/m²", "D": "12 W/cm²"}, "answer": "B", "explain": "木材受輻射引火的臨界熱通量約 12～12.5 kW/m²；12 W/cm² 等於 120 kW/m²，12 kW/cm² 更大得離譜，12 W/m² 則幾乎無熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-028", "topic": "燃燒", "stem": "1公斤（1kg）木材之發熱量約為多少？", "opts": {"A": "1800 kcal/kg", "B": "2700 kcal/kg", "C": "3600 kcal/kg", "D": "4500 kcal/kg"}, "answer": "D", "explain": "木材燃燒熱約 18～19 MJ/kg，換算約 4,500 kcal/kg（1 kcal≒4.18 kJ）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-031", "topic": "燃燒", "stem": "木材的化學成分中，燃燒時形成焦炭比率最多的是：", "opts": {"A": "纖維素", "B": "半纖維素", "C": "木質素", "D": "膠質"}, "answer": "C", "explain": "木質素為芳香族高分子，熱穩定性高，熱分解時殘留焦炭比例最高；纖維素與半纖維素多分解成可燃揮發物。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-032", "topic": "燃燒", "stem": "將磷酸鹽或硼酸鹽加入纖維質材料中，受熱燃燒時：", "opts": {"A": "固體表面將產生較多的焦炭", "B": "火焰中H₂O的比例將減少", "C": "火焰中CO₂的比例減少", "D": "燃燒熱將提高"}, "answer": "A", "explain": "磷酸鹽、硼酸鹽是纖維質的耐燃劑，促使材料脫水炭化，產生較多焦炭與水、減少可燃揮發物，燃燒熱因而降低。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-033", "topic": "燃燒", "stem": "木材因長期低溫受熱，導致未達260℃即引火燃燒，此一現象稱之為「木材之低溫著火」，由經驗得知，易造成木材低溫著火的危險處所，下列敘述何者不正確？", "opts": {"A": "煙囪等貫穿之屋頂", "B": "木材堆置場", "C": "三溫暖室暖爐等熱源之周圍", "D": "乾燥室內蒸氣管接觸之部分"}, "answer": "B", "explain": "低溫著火需木材長期接觸穩定熱源（煙囪、暖爐、蒸氣管）；單純的木材堆置場沒有持續加熱源，不屬此類危險處所。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【消佐（年份不詳）】", "subject": "火災學", "src": "old"}, {"id": "F-C8-034", "topic": "火災", "stem": "下列何者為研究火災工程中，「火載量」（fire load）的定義？", "opts": {"A": "單位時間之發熱量（cal/sec）", "B": "單位體積之可燃物量（kg/m³）", "C": "室內之可燃物量（kg）", "D": "單位面積之可燃物量（kg/m²）"}, "answer": "D", "explain": "火載量是室內可燃物總量換算為每單位樓地板面積的量（kg/m²）；單位時間發熱量是熱釋放率，不是火載量。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、93、94消佐、警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-035", "topic": "火災", "stem": "一般研究火災中，所謂的「相當火災猛烈度」（equivalent fire severity），須要一條標準溫度－時間曲線來進行驗算，請問英國國家標準第476號第8部（BS476 Part 8）的溫度－時間曲線為何？（T₀：起始溫度；T：溫度；t：時間（秒））", "opts": {"A": "T＝T₀＋345 log(0.133t＋1)", "B": "T＝T₀＋245 log(0.133t＋1)", "C": "T＝T₀＋245×(0.133t＋1)", "D": "T＝T₀＋245×ln(0.133t＋1)"}, "answer": "A", "explain": "標準火災曲線為 T＝T₀＋345 log₁₀(8t＋1)（t 以分鐘計）；改以秒計時 8/60≒0.133，即 T＝T₀＋345 log(0.133t＋1)。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-036", "topic": "火災", "stem": "所謂火載量（Fire Load）係指單位面積之可燃物量（kg/m²），如有一倉庫長5公尺，寬10公尺，高2公尺，可燃物總重500公斤，則其火載量為何？", "opts": {"A": "50 kg/m²", "B": "25 kg/m²", "C": "10 kg/m²", "D": "5 kg/m²"}, "answer": "C", "explain": "火載量＝可燃物量／樓地板面積＝500 ÷ (5×10)＝10 kg/m²；高度不影響，除以體積 100 m³ 得 5 是誘答。", "ref": "【89、92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-041", "topic": "爆炸", "stem": "過大電流通過時，所產生之電氣爆炸是屬於下列何者？", "opts": {"A": "固態爆炸", "B": "液態爆炸", "C": "氣態爆炸", "D": "瓦斯爆炸"}, "answer": "A", "explain": "導線通過過大電流瞬間熔融汽化而爆開，是金屬固體急速相變造成的爆炸，歸類為固相（固態）爆炸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-042", "topic": "防火與特殊現象", "stem": "下列何者非絕緣電線起火之原因？", "opts": {"A": "過大電流", "B": "短路", "C": "局部過熱", "D": "二條電線被覆接觸"}, "answer": "D", "explain": "絕緣被覆完好時兩線被覆互相接觸並不導通，不會起火；過大電流、短路、局部過熱都會使導線發熱起火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-043", "topic": "防火與特殊現象", "stem": "下列哪一項會造成電氣局部之電阻值減低？", "opts": {"A": "電容器的絕緣劣化", "B": "斷線", "C": "氧化亞銅增殖發熱現象", "D": "接續部螺絲未栓緊"}, "answer": "A", "explain": "絕緣劣化使原本不該導通處出現電流路徑，屬電阻值降低；斷線、氧化亞銅增殖、接續部鬆脫都是局部電阻值增加。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-044", "topic": "防火與特殊現象", "stem": "下列何者不屬於電氣火災中之「焦耳熱」？", "opts": {"A": "通電部導體之接觸", "B": "三相三線式配線之一線斷線", "C": "開關類接點之熔解", "D": "放電火花發生之熱"}, "answer": "D", "explain": "焦耳熱是電流流經電阻產生的熱（Q＝I²R）；放電火花是電荷經空氣絕緣破壞放電產生的熱，屬另一類電氣發熱。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-045", "topic": "防火與特殊現象", "stem": "電氣火災發生之現象，主要是電能轉變而發生熱。此種熱之發生種類主要為：", "opts": {"A": "焦耳熱", "B": "莫耳熱", "C": "電熱", "D": "活化能"}, "answer": "A", "explain": "電流通過導體電阻時電能轉為熱能，即焦耳熱，是電氣火災最主要的熱源；莫耳熱、活化能與此無關。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-046", "topic": "防火與特殊現象", "stem": "歐姆定律係由電阻（R）、電流（I）、電壓（V）三者關係所成，試問歐姆定律之公式為何？", "opts": {"A": "V＝IR", "B": "I＝VR", "C": "R＝VI", "D": "R＝V＋I"}, "answer": "A", "explain": "歐姆定律：電壓等於電流乘以電阻，V＝IR（亦可寫 I＝V/R、R＝V/I）；其餘選項乘除關係錯誤。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-047", "topic": "防火與特殊現象", "stem": "當電流通過電線時，因其電阻，必會產生焦耳熱，假設電流為I安培，電線之電阻為R歐姆，則發生之熱量Q（瓦特）為：", "opts": {"A": "IR", "B": "IR²", "C": "I²R", "D": "I²/R"}, "answer": "C", "explain": "焦耳熱功率 P＝IV，代入 V＝IR 得 P＝I²R；IR 只是電壓，其餘形式單位不符。", "ref": "【91消佐、88、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-048", "topic": "防火與特殊現象", "stem": "帶靜電之導體通常其蓄積之靜電能量均將化成放電能量，若此能量大於可燃性物質之最小發火能量則可產生火災或爆炸，若帶電體之靜電能量以E表示，電壓為V，電荷為Q，靜電容量為C，則：", "opts": {"A": "E＝C×V", "B": "E＝C×V²", "C": "E＝1/2×C×V", "D": "E＝1/2×Q×V"}, "answer": "D", "explain": "靜電能量 E＝½CV²＝½QV＝Q²/2C（Q＝CV）；選項中只有 ½QV 正確，C×V² 少了 ½，C×V 是電荷量。", "ref": "【61期專修、87警技】（改編為單選，刪除原(E)E＝Q×V）", "subject": "火災學", "src": "old"}, {"id": "F-C8-050", "topic": "防火與特殊現象", "stem": "易燃性液體，其帶電量與流速有很大的關連，因此為減少靜電之發生，其流速最好應在多少以下？", "opts": {"A": "0.5 m/s", "B": "1.0 m/s", "C": "1.5 m/s", "D": "2.0 m/s"}, "answer": "B", "explain": "液體流動帶電量隨流速增加而增大，一般建議易燃性液體輸送流速控制在約 1 m/s 以下以抑制靜電。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87警技】（改編為單選，刪除原(E)3.0 m/s）", "subject": "火災學", "src": "old"}, {"id": "F-C8-052", "topic": "防火與特殊現象", "stem": "下列何種液體擁有最低之固有電阻值？", "opts": {"A": "甲醇", "B": "燈油", "C": "輕油", "D": "汽油"}, "answer": "A", "explain": "醇、酯、酮類等極性液體固有電阻低（約10⁸ Ω·cm以下），電荷易洩漏；燈油、輕油、汽油等石油類固有電阻高，最易帶電。", "ref": "【89警技】（改編為單選，刪除原(E)噴射機油）", "subject": "火災學", "src": "old"}, {"id": "F-C8-053", "topic": "防火與特殊現象", "stem": "液體於流送、噴出、混合、攪拌、過濾之際，易因摩擦而帶電。下列何種物質最易發生電荷？", "opts": {"A": "燈油", "B": "甲醇", "C": "丙酮", "D": "苯酚"}, "answer": "A", "explain": "燈油屬石油類，固有電阻高，電荷不易洩漏而易蓄積；甲醇、丙酮、苯酚為極性物質，電阻低較不易帶電。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-054", "topic": "防火與特殊現象", "stem": "下列敘述何者有誤？", "opts": {"A": "帶電物體之靜電放電，大致可分為「氣中放電」與「沿面放電」", "B": "條狀放電較電暈放電易生災害", "C": "火花放電是「沿面放電」之一種", "D": "「沿面放電」與「火花放電」均易成為火災原因"}, "answer": "C", "explain": "火花放電、電暈放電、條狀放電都在空氣中發生，屬氣中放電；沿面放電是沿絕緣物表面發生的另一類，故 C 錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-055", "topic": "防火與特殊現象", "stem": "電氣火災中因電氣條件改變造成的火災因素，不包括：", "opts": {"A": "電阻值降低", "B": "導線過負載", "C": "局部電阻值增加", "D": "靜電誘導"}, "answer": "D", "explain": "電氣條件改變造成的火災分為電阻值降低、負荷增加（過負載）、局部電阻值增加三類；靜電誘導屬靜電火災，不在此範疇。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-057", "topic": "防火與特殊現象", "stem": "電氣火災中因電氣條件改變造成的火災因素，不包括：", "opts": {"A": "斷熱壓縮", "B": "導線過負載", "C": "局部電阻值增加", "D": "電阻值降低"}, "answer": "A", "explain": "斷熱壓縮是氣體被急速壓縮升溫的力學起火源，與電路電氣條件無關；其他三者是電氣條件改變的三大類。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-059", "topic": "防火與特殊現象", "stem": "下列何者不是靜電發生之主要原因？", "opts": {"A": "摩擦帶電", "B": "雲間放電", "C": "剝離帶電", "D": "流動帶電"}, "answer": "B", "explain": "摩擦、剝離、流動都是物體接觸分離而帶電的方式；雲間放電是雷電的放電現象，不是靜電產生的原因。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-060", "topic": "防火與特殊現象", "stem": "氧化亞銅增殖發熱現象屬於下列哪一種電氣條件的變化？", "opts": {"A": "電阻值降低", "B": "負荷增加", "C": "局部電阻值增加", "D": "配線之一線斷線"}, "answer": "C", "explain": "銅導體接續不良處生成氧化亞銅並逐漸擴大，形成高電阻、持續發熱，屬局部電阻值增加。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-061", "topic": "防火與特殊現象", "stem": "變壓器、馬達之線圈銅線，若出現針孔損壞或絕緣劣質化，以致迴路發生感應電流過大，終而導致局部發熱乃至發火。此種現象謂之：", "opts": {"A": "電容器絕緣劣化", "B": "層間短路現象", "C": "負荷增加", "D": "斷線現象"}, "answer": "B", "explain": "線圈相鄰匝間絕緣破損而互相導通，形成短路環並感應大電流發熱，稱為層間短路，屬電阻值降低類。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-062", "topic": "防火與特殊現象", "stem": "下列何者係藉由中和防止電荷蓄積？", "opts": {"A": "使用導電性材料", "B": "利用電暈放電產生空氣離子化", "C": "使用除電劑", "D": "接線或接地"}, "answer": "B", "explain": "除電器利用電暈放電使空氣離子化，以異極離子中和帶電體電荷；導電性材料、除電劑（抗靜電劑）、接地接線都是讓電荷洩漏的方法。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89警技】（改編為單選，刪除原(E)增加周圍空氣溼度）", "subject": "火災學", "src": "old"}, {"id": "F-C8-064", "topic": "防火與特殊現象", "stem": "下列哪項係藉中和防止電荷蓄積之方法？", "opts": {"A": "接地與接線", "B": "使用導電性材料", "C": "靜電誘導之離子化", "D": "增加周圍空氣濕度"}, "answer": "C", "explain": "靜電誘導使空氣離子化，產生異極離子中和帶電體電荷，屬中和法；其餘三者皆讓電荷經導體或水膜洩漏。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-065", "topic": "防火與特殊現象", "stem": "下列有關藉由增加空氣濕度之防靜電措施的敘述，何者正確？", "opts": {"A": "會使絕緣體表面形成水膜，增加其表面電阻", "B": "會使靜電主要經由空氣洩漏", "C": "當靜電發生處所低於室溫時，效果更佳", "D": "絕緣體表面的水膜含有雜質時，會干擾靜電的洩漏"}, "answer": "C", "explain": "提高濕度是讓絕緣體表面形成水膜、降低表面電阻，電荷沿表面洩漏；表面溫度低於室溫較易凝結水膜，效果較好。水膜中的雜質反而增加導電性。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-066", "topic": "防火與特殊現象", "stem": "下列哪一種物質無法藉由增加空氣的濕度而有效的消除其表面的靜電？", "opts": {"A": "聚氯乙烯", "B": "紙張", "C": "橡膠", "D": "醋酸纖維素"}, "answer": "A", "explain": "增濕法需材料表面能吸附水分形成水膜；聚氯乙烯等疏水性塑膠表面不易形成水膜，增濕效果差。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-069", "topic": "防火與特殊現象", "stem": "若某人之靜電容量為200 μμF（pF），在油漆布上行走時帶有10³ V之電壓，試求其接觸接地之金屬時，其放出之能量為多少？", "opts": {"A": "0.1 mJ", "B": "0.2 mJ", "C": "0.3 mJ", "D": "0.4 mJ"}, "answer": "A", "explain": "E＝½CV²＝½ × 200×10⁻¹² F × (10³ V)²＝1×10⁻⁴ J＝0.1 mJ（μμF 即 pF＝10⁻¹² F）。", "ref": "【92警技】（改編為單選，刪除原(E)0.5mJ）", "subject": "火災學", "src": "old"}, {"id": "F-C8-070", "topic": "防火與特殊現象", "stem": "在常用電壓110V下若某延長線之容許電流為15安培，則在該線上所有用電器具之總耗電功率不得超過多少？", "opts": {"A": "825 W", "B": "1650 W", "C": "2475 W", "D": "3300 W"}, "answer": "B", "explain": "功率 P＝IV＝15 A × 110 V＝1650 W。", "ref": "【92警技】（改編為單選，刪除原(E)4125W）", "subject": "火災學", "src": "old"}, {"id": "F-C8-071", "topic": "防火與特殊現象", "stem": "假設線徑1.6mm之單線其容許電流是27安培，假設其使用電流為25安培，若因電線被壓、斷線或未密接而增加其電阻值時，試問當其電阻值升至多少時，其每公分發生之熱量可達0.2瓦？", "opts": {"A": "2.7×10⁻⁴ Ω/cm", "B": "2.9×10⁻⁴ Ω/cm", "C": "3.2×10⁻⁴ Ω/cm", "D": "3.4×10⁻⁴ Ω/cm"}, "answer": "C", "explain": "焦耳熱 P＝I²R，0.2＝25² × R，R＝0.2/625＝3.2×10⁻⁴ Ω/cm。", "ref": "【92警技】（改編為單選，刪除原(E)3.8×10⁻⁴Ω/cm）", "subject": "火災學", "src": "old"}, {"id": "F-C8-072", "topic": "防火與特殊現象", "stem": "金屬導體與大地間以電氣之接續，使金屬導體之電位大致與大地相同，此種現象稱為：", "opts": {"A": "接地", "B": "流動帶電", "C": "摩擦放電", "D": "剝離帶電"}, "answer": "A", "explain": "以導線將導體與大地連接使兩者等電位，稱為接地，可讓電荷洩入大地；其他選項為帶電或放電現象。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-073", "topic": "防火與特殊現象", "stem": "下列何者為地絡形成之原因？", "opts": {"A": "架空配線與樹木接觸", "B": "金屬管內電纜包覆損傷，致電線與管壁接觸", "C": "電氣設備充電部與雨水、工具、人體等接觸", "D": "以上皆是"}, "answer": "D", "explain": "地絡是帶電部分經非預期路徑與大地導通；樹木、金屬管壁、雨水或人體接觸帶電部都會構成接地路徑，三者皆是。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-076", "topic": "防火與特殊現象", "stem": "液化石油氣儲槽附近起火燃燒一時無法撲滅時，為防止槽體發生BLEVE現象，採取的救災策略何者正確？", "opts": {"A": "強力直線水柱灌水降溫", "B": "人車全部撤出火場讓火勢自生自滅", "C": "火源附近設固定式撒水架降低槽體溫度", "D": "設防液堤"}, "answer": "C", "explain": "BLEVE 源於槽壁（尤其氣相部）受熱強度下降，應以固定式撒水或無人水砲持續冷卻槽體；防液堤防止流淌，無法阻止槽體過熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-077", "topic": "防火與特殊現象", "stem": "油池火災之放射熱與下列何者無關？", "opts": {"A": "燃燒速度", "B": "火焰之形狀與高度", "C": "容器之材質", "D": "火焰之溫度與距離"}, "answer": "C", "explain": "油池火災放射熱取決於燃燒速度、火焰大小形狀、火焰溫度及與受熱物距離；容器材質對火焰放射熱幾無影響。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-078", "topic": "防火與特殊現象", "stem": "下列有關油池火焰（災）的敘述，何者不正確？", "opts": {"A": "隨著油池直徑變大，火焰向液體的輻射熱主宰著油池液面的下降速率", "B": "隨著油池直徑變大，液面蒸發速率將趨於一定值", "C": "採用泡沫滅火劑，既能減少向液體的熱傳量，又能阻止液體的蒸發", "D": "如果油池內有積水，火災發生時，即可能發生BLEVE的現象"}, "answer": "D", "explain": "油池底部積水受熱沸騰將油噴出的是沸溢（boilover），不是 BLEVE；BLEVE 發生在密閉壓力容器。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-079", "topic": "防火與特殊現象", "stem": "物質於空氣常溫下，因化學變化而自然發熱，其反應熱經長期蓄積，致發火之現象，稱為：", "opts": {"A": "自然發火", "B": "混合發火", "C": "自然引火", "D": "低溫起火"}, "answer": "A", "explain": "常溫下自行發熱、長期蓄熱達發火點而燃燒即自然發火；混合發火需兩種物質混合，低溫起火特指木材長期受熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-080", "topic": "防火與特殊現象", "stem": "固體物質大量堆積，其內部因而發熱時，即使發熱量小，周圍溫度低，然因熱量之蓄積溫度逐漸上昇，終至發火，此種現象稱為：", "opts": {"A": "準自然發火", "B": "自然發火", "C": "混合發火", "D": "引火"}, "answer": "B", "explain": "大量堆積使內部熱量散不出去、逐漸蓄熱升溫而發火，是自然發火的典型；準自然發火是接觸空氣或水即迅速發火，不需長期蓄熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-081", "topic": "防火與特殊現象", "stem": "影響「自然發火」之主要因素為「熱之蓄積」與「熱之發生速度」二者，試問下列何者屬「熱之發生速度」因子？", "opts": {"A": "表面積", "B": "空氣之流動", "C": "熱傳導速度", "D": "堆積法"}, "answer": "A", "explain": "表面積愈大，與氧接觸反應愈多，發熱速度愈快，屬熱發生速度因子；熱傳導、空氣流動、堆積方法影響散熱，屬熱蓄積因子。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-082", "topic": "防火與特殊現象", "stem": "影響「自然發火」之主要因素為「熱之蓄積」與「熱之發生速度」，則下列何者屬「熱之蓄積」因子？", "opts": {"A": "堆積方法", "B": "溫度", "C": "發熱量", "D": "表面積"}, "answer": "A", "explain": "堆積方式決定熱量能否散出，屬熱蓄積因子；溫度、發熱量、表面積影響反應速度，屬熱發生速度因子。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-084", "topic": "防火與特殊現象", "stem": "下列何者屬自然發火性物質，且本身會因化學反應產生分解熱而發火？", "opts": {"A": "乾性油", "B": "活性碳", "C": "賽璐珞", "D": "枯草"}, "answer": "C", "explain": "賽璐珞（硝化纖維製品）會自行分解放熱而蓄熱發火；乾性油屬氧化熱、活性碳屬吸著熱、枯草屬發酵熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89、94士、90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-085", "topic": "防火與特殊現象", "stem": "賽璐珞（Celluloid）屬自然發火性物質之一，其會進行下列何種反應，所產之熱能蓄熱，以致達到發火點而開始燃燒？", "opts": {"A": "氧化", "B": "分解", "C": "吸著", "D": "發酵"}, "answer": "B", "explain": "賽璐珞主成分為硝化纖維，常溫下緩慢分解放熱，熱量蓄積後發火，屬分解熱型自然發火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-088", "topic": "防火與特殊現象", "stem": "原棉運輸途中常發生火災，其為何種原因所造成？", "opts": {"A": "分解熱", "B": "氧化熱", "C": "發酵熱", "D": "聚合熱"}, "answer": "B", "explain": "原棉含油脂成分，堆積時緩慢氧化放熱並蓄熱，教材歸為氧化熱型自然發火；發酵熱的代表是枯草、稻草。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【89士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-089", "topic": "防火與特殊現象", "stem": "乾性油會因為何種化學反應熱能之蓄積而自然發火？", "opts": {"A": "分解熱", "B": "吸著熱", "C": "氧化熱", "D": "發酵熱"}, "answer": "C", "explain": "乾性油（如亞麻仁油）含大量不飽和鍵，與空氣中氧反應放熱，浸於布料等多孔物時熱量蓄積而發火，屬氧化熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（改編為單選，刪除原(E)聚合熱）", "subject": "火災學", "src": "old"}, {"id": "F-C8-090", "topic": "防火與特殊現象", "stem": "下列何者係因吸著熱之蓄積自然起火者？", "opts": {"A": "植物性之活性碳", "B": "金屬粉", "C": "油布", "D": "亞麻仁油"}, "answer": "A", "explain": "活性碳多孔、吸附氣體時放出吸著熱而蓄熱發火；金屬粉、油布、亞麻仁油屬氧化熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-091", "topic": "防火與特殊現象", "stem": "依自然發火性物質發熱之原因，何者非因吸著熱發火的物質？", "opts": {"A": "賽璐珞", "B": "木炭灰", "C": "活性碳", "D": "還原鎳"}, "answer": "A", "explain": "賽璐珞是分解熱型自然發火物質；活性碳、炭粉及還原鎳等多孔物質則因吸附放熱而發火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-092", "topic": "防火與特殊現象", "stem": "枯草、乾草因枯草菌或其他微生物之繁殖而發生何種熱能，經熱之蓄積導致自然發火？", "opts": {"A": "發酵熱", "B": "吸著熱", "C": "氧化熱", "D": "分解熱"}, "answer": "A", "explain": "枯草、稻草、堆肥中微生物代謝繁殖放熱屬發酵熱，升溫後再引發後續氧化而發火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【消佐（年份不詳）】", "subject": "火災學", "src": "old"}, {"id": "F-C8-093", "topic": "防火與特殊現象", "stem": "自然發火性物質，其發熱型態係因聚合熱而發火的物質，下列何者正確？", "opts": {"A": "硝化棉", "B": "活性碳", "C": "乾草", "D": "乙烯基乙炔"}, "answer": "D", "explain": "乙烯基乙炔等含不飽和鍵的單體會自行聚合放熱；硝化棉屬分解熱、活性碳屬吸著熱、乾草屬發酵熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-094", "topic": "防火與特殊現象", "stem": "液化之氰化氫長時間儲存時，由於水分的存在，將會進行下列何種放熱反應而自然發火（自燃）？", "opts": {"A": "分解", "B": "氧化", "C": "吸著", "D": "聚合"}, "answer": "D", "explain": "液態氰化氫在少量水分或鹼性雜質存在下會自行聚合放熱，蓄熱後可能爆炸性發火，屬聚合熱型。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-095", "topic": "防火與特殊現象", "stem": "下列何種化合物有可能因聚合反應而發熱，導致自然發火之危險？", "opts": {"A": "甲烷", "B": "乙烷", "C": "液態氰化氫", "D": "丙烷"}, "answer": "C", "explain": "甲烷、乙烷、丙烷為飽和烷類，不會聚合；液態氰化氫可自行聚合放熱，有自然發火危險。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-097", "topic": "防火與特殊現象", "stem": "物質於空氣常溫下，因化學變化而自然發熱，在空氣中立即發火，乃至因水分、濕氣之存在而緩慢或即刻發熱發火者，稱之為：", "opts": {"A": "自然發火", "B": "準自然發火", "C": "閃燃", "D": "氣爆"}, "answer": "B", "explain": "接觸空氣即發火（如黃磷）或遇水、濕氣發熱發火（如金屬鈉）者稱準自然發火；自然發火需長期蓄熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-099", "topic": "防火與特殊現象", "stem": "準自然發火係最容易在下列何種物質中立即發火？", "opts": {"A": "液體", "B": "固體", "C": "空氣", "D": "以上皆是"}, "answer": "C", "explain": "準自然發火物質（如黃磷、烷基鋁）一接觸空氣中的氧即迅速發火，故以在空氣中最易立即發火。", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-100", "topic": "危險物品", "stem": "對於準自然發火物質「金屬鈉」的敘述，下列何者錯誤？", "opts": {"A": "與水接觸，立即起火，故又稱禁水性物質", "B": "依我國危險物品之分類，是第二類物質", "C": "常用於原子爐之冷卻劑、有機溶劑中微量水分的脫水劑", "D": "燃燒時發生過氧化鈉與氫氧化鈉的白煙"}, "answer": "B", "explain": "我國公共危險物品分類中，金屬鈉屬第三類「自燃物品及禁水性物質」，不是第二類（易燃固體）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-101", "topic": "防火與特殊現象", "stem": "下列何者不為「準自然發火性物質」？", "opts": {"A": "磷化石灰", "B": "硝化棉", "C": "金屬鈉", "D": "黃磷"}, "answer": "B", "explain": "硝化棉是自行分解放熱的自然發火物質；黃磷遇空氣、金屬鈉與磷化石灰遇水即發火或放出可燃氣，屬準自然發火。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【91消佐】（(A)選項 OCR 殘缺，依上下文還原為磷化石灰）", "subject": "火災學", "src": "old"}, {"id": "F-C8-102", "topic": "防火與特殊現象", "stem": "下列敘述何者不正確？", "opts": {"A": "通常自然發火物質必須經過長期蓄熱，發火時間較準自然發火物質長", "B": "一般禁水性物質，如：磷化氫（PH₃），屬準自然發火物質", "C": "黃磷與空氣接觸的發火現象屬準自然發火", "D": "鈉與水反應起火屬自然發火"}, "answer": "D", "explain": "鈉遇水立即反應放熱並生成氫氣起火，屬準自然發火，不是需長期蓄熱的自然發火。另 (B) 以磷化氫為禁水性物質之例，用語不夠嚴謹（禁水者應為磷化鈣等），依書上答案取 D。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-104", "topic": "防火與特殊現象", "stem": "下列何種物質與水接觸或吸收空氣中水分時會發熱，本身雖不燃，卻可能與可燃物接觸而造成可燃物發火？", "opts": {"A": "鋰", "B": "鎂", "C": "漂白粉", "D": "乙醛"}, "answer": "C", "explain": "漂白粉本身不燃，吸濕後發熱並分解出氧，可使接觸的可燃物起火；鋰、鎂、乙醛本身都是可燃物。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-105", "topic": "防火與特殊現象", "stem": "下列何者與水接觸會發熱而使接觸之可燃物發火？", "opts": {"A": "漂白粉", "B": "氫化鈉", "C": "硫化磷", "D": "鎂粉"}, "answer": "A", "explain": "漂白粉吸水發熱且具氧化性，會使鄰近可燃物發火；氫化鈉、硫化磷、鎂粉是本身會燃燒或放出可燃氣的物質，題意指本身不燃者。", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-108", "topic": "煙與熱流", "stem": "因建築物內外溫度差而引起的壓力差現象稱為：", "opts": {"A": "煙囪效應", "B": "熱膨脹", "C": "風壓", "D": "浮力"}, "answer": "A", "explain": "建築物內外溫差造成空氣密度差，於垂直通道形成上下壓力差而產生流動，稱為煙囪效應。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-109", "topic": "煙與熱流", "stem": "大樓內有空調，溫度較外界低，建築物垂直管道有向下流動之氣流，稱為：", "opts": {"A": "煙囪效應", "B": "逆向煙囪效應", "C": "外部風效應", "D": "中性帶"}, "answer": "B", "explain": "室內溫度低於室外時，室內空氣較重，於垂直管道向下流動，稱逆向煙囪效應，常見於夏季空調大樓。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-110", "topic": "煙與熱流", "stem": "提高建築物的中性帶為大樓防煙對策之一，請問如何提高建築物的中性帶？", "opts": {"A": "自然排煙口設於屋頂", "B": "自然排煙口設於底層", "C": "不要設自然排煙口", "D": "底層開口面積愈大愈好"}, "answer": "A", "explain": "中性帶位置會偏向開口較大的一側；於屋頂設排煙口加大上部開口可使中性帶上移，減少煙從各樓層流出。", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-111", "topic": "煙與熱流", "stem": "為避免火場中發生煙囪效應，下列所述的防救災方式何者較優？", "opts": {"A": "加強水線佈署", "B": "建築物使用防焰材料", "C": "使用樓雲梯車救災", "D": "加強垂直空間（管道間等）的防煙（火）區劃"}, "answer": "D", "explain": "煙囪效應發生在樓梯間、管道間等垂直貫通空間，做好垂直空間的防火防煙區劃才能從源頭阻斷。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-113", "topic": "煙與熱流", "stem": "一般在模擬計算建築物火災中的煙囪效應（stack effect）時，於中性面（neutral plane）上高度h（m）的位置，因浮力所造成建築物室內外的壓力差Δp（N/m²）為何？（Tᵢ：室內溫度；T₀：室外溫度；ρᵢ：溫度Tᵢ時空氣密度；ρ₀：溫度T₀時空氣密度；g＝9.8 m/s²）", "opts": {"A": "Δp＝(ρ₀－ρᵢ)gh", "B": "Δp＝(T₀－Tᵢ)gh", "C": "Δp＝(ρ₀－ρᵢ)ghT₀", "D": "Δp＝[(ρ₀－ρᵢ)/(T₀－Tᵢ)]gh"}, "answer": "A", "explain": "壓力差等於兩段等高空氣柱的重量差，即密度差×g×高度；以溫度差直接乘 gh 或再乘 T₀ 皆單位不符。", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-114", "topic": "煙與熱流", "stem": "承上題，一般表示壓力差Δp的方程式，亦可以理想氣體方程式（PV＝nRT）換算求得，其換算結果壓力差Δp（N/m²）約為何？（一大氣壓＝101325 N/m²，R＝8.31 J/K·mol，一莫耳空氣質量為0.02895 kg）", "opts": {"A": "Δp＝3.5×10³×(1/T₀－1/Tᵢ)²×h", "B": "Δp＝3.5×10³×(T₀－Tᵢ)×h", "C": "Δp＝(1.75×10³/h)×(1/T₀－1/Tᵢ)", "D": "Δp＝3.5×10³×(1/T₀－1/Tᵢ)×h"}, "answer": "D", "explain": "ρ＝PM/RT，代入 Δp＝(ρ₀－ρᵢ)gh 得 Δp＝(PMg/R)(1/T₀－1/Tᵢ)h；PMg/R＝101325×0.02895×9.8/8.31≒3459≒3.5×10³。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-115", "topic": "熱傳", "stem": "在建築物火災中，天花板會向地面放射大量輻射熱，促進地面可燃物之燃燒速度，此種現象即為密閉空間具有之何種效果？", "opts": {"A": "煙囪效應", "B": "逆煙囪效應", "C": "輻射能回饋效果", "D": "熱傳導回饋效果"}, "answer": "C", "explain": "高溫天花板與熱煙層向下輻射，加熱地面可燃物使其熱分解加快、燃燒加速，稱為輻射能回饋效果，是促成閃燃的主因之一。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、89消佐、91警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-116", "topic": "防火與特殊現象", "stem": "在電氣火災研究中，「橡膠、木材等絕緣物中，受電氣火花而碳化時，碳化部分會逐漸形成微量之結晶，而變具有導電性，亦即有機物之導電化現象」稱為？", "opts": {"A": "金原現象", "B": "層間短路", "C": "沿面放電", "D": "積污導電現象"}, "answer": "A", "explain": "有機絕緣物受火花碳化成石墨化導電路徑的現象稱為金原現象（石墨化現象）；積污導電則是表面附著電解質造成的沿面放電。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、89、93消佐、90、91、94警技】（改編為單選，刪除原(E)氧化亞銅增殖發熱現象）", "subject": "火災學", "src": "old"}, {"id": "F-C8-118", "topic": "防火與特殊現象", "stem": "不飽和油脂自然發火之危險性通常以碘價判斷之，碘價在多少以上時，可視具有相當之危險？", "opts": {"A": "100", "B": "130", "C": "170", "D": "200"}, "answer": "B", "explain": "碘價代表油脂不飽和程度，愈高愈易氧化發熱；一般碘價 130 以上即視為有自然發火危險（亞麻仁油約 200）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-119", "topic": "防火與特殊現象", "stem": "絕緣物表面因附著有水分、灰塵等少量之電解質物質，而生小規模之放電，結果形成異極電流之通路，乃致絕緣物失掉絕緣性者，係屬下列何者？", "opts": {"A": "短路", "B": "漏電", "C": "積污導電", "D": "金原現象"}, "answer": "C", "explain": "絕緣物表面積污（水分、灰塵、鹽分）形成放電通路而失去絕緣，稱積污導電；金原現象是絕緣物本身碳化導電。", "ref": "【90、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-121", "topic": "防火與特殊現象", "stem": "積污導電現象其發生的放電為：", "opts": {"A": "電弧放電", "B": "靜電放電", "C": "條狀放電", "D": "沿面放電"}, "answer": "D", "explain": "積污導電的小規模放電沿絕緣物表面發生，屬沿面放電。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-122", "topic": "火災", "stem": "若一建築之開口部面積為4 m²，開口部之垂直高度為2 m，室內之長寬高各為4 m×3 m×3 m，試問其溫度因子為多少？", "opts": {"A": "0.05", "B": "0.065", "C": "0.075", "D": "0.085"}, "answer": "D", "explain": "溫度因子＝A_w√H／A_T；A_T＝2×(4×3＋4×3＋3×3)＝66 m²，故＝4×√2÷66≒0.0857，約 0.085。", "ref": "【92警技】（改編為單選，刪除原(A)0.045）", "subject": "火災學", "src": "old"}, {"id": "F-C8-123", "topic": "燃燒", "stem": "假如 m″ 為單位面積質量流率（kg/m²·s），ΔH_c 為燃燒熱（kJ/g），A_f 為燃料表面積（m²），χ 為源自於燃燒不完全的燃燒因子（χ＜1.0），則一般在計算火災中的熱釋放率 Q̇_c 方程式為何？", "opts": {"A": "Q̇_c＝χ·m″·A_f^(1/2)·ΔH_c", "B": "Q̇_c＝χ·m″·A_f·ΔH_c^(1/2)", "C": "Q̇_c＝χ·m″·(A_f·ΔH_c)^(1/2)", "D": "Q̇_c＝χ·m″·A_f·ΔH_c"}, "answer": "D", "explain": "熱釋放率＝燃燒效率×單位面積質量燃燒速率×燃燒面積×燃燒熱，各項皆為一次方相乘，任何開根號都會使單位不符。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-124", "topic": "燃燒", "stem": "所謂燃燒速度係指下列何者？", "opts": {"A": "延燒速度", "B": "火焰傳播速度", "C": "可燃物之燃燒擴展速度", "D": "可燃物因燃燒而逐漸減少其重量之速度"}, "answer": "D", "explain": "火災學中的燃燒速度指單位時間內可燃物因燃燒而減少的重量（kg/min）；延燒、火焰傳播速度描述的是火勢擴展快慢。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【消佐（年份不詳）、94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-125", "topic": "火災", "stem": "所謂燃燒速度R之值，是和開口部之「面積」與「高度的平方根」二者相乘積成正比，若開口部之面積增大為原來二倍，其它條件不變時，依理論計算，R值為原來值的多少？", "opts": {"A": "四分之一", "B": "二分之一", "C": "二倍", "D": "四倍"}, "answer": "C", "explain": "R∝A√H，H 不變時 R 與 A 成正比，面積加倍則 R 為原來 2 倍。", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-128", "topic": "火災", "stem": "建築物火災中，下列何者與火災最盛期的持續時間長短無密切的關係？", "opts": {"A": "火焰悶燒的時間", "B": "可燃物的數量", "C": "可燃物與空氣接觸面積", "D": "密閉空間開口部大小"}, "answer": "A", "explain": "最盛期持續時間≒可燃物量÷燃燒速度，燃燒速度又受開口大小與可燃物表面積影響；悶燒時間屬初期或衰退期，與最盛期長短無直接關係。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-129", "topic": "火災", "stem": "下列有關區劃空間閃燃後燃料的燃燒率與通風因子之間關係，何者不正確？", "opts": {"A": "通風因子較大時，燃燒方式為通風控制燃燒", "B": "火災室內與室外的通風自由時，燃燒方式為燃料表面積控制之燃燒型式", "C": "通風因子可由伯努利方程式推導得出", "D": "通風因子最初由川越邦雄等人按經驗方式推導出"}, "answer": "A", "explain": "通風因子（A√H）大表示進氣充足，燃燒速率由燃料表面積決定，屬燃料控制燃燒；通風因子小時才是通風控制燃燒。", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-130", "topic": "火災", "stem": "根據P.H.Thomas的研究，建築物在通風控制燃燒時，所謂燃燒速度R（kg/min）值，是和開口部之「面積A」與「開口高度H」有關，其關係式為何？", "opts": {"A": "R＝(5.5～6.0)×A×H", "B": "R＝(5.5～6.0)×A×√H", "C": "R＝(5.5～6.0)×√A×H", "D": "R＝(5.5～6.0)×√(A×H)"}, "answer": "B", "explain": "通風控制燃燒時燃燒速度與通風因子 A√H 成正比：R＝(5.5～6.0)A√H kg/min（約 0.09A√H kg/s）。", "ref": "【91、93警技、92消佐】（改編為單選，刪除原(E)R＝(5.5～6.0)×(A×H)^(1/3)）", "subject": "火災學", "src": "old"}, {"id": "F-C8-133", "topic": "火災", "stem": "火災進入最盛期，其持續時間之長短與多種因素有關，一般而言，該時期之燃燒可分為通風控制燃燒及燃料控制燃燒兩類，下列有關燃料控制燃燒之敘述何者錯誤？", "opts": {"A": "燃燒速度與通風量無關", "B": "燃燒速度由燃料表面積所控制", "C": "因室外較暖空氣之大量滲入，使室溫升高，延燒持續時間延長", "D": "容易經由開口向上層延燒"}, "answer": "C", "explain": "燃料控制燃燒時開口大，大量較冷的外氣流入使室溫較低，且可燃物燒得快，持續時間較短；火焰易從大開口噴出向上層延燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-134", "topic": "火災", "stem": "耐火建築物火災達最盛期，因可燃物量或空氣量的因素，可分為通風控制燃燒及燃料控制燃燒，其中何處的火災現象較易為通風狀況所控制？", "opts": {"A": "走廊", "B": "陽台", "C": "樓梯間", "D": "地下室"}, "answer": "D", "explain": "地下室開口少、進氣受限，燃燒速度受進入空氣量控制，最易形成通風控制燃燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-136", "topic": "煙與熱流", "stem": "若建築物內部空氣溫度為27℃，著火房間溫度為627℃，流入著火房間的空氣體積流率為3 m³/s，則流出著火房間的煙氣體積流率約為：", "opts": {"A": "6 m³/s", "B": "9 m³/s", "C": "12 m³/s", "D": "15 m³/s"}, "answer": "B", "explain": "質量流率守恆且密度與絕對溫度成反比，Q_out＝Q_in×T_out/T_in＝3×(627＋273)/(27＋273)＝9 m³/s。", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-137", "topic": "煙與熱流", "stem": "火場中所產生大量之煙霧，因密度低而具浮力，一般表示著火房間內所生的壓差方程式為何？（P：壓差（Pa）；K_s：常數（3460 Pa·K/m）；T₀：室外溫度（K）；T_F：室內溫度（K）；h：距中性帶距離（m））", "opts": {"A": "P＝K_s×(1/T₀－1/T_F)^(1/2)×h", "B": "P＝K_s×(T₀－T_F)×h", "C": "P＝(K_s/h)×(1/T₀－1/T_F)", "D": "P＝K_s×(1/T₀－1/T_F)×h"}, "answer": "D", "explain": "由理想氣體密度 ρ∝1/T 代入 ΔP＝Δρgh，得 P＝K_s(1/T₀－1/T_F)h，壓差與距中性帶高度成正比。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91警技】（改編為單選，刪除原(D)殘缺選項）", "subject": "火災學", "src": "old"}, {"id": "F-X1-001", "topic": "火災", "stem": "木造建築物室內火災之進行狀況可區分成數階段，以流程表示為 O→A→B→C，其中 O 至 A 為第一成長期，A 至 B 為第二成長期，B 至 C 為最盛期，C 以後為衰退期。試問何時為木造建築室內火災溫度之最高點？", "opts": {"A": "A至B間", "B": "B至C間", "C": "B點", "D": "C點"}, "answer": "C", "explain": "依書上解答，木造建築火災在由成長期進入最盛期的轉折點（B點）附近溫度急升達最高。A至B仍在升溫，C點以後進入衰退，溫度下降。此題階段定義依書本圖示，不同教材標示可能不同。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【87警技】（原題有(E)，刪去明顯錯誤之「O至A間」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-X1-002", "topic": "火災", "stem": "木造建築物火災的溫度變化，下列何者正確？", "opts": {"A": "與燃燒速度成反比", "B": "與室外氣溫成正比", "C": "與室內表面積成反比", "D": "以上皆非"}, "answer": "C", "explain": "室內火災溫度取決於溫度因子（開口因子 A√H 除以室內總表面積），室內表面積愈大、散熱面愈大，溫度愈低，故成反比。燃燒速度愈快溫度愈高，並非反比；室外氣溫影響甚微。", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-003", "topic": "防火與特殊現象", "stem": "依照建築技術規則建築設計施工編之規定，高層建築物之定義係：", "opts": {"A": "高度在五十公尺或樓層在十六層以上之建築物", "B": "高度在四十五公尺或樓層在十五層以上之建築物", "C": "高度在四十公尺或樓層在十二層以上之建築物", "D": "高度在三十公尺或樓層在十五層以上之建築物"}, "answer": "A", "explain": "建築技術規則設計施工編第227條：高層建築物指高度在五十公尺或樓層在十六層以上之建築物。OCR 原文(A)作「十五層」，與法規不符，已依法規更正為十六層。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【87消佐、士】", "subject": "火災學", "src": "old"}, {"id": "F-X1-004", "topic": "防火與特殊現象", "stem": "高樓防火區劃設計最重要應考慮到下列何項因素？", "opts": {"A": "內部之可燃物量", "B": "發生火災燃燒時間", "C": "牆壁之防火時效", "D": "長期荷重因素"}, "answer": "C", "explain": "防火區劃的功能是把火侷限在區劃內，關鍵在區劃構件（牆、樓板、門）能撐多久，即防火時效。可燃物量與燃燒時間是決定所需時效的輸入條件，長期荷重屬結構設計考量。書上未附答案，此為判定。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-005", "topic": "火災", "stem": "高樓建築物火災的特性，下列何者錯誤？", "opts": {"A": "濃煙密布", "B": "逃生不易", "C": "救災困難", "D": "不易延燒"}, "answer": "D", "explain": "高樓有管道間、樓梯間等垂直通道，易產生煙囪效應，火煙迅速向上延燒，故「不易延燒」錯誤。濃煙密布、逃生不易、救災困難皆為高樓火災特性。原(D)選項 OCR 殘缺僅剩「延燒」，依題意補為「不易延燒」。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-006", "topic": "火災", "stem": "下列有關高層建築物與地下建築物火災特性之敘述，何者有誤？", "opts": {"A": "二者在救火時，通常均需利用樓（電）梯到達起火點", "B": "二者一旦起火，各層頓時陷入危險，搶救不易", "C": "二者均屬逃生不易，人命威脅大", "D": "二者均易產生高溫濃煙"}, "answer": "B", "explain": "火災通常由起火層逐步向其他樓層擴大，並非一起火各層就頓時陷入危險，故(B)有誤。二者均需經樓梯進入、逃生不易、易生高溫濃煙，皆正確。書上未附答案，此為判定。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-X1-007", "topic": "火災", "stem": "下列何者非地下建築物火災特殊之處？", "opts": {"A": "火災現象瞬息萬變", "B": "搶救困難", "C": "火勢掌握容易", "D": "水損嚴重"}, "answer": "C", "explain": "地下建築物出入口少、煙熱滯留、視線差，火勢難以掌握，故「火勢掌握容易」不是其特性。其餘瞬息萬變、搶救困難、水損嚴重（積水排不出）皆為特殊之處。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-008", "topic": "火災", "stem": "影響山林火災燃燒的因素，下列何者為非？", "opts": {"A": "地表植物種類若為混生之灌木雜草時，易由地表火發展成樹幹火", "B": "山林樹種若多為闊葉林，延燒速度會較慢", "C": "山林土地中若存有泥炭層、亞炭層及其他可燃性有機物質時，易形成地中火，不但不易滅火，且每小時延燒速度約達15公里", "D": "地表上可燃物若較為豐富且林地屬於較乾燥的針葉林，易成激烈火勢的山林火災"}, "answer": "C", "explain": "地中火在地下有機層中悶燒，氧氣供應少，延燒極為緩慢（每小時僅數公尺等級），不可能達每小時15公里；其難滅火的敘述是對的，錯在速度。闊葉林含水多延燒慢、針葉林乾燥易激烈燃燒皆正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技、88士】（原題有(E)，刪去正確敘述「山林火災延燒時通常不易向山脊斜面側方燃燒」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-X1-009", "topic": "危險物品", "stem": "化災之搶救人員進入災害現場，採取行動前應瞭解之事項，下列何者非屬必要？", "opts": {"A": "面對何種情況", "B": "支援現場搶救人數", "C": "處理何種化學品", "D": "需何種裝備器材"}, "answer": "B", "explain": "進入化災現場前必須先掌握狀況、化學品種類與所需防護裝備器材，才能確保安全。支援人數屬指揮調度事項，並非搶救人員進場前必須瞭解的事。OCR 題幹作「何者屬必要」，依選項結構判斷應缺「非」字，已補正。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-X1-010", "topic": "危險物品", "stem": "在進行化學物質災害的搶救部署時，最重要的基本概念為：", "opts": {"A": "動作快", "B": "方法對", "C": "勇氣高", "D": "出水大"}, "answer": "B", "explain": "化學物質性質各異，有些遇水反應或擴大污染，搶救首重依物質特性選擇正確方法。一味求快、逞勇或大量出水反而可能擴大災害。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-012", "topic": "危險物品", "stem": "化學物質災害、工廠災害進行消防搶救時，有下列相關參考資料：(1)毒性化學物質防救手冊 (2)物質安全資料表 (3)緊急應變指南，其適用優先順序為：", "opts": {"A": "(1)(2)(3)", "B": "(1)(3)(2)", "C": "(2)(3)(1)", "D": "(3)(2)(1)"}, "answer": "A", "explain": "依消防署處理涉及化學物質災害注意事項，資料愈針對特定物質愈優先：先用毒性化學物質防救手冊，其次物質安全資料表，最後才用通用性的緊急應變指南。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、91消佐、92警技】", "subject": "火災學", "src": "old"}, {"id": "F-X1-013", "topic": "危險物品", "stem": "化學物質災害搶救程序第一步驟是：", "opts": {"A": "區域管制", "B": "進入搶救", "C": "請求支援", "D": "危害辨識"}, "answer": "D", "explain": "H.A.Z.M.A.T. 程序以 H（Hazard identification，危害辨識）為首，先確認是何種危害物質，才能決定管制範圍、防護與搶救方式。區域管制、請求支援都在其後。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題有(E)，刪去「除污」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-X1-014", "topic": "危險物品", "stem": "化學物質災害、工廠災害消防搶救程序的指導要領為 H.A.Z.M.A.T.，其中 H 是指：", "opts": {"A": "危害辨認", "B": "行動方案", "C": "區域管制", "D": "請求支援"}, "answer": "A", "explain": "H 為 Hazard identification（危害辨認）。第一個 A 為行動方案（Action plan），Z 為區域管制（Zoning），第二個 A 為請求支援（Assistance）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-015", "topic": "危險物品", "stem": "「除污」應在下列何種「化學物質災害、工廠災害消防搶救程序」中加以執行？", "opts": {"A": "善後處理", "B": "行動方案", "C": "建立管理系統", "D": "請求支援"}, "answer": "A", "explain": "除污屬 T（Termination，善後處理），在任務完成、離開現場前執行，避免把危害物帶到他處或與不相容物混合。其餘步驟不以除污為主要內容。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-016", "topic": "危險物品", "stem": "化學物質災害發生時，進行區域管制可分三個區域來管制，下列分區方式何者錯誤？", "opts": {"A": "禁區、除污區、支援區", "B": "熱區、溫區、冷區", "C": "紅區、黃區、綠區", "D": "A區、B區、C區"}, "answer": "D", "explain": "化災管制區常見三種稱呼：禁區／除污區／支援區、熱區／溫區／冷區、紅區／黃區／綠區，三者一一對應。「A區、B區、C區」並非慣用分區名稱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐、94士】", "subject": "火災學", "src": "old"}, {"id": "F-X1-017", "topic": "危險物品", "stem": "化學物質災害應迅速建立管制區，以降低危害性化學物質之危害，管制區通常分成三區域，其中除污區又稱為：", "opts": {"A": "紅色區", "B": "黃色區", "C": "熱區", "D": "冷區"}, "answer": "B", "explain": "除污區位於中間，又稱溫區或黃色區。紅色區即熱區（禁區），冷區為綠色區（支援區）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-018", "topic": "煙與熱流", "stem": "在火場中會因吸入下列何種氣體，導致阻礙紅血球輸氧功能而造成窒息死亡？", "opts": {"A": "一氧化碳", "B": "一氧化氮", "C": "二氧化碳", "D": "硫化氫"}, "answer": "A", "explain": "一氧化碳與血紅素的親和力約為氧的200倍以上，形成碳氧血紅素，使紅血球無法攜氧而窒息。二氧化碳主要是稀釋氧氣與刺激呼吸，硫化氫則主要抑制細胞呼吸酵素。", "ref": "【107專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-019", "topic": "危險物品", "stem": "依據美國防火協會（NFPA）規定，下列有關可燃液體與易燃液體之敘述，何者正確？", "opts": {"A": "可燃液體係指閃火點大於或等於100°F（37.8℃）之液體", "B": "可燃液體係指閃火點大於100°F（37.8℃），小於140°F（60℃）之液體", "C": "易燃液體係指沸點小於或等於100°F（37.8℃）之液體", "D": "易燃液體係指自燃溫度小於或等於100°F（37.8℃）之液體"}, "answer": "A", "explain": "NFPA 以閃火點 100°F（37.8℃）為界：閃火點低於此者為易燃液體，大於或等於者為可燃液體。(B)只是可燃液體中的 Class II 範圍；(C)(D)把判定依據錯用成沸點、自燃溫度。", "ref": "【107專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-020", "topic": "防火與特殊現象", "stem": "下列有關建築物火災「閃燃」（flashover）現象之敘述，何者錯誤？", "opts": {"A": "「閃燃」現象通常發生在建築物火災的成長期", "B": "一旦發生「閃燃」現象，該居室中的人即無法生存", "C": "就「閃燃時間」（F.O.T.）而言，同種類等面積之裝潢材料中影響最大部位為壁面", "D": "在避難對策上，延遲建築物火災到達「閃燃」階段，至為重要"}, "answer": "C", "explain": "熱煙層聚集在天花板下，天花板裝潢材料受熱最早最強，對閃燃時間影響最大，其次才是壁面，故(C)錯誤。閃燃發生於成長期末、發生後室內無法存活、延遲閃燃利於避難，皆正確。", "ref": "【107專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-021", "topic": "爆炸", "stem": "下列哪一個可燃性氣體產生火災爆炸之風險最低？", "opts": {"A": "燃燒界限16%～25%", "B": "燃燒界限7.3%～36%", "C": "燃燒界限5.3%～18%", "D": "燃燒界限4.0%～75%"}, "answer": "A", "explain": "危險度 H＝(上限－下限)／下限。(A)＝(25－16)/16≈0.56，(B)≈3.93，(C)≈2.40，(D)＝17.75，(A)燃燒範圍窄且下限高，風險最低。", "ref": "【107專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-022", "topic": "危險物品", "stem": "根據美國防火協會危險物品標示規定，將危險類別記載於菱形方塊上，其中黃色表示何種危害？", "opts": {"A": "可燃性", "B": "反應性", "C": "有害健康毒性", "D": "禁水性"}, "answer": "B", "explain": "NFPA 704 菱形標示：藍色為健康危害、紅色為可燃性、黃色為反應性（不穩定性），白色為特殊危害（如禁水 W）。", "ref": "【107專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-023", "topic": "危險物品", "stem": "危害物質災害現場搶救標準作業程序（H.A.Z.M.A.T.）之說明，下列何者為正確？", "opts": {"A": "H表示災區管制", "B": "Z表示善後處理", "C": "T表示行動方案", "D": "M表示建立管理系統"}, "answer": "D", "explain": "M 為 Management，建立管理系統。H 是危害辨識、Z 是區域管制、T 是善後處理、第一個 A 是行動方案，其餘選項都張冠李戴。", "ref": "【107專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-024", "topic": "燃燒", "stem": "可燃物於無明火等火源之條件下，在大氣中僅因受熱而開始自行燃燒所需之最低溫度稱為下列何者？", "opts": {"A": "自燃溫度", "B": "閃點", "C": "沸點", "D": "閃燃點"}, "answer": "A", "explain": "不需外部火源、單靠加熱即自行起燃的最低溫度為自燃溫度（發火點）。閃點需有外部火源才能引燃蒸氣；沸點是物理相變溫度。", "ref": "【107專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-025", "topic": "熱傳", "stem": "描述熱傳遞（heat transfer）之物理量為下列何者？", "opts": {"A": "溫度", "B": "熱通量", "C": "熱釋放率", "D": "熱焓"}, "answer": "B", "explain": "熱通量是單位時間通過單位面積的熱量（kW/m²），直接描述熱傳遞的強度。溫度是狀態量，熱釋放率描述火源大小，熱焓是能量狀態函數。", "ref": "【107專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-026", "topic": "防火與特殊現象", "stem": "要做好火災預防工作，從理論觀點上，可由火災預防之「3E政策」著手，下列敘述何者不屬於「3E政策」項目？", "opts": {"A": "防火工程", "B": "防火教育", "C": "防火執法", "D": "防火熱忱"}, "answer": "D", "explain": "3E 為 Engineering（工程）、Education（教育）、Enforcement（執法）。熱忱（Enthusiasm）雖也是 E 開頭，但不屬於 3E 政策。", "ref": "【107專技士 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-027", "topic": "滅火", "stem": "下列有關二氧化碳滅火劑之敘述，何者錯誤？", "opts": {"A": "二氧化碳滅火劑滅火後不留痕跡", "B": "二氧化碳氣體比重約為1.5，滅火時可覆蓋在燃燒物體表面", "C": "二氧化碳為無害氣體，故二氧化碳系統噴灑時，應留在現場繼續警戒", "D": "二氧化碳滅火劑氣化時，可以發揮冷卻作用"}, "answer": "C", "explain": "二氧化碳滅火設計濃度遠高於人體可承受程度，會造成窒息，系統放射前人員必須撤離，故(C)錯誤。不留殘跡、比空氣重可覆蓋、氣化吸熱冷卻皆正確。", "ref": "【107專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-028", "topic": "防火與特殊現象", "stem": "在高科技無塵室作業中，下列敘述何者不是避免人員帶靜電產生危害之處理方式？", "opts": {"A": "無塵室鋪設導電地板", "B": "進入無塵室前先進入風淋室", "C": "作業人員穿戴導電物品（如無塵帽、衣、褲、鞋等）", "D": "無塵室維持相對濕度在80%以上"}, "answer": "D", "explain": "依書上解答，無塵室為製程需求須控制在中等濕度，維持80%以上高濕並非可行的防靜電作法；導電地板、導電衣物可讓人體電荷洩放。惟風淋室主要功能是除塵而非除靜電，此題選項有爭議。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【107專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-029", "topic": "燃燒", "stem": "下列何者並非容易悶燒材料之特性？", "opts": {"A": "多孔", "B": "易產生焦化層", "C": "容易悶燒之材料亦容易自燃", "D": "閃火點低"}, "answer": "D", "explain": "悶燒是固體表面的無焰氧化，好發於多孔、易炭化形成焦化層的材料，且這類材料常也易蓄熱自燃。閃火點低是易燃液體的特性，與悶燒無關。", "ref": "【107專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-030", "topic": "燃燒", "stem": "假設大氣中氧氣容積為21%，現在一密閉空間（體積為V）內，三分之一體積（V/3）為惰性氣體時（壓力仍為一大氣壓），該空間內氧氣濃度為多少%？", "opts": {"A": "7%", "B": "11%", "C": "14%", "D": "18%"}, "answer": "C", "explain": "剩下 2/3 體積為空氣，氧濃度＝21%×2/3＝14%。", "ref": "【107專技士 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-031", "topic": "火災", "stem": "我國在106年實施A1、A2、A3新式火災認定方式，下列有關A2火災認定之敘述，何者錯誤？", "opts": {"A": "是指造成人員死亡之火災案件", "B": "是指造成人員受傷之火災案件", "C": "是指涉及糾紛、縱火案件", "D": "是指起火原因待查之火災案件"}, "answer": "A", "explain": "造成人員死亡（含24小時內死亡）者屬A1類火災，不是A2；A2類為造成人員受傷，或涉及糾紛、縱火、原因待查等需調查之案件。OCR 題幹作「A火災」，依書上答案(A)推定應為「A2火災」。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【107專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-032", "topic": "煙與熱流", "stem": "有一火場之減光係數為 2 m⁻¹，請問發光物體之能見度為多少公尺？", "opts": {"A": "2公尺", "B": "4公尺", "C": "6公尺", "D": "8公尺"}, "answer": "B", "explain": "發光物體能見度 V＝K/Cs，K 取 8：V＝8/2＝4 公尺（反光物體 K 約 2～4，能見度較短）。", "ref": "【107專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-033", "topic": "滅火", "stem": "下列何者為海龍替代品滅火藥劑 FE-13 之分子式？", "opts": {"A": "CF₃Br", "B": "CHF₃", "C": "CFBr₃", "D": "CF₃Cl"}, "answer": "B", "explain": "FE-13 即 HFC-23，三氟甲烷 CHF₃，不含溴、氯，不破壞臭氧層。CF₃Br 是海龍1301本身，CF₃Cl 為 CFC-13，都不是替代品。", "ref": "【107專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-034", "topic": "火災", "stem": "有關地下建築物火災之敘述，下列何者錯誤？", "opts": {"A": "容易造成水損", "B": "起火點發現困難", "C": "地下樓層有限，搶救工作容易", "D": "可以使用紅外線火源探測器，以及早發現火源"}, "answer": "C", "explain": "地下建築物進出口少、煙熱無處排放、視線不佳，搶救困難，與樓層數多寡無關，故(C)錯誤。水損、起火點難發現、以火焰探測器及早偵知皆合理。", "ref": "【107專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-035", "topic": "火災", "stem": "已知木造倉庫高6公尺，如延燒係數為0.15，依木造建築物火災溫度標準曲線，其鄰棟建築物之理論安全距離應在多少公尺以上？", "opts": {"A": "5.4公尺", "B": "6.3公尺", "C": "9公尺", "D": "12.1公尺"}, "answer": "B", "explain": "延燒限界曲線 H＝p·d²，d＝√(H/p)＝√(6/0.15)＝√40≈6.32 公尺。", "ref": "【107專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-036", "topic": "火災", "stem": "電線因火災燒熔而短路所形成之熔珠，稱為下列何者？", "opts": {"A": "一次痕", "B": "二次痕", "C": "過電痕", "D": "過載痕"}, "answer": "B", "explain": "火災先發生、燒毀絕緣後才短路所留下的熔痕為二次痕，是火災的結果。一次痕則是短路先發生、成為起火原因時形成的熔痕。", "ref": "【107專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-037", "topic": "防火與特殊現象", "stem": "為防止由窗口噴出的火焰向大樓上層延燒，下列措施何者錯誤？", "opts": {"A": "加大窗戶開口部的面積", "B": "增加上下樓層窗戶間的側壁長度", "C": "窗戶上下加設向外突出之平台", "D": "儘量降低屋內火載量"}, "answer": "A", "explain": "開口愈大，噴出火焰愈大、愈貼近外牆，更易向上層延燒，故(A)錯誤。加長上下窗間牆（spandrel）、設突出遮簷（陽台）、降低火載量都能抑制上層延燒。", "ref": "【107專技士 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-038", "topic": "防火與特殊現象", "stem": "油罐車在灌裝作業中，其累積電壓為16 kV（其體積為20 m³，電容為1000 pF），試估算此作業所產生靜電能量為多少毫焦耳（mJ）？", "opts": {"A": "32 mJ", "B": "64 mJ", "C": "128 mJ", "D": "256 mJ"}, "answer": "C", "explain": "E＝½CV²＝0.5×1000×10⁻¹²×(16000)²＝0.128 J＝128 mJ。體積為干擾數據。", "ref": "【107專技士 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-039", "topic": "燃燒", "stem": "燃燒塔每分鐘需消耗5.8 kg之丁烷（C₄H₁₀），請估算在NTP（25℃、1大氣壓）之條件下，此燃燒塔每小時所需之燃燒理論空氣體積約為下列何者？", "opts": {"A": "1250 m³", "B": "3600 m³", "C": "4540 m³", "D": "5600 m³"}, "answer": "C", "explain": "丁烷分子量58，5.8 kg＝100 mol/min；C₄H₁₀＋6.5O₂→4CO₂＋5H₂O，需氧650 mol/min，空氣＝650/0.21≈3095 mol/min，每小時約185,714 mol，×24.45 L/mol≈4540 m³。", "ref": "【107專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-040", "topic": "熱傳", "stem": "熱傳導之熱流動方向為何？", "opts": {"A": "高溫傳向低溫", "B": "高熱通量傳向低熱通量", "C": "高熱量傳向低熱量", "D": "高熱傳係數材料傳向低熱傳係數材料"}, "answer": "A", "explain": "依傅立葉定律，熱流沿溫度梯度方向由
