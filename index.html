傳導段。", "ref": "火災學筆記 題型14", "subject": "火災學", "src": "new"}, {"id": "F-N2-093", "topic": "煙與熱流", "stem": "某煙層之遮光率為 80%，則其光學密度 D 約為多少？（log 2 ＝ 0.301）", "opts": {"A": "0.699", "B": "0.097", "C": "1.301", "D": "0.800"}, "answer": "A", "explain": "D＝2－log(100－S)＝2－log20＝2－1.301＝0.699。0.097 誤代 log80，1.301 忘記用 2 減，0.8 誤把遮光率當 D。", "ref": "火災學筆記 題型15", "subject": "火災學", "src": "new"}, {"id": "F-N2-094", "topic": "煙與熱流", "stem": "火場中煙之減光係數 K 為 0.6 m⁻¹，則反光體之能見度約為多少公尺？", "opts": {"A": "13.3 m", "B": "5.0 m", "C": "1.8 m", "D": "0.2 m"}, "answer": "B", "explain": "反光體 KS＝3 → S＝3/0.6＝5 m。13.3 m 誤用發光體 8，1.8 為 K×3，0.2 為 K/3。", "ref": "火災學筆記 題型15", "subject": "火災學", "src": "new"}, {"id": "F-N2-095", "topic": "煙與熱流", "stem": "厚度 4 m 之煙層測得僅 25% 之光穿過，則該煙層之減光係數 K 約為多少 m⁻¹？（log 2 ＝ 0.301）", "opts": {"A": "0.0654", "B": "1.385", "C": "0.346", "D": "0.151"}, "answer": "C", "explain": "D＝log(1/0.25)＝log4＝0.602；D_L＝0.602/4≒0.151 m⁻¹；K＝2.3×D_L≒0.346 m⁻¹。0.0654 誤除 2.3，1.385 漏除厚度，0.151 只算到 D_L。", "ref": "火災學筆記 題型15", "subject": "火災學", "src": "new"}, {"id": "F-N2-096", "topic": "煙與熱流", "stem": "室內發生大火（3 m × 3 m），在火場溫度 827℃、室溫 17℃、空氣密度 1.22 kg/m³ 條件下，煙層有效厚度為 2 m 時，煙生成率約為多少 kg/s？（M ＝ 0.188Py^(3/2)）", "opts": {"A": "4.79", "B": "9.02", "C": "4.51", "D": "6.38"}, "answer": "D", "explain": "P 為周界＝3×4＝12 m；M＝0.188×12×2^1.5≒6.38 kg/s。4.79 誤以面積 9 代 P，9.02 誤用 y²，4.51 漏掉 3/2 次方。", "ref": "火災學筆記 題型16", "subject": "火災學", "src": "new"}, {"id": "F-N2-097", "topic": "煙與熱流", "stem": "某室長 10 m、寬 6 m、天花板高 4 m，發生微火（1 m × 1 m），依 t ＝ 20A/(Pg^½) ×（1/√h － 1/√y），煙層底部下降至距地板 2 m 處約需多少秒？（g ＝ 9.8 m/s²）", "opts": {"A": "19.8 秒", "B": "79.4 秒", "C": "62.1 秒", "D": "24.0 秒"}, "answer": "A", "explain": "A＝60 m²、P＝4 m：t＝20×60÷(4×√9.8)×(1/√2－1/√4)≒19.8 秒。79.4 誤以火源面積 1 代 P，62.1 漏除 √g，24.0 未開根號。", "ref": "火災學筆記 題型16", "subject": "火災學", "src": "new"}, {"id": "F-N2-098", "topic": "煙與熱流", "stem": "厚度 2 m 之煙層測得僅 10% 之光穿過，則該煙層之消光係數約為多少 m⁻¹？", "opts": {"A": "0.50", "B": "1.15", "C": "0.217", "D": "2.30"}, "answer": "B", "explain": "D＝log(1/0.1)＝1；D_L＝1/2＝0.5 m⁻¹；K＝2.3×0.5＝1.15 m⁻¹。0.50 只算到 D_L，0.217 誤除 2.3，2.30 漏除厚度。", "ref": "火災學筆記 題型17", "subject": "火災學", "src": "new"}, {"id": "F-N2-099", "topic": "煙與熱流", "stem": "若某煙層之視覺密度（光學密度）為 2，則其遮光率為多少？", "opts": {"A": "98%", "B": "90%", "C": "99%", "D": "80%"}, "answer": "C", "explain": "D＝2－log(100－S) → log(100－S)＝0 → 100－S＝1 → S＝99%；90% 是 D＝1 的答案。", "ref": "火災學筆記 題型17", "subject": "火災學", "src": "new"}, {"id": "F-N2-100", "topic": "煙與熱流", "stem": "外界溫度 27℃、起火房間溫度 327℃，則在中性面以上 3 m 處，因浮力作用造成之室內外壓力差約為多少 Pa？（Ks ＝ 3460 Pa·K/m）", "opts": {"A": "352.7", "B": "51.9", "C": "5.77", "D": "17.3"}, "answer": "D", "explain": "T₀＝300 K、T₁＝600 K：ΔP＝3460×(1/300－1/600)×3≒17.3 Pa。352.7 為溫度未換 K，51.9 誤用相加，5.77 漏乘 h。", "ref": "火災學筆記 題型18", "subject": "火災學", "src": "new"}, {"id": "F-N2-101", "topic": "煙與熱流", "stem": "風速 10 m/s 吹向建築物迎風面，風壓係數 0.8，空氣密度 1.2 kg/m³，依 Pw ＝ CwρV²/2，迎風面所受風壓為多少 Pa？", "opts": {"A": "48", "B": "96", "C": "40000", "D": "4.8"}, "answer": "A", "explain": "Pw＝0.8×1.2×10²÷2＝48 Pa。96 漏除 2，40000 誤用水之密度 1000，4.8 風速未平方。", "ref": "火災學筆記 題型18", "subject": "火災學", "src": "new"}, {"id": "F-N2-102", "topic": "煙與熱流", "stem": "建築物內部溫度 27℃，起火房間溫度 627℃，流入起火房間之空氣體積流量為 2 m³/s，依熱膨脹效應，流出起火房間之煙霧體積流量約為多少 m³/s？", "opts": {"A": "46.4", "B": "6.0", "C": "0.67", "D": "3.0"}, "answer": "B", "explain": "Q₁＝Q₀×T₁/T₀＝2×900/300＝6 m³/s。46.4 為溫度未換 K，0.67 為溫度比倒置，3.0 漏乘 Q₀。", "ref": "火災學筆記 題型18", "subject": "火災學", "src": "new"}, {"id": "F-N2-103", "topic": "煙與熱流", "stem": "某門高 2.4 m，具有相同面積之門頂與門底開口，起火房間溫度 600 K，環境溫度 27℃，則中性面距門頂約多少公尺？", "opts": {"A": "0.8 m", "B": "1.2 m", "C": "1.6 m", "D": "2.0 m"}, "answer": "C", "explain": "A₁＝A₂ → h₁×300＝h₂×600 → h₁＝2h₂；h₁＋h₂＝2.4 → h₁＝1.6 m（距門頂）。0.8 m 為距門底，1.2 m 誤當中性面在中點。", "ref": "火災學筆記 題型19", "subject": "火災學", "src": "new"}, {"id": "F-N2-104", "topic": "煙與熱流", "stem": "避難通道加壓時，有面積 0.5 m² 與 1 m² 之兩開口呈串聯，則其等效流動面積約為多少 m²？", "opts": {"A": "1.50", "B": "0.33", "C": "0.75", "D": "0.45"}, "answer": "D", "explain": "串聯 1/Aₑ²＝1/0.5²＋1/1²＝5 → Aₑ≒0.45 m²（比任一開口小）。1.50 誤用並聯，0.33 誤用 1/Aₑ＝Σ1/A，0.75 取平均。", "ref": "火災學筆記 題型19", "subject": "火災學", "src": "new"}, {"id": "F-N2-105", "topic": "煙與熱流", "stem": "加壓避難通道之門縫流動面積為 0.05 m²，門兩側壓差為 25 Pa，依簡化式 Q ＝ 0.839AΔP^½，空氣供給量約為多少 m³/s？", "opts": {"A": "0.21", "B": "1.05", "C": "0.163", "D": "0.0084"}, "answer": "A", "explain": "Q＝0.839×0.05×√25≒0.21 m³/s。1.05 為壓差未開根號，0.163 只乘 C＝0.65 未乘 √(2/ρ)，0.0084 誤把 √ΔP 放分母。", "ref": "火災學筆記 題型19", "subject": "火災學", "src": "new"}, {"id": "F-N2-106", "topic": "煙與熱流", "stem": "某門高 2.0 m、寬 1.0 m，把手距靠近把手側門邊 0.1 m，門兩側壓差 50 Pa，克服自鎖力所需之力為 40 N，則開門所需力量約為多少 N？（K_d ＝ 1.0）", "opts": {"A": "55.6", "B": "95.6", "C": "90.0", "D": "151.1"}, "answer": "B", "explain": "F＝40＋1.0×2.0×50÷[2×(1.0－0.1)]＝40＋55.6≒95.6 N。55.6 漏加自鎖力，90.0 分母漏減 d，151.1 分母漏乘 2。", "ref": "火災學筆記 題型20", "subject": "火災學", "src": "new"}, {"id": "F-N2-107", "topic": "煙與熱流", "stem": "某避難門高 2.1 m、寬 0.9 m，把手距門邊 0.1 m，門兩側壓差 90 Pa，克服自鎖力需 45 N，則開門所需力量及是否符合 NFPA 規範，下列何者正確？", "opts": {"A": "約 96 N，未超過 133 N，符合規範", "B": "約 141 N，未超過 200 N，符合規範", "C": "約 141 N，超過 133 N，不符規範", "D": "約 130 N，未超過 133 N，符合規範"}, "answer": "C", "explain": "F＝45＋0.9×1.89×90÷(2×0.8)≒45＋95.7≒141 N＞133 N，不符（壓差 90 Pa 雖低於 100 Pa）。96 N 漏加自鎖力，130 N 分母漏減 d。", "ref": "火災學筆記 題型20", "subject": "火災學", "src": "new"}, {"id": "F-N2-108", "topic": "煙與熱流", "stem": "某油池火災之可燃物直徑為 2 m，燃燒釋熱率為 4000 kW，依 Heskestad 公式 L ＝ －1.02D ＋ 0.235Q^(2/5)，其火焰平均高度約為多少公尺？", "opts": {"A": "6.48 m", "B": "8.52 m", "C": "57.2 m", "D": "4.44 m"}, "answer": "D", "explain": "L＝－1.02×2＋0.235×4000^0.4≒－2.04＋6.48≒4.44 m。6.48 漏減 1.02D，8.52 符號用錯，57.2 誤用 2/3 次方。", "ref": "火災學筆記 題型21", "subject": "火災學", "src": "new"}, {"id": "F-N2-109", "topic": "煙與熱流", "stem": "某油池燃燒面直徑為 2 m，質量燃燒速度為 40 g/m²·s，燃燒熱為 44 MJ/kg，則其燃燒釋熱率約為多少 kW？", "opts": {"A": "5529 kW", "B": "22117 kW", "C": "1760 kW", "D": "5.53 kW"}, "answer": "A", "explain": "A＝π×1²≒3.14 m²；R＝40×3.14≒125.7 g/s；Q＝125.7×44 kJ/g≒5529 kW。22117 誤把直徑當半徑，1760 漏乘面積，5.53 單位多除 1000。", "ref": "火災學筆記 題型21", "subject": "火災學", "src": "new"}, {"id": "F-N2-110", "topic": "煙與熱流", "stem": "某居室天花板距火源 4 m，火源熱釋放率 1000 kW（位於室內中央），依 Alpert 公式，距火源正上方水平 2 m 處天花板噴射流之溫度上升量 ΔT 約為多少℃？", "opts": {"A": "167.7℃", "B": "84.7℃", "C": "104.7℃", "D": "213.5℃"}, "answer": "B", "explain": "R/H＝0.5＞0.18，用 ΔT＝5.38(Q/R)^(2/3)/H＝5.38×500^(2/3)÷4≒84.7℃。167.7 誤用近中心式，104.7 多加了環境溫度（題目問溫升），213.5 誤用角落 4 倍 Q。", "ref": "火災學筆記 題型21", "subject": "火災學", "src": "new"}, {"id": "F-C2-001", "topic": "燃燒", "stem": "下列有關燃燒的定義或敘述何者正確？", "opts": {"A": "「還原」之化學反應與「熱流動」之物理形態，二者組合之錯綜複雜現象", "B": "伴同發熱與發光之還原現象", "C": "鎳線之赤熱現象非屬燃燒", "D": "鐵板之生鏽現象屬燃燒"}, "answer": "C", "explain": "燃燒是伴隨發熱發光的激烈氧化反應，A、B 誤寫成還原。鎳線赤熱只是通電發熱、未與氧劇烈化合；鐵生鏽是緩慢氧化、不發光，兩者都不算燃燒。", "ref": "【89警技、90士、91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-003", "topic": "燃燒", "stem": "下列何者非屬可燃物所構成的燃燒反應？", "opts": {"A": "CO + 1/2 O₂ → CO₂", "B": "H₂S + Cl₂ → 2HCl + S", "C": "H₂ + 1/2 O₂ → H₂O", "D": "I₂ + 1/2 O₂ → I₂O"}, "answer": "D", "explain": "碘（I₂）與氧化合的反應不具可燃物條件，不屬燃燒；CO、H₂S、H₂ 皆為可燃物（H₂S 可在氯氣中燃燒）。", "ref": "【88警技】（原題五選項，刪去 C + 1/2 O₂ → CO 改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-004", "topic": "熱傳", "stem": "下列物質之熱傳導度大小之順序何者正確？", "opts": {"A": "一氧化碳>酒精>石墨>鐵塊", "B": "酒精>一氧化碳>石墨>鐵塊", "C": "鐵塊>石墨>一氧化碳>酒精", "D": "鐵塊>石墨>酒精>一氧化碳"}, "answer": "D", "explain": "熱傳導度一般為金屬固體>非金屬固體>液體>氣體，對應鐵塊>石墨>酒精>一氧化碳；C 把氣體排在液體前面是錯的。", "ref": "【89警技、91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-006", "topic": "熱傳", "stem": "在常溫下，下列何者物質其熱傳導係數最低？", "opts": {"A": "銅", "B": "橡膠", "C": "空氣", "D": "石膏板"}, "answer": "C", "explain": "熱傳導係數：金屬>非金屬固體>液體>氣體；銅最大，氣體（空氣）最小。", "ref": "【91警技、87、89、94消佐】（原 A 選項 OCR 缺字已刪，改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-007", "topic": "熱傳", "stem": "在一般穩定狀態的熱傳導（steady state conduction），所謂傅立葉熱傳公式（Fourier's law of heat conduction）為何？（q″：單位面積熱傳導量 W/m²；k：熱傳導係數 W/m·K；ΔT：溫度差 K；Δx：兩者距離 m）", "opts": {"A": "q″ = −k ΔT/Δx", "B": "q″ = −k Δx/ΔT", "C": "q″ = −k ΔT²/Δx", "D": "q″ = −k (ΔT/Δx)⁴"}, "answer": "A", "explain": "傅立葉定律：熱通量與溫度梯度成正比、方向與梯度相反，故 q″ = −k·ΔT/Δx；其他選項把分子分母顛倒或多加次方。", "ref": "【89消佐、93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-008", "topic": "熱傳", "stem": "下列有關「熱傳導係數」之敘述何者有誤？", "opts": {"A": "具方向性", "B": "與溫度有關", "C": "與材質有關", "D": "空氣在常壓下之熱傳導係數為零"}, "answer": "D", "explain": "空氣熱傳導係數很小（約 0.026 W/m·K）但不是零。熱傳導係數隨材質、溫度而變，異向性材料（如木材）也具方向性。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-009", "topic": "熱傳", "stem": "下列有關「熱」之敘述何者有誤？", "opts": {"A": "具方向性", "B": "因溫度差而存在", "C": "任何單一系統皆具有熱", "D": "為能量的一種"}, "answer": "C", "explain": "熱是因溫度差而在系統間傳遞的能量，屬「過程中」的量，單一系統只具有內能而不「具有熱」；熱由高溫流向低溫，所以具方向性。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-010", "topic": "燃燒", "stem": "可燃物之條件是指當其氧化之際，需具有 100 kcal/mole 以上之發熱量，且熱傳導度約在多少以下者才可充當之？", "opts": {"A": "1.0 cal/cm·sec·℃", "B": "0.1 kcal/cm·sec·℃", "C": "0.1 kJ/cm·sec·℃", "D": "1.0 kJ/cm·sec·℃"}, "answer": "A", "explain": "可燃物條件之一是熱傳導度約 0.001 kcal/cm·sec·℃ 以下，即 1.0 cal/cm·sec·℃；其餘選項都大了 100 倍以上。", "ref": "【87、89消佐、92、94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-011", "topic": "燃燒", "stem": "凡不能與氧化合之物質均非可燃物，但氮氣（N₂）可與氧化合，亦被視為非可燃物，是因為其反應過程具何者因素？", "opts": {"A": "發熱反應", "B": "吸熱反應", "C": "閃火點太高", "D": "熱傳導度過低"}, "answer": "B", "explain": "氮與氧化合為吸熱反應，無法自行放熱維持反應，所以不算可燃物；可燃物須為放熱的氧化反應。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89、93消佐、91警技】（原題五選項，刪去「無法產生連鎖反應」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-012", "topic": "熱傳", "stem": "熱透過流動介質，將熱量由空間中的一處傳到另一處的現象稱之為：", "opts": {"A": "傳導", "B": "對流", "C": "輻射", "D": "擴散"}, "answer": "B", "explain": "靠流體（氣體、液體）流動攜帶熱量的是對流；傳導靠分子接觸，輻射不需介質。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-013", "topic": "熱傳", "stem": "煙囪效應屬那一種熱量的傳遞？", "opts": {"A": "熱傳導", "B": "熱對流", "C": "熱輻射", "D": "以上皆非"}, "answer": "B", "explain": "煙囪效應是豎井內熱氣因密度差上升形成的流動，屬熱對流。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-014", "topic": "熱傳", "stem": "靠近熱固體的熱氣流以及火焰中的熱氣流，由浮力驅使的流動稱之為：", "opts": {"A": "自然對流", "B": "強制對流", "C": "正煙囪效應", "D": "逆煙囪效應"}, "answer": "A", "explain": "由溫差造成密度差、以浮力驅動的流動為自然對流；強制對流需風扇、泵浦等外力。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-016", "topic": "熱傳", "stem": "一般而言，區劃空間火災肇始時（不考慮爆炸），熱傳形式主要是：", "opts": {"A": "熱傳導和熱輻射", "B": "熱傳導和熱對流", "C": "熱對流和熱輻射", "D": "熱傳導、熱對流和熱輻射"}, "answer": "B", "explain": "起火初期火勢小、火焰輻射弱，熱主要經接觸傳導與火羽流對流傳遞；進入成長期後才以輻射為主。此題書上無答案，依一般教材判定。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-017", "topic": "熱傳", "stem": "火場中往鄰棟延燒主要的能量傳遞途徑為：", "opts": {"A": "傳導", "B": "對流", "C": "輻射", "D": "以上皆非"}, "answer": "C", "explain": "鄰棟之間隔著空氣空間，傳導可忽略，對流熱氣多往上升，主要靠火焰與開口的輻射熱引燃鄰棟。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-018", "topic": "熱傳", "stem": "一般而言，區劃空間中引發全面性燃燒的最主要熱傳形式是：", "opts": {"A": "熱傳導", "B": "自然對流", "C": "強制對流", "D": "熱輻射"}, "answer": "D", "explain": "閃燃時天花板熱煙層與火焰的輻射熱回饋到地面可燃物，使其同時達到發火，最主要是熱輻射。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-019", "topic": "熱傳", "stem": "下列有關熱傳的敘述，何者正確？", "opts": {"A": "根據牛頓導熱定律，傳導熱通量正比於溫度梯度", "B": "根據傅立葉冷卻定律，對流熱通量正比於流體和固體表面間的溫度差", "C": "根據史蒂芬－波茲曼方程式，輻射熱通量正比於溫度梯度", "D": "任何可燃物，皆可發射輻射熱"}, "answer": "D", "explain": "A、B 把傅立葉（傳導）與牛頓（冷卻/對流）定律名稱對調；C 輻射熱通量正比於絕對溫度四次方而非溫度梯度。凡溫度高於絕對零度的物體都會發出輻射。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-020", "topic": "火災", "stem": "一般木造建築物之火勢延燒，並不會藉由下列何種方式延燒？", "opts": {"A": "接炎", "B": "輻射熱", "C": "飛火", "D": "觸媒"}, "answer": "D", "explain": "木造建築延燒途徑為接炎、輻射熱與飛火；觸媒是加速化學反應的物質，不是延燒途徑。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-021", "topic": "熱傳", "stem": "高溫物體與低溫物體之間，無媒介物質，熱直接傳至對方的現象，為：", "opts": {"A": "熱傳導", "B": "熱對流", "C": "熱輻射", "D": "分解燃燒"}, "answer": "C", "explain": "不需介質、以電磁波直接傳熱的是熱輻射；傳導與對流都需要介質。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-022", "topic": "熱傳", "stem": "有關輻射熱量與受輻射物體間距離成何種關係？", "opts": {"A": "輻射熱量與距離成正比", "B": "輻射熱量與距離平方成正比", "C": "輻射熱量與距離成反比", "D": "輻射熱量與距離平方成反比"}, "answer": "D", "explain": "點熱源輻射向四周擴散，受熱強度與距離平方成反比（距離加倍、熱量剩 1/4）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-023", "topic": "熱傳", "stem": "下列何者為史蒂芬－波茲曼（Stefan-Boltzmann）熱輻射公式？其中 E 為單位面積釋出的熱量（W/m²），σ 為史蒂芬－波茲曼常數（5.67×10⁻⁸ W/m²K⁴），ε 為放射率（emissivity，黑體 = 1）。", "opts": {"A": "E = εσT", "B": "E = εσ + T", "C": "E = εσT^(1/4)", "D": "E = εσT⁴"}, "answer": "D", "explain": "黑體輻射能與絕對溫度四次方成正比，乘上放射率 ε 即為實際物體的 E = εσT⁴。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92消佐】（C 選項原文 OCR 模糊，依形式還原）", "subject": "火災學", "src": "old"}, {"id": "F-C2-024", "topic": "熱傳", "stem": "依據史蒂芬－波茲曼（Stefan-Boltzmann）之熱輻射公式，當接受輻射面積一定時，輻射熱量與輻射物體溫度成何種關係？", "opts": {"A": "與輻射物體溫度的四次方成正比", "B": "與輻射物體溫度的三次方成正比", "C": "與輻射物體溫度的二次方成正比", "D": "與輻射物體溫度的一次方成正比"}, "answer": "A", "explain": "E = εσT⁴，輻射熱量與絕對溫度的四次方成正比。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、94消佐、91、94士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-029", "topic": "熱傳", "stem": "假如具有相同尺寸（同表面積）且相同物理性質之物體 A 與 B，A 物體之表面溫度為 819.0℃，B 物體之表面溫度為 273.0℃，依據史蒂芬－波茲曼熱輻射方程式（Stefan-Boltzmann equation），A/B 的熱輻射量（W）比值約為多少？", "opts": {"A": "3", "B": "9", "C": "16", "D": "81"}, "answer": "C", "explain": "E ∝ T⁴（絕對溫度）：(819+273)/(273+273) = 1092/546 = 2，2⁴ = 16。若誤用攝氏溫度相除（約 3）就會選錯。", "ref": "【93、94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-031", "topic": "滅火", "stem": "開闢防火巷的滅火方法主要是控制何種燃燒要素？", "opts": {"A": "氧氣", "B": "熱能", "C": "可燃物", "D": "連鎖反應"}, "answer": "C", "explain": "開闢防火巷是移除或隔離延燒路徑上的可燃物，屬除去可燃物的隔離滅火法。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題五選項，刪去「以上皆是」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-032", "topic": "燃燒", "stem": "下列物質何者具有可燃性？", "opts": {"A": "氧化鋁（Al₂O₃）", "B": "氧化鎂（MgO）", "C": "氧化鈣（CaO）", "D": "一氧化碳（CO）"}, "answer": "D", "explain": "金屬氧化物已是完全氧化的產物，不能再燃燒；CO 仍可與氧反應生成 CO₂。", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-033", "topic": "燃燒", "stem": "下列何種氣體不具可燃性？", "opts": {"A": "氧氣", "B": "一氧化碳", "C": "氫氰酸", "D": "乙烯"}, "answer": "A", "explain": "氧氣是助燃物而非可燃物；CO、氫氰酸、乙烯都是可燃性氣體。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92消佐】（B、C、D 選項 OCR 缺字依常見考法還原）", "subject": "火災學", "src": "old"}, {"id": "F-C2-034", "topic": "燃燒", "stem": "下列何種物質不具可燃性？", "opts": {"A": "一氧化碳（CO）", "B": "四氯化碳（CCl₄）", "C": "氨氣（NH₃）", "D": "二硫化碳（CS₂）"}, "answer": "B", "explain": "四氯化碳中碳已與氯完全結合，不燃，過去還曾作滅火劑；氨與二硫化碳都有燃燒範圍。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-035", "topic": "燃燒", "stem": "可燃物因氧氣供給充足，可燃成份燃燒後全部化為二氧化碳與水時，此現象稱：", "opts": {"A": "定常燃燒", "B": "完全燃燒", "C": "發焰燃燒", "D": "均一系燃燒"}, "answer": "B", "explain": "可燃成分全部氧化成 CO₂ 與 H₂O、無殘留可燃物即為完全燃燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-036", "topic": "燃燒", "stem": "可燃物因氧氣供應不足，燃燒時產生一氧化碳、煤灰、硫化氫等可燃成分，以致無法釋放燃料中所有熱量之燃燒。此一現象為何？", "opts": {"A": "不發焰燃燒", "B": "發焰燃燒", "C": "完全燃燒", "D": "不完全燃燒"}, "answer": "D", "explain": "氧氣不足時生成物仍含 CO、煤灰等可燃成分，屬不完全燃燒；不發焰燃燒是指無火焰的燃燒型態，與此不同。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐、92】", "subject": "火災學", "src": "old"}, {"id": "F-C2-037", "topic": "燃燒", "stem": "燃燒時發生之熱超過逸散之熱，二者不能保持平衡之燃燒現象，稱為：", "opts": {"A": "非定常燃燒", "B": "不完全燃燒", "C": "非均一系燃燒", "D": "不發焰燃燒"}, "answer": "A", "explain": "產熱大於散熱、溫度持續上升而失去平衡（如爆炸）稱非定常燃燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【消佐、89警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-038", "topic": "燃燒", "stem": "燃燒時發生之熱與逸散之熱，保持均衡燃燒溫度的燃燒現象，稱為：", "opts": {"A": "定常燃燒", "B": "完全燃燒", "C": "混合燃燒", "D": "均一系燃燒"}, "answer": "A", "explain": "產熱與散熱平衡、燃燒溫度穩定稱定常燃燒；完全燃燒是以生成物分類，不是以熱平衡分類。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、93消佐、91、94警技】（原題五選項，刪去「分解燃燒」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-039", "topic": "燃燒", "stem": "有關燃燒分類之定義與敘述，下列何者正確？", "opts": {"A": "燃燒完畢後生成物中含有 CO 則為完全燃燒", "B": "爆炸屬於定常燃燒", "C": "甲烷由噴嘴流出於空氣中被點燃時為擴散燃燒", "D": "硫磺加熱後燃燒屬分解燃燒"}, "answer": "C", "explain": "燃料氣由噴嘴流出、邊與空氣擴散混合邊燃燒即為擴散燃燒。含 CO 屬不完全燃燒，爆炸是非定常燃燒，硫磺是受熱昇華的蒸發燃燒。", "ref": "【88警技、88士】（原題五選項，刪去「硝化棉燃燒時若無氧氣分子供給即無法發生燃燒」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-041", "topic": "燃燒", "stem": "都市瓦斯、氫及乙炔等氣體由管口擴散至外界與周圍空氣混合而燃燒，此現象為何？", "opts": {"A": "混合燃燒", "B": "擴散燃燒", "C": "放電燃燒", "D": "以上皆是"}, "answer": "B", "explain": "燃料氣自管口流出後才與周圍空氣擴散混合並燃燒，屬擴散燃燒；混合燃燒是先混好再點火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士、92、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-042", "topic": "燃燒", "stem": "下列何種物質之燃燒屬於蒸發燃燒？", "opts": {"A": "汽油", "B": "石蠟", "C": "脂肪油", "D": "紙"}, "answer": "A", "explain": "汽油液面蒸發出的可燃蒸氣燃燒，屬蒸發燃燒；本書把石蠟、脂肪油、紙都歸在受熱分解產生可燃氣的分解燃燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-043", "topic": "燃燒", "stem": "硫黃固體之燃燒屬於下列何種燃燒型態？", "opts": {"A": "爆炸燃燒", "B": "分解燃燒", "C": "蒸發燃燒", "D": "表面燃燒"}, "answer": "C", "explain": "硫黃、萘受熱昇華或熔融後蒸發成可燃氣再燃燒，屬蒸發燃燒，並未經熱分解。", "ref": "【87警技、89消佐、89士】（原 C 選項 OCR 缺字已刪，改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-044", "topic": "燃燒", "stem": "木材、紙張、石蠟等固體燃料，經加熱生出可燃性氣體引起之燃燒，應歸類為何種燃燒形態？", "opts": {"A": "蒸發燃燒", "B": "均一系燃燒", "C": "表面燃燒", "D": "分解燃燒"}, "answer": "D", "explain": "固體受熱先熱分解產生可燃性氣體再燃燒，稱分解燃燒；表面燃燒則是固體表面直接與氧反應。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士、87、89、91、94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-046", "topic": "燃燒", "stem": "燃燒之形態中，石油類之燃燒係屬下列何種形態燃燒：", "opts": {"A": "擴散燃燒", "B": "分解燃燒", "C": "均一系燃燒", "D": "非均一系燃燒"}, "answer": "D", "explain": "石油是液體蒸發成氣體後燃燒，燃料與氧化劑相態不同，屬非均一系燃燒（亦屬蒸發燃燒）。", "ref": "【87消佐、89士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-047", "topic": "燃燒", "stem": "木炭、焦炭、金屬粉等固體可燃物，其燃燒之現象稱為：", "opts": {"A": "表面燃燒", "B": "蒸發燃燒", "C": "混合燃燒", "D": "分解燃燒"}, "answer": "A", "explain": "木炭、焦炭、金屬粉不產生可燃氣，直接在固體表面與氧反應、無焰發光，屬表面燃燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】（C 選項原文缺字，補為混合燃燒）", "subject": "火災學", "src": "old"}, {"id": "F-C2-049", "topic": "燃燒", "stem": "那一種燃燒的燃燒速度會愈來愈慢？", "opts": {"A": "混合燃燒", "B": "蒸發燃燒", "C": "擴散燃燒", "D": "表面燃燒"}, "answer": "D", "explain": "表面燃燒時灰分逐漸覆蓋在表面、阻礙氧氣接觸，反應面積也逐漸縮小，燃燒速度愈來愈慢。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-052", "topic": "燃燒", "stem": "某些物質如賽璐珞（Celluloid）起熱分解後，除會產生可燃性氣體外，同時亦會產生氧，此類物質不需空氣之氧助燃，只依賴分子內之氧即可燃燒，此種燃燒稱為：", "opts": {"A": "自己燃燒", "B": "分解燃燒", "C": "蒸發燃燒", "D": "表面燃燒"}, "answer": "A", "explain": "分子內含氧、不需外部空氣即可燃燒（硝化棉、賽璐珞等）稱自己燃燒（內部燃燒）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89警技、94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-053", "topic": "燃燒", "stem": "決定混合燃燒之火焰蔓延速率之要素，並不包括下列那項：", "opts": {"A": "壓力", "B": "溫度", "C": "閃燃點", "D": "氣體組成成分"}, "answer": "C", "explain": "預混合火焰傳播速度受壓力、初溫、組成（濃度）影響；閃燃點（引火點）是液體性質，與已混合氣體的火焰速度無關。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐、89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-054", "topic": "燃燒", "stem": "下列有關擴散火焰的敘述，何者正確？", "opts": {"A": "擴散火焰的燃燒型態，往往是爆炸式的燃燒", "B": "間歇火焰區域（the intermittent zone）內的流體處於加速狀態", "C": "浮升羽柱（the buoyant plume）內的流體溫度隨高度增加而遞增", "D": "浮升羽柱區域內的流體狀態，與撒水頭的動作有關"}, "answer": "D", "explain": "撒水頭與偵煙探測器設在天花板，是否動作取決於火羽流到達處的溫度與流速。爆炸式燃燒屬預混合火焰；加速區是持續火焰區；羽柱溫度隨高度遞減。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-055", "topic": "燃燒", "stem": "下列有關預混合火焰燃燒速度的敘述，何者正確？", "opts": {"A": "組成複雜的氣體，燃燒速度較快", "B": "氣體的濃度稍高於化學理論濃度時，燃燒速度最大", "C": "可燃混合氣體的初始溫度越低，燃燒速度越快", "D": "管路直徑越大，火焰傳播的速度越小"}, "answer": "B", "explain": "燃燒速度在略濃於化學計量濃度時最大。初溫越高越快；管徑越大熱損失越小、傳播越快；組成越簡單通常越快。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【93士】（D 選項原文缺字，依題意補「越大」）", "subject": "火災學", "src": "old"}, {"id": "F-C2-056", "topic": "燃燒", "stem": "擴散火焰的流體處於加速狀態的區域為：", "opts": {"A": "燃氣區域", "B": "間歇火焰區域（the intermittent zone）", "C": "浮升羽柱區域（the buoyant plume zone）", "D": "持續火焰區域"}, "answer": "D", "explain": "McCaffrey 火羽流分區：持續火焰區流體加速上升，間歇火焰區速度約略恆定，浮升羽柱區速度隨高度遞減。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-057", "topic": "燃燒", "stem": "對於引火與發火之區別，下列敘述何者正確？", "opts": {"A": "自可燃物產生蒸氣時，由火焰能引燃之最低溫度稱為發火點", "B": "可燃物受熱時不藉火焰或電氣火花點火時，也能自燃之現象稱為引火", "C": "若利用加熱包圍間接加熱或給予溫度緩慢加熱至被加熱物由本身起燃所需之最低溫度稱為發火點", "D": "甲烷在空氣中之發火點為 68℃"}, "answer": "C", "explain": "不靠外部火源、加熱到本身起燃的最低溫度是發火點；A 描述的是引火點，B 描述的是發火。甲烷發火點約 537℃，遠高於 68℃。", "ref": "【88警技、89士】（原題五選項，刪去「以上皆非」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-058", "topic": "燃燒", "stem": "以火焰等熱能接觸液體表面，使液溫上昇至液體之蒸發量達到燃燒之下限，並使之燃燒。此時之液面溫度一般稱為：", "opts": {"A": "熔點", "B": "臨界溫度", "C": "引火溫度", "D": "發火溫度"}, "answer": "C", "explain": "液面蒸氣濃度達燃燒下限、可被外部火焰點燃的最低液溫稱引火溫度（引火點）；發火溫度不需外部火源。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐、91消佐、91警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-059", "topic": "燃燒", "stem": "以一小火焰接觸液體表面，使其表面蒸氣（vapour）能夠開始點燃（ignite），此時之液體溫度，一般稱之為：", "opts": {"A": "沸點（boiling point）", "B": "引火點（flash point）", "C": "降伏點（yielding point）", "D": "自燃溫度（auto-ignition temperature）"}, "answer": "B", "explain": "以小火焰接近液面能引燃蒸氣的最低液溫即引火點（閃火點）；自燃溫度不需外部火焰。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士、89、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-060", "topic": "燃燒", "stem": "可燃液體之溫度昇高，蒸氣之發生速度增加，液面上之混合氣引火後始能繼續不輟，此一能使燃燒持續之溫度稱為：", "opts": {"A": "沸點（boiling point）", "B": "引火點（flash point）", "C": "火焰點（fire point）", "D": "自燃溫度（auto-ignition temperature）"}, "answer": "C", "explain": "引火點只能瞬間閃燃；溫度再高到蒸氣供應足以使火焰持續不熄，稱火焰點（燃燒點），通常比引火點高數度。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-061", "topic": "燃燒", "stem": "可燃性液體之溫度昇高，蒸氣發生之速度增加，液面上之混合氣引火後始能繼續燃燒，此能使燃燒持續之溫度稱為：", "opts": {"A": "引火點（Pilot ignition point）", "B": "發火點（Self-ignition point）", "C": "沸點（Boiling point）", "D": "燃燒點（Burning point）"}, "answer": "D", "explain": "能使引火後燃燒持續下去的最低液溫是燃燒點（火焰點）；引火點只會瞬間閃火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題五選項，刪去「閃火點（Flash point）」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-062", "topic": "燃燒", "stem": "欲使混合氣體發火，而使用加熱之固體者，必須該固體之表面溫度達至一定溫度以上，此特定之溫度之名稱為何？", "opts": {"A": "發火點", "B": "閃燃點", "C": "引火點", "D": "以上皆是"}, "answer": "A", "explain": "以高溫固體（無火焰）使混合氣體起燃，所需的最低溫度屬發火點的概念；引火點需外部火焰。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-063", "topic": "燃燒", "stem": "對於一般的汽油（gasoline），其引火點溫度（flash point）、沸點溫度（boiling point）、自燃溫度（auto-ignition）分別為 a、b、c，請問 a、b、c 之關係為何？", "opts": {"A": "c>b>a", "B": "a>b>c", "C": "b>a>c", "D": "a>c>b"}, "answer": "A", "explain": "汽油引火點約 −43℃、沸點約 30~200℃、自燃溫度約 250℃ 以上，故 c>b>a。", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-064", "topic": "燃燒", "stem": "對含等量甲烷分別添加不活潑性氣體氮（N₂）、氦（He）、氬（Ar）等三種，在相同濃度及氣壓條件下，其所需最小發火能量大小分別為 a、b、c，請問 a、b、c 之關係為何？", "opts": {"A": "a<b<c", "B": "a=b=c", "C": "b>a>c", "D": "a>b>c"}, "answer": "C", "explain": "惰性氣體熱傳導度越高，越易帶走熱，所需發火能量越大；熱傳導度 He>N₂>Ar，故 b>a>c。", "ref": "【91警技】（原題五選項，刪去「a>c>b」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-069", "topic": "燃燒", "stem": "火焰溫度通常會依位置不同而有所變化，以蠟燭火焰為例，其那個位置溫度最高？", "opts": {"A": "中部", "B": "前端", "C": "下部", "D": "以上皆是"}, "answer": "A", "explain": "本書指出定常燃燒的火焰（如本生燈、瓦斯器具）以中部溫度最高，蠟燭火焰同屬定常燃燒，依此判定中部。但一般理化教材常說外焰最高，說法有出入。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【92士】（A 選項原文缺字，補為中部）", "subject": "火災學", "src": "old"}, {"id": "F-C2-070", "topic": "熱傳", "stem": "火焰中所發出的輻射熱量與下列何者成正比？", "opts": {"A": "其攝氏溫度的四次方", "B": "其絕對溫度的四次方", "C": "與外界溫差", "D": "與外界溫差的四次方"}, "answer": "B", "explain": "史蒂芬－波茲曼定律用的是絕對溫度（K），輻射量與 T⁴ 成正比；以攝氏溫度計算會出錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-071", "topic": "燃燒", "stem": "本生燈燃燒之火焰溫度，以何處為最高？", "opts": {"A": "焰上端", "B": "焰中", "C": "焰底部", "D": "溫度一致"}, "answer": "B", "explain": "本生燈屬定常燃燒，火焰中部（內焰尖端上方）氧氣與燃料反應最完全、溫度最高，底部尚未充分反應，上端已散熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-073", "topic": "燃燒", "stem": "任何化學反應從反應物能階到生成物能階之過程中，須經由一個較高能階的活性錯合物（體），其與反應物能階的差值，其名稱為何？", "opts": {"A": "熱能", "B": "活化能", "C": "熵", "D": "自由能"}, "answer": "B", "explain": "反應物需跨越到活性錯合物的能量障壁才能反應，此能量差即活化能；自由能與熵描述的是反應是否自發。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-074", "topic": "熱傳", "stem": "材料的熱慣性，不包括下列那一項？", "opts": {"A": "密度", "B": "熱傳導係數", "C": "溫度", "D": "比熱"}, "answer": "C", "explain": "熱慣性定義為 kρc（熱傳導係數×密度×比熱），屬材料性質，不含溫度。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-075", "topic": "燃燒", "stem": "氣體本身受到壓縮，增高溫度時，亦可發火，此稱為：", "opts": {"A": "高溫壓縮", "B": "加溫壓縮", "C": "引火壓縮", "D": "斷熱壓縮"}, "answer": "D", "explain": "氣體被快速壓縮、來不及散熱，溫度急升而起火，稱斷熱（絕熱）壓縮，柴油引擎即應用此原理。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題五選項，刪去一個 OCR 缺字的錯誤選項改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-076", "topic": "燃燒", "stem": "氫氣與氯氣作用生成氯化氫為一連鎖反應，組成此連鎖反應之步驟，何者正確？", "opts": {"A": "二個起始步驟（Initiation Step）", "B": "一個繁衍步驟（Propagation Step）", "C": "四個終了步驟（Termination Step）", "D": "二個繁衍步驟（Propagation Step）"}, "answer": "D", "explain": "H₂＋Cl₂ 連鎖反應為 1 個起始（Cl₂→2Cl·）、2 個繁衍（Cl·＋H₂、H·＋Cl₂）、3 個終了步驟。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題五選項，刪去「二個終了步驟」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-077", "topic": "燃燒", "stem": "氫氣在氯氣中燃燒為一連鎖反應，而此連鎖反應係由下列何者所組成？", "opts": {"A": "二個起始步驟、二個繁衍步驟及二個終了步驟", "B": "一個起始步驟、二個繁衍步驟及三個終了步驟", "C": "二個起始步驟、一個繁衍步驟及二個終了步驟", "D": "一個起始步驟、二個繁衍步驟及一個終了步驟"}, "answer": "B", "explain": "起始 1（Cl₂ 解離）、繁衍 2（Cl·＋H₂→HCl＋H·；H·＋Cl₂→HCl＋Cl·）、終了 3（H·＋H·、Cl·＋Cl·、H·＋Cl· 再結合）。", "ref": "【87警技】（原題五選項，刪去「一個起始、三個繁衍及二個終了步驟」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-078", "topic": "燃燒", "stem": "關於燃燒最直接之發火源為何？", "opts": {"A": "有焰源", "B": "高溫固體", "C": "撞擊摩擦", "D": "斷熱壓縮"}, "answer": "A", "explain": "明火（有焰源）直接提供火焰與高溫，是最直接的發火源；其餘需先把能量轉成熱才會發火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-080", "topic": "燃燒", "stem": "下列有關燃燒範圍的敘述，何者是錯誤的？", "opts": {"A": "燃燒範圍是指：可燃性氣體與空氣的混合比例，達可能燃燒之濃度範圍", "B": "利用二氧化碳滅火的原理，係在改變起火物質的燃燒範圍", "C": "燃燒範圍會隨壓力或溫度不同而變化", "D": "可燃性混合氣體的燃燒下限愈低，危險性愈高"}, "answer": "B", "explain": "二氧化碳滅火主要是稀釋氧濃度（窒息）並兼冷卻，一般不說成改變物質的燃燒範圍；燃燒範圍確實隨溫度、壓力而變，下限愈低愈危險。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【9?消佐】（年份 OCR 缺字）", "subject": "火災學", "src": "old"}, {"id": "F-C2-082", "topic": "煙與熱流", "stem": "關於可燃性氣體對燃燒的影響，除本身燃燒性外，其燃燒時受熱之氣體，受何因素影響，產生浮力上昇而引起對流，並依建築物方向產生氣流，此因素稱為？", "opts": {"A": "氣積差", "B": "溫度差", "C": "理論空氣量", "D": "過剩空氣"}, "answer": "B", "explain": "受熱氣體因溫度差造成密度差而上升，形成對流與氣流；氣積差則是指火焰往容積大的方向擴展。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91警技】（原題五選項，刪去「輻射熱」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-083", "topic": "煙與熱流", "stem": "任何可燃性氣體引火後，必成為增大火焰及燃燒力之積極力量，除本身之燃燒性外，火焰擴展時，容易朝空間容積大的方向流動，此種現象係因何種因素所造成？", "opts": {"A": "溫度差", "B": "質量差", "C": "氣積差", "D": "時間差"}, "answer": "C", "explain": "火焰朝空間容積大的方向擴展，書上歸因於氣積差；溫度差造成的是浮力上升。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89、91、94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-085", "topic": "燃燒", "stem": "關於可燃性固體燃燒難易程度之決定因素，下列敘述何者為非？", "opts": {"A": "稻草數量愈多，燃燒力愈強", "B": "形狀愈細薄小的物質，吸熱愈迅速，燃燒力愈差", "C": "紙張橫放比直立之燃燒力差", "D": "氧氣供給充足比供給不足燃燒力強"}, "answer": "B", "explain": "細薄的物質熱容量小、吸熱快，升溫快而更容易燃燒，燃燒力應該愈強，B 講反了。", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-086", "topic": "燃燒", "stem": "可燃性固體之燃燒，下列何者有誤？", "opts": {"A": "燃燒時之溫度受質與量決定", "B": "粉末形狀較薄易燃", "C": "豎立狀態比平鋪狀態難燃", "D": "加熱緩慢者較不易著火"}, "answer": "C", "explain": "豎立時火焰向上預熱上方材料、空氣也易補充，比平鋪容易燃燒，C 講反了；加熱緩慢時熱量有時間散失，較不易著火。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【94士】（C、D 選項原文缺字，依題意還原）", "subject": "火災學", "src": "old"}, {"id": "F-C2-087", "topic": "燃燒", "stem": "在絕熱壓縮中壓縮比為 1，壓力為 1 大氣壓及溫度為 20℃ 之情形下，若空氣之 γ 值為 1.4，則當壓縮比變為 20 時，溫度會上昇至多少？（20^1.4 = 66.29，20^0.4 = 3.31）", "opts": {"A": "594℃", "B": "697℃", "C": "792℃", "D": "998℃"}, "answer": "B", "explain": "絕熱壓縮 T₂ = T₁ × ε^(γ−1) = 293 × 20^0.4 = 293 × 3.31 ≈ 970 K ≈ 697℃。", "ref": "【92警技】（原題五選項，刪去 OCR 缺字的 D 選項改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-088", "topic": "燃燒", "stem": "物質燃燒時實際所需的空氣量為 A，該值遠超過理論空氣量 B，A−B 的差值稱為：", "opts": {"A": "過剩空氣量", "B": "損失空氣量", "C": "理想空氣量", "D": "燃燒空氣量"}, "answer": "A", "explain": "實際空氣量減去理論空氣量即過剩空氣量。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89、90、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-089", "topic": "燃燒", "stem": "下列關於空氣性質的描述何者正確？", "opts": {"A": "氧氣在空氣中之體積比約 23%", "B": "氧氣在空氣中之重量比約 21%", "C": "空氣的平均分子量約為 28.8 g/mole", "D": "氧氣濃度若低於 18% 以下則燃燒甚難持續"}, "answer": "C", "explain": "空氣平均分子量約 28.8。氧氣體積比約 21%、重量比約 23%，A、B 數值對調；燃燒難以持續的氧濃度界線約 15%。", "ref": "【90警技、91消佐】（A 選項數值 OCR 缺字，依題意還原）", "subject": "火災學", "src": "old"}, {"id": "F-C2-090", "topic": "燃燒", "stem": "若物質完全燃燒，我們可以由廢氣中之那種成分估算過剩空氣量？", "opts": {"A": "一氧化碳", "B": "二氧化碳", "C": "水蒸氣", "D": "氮氣"}, "answer": "B", "explain": "完全燃燒時，過剩空氣越多，廢氣中 CO₂ 濃度被稀釋得越低，所以可由 CO₂ 含量推算過剩空氣率；完全燃燒廢氣中無 CO。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-091", "topic": "燃燒", "stem": "欲使兩公斤的氫氣完全燃燒所需的空氣容積為：", "opts": {"A": "53.4 立方公尺", "B": "69.6 立方公尺", "C": "34.8 立方公尺", "D": "26.7 立方公尺"}, "answer": "A", "explain": "2 kg H₂ = 1 kmol，需 O₂ 0.5 kmol = 11.2 m³；空氣 = 11.2 ÷ 0.21 ≈ 53.3 m³（約 53.4）。", "ref": "【89消佐、90警技】（原題五選項，刪去「80.1 立方公尺」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-092", "topic": "燃燒", "stem": "標準狀態下（0℃，1 atm），1 kmol 氣體容積為 22.4 m³，則 1 公斤（kg）之碳要完全燃燒所需的空氣容積為下列何者？", "opts": {"A": "1.6 m³", "B": "8.9 m³", "C": "11.6 m³", "D": "89.0 m³"}, "answer": "B", "explain": "C + O₂ → CO₂，1 kg C = 1/12 kmol，需 O₂ 22.4/12 ≈ 1.87 m³；空氣 = 1.87 ÷ 0.21 ≈ 8.9 m³。", "ref": "（書上未標考試年份）", "subject": "火災學", "src": "old"}, {"id": "F-C2-094", "topic": "燃燒", "stem": "同溫、同壓、同體積的乙烷、乙烯、乙炔完全燃燒所需的理論空氣量分別為 a、b、c，請問 a、b、c 之關係為：", "opts": {"A": "a>b>c", "B": "a=b=c", "C": "c>a>b", "D": "a>c>b"}, "answer": "A", "explain": "同溫同壓同體積→莫耳數相同；每 mol 需 O₂：乙烷 3.5、乙烯 3、乙炔 2.5，故 a>b>c。", "ref": "【90警技】（原題五選項，刪去「c>b>a」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-095", "topic": "燃燒", "stem": "等重的乙烷、乙烯、乙炔完全燃燒所需的理論空氣量分別為 a、b、c，請問 a、b、c 之關係為：", "opts": {"A": "a>b>c", "B": "a=b=c", "C": "c>a>b", "D": "a>c>b"}, "answer": "A", "explain": "每克需 O₂ 莫耳數：乙烷 3.5/30 ≈ 0.117、乙烯 3/28 ≈ 0.107、乙炔 2.5/26 ≈ 0.096，故 a>b>c。", "ref": "【90警技】（原題五選項，刪去「c>b>a」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-096", "topic": "燃燒", "stem": "等莫耳數的酒精、汽油、柴油完全燃燒所產生的熱量分別為 a、b、c，請問 a、b、c 之關係為：", "opts": {"A": "a>b>c", "B": "a=b=c", "C": "c>a>b", "D": "c>b>a"}, "answer": "D", "explain": "同莫耳數時分子越大、含碳氫越多，放熱越多；柴油（約 C₁₆）>汽油（約 C₈）>酒精（C₂），故 c>b>a。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題五選項，刪去「a>c>b」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-097", "topic": "燃燒", "stem": "假設一公斤燃料所需之理論空氣量為 Lo，實際需要空氣量為 La，則 La = K × Lo（K>1），則此 K 值稱為：", "opts": {"A": "空氣過剩率", "B": "空氣容積", "C": "空氣比", "D": "廢氣量"}, "answer": "C", "explain": "實際空氣量與理論空氣量之比 K 稱空氣比（過剩空氣係數）；空氣過剩率為 K−1。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-098", "topic": "燃燒", "stem": "假設一公斤燃料所需之理論空氣量為 Lo，實際需要空氣量為 La，則 La = K × Lo（其中 K 值為空氣比，K>1），假如空氣中氧重量佔整體之 23%，試問一公斤之硫（S）完全燃燒，K = 1.5 時，約需多少空氣？", "opts": {"A": "4.35 公斤", "B": "6.52 公斤", "C": "11.6 公斤", "D": "18.8 公斤"}, "answer": "B", "explain": "S + O₂ → SO₂，1 kg S 需 O₂ 1 kg；理論空氣 = 1 ÷ 0.23 ≈ 4.35 kg；實際 = 1.5 × 4.35 ≈ 6.52 kg。A 是忘了乘 K。", "ref": "【91、93、94警技】（原題五選項，刪去「34.8 公斤」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-099", "topic": "燃燒", "stem": "依亞佛加厥定律（Avogadro's Theory），同溫同壓同體積之一切氣體含有相同分子數，在標準狀態下（0℃，1 atm），1000 克分子氣體之容積為：", "opts": {"A": "11.2 立方公尺", "B": "22.4 立方公尺", "C": "33.6 立方公尺", "D": "44.8 立方公尺"}, "answer": "B", "explain": "1000 克分子 = 1 kmol，標準狀態下 1 mol 為 22.4 L，故 1 kmol 為 22.4 m³。", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-100", "topic": "燃燒", "stem": "等重的碳（C）、氫（H₂）、硫（S）完全燃燒時所需的理論空氣量，分別為 A、B、C，請問 A、B、C 之關係為何？", "opts": {"A": "A>B>C", "B": "A=B=C", "C": "C>A>B", "D": "B>A>C"}, "answer": "D", "explain": "每 kg 需 O₂：C 為 32/12 ≈ 2.67 kg、H₂ 為 16/2 = 8 kg、S 為 32/32 = 1 kg，故 B>A>C。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-101", "topic": "燃燒", "stem": "下列何種物質，一公斤燃燒時所需的理論空氣量（kg）最重？", "opts": {"A": "氫氣（H₂）", "B": "甲烷（CH₄）", "C": "碳（C）", "D": "硫（S）"}, "answer": "A", "explain": "每 kg 需 O₂：H₂ 8 kg、CH₄ 4 kg、C 2.67 kg、S 1 kg，氫最多。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-102", "topic": "燃燒", "stem": "下列不同重量之燃料燃燒時，何者之理論空氣量最小？", "opts": {"A": "12 公斤的碳（C）", "B": "32 公斤的硫（S）", "C": "4 公斤的氫氣（H₂）", "D": "28 公斤的一氧化碳（CO）"}, "answer": "D", "explain": "四者各為 C 1 kmol、S 1 kmol、H₂ 2 kmol、CO 1 kmol；需 O₂ 分別 1、1、1、0.5 kmol，CO 最少。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-103", "topic": "燃燒", "stem": "在同溫、同壓下，同體積的氣體：乙烷（C₂H₆）、乙烯（C₂H₄）、乙炔（C₂H₂），完全燃燒時所需的理論空氣量分別為 a、b、c，問 a、b、c 之關係為：", "opts": {"A": "a>b>c", "B": "b>a>c", "C": "c>a>b", "D": "c>b>a"}, "answer": "A", "explain": "同體積即同莫耳數；每 mol 需 O₂：乙烷 3.5、乙烯 3、乙炔 2.5，氫越多需氧越多，故 a>b>c。", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-104", "topic": "燃燒", "stem": "在同溫、同壓下，同體積的氣體：甲烷（CH₄）、乙烷（C₂H₆）、丙烷（C₃H₈），完全燃燒時所需的理論空氣量分別為 a、b、c，請問 a、b、c 之關係為：", "opts": {"A": "a>b>c", "B": "b>a>c", "C": "c>a>b", "D": "c>b>a"}, "answer": "D", "explain": "每 mol 需 O₂：CH₄ 2、C₂H₆ 3.5、C₃H₈ 5，碳數越多需氧越多，故 c>b>a。", "ref": "【94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-105", "topic": "燃燒", "stem": "在一大氣壓力、20℃ 狀態下，假設空氣中氧之重量佔整體的 23%，試問 1.0 kg 之硫完全燃燒，約需多少公斤之空氣？", "opts": {"A": "34.8 kg", "B": "11.6 kg", "C": "4.35 kg", "D": "8.9 kg"}, "answer": "C", "explain": "S + O₂ → SO₂，1 kg S 需 O₂ 1 kg；空氣 = 1 ÷ 0.23 ≈ 4.35 kg。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-106", "topic": "燃燒", "stem": "燃料的發熱量與有效利用熱量之比，稱為：", "opts": {"A": "燃燒效率", "B": "熱損失", "C": "空氣過剩率", "D": "廢氣產生率"}, "answer": "A", "explain": "有效利用的熱量占燃料發熱量的比例即燃燒效率。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-107", "topic": "燃燒", "stem": "下列有關燃燒範圍的敘述，何者是錯誤的？", "opts": {"A": "燃燒範圍是指可燃性氣體與空氣的混合比例，達可能發火的濃度範圍", "B": "可燃性混合氣體的燃燒下限愈低，危險性愈高", "C": "燃燒範圍會隨壓力、溫度不同而變化", "D": "利用二氧化碳滅火的原理，係在改變起火物質的燃燒範圍"}, "answer": "D", "explain": "CO₂ 滅火主要靠稀釋氧濃度（窒息）與冷卻，一般不說成改變燃燒範圍；其餘三項為燃燒範圍的正確敘述。（與第 80 題同一考點）（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-108", "topic": "燃燒", "stem": "根據下列所列之燃燒範圍判斷，那一種可燃性氣體的危險度比較大？", "opts": {"A": "異己烷：1.0~7.2%", "B": "苯：1.4~7.1%", "C": "戊烷：1.5~7.8%", "D": "汽油：1.4~7.6%"}, "answer": "A", "explain": "危險度 H = (上限−下限)/下限：異己烷 6.2、苯約 4.1、戊烷 4.2、汽油約 4.4；異己烷下限最低、H 最大。", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-109", "topic": "燃燒", "stem": "某天然氣其組成如下：甲烷 80%（燃燒下限 5.3%）、乙烷 15%（燃燒下限 3.2%）、丙烷 4%（燃燒下限 2.2%）、丁烷 1%（燃燒下限 1.9%），則天然氣的燃燒下限為多少？", "opts": {"A": "1%", "B": "3.02%", "C": "4.52%", "D": "5.02%"}, "answer": "C", "explain": "勒夏特列公式：L = 1 / (0.8/5.3 + 0.15/3.2 + 0.04/2.2 + 0.01/1.9) ≈ 4.52%。", "ref": "【89士、90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-111", "topic": "燃燒", "stem": "下列何者氣體在空氣中之燃燒界限最大？", "opts": {"A": "甲烷", "B": "乙炔", "C": "丙烷", "D": "苯"}, "answer": "B", "explain": "乙炔燃燒範圍約 2.5~81%（甚至可分解爆炸），遠寬於甲烷 5~15%、丙烷 2.1~9.5%、苯 1.3~7.1%。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-112", "topic": "燃燒", "stem": "某氣體含有 70% 之氫（燃燒下限 4%），30% 之一氧化碳（燃燒下限 12.5%），試求該氣體之燃燒下限？", "opts": {"A": "4%", "B": "5%", "C": "6%", "D": "7%"}, "answer": "B", "explain": "L = 1 / (0.7/4 + 0.3/12.5) = 1 / 0.199 ≈ 5.03% ≈ 5%。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92警技】（原題五選項，刪去「8%」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-113", "topic": "燃燒", "stem": "某混合氣體由甲、乙二種氣體組成，混合時組成氣體不進行反應，且燃燒時無催化作用，其中甲氣體占 70%（燃燒下限 7.00%），乙氣體占 30%（燃燒下限 3.00%），則此氣體燃燒下限為多少？", "opts": {"A": "4.50%", "B": "5.00%", "C": "5.50%", "D": "6.00%"}, "answer": "B", "explain": "L = 1 / (0.7/7 + 0.3/3) = 1 / 0.2 = 5.00%。不可用濃度加權平均（會得 5.8%）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C2-114", "topic": "燃燒", "stem": "某混合氣體由甲、乙、丙等三種氣體組成，混合時組成氣體不進行反應且燃燒時無催化作用，其中甲氣體占 60%（燃燒下限 5.00%），乙氣體占 32%（燃燒下限 4.0%），丙氣體占 8%（燃燒下限 1.60%），則此氣體燃燒下限為多少？", "opts": {"A": "3.00%", "B": "3.20%", "C": "3.50%", "D": "4.00%"}, "answer": "D", "explain": "L = 1 / (0.6/5 + 0.32/4 + 0.08/1.6) = 1 / (0.12 + 0.08 + 0.05) = 4.00%。", "ref": "【91、93、94警技】（原題五選項，刪去「4.50%」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C2-115", "topic": "燃燒", "stem": "如有一可燃性液體，其閃火點下的飽和蒸氣壓為 76 mmHg，試求其燃燒下限？（一大氣壓為 760 mmHg）", "opts": {"A": "5%", "B": "10%", "C": "15%", "D": "20%"}, "answer": "B", "explain": "閃火點時液面蒸氣濃度恰為燃燒下限：L = 76/760 × 100% = 10%。", "ref": "【89消佐】（B 選項 OCR 誤為 1%，依解析還原為 10%）", "subject": "火災學", "src": "old"}, {"id": "F-C2-116", "topic": "燃燒", "stem": "辛烷的閃火點為 13℃，其相對應的飽和蒸氣壓為 7 mmHg，試求其燃燒下限？", "opts": {"A": "0.86%", "B": "0.88%", "C": "0.90%", "D": "0.92%"}, "answer": "D", "explain": "L = 7/760 × 100% ≈ 0.92%。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C2-117", "topic": "燃燒", "stem": "烷類之燃燒下限有公式可計算（L₀ = 0.55 C₀，C₀ 為化學理論濃度），依該公式計算乙烷之燃燒下限值為多少？", "opts": {"A": "5.2%", "B": "4.3%", "C": "3.1%", "D": "2.2%"}, "answer": "C", "explain": "C₂H₆ + 3.5 O₂，C₀ = 1/(1 + 3.5/0.21) ≈ 5.66%；L₀ = 0.55 × 5.66 ≈ 3.1%。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92警技】（原題五選項，刪去「1.3%」改編為單選；公式依下一題補入題幹）", "subject": "火災學", "src": "old"}, {"id": "F-C2-118", "topic": "燃燒", "stem": "烷類的燃燒下限計算公式為：L₀ = 0.55 C₀（L₀：燃燒下限 %；C₀：氣體完全燃燒時的化學理論濃度 %），依該公式計算，標準狀態下丙烷的燃燒下限值約為多少？", "opts": {"A": "5.2%", "B": "4.3%", "C": "3.1%", "D": "2.2%"}, "answer": "D", "explain": "C₃H₈ + 5 O₂，C₀ = 1/(1 + 5/0.21) ≈ 4.03%；L₀ = 0.55 × 4.03 ≈ 2.2%。", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C2-119", "topic": "燃燒", "stem": "烷類的燃燒下限計算公式為：L₀ = 0.55 C₀（L₀：燃燒下限 %；C₀：氣體完全燃燒時的化學理論濃度 %），則依該公式計算結果，在標準狀態下丁烷（C₄H₁₀）的燃燒下限大約多少？", "opts": {"A": "1.1%", "B": "1.7%", "C": "2.5%", "D": "5.3%"}, "answer": "B", "explain": "C₄H₁₀ + 6.5 O₂，C₀ = 1/(1 + 6.5/0.21) ≈ 3.13%；L₀ = 0.55 × 3.13 ≈ 1.7%。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C34-002", "topic": "爆炸", "stem": "對於爆炸的描述，下列何者正確？", "opts": {"A": "爆炸時按照火焰的大小及型態可以區分成爆轟及爆燃二種", "B": "爆轟時其火焰的傳播速度在音速以下，爆燃時火焰的傳播速度則在音速以上", "C": "由爆燃轉為爆轟時與溫度、容積或距離等條件無關", "D": "都市瓦斯爆炸必須依賴氧氣作用再生成爆炸，因此產生爆轟的情況較少"}, "answer": "A", "explain": "爆炸依火焰傳播型態可分為爆燃與爆轟。爆轟才是超音速、爆燃為次音速，B 顛倒；爆燃轉爆轟受溫度、容積、距離影響，C 錯；都市瓦斯使用不當仍可能發生爆轟，D 錯。", "ref": "【88警技】（改編為單選，刪除原(D)OCR不全之選項）", "subject": "火災學", "src": "old"}, {"id": "F-C34-003", "topic": "爆炸", "stem": "下列何者屬於化學性爆炸(Chemical Explosion)？", "opts": {"A": "一般炸藥或代拿邁炸藥的爆炸", "B": "鋼鐵廠熱鐵與水碰觸事故", "C": "鈾235與鈽239的分裂爆炸", "D": "鍋爐過熱爆炸事故"}, "answer": "A", "explain": "炸藥爆炸是劇烈氧化分解反應，屬化學性爆炸。熱鐵遇水與鍋爐過熱屬物理性（蒸氣）爆炸，核分裂屬核子爆炸。", "ref": "【88警技】（改編為單選，刪除原(B)鑄造場管路破裂）", "subject": "火災學", "src": "old"}, {"id": "F-C34-004", "topic": "爆炸", "stem": "安全工學上阻止爆炸過程有三種方法，其中最後防止第三過程為抑制所生之熱、壓力及衝擊效果，稱為：", "opts": {"A": "預防", "B": "抑制", "C": "防護", "D": "排洩"}, "answer": "C", "explain": "阻止爆炸三步驟：預防（防止起火）、抑制（阻止成長）、防護（減輕熱、壓力及衝擊效果）。排洩不屬三步驟之一。", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-006", "topic": "爆炸", "stem": "關於爆炸性物質，下列敘述何者為非？", "opts": {"A": "爆炸性物質具有化學不穩定性，能以極快的速度發生猛烈性之化學反應", "B": "許多爆炸性之物質具毒性與吸濕性", "C": "爆炸性之物質，並不需要外界供給一定的能量才能爆炸", "D": "某些爆炸性物質與金屬反應後，會生成更易爆炸之物質"}, "answer": "C", "explain": "爆炸性物質雖不穩定，仍需外界供給熱、衝擊或摩擦等起爆能量才會爆炸，故 C 錯。其餘皆為爆炸性物質的特性。", "ref": "【87、89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-007", "topic": "爆炸", "stem": "液化瓦斯(LPG)與60～70℃之水接觸時所發生之爆炸屬？", "opts": {"A": "分解爆炸", "B": "機械爆炸", "C": "粉塵爆炸", "D": "蒸氣爆炸"}, "answer": "D", "explain": "低溫液化氣體接觸溫度較高的水，瞬間大量汽化使體積急遽膨脹，屬蒸氣爆炸（物理性），並非分解或粉塵爆炸。", "ref": "【89警技】（改編為單選，刪除原(E)化學爆炸）", "subject": "火災學", "src": "old"}, {"id": "F-C34-008", "topic": "爆炸", "stem": "呈定比率之可燃性氣體與助燃氣體在一起，遇火迅速著火爆炸，稱為：", "opts": {"A": "混合氣體爆炸", "B": "氣體分解爆炸", "C": "混合危險爆炸", "D": "化合爆炸"}, "answer": "A", "explain": "可燃性氣體與助燃氣體在爆炸範圍內混合後遇火源爆炸，即混合氣體爆炸。分解爆炸是單一氣體分解放熱，混合危險是不相容物質混合引發。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-009", "topic": "爆炸", "stem": "液體變化為氣體之速度極為快速時，因能量之放出在極短時間內，即形成之爆炸現象，稱為：", "opts": {"A": "蒸氣爆炸", "B": "分解爆炸", "C": "瓦斯爆炸", "D": "粉塵爆炸"}, "answer": "A", "explain": "液體急速相變為氣體、體積驟增而釋放能量，屬蒸氣爆炸，與化學反應無關。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-010", "topic": "爆炸", "stem": "過大電流通過時，所產生之電氣爆炸是屬於下列何者？", "opts": {"A": "固態爆炸", "B": "液態爆炸", "C": "氣態爆炸", "D": "瓦斯爆炸"}, "answer": "A", "explain": "過大電流使金屬導線急速熔融汽化而爆炸，爆炸源為固體導線，歸類為固相（固態）爆炸。", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-011", "topic": "爆炸", "stem": "炸藥在製造、加工及使用過程中，不慎引起之爆炸稱為？", "opts": {"A": "氣體分解爆炸", "B": "混合危險爆炸", "C": "混合氣體爆炸", "D": "化合物爆炸"}, "answer": "B", "explain": "依本書分類，炸藥在製造、加工、使用過程中因物質混合或操作不慎引起的爆炸歸為混合危險爆炸；其餘選項指氣體類爆炸。", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-014", "topic": "爆炸", "stem": "可燃性固體之微粒子浮游於空氣中，遇有火焰或放電火花而產生爆炸現象者，稱為：", "opts": {"A": "分解爆炸", "B": "粉塵爆炸", "C": "光氣爆炸", "D": "原子爆炸"}, "answer": "B", "explain": "可燃性固體微粒懸浮於空氣中達爆炸濃度，遇火源而爆炸，即粉塵爆炸。", "ref": "【87消佐、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-015", "topic": "爆炸", "stem": "在一大氣壓力、20℃狀態下，影響粉塵爆炸的因素不包括：", "opts": {"A": "化學組成", "B": "粒徑大小", "C": "毒性", "D": "與可燃性氣體共存"}, "answer": "C", "explain": "粉塵爆炸受化學組成、粒徑、是否與可燃性氣體共存等影響；毒性與是否爆炸無關。", "ref": "【92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-016", "topic": "爆炸", "stem": "下列何者非影響粉塵爆炸之因子？", "opts": {"A": "化學組成", "B": "粒子大小", "C": "溫度", "D": "最大發火能量"}, "answer": "D", "explain": "影響粉塵爆炸的是「最小」發火能量，不是最大發火能量；化學組成、粒徑、溫度均為影響因子。", "ref": "【92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-017", "topic": "爆炸", "stem": "粉塵爆炸與可燃性氣體相同，亦須存有「最小發火能量」始可能引起粉塵爆炸，下列有關粉塵爆炸「最小發火能量」之敘述何者為非？", "opts": {"A": "比可燃性氣體大約100～1000倍", "B": "粒子越小，最小發火能量亦越小", "C": "在空氣中的值比在氧氣中的值大", "D": "大氣中水分含量越多，最小發火能量亦變小"}, "answer": "D", "explain": "水分會吸熱並使粒子凝聚，水分越多越難點燃，最小發火能量應變大，故 D 錯。", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-018", "topic": "爆炸", "stem": "引起粉塵爆炸的最小點火能量約為：", "opts": {"A": "0.1～1.0 mJ", "B": "1.0～10 mJ", "C": "10～100 mJ", "D": "100～1000 mJ"}, "answer": "C", "explain": "粉塵最小點火能量約 10～100 mJ，約為可燃性氣體（約 0.1 mJ 等級）的 100～1000 倍。", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-020", "topic": "爆炸", "stem": "有關粉塵爆炸之敘述，下列何者錯誤？", "opts": {"A": "粉塵爆炸具有爆炸界限", "B": "粉塵之最小發火能量一般比可燃性氣體大", "C": "粒子之直徑愈小，粉塵爆炸之最小發火能量愈低", "D": "有機過氧化物之灰分含量愈高，愈易產生粉塵爆炸"}, "answer": "D", "explain": "灰分屬不燃成分，含量愈高愈難爆炸，故 D 錯。粉塵有爆炸界限、最小發火能量大於氣體、粒徑愈小愈易點燃皆正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C34-021", "topic": "爆炸", "stem": "影響粉塵爆炸的因素敘述，下列何者正確？", "opts": {"A": "粉塵爆炸與粒徑大小無關", "B": "粉塵之中，含微小粒子愈多者，爆炸可能性愈低", "C": "粉塵若與可燃性氣體在空氣中共存時（例如：煤塵中混有甲烷），其爆炸下限將上升", "D": "粉塵爆炸界限與溫度及壓力有關"}, "answer": "D", "explain": "溫度、壓力上升時粉塵爆炸界限會變寬，故 D 正確。粒徑愈小愈易爆炸；與可燃性氣體共存時爆炸下限是下降而非上升。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】（改編為單選，刪除原(A)與化學組成無關）", "subject": "火災學", "src": "old"}, {"id": "F-C34-023", "topic": "爆炸", "stem": "對於影響粉塵爆炸的因素敘述，下列何者正確？", "opts": {"A": "粉塵之化學組成與爆炸無關", "B": "處理乾燥粉塵，無須特別注意", "C": "粉塵之中，含微小粒子愈多者，爆炸可能性愈高", "D": "粉塵無所謂爆炸界限"}, "answer": "C", "explain": "粒徑愈小、比表面積愈大，愈易氧化點燃，爆炸可能性愈高。化學組成有關、乾燥粉塵更危險、粉塵也有爆炸界限。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89、91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-024", "topic": "爆炸", "stem": "下列何種金屬類粉塵物質並不會產生粉塵爆炸：", "opts": {"A": "銅", "B": "鋁", "C": "鎂", "D": "鋅"}, "answer": "A", "explain": "鋁、鎂、鋅粉均為可燃性金屬粉塵；銅不易燃燒，屬不燃性粉塵。", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-025", "topic": "爆炸", "stem": "下列粉塵何者不致引起爆炸？", "opts": {"A": "木屑", "B": "小麥粉", "C": "鋁粉", "D": "岩粉"}, "answer": "D", "explain": "岩粉為無機礦物，屬不燃性粉塵（礦坑中甚至用來抑制煤塵爆炸）；其餘皆為可燃性粉塵。", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-026", "topic": "爆炸", "stem": "下列何種金屬類粉塵物質，不會產生粉塵爆炸的危險？", "opts": {"A": "鎂", "B": "鈦", "C": "鋅", "D": "鉛"}, "answer": "D", "explain": "鎂、鈦、鋅粉皆易燃，可發生粉塵爆炸；本書將鉛列為不會產生粉塵爆炸者。", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-028", "topic": "滅火", "stem": "滅火方法約略可概分為物理方法及化學方法兩大類，下列何者屬化學法：", "opts": {"A": "冷卻法", "B": "窒息法", "C": "移除法", "D": "抑制法"}, "answer": "D", "explain": "抑制法是中斷燃燒的連鎖反應（自由基），屬化學滅火；冷卻、窒息、移除皆屬物理方法。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-029", "topic": "滅火", "stem": "比較不適用於A類火災的滅火劑？", "opts": {"A": "水", "B": "化學泡沫", "C": "二氧化碳", "D": "機械泡沫"}, "answer": "C", "explain": "A 類深層火災需冷卻浸潤，二氧化碳冷卻力小、放射後易散逸而復燃；水與泡沫含水分可冷卻。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-030", "topic": "滅火", "stem": "根據美國防火協會（NFPA）定義：石油製品、引火性液體或固體油脂等B類火災中運用何種滅火作用最為有效？", "opts": {"A": "電絕緣", "B": "冷卻", "C": "窒息", "D": "抑制連鎖反應"}, "answer": "C", "explain": "NFPA 對 B 類火災以隔絕空氣（窒息、覆蓋）為最有效的滅火作用；水冷卻易使油火擴散。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-031", "topic": "滅火", "stem": "下列何種火災以窒息作用可達最佳之滅火效果？", "opts": {"A": "普通火災", "B": "油類火災", "C": "電氣火災", "D": "金屬火災"}, "answer": "B", "explain": "油類火災以覆蓋隔絕空氣（窒息）最有效；普通火災以冷卻為主，金屬火災需專用乾粉或乾砂。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-032", "topic": "滅火", "stem": "密閉之空間若注入不燃性氣體，造成氧氣之濃度減低，進而使燃燒現象無法持續者，屬下列何種滅火法？", "opts": {"A": "冷卻法", "B": "窒息法", "C": "移除法", "D": "抑制法"}, "answer": "B", "explain": "注入不燃性氣體稀釋氧濃度，使其低於燃燒所需，屬窒息法。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-033", "topic": "滅火", "stem": "下列何種滅火劑不適用於一般A類火災？", "opts": {"A": "酸鹼劑", "B": "機械泡沫", "C": "碳酸氫鈉乾粉", "D": "水（霧狀）"}, "answer": "C", "explain": "碳酸氫鈉乾粉屬 BC 乾粉，對 A 類固體深層火災效果差、易復燃；酸鹼劑、泡沫、水霧都有冷卻作用。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92、94士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-034", "topic": "滅火", "stem": "下列何種滅火劑不適用於可燃性液體火災？", "opts": {"A": "不燃性氣體", "B": "水（柱狀）", "C": "化學泡沫", "D": "碳酸氫鉀乾粉"}, "answer": "B", "explain": "柱狀水射入油面會使油液飛濺、擴大燃燒面；其餘可窒息或抑制。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-035", "topic": "滅火", "stem": "下列何者最適用於油類火災之滅火以獲較佳之滅火效果？", "opts": {"A": "水", "B": "不導體滅火劑", "C": "泡沫", "D": "輕水"}, "answer": "C", "explain": "油類火災以泡沫覆蓋油面、隔絕空氣並冷卻最為適合。輕水（AFFF）也屬泡沫類且效能佳，本題依一般考法選泡沫，答案存疑。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-036", "topic": "滅火", "stem": "向火焰區噴射鹵化烴的滅火法主要是控制何種燃燒要素？", "opts": {"A": "氧氣", "B": "熱能", "C": "可燃物", "D": "連鎖反應"}, "answer": "D", "explain": "鹵化烴受熱分解出鹵素自由基，捕捉 H·、OH· 等活性基，中斷連鎖反應。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92、93士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-038", "topic": "滅火", "stem": "碳化鈣火災不可用何種滅火劑？", "opts": {"A": "砂", "B": "乾粉", "C": "二氧化碳", "D": "水"}, "answer": "D", "explain": "碳化鈣遇水產生乙炔並放熱，可能引燃乙炔而爆炸：CaC₂ + 2H₂O → Ca(OH)₂ + C₂H₂↑。", "ref": "【86警技】（改編為單選，刪除原(E)麵粉；原(D)選項OCR缺字依解析補為「水」）", "subject": "火災學", "src": "old"}, {"id": "F-C34-040", "topic": "滅火", "stem": "深入火場感覺現場高溫高熱難耐時，為促進所處位置的氣流流通，舒緩不佳的救災環境，下列何者方式較佳：", "opts": {"A": "強力直線水柱射水", "B": "脫去消防衣", "C": "全部撤退離開現場休息", "D": "利用水霧方式射水帶動氣流"}, "answer": "D", "explain": "水霧射水可吸熱降溫並帶動周邊空氣流動（水霧帶風）；直線水柱帶動氣流效果差，脫去消防衣則危及安全。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-043", "topic": "滅火", "stem": "二氧化碳放射時，由液化轉變為氣化，體積約膨脹為幾倍？", "opts": {"A": "250倍", "B": "350倍", "C": "450倍", "D": "500倍"}, "answer": "C", "explain": "液態二氧化碳 1 kg 氣化後在常壓下約 0.5 m³，換算體積膨脹約 400～500 倍，一般教材取約 450 倍；不同溫度下液體密度不同，數值有出入。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-044", "topic": "滅火", "stem": "下列有關二氧化碳滅火劑之敘述何者錯誤？", "opts": {"A": "滅火後可不留痕跡", "B": "稍加壓力便可液化，故可大量儲存而不占太多空間", "C": "適用於電氣設備火災", "D": "適用於金屬鈉火災"}, "answer": "D", "explain": "鈉等活性金屬可在二氧化碳中繼續燃燒（奪取其中的氧），故不適用。CO₂不導電、無殘跡、易液化儲存皆正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-045", "topic": "滅火", "stem": "海龍(Halon)1211之化學式為：", "opts": {"A": "CCl₄", "B": "CF₂ClBr", "C": "CF₂BrI", "D": "CH₂BrCl"}, "answer": "B", "explain": "海龍編號依序為 C、F、Cl、Br 的原子數：1211 表示 1 個 C、2 個 F、1 個 Cl、1 個 Br，即 CF₂ClBr。", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-046", "topic": "滅火", "stem": "海龍滅火劑CF₃Br若以數字代碼命名應為下列何者？", "opts": {"A": "1301", "B": "1211", "C": "1011", "D": "2402"}, "answer": "A", "explain": "CF₃Br：C=1、F=3、Cl=0、Br=1，故為海龍 1301。", "ref": "【88警技】（改編為單選，刪除原(E)1031）", "subject": "火災學", "src": "old"}, {"id": "F-C34-048", "topic": "滅火", "stem": "下列有關選擇海龍（Halon）替代品考量因素之敘述，何者有誤？", "opts": {"A": "滅火效能要高", "B": "破壞臭氧層指數（O.D.P.）必須越接近零越好", "C": "在大氣滯留時間（Life Time）越長越好", "D": "溫室效應值（G.W.P.）越低越好"}, "answer": "C", "explain": "替代品在大氣中滯留時間越短越好，以減少對環境的長期影響，故 C 錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-049", "topic": "滅火", "stem": "下列何種滅火劑成分被用以作為海龍滅火劑之替代品？", "opts": {"A": "CF₂BrCl", "B": "CHF₃", "C": "CF₃Br", "D": "CCl₄"}, "answer": "B", "explain": "CHF₃ 即 FE-13（HFC-23），不含溴、氯，ODP 為零；CF₂BrCl、CF₃Br 本身就是海龍，CCl₄ 已淘汰。", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-051", "topic": "滅火", "stem": "下列何種海龍替代品滅火劑其熱分解物不至於產生氟化氫（HF）？", "opts": {"A": "PFC-410（CEA-410）", "B": "FM-200", "C": "FE-13（HFC-23）", "D": "Inergen（IG-541）"}, "answer": "D", "explain": "IG-541 由氮、氬、二氧化碳組成，不含氟，不會分解產生 HF；其餘鹵烴類受熱均會分解出 HF。", "ref": "【87警技、91消佐】（改編為單選，刪除原(D)NAFS-III）", "subject": "火災學", "src": "old"}, {"id": "F-C34-052", "topic": "滅火", "stem": "下列海龍替代品滅火藥劑何者之臭氧層破壞指數(ODP)最大？", "opts": {"A": "NAFS-III", "B": "FM-200", "C": "INERGEN（IG541）", "D": "CEA-410"}, "answer": "A", "explain": "NAFS-III 含 HCFC（含氯），ODP 約 0.044；FM-200、IG541、CEA-410 的 ODP 皆為 0。", "ref": "【89警技、94士】（改編為單選，刪除原(E)FE-13）", "subject": "火災學", "src": "old"}, {"id": "F-C34-053", "topic": "滅火", "stem": "就海龍替代品FM-200以a表示，FE-13以b表示，NAFS-III以c表示，三者之溫室效應值（G.W.P.）之高低為何？", "opts": {"A": "a>b>c", "B": "b>a>c", "C": "c>a>b", "D": "a>c>b"}, "answer": "B", "explain": "FE-13（HFC-23）GWP 約一萬以上最高，FM-200 約數千次之，NAFS-III 約一千多最低，故 b>a>c。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92警技】（改編為單選，刪除原(E)b>c>a）", "subject": "火災學", "src": "old"}, {"id": "F-C34-054", "topic": "滅火", "stem": "下列那一種海龍替代品所需的滅火濃度最高？", "opts": {"A": "FM-200", "B": "FE-13", "C": "CEA-410", "D": "NAFS-III"}, "answer": "B", "explain": "FE-13 滅火效率較低，設計濃度約 16% 以上，高於 FM-200（約 7%）、CEA-410（約 6%）、NAFS-III（約 9%）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-055", "topic": "滅火", "stem": "下列那一種鹵烴海龍替代品的化學式，由4種元素所構成？", "opts": {"A": "NAFS-III", "B": "FE-13", "C": "CEA-410", "D": "FM-200"}, "answer": "A", "explain": "NAFS-III 為 HCFC 混合物，含 C、H、Cl、F 四種元素；FE-13（CHF₃）、FM-200（C₃HF₇）為三種，CEA-410（C₄F₁₀）僅兩種。", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-056", "topic": "滅火", "stem": "一般而言，下列有關鹵烴海龍替代品的敘述，何者不正確？", "opts": {"A": "為電的非導體", "B": "撲滅火勢時，比海龍1301更不易產生HF", "C": "所需的儲存空間，比海龍1301大", "D": "除HFC-23外，皆以氮氣增壓"}, "answer": "B", "explain": "鹵烴替代品滅火濃度較高、滅火時間較長，分解產生的 HF 比海龍 1301 更多，故 B 錯。其用量大所以儲存空間較大。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "書中未標出處（原(C)選項缺字，依文意補「大」）", "subject": "火災學", "src": "old"}, {"id": "F-C34-057", "topic": "滅火", "stem": "利用水作為滅火劑時，常利用水膨脹吸熱的原理進行滅火，請問水分轉變為蒸汽的膨脹比為何？", "opts": {"A": "1：500", "B": "1：1200", "C": "1：1500", "D": "1：1700"}, "answer": "D", "explain": "水在 100℃ 汽化為水蒸氣時，體積約膨脹 1700 倍，可稀釋氧氣並吸收大量熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技、88士】（改編為單選，刪除原(E)1：2000）", "subject": "火災學", "src": "old"}, {"id": "F-C34-060", "topic": "滅火", "stem": "下列何者非化學泡沫A劑之組成？", "opts": {"A": "碳酸氫鈉", "B": "碳酸鈉", "C": "甘草精", "D": "苛性鹼及蛋白質"}, "answer": "B", "explain": "化學泡沫 A 劑為碳酸氫鈉加起泡安定劑（甘草萃取物、蛋白質分解物等），不含碳酸鈉。原題「石精」疑為 OCR 錯字，依文意改為甘草精。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-064", "topic": "滅火", "stem": "在空氣泡沫之規格中，其起泡率需幾倍以上？", "opts": {"A": "3倍以上", "B": "5倍以上", "C": "7倍以上", "D": "9倍以上"}, "answer": "B", "explain": "依滅火器認可基準，機械（空氣）泡沫膨脹比需 5 倍以上；化學泡沫則需 7 倍以上，C 為誘答。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-065", "topic": "滅火", "stem": "最適合用於地下室火災的泡沫為何？", "opts": {"A": "高膨脹泡沫", "B": "空氣泡沫", "C": "界面活性劑泡沫", "D": "化學泡沫"}, "answer": "A", "explain": "地下室為封閉空間、人員難以進入，高膨脹泡沫可大量充滿整個空間，達到窒息冷卻效果。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-066", "topic": "滅火", "stem": "密閉式倉庫之火災適合以何種泡沫滅火劑滅火救災？", "opts": {"A": "空氣泡沫", "B": "界面活性劑系泡沫", "C": "高膨脹泡沫", "D": "耐酒精滅火泡沫"}, "answer": "C", "explain": "高膨脹泡沫可快速充填封閉空間，適合密閉倉庫、地下室等全區放射情境。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-067", "topic": "滅火", "stem": "甲醇儲槽之火災適合以何種泡沫滅火劑救災？", "opts": {"A": "化學泡沫", "B": "機械泡沫", "C": "界面活性劑系泡沫", "D": "耐酒精滅火泡沫"}, "answer": "D", "explain": "甲醇為水溶性（極性）液體，會吸收一般泡沫的水分使泡沫消泡，需使用耐酒精泡沫。", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-068", "topic": "滅火", "stem": "下列何者非固體滅火劑物質？", "opts": {"A": "溴氯甲烷", "B": "碳酸氫鈉", "C": "碳酸氫鉀", "D": "磷酸二氫銨"}, "answer": "A", "explain": "溴氯甲烷為鹵化烴液體滅火劑；碳酸氫鈉、碳酸氫鉀、磷酸二氫銨為乾粉（固體）滅火劑主成分。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-069", "topic": "滅火", "stem": "應用乾粉充作滅火劑在B類火災中使用，主要係利用其那一種的滅火效能：", "opts": {"A": "抑制連鎖反應", "B": "冷卻", "C": "窒息", "D": "隔離"}, "answer": "A", "explain": "乾粉在火焰中分解出的粒子可捕捉自由基，產生負催化作用中斷連鎖反應，是其撲滅油火迅速的主因。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-071", "topic": "滅火", "stem": "以氯化鈉為主要成分之Met-L-X固體滅火劑不適用於何種金屬火災？", "opts": {"A": "Li", "B": "Na", "C": "K", "D": "Mg"}, "answer": "A", "explain": "Met-L-X 可用於鈉、鉀、鎂、鈦等金屬火災，但對鋰效果不佳，故不適用 Li。", "ref": "【87警技、94消佐】（改編為單選，刪除原(E)Ti）", "subject": "火災學", "src": "old"}, {"id": "F-C34-072", "topic": "滅火", "stem": "鎂、鈾金屬之火災適合以何種乾粉滅火劑滅火救災？", "opts": {"A": "TEC滅火劑", "B": "磷酸二氫銨滅火劑", "C": "碳酸氫鈉滅火劑", "D": "碳酸氫鉀滅火劑"}, "answer": "A", "explain": "TEC（三元共晶鹽）為 D 類金屬火災專用乾粉，熔融覆蓋金屬表面隔絕空氣；其餘為 ABC 或 BC 乾粉，不適用金屬火災。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "消佐（年份OCR不清）", "subject": "火災學", "src": "old"}, {"id": "F-C34-073", "topic": "滅火", "stem": "關於空氣中氧含量與燃燒敘述，下列何者正確？", "opts": {"A": "通常空氣中氧之含量，約為其容積之15%", "B": "通常空氣中氧之含量，其濃度低於21%時，燃燒甚難持續", "C": "氫氣必須藉氧助燃，無法在氯氣中燃燒", "D": "在密閉空間中，若注入不燃性氣體，氧的濃度必然減低"}, "answer": "D", "explain": "密閉空間內注入不燃性氣體會稀釋氧氣，氧濃度必然下降。空氣含氧約 21%，低於約 15% 燃燒才難持續；氫可在氯中燃燒生成 HCl。", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C34-074", "topic": "滅火", "stem": "燃燒之際非但不能缺氧，且其濃度必須在一定比率以上；通常空氣中之氧含量，約為其容積之21%，以重量計則為23.2%，若氧濃度低於下列何者，則燃燒甚難維持？", "opts": {"A": "5%", "B": "10%", "C": "15%", "D": "以上皆是"}, "answer": "C", "explain": "一般可燃物在氧濃度低於約 15% 時燃燒難以持續，這是窒息法的依據。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C34-076", "topic": "滅火", "stem": "假設氧濃度低於14%燃燒就不可能繼續，則在密閉空間中加入不燃性氣體容積超過多少時，燃燒即因窒息告熄滅？", "opts": {"A": "0.4V", "B": "0.45V", "C": "0.5V", "D": "0.55V"}, "answer": "C", "explain": "設空間體積 V、加入不燃氣體 x：0.21V ÷ (V + x) = 0.14，解得 x = 0.5V。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92警技】（改編為單選，刪除原(E)0.6V）", "subject": "火災學", "src": "old"}, {"id": "F-C34-077", "topic": "滅火", "stem": "密閉空間中的氧低於某一濃度時，燃燒就不可能繼續，假設一般空氣氧容積佔20%，則在一密閉空間(體積為V)內加入不燃性氣體體積多少V時，此時的氧濃度為12.5%？", "opts": {"A": "0.4V", "B": "0.6V", "C": "0.825V", "D": "1.25V"}, "answer": "B", "explain": "0.20V ÷ (V + x) = 0.125，得 V + x = 1.6V，x = 0.6V。", "ref": "【94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C5-001", "topic": "危險物品", "stem": "依美國防火協會（NFPA）之規定，黃色在危險物品之表示法中代表何種危險性？", "opts": {"A": "有害健康性", "B": "化學反應性", "C": "禁水性", "D": "可燃性"}, "answer": "B", "explain": "NFPA 704 菱形標示：藍色＝健康危害、紅色＝可燃性、黃色＝反應性、白色＝特殊危險（如禁水 W、氧化 OX）。禁水性屬白色欄的特殊標記，不是黃色。", "ref": "【89警技、90消佐】第1題（改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-C5-002", "topic": "危險物品", "stem": "依據美國防火協會（NFPA）對危險物品之標示，藍色菱形內之數字代表該危險物品何種性質之等級？", "opts": {"A": "禁水性", "B": "可燃性", "C": "反應性", "D": "有害健康毒性"}, "answer": "D", "explain": "藍色欄標示健康危害（毒性）等級 0～4；可燃性為紅色、反應性為黃色，禁水性則以白色欄的 W 符號表示。", "ref": "【91消佐】第2題", "subject": "火災學", "src": "old"}, {"id": "F-C5-003", "topic": "危險物品", "stem": "美國防火協會（NFPA）危險物品標示菱形中，上方欄為「2」、左方欄為「1」、右方欄為「3」、下方欄為「OXY」，其中數字「3」欄位所表示的是下列何者？", "opts": {"A": "反應性", "B": "可燃性", "C": "有害健康之毒性", "D": "附記其他特性"}, "answer": "A", "explain": "NFPA 菱形的配置是上紅（可燃性）、左藍（健康）、右黃（反應性）、下白（特殊危險）。右方欄的 3 即反應性等級；下方 OXY 才是附記的氧化性特性。", "ref": "【90士】第3題（原題附圖，已改為文字描述）", "subject": "火災學", "src": "old"}, {"id": "F-C5-005", "topic": "危險物品", "stem": "下列何者為我國法定公共危險物品中的第一類危險物品？", "opts": {"A": "P₄S₃", "B": "CaC₂", "C": "CH₃COCH₃", "D": "NH₄ClO₃"}, "answer": "D", "explain": "NH₄ClO₃（氯酸銨）屬氯酸鹽類，是第一類氧化性固體。P₄S₃ 為第二類易燃固體，CaC₂ 為第三類禁水性物質，丙酮為第四類易燃液體。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技】第5題（改編為單選，刪原選項 HSO₃Cl）", "subject": "火災學", "src": "old"}, {"id": "F-C5-008", "topic": "危險物品", "stem": "下列關於硫酸（H₂SO₄）起火危險性之敘述，何者有誤？", "opts": {"A": "濃硫酸若浸透可燃性有機物，會發熱發火", "B": "與氯酸鹽或碳化物接觸時，可能引起發火", "C": "各種金屬與稀硫酸接觸，皆會產生氫氣", "D": "以水注入濃硫酸而欲稀釋時，將產生激烈發熱而致硫酸飛濺"}, "answer": "C", "explain": "稀硫酸只與活性大於氫的金屬（如鋅、鐵）反應放出氫氣，銅、銀、金等不會反應，所以「各種金屬皆會」是錯的。其餘三項都是濃硫酸脫水、氧化及稀釋放熱的正確描述。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】第8題", "subject": "火災學", "src": "old"}, {"id": "F-C5-009", "topic": "危險物品", "stem": "第一類公共危險物品中何者具有可燃性？", "opts": {"A": "氯酸鹽類", "B": "硝酸鹽類", "C": "過錳酸鹽類", "D": "有機過氧化物"}, "answer": "D", "explain": "氯酸鹽、硝酸鹽、過錳酸鹽都是無機氧化劑，本身不燃只助燃；有機過氧化物分子中含碳氫，本身就可燃，還兼具氧化性。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】第9題", "subject": "火災學", "src": "old"}, {"id": "F-C5-011", "topic": "危險物品", "stem": "下列有關鈉、鉀之敘述何者有誤？", "opts": {"A": "一般保存於煤油中", "B": "火災時可用二氧化碳滅火", "C": "與水反應分別產生氫氧化鈉與氫氧化鉀", "D": "鉀於空氣中燃燒時會產生淡紫色火焰"}, "answer": "B", "explain": "鈉、鉀等活性金屬會奪取 CO₂ 中的氧繼續燃燒，不可用 CO₂、水或泡沫滅火，應以乾燥砂、金屬火災用乾粉覆蓋。浸煤油保存、遇水生成氫氧化物、鉀焰呈淡紫色都正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87警技】第12題（改編為單選，刪原選項「管制量為50公斤」，現行法令鉀鈉管制量為10公斤）", "subject": "火災學", "src": "old"}, {"id": "F-C5-013", "topic": "危險物品", "stem": "下列何種禁水性物質在水中可產生乙炔（C₂H₂）？", "opts": {"A": "金屬鈉", "B": "金屬鉀", "C": "磷化鈣", "D": "碳化鈣"}, "answer": "D", "explain": "CaC₂＋2H₂O→Ca(OH)₂＋C₂H₂，碳化鈣遇水生成乙炔。鈉、鉀遇水產生氫氣，磷化鈣遇水產生磷化氫。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】第16題", "subject": "火災學", "src": "old"}, {"id": "F-C5-015", "topic": "危險物品", "stem": "下列選項皆為禁水性物質，何者與水反應所生成之可燃性氣體與其他不同？", "opts": {"A": "金屬鉀（K）", "B": "碳化鈣（CaC₂）", "C": "金屬鈣（Ca）", "D": "金屬鎂（Mg）"}, "answer": "B", "explain": "鉀、鈣、鎂這類活性金屬與水反應都放出氫氣；碳化鈣與水反應生成的是乙炔，所以與其他三者不同。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】第18題", "subject": "火災學", "src": "old"}, {"id": "F-C5-018", "topic": "危險物品", "stem": "關於第四類公共危險物品的理化性，下列敘述何者正確？", "opts": {"A": "乙醇為第四類危險物品，其引火點為53℃，且冬天時與夏天相同，亦十分容易引火", "B": "汽油之蒸氣較空氣輕，故容易揮發引起火災", "C": "當可燃性液體之溫度高於其引火點時，引火危險性會加大", "D": "第四類可燃性液體除二硫化碳外，大多比水來得重，不易浮於水面"}, "answer": "C", "explain": "液溫一旦超過引火點，液面上方就有達燃燒下限的蒸氣，遇火源即可引燃，危險性升高。乙醇引火點約13℃而非53℃；汽油蒸氣比空氣重；第四類液體多比水輕，二硫化碳才是比水重的例外。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技、88士、91士】第21題（改編為單選，刪原(E)）", "subject": "火災學", "src": "old"}, {"id": "F-C5-019", "topic": "危險物品", "stem": "下列有關第四類危險物品的敘述，何者不正確？", "opts": {"A": "石油類流動時，易產生靜電", "B": "滅火時，以窒息和遮斷空氣最有效", "C": "醇類火災時，應使用抗醇型泡沫滅火劑", "D": "具引火性，最好能儲存於著火點以下的溫度"}, "answer": "D", "explain": "第四類的危險指標是引火點，應儲存在引火點以下的溫度；著火點（發火點）比引火點高得多，只控制在著火點以下仍可能被引燃。其餘三項都正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【士】第22題（年份OCR缺漏）", "subject": "火災學", "src": "old"}, {"id": "F-C5-020", "topic": "危險物品", "stem": "第四類公共危險物品其危險性與閃火點有很密切之關係，下列物質何者之閃火點最低？", "opts": {"A": "二硫化碳", "B": "丙酮", "C": "苯", "D": "煤油"}, "answer": "A", "explain": "二硫化碳屬特殊引火物，閃火點約 -30℃；丙酮約 -20℃、苯約 -11℃，煤油則在 40℃ 以上。", "ref": "【8?警技】第23題（改編為單選，刪原選項重油；年份OCR缺漏）", "subject": "火災學", "src": "old"}, {"id": "F-C5-021", "topic": "危險物品", "stem": "難溶於水之第四類公共危險物品中，除何者以外其他皆比水輕，會浮於水上？", "opts": {"A": "乙醚", "B": "二硫化碳", "C": "輕質石油類", "D": "中質石油類"}, "answer": "B", "explain": "二硫化碳比重約 1.26，比水重，所以常在上面覆水儲存以隔絕蒸氣；乙醚與各種石油類比重都小於 1。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【9?消佐】第24題（年份OCR缺漏）", "subject": "火災學", "src": "old"}, {"id": "F-C5-022", "topic": "危險物品", "stem": "半導體業界使用之矽甲烷（SiH₄）原料，屬何類危險物品？", "opts": {"A": "第一類氧化性物質", "B": "第三類禁水性物質", "C": "第四類易燃性液體", "D": "第六類強酸性物質"}, "answer": "B", "explain": "矽甲烷接觸空氣會自燃，依本書分類歸在第三類（自燃及禁水性物質）。它不是氧化劑，常溫下是氣體不是液體，也不是酸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【17期警專】第25題", "subject": "火災學", "src": "old"}, {"id": "F-C5-023", "topic": "危險物品", "stem": "下列有關第五類危險物品的敘述，何者不正確？", "opts": {"A": "屬含氧的可燃物，易起自燃作用", "B": "大部分為無機硝化物", "C": "長期間的儲存易因氧化作用而起熱分解", "D": "因燃燒速度快，不適合以窒息方式滅火"}, "answer": "B", "explain": "第五類自反應物質多為有機硝基化合物、硝酸酯或有機過氧化物，是有機物而非無機物。它們分子內含氧，隔絕空氣無效，所以不適用窒息滅火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】第26題", "subject": "火災學", "src": "old"}, {"id": "F-C5-024", "topic": "危險物品", "stem": "以金屬、紙或布類加入火藥、炸藥，藉其燃燒或爆炸以誘發其他火藥類燃燒爆炸之物，總稱為火工品。下列何種物質並非火工品？", "opts": {"A": "電雷管", "B": "導火線", "C": "信號焰管", "D": "雷汞"}, "answer": "D", "explain": "雷汞是起爆藥（炸藥）本身，不是經過加工組裝的製品；雷管、導火線、信號焰管都是把火藥裝進外殼製成的火工品。", "ref": "【87消佐】第27題", "subject": "火災學", "src": "old"}, {"id": "F-C5-026", "topic": "危險物品", "stem": "火藥係指爆炸性反應較為遲緩之火藥類，其中無煙火藥係以下列何種成分為主體？", "opts": {"A": "硝酸鹽", "B": "硝化纖維", "C": "疊氮化鉛", "D": "雷酸鹽"}, "answer": "B", "explain": "無煙火藥以硝化纖維（硝化棉）為主體，燃燒幾乎不產生固體殘渣。硝酸鹽是黑色火藥的主成分，疊氮化鉛和雷酸鹽則是起爆藥。", "ref": "【87消佐、89消佐、89警技】第29題", "subject": "火災學", "src": "old"}, {"id": "F-C5-029", "topic": "危險物品", "stem": "變質炸藥銷毀時，每次燃燒炸藥數量最多不得超過多少公斤？", "opts": {"A": "2公斤", "B": "35公斤", "C": "45公斤", "D": "55公斤"}, "answer": "C", "explain": "依書上所引的爆炸物銷毀規定，燒燬變質炸藥每次以 45 公斤為上限，以免量大時由燃燒轉為爆轟。", "ref": "【90士】第32題", "subject": "火災學", "src": "old"}, {"id": "F-C5-030", "topic": "危險物品", "stem": "黑色火藥中之主要成分為：", "opts": {"A": "硝酸鹽", "B": "雷汞", "C": "雷酸銀", "D": "硝化棉"}, "answer": "A", "explain": "黑色火藥由硝酸鉀（硝酸鹽，約75%）、硫黃和木炭混合而成，以硝酸鹽為主。雷汞、雷酸銀是起爆藥，硝化棉是無煙火藥的原料。", "ref": "【91消佐】第33題（題幹「黑色火藥」為OCR缺字補回）", "subject": "火災學", "src": "old"}, {"id": "F-C5-031", "topic": "危險物品", "stem": "下列何者非為黑色火藥內所含之成分之一？", "opts": {"A": "硝酸鹽", "B": "硝化棉", "C": "硫黃", "D": "木炭"}, "answer": "B", "explain": "黑色火藥＝硝酸鹽＋硫黃＋木炭；硝化棉是無煙火藥的主體，不屬於黑色火藥成分。", "ref": "【94消佐】第34題", "subject": "火災學", "src": "old"}, {"id": "F-C5-032", "topic": "危險物品", "stem": "下列有關TNT的敘述，何者不正確？", "opts": {"A": "化學式為 CH₃C₆H₂(NO₂)₃", "B": "為安全起見，常加入穩定劑", "C": "易溶於水，易與金屬產生作用", "D": "用水霧滅火，禁用砂土掩蓋"}, "answer": "C", "explain": "TNT（三硝基甲苯）難溶於水，化學性質安定，不易與金屬反應，這也是它常作為軍用炸藥的原因。掩蓋會造成蓄熱、由燃燒轉為爆炸，所以要用水霧冷卻。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【87警技、91士】第35題（選項 B、C 有 OCR 缺字，依原意補回）", "subject": "火災學", "src": "old"}, {"id": "F-C5-033", "topic": "危險物品", "stem": "爆炸性物質除與酸、鹼、金屬會起化學反應之爆炸特性外，尚有何性質？", "opts": {"A": "敏感性", "B": "有毒性", "C": "吸濕性", "D": "以上皆是"}, "answer": "D", "explain": "爆炸性物質通常對撞擊、摩擦敏感，很多具有毒性（如硝化甘油、雷汞），部分會吸濕而變質或結塊，三者都屬其特性。", "ref": "【88士】第36題", "subject": "火災學", "src": "old"}, {"id": "F-C5-034", "topic": "危險物品", "stem": "下列有關第六類危險物品的敘述，何者不正確？", "opts": {"A": "屬強酸或強氧化劑", "B": "與水接觸會發熱", "C": "易燃", "D": "與有機物混合時會起氧化作用"}, "answer": "C", "explain": "第六類氧化性液體（過氯酸、過氧化氫、硝酸等）本身不燃，只會助燃；說它易燃是錯的。", "ref": "【9?士】第37題（年份OCR缺漏）", "subject": "火災學", "src": "old"}, {"id": "F-C5-035", "topic": "危險物品", "stem": "下列何種分解爆炸的氣體於發生爆炸後將釋出一氧化碳？", "opts": {"A": "疊氮化鉛", "B": "丙烯", "C": "乙烯", "D": "環氧乙烷"}, "answer": "D", "explain": "環氧乙烷（C₂H₄O）分子內含氧，分解產生 CH₄＋CO 等產物。疊氮化鉛分解生成 Pb 與 N₂，丙烯、乙烯分解生成碳、甲烷與氫，都不含氧。", "ref": "【89警技】第38題（改編為單選，刪原選項聯氨）", "subject": "火災學", "src": "old"}, {"id": "F-C5-036", "topic": "危險物品", "stem": "下列何種可燃物發生爆炸時，不至於產生分解爆炸？", "opts": {"A": "氧化氮", "B": "環氧乙烷", "C": "聯氨", "D": "甲烷"}, "answer": "D", "explain": "甲烷結構穩定，只會與空氣混合後燃燒爆炸，不會自行分解爆炸；氧化氮、環氧乙烷、聯氨都是典型的分解爆炸性氣體。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87警技】第39題（改編為單選，刪原選項乙烯）", "subject": "火災學", "src": "old"}, {"id": "F-C5-037", "topic": "危險物品", "stem": "下列選項所列之化學工業經常處理的化合物中，何者不具有發生分解爆炸之可能性？", "opts": {"A": "甲烷", "B": "乙炔", "C": "環氧乙烷", "D": "聯氨"}, "answer": "A", "explain": "乙炔、環氧乙烷、聯氨都是吸熱或不穩定化合物，不需要氧也能分解爆炸；甲烷只有與空氣混合才會燃燒爆炸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、94消佐】第40題", "subject": "火災學", "src": "old"}, {"id": "F-C5-038", "topic": "危險物品", "stem": "關於混合危險，下列敘述何者正確？", "opts": {"A": "濃過氧化氫溶液與金屬氧化物混合不會產生發火或爆炸危險", "B": "氧化性鹽類與強酸混合易生不安定之游離酸，若再與還原性物質接觸，易生發火危險", "C": "碳化鈣與水接觸，會生成熱量與火花", "D": "鋁粉與氧化鐵混合易生成爆炸性物質"}, "answer": "B", "explain": "氯酸鹽等氧化性鹽類遇強酸會游離出氯酸這類極不安定的酸，氧化力更強，再碰到還原性物質就容易發火。濃過氧化氫遇金屬氧化物會催化分解，有危險；碳化鈣遇水產生的是乙炔與熱，不會產生火花；鋁粉與氧化鐵是鋁熱劑，點燃後放出高熱，並非生成爆炸性物質。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【88警技、88士】第41題（改編為單選，刪原(E)）", "subject": "火災學", "src": "old"}, {"id": "F-C5-040", "topic": "危險物品", "stem": "下述何者不具有混合發火之危險性？", "opts": {"A": "漂白粉與乙炔", "B": "鹵素與氨氣", "C": "過氧化物與硫黃", "D": "金屬鈉與煤油"}, "answer": "D", "explain": "金屬鈉本來就浸在煤油中隔絕空氣和水分保存，兩者不會反應；其餘三組都是氧化劑與可燃物（或會生成爆炸性化合物）的組合。", "ref": "【89警技】第43題（改編為單選，刪原選項無水鉻酸與醋酸）", "subject": "火災學", "src": "old"}, {"id": "F-C5-043", "topic": "危險物品", "stem": "下列何者係乙炔分解之反應式？", "opts": {"A": "C₂H₂ → 2C ＋ H₂ ＋ 54.2 kcal/mol", "B": "C₂H₄ → C ＋ CH₄ ＋ 30.4 kcal/mol", "C": "C₂H₄O → CH₄ ＋ CO ＋ 32.1 kcal/mol", "D": "H₂S ＋ Cl₂ → 2HCl ＋ S"}, "answer": "A", "explain": "乙炔（C₂H₂）分解成碳與氫並放出大量熱。B 是乙烯分解，C 是環氧乙烷分解，D 是硫化氫被氯氧化，都不是乙炔。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】第46題（選項 C 依OCR推定為環氧乙烷）", "subject": "火災學", "src": "old"}, {"id": "F-C5-044", "topic": "危險物品", "stem": "關於乙炔的性質及火災危險性，下列何者不正確？", "opts": {"A": "由電石加水所生成", "B": "無色、比空氣輕、易燃", "C": "爆炸界限為20%～60%", "D": "加壓時易起分解爆炸"}, "answer": "C", "explain": "乙炔的爆炸範圍約 2.5%～81%，是常見氣體中最寬的之一，不是 20%～60%。它由電石（碳化鈣）加水製得，分子量 26 比空氣輕，加壓時容易分解爆炸。", "ref": "【88警技】第47題（改編為單選，刪原(E)）", "subject": "火災學", "src": "old"}, {"id": "F-C5-045", "topic": "危險物品", "stem": "乙炔是一易分解爆炸之物質，下列敘述何者正確？", "opts": {"A": "化學式為 C₂H₄", "B": "處理高壓乙炔時，稀釋之氣體限用氮氣", "C": "高壓下，即不易生重合反應", "D": "工廠中使用之乙炔鋼瓶，常利用浸泡在丙酮之多孔質，使之溶解以防止其爆炸"}, "answer": "D", "explain": "溶解乙炔鋼瓶內填多孔物質並注入丙酮，讓乙炔溶解在丙酮中，以降低分解爆炸的危險。乙炔化學式是 C₂H₂；稀釋氣體不限氮氣（也可用 CO₂、甲烷等）；高壓下反而容易重合。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】第48題（選項A化學式OCR殘缺，依同系列題補為C₂H₄）", "subject": "火災學", "src": "old"}, {"id": "F-C5-047", "topic": "危險物品", "stem": "加壓下列何者氣體，會發生聚（重）合反應而有爆炸的危險？", "opts": {"A": "氫氣", "B": "液化石油氣（LPG）", "C": "甲烷", "D": "乙炔"}, "answer": "D", "explain": "乙炔含碳碳三鍵，加壓時容易重合並放出熱量，可能引發爆炸；氫氣、LPG、甲烷沒有這種重合性質。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第50題（選項A OCR缺字，暫補為氫氣）", "subject": "火災學", "src": "old"}, {"id": "F-C5-048", "topic": "危險物品", "stem": "物質之危險程度可以燃燒範圍之大小作為判斷之條件之一，下列物質何者之燃燒範圍最廣？", "opts": {"A": "酒精", "B": "乙炔", "C": "甲烷", "D": "丙烷"}, "answer": "B", "explain": "乙炔燃燒範圍約 2.5%～81%；酒精約 3.3%～19%、甲烷 5%～15%、丙烷 2.1%～9.5%，所以乙炔最廣。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【59期專修】第51題（改編為單選，刪原選項一氧化碳）", "subject": "火災學", "src": "old"}, {"id": "F-C5-049", "topic": "危險物品", "stem": "下述關於乙炔之性質何者錯誤？", "opts": {"A": "分子式為 C₂H₂", "B": "可利用不活性氣體稀釋防止其發生爆炸", "C": "高壓下易生重合反應", "D": "不可與鐵、鈷、鎳等金屬接觸，銅、銀等金屬則可"}, "answer": "D", "explain": "乙炔會與銅、銀、汞生成對撞擊敏感的乙炔化物，所以銅、銀等金屬正是要避免接觸的。其餘三項都正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】第52題", "subject": "火災學", "src": "old"}, {"id": "F-C5-051", "topic": "危險物品", "stem": "下列有關丙酮之敘述何者有誤？", "opts": {"A": "閃火點為零下20度左右", "B": "為無色液體", "C": "可與乙醚及酒精等任意混合", "D": "可用普通泡沫滅火"}, "answer": "D", "explain": "丙酮是水溶性溶劑，會破壞普通泡沫的泡膜，要用抗醇型泡沫。閃火點約 -20℃、無色、能與醚、醇任意互溶都正確。", "ref": "【89警技】第54題（改編為單選，刪原選項「化學式為CH₃COCH₃」）", "subject": "火災學", "src": "old"}, {"id": "F-C5-053", "topic": "危險物品", "stem": "下列何者為我國法定公共危險物品中的第五類危險物品？", "opts": {"A": "氯酸銨", "B": "黃磷", "C": "硝化甘油", "D": "鎂粉"}, "answer": "C", "explain": "硝化甘油屬硝酸酯類，是第五類自反應物質。氯酸銨為第一類，黃磷為第三類自燃物質，鎂粉為第二類易燃固體。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】第56題", "subject": "火災學", "src": "old"}, {"id": "F-C5-054", "topic": "危險物品", "stem": "以硝化甘油為主體之爆炸物，下列敘述何者不正確？", "opts": {"A": "一般將其製成固體", "B": "8℃以下即行凍結，在凍結進行中或溶解前後，不易爆炸", "C": "放置久者，有自然發火的可能性", "D": "是膠質炸藥的原料之一"}, "answer": "B", "explain": "硝化甘油在凍結過程中或半融解狀態下對衝擊特別敏感，極易爆炸，所以說不易爆炸是錯的。一般製成矽藻土或膠質炸藥等固體使用，久置分解也可能自燃。", "ref": "【89消佐】第57題", "subject": "火災學", "src": "old"}, {"id": "F-C5-055", "topic": "危險物品", "stem": "硝化甘油儲存溫度不得低於多少℃，以防凝固後再熔化時發生爆炸？", "opts": {"A": "45℃", "B": "35℃", "C": "25℃", "D": "15℃"}, "answer": "D", "explain": "硝化甘油約在 13℃ 附近凝固，所以儲存溫度要維持在 15℃ 以上，避免反覆凍結再熔化時變得敏感而爆炸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】第58題", "subject": "火災學", "src": "old"}, {"id": "F-C5-056", "topic": "危險物品", "stem": "下列有關硝化甘油的敘述，何者正確？", "opts": {"A": "可用水霧滅火", "B": "點火時形成淡黃色火焰", "C": "凍結時，對機械的作用亦敏感", "D": "即使少量也容易發生爆炸"}, "answer": "B", "explain": "少量硝化甘油點火時只會以黃色火焰燃燒，大量或受衝擊時才會爆轟，因此 D 不正確。完全凍結時敏感度反而降低；火災時爆炸危險高，一般不以水霧撲救而是撤離。本題正解有爭議。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【91士】第59題", "subject": "火災學", "src": "old"}, {"id": "F-C5-060", "topic": "危險物品", "stem": "下列之可燃性氣體的蒸氣比重何者最小？", "opts": {"A": "氨氣", "B": "一氧化碳", "C": "乙炔", "D": "乙烷"}, "answer": "A", "explain": "蒸氣比重≈分子量÷29：氨 17（約0.59）、乙炔 26（0.90）、一氧化碳 28（0.97）、乙烷 30（1.04），氨最小。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】第63題", "subject": "火災學", "src": "old"}, {"id": "F-C5-062", "topic": "危險物品", "stem": "關於LPG（液化石油氣）與LNG（液化天然氣）之性質，下列何者為非？", "opts": {"A": "LPG之主成分為C₃H₈、C₃H₆、C₄H₁₀、C₄H₈等氣體混合，LNG之主成分則為CH₄氣體", "B": "LPG與LNG均為無色、無臭之可燃性氣體", "C": "LPG氣態時較空氣重，而LNG氣態時則較空氣輕", "D": "LPG多以壓縮氣體狀態搬運，而LNG多以液化氣體狀態搬運"}, "answer": "D", "explain": "LPG 常溫下稍加壓就能液化，所以是以液化狀態儲運（桶裝 ct": "火災學", "src": "old"}, {"id": "F-C5-070", "topic": "危險物品", "stem": "下列何種氣體之比重較空氣輕？", "opts": {"A": "液化瓦斯", "B": "甲烷", "C": "丙烷", "D": "丁烷"}, "answer": "B", "explain": "甲烷分子量 16，比重約 0.55，比空氣輕；液化瓦斯（丙烷、丁烷）的氣體都比空氣重。", "ref": "【86警技】第73題（改編為單選，刪原選項氧氣）", "subject": "火災學", "src": "old"}, {"id": "F-C5-071", "topic": "危險物品", "stem": "下列關於液化瓦斯（液化石油氣）之性質與事故發生之處置原則何者錯誤？", "opts": {"A": "洩漏時應立即關閉開關", "B": "因較空氣輕，容易漂浮於空中", "C": "以大量水加以冷卻", "D": "滅火後以濕毛巾纏繞洩漏口並移至空曠處"}, "answer": "B", "explain": "LPG 氣體約為空氣的 1.5～2 倍重，洩漏後會沉積在地面與低窪處，不會往上飄。其餘三項都是正確的處置方式。", "ref": "【91消佐】第74題", "subject": "火災學", "src": "old"}, {"id": "F-C67-001", "topic": "防火與特殊現象", "stem": "下列何者非高樓結構耐火設計上考慮之項目？", "opts": {"A": "內部之可燃物量", "B": "火災之燃燒時間", "C": "內部裝修之防焰規制", "D": "長期荷重之應力及安全率"}, "answer": "C", "explain": "結構耐火設計關心火災荷重（可燃物量）、燃燒持續時間與構材在荷重下的應力及安全率。防焰規制是針對窗簾、地毯等物品的防焰性能，屬於防止起火與延燒的對策，不是結構耐火設計項目。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】第六章選擇題第1題", "subject": "火災學", "src": "old"}, {"id": "F-C67-002", "topic": "防火與特殊現象", "stem": "下列何項物品不在消防法防焰規制之規定項目內？", "opts": {"A": "窗簾", "B": "防火門窗", "C": "展示用廣告看板", "D": "地毯"}, "answer": "B", "explain": "消防法規定應使用防焰物品者為地毯、窗簾、布幕、展示用廣告板等易燃裝飾品。防火門窗屬建築構造的防火設備，依建築法規管理，不屬防焰物品。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】第六章選擇題第2題", "subject": "火災學", "src": "old"}, {"id": "F-C67-003", "topic": "防火與特殊現象", "stem": "消防法所規範的防焰規制中，需有防焰標示的防焰物品不包括？", "opts": {"A": "門", "B": "地毯", "C": "窗簾", "D": "布幕"}, "answer": "A", "explain": "須附防焰標示的防焰物品為地毯、窗簾、布幕、展示用廣告板等纖維或薄片類裝飾物。門為建築構件，不在防焰物品之列。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第六章選擇題第3題", "subject": "火災學", "src": "old"}, {"id": "F-C67-005", "topic": "防火與特殊現象", "stem": "建築物防火區劃中之垂直區劃，主要係用以防止火災中的下列何種現象？", "opts": {"A": "上下蔓延", "B": "橫向擴散", "C": "全面轟燃", "D": "爆炸"}, "answer": "A", "explain": "垂直區劃是以樓地板、管道間及樓梯間的防火構造把各樓層上下隔開，目的在阻止火煙沿垂直方向往上層蔓延。防止橫向擴散靠的是水平（面積）區劃。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】第六章選擇題第5題", "subject": "火災學", "src": "old"}, {"id": "F-C67-006", "topic": "防火與特殊現象", "stem": "依我國建築技術規則之規定，十六層樓建築物之地面第一層，下列何種防火區劃構件具最短之防火時效？", "opts": {"A": "承重牆", "B": "分間牆", "C": "樑", "D": "柱"}, "answer": "B", "explain": "十六層樓建築物的一樓，自頂層起算屬第十五層以上，依建築技術規則第70條：柱與樑3小時，承重牆2小時，而分間牆只要求1小時，所以分間牆最短。", "ref": "【89警技】第六章選擇題第6題（改編為單選，刪除原選項(E)樓地板）", "subject": "火災學", "src": "old"}, {"id": "F-C67-007", "topic": "防火與特殊現象", "stem": "建築技術規則設計施工編規定，目前自頂層起算第15層以上各樓層「垂直區劃」中之「承重牆」，其防火時效為幾小時？", "opts": {"A": "2小時", "B": "1.5小時", "C": "1.0小時", "D": "0.5小時"}, "answer": "A", "explain": "依建築技術規則第70條，自頂層起算第十五層以上的樓層，承重牆防火時效要求2小時（柱與樑則為3小時）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】第六章選擇題第7題", "subject": "火災學", "src": "old"}, {"id": "F-C67-008", "topic": "防火與特殊現象", "stem": "在防火區劃中，自頂層起算不超過四層之各樓層樑構件的防火時效，建築技術規則建築設計施工編中之要求為何？", "opts": {"A": "1小時以上", "B": "2小時以上", "C": "3小時以上", "D": "4小時以上"}, "answer": "A", "explain": "依建築技術規則第70條，自頂層起算不超過四層的樓層，柱、樑、承重牆與樓地板的防火時效均為1小時以上；樓層越往下要求越高（2小時、3小時）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】第六章選擇題第8題", "subject": "火災學", "src": "old"}, {"id": "F-C67-009", "topic": "防火與特殊現象", "stem": "在建築技術規則建築設計施工編中所稱室內裝修材料為「耐火板」者，其係通過中國國家標準CNS 6532何種耐燃等級之測試？", "opts": {"A": "一級", "B": "二級", "C": "三級", "D": "級外"}, "answer": "B", "explain": "CNS 6532耐燃試驗中，耐燃一級為不燃材料，耐燃二級為耐火板，耐燃三級為耐燃材料。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】第六章選擇題第9題", "subject": "火災學", "src": "old"}, {"id": "F-C67-010", "topic": "防火與特殊現象", "stem": "為提昇高樓防火安全，高樓防火區劃設計中應作垂直空間區劃的場所為何？", "opts": {"A": "大面積賣場", "B": "樓梯間", "C": "防火牆", "D": "以上皆非"}, "answer": "B", "explain": "樓梯間、電梯道、管道間等貫穿樓層的空間，會像煙囪一樣讓火煙往上竄，必須做垂直區劃。大面積賣場要做的是面積區劃；防火牆本身是區劃構件，不是被區劃的場所。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第六章選擇題第10題", "subject": "火災學", "src": "old"}, {"id": "F-C67-012", "topic": "煙與熱流", "stem": "在捷運車站或機場航站等處可見防煙垂壁的設計，防煙垂壁的功能主要是？", "opts": {"A": "火災時控制煙流動的速度", "B": "火災時具排煙功能", "C": "增加探測器的靈敏度", "D": "具標示功能"}, "answer": "A", "explain": "防煙垂壁是從天花板往下突出的不燃隔板，把天花板下方的煙層擋住，延緩煙的水平擴散，爭取避難與排煙時間。它本身沒有排煙能力，排煙要靠排煙設備。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第六章選擇題第12題", "subject": "火災學", "src": "old"}, {"id": "F-C67-013", "topic": "煙與熱流", "stem": "防焰制度之實施係採取下列何種防煙之對策？", "opts": {"A": "抑制煙的發生源", "B": "加速煙的流動", "C": "阻止煙的流動", "D": "積極向外排煙"}, "answer": "A", "explain": "防焰物品不易著火、延燒慢，使煙從一開始就少產生，屬於從發生源抑制煙的對策。防火閘門、防煙垂壁屬阻止煙流動，排煙設備屬積極向外排煙。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、91消佐】第六章選擇題第13題", "subject": "火災學", "src": "old"}, {"id": "F-C67-014", "topic": "防火與特殊現象", "stem": "假設在一場火災中有實際總逃生人數100人，其中正常人占65%，小孩及殘障者占15%，老人占20%，若已知正常人之行動係數為1，小孩及殘障者的行動係數為0.75，老人的行動係數為0.5，則依學者Marchant的研究可知，本場火災中進行逃生避難的「有效人數」為何？", "opts": {"A": "100人", "B": "125人", "C": "140人", "D": "155人"}, "answer": "B", "explain": "有效人數＝各類人數÷行動係數之總和＝65/1＋15/0.75＋20/0.5＝65＋20＋40＝125人。行動較慢者會被換算成較多的等效人數。", "ref": "【88警技】第六章選擇題第14題（改編為單選，刪除原選項(E)170人）", "subject": "火災學", "src": "old"}, {"id": "F-C67-015", "topic": "防火與特殊現象", "stem": "有關火災中人類逃生避難的行為特性分析，下列敘述何者正確？", "opts": {"A": "火災中人類心理緊張狀況與其所處環境的可能危險情境成反比關係", "B": "經歷逃生困難的人，其緊張程度將更為嚴重，但與時間無關", "C": "當人們遇到意外災害時，往往有返回原來途徑的本能，此種特性稱為歸巢性", "D": "逃生者常會往較不明亮的地方逃生，以遠離火勢，也就是有背光的特性"}, "answer": "C", "explain": "沿著進來的原路逃出去的本能稱為歸巢性。緊張程度隨危險升高而升高（成正比），也會隨時間拉長而加劇；人在火場傾向往明亮處跑，是向光性，不是背光。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技、88士】第六章選擇題第15題（改編為單選，刪除原選項(C)「緊張程度與人群壅塞程度無關」）", "subject": "火災學", "src": "old"}, {"id": "F-C67-016", "topic": "防火與特殊現象", "stem": "火災中居民進行逃生避難的行動時，經常會往明亮的地方逃生，並且希望遠離火災中的黑暗狀態，此一特性稱之為？", "opts": {"A": "習慣性", "B": "歸巢性", "C": "向光性", "D": "潛力性"}, "answer": "C", "explain": "往亮處移動、避開黑暗的傾向稱為向光性，所以避難方向的照明與出口標示很重要。歸巢性是走原路，習慣性是走平常慣用的路線。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第六章選擇題第16題", "subject": "火災學", "src": "old"}, {"id": "F-C67-017", "topic": "防火與特殊現象", "stem": "根據日本學者藤本盛久等人之研究，火災時避難多往經常使用之出入口或樓梯逃生，此為何種人類避難行為之特性？", "opts": {"A": "向光性", "B": "歸巢性", "C": "習慣性", "D": "開闊性"}, "answer": "C", "explain": "平時慣用的出入口與樓梯，在緊急時最先被想到，這種依日常動線逃生的傾向稱為習慣性。歸巢性強調沿進入時的原路返回，向光性強調往亮處移動。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【91消佐】第六章選擇題第17題", "subject": "火災學", "src": "old"}, {"id": "F-C67-018", "topic": "煙與熱流", "stem": "下列火場濃煙所含之氣體，何者會對身體之表面與氣道之內面造成傷害，急性中毒者常造成氣管、支氣管壞死、浮腫或肺血管之損傷？", "opts": {"A": "一氧化碳（CO）", "B": "氰酸（HCN）", "C": "氯化氫（HCl）", "D": "二氧化碳（CO₂）"}, "answer": "C", "explain": "氯化氫遇水成鹽酸，具強烈刺激與腐蝕性，會直接傷害皮膚、眼睛與呼吸道黏膜，造成氣管壞死與肺水腫。CO與HCN是造成體內缺氧的窒息性氣體，CO₂主要是高濃度時的窒息作用。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】第七章選擇題第1題", "subject": "火災學", "src": "old"}, {"id": "F-C67-019", "topic": "煙與熱流", "stem": "火場中吸入一定量的何種氣體，會刺激黏膜及麻醉中樞神經系統，出現氣管炎、肺炎或導致肺水腫的症狀？", "opts": {"A": "甲醛", "B": "一氧化碳", "C": "二氧化碳", "D": "氯化氫"}, "answer": "A", "explain": "甲醛（HCHO）兼具刺激黏膜與麻醉中樞神經的作用，大量吸入會引起氣管炎、肺炎及肺水腫。氯化氫雖有刺激性，但沒有麻醉中樞的作用；CO屬血液毒。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90、92消佐、93警技】第七章選擇題第2題（原選項(C)OCR殘缺，依文意補為二氧化碳）", "subject": "火災學", "src": "old"}, {"id": "F-C67-020", "topic": "煙與熱流", "stem": "下列何種煙中所含之有毒氣體，會妨礙細胞中氧化酵素之活性，造成細胞呼吸之停止？", "opts": {"A": "HCl", "B": "CO", "C": "HCN", "D": "HCHO"}, "answer": "C", "explain": "HCN會與細胞色素氧化酶結合，使細胞無法利用氧氣，造成細胞層級的呼吸停止。CO是與血紅素結合阻礙運氧，HCl、HCHO則以刺激作用為主。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、94消佐、89警技、89士】第七章選擇題第3題", "subject": "火災學", "src": "old"}, {"id": "F-C67-021", "topic": "煙與熱流", "stem": "火災生成煙中，HCN成份對於人體的傷害屬於下列何種毒性？", "opts": {"A": "血液毒", "B": "抑制人體新陳代謝", "C": "呼吸毒", "D": "刺激性"}, "answer": "C", "explain": "HCN抑制細胞內的呼吸酵素，使組織無法利用氧，火災學一般將其歸為呼吸毒（細胞窒息）。血液毒指的是CO與血紅素結合；刺激性指HCl、HCHO等。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【88警技】第七章選擇題第4題（改編為單選，刪除原選項(E)使蛋白質沉澱）", "subject": "火災學", "src": "old"}, {"id": "F-C67-022", "topic": "煙與熱流", "stem": "在正常呼吸的情況下，空氣中一氧化碳的濃度達到多少以上時，可在一分鐘內致人於死？", "opts": {"A": "0.07%", "B": "0.2%", "C": "0.5%", "D": "1%"}, "answer": "D", "explain": "CO濃度越高致死越快：約0.2%時1小時左右危及生命，0.5%約20～30分鐘，達1%以上則1～2分鐘內即可致死。", "ref": "【90警技、90士、94士】第七章選擇題第5題（改編為單選，刪除原選項(A)0.05%）", "subject": "火災學", "src": "old"}, {"id": "F-C67-023", "topic": "煙與熱流", "stem": "能與血液中之血色素結合，阻礙紅血球輸氧之功能，造成人員窒息死亡，係指下列何種物質？", "opts": {"A": "NO", "B": "HCl", "C": "HCN", "D": "CO"}, "answer": "D", "explain": "CO與血紅素的親和力約為氧的200倍以上，形成碳氧血紅素後紅血球無法運氧，造成組織缺氧。HCN是阻斷細胞利用氧，HCl是刺激腐蝕作用。", "ref": "【87消佐、87警技、89士、89消佐、92士】第七章選擇題第6題", "subject": "火災學", "src": "old"}, {"id": "F-C67-024", "topic": "煙與熱流", "stem": "下列何者不屬於火災氣體（fire gas）對人體的危害效果？", "opts": {"A": "HNO₃之腐蝕作用", "B": "HCHO之刺激作用", "C": "CO之毒氣作用", "D": "Cl₂之毒氣作用"}, "answer": "A", "explain": "火災氣體中常見的危害包括CO、HCN的毒性、HCHO的刺激與Cl₂、HCl的毒性或腐蝕性。HNO₃（硝酸）是液態強酸，不是火災燃燒時生成的氣體，因此不列入火災氣體的危害效果。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【88警技】第七章選擇題第7題（改編為單選，刪除原選項(E)HCl之腐蝕作用）", "subject": "火災學", "src": "old"}, {"id": "F-C67-026", "topic": "火災", "stem": "火傷後立即或一日後出現水泡，淺者二週程度即可痊癒，深者可能殘留瘢狀傷痕，此為第幾級程度之火傷？", "opts": {"A": "第一級", "B": "第二級", "C": "第三級", "D": "第四級"}, "answer": "B", "explain": "出現水泡是第二級火傷（部分皮層）的特徵，淺層可在約兩週內癒合，深層可能留疤。第一級只有紅斑疼痛，第三級為皮膚全層壞死。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、91消佐、94士】第七章選擇題第9題", "subject": "火災學", "src": "old"}, {"id": "F-C67-027", "topic": "火災", "stem": "皮膚受熱後導致全層壞死、潰瘍化，此火傷程度為幾級火傷？", "opts": {"A": "一級", "B": "二級", "C": "三級", "D": "四級"}, "answer": "C", "explain": "依四級分類：一級紅斑、二級水泡、三級皮膚全層壞死並潰瘍化、四級則已炭化。全層壞死潰瘍屬第三級。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89警技】第七章選擇題第10題（改編為單選，刪除原選項(E)五級）", "subject": "火災學", "src": "old"}, {"id": "F-C67-028", "topic": "火災", "stem": "在無風、濕度低之130°C高溫下，人約可忍耐多少時間？", "opts": {"A": "數小時", "B": "1小時", "C": "15分鐘", "D": "5分鐘"}, "answer": "C", "explain": "在乾燥、無風的環境下，人體靠出汗蒸發散熱，約65°C可忍受數小時，溫度升到130°C時只能忍耐約15分鐘；溫度更高或濕度大時耐受時間會急速縮短。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90士】第七章選擇題第11題", "subject": "火災學", "src": "old"}, {"id": "F-C67-029", "topic": "火災", "stem": "依據實驗，穿著普通作業服時，其受熱之界限值約為多少？", "opts": {"A": "2400 kcal/m²·h", "B": "1800 kcal/m²·h", "C": "1200 kcal/m²·h", "D": "800 kcal/m²·h"}, "answer": "A", "explain": "實驗顯示穿普通作業服時，人體能承受的輻射受熱界限約為2400 kcal/m²·h，超過就會有灼痛與燒傷危險；未穿衣物的裸露皮膚界限更低。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90士】第七章選擇題第12題", "subject": "火災學", "src": "old"}, {"id": "F-C67-032", "topic": "煙與熱流", "stem": "關於火場濃煙之敘述，下列何者為非？", "opts": {"A": "火場人員死因多與濃煙有關，真正遭受火傷者反而較少", "B": "近年建築物裝潢材料多轉化為高分子物質，致使火場濃煙大量產生", "C": "火場濃煙之粒子密度大，故多沉於空氣底層", "D": "玻璃帷幕式大樓外觀好看，但並不有利於火場排煙"}, "answer": "C", "explain": "火場濃煙是被熱氣流帶著上升的微粒，會先積聚在天花板下方再向下擴展，並不是沉在底層，所以逃生時要壓低身體。其餘敘述皆正確：多數死者死於煙，高分子材料發煙量大，帷幕牆大樓難以開窗排煙。", "ref": "【87消佐】第七章選擇題第15題", "subject": "火災學", "src": "old"}, {"id": "F-C67-033", "topic": "煙與熱流", "stem": "下列何項措施，非屬實施防煙對策之範疇？", "opts": {"A": "設置防火閘門", "B": "設置排煙設備", "C": "防焰規制", "D": "防火管理"}, "answer": "D", "explain": "防火閘門阻止煙流動、排煙設備將煙排出、防焰規制從源頭減少發煙，三者都是防煙對策的硬體或制度。防火管理是涵蓋用火管理、訓練、編組等的整體管理制度，不屬於防煙對策本身。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【87消佐】第七章選擇題第16題", "subject": "火災學", "src": "old"}, {"id": "F-C67-034", "topic": "煙與熱流", "stem": "建築物火災中，導致煙霧蔓延的因素，不包括？", "opts": {"A": "火源種類", "B": "煙囪效應", "C": "空調系統管道間", "D": "空氣膨脹"}, "answer": "A", "explain": "煙在建築物內蔓延的驅動力包括煙囪效應、熱膨脹、浮力、風力與空調系統。火源種類影響發煙量與煙的成分，但不是推動煙在建築內移動的因素。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】第七章選擇題第17題", "subject": "火災學", "src": "old"}, {"id": "F-C67-036", "topic": "煙與熱流", "stem": "在防煙對策中，何者屬於積極向外排煙方法？", "opts": {"A": "內部裝潢材料限制", "B": "採用防火閘門", "C": "防焰制度建立", "D": "排煙室排煙法"}, "answer": "D", "explain": "排煙室（特別安全梯前室）配置排煙設備把煙排出室外，屬於積極排煙。裝潢材料限制與防焰制度是抑制發煙源，防火閘門是阻止煙流動。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐、9X士（年份OCR缺字）】第七章選擇題第19題", "subject": "火災學", "src": "old"}, {"id": "F-C67-037", "topic": "煙與熱流", "stem": "火場之煙若有通過大樓內部空調管道時，應設置何種設備阻絕煙之流動？", "opts": {"A": "防火鐵捲門", "B": "防火閘門", "C": "防火隔板", "D": "自動除煙設備"}, "answer": "B", "explain": "風管貫穿防火區劃處應設防火閘門（防火風門），遇熱或偵煙時自動關閉，阻止火煙沿管道擴散。防火鐵捲門用於開口部，不能裝在風管內。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐、89士】第七章選擇題第20題", "subject": "火災學", "src": "old"}, {"id": "F-C67-038", "topic": "煙與熱流", "stem": "火災中煙霧濃度的計算，根據Lambert吸收法則，光學密度（Optical Density，ODₓ）定義為何？其中I₀、Iₓ分別為入射光強度及經過某一距離後之受光強度。", "opts": {"A": "ODₓ＝log₁₀(I₀/Iₓ − 2)", "B": "ODₓ＝log₁₀(2 − I₀/Iₓ)", "C": "ODₓ＝log₁₀(I₀/Iₓ)", "D": "ODₓ＝log₁₀(100 + I₀/Iₓ)"}, "answer": "C", "explain": "光學密度是入射光與透過光強度比值取常用對數，ODₓ＝log₁₀(I₀/Iₓ)；煙越濃，Iₓ越小，OD越大。其他選項在比值中加減常數，不符定義。", "ref": "【92消佐】第七章選擇題第21題", "subject": "火災學", "src": "old"}, {"id": "F-C67-039", "topic": "煙與熱流", "stem": "煙霧濃度計算中，遮光率（Light Obscuration，Sₓ）的定義為Sₓ＝100(1 − Iₓ/I₀)，其中I₀、Iₓ分別為入射光及受光強度，根據Lambert吸收法則，光學密度（Optical Density，ODₓ）定義為OD
