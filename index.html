 "司法警察官至某餐廳欲逮捕毒品通緝犯甲，在該餐廳六樓包廂逮捕毒品通緝犯甲，警察立刻實施附帶搜索，本案中何種搜索係屬違法？", "opts": {"A": "搜索甲掛在其座椅的西裝外套", "B": "搜索甲褲子內的口袋", "C": "搜索甲停放在餐廳停車場的轎車", "D": "搜索甲放置在桌上的手提包"}, "answer": "C", "explain": "依§130，逮捕時的附帶搜索範圍限於被告的身體、隨身攜帶之物件、所使用之交通工具及其立即可觸及之處所。掛在座椅上的外套、褲子口袋、桌上的手提包，都在立即可觸及的範圍內；停在餐廳停車場的轎車，不是甲在六樓當時所使用、可以立即觸及的，搜索屬違法（C）。", "ref": "刑訴§130", "evidence": "得逕行搜索其身體、隨身攜帶之物件、所使用之交通工具及其立即可觸及之處所。"}, {"id": "109-刑事法-19", "src": "old", "year": 109, "n": 19, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "以下關於被告自白之敘述，何者錯誤？", "opts": {"A": "被告之自白不得作為有罪判決之唯一證據", "B": "非任意性自白是否具證據能力，應由法院審酌人權保障與公共利益的均衡維護加以認定", "C": "被告之自白，除有特別規定外，非於有關犯罪事實之其他證據調查完畢後，不得調查", "D": "若被告陳述其自白係出於不正之方法者，則自白應先於其他事證而調查"}, "answer": "B", "explain": "依§156Ⅰ，非任意性自白絕對沒有證據能力，不需再權衡（B 錯，B 所描述的是§158-4 違法取證的權衡法則）。A 是§156Ⅱ自白補強法則；C 是§161-3 自白最後調查原則；D 是§156Ⅲ，被告陳述自白出於不正方法時，應先於其他事證而為調查。", "ref": "刑訴§156Ⅰ、Ⅲ", "evidence": "被告陳述其自白係出於不正之方法者，應先於其他事證而為調查。"}, {"id": "109-刑事法-20", "src": "old", "year": 109, "n": 20, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "甲目擊黑道份子殺人之經過，回家後將其所目擊的事實鉅細靡遺的跟其太太乙講，但因擔心遭黑道威脅，甲並未聲張。事後，檢察官調出案發現場的監視器，發現甲為目擊證人，乃傳喚甲到庭作證，豈料甲在前往地檢署的路上出車禍身亡。之後，檢察官將涉嫌殺人之黑道份子起訴，乙則於審判中出庭，並於具結後作證甲跟其所講述的黑道殺人事實。依實務見解，以下敘述何者正確？", "opts": {"A": "乙在法庭上的證言具證據能力", "B": "乙之證言屬傳聞證據，不具證據能力", "C": "乙之證言雖屬傳聞證據，但適用刑事訴訟法第 159 條之 3 的規定，例外具有證據能力", "D": "乙之證言雖屬傳聞證據，但類推適用刑事訴訟法第 159 條之 3 的規定，例外具有證據能力"}, "answer": "D", "explain": "乙在法庭上轉述甲在審判外所說的內容，屬傳聞證據。甲已死亡，但甲的陳述不是在警詢中所為，不能直接適用§159-3。實務認為原陳述人死亡而無法到庭時，可以類推適用§159-3：經證明具有可信之特別情況，且為證明犯罪事實所必要者，例外有證據能力（D）。", "ref": "刑訴§159-3①；實務見解", "evidence": "經證明具有可信之特別情況，且為證明犯罪事實之存否所必要者，得為證據"}, {"id": "109-刑事法-21", "src": "old", "year": 109, "n": 21, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "以下關於「上訴」之敘述，何者錯誤？", "opts": {"A": "被告僅得為自己之利益而上訴", "B": "自訴人僅得為被告之不利益提起上訴", "C": "檢察官僅得為被告之不利益提起上訴", "D": "檢察官得為被告之利益或為被告之不利益而提起上訴"}, "answer": "C", "explain": "依§344Ⅳ，檢察官為被告之利益，也可以上訴；檢察官是公益代表人，可以為被告的利益或不利益提起上訴，所以 C 說「僅得為被告之不利益提起上訴」是錯誤敘述（D 正確）。被告上訴須為自己的利益；自訴人是被告的對立當事人，實務認為只能為被告之不利益上訴。", "ref": "刑訴§344Ⅳ", "evidence": "檢察官為被告之利益，亦得上訴。"}, {"id": "109-刑事法-22", "src": "old", "year": 109, "n": 22, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "關於「拒絕證言權」的敘述，依實務見解，以下何者錯誤：", "opts": {"A": "醫師就其因業務所知悉有關他人秘密之事項受訊問，除經本人允許者外，得拒絕證言", "B": "被告的未婚妻，得拒絕證言", "C": "新聞記者因其報導內容接受訊問者，關於其消息來源，得拒絕證言", "D": "證人恐因陳述致自己受刑事追訴或處罰者，得拒絕證言"}, "answer": "C", "explain": "§182 規定業務上可以拒絕證言的人，限於醫師、藥師、心理師、助產士、宗教師、律師、辯護人、公證人、會計師等，不包括新聞記者，所以 C 錯誤（實務不承認記者依本條享有拒絕證言權）。A 符合§182；B 與被告訂有婚約者，依§180Ⅰ②得拒絕證言；D 恐自己受刑事追訴者，依§181 得拒絕證言。", "ref": "刑訴§180、§181、§182", "evidence": "證人為醫師、藥師、心理師、助產士、宗教師、律師、辯護人、公證人、會計師"}, {"id": "109-刑事法-23", "src": "old", "year": 109, "n": 23, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "刑事訴訟法中關於對自訴之限制，以下敘述何者錯誤：", "opts": {"A": "夫對妻不得提自訴", "B": "父親對兒子不得提自訴", "C": "值勤中遭打傷的警察，得對行為人提出傷害罪與妨害公務罪之自訴", "D": "同一案件經檢察官開始偵查，原則上即不得再行自訴"}, "answer": "B", "explain": "§321 規定「對於直系尊親屬或配偶，不得提起自訴」，限制的是卑親屬告尊親屬，以及配偶之間互告。父親對兒子（直系卑親屬）提自訴不受限制，所以 B 是錯誤敘述；A 夫對妻不得自訴，正確。C 妨害公務與傷害為一行為觸犯數罪，依§319Ⅲ，較重的傷害罪可以自訴，全部得提起。D 符合§323Ⅰ。", "ref": "刑訴§321、§323Ⅰ", "evidence": "對於直系尊親屬或配偶，不得提起自訴。"}, {"id": "109-刑事法-24", "src": "old", "year": 109, "n": 24, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "以下何者非屬刑事訴訟法第 379 條所定之「當然違背法令事由」？", "opts": {"A": "選任辯護案件，辯護人未經到庭辯護而逕行審判", "B": "依法應於審判期日調查之證據而未予調查", "C": "未經參與審理之法官參與判決", "D": "未與被告以最後陳述之機會"}, "answer": "A", "explain": "§379⑦只限「依本法應用辯護人之案件或已經指定辯護人之案件」，辯護人未到庭而逕行審判，才屬當然違背法令。非強制辯護的選任辯護案件，辯護人未到庭，不在列舉範圍內（A）。B 為第 10 款、C 為第 13 款、D 為第 11 款，都屬當然違背法令事由。", "ref": "刑訴§379⑦", "evidence": "依本法應用辯護人之案件或已經指定辯護人之案件，辯護人未經到庭辯護而逕行審判者。"}, {"id": "109-刑事法-25", "src": "old", "year": 109, "n": 25, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "甲遭乙誣告犯竊盜罪，法院不察導致誤判甲竊盜罪，經甲上訴後仍遭判有罪判決確定。甲怒告乙誣告，經法院查明真相後判決乙誣告有罪判決確定。甲應透過何種救濟管道，以撤銷其遭誣告而被判竊盜罪的有罪確定判決？", "opts": {"A": "非常上訴", "B": "再審", "C": "聲請回復原狀", "D": "聲請赦免"}, "answer": "B", "explain": "依§420Ⅰ③，受有罪判決之人已證明其係被誣告者，得為受判決人之利益聲請再審；依同條第二項，這項證明以經判決確定為限，本題乙誣告罪已判決確定，符合要件（B）。非常上訴是針對審判違背法令，由檢察總長提起；回復原狀是針對遲誤期間；赦免屬總統權限，都不適用。", "ref": "刑訴§420Ⅰ③", "evidence": "受有罪判決之人，已證明其係被誣告者。"}, {"id": "109-刑事法-27", "src": "old", "year": 109, "n": 27, "subject": "刑事法", "topic": "消防法", "stem": "「消防法」有關液化石油氣容器（以下簡稱容器）之規定，何者正確？", "opts": {"A": "容器應定期檢驗，零售業者應於檢驗期限屆滿前，將容器送經中央主管機關登錄之容器檢驗機構實施檢驗，經檢驗合格，即可繼續使用", "B": "容器檢驗機構辦理容器檢驗所需費用，由零售業者負擔", "C": "容器輸入業者，應向中央主管機關直接申請個別認可", "D": "容器應經個別認可合格後，即可銷售"}, "answer": "B", "explain": "依§15-4Ⅱ，容器檢驗機構辦理容器檢驗所需費用，由零售業者負擔（B）。A 漏了「附加合格標示後」才能繼續使用；C 容器製造或輸入業者應先申請型式認可，取得證書後才能申請個別認可（§15-3Ⅰ），不能直接申請個別認可；D 個別認可合格後，還須附加合格標示才能銷售（§15-3Ⅱ）。", "ref": "消防法§15-3、§15-4Ⅱ", "evidence": "前項所定容器檢驗機構辦理容器檢驗所需費用，由零售業者負擔"}, {"id": "109-刑事法-29", "src": "old", "year": 109, "n": 29, "subject": "刑事法", "topic": "消防法", "stem": "依據「消防法」之規定，所謂「消防主管機關」，何者正確？①內政部  ②臺北市政府消防局③花蓮縣政府  ④基隆港務消防隊", "opts": {"A": "①②③④", "B": "①②③", "C": "①③", "D": "①"}, "answer": "C", "explain": "依§3，消防法的主管機關在中央為內政部，在直轄市為直轄市政府，在縣（市）為縣（市）政府，所以①內政部、③花蓮縣政府都是主管機關（C）。臺北市政府消防局只是業務承辦機關（細則§2），基隆港務消防隊也不是主管機關。", "ref": "消防法§3；消防法施行細則§2", "evidence": "本法所稱主管機關：在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。"}, {"id": "109-刑事法-30", "src": "old", "year": 109, "n": 30, "subject": "刑事法", "topic": "消防法", "stem": "依據「消防法」、「消防法施行細則」之規定，消防防護計畫應包括事項，何者正確？", "opts": {"A": "防火避難設施之自行檢查：每月至少檢查一次，檢查結果遇有缺失，應報告管理權人立即改善", "B": "滅火、通報及避難訓練之實施；每半季至少應舉辦一次，每次不得少於 4 小時，並應事先通報當地消防機關", "C": "場所之組織編制圖、分工圖及平面圖", "D": "自衛消防編組：員工在 15 人以上者，至少編組滅火班、通報班及避難引導班；員工在 50 人以上者，應增編安全防護班及救護班"}, "answer": "A", "explain": "依細則§5，防火避難設施的自行檢查每月至少一次，缺失應報告管理權人立即改善（A 正確）。B 訓練為「每半年」至少一次，不是每半季；C 應為場所之「位置圖、逃生避難圖及平面圖」；D 自衛消防編組的門檻為員工「10 人」以上，不是 15 人。", "ref": "消防法§13；消防法施行細則§5", "evidence": "防火避難設施之自行檢查：每月至少檢查一次"}, {"id": "109-刑事法-32", "src": "old", "year": 109, "n": 32, "subject": "刑事法", "topic": "災害防救法", "stem": "依據「災害防救法」之規定，為有效整合運用救災資源，中央災害防救委員會設何種單位，統籌、調度國內各搜救單位資源，執行災害事故之人員搜救及緊急救護之運送任務？", "opts": {"A": "內政部消防署", "B": "中央災害應變中心", "C": "行政院災害防救辦公室", "D": "行政院國家搜救指揮中心"}, "answer": "D", "explain": "依§7Ⅳ，為了有效整合運用救災資源，中央災害防救委員會設「行政院國家搜救指揮中心」，統籌、調度國內各搜救單位的資源，執行災害事故的人員搜救及緊急救護運送任務（D）。消防署是內政部所屬機關；中央災害應變中心是災時開設的任務編組；行政院災害防救辦公室負責處理委員會的業務。", "ref": "災害防救法§7Ⅳ", "evidence": "中央災害防救委員會設行政院國家搜救指揮中心"}, {"id": "109-刑事法-33", "src": "old", "year": 109, "n": 33, "subject": "刑事法", "topic": "災害防救法", "stem": "依據「災害防救法」之規定，鄉（鎮、市）層級設置的災害防救組織，何者正確？①災害防救會報  ②災害防救委員會  ③災害防救辦公室  ④災害應變中心", "opts": {"A": "①②③", "B": "①③④", "C": "②③④", "D": "①②③④"}, "answer": "B", "explain": "鄉（鎮、市）層級設有災害防救會報（§10）、災害防救辦公室（§11Ⅱ），以及災時成立的災害應變中心（§12Ⅰ），所以答案是 B（①③④）。「災害防救委員會」只設在中央（行政院中央災害防救委員會，§7Ⅱ），鄉鎮市層級沒有。", "ref": "災害防救法§10、§11Ⅱ、§12Ⅰ", "evidence": "鄉（鎮、市）、山地原住民區災害防救辦公室執行鄉（鎮、市）、山地原住民區災害防救會報事務。"}, {"id": "109-刑事法-34", "src": "old", "year": 109, "n": 34, "subject": "刑事法", "topic": "災害防救法", "stem": "依據「災害防救法」、「災害防救法施行細則」之規定，所稱公共事業，係指經中央目的事業主管機關指定之事業，何者正確？①運輸業  ②電信事業  ③大眾傳播事業  ④天然氣事業", "opts": {"A": "①②③④", "B": "①②③", "C": "①③④", "D": "②③④"}, "answer": "A", "explain": "依施行細則§3，公共事業指經中央目的事業主管機關指定的大眾傳播事業、電業、自來水事業、電信事業、天然氣事業、石油業、運輸業及其他事業。運輸業、電信事業、大眾傳播事業、天然氣事業都在列舉範圍內，所以答案是 A（①②③④）。", "ref": "災害防救法施行細則§3", "evidence": "指經中央目的事業主管機關指定之大眾傳播事業、電業、自來水事業、電信事業、天然氣事業、石油業、運輸業及其他事業。"}, {"id": "109-刑事法-35", "src": "old", "year": 109, "n": 35, "subject": "刑事法", "topic": "災害防救法", "stem": "依據「災害防救法」、「災害防救法施行細則」之規定，所謂懸浮微粒物質災害，係指因事故或氣象因素使懸浮微粒物質大量產生或大氣濃度升高，空氣品質達何種惡化警告等級或造成人民健康重大危害者？", "opts": {"A": "一級嚴重惡化", "B": "二級嚴重惡化", "C": "一級預警", "D": "二級預警"}, "answer": "A", "explain": "依施行細則§2 第 14 款，懸浮微粒物質災害指因事故或氣象因素，使懸浮微粒物質大量產生或大氣濃度升高，空氣品質達「一級嚴重惡化」或造成人民健康重大危害者（A）。「預警」等級不是災害的門檻，B、C、D 都是干擾選項。", "ref": "災害防救法施行細則§2⑭", "evidence": "空氣品質達一級嚴重惡化或造成人民健康重大危害者。"}, {"id": "109-刑事法-36", "src": "old", "year": 109, "n": 36, "subject": "刑事法", "topic": "災害防救法", "stem": "依據「災害防救法」之規定，人民因災害防救法之處分、強制措施或命令，致其財產遭受損失時之後續損失補償規定，何者正確？", "opts": {"A": "自損失發生後，經過 2 年者，不得為之", "B": "當事人無論是否有責，均得請求損失補償", "C": "損失補償應自知有損失時起，5 年內請求之", "D": "當事人相關的損失補償，應以金錢為之，並以補償實際所受之損失為限"}, "answer": "D", "explain": "依§34Ⅱ，損失補償應以金錢為之，並以補償實際所受之損失為限（D）。依§34Ⅲ，應於知有損失後 2 年內請求，但自損失發生後經過 5 年者不得為之，A、C 把期間寫反了；依§34Ⅰ但書，因可歸責於該人民之事由者，不予補償，B 錯。", "ref": "災害防救法§34Ⅱ", "evidence": "前項損失補償，應以金錢為之，並以補償實際所受之損失為限。"}, {"id": "109-刑事法-37", "src": "old", "year": 109, "n": 37, "subject": "刑事法", "topic": "災害防救法", "stem": "依據「災害防救法」之規定，災害防救基本計畫由何者擬訂？", "opts": {"A": "中央災害防救會報", "B": "中央災害防救委員會", "C": "行政院災害防救辦公室", "D": "行政院災害防救專家諮詢委員會"}, "answer": "B", "explain": "依§17Ⅰ，災害防救基本計畫由「中央災害防救委員會」擬訂，經中央災害防救會報核定後，由行政院函送各中央災害防救業務主管機關及地方政府辦理（B）。中央災害防救會報負責核定，不是擬訂；災害防救辦公室及專家諮詢委員會，則分別負責幕僚與諮詢工作。", "ref": "災害防救法§17Ⅰ", "evidence": "災害防救基本計畫由中央災害防救委員會擬訂，經中央災害防救會報核定後"}, {"id": "109-刑事法-40", "src": "old", "year": 109, "n": 40, "subject": "刑事法", "topic": "消防法", "stem": "依據消防法規定，中央主管機關為調查消防及義勇消防人員因災害搶救致發生死亡或重傷事故之原因，應聘請相關機關（構）、團體代表、學者專家及基層消防團體代表，組成何種組織？", "opts": {"A": "災害防救會報", "B": "火災鑑定會", "C": "災害事故調查會", "D": "災害防救專家諮詢委員會"}, "answer": "C", "explain": "依§27-1，為調查消防及義勇消防人員因災害搶救等致死亡或重傷等事故的原因，應聘請相關機關（構）、團體代表、學者專家及基層消防團體代表，組成「災害事故調查會」（C）。火災鑑定會負責鑑定火災原因（§27）；災害防救會報、專家諮詢委員會則屬於災害防救法的組織。（113 年修正後，主體擴大為「各級主管機關」，範圍也擴及其他消防勤務，但組織名稱不變。）", "ref": "消防法§27-1Ⅰ", "evidence": "組成災害事故調查會（以下簡稱調查會）。"}, {"id": "109-刑事法-41", "src": "old", "year": 109, "n": 41, "subject": "刑事法", "topic": "消防法", "stem": "依據消防法規定，未僱用領有合格證照者從事熱水器及配管之安裝，處負責人及行為人新臺幣 X 以上 Y 以下罰鍰，並得命其限期改善，屆期未改善者，得連續處罰或逕予停業處分。下列何者正確？", "opts": {"A": "X=3 萬元，Y=5 萬元", "B": "X=3 萬元，Y=10 萬元", "C": "X=1 萬元，Y=5 萬元", "D": "X=1 萬元，Y=10 萬元"}, "answer": "C", "explain": "依§42-1①，違反§15-1，未僱用領有合格證照者從事熱水器及配管的安裝，處負責人及行為人新臺幣 1 萬元以上 5 萬元以下罰鍰，並得命限期改善，屆期未改善者得按次處罰（舊法稱連續處罰）或逕予停業處分，所以 X=1 萬元、Y=5 萬元（C）。", "ref": "消防法§42-1①", "evidence": "處負責人及行為人新臺幣一萬元以上五萬元以下罰鍰"}, {"id": "109-刑事法-43", "src": "old", "year": 109, "n": 43, "subject": "刑事法", "topic": "消防法", "stem": "依據「消防法」之規定，液化石油氣零售業者應備置相關資料，並定期向轄區消防機關申報。前述應備置之相關資料，不包括下列何者？", "opts": {"A": "容器儲存場所管理資料", "B": "投保公共意外責任險之證明文件", "C": "液化石油氣分裝場業者灌裝證明資料", "D": "營利事業登記證"}, "answer": "D", "explain": "依§15-2Ⅰ，零售業者應備置的資料包括：容器儲存場所管理資料、容器管理資料、用戶資料、分裝場業者灌裝證明資料、安全技術人員管理資料、用戶安全檢查資料、投保公共意外責任保險之證明文件，以及其他經公告的資料。營利事業登記證不在列舉範圍內（D）。", "ref": "消防法§15-2Ⅰ", "evidence": "液化石油氣分裝場業者灌裝證明資料。"}, {"id": "109-刑事法-44", "src": "old", "year": 109, "n": 44, "subject": "刑事法", "topic": "災害防救法", "stem": "有關弱勢族群災害防救援助必要事項係屬災害防救那一階段之應辦事項？", "opts": {"A": "減災", "B": "整備", "C": "應變", "D": "復原"}, "answer": "A", "explain": "依§22Ⅰ⑪，「有關弱勢族群災害防救援助必要事項」屬於各級政府平時應實施的「減災」事項（A）。另外要注意區分：§27Ⅰ④「弱勢族群特殊保護措施」屬於應變階段的事項，不要與本題的減災事項混淆。", "ref": "災害防救法§22Ⅰ⑪", "evidence": "有關弱勢族群災害防救援助必要事項。"}, {"id": "109-刑事法-45", "src": "old", "year": 109, "n": 45, "subject": "刑事法", "topic": "消防法", "stem": "有關消防法針對液化石油氣之規定，下列敘述何者錯誤？", "opts": {"A": "經營家用液化石油氣零售事業者、用戶及其員工得向直轄市、縣（市）主管機關敘明事實或檢具證據資料，舉發違法之行為，且舉發人之單位主管、雇主不得因其舉發行為，而予以解僱、調職或其他不利之處分", "B": "液化石油氣零售業者應備置資料，並定期向轄區消防機關申報，其資料，零售業者應至少保存三年，以備查核", "C": "使用燃氣之熱水器及配管之承裝業，應向直轄市、縣（市）政府申請營業登記後，始得營業。並自民國 95 年 2 月 1 日起使用燃氣熱水器之安裝，非經僱用領有合格證照者，不得為之", "D": "液化石油氣容器製造或輸入業者，應向中央主管機關申請型式認可，發給型式認可證書，始得申請個別認可"}, "answer": "B", "explain": "消防法§15-2Ⅱ授權訂定的經營家用液化石油氣零售事業者資料申報作業辦法§7規定，零售業者的備置資料至少保存2年，所以B的「3年」是錯誤敘述，官方答案仍成立。A 符合§15Ⅲ、Ⅴ；C 符合§15-1Ⅰ；D 符合§15-3Ⅰ。", "ref": "經營家用液化石油氣零售事業者資料申報作業辦法§7；消防法§15、§15-1、§15-3", "evidence": "備置及保存附表一至附表四各項資料，並至少保存二年，以備查核。"}, {"id": "109-刑事法-47", "src": "old", "year": 109, "n": 47, "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法之規定，下列敘述何者錯誤？", "opts": {"A": "災區受災之全民健康保險保險對象，於災後一定期間內，其應自付之保險費、醫療費用部分負擔及住院一般膳食費用，由中央政府支應並得以民間捐款為來源", "B": "災區受災居民自政府或民間領取之各項救助金、慰問金或臨時工作津貼，應納所得稅", "C": "災區內之土地及建築物，符合一定條件者，得減免地價稅及房屋稅", "D": "災區受災之農民健康保險、國民年金保險、勞工保險及就業保險被保險人，於災後一定期間內應負擔之保險費，由中央政府支應"}, "answer": "B", "explain": "依§44Ⅰ，災區受災居民自政府或民間領取的各項救助金、慰問金或臨時工作津貼，「免納所得稅」，所以 B 說應納所得稅是錯誤敘述。A 符合§45Ⅰ（健保自付額由中央政府支應）；C 符合§44Ⅲ（地價稅、房屋稅減免）；D 符合§46Ⅰ（農保、國保、勞保、就保保費由中央支應）。", "ref": "災害防救法§44Ⅰ", "evidence": "災區受災居民自政府或民間領取之各項救助金、慰問金或臨時工作津貼，免納所得稅。"}, {"id": "109-刑事法-48", "src": "old", "year": 109, "n": 48, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法規定，各級政府成立災害應變中心後，指揮官於災害應變範圍內，依其權責可以徵用、徵購民間搜救犬、救災機具、車輛、船舶或航空器等裝備、土地、水權、建築物、工作物等，惟前述之處分、強制措施或命令，致其財產遭受損失時，得請求補償。但因何種事由者，不在此限？", "opts": {"A": "因可歸責於該人民", "B": "因可歸責於縣市政府", "C": "因可歸責於第三方", "D": "因可歸責於中央政府"}, "answer": "A", "explain": "依§34Ⅰ，人民因災害應變的處分、強制措施或命令，致財產遭受損失時，得請求補償；「但因可歸責於該人民之事由者，不在此限」（A）。補償制度是基於特別犧牲的衡平，損失如果是人民自己造成的，就不予補償；可歸責於政府或第三人時，都不影響人民的補償請求權。", "ref": "災害防救法§34Ⅰ", "evidence": "但因可歸責於該人民之事由者，不在此限。"}, {"id": "109-刑事法-49", "src": "old", "year": 109, "n": 49, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法規定，各級政府應針對具災害潛勢且易因災害致交通中斷無法對外連絡之村、里或原住民部落等，協助輔導設立何種組織，並加強教育訓練？", "opts": {"A": "義勇消防組織", "B": "民防組織", "C": "自主防救組織", "D": "自衛消防編組"}, "answer": "C", "explain": "依施行細則§9，各級政府應針對具災害潛勢、且易因災害致交通中斷無法對外連絡的村、里或原住民部落等，協助輔導設立「自主防救組織」，並加強教育訓練（C）。義勇消防組織依消防法編組，自衛消防編組是消防防護計畫的內容，民防組織則屬於民防體系，都不是本題答案。", "ref": "災害防救法§22Ⅰ②；災害防救法施行細則§9", "evidence": "協助輔導設立自主防救組織，並加強教育訓練。"}, {"id": "109-刑事法-50", "src": "old", "year": 109, "n": 50, "subject": "刑事法", "topic": "災害防救法", "stem": "依據災害防救法規定，下列何者不屬於「災害防救物資、器材」？", "opts": {"A": "飲用水、糧食及其他民生必需品", "B": "急救用醫療器材及藥品", "C": "人命救助器材及裝備", "D": "資訊、通信等器材、設備"}, "answer": "D", "explain": "依施行細則§10Ⅰ，「災害防救物資、器材」包括：飲用水、糧食及民生必需品；急救用醫療器材及藥品；人命救助器材及裝備；營建機具、建材等。「資訊、通信等器材、設備」列在§10Ⅱ第 5 款，屬於「災害防救設施、設備」，不是物資器材（D）。", "ref": "災害防救法§23Ⅰ⑤、⑥；災害防救法施行細則§10", "evidence": "資訊、通信等器材、設備。"}, {"id": "109-國文-01", "src": "old", "year": 109, "n": 1, "subject": "國文", "topic": "國文", "stem": "下列成語之運用，何者用字及用法皆無誤？", "opts": {"A": "真理不是涶手可得，謬論卻俯拾皆是", "B": "先民移居孤島，胼手胝足開疆闢土，使荒野茅塞頓開，為後人留下沃土江山", "C": "「義」是成德所不可獲缺的，缺了這一因素，軀殼雖存，精神已失，不復成其為德了", "D": "有人認為歷史沒有鑑往知來的意義，它只是權力與征服、勝利與潰敗、宰制與降服的因循反覆而已"}, "answer": "D", "explain": "D「鑑往知來」指借鑑過去以推知未來，用字用法皆正確。A「涶手可得」應作「唾手可得」；B「茅塞頓開」指心思忽然開竅、領悟，不能形容開墾荒野，宜改用「篳路藍縷」「開荒闢土」之類；C「不可獲缺」應作「不可或缺」。", "ref": "成語", "evidence": ""}, {"id": "109-國文-02", "src": "old", "year": 109, "n": 2, "subject": "國文", "topic": "國文", "stem": "某書院正門門柱聯：「登雲有路□□□聯步高攀鳳閣，瀛海無涯□□□翻身跳進龍門。」□□□前後依文意最適合填入的是：", "opts": {"A": "但志堅／莫遲疑", "B": "心得定／腹有書", "C": "志為梯／勤是岸", "D": "顯宗室／耀門楣"}, "answer": "C", "explain": "上聯「登雲有路」接「志為梯」，以志向為登天梯；下聯「瀛海無涯」接「勤是岸」，以勤奮為苦海之岸，二者對仗工整（志／勤、梯／岸），也扣合書院勉學宗旨，選 C。A、B 詞性結構不對仗；D「顯宗室／耀門楣」重在功名光宗，與「路」「無涯」的意象不相承接。", "ref": "對聯（化用「書山有路勤為徑，學海無涯苦作舟」）", "evidence": ""}, {"id": "109-國文-03", "src": "old", "year": 109, "n": 3, "subject": "國文", "topic": "國文", "stem": "「閱卷疾讀，日得數十卷，至老死不懈，可曰勤矣，然而無益。此有說也：疾讀，則思之不審；一讀而止，則不能識憶其文，雖勤讀書，如不讀也。讀書勿求多，歲月既積，卷帙自富。」下列敘述，何者最貼近上文的意旨？", "opts": {"A": "讀書可以強記博聞，不能囫圇吞棗", "B": "讀書的方法在於好學深思，循序漸進", "C": "讀書不必貪多，貪多容易流於腹笥甚窘", "D": "讀書要有韋編三絕的精神，才能累積學養"}, "answer": "B", "explain": "引文批評快速讀而不深思（「疾讀，則思之不審」）、一讀即止而記不住，主張「讀書勿求多，歲月既積，卷帙自富」，即要深思並逐步累積，選 B。A「強記博聞」非重點；C「腹笥甚窘」指學識貧乏，與文意推論不合；D「韋編三絕」強調勤讀，而文中正說只勤讀「如不讀也」。", "ref": "文意判讀", "evidence": ""}, {"id": "109-國文-04", "src": "old", "year": 109, "n": 4, "subject": "國文", "topic": "國文", "stem": "君子必在己者，不必在人者也。必在己，無不遇矣。（《呂氏春秋．必己》）下列選項何者最接近文意？", "opts": {"A": "臨淵羨魚，不如退而結網", "B": "君子反求諸己，小人常求諸人", "C": "君子善於取法古人，以為模範", "D": "君子不戚戚於貧賤，不汲汲於富貴"}, "answer": "B", "explain": "「君子必在己者，不必在人者」指君子只求自己能掌握的修為，不強求外在際遇，與 B「君子求諸己，小人求諸人」相合。A 語出《漢書．董仲舒傳》，勸人務實行動；C 談取法古人；D 語出陶淵明〈五柳先生傳〉，談安貧淡泊，皆非求諸己之意。", "ref": "《呂氏春秋．必己》；B 出自《論語．衛靈公》", "evidence": ""}, {"id": "109-國文-05", "src": "old", "year": 109, "n": 5, "subject": "國文", "topic": "國文", "stem": "「農舍、別墅都種在水田／冬季休耕，要收割什麼？／灰霾雨天，鷺鷥、水鳥小心翼翼／窺探農舍、別墅晚餐桌上／留下什麼魚肉剩菜？／北風呼呼大叫，今晚／我要空著肚子睡覺！」本詩主要凸顯的社會問題是：", "opts": {"A": "環境破壞，唇亡齒寒", "B": "貧富不均，懸殊惡化", "C": "違法亂紀，自食苦果", "D": "氣候變遷，資源耗竭"}, "answer": "A", "explain": "詩中「農舍、別墅都種在水田」，農地被建物占據，冬季無作物可收，鷺鷥水鳥失去覓食地，只能窺探人類餐桌，最後「空著肚子睡覺」，凸顯農地濫建破壞生態、人與自然生物處境相連，選 A。B 詩中未比較貧富；C 違法未見自食惡果的描寫；D 北風是季節景象，非氣候變遷。", "ref": "文意判讀（現代詩）", "evidence": ""}, {"id": "109-國文-06", "src": "old", "year": 109, "n": 6, "subject": "國文", "topic": "國文", "stem": "韓非子重法術勢兼用，他曾說「術者，因任而授官，循名而責實，……課群臣之能者也，此人主之所執也。」依據文意，其主要功能與現今政府的那個部門接近？", "opts": {"A": "考試院", "B": "行政院", "C": "司法院", "D": "立法院"}, "answer": "A", "explain": "「因任而授官，循名而責實」是依能力授予職位並考核名實是否相符，「課群臣之能」即考核官員才能，與現今掌理考試、銓敘、任用、考績的考試院職能最接近，選 A。行政院為執行政務、司法院掌審判、立法院掌立法，皆非授官考核的主要部門。", "ref": "《韓非子．定法》", "evidence": ""}, {"id": "109-國文-07", "src": "old", "year": 109, "n": 7, "subject": "國文", "topic": "國文", "stem": "「我們常覺得累是成長的必然，努力是成功的代價。臺灣平面設計師聶永真四十歲後的感想就是：『當初心理上的勞累是沒辦法補的，我覺得最重要的是心理面也能夠保持健康，就是你給自己夠多的時間，夠鬆的餘裕，讓自己舒服，才能夠保證接下來的五年十年，你的狀態夠好。因為三十歲的時候實在太忙，以至於我現在在心理上要補的更多。』」上文給忙於工作者的建議應是：", "opts": {"A": "忙裡偷閒及時享樂", "B": "努力是成功的代價", "C": "忙中宜有適度調濟", "D": "生理健康最為重要"}, "answer": "C", "explain": "聶永真反省三十歲時太忙，心理勞累無法補回，主張給自己「夠多的時間，夠鬆的餘裕」，才能保持長遠的好狀態，意即忙碌中應適度調劑，選 C。A「及時享樂」扭曲為享樂主義；B 是文首被質疑的一般看法；D 他強調的是「心理面」的健康，非生理。", "ref": "文意判讀", "evidence": ""}, {"id": "109-國文-08", "src": "old", "year": 109, "n": 8, "subject": "國文", "topic": "國文", "stem": "「我記得 90 年代初，我在黃銘昌的畫室，首次看到他的〈風中的水稻田〉，為之驚豔，不禁脫口而出：『好一片豐饒之海！』整幅是一大頃稻海禾浪，滿盈盈的一片綠。細看，原來這片稻海竟是一筆一筆千千萬萬株禾稻密綿連綴而成，下筆之精工，令人嘆為觀止。這幅畫透露著一股豐饒厚實的生命力，似乎是從大地泥土裡冒出來的，禾浪由近而遠，前一波推動下一波，滾滾奔向無涯，整幅畫是不停地在顫動──那是一種生命的騷動。」根據引文，關於〈風中的水稻田〉畫作的特色，下列敘述何者正確？", "opts": {"A": "畫家運用了現代的科技，讓畫面呈現了微微波動之態", "B": "畫家著眼於農作的豐收，以金黃的稻浪來傳達生命力", "C": "畫家結合西方的印象派，以本土題材表現對故鄉的愛", "D": "畫家繪製禾稻工筆細緻，同時給人綿延無盡的空間感"}, "answer": "D", "explain": "文中「一筆一筆千千萬萬株禾稻密綿連綴而成，下筆之精工」說明工筆細緻；「禾浪由近而遠……滾滾奔向無涯」呈現綿延無盡的空間感，選 D。A 顫動感來自畫面構圖而非科技；B 畫面是「滿盈盈的一片綠」，非金黃；C 文中未提印象派。", "ref": "文意判讀", "evidence": ""}, {"id": "109-國文-09", "src": "old", "year": 109, "n": 9, "subject": "國文", "topic": "國文", "stem": "「獵場的一切是共享的。假如有一天你用完獵寮裡的乾食、鹽巴和肉品，那麼下次上山時再帶來，而用完的乾材和水，只要在離開時補上就好，讓後面的獵人還有乾材可以燒。當個獵人，講的就是信用和默契。有時候我們在山裡趕路，碰到一些小小的意外、事故或是天黑，只要我們知道附近有獵寮，那有多好呀！可休息起灶。若是在趕到時發現，柴火和可食用的食物都用完了，而肚子又餓、天氣又冷、又下雨、天又黑，我們到哪裡去找乾材？所以，如果我們使用了別人準備的乾材，也要懂得為下一個使用的人準備，因為在山上單獨一個人時沒有人能幫你，所以能幫你的人都設想幫助你的方法，而這個方法也是你能回饋給別人的方法。」下列選項，何者與上文意旨最接近？", "opts": {"A": "凡有一得，必有一失", "B": "雪中送炭，義所應為", "C": "緩急常有，有備無患", "D": "人人為我，我為人人"}, "answer": "D", "explain": "獵寮物資共享，用了別人準備的乾材食物要補上給下一位；「能幫你的人都設想幫助你的方法，而這個方法也是你能回饋給別人的方法」，即互助循環，選 D「人人為我，我為人人」。A 談得失相隨；B 只講單向救急；C 強調自身預備，皆未涵蓋互惠回饋之意。", "ref": "文意判讀", "evidence": ""}, {"id": "109-國文-10", "src": "old", "year": 109, "n": 10, "subject": "國文", "topic": "國文", "stem": "「自動駕駛是最能激起普通人好奇心的人工智慧領域之一。由電腦演算法自動駕駛的汽車、飛機、太空船，曾是絕大多數科幻小說中重要的未來元素。其實，很多人似乎都還沒有意識到，自動駕駛汽車本身或其他相關的科技研發成果，早已一日千里且日趨穩定，進而在我們身邊發揮各種便利作用、引入特定行業、創造出巨大且廣泛的商業價值了。」根據上文，下列選項何者符合文意？", "opts": {"A": "科幻小說的書寫，促成自動駕駛科技一日千里的發展", "B": "時至今日，自動駕駛的科幻色彩已經變成真實的元素", "C": "科幻小說的發展史上，人工智慧的主題集中在自動駕駛", "D": "只有少數特定的人可以享有自動駕駛所帶來的生活利益"}, "answer": "B", "explain": "文中說自動駕駛「曾是」科幻小說的未來元素，而今相關科技「早已一日千里且日趨穩定」並在身邊發揮作用，可見科幻已成真實，選 B。A 文中未說科幻小說促成科技發展；C 只說是重要元素，非集中於此；D 文中說創造「巨大且廣泛」的價值，並非只有少數人受益。", "ref": "文意判讀", "evidence": ""}, {"id": "109-法學-01", "src": "old", "year": 109, "n": 1, "subject": "法學", "topic": "憲法", "stem": "就我國司法制度應否引進國民參審制或陪審制，關於其立法權及執行權之歸屬，下列敘述何者正確？", "opts": {"A": "由中央立法，交由地方執行之", "B": "由中央立法並執行之", "C": "由地方立法並執行之", "D": "由中央立法並執行之，或交由地方執行之"}, "answer": "B", "explain": "國民參審或陪審屬於審判制度，依憲法§107第4款，「司法制度」由中央立法並執行，故選B。我國已制定國民法官法並自112年起施行，同樣是中央立法並由中央的法院執行，答案不變。", "ref": "憲法§107；國民法官法", "evidence": "左列事項，由中央立法並執行之："}, {"id": "109-法學-02", "src": "old", "year": 109, "n": 2, "subject": "法學", "topic": "憲法", "stem": "依憲法規定，法律牴觸憲法發生疑義，應如何處理？", "opts": {"A": "由立法院解釋", "B": "由法務部解釋", "C": "由司法院解釋", "D": "由總統解釋"}, "answer": "C", "explain": "憲法§171Ⅱ規定，法律與憲法有無牴觸發生疑義時，由司法院解釋，故選C。補充：111年1月4日起施行憲法訴訟法，改由司法院大法官組成的憲法法庭以「判決」審理法規範憲法審查，但題目問的是憲法條文，答案仍是C。", "ref": "憲法§171；憲法訴訟法", "evidence": "法律與憲法有無牴觸發生疑義時，由司法院解釋之。"}, {"id": "109-法學-03", "src": "old", "year": 109, "n": 3, "subject": "法學", "topic": "憲法", "stem": "依憲法本文之規定，監察院得向何機關提出糾正案？", "opts": {"A": "立法院", "B": "司法院", "C": "考試院及其部會", "D": "行政院及其部會"}, "answer": "D", "explain": "依憲法§97Ⅰ，監察院經各該委員會之審查及決議，得提出糾正案，移送行政院及其有關部會，促其注意改善，故選D。糾正案的對象限於行政院及其部會，不包括立法院、司法院、考試院。", "ref": "憲法§97", "evidence": "監察院經各該委員會之審查及決議，得提出糾正案，移送行政院及其有關部會，促其注意改善。"}, {"id": "109-法學-04", "src": "old", "year": 109, "n": 4, "subject": "法學", "topic": "憲法", "stem": "下列何者為立法院之職權？", "opts": {"A": "審計權", "B": "糾正權", "C": "調查權", "D": "糾舉權"}, "answer": "C", "explain": "依釋字第325號、第585號（及憲判字113年第9號），立法院為有效行使憲法職權，享有調查權，故選C。審計權（憲法§90、增修§7）、糾正權（§97）、糾舉權都屬於監察院。", "ref": "釋字第325號、第585號", "evidence": ""}, {"id": "109-法學-05", "src": "old", "year": 109, "n": 5, "subject": "法學", "topic": "憲法", "stem": "關於立法院權力之行使，下列敘述何者正確？", "opts": {"A": "立法院不同意緊急命令時，該命令溯及失效", "B": "立法院同意總統、副總統之罷免案後，即為通過", "C": "立法院決議通過領土變更案後，應交公民複決", "D": "立法院僅對於司法院正副院長有人事同意權"}, "answer": "C", "explain": "依增修§4Ⅴ，領土變更案經立法院提出，並於公告半年後，由自由地區選舉人投票複決，故C正確。A依增修§2Ⅲ，立法院不同意時緊急命令「立即失效」，並不溯及既往；B罷免案還需經選舉人投票通過；D立法院對考試院、監察院人員及審計長等也有同意權。", "ref": "增修條文§4、§1、§2", "evidence": "提出領土變更案，並於公告半年後，經中華民國自由地區選舉人投票複決"}, {"id": "109-法學-06", "src": "old", "year": 109, "n": 6, "subject": "法學", "topic": "憲法", "stem": "關於總統及行政院院長之憲法上職權，下列敘述何者錯誤？", "opts": {"A": "總統得經行政院會議之決議，發布緊急命令", "B": "總統得向立法院提出施政方針及施政報告", "C": "經總統核可，行政院院長得將窒礙難行之法律案移請立法院覆議", "D": "行政院院長提請總統任命行政院副院長"}, "answer": "B", "explain": "依增修§3Ⅱ①，提出施政方針及施政報告是「行政院」對立法院的責任，不是總統，故B錯誤。A依增修§2Ⅲ，總統經行政院會議決議發布緊急命令；C依增修§3Ⅱ②，行政院經總統核可，移請立法院覆議；D依憲法§56，副院長由行政院院長提請總統任命。", "ref": "增修條文§3、§2；憲法§56", "evidence": "行政院有向立法院提出施政方針及施政報告之責。"}, {"id": "109-法學-07", "src": "old", "year": 109, "n": 7, "subject": "法學", "topic": "憲法", "stem": "下列何者不屬於基本權利限制應遵循之要件？", "opts": {"A": "基於法律規定", "B": "比例原則", "C": "得以職權命令限制", "D": "法律明確性原則"}, "answer": "C", "explain": "依憲法§23，限制基本權必須以法律或法律明確授權的命令為之（法律保留），並符合比例原則與法律明確性原則。職權命令沒有法律授權，不能用來限制人民權利（中央法規標準法§5、釋字第443號），故C錯誤。", "ref": "憲法§23；中央法規標準法§5", "evidence": ""}, {"id": "109-法學-08", "src": "old", "year": 109, "n": 8, "subject": "法學", "topic": "憲法", "stem": "下列有關偶發性集會之敘述，何者正確？", "opts": {"A": "基於國家安全與社會秩序之維護，室外集會遊行應經許可，禁止未經申請之偶發性集會尚不違憲", "B": "室外偶發性集會須事先申請許可，其申請不受 6 日前申請期間之限制，已足以保障集會自由", "C": "為兼顧集會自由保障與社會秩序維持，室外偶發性集會應採許可制，不得採報備制，立法者對此並無形成自由", "D": "立法者得視事件性質，以法律明確規範偶發性集會，改採許可制以外相同能達成目的之其他侵害較小手段"}, "answer": "D", "explain": "釋字第718號認為，集會遊行法要求緊急性及偶發性集會也必須事先申請許可，違憲。偶發性集會事實上無法事先申請，立法者應以法律明確規範，改採許可制以外、同樣能達成目的而侵害較小的手段（例如報備），故選D。A、B、C都與解釋意旨不符。", "ref": "憲法§14；釋字第718號", "evidence": ""}, {"id": "109-法學-09", "src": "old", "year": 109, "n": 9, "subject": "法學", "topic": "憲法", "stem": "依司法院大法官解釋，關於應考試權，下列敘述何者錯誤？", "opts": {"A": "應考試權為廣義之參政權", "B": "對應考試權之差別待遇，大法官採取寬鬆之審查標準", "C": "應考試權除保障人民參加考試取得公務人員任用資格之權利外，亦保障人民參加考試取得專門職業及技術人員執業資格之權利", "D": "應考試權之限制，應符合法律保留原則"}, "answer": "B", "explain": "依釋字第760號等，應考試權屬於廣義參政權，範圍包括公務人員考試與專技人員考試；限制應考試權應符合法律保留。對應考試權的差別待遇，大法官採取較嚴格（中度）的審查，要求目的重要且手段與目的有實質關聯，並不是寬鬆審查，故B錯誤。", "ref": "憲法§18；釋字第760號", "evidence": ""}, {"id": "109-法學-10", "src": "old", "year": 109, "n": 10, "subject": "法學", "topic": "憲法", "stem": "「票票等值」之要求，最可能與下列何種選舉方法有關？", "opts": {"A": "普通選舉", "B": "平等選舉", "C": "直接選舉", "D": "秘密選舉"}, "answer": "B", "explain": "平等選舉的意涵是一人一票、票票等值，每張選票的價值相同，故選B。普通選舉指不因性別、財產等限制選舉權；直接選舉指由選民直接選出；秘密選舉即無記名投票。四項原則規定在憲法§129。", "ref": "憲法§129", "evidence": "以普通、平等、直接及無記名投票之方法行之。"}, {"id": "109-法學-11", "src": "old", "year": 109, "n": 11, "subject": "法學", "topic": "憲法", "stem": "下列何者非司法院釋字第 445 號解釋，對集會自由之解釋內容？", "opts": {"A": "以法律限制集會、遊行之權利必須符合明確性原則", "B": "集會遊行法對於不遵從解散及制止命令之首謀者科以刑責，並非立法自由形成範圍", "C": "有關時間、地點及方式等限制，屬立法自由形成之範圍", "D": "集會自由屬於表現自由之範疇"}, "answer": "B", "explain": "釋字第445號認為：集會自由屬於表現自由；時間、地點及方式的限制屬於立法自由形成範圍；限制集會遊行應符合明確性原則。至於對不遵從解散及制止命令的首謀者科以刑責，解釋認為「為立法自由形成之範圍」，與憲法沒有牴觸。B的說法與解釋相反，故選B。", "ref": "釋字第445號", "evidence": ""}, {"id": "109-法學-12", "src": "old", "year": 109, "n": 12, "subject": "法學", "topic": "憲法", "stem": "依司法院釋字第 708 號解釋，有關內政部移民署對受驅逐出國之外國人以行政處分暫予收容，下列敘述何者正確？", "opts": {"A": "暫予收容屬剝奪人身自由之一種態樣，無論時間長短，均係嚴重干預人民身體自由，均應經法院審查決定", "B": "對外國人暫予收容，內政部移民署以行政處分為之即可，無須經由法院審查決定，亦無須賦予即時之司法救濟", "C": "暫予收容旨在防範外國人脫逃，俾能迅速遣送出國，未經法院審查決定，尚不違反人身自由，但應賦予即時之司法救濟", "D": "暫予收容期間短暫，非屬人身自由之長期剝奪，無須經由法院審查決定，亦無須賦予暫予收容人即時之司法救濟"}, "answer": "C", "explain": "釋字第708號認為，移民署為遣送外國人而作的暫予收容屬於剝奪人身自由，但合理作業期間內的短暫收容，不必由法院審查決定，只是應賦予受收容人即時的司法救濟；逾越合理期間的收容，則應由法院審查決定，故選C。", "ref": "憲法§8；釋字第708號", "evidence": ""}, {"id": "109-法學-13", "src": "old", "year": 109, "n": 13, "subject": "法學", "topic": "憲法", "stem": "憲法第 152 條明定：「人民具有工作能力者，國家應予以適當之工作機會。」下列敘述何者正確？", "opts": {"A": "人民對於其所欲從事工作，得依據上述規定向國家請求提供該職缺", "B": "國家若未給予適當之工作機會，人民得提起救濟，以確保上述規範之落實", "C": "係為工作權之憲法基礎，並課予國家積極給付之義務", "D": "國家廣設就業服務站，依據求職者之能力、興趣、專長，提供就業媒合，應屬上述規範之具體落實"}, "answer": "D", "explain": "憲法§152屬於基本國策，是國家的施政方針，人民不能據以向國家請求特定職缺或提起救濟，故A、B錯誤。工作權的憲法基礎在§15，而不是§152，故C錯誤。國家廣設就業服務站、辦理就業媒合，正是本條的具體落實，故選D。", "ref": "憲法§152、§15", "evidence": "人民具有工作能力者，國家應予以適當之工作機會。"}, {"id": "109-法學-14", "src": "old", "year": 109, "n": 14, "subject": "法學", "topic": "憲法", "stem": "依憲法及增修條文規定，下列何者不屬於憲法對文化事務之規定？", "opts": {"A": "國家應保護與歷史、文化、藝術相關之古蹟、古物", "B": "國家應維護發展原住民族語言及文化", "C": "私立文化機關於受國家補助時，方須依法律受國家監督", "D": "教育、科學、文化事務預算應優先編列"}, "answer": "C", "explain": "憲法§162規定，全國公私立教育文化機關一律依法律受國家監督，並不以受國家補助為前提，故C錯誤。A出自憲法§166；B出自增修§10Ⅺ；D依增修§10Ⅹ，教育、科學、文化經費應優先編列。", "ref": "憲法§162、§166；增修條文§10", "evidence": "全國公私立之教育文化機關，依法律受國家之監督。"}, {"id": "109-法學-15", "src": "old", "year": 109, "n": 15, "subject": "法學", "topic": "憲法", "stem": "下列何者尚未經大法官解釋為憲法第 22 條所保障之權利？", "opts": {"A": "名譽權", "B": "更改姓名之權利", "C": "隱私權", "D": "養寵物之自由"}, "answer": "D", "explain": "大法官已依憲法§22承認名譽權（釋字第656號）、姓名權（釋字第399號）、隱私權（釋字第585號、第603號）；養寵物的自由尚未有解釋將它列為§22保障的權利，故選D。", "ref": "憲法§22；釋字第399號、第585號、第656號", "evidence": "凡人民之其他自由及權利，不妨害社會秩序公共利益者，均受憲法之保障。"}, {"id": "109-法學-16", "src": "old", "year": 109, "n": 16, "subject": "法學", "topic": "法學緒論", "stem": "為落實聯合國兒童權利公約之內容，而制定之兒童權利公約施行法屬下列何種法源？", "opts": {"A": "條約", "B": "法律", "C": "憲法", "D": "習慣"}, "answer": "B", "explain": "「兒童權利公約施行法」是經立法院通過、總統公布的法律（中央法規標準法§2、§4），屬於成文法源中的「法律」；公約本身是條約，但施行法是國內法律，故選B。施行法賦予公約國內法效力，所以公約規定的法源地位是透過法律取得的。", "ref": "中央法規標準法§2、§4", "evidence": ""}, {"id": "109-法學-17", "src": "old", "year": 109, "n": 17, "subject": "法學", "topic": "法學緒論", "stem": "依地方制度法之規定，關於權限爭議之解決，下列何者錯誤？", "opts": {"A": "中央與直轄市、縣（市）間，權限遇有爭議時，由行政院解決", "B": "直轄市與縣（市）間，事權發生爭議時，由行政院解決", "C": "直轄市間，事權發生爭議時，由行政院解決", "D": "縣（市）間，事權發生爭議時，由中央各該主管機關解決"}, "answer": "A", "explain": "地方制度法§77：中央與直轄市、縣（市）間的權限爭議，由「立法院院會議決之」，不是由行政院解決，故A錯誤。直轄市間、直轄市與縣（市）間的事權爭議由行政院解決；縣（市）間由中央各該主管機關解決，所以B、C、D都正確。這也對應憲法§111剩餘權爭議由立法院解決的規定。", "ref": "地方制度法§77；憲法§111", "evidence": "有一縣之性質者屬於縣。遇有爭議時，由立法院解決之。"}, {"id": "109-法學-18", "src": "old", "year": 109, "n": 18, "subject": "法學", "topic": "法學緒論", "stem": "臺中市政府為減少碳排放量並推動能源轉型，研擬要求用電量達一定度數以上之用戶裝設再生能源系統，向臺中市議會提案制定法規，本法規應屬下列何者？", "opts": {"A": "職權命令", "B": "自治條例", "C": "自治規則", "D": "委辦規則"}, "answer": "B", "explain": "依地方制度法§25、§26，自治法規經地方立法機關通過，並由各該行政機關公布者，稱為自治條例；設定人民義務（強制裝設再生能源設備）應以自治條例定之（§28），故選B。自治規則、委辦規則都是由行政機關訂定。", "ref": "地方制度法§25、§26、§28", "evidence": ""}, {"id": "109-法學-19", "src": "old", "year": 109, "n": 19, "subject": "法學", "topic": "法學緒論", "stem": "法律定有施行期限，主管機關認為需要延長者，應遵循下列何種程序？", "opts": {"A": "無法延長，僅能重新制訂新法", "B": "應於期限屆滿一個月前送立法院審議", "C": "經行政院核定後報請總統公布延長", "D": "由主管機關自行訂定職權命令延長"}, "answer": "B", "explain": "中央法規標準法§24Ⅰ：法律定有施行期限，主管機關認為需要延長時，應於期限屆滿一個月前送立法院審議，故選B。命令需要延長時，依同條第2項，應於期限屆滿一個月前，由原發布機關發布。", "ref": "中央法規標準法§24", "evidence": ""}, {"id": "109-法學-20", "src": "old", "year": 109, "n": 20, "subject": "法學", "topic": "法學緒論", "stem": "依據中央法規標準法第 21 條之規定，下列何者並非法規廢止之事由？", "opts": {"A": "機關裁併，有關法規無保留之必要者", "B": "法規規定之事項已執行完畢，或因情勢變遷，無繼續施行之必要者", "C": "法規因有關法規之廢止或修正致失其依據，而無單獨施行之必要者", "D": "同一事項規定於二以上之法規，無分別存在之必要者"}, "answer": "D", "explain": "中央法規標準法§21規定的廢止事由有：機關裁併無保留必要；已執行完畢或因情勢變遷無繼續施行必要；因有關法規廢止或修正致失依據而無單獨施行必要；同一事項已定有新法規並公布施行。D「同一事項規定於二以上法規」不在其中，故選D。", "ref": "中央法規標準法§21", "evidence": ""}, {"id": "109-法學-21", "src": "old", "year": 109, "n": 21, "subject": "法學", "topic": "法學緒論", "stem": "有判決參照民法第 1 條「相類似之案件，應為相同處理」之法理，是採用下列何種法律適用方式？", "opts": {"A": "類推適用", "B": "文義解釋", "C": "目的性限縮", "D": "目的性擴張"}, "answer": "A", "explain": "「相類似之案件，應為相同處理」是類推適用的法理基礎：對於法律沒有規定的事項，比附援引性質相似事項的規定來適用，屬於填補法律漏洞的方法（民法§1所稱法理），故選A。", "ref": "民法§1", "evidence": ""}, {"id": "109-法學-22", "src": "old", "year": 109, "n": 22, "subject": "法學", "topic": "法學緒論", "stem": "有關行政處分作成前之聽證，下列敘述何者正確？", "opts": {"A": "主持人應經當事人雙方同意，始能終結聽證程序", "B": "行政機關作成行政處分前，遇有法規明文規定應舉行聽證時，始能舉行聽證", "C": "行政機關作成經聽證之行政處分時，應依聽證紀錄作成處分", "D": "不服經聽證作成之行政處分者，其行政救濟程序，免除訴願及其先行程序"}, "answer": "D", "explain": "行政程序法§109：不服依§108經聽證作成的行政處分，行政救濟程序免除訴願及其先行程序，故D正確。A依§65，由主持人認定終結即可，不需雙方同意；B依§107，行政機關認有必要時也可以舉行聽證；C依§108，應斟酌全部聽證結果，只有法規明定時才依聽證紀錄作成。", "ref": "行政程序法§107～§109", "evidence": ""}, {"id": "109-法學-23", "src": "old", "year": 109, "n": 23, "subject": "法學", "topic": "法學緒論", "stem": "依司法院大法官解釋意旨，有關藥害救濟法之立法，係為使正當使用合法藥物而受害者，獲得及時救濟。下列敘述何者錯誤？", "opts": {"A": "藥害救濟法之制定，實屬憲法社會國原則之體現", "B": "對於社會政策立法，因涉及國家資源分配，司法應採取嚴格審查", "C": "藥害救濟法之規定，涉及憲法對於國人健康權保障之實踐", "D": "針對「常見且可預期」之排除規定，造成病患無法請求救濟，尚無違比例原則"}, "answer": "B", "explain": "釋字第767號認為，藥害救濟法是社會國原則與健康權保障的體現；社會政策立法涉及國家資源分配，司法應採「寬鬆」審查，因此「常見且可預期」的排除規定不違反法律明確性與比例原則，故B錯誤。", "ref": "釋字第767號", "evidence": ""}, {"id": "109-法學-25", "src": "old", "year": 109, "n": 25, "subject": "法學", "topic": "法學緒論", "stem": "甲出租土地於乙，乙使用期間該土地被丙無權占有，乙可行使下列何種物上請求權？", "opts": {"A": "所有物返還請求權", "B": "所有權之妨害除去請求權", "C": "所有權之妨害預防請求權", "D": "占有物返還請求權"}, "answer": "D", "explain": "乙是承租人，對土地有直接占有，但不是所有權人，不能行使所有權的物上請求權（民法§767）。占有被侵奪時，可以依§962請求返還占有物，故選D。A、B、C都以所有權為前提，只有出租人甲才能行使。", "ref": "民法§962、§767", "evidence": ""}, {"id": "109-法學-26", "src": "old", "year": 109, "n": 26, "subject": "法學", "topic": "法學緒論", "stem": "商人甲未經女明星乙之同意，擅自以乙之肖像作為商業廣告而獲利。下列敘述何者錯誤？", "opts": {"A": "乙得向甲主張除去侵害請求權", "B": "乙得向甲主張侵害防止請求權", "C": "乙得依債務不履行之規定請求甲損害賠償", "D": "乙得依不當得利之規定請求甲獲利返還"}, "answer": "C", "explain": "擅自以他人肖像作商業廣告，侵害乙的人格權（肖像權）。乙可依民法§18請求除去侵害及防止侵害，並可依§184、§179請求損害賠償或返還不當得利。甲乙之間沒有契約關係，不會成立債務不履行，故C錯誤。", "ref": "民法§18、§184、§179", "evidence": ""}, {"id": "109-法學-28", "src": "old", "year": 109, "n": 28, "subject": "法學", "topic": "法學緒論", "stem": "於地檢署服務的書記官張三知道解送至地檢署的犯罪嫌疑人李四涉犯強制性交且拒絕承認，一時氣憤不過，便趁檢察官訊問的空檔，予以痛打一頓。下列敘述何者正確？", "opts": {"A": "張三犯刑法第 125 條的意圖取供而施強暴脅迫罪", "B": "張三犯刑法第 277 條第 1 項的普通傷害罪，並因第 134 條加重其刑二分之一", "C": "張三犯刑法第 279 條的義憤傷害罪", "D": "張三犯刑法第 126 條第 1 項凌虐人犯罪"}, "answer": "B", "explain": "張三並非有追訴或審判職務的公務員，不成立§125；也不是有管收、解送、拘禁人犯職務的公務員，不成立§126；非當場激於義憤，不成立§279。他是公務員，假借職務上的機會故意傷害他人，應論普通傷害罪（§277Ⅰ，108年修法提高法定刑），並依§134加重其刑至二分之一，故選B。", "ref": "刑法§277、§134", "evidence": ""}, {"id": "109-法學-29", "src": "old", "year": 109, "n": 29, "subject": "法學", "topic": "法學緒論", "stem": "某大學之甲學生(下稱甲生)與乙學生(下稱乙生)均自誇其對公司法研究透徹，下列乃該二學生對公司法規定之陳述，何者為錯誤？", "opts": {"A": "甲生謂：公司非在中央主管機關登記後，不得成立", "B": "甲生謂：公司法所稱主管機關：在中央為財政部", "C": "乙生謂：股份有限公司，係指二人以上股東或政府、法人股東一人所組織，全部資本分為股份；股東就其所認股份，對公司負其責任之公司", "D": "乙生謂：公司法所稱分公司，為受本公司管轄之分支機構"}, "answer": "B", "explain": "公司法§5Ⅰ：本法所稱主管機關，在中央為經濟部，不是財政部，故B錯誤。A依§6，公司非在中央主管機關登記後不得成立；C依§2Ⅰ④，股份有限公司的定義；D依§3Ⅱ，分公司是受本公司管轄的分支機構。", "ref": "公司法§5、§6、§2、§3", "evidence": ""}, {"id": "109-法學-30", "src": "old", "year": 109, "n": 30, "subject": "法學", "topic": "法學緒論", "stem": "依勞動基準法規定，雇主調動勞工工作時，除不得違反勞動契約之約定外，下列那一項規定非雇主應遵守之原則？", "opts": {"A": "對勞工之工資及其他勞動條件，未作重大之不利益變更", "B": "調動後之工作為勞工體能及技術可勝任", "C": "調動工作地點不論遠近，雇主應予以必要之協助", "D": "應考量勞工及其家庭之生活利益"}, "answer": "C", "explain": "勞動基準法§10-1調動五原則：基於企業經營上必要且無不當動機；對工資及其他勞動條件未作不利益變更；調動後工作為勞工體能及技術可勝任；調動工作地點過遠時，雇主應予必要協助；考量勞工及其家庭的生活利益。C「不論遠近」與「過遠」要件不符，故選C。另A條文用語為「不利益之變更」。", "ref": "勞動基準法§10-1", "evidence": ""}, {"id": "109-法學-31", "src": "old", "year": 109, "n": 31, "subject": "法學", "topic": "英文", "stem": "The earnings for registered nurses remain above average for college-educated women, though they have ____ in recent years.", "opts": {"A": "alienated", "B": "designated", "C": "illuminated", "D": "stagnated"}, "answer": "D", "explain": "stagnate＝停滯不前。句意：註冊護士的收入仍高於大學學歷女性的平均，但近年已停滯。though 表轉折，所以要選負面字。alienate（疏離）、illuminate（照亮）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "109-法學-32", "src": "old", "year": 109, "n": 32, "subject": "法學", "topic": "英文", "stem": "The prosecutor’s allegation against the suspect is invalid because it is largely based on ____ evidence.", "opts": {"A": "circular", "B": "circumstantial", "C": "authentic", "D": "environmental"}, "answer": "B", "explain": "circumstantial evidence＝間接證據、情況證據。句意：檢察官對嫌犯的指控無效，因為它大多建立在間接證據上。circular（循環的）、authentic（真實的）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "109-法學-33", "src": "old", "year": 109, "n": 33, "subject": "法學", "topic": "英文", "stem": "With a firm light tread, his heavy boots ____ a pleasant smell of tar and fresh winter air.", "opts": {"A": "exhumed", "B": "emitted", "C": "exhausted", "D": "embossed"}, "answer": "B", "explain": "emit＝散發（氣味、光、熱）。句意：他腳步輕快而穩健，厚重的靴子散發出宜人的焦油味與冬天清新的空氣。exhume（挖掘屍體）、exhaust（耗盡）、emboss（浮雕）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "109-法學-34", "src": "old", "year": 109, "n": 34, "subject": "法學", "topic": "英文", "stem": "Mr. Johnson usually ____ his dirty clothes for a couple of days before sending them to the laundry-shop.", "opts": {"A": "acclaims", "B": "acclimates", "C": "accommodates", "D": "accumulates"}, "answer": "D", "explain": "accumulate＝累積、堆積。句意：Johnson先生通常把髒衣服堆放幾天，才送去洗衣店。acclaim（喝采）、acclimate（使適應）、accommodate（容納）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "109-法學-35", "src": "old", "year": 109, "n": 35, "subject": "法學", "topic": "英文", "stem": "The little boy ____ his mom’s legs and cried out loud as she tried to leave for work.", "opts": {"A": "dug under", "B": "clung to", "C": "yielded to", "D": "grew under"}, "answer": "B", "explain": "cling to＝緊抓不放（過去式 clung）。句意：媽媽要出門上班時，小男孩緊抱著她的腿大哭。yield to（屈服）、dig under（向下挖）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "109-法學-36", "src": "old", "year": 109, "n": 36, "subject": "法學", "topic": "英文", "stem": "The Spanish embrace is a _____ of greeting, often accompanied by verbal behavior.", "opts": {"A": "gesture", "B": "venture", "C": "creature", "D": "texture"}, "answer": "A", "explain": "gesture＝姿態、表示。a gesture of greeting＝一種問候的肢體表示。句意：西班牙式擁抱是一種問候姿態，常伴隨口語。venture（冒險）、texture（質地）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "109-法學-37", "src": "old", "year": 109, "n": 37, "subject": "法學", "topic": "英文", "stem": "When it continues raining heavily over time, plenty of water will ____ the soil.", "opts": {"A": "inhabitate", "B": "infiltrate", "C": "interpolate", "D": "ingratiate"}, "answer": "B", "explain": "infiltrate＝滲入、滲透。句意：持續大雨時，大量雨水會滲入土壤。interpolate（插入）、ingratiate（討好）都不合語意；inhabitate 並非正確的英文字。", "ref": "英文", "evidence": ""}, {"id": "109-法學-38", "src": "old", "year": 109, "n": 38, "subject": "法學", "topic": "英文", "stem": "Cardboard has recyclable and biodegradable properties, and it is also an ____ material that absorbs sound in a noisy environment.", "opts": {"A": "inclusive", "B": "isolated", "C": "immediate", "D": "insulating"}, "answer": "D", "explain": "insulating material＝隔絕（隔音、隔熱）材料。句意：紙板可回收、可生物分解，也是在吵雜環境中能吸音的隔音材料。isolated（孤立的）、inclusive（包容的）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "109-法學-39", "src": "old", "year": 109, "n": 39, "subject": "法學", "topic": "英文", "stem": "Mutation, migration, genetic drift and natural selection are the basic ____ of evolutionary change.", "opts": {"A": "machines", "B": "machineries", "C": "mechanics", "D": "mechanisms"}, "answer": "D", "explain": "mechanism＝機制。句意：突變、遷移、遺傳漂變與天擇是演化改變的基本機制。machinery（機械）、mechanics（力學）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "109-法學-40", "src": "old", "year": 109, "n": 40, "subject": "法學", "topic": "英文", "stem": "A recovered copy of Shakespeare’s First Folio, one of the most ____ books in all of English literature, is headed to London’s Globe Theater.", "opts": {"A": "coveted", "B": "diverted", "C": "entitled", "D": "dedicated"}, "answer": "A", "explain": "coveted＝令人垂涎、夢寐以求的。句意：莎士比亞《第一對開本》是英國文學中最受珍視的書籍之一，其尋回的一本將送往倫敦環球劇場。diverted（轉向的）、dedicated（奉獻的）都不合語意。", "ref": "英文", "evidence": ""}, {"id": "109-法學-41", "src": "old", "year": 109, "n": 41, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "reduced", "B": "repeated", "C": "reproduced", "D": "represented"}, "answer": "D", "explain": "represent＝代表、呈現。句意：這些富含意義與歷史的紋樣，代表一種曾遍布中東與北非鄉村的臉部刺青風格。reduce（減少）、reproduce（複製）都不合語意。", "ref": "英文", "evidence": "", "passage": "As a young girl, Yumna Al-Arashi would look with fascination upon the dots, lines and symbols that graced her\nYemeni great-grandmother’s face. Rich with meaning and history, the markings 41 a style of facial tattoo once\nfound across rural communities in the Middle East and North Africa. Yet as Al-Arashi grew older and learned more\nabout the practice, she discovered it was a tradition few young women seemed 42 on continuing. Intrigued, the\nLondon-based photographer of Egyptian-Yemeni descent resolved to document what remained of the practice and\nexplore why its popularity had 43 . Nearly all of the women she encountered loved their tattoos and considered\nthem to be 44 of beauty, in much the same way younger generations of women enjoy makeup. While some\ntattoos appeared to be astrological motifs, others 45 symbols of protection from superstitions. She collected\nportraits of 100 women over the age of 70 on her journey, many of whom were farmers or fisherwomen."}, {"id": "109-法學-42", "src": "old", "year": 109, "n": 42, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "keen", "B": "intent", "C": "dependent", "D": "undertemined"}, "answer": "B", "explain": "be intent on＝決心、熱衷於（後接 V-ing）。句意：她發現很少年輕女性有意延續這項傳統。官方答案為B；keen on 的語意也近似，作答時以官方答案 intent 為準。dependent on 意思是「依賴」，不合語意。", "ref": "英文", "evidence": "", "passage": "As a young girl, Yumna Al-Arashi would look with fascination upon the dots, lines and symbols that graced her\nYemeni great-grandmother’s face. Rich with meaning and history, the markings 41 a style of facial tattoo once\nfound across rural communities in the Middle East and North Africa. Yet as Al-Arashi grew older and learned more\nabout the practice, she discovered it was a tradition few young women seemed 42 on continuing. Intrigued, the\nLondon-based photographer of Egyptian-Yemeni descent resolved to document what remained of the practice and\nexplore why its popularity had 43 . Nearly all of the women she encountered loved their tattoos and considered\nthem to be 44 of beauty, in much the same way younger generations of women enjoy makeup. While some\ntattoos appeared to be astrological motifs, others 45 symbols of protection from superstitions. She collected\nportraits of 100 women over the age of 70 on her journey, many of whom were farmers or fisherwomen."}, {"id": "109-法學-43", "src": "old", "year": 109, "n": 43, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "waned", "B": "increased", "C": "boosted", "D": "neutralized"}, "answer": "A", "explain": "wane＝衰退、減弱。句意：她決心記錄此習俗的遺存，並探討它為何不再流行。前文提到年輕女性不願延續，所以選負面字；increase、boost（提升）都相反。", "ref": "英文", "evidence": "", "passage": "As a young girl, Yumna Al-Arashi would look with fascination upon the dots, lines and symbols that graced her\nYemeni great-grandmother’s face. Rich with meaning and history, the markings 41 a style of facial tattoo once\nfound across rural communities in the Middle East and North Africa. Yet as Al-Arashi grew older and learned more\nabout the practice, she discovered it was a tradition few young women seemed 42 on continuing. Intrigued, the\nLondon-based photographer of Egyptian-Yemeni descent resolved to document what remained of the practice and\nexplore why its popularity had 43 . Nearly all of the women she encountered loved their tattoos and considered\nthem to be 44 of beauty, in much the same way younger generations of women enjoy makeup. While some\ntattoos appeared to be astrological motifs, others 45 symbols of protection from superstitions. She collected\nportraits of 100 women over the age of 70 on her journey, many of whom were farmers or fisherwomen."}, {"id": "109-法學-44", "src": "old", "year": 109, "n": 44, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "markers", "B": "thinkers", "C": "restrictions", "D": "regulations"}, "answer": "A", "explain": "markers of beauty＝美的標記、象徵。句意：幾乎所有受訪女性都喜愛自己的刺青，視為美的象徵，就像年輕世代喜愛化妝。thinkers（思想家）、restrictions（限制）都不合語意。", "ref": "英文", "evidence": "", "passage": "As a young girl, Yumna Al-Arashi would look with fascination upon the dots, lines and symbols that graced her\nYemeni great-grandmother’s face. Rich with meaning and history, the markings 41 a style of facial tattoo once\nfound across rural communities in the Middle East and North Africa. Yet as Al-Arashi grew older and learned more\nabout the practice, she discovered it was a tradition few young women seemed 42 on continuing. Intrigued, the\nLondon-based photographer of Egyptian-Yemeni descent resolved to document what remained of the practice and\nexplore why its popularity had 43 . Nearly all of the women she encountered loved their tattoos and considered\nthem to be 44 of beauty, in much the same way younger generations of women enjoy makeup. While some\ntattoos appeared to be astrological motifs, others 45 symbols of protection from superstitions. She collected\nportraits of 100 women over the age of 70 on her journey, many of whom were farmers or fisherwomen."}, {"id": "109-法學-45", "src": "old", "year": 109, "n": 45, "subject": "法學", "topic": "英文", "stem": "", "opts": {"A": "posed as", "B": "served as", "C": "reversed into", "D": "transformed into"}, "answer": "B", "explain": "serve as＝作為、充當。句意：有些刺青似乎是占星圖案，另一些則作為抵禦迷信災厄的護身符號。pose as（冒充）、transform into（轉變成）都不合語意。", "ref": "英文", "evidence": "", "passage": "As a young girl, Yumna Al-Arashi would look with fascination upon the dots, lines and symbols that graced her\nYemeni great-grandmother’s face. Rich with meaning and history, the markings 41 a style of facial tattoo once\nfound across rural communities in the Middle East and North Africa. Yet as Al-Arashi grew older and learned more\nabout the practice, she discovered it was a tradition few young women seemed 42 on continuing. Intrigued, the\nLondon-based photographer of Egyptian-Yemeni descent resolved to document what remained of the practice and\nexplore why its popularity had 43 . Nearly all of the women she encountered loved their tattoos and considered\nthem to be 44 of beauty, in much the same way younger generations of women enjoy makeup. While some\ntattoos appeared to be astrological motifs, others 45 symbols of protection from superstitions. She collected\nportraits of 100 women over the age of 70 on her journey, many of whom were farmers or fisherwomen."}, {"id": "109-法學-46", "src": "old", "year": 109, "n": 46, "subject": "法學", "topic": "英文", "stem": "What is the passage mainly about?", "opts": {"A": "New evidence of how the Titanic sank.", "B": "The futility of human ambition in history.", "C": "The perceptions of the Titanic at its time.", "D": "The faulty design that sank the Titanic."}, "answer": "C", "explain": "全文討論鐵達尼號在當時被如何看待：是否真被稱為「永不沉沒」、人們重視的是奢華而非安全，故主旨是C「當時人們對鐵達尼號的觀感」。A、D講沉船原因，本文並未討論。", "ref": "英文", "evidence": "", "passage": "You probably know the story of the great irony of the Titanic. The ship hailed as “unsinkable” sank after it struck\nan iceberg on its very first trip across the Atlantic Ocean. In hindsight, it seems almost silly that anyone would assume\nthat a ship weighing more than 50,000 tons (when fully laden) was unsinkable. And indeed, many myth busters have\nclaimed that few people were actually calling the ship “unsinkable” before it sank.\nWhile it is hard to say whether people thought the ship was absolutely unsinkable under any circumstances, it is\nclear that people believed that the passenger liner’s safety design (by Thomas Andrews) was state-of-the-art, and some\ndid describe it as “unsinkable” before it ever set sail. Reportedly, that claim was enough to keep many passengers calm\neven as the ship was in fact sinking. A vice president of the company in charge of the voyage told the U.S. Congress\nthat he initially did not believe reports that the ship was sinking because he thought it to be unsinkable.\nThe idea that the ship was unsinkable was advanced by newspaper and magazine articles as well as by\nadvertisement materials from the shipping company. The widely circulated articles detailed the design of the liner and\nits technologically advanced safety features. Chief among those features were 16 compartments within the hull whose\ndoors could be shut by the flick of a switch. It was believed that the ability to quickly close off the compartments if any\nof them were breached could keep the ship afloat even if it suffered damage.\nThough it’s an exaggeration to claim that nobody thought the ship unsinkable, it may be true that, before the\nTitanic sank, people were not particularly interested in whether the ship was unsinkable. The Titanic’s selling point\nwas really its grandeur and luxury, not its safety. Most of the articles and advertisements for the Titanic focused on its\nsize and accommodations, not on the details of its design, and the affluent passengers who boarded the ship chose it for\nits prestige and comfort. It was only after the ship’s demise that the “unsinkable” moniker really took off, presumably\nfor dramatic effect. So even though the ship was in fact touted as “unsinkable” before it sank, it was the irony of its\ntragic sinking that actually brought that claim to the fore."}, {"id": "109-法學-47", "src": "old", "year": 109, "n": 47, "subject": "法學", "topic": "英文", "stem": "What commonly-held false idea has been challenged?", "opts": {"A": "The sinking of the ship was caused by a mysterious force.", "B": "Many people at that time claimed that the ship was unsinkable.", "C": "The gigantic ship sank as a result of hitting an iceberg.", "D": "The considerable weight of the ship was the cause of its sinking."}, "answer": "B", "explain": "文章質疑一般人以為「當時很多人都宣稱此船永不沉沒」的印象：作者指出沉船前人們其實不太關心它是否不沉，賣點是豪華，「unsinkable」這個稱號是在沉船後才流行起來，故選B。", "ref": "英文", "evidence": "", "passage": "You probably know the story of the great irony of the Titanic. The ship hailed as “unsinkable” sank after it struck\nan iceberg on its very first trip across the Atlantic Ocean. In hindsight, it seems almost silly that anyone would assume\nthat a ship weighing more than 50,000 tons (when fully laden) was unsinkable. And indeed, many myth busters have\nclaimed that few people were actually calling the ship “unsinkable” before it sank.\nWhile it is hard to say whether people thought the ship was absolutely unsinkable under any circumstances, it is\nclear that people believed that the passenger liner’s safety design (by Thomas Andrews) was state-of-the-art, and some\ndid describe it as “unsinkable” before it ever set sail. Reportedly, that claim was enough to keep many passengers calm\neven as the ship was in fact sinking. A vice president of the company in charge of the voyage told the U.S. Congress\nthat he initially did not believe reports that the ship was sinking because he thought it to be unsinkable.\nThe idea that the ship was unsinkable was advanced by newspaper and magazine articles as well as by\nadvertisement materials from the shipping company. The widely circulated articles detailed the design of the liner and\nits technologically advanced safety features. Chief among those features were 16 compartments within the hull whose\ndoors could be shut by the flick of a switch. It was believed that the ability to quickly close off the compartments if any\nof them were breached could keep the ship afloat even if it suffered damage.\nThough it’s an exaggeration to claim that nobody thought the ship unsinkable, it may be true that, before the\nTitanic sank, people were not particularly interested in whether the ship was unsinkable. The Titanic’s selling point\nwas really its grandeur and luxury, not its safety. Most of the articles and advertisements for the Titanic focused on its\nsize and accommodations, not on the details of its design, and the affluent passengers who boarded the ship chose it for\nits prestige and comfort. It was only after the ship’s demise that the “unsinkable” moniker really took off, presumably\nfor dramatic effect. So even though the ship was in fact touted as “unsinkable” before it sank, it was the irony of its\ntragic sinking that actually brought that claim to the fore."}, {"id": "109-法學-48", "src": "old", "year": 109, "n": 48, "subject": "法學", "topic": "英文", "stem": "According to the passage, what might make some people believe in the ship’s unsinkability?", "opts": {"A": "Its safety design was the newest and most advanced at its time.", "B": "There were reports about how the ship had endured many adverse situations.", "C": "The ship designer and the company were making such a claim.", "D": "Its sheer size and beauty easily gave people such an impression."}, "answer": "A", "explain": "第二段指出人們相信這艘郵輪的安全設計是最先進的（state-of-the-art），有些人因此稱它永不沉沒，故選A：其安全設計是當時最新、最先進的。", "ref": "英文", "evidence": "", "passage": "You probably know the story of the great irony of the Titanic. The ship hailed as “unsinkable” sank after it struck\nan iceberg on its very first trip across the Atlantic Ocean. In hindsight, it seems almost silly that anyone would assume\nthat a ship weighing more than 50,000 tons (when fully laden) was unsinkable. And indeed, many myth busters have\nclaimed that few people were actually calling the ship “unsinkable” before it sank.\nWhile it is hard to say whether people thought the ship was absolutely unsinkable under any circumstances, it is\nclear that people believed that the passenger liner’s safety design (by Thomas Andrews) was state-of-the-art, and some\ndid describe it as “unsinkable” before it ever set sail. Reportedly, that claim was enough to keep many passengers calm\neven as the ship was in fact sinking. A vice president of the company in charge of the voyage told the U.S. Congress\nthat he initially did not believe reports that the ship was sinking because he thought it to be unsinkable.\nThe idea that the ship was unsinkable was advanced by newspaper and magazine articles as well as by\nadvertisement materials from the shipping company. The widely circulated articles detailed the design of the liner and\nits technologically advanced safety features. Chief among those features were 16 compartments within the hull whose\ndoors could be shut by the flick of a switch. It was believed that the ability to quickly close off the compartments if any\nof them were breached could keep the ship afloat even if it suffered damage.\nThough it’s an exaggeration to claim that nobody thought the ship unsinkable, it may be true that, before the\nTitanic sank, people were not particularly interested in whether the ship was unsinkable. The Titanic’s selling point\nwas really its grandeur and luxury, not its safety. Most of the articles and advertisements for the Titanic focused on its\nsize and accommodations, not on the details of its design, and the affluent passengers who boarded the ship chose it for\nits prestige and comfort. It was only after the ship’s demise that the “unsinkable” moniker really took off, presumably\nfor dramatic effect. So even though the ship was in fact touted as “unsinkable” before it sank, it was the irony of its\ntragic sinking that actually brought that claim to the fore."}, {"id": "109-法學-49", "src": "old", "year": 109, "n": 49, "subject": "法學", "topic": "英文", "stem": "What was advertised as a safety feature that could prevent the ship from going down after a collision?", "opts": {"A": "The ship’s body was built by using the most advanced materials.", "B": "Some sections in the ship could be blocked off quickly if there were holes.", "C": "Several guest rooms were controlled by a single switch to make them unbreakable.", "D": "There were spaces specially designed to keep floating in case of emergency."}, "answer": "B", "explain": "第三段說船體內有16個隔艙，艙門可一鍵關閉；若有隔艙破損，可以迅速封閉使船保持漂浮，故選B：船內部分區塊在破洞時可以迅速封閉。", "ref": "英文", "evidence": "", "passage": "You probably know the story of the great irony of the Titanic. The ship hailed as “unsinkable” sank after it struck\nan iceberg on its very first trip across the Atlantic Ocean. In hindsight, it seems almost silly that anyone would assume\nthat a ship weighing more than 50,000 tons (when fully laden) was unsinkable. And indeed, many myth busters have\nclaimed that few people were actually calling the ship “unsinkable” before it sank.\nWhile it is hard to say whether people thought the ship was absolutely unsinkable under any circumstances, it is\nclear that people believed that the passenger liner’s safety design (by Thomas Andrews) was state-of-the-art, and some\ndid describe it as “unsinkable” before it ever set sail. Reportedly, that claim was enough to keep many passengers calm\neven as the ship was in fact sinking. A vice president of the company in charge of the voyage told the U.S. Congress\nthat he initially did not believe reports that the ship was sinking because he thought it to be unsinkable.\nThe idea that the ship was unsinkable was advanced by newspaper and magazine articles as well as by\nadvertisement materials from the shipping company. The widely circulated articles detailed the design of the liner and\nits technologically advanced safety features. Chief among those features were 16 compartments within the hull whose\ndoors could be shut by the flick of a switch. It was believed that the ability to quickly close off the compartments if any\nof them were breached could keep the ship afloat even if it suffered damage.\nThough it’s an exaggeration to claim that nobody thought the ship unsinkable, it may be true that, before the\nTitanic sank, people were not particularly interested in whether the ship was unsinkable. The Titanic’s selling point\nwas really its grandeur and luxury, not its safety. Most of the articles and advertisements for the Titanic focused on its\nsize and accommodations, not on the details of its design, and the affluent passengers who boarded the ship chose it for\nits prestige and comfort. It was only after the ship’s demise that the “unsinkable” moniker really took off, presumably\nfor dramatic effect. So even though the ship was in fact touted as “unsinkable” before it sank, it was the irony of its\ntragic sinking that actually brought that claim to the fore."}, {"id": "109-法學-50", "src": "old", "year": 109, "n": 50, "subject": "法學", "topic": "英文", "stem": "Why does the author consider Titanic’s tragic sinking an irony in the conclusion of the passage?", "opts": {"A": "The advertisements at that time boasted the unsinkability of the Titanic.", "B": "The ship’s unsinkability was not really the center of attention before the accident.", "C": "The rich passengers on the ship considered safety the top priority.", "D": "The ship was believed to be sinkable only by some people at its time."}, "answer": "B", "explain": "結論指出沉船前人們其實不太在意它是否永不沉沒，賣點是豪華；是沉船的反諷才讓「永不沉沒」一詞流行。所以諷刺之處在於，沉沒前「永不沉沒」並不是焦點，故選B。", "ref": "英文", "evidence": "", "passage": "You probably know the story of the great irony of the Titanic. The ship hailed as “unsinkable” sank after it struck\nan iceberg on its very first trip across the Atlantic Ocean. In hindsight, it seems almost silly that anyone would assume\nthat a ship weighing more than 50,000 tons (when fully laden) was unsinkable. And indeed, many myth busters have\nclaimed that few people were actually calling the ship “unsinkable” before it sank.\nWhile it is hard to say whether people thought the ship was absolutely unsinkable under any circumstances, it is\nclear that people believed that the passenger liner’s safety design (by Thomas Andrews) was state-of-the-art, and some\ndid describe it as “unsinkable” before it ever set sail. Reportedly, that claim was enough to keep many passengers calm\neven as the ship was in fact sinking. A vice president of the company in charge of the voyage told the U.S. Congress\nthat he initially did not believe reports that the ship was sinking because he thought it to be unsinkable.\nThe idea that the ship was unsinkable was advanced by newspaper and magazine articles as well as by\nadvertisement materials from the shipping company. The widely circulated articles detailed the design of the liner and\nits technologically advanced safety features. Chief among those features were 16 compartments within the hull whose\ndoors could be shut by the flick of a switch. It was believed that the ability to quickly close off the compartments if any\nof them were breached could keep the ship afloat even if it suffered damage.\nThough it’s an exaggeration to claim that nobody thought the ship unsinkable, it may be true that, before the\nTitanic sank, people were not particularly interested in whether the ship was unsinkable. The Titanic’s selling point\nwas really its grandeur and luxury, not its safety. Most of the articles and advertisements for the Titanic focused on its\nsize and accommodations, not on the details of its design, and the affluent passengers who boarded the ship chose it for\nits prestige and comfort. It was only after the ship’s demise that the “unsinkable” moniker really took off, presumably\nfor dramatic effect. So even though the ship was in fact touted as “unsinkable” before it sank, it was the irony of its\ntragic sinking that actually brought that claim to the fore."}, {"id": "111-刑事法-01", "src": "old", "year": 111, "n": 1, "subject": "刑事法", "topic": "刑法", "stem": "有關罪刑法定原則各項派生原則的敘述，下列何者正確？", "opts": {"A": "行為後裁判見解的變更結果如對行為人更不利，應已違背回溯禁止原則", "B": "依據習慣法禁止原則，法院不得依習慣法創設對行為人更為不利之罪或刑", "C": "法院判決將胎兒類推適用為自然人，並認定墮胎行為構成故意殺人罪，並不違反類推適用禁止原則", "D": "法條文義如非一般受規範者所難以理解或預見，亦不違背法律明確性原則"}, "answer": "B", "explain": "罪刑法定原則禁止以習慣法創設或加重刑罰，故B正確。A：回溯禁止針對「法律」變更，裁判見解變更並不違反（實務見解）。C：把胎兒比附為「人」而論殺人罪，屬不利於行為人的類推，違反類推禁止。D：明確性原則須同時符合「受規範者可理解、可預見，且可經司法審查確認」三要件，D只講前兩項、漏了司法審查確認，所以不完整。", "ref": "刑法§1、學說", "evidence": "行為之處罰，以行為時之法律有明文規定者為限"}, {"id": "111-刑事法-02", "src": "old", "year": 111, "n": 2, "subject": "刑事法", "topic": "刑法", "stem": "有關刑法上的客體錯誤，下列敘述何者正確？", "opts": {"A": "甲持刀殺乙，甲事後始知乙為其生父，甲對行為客體之身分有所誤認，故甲之行為構成過失致死罪", "B": "丙誤認不相識的丁為仇人而殺之，對行為對象有所誤認，故丙之行為構成過失致死罪", "C": "戊將鄰居小孩誤認為狗而殺之，對行為客體性質有所誤認，故戊之行為構成過失致死罪", "D": "己欲殺害仇人之小孩，卻誤將仇人的寵物狗誤認為其小孩而殺之，對行為客體性質有所誤認，故己之行為構成過失致死罪"}, "answer": "C", "explain": "客體錯誤要看「等價」與否。C：戊誤把小孩當成狗，主觀上只有殺狗（毀損）的故意，對「人」沒有殺人故意，但有預見可能，所以成立過失致死罪。A、B：都是人對人的等價客體錯誤，不影響殺人故意，成立殺人既遂。D：己想殺人卻殺了狗，應論殺人未遂（毀損罪不罰過失），並不是過失致死。", "ref": "學說（刑法§13、§276）", "evidence": ""}, {"id": "111-刑事法-03", "src": "old", "year": 111, "n": 3, "subject": "刑事法", "topic": "刑法", "stem": "依我國刑法之規定，下列何者之行為不罰？", "opts": {"A": "16 歲之甲為殺人行為", "B": "雙眼失明之乙為詐欺行為", "C": "警察丙依刑事訴訟法規定逮捕現行犯之行為", "D": "82 歲之丁為竊盜行為"}, "answer": "C", "explain": "警察依刑事訴訟法逮捕現行犯，屬於刑法§21第1項「依法令之行為」，可以阻卻違法，所以不罰（C）。A：16歲依§18第2項只是「得減輕」。B：刑法§20只規定瘖啞人得減輕，失明不在其列，照樣處罰。D：滿80歲依§18第3項也只是得減輕其刑。", "ref": "刑法§21", "evidence": "依法令之行為，不罰。"}, {"id": "111-刑事法-04", "src": "old", "year": 111, "n": 4, "subject": "刑事法", "topic": "刑法", "stem": "下列物品中，何者法院不得宣告沒收？", "opts": {"A": "違禁物變得之物", "B": "供犯罪所用之物", "C": "未實際合法發還被害人之犯罪所得", "D": "犯罪所生之物"}, "answer": "A", "explain": "沒收客體包括：違禁物（§38Ⅰ）、供犯罪所用或犯罪所生之物（§38Ⅱ）、犯罪所得及其「變得之物」（§38-1Ⅳ）。法律並沒有規定可以沒收「違禁物的變得之物」，所以A不得沒收。C：只有已經「實際合法發還」被害人的犯罪所得，才依§38-1Ⅴ不宣告沒收；還沒發還的，仍應沒收。", "ref": "刑法§38、§38-1", "evidence": "犯罪所得已實際合法發還被害人者，不予宣告沒收或追徵。"}, {"id": "111-刑事法-05", "src": "old", "year": 111, "n": 5, "subject": "刑事法", "topic": "刑法", "stem": "依刑法規定及司法院釋字第 775 號解釋，下列何者非累犯之成立要件？", "opts": {"A": "行為人之特別惡性", "B": "加重刑罰對於社會大眾的威嚇效應", "C": "行為人對於刑罰之反應力顯然薄弱", "D": "受徒刑之執行完畢，5 年以內故意再犯有期徒刑以上之罪"}, "answer": "B", "explain": "累犯的要件是§47：徒刑執行完畢後5年內，故意再犯有期徒刑以上之罪（D）。釋字775號另外要求個案審查行為人是否有特別惡性、對刑罰的反應力是否顯然薄弱（A、C）。加重刑罰對社會大眾的威嚇效應屬於一般預防的考量，並不是累犯的成立要件，所以選B。", "ref": "刑法§47、釋字775", "evidence": "受徒刑之執行完畢，或一部之執行而赦免後，五年以內故意再犯有期徒刑以上之罪者，為累犯"}, {"id": "111-刑事法-06", "src": "old", "year": 111, "n": 6, "subject": "刑事法", "topic": "刑法", "stem": "下列何者之行為人不成立教唆犯？", "opts": {"A": "甲唆使本無殺人意思之 18 歲乙殺死丙，隔日乙因此持刀刺殺丙", "B": "甲唆使本無殺人意思之 13 歲乙殺死丙，隔日乙因此持刀刺殺丙", "C": "甲告訴本無殺人意思之 18 歲乙心情不好就去犯個罪，隔日乙遂持刀刺殺丙", "D": "甲唆使本無殺人意思且有重度精神障礙之乙殺死丙，隔日乙遂在此狀態中持刀刺殺丙"}, "answer": "C", "explain": "教唆犯須使本無犯意之人對「特定犯罪」產生犯意。C：甲只泛稱「去犯個罪」，未特定犯罪內容，乙殺丙之決意並非甲所引起之特定犯罪，甲不成立殺人罪之教唆。A、B、D依現行限制從屬形式，正犯行為具構成要件該當且違法即可，未滿14歲或精神障礙者雖無責任，教唆者仍可成立教唆犯（亦可能論間接正犯）。", "ref": "刑法§29、學說", "evidence": "教唆他人使之實行犯罪行為者，為教唆犯。"}, {"id": "111-刑事法-07", "src": "old", "year": 111, "n": 7, "subject": "刑事法", "topic": "刑法", "stem": "依照我國現行實務見解，下列何者之行為人甲不具備不真正不作為犯的保證人地位？", "opts": {"A": "大學生甲對其宿舍室友乙", "B": "甲父對於其面前落水之 3 歲幼子乙", "C": "大學生甲自願無償擔任乙家保母照顧嬰兒丙", "D": "登險峻高山之嚮導甲對所率登山隊員"}, "answer": "A", "explain": "保證人地位的來源有：法令（父母對子女，B）、自願承擔保護義務（無償擔任保母，C）、危險共同體或危險領域的管理人（登山嚮導，D）等。大學室友只是一起住，彼此之間沒有法定或事實上的保護義務，一般不認為有保證人地位，所以選A。", "ref": "刑法§15、學說", "evidence": ""}, {"id": "111-刑事法-08", "src": "old", "year": 111, "n": 8, "subject": "刑事法", "topic": "刑法", "stem": "甲依其原本之犯罪決意持球棒毆打乙數下後，決定將僅頭部受傷之乙殺害，乃繼續持棒毆打乙致死。試問若依我國現行刑法與實務見解，甲之行為應論下列何罪？", "opts": {"A": "重傷罪及殺人罪", "B": "重傷致死罪", "C": "傷害致死罪", "D": "殺人罪"}, "answer": "D", "explain": "實務見解認為，行為人在實行中犯意升高（由傷害提升為殺人），前面的傷害行為被後面的殺人行為吸收，只論一個殺人罪（D）。這種情形不是傷害致死或重傷致死這類加重結果犯，因為結果是出於殺人故意；也不和殺人罪數罪併罰。", "ref": "刑法§271、實務", "evidence": ""}, {"id": "111-刑事法-09", "src": "old", "year": 111, "n": 9, "subject": "刑事法", "topic": "刑法", "stem": "甲竊取乙之賽鴿後向乙要求交付新臺幣（以下同）3 萬元始返還賽鴿，並揚言若不從將殺害賽鴿，乙因此心生恐懼，乃依甲指示交付 3 萬元現金。試問依我國現行實務見解，甲之行為成立何種犯罪？", "opts": {"A": "甲之行為成立竊盜罪及恐嚇取財罪", "B": "甲之行為僅成立恐嚇取財罪", "C": "甲之行為僅成立竊盜罪", "D": "甲之行為僅成立詐欺罪"}, "answer": "A", "explain": "甲先竊取賽鴿，竊盜罪已經既遂；後來又另外起意，用「不給錢就殺鴿」恐嚇乙交付3萬元，侵害的是新的財產法益，實務上另外成立§346恐嚇取財罪，兩罪數罪併罰（A）。這不是竊盜後處分贓物的不罰後行為，也沒有施用詐術，所以不是詐欺。", "ref": "刑法§320、§346", "evidence": "意圖為自己或第三人不法之所有，以恐嚇使人將本人或第三人之物交付者"}, {"id": "111-刑事法-10", "src": "old", "year": 111, "n": 10, "subject": "刑事法", "topic": "刑法", "stem": "派出所警員甲收受在他人警勤區之違法砂石場業者乙提供賄賂，因此不予舉發取締。試問依我國現行實務見解，甲之行為應成立下列何種犯罪？", "opts": {"A": "刑法第 122 條第 1 項違背職務收賄罪", "B": "刑法第 121 條不違背職務收賄罪", "C": "刑法第 131 條圖利罪", "D": "刑法第 127 條第 1 項違法不執行刑罰罪"}, "answer": "A", "explain": "實務認為，警察有查緝全國犯罪的一般職權，不因為案件不在自己的警勤區就沒有職務。甲收賄後故意不舉發違法砂石場，是對「違背職務之行為」收受賄賂，成立§122第1項（A）。§121是針對不違背職務的行為；圖利罪須圖私人不法利益且因而獲利；§127只適用於執行刑罰的公務員。", "ref": "刑法§122", "evidence": "公務員或仲裁人對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者"}, {"id": "111-刑事法-11", "src": "old", "year": 111, "n": 11, "subject": "刑事法", "topic": "刑法", "stem": "下列何種情況不成立刑法第 316 條之妨害秘密罪？", "opts": {"A": "律師將當事人之個人資料提供予記者", "B": "醫師將患者之病歷提供予記者", "C": "會計師將法人客戶之帳務資料提供予記者", "D": "高中教師將自己任教課班級學生之談話提供予學生之父母"}, "answer": "D", "explain": "§316洩漏業務上知悉他人秘密罪的主體有限定，只包括醫師、藥師、藥商、助產士、心理師、宗教師、律師、辯護人、公證人、會計師及其業務上佐理人，律師、醫師、會計師都在其中（A、B、C成罪）。高中教師不在列舉範圍，所以D不成立本罪。", "ref": "刑法§316", "evidence": "醫師、藥師、藥商、助產士、心理師、宗教師、律師、辯護人、公證人、會計師或其業務上佐理人"}, {"id": "111-刑事法-12", "src": "old", "year": 111, "n": 12, "subject": "刑事法", "topic": "刑法", "stem": "銀行經理甲與某公司董事長乙基於共謀，由甲指示銀行職員核准鉅額無擔保貸款給乙經營之公司。試問依我國現行實務見解，乙應成立下列何種犯罪？", "opts": {"A": "刑法第 342 條第 1 項背信罪之間接正犯", "B": "刑法第 342 條第 1 項背信罪之教唆犯", "C": "刑法第 342 條第 1 項背信罪之共同正犯", "D": "刑法第 342 條第 1 項背信罪之幫助犯"}, "answer": "C", "explain": "背信罪以「為他人處理事務」為身分要件。乙雖然沒有這個身分，但與有身分的銀行經理甲共謀，並共同實行違背任務的行為，依§31第1項仍論為共同正犯，只是得減輕其刑（C）。乙直接參與謀議與犯行，不是間接正犯，也不只是教唆犯或幫助犯。", "ref": "刑法§31、§342", "evidence": "因身分或其他特定關係成立之罪，其共同實行、教唆或幫助者，雖無特定關係，仍以正犯或共犯論"}, {"id": "111-刑事法-13", "src": "old", "year": 111, "n": 13, "subject": "刑事法", "topic": "刑法", "stem": "依照我國現行實務見解，下列何者情形成立刑法第 304 條第 1 項之強制罪？", "opts": {"A": "甲因糾紛至乙宅大門，3 分鐘內按電鈴 3 次，但經大樓保全人員勸阻後離開", "B": "甲因與乙在道路上行車糾紛，遂將所騎機車擋在乙所駕自用小客車行進方向之道路", "C": "甲因糾紛至乙之透天住宅，停放汽車擋住乙宅一樓門口車位 4 小時，但此期間乙外出不在家", "D": "甲因糾紛將車停放在乙之車庫前，但僅占用一半面積，乙車庫內僅停放一台機車仍可出入"}, "answer": "B", "explain": "強制罪要求以強暴、脅迫妨害他人行使權利。B：在道路上用機車擋住乙車的行進方向，使乙無法通行，屬於對人施加的強暴（間接強暴），妨害乙的行車權利，實務上成立強制罪。A：按電鈴後就離開；C：乙不在家，沒有實際受到妨害；D：車庫仍可出入，也沒有妨害。以上三者都不構成強制罪。", "ref": "刑法§304", "evidence": "以強暴、脅迫使人行無義務之事或妨害人行使權利者"}, {"id": "111-刑事法-14", "src": "old", "year": 111, "n": 14, "subject": "刑事法", "topic": "刑法", "stem": "下列何者行為不成立刑法第 159 條之冒用公務員服章官銜罪？", "opts": {"A": "無公務員資格之甲穿印有調查局北機組字樣之背心在街頭調停爭執", "B": "無公務員資格之甲穿印有刑事警察局字樣之背心在街頭調停爭執", "C": "無公務員資格之甲穿印有憲兵字樣之背心在街頭調停爭執", "D": "無公務員資格之甲穿印有乙立法委員服務處主任字樣之背心在街頭調停爭執"}, "answer": "D", "explain": "§159處罰公然冒用「公務員」的服飾、徽章或官銜。調查局、刑事警察局、憲兵的人員都是公務員，所以A、B、C成罪。立法委員服務處主任是立委私人聘用的助理，不是依法令從事公務的公務員（§10Ⅱ），冒用這個頭銜不構成§159，所以選D。", "ref": "刑法§159、§10", "evidence": "公然冒用公務員服飾、徽章或官銜者"}, {"id": "111-刑事法-15", "src": "old", "year": 111, "n": 15, "subject": "刑事法", "topic": "刑法", "stem": "下列何者不成立刑法第 212 條偽造特種文書罪？", "opts": {"A": "甲偽造乙之印鑑證明書", "B": "甲偽造乙名義之護照", "C": "甲偽造乙名義之國民身分證", "D": "甲偽造乙名義之私立大學畢業證書"}, "answer": "A", "explain": "§212特種文書包括護照、身分證這類「免許證、特許證」，以及畢業證書這類關於品行、能力的證書（B、C、D）。印鑑證明書是戶政機關公務員在職務上製作的公文書，偽造它應該論§211偽造公文書罪，不是特種文書，所以選A。", "ref": "刑法§212、§211", "evidence": "偽造、變造護照、旅券、免許證、特許證及關於品行、能力、服務或其他相類之證書、介紹書"}, {"id": "111-刑事法-16", "src": "old", "year": 111, "n": 16, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列何種情形，法官於該管案件無須自行迴避？", "opts": {"A": "法官曾參與該案件之下級審裁判", "B": "法官之配偶為該案件之被害人", "C": "法官曾為該案件被害人在他案之辯護人", "D": "法官曾為該案件之證人"}, "answer": "C", "explain": "依刑訴§17：法官曾參與前審裁判（A，第8款）、法官現為或曾為被害人的配偶（B，第2款）、法官曾為證人（D，第6款），都應自行迴避。第5款只限於法官曾任「被告」的代理人、辯護人；曾任被害人在他案的辯護人，不是法定迴避事由，所以選C。", "ref": "刑訴§17", "evidence": "法官曾為被告之代理人、辯護人、輔佐人或曾為自訴人、附帶民事訴訟當事人之代理人、輔佐人者"}, {"id": "111-刑事法-17", "src": "old", "year": 111, "n": 17, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依據刑事訴訟法之規定，下列何者並非辯護人之權利？", "opts": {"A": "於被告住宅受搜索時在場之權利", "B": "於偵查中之羈押審查程序中檢閱卷宗及證物之權利", "C": "與羈押之被告互通書信之權利", "D": "檢察官偵查中訊問被告時陳述意見之權利"}, "answer": "A", "explain": "依§150，只有「審判中」的辯護人才能在搜索、扣押時在場，偵查中的辯護人沒有這項權利，所以A並非辯護人的一般權利。B：§33-1規定偵查中羈押審查程序可以檢閱卷證。C：§34規定可以與羈押被告互通書信。D：§245Ⅱ規定訊問時可以在場並陳述意見。", "ref": "刑訴§150", "evidence": "當事人及審判中之辯護人得於搜索或扣押時在場"}, {"id": "111-刑事法-18", "src": "old", "year": 111, "n": 18, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依據現行刑事訴訟法規定，下列何者不需令狀即可為之？", "opts": {"A": "偵查中為刑事訴訟法第 122 條第 2 項所定之對第三人搜索", "B": "刑事訴訟法第 101 條第 1 項第 3 款所定之羈押", "C": "刑事訴訟法第 75 條所定之拘提", "D": "檢察官執行刑事訴訟法第 88 條之 1 之拘提"}, "answer": "D", "explain": "依§88-1Ⅱ，逕行拘提由檢察官親自執行時，可以不用拘票（D）。A：對第三人搜索，仍須有搜索票。B：羈押一定要用押票（§102）。C：§75的拘提是被告經合法傳喚無正當理由不到場時所為，須用拘票。", "ref": "刑訴§88-1", "evidence": "前項拘提，由檢察官親自執行時，得不用拘票"}, {"id": "111-刑事法-19", "src": "old", "year": 111, "n": 19, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列情形中，何者不發生合法傳喚被告之效果？", "opts": {"A": "以傳票送達於被告", "B": "司法警察官使用通知書，通知犯罪嫌疑人到場詢問", "C": "被告經以書狀陳明屆期到場", "D": "對於到場之被告，經面告以下次應到之日、時、處所及如不到場得命拘提，並記明筆錄"}, "answer": "B", "explain": "B：司法警察用通知書請犯罪嫌疑人到場（§71-1），只是「通知」，不是傳喚；無正當理由不到場，也只能報請檢察官核發拘票，不發生傳喚效力。A：傳票送達是合法傳喚。C、D：依§72，被告以書狀陳明屆期到場，或當庭面告下次期日並記明筆錄，都與送達傳票有同一效力。", "ref": "刑訴§71-1、§72", "evidence": "得使用通知書，通知犯罪嫌疑人到場詢問"}, {"id": "111-刑事法-20", "src": "old", "year": 111, "n": 20, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列情形中，何者並非我國刑事訴訟法明文規定之告知義務？", "opts": {"A": "參與合議審判之陪席法官訊問證人或鑑定人前，應告知被告據以訊問之事實與具體理由", "B": "法官裁定暫行安置時，應告知被告所依據之事實、各項理由之具體內容及有關證據", "C": "於沒收特別程序，審判長應於審判期日向到場之參與人告知構成沒收理由之事實要旨", "D": "檢察官逕行拘提犯罪嫌疑人時，應即告知本人得選任辯護人到場"}, "answer": "A", "explain": "刑訴法並沒有規定陪席法官訊問證人、鑑定人前，須告知被告據以訊問的事實與理由，所以A不是法定告知義務。B：暫行安置應告知所依據的事實與證據。C：沒收特別程序中，審判長應告知參與人沒收理由要旨。D：逕行拘提時應告知本人及家屬得選任辯護人（§88-1Ⅲ），都有明文規定。", "ref": "刑訴§88-1、§121-1以下、§455-12以下", "evidence": "應即告知本人及其家屬，得選任辯護人到場"}, {"id": "111-刑事法-21", "src": "old", "year": 111, "n": 21, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "下列情形中，何者所進行之搜索依法得不使用搜索票？", "opts": {"A": "檢察官於必要時搜索公務員所持有之公文", "B": "檢察事務官於偵查中確有相當理由認為情況急迫，非迅速搜索，24 小時內證據有隱匿之虞", "C": "司法警察逮捕現行犯時，當場搜索現行犯騎乘之機車", "D": "司法警察官經房東之自願性同意，搜索承租房客個人居住之房間"}, "answer": "C", "explain": "依§130附帶搜索，逮捕現行犯時，雖然沒有搜索票，也可以搜索其身體、隨身物件、「所使用之交通工具」及立即可觸及之處所，所以C合法。A：仍須令狀。B：§131Ⅱ緊急搜索的主體是檢察官，檢察事務官只能受檢察官指揮執行，不能自行發動。D：房東對房客個人居住的房間沒有同意權限。", "ref": "刑訴§130", "evidence": "得逕行搜索其身體、隨身攜帶之物件、所使用之交通工具及其立即可觸及之處所"}, {"id": "111-刑事法-22", "src": "old", "year": 111, "n": 22, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "有關刑事訴訟法中鑑定之規定，下列敘述何者正確？", "opts": {"A": "鑑定人經合法傳喚，無正當理由而不到場者，不得拘提", "B": "法院囑託醫院為鑑定時，應命實施鑑定或審查之人到場以言詞報告或說明", "C": "鑑定人之書面報告僅應敘明鑑定之結果，於必要時得使其以言詞說明鑑定之經過", "D": "鑑定人應於鑑定前具結，其結文內應記載當據實陳述，決無匿、飾、增、減等語"}, "answer": "A", "explain": "§199明定鑑定人不得拘提，所以A正確（鑑定人可以替換）。B：§208規定法院囑託機關鑑定時，「得」命實施鑑定的人到場說明，不是「應」。C：依§206，鑑定的經過與結果都應報告。D：鑑定人的結文記載「必為公正誠實之鑑定」（§202），「據實陳述、決無匿飾增減」是證人的結文內容。", "ref": "刑訴§199、§202、§206、§208", "evidence": "鑑定人，不得拘提。"}, {"id": "111-刑事法-23", "src": "old", "year": 111, "n": 23, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依刑事訴訟法之規定，下列上訴何者不合法？", "opts": {"A": "甲自訴乙傷害罪，經一審判決無罪後，檢察官見甲無意上訴，獨立對乙之傷害罪案件提起上訴", "B": "檢察官起訴丙涉犯詐欺罪，經第一審法院判決有期徒刑 4 個月並宣告沒收犯罪所得，丙明示僅就判決之宣告沒收部分提起上訴", "C": "丁被起訴誹謗罪，遭第一審法院判決拘役 20 日，丁於宣判時向第一審法院明示捨棄上訴權。丁於第一審程序之辯護人不服，獨立為被告之利益而上訴", "D": "自訴人戊於第一審程序辯論終結後死亡，第一審法院隨後宣判被告無罪，戊之子提起上訴"}, "answer": "C", "explain": "依§346，原審辯護人可以為被告利益上訴，但不得與被告明示的意思相反。丁已經明示捨棄上訴權，辯護人還獨立上訴，因此不合法（C）。A：§347規定檢察官對自訴判決可以獨立上訴。B：可以只就沒收部分上訴（§348Ⅲ）。D：§344Ⅱ規定自訴人在辯論終結後死亡的，由得提起自訴之人上訴。", "ref": "刑訴§346、§344、§347", "evidence": "原審之代理人或辯護人，得為被告之利益而上訴。但不得與被告明示之意思相反。"}, {"id": "111-刑事法-24", "src": "old", "year": 111, "n": 24, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依刑事訴訟法之規定，犯罪之被害人合法聲請訴訟參與後，可取得下列何種訴訟權利？", "opts": {"A": "於審判中檢閱卷宗及證物並得抄錄、重製或攝影之權利", "B": "聲請調查證據之權利", "C": "於偵查中羈押審查程序在場及陳述意見之權利", "D": "隨時選任代理人之權利"}, "answer": "D", "explain": "§455-41規定訴訟參與人得「隨時」選任代理人（D）。A：審判中檢閱、抄錄卷證的權利屬於律師代理人（§455-42），參與人本人只能預納費用請求付與影本。B：聲請調查證據的主體是當事人、代理人、辯護人（§163），訴訟參與人只有表示意見權。C：訴訟參與是起訴後的制度，偵查中羈押審查沒有參與權。", "ref": "刑訴§455-41", "evidence": "訴訟參與人得隨時選任代理人。"}, {"id": "111-刑事法-25", "src": "old", "year": 111, "n": 25, "subject": "刑事法", "topic": "刑事訴訟法", "stem": "依照我國現行刑事訴訟法及實務見解，關於刑事訴訟法第七編之二的沒收特別程序，下列何者錯誤？", "opts": {"A": "財產可能遭沒收之第三人得於本案最後事實審言詞辯論終結前聲請參與沒收程序", "B": "檢察官得於起訴後審理中向法院聲請命第三人參與沒收程序", "C": "檢察官若未聲請，法院不得於審理中依刑事訴訟法規定依職權命第三人參與沒收程序", "D": "法院關於所審理之第三人參與沒收程序，於裁定前應通知該第三人並予以陳述意見之機會"}, "answer": "C", "explain": "依§455-12Ⅲ，第三人沒有聲請參與，法院認為有必要時，「應」依職權裁定命該第三人參與沒收程序，所以C說「不得依職權」是錯的。A是§455-12Ⅰ的規定；B：檢察官可以聲請；D：法院在裁定前應通知第三人並給予陳述意見的機會，都正確。", "ref": "刑訴§455-12", "evidence": "第三人未為第一項聲請，法院認有必要時，應依職權裁定命該第三人參與沒收程序"}, {"id": "111-刑事法-26", "src": "old", "year": 111, "n": 26, "subject": "刑事法", "topic": "消防法", "stem": "下列何種消防安全設備之緊急電源，有效動作可小於 30 分鐘？", "opts": {"A": "室內消防栓設備", "B": "緊急廣播設備", "C": "排煙設備之排煙口", "D": "無線電通信輔助設備之增輻器"}, "answer": "B", "explain": "依各類場所消防安全設備設置標準§135Ⅲ，緊急廣播設備的緊急電源準用§128，蓄電池容量能有效動作10分鐘以上（B 小於30分鐘）。室內消防栓（§38）、排煙設備（§188）、無線電通信輔助設備增輻器（§192）的緊急電源都要求有效動作30分鐘以上。", "ref": "各類場所消防安全設備設置標準§38、§128、§135、§188、§192", "evidence": "火警自動警報設備之緊急電源，應使用蓄電池設備，其容量能使其有效動作十分鐘以上。"}, {"id": "111-刑事法-28", "src": "old", "year": 111, "n": 28, "subject": "刑事法", "topic": "災害防救法", "stem": "今年天氣特別炎熱，許多民眾於颱風侵台前夕，仍在危險水域遊憩，依規定：各級政府成立災害應變中心後，劃定警戒區域限制人民進入或命其離去，違者處新臺幣多少罰鍰？", "opts": {"A": "3 千元以上 1 萬 5 千元以下", "B": "6 千元以上 3 萬元以下", "C": "1 萬元以上 5 萬元以下", "D": "5 萬元以上 25 萬元以下"}, "answer": "D", "explain": "災害應變中心成立後，依§30Ⅰ②劃定警戒區域，限制或禁止人民進入、命其離去。未取得通行證而進入，或命離去而不離去的，依§55②處5萬元以上25萬元以下罰鍰（D）。在危險水域遊憩屬於這種情形。", "ref": "災防法§55②、§30Ⅰ②", "evidence": "未取得臨時通行證，而進入各該機關依第三十條第一項第二款規定所劃定警戒區域，或命離去而不離去"}, {"id": "111-刑事法-29", "src": "old", "year": 111, "n": 29, "subject": "刑事法", "topic": "災害防救法", "stem": "為避免重大災害發生時，民眾散播轉貼不實圖片、文字，致生危害而影響公共安寧；依法若明知災害不實訊息，卻通報消防或警察單位者，可科新臺幣多少罰金？", "opts": {"A": "3 萬元以上 5 萬元以下", "B": "10 萬元以上 30 萬元以下", "C": "30 萬元以上 50 萬元以下", "D": "50 萬元以上 100 萬元以下"}, "answer": "C", "explain": "依§53Ⅱ，明知是關於災害的不實訊息，仍依§29Ⅰ向消防或警察單位通報的，科新臺幣30萬元以上50萬元以下「罰金」（刑罰），所以選C。如果是散播災害謠言、足生損害於公眾或他人，則依§53Ⅲ處3年以下有期徒刑、拘役或100萬元以下罰金，兩者要區分清楚。", "ref": "災防法§53Ⅱ", "evidence": "明知為有關災害之不實訊息而為第二十九條第一項之通報者，科新臺幣三十萬元以上五十萬元以下罰金"}, {"id": "111-刑事法-31", "src": "old", "year": 111, "n": 31, "subject": "刑事法", "topic": "災害防救法", "stem": "直轄市、縣（市）政府設直轄市、縣（市）災害防救會報，所核定重要災害防救措施及對策，會在下列那個計畫中？", "opts": {"A": "災害防救基本計畫", "B": "災害防救業務計畫", "C": "地區災害防救計畫", "D": "鄉（鎮、市）區域災害防救計畫"}, "answer": "C", "explain": "直轄市、縣（市）災害防救會報的任務（§8），包括核定地區災害防救計畫、核定重要災害防救措施及對策等，相關措施會落實在其核定的「地區災害防救計畫」中（C）。災害防救基本計畫由中央災害防救會報核定；災害防救業務計畫由中央業務主管機關及公共事業擬訂。", "ref": "災防法§8、§2", "evidence": "核定各該直轄市、縣（市）地區災害防救計畫"}, {"id": "111-刑事法-32", "src": "old", "year": 111, "n": 32, "subject": "刑事法", "topic": "消防法", "stem": "有關「消防法」之規定，下列何者正確？①消防主管機關：在中央為內政部消防署 ②直轄市、縣（市）政府，應每二年定期舉辦防火教育及宣導 ③消防機關應依消防法及其子法所定各類場所之危險程度，分類列管檢查及複查 ④依各類場所消防安全設備設置標準設置之消防安全設備，其設計、監造應由消防設備師為之", "opts": {"A": "①②", "B": "②③", "C": "①④", "D": "③④"}, "answer": "D", "explain": "③：§6Ⅱ規定消防機關依場所危險程度分類列管檢查及複查。④：§7Ⅰ規定消防安全設備的設計、監造由消防設備師為之。所以選D。①錯：中央主管機關是內政部，消防署只是承辦（施行細則§2）。②錯：防火教育及宣導應「每年」定期舉辦（§5）。", "ref": "消防法§3、§5、§6Ⅱ、§7Ⅰ", "evidence": "其設計、監造應由消防設備師為之"}, {"id": "111-刑事法-33", "src": "old", "year": 111, "n": 33, "subject": "刑事法", "topic": "消防法", "stem": "為將救護人車留給更有需要的人，避免資源濫用，下列何者不應視為所稱之緊急傷病患？", "opts": {"A": "因災害或意外事故急待救護者", "B": "孕婦待產者", "C": "轉院病患", "D": "路倒"}, "answer": "C", "explain": "依緊急救護辦法§3②（101年3月26日修正迄今未改），緊急傷病患指：因災害或意外事故急待救護者、路倒傷病無法行動者、孕婦待產者、其他緊急傷病者。轉院病患不在列舉範圍內，已在醫療體系中，由醫院安排轉送，不應視為消防救護車應載送的緊急傷病患，所以選C。", "ref": "緊急救護辦法§3", "evidence": "（一）因災害或意外事故急待救護者。（二）路倒傷病無法行動者。（三）孕婦待產者。"}, {"id": "111-刑事法-34", "src": "old", "year": 111, "n": 34, "subject": "刑事法", "topic": "消防法", "stem": "執行緊急救護作業，下列敘述何者錯誤？", "opts": {"A": "緊急傷病患之運送就醫服務，應送至急救責任醫院或就近適當醫療機構", "B": "緊急傷病患之運送，由救護隊負責，其受理申請及就醫聯絡由救災救護指揮中心負責", "C": "救護人員實施緊急救護時，如緊急傷病患或其家屬拒絕接受運送，應要求其於救護紀錄表中簽名後，不予運送", "D": "執行緊急傷病患運送之消防機關，依規定不提供緊急傷病患或利害關係人救護服務證明"}, "answer": "D", "explain": "依緊急救護辦法§4Ⅲ，緊急傷病患或利害關係人得向運送的消防機關申請救護服務證明，所以D說「不提供」是錯的。A 符合§5（送往急救責任醫院或就近適當醫療機構）；B 符合§4Ⅱ（救護隊負責運送，指揮中心受理及聯絡）；C 符合§7（拒絕運送時簽名後不予運送）。", "ref": "緊急救護辦法§4、§5、§7", "evidence": "緊急傷病患或利害關係人得向運送之消防機關申請救護服務證明。"}, {"id": "111-刑事法-36", "src": "old", "year": 111, "n": 36, "subject": "刑事法", "topic": "消防法", "stem": "為確保液化石油氣安全，鋼瓶必須定期送合格機構辦理容器檢驗，所需費用，由下列何者負擔？", "opts": {"A": "用戶", "B": "灌裝業者", "C": "零售業者", "D": "地方消防主管機關"}, "answer": "C", "explain": "依§15-4，液化石油氣容器應定期檢驗，由零售業者在檢驗期限屆滿前送檢驗機構檢驗，檢驗費用由零售業者負擔（C）。不是用戶、灌裝（分裝）業者或消防機關負擔。零售業者逾期未送檢仍繼續使用的，依§42-2處2萬～10萬元罰鍰。", "ref": "消防法§15-4Ⅱ", "evidence": "前項所定容器檢驗機構辦理容器檢驗所需費用，由零售業者負擔"}, {"id": "111-刑事法-37", "src": "old", "year": 111, "n": 37, "subject": "刑事法", "topic": "消防法", "stem": "根據「消防法」之規定，各該場所之「管理權人」，下列何者正確？①公寓大廈管理委員會主任委員 ②部立臺北醫院院長 ③私立中原大學校長 ④麥當勞速食店店長", "opts": {"A": "①②", "B": "②③", "C": "③④", "D": "②④"}, "answer": "A", "explain": "管理權人是依法令或契約，對場所有實際支配管理權的人；屬於法人的，是指它的負責人（§2）。①公寓大廈管理委員會主任委員、②公立醫院院長，都是實際支配管理的人。③私立大學屬財團法人，負責人是董事長；④麥當勞為公司法人，管理權人是公司負責人，店長不是。所以選A。", "ref": "消防法§2", "evidence": "本法所稱管理權人係指依法令或契約對各該場所有實際支配管理權者；其屬法人者，為其負責人。"}, {"id": "111-刑事法-38", "src": "old", "year": 111, "n": 38, "subject": "刑事法", "topic": "消防法", "stem": "根據「緊急救護辦法」之定義，緊急救護係指緊急傷病患或大量傷病患在下列何種情境下之救護？①現場急救處理 ②送醫途中 ③急診室內 ④加護病房內", "opts": {"A": "①②", "B": "②③", "C": "③④", "D": "①②③④"}, "answer": "A", "explain": "依緊急救護辦法§3①，緊急救護是指緊急傷病患或大量傷病患的「現場急救處理」及「送醫途中」的救護（①②，選A）。到院後的急診室、加護病房照護屬醫療機構的醫療行為，不在消防緊急救護的定義範圍內。", "ref": "緊急救護辦法§3", "evidence": "緊急救護：指緊急傷病患或大量傷病患之現場急救處理及送醫途中之救護。"}, {"id": "111-刑事法-39", "src": "old", "year": 111, "n": 39, "subject": "刑事法", "topic": "消防法", "stem": "根據「消防法」之規定，參加義勇消防編組人員，因接受訓練、演習、服勤致患病、受傷、身心障礙或死亡者。其中，因傷致身心障礙或死亡者，給與一次身心障礙給付或撫卹金之規定，下列何者正確？①極重度與重度身心障礙者：38 個基數 ②中度身心障礙者：18 個基數 ③輕度身心障礙者：8 個基數 ④死亡者：給與一次撫卹金 80 個基數", "opts": {"A": "①②", "B": "②③", "C": "③④", "D": "①②③④"}, "answer": "B", "explain": "依§30，義消因傷致身心障礙時，一次身心障礙給付為：極重度與重度36個基數、中度18個基數、輕度8個基數；死亡時一次撫卹金為90個基數。所以②③正確（B）。①應為36個基數，不是38；④應為90個基數，不是80。", "ref": "消防法§30", "evidence": "（二）中度身心障礙者：十八個基數。"}, {"id": "111-刑事法-41", "src": "old", "year": 111, "n": 41, "subject": "刑事法", "topic": "消防法", "stem": "根據「公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法」之規定，建築物之一部分得供作室內儲存場所使用者，該室內儲存場所之樓地板面積不得超過多少平方公尺？", "opts": {"A": "150", "B": "120", "C": "100", "D": "75"}, "answer": "D", "explain": "依公共危險物品設置標準暨安全管理辦法§23，儲存六類物品在管制量20倍以下時，建築物的一部分可以作為室內儲存場所，但須設在防火構造建築物的第一層或第二層，樓地板面積不得超過75平方公尺，並以7公分以上鋼筋混凝土或1小時以上防火時效的構造區劃（D）。", "ref": "公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法§23", "evidence": "（二）樓地板面積不得超過七十五平方公尺。"}, {"id": "111-刑事法-42", "src": "old", "year": 111, "n": 42, "subject": "刑事法", "topic": "災害防救法", "stem": "「災害防救法」的中央主管機關，下列何者正確？", "opts": {"A": "中央災害防救委員會", "B": "行政院災害防救辦公室", "C": "內政部", "D": "內政部消防署"}, "answer": "C", "explain": "依災害防救法§4，本法主管機關在中央為內政部，在直轄市為直轄市政府，在縣（市）為縣（市）政府（C）。中央災害防救委員會、行政院災害防救辦公室屬於行政院的組織；消防署只是內政部的所屬機關，不是法定主管機關。", "ref": "災防法§4", "evidence": "本法主管機關：在中央為內政部"}, {"id": "111-刑事法-43", "src": "old", "year": 111, "n": 43, "subject": "刑事法", "topic": "災害防救法", "stem": "根據「災害防救法」之規定，行政院國家搜救指揮中心隸屬於下列那一單位？", "opts": {"A": "中央災害防救委員會", "B": "行政院災害防救辦公室", "C": "內政部", "D": "內政部消防署"}, "answer": "A", "explain": "依§7Ⅳ，為整合運用救災資源，中央災害防救委員會設「行政院國家搜救指揮中心」，統籌調度國內各搜救單位的資源，執行人員搜救及緊急救護運送任務（A）。行政院災害防救辦公室是由中央災害防救委員會設立、處理幕僚業務的單位。", "ref": "災防法§7Ⅳ", "evidence": "中央災害防救委員會設行政院國家搜救指揮中心"}, {"id": "111-刑事法-44", "src": "old", "year": 111, "n": 44, "subject": "刑事法", "topic": "災害防救法", "stem": "為減少災害發生或防止災害擴大，根據「災害防救法」之規定，各級政府平時應依權責實施之減災事項，下列何者正確？①災害防救教育、訓練及觀念宣導 ②災害監測、預報、警報發布及其設施之強化 ③有關原住民族地區災害防救之善後事項 ④企業持續營運能力與防救災能量強化之規劃及推動", "opts": {"A": "①②③", "B": "②③④", "C": "①③④", "D": "①②③④"}, "answer": "C", "explain": "§22Ⅰ減災事項包括：災害防救教育、訓練及觀念宣導（第2款，114年修正後加上「專業知識培養」）、原住民族地區災害防救的善後事項（第12款）、企業持續營運能力與防救災能量強化（第16款），所以①③④正確（C）。②「災害監測、預報、警報發布及其設施之強化」屬於§23的整備事項。", "ref": "災防法§22Ⅰ、§23Ⅰ", "evidence": "有關原住民族地區災害防救之善後事項"}, {"id": "111-刑事法-46", "src": "old", "year": 111, "n": 46, "subject": "刑事法", "topic": "災害防救法", "stem": "為實施災害應變措施，根據「災害防救法」之規定，各級政府應依權責實施之事項，下列何者正確？①對於妨礙災害應變措施之設施、物件，施以加固、移除或改善 ②災情蒐集、通報與指揮所需通訊設施之建置、維護及強化 ③漂流物、沉沒品及其他救出物品之保管、處理 ④傳染病防治、廢棄物處理、環境消毒、食品衛生檢驗及其他衛生事項", "opts": {"A": "①②", "B": "③④", "C": "①③", "D": "②④"}, "answer": "B", "explain": "§27Ⅰ應變措施包括：漂流物、沉沒品及其他救出物品的保管、處理（第14款）；傳染病防治、廢棄物處理、環境消毒、食品衛生檢驗及其他衛生事項（第7款）。所以③④正確（B）。①「對妨礙應變措施之設施、物件施以加固、移除或改善」與②「通訊設施之建置、維護及強化」，都屬於§23的整備事項。", "ref": "災防法§27Ⅰ", "evidence": "漂流物、沈沒品及其他救出物品之保管、處理"}, {"id": "111-刑事法-47", "src": "old", "year": 111, "n": 47, "subject": "刑事法", "topic": "災害防救法", "stem": "根據「災害防救法」，對於發現、獲知災害或有發生災害之虞時，未主動蒐集、傳達相關災情並迅速採取必要之處置，致發生重大損害，訂有課處罰鍰之規定者，為下列何者？", "opts": {"A": "公共事業", "B": "村（里）長", "C": "村（里）幹事", "D": "一般民眾"}, "answer": "A", "explain": "§29Ⅲ規定各級政府及公共事業發現或獲知災害時，應主動蒐集、傳達災情並迅速處置。但只有「公共事業」違反這項義務而發生重大損害時，才依§56③處3萬～15萬元罰鍰（A）。村（里）長、幹事、一般民眾都沒有這項罰鍰規定。", "ref": "災防法§56③、§29Ⅲ", "evidence": "公共事業違反第二十九條第三項規定，於發現、獲知災害或有發生災害之虞時，未主動蒐集、傳達相關災情並迅速採取必要之處置，致發生重大損害"}, {"id": "111-刑事法-48", "src": "old", "year": 111, "n": 48, "subject": "刑事法", "topic": "災害防救法", "stem": "根據「災害防救法」之授權，各級政府成立災害應變中心後，指揮官於災害應變範圍內，依其權責分別實施之事項，並以指揮官指定執行之各該機關名義為之，相關之處分，應予公告，並刊登政府公報、新聞紙、利用電信網路傳送或其他足以使公眾得知之方式揭示。下列何者正確？①危險建築物、工作物之拆除及災害現場障礙物之移除 ②劃定警戒區域，製發臨時通行證，限制或禁止人民進入或命其離去 ③徵調相關專門職業、技術人員及所徵用物資之操作人員協助救災 ④指定道路區間、水域、空域高度，限制或禁止車輛、船舶或航空器之通行", "opts": {"A": "①②", "B": "③④", "C": "①③", "D": "②④"}, "answer": "D", "explain": "官方更正為答D。依§30Ⅱ，指揮官依§30Ⅰ第2款（劃定警戒區域、限制或禁止人民進入或命其離去）及第3款（限制或禁止車輛、船舶、航空器通行）所為、製發臨時通行證以外的處分，應予公告並刊登政府公報等，所以是②④。①拆除、③徵調不在應公告之列。", "ref": "災防法§30Ⅱ", "evidence": "災害應變中心指揮官指定各該機關依前項第二款及第三款規定所為製發臨時通行證以外之處分，應予公告"}, {"id": "111-刑事法-49", "src": "old", "year": 111, "n": 49, "subject": "刑事法", "topic": "災害防救法", "stem": "根據「災害防救法」之規定，人民因條文授權之處分、強制措施或命令等，致其財產遭受損失得請求補償時，於知有損失後，A 年內向該執行機關請求之。但自損失發生後，經過 B 年者，不得為之。下列何者正確？", "opts": {"A": "A=1，B=7", "B": "A=2，B=6", "C": "A=2，B=5", "D": "A=3，B=5"}, "answer": "C", "explain": "依§34Ⅲ，人民因§24Ⅱ、§30Ⅰ第1～3、7、11款等處分或強制措施造成財產損失，請求補償時，應以書面敘明理由，在知有損失後「2年內」向執行機關請求；但自損失發生後經過「5年」的，就不得請求（C）。", "ref": "災防法§34Ⅲ", "evidence": "於知有損失後，二年內向該執行機關請求之。但自損失發生後，經過五年者，不得為之。"}, {"id": "111-刑事法-50", "src": "old", "year": 111, "n": 50, "subject": "刑事法", "topic": "災害防救法", "stem": "根據「災害防救法」之規定，災區受災企業因受影響，於其復工營業計畫範圍內所需營業資金，向金融機構之貸款，其貸款之利息，於週轉金最長 A 年、資本性融資最長 B 年之範圍內，予以補貼。下列何者正確？", "opts": {"A": "A=1，B=3", "B": "A=2，B=7", "C": "A=2，B=5", "D": "A=1，B=5"}, "answer": "A", "explain": "依§49Ⅵ，災區受災企業為復工營業計畫向金融機構貸款所需的營業資金，利息補貼範圍是週轉金最長1年、資本性融資最長3年（A）。同條Ⅳ規定災前貸款的展延期限也是週轉金1年、資本性融資3年，兩者數字相同，一起記即可。", "ref": "災防法§49Ⅵ", "evidence": "於週轉金最長一年、資本性融資最長三年之範圍內，予以補貼"}, {"id": "111-國文-01", "src": "old", "year": 111, "n": 1, "subject": "國文", "topic": "國文", "stem": "下列選項，成語使用錯誤的是：", "opts": {"A": "古代學子寒窗苦讀，希望有朝一日狀元及第，光耀門楣", "B": "肇事逃逸的新聞時有所聞，這樣的行為令人不齒，天理不容", "C": "連日大雨傾盆，河水泛濫成災，人們不禁期待雨後天青的時刻", "D": "為了地震的災情，市長宵旰憂勞，不求名標雁塔，只想百姓安康"}, "answer": "D", "explain": "D 錯：「名標雁塔」指考中進士（唐代新進士題名於大雁塔），與市長救災無關；「宵旰憂勞」形容勤於政事則可用。A「狀元及第，光耀門楣」、B「令人不齒，天理不容」、C「雨後天青」（大雨後放晴，喻困境過後轉好）皆使用正確。", "ref": "成語", "evidence": ""}, {"id": "111-國文-02", "src": "old", "year": 111, "n": 2, "subject": "國文", "topic": "國文", "stem": "學生畢業送匾額給老師，下列題辭，何者不當？", "opts": {"A": "化洽菁莪", "B": "斗山望重", "C": "啟迪有方", "D": "高山安仰"}, "answer": "D", "explain": "「高山安仰」語出《禮記．檀弓》孔子將卒「泰山其頹乎」之嘆，意謂仰望之人已逝，屬輓師長或男喪的輓辭，不可用於畢業贈師，選 D。A「化洽菁莪」讚教育化育英才、B「斗山望重」稱德望如泰山北斗、C「啟迪有方」讚教導得法，皆適合贈師。", "ref": "題辭", "evidence": ""}, {"id": "111-國文-03", "src": "old", "year": 111, "n": 3, "subject": "國文", "topic": "國文", "stem": "「我們都知道海倫．凱勒，她聽不到聲音，可是她針對貝多芬的《命運交響曲》寫過一篇偉大的評論。她用手放在音箱上，隨著節奏、旋律所產生的振動，再寫出她的感覺。她證明了人類的感覺是可以互相轉換，聽覺不只是聽覺，也可以變成觸覺。尤其在漢文系統裡，任何一個聲音都是有質感的，我們說這個人講話『鏗鏘有力』，是說語言有金屬的質感；我們說這個人的聲音如『洪鐘』，或者『如泣如訴』，都是在形容語言的質感。我們讀詩，不一定是讀內容，也可以讀聲音的質感，或如細弦或如鑼鼓，感受聲音的振動，各有不同的韻味。」下列選項，何者最符合本文旨意？", "opts": {"A": "聽其聲，如見其人", "B": "可以利用觸覺讀詩", "C": "觸覺可以超越聽覺", "D": "感官知覺可互相轉換"}, "answer": "D", "explain": "文章以海倫．凱勒用觸覺「聽」交響曲為例，指出「人類的感覺是可以互相轉換，聽覺不只是聽覺，也可以變成觸覺」，再延伸到漢語以金屬質感形容聲音，主旨為感官互通，選 D。A 聽聲如見人非重點；B 讀詩是讀聲音質感而非用觸覺；C 文中說轉換，未說觸覺超越聽覺。", "ref": "文意判讀", "evidence": ""}, {"id": "111-國文-04", "src": "old", "year": 111, "n": 4, "subject": "國文", "topic": "國文", "stem": "「香條張貼之處，層層疊疊多少神明到訪此地的紀錄。我喜歡站在香條牆前端詳，靈感總會瞬間湧現，腦袋浮現諸多神祇在天上飛來飛去的畫面。研究廟與廟之間的互動交陪，香條大概就是最好的史料文獻。未來若有機會我要將香條用在小說寫作，不單只是視它為應用文書，而是真正顯現此一文體內建的暗示。」根據上文，下列何者不屬於作者對「香條」的詮釋？", "opts": {"A": "神明到訪紀錄", "B": "廟與廟的互動", "C": "建築史料文獻", "D": "小說寫作素材"}, "answer": "C", "explain": "文中詮釋香條為「神明到訪此地的紀錄」（A）、研究「廟與廟之間的互動交陪」的史料（B）、未來「用在小說寫作」（D）。文中說香條是研究廟際互動的「史料文獻」，並未說是建築史料，故 C 不屬於作者詮釋。", "ref": "文意判讀", "evidence": ""}, {
