中消防防護計畫，管理權人應於施工幾日前報請施工場所所在地之直轄市、縣（市）主管機關備查？", "opts": {"A": "7日", "B": "3日", "C": "10日", "D": "15日"}, "answer": "B", "explain": "細則§6第2項規定，施工中消防防護計畫，管理權人應於施工三日前報請施工場所所在地之直轄市、縣（市）主管機關備查。7日、10日均非法定期間；15日則為消防法§13第10項防火管理人遴用或異動後報請備查之期限，考生易混淆。未訂定施工中消防防護計畫之罰則見消防法§40。", "ref": "消防法施行細則§6", "evidence": "管理權人應於施工三日前報請施工場所所在地之直轄市、縣（市）主管機關備查", "src": "new", "amend": "施行細則 113-01-22 全文修正"}, {"id": "N-消防-025", "subject": "刑事法", "topic": "消防法", "stem": "依消防法施行細則規定，共同消防防護計畫之自衛消防編組應包括指揮中心及地區隊，其中指揮中心「應設」之班別為何？", "opts": {"A": "滅火班、通報班及避難引導班", "B": "指揮班、通報班及滅火班", "C": "指揮班、避難引導班及安全防護班", "D": "通報班、滅火班及救護班"}, "answer": "B", "explain": "細則§7第2款規定，共同消防防護計畫之指揮中心應設指揮班、通報班及滅火班，並得視需要增編避難引導班、安全防護班及救護班；地區隊則由各場所防火管理人依事業單位規模編組。「滅火班、通報班及避難引導班」係一般消防防護計畫員工10人以上應編組之班別（細則§5），易混淆。", "ref": "消防法施行細則§7", "evidence": "指揮中心應設指揮班、通報班及滅火班", "src": "new", "amend": "施行細則 113-01-22 全文修正"}, {"id": "N-消防-026", "subject": "刑事法", "topic": "消防法", "stem": "依消防法施行細則規定，有關火災原因調查鑑定書之完成期限，下列敘述何者正確？", "opts": {"A": "應於火災撲滅後次日起7日內完成，必要時得延長至15日", "B": "應於火災撲滅後次日起30日內完成，必要時得延長至60日", "C": "應於火災撲滅後次日起15日內完成，必要時得延長至30日", "D": "有召開火災鑑定會之案件，應於召開會議後30日內完成"}, "answer": "C", "explain": "細則§14第3項規定，火災原因調查鑑定書應於火災撲滅後次日起15日內完成，必要時得延長至30日；但有召開火災鑑定會或進行補充調查之案件，應於召開會議或完成補充調查後「15日內」完成。其餘選項期間均與條文不符。同條第1項並規定鑑定書應移送當地警察機關依法處理。", "ref": "消防法施行細則§14", "evidence": "火災原因調查鑑定書應於火災撲滅後次日起十五日內完成；必要時，得延長至三十日", "src": "new", "amend": "施行細則 113-01-22 全文修正"}, {"id": "N-消防-027", "subject": "刑事法", "topic": "消防法", "stem": "依消防法施行細則規定，直轄市、縣（市）主管機關每年應訂定防火教育及宣導之年度計畫，下列何者「非」該計畫應包括之事項？", "opts": {"A": "轄內各類場所消防安全設備檢查不合格件數之統計", "B": "前一年度轄區火災分析", "C": "依火災分析規劃防火教育與宣導之執行內容及時程", "D": "傳統節日增加用火用電致易生火災相關預防措施之宣導"}, "answer": "A", "explain": "細則§3第2項規定年度計畫應包括三款：前一年度轄區火災分析、依該分析規劃防火教育與宣導執行內容及時程、傳統節日增加用火用電致易生火災相關預防措施之宣導。「消防安全設備檢查不合格件數之統計」屬列管檢查業務，並非條文所列年度計畫應包括事項，故為答案。", "ref": "消防法施行細則§3", "evidence": "傳統節日增加用火用電致易生火災相關預防措施之宣導", "src": "new", "amend": "施行細則 113-01-22 全文修正"}, {"id": "N-消防-028", "subject": "刑事法", "topic": "消防法", "stem": "依消防法施行細則有關火災現場封鎖及進入之規定，下列敘述何者錯誤？", "opts": {"A": "火災現場僅得由消防機關封鎖，檢察、警察機關並無封鎖權限", "B": "火災現場之封鎖，於調查、鑑定完畢後撤除之", "C": "火災現場尚未完成調查、鑑定者，非經調查、鑑定人員許可，任何人不得進入或變動", "D": "遇有緊急情形須進入時，得由調查、鑑定人員陪同進入，並於鑑定書中記明其事由"}, "answer": "A", "explain": "細則§15第1項明定檢察、警察機關或主管機關均得封鎖火災現場，於調查、鑑定完畢後撤除之，故「僅消防機關得封鎖」之敘述錯誤。同條第2項規定未完成調查鑑定之現場應保持現狀，非經調查鑑定人員許可不得進入或變動；緊急或有必要時得由其陪同進入，並於火災原因調查鑑定書中記明事由。", "ref": "消防法施行細則§15", "evidence": "檢察、警察機關或主管機關得封鎖火災現場，於調查、鑑定完畢後撤除之", "src": "new", "amend": "施行細則 113-01-22 全文修正"}, {"id": "N-消防-029", "subject": "刑事法", "topic": "消防法", "stem": "依消防法施行細則規定，「消防安全設備施工中須經試驗或勘驗事項之查核，並製作紀錄」，係指下列何種工作項目？", "opts": {"A": "設計", "B": "監造", "C": "測試", "D": "檢修"}, "answer": "B", "explain": "細則§4界定消防法§7第1項之工作項目：設計指設備種類及數量之規劃並製作圖說；監造指施工中須經試驗或勘驗事項之查核並製作紀錄；測試指施工完成後之功能測試並製作測試報告書；檢修指依§9受託檢查各類場所消防安全設備並製作檢修報告書。題述為監造之定義。", "ref": "消防法施行細則§4", "evidence": "監造：指消防安全設備施工中須經試驗或勘驗事項之查核，並製作紀錄", "src": "new", "amend": "施行細則 113-01-22 全文修正"}, {"id": "N-消防-030", "subject": "刑事法", "topic": "消防法", "stem": "依消防法第7條規定，消防安全設備之設計、監造、測試及檢修，得由現有相關專門職業及技術人員或技術士暫行為之，其期限至何時止？", "opts": {"A": "至112年5月30日修正條文施行之日起3年止", "B": "至112年5月30日修正條文施行之日起5年止", "C": "至112年5月30日修正條文施行之日起10年止", "D": "無期限限制，至消防設備師法制定施行時止"}, "answer": "B", "explain": "§7第2項規定，消防安全設備之設計、監造、測試及檢修，得由現有相關專門職業及技術人員或技術士暫行為之，其期限至本法112年5月30日修正條文施行之日起5年止，故已設有落日期限，並非無期限。另開業建築師、電機技師得執行滅火器等非系統式設備之相關業務，不受第1項限制（第3項）。", "ref": "消防法§7", "evidence": "其期限至本法中華民國一百十二年五月三十日修正之條文施行之日起五年止", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-031", "subject": "刑事法", "topic": "消防法", "stem": "依消防法第13條第5項明文列舉，下列何者屬於管理權有分屬情形時，各管理權人應協議遴用共同防火管理人之建築物？", "opts": {"A": "地面樓層達11層以上之集合住宅", "B": "地面樓層達7層以上之建築物", "C": "供公眾使用之建築物", "D": "地下建築物"}, "answer": "D", "explain": "§13第5項列舉應協議遴用共同防火管理人之建築物為：非屬集合住宅之地面樓層達11層以上建築物、地下建築物，以及其他經中央主管機關公告之建築物。集合住宅明文排除；7層以上建築物及供公眾使用建築物均非法條所列。共同防火管理人應訂定共同消防防護計畫，並共同報請備查。", "ref": "消防法§13", "evidence": "下列建築物之管理權有分屬情形者，各管理權人應協議遴用共同防火管理人", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-032", "subject": "刑事法", "topic": "消防法", "stem": "某商店陳列未附有防焰標示之窗簾，經勸導改善仍未改善，依消防法應處新臺幣多少罰鍰？", "opts": {"A": "1萬元以上5萬元以下，並得按次處罰", "B": "2萬元以上10萬元以下，並得按次處罰", "C": "3千元以上1萬5千元以下，並得按次處罰", "D": "2萬元以上30萬元以下，並通知限期改善"}, "answer": "A", "explain": "§11第2項規定防焰物品或其材料非附有防焰標示不得銷售及陳列。§39第1項區分：「銷售」未附防焰標示者處2萬元以上10萬元以下；「陳列」經勸導改善仍未改善者處1萬元以上5萬元以下，均得按次處罰。2萬至30萬為場所未使用防焰物品之罰鍰（§37），3千至1萬5千為§42-4零售業者之罰鍰。", "ref": "消防法§39", "evidence": "其陳列經勸導改善仍未改善者，處新臺幣一萬元以上五萬元以下罰鍰，並得按次處罰", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-033", "subject": "刑事法", "topic": "消防法", "stem": "有關公共危險物品場所管制量倍數之相關規定，依消防法，下列敘述何者正確？", "opts": {"A": "第19條之1所定應立即完成通報之廠區，係以公共危險物品合計達管制量300倍以上為標準", "B": "製造、儲存及處理公共危險物品合計達管制量30倍以上場所之管理權人，應遴用保安監督人及保安檢查員", "C": "依第13條遴用之防火管理人，縱具備保安監督人資格，亦不得兼任保安監督人", "D": "保安監督人及保安檢查員遴用後，應於次日起30日內報請場所所在地主管機關備查"}, "answer": "B", "explain": "§15-6第1項規定合計達管制量30倍以上場所應遴用保安監督人及保安檢查員，該敘述正確。§19-1第1項第2款之通報門檻為管制量「三千倍」以上；§15-6第5項規定防火管理人具備保安監督人資格者「得兼任」；同條第4項報請備查期限為遴用之次日起「15日」內。", "ref": "消防法§15-6", "evidence": "製造、儲存及處理公共危險物品合計達管制量三十倍以上場所之管理權人，應遴用保安監督人及保安檢查員辦理下列事項", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-034", "subject": "刑事法", "topic": "消防法", "stem": "某石油化工原料製造業廠區發生公共危險物品漏逸，管理權人未立即依中央主管機關公告之對象、方式完成通報，依消防法應處管理權人新臺幣多少罰鍰？", "opts": {"A": "2萬元以上10萬元以下", "B": "5萬元以上300萬元以下", "C": "50萬元以上1,000萬元以下", "D": "10萬元以上50萬元以下"}, "answer": "D", "explain": "§19-1第1項規定石油煉製業、石油化工原料製造業等廠區發生火災、爆炸或公共危險物品漏逸時，管理權人應立即完成通報。§35-1第1項規定未立即通報者處管理權人10萬元以上50萬元以下罰鍰；同條第2項規避、妨礙或拒絕主管機關人員車輛進入者，處2萬元以上10萬元以下，兩者易混淆。", "ref": "消防法§35-1", "evidence": "未立即依中央主管機關公告之對象、方式或內容完成通報者，處管理權人新臺幣十萬元以上五十萬元以下罰鍰", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-035", "subject": "刑事法", "topic": "消防法", "stem": "主管機關為執行緊急救護任務，依法向電信事業調取待救者通信紀錄；經辦人員無正當理由洩漏其所知悉資料之內容者，依消防法應處新臺幣多少罰鍰？", "opts": {"A": "1萬元以上5萬元以下", "B": "2萬元以上10萬元以下", "C": "6千元以上3萬元以下", "D": "10萬元以上50萬元以下"}, "answer": "B", "explain": "§18第3項授權主管機關得向電信事業調取待救者通信紀錄及個人相關資訊；第4項課予主管機關及電信事業經辦人員保密義務。違反者依§35-2，處2萬元以上10萬元以下罰鍰。1萬至5萬為無故撥打報案電話或謊報之罰鍰（§36）；10萬至50萬為未立即通報之罰鍰（§35-1）。", "ref": "消防法§35-2", "evidence": "無正當理由洩漏其經辦相關作業之過程或所知悉資料之內容者，處新臺幣二萬元以上十萬元以下罰鍰", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-036", "subject": "刑事法", "topic": "消防法", "stem": "消防人員為搶救火災，破壞某民宅鐵門進入救人，依消防法第19條規定，下列敘述何者正確？", "opts": {"A": "消防人員須先取得屋主同意，始得損壞其建築物", "B": "人民財產因此遭受特別犧牲之損失時得請求補償，但因可歸責於該人民之事由者，不予補償", "C": "人民財產之損失，由執行搶救之消防人員個人負賠償責任", "D": "人民不論有無可歸責之事由，均得請求全額補償"}, "answer": "B", "explain": "§19第1項規定消防人員因緊急救護、搶救火災，非進入、使用、損壞或限制使用人民財產不能達目的時，得逕為之，無須事先取得同意。第2項規定人民因此致財產遭受特別犧牲之損失時得請求補償，但因可歸責於該人民之事由者不予補償，屬國家損失補償，非由消防人員個人賠償。", "ref": "消防法§19", "evidence": "致其財產遭受特別犧牲之損失時，得請求補償。但因可歸責於該人民之事由者，不予補償", "src": "new"}, {"id": "N-消防-037", "subject": "刑事法", "topic": "消防法", "stem": "民眾違反主管機關依消防法第14條所定施放天燈之禁止區域、時間規定，依消防法應處新臺幣多少罰鍰？", "opts": {"A": "3千元以上1萬5千元以下", "B": "1萬元以上5萬元以下", "C": "3千元以下", "D": "3萬元以上15萬元以下"}, "answer": "C", "explain": "§14第1項規定田野引火燃燒、施放天燈等易致火災之行為，非經許可不得為之；第2項授權主管機關訂定禁止從事之區域、時間等法規。違反者依§41處3千元以下罰鍰。3萬至15萬係違反§14-1以產生火焰方式進行表演之許可辦法者之罰鍰（§41-1），考生易混淆。", "ref": "消防法§41", "evidence": "禁止從事之區域、時間、方式或應遵行事項之規定者，處新臺幣三千元以下罰鍰", "src": "new"}, {"id": "N-消防-038", "subject": "刑事法", "topic": "消防法", "stem": "消防設備師為消防安全設備不實檢修報告，依消防法之處罰，下列何者正確？", "opts": {"A": "處新臺幣3萬元以上15萬元以下罰鍰，並得按次處罰；必要時並得廢止其證書", "B": "處新臺幣1萬元以上5萬元以下罰鍰，並通知限期改善；屆期未改善者得按次處罰", "C": "處新臺幣2萬元以上10萬元以下罰鍰；必要時並得予30日以下停止執行業務", "D": "處新臺幣2萬元以上10萬元以下罰鍰，並得按次處罰；必要時並得予1個月以上1年以下停止執行業務"}, "answer": "D", "explain": "§38第3項規定檢修專業機構、消防設備師或消防設備士未依規定檢修或為不實檢修報告者，處2萬元以上10萬元以下罰鍰並得按次處罰，必要時並得予1個月以上1年以下停止執行業務或停業。3萬至15萬為無資格從事設計檢修者（第1項）；1萬至5萬為管理權人未依§9檢修申報者（第2項）。", "ref": "消防法§38", "evidence": "或為消防安全設備不實檢修報告者，處新臺幣二萬元以上十萬元以下罰鍰，並得按次處罰；必要時，並得予以一個月以上一年以下停止執行業務或停業之處分", "src": "new", "amend": "112-06-21 修正"}, {"id": "N-消防-039", "subject": "刑事法", "topic": "消防法", "stem": "有關消防法災害搶救之規定，下列敘述何者正確？", "opts": {"A": "現場各級搶救人員衡酌搶救目的與救災風險後，如現場無人命危害之虞，得不執行危險性救災行動", "B": "救護車輛、裝備、人力配置標準及緊急救護辦法，由直轄市、縣（市）政府定之", "C": "消防栓之保養、維護，由直轄市、縣（市）政府負責", "D": "救災救護指揮中心僅於中央主管機關設置，統籌全國救災救護事宜"}, "answer": "A", "explain": "§20-1第1項規定現場各級搶救人員應於救災安全前提下衡酌搶救目的與風險，如無人命危害之虞得不執行危險性救災行動，該敘述正確。§24第2項救護車輛等配置標準及緊急救護辦法由中央主管機關會同中央目的事業主管機關定之；§17消防栓由自來水事業機構保養維護；§16規定各級消防機關均應設救災救護指揮中心。", "ref": "消防法§20-1", "evidence": "如現場無人命危害之虞，得不執行危險性救災行動", "src": "new"}, {"id": "N-消防-040", "subject": "刑事法", "topic": "消防法", "stem": "某夜店欲於店內以噴出火焰之方式進行表演，依消防法規定，下列敘述何者正確？", "opts": {"A": "由表演者自行向主管機關報備後即可為之", "B": "僅須事前通報轄區消防分隊，無須經許可", "C": "應由場所之管理權人申請主管機關許可後，始得為之", "D": "違反許可辦法所定安全防護措施者，處新臺幣3千元以下罰鍰"}, "answer": "C", "explain": "§14-1第1項規定供公眾使用建築物及中央主管機關公告之場所，非經場所之管理權人申請主管機關許可，不得使用產生火焰、火花或火星等方式進行表演性質活動；申請人為管理權人，且採許可制而非報備制。違反許可辦法之安全防護措施者，依§41-1處3萬元以上15萬元以下罰鍰，3千元以下係§41施放天燈等之罰鍰。", "ref": "消防法§14-1", "evidence": "非經場所之管理權人申請主管機關許可，不得使用以產生火焰、火花或火星等方式，進行表演性質之活動", "src": "new"}, {"id": "N-災防-001", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，震災（含土壤液化）之中央災害防救業務主管機關為下列何者？", "opts": {"A": "經濟部", "B": "內政部", "C": "農業部", "D": "國家科學及技術委員會"}, "answer": "B", "explain": "依第3條第1項第1款，風災、震災（含土壤液化）、火災、爆炸、火山災害之中央災害防救業務主管機關為內政部。A經濟部主管水災、旱災、礦災、工業管線等；C農業部主管寒害、土石流及大規模崩塌、森林火災、動植物疫災；D國家科學及技術委員會非本條所列之主管機關。", "ref": "災防法§3Ⅰ①", "evidence": "風災、震災（含土壤液化）、火災、爆炸、火山災害：內政部。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-002", "subject": "刑事法", "topic": "災害防救法", "stem": "某工業區發生事故，致懸浮微粒物質大量產生、空氣品質嚴重惡化。依災害防救法規定，此類災害之中央災害防救業務主管機關為何？", "opts": {"A": "衛生福利部", "B": "經濟部", "C": "內政部", "D": "環境部"}, "answer": "D", "explain": "依第3條第1項第5款，毒性及關注化學物質災害、懸浮微粒物質災害之中央災害防救業務主管機關為環境部。A衛生福利部主管生物病原災害；B經濟部主管工業管線、公用氣體與油料管線等災害；C內政部主管風災、震災、火災、爆炸、火山災害，均非懸浮微粒物質災害之主管機關。", "ref": "災防法§3Ⅰ⑤", "evidence": "毒性及關注化學物質災害、懸浮微粒物質災害：環境部。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-003", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，輻射災害之中央災害防救業務主管機關為下列何者？", "opts": {"A": "核能安全委員會", "B": "環境部", "C": "經濟部", "D": "國家科學及技術委員會"}, "answer": "A", "explain": "依第3條第1項第7款，輻射災害之中央災害防救業務主管機關為核能安全委員會。B環境部主管毒性及關注化學物質災害、懸浮微粒物質災害；C經濟部主管水災、旱災、礦災、輸電線路災害等；D國家科學及技術委員會並非本條列舉之中央災害防救業務主管機關。", "ref": "災防法§3Ⅰ⑦", "evidence": "七、輻射災害：核能安全委員會。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-004", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，下列災害與其中央災害防救業務主管機關之對應，何者錯誤？", "opts": {"A": "工業管線災害－經濟部", "B": "森林火災－農業部", "C": "火山災害－內政部", "D": "大規模崩塌災害－內政部"}, "answer": "D", "explain": "依第3條第1項第3款，寒害、土石流及大規模崩塌災害、森林火災、動植物疫災之主管機關為農業部，故D大規模崩塌災害對應內政部錯誤。A工業管線災害屬經濟部（第2款）；B森林火災屬農業部（第3款）；C火山災害屬內政部（第1款），均正確。", "ref": "災防法§3Ⅰ", "evidence": "寒害、土石流及大規模崩塌災害、森林火災、動植物疫災：農業部。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-005", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第3條第2項規定，中央災害防救業務主管機關就其主管災害防救業務之權責，下列何者錯誤？", "opts": {"A": "災害防救業務計畫訂定與修正之研擬及執行", "B": "非屬地方行政轄區之災害防救相關業務之執行、協調", "C": "核定全國緊急災害之應變措施", "D": "災害區域跨越二以上直轄市、縣（市）時之協調及處理"}, "answer": "C", "explain": "「核定全國緊急災害之應變措施」係第6條第4款所定行政院中央災害防救會報之任務，並非第3條第2項中央災害防救業務主管機關之權責，故C錯誤。A為第3條第2項第2款；B為第4款；D為第5款所定權責，均正確。", "ref": "災防法§3Ⅱ、§6", "evidence": "四、核定全國緊急災害之應變措施。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-006", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第3條第2項規定，中央災害防救業務主管機關執行災害資源統籌、資訊彙整與防救業務，並應協同下列何機關及相關機關執行全民防救災教育？", "opts": {"A": "內政部", "B": "文化部", "C": "教育部", "D": "國家發展委員會"}, "answer": "C", "explain": "依第3條第2項第6款，中央災害防救業務主管機關應執行災害資源統籌、資訊彙整與防救業務，並應協同教育部及相關機關執行全民防救災教育。A內政部本身即為部分災害之主管機關，非條文所定協同對象；B文化部、D國家發展委員會均非條文明定之協同機關。", "ref": "災防法§3Ⅱ⑥", "evidence": "執行災害資源統籌、資訊彙整與防救業務，並應協同教育部及相關機關執行全民防救災教育。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-007", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，本法第3條第1項未列舉之「其他災害」，其中央災害防救業務主管機關如何決定？", "opts": {"A": "由內政部公告指定之", "B": "依法律規定或由中央災害防救會報指定", "C": "由中央災害防救委員會決議指定", "D": "由行政院災害防救辦公室指定之"}, "answer": "B", "explain": "依第3條第1項第8款，其他災害依法律規定或由中央災害防救會報指定其中央災害防救業務主管機關；第6條第7款亦將此列為中央災害防救會報之任務。A內政部、C中央災害防救委員會、D行政院災害防救辦公室均無指定權限。", "ref": "災防法§3Ⅰ⑧、§6⑦", "evidence": "其他災害：依法律規定或由中央災害防救會報指定之中央災害防救業務主管機關。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-008", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第22條規定，下列何者屬於各級政府平時應依權責實施之「減災」事項？", "opts": {"A": "國際救災支援之配合", "B": "災害防救物資、器材之儲備及檢查", "C": "危險建築物之緊急評估", "D": "老舊建築物之檢查、補強及維護"}, "answer": "D", "explain": "依第22條第1項第5款，老舊建築物、重要公共建築物與災害防救設施、設備之檢查、補強、維護屬減災事項。A國際救災支援之配合、B物資器材之儲備及檢查，均屬第23條整備事項；C危險建築物之緊急評估屬第27條應變事項。", "ref": "災防法§22Ⅰ⑤", "evidence": "五、老舊建築物、重要公共建築物與災害防救設施、設備之檢查、補強、維護及都市災害防救機能之改善。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-009", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第22條規定，有關災害潛勢之公開資料種類、區域、作業程序及其他相關事項之辦法，由下列何者定之？", "opts": {"A": "各中央災害防救業務主管機關", "B": "內政部", "C": "行政院", "D": "直轄市、縣（市）政府"}, "answer": "A", "explain": "依第22條第4項，同條第1項第7款有關災害潛勢之公開資料種類、區域、作業程序等辦法，由各中央災害防救業務主管機關定之，因各類災害潛勢專業不同而分由各主管機關訂定。B內政部僅主管部分災害，C行政院、D直轄市、縣（市）政府均非授權訂定機關。", "ref": "災防法§22Ⅳ", "evidence": "有關災害潛勢之公開資料種類、區域、作業程序及其他相關事項之辦法，由各中央災害防救業務主管機關定之。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-010", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第22條有關減災之規定，下列敘述何者正確？", "opts": {"A": "公共事業應依地區災害防救計畫實施有關減災事項", "B": "減災事項，各級政府應列入各該災害防救計畫", "C": "災害防救志願組織之促進及輔導屬應變事項", "D": "企業持續營運能力之規劃及推動屬整備事項"}, "answer": "B", "explain": "依第22條第2項，減災事項各級政府應列入各該災害防救計畫，B正確。A錯，第3項規定公共事業應依「其災害防救業務計畫」實施減災事項；C錯，災害防救志願組織之促進、輔導屬第1項第9款減災事項；D錯，企業持續營運能力之規劃及推動屬第1項第16款減災事項。", "ref": "災防法§22Ⅱ", "evidence": "前項所定減災事項，各級政府應列入各該災害防救計畫。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-011", "subject": "刑事法", "topic": "災害防救法", "stem": "某天然氣事業經指定為公共事業，未依其災害防救業務計畫實施第22條第3項所定減災事項，致發生重大損害。依災害防救法規定，應處新臺幣多少罰鍰？", "opts": {"A": "3萬元以上15萬元以下", "B": "5萬元以上25萬元以下", "C": "6萬元以上30萬元以下", "D": "10萬元以上50萬元以下"}, "answer": "A", "explain": "依第56條第2款，公共事業違反第22條第3項等規定，未依其災害防救業務計畫實施減災、整備、應變或復原重建事項，致發生重大損害者，處3萬元以上15萬元以下罰鍰。B為第55條違反警戒區域等之額度；D為第54條規避徵用等之額度；C法無此額度。", "ref": "災防法§56②、§22Ⅲ", "evidence": "有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-012", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第48條規定，金融機構承受災區農業相關設施擔保品而由政府補助者，其承受補助之範圍、方式、程序等辦法，由下列何者定之？", "opts": {"A": "農業部會商金融監督管理委員會", "B": "金融監督管理委員會會商農業部", "C": "財政部會商農業部", "D": "內政部會商金融監督管理委員會"}, "answer": "A", "explain": "依第48條第2項後段，承受補助之範圍、方式、程序及其他相關事項之辦法，由農業部會商金融監督管理委員會定之。B主從顛倒；C財政部、D內政部均非本條授權之訂定機關。注意第43條借款展延之辦法才是由金融監督管理委員會會商相關機關定之，勿混淆。", "ref": "災防法§48Ⅱ", "evidence": "有關承受補助之範圍、方式、程序及其他相關事項之辦法，由農業部會商金融監督管理委員會定之。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-013", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第48條規定，有關災區農地、漁塭等農業相關設施貸款擔保品之承受，下列敘述何者正確？", "opts": {"A": "擔保品部分毀損者，金融機構即得予以承受", "B": "金融機構應依擔保品之市價予以承受", "C": "政府就承受金額最高八成之範圍內予以補助", "D": "適用範圍僅限於農地，不包括漁塭"}, "answer": "C", "explain": "依第48條第2項，金融機構承受者，由政府就其承受金額最高八成之範圍內予以補助，C正確。A錯，須擔保品「全部毀損或滅失」；B錯，係「依貸款餘額」予以承受，非依市價；D錯，第1項明定適用於農地、漁塭及其他農業相關設施。", "ref": "災防法§48Ⅰ、Ⅱ", "evidence": "金融機構依前項規定承受者，由政府就其承受金額最高八成之範圍內予以補助。", "src": "new", "amend": "114-05-28 修正"}, {"id": "N-災防-014", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第2條之災害定義，下列何者屬於「天然災害」？", "opts": {"A": "森林火災", "B": "動植物疫災", "C": "大規模崩塌災害", "D": "懸浮微粒物質災害"}, "answer": "C", "explain": "依第2條第1款第1目，天然災害包括風災、水災、震災（含土壤液化）、旱災、寒害、土石流及大規模崩塌災害、火山災害，C正確。A森林火災、B動植物疫災、D懸浮微粒物質災害均列於同款第2目，非屬天然災害。森林火災雖與自然環境相關，仍屬第2目之災害。", "ref": "災防法§2①", "evidence": "風災、水災、震災（含土壤液化）、旱災、寒害、土石流及大規模崩塌災害、火山災害等天然災害。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-015", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第2條用詞定義，「災害防救業務計畫」係由下列何者就其掌理業務或事務擬訂之災害防救計畫？", "opts": {"A": "中央災害防救委員會", "B": "直轄市、縣（市）災害防救會報", "C": "行政院災害防救辦公室", "D": "中央災害防救業務主管機關及公共事業"}, "answer": "D", "explain": "依第2條第5款，災害防救業務計畫指由中央災害防救業務主管機關及公共事業就其掌理業務或事務擬訂之災害防救計畫。A中央災害防救委員會負責擬訂災害防救基本計畫；B直轄市、縣（市）災害防救會報核定地區災害防救計畫；C行政院災害防救辦公室為幕僚單位。", "ref": "災防法§2⑤", "evidence": "指由中央災害防救業務主管機關及公共事業就其掌理業務或事務擬訂之災害防救計畫。", "src": "new"}, {"id": "N-災防-016", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關中央災害防救組織之規定，下列敘述何者正確？", "opts": {"A": "中央災害防救會報召集人由內政部部長兼任", "B": "中央災害防救委員會主任委員由行政院副院長兼任", "C": "國家災害防救科技中心執行人員搜救及緊急救護運送", "D": "行政院災害防救辦公室以兼職人員處理有關業務"}, "answer": "B", "explain": "依第7條第2項，行政院設中央災害防救委員會，置主任委員一人，由行政院副院長兼任，B正確。A錯，會報召集人由行政院院長兼任；C錯，執行人員搜救及緊急救護運送任務者為行政院國家搜救指揮中心，科技中心僅提供諮詢；D錯，災害防救辦公室置專職人員。", "ref": "災防法§7", "evidence": "行政院設中央災害防救委員會，置主任委員一人，由行政院副院長兼任", "src": "new"}, {"id": "N-災防-017", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，有關災害防救基本計畫之擬訂與核定，下列何者正確？", "opts": {"A": "由中央災害防救會報擬訂，經行政院核定", "B": "由內政部擬訂，經中央災害防救委員會核定", "C": "由中央災害防救委員會擬訂，經中央災害防救會報核定", "D": "由行政院災害防救辦公室擬訂，經立法院核定"}, "answer": "C", "explain": "依第17條第1項，災害防救基本計畫由中央災害防救委員會擬訂，經中央災害防救會報核定後，由行政院函送各中央災害防救業務主管機關及直轄市、縣（市）政府據以辦理，C正確。A、B將擬訂與核定機關錯置；D立法院僅收受行政院每年送交之災害防救白皮書，並無核定權。", "ref": "災防法§17Ⅰ", "evidence": "災害防救基本計畫由中央災害防救委員會擬訂，經中央災害防救會報核定後", "src": "new"}, {"id": "N-災防-018", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法施行細則規定，中央災害防救委員會檢討災害防救基本計畫，以及直轄市、縣（市）政府檢討地區災害防救計畫，原則上分別應每幾年辦理一次？", "opts": {"A": "每五年；每二年", "B": "每三年；每一年", "C": "每四年；每二年", "D": "每五年；每三年"}, "answer": "A", "explain": "依施行細則第6條，中央災害防救委員會每五年應檢討災害防救基本計畫；依第8條，直轄市、縣（市）政府及鄉（鎮、市）、山地原住民區公所每二年應檢討地區災害防救計畫，必要時均得隨時辦理，A正確。災害防救業務計畫依第7條亦為每二年檢討。B、C、D年數均與規定不符。", "ref": "災防法施行細則§6、§8", "evidence": "中央災害防救委員會每五年應依本法第十七條第二項規定", "src": "new"}, {"id": "N-災防-019", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關災害防救計畫核定與備查之規定，下列何者正確？", "opts": {"A": "公共事業擬訂之災害防救業務計畫，送請中央災害防救會報核定", "B": "中央災害防救業務主管機關之業務計畫，報請行政院院會核定", "C": "直轄市、縣（市）地區災害防救計畫，報中央災害防救委員會備查", "D": "鄉（鎮、市）地區災害防救計畫經會報核定後，報所屬上級會報備查"}, "answer": "D", "explain": "依第20條第4項，鄉（鎮、市）、山地原住民區地區災害防救計畫經各該會報核定後實施，並報所屬上級災害防救會報備查，D正確。A錯，公共事業之業務計畫送請中央目的事業主管機關核定；B錯，應報請中央災害防救會報核定；C錯，直轄市、縣（市）地區計畫應報中央災害防救會報備查。", "ref": "災防法§19、§20", "evidence": "經各該災害防救會報核定後實施，並報所屬上級災害防救會報備查。", "src": "new"}, {"id": "N-災防-020", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，災區範圍公告前，遇有大量受災傷病患須收治之情形時，得由下列何機關劃定大量受災傷病患區域，使該區域受災民眾就醫準用受災就醫醫療費用之規定？", "opts": {"A": "行政院", "B": "內政部", "C": "衛生福利部", "D": "直轄市、縣（市）政府"}, "answer": "C", "explain": "依第45條第2項，災區範圍公告前，遇有大量受災傷病患須收治之情形時，衛生福利部得劃定大量受災傷病患區域，該區域受災民眾就醫準用第1項規定，C正確。A行政院係負責公告災區範圍（第51條）；B內政部、D直轄市、縣（市）政府均無本項劃定權限。", "ref": "災防法§45Ⅱ", "evidence": "災區範圍公告前，遇有大量受災傷病患須收治之情形時，衛生福利部得劃定大量受災傷病患區域", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-021", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法規定，中央災害應變中心得視災情研判情況或聯繫需要，於地方災害應變中心或適當地點成立下列何者，以整合救災資源，協助地方政府執行救災事宜？", "opts": {"A": "前進指揮所", "B": "前進協調所", "C": "緊急應變小組", "D": "備援應變中心"}, "answer": "B", "explain": "依第13條第2項，中央災害應變中心得於地方災害應變中心或適當地點成立前進協調所，B正確。A前進指揮所係第12條由地方政府及公所視需要成立；C緊急應變小組係第14條由計畫指定之機關、單位或公共事業設置；D備援應變中心係第28條第3項為免中央災害應變中心無法運作而異地設置。", "ref": "災防法§13Ⅱ", "evidence": "於地方災害應變中心或適當地點成立前進協調所，整合救災資源，協助地方政府執行救災事宜。", "src": "new"}, {"id": "N-災防-022", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關地方災害應變中心之規定，下列敘述何者錯誤？", "opts": {"A": "直轄市、縣（市）政府首長應視災害規模成立並擔任指揮官", "B": "得視需要成立前進指揮所，就近處理救災及後勤支援", "C": "其成立時機、程序及編組，由內政部統一定之", "D": "鄉（鎮、市）公所首長亦應視災害規模成立災害應變中心"}, "answer": "C", "explain": "依第12條第2項，地方災害應變中心或前進指揮所之成立時機、程序及編組，由直轄市、縣（市）政府及鄉（鎮、市）、山地原住民區公所定之，非由內政部統一訂定，故C錯誤。A、D見第12條第1項首長應視災害規模成立並擔任指揮官；B同項後段得視需要成立前進指揮所。", "ref": "災防法§12", "evidence": "前項災害應變中心或前進指揮所成立時機、程序及編組，由直轄市、縣（市）政府及鄉（鎮、市）、山地原住民區公所定之。", "src": "new"}, {"id": "N-災防-023", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關各級災害應變中心運作之規定，下列敘述何者錯誤？", "opts": {"A": "參與編組機關首長應依規定親自或指派權責人員進駐", "B": "各級災害應變中心應有固定之運作處所並作定期演練", "C": "為免中央災害應變中心無法運作，應異地設置備援應變中心", "D": "中央災害應變中心指揮官由該業務主管機關首長當然擔任"}, "answer": "D", "explain": "依第13條第1項，中央災害防救業務主管機關首長決定中央災害應變中心開設時機及分級，成立後立即報告中央災害防救會報召集人，並由召集人指定指揮官，非由首長當然擔任，故D錯誤。A為第28條第1項；B為第28條第2項；C為第28條第3項，均正確。", "ref": "災防法§13Ⅰ、§28", "evidence": "應於成立後，立即報告中央災害防救會報召集人，並由召集人指定指揮官。", "src": "new"}, {"id": "N-災防-024", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法施行細則規定，各級政府應充實災害應變中心固定運作處所之資訊、通信等災害防救器材、設備，其功能測試及演練之最低頻率為何？", "opts": {"A": "每月測試一次；每半年演練一次", "B": "每週測試一次；每季演練一次", "C": "每月測試一次；每年演練一次", "D": "每季測試一次；每年演練一次"}, "answer": "A", "explain": "依施行細則第13條，各級政府應依本法第28條第2項，充實災害應變中心固定運作處所之資訊、通信等器材設備，隨時保持堪用狀態，並每月至少實施功能測試一次，每半年至少舉辦演練一次，並得隨時為之，A正確。B、C、D之頻率均與規定不符。", "ref": "災防法施行細則§13", "evidence": "每月至少實施功能測試一次，每半年至少舉辦演練一次", "src": "new"}, {"id": "N-災防-025", "subject": "刑事法", "topic": "災害防救法", "stem": "颱風即將登陸，某鎮公所研判轄內山區聚落有發生土石流之虞，擬依災害防救法第24條第1項處理居民撤離事宜。下列敘述何者正確？", "opts": {"A": "勸告或強制撤離之權限，專屬於中央災害應變中心指揮官", "B": "鎮公所於有發生災害之虞時，即應勸告或強制居民撤離並作適當安置", "C": "居民拒絕撤離者，得依第55條處新臺幣5萬元以上25萬元以下罰鍰", "D": "強制撤離須先報經中央災害防救會報核定後，始得為之"}, "answer": "B", "explain": "依第24條第1項，直轄市、縣（市）政府及鄉（鎮、市、區）公所於災害發生或有發生之虞時，應勸告或強制其撤離並作適當安置，B正確。A錯，鎮公所即有權限；C錯，第55條第1款僅處罰違反第24條第2項之強制措施或處置，未及於第1項撤離；D錯，法無須先經核定之規定。", "ref": "災防法§24Ⅰ", "evidence": "山地原住民區公所於災害發生或有發生之虞時，應勸告或強制其撤離，並作適當之安置。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-026", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第30條規定，各級政府成立災害應變中心後，指揮官於災害應變範圍內得實施之事項，下列何者錯誤？", "opts": {"A": "徵用、徵購民間搜救犬、救災機具等裝備", "B": "國外救災組織來臺協助救災之申請、接待及協調聯繫", "C": "災情之彙整、統計、陳報及評估", "D": "捐贈物資、款項之分配與管理及救助金之發放"}, "answer": "D", "explain": "「捐贈物資、款項之分配與管理及救助金之發放」係第37條第1項第4款災後復原重建事項，非第30條第1項指揮官於應變範圍內實施之事項，故D錯誤。A為第30條第1項第5款；B為第9款；C為第10款，均屬指揮官得實施之事項。", "ref": "災防法§30Ⅰ、§37Ⅰ④", "evidence": "四、捐贈物資、款項之分配與管理及救助金之發放。", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-027", "subject": "刑事法", "topic": "災害防救法", "stem": "颱風期間，某登山客未取得臨時通行證，擅自進入應變中心指揮官依法劃定之警戒區域，受困後經災害應變中心搜救獲救。依災害防救法規定，下列敘述何者正確？", "opts": {"A": "各級政府得就搜救所生費用，以書面命獲救者繳納", "B": "搜救屬政府法定職責，所生費用一律不得向獲救者求償", "C": "搜救費用之計算、分擔等辦法，由交通部定之", "D": "須經法院判決確定後，始得命獲救者繳納搜救費用"}, "answer": "A", "explain": "依第30條第3項，違反第1項第2款、第3款規定致遭遇危難，經各級災害應變中心搜救獲救者，各級政府得就搜救所生費用，以書面命獲救者或可歸責之業者繳納，A正確。B錯，法有明文得命繳納；C錯，辦法由內政部定之；D錯，以書面命繳納即可，無須法院判決。", "ref": "災防法§30Ⅲ", "evidence": "各級政府得就搜救所生費用，以書面命獲救者或可歸責之業者繳納", "src": "new", "amend": "111-06-15 全文修正"}, {"id": "N-災防-028", "subject": "刑事法", "topic": "災害防救法", "stem": "颱風期間，某縣政府為實施災害應變措施，依災害防救法第31條第1項命轄內某倉儲業者保管救災所需之沙包及飲用水，該業者拒絕之。依法應處新臺幣多少罰鍰？", "opts": {"A": "3萬元以上15萬元以下", "B": "5萬元以上25萬元以下", "C": "10萬元以上50萬元以下", "D": "30萬元以上50萬元以下"}, "answer": "C", "explain": "依第54條第2款，違反第31條第3項規定，規避、妨礙或拒絕各級政府依同條第1項所為徵用、徵購或命其保管之處分者，處10萬元以上50萬元以下罰鍰，C正確。A為拒絕第31條第2項檢查之額度（第56條）；B為第55條之額度；D為第53條第2項明知不實而通報之罰金額度。", "ref": "災防法§54②", "evidence": "有下列情形之一者，處新臺幣十萬元以上五十萬元以下罰鍰：", "src": "new"}, {"id": "N-災防-029", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法罰則規定，下列違規行為與罰鍰額度之對應，何者正確？", "opts": {"A": "擅自使用緊急應變警報訊號：3萬元以上15萬元以下", "B": "規避指揮官所為之徵調處分：5萬元以上25萬元以下", "C": "拒絕政府派員進入業者處所檢查：3萬元以上15萬元以下", "D": "拒絕危險建築物之拆除處分：10萬元以上50萬元以下"}, "answer": "C", "explain": "依第56條第1款，規避、妨礙或拒絕各級政府依第31條第2項所為之檢查，處3萬元以上15萬元以下罰鍰，C正確。A錯，擅用警報訊號依第55條第5款處5萬元 民之事由者，不得請求；D錯，第3項規定應以書面敘明理由向「該執行機關」請求，非向中央災害防救會報。", "ref": "災防法§34", "evidence": "前項損失補償，應以金錢為之，並以補償實際所受之損失為限。", "src": "new"}, {"id": "N-災防-034", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關支援協助及國軍支援之規定，下列敘述何者正確？", "opts": {"A": "縣（市）政府無法因應災害時得申請國軍支援，但重大災害時國軍應主動協助", "B": "國防部依災害防救需要，不得運用應召之後備軍人支援災害防救", "C": "申請國軍支援或國軍主動協助救災之辦法，由內政部會同國防部定之", "D": "鄉（鎮、市）公所無法因應災害時，由中央主管機關主動派員協助"}, "answer": "A", "explain": "依第35條第4項，直轄市、縣（市）政府及中央災害防救業務主管機關無法因應時得申請國軍支援，但發生重大災害時國軍應主動協助，A正確。B錯，第5項國防部得運用應召之後備軍人；C錯，辦法由國防部會同內政部定之；D錯，第1項規定由直轄市、縣政府主動派員協助。", "ref": "災防法§35", "evidence": "無法因應災害處理時，得申請國軍支援。但發生重大災害時，國軍應主動協助災害防救。", "src": "new"}, {"id": "N-災防-035", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第43條規定，金融機構對災區受災居民於災害前已辦理之借款，其本金償還期限予以展延，致其放款期限超過多少年者，不受銀行法第38條規定之限制？", "opts": {"A": "三十年", "B": "二十年", "C": "二十五年", "D": "四十年"}, "answer": "A", "explain": "依第43條第2項，本金償還期限展延致其放款期限超過三十年者，不受銀行法第三十八條規定之限制，A正確。B、C、D年數均與規定不符。另同條第1項規定展延期間之利息應免予計收並由中央政府補貼，相關辦法由金融監督管理委員會會商相關機關定之。", "ref": "災防法§43Ⅱ", "evidence": "前項本金償還期限展延致其放款期限超過三十年者，不受銀行法第三十八條規定之限制。", "src": "new"}, {"id": "N-災防-036", "subject": "刑事法", "topic": "災害防救法", "stem": "災區受災企業於其復工營業計畫範圍內所需營業資金向金融機構貸款，必要時由相關信用保證基金提供信用保證。依災害防救法規定，其信用保證成數及保證手續費為何？", "opts": {"A": "八成；保證手續費減半計收", "B": "九成；保證手續費免向受災企業計收", "C": "七成；保證手續費由政府補貼半數", "D": "十成；保證手續費照常計收"}, "answer": "B", "explain": "依第49條第7項，前項貸款必要時由相關信用保證基金提供信用保證，信用保證成數為九成，送保期間保證手續費免向受災企業計收，B正確。A、C、D之成數及手續費處理方式均與規定不符。另須區辨第48條農業擔保品承受之政府補助上限為最高八成。", "ref": "災防法§49Ⅶ", "evidence": "信用保證成數為九成，送保期間保證手續費免向受災企業計收。", "src": "new"}, {"id": "N-災防-037", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法有關災區受災居民稅捐優惠及災區之規定，下列敘述何者錯誤？", "opts": {"A": "災區範圍由行政院公告並刊登政府公報", "B": "受災居民自政府或民間領取之救助金、慰問金免納所得稅", "C": "前述救助金不得作為扣押、抵銷或強制執行之標的", "D": "災區土地及建築物減免地價稅、房屋稅之條件，由財政部定之"}, "answer": "D", "explain": "依第44條第4項，災區土地及建築物減免地價稅及房屋稅之一定條件、減免期限及範圍，由災區之直轄市、縣（市）政府以自治條例定之，並報財政部備查，非由財政部訂定，故D錯誤。A見第51條；B見第44條第1項；C見第44條第5項，均正確。", "ref": "災防法§44Ⅳ", "evidence": "前項一定條件、減免期限及範圍，由災區之直轄市、縣（市）政府以自治條例定之，並報財政部備查。", "src": "new"}, {"id": "N-災防-038", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第61條規定，執行災害防救事項人員因執行職務死亡，或因傷病致重度身心障礙以上者，分別給與一次撫卹金或一次身心障礙給付多少基數？", "opts": {"A": "90個基數；36個基數", "B": "100個基數；40個基數", "C": "90個基數；30個基數", "D": "72個基數；36個基數"}, "answer": "A", "explain": "依第61條第1項第3款，死亡者給與一次撫卹金九十個基數；依第2款第1目，重度身心障礙以上者給與三十六個基數，A正確。中度為十八個基數、輕度為八個基數；基數以公務人員委任第五職等年功俸最高級月支俸額為準。B、C、D之基數均與規定不符。", "ref": "災防法§61Ⅰ②③", "evidence": "三、死亡者：給與一次撫卹金九十個基數。", "src": "new"}, {"id": "N-災防-039", "subject": "刑事法", "topic": "災害防救法", "stem": "依災害防救法第62條規定，對因災害失蹤之人聲請法院確定其死亡及死亡時間，其聲請期限及法院公示催告之陳報期間，下列何者正確？", "opts": {"A": "災害發生後6個月內；2星期以上1個月以下", "B": "災害發生後1年內；3星期以上2個月以下", "C": "災害發生後1年內；1個月以上3個月以下", "D": "災害發生後2年內；3星期以上2個月以下"}, "answer": "B", "explain": "依第62條第2項，聲請應於災害發生後一年內為之；依第5項，法院准許聲請者應公示催告，其陳報期間應定為自揭示之日起三星期以上二個月以下，B正確。A、C、D之期限或陳報期間均與規定不符。另失蹤人以法院裁定所確定死亡之時，推定其為死亡。", "ref": "災防法§62Ⅱ、Ⅴ", "evidence": "其陳報期間，應定為自揭示之日起三星期以上二個月以下。", "src": "new"}, {"id": "N-災防-040", "subject": "刑事法", "topic": "災害防救法", "stem": "災區受災民眾對就其所受損害依法應負賠償責任之人提起民事訴訟，為保全強制執行而聲請假扣押時，依災害防救法規定，法院所命供之擔保不得高於請求標的金額或價額之多少？", "opts": {"A": "二分之一", "B": "三分之一", "C": "五分之一", "D": "十分之一"}, "answer": "D", "explain": "依第50條第2項，受災民眾為保全強制執行而聲請假扣押或假處分者，法院所命供之擔保不得高於請求標的金額或價額之十分之一，D正確；該擔保並得由主管機關出具保證書代之。A、B、C比例均與規定不符。另同條第1項規定起訴暫免繳納裁判費。", "ref": "災防法§50Ⅱ", "evidence": "法院依民事訴訟法所命供之擔保，不得高於請求標的金額或價額之十分之一。", "src": "new"}, {"id": "N-國軍-001", "subject": "刑事法", "topic": "災害防救法", "stem": "依「國軍協助災害防救辦法」規定，該辦法之法源依據及其主管機關，下列何者正確？", "opts": {"A": "依災害防救法第三十五條第六項規定訂定，主管機關為國防部", "B": "依災害防救法第三十五條第四項規定訂定，主管機關為內政部", "C": "依災害防救法第三十條第四項規定訂定，主管機關為國防部", "D": "依災害防救法第十五條規定訂定，主管機關為內政部消防署"}, "answer": "A", "explain": "該辦法第1條明定係依災害防救法第35條第6項訂定，第2條明定主管機關為國防部。因國軍協助災害防救涉及兵力調派與作戰區運用，故非以內政部或消防署為主管機關。須注意災防法第30條第4項係民防團隊編組訓練辦法之法源，第15條則為結合民防與全民防衛動員體系辦法之法源，三者不得混淆。", "ref": "國軍協助災害防救辦法§1、§2", "evidence": "本辦法依災害防救法（以下簡稱本法）第三十五條第六項規定訂定之。", "tag": "子法", "src": "new"}, {"id": "N-國軍-002", "subject": "刑事法", "topic": "災害防救法", "stem": "依國軍協助災害防救辦法規定，該辦法所稱「重大災害」，係依中央災害應變中心各類型災害何種開設時機及災害狀 置設計誘答。", "ref": "消防法§25-2", "evidence": "提供所屬消防人員執行職務必要之安全衛生防護設備及措施", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-006", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，各級消防機關對於建置安全衛生管理系統、提供安全衛生防護設備及措施等事項，尚應如何處理？", "opts": {"A": "報請中央主管機關核定後始得實施", "B": "公告周知所屬消防人員", "C": "送請公務人員協會同意後對外公布", "D": "提交消防人員職務安全衛生諮詢會審議"}, "answer": "B", "explain": "第25條之2第3項課予各級消防機關「公告周知所屬消防人員」之義務，目的在於使基層人員知悉機關已建置之管理系統與可得使用之防護設備、措施，以落實知情權並便於監督。本項無須上級核定、協會同意或諮詢會審議；與§25-4「報請中央主管機關備查」及§25-5「公告查核結果」之程序性質不同，應分別記憶。", "ref": "消防法§25-2", "evidence": "各級消防機關應將前項各款事項公告周知所屬消防人員", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-007", "subject": "刑事法", "topic": "消防法", "stem": "甲消防局預算員額數為一百八十人，乙消防局預算員額數為二百五十人。依消防法規定，關於二者安全衛生專責單位及專責人員之設置，下列敘述何者正確？", "opts": {"A": "甲局與乙局均應設安全衛生專責單位並置專責人員", "B": "甲局應設專責單位，乙局得僅置安全衛生專責人員", "C": "甲局得僅置安全衛生專責人員，乙局應設專責單位並置專責人員", "D": "甲局免設專責單位亦免置專責人員，乙局得僅置專責人員"}, "answer": "C", "explain": "第25條之2第1項原則要求各級消防機關「應設安全衛生專責單位及置專責人員」，但書就預算員額數未滿二百人者設減輕規定，得僅置專責人員而免設專責單位。甲局一百八十人未滿門檻，適用但書；乙局二百五十人已達門檻，須單位與人員兼備。門檻係以「預算員額數」而非實際在職人數計算。", "ref": "消防法§25-2", "evidence": "各級消防機關應設安全衛生專責單位及置專責人員。但預算員額數未滿二百人者，得僅置安全衛生專責人員", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-008", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，各級消防機關組成「安全及衛生防護小組」，係依下列何者之相關規定辦理？", "opts": {"A": "職業安全衛生法第二十三條", "B": "公務人員協會法第六條", "C": "災害防救法第二十二條", "D": "公務人員保障法第十九條"}, "answer": "D", "explain": "第25條之3並未自行創設防護小組，而是以公務人員保障法第19條（服務機關應提供安全及衛生之工作條件、防護措施）為法源，再就其成員組成附加消防專屬之比例要求。故本條屬「接續既有制度並加嚴」之立法。消防人員為公務人員，原則不適用職業安全衛生法之勞工保護體系，此為區辨關鍵。", "ref": "消防法§25-3", "evidence": "各級消防機關依公務人員保障法第十九條相關規定組成安全及衛生防護小組之成員", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-009", "subject": "刑事法", "topic": "消防法", "stem": "某消防局組成安全及衛生防護小組，成員共十五人，其中女性四人、消防基層人員三人。依消防法規定，該小組之組成有何問題？", "opts": {"A": "任一性別比例未達法定下限，不符規定", "B": "消防基層人員比例未達法定下限，不符規定", "C": "任一性別及消防基層人員比例均未達法定下限", "D": "任一性別及消防基層人員比例均已符合規定"}, "answer": "A", "explain": "第25條之3設有雙重比例下限：任一性別不得低於三分之一，消防基層人員不得低於五分之一。十五人之小組，性別下限為十五乘三分之一等於五人，女性僅四人，未達下限；基層人員下限為十五乘五分之一等於三人，實有三人，恰符規定。故僅性別比例違反規定。計算時應分別套用不同分母，勿混用。", "ref": "消防法§25-3", "evidence": "任一性別比例不得低於三分之一，其消防基層人員比例不得低於五分之一", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-010", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，各級消防機關應辦理並報請中央主管機關備查之事項，包括下列何者？", "opts": {"A": "定期公告消防人員安全衛生管理系統之查核結果及獎懲建議", "B": "定期統計及評估消防人員安全衛生管理系統之建置成效", "C": "定期檢討消防人員安全衛生防護設備之採購預算及汰換期程", "D": "定期辦理消防人員安全衛生教育訓練並考核其成效"}, "answer": "B", "explain": "第25條之4第1款要求各級消防機關「定期統計及評估」管理系統之建置成效，並與第2款之事故通報及調查紀錄同須報請中央主管機關備查，形成由下而上的自我檢視機制。至於查核結果之公告與獎懲建議係中央主管機關之職權（§25-5），教育訓練規定於§25-7，採購預算則屬§25-9經費編列範疇。", "ref": "消防法§25-4", "evidence": "定期統計及評估消防人員安全衛生管理系統之建置成效", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-011", "subject": "刑事法", "topic": "消防法", "stem": "消防人員因其工作場所、作業活動或其他職業上原因，引發疾病、傷害、失能或死亡之事故時，依消防法規定，各級消防機關應如何處理？", "opts": {"A": "於事故發生後一個月內函報中央主管機關並副知諮詢會", "B": "逕行移請內政部災害事故調查會調查並公布調查報告", "C": "即時通報並作成調查紀錄", "D": "通報中央主管機關後，由中央主管機關作成調查紀錄"}, "answer": "C", "explain": "第25條之4第2款之要件涵蓋「疾病、傷害、失能或死亡」四種結果，且原因不限於災害搶救現場，凡因工作場所、作業活動或其他職業上原因所引發者均屬之；處理方式為「即時通報並作成調查紀錄」，並依本條前段報請中央主管機關備查。調查紀錄之作成義務在各級消防機關，非中央主管機關，亦非以災害事故調查會取代。", "ref": "消防法§25-4", "evidence": "引發疾病、傷害、失能或死亡之事故，即時通報並作成調查紀錄", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-012", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，得查核各級消防機關消防人員安全衛生管理系統建置情形者，為下列何者？", "opts": {"A": "中央主管機關或直轄市、縣（市）主管機關", "B": "消防人員職務安全衛生諮詢會或其委託之學校", "C": "中央衛生主管機關評鑑合格之區域醫院或醫學中心", "D": "中央主管機關或其委託之團體、機關（構）及學校"}, "answer": "D", "explain": "第25條之5第1項採「自行查核或委託查核」雙軌設計，受託對象包括團體、機關（構）及學校，使外部專業得以引入；但查核結果之公告權仍專屬中央主管機關，不得由受託者對外發布。地方主管機關非本條之查核主體；評鑑合格之區域醫院或醫學中心則是§25-6健康檢查之實施機構，屬不同制度。", "ref": "消防法§25-5", "evidence": "中央主管機關或其委託之團體、機關（構）及學校，得查核各級消防機關消防人員安全衛生管理系統之建置情形", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-013", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，關於消防人員安全衛生管理系統建置情形之查核結果，下列處理方式何者正確？", "opts": {"A": "由中央主管機關公告查核結果，績效良好者得予獎勵及公開表揚", "B": "由受查核機關自行公告結果，績效良好者由其上級機關辦理表揚", "C": "查核結果僅供內部管制，執行不力者應逕行移送懲戒法院審理", "D": "查核結果應送諮詢會公告，執行不力者由諮詢會提出懲處建議"}, "answer": "A", "explain": "第25條之5建立「公告＋獎懲並行」之課責機制：第1項由中央主管機關公告查核結果；第2項對績效良好者得予獎勵及公開表揚，對執行不力者得令其改善及提出懲處建議。須注意中央主管機關僅「提出懲處建議」，實際懲處仍依公務人員相關法制辦理，並非由本條直接發動懲戒程序。", "ref": "消防法§25-5", "evidence": "績效良好者，中央主管機關得予獎勵及公開表揚；執行不力者，得令其改善及提出懲處建議", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-014", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，各級消防機關對所屬消防人員實施特定項目健康檢查，應由下列何種醫療機構為之？", "opts": {"A": "消防機關所在地之衛生所或其指定之基層診所", "B": "中央衛生主管機關評鑑合格之區域醫院或醫學中心", "C": "中央衛生主管機關評鑑合格之地區醫院以上醫院", "D": "勞動主管機關認可之職業醫學科特約醫院"}, "answer": "B", "explain": "第25條之6第3項將實施機構限縮於「中央衛生主管機關評鑑合格之區域醫院或醫學中心」，係考量消防人員職業暴露（如燃燒生成物、致癌物）之檢查項目較為特殊，須具備相當設備與判讀能力。地區醫院、衛生所、診所或勞動主管機關認可之特約醫院均不符法定層級要求，命題常以降低層級設計誘答。", "ref": "消防法§25-6", "evidence": "第一項健康檢查應由中央衛生主管機關評鑑合格之區域醫院或醫學中心為之", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-015", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，關於消防人員健康檢查紀錄之保存、費用負擔及臨時健康檢查之配合，下列敘述何者正確？", "opts": {"A": "紀錄由受檢消防人員自行保存，費用由機關與受檢人各負擔二分之一", "B": "紀錄由醫院保存並定期函送中央主管機關，費用由中央衛生主管機關負擔", "C": "紀錄由各級消防機關保存並負擔費用，實施臨時健康檢查時應提供救災作業經歷資料予醫院", "D": "紀錄由中央主管機關保存並負擔費用，臨時健康檢查時由消防人員自行陳述救災經歷"}, "answer": "C", "explain": "第25條之6第3項課予各級消防機關三項義務：保存健康檢查紀錄、負擔健康檢查費用，以及實施臨時健康檢查時提供救災作業經歷資料予醫院。後者用意在於使醫師得以掌握暴露史（何時、何種災害、暴露何種物質），提高診斷之關聯性判斷品質，不得改由消防人員自行口述替代。", "ref": "消防法§25-6", "evidence": "健康檢查紀錄應由各級消防機關予以保存，並負擔健康檢查費用；實施臨時健康檢查時，各級消防機關應提供救災作業經歷資料予醫院", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-016", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，消防人員健康檢查之項目及方式，應由下列何者定之？", "opts": {"A": "中央衛生主管機關會商中央主管機關", "B": "各級消防機關會商當地衛生主管機關", "C": "中央主管機關會同中央勞動主管機關", "D": "中央主管機關會商衛生、環保等相關機關"}, "answer": "D", "explain": "第25條之6第1項規定檢查項目及方式由中央主管機關「會商衛生、環保等相關機關」定之。之所以納入環保機關，係因消防人員暴露之危害多與化學物質、燃燒生成物有關，須借重環境用毒物專業。請注意主導機關仍為中央主管機關（內政部），且法條用語為「會商」而非「會同」，二者法律效果不同。", "ref": "消防法§25-6", "evidence": "其檢查之項目及方式，由中央主管機關會商衛生、環保等相關機關定之", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-017", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，關於消防人員之安全衛生教育及訓練，下列敘述何者正確？", "opts": {"A": "各級消防機關應施以執行職務與預防災變所必要之安全衛生教育及訓練，消防人員有接受之義務", "B": "各級消防機關得視預算狀況辦理安全衛生教育及訓練，消防人員得自願報名參加", "C": "安全衛生教育及訓練應由中央主管機關統一辦理，各級消防機關僅負責薦送人員", "D": "安全衛生教育及訓練由消防人員職務安全衛生諮詢會規劃並委託學校辦理"}, "answer": "A", "explain": "第25條之7第1項採「機關應施以、人員有義務接受」之雙向設計：機關端為法定作為義務，訓練內容須與執行職務及預防災變之必要性相連結；人員端則明定接受義務，故無自由選擇參訓與否之空間。此與§25-6第2項健康檢查之接受義務為相同立法模式，二者常合併命題。", "ref": "消防法§25-7", "evidence": "各級消防機關對所屬消防人員應施以執行職務與預防災變所必要之安全衛生教育及訓練；消防人員有接受之義務", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-018", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，消防人員必要之安全衛生教育與訓練事項、訓練單位之資格條件及管理等應遵行事項之規則，由下列何者定之？", "opts": {"A": "各級消防機關擬訂後報請中央主管機關核定", "B": "中央主管機關", "C": "中央主管機關會商中央衛生主管機關", "D": "消防人員職務安全衛生諮詢會"}, "answer": "B", "explain": "第25條之7第2項授權中央主管機關單獨訂定「規則」，範圍包括訓練事項、訓練單位之資格條件、管理及其他應遵行事項。與§25-6第1項健康檢查項目須「會商衛生、環保等相關機關」相較，本項無會商要求，屬純粹單一機關授權。此外授權法規之名稱為「規則」，而§25-1第4項為「辦法」，用語差異亦為命題重點。", "ref": "消防法§25-7", "evidence": "前項必要之安全衛生教育與訓練事項、訓練單位之資格條件、管理及其他應遵行事項之規則，由中央主管機關定之", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-019", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，各級消防機關應考量消防人員下列何種因素之特殊需要，提供適當之環境、安全衛生防護設備及措施？", "opts": {"A": "年資、職務層級及勤務類別", "B": "婚姻狀況、家庭照顧責任及宗教信仰", "C": "性別、年齡、身心障礙", "D": "體能測驗成績、專長證照及服務地區"}, "answer": "C", "explain": "第25條之8第1項揭示防護之「個別化」原則，明列性別、年齡、身心障礙等因素，回應過去防護裝備多以成年男性標準體型設計、女性或高齡人員穿戴不合身而增加風險之實務問題。年資、職級、勤務類別、婚姻或體能成績等均非本項所列因素，作答時應緊扣法條例示之三類。", "ref": "消防法§25-8", "evidence": "各級消防機關應考量消防人員性別、年齡、身心障礙等因素之特殊需要提供適當之環境、安全衛生防護設備及措施", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-020", "subject": "刑事法", "topic": "消防法", "stem": "某消防局所屬女性消防人員甲現為妊娠中，乙則為分娩後未滿二年。依消防法規定，該局除提供適當之環境、安全衛生防護設備及措施外，尚應如何處理？", "opts": {"A": "應一律調任內勤，並停止其所有外勤救災勤務", "B": "應徵詢其本人意願，由其自行決定是否調整勤務", "C": "應報請中央主管機關核定後，始得調整其勤務", "D": "應依醫師適性評估建議，採取勤務調整或必要之健康保護措施"}, "answer": "D", "explain": "第25條之8第2項就妊娠中或分娩後未滿二年之女性消防人員設特別保護，其關鍵在於「依醫師適性評估建議」為判斷基礎，再採取勤務調整或必要之健康保護措施。故既非一律調任內勤之僵化處理，亦非全憑當事人意願或上級核定；此種以醫師適性評估為門檻之設計，與職場母性健康保護之通例一致。", "ref": "消防法§25-8", "evidence": "並應依醫師適性評估建議，採取勤務調整或必要之健康保護措施", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-021", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，關於消防人員安全衛生防護所需經費之編列，下列敘述何者正確？", "opts": {"A": "各級政府辦理安全衛生防護設備、措施及健康檢查所需經費，應優先編列預算支應", "B": "中央主管機關辦理上述事項所需經費，應由中央統籌分配稅款優先支應", "C": "各級消防機關所需經費，得於年度預算有賸餘時視財政狀況勻支", "D": "上述經費應由各級政府與受檢消防人員按比例分擔"}, "answer": "A", "explain": "第25條之9之義務主體為「各級政府」而非僅消防機關，且涵蓋防護設備、防護措施及健康檢查三項經費，並課予「應優先編列預算」之強制性，目的在避免安全衛生預算長期被排擠。搭配§25-6第3項健康檢查費用由各級消防機關負擔可知，受檢消防人員不負擔任何費用。", "ref": "消防法§25-9", "evidence": "各級政府辦理消防人員之安全衛生防護設備、措施及健康檢查所需經費，應優先編列預算支應", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-022", "subject": "刑事法", "topic": "消防法", "stem": "依消防法規定，消防人員職務安全衛生諮詢會委員任一性別比例，不得少於下列何者？", "opts": {"A": "四分之一", "B": "三分之一", "C": "五分之一", "D": "二分之一"}, "answer": "B", "explain": "第25條之1第2項明定諮詢會委員任一性別比例不得少於三分之一。請與§25-3並列記憶：安全及衛生防護小組之任一性別比例亦不得低於三分之一，但另有「消防基層人員比例不得低於五分之一」之要求；五分之一僅適用於基層人員比例，不可誤植於性別比例，此為本章之一最常見之數字混淆點。", "ref": "消防法§25-1", "evidence": "諮詢會委員任一性別比例不得少於三分之一", "tag": "職安", "src": "new", "amend": "113-11-29 增訂（114-06-01 施行）"}, {"id": "N-職安-023", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊「救災訓練與安全方案」，消防、義消人員於災害現場執行災害搶救時，應貫徹下列何項救災安全文化？", "opts": {"A": "生命至上，財產次之", "B": "先求無過，再求有功", "C": "安全有確認，搶救才開始", "D": "救人優先，滅火其次"}, "answer": "C", "explain": "手冊第一章於「救災安全」之名詞定義中，要求消防、義消人員透過精進救災規範與平時教育訓練，掌握救災情資並經由安全管理機制評估與執行救災戰術（技），貫徹「安全有確認，搶救才開始」之救災安全文化。此語序強調安全確認為搶救之前置要件，而非與搶救併行或事後補正，是本章最核心的口號式命題點。", "ref": "救災安全手冊第一章", "evidence": "貫徹「安全有確認，搶救才開始」之救災安全文化", "tag": "職安", "src": "new"}, {"id": "N-職安-024", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊「救災訓練與安全方案」，要求各級消防機關落實指揮頻道及救災頻道分流，其主要目的為何？", "opts": {"A": "避免救災頻道遭民眾監聽，確保救災情資之保密", "B": "使指揮中心得同時派遣多個分隊，縮短出動時間", "C": "讓現場各小組得自行選擇波道，以減少無線電佔頻", "D": "確保發生MAYDAY時，指揮幕僚隊可持續使用指定頻道與受困人員聯繫，受困者無須切換波道"}, "answer": "D", "explain": "頻道分流屬手冊第一章「安全管理機制策略」中之無線電通訊安全管制。其設計理由在於：受困人員發出MAYDAY時往往體力與意識均受限，若仍須切換波道才能與指揮端聯繫，將延誤救援並增加操作失誤。故以指揮頻道與救災頻道分流，使指揮幕僚隊得持續使用指定頻道與受困者保持聯繫。", "ref": "救災安全手冊第一章", "evidence": "要求各級消防機關落實指揮頻道及救災頻道分流，以確保發生 MAYDAY 時，指揮幕僚隊可持續使用指定頻道與受困人員聯繫，受困者無須切換波道", "tag": "職安", "src": "new"}, {"id": "N-職安-025", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊第一章附錄「消防機關事故調查分級分層機制執行計畫」，導致三人以上消防人員受傷且無需住院治療之事件，屬於下列何級事件，並由何層級辦理檢討？", "opts": {"A": "第3級嚴重事件，由局本部辦理", "B": "第2級輕微事件，由大隊辦理", "C": "第1級幾近錯誤事件，由分隊辦理", "D": "第4級死亡或重傷事件，由局本部成立事故調查小組"}, "answer": "A", "explain": "該計畫將事件分為四級：第1級幾近錯誤事件（有驚無險、未造成傷亡）由分隊辦理；第2級輕微事件（2人以內受傷且無需住院）由大隊辦理；第3級嚴重事件（3人以上受傷且無需住院，或受傷需住院）由局本部辦理；第4級為死亡或重傷事件。判斷關鍵為受傷人數與是否需住院治療兩項要件。", "ref": "救災安全手冊第一章附錄（消防機關事故調查分級分層機制執行計畫）", "evidence": "第 3級-嚴重事件：指下列事件：(一)導致 3人以上消防人員受傷，且無需住院治療之事件。", "tag": "職安", "src": "new"}, {"id": "N-職安-026", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊「事故安全官作業原則」所引NFPA 1521，關於健康安全官（HSO）與事故安全官（ISO）職責之敘述，下列何者正確？", "opts": {"A": "健康安全官負責災害現場之安全管理，事故安全官負責廳舍及心理安全", "B": "健康安全官負責消防人員日常健康安全管理，事故安全官負責災害現場之安全管理", "C": "二者均僅負責災害現場之安全管理，差別僅在於指揮層級之高低", "D": "健康安全官須由醫師擔任，事故安全官則由現場指揮官兼任"}, "answer": "B", "explain": "NFPA 1521將安全官分為健康安全官與事故安全官：前者負責日常健康安全管理，含廳舍安全、心理安全等；後者負責災害現場安全管理，含事故安全計畫擬定及事故後調查報告撰寫。手冊第二章即以事故安全官為主要內容。應注意事故安全官須取得指揮官授權而為專責，不宜由指揮官自行兼任，以免再度形成監控空窗。", "ref": "救災安全手冊第二章", "evidence": "健康安全官主要負責消防人員日常健康安全管理，其中包含廳舍安全、心理安全等；而事故安全官則主要負責災害現場的安全管理", "tag": "職安", "src": "new"}, {"id": "N-職安-027", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊「事故安全官作業原則」，事故安全官於災害現場之五項作業簡稱「M.E.D.I.C」，不包括下列何者？", "opts": {"A": "監控災害現場（Monitor）", "B": "評估可能危害（Evaluate）", "C": "指揮災害現場（Command）", "D": "進行風險溝通（Communicate）"}, "answer": "C", "explain": "M.E.D.I.C係指監控災害現場、評估可能危害、發展預防措施、介入災害現場及進行風險溝通五項作業。指揮權仍專屬現場指揮官，事故安全官並不取得指揮權，其功能限於監控、評估、發展預防措施、介入與風險溝通；末字C為Communicate而非Command，此為本章最常見之誘答設計。", "ref": "救災安全手冊第二章", "evidence": "「介入災害現場（Interventions）」、「進行風險溝通（Communicate）」，上述 5項作業可簡稱為「M.E.D.I.C」作業", "tag": "職安", "src": "new"}, {"id": "N-職安-028", "subject": "刑事法", "topic": "消防法", "stem": "某建築物火災現場，事故安全官發現入室小組所在樓層已出現立即倒塌徵兆。依消防人員救災安全手冊「事故安全官作業原則」，其得採取之介入方式為何？", "opts": {"A": "僅得以軟性介入提醒或說明消防人員可能面臨之危害", "B": "僅得記錄危害情形，於事故後分析時提出檢討建議", "C": "應先簽報機關首長核准後，再以無線電通知該小組撤離", "D": "得採取硬性介入，直接停止、警告、改變或暫停消防人員之作業"}, "answer": "D", "explain": "手冊第二章將介入區分為硬性與軟性：面對較為急迫且立即之危害，採硬性介入直接停止、警告、改變或暫停作業；以預防危害為目的者，則採軟性介入提醒或說明。倒塌徵兆屬急迫立即危害，應採硬性介入。無論何種介入，宜採面對面溝通，且均須讓指揮官了解介入情形，惟無須事前逐案報准。", "ref": "救災安全手冊第二章", "evidence": "面對較為急迫且立即的危害，事故安全官將採取「硬性介入」直接停止、警告、改變或暫停消防人員的作業", "tag": "職安", "src": "new"}, {"id": "N-職安-029", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊「事故安全官作業原則」，關於災害現場警戒區之劃設，下列敘述何者正確？", "opts": {"A": "消防人員通過安全管制板即視為進入熱區，安全管制板所放置之區域則為暖區", "B": "消防人員通過安全管制板即視為進入暖區，熱區則為除汙棚所架設之區域", "C": "禁止進入區係指著裝完整之消防人員仍得進入執行搶救之區域", "D": "冷區僅供民眾及媒體活動使用，火場指揮中心應設置於暖區"}, "answer": "A", "explain": "依NFPA 1500，所有災害現場均應劃設警戒區，分為禁止進入區、熱區、暖區、冷區。通過安全管制板即視為進入熱區，該區對生命健康有立即危害（IDLH），須著適當防護裝備；暖區為安全管制板或除汙棚所在，通常僅為一個點；冷區係消防人員活動區並管制民眾、媒體進入，火場指揮中心即設於冷區。", "ref": "救災安全手冊第二章", "evidence": "熱區（Hot Zone）：消防人員通過安全管制板即視為進入熱區", "tag": "職安", "src": "new"}, {"id": "N-職安-030", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊所引NFPA 1500之風險管理原則，下列敘述何者錯誤？", "opts": {"A": "除非現場有人命危害之可能性，否則不要進行危險之救災行動", "B": "為拯救財物之救災行為，因財產保護具公益性，不應視為對同仁安全之潛在風險", "C": "在沒有人命傷亡之虞之現場，冒任何救災危險都是不被接受的", "D": "在消防人員之風險過高之情況下，應將各項活動限於防禦性之作業"}, "answer": "B", "explain": "NFPA 1500之風險管理原則明定：為拯救財物之救災行為，應視為對同仁安全有潛在風險之行動，必須避免或減輕此種風險；經常用於保護財產之活動，亦應視為成員安全之固有風險。故財產保護不因具公益性而豁免風險評估，選項B恰與原則相反。其餘三者均為手冊所列原則之原文意旨。", "ref": "救災安全手冊第三章", "evidence": "為拯救財物的救災行為，應視為是對同仁安全有潛在風險行動，必須避免或減輕此種風險", "tag": "職安", "src": "new"}, {"id": "N-職安-031", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊所引NFPA 1500，關於建築物火災初期階段入室救火之人力配置，下列敘述何者正確？", "opts": {"A": "至少須有2名消防人員入室，外面待命人員得由幫浦操作員兼任且無須著裝就緒", "B": "至少須有3名消防人員組成1組入室，外面並須有1名事故安全官全程監督", "C": "至少須有2名消防人員組成1組著裝就緒入室，並另有至少2名著裝就緒之人員在外待命及監督", "D": "入室人數不受限制，惟須由事故安全官持續監聽無線電掌握位置"}, "answer": "C", "explain": "NFPA 1500要求入室救火前至少2名消防人員組成1組、著裝就緒共同執行；外部另須至少2名著裝就緒人員待命並監督內部人員動靜，於內部人員遭遇危難時執行第一時間快速救援，即所謂「兩進兩出」。待命成員須隨時掌握危險區內作業人數、身分、位置、功能及進入時間，並與小組持續維持通訊。", "ref": "救災安全手冊第三章", "evidence": "必須至少有 2 個消防人員組成 1 組並穿戴好裝備且準備就緒，一起執行救災工作", "tag": "職安", "src": "new"}, {"id": "N-職安-032", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊所引NFPA 1500，關於「Mayday」代號及現場通訊之敘述，下列何者錯誤？", "opts": {"A": "「Mayday」得由知悉其他成員生命正受威脅之成員代為發布", "B": "事件指揮官應藉由發布「Mayday已清除，恢復正常無線電通訊」終結該代號", "C": "緊急救援小組（RIT）應至少由兩位成員組成，並應可以立即營救成員或小組", "D": "在熱區或暖區作業時，得由小組長配備可攜式無線電，其餘成員無須個別配備"}, "answer": "D", "explain": "NFPA 1500規定在熱區或暖區作業時，所有人員均應配備消防局供應之可攜式無線電，不得以小組長代表配備取代，否則成員一旦走散即失去呼救能力。Mayday得由當事人或知悉者發布，並由事件指揮官以「Mayday已清除，恢復正常無線電通訊」終結；RIT至少兩位成員，且須受符合NFPA 1407之訓練。", "ref": "救災安全手冊第三章", "evidence": "在熱區或暖區作業時，所有人員均應配備消防局供應的可攜式無線電", "tag": "職安", "src": "new"}, {"id": "N-職安-033", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊「待命出勤安全指導原則」，關於救災出動之安全注意事項，下列敘述何者錯誤？", "opts": {"A": "駕駛員得於編組成員陸續上車期間先行起步，以爭取出動時效", "B": "出勤救災上車前即須著裝完畢，儘量避免於車輛行進途中著裝", "C": "行駛前所有乘員應繫安全帶，出動時須先派員至車庫前道路實施交通管制", "D": "消防車輛水箱應保持滿水位，以防出動行駛途中因重心偏離而導致車輛翻覆"}, "answer": "A", "explain": "手冊第四章規定各車帶隊官須先確認周遭狀況，並檢視編組成員均已上車就定位後再發出出發信號，駕駛員在得到信號之前不得出發，故選項A違反規定。其餘為本章明定事項：上車前著裝完畢以免車禍時受重傷、行駛前全員繫安全帶、車庫前實施交通管制，水箱保持滿水位則在防止重心偏離造成翻覆。", "ref": "救災安全手冊第四章", "evidence": "各車帶隊官需先確認周遭狀況，並檢視編組成員均已上車就定位後再發出出發的信號，駕駛員在得到信號之前不得出發", "tag": "職安", "src": "new"}, {"id": "N-職安-034", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊「車輛行駛時安全指導原則」，關於消防車輛行駛之安全注意事項，下列敘述何者正確？", "opts": {"A": "為爭取搶救時效，行經交叉路口遇紅燈得於減速後直接通過，無須停車", "B": "行經交叉路口遇紅燈需闖越時，應停車確認左右兩方來車已停車避讓，方可通過", "C": "救災返隊車輛應持續開啟警報器及警示燈，以維持其優先通行權", "D": "行駛山坡路段下坡時，應持續踩踏腳煞車以維持車速，避免使用引擎煞車"}, "answer": "B", "explain": "手冊第五章明定行經交叉路口應預先減速，遇紅燈需闖越時應「停車」確認左右兩方來車均已停車避讓，方可通過，並非減速即可通過。返隊車輛應關閉警報器，僅保持頭燈及警示燈開啟並遵守交通規則，不得闖紅燈；下坡則應使用引擎煞車及輔助煞車系統，避免長時間持續踩煞車導致煞車失效。", "ref": "救災安全手冊第五章", "evidence": "行經交叉路口應預先減速，若遇紅燈需闖越時，應停車確認左右兩方來車已停車避讓，方可通過", "tag": "職安", "src": "new"}, {"id": "N-職安-035", "subject": "刑事法", "topic": "消防法", "stem": "消防人員抵達液化石油氣槽車洩漏起火現場，依消防人員救災安全手冊「車輛部署安全指導原則」，關於救災車輛部署位置之選擇，下列敘述何者正確？", "opts": {"A": "應停放於下風處且地勢較低處，以利水線回收及人員撤離", "B": "應正對槽車車頭或車尾部署，以便直接對洩漏點射水降溫", "C": "應停放於危害較低之上風處或較高位置，並宜部署於槽車45度角位置處", "D": "應緊靠槽車兩側部署，以縮短射水距離提高降溫效率"}, "answer": "C", "explain": "手冊第六章就危害性化學品現場車輛部署明定四項要領：保持人車安全距離、車輛宜停放於堅固牆壁或其他固著物旁、停放於上風處或較高位置、宜部署於槽車45度角位置處。45度角之理由在於避開槽體車頭、車尾及兩側，以免槽體爆炸時受內設防波板作用而遭噴飛物直接波及。", "ref": "救災安全手冊第六章", "evidence": "宜部署於槽車 45 度角位置處，避開危險物品或氣（油）槽車的車頭、車尾及兩側", "tag": "職安", "src": "new"}, {"id": "N-職安-036", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊「車輛部署安全指導原則」，先到達火場之消防車輛部署應儘量單邊停放，兩車間距應保持多少以上，以保持路況通暢並利靈活調度？", "opts": {"A": "10公尺", "B": "15公尺", "C": "25公尺", "D": "20公尺"}, "answer": "D", "explain": "手冊第六章「預留作業及移位空間」規定，消防車部署應預留車輛前後之作業及移位空間，先到車輛應儘量單邊停放，兩車間距20公尺以上，以保持路況通暢，利於靈活調度與操作安全，調度車輛時並須有人員負責指揮。另於交通事故現場則以車頭斜放約15至45度角創造安全工作區，兩組數字勿混淆。", "ref": "救災安全手冊第六章", "evidence": "先到車輛之部署應儘量單邊停放，兩車間距 20 公尺以上，保持路況通暢", "tag": "職安", "src": "new"}, {"id": "N-職安-037", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員救災安全手冊「幫浦操作安全指導原則」，關於幫浦操作之安全注意事項，下列敘述何者錯誤？", "opts": {"A": "幫浦操作人員應站立於出水口正前方，以便就近觀察接頭有無鬆脫", "B": "放水時勿急速加油門致使壓力驟升，應緩慢、等速加壓以確保瞄子手安全", "C": "幫浦高速運轉時要停放前應先行減壓，避免直接關閉出水口", "D": "射水作業以1線2人操作為宜，並儘量使用無後座力及直線噴霧兩用瞄子"}, "answer": "A", "explain": "手冊第七章明定操作時應避免站立於出水口正前方，適當位置為側身操作，並著消防帽或其他適當防護裝備，以防加壓送水時水帶接頭脫落彈飛傷人，故選項A錯誤。其餘均為本章要領：緩慢等速加壓以保護瞄子手、停放前先減壓以免出水口接頭爆裂或損傷幫浦機件、射水以1線2人操作並使用無後座力瞄子。", "ref": "救災安全手冊第七章", "evidence": "操作時應避免站立於出水口正前方，適當位置為側身操作", "tag": "職安", "src": "new"}, {"id": "N-職安-038", "subject": "刑事法", "topic": "消防法", "stem": "某消防人員使用空氣瓶容量6公升之SCBA，開瓶後壓力錶顯示270 BAR，殘壓警報值設定為50 BAR，其於中度工作下之工作呼吸量為40 L/Min。依消防人員救災安全手冊之計算方式，其安全使用時間約為多少分鐘？", "opts": {"A": "27.5分", "B": "33分", "C": "40.5分", "D": "45分"}, "answer": "B", "explain": "依手冊第三十三章公式：（空氣瓶壓力－殘壓警報值）×空氣瓶容量÷工作呼吸量＝使用時間。代入（270－50）×6÷40＝1320÷40＝33分。常見錯誤為漏扣殘壓警報值而得40.5分，或誤用滿瓶300 BAR而得45分。另須注意使用Bypass強制送氣時空氣輸出量達500 L/Min，將使可用時間急遽縮短。", "ref": "救災安全手冊第三十三章", "evidence": "SCBA 安全使用時間計算方式：（空氣瓶壓力【BAR】 : "任期二年，期滿不得續聘（派）兼之；代表機關或團體出任者不隨本職進退"}, "answer": "A", "explain": "設置辦法第四條第一項規定，委員任期為二年，期滿得續聘（派）兼之；但代表機關或團體出任者，應隨其本職進退。故任期並非一年或三年，且期滿得續聘無次數限制；代表機關或團體之委員一旦本職異動，其委員身分隨之消滅，此為與學者專家委員最大差異。", "ref": "諮詢會設置辦法§4", "evidence": "諮詢會委員任期為二年，期滿得續聘（派）兼之。但代表機關或團體出任者，應隨其本職進退", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-007", "subject": "刑事法", "topic": "消防法", "stem": "諮詢會委員甲於任期進行第八個月時因故出缺，經內政部依規定補聘（派）乙接任。依消防人員職務安全衛生諮詢會設置辦法規定，乙之任期為何？", "opts": {"A": "自補聘（派）之日起重新起算二年", "B": "至補聘（派）當年十二月三十一日止", "C": "由召集人視會務需要定之，最長三年", "D": "至原委員甲之任期屆滿之日止"}, "answer": "D", "explain": "設置辦法第四條第二項規定，委員於任期中因故出缺或有不適任情事者，由內政部解聘並依第三條規定補聘（派），其任期至原委員任期屆滿之日止。故補聘委員係「補足原任期」，不重新起算二年，也不得由召集人另定期限，以維持全體委員任期同進退。", "ref": "諮詢會設置辦法§4", "evidence": "由本部解聘並依前條規定補聘（派），其任期至原委員任期屆滿之日止", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-008", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員職務安全衛生諮詢會設置辦法規定，關於諮詢會會議之召開頻率，下列敘述何者正確？", "opts": {"A": "以每三個月召開一次為原則，必要時得召開臨時會議", "B": "以每六個月召開一次為原則，必要時得召開臨時會議", "C": "以每一年召開一次為原則，且不得召開臨時會議", "D": "以每二年召開一次為原則，必要時得召開臨時會議"}, "answer": "B", "explain": "設置辦法第五條第一項規定，諮詢會會議以每六個月召開一次為原則，必要時得召開臨時會議。即常會每半年一次（一年二次），另設臨時會機制以因應重大職災或政策需要。誘答常改為三個月、一年或二年，或否定臨時會之存在，均與條文不符。", "ref": "諮詢會設置辦法§5", "evidence": "諮詢會會議以每六個月召開一次為原則，必要時得召開臨時會議", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-009", "subject": "刑事法", "topic": "消防法", "stem": "某次諮詢會會議，召集人及副召集人均因公無法出席。依消防人員職務安全衛生諮詢會設置辦法規定，該次會議主席應如何產生？", "opts": {"A": "由諮詢會執行秘書擔任主席", "B": "由內政部消防署署長擔任主席", "C": "由出席委員互推一人代理主席", "D": "由出席委員中年資最長者擔任主席"}, "answer": "C", "explain": "設置辦法第五條第二項定有主席代理順序：原則由召集人擔任主席；召集人無法出席時，由副召集人代理；副召集人亦無法出席時，由出席委員互推一人代理主席。故第三順位為「出席委員互推」，而非執行秘書、消防署署長或依年資產生。", "ref": "諮詢會設置辦法§5", "evidence": "召集人無法出席時，由副召集人代理主席；副召集人無法出席時，由出席委員互推一人代理主席", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-010", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員職務安全衛生諮詢會設置辦法規定，諮詢會開會時得視實際需要邀請下列何者列席？", "opts": {"A": "僅得邀請中央及地方消防機關人員列席", "B": "僅得邀請經召集人事前書面同意之學者專家", "C": "不得邀請機關外人員列席，以維持會議保密", "D": "有關機關、團體、專家學者或業務人員"}, "answer": "D", "explain": "設置辦法第五條第三項規定，諮詢會開會時，得視實際需要邀請有關機關、團體、專家學者或業務人員列席。列席範圍並不限於消防機關人員，亦未限制須經召集人書面同意，更非一律禁止外部人員列席；其目的在使議題討論能取得實務與專業意見。", "ref": "諮詢會設置辦法§5", "evidence": "諮詢會開會時，得視實際需要邀請有關機關、團體、專家學者或業務人員列席", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-011", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員職務安全衛生諮詢會設置辦法規定，關於諮詢會會務之處理，下列敘述何者正確？", "opts": {"A": "置執行秘書一人及所需工作人員，由內政部消防署派員兼任，承召集人及副召集人之命處理會務", "B": "置執行秘書三人及所需工作人員，由內政部人事處派員專任，承部長之命處理會務", "C": "置執行秘書一人及所需工作人員，由公務人員協會推派，承召集人之命處理會務", "D": "置執行秘書二人及所需工作人員，由直轄市消防局輪流派員兼任，承副召集人之命處理會務"}, "answer": "A", "explain": "設置辦法第六條規定，諮詢會置執行秘書一人及所需工作人員，由內政部消防署派員兼任，承召集人及副召集人之命，處理會務。故執行秘書為一人、係「兼任」而非專任，派員機關為消防署而非人事處、公務人員協會或地方消防局，且係承召集人及副召集人二人之命。", "ref": "諮詢會設置辦法§6", "evidence": "諮詢會置執行秘書一人及所需工作人員，由本部消防署派員兼任，承召集人及副召集人之命", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-012", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員職務安全衛生諮詢會設置辦法規定，關於諮詢會決議事項之行文名義及所需經費之來源，下列敘述何者正確？", "opts": {"A": "決議事項以內政部消防署名義行之，所需經費由勞動部相關預算支應", "B": "決議事項以諮詢會名義行之，所需經費由各直轄市消防局分攤支應", "C": "決議事項以內政部名義行之，所需經費由內政部消防署相關預算支應", "D": "決議事項以內政部名義行之，所需經費由公務人員協會會費支應"}, "answer": "C", "explain": "設置辦法第七條規定，諮詢會之決議事項以內政部名義行之；第八條規定所需經費由內政部消防署相關預算支應。諮詢會屬內政部之諮詢性任務編組，不具獨立對外行文之機關地位，故不以諮詢會或消防署名義行文；經費亦非由勞動部、地方消防局或協會負擔。", "ref": "諮詢會設置辦法§7、§8", "evidence": "諮詢會之決議事項，以本部名義行之", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-013", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員職務安全衛生諮詢會設置辦法規定，關於本辦法之訂定依據及施行日期，下列敘述何者正確？", "opts": {"A": "依消防法第二十五條之一第四項規定訂定，自中華民國一百十四年六月一日施行", "B": "依消防法第二十五條之七第二項規定訂定，自中華民國一百十四年六月一日施行", "C": "依消防法第二十五條之一第四項規定訂定，自中華民國一百十四年五月二十九日施行", "D": "依職業安全衛生法第三十五條規定訂定，自中華民國一百十五年一月一日施行"}, "answer": "A", "explain": "設置辦法第一條明定本辦法依消防法第二十五條之一第四項規定訂定；第九條明定自中華民國一百十四年六月一日施行。一百十四年五月二十九日為「訂定發布日」而非施行日，二者不可混淆；消防法第二十五條之七第二項係消防人員安全衛生教育訓練實施規則之授權依據。", "ref": "諮詢會設置辦法§1、§9", "evidence": "本辦法依消防法第二十五條之一第四項規定訂定之", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-014", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員職務安全衛生諮詢會設置辦法規定，下列何者非屬諮詢會得提供建議之事項？", "opts": {"A": "職務安全衛生國際交流及趨勢", "B": "職務安全衛生研究、方案或計畫", "C": "消防人員危險職務加給之給與標準", "D": "職務安全衛生政策及法規"}, "answer": "C", "explain": "設置辦法第二條列舉諮詢會得提供建議之七款事項：職務安全衛生政策及法規、工作安全衛生管理系統、職務安全衛生防護設備及措施、職務安全衛生研究方案或計畫、職務安全衛生之執行及評估、職務安全衛生國際交流及趨勢，及其他促進事項。危險職務加給之給與標準屬待遇事項，不在其列。", "ref": "諮詢會設置辦法§2", "evidence": "消防人員職務安全衛生諮詢會（以下簡稱諮詢會）得就下列事項提供建議", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-015", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，所稱「消防人員」之範圍，下列敘述何者正確？", "opts": {"A": "指各級消防機關全部編制內人員，並包括約僱人員及義勇消防人員", "B": "指各級消防機關支領危險職務加給表第一級至第三級之人員，並包括人事及主計人員", "C": "指各級消防機關支領危險職務加給表第二級或第三級之人員，但不包括分隊長以上人員", "D": "指各級消防機關支領危險職務加給表第一級或第二級之人員，但不包括會（主）計、人事、政風及秘書行政單位人員"}, "answer": "D", "explain": "實施規則第二條第二款規定，消防人員指各級消防機關支領消防、海巡、空中勤務、移民及航空測量機關專業人員危險職務加給表第一級或第二級之人員，但不包括會（主）計、人事、政風及秘書行政單位人員。故加給級別限第一、二級（非第三級），且明文排除四類行政單位人員。", "ref": "教育訓練實施規則§2", "evidence": "指各級消防機關支領消防、海巡、空中勤務、移民及航空測量機關專業人員危險職務加給表第一級或第二級之人員", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-016", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，下列何者不屬於所稱之「各級消防機關」？", "opts": {"A": "內政部消防署", "B": "內政部消防署所屬機關（構）", "C": "直轄市、縣（市）政府消防局", "D": "中央警察大學消防學系"}, "answer": "D", "explain": "實施規則第二條第一款規定，各級消防機關指內政部消防署及所屬機關（構）、直轄市、縣（市）政府消防局，共三類。中央警察大學屬警察教育機關，並非各級消防機關；惟依第七條規定，其得辦理初任消防人員之安全衛生職前教育訓練，二者定位應加區辨。", "ref": "教育訓練實施規則§2", "evidence": "各級消防機關：指內政部消防署及所屬機關（構）、直轄市、縣（市）政府消防局", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-017", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，關於「安全衛生業務主管」及「安全衛生業務專責人員」之定義，下列敘述何者正確？", "opts": {"A": "分別指職業安全衛生法第二十三條所定職業安全衛生管理單位之主管及管理人員", "B": "分別指消防法第二十五條之二第一項所定安全衛生專責單位之主管及該單位人員", "C": "分別指消防法第二十五條之三所定安全及衛生防護小組之召集人及其組員", "D": "分別指各級消防機關人事單位之主管及所屬辦理訓練業務之人員"}, "answer": "B", "explain": "實施規則第二條第三款、第四款規定，安全衛生業務主管指消防法第二十五條之二第一項所定之安全衛生專責單位主管；安全衛生業務專責人員指同項所定之安全衛生專責單位人員。其定義直接連結母法所設之「安全衛生專責單位及專責人員」，而非職業安全衛生法之管理單位或防護小組成員。", "ref": "教育訓練實施規則§2", "evidence": "安全衛生業務主管：指本法第二十五條之二第一項所定之安全衛生專責單位主管", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-018", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，本規則所定之安全衛生教育訓練分為下列哪兩類？", "opts": {"A": "基礎教育訓練及進階教育訓練", "B": "常年教育訓練及專案教育訓練", "C": "職前教育訓練及在職教育訓練", "D": "一般安全衛生訓練及特殊危害作業訓練"}, "answer": "C", "explain": "實施規則第三條規定，本規則之安全衛生教育訓練分為職前教育訓練及在職教育訓練二類。職前訓練規定於第四條、第五條（初任消防人員與安全衛生業務主管、專責人員），在職訓練規定於第六條，並依人員別定有每年最低時數，此二分架構為全規則骨幹。", "ref": "教育訓練實施規則§3", "evidence": "本規則之安全衛生教育訓練分為職前教育訓練及在職教育訓練", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-019", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，初任消防人員前，其所屬各級消防機關應使其接受安全衛生職前教育訓練，訓練時數不得少於多少小時？", "opts": {"A": "十五小時", "B": "二十小時", "C": "三十小時", "D": "四十小時"}, "answer": "C", "explain": "實施規則第四條第一項、第二項規定，初任消防人員前，所屬各級消防機關應使其接受安全衛生職前教育訓練，時數不得少於三十小時。此三十小時亦與第五條安全衛生業務主管、專責人員之職前訓練時數相同，均為「不得少於三十小時」之最低標準，並非二十或四十小時。", "ref": "教育訓練實施規則§4", "evidence": "前項訓練時數不得少於三十小時，其內容如下", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-020", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，初任消防人員之安全衛生職前教育訓練時數不得少於三十小時，其內容共五項。下列何者不屬於該五項內容？", "opts": {"A": "救災安全及職務安全衛生法規", "B": "救災車輛及裝備管理維護", "C": "消防職業安全衛生管理", "D": "各項救災救護勤務安全"}, "answer": "C", "explain": "實施規則第四條第二項所列初任消防人員職前訓練五項內容為：救災安全及職務安全衛生法規、救災安全管制、救災車輛及裝備管理維護、各項救災救護勤務安全、健康管理。「消防職業安全衛生管理」係第五條安全衛生業務主管及專責人員職前訓練之內容，二者不可混用。", "ref": "教育訓練實施規則§4", "evidence": "一、救災安全及職務安全衛生法規。\n　　二、救災安全管制。\n　　三、救災車輛及裝備管理維護。\n　　四、各項救災救護勤務安全。\n　　五、健康管理。", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-021", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，各級消防機關對安全衛生業務主管及安全衛生業務專責人員，應於何時使其接受安全衛生職前教育訓練，其時數為何？", "opts": {"A": "於職務派任後三個月內，訓練時數不得少於三十小時", "B": "於職務派任前，訓練時數不得少於三十小時", "C": "於職務派任前，訓練時數不得少於二十小時", "D": "於職務派任後六個月內，訓練時數不得少於四十小時"}, "answer": "B", "explain": "實施規則第五條第一項、第二項規定，各級消防機關對安全衛生業務主管及安全衛生業務專責人員，應於「職務派任前」使其接受安全衛生職前教育訓練，時數不得少於三十小時。故係事前訓練而非派任後補訓，時數亦非二十或四十小時，與第四條初任消防人員同為三十小時。", "ref": "教育訓練實施規則§5", "evidence": "各級消防機關對安全衛生業務主管及安全衛生業務專責人員，應於職務派任前，使其接受安全衛生職前教育訓練", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-022", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，安全衛生業務主管及安全衛生業務專責人員之職前教育訓練時數不得少於三十小時，其內容共四項。下列何者不屬於該四項內容？", "opts": {"A": "救災安全及職務安全衛生法規", "B": "消防職業安全衛生管理", "C": "救災安全管制", "D": "各項救災救護勤務安全"}, "answer": "D", "explain": "實施規則第五條第二項所列四項內容為：救災安全及職務安全衛生法規、救災安全管制、消防職業安全衛生管理、健康管理。「各項救災救護勤務安全」與「救災車輛及裝備管理維護」係第四條初任消防人員職前訓練之內容，未列入主管及專責人員之職前訓練，屬常見交叉誘答。", "ref": "教育訓練實施規則§5", "evidence": "二、救災安全管制。\n　　三、消防職業安全衛生管理。\n　　四、健康管理。", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-023", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，各級消防機關對消防人員應使其接受安全衛生在職教育訓練，每年最低訓練時數為多少？", "opts": {"A": "三小時", "B": "四小時", "C": "六小時", "D": "八小時"}, "answer": "B", "explain": "實施規則第六條第一項規定在職教育訓練每年最低時數：消防人員四小時、安全衛生業務主管三小時、安全衛生業務專責人員六小時。故消防人員為四小時；三小時係主管、六小時係專責人員之時數，命題極常將三組數字互換，應以「消防四、主管三、專責六」記憶。", "ref": "教育訓練實施規則§6", "evidence": "一、消防人員：四小時。\n　　二、安全衛生業務主管：三小時。\n　　三、安全衛生業務專責人員：六小時。", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-024", "subject": "刑事法", "topic": "消防法", "stem": "某消防局規劃年度安全衛生在職教育訓練。依消防人員安全衛生教育訓練實施規則規定，消防人員、安全衛生業務主管、安全衛生業務專責人員三類人員每年最低訓練時數合計為多少小時？", "opts": {"A": "十小時", "B": "十二小時", "C": "十三小時", "D": "十五小時"}, "answer": "C", "explain": "實施規則第六條第一項規定，消防人員四小時、安全衛生業務主管三小時、安全衛生業務專責人員六小時，三者相加為四加三加六等於十三小時。本題為數字合計判斷，若誤記為四、四、六則得十四，誤記為三、三、六則得十二，均非正確答案。", "ref": "教育訓練實施規則§6", "evidence": "各級消防機關對下列各款人員，應依工作性質使其接受安全衛生在職教育訓練，每年最低訓練時數如下", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-025", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，關於安全衛生在職教育訓練每年最低訓練時數之比較，下列敘述何者正確？", "opts": {"A": "消防人員六小時，高於安全衛生業務主管之四小時及專責人員之三小時", "B": "安全衛生業務主管六小時，高於專責人員之四小時及消防人員之三小時", "C": "三類人員每年最低訓練時數均為四小時，並無區別", "D": "安全衛生業務專責人員六小時，高於消防人員之四小時及主管之三小時"}, "answer": "D", "explain": "實施規則第六條第一項規定，安全衛生業務專責人員六小時為最高，消防人員四小時居中，安全衛生業務主管三小時最低。專責人員因實際承辦安全衛生業務，故要求最高時數；主管時數反而最低，此「專責高於消防人員、消防人員高於主管」之相對關係常為考點。", "ref": "教育訓練實施規則§6", "evidence": "二、安全衛生業務主管：三小時。\n　　三、安全衛生業務專責人員：六小時。", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-026", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，下列何者屬於消防人員在職教育訓練之內容，而不屬於安全衛生業務主管在職教育訓練之內容？", "opts": {"A": "救災安全管制", "B": "災害搶救專題", "C": "救災車輛及裝備管理維護", "D": "健康管理"}, "answer": "B", "explain": "實施規則第六條第二項所定消防人員在職訓練內容為：救災安全管制、災害搶救專題、救災車輛及裝備管理維護、各項救災救護勤務安全、健康管理。第三項所定主管及專責人員內容則為消防職業安全衛生管理、新型態災害風險判讀、救災安全管制、救災車輛及裝備管理維護、健康管理。「災害搶救專題」僅見於消防人員。", "ref": "教育訓練實施規則§6", "evidence": "一、救災安全管制。\n　　二、災害搶救專題。", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-027", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，下列何者屬於安全衛生業務主管及專責人員在職教育訓練之內容，而不屬於消防人員在職教育訓練之內容？", "opts": {"A": "各項救災救護勤務安全", "B": "救災車輛及裝備管理維護", "C": "救災安全管制", "D": "新型態災害風險判讀"}, "answer": "D", "explain": "實施規則第六條第三項所定安全衛生業務主管及專責人員在職訓練內容為：消防職業安全衛生管理、新型態災害風險判讀、救災安全管制、救災車輛及裝備管理維護、健康管理。其中「消防職業安全衛生管理」與「新型態災害風險判讀」為其獨有；「各項救災救護勤務安全」則僅列於消防人員之訓練內容。", "ref": "教育訓練實施規則§6", "evidence": "一、消防職業安全衛生管理。\n　　二、新型態災害風險判讀。", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-028", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，關於安全衛生教育訓練之辦理機關，下列敘述何者正確？", "opts": {"A": "一律由內政部消防署辦理；各級消防機關及警察教育機關均不得自行辦理", "B": "由各級消防機關辦理；初任消防人員之職前教育訓練得由中央警察大學、臺灣警察專科學校或消防署辦理", "C": "由勞動部認可之訓練單位辦理；各級消防機關僅負督導、查核辦理情形之責", "D": "由各級消防機關辦理；在職教育訓練得由中央警察大學或臺灣警察專科學校代為辦理"}, "answer": "B", "explain": "實施規則第七條規定，安全衛生教育訓練由各級消防機關辦理之；但第四條所定初任消防人員之安全衛生職前教育訓練，得由中央警察大學、臺灣警察專科學校或內政部消防署辦理。該例外僅限「初任消防人員之職前訓練」，不及於在職訓練，亦不及於主管、專責人員之職前訓練。", "ref": "教育訓練實施規則§7", "evidence": "安全衛生教育訓練，由各級消防機關辦理之。但第四條所定初任消防人員之安全衛生職前教育訓練，得由中央警察大學、臺灣警察專科學校或內政部消防署辦理之", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-029", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，下列何者符合安全衛生教育訓練講師之資格？", "opts": {"A": "於大專校院教授消防相關課程，並有六年以上授課經驗", "B": "於大專校院教授消防相關課程，並有十年以上授課經驗", "C": "任職於各級消防機關，並有六年以上現場救災經驗", "D": "任職於各級消防機關，並有三年以上災害搶救業務經驗"}, "answer": "A", "explain": "實施規則第八條列舉講師資格五款，其中第三款為於大專校院教授消防相關課程並有六年以上授課經驗；第四款為任職於各級消防機關並有十年以上辦理災害搶救業務或現場救災經驗。學界為「六年授課」、實務界為「十年救災」，兩組數字方向相反，最易被交換誘答。", "ref": "教育訓練實施規則§8", "evidence": "於大專校院教授消防相關課程，並有六年以上授課經驗", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-030", "subject": "刑事法", "topic": "消防法", "stem": "依消防人員安全衛生教育訓練實施規則規定，關於訓練辦理情形之督導查核及本規則之施行日期，下列敘述何者正確？", "opts": {"A": "中央主管機關得派員督導、查核各級消防機關辦理情形；本規則自一百十四年六月一日施行", "B": "勞動部得派員督導、查核各級消防機關辦理情形；本規則自一百十四年五月二十九日施行", "C": "中央主管機關應委託第三方專業機構查核；本規則自一百十五年一月一日施行", "D": "直轄市、縣（市）政府得查核內政部消防署辦理情形；本規則自發布日施行"}, "answer": "A", "explain": "實施規則第九條規定，中央主管機關（內政部）得派員督導、查核各級消防機關安全衛生教育訓練辦理情形；第十條規定本規則自中華民國一百十四年六月一日施行。督導查核權在中央主管機關而非勞動部，亦非強制委託第三方；一百十四年五月二十九日僅為訂定發布日。", "ref": "教育訓練實施規則§9、§10", "evidence": "中央主管機關得派員督導、查核各級消防機關安全衛生教育訓練辦理情形", "tag": "職安", "src": "new", "amend": "114-05-29 訂定（114-06-01 施行）"}, {"id": "N-職安2-031", "subject": "刑事法", "topic": "消防法", "stem": "依職業安全衛生法規定，關於「職業災害」之定義，下列敘述何者正確？", "opts": {"A": "指因勞動場所之設備、原料、化學品、粉塵等或作業活動及其他職業上原因引起之工作者疾病、傷害、失能或死亡", "B": "指勞工於上、下班必經途中發生交通事故所致之傷害、失能或死亡，不包括疾病", "C": "指勞工於作業場所內因機械或設備直接接觸所引起之傷害或死亡，不包括職業病", "D": "指經職業醫學科專科醫師診斷並經中央主管機關個案認定之職業疾病或傷害"}, "answer": "A", "explain": "職業安全衛生法第二條第五款明定職業災害之定義，兼含「物之因素」（建築物、機械、設備、原料、化學品、氣體、蒸氣、粉塵等）與「作業活動及其他職業上原因」，結果則包括疾病、傷害、失能或死亡四種。其主體為「工作者」而非僅限勞工，且不以醫師診斷或主管機關認定為要件。", "ref": "職業安全衛生法§2", "evidence": "職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動及其他職業上原因引起之工作者疾病、傷害、失能或死亡", "tag": "職安", "src": "new"}, {"id": "N-職安2-032", "subject": "刑事法", "topic": "消防法", "stem": "依職業安全衛生法規定，關於名詞定義，下列敘述何者錯誤？", "opts": {"A": "工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員", "B": "勞工：指受僱從事工作獲致工資者", "C": "雇主：指事業主或事業之經營負責人", "D": "事業單位：指本法適用範圍內僱用勞工五十人以上從事工作之機構"}, "answer": "D", "explain": "職業安全衛生法第二條第四款規定，事業單位指本法適用範圍內僱用勞工從事工作之機構，並無「五十人以上」之人數門檻；五十人係第二十二條應置勞工健康服務人員之規模。工作者範圍最廣（含自營作業者），勞工以受僱獲致工資為要件，雇主則為事業主或經營負責人。", "ref": "職業安全衛生法§2", "evidence": "事業單位：指本法適用範圍內僱用勞工從事工作之機構", "tag": "職安", "src": "new"}, {"id": "N-職安2-033", "subject": "刑事法", "topic": "消防法", "stem": "依職業安全衛生法規定，雇主使勞工從事工作，就職業災害之預防應如何辦理？", "opts": {"A": "應在不影響業務營運之範圍內，視年度預算狀況採取預防措施", "B": "應在合理可行範圍內，採取必要之預防設備或措施，使勞工免於發生職業災害", "C": "僅須就中央主管機關公告指定之危害採取預防設備或措施", "D": "應於職業災害發生後，立即檢討原因並採取改善措施"}, "answer": "B", "explain": "職業安全衛生法第五條第一項規定，雇主使勞工從事工作，應在合理可行範圍內，採取必要之預防設備或措施，使勞工免於發生職業災害。此為一般性、概括性之雇主義務，不以中央主管機關公告指定之危害為限，亦非事後檢討義務；「合理可行範圍」係衡量技術與成本之判斷標準，非任由雇主以預算為由推諉。", "ref": "職業安全衛生法§5", "evidence": "雇主使勞工從事工作，應在合理可行範圍內，採取必要之預防設備或措施，使勞工免於發生職業災害", "tag": "職安", "src": "new"}, {"id": "N-職安2-034", "subject": "刑事法", "topic": "消防法", "stem": "依職業安全衛生法規定，下列何者非屬雇主應「妥為規劃及採取必要之安全衛生措施」之事項？", "opts": {"A": "重複性作業等促發肌肉骨骼疾病之預防", "B": "輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防", "C": "防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害", "D": "執行職務因他人行為遭受身體或精神不法侵害之預防，並建立申訴、調查及處理程序"}, "answer": "C", "explain": "職業安全衛生法第六條第二項所定應妥為規劃及採取必要安全衛生措施之事項有四款：肌肉骨骼疾病預防、異常工作負荷促發疾病預防、執行職務遭受不法侵害之預防，及避難、急救、休息等保護身心健康事項。防止墜落、物體飛落或崩塌之危害屬同條第一項第五款「必要安全衛生設備及措施」，分屬不同項次。", "ref": "職業安全衛生法§6", "evidence": "輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防", "tag": "職安", "src": "new"}, {"id": "N-職安2-035", "subject": "刑事法", "topic": "消防法", "stem": "某消防機關辦公廳舍整修工程之工作場所有立即發生危險之虞。依職業安全衛生法規定，下列敘述何者正確？", "opts": {"A": "雇主或工作場所負責人應即令停止作業，並使勞工退避至安全場所", "B": "勞工發現有立即發生危險之虞時，仍須待直屬主管指示後始得停止作業", "C": "勞工僅得於危險已實際發生並造成傷害後，始得退避至安全場所", "D": "雇主得以任務急迫及業務需要為由，命勞工繼續於原場所作業"}, "answer": "A", "explain": "職業安全衛生法第十八條第一項規定，工作場所有立即發生危險之虞時，雇主或工作場所負責人應即令停止作業，並使勞工退避至安全場所。此為雇主之作為義務，違反者依第四十一條第一項第二款得處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金，不得以業務需要為由排除。", "ref": "職業安全衛生法§18", "evidence": "工作場所有立即發生危險之虞時，雇主或工作場所負責人應即令停止作業，並使勞工退避至安全場所", "tag": "職安", "src": "new"}, {"id": "N-職安2-036", "subject": "刑事法", "topic": "消防法", "stem": "依職業安全衛生法規定，勞工執行職務發現有立即發生危險之虞時，關於其停止作業及退避，下列敘述何者正確？", "opts": {"A": "勞工得逕行離開作業現場，且無須向直屬主管報告該項危險情形", "B": "勞工應在不危及其他工作者安全情形下自行停止作業及退避，並立即向直屬主管報告", "C": "雇主得不給付其停止作業期間之工資，但不得對該勞工予以解僱或調職", "D": "雇主如認定勞工之危險判斷有誤，得逕行對該勞工為調職或減薪處分"}, "answer": "B", "explain": "職業安全衛生法第十八條第二項賦予勞工退避權：發現有立即發生危險之虞時，得在不危及其他工作者安全情形下，自行停止作業及退避至安全場所，並立即向直屬主管報告。第三項並禁止雇主對該勞工解僱、調職、不給付停止作業期間工資或其他不利處分，除雇主證明勞工濫用停止作業權並經主管機關認定者外。", "ref": "職業安全衛生法§18", "evidence": "勞工執行職務發現有立即發生危險之虞時，得在不危及其他工作者安全情形下，自行停止作業及退避至安全場所，並立即向直屬主管報告", "tag": "職安", "src": "new"}, {"id": "N-職安2-037", "subject": "刑事法", "topic": "消防法", "stem": "依職業安全衛生法規定，事業單位勞動場所發生死亡災害，或發生災害之罹災人數在三人以上者，雇主應於多久時間內通報勞動檢查機構？", "opts": {"A": "四小時內", "B": "八小時內", "C": "十二小時內", "D": "二十四小時內"}, "answer": "B", "explain": "職業安全衛生法第三十七條第二項規定，勞動場所發生死亡災害、罹災人數在三人以上、罹災人數在一人以上且需住院治療，或其他經中央主管機關指定公告之災害者，雇主應於八小時內通報勞動檢查機構。同條第四項並規定除必要之急救、搶救外，非經司法機關或勞動檢查機構許可，不得移動或破壞現場。", "ref": "職業安全衛生法§37", "evidence": "事業單位勞動場所發生下列職業災害之一者，雇主應於八小時內通報勞動檢查機構", "tag": "職安", "src": "new"}, {"id": "N-職安2-038", "subject": "刑事法", "topic": "消防法", "stem": "依職業安全衛生法規定，關於健康檢查及勞工健康服務，下列敘述何者正確？", "opts": {"A": "雇主於僱用勞工時應施行體格檢查，對在職勞工應施行健康檢查，且勞工對該檢查有接受之義務", "B": "健康檢查費用應由勞工自行負擔，雇主僅負保存檢查紀錄之責任", "C": "事業單位勞工人數在三十人以上者，應置勞工健康服務人員或委託專業機構辦理", "D": "勞工得拒絕雇主依法安排之一般健康檢查，且不生任何法律效果"}, "answer": "A", "explain": "職業安全衛生法第二十條第一項規定僱用時應施行體格檢查、在職勞工應施行健康檢查；第二項規定檢查紀錄由雇主保存並負擔費用；第六項規定勞工有接受檢查之義務，違反者依第四十六條第四項處新臺幣三千元以下罰鍰。另第二十二條第一項之門檻為勞工人數五十人以上，而非三十人以上。", "ref": "職業安全衛生法§20、§22", "evidence": "雇主於僱用勞工時，應施行體格檢查；對在職勞工應施行下列健康檢查", "tag": "職安", "src": "new"}, {"id": "N-職安2-039", "subject": "刑事法", "topic": "消防法", "stem": "依職業安全衛生法規定，關於安全衛生教育訓練，下列敘述何者錯誤？", "opts": {"A": "雇主對勞工應施以從事工作及預防災變所必要之安全衛生教育訓練", "B": "前開教育訓練應由雇主自行辦理或交由中央主管機關認可之機關（構）、學校、團體等訓練單位辦理", "C": "勞工對於安全衛生教育訓練有接受之義務，違反者處新臺幣三千元以下罰鍰", "D": "勞工對於安全衛生教育訓練僅有參加之權利，縱拒絕參加亦不受任何處罰"}, "answer": "D", "explain": "職業安全衛生法第三十二條第一項規定雇主應對勞工施以必要之安全衛生教育訓練，第二項規定得自行辦理或交由中央主管機關認可之訓練單位辦理，第四項並明定勞工有接受之義務。勞工違反第三十二條第四項者，依第四十六條第四項處新臺幣三千元以下罰鍰，故並非僅有權利而無義務。", "ref": "職業安全衛生法§32、§46", "evidence": "違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰", "tag": "職安", "src": "new"}, {"id": "N-職安2-040", "subject": "刑事法", "topic": "消防法", "stem": "依職業安全衛生法規定，雇主對於具有危害性之化學品，應如何辦理危害告知？", "opts": {"A": "應予標示、製備清單及揭示安全資料表，並採取必要之通識措施", "B": "僅須於使用時以口頭向勞工告知危害性質，無須製備清單及揭示", "C": "僅須將安全資料表送勞動檢查機構備查，無須於作業現場揭示", "D": "應於化學品發生洩漏事故後，始須製備清單及揭示安全資料表"}, "answer": "A", "explain": "職業安全衛生法第十條第一項規定，雇主對於具有危害性之化學品，應予標示、製備清單及揭示安全資料表，並採取必要之通識措施；第二項並要求製造者、輸入者或供應者於提供化學品前應予標示及提供安全資料表。此為事前之危害告知義務，不得以口頭告知或事後補行替代。", "ref": "職業安全衛生法§10", "evidence": "雇主對於具有危害性之化學品，應予標示、製備清單及揭示安全資料表，並採取必要之通識措施", "tag": "職安", "src": "new"}, {"id": "N-設置-001", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準用語定義，有關危險工作場所之分級，下列敘述何者正確？", "opts": {"A": "儲存一般可燃性固體物質倉庫之高度超過五點五公尺者，為高度危險工作場所", "B": "儲存一般可燃性固體物質倉庫之高度超過四點五公尺者，為高度危險工作場所", "C": "易燃性液體物質之閃火點未超過攝氏六十度之作業場所，為中度危險工作場所", "D": "木材加工業作業場所及油漆作業場所，為中度危險工作場所"}, "answer": "A", "explain": "設置標準第4條第1項第3款明定，高度危險工作場所指儲存一般可燃性固體物質倉庫之高度超過五點五公尺者，故（A）正確、（B）誤植為四點五公尺。（C）錯誤，易燃性液體物質之閃火點「未超過」攝氏六十度者屬高度危險工作場所，同項第4款之中度危險工作場所係閃火點「超過」攝氏六十度之作業場所或輕工業場所。木材加工業及油漆作業場所係第3款明列之高度危險工作場所，（D）誤列為中度。", "ref": "設置標準§4Ⅰ③④", "evidence": "高度危險工作場所：儲存一般可燃性固體物質倉庫之高度超過五點五公尺者", "tag": "子法", "src": "new"}, {"id": "N-設置-002", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準第12條場所用途分類規定，下列場所何者屬於「甲類場所」？", "opts": {"A": "醫院、療養院", "B": "診所、辦公室", "C": "學校教室、補習班", "D": "圖書館、博物館"}, "answer": "A", "explain": "設置標準第12條第1款第6目將醫院、療養院、榮譽國民之家、長期照顧服務機構等列為甲類場所，故（A）正確。（B）診所與辦公室屬同條第2款第6目之乙類場所；（C）學校教室、補習班屬第2款第3目乙類場所；（D）圖書館、博物館屬第2款第4目乙類場所。甲、乙類之區別直接影響應設消防安全設備之門檻面積，須逐目記憶。", "ref": "設置標準§12①(六)", "evidence": "醫院、療養院、榮譽國民之家、長期照顧服務機構", "tag": "子法", "src": "new"}, {"id": "N-設置-003", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準，下列何種場所「不」屬應設置滅火器之場所？", "opts": {"A": "總樓地板面積在一百五十平方公尺以上之乙類場所", "B": "設於地下層且樓地板面積在五十平方公尺以上之各類場所", "C": "總樓地板面積在一百平方公尺之丙類場所", "D": "設有鍋爐房、廚房等大量使用火源之各類場所"}, "answer": "C", "explain": "設置標準第14條規定應設滅火器之場所包括甲類場所、地下建築物、幼兒園，總樓地板面積在一百五十平方公尺以上之乙、丙、丁類場所，設於地下層或無開口樓層且樓地板面積在五十平方公尺以上之各類場所，以及設有放映室、變壓器等電氣設備或鍋爐房、廚房等大量使用火源之各類場所。（C）僅一百平方公尺之丙類場所未達一百五十平方公尺門檻，故非當然應設；（A）（B）（D）均符合該條列舉。", "ref": "設置標準§14", "evidence": "總樓地板面積在一百五十平方公尺以上之乙、丙、丁類場所", "tag": "子法", "src": "new"}, {"id": "N-設置-004", "subject": "刑事法", "topic": "消防法", "stem": "某五層樓建築物，第三層供視聽歌唱場所（KTV）使用，該層樓地板面積為三百五十平方公尺。依各類場所消防安全設備設置標準，有關室內消防栓設備之設置，下列敘述何者正確？", "opts": {"A": "因未達五百平方公尺，該場所免設室內消防栓設備", "B": "已達三百平方公尺，該場所應設置室內消防栓設備", "C": "須達一千四百平方公尺以上，該場所始應設置室內消防栓設備", "D": "因非六層以上建築物，該場所一律免設室內消防栓設備"}, "answer": "B", "explain": "KTV屬設置標準第12條第1款第1目場所。同標準第15條第1項第1款規定，五層以下建築物供第12條第1款第1目所列場所使用，任何一層樓地板面積在三百平方公尺以上者應設室內消防栓設備，本題三百五十平方公尺已達門檻，故（B）正確。五百平方公尺係適用於甲類其他各目及第2款至第4款場所，一千四百平方公尺則為學校教室之門檻，（A）（C）錯誤；（D）誤解六層以上另有一百五十平方公尺之更低門檻。", "ref": "設置標準§15Ⅰ①", "evidence": "供第十二條第一款第一目所列場所使用，任何一層樓地板面積在三百平方公尺以上者", "tag": "子法", "src": "new"}, {"id": "N-設置-005", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準，下列有關應設置自動撒水設備場所之敘述，何者正確？", "opts": {"A": "十層以下建築物之樓層，供視聽歌唱場所使用，樓地板面積合計在五百平方公尺以上者", "B": "供倉庫使用，樓層高度超過六公尺且樓地板面積在七百平方公尺以上之高架儲存倉庫", "C": "總樓地板面積在五百平方公尺以上之地下建築物", "D": "建築物在十一層以上之樓層，樓地板面積在一百平方公尺以上者"}, "answer": "D", "explain": "設置標準第17條第1項第2款明定，建築物在十一層以上之樓層，樓地板面積在一百平方公尺以上者應設自動撒水設備，故（D）正確。（A）錯誤，同項第1款對第12條第1款第1目場所之門檻為樓地板面積合計三百平方公尺以上；（B）錯誤，同項第6款之高架儲存倉庫須「樓層高度超過十公尺」且七百平方公尺以上；（C）錯誤，同項第7款地下建築物之門檻為總樓地板面積一千平方公尺以上。", "ref": "設置標準§17Ⅰ②", "evidence": "建築物在十一層以上之樓層，樓地板面積在一百平方公尺以上者", "tag": "子法", "src": "new"}, {"id": "N-設置-006", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準第31條有關滅火器設置之規定，下列敘述何者錯誤？", "opts": {"A": "鍋爐房、廚房等大量使用火源之處所，以樓地板面積每二十五平方公尺（含未滿）有一滅火效能值", "B": "設有滅火器之樓層，自樓面居室任一點至滅火器之步行距離在二十公尺以下", "C": "懸掛於牆上之滅火器，其重量在十八公斤以上者，上端與樓地板面之距離在一點五公尺以下", "D": "供甲類場所使用者，各層樓地板面積每一百平方公尺（含未滿）有一滅火效能值"}, "answer": "C", "explain": "設置標準第31條第5款規定，懸掛於牆上或放置滅火器箱中之滅火器，其上端與樓地板面之距離，十八公斤以上者在「一公尺以下」，未滿十八公斤者始為一點五公尺以下，（C）將二者對調而錯誤。（A）為同條第1款第3目、（B）為第3款、（D）為第1款第1目（甲類及戊類每一百平方公尺一滅火效能值，乙、丙、丁類為每二百平方公尺），均屬正確。", "ref": "設置標準§31⑤", "evidence": "十八公斤以上者在一公尺以下，未滿十八公斤者在一點五公尺以下", "tag": "子法", "src": "new"}, {"id": "N-設置-007", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準，有關第一種及第二種室內消防栓之設置，下列敘述何者正確？", "opts": {"A": "第一種消防栓各層任一點至消防栓接頭之水平距離在二十五公尺以下，第二種在十五公尺以下", "B": "二者放水壓力均應在每平方公分一點七公斤以上，放水量第一種在每分鐘一百三十公升以上、第二種在每分鐘八十公升以上", "C": "第一種消防栓箱內應配置口徑二十五毫米消防栓連同管盤長三十公尺之皮管及瞄子一具", "D": "消防栓開關距離樓地板面之高度，應在零點八公尺以上一點五公尺以下"}, "answer": "B", "explain": "設置標準第34條第1項規定，第一種與第二種消防栓之放水壓力均在每平方公分一點七公斤以上（0.17MPa以上），放水量則分別為每分鐘一百三十公升與八十公升以上，故（B）正確。（A）錯誤，二種消防栓之水平距離均為二十五公尺以下；（C）所述二十五毫米消防栓、管盤長三十公尺皮管係第二種消防栓之配置；（D）錯誤，同條第2項第1款之消防栓開關高度為零點三公尺以上一點五公尺以下。", "ref": "設置標準§34Ⅰ①②", "evidence": "各消防栓瞄子放水壓力在每平方公分一點七公斤以上或0.17MPa以上，放水量在每分鐘一百三十公升以上", "tag": "子法", "src": "new"}, {"id": "N-設置-008", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準第46條有關撒水頭配置之規定，下列敘述何者錯誤？", "opts": {"A": "戲院表演場所之舞臺及道具室，任一點至撒水頭之水平距離在一點七公尺以下", "B": "室內停車空間及昇降機械式停車場，任一點至撒水頭之水平距離在二點一公尺以下", "C": "快速反應型撒水頭設於防火構造建築物者，其水平距離得增加為二點六公尺以下", "D": "採用小區劃型撒水頭者，撒水頭間距在三公尺以下，且防護面積在十三平方公尺以下"}, "answer": "D", "explain": "設置標準第46條第1項第4款規定，小區劃型撒水頭任一點至撒水頭之水平距離在二點六公尺以下，「撒水頭間距在三公尺以上」，且任一撒水頭之防護面積在十三平方公尺以下；（D）將間距誤為三公尺以下，故錯誤。（A）為同項第1款、（B）為第2款、（C）為第3款第2目（快速反應型二點三公尺，防火構造建築物得增為二點六公尺），均正確。", "ref": "設置標準§46Ⅰ④", "evidence": "撒水頭間距在三公尺以上，且任一撒水頭之防護面積在十三平方公尺以下", "tag": "子法", "src": "new"}, {"id": "N-設置-009", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準第49條規定，下列處所何者「不」得免裝撒水頭？", "opts": {"A": "電信機械室或電腦室", "B": "室內游泳池之水面或溜冰場之冰面上方", "C": "儲存鈉、鉀等禁水性物質之化學品倉庫", "D": "集會堂之觀眾席設有固定座椅部分，且撒水頭裝置面高度在六公尺者"}, "answer": "D", "explain": "設置標準第49條第9款規定，甲類第1目場所及集會堂使用之觀眾席，須「設有固定座椅部分，且撒水頭裝置面高度在八公尺以上者」始得免裝撒水頭；（D）僅六公尺未達八公尺，故不得免裝。（A）為同條第5款、（B）為第10款、（C）為第12款所列之得免裝處所，均屬正確。", "ref": "設置標準§49⑨", "evidence": "設有固定座椅部分，且撒水頭裝置面高度在八公尺以上者", "tag": "子法", "src": "new"}, {"id": "N-設置-010", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準第112條有關火警分區劃定之規定，下列敘述何者錯誤？", "opts": {"A": "每一火警分區不得超過一樓層，並在樓地板面積六百平方公尺以下", "B": "每一分區之任一邊長在五十公尺以下；裝設光電式分離型探測器時，其邊長得在一百公尺以下", "C": "如由主要出入口能直接觀察該樓層任一角落時，六百平方公尺得增為一千五百平方公尺", "D": "樓梯或斜坡通道，垂直距離每四十五公尺以下為一火警分區"}, "answer": "C", "explain": "設置標準第112條第3款規定，如由主要出入口或直通樓梯出入口能直接觀察該樓層任一角落時，第1款之六百平方公尺「得增為一千平方公尺」，（C）誤為一千五百平方公尺。（A）為同條第1款、（B）為第2款、（D）為第5款，均屬正確。另同條第1款但書規定上下二層樓地板面積之和在五百平方公尺以下者得二層共用一分區。", "ref": "設置標準§112③", "evidence": "第一款規定之六百平方公尺得增為一千平方公尺", "tag": "子法", "src": "new"}, {"id": "N-設置-011", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準，偵煙式探測器（光電式分離型除外）之裝置，下列敘述何者正確？", "opts": {"A": "在走廊及通道，步行距離每三十公尺至少設置一個；使用第三種探測器時，每二十公尺至少設置一個", "B": "探測器下端，應裝設在裝置面下方三十公分範圍內", "C": "在樓梯、斜坡通道及電扶梯，垂直距離每二十公尺至少設置一個", "D": "探測器應裝設於距離牆壁或樑三十公分以上之位置"}, "answer": "A", "explain": "設置標準第122條第5款明定，偵煙式探測器在走廊及通道，步行距離每三十公尺至少設置一個，使用第三種探測器時每二十公尺至少設置一個，故（A）正確。（B）錯誤，同條第2款規定偵煙式探測器下端應裝設在裝置面下方「六十公分」範圍內（三十公分係差動式局限型等熱式探測器之規定）；（C）錯誤，同條第6款為垂直距離每十五公尺，第三種為每十公尺；（D）錯誤，同條第3款為距牆壁或樑六十公分以上。", "ref": "設置標準§122⑤", "evidence": "探測器在走廊及通道，步行距離每三十公尺至少設置一個；使用第三種探測器時，每二十公尺至少設置一個", "tag": "子法", "src": "new"}, {"id": "N-設置-012", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準第133條有關緊急廣播設備揚聲器裝設之規定，下列敘述何者錯誤？", "opts": {"A": "廣播區域超過一百平方公尺時，應設L級揚聲器", "B": "廣播區域超過五十平方公尺、一百平方公尺以下時，設L級或M級揚聲器", "C": "從各廣播區域內任一點至揚聲器之水平距離在十五公尺以下", "D": "設於樓梯或斜坡通道時，至少垂直距離每十五公尺設一個L級揚聲器"}, "answer": "C", "explain": "設置標準第133條第2款第4目規定，從各廣播區域內任一點至揚聲器之「水平距離在十公尺以下」，（C）誤為十五公尺。（A）為同款第1目、（B）為第2目、（D）為第5目，均屬正確。又同條第3款規定，樓梯或斜坡通道以外之場所，揚聲器音壓經計算在七十五分貝以上者，得不受水平距離十公尺之限制。", "ref": "設置標準§133②(四)", "evidence": "從各廣播區域內任一點至揚聲器之水平距離在十公尺以下", "tag": "子法", "src": "new"}, {"id": "N-設置-013", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準，下列何者屬應設置一一九火災通報裝置之場所？", "opts": {"A": "醫院", "B": "補習班", "C": "電影院", "D": "百貨商場"}, "answer": "A", "explain": "設置標準第22條之1第1款明定，應設一一九火災通報裝置者，為第12條第1款第6目所定醫院、療養院、榮譽國民之家、長期照顧服務機構、老人福利機構、護理機構、身心障礙福利機構等場所，及其他經中央主管機關公告之供公眾使用場所，故（A）正確。（B）補習班屬第12條第2款第3目、（C）電影院屬第1款第1目、（D）百貨商場屬第1款第4目，均不在該條列舉範圍內。", "ref": "設置標準§22-1①", "evidence": "供第十二條第一款第六目所定醫院、療養院、榮譽國民之家", "tag": "子法", "src": "new"}, {"id": "N-設置-014", "subject": "刑事法", "topic": "消防法", "stem": "依各類場所消防安全設備設置標準第145條之1有關一一九火災通報裝置設置之規定，下列敘述何者錯誤？", "opts": {"A": "應具手動及自動啟動功能", "B": "應設於值日室等經常有人之處所；設有防災中心時，應設於該中心", "C": "手動啟動裝置之操作開關距離樓地板面之高度，在一點二公尺以上一點五公尺以下", "D": "裝置附近應設置送、收話器，並與其他內線電話明確區分"}, "answer": "C", "explain": "設置標準第145條之1第4款規定，一一九火災通報裝置
