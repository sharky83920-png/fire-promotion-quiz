高溫流向低溫，驅動力是溫差。熱量多寡、熱通量或材料熱傳係數都不決定方向。", "ref": "【107專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-041", "topic": "燃燒", "stem": "容易著火之燃料具下列何種特性？", "opts": {"A": "熱傳係數低", "B": "密度高", "C": "比熱高", "D": "接近固體"}, "answer": "A", "explain": "熱傳係數低的材料受熱時熱量不易往內部散失，表面溫度快速上升而易著火（熱慣性 kρc 愈小愈易著火）。密度高、比熱高都使升溫變慢。(B)(D)選項原文 OCR 殘缺，依題意補為「密度高」「接近固體」。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【107專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-042", "topic": "防火與特殊現象", "stem": "下列何者並非複燃（backdraft）發生之原因？", "opts": {"A": "通風不佳", "B": "燃料濃度高於可燃上限", "C": "空氣忽然進入", "D": "具爆裂物"}, "answer": "D", "explain": "複燃是通風不良的空間累積高於燃燒上限的可燃氣體，當門窗打開、空氣突然進入稀釋至燃燒範圍而爆燃。與爆裂物存在無關。", "ref": "【107專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-043", "topic": "火災", "stem": "在火勢擴大的過程中，下列哪一現象並非成長期的常見特徵？", "opts": {"A": "煙層變厚", "B": "火焰延燒", "C": "材料自燃", "D": "火場溫度增加"}, "answer": "C", "explain": "成長期火焰沿可燃物延燒、煙層逐漸加厚下降、溫度持續上升。室內材料因輻射熱普遍自燃是閃燃及最盛期的現象，不是成長期的常見特徵。", "ref": "【107專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-044", "topic": "火災", "stem": "下列何者並非高科技廠房火災之特性？", "opts": {"A": "火載量大", "B": "多功效乾粉滅火器為滅火第一選擇", "C": "極早型偵煙器偵測火災效果佳", "D": "燃料種類多"}, "answer": "B", "explain": "乾粉會污染精密設備與無塵環境，造成嚴重二次損失，並非高科技廠房的首選滅火方式。火載量大、燃料種類多、以極早期偵煙探測器偵測皆是其特性。", "ref": "【107專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-045", "topic": "火災", "stem": "下列何者並非古蹟火災防護之特性？", "opts": {"A": "滅火設備不易設置", "B": "防火區劃不完整", "C": "滅火水量應加大", "D": "木造可燃物多"}, "answer": "C", "explain": "古蹟文物怕水損，射水應節制而非加大水量，故(C)不是其防護特性。為保存原貌不易加裝設備、區劃不完整、木構造多，皆為古蹟火災特性。", "ref": "【107專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-046", "topic": "火災", "stem": "下列何者並非學校實驗室火災之特性？", "opts": {"A": "化學藥品眾多", "B": "防火毯為常用之滅火方式", "C": "水為主要的滅火藥劑", "D": "安全資料表為必備之資料"}, "answer": "C", "explain": "實驗室有禁水性、易燃液體等多種化學品，用水可能引發反應或擴大火勢，水不宜作為主要滅火劑。藥品多、常用防火毯覆蓋小火、須備安全資料表皆正確。", "ref": "【107專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-047", "topic": "燃燒", "stem": "固體燃料火焰延燒最快的方式為下列何者？", "opts": {"A": "向上", "B": "向下", "C": "水平", "D": "與延燒方向無關"}, "answer": "A", "explain": "向上延燒時火焰與熱氣流貼附在未燃燒面上，對流與輻射預熱效率最高，速度最快；水平次之，向下最慢。", "ref": "【107專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-048", "topic": "火災", "stem": "下列何者並非造成電氣火災的原因？", "opts": {"A": "短路", "B": "斷路", "C": "積污導電", "D": "半斷線"}, "answer": "B", "explain": "完全斷路時電流中斷，不會發熱。短路產生大電流、積污導電造成漏電起火（追蹤）、半斷線使截面變小局部過熱，都會引起電氣火災。", "ref": "【107專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-049", "topic": "防火與特殊現象", "stem": "下列何者並非防火區劃構件構造之性質？", "opts": {"A": "遮焰性", "B": "阻熱性", "C": "滅火性", "D": "遮煙性"}, "answer": "C", "explain": "防火區劃構件要求遮焰性（火焰不穿透）、阻熱性（背面溫升受限）及遮煙性，屬被動式防火。滅火是主動式消防設備的功能，不是區劃構件的性質。", "ref": "【107專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-050", "topic": "燃燒", "stem": "燃燒時若生成的熱與散失的熱保持平衡，燃燒溫度保持均勻之燃燒為下列何者？", "opts": {"A": "定常燃燒", "B": "定壓燃燒", "C": "定體積燃燒", "D": "定質量燃燒"}, "answer": "A", "explain": "產熱等於散熱、溫度維持穩定的燃燒稱為定常燃燒；產熱大於散熱而急速升溫者為非定常燃燒（如爆炸）。定壓、定體積是熱力學條件，與熱平衡定義不同。", "ref": "【107專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-051", "topic": "防火與特殊現象", "stem": "建築物火災發生後，若火勢由局部火災擴散至全面火災之短時間現象稱為？", "opts": {"A": "閃燃", "B": "閃點", "C": "爆燃", "D": "爆轟"}, "answer": "A", "explain": "閃燃是室內火災由局部燃燒在極短時間內轉為全室燃燒的轉折現象。閃點是液體引燃溫度，爆燃、爆轟屬爆炸型態。", "ref": "【107專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-052", "topic": "煙與熱流", "stem": "描述火勢大小之物理量為下列何者？", "opts": {"A": "溫度", "B": "熱通量", "C": "熱釋放率", "D": "熱焓"}, "answer": "C", "explain": "熱釋放率（HRR，kW）代表火源單位時間釋出的能量，是衡量火勢大小最重要的指標。熱通量描述熱傳遞強度，溫度隨位置變化，不能代表火勢規模。", "ref": "【107專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-053", "topic": "防火與特殊現象", "stem": "下列何項不是閃燃發生之條件？", "opts": {"A": "火載量大", "B": "在侷限空間內", "C": "通風不佳", "D": "火場溫度高"}, "answer": "C", "explain": "閃燃需要侷限空間蓄積熱煙、足夠火載量與高溫，且需有充分通風供氧才能全室燃燒；通風不佳反而會使火勢受抑，走向悶燒或複燃情境。", "ref": "【107專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-054", "topic": "滅火", "stem": "針對連鎖反應之滅火機制為何？", "opts": {"A": "移除法", "B": "冷卻法", "C": "抑制法", "D": "窒息法"}, "answer": "C", "explain": "抑制法以滅火劑（如乾粉、海龍）捕捉自由基，中斷燃燒連鎖反應。移除法針對可燃物、冷卻法針對熱、窒息法針對氧氣。", "ref": "【107專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-055", "topic": "燃燒", "stem": "以下哪一現象為燃燒完全度高之火災特徵？", "opts": {"A": "放熱多", "B": "煙量大", "C": "一氧化碳產生量大", "D": "火焰顏色偏黃色"}, "answer": "A", "explain": "完全燃燒時燃料充分氧化，釋放的熱量最多。煙量大、一氧化碳多、火焰偏黃（碳粒發光）都是不完全燃燒的表現。", "ref": "【107專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-056", "topic": "火災", "stem": "因電器設備而發生之火災為何？", "opts": {"A": "A類火災", "B": "B類火災", "C": "C類火災", "D": "D類火災"}, "answer": "C", "explain": "C類為通電中的電氣設備火災。A類為一般可燃固體、B類為可燃液體氣體、D類為可燃金屬。", "ref": "【107專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-057", "topic": "火災", "stem": "下列何者並非長公路隧道火災之特性？", "opts": {"A": "完全侷限空間", "B": "車禍為主要發生原因", "C": "會因車輛移動產生活塞效應", "D": "車流量越大危險度越高"}, "answer": "A", "explain": "隧道兩端有洞口、並設通風系統，屬半侷限空間，不是完全侷限空間。車禍為主要起火原因、車輛行駛產生活塞效應、車流量愈大危險愈高，皆為隧道火災特性。", "ref": "【107專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-001", "topic": "火災", "stem": "假設火場中只含一種燃料且均勻分布，起火後火勢循t²成長理論持續成長，且火災成長常數呈定值。已知起火後第1分鐘燒耗燃料1公斤，則再經2分鐘後，從起火開始起算總共燒耗若干公斤之燃料？", "opts": {"A": "4", "B": "8", "C": "9", "D": "27"}, "answer": "D", "explain": "t²火災釋熱率∝t²，累積燒耗量為其積分∝t³。第3分鐘時為(3/1)³=27倍，即27公斤；9是誤用t²。", "ref": "【108專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-002", "topic": "燃燒", "stem": "各1公斤之碳、氫、硫分別與氧進行完全燃燒，其理論需氧量分別為a、b、c公斤，則：", "opts": {"A": "a=b/6", "B": "b=3a", "C": "c=8b", "D": "b=16c"}, "answer": "B", "explain": "C+O₂→CO₂：a=32/12≈2.67；2H₂+O₂→2H₂O：b=32/4=8；S+O₂→SO₂：c=32/32=1。故b=3a。", "ref": "【108專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-003", "topic": "熱傳", "stem": "不同材質與厚度的牆壁或隔熱板，顯示不同的熱傳導效果；此可由下列何者估算？", "opts": {"A": "傅立葉定律（Fourier's law）", "B": "伯努利定律（Bernoulli's equation）", "C": "理想氣體定律（Ideal gas law）", "D": "比爾-朗伯特定律（Beer-Lambert law）"}, "answer": "A", "explain": "傅立葉定律q=kAΔT/L描述傳導熱流與導熱係數、厚度的關係。伯努利為流體能量守恆，比爾-朗伯特描述光的吸收衰減。", "ref": "【108專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-004", "topic": "燃燒", "stem": "今有A、B兩種可燃性氣體以1：1之體積混合，已知A、B之燃燒下限分別為3.0%、7.0%，若兩者間互不催化亦不反應，則理論上此混合氣體之燃燒下限為若干%？", "opts": {"A": "5.5", "B": "5.0", "C": "4.2", "D": "2.1"}, "answer": "C", "explain": "依勒沙特列定律：L=100/(50/3+50/7)≈4.2%。5.0是直接算術平均的錯誤。", "ref": "【108專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-005", "topic": "燃燒", "stem": "可燃性液體的閃火點（flash point），是指當其表面蒸氣與空氣混合達燃燒下限時的：", "opts": {"A": "蒸氣濃度", "B": "蒸氣壓力", "C": "蒸氣最小發火溫度", "D": "液體溫度"}, "answer": "D", "explain": "閃火點是液體溫度指標：液溫升到使液面蒸氣濃度達燃燒下限時的溫度，而非蒸氣本身的濃度或壓力。", "ref": "【108專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-006", "topic": "熱傳", "stem": "當受熱平面與熱輻射線方向垂直時，其輻射角為0度；兩者平行時輻射角為90度。假設輻射源強度不變，當受熱平面由垂直逐漸傾斜，致使輻射角由0度增加至60度時，該平面所受的輻射熱通量變為原來的若干倍？", "opts": {"A": "1/3", "B": "√3/2", "C": "1/2", "D": "1/√2"}, "answer": "C", "explain": "依朗伯餘弦定律，受熱通量∝cosθ，cos60°=1/2。√3/2是誤用sin60°。", "ref": "【108專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-007", "topic": "爆炸", "stem": "下列有關蒸氣爆炸的敘述何者錯誤？", "opts": {"A": "專指水蒸氣產生的爆炸", "B": "凡是過熱液體都可能發生", "C": "是一種快速的相變化的物理現象", "D": "不一定會引發火災"}, "answer": "A", "explain": "蒸氣爆炸是過熱液體急速汽化的物理爆炸，任何過熱液體（如液化氣體、熔融金屬遇水）都可能發生，並非只限水蒸氣。", "ref": "【108專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-008", "topic": "燃燒", "stem": "若乙烷的燃燒熱為350 kcal/mole，依據Burgess-Wheeler法則，下列何者最為接近乙烷的燃燒下限？", "opts": {"A": "2.5%", "B": "3.0%", "C": "3.8%", "D": "4.5%"}, "answer": "B", "explain": "Burgess-Wheeler法則：燃燒下限×燃燒熱≈1050（kcal/mol·vol%），1050/350=3.0%。", "ref": "【108專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-009", "topic": "爆炸", "stem": "就同一種可燃性粉塵而言，下列何種措施有助於降低發生粉塵爆炸的危險性？", "opts": {"A": "提高環境溫度", "B": "提高環境壓力", "C": "提高粉塵粒徑", "D": "提高環境氧氣濃度"}, "answer": "C", "explain": "粒徑越大比表面積越小，越不易懸浮與著火，爆炸危險降低；升溫、升壓、提高氧濃度都會增加危險。", "ref": "【108專技士 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-010", "topic": "爆炸", "stem": "安裝爆炸洩氣道（或洩爆孔、洩氣孔）可適度降低侷限空間中粉塵爆炸的危害，則下列敘述何者錯誤？", "opts": {"A": "洩氣孔截面積越大效果越好", "B": "洩氣孔若連接導管，則導管越短越好", "C": "粉塵最大爆壓較大者，洩氣孔比亦宜相對加大", "D": "室內空間較小者，洩氣孔比亦宜相對縮小"}, "answer": "D", "explain": "空間越小，壓力上升越快，洩氣孔比（洩壓面積/體積）應相對加大而非縮小；其餘三項皆正確。", "ref": "【108專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-011", "topic": "煙與熱流", "stem": "室內火災所產生的熱煙層由天花板向下沉降的時間直接影響逃生，以此觀點而論，下列何者較不利於逃生？", "opts": {"A": "較矮的天花板", "B": "較大的室內空間", "C": "較大的室內樓地板面積", "D": "較小的火源周長"}, "answer": "A", "explain": "天花板越矮，蓄煙空間越小，煙層越快降到人員呼吸高度；空間大、樓地板面積大或火源周長小（捲吸量少）都會延緩煙層下降。", "ref": "【108專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-012", "topic": "煙與熱流", "stem": "建築物之中性帶高度受室內溫度、室外溫度及上下開口的影響，下列敘述何者錯誤？", "opts": {"A": "室內溫度上升，中性帶會向下偏移", "B": "上半部開口越大，中性帶會向上偏移", "C": "位於中性帶上，室內室外壓差為零", "D": "迎風面中性帶會下降，而背風面中性帶會上升"}, "answer": "D", "explain": "迎風面外部風壓增加，外氣推入使中性帶上升；背風面受負壓，中性帶下降，D項方向相反。", "ref": "【108專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-013", "topic": "防火與特殊現象", "stem": "比較室內火災閃燃（Flashover）與複燃（Backdraft），下列敘述何者正確？", "opts": {"A": "閃燃經常發生於火災衰退期", "B": "複燃發生前處於高溫缺氧的悶燒狀態", "C": "輻射能回饋效應是引起複燃的關鍵機制", "D": "氧氣是觸發閃燃的主要因素"}, "answer": "B", "explain": "複燃是高溫缺氧悶燒空間突然灌入空氣所致；閃燃發生在成長期轉全盛期，主因是熱煙層輻射回饋，兩者機制在C、D被對調。", "ref": "【108專技士 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-014", "topic": "防火與特殊現象", "stem": "依Thomas閃燃公式（Thomas Flashover Correlation），有關室內火災發生閃燃所需最小釋熱率，下列敘述何者錯誤？", "opts": {"A": "隨室內火載量增加而提高", "B": "隨室內空間增加而提高", "C": "隨對外開口面積增加而提高", "D": "隨對外開口高度增加而提高"}, "answer": "A", "explain": "Thomas公式Q=7.8A_T+378A₀√H₀，只與室內總表面積及開口面積、高度有關，與火載量無關。", "ref": "【108專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-015", "topic": "火災", "stem": "下列何種現象對於局部電阻所產生的效應恰與其他三者相反？", "opts": {"A": "氧化亞銅增殖", "B": "開關接觸不良", "C": "半斷線", "D": "金原現象"}, "answer": "D", "explain": "氧化亞銅增殖、接觸不良、半斷線都使局部電阻增大而發熱；金原現象是絕緣物碳化（石墨化）形成導電路徑，使電阻降低。", "ref": "【108專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-016", "topic": "煙與熱流", "stem": "某發生火警的大樓，室內外溫度分別為800°C與20°C，中性帶位於4樓；6樓的內外壓差為60 Pa，若不考慮外部風等其他因素，8樓的內外壓差約為若干Pa？", "opts": {"A": "80", "B": "100", "C": "120", "D": "140"}, "answer": "C", "explain": "煙囪效應壓差與距中性帶高度成正比：6樓距中性帶2層為60 Pa，8樓距4層，60×4/2=120 Pa。", "ref": "【108專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-017", "topic": "危險物品", "stem": "危害物質可能因混合儲存或載運而衍生危險，則下列哪兩類公共危險物品於混合載運時的危險性最低？", "opts": {"A": "第一類和第六類", "B": "第二類和第四類", "C": "第一類和第五類", "D": "第三類和第六類"}, "answer": "B", "explain": "依混載規定，第二類（易燃固體）可與第四類（易燃液體）混載；第一、六類氧化性物質與可燃物或第三類混載危險高。", "ref": "【108專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-018", "topic": "燃燒", "stem": "當氣體進行「壓縮比=2」的斷熱壓縮時，下列對該氣體的敘述何者正確？", "opts": {"A": "其體積減半", "B": "其壓力倍增", "C": "其絕對溫度倍增", "D": "其壓力與體積的乘積維持恆定"}, "answer": "A", "explain": "壓縮比是壓縮前後體積比，比值2即體積減半；斷熱時PV^γ恆定，壓力升為2^γ倍（大於2倍），溫度升為2^(γ-1)倍，PV不守恆。", "ref": "【108專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-019", "topic": "滅火", "stem": "下列何種滅火劑使用於金屬火災時，沒有「與金屬產生化學反應衍生危害物質」的可能？", "opts": {"A": "IG-01", "B": "IG-100", "C": "IG-541", "D": "IG-55"}, "answer": "A", "explain": "IG-01是純氬氣，化學惰性；IG-100、IG-55含氮氣，可與鋰、鎂等生成氮化物，IG-541另含CO₂亦會與活性金屬反應。", "ref": "【108專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-020", "topic": "滅火", "stem": "下列何種滅火劑所含成分之一，於放射後有刺激呼吸之作用，可有效降低場內人員的窒息危害？", "opts": {"A": "IG-55", "B": "INERGEN", "C": "FM-200", "D": "NOVEC1230"}, "answer": "B", "explain": "INERGEN（IG-541）含約8%CO₂，可刺激呼吸中樞使人加深呼吸，在低氧環境中維持攝氧；其他三者無此成分。", "ref": "【108專技士 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-021", "topic": "火災", "stem": "依據建築物火災t²成長理論，在一定義為快速成長的火災中，釋熱率達到1 MW的時間應為多少秒？", "opts": {"A": "75", "B": "150", "C": "300", "D": "600"}, "answer": "B", "explain": "t²火災以達1 MW的時間分級：極快速75秒、快速150秒、中速300秒、慢速600秒。", "ref": "【108專技士 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-022", "topic": "熱傳", "stem": "物體在327°C時的輻射強度為E，則當溫度升高到927°C時的輻射強度為何？", "opts": {"A": "16E", "B": "8E", "C": "4E", "D": "64E"}, "answer": "A", "explain": "輻射強度∝絕對溫度⁴：600 K升到1200 K為2倍，2⁴=16，得16E；須用絕對溫度計算。", "ref": "【108專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-023", "topic": "燃燒", "stem": "乙醇在閃點時的飽和蒸汽壓為25 mmHg，則乙醇在常壓下的燃燒下限約為何？", "opts": {"A": "3.29%", "B": "1.8%", "C": "5.28%", "D": "6.8%"}, "answer": "A", "explain": "閃點時液面蒸氣濃度恰為燃燒下限，濃度=蒸氣分壓/總壓=25/760≈3.29%。", "ref": "【108專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-024", "topic": "燃燒", "stem": "下列有關燃燒上下限之敘述，何者錯誤？", "opts": {"A": "當可燃物濃度高於燃燒上限，即使給予點火能量亦無法使其燃燒", "B": "燃燒下限愈低，可燃物愈危險", "C": "可燃性氣體與空氣之混合氣中加入不燃性氣體，會使其燃燒上限下降", "D": "可燃性氣體混合後，其燃燒下限為混合前各氣體中燃燒下限最低者"}, "answer": "D", "explain": "混合氣體燃燒下限須依勒沙特列定律加權計算，介於各成分下限之間，不等於最低者。", "ref": "【108專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-025", "topic": "燃燒", "stem": "木材受熱分解進而燃燒的過程中，當加熱到引火溫度時，可燃性氣體釋出量迅速增加，試問木材的引火溫度約為多少°C？", "opts": {"A": "100", "B": "260", "C": "360", "D": "450"}, "answer": "B", "explain": "木材約260°C時熱分解氣體大量釋出，可被引燃，稱為引火（著火危險）溫度；約450°C才會自行發火。", "ref": "【108專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-026", "topic": "爆炸", "stem": "乙炔加壓後容易產生分解爆炸，為避免此現象，乙炔鋼瓶常利用浸泡何種溶劑之多孔性物質，使乙炔溶解於其中，防止分解爆炸？", "opts": {"A": "丙醇", "B": "甲醛", "C": "乙醇", "D": "丙酮"}, "answer": "D", "explain": "溶解乙炔鋼瓶內填多孔性物質並浸丙酮（或DMF），乙炔溶於丙酮中，降低分解爆炸危險。", "ref": "【108專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-027", "topic": "爆炸", "stem": "有關粉塵的最小發火能量，下列敘述何者正確？", "opts": {"A": "粉塵的最小發火能量比可燃性氣體低，大約為10～100 mJ", "B": "一般而言同一種粉塵，當粒子越小，最小發火能量越低", "C": "最小發火能量與溫度、壓力無關", "D": "大氣中水蒸氣含量越高，粉塵最小發火能量越低"}, "answer": "B", "explain": "粒徑越小比表面積越大，越容易點燃；粉塵最小發火能量（約10～100 mJ）比氣體高，且受溫度、壓力、濕度影響，濕度高反而較難點燃。", "ref": "【108專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-028", "topic": "煙與熱流", "stem": "火場中煙霧的成分複雜且多具毒性，火災時若吸入下列何種氣體會妨礙細胞中氧化酵素之活性，造成細胞呼吸停止？", "opts": {"A": "氰化氫（HCN）", "B": "一氧化碳（CO）", "C": "氯化氫（HCl）", "D": "二氧化氮（NO₂）"}, "answer": "A", "explain": "HCN抑制粒線體細胞色素氧化酶，使細胞無法利用氧（組織窒息）；CO主要是與血紅素結合阻礙運氧。", "ref": "【108專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-029", "topic": "煙與熱流", "stem": "煙霧的流動為由高壓處往低壓處流，因此加壓造成壓力差可以控制煙霧流動。若於一安全梯間流入體積流率為Q（m³/s）的空氣形成P的壓力差，現欲將壓力差提高到2P，則流入的空氣體積流率應為多少？", "opts": {"A": "4Q", "B": "2Q", "C": "√2 Q", "D": "1/√2 Q"}, "answer": "C", "explain": "開口流量Q∝A√ΔP，壓差變2倍，流量變√2倍。", "ref": "【108專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-030", "topic": "防火與特殊現象", "stem": "下列何種措施，可以防止由大樓窗口噴出的火焰向上層延燒？", "opts": {"A": "加大窗戶面積以提升對流", "B": "降低窗戶高度，增加寬度，修改窗戶為橫型窗戶", "C": "採用定溫型火警探測器", "D": "增加上下層窗戶間的側壁高度"}, "answer": "D", "explain": "加大上下層窗間牆（層間高度）可拉開噴出火焰與上層開口的距離；橫長型窗戶噴出火焰較貼近外牆，反而易延燒。", "ref": "【108專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-031", "topic": "煙與熱流", "stem": "假設建築物外部風速為V時，其迎風面的風壓為P，當風速提高為2V時，建築物所受風壓變為：", "opts": {"A": "2P", "B": "4P", "C": "√2 P", "D": "1/2 P"}, "answer": "B", "explain": "風壓P=C·½ρV²，與風速平方成正比，風速加倍則風壓為4倍。", "ref": "【108專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-032", "topic": "火災", "stem": "下列有關防止靜電災害的方法中，何者錯誤？", "opts": {"A": "使用導電性材料，以防止靜電發生", "B": "降低空氣的相對濕度，以免導電", "C": "接地以消除導體與大地間的電位差", "D": "減少摩擦以降低靜電之發生"}, "answer": "B", "explain": "提高相對濕度可使物體表面形成水膜洩放電荷，是防靜電方法；降低濕度反而使靜電更易累積。", "ref": "【108專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-033", "topic": "火災", "stem": "電氣火災中，下列何者為積污導電現象？", "opts": {"A": "受直流電壓之含銀異極導體間，其絕緣物表面附著水分，銀離子沿絕緣物表面移動至陰極，產生電流流通而發熱", "B": "木材、電木等絕緣體之絕緣性受到破壞，而導致異常電流流通", "C": "絕緣物內存有瑕疵，如氣隙、雜質等，在承受高電壓下，造成電場不均而破壞絕緣性", "D": "異極導體間之絕緣物表面附著水分及灰塵，在承受電壓下造成絕緣物表面流通電流而發熱"}, "answer": "D", "explain": "積污導電是灰塵加水分在絕緣表面形成導電路徑（漏電痕跡）；A是銀遷移現象，B似石墨化（金原現象），C為絕緣破壞。", "ref": "【108專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-034", "topic": "危險物品", "stem": "化學物質災害搶救程序H.A.Z.M.A.T.中有關區域管制事項，下列敘述何者正確？", "opts": {"A": "指揮站應設置於暖區", "B": "民眾、記者應安排於冷區中", "C": "熱區為事故地點周圍可能遭受污染的地區", "D": "搶救人員之人員除污應於熱區外圍進行"}, "answer": "C", "explain": "熱區即事故點周圍可能受污染區；指揮站設於冷區，民眾與記者應在冷區外（管制區外），除污在暖區的除污走廊進行。", "ref": "【108專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-035", "topic": "爆炸", "stem": "為避免液化石油氣儲槽因外圍起火燃燒，一時無法撲滅而發生BLEVE現象，可採取之防救策略下列何者正確？", "opts": {"A": "槽體附近設置固定式撒水設備降低儲槽溫度", "B": "設置防液堤將洩漏之燃料限制於槽體周圍", "C": "降低安全閥的壓力設定值，使內壓上升速度增加", "D": "減低槽體絕緣層，以避免熱蓄積"}, "answer": "A", "explain": "冷卻槽壁（尤其氣相部）可防止鋼材強度下降而破裂；防液堤把燃料圍在槽邊反而加熱槽體，減少隔熱層也不利。", "ref": "【108專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-036", "topic": "滅火", "stem": "下列何者不是IG-541氣體滅火藥劑的成分？", "opts": {"A": "氨氣", "B": "氮氣", "C": "二氧化碳", "D": "氬氣"}, "answer": "A", "explain": "IG-541由氮氣52%、氬氣40%、二氧化碳8%組成，不含氨氣。（原書選項A經OCR辨識為「氨氣」）", "ref": "【108專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-037", "topic": "危險物品", "stem": "下列有關GHS制度之說明，何者錯誤？", "opts": {"A": "為化學品分類、標示以及物質安全資料表內容全球調和一致的規範", "B": "化學品依危害性分為物理性危害、健康危害及環境危害等三大類", "C": "化學品危害圖示共有9種，依化學品的危害性，選擇最具代表性一種危害進行張貼", "D": "滅火器依規定不適用通識規則，可免標示及張貼危害圖示"}, "answer": "C", "explain": "GHS圖示共9種，但化學品具多種危害時應標示所有適用圖示，而非只挑一種。", "ref": "【108專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-038", "topic": "燃燒", "stem": "可燃物不藉由火焰或電氣火花引起燃燒，在大氣中僅因受熱而引起燃燒的最低溫度稱為：", "opts": {"A": "發火點（ignition point）", "B": "閃火點（flash point）", "C": "燃燒點（burning point）", "D": "閃燃點（flashover point）"}, "answer": "A", "explain": "無外部火源、單靠加熱自行起燃的最低溫度為發火點（自燃溫度）；閃火點與燃燒點都需外加火源。", "ref": "【108專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-039", "topic": "爆炸", "stem": "高壓氣體的爆炸界限，通常較常壓下為廣，爆炸上限也明顯提高，但下列何種氣體之爆炸範圍及爆炸上限在高壓下卻降低？", "opts": {"A": "甲烷", "B": "二氧化碳", "C": "乙烷", "D": "一氧化碳"}, "answer": "D", "explain": "一氧化碳是特例，壓力升高時爆炸範圍反而變窄、上限下降；烴類在高壓下範圍擴大，CO₂本身不燃。", "ref": "【108專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-040", "topic": "火災", "stem": "建築物火災進入最盛期時，燃料數量龐大，但因對外開口相對較小的情況下，燃燒速度因開口通風量而受限，此現象稱為：", "opts": {"A": "無開口樓層燃燒", "B": "燃料控制燃燒", "C": "通風控制燃燒", "D": "悶燒"}, "answer": "C", "explain": "燃燒速度受開口供氣量限制即通風控制燃燒；燃料控制燃燒則是空氣充足、由燃料表面積決定。", "ref": "【108專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-041", "topic": "燃燒", "stem": "已知辛烷的燃燒下限為0.92（vol%），根據Burgess-Wheeler定律，其燃燒熱約為多少？", "opts": {"A": "1,750 kcal/mol", "B": "1,200 kcal/mol", "C": "950 kcal/mol", "D": "750 kcal/mol"}, "answer": "B", "explain": "燃燒下限×燃燒熱≈1050，1050/0.92≈1141，最接近1,200 kcal/mol。", "ref": "【109專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-042", "topic": "煙與熱流", "stem": "三個面積分別為0.20 m²、0.40 m²、0.60 m²之開口相互串聯時，等效流動面積為何？", "opts": {"A": "1.2 m²", "B": "0.27 m²", "C": "0.17 m²", "D": "0.048 m²"}, "answer": "C", "explain": "串聯：1/A²=1/0.2²+1/0.4²+1/0.6²≈34.03，A≈0.17 m²；1.2 m²是並聯相加的結果。", "ref": "【109專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-043", "topic": "防火與特殊現象", "stem": "依用戶用電設備裝置規則及建築技術規則，下列避雷設備敘述何者錯誤？", "opts": {"A": "建築物高度在20公尺以上者應有避雷設備", "B": "為保護建築物或危險物品倉庫遭受雷擊，應裝設避雷設備", "C": "建築物高度在3公尺以上並作危險物品倉庫使用者應有避雷設備", "D": "受雷部採用富蘭克林避雷針者，危險物品倉庫之保護角不得超過60度"}, "answer": "D", "explain": "富蘭克林避雷針保護角：一般建築物不超過60度，危險物品倉庫須更嚴格，不得超過45度。", "ref": "【109專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-044", "topic": "火災", "stem": "某一火災成長至2,000 kW所需時間為400秒，請問該火災屬何種成長性火災？〔Q=(t/k)²，Q：釋熱率（MW）；t：經過時間（sec）；k：火災成長常數（sec/MW^1/2）〕", "opts": {"A": "慢速成長性至中速成長性火災", "B": "中速成長性至快速成長性火災", "C": "快速成長性至極快速成長性火災", "D": "極快速成長性火災"}, "answer": "B", "explain": "2=(400/k)²，k=400/√2≈283；中速k=300、快速k=150，283介於兩者之間，屬中速至快速。", "ref": "【109專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-045", "topic": "滅火", "stem": "下列有關二氧化碳（CO₂）滅火劑之敘述，何者錯誤？", "opts": {"A": "滅火後不留痕跡", "B": "滅火作用較氮氣（N₂）為大", "C": "特別適用於鈉等金屬火災", "D": "氣化時，可以發揮冷卻作用"}, "answer": "C", "explain": "鈉、鉀、鎂等活性金屬可在CO₂中持續燃燒並將其還原，CO₂不可用於金屬火災。（原題金屬名OCR作「鏽」，依題意修為鈉）", "ref": "【109專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-046", "topic": "火災", "stem": "某次閃電的過程中，雲的底部和地面之間，電壓高達1千萬伏特，並在約0.02秒內輸送20庫倫的電量至地面。下列與閃電有關的敘述何者正確？", "opts": {"A": "該次閃電所產生的電功率約為10⁷瓦特", "B": "雲和地面間高電壓的產生與摩擦起電有關", "C": "飛機在空中飛行時不可能遭雷擊，因此不須裝置避雷針", "D": "閃電時的大電流，使空氣產生高熱而快速膨脹，故常伴隨雷聲"}, "answer": "D", "explain": "電流=20/0.02=1000 A，功率=10⁷×1000=10¹⁰ W，A錯；飛機也會遭雷擊，C錯；雷聲來自空氣急熱膨脹，D對。B項雲中電荷分離常被解釋為冰晶碰撞摩擦，敘述有爭議，依書上答案取D。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【109專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-047", "topic": "滅火", "stem": "進入石化工廠，車輛會被要求在排氣管加裝滅焰器（flame arrester）以避免火災爆炸之發生，加裝該措施防制火災爆炸之原理為：", "opts": {"A": "窒息", "B": "冷卻", "C": "抑制連鎖反應", "D": "阻止擴展"}, "answer": "B", "explain": "滅焰器以金屬網或細孔通道大量吸收火焰熱量，使溫度降到無法維持燃燒，屬冷卻原理。", "ref": "【109專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-048", "topic": "熱傳", "stem": "1度電為1,000瓦·小時（1 kWh），試問1度電約等同多少千卡（kcal）？", "opts": {"A": "420", "B": "746", "C": "860", "D": "1,000"}, "answer": "C", "explain": "1 kWh=3.6×10⁶ J，除以4186 J/kcal≈860 kcal；746是1馬力的瓦特數。", "ref": "【109專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-050", "topic": "火災", "stem": "有水之場所的插頭應加裝何種裝置以防止感電發生？", "opts": {"A": "總開關", "B": "延長線", "C": "緊急電源", "D": "漏電斷路器"}, "answer": "D", "explain": "潮濕場所易漏電，漏電斷路器偵測到漏電流即跳脫，可防止感電。", "ref": "【109專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-051", "topic": "火災", "stem": "某一線徑2.0 mm之電線1 km長之電阻值為5.657 Ω，熱阻抗為378。若周遭溫度為20°C，當此10 cm長之電線通過10安培時，其芯線溫度（°C）約為多少？", "opts": {"A": "31", "B": "41", "C": "51", "D": "61"}, "answer": "B", "explain": "10 cm電阻=5.657×0.1/1000≈5.66×10⁻⁴ Ω，發熱I²R=100×5.66×10⁻⁴≈0.0566 W，溫升=0.0566×378≈21.4°C，芯線溫度≈20+21.4≈41°C。", "ref": "【109專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-052", "topic": "滅火", "stem": "下列常見之乾粉滅火藥劑敘述何者正確？", "opts": {"A": "第一種乾粉主要成分為磷酸二氫銨（NH₄H₂PO₄）", "B": "第二種乾粉主要成分為碳酸氫鉀（KHCO₃）", "C": "第三種乾粉主要成分為碳酸氫鈉（NaHCO₃）", "D": "第四種乾粉主要成分為碳酸氫鈉及尿素（NaHCO₃＋(NH₂)₂CO）"}, "answer": "B", "explain": "第一種為碳酸氫鈉、第二種碳酸氫鉀、第三種磷酸二氫銨、第四種為碳酸氫鉀與尿素，A、C對調，D應為鉀鹽。", "ref": "【109專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-053", "topic": "滅火", "stem": "下列的滅火設備，何者屬於窒息法滅火原理？", "opts": {"A": "海龍滅火設備", "B": "室內消防栓", "C": "IG-541", "D": "CEA-410"}, "answer": "C", "explain": "IG-541為惰性氣體，以降低氧濃度窒息滅火；海龍與CEA-410屬鹵化物抑制連鎖反應，室內消防栓以冷卻為主。", "ref": "【109專技士 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-054", "topic": "煙與熱流", "stem": "火場溫度隨燃燒時間而逐漸升高，其空氣亦漸膨脹，空氣由外界流入該起火房間，同時熱煙霧也會從該起火房間流出。若忽略燃料分解過程而產生之質量流率，建築物內部空氣溫度為25°C，起火房間溫度為800°C，流入起火房間之空氣體積流量為1 m³/s，則流出起火房間之熱煙霧體積流量約為若干？", "opts": {"A": "1.6 m³/s", "B": "2.6 m³/s", "C": "3.6 m³/s", "D": "4.6 m³/s"}, "answer": "C", "explain": "質量守恆且定壓下，體積流量∝絕對溫度：1×(1073/298)≈3.6 m³/s。（原書C選項OCR作13.6，依計算修正為3.6）", "ref": "【109專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-055", "topic": "滅火", "stem": "下列海龍替代滅火藥劑，何者之化學組成為五氟乙烷？", "opts": {"A": "HFC-227ea", "B": "HFC-125", "C": "HFC-23", "D": "FE-13"}, "answer": "B", "explain": "HFC-125為五氟乙烷（C₂HF₅）；HFC-227ea為七氟丙烷，HFC-23與FE-13為三氟甲烷。", "ref": "【109專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-056", "topic": "煙與熱流", "stem": "假設建築物外部風速為10 m/s，風壓係數為0.6，空氣密度為1 kg/m³，其對迎風面建築物所產生的風壓約為？", "opts": {"A": "60 Pa", "B": "50 Pa", "C": "40 Pa", "D": "30 Pa"}, "answer": "D", "explain": "風壓P=C·½ρV²=0.6×0.5×1×10²=30 Pa；60 Pa是漏乘1/2。", "ref": "【109專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-057", "topic": "爆炸", "stem": "T.N.T.炸藥化學名稱為三硝基甲苯（Trinitrotoluene，C₇H₅N₃O₆），俗稱黃色炸藥，試問其氧平衡（Oxygen Balance, O.B.）為多少？", "opts": {"A": "-64.0%", "B": "-74.0%", "C": "-84.0%", "D": "-94.0%"}, "answer": "B", "explain": "完全氧化需O原子2×7+5/2=16.5個，分子內有6個，缺10.5個O=168 g；分子量227，O.B.=-168/227≈-74.0%。", "ref": "【109專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-058", "topic": "危險物品", "stem": "化學災害搶救程序HAZMAT之說明，下列何者正確？", "opts": {"A": "H表請求支援", "B": "Z表建立管理系統", "C": "T表善後處理", "D": "M表行動方案"}, "answer": "C", "explain": "HAZMAT：H危害辨識、A行動方案、Z區域管制、M管理系統、A請求支援、T善後處理（終止）。", "ref": "【109專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-059", "topic": "熱傳", "stem": "若一物體的溫度為327°C，輻射率（Emissivity）為0.1，已知史蒂芬－波茲曼常數為5.67×10⁻⁸ W/m²K⁴，則其輻射強度（Emissive Power）約為多少？", "opts": {"A": "0.7 kW/m²", "B": "1.6 kW/m²", "C": "3.0 kW/m²", "D": "3.2 kW/m²"}, "answer": "A", "explain": "E=εσT⁴=0.1×5.67×10⁻⁸×600⁴≈735 W/m²≈0.7 kW/m²。", "ref": "【109專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-060", "topic": "危險物品", "stem": "某研究院之廠區引發爆燃事件之推進劑，其內含過氯酸鹽類，試問其為公共危險物品中第幾類物質？", "opts": {"A": "第一類物質", "B": "第二類物質", "C": "第三類物質", "D": "第六類物質"}, "answer": "A", "explain": "過氯酸鹽類屬第一類氧化性固體；第六類是氧化性液體（如過氯酸本身）。", "ref": "【109專技士 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-061", "topic": "燃燒", "stem": "混合氣體由A、B、C三種氣體組成，混合時組成氣體不進行反應，且燃燒無催化作用，其中A氣體占1/5（燃燒下限4.0%），B氣體占3/5（燃燒下限12.5%），C氣體占1/5（燃燒下限2.0%），則此混合氣體燃燒下限約為多少？", "opts": {"A": "4.8%", "B": "5.1%", "C": "6.5%", "D": "7.3%"}, "answer": "B", "explain": "勒沙特列定律：L=100/(20/4+60/12.5+20/2)=100/19.8≈5.1%。", "ref": "【109專技士 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-062", "topic": "危險物品", "stem": "預防過氧化丁酮之火災爆炸時，下列何種原則正確？", "opts": {"A": "自加速分解溫度大於攝氏50度的B型有機過氧化丁酮在運輸時應控制溫度", "B": "設置適當的泡沫滅火器", "C": "C型有機過氧化丁酮之管制量上限為100公斤", "D": "可使用乾粉滅火器"}, "answer": "C", "explain": "依公共危險物品規定，第五類C型有機過氧化物管制量為100公斤；需控溫運輸的是自加速分解溫度≤50°C者，A錯。", "ref": "【109專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-063", "topic": "煙與熱流", "stem": "若要看清某一物體，該物體與其背景間須有一定之對比度。對比度之計算：C=(B/B₀)-1，有關對比度下列何者正確？", "opts": {"A": "公式中B表示背景亮度，B₀表示物體亮度", "B": "C=-0.02時，被認為能清楚辨別物體之臨界值", "C": "當觀察者位置與物體間之距離越遠，其所感受對比度越大", "D": "火場能見度指的是使用光度計實際測量對比度"}, "answer": "B", "explain": "B為物體亮度、B₀為背景亮度，A顛倒；距離越遠對比度越小；一般以|C|=0.02作為可辨識的臨界對比。", "ref": "【109專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-064", "topic": "防火與特殊現象", "stem": "在古蹟及歷史建築物火災風險評估指標中，有關防火因應措施安全評估項目中，不包括下列何項？", "opts": {"A": "滅火控制", "B": "文化資產文物數量與分布", "C": "火災偵測與通報", "D": "計畫研擬與動態演練"}, "answer": "B", "explain": "文物數量與分布屬「潛在損失（價值）」面向的評估，而非防火因應措施；其餘三項皆是防火對策。", "ref": "【109專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-065", "topic": "煙與熱流", "stem": "有關火羽流的敘述，下列何者錯誤？", "opts": {"A": "火羽流的溫度與速度隨著高度增加而下降", "B": "火羽流在燃料上方形成，周遭冷空氣捲入至火羽流下方，形成空間對流", "C": "不同生成氣體隨火羽流上升累積在天花板形成負壓區，火羽流底部則形成正壓區", "D": "火羽流分為連續火焰區、間歇火焰區與熱煙氣區"}, "answer": "C", "explain": "熱氣累積在上方形成正壓，底部因空氣被捲吸形成負壓，C項正負顛倒。（A、D選項依原意修正OCR文字）", "ref": "【109專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-066", "topic": "防火與特殊現象", "stem": "閃燃發生時間之影響因素中，通風為其中之一項，請問A₀√H₀的通風因子公式中，A₀與H₀各代表何意？", "opts": {"A": "A₀：空間表面積，H₀：天花板至地板高度", "B": "A₀：空間樓地板面積，H₀：天花板至地板高度", "C": "A₀：開口寬度，H₀：開口高度", "D": "A₀：開口面積，H₀：開口高度"}, "answer": "D", "explain": "通風因子A₀√H₀中，A₀為開口面積、H₀為開口高度，決定流入空氣量。", "ref": "【109專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-067", "topic": "滅火", "stem": "下列有關泡沫滅火劑，何者敘述正確？", "opts": {"A": "機械泡沫乃指泡沫水溶液與空氣產生機械混合生成，水成膜泡沫屬於此類", "B": "目前大多數的空氣泡沫，以1%、4%及5%原液比例與水混合而成", "C": "每分鐘供給較低的泡沫體積量時，有助於降低泡沫耗損速度，有助於滅火", "D": "泡沫黏著性高，但比水的導電性較為小"}, "answer": "A", "explain": "水成膜泡沫屬機械（空氣）泡沫；常見原液比例為3%、6%；供給量過低時泡沫被火破壞速度大於生成；泡沫含水仍可導電，不可用於電氣火災。", "ref": "【109專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-068", "topic": "火災", "stem": "森林火災的種類與敘述，下列何者正確？", "opts": {"A": "樹幹火主要燃料為茅草與灌木，為森林大火的主因", "B": "地表火主要由含樹脂之樹木燃燒造成", "C": "樹梢火通常在開放環境中燃燒", "D": "地中火通常由地表火而來，有大量有機可燃物"}, "answer": "C", "explain": "樹梢火（樹冠火）在開放高處藉風蔓延；燃料為茅草灌木的是地表火，樹脂樹木多造成樹幹火。D項敘述與一般教材接近，依書上答案取C。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【109專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-069", "topic": "防火與特殊現象", "stem": "有關防火塗料敘述，下列何者錯誤？", "opts": {"A": "火災時阻止火焰的傳播", "B": "防火形式可分為膨脹型與非膨脹型", "C": "塗覆在物件表面，利用材料的低導熱性與放熱性形成一般保護", "D": "可分為溶劑性與水溶性兩類"}, "answer": "C", "explain": "防火塗料是利用低導熱性與吸熱（如膨脹、分解吸熱）來保護基材，不是放熱。", "ref": "【109專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-070", "topic": "滅火", "stem": "海龍替代滅火藥劑中，下列何者在大氣之滯留時間最久？", "opts": {"A": "FM-200", "B": "Halon1301", "C": "PFC-410", "D": "FE-13"}, "answer": "C", "explain": "PFC-410（全氟丁烷）大氣滯留約2,600年，遠長於FE-13約270年、Halon1301約65年、FM-200約30多年。", "ref": "【109專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-071", "topic": "火災", "stem": "建築物火災在閃燃發生後之全盛期火災的特性，不包括下列何者？", "opts": {"A": "開口部噴出火焰向上層延燒", "B": "此時的火災發展取決於開口淨通風面積與數量", "C": "此時期常見溫度一般在攝氏800～950度", "D": "出現深層火勢（Deep-seated Fire）與悶燒火災"}, "answer": "D", "explain": "深層火勢與悶燒是衰退期的特徵；全盛期為通風控制、高溫並由開口噴出火焰。", "ref": "【109專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-072", "topic": "滅火", "stem": "已知天花板噴流溫度135°C，天花板噴流速度1.8 m/s，環境初始溫度20°C，感知撒水頭作動溫度72°C，反應時間指數60（m^1/2·s^1/2），感知撒水頭作動時間為下列何者？（提示：ln115=4.74，ln63=4.14）", "opts": {"A": "30秒", "B": "35秒", "C": "40秒", "D": "45秒"}, "answer": "A", "explain": "t=(RTI/√u)·ln[(Tg-Ta)/(Tg-Td)]=(60/√1.8)×(4.74-4.14)≈44.7×0.6≈27秒，最接近30秒。（原書RTI數值OCR作「6」，依提示與答案應為60）", "ref": "【109專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-073", "topic": "燃燒", "stem": "乙醇之燃燒化學反應式為下列何者？", "opts": {"A": "C₃H₆＋9/2 O₂→3CO₂＋3H₂O", "B": "CH₃OH＋3/2 O₂→CO₂＋2H₂O", "C": "C₂H₅OH＋3O₂→2CO₂＋3H₂O", "D": "C₂H₅OC₂H₅＋6O₂→4CO₂＋5H₂O"}, "answer": "C", "explain": "乙醇為C₂H₅OH，完全燃燒需3 mol O₂生成2CO₂與3H₂O；B是甲醇，D是乙醚，A是丙烯。", "ref": "【109專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-074", "topic": "爆炸", "stem": "BLEVE的發生，下列敘述何者錯誤？", "opts": {"A": "BLEVE指的是沸騰液體膨脹蒸氣爆炸", "B": "BLEVE發生於單獨存在的蒸氣", "C": "BLEVE發生時可能因為容器金屬疲勞所引起", "D": "BLEVE發生時容器變色如櫻桃色"}, "answer": "B", "explain": "BLEVE需有容器內的加壓液體，容器破裂後液體急速沸騰汽化，不會發生在只有蒸氣的情況。", "ref": "【109專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-075", "topic": "危險物品", "stem": "有關易燃性液體的敘述，下列何者正確？", "opts": {"A": "蒸氣比重小於1，滯留低窪區有著火危險", "B": "閃火點低，易著火爆炸", "C": "不易累積靜電", "D": "液體比重大，不易浮於水面"}, "answer": "B", "explain": "易燃液體閃火點低易引燃；多數蒸氣比重大於1才會滯留低處，電導度低易累積靜電，液體比重多小於1會浮於水面。", "ref": "【109專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-076", "topic": "滅火", "stem": "房間的體積為V=6 m×5 m×3 m，其中O₂占0.21V，請問至少加入多少公升（L）的CO₂讓燃燒作用無法持續？", "opts": {"A": "36 L", "B": "40 L", "C": "36,000 L", "D": "48,000 L"}, "answer": "C", "explain": "V=90 m³，含O₂ 18.9 m³；以氧濃度降至15%為燃燒界限：18.9/(90+X)=0.15，X=36 m³=36,000 L。36 L是忘記換算單位。", "ref": "【109專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-077", "topic": "滅火", "stem": "D類火災可使用的滅火劑，何者適合？", "opts": {"A": "二氧化碳滅火劑", "B": "惰性氣體滅火劑", "C": "鹵化烷滅火劑", "D": "TEC滅火劑"}, "answer": "D", "explain": "D類為金屬火災，TEC（三元共晶氯化物）乾粉可覆蓋熔融金屬隔絕空氣；CO₂、鹵化烷會與活性金屬反應。", "ref": "【109專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-078", "topic": "火災", "stem": "在橡膠中混入碳黑所製成的產品可防止人體帶靜電，其防止靜電產生的方法為？", "opts": {"A": "減少摩擦", "B": "使用帶電序列相近的物質", "C": "使用除電劑", "D": "使用導電性材料"}, "answer": "D", "explain": "碳黑使橡膠具導電性，電荷可經導電材料洩放，屬使用導電性材料。", "ref": "【109專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-079", "topic": "火災", "stem": "帶電物體或其附近之接地體，有突出部分或刃狀部分時，在該等尖端近旁，所出現之微弱發光放電，此現象稱為？", "opts": {"A": "電暈放電", "B": "條狀放電", "C": "火花放電", "D": "沿面放電"}, "answer": "A", "explain": "尖端附近電場集中產生的微弱發光放電為電暈放電；火花放電是導體間瞬間強烈放電。", "ref": "【109專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-080", "topic": "燃燒", "stem": "有關預混合火焰特性，下列敘述何者錯誤？", "opts": {"A": "不穩定燃燒", "B": "燃燒速率相對慢", "C": "偏藍色火焰", "D": "較少不完全燃燒"}, "answer": "B", "explain": "預混合火焰燃料與空氣事先混合，燃燒速率快、呈藍色、較完全；燃燒速率慢是擴散火焰特性。", "ref": "【109專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-001", "topic": "燃燒", "stem": "下列物質各取1莫耳進行完全燃燒，何者所需的理論空氣量（kg）最少？", "opts": {"A": "乙醇（CH₃CH₂OH）", "B": "乙烯（C₂H₄）", "C": "乙醛（CH₃CHO）", "D": "二甲醚（CH₃OCH₃）"}, "answer": "C", "explain": "理論需氧莫耳數＝C＋H/4－O/2：乙醇、乙烯、二甲醚皆為3 mol，乙醛為2＋1－0.5＝2.5 mol，所需氧最少，理論空氣量也最少。", "ref": "【110專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-002", "topic": "火災", "stem": "依據建築物火災t²成長理論，當釋熱率（Q）達到4MW時，需300秒的時間，表示火災成長之速度為下列何者？", "opts": {"A": "慢速成長", "B": "中速成長", "C": "快速成長", "D": "極快速成長"}, "answer": "C", "explain": "α＝Q/t²＝4000/300²≈0.0444 kW/s²，等同1MW需150秒，屬快速成長（慢速600秒、中速300秒、極快速75秒達1MW）。", "ref": "【110專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-003", "topic": "火災", "stem": "依據建築物火災的特性，當進入「穩態燃燒」階段時，釋熱率（Q）與時間（t）的關係為何？", "opts": {"A": "與時間一次方成正比", "B": "與時間一次方成反比", "C": "與時間二次方成正比", "D": "與時間無關"}, "answer": "D", "explain": "穩態燃燒時釋熱率維持大致定值，不隨時間變化；與t²成正比的是成長期。", "ref": "【110專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-004", "topic": "熱傳", "stem": "在氣溫20°C無風的情況下，一般木造建築物形成危險界限溫度的輻射熱通量超過多少kcal/m²·h即有延燒之危險？", "opts": {"A": "2000", "B": "4000", "C": "4500", "D": "7000"}, "answer": "B", "explain": "依木造建築延燒研究，受熱面輻射熱通量約超過4000 kcal/m²·h即達危險界限，可能引燃木材而延燒。", "ref": "【110專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-005", "topic": "燃燒", "stem": "已知甲烷、乙烯、乙炔的最小發火能量分別為a、b、c，則a、b、c大小關係為：", "opts": {"A": "a＞b＞c", "B": "c＞b＞a", "C": "c＞a＞b", "D": "a＝b＝c"}, "answer": "A", "explain": "甲烷約0.28 mJ、乙烯約0.07 mJ、乙炔約0.02 mJ，不飽和程度愈高愈容易點燃，故a＞b＞c。", "ref": "【110專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-006", "topic": "火災", "stem": "阿里山發生森林火災，已知火災當天的相對濕度為60.0%，前一天相對濕度為50.0%，再前一天相對濕度為40.0%，試求火災當天的實效濕度？", "opts": {"A": "31.3%", "B": "34.4%", "C": "40.0%", "D": "47.5%"}, "answer": "D", "explain": "書上答案採係數r＝0.5：He＝(1－r)(H₀＋rH₁＋r²H₂)＝0.5×(60＋25＋10)＝47.5%。但日本常用r＝0.7，算得0.3×(60＋35＋19.6)≈34.4%（即選項B），題目未給r，答案具爭議。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【110專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-007", "topic": "燃燒", "stem": "己烷在閃火點時的飽和蒸氣壓為9.12mmHg，根據Burgess-Wheeler定理其燃燒熱約為多少kcal/mol？", "opts": {"A": "682", "B": "782", "C": "882", "D": "982"}, "answer": "C", "explain": "閃火點時蒸氣濃度約等於燃燒下限：9.12/760≈1.2%。Burgess-Wheeler：L×Q≈1059，Q≈1059/1.2≈882 kcal/mol。", "ref": "【110專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-008", "topic": "危險物品", "stem": "根據美國防火協會（NFPA）危險物品標示規定，將危險類別記載於菱形方塊上，其中「有害健康毒性」以何種顏色表示？", "opts": {"A": "黃色", "B": "藍色", "C": "白色", "D": "紅色"}, "answer": "B", "explain": "NFPA 704菱形標示：藍色＝健康危害、紅色＝易燃性、黃色＝反應性、白色＝特殊危害。", "ref": "【110專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-009", "topic": "危險物品", "stem": "碳化鈣（CaC₂，俗稱電石）常用於水果的催熟，屬於公共危險物品，遇水會起激烈反應產生下列何種可燃性氣體？", "opts": {"A": "氫氣", "B": "乙烷", "C": "乙烯", "D": "乙炔"}, "answer": "D", "explain": "CaC₂＋2H₂O→C₂H₂＋Ca(OH)₂，產生的是乙炔；乙烯雖是催熟激素，但並非電石遇水的產物。", "ref": "【110專技士 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-010", "topic": "危險物品", "stem": "甲基乙基酮過氧化物（MEKPO）常用於聚合物的生產，加熱至100°C時會發生爆炸，此化合物屬於那一類公共危險物品？", "opts": {"A": "第三類", "B": "第四類", "C": "第五類", "D": "第六類"}, "answer": "C", "explain": "MEKPO為有機過氧化物，屬第五類（自反應物質及有機過氧化物）；第六類是氧化性液體，第三類為自燃及禁水性物質。", "ref": "【110專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-011", "topic": "熱傳", "stem": "輻射熱是造成木造建築物延燒原因之一，下列何者正確？", "opts": {"A": "輻射量與火焰面積成正比、與輻射時間成正比", "B": "輻射量與火焰面積成正比、與輻射時間成反比", "C": "輻射量與火焰面積成反比、與輻射時間成正比", "D": "輻射量與火焰面積成反比、與輻射時間成反比"}, "answer": "A", "explain": "火焰面積愈大、照射時間愈長，受熱面累積的輻射熱量愈多，兩者皆成正比。", "ref": "【110專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-012", "topic": "防火與特殊現象", "stem": "根據NFPA 265對閃燃現象（flashover）之定義，下列敘述何者錯誤？", "opts": {"A": "上層煙氣之溫度達500～600°C", "B": "到達地面之輻射熱通量達20kW/m²", "C": "火焰總熱釋放率最少達到2MW", "D": "火焰到達開口"}, "answer": "C", "explain": "NFPA 265判定閃燃的熱釋放率門檻為1MW，而非2MW；其餘上層煙溫、地面20kW/m²、火焰竄出開口皆為判定條件。", "ref": "【110專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-013", "topic": "火災", "stem": "有一開口面積為10.0m²，開口高度為1.44m之居室，當其發生火災而形成通風控制燃燒時，根據P.H.Thomas之研究結果，則燃燒速度為多少kg/min？", "opts": {"A": "R＝25.0～27.3", "B": "R＝39.6～43.2", "C": "R＝66.0～72.0", "D": "R＝79.2～86.4"}, "answer": "C", "explain": "R＝(5.5～6.0)A√H＝(5.5～6.0)×10×1.2＝66.0～72.0 kg/min。", "ref": "【110專技士 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-014", "topic": "危險物品", "stem": "自然發火性物質中的原棉，主要是因為下列何種熱之蓄積而發火？", "opts": {"A": "分解熱", "B": "氧化熱", "C": "吸著熱", "D": "發酵熱"}, "answer": "B", "explain": "原棉、乾性油、石炭等屬氧化熱蓄積；分解熱如硝化棉，吸著熱如活性碳，發酵熱如稻草、牧草。", "ref": "【110專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-015", "topic": "危險物品", "stem": "下列有關液化天然氣（LNG）與液化石油氣（LPG）之比較，何者正確？", "opts": {"A": "液化天然氣燃燒產生的燃燒熱小於液化石油氣", "B": "液化天然氣燃燒所需的理論空氣量大於液化石油氣", "C": "液化天然氣的燃燒下限小於液化石油氣", "D": "液化天然氣的比重較空氣重，液化石油氣的比重較空氣輕"}, "answer": "A", "explain": "LNG主成分甲烷，分子小，每莫耳燃燒熱與理論空氣量均小於丙烷、丁烷為主的LPG；甲烷下限約5%高於LPG約2%，且甲烷比空氣輕、LPG比空氣重，D顛倒。", "ref": "【110專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-016", "topic": "滅火", "stem": "市面上販售的ABC乾粉滅火器內充填的乾粉滅火藥劑主要成分為", "opts": {"A": "碳酸氫鉀（KHCO₃）及尿素（CH₄N₂O）化合物", "B": "碳酸氫鈉（NaHCO₃）", "C": "碳酸氫鉀（KHCO₃）", "D": "磷酸二氫銨（NH₄H₂PO₄）"}, "answer": "D", "explain": "第三種（ABC）乾粉為磷酸二氫銨，可覆蓋A類固體表面；碳酸氫鈉為第一種、碳酸氫鉀為第二種、碳酸氫鉀加尿素為第四種乾粉。", "ref": "【110專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-017", "topic": "滅火", "stem": "下列惰性氣體類海龍替代滅火藥劑中，何者的比重小於1？", "opts": {"A": "IG-01", "B": "IG-100", "C": "IG-541", "D": "IG-55"}, "answer": "B", "explain": "IG-100為純氮氣，比重約0.97小於空氣；IG-01為氬氣（約1.38），IG-541與IG-55含氬或CO₂，比重皆大於1。", "ref": "【110專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-018", "topic": "危險物品", "stem": "根據「危害物質災害現場搶救標準作業程序」之規定，其首要工作為何？", "opts": {"A": "擬定行動方案", "B": "區域管制", "C": "建立管理系統", "D": "危害辨識"}, "answer": "D", "explain": "危害物質事故須先辨識是何種物質與其危害，才能據以劃定管制區、擬定行動方案。", "ref": "【110專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-019", "topic": "危險物品", "stem": "當發生危害物質災害時，為降低對民眾及搶救人員的危害，應迅速劃定管制區域，下列區域何者一般以黃色標示？", "opts": {"A": "支援區", "B": "影響區", "C": "污染區", "D": "禁區"}, "answer": "B", "explain": "管制區由內而外為禁區（熱區，紅）、影響區（暖區，黃，進行除污）、支援區（冷區，綠）。", "ref": "【110專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-020", "topic": "煙與熱流", "stem": "某室內場所的煙層厚度為1公尺，若此時光學密度為0.173，則該場域中避難反光指標之能見度為多少公尺？", "opts": {"A": "7.5", "B": "10", "C": "15", "D": "20"}, "answer": "A", "explain": "減光係數Cs＝2.303×D/L＝2.303×0.173/1≈0.398 m⁻¹；反光型標示K≈3，V＝3/0.398≈7.5 m。", "ref": "【110專技士 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-021", "topic": "熱傳", "stem": "下列物質在常溫時，何者的熱傳導係數（W/m·K）較低？", "opts": {"A": "玻璃", "B": "水", "C": "木材", "D": "空氣"}, "answer": "D", "explain": "空氣約0.026 W/m·K，遠低於木材（約0.1～0.2）、水（約0.6）與玻璃（約1）。", "ref": "【110專技士 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-022", "topic": "熱傳", "stem": "火災中所產生的輻射熱量與下列何者成正比？", "opts": {"A": "輻射物體攝氏溫度的二次方", "B": "外界溫差的四次方", "C": "輻射物體攝氏溫度的四次方", "D": "輻射物體絕對溫度的四次方"}, "answer": "D", "explain": "依史蒂芬－波茲曼定律q＝εσT⁴，T為絕對溫度；用攝氏溫度或溫差的四次方都不正確。", "ref": "【110專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-023", "topic": "燃燒", "stem": "請問2公斤的氫氣（H₂）完全燃燒，所需要的理論空氣量為多少公斤？（空氣中氧重量比以23%計）", "opts": {"A": "139.2", "B": "104.4", "C": "69.6", "D": "34.8"}, "answer": "C", "explain": "2 kg H₂＝1 kmol，需O₂ 0.5 kmol＝16 kg；理論空氣量＝16/0.23≈69.6 kg。", "ref": "【110專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-024", "topic": "燃燒", "stem": "在充足的能量下，下列何種濃度（vol%）的氫氣（H₂）為燃燒界限範圍內？", "opts": {"A": "100%", "B": "80%", "C": "50%", "D": "2%"}, "answer": "C", "explain": "氫氣燃燒範圍約4～75 vol%，僅50%落在其中；2%低於下限，80%、100%高於上限。", "ref": "【110專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-025", "topic": "燃燒", "stem": "請依據可燃性氣體完全燃燒時的化學理論濃度，計算丙烷的燃燒下限？", "opts": {"A": "1.34%", "B": "1.64%", "C": "1.84%", "D": "2.21%"}, "answer": "D", "explain": "C₃H₈需5 mol O₂，Cst＝100/(1＋4.773×5)≈4.02%；燃燒下限≈0.55×Cst≈2.21%。", "ref": "【110專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-026", "topic": "燃燒", "stem": "易燃性氣體受到壓縮後溫度會有升高的狀況發生，可能會發火導致火災的發生，此現象為何？", "opts": {"A": "高溫壓縮", "B": "等溫壓縮", "C": "斷熱壓縮", "D": "等熵壓縮"}, "answer": "C", "explain": "氣體被快速壓縮而來不及散熱（斷熱壓縮），溫度上升可達發火溫度；等溫壓縮溫度不變。", "ref": "【110專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-027", "topic": "火災", "stem": "某建築物的插座電壓為110伏特，在其延長線上的插座同時插上800瓦的電磁爐、110瓦的電風扇及1100瓦的電熱器，請問該延長線之額定電流至少需多少安培？", "opts": {"A": "209", "B": "110", "C": "19", "D": "9"}, "answer": "C", "explain": "總功率2010 W，I＝P/V＝2010/110≈18.3 A，額定電流至少需19 A。原OCR「8瓦」依答案回推應為800瓦。", "ref": "【110專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-028", "topic": "火災", "stem": "下列有關電器用品「焦耳熱」之敘述，何者錯誤？", "opts": {"A": "電流通過有電阻的導體所產生的熱", "B": "焦耳熱與電流成正比", "C": "電流增加造成的焦耳熱大於導體表面逸散之熱時，易生危險", "D": "焦耳熱與電阻及時間成正比"}, "answer": "B", "explain": "焦耳熱H＝I²Rt，與電流的平方成正比而非一次方；與電阻、時間則為一次方正比。", "ref": "【110專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-029", "topic": "危險物品", "stem": "工廠使用之乙炔（C₂H₂），為防止爆炸引起火災，常利用裝有某化學物質與多孔性物質充填物之鋼瓶加壓保存，請問該化學物質為何？", "opts": {"A": "氮氣（N₂）", "B": "氦氣（He）", "C": "丙酮（CH₃COCH₃）", "D": "二氧化碳（CO₂）"}, "answer": "C", "explain": "乙炔加壓易分解爆炸，故溶於多孔性物質中的丙酮（溶解乙炔）以降低分解爆炸危險。", "ref": "【110專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-030", "topic": "煙與熱流", "stem": "某建築物火場產生大量煙霧，正向煙囪效應在中性帶以上10公尺處的壓力差為12Pa，若建築物內、外的溫度差不變，請問中性帶以上20公尺處的壓力差為何？", "opts": {"A": "20Pa", "B": "24Pa", "C": "28Pa", "D": "32Pa"}, "answer": "B", "explain": "煙囪效應壓力差ΔP與距中性帶高度成正比，高度加倍則ΔP＝12×2＝24 Pa。", "ref": "【110專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-031", "topic": "爆炸", "stem": "有關影響粉塵爆炸的因素，下列何者錯誤？", "opts": {"A": "粉塵粒子的比表面積愈大，爆炸可能性愈高", "B": "粉塵粒徑愈小，其最小發火能量變大", "C": "空氣中含水量增加，粉塵爆炸危險性下降", "D": "粉塵中灰分增加，爆炸危險性下降"}, "answer": "B", "explain": "粒徑愈小比表面積愈大，最小發火能量反而愈小、愈易爆炸，B說反了。", "ref": "【110專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-032", "topic": "爆炸", "stem": "有關爆炸性物質之特性，下列何者正確？", "opts": {"A": "物質所需之最大起爆能，即為該物質之敏感度", "B": "物質之密度愈大，其敏感度愈小", "C": "物質的化學結構分子中之硝基（－NO₂）愈多，敏感度愈低", "D": "起爆溫度愈低者，其敏感度愈低"}, "answer": "B", "explain": "密度大時分子間空隙少、較不易起爆，敏感度較小。敏感度以最小（非最大）起爆能衡量；硝基愈多、起爆溫度愈低都表示愈敏感。", "ref": "【110專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-033", "topic": "爆炸", "stem": "當一小爆炸發生時，其壓力波將全廠之粉塵揚起，再被隨後而至之燃燒引爆所引起之全廠性爆炸，此現象為何？", "opts": {"A": "閃燃", "B": "複燃", "C": "塵爆", "D": "二次塵爆"}, "answer": "D", "explain": "初次爆炸揚起堆積粉塵形成粉塵雲，再被引燃造成更大範圍爆炸，即二次粉塵爆炸。", "ref": "【110專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-034", "topic": "爆炸", "stem": "液體變化為氣體之物理現象中，若變化速度至為急速時，因能量於極短的時間內大量放出，即形成爆炸現象，此現象之名稱為何？", "opts": {"A": "蒸氣爆炸", "B": "分解爆炸", "C": "高壓氣體爆炸", "D": "粉塵爆炸"}, "answer": "A", "explain": "液體急速相變為蒸氣造成體積暴增屬物理性的蒸氣爆炸；分解爆炸與粉塵爆炸皆為化學性。", "ref": "【110專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-035", "topic": "滅火", "stem": "面對廚房油鍋起火燃燒，下列何項應對動作的風險最大？", "opts": {"A": "打電話通知消防隊", "B": "以濕布覆蓋", "C": "關閉瓦斯開關", "D": "以水澆灌降溫"}, "answer": "D", "explain": "水潑入高溫油中會瞬間汽化並將燃油噴濺，使火勢擴大；濕布覆蓋可窒息，關瓦斯可斷燃料。", "ref": "【110專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-036", "topic": "防火與特殊現象", "stem": "為防止靜電發生放電時引火造成火災，請問下列有關靜電災害之防止對策何者錯誤？", "opts": {"A": "使用導電性材料製造之零件或器具", "B": "使用除電劑", "C": "改用塑膠管件，防止導電", "D": "接地"}, "answer": "C", "explain": "塑膠為絕緣體，會使電荷無法洩放而蓄積，反而增加靜電危險；防制原則是讓電荷導走。", "ref": "【110專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-037", "topic": "防火與特殊現象", "stem": "有關電氣火災防範對策中，電器設備之正確使用非常重要，在潮濕場所使用電器時，插頭應加裝何種裝置以防止感電發生？", "opts": {"A": "延長線", "B": "開關", "C": "漏電斷路器", "D": "緊急電源"}, "answer": "C", "explain": "漏電斷路器偵測到漏電流即跳脫斷電，可防止潮濕場所感電；其餘選項沒有漏電保護功能。", "ref": "【110專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-038", "topic": "滅火", "stem": "常見泡沫滅火藥劑含有界面活性劑成分，請問下列何者不是泡沫滅火藥劑滅火時界面活性劑的主要作用？", "opts": {"A": "起泡作用", "B": "乳化作用", "C": "減低表面張力作用", "D": "降低溫度作用"}, "answer": "D", "explain": "界面活性劑負責起泡、乳化與降低表面張力；冷卻主要來自泡沫中的水分，不是界面活性劑本身的作用。", "ref": "【110專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-039", "topic": "煙與熱流", "stem": "某建築物內部的空氣溫度為27°C，發生火災的房間溫度為627°C，流入該起火房間的空氣體積流量為4m³/s，若忽略燃燒熱分解過程中產生的質量流率，請計算流出起火房間的煙霧體積流量約為多少？", "opts": {"A": "4 m³/s", "B": "8 m³/s", "C": "12 m³/s", "D": "16 m³/s"}, "answer": "C", "explain": "質量守恆且定壓下體積與絕對溫度成正比：4×(900/300)＝12 m³/s。", "ref": "【110專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-040", "topic": "煙與熱流", "stem": "常見吸入火場中的煙霧而中毒者，其最主要之原因即為吸入太多一氧化碳（CO），一氧化碳往往是火場的致命殺手，其濃度達多少時可以讓人在1分鐘內死亡？", "opts": {"A": "1%", "B": "0.5%", "C": "0.2%", "D": "0.07%"}, "answer": "A", "explain": "CO濃度約1%（10000 ppm）時可在1～3分鐘內致死；0.2%約需數十分鐘，0.07%則需數小時才出現嚴重症狀。", "ref": "【110專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-041", "topic": "滅火", "stem": "近年來已有水滅火器經型式認可，下列敘述何者正確？", "opts": {"A": "水滅火器就是強化液滅火器", "B": "水滅火器噴射距離大於6公尺以上", "C": "水滅火器不可適用B類火災", "D": "水滅火器僅為添加濕潤劑之滅火器"}, "answer": "B", "explain": "依書上答案，水滅火器噴射距離達6公尺以上。水滅火器與強化液滅火器為不同類別，其藥劑可含濕潤劑等添加物且部分可適用B類火災，故A、C、D錯。此題涉及認可基準細節，信心較低。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【111專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-042", "topic": "爆炸", "stem": "有關爆燃與爆轟，下列敘述何者錯誤？", "opts": {"A": "焰面傳播速度爆燃＞爆轟", "B": "二者有可能皆屬可燃性氣體的混合燃燒", "C": "焰面（燃燒波）與衝擊波合一，稱為爆轟波", "D": "爆轟波通常伴隨機械的破壞作用"}, "answer": "A", "explain": "爆燃焰面傳播低於音速，爆轟則超過音速，應為爆轟＞爆燃，A說反了。", "ref": "【111專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-043", "topic": "火災", "stem": "實效濕度低於多少時，日本即發布火災警報？", "opts": {"A": "90%", "B": "80%", "C": "70%", "D": "60%"}, "answer": "D", "explain": "日本以實效濕度60%以下（搭配最小濕度與風速條件）作為發布火災警報的判斷基準。", "ref": "【111專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-044", "topic": "危險物品", "stem": "日本京都動畫製作所及大阪精神科診所火災起因為縱火，請問汽油在空氣中的燃燒下限為何？", "opts": {"A": "1.4%", "B": "7.6%", "C": "1.3%", "D": "2.6%"}, "answer": "A", "explain": "汽油燃燒範圍約1.4～7.6%，下限為1.4%；7.6%是上限。題幹背景字句OCR殘缺，已依事件補正。", "ref": "【111專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-045", "topic": "防火與特殊現象", "stem": "在苯中置入油酸鎂等金屬皂，係採取下列何種防止靜電發生的方法？", "opts": {"A": "使用除電劑", "B": "使用導電性材料", "C": "藉中和以防止電荷蓄積", "D": "增加周圍空氣相對濕度"}, "answer": "A", "explain": "在絕緣性液體中添加金屬皂等抗靜電添加劑以提高導電度，屬於使用除電劑的方法。", "ref": "【111專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-046", "topic": "防火與特殊現象", "stem": "火災成長歷程中，下列何者非閃燃之現象？", "opts": {"A": "火場狀況為缺氧燃燒，因某種特殊的原因導致新鮮的空氣流入之現象", "B": "閃燃係從火災成長期移向旺盛期之短暫現象", "C": "閃燃時地板的熱通量達20kW/m²", "D": "上層煙氣溫度達到500～600°C"}, "answer": "A", "explain": "缺氧燃燒後因新鮮空氣突然流入而爆燃，描述的是複燃（backdraft），不是閃燃。", "ref": "【111專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-047", "topic": "火災", "stem": "油類火災為何種火災？", "opts": {"A": "A類火災", "B": "B類火災", "C": "C類火災", "D": "D類（金屬）火災"}, "answer": "B", "explain": "可燃性液體及油脂火災屬B類；A類為一般固體，C類為電氣，D類為金屬火災。", "ref": "【111專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-048", "topic": "燃燒", "stem": "空氣中氧之重量占整體之23%，故1公斤碳完全燃燒需要多少空氣？", "opts": {"A": "11.6kg", "B": "32kg", "C": "23kg", "D": "12kg"}, "answer": "A", "explain": "C＋O₂→CO₂，1 kg碳需氧32/12≈2.67 kg，空氣量＝2.67/0.23≈11.6 kg。", "ref": "【111專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-049", "topic": "爆炸", "stem": "有關粉塵爆炸的敘述，下列何者錯誤？", "opts": {"A": "粉塵爆炸之燃燒反應在粒子表面進行，粒子直徑愈大愈易發火", "B": "粉塵與可燃性氣體在空氣中共存時，爆炸下限將下降", "C": "粉塵發火之最低溫度一般為300至700°C", "D": "粉塵粒子愈小，其最小發火能量亦變小"}, "answer": "A", "explain": "燃燒在粒子表面進行，粒徑愈小比表面積愈大才愈易發火，A說反了；混有可燃氣體（混成粉塵）會使爆炸下限降低。", "ref": "【111專技士 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-050", "topic": "煙與熱流", "stem": "火場當中煙毒危害，下列敘述何者錯誤？", "opts": {"A": "火場燃燒物毒性最大是CO₂", "B": "火場生成物HCN會造成細胞呼吸停止", "C": "吸入煙而危害生命主要原因為一氧化碳", "D": "HCHO為強烈刺激性無色氣體，主要為刺激黏膜及麻醉中樞神經"}, "answer": "A", "explain": "CO₂毒性相對低，主要以高濃度造成窒息；毒性強的是HCN、CO、光氣等。", "ref": "【111專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-051", "topic": "防火與特殊現象", "stem": "下列何者非為影響閃燃的因素？", "opts": {"A": "空氣密度", "B": "開口位置", "C": "開口面積", "D": "可燃物表面積"}, "answer": "A", "explain": "閃燃發生時間受開口大小與位置、內裝材料及可燃物表面積等影響，空氣密度不是主要影響因素。", "ref": "【111專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-052", "topic": "熱傳", "stem": "密閉空間燃燒中天花板會向地面放射大量輻射熱促進地面可燃物燃燒速度，此現象為何？", "opts": {"A": "熱傳導回饋", "B": "熱輻射回饋", "C": "熱對流回饋", "D": "閃燃效應"}, "answer": "B", "explain": "高溫煙層與天花板以輻射方式將熱回饋至地面可燃物，稱熱輻射回饋，是導致閃燃的前因。", "ref": "【111專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-053", "topic": "火災", "stem": "高層建築物火災特性下列何者錯誤？", "opts": {"A": "多為密閉建築，內部燃燒熱易蓄積", "B": "內部垂直管道及樓梯若熱煙流入易形成煙囪效應", "C": "內部有電梯故逃生迅速", "D": "受限雲梯車高度，搶救策略需賴緊急用昇降機"}, "answer": "C", "explain": "火災時一般電梯不可用於避難，高層建築避難路徑長、逃生困難，C錯。", "ref": "【111專技士 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-054", "topic": "防火與特殊現象", "stem": "普通木造建築物旁欲蓋9公尺高之建築物，其延燒係數為3級（係數為0.15），其防火間隔應保持多少公尺？", "opts": {"A": "6.32", "B": "7.74", "C": "3.21", "D": "8.56"}, "answer": "B", "explain": "依H＝p·D²，D＝√(H/p)＝√(9/0.15)≈7.74 m。", "ref": "【111專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-055", "topic": "燃燒", "stem": "下列發火源在理化現象歸類上，何者與其他不同類別？", "opts": {"A": "香煙", "B": "火星", "C": "靜電", "D": "線香"}, "answer": "C", "explain": "香煙、火星、線香皆屬高溫物體（燃燒或熾熱顆粒）類發火源，靜電屬電氣能量類。", "ref": "【111專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-056", "topic": "防火與特殊現象", "stem": "比較積污導電與金原現象之差異，下列何者錯誤？", "opts": {"A": "因電解質等物質附著而通電者，為積污導電現象", "B": "積污導電又稱電痕", "C": "金原現象又稱為沿面洩漏放電", "D": "金原現象為有機絕緣體石墨化"}, "answer": "C", "explain": "金原現象是有機絕緣體受電火花作用而碳化（石墨化）導電；沿面洩漏放電描述的是積污導電（電痕）類現象，C錯。", "ref": "【111專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-057", "topic": "防火與特殊現象", "stem": "有關閃燃（Flashover）與複燃（Backdraft）的敘述，何者錯誤？", "opts": {"A": "閃燃是一種爆炸現象，釋放的能量常造成門窗破壞；複燃是火勢快速發展的現象", "B": "依火災發展時期，閃燃常發生在成長期；複燃常發生在成長期或衰退期", "C": "閃燃發生的原因為「熱能」；複燃發生的原因為「助燃物」", "D": "火場中，閃燃有可能比複燃早發生"}, "answer": "A", "explain": "A把兩者對調了：複燃才具爆炸性、會破壞門窗，閃燃是火勢急速擴大到全室的現象。", "ref": "【111專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-058", "topic": "火災", "stem": "下列何者非電線走火之原因？", "opts": {"A": "過負載", "B": "短路", "C": "接觸不良", "D": "接地"}, "answer": "D", "explain": "接地是防止感電與靜電的安全措施，不是走火原因；過負載、短路、接觸不良皆會造成局部過熱。", "ref": "【111專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-059", "topic": "煙與熱流", "stem": "有關火羽流及天花板噴射流的敘述，下列何者錯誤？", "opts": {"A": "間歇火焰區上方溫度維持不變", "B": "火羽流通常由火焰及熱流組成", "C": "火羽流上升遇天花板沿天花板水平移動，形成天花板噴射流", "D": "天花板噴射流對地面放射輻射熱，促進可燃物燃燒速度"}, "answer": "A", "explain": "溫度大致維持定值的是連續火焰區；間歇火焰區以上的浮力羽流區溫度隨高度遞減，A錯。", "ref": "【111專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-061", "topic": "熱傳", "stem": "下列有關熱量傳遞的敘述，何者正確？", "opts": {"A": "無論熱傳導、熱對流或熱輻射，熱量由高處往低處傳遞過程皆需有媒介物質", "B": "若距離輻射物體2公尺時，輻射熱量為q，則距離輻射物體縮短為1公尺時，輻射熱量為4q", "C": "通風口所處位置的高低不會影響對流速度", "D": "在火災發展過程中，傳導、對流及輻射不會同時存在"}, "answer": "B", "explain": "輻射熱與距離平方成反比，距離減半熱量變4倍。輻射不需介質；通風口高低會影響對流；火災中三種熱傳常同時存在。", "ref": "【111專技士 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-062", "topic": "滅火", "stem": "連棟式木造建築物引發火災，消防隊射水同時拆除未受火勢波及房屋，請問其採取的滅火方法係下列何者？", "opts": {"A": "窒息法＋冷卻法", "B": "冷卻法＋移除法", "C": "冷卻法＋抑制反應", "D": "抑制反應＋窒息法"}, "answer": "B", "explain": "射水降溫屬冷卻法，拆除鄰房以斷絕可燃物屬移除法。", "ref": "【111專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-063", "topic": "防火與特殊現象", "stem": "建築物起火後，對於防止火焰由下層窗戶往上層延燒，下列敘述何者錯誤？", "opts": {"A": "窗戶「寬度/高度」之值愈小，火焰愈容易向上層延燒", "B": "增加窗間牆（側壁）高度", "C": "減少室內可燃物量", "D": "設置突出屋簷"}, "answer": "A", "explain": "寬度/高度比值大（寬扁窗）時噴出火焰較貼附外牆而易向上延燒；比值小（瘦高窗）火焰較會向外噴離，A說反了。", "ref": "【111專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-064", "topic": "煙與熱流", "stem": "下列何者非影響建築物中煙霧流動與蔓延的主要因素？", "opts": {"A": "煙囪效應", "B": "浮力作用", "C": "相對濕度", "D": "空氣膨脹"}, "answer": "C", "explain": "煙流動的驅動力主要為煙囪效應、浮力、熱膨脹、風及空調系統，相對濕度影響不大。", "ref": "【111專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-065", "topic": "煙與熱流", "stem": "近來消防機關大力推行安裝住宅用火災警報器，其安裝位置在天花板或牆壁上緣，主要考量因素為何？", "opts": {"A": "起火空間的火載量", "B": "天花板噴射流的溫度與速度", "C": "持續燃燒時間", "D": "輻射回饋效應"}, "answer": "B", "explain": "熱煙上升後沿天花板形成噴射流，其溫度與速度決定探測器能否及早感知，故裝在天花板或牆上緣。", "ref": "【111專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-066", "topic": "燃燒", "stem": "一公克水完全汽化成水蒸氣，溫度327°C時水蒸氣體積為V1，溫度727°C時水蒸氣體積為V2，則V2/V1值？", "opts": {"A": "1700", "B": "2.22", "C": "1.67", "D": "4555"}, "answer": "C", "explain": "定壓下體積與絕對溫度成正比：V2/V1＝1000/600≈1.67。", "ref": "【111專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-067", "topic": "危險物品", "stem": "下列關於乙炔的敘述，何者錯誤？", "opts": {"A": "乙炔氣體常由電石加水反應產生，其反應式：CaC₂＋2H₂O→C₂H₂＋Ca(OH)₂", "B": "乙炔易產生分解爆炸，加入非分解爆炸性氣體可形成阻止火焰傳播之界限，稀釋之氣體分子熱愈大效果愈小", "C": "液化之乙炔較固態乙炔危險", "D": "最小起爆能量與乙炔之壓力成反比"}, "answer": "B", "explain": "稀釋氣體的分子熱（熱容量）愈大，吸熱能力愈強，抑制分解爆炸效果愈好，B說反了。", "ref": "【111專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-068", "topic": "火災", "stem": "通風控制燃燒下，居室內有可燃物1200kg，該居室有一開口面積6m²，高度2m，則火災持續時間約幾分鐘？", "opts": {"A": "20", "B": "30", "C": "36", "D": "26"}, "answer": "D", "explain": "R＝5.5A√H＝5.5×6×√2≈46.7 kg/min，持續時間＝1200/46.7≈26 min。", "ref": "【111專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-069", "topic": "防火與特殊現象", "stem": "建築物內部裝潢材料對閃燃時間（F.O.T.）的影響，下列敘述何者錯誤？", "opts": {"A": "熱傳導度低的材料縮短F.O.T.", "B": "同材質等面積的材料，位於牆面較天花板影響大", "C": "材料厚度較薄縮短F.O.T.", "D": "採用不燃材料可延遲F.O.T."}, "answer": "B", "explain": "天花板直接受高溫煙層加熱，內裝位於天花板對閃燃時間的影響大於牆面，B說反了。", "ref": "【111專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-070", "topic": "防火與特殊現象", "stem": "下列對高樓逃生通道設計原則的描述，何者錯誤？", "opts": {"A": "逃生通道應簡單明瞭，路短比路直重要", "B": "逃生以固定設施為主，可搬式器具、裝置為輔", "C": "逃生對策應重視直覺，故以圖形或箭頭等簡單符號指示避難方向或出口較佳", "D": "建築物出口數目，視收容人數多寡而定"}, "answer": "A", "explain": "避難設計強調路徑單純易辨，原則是路直比路短重要，以免煙中迷失方向，A說反了。", "ref": "【111專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-071", "topic": "火災", "stem": "常見消防機關宣導，使用延長線勿將其綑綁，以免引發火災，究其原因為何？", "opts": {"A": "易造成過負載", "B": "使溫度升高絕緣被覆熔解，造成電線短路", "C": "易累積灰塵、水分造成積污導電", "D": "電線間接觸不良，電流流通時產生局部過熱"}, "answer": "B", "explain": "綑綁使電線散熱不良而蓄熱，絕緣被覆劣化熔解後導線相碰造成短路。", "ref": "【111專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-072", "topic": "防火與特殊現象", "stem": "下列何者非油槽火災發生沸溢或濺溢的主要因素？", "opts": {"A": "熱波", "B": "輻射熱", "C": "地震", "D": "水蒸氣"}, "answer": "C", "explain": "沸溢（boilover）由熱波下傳至底部水層、使水急速汽化將油推出；地震並非其形成機制。", "ref": "【111專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-073", "topic": "危險物品", "stem": "執行危害性化學品災害搶救指導原則（HAZMAT），下列有關區域管制（Zoning）敘述何者錯誤？", "opts": {"A": "民眾、媒體記者應管制於冷區外", "B": "事故地點周圍可能遭受污染之區域，稱為熱區", "C": "暖區一般以黃色標示，主要功用為除污", "D": "從熱區搶救出來的傷者，為爭取時效，應直接送醫"}, "answer": "D", "explain": "熱區傷者須先經暖區除污再送醫，否則會把污染帶至醫院與救護人員。", "ref": "【111專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-074", "topic": "滅火", "stem": "下列何者非細水霧滅火系統的特性？", "opts": {"A": "兼具水系統與氣體滅火系統滅火特性", "B": "屬水系統滅火設備，易造成水損", "C": "可適用於A、B、C類火災", "D": "無毒性兼顧環保"}, "answer": "B", "explain": "細水霧用水量極少，水損遠小於一般撒水系統，此為其優點，故B錯。", "ref": "【111專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-075", "topic": "滅火", "stem": "下列何者為乾粉最主要滅火原理？", "opts": {"A": "抑制", "B": "冷卻", "C": "遮斷", "D": "稀釋"}, "answer": "A", "explain": "乾粉受熱分解產生的粒子能捕捉燃燒鏈鎖反應中的自由基，主要為抑制作用，窒息、冷卻為輔。", "ref": "【111專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-076", "topic": "火災", "stem": "下列有關燃燒速度之敘述，何者錯誤？", "opts": {"A": "火災全盛期時，燃燒速度快速增加", "B": "燃燒速度指室內可燃物量因燃燒逐漸減少其重量的速度", "C": "與開口部面積有關", "D": "與開口部高度之平方根成正比"}, "answer": "A", "explain": "全盛期多為通風控制燃燒，燃燒速度由開口A√H決定而大致維持定值，並非快速增加。", "ref": "【111專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-077", "topic": "滅火", "stem": "存放乙醇倉庫發生火災，下列那一種泡沫滅火劑較適當？", "opts": {"A": "化學泡沫", "B": "界面活性劑系泡沫", "C": "高膨脹性泡沫", "D": "耐酒精型泡沫"}, "answer": "D", "explain": "乙醇等水溶性極性溶劑會破壞一般泡沫，須使用耐酒精型泡沫。", "ref": "【111專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-078", "topic": "煙與熱流", "stem": "在長10m、寬8m、高3m的居室燃燒1kg的乳膠枕頭，其Dm＝0.65m²/g，估算此場所出口標示燈能見度？", "opts": {"A": "3.20m", "B": "0.48m", "C": "1.28m", "D": "2.56m"}, "answer": "C", "explain": "D＝Dm·M/V＝0.65×1000/240≈2.71 m⁻¹，Cs＝2.303×2.71≈6.24 m⁻¹；發光型標示K≈8，V＝8/6.24≈1.28 m。", "ref": "【111專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-079", "topic": "防火與特殊現象", "stem": "撕下新購的電視機螢幕保護封膜時遭受靜電，其原因為下列何者？", "opts": {"A": "摩擦帶電", "B": "流動帶電", "C": "剝離帶電", "D": "撞擊帶電"}, "answer": "C", "explain": "密合的兩物體分離時電荷分離而帶電，撕除保護膜屬剝離帶電。", "ref": "【111專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-080", "topic": "危險物品", "stem": "沾有油類之毛屑，集中堆置於塑膠籃而產生自然發火，其原因為下列何者？", "opts": {"A": "發酵熱之蓄積", "B": "吸著熱之蓄積", "C": "分解熱之蓄積", "D": "氧化熱之蓄積"}, "answer": "D", "explain": "沾附油類（尤其乾性油）的纖維與空氣接觸面大，緩慢氧化放熱蓄積而自燃，屬氧化熱。", "ref": "【111專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-001", "topic": "煙與熱流", "stem": "建築物火災造成人命傷亡的原因，主要是煙與有毒氣體，下列何者為防煙最好的方法？", "opts": {"A": "做好防煙區劃，阻止煙的流動", "B": "選用發煙性小的建築材料，抑制煙的發生源", "C": "使用防火閘門，做好防火區劃", "D": "設置排煙效果良好之排煙室"}, "answer": "B", "explain": "從源頭減少煙的產生是最根本的防煙對策；區劃、閘門、排煙都是煙已產生後的控制手段，屬次要。", "ref": "【112專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-002", "topic": "危險物品", "stem": "下列何者屬於準自然發火性物質？", "opts": {"A": "鈉", "B": "赤磷", "C": "乙醇", "D": "過碘酸"}, "answer": "A", "explain": "準自然發火性物質指遇水或濕氣即反應發熱、甚至起火的禁水性物質，鈉為代表；赤磷為易燃固體，乙醇為易燃液體，過碘酸為氧化性物質。", "ref": "【112專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-003", "topic": "火災", "stem": "下列何者非為火災之特性？", "opts": {"A": "傳導性", "B": "不定性", "C": "偶發性", "D": "成長性"}, "answer": "A", "explain": "火災的特性一般歸納為成長性、不定性與偶發性；傳導性是熱傳方式，不是火災本身的特性。", "ref": "【112專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-004", "topic": "燃燒", "stem": "若空氣中的氧氣體積百分比為21%，則甲烷完全燃燒的化學理論濃度為多少%？", "opts": {"A": "5.2", "B": "9.4", "C": "11.0", "D": "15.4"}, "answer": "B", "explain": "CH₄ + 2O₂ → CO₂ + 2H₂O，需空氣 2/0.21 ≈ 9.52 莫耳；理論濃度 = 1/(1+9.52) ≈ 9.5%，最接近 9.4。", "ref": "【112專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-005", "topic": "燃燒", "stem": "鄰二甲苯的閃火點為157°C，若鄰二甲苯於157°C時的飽和蒸氣壓為2.0 mmHg，試求其燃燒下限為何？", "opts": {"A": "1.52%", "B": "2.0%", "C": "0.26%", "D": "0.52%"}, "answer": "C", "explain": "閃火點時的飽和蒸氣濃度即約等於燃燒下限：2.0/760 × 100% ≈ 0.26%。", "ref": "【112專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-006", "topic": "燃燒", "stem": "在標準狀態下，下列氣體中何者之爆炸範圍最廣？", "opts": {"A": "氮", "B": "甲烷", "C": "氨", "D": "氫"}, "answer": "D", "explain": "氫的爆炸範圍約 4～75%，遠大於甲烷（約 5～15%）與氨（約 15～28%）；氮不可燃，無爆炸範圍。", "ref": "【112專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-007", "topic": "爆炸", "stem": "高壓氣體之爆炸界限，通常較常壓下為廣，下列何種氣體之爆炸界限，會呈現加壓時上、下限初呈狹窄，但繼續加壓後又變廣的現象？", "opts": {"A": "H₂", "B": "CH₄", "C": "C₂H₄", "D": "CO"}, "answer": "A", "explain": "氫是典型特例：壓力由常壓升高時爆炸範圍先變窄，壓力再升高後又擴大；甲烷、乙烯多隨壓力升高而上限擴大，CO 則隨加壓而變窄。", "ref": "【112專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-008", "topic": "危險物品", "stem": "赤磷和黃磷分屬我國法定公共危險物品哪一類？", "opts": {"A": "第二類、第三類", "B": "第二類、第五類", "C": "第三類、第四類", "D": "均屬於第二類"}, "answer": "A", "explain": "赤磷為第二類易燃固體；黃磷會在空氣中自燃，屬第三類發火性液體、發火性固體及禁水性物質。", "ref": "【112專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-009", "topic": "危險物品", "stem": "下列何者屬於我國法定公共危險物品中的易燃固體？", "opts": {"A": "固態酒精", "B": "烷基鋁", "C": "黃磷", "D": "三氯矽甲烷"}, "answer": "A", "explain": "固態酒精屬第二類中的引火性固體；烷基鋁、黃磷、三氯矽甲烷均屬第三類。", "ref": "【112專技士 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-010", "topic": "危險物品", "stem": "依據NFPA（美國防火協會）危險性物品標示，有關「反應性」的敘述，下列何者正確？", "opts": {"A": "紅色代表反應性", "B": "反應性區分為1、2、3、4、5級", "C": "反應性3級：遇火也甚安定，或遇水產生爆炸者", "D": "反應性4級：常溫常壓下，便會自行爆炸或引起爆炸的物質"}, "answer": "D", "explain": "NFPA 704 中反應性以黃色表示、分 0～4 共五級；4 級為常溫常壓即可能爆炸者。紅色代表燃燒性，3 級則是需強起爆源或加熱密閉才會爆炸，非「遇火安定」。", "ref": "【112專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-011", "topic": "燃燒", "stem": "氮（N₂）雖可與氧化合，但不屬於可燃物，主要原因是下列何者？", "opts": {"A": "氧化時產生吸熱反應", "B": "閃火點太高", "C": "無法產生連鎖反應", "D": "熱傳導度過高"}, "answer": "A", "explain": "可燃物必須在氧化時放熱才能維持燃燒；氮與氧化合為吸熱反應，無法自我維持，故不視為可燃物。", "ref": "【112專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-012", "topic": "燃燒", "stem": "下列何種化合物不是可燃性物質？", "opts": {"A": "二硫化碳（CS₂）", "B": "苯（C₆H₆）", "C": "二溴二氟甲烷（CBr₂F₂）", "D": "乙烷（C₂H₆）"}, "answer": "C", "explain": "CBr₂F₂ 即海龍 1202，屬鹵化烴滅火劑，不可燃；其餘三者皆為可燃物。", "ref": "【112專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-013", "topic": "煙與熱流", "stem": "依據Alpert之天花板噴射流（Ceiling Jet Flow）經驗公式，若在 R/H ≤ 0.18 時，該熱氣流溫度與環境溫度之差（ΔT）和 R 的幾次方成正比？（R：天花板位置與中心軸間的距離，H：天花板距可燃物之距離）", "opts": {"A": "0", "B": "1/3", "C": "2/3", "D": "1"}, "answer": "A", "explain": "R/H ≤ 0.18 為火羽直上方的撞擊區，ΔT = 16.9Q^(2/3)/H^(5/3)，式中不含 R，即與 R 的 0 次方成正比。", "ref": "【112專技士 第13題】（原題 OCR 缺漏變數，依公式與答案補為 R）", "subject": "火災學", "src": "old"}, {"id": "F-X4-014", "topic": "熱傳", "stem": "依史蒂芬-波茲曼（Stefan-Boltzmann）公式之定義，輻射熱量與輻射物體絕對溫度的幾次方成正比？", "opts": {"A": "一次方", "B": "二次方", "C": "三次方", "D": "四次方"}, "answer": "D", "explain": "Stefan-Boltzmann 定律：E = εσT⁴，輻射能與絕對溫度四次方成正比。", "ref": "【112專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-015", "topic": "煙與熱流", "stem": "在煙控系統設計中，兩開口面積均為1.0 m²，相互串聯後，其等效流動面積為何？（√2 = 1.414）", "opts": {"A": "0.7 m²", "B": "1.0 m²", "C": "1.4 m²", "D": "2.0 m²"}, "answer": "A", "explain": "串聯開口：1/A² = 1/1² + 1/1² = 2，A = 1/√2 ≈ 0.707 m²；1.4 m² 是誤用並聯觀念。", "ref": "【112專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-016", "topic": "燃燒", "stem": "假設空氣中的氧占整體重量的23%，欲使1公斤的丁烷完全燃燒時，需要多少理論空氣量？", "opts": {"A": "3.6 kg", "B": "10.9 kg", "C": "15.7 kg", "D": "27.8 kg"}, "answer": "C", "explain": "C₄H₁₀ + 6.5O₂：58 g 需 O₂ 6.5×32 = 208 g；1 kg 需 O₂ ≈ 3.59 kg，空氣 = 3.59/0.23 ≈ 15.6 kg，最接近 15.7。3.6 kg 只是氧氣量。", "ref": "【112專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-017", "topic": "爆炸", "stem": "下列哪一種爆炸屬於物理性爆炸？", "opts": {"A": "玉米粉粉塵爆炸", "B": "蒸氣爆炸", "C": "環氧乙烷分解爆炸", "D": "硝化甘油爆炸"}, "answer": "B", "explain": "蒸氣爆炸是液體急速相變造成的體積膨脹，無化學反應；粉塵爆炸、分解爆炸、炸藥爆炸皆為化學性爆炸。", "ref": "【112專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-018", "topic": "危險物品", "stem": "若硝化纖維之化學式為 C₂₄H₃₂O₁₂(NO₃)₈，則其硝化度為多少%？", "opts": {"A": "8.02", "B": "11.11", "C": "13.44", "D": "15.01"}, "answer": "B", "explain": "硝化度即含氮重量百分比。分子式相當於 C₂₄H₃₂N₈O₃₆，分子量 = 288+32+112+576 = 1008，N% = 112/1008 ≈ 11.11%。", "ref": "【112專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-019", "topic": "火災", "stem": "建築物火災中，在所謂通風控制燃燒（Ventilation Controlled）情形下，可燃物燃燒速度主要受何因素決定？", "opts": {"A": "自由基數量", "B": "可燃物重量", "C": "可燃物表面積", "D": "流入空氣量"}, "answer": "D", "explain": "通風控制時燃料充足、氧氣不足，燃燒速度取決於開口流入的空氣量（約與 A√H 成正比）；可燃物表面積是燃料控制燃燒的主導因素。", "ref": "【112專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-020", "topic": "燃燒", "stem": "當物質進行完全氧化燃燒時，下列何者的理論空氣需求量最高？", "opts": {"A": "丙三醇（甘油，HOCH₂CHOHCH₂OH）", "B": "丙烯（C₃H₆）", "C": "丙烷（C₃H₈）", "D": "丙酮（CH₃COCH₃）"}, "answer": "C", "explain": "每莫耳需氧量：甘油 3.5、丙烯 4.5、丙烷 5、丙酮 4 莫耳 O₂；丙烷氫最多且不含氧，需氧最多，以單位重量計亦最高。", "ref": "【112專技士 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-021", "topic": "燃燒", "stem": "已知乙烷的完全燃燒反應如下：2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O + 3120 kJ，若其燃燒熱與燃燒下限的關係適用Burgess-Wheeler定理，其燃燒下限約為多少%？（提示：1 cal = 4.2 J）", "opts": {"A": "1.4", "B": "2.9", "C": "0.34", "D": "0.68"}, "answer": "B", "explain": "每莫耳乙烷燃燒熱 = 3120/2 = 1560 kJ ≈ 371 kcal；Burgess-Wheeler：L × Q ≈ 1050～1100，L ≈ 1100/371 ≈ 2.9%。選 1.4 是誤把 3120 kJ 當成每莫耳。", "ref": "【112專技士 第21題】（原題 OCR 熱量數值破損，依答案還原為 3120 kJ）", "subject": "火災學", "src": "old"}, {"id": "F-X4-022", "topic": "燃燒", "stem": "兩種可燃性氣體以等比例混合，其燃燒下限分別為1.5%、4.5%，則該混合氣體的燃燒下限約為多少%？", "opts": {"A": "2.25", "B": "3.00", "C": "3.55", "D": "1.5"}, "answer": "A", "explain": "Le Chatelier 定律：L = 100/(50/1.5 + 50/4.5) = 100/44.44 ≈ 2.25%；3.00 是錯用算術平均。", "ref": "【112專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-023", "topic": "燃燒", "stem": "在最小發火壓力以上，可燃性氣體的最小發火能量，會隨著下列哪一種條件改變而下降？", "opts": {"A": "降低環境壓力", "B": "提高環境氧氣濃度", "C": "降低可燃性氣體濃度", "D": "提高鈍性氣體添加濃度"}, "answer": "B", "explain": "氧濃度升高使反應更容易，最小發火能量下降；降低壓力、偏離最適濃度或加入鈍性氣體都會使最小發火能量上升。", "ref": "【112專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-024", "topic": "燃燒", "stem": "於空氣中加入氧氣會改變空氣組成，進而影響可燃性氣體的某些燃燒特性，下列何者所受的影響較為明顯？", "opts": {"A": "熱傳導係數（Thermal conductivity）", "B": "莫耳燃燒熱（kcal/mol）", "C": "可以燃燒的濃度下限", "D": "可以燃燒的濃度上限"}, "answer": "D", "explain": "燃燒上限處燃料過剩、氧氣不足，增氧會使上限大幅提高；下限處氧已過剩，幾乎不受影響，燃燒熱與熱傳導係數則是物質本身性質。", "ref": "【112專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-025", "topic": "燃燒", "stem": "對可燃性氣體而言，下列哪一種特性或條件所衍生的燃燒或爆炸危險相對較高？", "opts": {"A": "較低的環境氧氣濃度", "B": "較低的環境壓力", "C": "較低的燃燒上限", "D": "較低的燃燒下限"}, "answer": "D", "explain": "燃燒下限越低，少量洩漏就能形成可燃混合氣，危險性越高；低氧、低壓會降低危險，燃燒上限則是越高越危險。", "ref": "【112專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-026", "topic": "防火與特殊現象", "stem": "下列何種靜電災害預防措施旨在防止靜電蓄積，而與其他旨在減少靜電產生的措施有所不同？", "opts": {"A": "接地", "B": "選擇比電容率相近的材料", "C": "降低材料間的摩擦", "D": "儘量使用導電性材料"}, "answer": "A", "explain": "接地是把已產生的電荷導入大地，屬防止蓄積；選用相近材料、降低摩擦都在減少電荷產生。", "ref": "【112專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-027", "topic": "防火與特殊現象", "stem": "下列何種措施於室內發生火災時有助於防止或延緩閃燃的發生？", "opts": {"A": "使用熱傳導係數較低的裝潢材料", "B": "使用保溫效果較佳的裝潢材料", "C": "提高牆壁開口率", "D": "儘量減少室內的火載量"}, "answer": "D", "explain": "減少火載量可降低熱釋放與熱蓄積，延緩或避免閃燃；低熱傳導、保溫材料表面升溫快反而促成閃燃，開口率增加則提供更多空氣。", "ref": "【112專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-028", "topic": "防火與特殊現象", "stem": "下列哪一種前期現象比較可能因後續的消防滅火或救援作為而引發複燃？", "opts": {"A": "天花板下熱煙層的輻射回饋使可燃物快速升溫", "B": "火勢快速成長而呈現旺盛燃燒現象", "C": "天花板下熱煙層的濃度處於燃燒範圍內", "D": "火場持續處於封閉式高溫悶燒的狀態"}, "answer": "D", "explain": "封閉悶燒累積大量高溫可燃氣體但缺氧，破門或開窗導入空氣時即可能引發複燃（backdraft）；輻射回饋與煙層進入燃燒範圍則與閃燃有關。", "ref": "【112專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-029", "topic": "防火與特殊現象", "stem": "有關重油油槽發生火災時可能產生的大規模沸溢（boilover）現象，下列敘述何者錯誤？", "opts": {"A": "槽底水層因受熱升溫產生過熱氣化是關鍵機制", "B": "向下沉降的高溫熱波是導致沸溢的重要熱源", "C": "肇因於油層中的乳化水受熱沸騰", "D": "在火災過程中可能重複發生"}, "answer": "C", "explain": "Boilover 是高溫熱波下傳至槽底水層，使水過熱汽化將油品大量噴出；油層中乳化水受熱沸騰造成的是較小規模的溢流現象，而非大規模沸溢。", "ref": "【112專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-030", "topic": "滅火", "stem": "滅火藥劑的供給率關乎火災初期的滅火成敗、滅火時間與藥劑使用量，下列敘述何者錯誤？", "opts": {"A": "供給率需高於界限供給率始可滅火", "B": "供給率越大則滅火藥劑所需必要量越低", "C": "供給率越大則滅火時間越短", "D": "燃燒面積越大則界限供給率越高"}, "answer": "B", "explain": "必要藥劑量 = 供給率 × 滅火時間，存在一個最適供給率使用量最低；超過後供給率再增加，時間縮短有限而總量反而上升，故不是越大越省。", "ref": "【112專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-031", "topic": "滅火", "stem": "在長寬高為10×10×4公尺的密閉空間中以高壓式二氧化碳作為滅火防護設備。若欲將空間中的氧氣濃度降至15%以下以達到窒息效果，至少應加入多少立方公尺的二氧化碳？", "opts": {"A": "40", "B": "100", "C": "160", "D": "200"}, "answer": "C", "explain": "密閉空間體積 400 m³，氧量固定：21% × 400 = 15% × (400 + X)，X = 400 × (21/15 − 1) = 160 m³。", "ref": "【112專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-032", "topic": "燃燒", "stem": "將大塊的木頭切碎為小片的木屑時，下列敘述何者錯誤？", "opts": {"A": "與空氣接觸的比表面積變大", "B": "木柴的熱傳導係數變小", "C": "受熱時升溫速率變快", "D": "受熱時起燃時間縮短"}, "answer": "B", "explain": "熱傳導係數是材料本身的物性，不因切碎而改變；切碎後比表面積增加、熱容量小，升溫快、起燃時間縮短。", "ref": "【112專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-033", "topic": "煙與熱流", "stem": "當防火門兩側的壓力差加倍時，其透過門縫所流出的氣體體積流量有何變化？", "opts": {"A": "大約倍增", "B": "大約減半", "C": "大約增為4倍", "D": "大約增為1.4倍"}, "answer": "D", "explain": "孔口流量 Q = CA√(2ΔP/ρ)，與壓差平方根成正比；壓差加倍，流量變為 √2 ≈ 1.4 倍。", "ref": "【112專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-034", "topic": "爆炸", "stem": "對於具有分解爆炸性質的可燃性氣體，下列敘述何者錯誤？", "opts": {"A": "分解爆炸大多發生於高壓狀態下", "B": "在界限壓力之上，分解爆炸下限隨壓力升高而下降", "C": "分解爆炸界限與其燃燒界限一致", "D": "分解爆炸可能因聚合升溫而觸發，未必需由氧氣啟動"}, "answer": "C", "explain": "分解爆炸不需氧氣，其界限由壓力與分解熱決定，與和空氣混合的燃燒界限是不同概念，兩者並不一致。", "ref": "【112專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-035", "topic": "爆炸", "stem": "相較於氣體爆炸，一般的粉塵爆炸具有下列哪種性質？", "opts": {"A": "起火能量較低", "B": "起火溫度較低", "C": "爆炸壓力上升速率較低", "D": "破壞力較低"}, "answer": "C", "explain": "粉塵爆炸的起火能量與起火溫度較氣體高，壓力上升速率較慢；但燃燒持續時間長、總能量大，破壞力反而較大。", "ref": "【112專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-036", "topic": "爆炸", "stem": "下列哪一種措施有助於提高粉塵爆炸的防護作用以增加其安全性？", "opts": {"A": "提高粉塵濃度", "B": "提高環境溫度", "C": "提高環境濕度", "D": "提高環境壓力"}, "answer": "C", "explain": "提高濕度可使粉塵吸濕凝聚、不易飛揚，並減少靜電蓄積，降低粉塵爆炸機率；升溫與加壓都會提高危險。", "ref": "【112專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-037", "topic": "爆炸", "stem": "升高環境溫度對於環氧乙烷的分解爆炸有何影響？", "opts": {"A": "提高分解爆炸的起爆能量", "B": "擴大可發生分解爆炸的濃度範圍", "C": "提高可發生分解爆炸的濃度上限", "D": "提高可發生分解爆炸的濃度下限"}, "answer": "B", "explain": "溫度升高使分子內能增加，分解反應更易傳播，可分解爆炸的範圍擴大、所需起爆能量降低。", "ref": "【112專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-038", "topic": "煙與熱流", "stem": "當外部風的風向不變而風速加倍時，對處於煙囪效應下的大樓而言，下列敘述何者正確？", "opts": {"A": "迎風面定點所受的風壓加倍", "B": "迎風面的中性帶下降", "C": "背風面的排煙速率提升", "D": "大樓從煙囪效應轉為逆煙囪效應"}, "answer": "C", "explain": "風壓與風速平方成正比，風速加倍風壓約增為4倍而非加倍；背風面負壓增強，由該側開口排出的煙量因而增加。迎風面正壓增大使中性帶上升，風也不會改變室內外溫差造成的煙囪效應方向。", "ref": "【112專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-039", "topic": "燃燒", "stem": "假設定量乙醇（C₂H₅OH）與理論空氣量混合後產生完全燃燒，若將燃燒廢氣冷卻至常溫，則其中二氧化碳的濃度約為多少%？", "opts": {"A": "12.3", "B": "14.0", "C": "15.1", "D": "16.2"}, "answer": "C", "explain": "C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O，伴隨 N₂ = 3×79/21 ≈ 11.29 莫耳；冷卻後水凝結，CO₂ = 2/(2+11.29) ≈ 15.1%。", "ref": "【112專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-040", "topic": "煙與熱流", "stem": "已知距離光源2公尺處的減光率為20%，則當與光源的距離加倍時，其減光率約為多少%？（提示：log 80 ≈ 1.903，log 64 ≈ 1.806）", "opts": {"A": "44", "B": "40", "C": "36", "D": "32"}, "answer": "C", "explain": "依 Lambert-Beer 定律，2 m 透光率 80%，4 m 透光率 = 0.8² = 64%，減光率 = 1 − 0.64 = 36%；40% 是誤把減光率直接加倍。", "ref": "【112專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-041", "topic": "火災", "stem": "有關風與飛火之敘述，下列何者錯誤？", "opts": {"A": "飛火之發生，除風速外，並視火場建築物之高度而定", "B": "飛火星之種類約有粉狀火星、棒狀火星、葉狀火星及板狀火星", "C": "自風速5 m/sec開始，風速越大，火場燃燒愈猛烈，其發生飛火之可能性也愈大", "D": "風速若超過16 m/sec以上時，飛火距離反而減少"}, "answer": "A", "explain": "依書上答案，飛火發生除風速外應是視火場燃燒規模與火勢而定，並非取決於建築物高度（此點教材說法不一，列為低信心）；火星種類、風速5 m/s起飛火漸增、風速過大反使飛火距離縮短，均與教材相符。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-042", "topic": "熱傳", "stem": "在常壓大氣條件下及溫度100°C時，下列何者之熱傳導度最高？", "opts": {"A": "氫", "B": "空氣", "C": "二氧化碳", "D": "水蒸氣"}, "answer": "A", "explain": "書上答案為 D，但查物性表，100°C 時氫的熱傳導度約 0.2 W/m·K，遠高於空氣（約 0.03）、水蒸氣（約 0.025）與二氧化碳（約 0.022）；氫分子量最小、分子運動最快，是熱傳導度最高的氣體。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-043", "topic": "熱傳", "stem": "下列何者為依據牛頓之熱對流公式計算固體表面與流體間之熱量傳遞，所使用之對流換熱係數單位？", "opts": {"A": "W²/m·K", "B": "W/m²·K", "C": "W/m^(1/2)·K", "D": "W^(1/2)/m·K"}, "answer": "B", "explain": "牛頓冷卻定律 q = hAΔT，h = q/(AΔT)，單位為 W/(m²·K)；W/(m·K) 形式則是熱傳導係數。", "ref": "【112消佐 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-044", "topic": "燃燒", "stem": "在假定壓力、溫度等外部條件一定的狀況下，下列何者在空氣中之燃燒界限範圍最大？", "opts": {"A": "CO", "B": "(C₂H₅)₂O", "C": "H₂", "D": "CS₂"}, "answer": "C", "explain": "燃燒範圍寬度：H₂ 約 4～75%（71）、CO 約 12.5～74%（61.5）、CS₂ 約 1.3～50%、乙醚約 1.9～36%；以寬度論氫最大。", "ref": "【112消佐 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-045", "topic": "爆炸", "stem": "在常溫常壓下，氣體之爆轟速度（m/sec），下列何者最高？", "opts": {"A": "C₃H₈ + 3O₂", "B": "CH₄ + 2O₂", "C": "C₂H₆ + 3.5O₂", "D": "C₂H₄ + 3O₂"}, "answer": "A", "explain": "依教材爆轟速度表，C₃H₈ + 3O₂（富燃料組成）約 2600 m/s 為四者最高；CH₄ + 2O₂ 約 2150 m/s 最低，乙烷、乙烯與氧的混合氣介於其間。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第5題】（B 選項 OCR 為 CH₂，依化學計量還原為 CH₄）", "subject": "火災學", "src": "old"}, {"id": "F-X4-046", "topic": "煙與熱流", "stem": "當風速（V）為10 m/s，風壓係數（Cw）為0.6，環境大氣密度（ρ₀）為1.2 kg/m³時，建築物迎風面所產生之風壓（Pw）約為多少Pa？", "opts": {"A": "12", "B": "24", "C": "36", "D": "48"}, "answer": "C", "explain": "Pw = Cw × ½ρ₀V² = 0.6 × 0.5 × 1.2 × 10² = 36 Pa。", "ref": "【112消佐 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-047", "topic": "火災", "stem": "電線燃燒過程中，其著火階段最小熔斷電流值之電流密度為多少A/mm²以上？", "opts": {"A": "40", "B": "45", "C": "75", "D": "120"}, "answer": "B", "explain": "電線過電流依電流密度分為赤熱、著火、熔斷等階段；教材所列著火階段之下限約為 45 A/mm²，120 A/mm² 以上則屬瞬間熔斷。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-048", "topic": "滅火", "stem": "下列何者之鹵化烴的海龍（Halon）代碼為1301？", "opts": {"A": "CH₂BrCl", "B": "CH₃Br", "C": "CF₃Br", "D": "CH₃I"}, "answer": "C", "explain": "海龍代碼依序為 C、F、Cl、Br 原子數：1301 = 1 個 C、3 個 F、0 個 Cl、1 個 Br，即 CF₃Br。", "ref": "【112消佐 第8題】（A 選項 OCR 破損，依原意還原為 CH₂BrCl）", "subject": "火災學", "src": "old"}, {"id": "F-X4-049", "topic": "滅火", "stem": "下列海龍替代藥劑何者儲存狀態為液體？", "opts": {"A": "FM-200", "B": "NN-100", "C": "INERGEN", "D": "Argotec"}, "answer": "A", "explain": "FM-200（HFC-227ea）屬鹵化烴類，加壓液化儲存；NN-100（氮氣）、INERGEN、Argotec 屬惰性氣體，以高壓氣體儲存。", "ref": "【112消佐 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-050", "topic": "燃燒", "stem": "一般廚房用瓦斯器具的火焰溫度會隨著燃料種類和空氣供應情形而有所變化，但若不預混空氣，僅賴火焰周圍之空氣燃燒瓦斯，其火焰溫度最高只能達到攝氏幾度？", "opts": {"A": "700", "B": "800", "C": "900", "D": "1,000"}, "answer": "C", "explain": "未預混的擴散火焰靠周圍空氣擴散供氧，燃燒不完全，最高約 900°C；預混空氣的本生燈火焰可達更高溫。", "ref": "【112消佐 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-051", "topic": "火災", "stem": "電熨斗放在衣服上太久導致起火燃燒是屬於下列何者？", "opts": {"A": "電氣火災", "B": "斷熱壓縮", "C": "有焰火源", "D": "高溫固體"}, "answer": "D", "explain": "起火源是電熨斗高溫的金屬底板直接加熱衣物，依起火源分類屬高溫固體；雖然熨斗是電器，但並非電氣故障（短路、漏電）引起。", "ref": "【112消佐 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-052", "topic": "熱傳", "stem": "在常溫下，下述何者的熱傳導係數最大？", "opts": {"A": "混凝土", "B": "石膏", "C": "石棉", "D": "空氣"}, "answer": "A", "explain": "常溫熱傳導係數約：混凝土 1.0～1.5、石膏 0.2～0.4、石棉約 0.1～0.2、空氣約 0.026 W/m·K，混凝土最大。", "ref": "【112消佐 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-053", "topic": "危險物品", "stem": "聯氨的化學式為下列何者？", "opts": {"A": "C₂H₄O", "B": "N₂H₄", "C": "C₂H₄", "D": "C₂H₂"}, "answer": "B", "explain": "聯氨（hydrazine）為 N₂H₄；C₂H₄O 為環氧乙烷或乙醛，C₂H₄ 為乙烯，C₂H₂ 為乙炔。", "ref": "【112消佐 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-055", "topic": "燃燒", "stem": "一般可燃物燃燒時所需最低氧氣濃度為下列何者？", "opts": {"A": "18%", "B": "15%", "C": "12%", "D": "9%"}, "answer": "B", "explain": "一般可燃物在氧濃度降至約 15% 以下即難以維持燃燒，這也是窒息滅火的基準；18% 是人員缺氧的警戒值。", "ref": "【112消佐 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-056", "topic": "爆炸", "stem": "中度爆炸性粉塵在相同氣孔比（f²/100 ft³）之容器條件下，下列何者之爆炸壓力最大？", "opts": {"A": "粗粉鎂", "B": "酚樹脂", "C": "粉碎鋁", "D": "大豆粉"}, "answer": "C", "explain": "金屬粉塵燃燒熱高，爆炸壓力通常大於有機粉塵；依教材之粉塵爆炸試驗表，粉碎鋁的爆炸壓力為四者最高。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第16題】（原題氣孔比單位 OCR 破損）", "subject": "火災學", "src": "old"}, {"id": "F-X4-057", "topic": "火災", "stem": "普通木造建築物當等溫度線之區分與等級為曲線3級，其等溫曲線之值（延燒係數）為下列何者？", "opts": {"A": "0.04", "B": "0.15", "C": "0.82", "D": "∞"}, "answer": "B", "explain": "依教材木造建築延燒等溫曲線表，曲線3級對應之延燒係數為 0.15；係數越小代表延燒危險距離越近。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【112消佐 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-059", "topic": "燃燒", "stem": "何謂 Critical Heat Flux？", "opts": {"A": "冷卻材料所需之最小熱通量", "B": "抑制材料所需之最大熱通量", "C": "加熱材料所需之最大熱通量", "D": "點燃材料所需之最小熱通量"}, "answer": "D", "explain": "臨界熱通量（CHF）是材料在長時間受熱下能被引燃的最低入射熱通量，低於此值無論加熱多久都不會起火。", "ref": "【112消佐 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X4-060", "topic": "煙與熱流", "stem": "厚度為1.8 m之煙層，測得有60%之光穿過，試估算其消光係數？", "opts": {"A": "0.111 m⁻¹", "B": "0.123 m⁻¹", "C": "0.225 m⁻¹", "D": "0.284 m⁻¹"}, "answer": "D", "explain": "Lambert-Beer：I/I₀ = e^(−KL)，K = −ln(0.6)/1.8 = 0.511/1.8 ≈ 0.284 m⁻¹；0.123 是誤用常用對數 log 計算。", "ref": "【112消佐 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-001", "topic": "熱傳", "stem": "熱傳導係數是材料導熱能力重要的影響因素之一，有關熱傳導係數，下列敘述何者正確？", "opts": {"A": "固體物質比液體具有較高熱傳導係數", "B": "氣體比液體具有較高熱傳導係數", "C": "熱傳導係數愈大，物質傳熱速度愈慢", "D": "金屬材料熱傳導係數比非金屬材料熱傳導係數小"}, "answer": "A", "explain": "一般而言熱傳導係數為固體＞液體＞氣體。係數愈大傳熱愈快，且金屬的導熱係數遠大於非金屬，故B、C、D皆錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-002", "topic": "滅火", "stem": "海龍滅火藥劑主要的滅火原理，係控制下列何種燃燒要素？", "opts": {"A": "可燃物", "B": "氧氣", "C": "連鎖反應", "D": "熱能"}, "answer": "C", "explain": "海龍（鹵化烷）受熱分解出鹵素自由基，捕捉燃燒中的H·、OH·自由基，屬抑制（負催化）作用，中斷連鎖反應。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-003", "topic": "煙與熱流", "stem": "燃燒產生的高溫氣體向上浮起，為下列何種力造成的？", "opts": {"A": "重力", "B": "庫倫力", "C": "表面張力", "D": "強作用力"}, "answer": "A", "explain": "高溫氣體密度較周圍空氣小，在重力場中產生浮力而上升；浮力本質上源自重力造成的密度差與壓力差。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-004", "topic": "煙與熱流", "stem": "建築物發生火災時，煙的流動方向，主要受到下列何種因素的影響？", "opts": {"A": "濃度", "B": "亮度", "C": "可視度", "D": "壓力"}, "answer": "D", "explain": "煙由高壓處流向低壓處，煙囪效應、浮力、熱膨脹、外部風與空調都是透過造成壓力差來驅動煙的流動。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-005", "topic": "防火與特殊現象", "stem": "有關高樓防火避難安全設計原則，下列敘述何者錯誤？", "opts": {"A": "內部裝潢儘量不燃化", "B": "足夠的結構耐火性能", "C": "適當的防火區劃", "D": "「單一方向避難原則」的逃生設計"}, "answer": "D", "explain": "高樓避難設計應採「雙向避難」原則，確保一條路線受阻時仍有另一條可用；單一方向避難是錯誤的設計。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-006", "topic": "爆炸", "stem": "有關粉塵爆炸，下列敘述何者正確？", "opts": {"A": "粉塵爆炸係發生於粒子內部之燃燒反應", "B": "浮游粉塵含水分超過一定程度時，爆炸威力會降低", "C": "粉塵爆炸可如氣體般均勻濃度分布", "D": "浮游粉塵，粒徑愈小，發火溫度愈高"}, "answer": "B", "explain": "水分會吸熱並使粒子凝聚，降低爆炸威力。粉塵燃燒是粒子表面反應、濃度分布不均勻，且粒徑愈小發火溫度愈低，故A、C、D錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-007", "topic": "危險物品", "stem": "有關硫化氫（H₂S）之性質，下列敘述何者錯誤？", "opts": {"A": "具毒性", "B": "具可燃性", "C": "密度同甲烷，易自然散失", "D": "易產生靜電火花引火"}, "answer": "C", "explain": "硫化氫蒸氣比重約1.19，比空氣重，易滯留低窪處；甲烷比重約0.55較輕易散失，兩者不同，故C錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-008", "topic": "熱傳", "stem": "下列何種材料之熱傳導係數最低？", "opts": {"A": "銅", "B": "岩棉", "C": "混凝土", "D": "低碳鋼"}, "answer": "B", "explain": "岩棉為多孔隔熱材，內含大量靜止空氣，熱傳導係數遠低於混凝土，更低於銅與鋼等金屬。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-009", "topic": "熱傳", "stem": "有關固體表面與流體間之熱量傳遞，可依牛頓熱對流公式估算，其中自然對流的熱對流係數（W/(m²·K)）範圍為：", "opts": {"A": "10～500", "B": "100～1,000", "C": "5～25", "D": "0.1～1"}, "answer": "C", "explain": "氣體自然對流的熱對流係數約在5～25 W/(m²·K)；強制對流才會達數十至數百。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【110警察四等 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-010", "topic": "熱傳", "stem": "高溫物體與低溫物體之間，無媒介物質，熱直接傳至對方之現象稱為：", "opts": {"A": "熱輻射", "B": "熱對流", "C": "熱傳導", "D": "熱反應"}, "answer": "A", "explain": "熱輻射以電磁波傳遞能量，不需介質，真空中亦可進行；傳導與對流都需要介質。", "ref": "【110警察四等 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-011", "topic": "熱傳", "stem": "物體溫度為227°C，輻射率為0.1，其輻射強度約為：", "opts": {"A": "0.015 kW/m²", "B": "15 kW/m²", "C": "0.354 kW/m²", "D": "354 kW/m²"}, "answer": "C", "explain": "E＝εσT⁴＝0.1×5.67×10⁻⁸×(500)⁴≈354 W/m²＝0.354 kW/m²；注意溫度需換成絕對溫度500 K。", "ref": "【110警察四等 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-012", "topic": "燃燒", "stem": "某烷類氣體燃燒時與理論氧氣量的體積比為1：2，該氣體的燃燒下限約為多少？", "opts": {"A": "18.3%", "B": "9.5%", "C": "5.2%", "D": "0.052%"}, "answer": "C", "explain": "需氧2倍為甲烷。化學理論濃度Cst＝1/(1+2/0.21)≈9.5%，燃燒下限約0.55×Cst≈5.2%。9.5%是理論濃度而非下限。", "ref": "【110警察四等 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-013", "topic": "燃燒", "stem": "有關有焰燃燒，下列敘述何者正確？", "opts": {"A": "分解燃燒與蒸發燃燒不屬於有焰燃燒", "B": "火焰係發生於氣相燃燒區", "C": "僅發生於可燃性氣體", "D": "僅發生於可燃性液體"}, "answer": "B", "explain": "火焰是可燃氣體與氧在氣相中反應發光的區域；固體分解燃燒、液體蒸發燃燒都會產生可燃氣體而形成有焰燃燒。", "ref": "【110警察四等 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-014", "topic": "燃燒", "stem": "有關混合燃燒與擴散燃燒的一般特性，下列敘述何者正確？", "opts": {"A": "混合燃燒的燃燒速度比擴散燃燒慢", "B": "室內火災引燃天花板煙氣所致之閃燃現象，可視為混合燃燒型", "C": "蠟燭燃燒為混合燃燒", "D": "瓦斯漏氣燃燒後引起爆炸為擴散燃燒"}, "answer": "B", "explain": "閃燃時天花板下已與空氣預混的可燃氣體瞬間著火，屬混合（預混）燃燒。混合燃燒比擴散燃燒快；蠟燭是擴散燃燒，瓦斯漏氣後爆炸是預混燃燒。", "ref": "【110警察四等 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-015", "topic": "燃燒", "stem": "下列哪一個易燃性氣體之燃燒範圍，其危險性相對較高？", "opts": {"A": "10%～60%", "B": "6.0%～75%", "C": "16%～50%", "D": "8%～70%"}, "answer": "B", "explain": "燃燒範圍愈寬、下限愈低，危險性愈高。B範圍寬達69%且下限最低，危險度最高。", "ref": "【110警察四等 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-016", "topic": "燃燒", "stem": "下列何種物質的特性，有較高的可燃性傾向？", "opts": {"A": "較高的熱傳導係數（thermal conductivity）", "B": "較低的比熱（specific heat capacity）", "C": "較高的密度（density）", "D": "較高的熱慣性（thermal inertia）"}, "answer": "B", "explain": "比熱低則吸少量熱即升溫，易達著火溫度。熱傳導係數高、密度高、熱慣性（kρc）高都會使表面升溫變慢而較難點燃。", "ref": "【110警察四等 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-017", "topic": "防火與特殊現象", "stem": "室內發生閃燃（Flashover）或複燃（Backdraft）時，下列敘述何者正確？", "opts": {"A": "閃燃觸發主因是氧氣", "B": "複燃引發的關鍵機制是輻射熱", "C": "閃燃一般發生於火災衰退期", "D": "複燃發生前一般處於悶燒狀態"}, "answer": "D", "explain": "複燃發生於缺氧悶燒、累積可燃氣體後突然導入空氣時。閃燃主因是熱（輻射回饋），發生於成長期末；複燃關鍵是氧氣供給。", "ref": "【110警察四等 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-018", "topic": "防火與特殊現象", "stem": "可燃性物質置於室內燃燒時，可發生閃燃，置於室外燃燒時則否；造成此種差異現象，與下列何者關聯性較高？", "opts": {"A": "兩者火勢大小之差異", "B": "兩者燃燒速率高低之差異", "C": "兩者火焰是否產生熱輻射", "D": "兩者是否產生輻射能回饋效應"}, "answer": "D", "explain": "室內有天花板與牆面，高溫煙層及壁面會把輻射熱回饋給可燃物，使其全面熱分解而閃燃；室外熱量散失，無此回饋。", "ref": "【110警察四等 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-019", "topic": "防火與特殊現象", "stem": "當非導體之帶電物體接近接地體時，除帶電物體與接地體之間發生放電外，幾乎同一時間，沿著非導體表面發生如樹枝狀發光之放電，此現象稱為：", "opts": {"A": "火花放電", "B": "條狀放電", "C": "電暈放電", "D": "沿面放電"}, "answer": "D", "explain": "沿著絕緣體表面呈樹枝狀擴展的放電稱沿面放電，能量較大、引火危險高；火花放電發生於兩導體間，電暈放電發生於尖端附近。", "ref": "【110警察四等 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-020", "topic": "防火與特殊現象", "stem": "不易累積靜電之導體，係指體積電阻係數（Ω·cm）為多少以下之物質？", "opts": {"A": "10¹⁵", "B": "10¹³", "C": "10¹¹", "D": "10⁹"}, "answer": "D", "explain": "體積電阻率愈低愈容易讓電荷洩漏；一般以10⁹ Ω·cm以下視為不易蓄積靜電的導電性物質，電阻率愈高愈易蓄電。", "ref": "【110警察四等 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-021", "topic": "燃燒", "stem": "影響自然發火之因素，下列敘述何者正確？", "opts": {"A": "熱傳導度愈大，愈容易傳導熱，愈易起火", "B": "氣體熱傳導度大於液體及固體，故愈易引起燃燒", "C": "同一物質，粉狀蓄熱條件較整塊為佳，故較易起火", "D": "物質含大量水分時，熱傳導度小，故易蓄熱起火"}, "answer": "C", "explain": "粉狀堆積內部形成斷熱狀態，熱不易散失而蓄積。熱傳導度大反而易散熱；氣體熱傳導度最小；含水多則熱傳導度大、不易蓄熱。", "ref": "【110警察四等 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-022", "topic": "危險物品", "stem": "有關乙炔及其容器之危險性，下列敘述何者錯誤？", "opts": {"A": "乙炔之分解爆炸，壓力越高，最小點火能量越小", "B": "高壓情況下，乙炔易生聚合反應，升溫發熱，促使分解爆炸", "C": "當乙炔噴出時，丙酮粒子亦一併噴出而發生靜電，其電荷可達10,000 V以上", "D": "界限壓力隨容器管徑增加而上升"}, "answer": "D", "explain": "乙炔分解爆炸的界限壓力隨管徑增大而降低（管徑大散熱少、較易傳播），故D錯。", "ref": "【110警察四等 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-023", "topic": "爆炸", "stem": "有關家用天然氣事故之處置方式，下列敘述何者錯誤？", "opts": {"A": "關閉天然氣開關", "B": "熄滅附近火源", "C": "迅速打開門窗，使室內空氣流通", "D": "立即關閉電氣開關並拔除電源"}, "answer": "D", "explain": "操作電氣開關或拔插頭可能產生電氣火花而引爆瓦斯，漏氣時不可碰觸任何電器開關。", "ref": "【110警察四等 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-024", "topic": "爆炸", "stem": "下列無外力加工之事故現象，何者非屬蒸氣爆炸？", "opts": {"A": "鍋爐破裂", "B": "原油槽之沸溢（Boilover）", "C": "熔鹽槽爆炸", "D": "天然氣管線外洩爆炸"}, "answer": "D", "explain": "蒸氣爆炸是液體急速相變為蒸氣的物理爆炸；天然氣外洩爆炸是可燃氣體與空氣混合後的化學（燃燒）爆炸。", "ref": "【110警察四等 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-025", "topic": "爆炸", "stem": "爆炸對於消防救災產生潛在之危害，下列敘述何者正確？", "opts": {"A": "依能量大小分為爆燃及爆轟", "B": "火焰面和衝擊波發展成同一波，稱為爆轟", "C": "氣體燃燒形成之爆炸主要是指擴散燃燒", "D": "爆燃對於人體及周遭物體造成之影響大於爆轟"}, "answer": "B", "explain": "爆轟時火焰面與衝擊波耦合、以超音速傳播。爆燃與爆轟是依傳播速度區分；氣體爆炸屬預混燃燒；爆轟破壞力大於爆燃。", "ref": "【110警察四等 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-026", "topic": "燃燒", "stem": "可燃性氣體在同一狀態下，下列熱源何者可造成最低之發火溫度？", "opts": {"A": "全面加熱", "B": "高溫固體", "C": "加熱電阻線", "D": "高溫氣體"}, "answer": "A", "explain": "全面加熱時整體混合氣均勻受熱、熱損失最少，所測得的發火溫度最低；局
