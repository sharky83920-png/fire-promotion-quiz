ₓ＝log₁₀(I₀/Iₓ)，則兩者間的關係式可寫成？", "opts": {"A": "ODₓ＝2 − log₁₀(100 − Sₓ)", "B": "ODₓ＝2 − log₁₀(10 − Sₓ)", "C": "ODₓ＝1 − log₁₀(100 − Sₓ)", "D": "ODₓ＝2 − log₁₀(1 − Sₓ)"}, "answer": "A", "explain": "由Sₓ＝100(1 − Iₓ/I₀)得I₀/Iₓ＝100/(100 − Sₓ)，代入ODₓ＝log₁₀(I₀/Iₓ)＝log₁₀100 − log₁₀(100 − Sₓ)＝2 − log₁₀(100 − Sₓ)。", "ref": "【91警技】第七章選擇題第22題（改編為單選，刪除原選項(E)ODₓ＝1 − log₁₀(10 − Sₓ)）", "subject": "火災學", "src": "old"}, {"id": "F-C67-041", "topic": "煙與熱流", "stem": "在計算煙濃度中的可見距離時，須瞭解光學密度，根據Lambert吸收法則，光學密度（optical density，ODₓ）定義為ODₓ＝log₁₀(I₀/Iₓ)，其中I₀、Iₓ分別為原入射光強度及距離x時的受光強度，若已知ODₓ＝1.0，則其中入射光被遮蔽（obscured）多少？", "opts": {"A": "100%", "B": "90%", "C": "50%", "D": "10%"}, "answer": "B", "explain": "ODₓ＝1代表I₀/Iₓ＝10，即只有1/10的光透過；遮蔽率＝1 − Iₓ/I₀＝1 − 0.1＝90%。選10%是把透過率誤當遮蔽率。", "ref": "【93警技】第七章選擇題第24題", "subject": "火災學", "src": "old"}, {"id": "F-C67-042", "topic": "煙與熱流", "stem": "下列有關「火場能見度」之敘述，何者有誤？", "opts": {"A": "能夠清楚辨別物體之對比度C＝−0.02為其臨界值", "B": "發光物體之能見度為反光物體能見度之2～4倍", "C": "觀察者位置與物體間之距離愈遠，其感受之對比度愈小", "D": "物體之能見度乃對比度C減小至−0.05之距離"}, "answer": "D", "explain": "能見度的定義是物體與背景的對比度減小到臨界值−0.02時的距離，不是−0.05，故(D)錯。發光物體能見度約為8/Cs、反光物體約為3/Cs，相差約2～4倍；距離越遠對比度越小。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】第七章選擇題第25題（原選項(C)句末缺字，依文意補為「愈小」）", "subject": "火災學", "src": "old"}, {"id": "F-C67-044", "topic": "煙與熱流", "stem": "煙控分析中有關「等效流動面積」的定義為？", "opts": {"A": "在相同溫差下造成同樣流動之單一開口面積", "B": "在相同時差下造成同樣流動之單一開口面積", "C": "在相同壓差下造成同樣流動之單一開口面積", "D": "在不同溫差下造成同樣流動之單一開口面積"}, "answer": "C", "explain": "開口的流量由壓差驅動，等效流動面積是把多個串聯或並聯的開口，換算成在相同壓差下產生相同流量的單一開口面積，方便煙控計算。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐、91、94警技】第七章選擇題第27題（改編為單選，刪除原選項(E)相同濕差）", "subject": "火災學", "src": "old"}, {"id": "F-C67-045", "topic": "煙與熱流", "stem": "在火災模擬計算過程中，有時需要計算空氣質量流率的數據，假如在一大氣壓力、0°C的條件下，已知空氣密度為1.29 kg/m³，則以理想氣體方程式（PV＝nRT，一大氣壓力＝101325 N/m²，R＝8.31 J/K·mol，n：莫耳數，T：溫度（K））所求得一莫耳（mole）的空氣質量約為多少？", "opts": {"A": "1.290公斤", "B": "0.289公斤", "C": "0.129公斤", "D": "0.0289公斤"}, "answer": "D", "explain": "1莫耳體積V＝nRT/P＝8.31×273÷101325≈0.0224 m³，質量＝密度×體積＝1.29×0.0224≈0.0289 kg，與空氣平均分子量約29 g/mol相符。", "ref": "【94警技】第七章選擇題第28題", "subject": "火災學", "src": "old"}, {"id": "F-C67-046", "topic": "煙與熱流", "stem": "一個加壓空間中存在三個面積分別為0.10 m²、0.20 m²、0.30 m²的開口相互並聯時，其等效流動面積為？", "opts": {"A": "0.20 m²", "B": "0.50 m²", "C": "0.60 m²", "D": "0.90 m²"}, "answer": "C", "explain": "並聯開口的等效流動面積直接相加：0.10＋0.20＋0.30＝0.60 m²。若是串聯才要用Aₑ＝(1/A₁²＋1/A₂²＋1/A₃²)^(−1/2)計算。", "ref": "【91、93士】第七章選擇題第29題", "subject": "火災學", "src": "old"}, {"id": "F-C67-047", "topic": "煙與熱流", "stem": "已知建築物室內空間形狀為長8公尺、寬5公尺、高3公尺，今有一小規模火災（1.5公尺×1.5公尺）發生於室內某處，試預估當濃煙層（smoke layer）下降到離地板高度1.5公尺處約需10秒，若建築物空間形狀變為長10公尺、寬8公尺，其餘條件皆不改變，則煙層下降到離地板高度1.5公尺處，約需時多少？", "opts": {"A": "5秒", "B": "10秒", "C": "20秒", "D": "40秒"}, "answer": "C", "explain": "煙層下降時間與室內地板面積成正比，面積由40 m²變為80 m²加倍，時間也加倍：10×80/40＝20秒。", "ref": "【94消佐】第七章選擇題第30題", "subject": "火災學", "src": "old"}, {"id": "F-C8-001", "topic": "火災", "stem": "建築物由窗口噴出之火焰，向上層延燒者，下列何種窗形最為危險？", "opts": {"A": "縱形窗", "B": "橫形窗", "C": "正形窗", "D": "圓形窗"}, "answer": "B", "explain": "橫形窗（寬大於高）噴出的火焰容易貼附外牆垂直上升，直接威脅上層窗戶；縱形窗的火焰則較易離開牆面，危險性較低。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-002", "topic": "火災", "stem": "當建築物發生火災時，下列何種形狀之窗戶，火焰向外噴出時，尾端遠離側壁，不致順外壁上昇，因此上層窗玻璃承受之熱氣流溫度較低？", "opts": {"A": "橫形窗", "B": "縱形窗", "C": "正形窗", "D": "不定"}, "answer": "B", "explain": "縱形窗（高大於寬）噴出的火焰會向外彎離牆面，上層窗受熱較少；橫形窗則相反，火焰易吸附牆面上升。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-003", "topic": "火災", "stem": "窗之上層有建築物時，火焰流動軌跡與窗之寬度（W）／高度（H）之值關係密切。下列寬度／高度之比值中，何者上層被延燒之危險性最高？", "opts": {"A": "W/H＝1.0", "B": "W/H＝1.5", "C": "W/H＝2.0", "D": "W/H＝3.0"}, "answer": "D", "explain": "W/H 比值愈大（愈接近橫長窗），火焰愈容易貼著外牆向上竄，上層延燒危險愈高，故以 3.0 最危險。", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-004", "topic": "火災", "stem": "防火建築設計中，為防止下層窗戶火焰向上延燒，以何種方式最為有效？", "opts": {"A": "縮小窗口尺寸", "B": "增加側壁高度", "C": "設置屋簷突出物", "D": "改善窗框及用水幕撒水設備"}, "answer": "C", "explain": "外牆設置向外突出的屋簷（或陽台）可把噴出的火焰推離牆面，阻斷其貼牆上升路徑，是防止向上延燒最有效的做法；其他選項僅能部分改善。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-005", "topic": "火災", "stem": "建築物火災時火勢的擴大有時是經由外牆的窗戶向上延燒，下列防止火焰向上延燒的改善措施何者錯誤？", "opts": {"A": "窗戶加裝防火玻璃窗", "B": "窗戶加裝水幕撒水設備", "C": "縮小窗口尺寸", "D": "降低外牆側壁高度"}, "answer": "D", "explain": "上下層窗戶間的外牆（側壁）愈高，阻隔下層火焰的效果愈好；降低側壁高度反而使上層更易被延燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-008", "topic": "火災", "stem": "當室內發生火勢強烈的火災時，由於可燃物之熱分解，產生大量的可燃性氣體，蓄積於天花板附近，此種氣體與空氣混合，正好進入燃燒範圍之際，一舉引火形成鉅大之火焰，如同一片火海之狀態。此種現象為何？", "opts": {"A": "爆燃", "B": "轟燃", "C": "閃燃", "D": "全燃"}, "answer": "C", "explain": "題述為可燃氣體蓄積天花板後一舉引燃、全室陷入火海的閃燃（flashover）。注意：中國大陸用語「轟燃」亦指 flashover，與本題正解同義，作答時依台灣慣用語選閃燃。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-009", "topic": "火災", "stem": "木造建築物火災時，室內溫度達最高點時的溫度，稱為：", "opts": {"A": "發火點", "B": "引火點", "C": "燃點", "D": "閃燃點"}, "answer": "D", "explain": "發火點、引火點、燃點都是描述可燃物本身開始燃燒的溫度特性，與整棟建築火災溫度曲線無關；題意指火災溫度曲線上的峰值，依本書用語稱閃燃點。此題用語特殊，僅能依教材定義作答。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-010", "topic": "火災", "stem": "下列有關區劃空間發生閃燃時的敘述，何者不正確？", "opts": {"A": "氧氣濃度驟降至接近零", "B": "此時為燃料控制燃燒", "C": "室內溫度可達800℃以上", "D": "一氧化碳的濃度幾乎達最大值"}, "answer": "B", "explain": "閃燃後室內可燃氣體極多、空氣不足，燃燒速率受開口進氣量限制，屬通風控制燃燒而非燃料控制燃燒；此時氧氣急降、溫度升至800℃以上、一氧化碳濃度達峰值。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-011", "topic": "火災", "stem": "建築物房間開口部之尺寸與位置會影響閃燃發生時間，當開口率愈小，閃燃發生時間會如何？", "opts": {"A": "較長", "B": "較短", "C": "不變", "D": "不一定"}, "answer": "A", "explain": "開口率愈小，供氧愈受限，火勢成長慢，閃燃時間拉長；但開口率極大時熱量大量散失，閃燃時間也會變長。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【士（年份不詳）】", "subject": "火災學", "src": "old"}, {"id": "F-C8-012", "topic": "火災", "stem": "區劃空間中的火源位於下列何處時，火源上方天花板處的溫度最高？", "opts": {"A": "樓地板中央", "B": "牆壁下", "C": "牆角下", "D": "靠窗戶下"}, "answer": "C", "explain": "火源位於牆角時，兩面牆阻擋了火羽流捲入冷空氣，火焰拉長、溫度下降少，天花板溫度最高；位於中央時四周都能捲入空氣，溫度最低。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-014", "topic": "火災", "stem": "閃燃時間之長短與使用裝潢材料之位置有關，其中同種類等面積之裝潢材料裝修於何處時，影響閃燃時間最大？", "opts": {"A": "地板面", "B": "牆壁面上部", "C": "牆壁面下部", "D": "天花板面"}, "answer": "D", "explain": "天花板直接接觸上升的熱煙層，受熱最快、燃燒後又向下輻射，對閃燃時間影響最大；影響程度大致為天花板＞牆面＞地板。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐、89士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-019", "topic": "火災", "stem": "一般學者（如Babrauskas、Thomas等）在研究火災閃燃的過程中，經常會以「熱釋放率」（Heat release rate，HRR）來做為是否達到閃燃發生的判斷標準之一，試問熱釋放率的單位為：", "opts": {"A": "瓦特（W）", "B": "焦耳（J）", "C": "巴斯卡（Pa）", "D": "溫度（K）"}, "answer": "A", "explain": "熱釋放率是單位時間釋放的熱能（J/s），即功率單位瓦特；焦耳是能量、巴斯卡是壓力、K 是溫度單位。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-020", "topic": "火災", "stem": "消防人員於耐火建築物火災之搶救時，應避免隨意打開開口部，造成大量空氣湧入，因而可能使充滿室內之可燃性氣體一舉燃燒，火焰從窗口噴出，造成危險。此種動作係為避免下列何種現象發生？", "opts": {"A": "閃燃（Flash Over）", "B": "輻射能回饋效果（Radiant Energy Feedback）", "C": "複燃（Back Draft）", "D": "燃料控制燃燒（Fuel Controlled）"}, "answer": "C", "explain": "缺氧悶燒的密閉空間蓄積大量可燃氣體，一旦開口引入新鮮空氣即瞬間爆燃噴出，稱為複燃（backdraft）；閃燃是熱量累積引起，並非因突然進氣。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【消佐（年份不詳）】", "subject": "火災學", "src": "old"}, {"id": "F-C8-021", "topic": "火災", "stem": "火場中出現複燃（backdraft）現象時，經常造成現場救災人員的重大傷亡意外，試問在火場複燃發生前的密閉空間中，主要是缺哪一種燃燒要素？", "opts": {"A": "可燃物", "B": "熱能", "C": "氧氣", "D": "蒸氣"}, "answer": "C", "explain": "複燃前室內高溫、可燃氣體充足，唯獨氧氣不足而處於悶燒；開口引進氧氣後三要素齊備即猛烈燃燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-022", "topic": "煙與熱流", "stem": "在未發生火災之前，居室內部是呈現低溫的平衡狀態，但是當火災發生後，由於燃燒作用所生成的大量熱及能量釋放，會導致居室內部溫度及壓力變化，進而產生向上推昇的浮力作用，同時將燃燒所生成的各種生成物一起混合往上擠壓的現象，此種情形稱為火災熱流中的何種現象？", "opts": {"A": "火柱現象（fire plume）", "B": "複燃現象（back draft）", "C": "牆壁熱流現象（wall flow）", "D": "開口部熱流現象（vent flow）"}, "answer": "A", "explain": "火源上方熱氣因浮力上升並捲入周圍空氣與燃燒生成物，形成的上升柱狀熱流稱為火羽（火柱）；牆壁熱流、開口部熱流是熱流撞到牆或流經開口後的行為。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技】（改編為單選，刪除原(E)閃燃現象）", "subject": "火災學", "src": "old"}, {"id": "F-C8-023", "topic": "防火與特殊現象", "stem": "當油池內有積水，火災發生時，即可能發生何種現象？", "opts": {"A": "BLEVE", "B": "突沸（揚沸）（boilover）", "C": "爆轟", "D": "閃燃"}, "answer": "B", "explain": "油槽底部積水被向下傳遞的熱波加熱至沸騰，急速汽化膨脹把上方燃油噴出，稱為沸溢（boilover）；BLEVE 是壓力容器內液化氣體沸騰膨脹爆炸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-024", "topic": "燃燒", "stem": "依據日本學者秋田一雄之研究結果，木材種類與發火溫度之關係不大，通常其表面溫度達多少以上，即可滿足發火之條件？", "opts": {"A": "290℃", "B": "390℃", "C": "490℃", "D": "590℃"}, "answer": "C", "explain": "秋田一雄研究指出木材不論樹種，表面溫度達約490℃即可自行發火（無需火種）；約260℃則是木材的引火危險溫度，兩者勿混淆。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-025", "topic": "燃燒", "stem": "依據日本學者秋田一雄研究結果，木材種類與發火溫度之關係不大，通常只要其表面溫度達到多少℃左右，即可滿足發火之條件？", "opts": {"A": "100℃", "B": "260℃", "C": "350℃", "D": "490℃"}, "answer": "D", "explain": "木材表面發火溫度約490℃；260℃為木材的引火（低溫起火危險）溫度，是本題最常見的誘答。", "ref": "【87、89、90、94消佐、94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-026", "topic": "燃燒", "stem": "對木材而言有所謂之發火假設溫度為a，引火假設溫度為b及無焰發火假設溫度為c，此三者，其溫度之高低，下列何者為是？", "opts": {"A": "a＞b＞c", "B": "a＜b＜c", "C": "a＞c＞b", "D": "a＜c＜b"}, "answer": "C", "explain": "有火種引燃（引火）所需表面溫度最低，無火種時先出現無焰（赤熱）發火，最高的是無火種下的有焰發火（約490℃），故 a＞c＞b。本題依文獻推定，書上未附答案。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【92警技】（改編為單選，刪除原(E)b＜a＜c）", "subject": "火災學", "src": "old"}, {"id": "F-C8-027", "topic": "燃燒", "stem": "一般而言，火災中引發木材著火的最低輻射熱通量值，約為：", "opts": {"A": "12 kW/cm²", "B": "12 kW/m²", "C": "12 W/m²", "D": "12 W/cm²"}, "answer": "B", "explain": "木材受輻射引火的臨界熱通量約 12～12.5 kW/m²；12 W/cm² 等於 120 kW/m²，12 kW/cm² 更大得離譜，12 W/m² 則幾乎無熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-028", "topic": "燃燒", "stem": "1公斤（1kg）木材之發熱量約為多少？", "opts": {"A": "1800 kcal/kg", "B": "2700 kcal/kg", "C": "3600 kcal/kg", "D": "4500 kcal/kg"}, "answer": "D", "explain": "木材燃燒熱約 18～19 MJ/kg，換算約 4,500 kcal/kg（1 kcal≒4.18 kJ）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-031", "topic": "燃燒", "stem": "木材的化學成分中，燃燒時形成焦炭比率最多的是：", "opts": {"A": "纖維素", "B": "半纖維素", "C": "木質素", "D": "膠質"}, "answer": "C", "explain": "木質素為芳香族高分子，熱穩定性高，熱分解時殘留焦炭比例最高；纖維素與半纖維素多分解成可燃揮發物。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-032", "topic": "燃燒", "stem": "將磷酸鹽或硼酸鹽加入纖維質材料中，受熱燃燒時：", "opts": {"A": "固體表面將產生較多的焦炭", "B": "火焰中H₂O的比例將減少", "C": "火焰中CO₂的比例減少", "D": "燃燒熱將提高"}, "answer": "A", "explain": "磷酸鹽、硼酸鹽是纖維質的耐燃劑，促使材料脫水炭化，產生較多焦炭與水、減少可燃揮發物，燃燒熱因而降低。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-033", "topic": "燃燒", "stem": "木材因長期低溫受熱，導致未達260℃即引火燃燒，此一現象稱之為「木材之低溫著火」，由經驗得知，易造成木材低溫著火的危險處所，下列敘述何者不正確？", "opts": {"A": "煙囪等貫穿之屋頂", "B": "木材堆置場", "C": "三溫暖室暖爐等熱源之周圍", "D": "乾燥室內蒸氣管接觸之部分"}, "answer": "B", "explain": "低溫著火需木材長期接觸穩定熱源（煙囪、暖爐、蒸氣管）；單純的木材堆置場沒有持續加熱源，不屬此類危險處所。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【消佐（年份不詳）】", "subject": "火災學", "src": "old"}, {"id": "F-C8-034", "topic": "火災", "stem": "下列何者為研究火災工程中，「火載量」（fire load）的定義？", "opts": {"A": "單位時間之發熱量（cal/sec）", "B": "單位體積之可燃物量（kg/m³）", "C": "室內之可燃物量（kg）", "D": "單位面積之可燃物量（kg/m²）"}, "answer": "D", "explain": "火載量是室內可燃物總量換算為每單位樓地板面積的量（kg/m²）；單位時間發熱量是熱釋放率，不是火載量。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、93、94消佐、警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-035", "topic": "火災", "stem": "一般研究火災中，所謂的「相當火災猛烈度」（equivalent fire severity），須要一條標準溫度－時間曲線來進行驗算，請問英國國家標準第476號第8部（BS476 Part 8）的溫度－時間曲線為何？（T₀：起始溫度；T：溫度；t：時間（秒））", "opts": {"A": "T＝T₀＋345 log(0.133t＋1)", "B": "T＝T₀＋245 log(0.133t＋1)", "C": "T＝T₀＋245×(0.133t＋1)", "D": "T＝T₀＋245×ln(0.133t＋1)"}, "answer": "A", "explain": "標準火災曲線為 T＝T₀＋345 log₁₀(8t＋1)（t 以分鐘計）；改以秒計時 8/60≒0.133，即 T＝T₀＋345 log(0.133t＋1)。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-036", "topic": "火災", "stem": "所謂火載量（Fire Load）係指單位面積之可燃物量（kg/m²），如有一倉庫長5公尺，寬10公尺，高2公尺，可燃物總重500公斤，則其火載量為何？", "opts": {"A": "50 kg/m²", "B": "25 kg/m²", "C": "10 kg/m²", "D": "5 kg/m²"}, "answer": "C", "explain": "火載量＝可燃物量／樓地板面積＝500 ÷ (5×10)＝10 kg/m²；高度不影響，除以體積 100 m³ 得 5 是誘答。", "ref": "【89、92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-041", "topic": "爆炸", "stem": "過大電流通過時，所產生之電氣爆炸是屬於下列何者？", "opts": {"A": "固態爆炸", "B": "液態爆炸", "C": "氣態爆炸", "D": "瓦斯爆炸"}, "answer": "A", "explain": "導線通過過大電流瞬間熔融汽化而爆開，是金屬固體急速相變造成的爆炸，歸類為固相（固態）爆炸。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-042", "topic": "防火與特殊現象", "stem": "下列何者非絕緣電線起火之原因？", "opts": {"A": "過大電流", "B": "短路", "C": "局部過熱", "D": "二條電線被覆接觸"}, "answer": "D", "explain": "絕緣被覆完好時兩線被覆互相接觸並不導通，不會起火；過大電流、短路、局部過熱都會使導線發熱起火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-043", "topic": "防火與特殊現象", "stem": "下列哪一項會造成電氣局部之電阻值減低？", "opts": {"A": "電容器的絕緣劣化", "B": "斷線", "C": "氧化亞銅增殖發熱現象", "D": "接續部螺絲未栓緊"}, "answer": "A", "explain": "絕緣劣化使原本不該導通處出現電流路徑，屬電阻值降低；斷線、氧化亞銅增殖、接續部鬆脫都是局部電阻值增加。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-044", "topic": "防火與特殊現象", "stem": "下列何者不屬於電氣火災中之「焦耳熱」？", "opts": {"A": "通電部導體之接觸", "B": "三相三線式配線之一線斷線", "C": "開關類接點之熔解", "D": "放電火花發生之熱"}, "answer": "D", "explain": "焦耳熱是電流流經電阻產生的熱（Q＝I²R）；放電火花是電荷經空氣絕緣破壞放電產生的熱，屬另一類電氣發熱。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-045", "topic": "防火與特殊現象", "stem": "電氣火災發生之現象，主要是電能轉變而發生熱。此種熱之發生種類主要為：", "opts": {"A": "焦耳熱", "B": "莫耳熱", "C": "電熱", "D": "活化能"}, "answer": "A", "explain": "電流通過導體電阻時電能轉為熱能，即焦耳熱，是電氣火災最主要的熱源；莫耳熱、活化能與此無關。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-046", "topic": "防火與特殊現象", "stem": "歐姆定律係由電阻（R）、電流（I）、電壓（V）三者關係所成，試問歐姆定律之公式為何？", "opts": {"A": "V＝IR", "B": "I＝VR", "C": "R＝VI", "D": "R＝V＋I"}, "answer": "A", "explain": "歐姆定律：電壓等於電流乘以電阻，V＝IR（亦可寫 I＝V/R、R＝V/I）；其餘選項乘除關係錯誤。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-047", "topic": "防火與特殊現象", "stem": "當電流通過電線時，因其電阻，必會產生焦耳熱，假設電流為I安培，電線之電阻為R歐姆，則發生之熱量Q（瓦特）為：", "opts": {"A": "IR", "B": "IR²", "C": "I²R", "D": "I²/R"}, "answer": "C", "explain": "焦耳熱功率 P＝IV，代入 V＝IR 得 P＝I²R；IR 只是電壓，其餘形式單位不符。", "ref": "【91消佐、88、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-048", "topic": "防火與特殊現象", "stem": "帶靜電之導體通常其蓄積之靜電能量均將化成放電能量，若此能量大於可燃性物質之最小發火能量則可產生火災或爆炸，若帶電體之靜電能量以E表示，電壓為V，電荷為Q，靜電容量為C，則：", "opts": {"A": "E＝C×V", "B": "E＝C×V²", "C": "E＝1/2×C×V", "D": "E＝1/2×Q×V"}, "answer": "D", "explain": "靜電能量 E＝½CV²＝½QV＝Q²/2C（Q＝CV）；選項中只有 ½QV 正確，C×V² 少了 ½，C×V 是電荷量。", "ref": "【61期專修、87警技】（改編為單選，刪除原(E)E＝Q×V）", "subject": "火災學", "src": "old"}, {"id": "F-C8-050", "topic": "防火與特殊現象", "stem": "易燃性液體，其帶電量與流速有很大的關連，因此為減少靜電之發生，其流速最好應在多少以下？", "opts": {"A": "0.5 m/s", "B": "1.0 m/s", "C": "1.5 m/s", "D": "2.0 m/s"}, "answer": "B", "explain": "液體流動帶電量隨流速增加而增大，一般建議易燃性液體輸送流速控制在約 1 m/s 以下以抑制靜電。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87警技】（改編為單選，刪除原(E)3.0 m/s）", "subject": "火災學", "src": "old"}, {"id": "F-C8-052", "topic": "防火與特殊現象", "stem": "下列何種液體擁有最低之固有電阻值？", "opts": {"A": "甲醇", "B": "燈油", "C": "輕油", "D": "汽油"}, "answer": "A", "explain": "醇、酯、酮類等極性液體固有電阻低（約10⁸ Ω·cm以下），電荷易洩漏；燈油、輕油、汽油等石油類固有電阻高，最易帶電。", "ref": "【89警技】（改編為單選，刪除原(E)噴射機油）", "subject": "火災學", "src": "old"}, {"id": "F-C8-053", "topic": "防火與特殊現象", "stem": "液體於流送、噴出、混合、攪拌、過濾之際，易因摩擦而帶電。下列何種物質最易發生電荷？", "opts": {"A": "燈油", "B": "甲醇", "C": "丙酮", "D": "苯酚"}, "answer": "A", "explain": "燈油屬石油類，固有電阻高，電荷不易洩漏而易蓄積；甲醇、丙酮、苯酚為極性物質，電阻低較不易帶電。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-054", "topic": "防火與特殊現象", "stem": "下列敘述何者有誤？", "opts": {"A": "帶電物體之靜電放電，大致可分為「氣中放電」與「沿面放電」", "B": "條狀放電較電暈放電易生災害", "C": "火花放電是「沿面放電」之一種", "D": "「沿面放電」與「火花放電」均易成為火災原因"}, "answer": "C", "explain": "火花放電、電暈放電、條狀放電都在空氣中發生，屬氣中放電；沿面放電是沿絕緣物表面發生的另一類，故 C 錯。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-055", "topic": "防火與特殊現象", "stem": "電氣火災中因電氣條件改變造成的火災因素，不包括：", "opts": {"A": "電阻值降低", "B": "導線過負載", "C": "局部電阻值增加", "D": "靜電誘導"}, "answer": "D", "explain": "電氣條件改變造成的火災分為電阻值降低、負荷增加（過負載）、局部電阻值增加三類；靜電誘導屬靜電火災，不在此範疇。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-057", "topic": "防火與特殊現象", "stem": "電氣火災中因電氣條件改變造成的火災因素，不包括：", "opts": {"A": "斷熱壓縮", "B": "導線過負載", "C": "局部電阻值增加", "D": "電阻值降低"}, "answer": "A", "explain": "斷熱壓縮是氣體被急速壓縮升溫的力學起火源，與電路電氣條件無關；其他三者是電氣條件改變的三大類。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-059", "topic": "防火與特殊現象", "stem": "下列何者不是靜電發生之主要原因？", "opts": {"A": "摩擦帶電", "B": "雲間放電", "C": "剝離帶電", "D": "流動帶電"}, "answer": "B", "explain": "摩擦、剝離、流動都是物體接觸分離而帶電的方式；雲間放電是雷電的放電現象，不是靜電產生的原因。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-060", "topic": "防火與特殊現象", "stem": "氧化亞銅增殖發熱現象屬於下列哪一種電氣條件的變化？", "opts": {"A": "電阻值降低", "B": "負荷增加", "C": "局部電阻值增加", "D": "配線之一線斷線"}, "answer": "C", "explain": "銅導體接續不良處生成氧化亞銅並逐漸擴大，形成高電阻、持續發熱，屬局部電阻值增加。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-061", "topic": "防火與特殊現象", "stem": "變壓器、馬達之線圈銅線，若出現針孔損壞或絕緣劣質化，以致迴路發生感應電流過大，終而導致局部發熱乃至發火。此種現象謂之：", "opts": {"A": "電容器絕緣劣化", "B": "層間短路現象", "C": "負荷增加", "D": "斷線現象"}, "answer": "B", "explain": "線圈相鄰匝間絕緣破損而互相導通，形成短路環並感應大電流發熱，稱為層間短路，屬電阻值降低類。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-062", "topic": "防火與特殊現象", "stem": "下列何者係藉由中和防止電荷蓄積？", "opts": {"A": "使用導電性材料", "B": "利用電暈放電產生空氣離子化", "C": "使用除電劑", "D": "接線或接地"}, "answer": "B", "explain": "除電器利用電暈放電使空氣離子化，以異極離子中和帶電體電荷；導電性材料、除電劑（抗靜電劑）、接地接線都是讓電荷洩漏的方法。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89警技】（改編為單選，刪除原(E)增加周圍空氣溼度）", "subject": "火災學", "src": "old"}, {"id": "F-C8-064", "topic": "防火與特殊現象", "stem": "下列哪項係藉中和防止電荷蓄積之方法？", "opts": {"A": "接地與接線", "B": "使用導電性材料", "C": "靜電誘導之離子化", "D": "增加周圍空氣濕度"}, "answer": "C", "explain": "靜電誘導使空氣離子化，產生異極離子中和帶電體電荷，屬中和法；其餘三者皆讓電荷經導體或水膜洩漏。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-065", "topic": "防火與特殊現象", "stem": "下列有關藉由增加空氣濕度之防靜電措施的敘述，何者正確？", "opts": {"A": "會使絕緣體表面形成水膜，增加其表面電阻", "B": "會使靜電主要經由空氣洩漏", "C": "當靜電發生處所低於室溫時，效果更佳", "D": "絕緣體表面的水膜含有雜質時，會干擾靜電的洩漏"}, "answer": "C", "explain": "提高濕度是讓絕緣體表面形成水膜、降低表面電阻，電荷沿表面洩漏；表面溫度低於室溫較易凝結水膜，效果較好。水膜中的雜質反而增加導電性。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-066", "topic": "防火與特殊現象", "stem": "下列哪一種物質無法藉由增加空氣的濕度而有效的消除其表面的靜電？", "opts": {"A": "聚氯乙烯", "B": "紙張", "C": "橡膠", "D": "醋酸纖維素"}, "answer": "A", "explain": "增濕法需材料表面能吸附水分形成水膜；聚氯乙烯等疏水性塑膠表面不易形成水膜，增濕效果差。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【93士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-069", "topic": "防火與特殊現象", "stem": "若某人之靜電容量為200 μμF（pF），在油漆布上行走時帶有10³ V之電壓，試求其接觸接地之金屬時，其放出之能量為多少？", "opts": {"A": "0.1 mJ", "B": "0.2 mJ", "C": "0.3 mJ", "D": "0.4 mJ"}, "answer": "A", "explain": "E＝½CV²＝½ × 200×10⁻¹² F × (10³ V)²＝1×10⁻⁴ J＝0.1 mJ（μμF 即 pF＝10⁻¹² F）。", "ref": "【92警技】（改編為單選，刪除原(E)0.5mJ）", "subject": "火災學", "src": "old"}, {"id": "F-C8-070", "topic": "防火與特殊現象", "stem": "在常用電壓110V下若某延長線之容許電流為15安培，則在該線上所有用電器具之總耗電功率不得超過多少？", "opts": {"A": "825 W", "B": "1650 W", "C": "2475 W", "D": "3300 W"}, "answer": "B", "explain": "功率 P＝IV＝15 A × 110 V＝1650 W。", "ref": "【92警技】（改編為單選，刪除原(E)4125W）", "subject": "火災學", "src": "old"}, {"id": "F-C8-071", "topic": "防火與特殊現象", "stem": "假設線徑1.6mm之單線其容許電流是27安培，假設其使用電流為25安培，若因電線被壓、斷線或未密接而增加其電阻值時，試問當其電阻值升至多少時，其每公分發生之熱量可達0.2瓦？", "opts": {"A": "2.7×10⁻⁴ Ω/cm", "B": "2.9×10⁻⁴ Ω/cm", "C": "3.2×10⁻⁴ Ω/cm", "D": "3.4×10⁻⁴ Ω/cm"}, "answer": "C", "explain": "焦耳熱 P＝I²R，0.2＝25² × R，R＝0.2/625＝3.2×10⁻⁴ Ω/cm。", "ref": "【92警技】（改編為單選，刪除原(E)3.8×10⁻⁴Ω/cm）", "subject": "火災學", "src": "old"}, {"id": "F-C8-072", "topic": "防火與特殊現象", "stem": "金屬導體與大地間以電氣之接續，使金屬導體之電位大致與大地相同，此種現象稱為：", "opts": {"A": "接地", "B": "流動帶電", "C": "摩擦放電", "D": "剝離帶電"}, "answer": "A", "explain": "以導線將導體與大地連接使兩者等電位，稱為接地，可讓電荷洩入大地；其他選項為帶電或放電現象。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-073", "topic": "防火與特殊現象", "stem": "下列何者為地絡形成之原因？", "opts": {"A": "架空配線與樹木接觸", "B": "金屬管內電纜包覆損傷，致電線與管壁接觸", "C": "電氣設備充電部與雨水、工具、人體等接觸", "D": "以上皆是"}, "answer": "D", "explain": "地絡是帶電部分經非預期路徑與大地導通；樹木、金屬管壁、雨水或人體接觸帶電部都會構成接地路徑，三者皆是。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-076", "topic": "防火與特殊現象", "stem": "液化石油氣儲槽附近起火燃燒一時無法撲滅時，為防止槽體發生BLEVE現象，採取的救災策略何者正確？", "opts": {"A": "強力直線水柱灌水降溫", "B": "人車全部撤出火場讓火勢自生自滅", "C": "火源附近設固定式撒水架降低槽體溫度", "D": "設防液堤"}, "answer": "C", "explain": "BLEVE 源於槽壁（尤其氣相部）受熱強度下降，應以固定式撒水或無人水砲持續冷卻槽體；防液堤防止流淌，無法阻止槽體過熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-077", "topic": "防火與特殊現象", "stem": "油池火災之放射熱與下列何者無關？", "opts": {"A": "燃燒速度", "B": "火焰之形狀與高度", "C": "容器之材質", "D": "火焰之溫度與距離"}, "answer": "C", "explain": "油池火災放射熱取決於燃燒速度、火焰大小形狀、火焰溫度及與受熱物距離；容器材質對火焰放射熱幾無影響。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-078", "topic": "防火與特殊現象", "stem": "下列有關油池火焰（災）的敘述，何者不正確？", "opts": {"A": "隨著油池直徑變大，火焰向液體的輻射熱主宰著油池液面的下降速率", "B": "隨著油池直徑變大，液面蒸發速率將趨於一定值", "C": "採用泡沫滅火劑，既能減少向液體的熱傳量，又能阻止液體的蒸發", "D": "如果油池內有積水，火災發生時，即可能發生BLEVE的現象"}, "answer": "D", "explain": "油池底部積水受熱沸騰將油噴出的是沸溢（boilover），不是 BLEVE；BLEVE 發生在密閉壓力容器。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-079", "topic": "防火與特殊現象", "stem": "物質於空氣常溫下，因化學變化而自然發熱，其反應熱經長期蓄積，致發火之現象，稱為：", "opts": {"A": "自然發火", "B": "混合發火", "C": "自然引火", "D": "低溫起火"}, "answer": "A", "explain": "常溫下自行發熱、長期蓄熱達發火點而燃燒即自然發火；混合發火需兩種物質混合，低溫起火特指木材長期受熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87消佐、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-080", "topic": "防火與特殊現象", "stem": "固體物質大量堆積，其內部因而發熱時，即使發熱量小，周圍溫度低，然因熱量之蓄積溫度逐漸上昇，終至發火，此種現象稱為：", "opts": {"A": "準自然發火", "B": "自然發火", "C": "混合發火", "D": "引火"}, "answer": "B", "explain": "大量堆積使內部熱量散不出去、逐漸蓄熱升溫而發火，是自然發火的典型；準自然發火是接觸空氣或水即迅速發火，不需長期蓄熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-081", "topic": "防火與特殊現象", "stem": "影響「自然發火」之主要因素為「熱之蓄積」與「熱之發生速度」二者，試問下列何者屬「熱之發生速度」因子？", "opts": {"A": "表面積", "B": "空氣之流動", "C": "熱傳導速度", "D": "堆積法"}, "answer": "A", "explain": "表面積愈大，與氧接觸反應愈多，發熱速度愈快，屬熱發生速度因子；熱傳導、空氣流動、堆積方法影響散熱，屬熱蓄積因子。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-082", "topic": "防火與特殊現象", "stem": "影響「自然發火」之主要因素為「熱之蓄積」與「熱之發生速度」，則下列何者屬「熱之蓄積」因子？", "opts": {"A": "堆積方法", "B": "溫度", "C": "發熱量", "D": "表面積"}, "answer": "A", "explain": "堆積方式決定熱量能否散出，屬熱蓄積因子；溫度、發熱量、表面積影響反應速度，屬熱發生速度因子。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-084", "topic": "防火與特殊現象", "stem": "下列何者屬自然發火性物質，且本身會因化學反應產生分解熱而發火？", "opts": {"A": "乾性油", "B": "活性碳", "C": "賽璐珞", "D": "枯草"}, "answer": "C", "explain": "賽璐珞（硝化纖維製品）會自行分解放熱而蓄熱發火；乾性油屬氧化熱、活性碳屬吸著熱、枯草屬發酵熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89、94士、90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-085", "topic": "防火與特殊現象", "stem": "賽璐珞（Celluloid）屬自然發火性物質之一，其會進行下列何種反應，所產之熱能蓄熱，以致達到發火點而開始燃燒？", "opts": {"A": "氧化", "B": "分解", "C": "吸著", "D": "發酵"}, "answer": "B", "explain": "賽璐珞主成分為硝化纖維，常溫下緩慢分解放熱，熱量蓄積後發火，屬分解熱型自然發火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-088", "topic": "防火與特殊現象", "stem": "原棉運輸途中常發生火災，其為何種原因所造成？", "opts": {"A": "分解熱", "B": "氧化熱", "C": "發酵熱", "D": "聚合熱"}, "answer": "B", "explain": "原棉含油脂成分，堆積時緩慢氧化放熱並蓄熱，教材歸為氧化熱型自然發火；發酵熱的代表是枯草、稻草。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【89士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-089", "topic": "防火與特殊現象", "stem": "乾性油會因為何種化學反應熱能之蓄積而自然發火？", "opts": {"A": "分解熱", "B": "吸著熱", "C": "氧化熱", "D": "發酵熱"}, "answer": "C", "explain": "乾性油（如亞麻仁油）含大量不飽和鍵，與空氣中氧反應放熱，浸於布料等多孔物時熱量蓄積而發火，屬氧化熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（改編為單選，刪除原(E)聚合熱）", "subject": "火災學", "src": "old"}, {"id": "F-C8-090", "topic": "防火與特殊現象", "stem": "下列何者係因吸著熱之蓄積自然起火者？", "opts": {"A": "植物性之活性碳", "B": "金屬粉", "C": "油布", "D": "亞麻仁油"}, "answer": "A", "explain": "活性碳多孔、吸附氣體時放出吸著熱而蓄熱發火；金屬粉、油布、亞麻仁油屬氧化熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-091", "topic": "防火與特殊現象", "stem": "依自然發火性物質發熱之原因，何者非因吸著熱發火的物質？", "opts": {"A": "賽璐珞", "B": "木炭灰", "C": "活性碳", "D": "還原鎳"}, "answer": "A", "explain": "賽璐珞是分解熱型自然發火物質；活性碳、炭粉及還原鎳等多孔物質則因吸附放熱而發火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-092", "topic": "防火與特殊現象", "stem": "枯草、乾草因枯草菌或其他微生物之繁殖而發生何種熱能，經熱之蓄積導致自然發火？", "opts": {"A": "發酵熱", "B": "吸著熱", "C": "氧化熱", "D": "分解熱"}, "answer": "A", "explain": "枯草、稻草、堆肥中微生物代謝繁殖放熱屬發酵熱，升溫後再引發後續氧化而發火。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【消佐（年份不詳）】", "subject": "火災學", "src": "old"}, {"id": "F-C8-093", "topic": "防火與特殊現象", "stem": "自然發火性物質，其發熱型態係因聚合熱而發火的物質，下列何者正確？", "opts": {"A": "硝化棉", "B": "活性碳", "C": "乾草", "D": "乙烯基乙炔"}, "answer": "D", "explain": "乙烯基乙炔等含不飽和鍵的單體會自行聚合放熱；硝化棉屬分解熱、活性碳屬吸著熱、乾草屬發酵熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-094", "topic": "防火與特殊現象", "stem": "液化之氰化氫長時間儲存時，由於水分的存在，將會進行下列何種放熱反應而自然發火（自燃）？", "opts": {"A": "分解", "B": "氧化", "C": "吸著", "D": "聚合"}, "answer": "D", "explain": "液態氰化氫在少量水分或鹼性雜質存在下會自行聚合放熱，蓄熱後可能爆炸性發火，屬聚合熱型。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-095", "topic": "防火與特殊現象", "stem": "下列何種化合物有可能因聚合反應而發熱，導致自然發火之危險？", "opts": {"A": "甲烷", "B": "乙烷", "C": "液態氰化氫", "D": "丙烷"}, "answer": "C", "explain": "甲烷、乙烷、丙烷為飽和烷類，不會聚合；液態氰化氫可自行聚合放熱，有自然發火危險。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-097", "topic": "防火與特殊現象", "stem": "物質於空氣常溫下，因化學變化而自然發熱，在空氣中立即發火，乃至因水分、濕氣之存在而緩慢或即刻發熱發火者，稱之為：", "opts": {"A": "自然發火", "B": "準自然發火", "C": "閃燃", "D": "氣爆"}, "answer": "B", "explain": "接觸空氣即發火（如黃磷）或遇水、濕氣發熱發火（如金屬鈉）者稱準自然發火；自然發火需長期蓄熱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、92消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-099", "topic": "防火與特殊現象", "stem": "準自然發火係最容易在下列何種物質中立即發火？", "opts": {"A": "液體", "B": "固體", "C": "空氣", "D": "以上皆是"}, "answer": "C", "explain": "準自然發火物質（如黃磷、烷基鋁）一接觸空氣中的氧即迅速發火，故以在空氣中最易立即發火。", "ref": "【92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-100", "topic": "危險物品", "stem": "對於準自然發火物質「金屬鈉」的敘述，下列何者錯誤？", "opts": {"A": "與水接觸，立即起火，故又稱禁水性物質", "B": "依我國危險物品之分類，是第二類物質", "C": "常用於原子爐之冷卻劑、有機溶劑中微量水分的脫水劑", "D": "燃燒時發生過氧化鈉與氫氧化鈉的白煙"}, "answer": "B", "explain": "我國公共危險物品分類中，金屬鈉屬第三類「自燃物品及禁水性物質」，不是第二類（易燃固體）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-101", "topic": "防火與特殊現象", "stem": "下列何者不為「準自然發火性物質」？", "opts": {"A": "磷化石灰", "B": "硝化棉", "C": "金屬鈉", "D": "黃磷"}, "answer": "B", "explain": "硝化棉是自行分解放熱的自然發火物質；黃磷遇空氣、金屬鈉與磷化石灰遇水即發火或放出可燃氣，屬準自然發火。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【91消佐】（(A)選項 OCR 殘缺，依上下文還原為磷化石灰）", "subject": "火災學", "src": "old"}, {"id": "F-C8-102", "topic": "防火與特殊現象", "stem": "下列敘述何者不正確？", "opts": {"A": "通常自然發火物質必須經過長期蓄熱，發火時間較準自然發火物質長", "B": "一般禁水性物質，如：磷化氫（PH₃），屬準自然發火物質", "C": "黃磷與空氣接觸的發火現象屬準自然發火", "D": "鈉與水反應起火屬自然發火"}, "answer": "D", "explain": "鈉遇水立即反應放熱並生成氫氣起火，屬準自然發火，不是需長期蓄熱的自然發火。另 (B) 以磷化氫為禁水性物質之例，用語不夠嚴謹（禁水者應為磷化鈣等），依書上答案取 D。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-104", "topic": "防火與特殊現象", "stem": "下列何種物質與水接觸或吸收空氣中水分時會發熱，本身雖不燃，卻可能與可燃物接觸而造成可燃物發火？", "opts": {"A": "鋰", "B": "鎂", "C": "漂白粉", "D": "乙醛"}, "answer": "C", "explain": "漂白粉本身不燃，吸濕後發熱並分解出氧，可使接觸的可燃物起火；鋰、鎂、乙醛本身都是可燃物。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-105", "topic": "防火與特殊現象", "stem": "下列何者與水接觸會發熱而使接觸之可燃物發火？", "opts": {"A": "漂白粉", "B": "氫化鈉", "C": "硫化磷", "D": "鎂粉"}, "answer": "A", "explain": "漂白粉吸水發熱且具氧化性，會使鄰近可燃物發火；氫化鈉、硫化磷、鎂粉是本身會燃燒或放出可燃氣的物質，題意指本身不燃者。", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-108", "topic": "煙與熱流", "stem": "因建築物內外溫度差而引起的壓力差現象稱為：", "opts": {"A": "煙囪效應", "B": "熱膨脹", "C": "風壓", "D": "浮力"}, "answer": "A", "explain": "建築物內外溫差造成空氣密度差，於垂直通道形成上下壓力差而產生流動，稱為煙囪效應。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-109", "topic": "煙與熱流", "stem": "大樓內有空調，溫度較外界低，建築物垂直管道有向下流動之氣流，稱為：", "opts": {"A": "煙囪效應", "B": "逆向煙囪效應", "C": "外部風效應", "D": "中性帶"}, "answer": "B", "explain": "室內溫度低於室外時，室內空氣較重，於垂直管道向下流動，稱逆向煙囪效應，常見於夏季空調大樓。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-110", "topic": "煙與熱流", "stem": "提高建築物的中性帶為大樓防煙對策之一，請問如何提高建築物的中性帶？", "opts": {"A": "自然排煙口設於屋頂", "B": "自然排煙口設於底層", "C": "不要設自然排煙口", "D": "底層開口面積愈大愈好"}, "answer": "A", "explain": "中性帶位置會偏向開口較大的一側；於屋頂設排煙口加大上部開口可使中性帶上移，減少煙從各樓層流出。", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-111", "topic": "煙與熱流", "stem": "為避免火場中發生煙囪效應，下列所述的防救災方式何者較優？", "opts": {"A": "加強水線佈署", "B": "建築物使用防焰材料", "C": "使用樓雲梯車救災", "D": "加強垂直空間（管道間等）的防煙（火）區劃"}, "answer": "D", "explain": "煙囪效應發生在樓梯間、管道間等垂直貫通空間，做好垂直空間的防火防煙區劃才能從源頭阻斷。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-113", "topic": "煙與熱流", "stem": "一般在模擬計算建築物火災中的煙囪效應（stack effect）時，於中性面（neutral plane）上高度h（m）的位置，因浮力所造成建築物室內外的壓力差Δp（N/m²）為何？（Tᵢ：室內溫度；T₀：室外溫度；ρᵢ：溫度Tᵢ時空氣密度；ρ₀：溫度T₀時空氣密度；g＝9.8 m/s²）", "opts": {"A": "Δp＝(ρ₀－ρᵢ)gh", "B": "Δp＝(T₀－Tᵢ)gh", "C": "Δp＝(ρ₀－ρᵢ)ghT₀", "D": "Δp＝[(ρ₀－ρᵢ)/(T₀－Tᵢ)]gh"}, "answer": "A", "explain": "壓力差等於兩段等高空氣柱的重量差，即密度差×g×高度；以溫度差直接乘 gh 或再乘 T₀ 皆單位不符。", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-114", "topic": "煙與熱流", "stem": "承上題，一般表示壓力差Δp的方程式，亦可以理想氣體方程式（PV＝nRT）換算求得，其換算結果壓力差Δp（N/m²）約為何？（一大氣壓＝101325 N/m²，R＝8.31 J/K·mol，一莫耳空氣質量為0.02895 kg）", "opts": {"A": "Δp＝3.5×10³×(1/T₀－1/Tᵢ)²×h", "B": "Δp＝3.5×10³×(T₀－Tᵢ)×h", "C": "Δp＝(1.75×10³/h)×(1/T₀－1/Tᵢ)", "D": "Δp＝3.5×10³×(1/T₀－1/Tᵢ)×h"}, "answer": "D", "explain": "ρ＝PM/RT，代入 Δp＝(ρ₀－ρᵢ)gh 得 Δp＝(PMg/R)(1/T₀－1/Tᵢ)h；PMg/R＝101325×0.02895×9.8/8.31≒3459≒3.5×10³。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-115", "topic": "熱傳", "stem": "在建築物火災中，天花板會向地面放射大量輻射熱，促進地面可燃物之燃燒速度，此種現象即為密閉空間具有之何種效果？", "opts": {"A": "煙囪效應", "B": "逆煙囪效應", "C": "輻射能回饋效果", "D": "熱傳導回饋效果"}, "answer": "C", "explain": "高溫天花板與熱煙層向下輻射，加熱地面可燃物使其熱分解加快、燃燒加速，稱為輻射能回饋效果，是促成閃燃的主因之一。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、89消佐、91警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-116", "topic": "防火與特殊現象", "stem": "在電氣火災研究中，「橡膠、木材等絕緣物中，受電氣火花而碳化時，碳化部分會逐漸形成微量之結晶，而變具有導電性，亦即有機物之導電化現象」稱為？", "opts": {"A": "金原現象", "B": "層間短路", "C": "沿面放電", "D": "積污導電現象"}, "answer": "A", "explain": "有機絕緣物受火花碳化成石墨化導電路徑的現象稱為金原現象（石墨化現象）；積污導電則是表面附著電解質造成的沿面放電。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【87、89、93消佐、90、91、94警技】（改編為單選，刪除原(E)氧化亞銅增殖發熱現象）", "subject": "火災學", "src": "old"}, {"id": "F-C8-118", "topic": "防火與特殊現象", "stem": "不飽和油脂自然發火之危險性通常以碘價判斷之，碘價在多少以上時，可視具有相當之危險？", "opts": {"A": "100", "B": "130", "C": "170", "D": "200"}, "answer": "B", "explain": "碘價代表油脂不飽和程度，愈高愈易氧化發熱；一般碘價 130 以上即視為有自然發火危險（亞麻仁油約 200）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91、94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-119", "topic": "防火與特殊現象", "stem": "絕緣物表面因附著有水分、灰塵等少量之電解質物質，而生小規模之放電，結果形成異極電流之通路，乃致絕緣物失掉絕緣性者，係屬下列何者？", "opts": {"A": "短路", "B": "漏電", "C": "積污導電", "D": "金原現象"}, "answer": "C", "explain": "絕緣物表面積污（水分、灰塵、鹽分）形成放電通路而失去絕緣，稱積污導電；金原現象是絕緣物本身碳化導電。", "ref": "【90、92士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-121", "topic": "防火與特殊現象", "stem": "積污導電現象其發生的放電為：", "opts": {"A": "電弧放電", "B": "靜電放電", "C": "條狀放電", "D": "沿面放電"}, "answer": "D", "explain": "積污導電的小規模放電沿絕緣物表面發生，屬沿面放電。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-122", "topic": "火災", "stem": "若一建築之開口部面積為4 m²，開口部之垂直高度為2 m，室內之長寬高各為4 m×3 m×3 m，試問其溫度因子為多少？", "opts": {"A": "0.05", "B": "0.065", "C": "0.075", "D": "0.085"}, "answer": "D", "explain": "溫度因子＝A_w√H／A_T；A_T＝2×(4×3＋4×3＋3×3)＝66 m²，故＝4×√2÷66≒0.0857，約 0.085。", "ref": "【92警技】（改編為單選，刪除原(A)0.045）", "subject": "火災學", "src": "old"}, {"id": "F-C8-123", "topic": "燃燒", "stem": "假如 m″ 為單位面積質量流率（kg/m²·s），ΔH_c 為燃燒熱（kJ/g），A_f 為燃料表面積（m²），χ 為源自於燃燒不完全的燃燒因子（χ＜1.0），則一般在計算火災中的熱釋放率 Q̇_c 方程式為何？", "opts": {"A": "Q̇_c＝χ·m″·A_f^(1/2)·ΔH_c", "B": "Q̇_c＝χ·m″·A_f·ΔH_c^(1/2)", "C": "Q̇_c＝χ·m″·(A_f·ΔH_c)^(1/2)", "D": "Q̇_c＝χ·m″·A_f·ΔH_c"}, "answer": "D", "explain": "熱釋放率＝燃燒效率×單位面積質量燃燒速率×燃燒面積×燃燒熱，各項皆為一次方相乘，任何開根號都會使單位不符。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【93警技】", "subject": "火災學", "src": "old"}, {"id": "F-C8-124", "topic": "燃燒", "stem": "所謂燃燒速度係指下列何者？", "opts": {"A": "延燒速度", "B": "火焰傳播速度", "C": "可燃物之燃燒擴展速度", "D": "可燃物因燃燒而逐漸減少其重量之速度"}, "answer": "D", "explain": "火災學中的燃燒速度指單位時間內可燃物因燃燒而減少的重量（kg/min）；延燒、火焰傳播速度描述的是火勢擴展快慢。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【消佐（年份不詳）、94士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-125", "topic": "火災", "stem": "所謂燃燒速度R之值，是和開口部之「面積」與「高度的平方根」二者相乘積成正比，若開口部之面積增大為原來二倍，其它條件不變時，依理論計算，R值為原來值的多少？", "opts": {"A": "四分之一", "B": "二分之一", "C": "二倍", "D": "四倍"}, "answer": "C", "explain": "R∝A√H，H 不變時 R 與 A 成正比，面積加倍則 R 為原來 2 倍。", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-128", "topic": "火災", "stem": "建築物火災中，下列何者與火災最盛期的持續時間長短無密切的關係？", "opts": {"A": "火焰悶燒的時間", "B": "可燃物的數量", "C": "可燃物與空氣接觸面積", "D": "密閉空間開口部大小"}, "answer": "A", "explain": "最盛期持續時間≒可燃物量÷燃燒速度，燃燒速度又受開口大小與可燃物表面積影響；悶燒時間屬初期或衰退期，與最盛期長短無直接關係。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-129", "topic": "火災", "stem": "下列有關區劃空間閃燃後燃料的燃燒率與通風因子之間關係，何者不正確？", "opts": {"A": "通風因子較大時，燃燒方式為通風控制燃燒", "B": "火災室內與室外的通風自由時，燃燒方式為燃料表面積控制之燃燒型式", "C": "通風因子可由伯努利方程式推導得出", "D": "通風因子最初由川越邦雄等人按經驗方式推導出"}, "answer": "A", "explain": "通風因子（A√H）大表示進氣充足，燃燒速率由燃料表面積決定，屬燃料控制燃燒；通風因子小時才是通風控制燃燒。", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-130", "topic": "火災", "stem": "根據P.H.Thomas的研究，建築物在通風控制燃燒時，所謂燃燒速度R（kg/min）值，是和開口部之「面積A」與「開口高度H」有關，其關係式為何？", "opts": {"A": "R＝(5.5～6.0)×A×H", "B": "R＝(5.5～6.0)×A×√H", "C": "R＝(5.5～6.0)×√A×H", "D": "R＝(5.5～6.0)×√(A×H)"}, "answer": "B", "explain": "通風控制燃燒時燃燒速度與通風因子 A√H 成正比：R＝(5.5～6.0)A√H kg/min（約 0.09A√H kg/s）。", "ref": "【91、93警技、92消佐】（改編為單選，刪除原(E)R＝(5.5～6.0)×(A×H)^(1/3)）", "subject": "火災學", "src": "old"}, {"id": "F-C8-133", "topic": "火災", "stem": "火災進入最盛期，其持續時間之長短與多種因素有關，一般而言，該時期之燃燒可分為通風控制燃燒及燃料控制燃燒兩類，下列有關燃料控制燃燒之敘述何者錯誤？", "opts": {"A": "燃燒速度與通風量無關", "B": "燃燒速度由燃料表面積所控制", "C": "因室外較暖空氣之大量滲入，使室溫升高，延燒持續時間延長", "D": "容易經由開口向上層延燒"}, "answer": "C", "explain": "燃料控制燃燒時開口大，大量較冷的外氣流入使室溫較低，且可燃物燒得快，持續時間較短；火焰易從大開口噴出向上層延燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【94消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-134", "topic": "火災", "stem": "耐火建築物火災達最盛期，因可燃物量或空氣量的因素，可分為通風控制燃燒及燃料控制燃燒，其中何處的火災現象較易為通風狀況所控制？", "opts": {"A": "走廊", "B": "陽台", "C": "樓梯間", "D": "地下室"}, "answer": "D", "explain": "地下室開口少、進氣受限，燃燒速度受進入空氣量控制，最易形成通風控制燃燒。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-C8-136", "topic": "煙與熱流", "stem": "若建築物內部空氣溫度為27℃，著火房間溫度為627℃，流入著火房間的空氣體積流率為3 m³/s，則流出著火房間的煙氣體積流率約為：", "opts": {"A": "6 m³/s", "B": "9 m³/s", "C": "12 m³/s", "D": "15 m³/s"}, "answer": "B", "explain": "質量流率守恆且密度與絕對溫度成反比，Q_out＝Q_in×T_out/T_in＝3×(627＋273)/(27＋273)＝9 m³/s。", "ref": "【91士】", "subject": "火災學", "src": "old"}, {"id": "F-C8-137", "topic": "煙與熱流", "stem": "火場中所產生大量之煙霧，因密度低而具浮力，一般表示著火房間內所生的壓差方程式為何？（P：壓差（Pa）；K_s：常數（3460 Pa·K/m）；T₀：室外溫度（K）；T_F：室內溫度（K）；h：距中性帶距離（m））", "opts": {"A": "P＝K_s×(1/T₀－1/T_F)^(1/2)×h", "B": "P＝K_s×(T₀－T_F)×h", "C": "P＝(K_s/h)×(1/T₀－1/T_F)", "D": "P＝K_s×(1/T₀－1/T_F)×h"}, "answer": "D", "explain": "由理想氣體密度 ρ∝1/T 代入 ΔP＝Δρgh，得 P＝K_s(1/T₀－1/T_F)h，壓差與距中性帶高度成正比。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91警技】（改編為單選，刪除原(D)殘缺選項）", "subject": "火災學", "src": "old"}, {"id": "F-X1-001", "topic": "火災", "stem": "木造建築物室內火災之進行狀況可區分成數階段，以流程表示為 O→A→B→C，其中 O 至 A 為第一成長期，A 至 B 為第二成長期，B 至 C 為最盛期，C 以後為衰退期。試問何時為木造建築室內火災溫度之最高點？", "opts": {"A": "A至B間", "B": "B至C間", "C": "B點", "D": "C點"}, "answer": "C", "explain": "依書上解答，木造建築火災在由成長期進入最盛期的轉折點（B點）附近溫度急升達最高。A至B仍在升溫，C點以後進入衰退，溫度下降。此題階段定義依書本圖示，不同教材標示可能不同。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【87警技】（原題有(E)，刪去明顯錯誤之「O至A間」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-X1-002", "topic": "火災", "stem": "木造建築物火災的溫度變化，下列何者正確？", "opts": {"A": "與燃燒速度成反比", "B": "與室外氣溫成正比", "C": "與室內表面積成反比", "D": "以上皆非"}, "answer": "C", "explain": "室內火災溫度取決於溫度因子（開口因子 A√H 除以室內總表面積），室內表面積愈大、散熱面愈大，溫度愈低，故成反比。燃燒速度愈快溫度愈高，並非反比；室外氣溫影響甚微。", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-003", "topic": "防火與特殊現象", "stem": "依照建築技術規則建築設計施工編之規定，高層建築物之定義係：", "opts": {"A": "高度在五十公尺或樓層在十六層以上之建築物", "B": "高度在四十五公尺或樓層在十五層以上之建築物", "C": "高度在四十公尺或樓層在十二層以上之建築物", "D": "高度在三十公尺或樓層在十五層以上之建築物"}, "answer": "A", "explain": "建築技術規則設計施工編第227條：高層建築物指高度在五十公尺或樓層在十六層以上之建築物。OCR 原文(A)作「十五層」，與法規不符，已依法規更正為十六層。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【87消佐、士】", "subject": "火災學", "src": "old"}, {"id": "F-X1-004", "topic": "防火與特殊現象", "stem": "高樓防火區劃設計最重要應考慮到下列何項因素？", "opts": {"A": "內部之可燃物量", "B": "發生火災燃燒時間", "C": "牆壁之防火時效", "D": "長期荷重因素"}, "answer": "C", "explain": "防火區劃的功能是把火侷限在區劃內，關鍵在區劃構件（牆、樓板、門）能撐多久，即防火時效。可燃物量與燃燒時間是決定所需時效的輸入條件，長期荷重屬結構設計考量。書上未附答案，此為判定。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-005", "topic": "火災", "stem": "高樓建築物火災的特性，下列何者錯誤？", "opts": {"A": "濃煙密布", "B": "逃生不易", "C": "救災困難", "D": "不易延燒"}, "answer": "D", "explain": "高樓有管道間、樓梯間等垂直通道，易產生煙囪效應，火煙迅速向上延燒，故「不易延燒」錯誤。濃煙密布、逃生不易、救災困難皆為高樓火災特性。原(D)選項 OCR 殘缺僅剩「延燒」，依題意補為「不易延燒」。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-006", "topic": "火災", "stem": "下列有關高層建築物與地下建築物火災特性之敘述，何者有誤？", "opts": {"A": "二者在救火時，通常均需利用樓（電）梯到達起火點", "B": "二者一旦起火，各層頓時陷入危險，搶救不易", "C": "二者均屬逃生不易，人命威脅大", "D": "二者均易產生高溫濃煙"}, "answer": "B", "explain": "火災通常由起火層逐步向其他樓層擴大，並非一起火各層就頓時陷入危險，故(B)有誤。二者均需經樓梯進入、逃生不易、易生高溫濃煙，皆正確。書上未附答案，此為判定。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【90士】", "subject": "火災學", "src": "old"}, {"id": "F-X1-007", "topic": "火災", "stem": "下列何者非地下建築物火災特殊之處？", "opts": {"A": "火災現象瞬息萬變", "B": "搶救困難", "C": "火勢掌握容易", "D": "水損嚴重"}, "answer": "C", "explain": "地下建築物出入口少、煙熱滯留、視線差，火勢難以掌握，故「火勢掌握容易」不是其特性。其餘瞬息萬變、搶救困難、水損嚴重（積水排不出）皆為特殊之處。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【89消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-008", "topic": "火災", "stem": "影響山林火災燃燒的因素，下列何者為非？", "opts": {"A": "地表植物種類若為混生之灌木雜草時，易由地表火發展成樹幹火", "B": "山林樹種若多為闊葉林，延燒速度會較慢", "C": "山林土地中若存有泥炭層、亞炭層及其他可燃性有機物質時，易形成地中火，不但不易滅火，且每小時延燒速度約達15公里", "D": "地表上可燃物若較為豐富且林地屬於較乾燥的針葉林，易成激烈火勢的山林火災"}, "answer": "C", "explain": "地中火在地下有機層中悶燒，氧氣供應少，延燒極為緩慢（每小時僅數公尺等級），不可能達每小時15公里；其難滅火的敘述是對的，錯在速度。闊葉林含水多延燒慢、針葉林乾燥易激烈燃燒皆正確。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【88警技、88士】（原題有(E)，刪去正確敘述「山林火災延燒時通常不易向山脊斜面側方燃燒」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-X1-009", "topic": "危險物品", "stem": "化災之搶救人員進入災害現場，採取行動前應瞭解之事項，下列何者非屬必要？", "opts": {"A": "面對何種情況", "B": "支援現場搶救人數", "C": "處理何種化學品", "D": "需何種裝備器材"}, "answer": "B", "explain": "進入化災現場前必須先掌握狀況、化學品種類與所需防護裝備器材，才能確保安全。支援人數屬指揮調度事項，並非搶救人員進場前必須瞭解的事。OCR 題幹作「何者屬必要」，依選項結構判斷應缺「非」字，已補正。（本題書上未附答案，答案由 AI 判定，僅供參考）（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【94士】", "subject": "火災學", "src": "old"}, {"id": "F-X1-010", "topic": "危險物品", "stem": "在進行化學物質災害的搶救部署時，最重要的基本概念為：", "opts": {"A": "動作快", "B": "方法對", "C": "勇氣高", "D": "出水大"}, "answer": "B", "explain": "化學物質性質各異，有些遇水反應或擴大污染，搶救首重依物質特性選擇正確方法。一味求快、逞勇或大量出水反而可能擴大災害。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-012", "topic": "危險物品", "stem": "化學物質災害、工廠災害進行消防搶救時，有下列相關參考資料：(1)毒性化學物質防救手冊 (2)物質安全資料表 (3)緊急應變指南，其適用優先順序為：", "opts": {"A": "(1)(2)(3)", "B": "(1)(3)(2)", "C": "(2)(3)(1)", "D": "(3)(2)(1)"}, "answer": "A", "explain": "依消防署處理涉及化學物質災害注意事項，資料愈針對特定物質愈優先：先用毒性化學物質防救手冊，其次物質安全資料表，最後才用通用性的緊急應變指南。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、91消佐、92警技】", "subject": "火災學", "src": "old"}, {"id": "F-X1-013", "topic": "危險物品", "stem": "化學物質災害搶救程序第一步驟是：", "opts": {"A": "區域管制", "B": "進入搶救", "C": "請求支援", "D": "危害辨識"}, "answer": "D", "explain": "H.A.Z.M.A.T. 程序以 H（Hazard identification，危害辨識）為首，先確認是何種危害物質，才能決定管制範圍、防護與搶救方式。區域管制、請求支援都在其後。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90警技】（原題有(E)，刪去「除污」改編為單選）", "subject": "火災學", "src": "old"}, {"id": "F-X1-014", "topic": "危險物品", "stem": "化學物質災害、工廠災害消防搶救程序的指導要領為 H.A.Z.M.A.T.，其中 H 是指：", "opts": {"A": "危害辨認", "B": "行動方案", "C": "區域管制", "D": "請求支援"}, "answer": "A", "explain": "H 為 Hazard identification（危害辨認）。第一個 A 為行動方案（Action plan），Z 為區域管制（Zoning），第二個 A 為請求支援（Assistance）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90、93消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-015", "topic": "危險物品", "stem": "「除污」應在下列何種「化學物質災害、工廠災害消防搶救程序」中加以執行？", "opts": {"A": "善後處理", "B": "行動方案", "C": "建立管理系統", "D": "請求支援"}, "answer": "A", "explain": "除污屬 T（Termination，善後處理），在任務完成、離開現場前執行，避免把危害物帶到他處或與不相容物混合。其餘步驟不以除污為主要內容。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-016", "topic": "危險物品", "stem": "化學物質災害發生時，進行區域管制可分三個區域來管制，下列分區方式何者錯誤？", "opts": {"A": "禁區、除污區、支援區", "B": "熱區、溫區、冷區", "C": "紅區、黃區、綠區", "D": "A區、B區、C區"}, "answer": "D", "explain": "化災管制區常見三種稱呼：禁區／除污區／支援區、熱區／溫區／冷區、紅區／黃區／綠區，三者一一對應。「A區、B區、C區」並非慣用分區名稱。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【90消佐、94士】", "subject": "火災學", "src": "old"}, {"id": "F-X1-017", "topic": "危險物品", "stem": "化學物質災害應迅速建立管制區，以降低危害性化學物質之危害，管制區通常分成三區域，其中除污區又稱為：", "opts": {"A": "紅色區", "B": "黃色區", "C": "熱區", "D": "冷區"}, "answer": "B", "explain": "除污區位於中間，又稱溫區或黃色區。紅色區即熱區（禁區），冷區為綠色區（支援區）。（本題書上未附答案，答案由 AI 判定，僅供參考）", "ref": "【91消佐】", "subject": "火災學", "src": "old"}, {"id": "F-X1-018", "topic": "煙與熱流", "stem": "在火場中會因吸入下列何種氣體，導致阻礙紅血球輸氧功能而造成窒息死亡？", "opts": {"A": "一氧化碳", "B": "一氧化氮", "C": "二氧化碳", "D": "硫化氫"}, "answer": "A", "explain": "一氧化碳與血紅素的親和力約為氧的200倍以上，形成碳氧血紅素，使紅血球無法攜氧而窒息。二氧化碳主要是稀釋氧氣與刺激呼吸，硫化氫則主要抑制細胞呼吸酵素。", "ref": "【107專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-019", "topic": "危險物品", "stem": "依據美國防火協會（NFPA）規定，下列有關可燃液體與易燃液體之敘述，何者正確？", "opts": {"A": "可燃液體係指閃火點大於或等於100°F（37.8℃）之液體", "B": "可燃液體係指閃火點大於100°F（37.8℃），小於140°F（60℃）之液體", "C": "易燃液體係指沸點小於或等於100°F（37.8℃）之液體", "D": "易燃液體係指自燃溫度小於或等於100°F（37.8℃）之液體"}, "answer": "A", "explain": "NFPA 以閃火點 100°F（37.8℃）為界：閃火點低於此者為易燃液體，大於或等於者為可燃液體。(B)只是可燃液體中的 Class II 範圍；(C)(D)把判定依據錯用成沸點、自燃溫度。", "ref": "【107專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-020", "topic": "防火與特殊現象", "stem": "下列有關建築物火災「閃燃」（flashover）現象之敘述，何者錯誤？", "opts": {"A": "「閃燃」現象通常發生在建築物火災的成長期", "B": "一旦發生「閃燃」現象，該居室中的人即無法生存", "C": "就「閃燃時間」（F.O.T.）而言，同種類等面積之裝潢材料中影響最大部位為壁面", "D": "在避難對策上，延遲建築物火災到達「閃燃」階段，至為重要"}, "answer": "C", "explain": "熱煙層聚集在天花板下，天花板裝潢材料受熱最早最強，對閃燃時間影響最大，其次才是壁面，故(C)錯誤。閃燃發生於成長期末、發生後室內無法存活、延遲閃燃利於避難，皆正確。", "ref": "【107專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-021", "topic": "爆炸", "stem": "下列哪一個可燃性氣體產生火災爆炸之風險最低？", "opts": {"A": "燃燒界限16%～25%", "B": "燃燒界限7.3%～36%", "C": "燃燒界限5.3%～18%", "D": "燃燒界限4.0%～75%"}, "answer": "A", "explain": "危險度 H＝(上限－下限)／下限。(A)＝(25－16)/16≈0.56，(B)≈3.93，(C)≈2.40，(D)＝17.75，(A)燃燒範圍窄且下限高，風險最低。", "ref": "【107專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-022", "topic": "危險物品", "stem": "根據美國防火協會危險物品標示規定，將危險類別記載於菱形方塊上，其中黃色表示何種危害？", "opts": {"A": "可燃性", "B": "反應性", "C": "有害健康毒性", "D": "禁水性"}, "answer": "B", "explain": "NFPA 704 菱形標示：藍色為健康危害、紅色為可燃性、黃色為反應性（不穩定性），白色為特殊危害（如禁水 W）。", "ref": "【107專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-023", "topic": "危險物品", "stem": "危害物質災害現場搶救標準作業程序（H.A.Z.M.A.T.）之說明，下列何者為正確？", "opts": {"A": "H表示災區管制", "B": "Z表示善後處理", "C": "T表示行動方案", "D": "M表示建立管理系統"}, "answer": "D", "explain": "M 為 Management，建立管理系統。H 是危害辨識、Z 是區域管制、T 是善後處理、第一個 A 是行動方案，其餘選項都張冠李戴。", "ref": "【107專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-024", "topic": "燃燒", "stem": "可燃物於無明火等火源之條件下，在大氣中僅因受熱而開始自行燃燒所需之最低溫度稱為下列何者？", "opts": {"A": "自燃溫度", "B": "閃點", "C": "沸點", "D": "閃燃點"}, "answer": "A", "explain": "不需外部火源、單靠加熱即自行起燃的最低溫度為自燃溫度（發火點）。閃點需有外部火源才能引燃蒸氣；沸點是物理相變溫度。", "ref": "【107專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-025", "topic": "熱傳", "stem": "描述熱傳遞（heat transfer）之物理量為下列何者？", "opts": {"A": "溫度", "B": "熱通量", "C": "熱釋放率", "D": "熱焓"}, "answer": "B", "explain": "熱通量是單位時間通過單位面積的熱量（kW/m²），直接描述熱傳遞的強度。溫度是狀態量，熱釋放率描述火源大小，熱焓是能量狀態函數。", "ref": "【107專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-026", "topic": "防火與特殊現象", "stem": "要做好火災預防工作，從理論觀點上，可由火災預防之「3E政策」著手，下列敘述何者不屬於「3E政策」項目？", "opts": {"A": "防火工程", "B": "防火教育", "C": "防火執法", "D": "防火熱忱"}, "answer": "D", "explain": "3E 為 Engineering（工程）、Education（教育）、Enforcement（執法）。熱忱（Enthusiasm）雖也是 E 開頭，但不屬於 3E 政策。", "ref": "【107專技士 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-027", "topic": "滅火", "stem": "下列有關二氧化碳滅火劑之敘述，何者錯誤？", "opts": {"A": "二氧化碳滅火劑滅火後不留痕跡", "B": "二氧化碳氣體比重約為1.5，滅火時可覆蓋在燃燒物體表面", "C": "二氧化碳為無害氣體，故二氧化碳系統噴灑時，應留在現場繼續警戒", "D": "二氧化碳滅火劑氣化時，可以發揮冷卻作用"}, "answer": "C", "explain": "二氧化碳滅火設計濃度遠高於人體可承受程度，會造成窒息，系統放射前人員必須撤離，故(C)錯誤。不留殘跡、比空氣重可覆蓋、氣化吸熱冷卻皆正確。", "ref": "【107專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-028", "topic": "防火與特殊現象", "stem": "在高科技無塵室作業中，下列敘述何者不是避免人員帶靜電產生危害之處理方式？", "opts": {"A": "無塵室鋪設導電地板", "B": "進入無塵室前先進入風淋室", "C": "作業人員穿戴導電物品（如無塵帽、衣、褲、鞋等）", "D": "無塵室維持相對濕度在80%以上"}, "answer": "D", "explain": "依書上解答，無塵室為製程需求須控制在中等濕度，維持80%以上高濕並非可行的防靜電作法；導電地板、導電衣物可讓人體電荷洩放。惟風淋室主要功能是除塵而非除靜電，此題選項有爭議。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【107專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-029", "topic": "燃燒", "stem": "下列何者並非容易悶燒材料之特性？", "opts": {"A": "多孔", "B": "易產生焦化層", "C": "容易悶燒之材料亦容易自燃", "D": "閃火點低"}, "answer": "D", "explain": "悶燒是固體表面的無焰氧化，好發於多孔、易炭化形成焦化層的材料，且這類材料常也易蓄熱自燃。閃火點低是易燃液體的特性，與悶燒無關。", "ref": "【107專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-030", "topic": "燃燒", "stem": "假設大氣中氧氣容積為21%，現在一密閉空間（體積為V）內，三分之一體積（V/3）為惰性氣體時（壓力仍為一大氣壓），該空間內氧氣濃度為多少%？", "opts": {"A": "7%", "B": "11%", "C": "14%", "D": "18%"}, "answer": "C", "explain": "剩下 2/3 體積為空氣，氧濃度＝21%×2/3＝14%。", "ref": "【107專技士 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-031", "topic": "火災", "stem": "我國在106年實施A1、A2、A3新式火災認定方式，下列有關A2火災認定之敘述，何者錯誤？", "opts": {"A": "是指造成人員死亡之火災案件", "B": "是指造成人員受傷之火災案件", "C": "是指涉及糾紛、縱火案件", "D": "是指起火原因待查之火災案件"}, "answer": "A", "explain": "造成人員死亡（含24小時內死亡）者屬A1類火災，不是A2；A2類為造成人員受傷，或涉及糾紛、縱火、原因待查等需調查之案件。OCR 題幹作「A火災」，依書上答案(A)推定應為「A2火災」。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【107專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-032", "topic": "煙與熱流", "stem": "有一火場之減光係數為 2 m⁻¹，請問發光物體之能見度為多少公尺？", "opts": {"A": "2公尺", "B": "4公尺", "C": "6公尺", "D": "8公尺"}, "answer": "B", "explain": "發光物體能見度 V＝K/Cs，K 取 8：V＝8/2＝4 公尺（反光物體 K 約 2～4，能見度較短）。", "ref": "【107專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-033", "topic": "滅火", "stem": "下列何者為海龍替代品滅火藥劑 FE-13 之分子式？", "opts": {"A": "CF₃Br", "B": "CHF₃", "C": "CFBr₃", "D": "CF₃Cl"}, "answer": "B", "explain": "FE-13 即 HFC-23，三氟甲烷 CHF₃，不含溴、氯，不破壞臭氧層。CF₃Br 是海龍1301本身，CF₃Cl 為 CFC-13，都不是替代品。", "ref": "【107專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-034", "topic": "火災", "stem": "有關地下建築物火災之敘述，下列何者錯誤？", "opts": {"A": "容易造成水損", "B": "起火點發現困難", "C": "地下樓層有限，搶救工作容易", "D": "可以使用紅外線火源探測器，以及早發現火源"}, "answer": "C", "explain": "地下建築物進出口少、煙熱無處排放、視線不佳，搶救困難，與樓層數多寡無關，故(C)錯誤。水損、起火點難發現、以火焰探測器及早偵知皆合理。", "ref": "【107專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-035", "topic": "火災", "stem": "已知木造倉庫高6公尺，如延燒係數為0.15，依木造建築物火災溫度標準曲線，其鄰棟建築物之理論安全距離應在多少公尺以上？", "opts": {"A": "5.4公尺", "B": "6.3公尺", "C": "9公尺", "D": "12.1公尺"}, "answer": "B", "explain": "延燒限界曲線 H＝p·d²，d＝√(H/p)＝√(6/0.15)＝√40≈6.32 公尺。", "ref": "【107專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-036", "topic": "火災", "stem": "電線因火災燒熔而短路所形成之熔珠，稱為下列何者？", "opts": {"A": "一次痕", "B": "二次痕", "C": "過電痕", "D": "過載痕"}, "answer": "B", "explain": "火災先發生、燒毀絕緣後才短路所留下的熔痕為二次痕，是火災的結果。一次痕則是短路先發生、成為起火原因時形成的熔痕。", "ref": "【107專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-037", "topic": "防火與特殊現象", "stem": "為防止由窗口噴出的火焰向大樓上層延燒，下列措施何者錯誤？", "opts": {"A": "加大窗戶開口部的面積", "B": "增加上下樓層窗戶間的側壁長度", "C": "窗戶上下加設向外突出之平台", "D": "儘量降低屋內火載量"}, "answer": "A", "explain": "開口愈大，噴出火焰愈大、愈貼近外牆，更易向上層延燒，故(A)錯誤。加長上下窗間牆（spandrel）、設突出遮簷（陽台）、降低火載量都能抑制上層延燒。", "ref": "【107專技士 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-038", "topic": "防火與特殊現象", "stem": "油罐車在灌裝作業中，其累積電壓為16 kV（其體積為20 m³，電容為1000 pF），試估算此作業所產生靜電能量為多少毫焦耳（mJ）？", "opts": {"A": "32 mJ", "B": "64 mJ", "C": "128 mJ", "D": "256 mJ"}, "answer": "C", "explain": "E＝½CV²＝0.5×1000×10⁻¹²×(16000)²＝0.128 J＝128 mJ。體積為干擾數據。", "ref": "【107專技士 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-039", "topic": "燃燒", "stem": "燃燒塔每分鐘需消耗5.8 kg之丁烷（C₄H₁₀），請估算在NTP（25℃、1大氣壓）之條件下，此燃燒塔每小時所需之燃燒理論空氣體積約為下列何者？", "opts": {"A": "1250 m³", "B": "3600 m³", "C": "4540 m³", "D": "5600 m³"}, "answer": "C", "explain": "丁烷分子量58，5.8 kg＝100 mol/min；C₄H₁₀＋6.5O₂→4CO₂＋5H₂O，需氧650 mol/min，空氣＝650/0.21≈3095 mol/min，每小時約185,714 mol，×24.45 L/mol≈4540 m³。", "ref": "【107專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-040", "topic": "熱傳", "stem": "熱傳導之熱流動方向為何？", "opts": {"A": "高溫傳向低溫", "B": "高熱通量傳向低熱通量", "C": "高熱量傳向低熱量", "D": "高熱傳係數材料傳向低熱傳係數材料"}, "answer": "A", "explain": "依傅立葉定律，熱流沿溫度梯度方向由高溫流向低溫，驅動力是溫差。熱量多寡、熱通量或材料熱傳係數都不決定方向。", "ref": "【107專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-041", "topic": "燃燒", "stem": "容易著火之燃料具下列何種特性？", "opts": {"A": "熱傳係數低", "B": "密度高", "C": "比熱高", "D": "接近固體"}, "answer": "A", "explain": "熱傳係數低的材料受熱時熱量不易往內部散失，表面溫度快速上升而易著火（熱慣性 kρc 愈小愈易著火）。密度高、比熱高都使升溫變慢。(B)(D)選項原文 OCR 殘缺，依題意補為「密度高」「接近固體」。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【107專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-042", "topic": "防火與特殊現象", "stem": "下列何者並非複燃（backdraft）發生之原因？", "opts": {"A": "通風不佳", "B": "燃料濃度高於可燃上限", "C": "空氣忽然進入", "D": "具爆裂物"}, "answer": "D", "explain": "複燃是通風不良的空間累積高於燃燒上限的可燃氣體，當門窗打開、空氣突然進入稀釋至燃燒範圍而爆燃。與爆裂物存在無關。", "ref": "【107專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-043", "topic": "火災", "stem": "在火勢擴大的過程中，下列哪一現象並非成長期的常見特徵？", "opts": {"A": "煙層變厚", "B": "火焰延燒", "C": "材料自燃", "D": "火場溫度增加"}, "answer": "C", "explain": "成長期火焰沿可燃物延燒、煙層逐漸加厚下降、溫度持續上升。室內材料因輻射熱普遍自燃是閃燃及最盛期的現象，不是成長期的常見特徵。", "ref": "【107專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-044", "topic": "火災", "stem": "下列何者並非高科技廠房火災之特性？", "opts": {"A": "火載量大", "B": "多功效乾粉滅火器為滅火第一選擇", "C": "極早型偵煙器偵測火災效果佳", "D": "燃料種類多"}, "answer": "B", "explain": "乾粉會污染精密設備與無塵環境，造成嚴重二次損失，並非高科技廠房的首選滅火方式。火載量大、燃料種類多、以極早期偵煙探測器偵測皆是其特性。", "ref": "【107專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-045", "topic": "火災", "stem": "下列何者並非古蹟火災防護之特性？", "opts": {"A": "滅火設備不易設置", "B": "防火區劃不完整", "C": "滅火水量應加大", "D": "木造可燃物多"}, "answer": "C", "explain": "古蹟文物怕水損，射水應節制而非加大水量，故(C)不是其防護特性。為保存原貌不易加裝設備、區劃不完整、木構造多，皆為古蹟火災特性。", "ref": "【107專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-046", "topic": "火災", "stem": "下列何者並非學校實驗室火災之特性？", "opts": {"A": "化學藥品眾多", "B": "防火毯為常用之滅火方式", "C": "水為主要的滅火藥劑", "D": "安全資料表為必備之資料"}, "answer": "C", "explain": "實驗室有禁水性、易燃液體等多種化學品，用水可能引發反應或擴大火勢，水不宜作為主要滅火劑。藥品多、常用防火毯覆蓋小火、須備安全資料表皆正確。", "ref": "【107專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-047", "topic": "燃燒", "stem": "固體燃料火焰延燒最快的方式為下列何者？", "opts": {"A": "向上", "B": "向下", "C": "水平", "D": "與延燒方向無關"}, "answer": "A", "explain": "向上延燒時火焰與熱氣流貼附在未燃燒面上，對流與輻射預熱效率最高，速度最快；水平次之，向下最慢。", "ref": "【107專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-048", "topic": "火災", "stem": "下列何者並非造成電氣火災的原因？", "opts": {"A": "短路", "B": "斷路", "C": "積污導電", "D": "半斷線"}, "answer": "B", "explain": "完全斷路時電流中斷，不會發熱。短路產生大電流、積污導電造成漏電起火（追蹤）、半斷線使截面變小局部過熱，都會引起電氣火災。", "ref": "【107專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-049", "topic": "防火與特殊現象", "stem": "下列何者並非防火區劃構件構造之性質？", "opts": {"A": "遮焰性", "B": "阻熱性", "C": "滅火性", "D": "遮煙性"}, "answer": "C", "explain": "防火區劃構件要求遮焰性（火焰不穿透）、阻熱性（背面溫升受限）及遮煙性，屬被動式防火。滅火是主動式消防設備的功能，不是區劃構件的性質。", "ref": "【107專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-050", "topic": "燃燒", "stem": "燃燒時若生成的熱與散失的熱保持平衡，燃燒溫度保持均勻之燃燒為下列何者？", "opts": {"A": "定常燃燒", "B": "定壓燃燒", "C": "定體積燃燒", "D": "定質量燃燒"}, "answer": "A", "explain": "產熱等於散熱、溫度維持穩定的燃燒稱為定常燃燒；產熱大於散熱而急速升溫者為非定常燃燒（如爆炸）。定壓、定體積是熱力學條件，與熱平衡定義不同。", "ref": "【107專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-051", "topic": "防火與特殊現象", "stem": "建築物火災發生後，若火勢由局部火災擴散至全面火災之短時間現象稱為？", "opts": {"A": "閃燃", "B": "閃點", "C": "爆燃", "D": "爆轟"}, "answer": "A", "explain": "閃燃是室內火災由局部燃燒在極短時間內轉為全室燃燒的轉折現象。閃點是液體引燃溫度，爆燃、爆轟屬爆炸型態。", "ref": "【107專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-052", "topic": "煙與熱流", "stem": "描述火勢大小之物理量為下列何者？", "opts": {"A": "溫度", "B": "熱通量", "C": "熱釋放率", "D": "熱焓"}, "answer": "C", "explain": "熱釋放率（HRR，kW）代表火源單位時間釋出的能量，是衡量火勢大小最重要的指標。熱通量描述熱傳遞強度，溫度隨位置變化，不能代表火勢規模。", "ref": "【107專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-053", "topic": "防火與特殊現象", "stem": "下列何項不是閃燃發生之條件？", "opts": {"A": "火載量大", "B": "在侷限空間內", "C": "通風不佳", "D": "火場溫度高"}, "answer": "C", "explain": "閃燃需要侷限空間蓄積熱煙、足夠火載量與高溫，且需有充分通風供氧才能全室燃燒；通風不佳反而會使火勢受抑，走向悶燒或複燃情境。", "ref": "【107專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-054", "topic": "滅火", "stem": "針對連鎖反應之滅火機制為何？", "opts": {"A": "移除法", "B": "冷卻法", "C": "抑制法", "D": "窒息法"}, "answer": "C", "explain": "抑制法以滅火劑（如乾粉、海龍）捕捉自由基，中斷燃燒連鎖反應。移除法針對可燃物、冷卻法針對熱、窒息法針對氧氣。", "ref": "【107專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-055", "topic": "燃燒", "stem": "以下哪一現象為燃燒完全度高之火災特徵？", "opts": {"A": "放熱多", "B": "煙量大", "C": "一氧化碳產生量大", "D": "火焰顏色偏黃色"}, "answer": "A", "explain": "完全燃燒時燃料充分氧化，釋放的熱量最多。煙量大、一氧化碳多、火焰偏黃（碳粒發光）都是不完全燃燒的表現。", "ref": "【107專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-056", "topic": "火災", "stem": "因電器設備而發生之火災為何？", "opts": {"A": "A類火災", "B": "B類火災", "C": "C類火災", "D": "D類火災"}, "answer": "C", "explain": "C類為通電中的電氣設備火災。A類為一般可燃固體、B類為可燃液體氣體、D類為可燃金屬。", "ref": "【107專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X1-057", "topic": "火災", "stem": "下列何者並非長公路隧道火災之特性？", "opts": {"A": "完全侷限空間", "B": "車禍為主要發生原因", "C": "會因車輛移動產生活塞效應", "D": "車流量越大危險度越高"}, "answer": "A", "explain": "隧道兩端有洞口、並設通風系統，屬半侷限空間，不是完全侷限空間。車禍為主要起火原因、車輛行駛產生活塞效應、車流量愈大危險愈高，皆為隧道火災特性。", "ref": "【107專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-001", "topic": "火災", "stem": "假設火場中只含一種燃料且均勻分布，起火後火勢循t²成長理論持續成長，且火災成長常數呈定值。已知起火後第1分鐘燒耗燃料1公斤，則再經2分鐘後，從起火開始起算總共燒耗若干公斤之燃料？", "opts": {"A": "4", "B": "8", "C": "9", "D": "27"}, "answer": "D", "explain": "t²火災釋熱率∝t²，累積燒耗量為其積分∝t³。第3分鐘時為(3/1)³=27倍，即27公斤；9是誤用t²。", "ref": "【108專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-002", "topic": "燃燒", "stem": "各1公斤之碳、氫、硫分別與氧進行完全燃燒，其理論需氧量分別為a、b、c公斤，則：", "opts": {"A": "a=b/6", "B": "b=3a", "C": "c=8b", "D": "b=16c"}, "answer": "B", "explain": "C+O₂→CO₂：a=32/12≈2.67；2H₂+O₂→2H₂O：b=32/4=8；S+O₂→SO₂：c=32/32=1。故b=3a。", "ref": "【108專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-003", "topic": "熱傳", "stem": "不同材質與厚度的牆壁或隔熱板，顯示不同的熱傳導效果；此可由下列何者估算？", "opts": {"A": "傅立葉定律（Fourier's law）", "B": "伯努利定律（Bernoulli's equation）", "C": "理想氣體定律（Ideal gas law）", "D": "比爾-朗伯特定律（Beer-Lambert law）"}, "answer": "A", "explain": "傅立葉定律q=kAΔT/L描述傳導熱流與導熱係數、厚度的關係。伯努利為流體能量守恆，比爾-朗伯特描述光的吸收衰減。", "ref": "【108專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-004", "topic": "燃燒", "stem": "今有A、B兩種可燃性氣體以1：1之體積混合，已知A、B之燃燒下限分別為3.0%、7.0%，若兩者間互不催化亦不反應，則理論上此混合氣體之燃燒下限為若干%？", "opts": {"A": "5.5", "B": "5.0", "C": "4.2", "D": "2.1"}, "answer": "C", "explain": "依勒沙特列定律：L=100/(50/3+50/7)≈4.2%。5.0是直接算術平均的錯誤。", "ref": "【108專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-005", "topic": "燃燒", "stem": "可燃性液體的閃火點（flash point），是指當其表面蒸氣與空氣混合達燃燒下限時的：", "opts": {"A": "蒸氣濃度", "B": "蒸氣壓力", "C": "蒸氣最小發火溫度", "D": "液體溫度"}, "answer": "D", "explain": "閃火點是液體溫度指標：液溫升到使液面蒸氣濃度達燃燒下限時的溫度，而非蒸氣本身的濃度或壓力。", "ref": "【108專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-006", "topic": "熱傳", "stem": "當受熱平面與熱輻射線方向垂直時，其輻射角為0度；兩者平行時輻射角為90度。假設輻射源強度不變，當受熱平面由垂直逐漸傾斜，致使輻射角由0度增加至60度時，該平面所受的輻射熱通量變為原來的若干倍？", "opts": {"A": "1/3", "B": "√3/2", "C": "1/2", "D": "1/√2"}, "answer": "C", "explain": "依朗伯餘弦定律，受熱通量∝cosθ，cos60°=1/2。√3/2是誤用sin60°。", "ref": "【108專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-007", "topic": "爆炸", "stem": "下列有關蒸氣爆炸的敘述何者錯誤？", "opts": {"A": "專指水蒸氣產生的爆炸", "B": "凡是過熱液體都可能發生", "C": "是一種快速的相變化的物理現象", "D": "不一定會引發火災"}, "answer": "A", "explain": "蒸氣爆炸是過熱液體急速汽化的物理爆炸，任何過熱液體（如液化氣體、熔融金屬遇水）都可能發生，並非只限水蒸氣。", "ref": "【108專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-008", "topic": "燃燒", "stem": "若乙烷的燃燒熱為350 kcal/mole，依據Burgess-Wheeler法則，下列何者最為接近乙烷的燃燒下限？", "opts": {"A": "2.5%", "B": "3.0%", "C": "3.8%", "D": "4.5%"}, "answer": "B", "explain": "Burgess-Wheeler法則：燃燒下限×燃燒熱≈1050（kcal/mol·vol%），1050/350=3.0%。", "ref": "【108專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-009", "topic": "爆炸", "stem": "就同一種可燃性粉塵而言，下列何種措施有助於降低發生粉塵爆炸的危險性？", "opts": {"A": "提高環境溫度", "B": "提高環境壓力", "C": "提高粉塵粒徑", "D": "提高環境氧氣濃度"}, "answer": "C", "explain": "粒徑越大比表面積越小，越不易懸浮與著火，爆炸危險降低；升溫、升壓、提高氧濃度都會增加危險。", "ref": "【108專技士 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-010", "topic": "爆炸", "stem": "安裝爆炸洩氣道（或洩爆孔、洩氣孔）可適度降低侷限空間中粉塵爆炸的危害，則下列敘述何者錯誤？", "opts": {"A": "洩氣孔截面積越大效果越好", "B": "洩氣孔若連接導管，則導管越短越好", "C": "粉塵最大爆壓較大者，洩氣孔比亦宜相對加大", "D": "室內空間較小者，洩氣孔比亦宜相對縮小"}, "answer": "D", "explain": "空間越小，壓力上升越快，洩氣孔比（洩壓面積/體積）應相對加大而非縮小；其餘三項皆正確。", "ref": "【108專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-011", "topic": "煙與熱流", "stem": "室內火災所產生的熱煙層由天花板向下沉降的時間直接影響逃生，以此觀點而論，下列何者較不利於逃生？", "opts": {"A": "較矮的天花板", "B": "較大的室內空間", "C": "較大的室內樓地板面積", "D": "較小的火源周長"}, "answer": "A", "explain": "天花板越矮，蓄煙空間越小，煙層越快降到人員呼吸高度；空間大、樓地板面積大或火源周長小（捲吸量少）都會延緩煙層下降。", "ref": "【108專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-012", "topic": "煙與熱流", "stem": "建築物之中性帶高度受室內溫度、室外溫度及上下開口的影響，下列敘述何者錯誤？", "opts": {"A": "室內溫度上升，中性帶會向下偏移", "B": "上半部開口越大，中性帶會向上偏移", "C": "位於中性帶上，室內室外壓差為零", "D": "迎風面中性帶會下降，而背風面中性帶會上升"}, "answer": "D", "explain": "迎風面外部風壓增加，外氣推入使中性帶上升；背風面受負壓，中性帶下降，D項方向相反。", "ref": "【108專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-013", "topic": "防火與特殊現象", "stem": "比較室內火災閃燃（Flashover）與複燃（Backdraft），下列敘述何者正確？", "opts": {"A": "閃燃經常發生於火災衰退期", "B": "複燃發生前處於高溫缺氧的悶燒狀態", "C": "輻射能回饋效應是引起複燃的關鍵機制", "D": "氧氣是觸發閃燃的主要因素"}, "answer": "B", "explain": "複燃是高溫缺氧悶燒空間突然灌入空氣所致；閃燃發生在成長期轉全盛期，主因是熱煙層輻射回饋，兩者機制在C、D被對調。", "ref": "【108專技士 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-014", "topic": "防火與特殊現象", "stem": "依Thomas閃燃公式（Thomas Flashover Correlation），有關室內火災發生閃燃所需最小釋熱率，下列敘述何者錯誤？", "opts": {"A": "隨室內火載量增加而提高", "B": "隨室內空間增加而提高", "C": "隨對外開口面積增加而提高", "D": "隨對外開口高度增加而提高"}, "answer": "A", "explain": "Thomas公式Q=7.8A_T+378A₀√H₀，只與室內總表面積及開口面積、高度有關，與火載量無關。", "ref": "【108專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-015", "topic": "火災", "stem": "下列何種現象對於局部電阻所產生的效應恰與其他三者相反？", "opts": {"A": "氧化亞銅增殖", "B": "開關接觸不良", "C": "半斷線", "D": "金原現象"}, "answer": "D", "explain": "氧化亞銅增殖、接觸不良、半斷線都使局部電阻增大而發熱；金原現象是絕緣物碳化（石墨化）形成導電路徑，使電阻降低。", "ref": "【108專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-016", "topic": "煙與熱流", "stem": "某發生火警的大樓，室內外溫度分別為800°C與20°C，中性帶位於4樓；6樓的內外壓差為60 Pa，若不考慮外部風等其他因素，8樓的內外壓差約為若干Pa？", "opts": {"A": "80", "B": "100", "C": "120", "D": "140"}, "answer": "C", "explain": "煙囪效應壓差與距中性帶高度成正比：6樓距中性帶2層為60 Pa，8樓距4層，60×4/2=120 Pa。", "ref": "【108專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-017", "topic": "危險物品", "stem": "危害物質可能因混合儲存或載運而衍生危險，則下列哪兩類公共危險物品於混合載運時的危險性最低？", "opts": {"A": "第一類和第六類", "B": "第二類和第四類", "C": "第一類和第五類", "D": "第三類和第六類"}, "answer": "B", "explain": "依混載規定，第二類（易燃固體）可與第四類（易燃液體）混載；第一、六類氧化性物質與可燃物或第三類混載危險高。", "ref": "【108專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-018", "topic": "燃燒", "stem": "當氣體進行「壓縮比=2」的斷熱壓縮時，下列對該氣體的敘述何者正確？", "opts": {"A": "其體積減半", "B": "其壓力倍增", "C": "其絕對溫度倍增", "D": "其壓力與體積的乘積維持恆定"}, "answer": "A", "explain": "壓縮比是壓縮前後體積比，比值2即體積減半；斷熱時PV^γ恆定，壓力升為2^γ倍（大於2倍），溫度升為2^(γ-1)倍，PV不守恆。", "ref": "【108專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-019", "topic": "滅火", "stem": "下列何種滅火劑使用於金屬火災時，沒有「與金屬產生化學反應衍生危害物質」的可能？", "opts": {"A": "IG-01", "B": "IG-100", "C": "IG-541", "D": "IG-55"}, "answer": "A", "explain": "IG-01是純氬氣，化學惰性；IG-100、IG-55含氮氣，可與鋰、鎂等生成氮化物，IG-541另含CO₂亦會與活性金屬反應。", "ref": "【108專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-020", "topic": "滅火", "stem": "下列何種滅火劑所含成分之一，於放射後有刺激呼吸之作用，可有效降低場內人員的窒息危害？", "opts": {"A": "IG-55", "B": "INERGEN", "C": "FM-200", "D": "NOVEC1230"}, "answer": "B", "explain": "INERGEN（IG-541）含約8%CO₂，可刺激呼吸中樞使人加深呼吸，在低氧環境中維持攝氧；其他三者無此成分。", "ref": "【108專技士 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-021", "topic": "火災", "stem": "依據建築物火災t²成長理論，在一定義為快速成長的火災中，釋熱率達到1 MW的時間應為多少秒？", "opts": {"A": "75", "B": "150", "C": "300", "D": "600"}, "answer": "B", "explain": "t²火災以達1 MW的時間分級：極快速75秒、快速150秒、中速300秒、慢速600秒。", "ref": "【108專技士 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-022", "topic": "熱傳", "stem": "物體在327°C時的輻射強度為E，則當溫度升高到927°C時的輻射強度為何？", "opts": {"A": "16E", "B": "8E", "C": "4E", "D": "64E"}, "answer": "A", "explain": "輻射強度∝絕對溫度⁴：600 K升到1200 K為2倍，2⁴=16，得16E；須用絕對溫度計算。", "ref": "【108專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-023", "topic": "燃燒", "stem": "乙醇在閃點時的飽和蒸汽壓為25 mmHg，則乙醇在常壓下的燃燒下限約為何？", "opts": {"A": "3.29%", "B": "1.8%", "C": "5.28%", "D": "6.8%"}, "answer": "A", "explain": "閃點時液面蒸氣濃度恰為燃燒下限，濃度=蒸氣分壓/總壓=25/760≈3.29%。", "ref": "【108專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-024", "topic": "燃燒", "stem": "下列有關燃燒上下限之敘述，何者錯誤？", "opts": {"A": "當可燃物濃度高於燃燒上限，即使給予點火能量亦無法使其燃燒", "B": "燃燒下限愈低，可燃物愈危險", "C": "可燃性氣體與空氣之混合氣中加入不燃性氣體，會使其燃燒上限下降", "D": "可燃性氣體混合後，其燃燒下限為混合前各氣體中燃燒下限最低者"}, "answer": "D", "explain": "混合氣體燃燒下限須依勒沙特列定律加權計算，介於各成分下限之間，不等於最低者。", "ref": "【108專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-025", "topic": "燃燒", "stem": "木材受熱分解進而燃燒的過程中，當加熱到引火溫度時，可燃性氣體釋出量迅速增加，試問木材的引火溫度約為多少°C？", "opts": {"A": "100", "B": "260", "C": "360", "D": "450"}, "answer": "B", "explain": "木材約260°C時熱分解氣體大量釋出，可被引燃，稱為引火（著火危險）溫度；約450°C才會自行發火。", "ref": "【108專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-026", "topic": "爆炸", "stem": "乙炔加壓後容易產生分解爆炸，為避免此現象，乙炔鋼瓶常利用浸泡何種溶劑之多孔性物質，使乙炔溶解於其中，防止分解爆炸？", "opts": {"A": "丙醇", "B": "甲醛", "C": "乙醇", "D": "丙酮"}, "answer": "D", "explain": "溶解乙炔鋼瓶內填多孔性物質並浸丙酮（或DMF），乙炔溶於丙酮中，降低分解爆炸危險。", "ref": "【108專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-027", "topic": "爆炸", "stem": "有關粉塵的最小發火能量，下列敘述何者正確？", "opts": {"A": "粉塵的最小發火能量比可燃性氣體低，大約為10～100 mJ", "B": "一般而言同一種粉塵，當粒子越小，最小發火能量越低", "C": "最小發火能量與溫度、壓力無關", "D": "大氣中水蒸氣含量越高，粉塵最小發火能量越低"}, "answer": "B", "explain": "粒徑越小比表面積越大，越容易點燃；粉塵最小發火能量（約10～100 mJ）比氣體高，且受溫度、壓力、濕度影響，濕度高反而較難點燃。", "ref": "【108專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-028", "topic": "煙與熱流", "stem": "火場中煙霧的成分複雜且多具毒性，火災時若吸入下列何種氣體會妨礙細胞中氧化酵素之活性，造成細胞呼吸停止？", "opts": {"A": "氰化氫（HCN）", "B": "一氧化碳（CO）", "C": "氯化氫（HCl）", "D": "二氧化氮（NO₂）"}, "answer": "A", "explain": "HCN抑制粒線體細胞色素氧化酶，使細胞無法利用氧（組織窒息）；CO主要是與血紅素結合阻礙運氧。", "ref": "【108專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-029", "topic": "煙與熱流", "stem": "煙霧的流動為由高壓處往低壓處流，因此加壓造成壓力差可以控制煙霧流動。若於一安全梯間流入體積流率為Q（m³/s）的空氣形成P的壓力差，現欲將壓力差提高到2P，則流入的空氣體積流率應為多少？", "opts": {"A": "4Q", "B": "2Q", "C": "√2 Q", "D": "1/√2 Q"}, "answer": "C", "explain": "開口流量Q∝A√ΔP，壓差變2倍，流量變√2倍。", "ref": "【108專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-030", "topic": "防火與特殊現象", "stem": "下列何種措施，可以防止由大樓窗口噴出的火焰向上層延燒？", "opts": {"A": "加大窗戶面積以提升對流", "B": "降低窗戶高度，增加寬度，修改窗戶為橫型窗戶", "C": "採用定溫型火警探測器", "D": "增加上下層窗戶間的側壁高度"}, "answer": "D", "explain": "加大上下層窗間牆（層間高度）可拉開噴出火焰與上層開口的距離；橫長型窗戶噴出火焰較貼近外牆，反而易延燒。", "ref": "【108專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-031", "topic": "煙與熱流", "stem": "假設建築物外部風速為V時，其迎風面的風壓為P，當風速提高為2V時，建築物所受風壓變為：", "opts": {"A": "2P", "B": "4P", "C": "√2 P", "D": "1/2 P"}, "answer": "B", "explain": "風壓P=C·½ρV²，與風速平方成正比，風速加倍則風壓為4倍。", "ref": "【108專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-032", "topic": "火災", "stem": "下列有關防止靜電災害的方法中，何者錯誤？", "opts": {"A": "使用導電性材料，以防止靜電發生", "B": "降低空氣的相對濕度，以免導電", "C": "接地以消除導體與大地間的電位差", "D": "減少摩擦以降低靜電之發生"}, "answer": "B", "explain": "提高相對濕度可使物體表面形成水膜洩放電荷，是防靜電方法；降低濕度反而使靜電更易累積。", "ref": "【108專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-033", "topic": "火災", "stem": "電氣火災中，下列何者為積污導電現象？", "opts": {"A": "受直流電壓之含銀異極導體間，其絕緣物表面附著水分，銀離子沿絕緣物表面移動至陰極，產生電流流通而發熱", "B": "木材、電木等絕緣體之絕緣性受到破壞，而導致異常電流流通", "C": "絕緣物內存有瑕疵，如氣隙、雜質等，在承受高電壓下，造成電場不均而破壞絕緣性", "D": "異極導體間之絕緣物表面附著水分及灰塵，在承受電壓下造成絕緣物表面流通電流而發熱"}, "answer": "D", "explain": "積污導電是灰塵加水分在絕緣表面形成導電路徑（漏電痕跡）；A是銀遷移現象，B似石墨化（金原現象），C為絕緣破壞。", "ref": "【108專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-034", "topic": "危險物品", "stem": "化學物質災害搶救程序H.A.Z.M.A.T.中有關區域管制事項，下列敘述何者正確？", "opts": {"A": "指揮站應設置於暖區", "B": "民眾、記者應安排於冷區中", "C": "熱區為事故地點周圍可能遭受污染的地區", "D": "搶救人員之人員除污應於熱區外圍進行"}, "answer": "C", "explain": "熱區即事故點周圍可能受污染區；指揮站設於冷區，民眾與記者應在冷區外（管制區外），除污在暖區的除污走廊進行。", "ref": "【108專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-035", "topic": "爆炸", "stem": "為避免液化石油氣儲槽因外圍起火燃燒，一時無法撲滅而發生BLEVE現象，可採取之防救策略下列何者正確？", "opts": {"A": "槽體附近設置固定式撒水設備降低儲槽溫度", "B": "設置防液堤將洩漏之燃料限制於槽體周圍", "C": "降低安全閥的壓力設定值，使內壓上升速度增加", "D": "減低槽體絕緣層，以避免熱蓄積"}, "answer": "A", "explain": "冷卻槽壁（尤其氣相部）可防止鋼材強度下降而破裂；防液堤把燃料圍在槽邊反而加熱槽體，減少隔熱層也不利。", "ref": "【108專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-036", "topic": "滅火", "stem": "下列何者不是IG-541氣體滅火藥劑的成分？", "opts": {"A": "氨氣", "B": "氮氣", "C": "二氧化碳", "D": "氬氣"}, "answer": "A", "explain": "IG-541由氮氣52%、氬氣40%、二氧化碳8%組成，不含氨氣。（原書選項A經OCR辨識為「氨氣」）", "ref": "【108專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-037", "topic": "危險物品", "stem": "下列有關GHS制度之說明，何者錯誤？", "opts": {"A": "為化學品分類、標示以及物質安全資料表內容全球調和一致的規範", "B": "化學品依危害性分為物理性危害、健康危害及環境危害等三大類", "C": "化學品危害圖示共有9種，依化學品的危害性，選擇最具代表性一種危害進行張貼", "D": "滅火器依規定不適用通識規則，可免標示及張貼危害圖示"}, "answer": "C", "explain": "GHS圖示共9種，但化學品具多種危害時應標示所有適用圖示，而非只挑一種。", "ref": "【108專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-038", "topic": "燃燒", "stem": "可燃物不藉由火焰或電氣火花引起燃燒，在大氣中僅因受熱而引起燃燒的最低溫度稱為：", "opts": {"A": "發火點（ignition point）", "B": "閃火點（flash point）", "C": "燃燒點（burning point）", "D": "閃燃點（flashover point）"}, "answer": "A", "explain": "無外部火源、單靠加熱自行起燃的最低溫度為發火點（自燃溫度）；閃火點與燃燒點都需外加火源。", "ref": "【108專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-039", "topic": "爆炸", "stem": "高壓氣體的爆炸界限，通常較常壓下為廣，爆炸上限也明顯提高，但下列何種氣體之爆炸範圍及爆炸上限在高壓下卻降低？", "opts": {"A": "甲烷", "B": "二氧化碳", "C": "乙烷", "D": "一氧化碳"}, "answer": "D", "explain": "一氧化碳是特例，壓力升高時爆炸範圍反而變窄、上限下降；烴類在高壓下範圍擴大，CO₂本身不燃。", "ref": "【108專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-040", "topic": "火災", "stem": "建築物火災進入最盛期時，燃料數量龐大，但因對外開口相對較小的情況下，燃燒速度因開口通風量而受限，此現象稱為：", "opts": {"A": "無開口樓層燃燒", "B": "燃料控制燃燒", "C": "通風控制燃燒", "D": "悶燒"}, "answer": "C", "explain": "燃燒速度受開口供氣量限制即通風控制燃燒；燃料控制燃燒則是空氣充足、由燃料表面積決定。", "ref": "【108專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-041", "topic": "燃燒", "stem": "已知辛烷的燃燒下限為0.92（vol%），根據Burgess-Wheeler定律，其燃燒熱約為多少？", "opts": {"A": "1,750 kcal/mol", "B": "1,200 kcal/mol", "C": "950 kcal/mol", "D": "750 kcal/mol"}, "answer": "B", "explain": "燃燒下限×燃燒熱≈1050，1050/0.92≈1141，最接近1,200 kcal/mol。", "ref": "【109專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-042", "topic": "煙與熱流", "stem": "三個面積分別為0.20 m²、0.40 m²、0.60 m²之開口相互串聯時，等效流動面積為何？", "opts": {"A": "1.2 m²", "B": "0.27 m²", "C": "0.17 m²", "D": "0.048 m²"}, "answer": "C", "explain": "串聯：1/A²=1/0.2²+1/0.4²+1/0.6²≈34.03，A≈0.17 m²；1.2 m²是並聯相加的結果。", "ref": "【109專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-043", "topic": "防火與特殊現象", "stem": "依用戶用電設備裝置規則及建築技術規則，下列避雷設備敘述何者錯誤？", "opts": {"A": "建築物高度在20公尺以上者應有避雷設備", "B": "為保護建築物或危險物品倉庫遭受雷擊，應裝設避雷設備", "C": "建築物高度在3公尺以上並作危險物品倉庫使用者應有避雷設備", "D": "受雷部採用富蘭克林避雷針者，危險物品倉庫之保護角不得超過60度"}, "answer": "D", "explain": "富蘭克林避雷針保護角：一般建築物不超過60度，危險物品倉庫須更嚴格，不得超過45度。", "ref": "【109專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-044", "topic": "火災", "stem": "某一火災成長至2,000 kW所需時間為400秒，請問該火災屬何種成長性火災？〔Q=(t/k)²，Q：釋熱率（MW）；t：經過時間（sec）；k：火災成長常數（sec/MW^1/2）〕", "opts": {"A": "慢速成長性至中速成長性火災", "B": "中速成長性至快速成長性火災", "C": "快速成長性至極快速成長性火災", "D": "極快速成長性火災"}, "answer": "B", "explain": "2=(400/k)²，k=400/√2≈283；中速k=300、快速k=150，283介於兩者之間，屬中速至快速。", "ref": "【109專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-045", "topic": "滅火", "stem": "下列有關二氧化碳（CO₂）滅火劑之敘述，何者錯誤？", "opts": {"A": "滅火後不留痕跡", "B": "滅火作用較氮氣（N₂）為大", "C": "特別適用於鈉等金屬火災", "D": "氣化時，可以發揮冷卻作用"}, "answer": "C", "explain": "鈉、鉀、鎂等活性金屬可在CO₂中持續燃燒並將其還原，CO₂不可用於金屬火災。（原題金屬名OCR作「鏽」，依題意修為鈉）", "ref": "【109專技士 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-046", "topic": "火災", "stem": "某次閃電的過程中，雲的底部和地面之間，電壓高達1千萬伏特，並在約0.02秒內輸送20庫倫的電量至地面。下列與閃電有關的敘述何者正確？", "opts": {"A": "該次閃電所產生的電功率約為10⁷瓦特", "B": "雲和地面間高電壓的產生與摩擦起電有關", "C": "飛機在空中飛行時不可能遭雷擊，因此不須裝置避雷針", "D": "閃電時的大電流，使空氣產生高熱而快速膨脹，故常伴隨雷聲"}, "answer": "D", "explain": "電流=20/0.02=1000 A，功率=10⁷×1000=10¹⁰ W，A錯；飛機也會遭雷擊，C錯；雷聲來自空氣急熱膨脹，D對。B項雲中電荷分離常被解釋為冰晶碰撞摩擦，敘述有爭議，依書上答案取D。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【109專技士 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-047", "topic": "滅火", "stem": "進入石化工廠，車輛會被要求在排氣管加裝滅焰器（flame arrester）以避免火災爆炸之發生，加裝該措施防制火災爆炸之原理為：", "opts": {"A": "窒息", "B": "冷卻", "C": "抑制連鎖反應", "D": "阻止擴展"}, "answer": "B", "explain": "滅焰器以金屬網或細孔通道大量吸收火焰熱量，使溫度降到無法維持燃燒，屬冷卻原理。", "ref": "【109專技士 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-048", "topic": "熱傳", "stem": "1度電為1,000瓦·小時（1 kWh），試問1度電約等同多少千卡（kcal）？", "opts": {"A": "420", "B": "746", "C": "860", "D": "1,000"}, "answer": "C", "explain": "1 kWh=3.6×10⁶ J，除以4186 J/kcal≈860 kcal；746是1馬力的瓦特數。", "ref": "【109專技士 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-050", "topic": "火災", "stem": "有水之場所的插頭應加裝何種裝置以防止感電發生？", "opts": {"A": "總開關", "B": "延長線", "C": "緊急電源", "D": "漏電斷路器"}, "answer": "D", "explain": "潮濕場所易漏電，漏電斷路器偵測到漏電流即跳脫，可防止感電。", "ref": "【109專技士 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-051", "topic": "火災", "stem": "某一線徑2.0 mm之電線1 km長之電阻值為5.657 Ω，熱阻抗為378。若周遭溫度為20°C，當此10 cm長之電線通過10安培時，其芯線溫度（°C）約為多少？", "opts": {"A": "31", "B": "41", "C": "51", "D": "61"}, "answer": "B", "explain": "10 cm電阻=5.657×0.1/1000≈5.66×10⁻⁴ Ω，發熱I²R=100×5.66×10⁻⁴≈0.0566 W，溫升=0.0566×378≈21.4°C，芯線溫度≈20+21.4≈41°C。", "ref": "【109專技士 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-052", "topic": "滅火", "stem": "下列常見之乾粉滅火藥劑敘述何者正確？", "opts": {"A": "第一種乾粉主要成分為磷酸二氫銨（NH₄H₂PO₄）", "B": "第二種乾粉主要成分為碳酸氫鉀（KHCO₃）", "C": "第三種乾粉主要成分為碳酸氫鈉（NaHCO₃）", "D": "第四種乾粉主要成分為碳酸氫鈉及尿素（NaHCO₃＋(NH₂)₂CO）"}, "answer": "B", "explain": "第一種為碳酸氫鈉、第二種碳酸氫鉀、第三種磷酸二氫銨、第四種為碳酸氫鉀與尿素，A、C對調，D應為鉀鹽。", "ref": "【109專技士 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-053", "topic": "滅火", "stem": "下列的滅火設備，何者屬於窒息法滅火原理？", "opts": {"A": "海龍滅火設備", "B": "室內消防栓", "C": "IG-541", "D": "CEA-410"}, "answer": "C", "explain": "IG-541為惰性氣體，以降低氧濃度窒息滅火；海龍與CEA-410屬鹵化物抑制連鎖反應，室內消防栓以冷卻為主。", "ref": "【109專技士 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-054", "topic": "煙與熱流", "stem": "火場溫度隨燃燒時間而逐漸升高，其空氣亦漸膨脹，空氣由外界流入該起火房間，同時熱煙霧也會從該起火房間流出。若忽略燃料分解過程而產生之質量流率，建築物內部空氣溫度為25°C，起火房間溫度為800°C，流入起火房間之空氣體積流量為1 m³/s，則流出起火房間之熱煙霧體積流量約為若干？", "opts": {"A": "1.6 m³/s", "B": "2.6 m³/s", "C": "3.6 m³/s", "D": "4.6 m³/s"}, "answer": "C", "explain": "質量守恆且定壓下，體積流量∝絕對溫度：1×(1073/298)≈3.6 m³/s。（原書C選項OCR作13.6，依計算修正為3.6）", "ref": "【109專技士 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-055", "topic": "滅火", "stem": "下列海龍替代滅火藥劑，何者之化學組成為五氟乙烷？", "opts": {"A": "HFC-227ea", "B": "HFC-125", "C": "HFC-23", "D": "FE-13"}, "answer": "B", "explain": "HFC-125為五氟乙烷（C₂HF₅）；HFC-227ea為七氟丙烷，HFC-23與FE-13為三氟甲烷。", "ref": "【109專技士 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-056", "topic": "煙與熱流", "stem": "假設建築物外部風速為10 m/s，風壓係數為0.6，空氣密度為1 kg/m³，其對迎風面建築物所產生的風壓約為？", "opts": {"A": "60 Pa", "B": "50 Pa", "C": "40 Pa", "D": "30 Pa"}, "answer": "D", "explain": "風壓P=C·½ρV²=0.6×0.5×1×10²=30 Pa；60 Pa是漏乘1/2。", "ref": "【109專技士 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-057", "topic": "爆炸", "stem": "T.N.T.炸藥化學名稱為三硝基甲苯（Trinitrotoluene，C₇H₅N₃O₆），俗稱黃色炸藥，試問其氧平衡（Oxygen Balance, O.B.）為多少？", "opts": {"A": "-64.0%", "B": "-74.0%", "C": "-84.0%", "D": "-94.0%"}, "answer": "B", "explain": "完全氧化需O原子2×7+5/2=16.5個，分子內有6個，缺10.5個O=168 g；分子量227，O.B.=-168/227≈-74.0%。", "ref": "【109專技士 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-058", "topic": "危險物品", "stem": "化學災害搶救程序HAZMAT之說明，下列何者正確？", "opts": {"A": "H表請求支援", "B": "Z表建立管理系統", "C": "T表善後處理", "D": "M表行動方案"}, "answer": "C", "explain": "HAZMAT：H危害辨識、A行動方案、Z區域管制、M管理系統、A請求支援、T善後處理（終止）。", "ref": "【109專技士 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-059", "topic": "熱傳", "stem": "若一物體的溫度為327°C，輻射率（Emissivity）為0.1，已知史蒂芬－波茲曼常數為5.67×10⁻⁸ W/m²K⁴，則其輻射強度（Emissive Power）約為多少？", "opts": {"A": "0.7 kW/m²", "B": "1.6 kW/m²", "C": "3.0 kW/m²", "D": "3.2 kW/m²"}, "answer": "A", "explain": "E=εσT⁴=0.1×5.67×10⁻⁸×600⁴≈735 W/m²≈0.7 kW/m²。", "ref": "【109專技士 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-060", "topic": "危險物品", "stem": "某研究院之廠區引發爆燃事件之推進劑，其內含過氯酸鹽類，試問其為公共危險物品中第幾類物質？", "opts": {"A": "第一類物質", "B": "第二類物質", "C": "第三類物質", "D": "第六類物質"}, "answer": "A", "explain": "過氯酸鹽類屬第一類氧化性固體；第六類是氧化性液體（如過氯酸本身）。", "ref": "【109專技士 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-061", "topic": "燃燒", "stem": "混合氣體由A、B、C三種氣體組成，混合時組成氣體不進行反應，且燃燒無催化作用，其中A氣體占1/5（燃燒下限4.0%），B氣體占3/5（燃燒下限12.5%），C氣體占1/5（燃燒下限2.0%），則此混合氣體燃燒下限約為多少？", "opts": {"A": "4.8%", "B": "5.1%", "C": "6.5%", "D": "7.3%"}, "answer": "B", "explain": "勒沙特列定律：L=100/(20/4+60/12.5+20/2)=100/19.8≈5.1%。", "ref": "【109專技士 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-062", "topic": "危險物品", "stem": "預防過氧化丁酮之火災爆炸時，下列何種原則正確？", "opts": {"A": "自加速分解溫度大於攝氏50度的B型有機過氧化丁酮在運輸時應控制溫度", "B": "設置適當的泡沫滅火器", "C": "C型有機過氧化丁酮之管制量上限為100公斤", "D": "可使用乾粉滅火器"}, "answer": "C", "explain": "依公共危險物品規定，第五類C型有機過氧化物管制量為100公斤；需控溫運輸的是自加速分解溫度≤50°C者，A錯。", "ref": "【109專技士 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-063", "topic": "煙與熱流", "stem": "若要看清某一物體，該物體與其背景間須有一定之對比度。對比度之計算：C=(B/B₀)-1，有關對比度下列何者正確？", "opts": {"A": "公式中B表示背景亮度，B₀表示物體亮度", "B": "C=-0.02時，被認為能清楚辨別物體之臨界值", "C": "當觀察者位置與物體間之距離越遠，其所感受對比度越大", "D": "火場能見度指的是使用光度計實際測量對比度"}, "answer": "B", "explain": "B為物體亮度、B₀為背景亮度，A顛倒；距離越遠對比度越小；一般以|C|=0.02作為可辨識的臨界對比。", "ref": "【109專技士 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-064", "topic": "防火與特殊現象", "stem": "在古蹟及歷史建築物火災風險評估指標中，有關防火因應措施安全評估項目中，不包括下列何項？", "opts": {"A": "滅火控制", "B": "文化資產文物數量與分布", "C": "火災偵測與通報", "D": "計畫研擬與動態演練"}, "answer": "B", "explain": "文物數量與分布屬「潛在損失（價值）」面向的評估，而非防火因應措施；其餘三項皆是防火對策。", "ref": "【109專技士 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-065", "topic": "煙與熱流", "stem": "有關火羽流的敘述，下列何者錯誤？", "opts": {"A": "火羽流的溫度與速度隨著高度增加而下降", "B": "火羽流在燃料上方形成，周遭冷空氣捲入至火羽流下方，形成空間對流", "C": "不同生成氣體隨火羽流上升累積在天花板形成負壓區，火羽流底部則形成正壓區", "D": "火羽流分為連續火焰區、間歇火焰區與熱煙氣區"}, "answer": "C", "explain": "熱氣累積在上方形成正壓，底部因空氣被捲吸形成負壓，C項正負顛倒。（A、D選項依原意修正OCR文字）", "ref": "【109專技士 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-066", "topic": "防火與特殊現象", "stem": "閃燃發生時間之影響因素中，通風為其中之一項，請問A₀√H₀的通風因子公式中，A₀與H₀各代表何意？", "opts": {"A": "A₀：空間表面積，H₀：天花板至地板高度", "B": "A₀：空間樓地板面積，H₀：天花板至地板高度", "C": "A₀：開口寬度，H₀：開口高度", "D": "A₀：開口面積，H₀：開口高度"}, "answer": "D", "explain": "通風因子A₀√H₀中，A₀為開口面積、H₀為開口高度，決定流入空氣量。", "ref": "【109專技士 第26題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-067", "topic": "滅火", "stem": "下列有關泡沫滅火劑，何者敘述正確？", "opts": {"A": "機械泡沫乃指泡沫水溶液與空氣產生機械混合生成，水成膜泡沫屬於此類", "B": "目前大多數的空氣泡沫，以1%、4%及5%原液比例與水混合而成", "C": "每分鐘供給較低的泡沫體積量時，有助於降低泡沫耗損速度，有助於滅火", "D": "泡沫黏著性高，但比水的導電性較為小"}, "answer": "A", "explain": "水成膜泡沫屬機械（空氣）泡沫；常見原液比例為3%、6%；供給量過低時泡沫被火破壞速度大於生成；泡沫含水仍可導電，不可用於電氣火災。", "ref": "【109專技士 第27題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-068", "topic": "火災", "stem": "森林火災的種類與敘述，下列何者正確？", "opts": {"A": "樹幹火主要燃料為茅草與灌木，為森林大火的主因", "B": "地表火主要由含樹脂之樹木燃燒造成", "C": "樹梢火通常在開放環境中燃燒", "D": "地中火通常由地表火而來，有大量有機可燃物"}, "answer": "C", "explain": "樹梢火（樹冠火）在開放高處藉風蔓延；燃料為茅草灌木的是地表火，樹脂樹木多造成樹幹火。D項敘述與一般教材接近，依書上答案取C。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【109專技士 第28題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-069", "topic": "防火與特殊現象", "stem": "有關防火塗料敘述，下列何者錯誤？", "opts": {"A": "火災時阻止火焰的傳播", "B": "防火形式可分為膨脹型與非膨脹型", "C": "塗覆在物件表面，利用材料的低導熱性與放熱性形成一般保護", "D": "可分為溶劑性與水溶性兩類"}, "answer": "C", "explain": "防火塗料是利用低導熱性與吸熱（如膨脹、分解吸熱）來保護基材，不是放熱。", "ref": "【109專技士 第29題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-070", "topic": "滅火", "stem": "海龍替代滅火藥劑中，下列何者在大氣之滯留時間最久？", "opts": {"A": "FM-200", "B": "Halon1301", "C": "PFC-410", "D": "FE-13"}, "answer": "C", "explain": "PFC-410（全氟丁烷）大氣滯留約2,600年，遠長於FE-13約270年、Halon1301約65年、FM-200約30多年。", "ref": "【109專技士 第30題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-071", "topic": "火災", "stem": "建築物火災在閃燃發生後之全盛期火災的特性，不包括下列何者？", "opts": {"A": "開口部噴出火焰向上層延燒", "B": "此時的火災發展取決於開口淨通風面積與數量", "C": "此時期常見溫度一般在攝氏800～950度", "D": "出現深層火勢（Deep-seated Fire）與悶燒火災"}, "answer": "D", "explain": "深層火勢與悶燒是衰退期的特徵；全盛期為通風控制、高溫並由開口噴出火焰。", "ref": "【109專技士 第31題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-072", "topic": "滅火", "stem": "已知天花板噴流溫度135°C，天花板噴流速度1.8 m/s，環境初始溫度20°C，感知撒水頭作動溫度72°C，反應時間指數60（m^1/2·s^1/2），感知撒水頭作動時間為下列何者？（提示：ln115=4.74，ln63=4.14）", "opts": {"A": "30秒", "B": "35秒", "C": "40秒", "D": "45秒"}, "answer": "A", "explain": "t=(RTI/√u)·ln[(Tg-Ta)/(Tg-Td)]=(60/√1.8)×(4.74-4.14)≈44.7×0.6≈27秒，最接近30秒。（原書RTI數值OCR作「6」，依提示與答案應為60）", "ref": "【109專技士 第32題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-073", "topic": "燃燒", "stem": "乙醇之燃燒化學反應式為下列何者？", "opts": {"A": "C₃H₆＋9/2 O₂→3CO₂＋3H₂O", "B": "CH₃OH＋3/2 O₂→CO₂＋2H₂O", "C": "C₂H₅OH＋3O₂→2CO₂＋3H₂O", "D": "C₂H₅OC₂H₅＋6O₂→4CO₂＋5H₂O"}, "answer": "C", "explain": "乙醇為C₂H₅OH，完全燃燒需3 mol O₂生成2CO₂與3H₂O；B是甲醇，D是乙醚，A是丙烯。", "ref": "【109專技士 第33題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-074", "topic": "爆炸", "stem": "BLEVE的發生，下列敘述何者錯誤？", "opts": {"A": "BLEVE指的是沸騰液體膨脹蒸氣爆炸", "B": "BLEVE發生於單獨存在的蒸氣", "C": "BLEVE發生時可能因為容器金屬疲勞所引起", "D": "BLEVE發生時容器變色如櫻桃色"}, "answer": "B", "explain": "BLEVE需有容器內的加壓液體，容器破裂後液體急速沸騰汽化，不會發生在只有蒸氣的情況。", "ref": "【109專技士 第34題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-075", "topic": "危險物品", "stem": "有關易燃性液體的敘述，下列何者正確？", "opts": {"A": "蒸氣比重小於1，滯留低窪區有著火危險", "B": "閃火點低，易著火爆炸", "C": "不易累積靜電", "D": "液體比重大，不易浮於水面"}, "answer": "B", "explain": "易燃液體閃火點低易引燃；多數蒸氣比重大於1才會滯留低處，電導度低易累積靜電，液體比重多小於1會浮於水面。", "ref": "【109專技士 第35題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-076", "topic": "滅火", "stem": "房間的體積為V=6 m×5 m×3 m，其中O₂占0.21V，請問至少加入多少公升（L）的CO₂讓燃燒作用無法持續？", "opts": {"A": "36 L", "B": "40 L", "C": "36,000 L", "D": "48,000 L"}, "answer": "C", "explain": "V=90 m³，含O₂ 18.9 m³；以氧濃度降至15%為燃燒界限：18.9/(90+X)=0.15，X=36 m³=36,000 L。36 L是忘記換算單位。", "ref": "【109專技士 第36題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-077", "topic": "滅火", "stem": "D類火災可使用的滅火劑，何者適合？", "opts": {"A": "二氧化碳滅火劑", "B": "惰性氣體滅火劑", "C": "鹵化烷滅火劑", "D": "TEC滅火劑"}, "answer": "D", "explain": "D類為金屬火災，TEC（三元共晶氯化物）乾粉可覆蓋熔融金屬隔絕空氣；CO₂、鹵化烷會與活性金屬反應。", "ref": "【109專技士 第37題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-078", "topic": "火災", "stem": "在橡膠中混入碳黑所製成的產品可防止人體帶靜電，其防止靜電產生的方法為？", "opts": {"A": "減少摩擦", "B": "使用帶電序列相近的物質", "C": "使用除電劑", "D": "使用導電性材料"}, "answer": "D", "explain": "碳黑使橡膠具導電性，電荷可經導電材料洩放，屬使用導電性材料。", "ref": "【109專技士 第38題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-079", "topic": "火災", "stem": "帶電物體或其附近之接地體，有突出部分或刃狀部分時，在該等尖端近旁，所出現之微弱發光放電，此現象稱為？", "opts": {"A": "電暈放電", "B": "條狀放電", "C": "火花放電", "D": "沿面放電"}, "answer": "A", "explain": "尖端附近電場集中產生的微弱發光放電為電暈放電；火花放電是導體間瞬間強烈放電。", "ref": "【109專技士 第39題】", "subject": "火災學", "src": "old"}, {"id": "F-X2-080", "topic": "燃燒", "stem": "有關預混合火焰特性，下列敘述何者錯誤？", "opts": {"A": "不穩定燃燒", "B": "燃燒速率相對慢", "C": "偏藍色火焰", "D": "較少不完全燃燒"}, "answer": "B", "explain": "預混合火焰燃料與空氣事先混合，燃燒速率快、呈藍色、較完全；燃燒速率慢是擴散火焰特性。", "ref": "【109專技士 第40題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-001", "topic": "燃燒", "stem": "下列物質各取1莫耳進行完全燃燒，何者所需的理論空氣量（kg）最少？", "opts": {"A": "乙醇（CH₃CH₂OH）", "B": "乙烯（C₂H₄）", "C": "乙醛（CH₃CHO）", "D": "二甲醚（CH₃OCH₃）"}, "answer": "C", "explain": "理論需氧莫耳數＝C＋H/4－O/2：乙醇、乙烯、二甲醚皆為3 mol，乙醛為2＋1－0.5＝2.5 mol，所需氧最少，理論空氣量也最少。", "ref": "【110專技士 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-002", "topic": "火災", "stem": "依據建築物火災t²成長理論，當釋熱率（Q）達到4MW時，需300秒的時間，表示火災成長之速度為下列何者？", "opts": {"A": "慢速成長", "B": "中速成長", "C": "快速成長", "D": "極快速成長"}, "answer": "C", "explain": "α＝Q/t²＝4000/300²≈0.0444 kW/s²，等同1MW需150秒，屬快速成長（慢速600秒、中速300秒、極快速75秒達1MW）。", "ref": "【110專技士 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-003", "topic": "火災", "stem": "依據建築物火災的特性，當進入「穩態燃燒」階段時，釋熱率（Q）與時間（t）的關係為何？", "opts": {"A": "與時間一次方成正比", "B": "與時間一次方成反比", "C": "與時間二次方成正比", "D": "與時間無關"}, "answer": "D", "explain": "穩態燃燒時釋熱率維持大致定值，不隨時間變化；與t²成正比的是成長期。", "ref": "【110專技士 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-004", "topic": "熱傳", "stem": "在氣溫20°C無風的情況下，一般木造建築物形成危險界限溫度的輻射熱通量超過多少kcal/m²·h即有延燒之危險？", "opts": {"A": "2000", "B": "4000", "C": "4500", "D": "7000"}, "answer": "B", "explain": "依木造建築延燒研究，受熱面輻射熱通量約超過4000 kcal/m²·h即達危險界限，可能引燃木材而延燒。", "ref": "【110專技士 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X3-005", "topic": "燃燒", "stem": "已知甲烷、乙烯、乙炔的最小發火能量分別為a、b、c，則a、b、c大小關係為：", "
