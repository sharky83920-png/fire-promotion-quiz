部熱源因熱散失需較高溫度才能引燃。", "ref": "【111警察四等 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-027", "topic": "燃燒", "stem": "從管線洩漏之可燃性氣體，立即與周圍空氣混合而燃燒之現象為：", "opts": {"A": "擴散燃燒", "B": "混合燃燒", "C": "蒸發燃燒", "D": "分解燃燒"}, "answer": "A", "explain": "可燃氣體從管口噴出，邊擴散邊與空氣混合邊燃燒，屬擴散燃燒；混合燃燒是事先與空氣預混後才點燃。", "ref": "【111警察四等 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-028", "topic": "熱傳", "stem": "地板上鋪設兩片材質不同但厚度、面積、密度、比熱以及點燃溫度均相同的厚木板，火災時同時接受高溫煙層的輻射熱而先後點燃，假設兩片木板完全吸收輻射熱，而且地板與木板接觸面無熱損失，則先被點燃的木板：", "opts": {"A": "熱傳導率較大", "B": "熱傳導率較小", "C": "含碳量較大", "D": "含碳量較小"}, "answer": "B", "explain": "熱傳導率小則熱不易往內部傳，熱量集中在表面，表面升溫快而先達點燃溫度（熱慣性kρc較小）。", "ref": "【111警察四等 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-029", "topic": "煙與熱流", "stem": "有一居室內設有小型會議室，該居室與內部小型會議室皆為單一開口，分別為2平方公尺及4平方公尺的開口，二者開口前後串聯，等效流動面積為多少平方公尺？", "opts": {"A": "0.93", "B": "1.79", "C": "2.38", "D": "3.15"}, "answer": "B", "explain": "串聯開口：1/A²＝1/2²＋1/4²＝5/16，A＝4/√5≈1.79 m²。", "ref": "【111警察四等 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-030", "topic": "煙與熱流", "stem": "因為大樓設有空調而使其溫度較外界為低，此時建築物垂直通道會形成一股往下之氣流，此現象為：", "opts": {"A": "自然對流", "B": "強制對流", "C": "正煙囪效應", "D": "逆煙囪效應"}, "answer": "D", "explain": "室內溫度低於室外時，垂直通道內空氣較重而向下流動，稱逆煙囪效應；正煙囪效應是室內較熱而向上流。", "ref": "【111警察四等 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-031", "topic": "防火與特殊現象", "stem": "對於不同形態物質之靜電條件，下列敘述何者錯誤？", "opts": {"A": "滾輪與皮帶、粉體與其輸送之導管等為固體摩擦帶電之情形", "B": "液體與管路或過濾裝置等固體表面流動摩擦為液體摩擦帶電之情形", "C": "氣體含有管路金屬氧化物等不純物，與管壁流動摩擦為氣體摩擦帶電之情形", "D": "氣體導管為絕緣者，不易蓄積電荷"}, "answer": "D", "explain": "導管若為絕緣體，電荷無法經由接地洩漏，反而容易蓄積，故D錯。", "ref": "【111警察四等 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-032", "topic": "爆炸", "stem": "下列何者不是影響粉塵爆炸的因素？", "opts": {"A": "化學組成", "B": "粒徑大小", "C": "最大發火能量", "D": "爆炸界限"}, "answer": "C", "explain": "影響粉塵爆炸的是化學組成、粒徑、濃度（爆炸界限）與「最小」發火能量等；「最大發火能量」並非影響因素。", "ref": "【111警察四等 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-033", "topic": "危險物品", "stem": "環氧乙烷是容易產生分解爆炸的物質，下列何者不屬分解反應的主要產物？", "opts": {"A": "甲烷", "B": "乙烯", "C": "乙烷", "D": "氫氣"}, "answer": "C", "explain": "環氧乙烷分解主要生成一氧化碳、甲烷，並有少量乙烯、氫氣等；乙烷不是其主要分解產物。", "ref": "【111警察四等 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-034", "topic": "燃燒", "stem": "下列何種因素，為粉狀固體較塊狀固體容易燃燒的原因？", "opts": {"A": "粉狀固體之空氣供給較不足", "B": "粉狀固體之燃燒熱增大", "C": "粉狀固體之熱傳導較低", "D": "塊狀固體因局部氧化所產生的熱容易蓄積"}, "answer": "C", "explain": "粉狀固體顆粒間充滿空氣，整體熱傳導低、熱易蓄積於局部，且與空氣接觸面積大；燃燒熱不因形狀改變。", "ref": "【111警察四等 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-035", "topic": "熱傳", "stem": "隔牆厚度為0.2 m、面積10 m²，牆體兩邊溫度分別為20°C及520°C，熱傳導係數為1.0 W/(m·K)，通過此隔牆的熱通量為多少？", "opts": {"A": "0.1 kW/m²", "B": "0.625 kW/m²", "C": "1.25 kW/m²", "D": "2.5 kW/m²"}, "answer": "D", "explain": "熱通量q＝kΔT/L＝1.0×500/0.2＝2500 W/m²＝2.5 kW/m²；熱通量是單位面積的量，不需乘面積。", "ref": "【111警察四等 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-036", "topic": "危險物品", "stem": "下列何者為第二石油類之物質？", "opts": {"A": "汽油", "B": "煤油", "C": "鍋爐油", "D": "活塞油"}, "answer": "B", "explain": "第二石油類指閃火點21°C以上、未滿70°C者，如煤油、柴油；汽油屬第一石油類，鍋爐油（重油）屬第三石油類，活塞油屬第四石油類。", "ref": "【111警察四等 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-037", "topic": "熱傳", "stem": "關於熱對流之敘述，下列何者錯誤？", "opts": {"A": "通風口的面積越大，熱對流之速度越快", "B": "使用鼓風機協助氣體流動屬於自然對流", "C": "火場溫度越高，熱對流之速度越快", "D": "建築物火災中之煙囪效應為熱對流所引起"}, "answer": "B", "explain": "以鼓風機、風扇等外力驅動流體屬強制對流；自然對流是由溫差造成的密度差（浮力）驅動。", "ref": "【111警察四等 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-038", "topic": "熱傳", "stem": "下列何種顏色之物體，具有最好之輻射熱吸收能力？", "opts": {"A": "金色", "B": "銀色", "C": "黑色", "D": "白色"}, "answer": "C", "explain": "黑色物體吸收率（及放射率）接近1，吸收輻射熱能力最好；金、銀、白色表面反射率高。", "ref": "【111警察四等 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-039", "topic": "滅火", "stem": "惰性氣體滅火藥劑及鹵化物滅火藥劑，各自滅火原理分別是針對燃燒四要素中哪一種？", "opts": {"A": "惰性氣體主要抑制連鎖反應、鹵化物主要降低助燃物濃度", "B": "惰性氣體主要降低助燃物濃度、鹵化物主要降低可燃物發熱量", "C": "惰性氣體主要降低助燃物濃度、鹵化物主要抑制連鎖反應", "D": "惰性氣體主要抑制連鎖反應、鹵化物主要降低起火源溫度"}, "answer": "C", "explain": "惰性氣體（如IG541）稀釋氧濃度屬窒息作用；鹵化物分解出鹵素自由基捕捉燃燒自由基，屬抑制連鎖反應。", "ref": "【111警察四等 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-040", "topic": "燃燒", "stem": "氫氣、甲烷、丁烷的最小發火壓力分別為甲、乙、丙（mmHg），下列何者正確？", "opts": {"A": "甲＞乙＞丙", "B": "乙＞丙＞甲", "C": "丙＞甲＞乙", "D": "丙＞乙＞甲"}, "answer": "D", "explain": "氫氣最小發火能量極低，在很低壓力下仍可發火，最小發火壓力最低；依書上答案，碳數愈多者所需壓力愈高，故丙＞乙＞甲。此排序（尤其甲烷與丁烷之間）可查的數據有限，存疑。（⚠️ 本題答案或題意有爭議，建議對照教材）", "ref": "【111警察四等 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-041", "topic": "燃燒", "stem": "電氣火花使混合氣體發火，需有足夠能量，此稱為「最小發火能量」，其單位為何？", "opts": {"A": "帕斯卡（Pa）", "B": "焦耳（J）", "C": "溫度（°C）", "D": "瓦特（W）"}, "answer": "B", "explain": "最小發火能量是能量，單位為焦耳（常用mJ）；Pa是壓力、W是功率。", "ref": "【111警察四等 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-042", "topic": "防火與特殊現象", "stem": "建築物發生火災時，天花板向地面放射出大量輻射熱，致使地面可燃物燃燒，此種加速火災燃燒現象稱為：", "opts": {"A": "輻射能損失效果", "B": "輻射能回饋效果", "C": "對流能損失效果", "D": "對流能回饋效果"}, "answer": "B", "explain": "高溫煙層與天花板將輻射熱回送至地面可燃物，加速熱分解與燃燒，稱輻射能回饋效果，是閃燃的主因。", "ref": "【111警察四等 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-043", "topic": "燃燒", "stem": "下列燃燒要素中，何者與自由基之變化有關？", "opts": {"A": "可燃物", "B": "助燃物", "C": "熱能", "D": "連鎖反應"}, "answer": "D", "explain": "連鎖反應是指燃燒中自由基不斷生成、傳遞與增殖的過程，抑制法即針對此要素。", "ref": "【111警察四等 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-044", "topic": "煙與熱流", "stem": "某大樓於外部無風時，內部煙囪效應之中性帶位於5樓；當面臨強勁的北風吹襲時，下列敘述何者正確？", "opts": {"A": "北面樓層的中性帶下降", "B": "南面5樓的內部氣壓較外部高", "C": "南面樓層的排氣效率下降", "D": "北面4樓的氣流方向受到逆轉"}, "answer": "B", "explain": "北風使南面成為背風面、外部呈負壓，南面5樓外部壓力下降而室內相對較高，氣體向外流出、排氣增加；北面迎風正壓使中性帶上移。", "ref": "【111警察四等 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-045", "topic": "防火與特殊現象", "stem": "有關電器保護裝置，下列敘述何者正確？", "opts": {"A": "若負載為電動機，其斷路器的額定電流不應大於導線安培容量的數倍以上", "B": "進屋線之過電流保護裝置，不得設於接戶開關之負載側", "C": "緊急電源插座之專用迴路，不得設置漏電斷路器", "D": "裝置熔絲為目前最可靠的漏電保護方法"}, "answer": "C", "explain": "緊急電源插座須確保火災時持續供電，專用迴路不得設漏電斷路器以免跳脫斷電；熔絲是過電流保護而非漏電保護，進屋線過電流保護裝置應設於接戶開關負載側。", "ref": "【111警察四等 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-046", "topic": "防火與特殊現象", "stem": "建築物發生閃燃（Flashover）現象，下列敘述何者錯誤？", "opts": {"A": "延遲建築物火災到達閃燃階段，為最重要的避難對策", "B": "發生閃燃現象時，居室內的人生存機會低", "C": "同種類等面積之裝潢材料中，壁面影響閃燃時間（F.O.T.）最大", "D": "閃燃現象通常發生在建築物火災的成長期"}, "answer": "C", "explain": "對閃燃時間影響最大的是天花板裝修材料（高溫煙層直接加熱），而非壁面，故C錯。", "ref": "【111警察四等 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-047", "topic": "燃燒", "stem": "有關自然發火之物質，下列敘述何者正確？", "opts": {"A": "硝化棉為分解熱蓄積而發火之物質，在缺氧環境下，不會燃燒", "B": "油渣、塗料為氧化熱蓄積而發火之物質", "C": "活性碳為發酵熱蓄積而發火之物質", "D": "乾草堆為吸著熱蓄積而發火之物質"}, "answer": "B", "explain": "油渣、塗料含乾性油，氧化發熱蓄積而自燃。硝化棉分子含氧可自行燃燒；活性碳屬吸著熱；乾草堆屬發酵熱。", "ref": "【111警察四等 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-048", "topic": "爆炸", "stem": "有關沸騰液體膨脹蒸氣爆炸（BLEVE）之事故現象，下列敘述何者錯誤？", "opts": {"A": "專指沸騰狀態之液化瓦斯，氣化膨脹而爆炸之現象", "B": "為儲槽內平衡狀態之氣相與液相失控，液相迅速蒸發成氣相形成衝擊蒸氣之情形", "C": "火球是可燃性物質BLEVE之事故現象", "D": "BLEVE事故之特色為破片飛散"}, "answer": "A", "explain": "BLEVE泛指任何加壓液化液體（含水等不燃液體）儲槽破裂時急速汽化的爆炸，並非專指液化瓦斯，故A錯。", "ref": "【111警察四等 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-049", "topic": "爆炸", "stem": "鍋爐因為受腐蝕或發生溝狀侵蝕，導致鍋爐破裂，鍋爐內壓力急速回復為大氣壓力，導致爐內之水激烈氣化，使鍋爐裂縫繼續擴大，其噴出水蒸氣之推進作用使鍋爐體飛向空中。此類爆炸應歸類為：", "opts": {"A": "分解爆炸", "B": "機械爆炸", "C": "蒸氣爆炸", "D": "粉塵爆炸"}, "answer": "C", "explain": "過熱水因壓力驟降而急速相變為水蒸氣造成的爆炸，屬蒸氣爆炸（物理爆炸）。", "ref": "【111警察四等 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-050", "topic": "爆炸", "stem": "一般可燃性氣體，在高壓下之爆炸範圍大多與壓力成正向關係，下列何種氣體例外？", "opts": {"A": "C₃H₈", "B": "C₂H₄", "C": "CH₄", "D": "CO"}, "answer": "D", "explain": "一氧化碳是例外，壓力升高時其爆炸範圍反而變窄；多數烴類壓力升高時爆炸上限上升、範圍擴大。", "ref": "【111警察四等 第25題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-051", "topic": "熱傳", "stem": "下列何者之熱傳導係數最小？", "opts": {"A": "銅", "B": "鐵", "C": "水", "D": "二氧化碳"}, "answer": "D", "explain": "熱傳導係數一般為金屬＞非金屬固體＞液體＞氣體；二氧化碳為氣體，最小。", "ref": "【112警察四等 第1題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-052", "topic": "熱傳", "stem": "居室空間中引發全面性燃燒，下列何者為最主要的熱傳原因？", "opts": {"A": "自然對流", "B": "強制對流", "C": "熱輻射", "D": "熱傳導"}, "answer": "C", "explain": "全面燃燒（閃燃）主要由高溫煙層與天花板的輻射熱回饋，使室內可燃物同時熱分解起火。", "ref": "【112警察四等 第2題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-053", "topic": "滅火", "stem": "下列何種氣體，非為INERGEN（IG541）滅火藥劑的主要成分？", "opts": {"A": "氮", "B": "氬", "C": "二氧化碳", "D": "氟"}, "answer": "D", "explain": "IG541由氮52%、氬40%、二氧化碳8%組成，不含氟；含氟的是FM200等鹵化烴藥劑。", "ref": "【112警察四等 第3題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-054", "topic": "滅火", "stem": "在密閉空間注入不燃性氣體，使空間氧氣之濃度降低，進而使燃燒無法持續而熄滅，此種滅火方法為：", "opts": {"A": "移除法", "B": "冷卻法", "C": "窒息法", "D": "抑制法"}, "answer": "C", "explain": "以不燃性氣體稀釋或隔絕氧氣，降低助燃物濃度，屬窒息法。", "ref": "【112警察四等 第4題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-055", "topic": "燃燒", "stem": "當100克的碳完全燃燒時，理論上需要大約多少立方公尺的空氣？", "opts": {"A": "0.9", "B": "1.9", "C": "2.9", "D": "3.9"}, "answer": "A", "explain": "C＋O₂→CO₂，100/12≈8.33 mol需O₂ 8.33 mol×22.4 L≈186.7 L；空氣量＝0.1867/0.21≈0.89 m³，約0.9。", "ref": "【112警察四等 第5題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-056", "topic": "危險物品", "stem": "植物油中，一般碘價數大者，油脂越容易氧化，起火之危險也越大；相同環境條件下，下列何者最易氧化發熱起火？", "opts": {"A": "亞麻仁油", "B": "樟腦油", "C": "葵花油", "D": "花生油"}, "answer": "A", "explain": "亞麻仁油是典型乾性油，碘價最高（約170以上），最易氧化蓄熱自燃；花生油為不乾性油，葵花油為半乾性油。", "ref": "【112警察四等 第6題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-057", "topic": "危險物品", "stem": "與水接觸能放出易燃性氣體的物質稱為：", "opts": {"A": "親水性物質", "B": "禁水性物質", "C": "水溶性物質", "D": "自熱物質"}, "answer": "B", "explain": "遇水產生可燃氣體（如鈉產生氫氣、碳化鈣產生乙炔）的物質稱禁水性物質，屬第三類公共危險物品。", "ref": "【112警察四等 第7題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-058", "topic": "煙與熱流", "stem": "大樓起火後因產生煙氣溫度較外界為高，此時可能會造成大樓內一股向上的氣流，此現象稱為：", "opts": {"A": "拉穿效應", "B": "複燃現象", "C": "閃燃現象", "D": "煙囪效應"}, "answer": "D", "explain": "室內溫度高於室外時，垂直通道內熱氣上升、下方補氣，稱（正）煙囪效應。", "ref": "【112警察四等 第8題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-059", "topic": "爆炸", "stem": "可燃性固體之微粒子浮游於空氣中，遇到火焰或放電火花而產生爆炸之現象稱為：", "opts": {"A": "高壓氣體爆炸", "B": "粉塵爆炸", "C": "蒸氣爆炸", "D": "分解爆炸"}, "answer": "B", "explain": "可燃固體微粒懸浮於空氣中達爆炸濃度並遇火源而爆炸，即粉塵爆炸。", "ref": "【112警察四等 第9題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-060", "topic": "熱傳", "stem": "有關熱傳導，下列敘述何者錯誤？", "opts": {"A": "熱傳導為熱流在固體內部傳遞的過程", "B": "熱傳導對於固體表面火勢之蔓延具有影響", "C": "兩個不同溫度之物體相互接觸時，熱由低溫物體流向高溫物體", "D": "傳導物體的截面積越大，傳導的熱量越多"}, "answer": "C", "explain": "熱只會自發地由高溫物體流向低溫物體，C方向相反。依傅立葉定律，截面積愈大傳熱量愈多。", "ref": "【112警察四等 第10題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-061", "topic": "熱傳", "stem": "熱透過流動介質，將熱量由一處傳到另一處的現象稱為：", "opts": {"A": "熱輻射", "B": "熱傳導", "C": "熱對流", "D": "熱變化"}, "answer": "C", "explain": "藉流體（氣體、液體）流動帶走熱量的傳熱方式為熱對流。", "ref": "【112警察四等 第11題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-062", "topic": "熱傳", "stem": "甲、乙輻射體的溫度分別為1000 K、250 K，甲輻射體之輻射熱為乙之幾倍？", "opts": {"A": "4倍", "B": "16倍", "C": "64倍", "D": "256倍"}, "answer": "D", "explain": "輻射熱與絕對溫度四次方成正比：(1000/250)⁴＝4⁴＝256倍。", "ref": "【112警察四等 第12題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-063", "topic": "燃燒", "stem": "若把空氣中的氮氣換成氦氣，其對於甲烷的燃燒性質有何明顯影響？", "opts": {"A": "發火溫度降低", "B": "燃燒上限升高", "C": "燃燒範圍擴大", "D": "最小發火能量升高"}, "answer": "D", "explain": "氦的熱傳導率遠大於氮，火花能量易散失，所需最小發火能量升高；惰性氣體熱傳導率愈大，抑制效果愈好。", "ref": "【112警察四等 第13題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-064", "topic": "燃燒", "stem": "可燃物如獲充分之氧氣供應，其可燃成分燃燒殆盡，稱為何種燃燒型態？", "opts": {"A": "定常燃燒", "B": "完全燃燒", "C": "蒸發燃燒", "D": "均一系燃燒"}, "answer": "B", "explain": "氧氣充足、可燃成分全部氧化（如碳生成CO₂）稱完全燃燒；氧氣不足會產生CO等為不完全燃燒。", "ref": "【112警察四等 第14題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-065", "topic": "火災", "stem": "木造屋火災非完全燃燒時的產物，下列敘述何者錯誤？", "opts": {"A": "會產生CO", "B": "會產生水氣", "C": "燃燒過程中會產生可燃性中間產物", "D": "不產生CO₂"}, "answer": "D", "explain": "不完全燃燒時部分碳仍會完全氧化，因此CO₂與CO同時存在，說不產生CO₂是錯的。", "ref": "【112警察四等 第15題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-066", "topic": "燃燒", "stem": "引火源種類中，下列何者不是微火源？", "opts": {"A": "線香", "B": "火柴燃燒", "C": "熔接火花", "D": "香煙"}, "answer": "B", "explain": "微火源指線香、香菸、熔接火花等無焰或能量小的火源；火柴燃燒有明火焰，屬有焰火源。", "ref": "【112警察四等 第16題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-067", "topic": "熱傳", "stem": "定溫式探測器於火災發生時作動，熱主要是以何種方式傳遞？", "opts": {"A": "傳導熱", "B": "對流熱", "C": "輻射熱", "D": "蒸發熱"}, "answer": "B", "explain": "火羽流把高溫氣體帶到天花板並沿頂棚流動，加熱天花板上的感熱元件，主要為對流傳熱。", "ref": "【112警察四等 第17題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-068", "topic": "火災", "stem": "空氣在某一溫度下，實際所含水蒸氣量與飽和蒸氣量之比，稱為：", "opts": {"A": "有效濕度", "B": "絕對濕度", "C": "實效濕度", "D": "相對濕度"}, "answer": "D", "explain": "相對濕度＝實際水蒸氣量／同溫度飽和水蒸氣量×100%；絕對濕度是單位體積空氣所含的水蒸氣質量。", "ref": "【112警察四等 第18題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-069", "topic": "火災", "stem": "對於半斷線處，下列敘述何者錯誤？", "opts": {"A": "截面積增加", "B": "電阻值增加", "C": "易產生過熱", "D": "易產生電氣火花"}, "answer": "A", "explain": "半斷線處導體部分斷裂，有效截面積減少，電阻增加而局部過熱並可能產生火花，故A錯。", "ref": "【112警察四等 第19題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-070", "topic": "防火與特殊現象", "stem": "有關液體之帶電，下列敘述何者正確？", "opts": {"A": "燈油、汽油、酒精等可燃性液體均容易產生液體帶電", "B": "液體與管路、油槽壁或過濾固體表面流動摩擦所發生", "C": "液體靜止中，不會因氣泡上昇或沉澱而發生靜電", "D": "液體不會因流動與其他液體表面發生摩擦而發生靜電"}, "answer": "B", "explain": "液體帶電主要來自與管壁、槽壁、過濾器等流動摩擦。酒精導電度高不易蓄電；靜置時氣泡上升、沉澱或液液摩擦也可能帶電。", "ref": "【112警察四等 第20題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-071", "topic": "危險物品", "stem": "爆炸性物質含下列何種成分愈多，敏感性愈高？", "opts": {"A": "羰基（CO）", "B": "硝基（NO₂）", "C": "胺基（NH₂）", "D": "磺基（SO₂）"}, "answer": "B", "explain": "硝基為爆炸性原子團，分子中硝基愈多，自身含氧愈多、敏感度與爆炸威力愈高（如TNT、硝化甘油）。", "ref": "【112警察四等 第21題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-072", "topic": "火災", "stem": "有關建築火災t²理論，快速火災成長係指多少秒內達到約1 MW？", "opts": {"A": "75秒", "B": "100秒", "C": "150秒", "D": "300秒"}, "answer": "C", "explain": "t²火災成長分級（達約1 MW）：超快速75秒、快速150秒、中速300秒、慢速600秒。", "ref": "【112警察四等 第22題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-073", "topic": "爆炸", "stem": "液體變化為氣體之物理現象中，若變化速度至為急速時，因能量於極短時間內釋出，即形成爆炸，稱為：", "opts": {"A": "粉塵爆炸", "B": "分解爆炸", "C": "炸藥爆炸", "D": "蒸氣爆炸"}, "answer": "D", "explain": "液體急速相變為氣體造成體積暴增的物理性爆炸即蒸氣爆炸；其他選項皆為化學性爆炸。", "ref": "【112警察四等 第23題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-074", "topic": "爆炸", "stem": "盛裝液體的儲槽受熱突然破裂，導致液體迅速氣化、膨脹所引起之爆炸稱為：", "opts": {"A": "粉塵爆炸", "B": "分解爆炸", "C": "沸騰液體膨脹蒸氣爆炸", "D": "水蒸氣爆炸"}, "answer": "C", "explain": "受熱儲槽破裂、加壓液體驟降壓而急速沸騰膨脹，即沸騰液體膨脹蒸氣爆炸（BLEVE）。", "ref": "【112警察四等 第24題】", "subject": "火災學", "src": "old"}, {"id": "F-X5-075", "topic": "爆炸", "stem": "有關爆炸的破壞效果，下列敘述何者錯誤？", "opts": {"A": "衝擊波（爆風）對物體造成的破壞效果為單方向由爆心向外", "B": "對爆源附近物體造成的直接破壞效果由爆轟波的壓力決定", "C": "衝擊波（爆風）可對遠距離物體造成破壞效果", "D": "低壓狀態之瓦斯爆炸，破片效果（最初的破片效果）較小"}, "answer": "A", "explain": "衝擊波通過後會出現負壓相，造成往爆心方向的吸回作用，破壞並非只有由爆心向外的單一方向，故A錯。", "ref": "【112警察四等 第25題】", "subject": "火災學", "src": "old"}], "essays": [{"id": "E-P113-1", "source": "升官等", "year": 113, "no": "一", "calc": false, "type": "公式＋名詞", "stem": "請以公式說明何謂減光率？（10分）若在減光係數分別為0.1、1、10之下，請敘述火場能見情況為何？（15分）", "outline": ["一、（一）減光率（遮光率）定義：不透明度百分比，S＝(I₀−I)/I₀×100＝(1−透光率)×100；說明I₀入射光強度、I透射光強度", "二、相關公式加分：光學密度 D＝log(I₀/I)；Lambert-Beer I＝I₀e^(−KL) → D＝KL/2.3；D＝2−log(100−S)；K為減光係數（m⁻¹）", "三、（二）能見度經驗式：發光體 K×S＝8、反光體 K×S＝3（S能見度m）；K愈大煙愈濃、能見度愈短（S∝1/K）", "四、代入：K＝0.1 → 發光體80 m、反光體30 m；K＝1 → 8 m、3 m；K＝10 → 0.8 m、0.3 m", "五、各K值對應之火場能見情況文字描述（如煙霧感知程度、避難是否受阻、伸手不見五指等）（筆記未涵蓋，需補讀）", "六、結論：能見度影響避難逃生，可連結ASET判定指標與對比度臨界值−0.02"], "calcHint": "", "notes": "火災學筆記第12講（煙濃度、光學密度、能見度）；第37講公式13；第二部主題十一；第三部題型15", "tips": "第二小題15分筆記只能用 KS＝8／3 推能見距離，文字化的「能見情況」對照表需補讀（總表註明見 Ch7 教材）。本題禁用計算機，數字都可心算。"}, {"id": "E-P113-2", "source": "升官等", "year": 113, "no": "二", "calc": false, "type": "繪圖＋公式", "stem": "請繪圖說明NFPA 92B之T-Square火災成長曲線圖。（15分）並說明此圖之火災成長曲線中成長係數與時間的關係。（10分）", "outline": ["一、t²火災成長理論：燃料燃燒釋熱率與時間平方成正比，直到燃料燒盡或釋熱率達最大值（之後進入穩態燃燒）", "二、（一）繪圖（15分）：橫軸時間（s）、縱軸釋熱率（kW）；畫四條拋物線 slow／medium／fast／ultra fast，並畫水平線 1055 kW（1000 BTU/s），標出各曲線到達時間 600／300／150／75 s", "三、NFPA 92B 公式：Q＝αt²（Q kW、t s、α 火災成長係數 kW/s²）；以到達1055 kW時間分類", "四、（二）成長係數表：Slow 0.00293（600 s）、Medium 0.01172（300 s）、Fast 0.0469（150 s）、Ultra fast 0.1876（75 s）；關係：α＝1055/t²，α愈大到達時間愈短、成長愈快（α與到達時間平方成反比）", "五、另一式：Q＝(t/K)²（Q MW、K sec/MW^½：600/300/150/75，K愈小愈快）；E＝⅓tQ（曲線下面積）", "六、加分比較：NFPA 72 只分三類且為區間（slow α≦0.0066、t≧400 s…）；92B 四類固定值"], "calcHint": "", "notes": "火災學筆記第9講三（成長性、t²理論、NFPA 92B／72）；第二部主題九「火災成長 t² 理論」；第三部題型12", "tips": "題目要求「繪圖」占15分，一定要畫四條曲線＋1055 kW水平線並標時間。α 與 K 是不同東西（單位不同）別混用。"}, {"id": "E-P113-3", "source": "升官等", "year": 113, "no": "三", "calc": false, "type": "名詞＋法規", "stem": "請說明根據國內滅火器認可基準規範下，火災的分類，（15分）以及各分類之滅火方式。（10分）", "outline": ["一、（一）依內政部106年6月27日修正「滅火器認可基準」四類：A類普通火災（木材、紙張、纖維、棉毛、塑膠、橡膠等可燃性固體）", "二、B類油類火災（石油類、有機溶劑、油漆類、油脂類等可燃性液體及可燃性固體）；C類電氣火災（電氣配線、馬達、引擎、配電盤等通電中之電氣機械器具及設備）；D類金屬火災（鈉、鉀、鎂、鋰、鋯等金屬）", "三、（二）滅火方式 A類：冷卻為主—水、機械泡沫、ABC乾粉可用；CO₂不適用、BC乾粉不適用", "四、B類：窒息／抑制為主—機械泡沫、CO₂、鹵化烷、ABC與BC乾粉；水柱不可（霧狀水可）", "五、C類：用不導電藥劑—CO₂、鹵化烷、ABC與BC乾粉；不可用水與泡沫（筆記適用性表對C類水列×，另註水霧狀可用於B、C類，兩處不一 ⚠️待確認）", "六、D類：只能用D類專用乾粉（TEC、Lith-X、Met-L-X）或金屬火災液體藥劑（TMBX）、乾砂；禁用水與一般藥劑", "七、加分：滅火四原理（隔離、窒息、冷卻為物理；抑制為唯一化學）；提醒CNS 1387另有C類＝氣體、F類＝烹調油，與本基準不同"], "calcHint": "", "notes": "火災學筆記第9講二（火災分類）、第36講四（滅火原理與藥劑適用性總整理）、第34講（D類乾粉）、第35講（金屬火災液體藥劑）；第二部主題九、十九", "tips": "題目指定「滅火器認可基準」，C類是電氣火災，不要寫成CNS 1387的氣體。滅火方式建議以表格（類別×藥劑○×）呈現。"}, {"id": "E-P113-4", "source": "升官等", "year": 113, "no": "四", "calc": true, "type": "名詞＋計算", "stem": "何謂理論空氣量？（10分）請以1公斤的碳來說明其燃燒需要多少公斤的理論空氣量？（15分）", "outline": ["一、（一）理論空氣量定義：可燃物完全燃燒所需之最少空氣量，由燃料中各可燃成分（C、H、S）所需空氣量求和，並扣除燃料本身所含O可提供之氧量", "二、寫出化學平衡式：C＋O₂→CO₂；H＋¼O₂→½H₂O；S＋O₂→SO₂；O→½O₂；並說明實際空氣量 La＝m×Lo（m＞1）", "三、（二）五步驟（重量）：C莫耳數→所需O₂莫耳數→×32得氧克數→÷0.23得空氣克數→÷1000得公斤", "四、代入計算1 kg碳（見calcHint），並用公式 Lw＝〔11.6C＋34.8(H−O/8)＋4.3S〕/100 驗證（C＝100）", "五、結論：1 kg碳約需11.6 kg理論空氣（體積約8.9 m³，標準狀態）"], "calcHint": "C＋O₂→CO₂。①C莫耳數＝1000 g÷12＝83.33 mol ②需O₂＝83.33 mol ③O₂重＝83.33×32＝2666.7 g ④空氣重＝2666.7÷0.23＝11594 g ⑤＝11.59 kg≒11.6 kg。公式驗證：Lw＝11.6×100/100＝11.6 kg。（若題給氧重量比23.2%：÷0.232＝11.49 kg；體積：Lv＝8.9 m³）（Python 驗算 11.594 kg）", "notes": "火災學筆記第4講（計算應用題型二、五步驟、Lv／Lw公式）、第5講（實際空氣量）；第二部主題五「理論空氣量」；第三部題型6、7", "tips": "本題禁用計算機：1000/12×32＝2666.7、÷0.23 要能手算。氧的重量百分比題目沒給就用0.23。"}, {"id": "E-P111-1", "source": "升官等", "year": 111, "no": "一", "calc": false, "type": "對策", "stem": "請說明在作業環境中，如何避免因靜電放電火花而引起災害發生。（25分）", "outline": ["一、破題：靜電定義（帶電序位差大之絕緣物質因摩擦、剝離、流動、噴出、撞擊生成、安靜不流動之電荷）＋ESD定義；產生原因六種", "二、災害過程四步：發生靜電→帶電體內部分極→放電火花→火花處有可燃物且其最小點火能量低於火花熱能；導體放電能量H＝½CV²悉數放出", "三、對策（1）防止發生：減少摩擦、選帶電序列相近材質、使用導電性材料、使用除電劑", "四、對策（2）洩漏防止蓄積：接線（Bonding，消除導體間電位差）與接地（消除導體與大地電位差）；提高相對濕度60～70%以上（30%以下蓄積增加）", "五、對策（3）中和防止蓄積：高壓離子化（電暈放電）、靜電誘導離子化（附鋼毛金屬棒）", "六、對策（4）發生火花亦不引火：以不活性氣體代替氧使氧濃度低於極限氧濃度；或使可燃蒸氣濃度達爆炸界限以上", "七、結論：四大類依序對應災害過程四步（阻斷任一環即可），可畫流程對照圖"], "calcHint": "", "notes": "火災學筆記第27講（靜電定義、ESD、火災過程、防止方法四大類）；第二部主題十六「靜電災害防止方法」", "tips": "老師：防止方法「很重要」。用四大類標題撐骨架，每類2～4點；把對策對應回災害過程四步可顯出結構。"}, {"id": "E-P111-2", "source": "升官等", "year": 111, "no": "二", "calc": false, "type": "名詞列舉", "stem": "由於都市之發展快速，人口集中，在有限之土地資源下，高層建築物愈來愈多。近年來國外高樓大火案例也不少，請說明高樓建築物結構之特性及火災之特性。（25分）", "outline": ["一、定義：高樓（NFPA：上層樓地板高度超越雲梯車最大高度、須由內部搶救；EFPA：消防車輛無法到達之樓層）；高層建築物（建技規則第227條：高度50 m或16層以上，法定名稱用「高層」）", "二、結構特性（由筆記火災特性之成因歸納）：氣密性較好、多為密閉式建築；內部有垂直管道與上下樓梯通道；距地面高、縱深大、通路長；高度可能超出雲梯車操作範圍；其餘結構特性（筆記未涵蓋，需補讀）", "三、火災特性五項：①濃煙密佈（氣密→初期供氣不足→不完全燃燒）②高溫灼熱（密閉→熱蓄積）③延燒快速（垂直管道與樓梯形成煙囪效應）④逃生不易 ⑤搶救困難（雲梯車不及；風力、荷重、噴水反作用力影響穩定）", "四、加分：消防安全設計目的（人命安全、避免財損、建物持續耐用）與六項設計內容（內裝不燃化、結構耐火、防火區劃、逃生通道與出口、排煙通風、消防安全設備）", "五、加分：逃生通道設計「直覺」與「萬全」原則（二方向避難）；避難七行為特性"], "calcHint": "", "notes": "火災學筆記第23講第三節（高樓定義、火災五特性、設計、直覺萬全原則、避難行為）；第14講（煙囪效應）；第二部主題十四", "tips": "「結構特性」筆記沒有獨立段落，需補讀；火災特性五項每項都要寫出「結構原因→火災現象」的因果。"}, {"id": "E-P111-3", "source": "升官等", "year": 111, "no": "三", "calc": false, "type": "名詞＋對策", "stem": "請以乙炔（C₂H₂）氣體為例，說明何謂分解爆炸反應及如何防範分解爆炸。（25分）", "outline": ["一、分解爆炸定義：化合物進行分解反應時釋放大量熱量而產生之爆炸；常見氣體乙炔、環氧乙烷、聯氨、乙烯、NOₓ", "二、分解爆炸條件：①分解反應為放熱反應 ②存在火源（熱源）或加壓 ③系統初始壓力大於分解爆炸界限壓力", "三、乙炔實例：來源 CaC₂＋2H₂O→C₂H₂＋Ca(OH)₂；加壓分解反應 C₂H₂→2C＋H₂，ΔH＝−54.2 kcal/mol（放熱）；火災危險性（極易燃、爆炸範圍極寬2.5～81%、侷限空間加壓加溫爆炸、與活潑金屬生爆炸性乙醯鹽）", "四、防範①：添加不起分解爆炸之氣體—降低乙炔濃度＋添加氣體熱分解吸熱使火焰熄滅（分子熱愈大效果愈好）", "五、防範②：鋼瓶內置矽酸鈣多孔性物質＋丙酮溶劑溶解乙炔（1 atm下1 L丙酮溶25 L乙炔）；防範③：不得用銅或含銅70%以上銅合金（生成Cu₂C₂、Ag₂C₂爆炸物，職安設施規則第213條）", "六、防範④操作與搶救：切割完畢先關氧氣→延伸管→乙炔流量閥→氣瓶（防回火）；火災時冷卻容器、安全閥聲音變尖或容器褪色立即撤離"], "calcHint": "", "notes": "火災學筆記第19講第三節（分解爆炸、乙炔）；第二部主題十三「分解爆炸」「乙炔之分解爆炸與防止」；第7講（乙炔燃燒界限）", "tips": "反應式與 ΔH 要寫出；防範對策分「成分（添加氣體）／儲存（多孔物＋丙酮）／材質（禁銅）／操作（關閥順序）」四層，結構清楚。"}, {"id": "E-P111-4", "source": "升官等", "year": 111, "no": "四", "calc": false, "type": "過程＋對策", "stem": "液化石油氣儲槽外部受火熱時，容易發生BLEVE（Boiling Liquid Expanding Vapor Explosion）現象，請說明其發生過程以及如何避免其發生。（25分）", "outline": ["一、定義：BLEVE沸騰液體膨脹蒸氣爆炸＝沸騰狀態之液體氣化膨脹而產生爆炸之現象", "二、發生過程①：易燃液體以高壓儲槽儲存，火災時外部加熱→內壓上升→儲槽一部份被破壞", "三、過程②：儲槽開口，內部高壓推可燃性蒸氣向外噴出；沸騰氣化膨脹再破壞儲槽，碎片劇烈飛散", "四、過程③④：噴出大量可燃蒸氣遇火→燃燒爆炸形成球狀火焰（火球）；儲槽碎片飛向相當遠處", "五、避免方法：①防液堤作成斜坡，集液部著火時火焰不直接接觸液槽 ②容器外部斷熱處理，熱侵入速度降為1/10、延長處理時間 ③設固定式冷卻撒水設備，避免儲槽直接受火焰加熱", "六、加分與結論：可補火球熱輻射危害、搶救時冷卻儲槽與警戒區設置；建議畫四階段示意圖"], "calcHint": "", "notes": "火災學筆記第33講三（BLEVE四階段＋三防止法，附圖）；第18講（戶外爆炸火球）；第二部主題十八「BLEVE」", "tips": "過程要分階段編號；筆記附 BLEVE 過程圖，可畫簡圖（儲槽受熱→破裂→噴出→火球＋碎片）加分。"}, {"id": "E-P109-1", "source": "升官等", "year": 109, "no": "一", "calc": false, "type": "名詞列舉", "stem": "都會區為有效利用有限之空間，常會興建地下建築物來符合空間之需求，由於地下建築物之結構與密閉式之高層建築物極為相似，因此地下建築物之火災與高樓火災，顯示之特徵亦有甚多相同之處，請說明二者相同之處為何？（10分）地下建築物火災特殊之處又為何？（15分）", "outline": ["一、破題（簡）：地下建築物定義—建技規則第179條（地下使用單元、地下通道等，如地下街），消防立場另含地下室與地下道；高層建築物—建技規則第227條（50 m或16層以上）", "二、（一）相同之處（10分）：①均需利用樓梯（或電梯）到達起火地點 ②濃煙密佈（開口少、供氣不足、不完全燃燒）③高溫灼熱（熱不易散失，地下常超過1000℃）④延燒快速 ⑤逃生不易 ⑥搶救困難（須戴空氣呼吸器、無法久留）", "三、（二）特殊之處（15分）①：火災現場瞬息萬變—結構複雜、用途分歧、極不安定", "四、特殊之處②：搶救工作危險重重—受上升濃煙高熱壓迫；進入時新鮮空氣突然侵入引發爆燃（Backdraft）", "五、特殊之處③④：火點發現困難（漆黑無光、濃煙充斥，可用紅外線火源探測器）；火勢發展頗難掌握（無法確定是否向上移動或越過水柱範圍）", "六、特殊之處⑤：水損嚴重—射水全積於地下，影響救火與財損；結論帶對策（排煙、防火區劃、紅外線探測）"], "calcHint": "", "notes": "火災學筆記第23講第三節（高層、地下建築物火災）；第二部主題十四「高樓建築物火災之特性」「地下建築物與其火災特性」", "tips": "配分10／15，分兩段並標(一)(二)。特殊之處五點每點寫一句原因，爆燃是亮點關鍵字。"}, {"id": "E-P109-2", "source": "升官等", "year": 109, "no": "二", "calc": false, "type": "名詞＋事例", "stem": "試說明積污導電現象之定義及成因。（10分）有那些事例易造成絕緣物產生積污導電現象？（15分）", "outline": ["一、（一）定義（Tracking、電痕、沿面洩漏放電）：異極導體間絕緣物表面附著水分及灰塵或含電解質之液體、金屬粉塵等導電性物質，表面流通電流產生焦耳熱→局部水分蒸發→附著物間小規模放電→周而復始→絕緣性破壞形成異極間導電通路", "二、成因歸類：屬異常焦耳熱之「正常回路外電流的流通」中，電氣因素造成之絕緣破壞—絕緣物表面附著導電性物質（與銀離子移動同類）；最後有機絕緣體石墨化（碳化導電通路）", "三、比較加分：積污導電（初期因電解質污染物附著而通電）vs 金原現象（絕緣體本身導電化）；二者最後皆石墨化；積污導電不屬「電阻值降低」", "四、（二）易生事例：筆記僅列插頭累積塵埃及水分使兩極形成通路而短路發熱起火；其他事例（如潮濕、鹽分、油污、粉塵環境之插座、配電盤、端子台等）（筆記未涵蓋，需補讀）", "五、結論：預防—定期清掃插頭與插座積塵、防潮、使用防塵蓋，並可提電氣火災防範對策"], "calcHint": "", "notes": "火災學筆記第25講（異常焦耳熱、積污導電、金原現象異同）；第二部主題十六「積污導電現象」", "tips": "老師：積污導電「選擇題和申論題都會考」，最常考與金原現象比較。第二小題15分的事例筆記只有一例，需補讀擴充。"}, {"id": "E-P109-3", "source": "升官等", "year": 109, "no": "三", "calc": true, "type": "計算", "stem": "異丙醇（Isopropanol），分子式為C₃H₈O，其閃火點（flash point）為12℃，㈠請用化學理論濃度估算異丙醇之爆炸下限為何？（10分）㈡在常壓下，其於12℃時之飽和蒸汽壓為多少mmHg？（7分）㈢請依據Burgess-Wheeler定理，估算異丙醇之燃燒熱約為多少kJ/mole？（8分）（Burgess-Wheeler定理為C(LEL)×Q（kcal/mole）＝1100）", "outline": ["一、㈠（10分）配平 C₃H₈O＋4.5O₂→3CO₂＋4H₂O（燃料自含1個O要扣）；化學計量濃度 Co＝1÷(1＋4.5/0.21)×100；Jone's Rule LEL＝0.55Co", "二、㈡（7分）觀念：閃火點＝液面蒸氣濃度恰達爆炸下限之最低溫度，故閃火點下之飽和蒸氣壓 P＝LEL×P₀（LFL＝P/P₀×100 反求），P₀＝760 mmHg", "三、㈢（8分）Burgess-Wheeler：LEL×Q＝1100 → Q（kcal/mol）＝1100÷LEL，再×4.18換kJ/mol", "四、結論：列出三個答案並註明為估算值；可補危險性說明（閃火點12℃屬酒精類／易燃液體）"], "calcHint": "㈠ C₃H₈O＋4.5O₂→3CO₂＋4H₂O；Co＝1÷(1＋4.5/0.21)×100＝4.46%；LEL＝0.55×4.46≒2.45%。㈡ P＝LEL×760＝0.0245×760≒18.6 mmHg。㈢ Q＝1100÷2.45≒449 kcal/mol；×4.18≒1875 kJ/mol（約1.88×10³ kJ/mol）。（Python 驗算：Co 4.4586、LEL 2.4522、P 18.64、Q 448.6 kcal→1875.0 kJ）", "notes": "火災學筆記第7講（燃燒界限、Co、Jone's／Lloyd's／B-W）；第二部主題七「化學計量濃度」「Burgess-Wheeler Law」；第三部題型9", "tips": "注意本題 B-W 常數題目給 1100（筆記板書為 1059），照題目。O 原子要從所需氧中扣除（4.5 不是 5）。"}, {"id": "E-P109-4", "source": "升官等", "year": 109, "no": "四", "calc": false, "type": "法規列舉", "stem": "請詳述公共危險物品有那六大類？（15分）並將各危險物品之圖式以下列各危害圖示之代號答題，不用畫圖。（10分）〔附圖：A腐蝕、B骷髏與交叉骨、C驚嘆號、D健康危害、E氣體鋼瓶、F圓圈上火焰、G火焰、H爆炸炸彈、I無〕", "outline": ["一、（一）六大類（依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法第3條）：第一類氧化性固體、第二類易燃固體、第三類發火性液體發火性固體及禁水性物質、第四類易燃液體及可燃液體、第五類自反應物質及有機過氧化物、第六類氧化性液體（口訣：氧固、易固、禁水、易液、自反、氧液）", "二、各類詳述要點：第一類本身不燃、受熱衝擊摩擦分解放氧，無機過氧化物禁水；第二類低溫易著火（赤磷、硫磺、金屬粉、固態酒精）；第三類與空氣5分鐘內引燃或遇水反應（鉀鈉10 kg、黃磷20 kg）", "三、續：第四類閃火點分級七種（易燃≦93℃、可燃93～250℃）；第五類無氧亦可激烈放熱分解、-O-O-結構、A～D型；第六類過氯酸、過氧化氫、硝酸", "四、（二）圖示代號：第一類→F（圓圈上火焰）、第二類→G（火焰）、第三類→G、第四類→G、第五類→A型H（炸彈）／B型H＋G／C、D型G、第六類→F（第一～三類圖示筆記標依GHS通則補 ⚠️待確認）", "五、補充：可一併提NFPA 704M菱形（紅可燃、黃反應、藍健康、白特殊W／OXY，0～4級）"], "calcHint": "", "notes": "火災學筆記第29講（六類、第一～三類）、第30講（第四～六類、第五類分型圖示、NFPA 704M）；第二部主題十八", "tips": "題目附九格GHS圖示（A～I），以代號作答不必畫圖。第五類要分型寫、B型＝炸彈＋火焰老師特別強調。"}, {"id": "E-P107-1", "source": "升官等", "year": 107, "no": "一", "calc": false, "type": "實務程序", "stem": "國內某市一印刷電路板（PCB）工廠發生嚴重火災造成消防人員多人傷亡，凸顯危害性化學品災害救災人員行動安全的重要性，請說明危害性化學品災害現場搶救標準作業程序（H.A.Z.M.A.T.）有關危害辨識、行動方案、區域管制等三方面有那些程序。（25分）", "outline": ["一、破題：H.A.Z.M.A.T.＝消防搶救指揮人員於化學物質、工廠災害搶救之安全標準作業程序；列出六字母（H危害辨認、A行動方案、Z區域管制、M管理系統、A請求支援、T善後處理）；平時備妥MSDS（SDS）、ERG、毒化物防救手冊", "二、H 危害辨識：①抵達前查詢資料、確認危害物與理化特性 ②現場觀察（火與煙顏色、燃燒氣味）研判爆炸等危險 ③持保守態度、質疑現場標示，以佐證資料確認", "三、A 行動方案：①謀定而後動 ②行動前瞭解有哪些危險、何種化學物質、需何種器材裝備 ③指揮人員分析災害規模、動員人力裝備、是否疏散民眾 ④依可動用資源規劃具體可行方案並實施", "四、Z 區域管制：①儘早劃定管制區 ②三區—禁區（熱區／紅）、除污區（溫區／黃）、支援區（冷區／綠）③指揮站設支援區，民眾記者在支援區外 ④隔離距離參考ERG", "五、Z 注意事項（筆記標 ⚠️依一般搶救實務補）：上風、高處設支援區與指揮站；經除污走廊進出熱區；熱區人員穿相當等級防護衣與空氣呼吸器、兩人一組限時管制；依風向調整", "六、結論：扣回PCB廠案例—人員安全優先，辨識不清前不貿然進入"], "calcHint": "", "notes": "火災學筆記第38講一（H.A.Z.M.A.T.）；第二部主題二十", "tips": "第38講為補充考點（依題庫書補，非上課內容）。建議畫三區同心圓示意圖（熱／溫／冷區＋除污走廊＋指揮站位置）。"}, {"id": "E-P107-2", "source": "升官等", "year": 107, "no": "二", "calc": false, "type": "繪圖＋名詞", "stem": "建築火災避難性能評估中，常以可行安全避難時間（ASET）與必要安全避難時間（RSET）兩者相比較，請試繪出從火災起火至可承受極限（tenability limit）之時間序列，說明ASET及RSET的意義，另請說明避難性能設計實務上，如何評判一居室空間之人員避難安全？（25分）", "outline": ["一、繪時間序列圖：時間軸標起火→探測→警報→避難開始（反應時間）→移動完成（RSET終點）→可承受極限（ASET終點），兩者差為安全餘裕", "二、ASET 意義：從起火到室內環境達人員可承受極限的時間；判定指標—煙層下降高度（常取約1.8 m ⚠️待確認）、溫度、CO等毒性氣體、能見度（KS＝8／3）、輻射熱", "三、RSET 意義：起火到完成避難所需時間＝探測時間＋警報時間＋避難前反應時間（認知、決策、準備）＋移動時間（步行＋出口通過／排隊）", "四、評判原則：ASET＞RSET（並保留安全餘裕）即避難安全；否則增設探測警報、排煙、加寬出口、縮短步行距離", "五、居室評判實務：ASET端以煙層下降時間估算 t＝20A/(P·g^½)×(1/√h−1/√y) 並檢核溫度、CO、能見度；RSET端＝避難開始時間＋步行時間（距離÷步速）＋出口通過時間（人數÷(流動係數×有效寬度)，流動係數約1.5人/(m·s) ⚠️待確認）；比較煙層降至可承受高度時間＞全員離開居室時間"], "calcHint": "", "notes": "火災學筆記第38講四（ASET／RSET、時間序列圖）、第13講（煙層下降時間）、第12講（能見度）；第二部主題二十；第三部題型16", "tips": "題目明訂要「繪」時間序列—圖占分，務必畫出並標註ASET、RSET與安全餘裕。第38講為補充考點，數值各書不一（⚠️）。"}, {"id": "E-P107-3", "source": "升官等", "year": 107, "no": "三", "calc": false, "type": "名詞列舉", "stem": "根據火災統計資料顯示火災致死原因主要是濃煙危害問題，請說明煙的組成？火場中濃煙的危害作用有那些？（25分）", "outline": ["一、煙定義與組成：浮游於空中之固體或液體微粒子及材料分解或燃燒所生氣體之混合物；三類—①未完全燃燒的液體、固體分解物和冷凝物微粒 ②氣體燃燒產物 ③未燃可燃蒸氣及捲吸混入之大量空氣", "二、危害總綱：煙的毒性、煙的高熱、視覺障礙三大類", "三、毒性八項：CO（與血色素結合阻礙輸氧；3000～5000 ppm 20～30分死亡、1% 1分鐘死亡）、HCN（妨礙細胞氧化酵素→細胞呼吸停止）、HCl（PVC，傷皮膚與氣道）、NO₂、CO₂（降低氧分壓，20%以上短時間死亡）、HCHO、丙烯醛、缺氧（21→17→10→6%三段症狀）", "四、高熱：熱交換四途徑（傳導、對流、輻射、蓄積）；忍耐時間與放射熱平方成反比、與熱慣性kρc成正比；燒傷四級；NFPA 101熱忍限值（1.5 m之上93℃、之下49℃）", "五、視覺障礙：煙遮光阻斷逃生；煙生成率M＝0.188Py^(3/2)；煙層下降時間公式；能見度KS＝8（發光體）／3（反光體）", "六、結論：強調濃煙為致死主因→防煙排煙、早期避難"], "calcHint": "", "notes": "火災學筆記第12講（煙定義、組成、能見度）、第13講（煙的危害）；第二部主題十一", "tips": "老師：毒性八項「一定要記起來」，CO濃度症狀表考過25分。篇幅重心放在毒性，數字記關鍵值即可。"}, {"id": "E-P107-4", "source": "升官等", "year": 107, "no": "四", "calc": true, "type": "計算", "stem": "某高樓之安全梯採正壓設計，出入口防火門之尺寸2.2 m(H)×1.1 m(W)，開啟推力133 N，施力點距門邊15 cm，自動關門器及磨擦之總力50 N，試計算該門兩側壓差有多大（Pa）？（25分）", "outline": ["一、寫公式與符號：開門所需力量＝克服自鎖力＋克服壓差之力，F＝F_d＋K_d·W·A·ΔP÷[2(W−d)]，K_d＝1.0；逐一定義F、F_d、W、A、ΔP、d", "二、整理已知：F＝133 N、F_d＝50 N、W＝1.1 m、H＝2.2 m、A＝W×H、d＝0.15 m", "三、移項反求ΔP並代入計算", "四、結論：壓差約59 Pa，低於NFPA建議上限100 Pa、開門力等於133 N上限；可補避難通道加壓排煙法原理（避難通道壓力高於起火居室，煙無法逸入）"], "calcHint": "公式：F＝F_d＋K_d·W·A·ΔP÷[2(W−d)] → ΔP＝2(F−F_d)(W−d)÷(K_d·W·A)。代入：A＝2.2×1.1＝2.42 m²；ΔP＝2×(133−50)×(1.1−0.15)÷(1×1.1×2.42)＝157.7÷2.662≒59.2 Pa。（Python 驗算 59.24 Pa）", "notes": "火災學筆記第15講五（避難通道加壓排煙、開門所需力量）、第16講（例題）；第二部主題十一「開門所需力量」；第三部題型20", "tips": "d 是施力點（把手）到靠近把手那側門邊的距離；A 是門面積。最後帶一句 NFPA 133 N、100 Pa 規範作結論。"}, {"id": "E-P105-1", "source": "升官等", "year": 105, "no": "一", "calc": false, "type": "名詞＋對策", "stem": "依美國國家防火協會（簡稱NFPA）對煙所下之定義為何？防煙區劃的種類有那些？並請敘述各防煙區劃的適用場所和區劃原理。（25分）", "outline": ["一、NFPA 煙定義：物質熱分解或燃燒時所釋出之空氣中固體與液體微粒子及氣體，以及被捲入或混合其中之空氣的總稱（筆記標：中譯為自譯 ⚠️待確認）；可補第12講煙的三類組成", "二、面積防煙區劃：一般樓層、大空間，每層樓地板面積每500 m²以防煙壁區劃（地下通道每300 m²）；原理＝天花板下方分成蓄煙空間，限制煙水平擴散並配合排煙口排煙", "三、豎穴防煙區劃：樓梯間、電梯井、管道間、挑空中庭；原理＝豎穴自成一區，阻止煙藉煙囪效應向上層蔓延", "四、用途防煙區劃：不同用途或管理權人空間相鄰處；原理＝依使用目的分區，避免一區之煙侵入其他用途空間", "五、避難路徑防煙區劃：走廊、特別安全梯與緊急昇降機間排煙室；原理＝保護避難通道並配合加壓排煙保持正壓", "六、防煙壁與排煙規定：不燃材料、自天花板下垂50 cm以上（地下通道80 cm）；排煙口距區劃內任一點水平30 m以下、設於天花板下80 cm內、連動停止空調", "七、結論：防煙對策三部分—抑制發生、阻止流動（防火門、防火閘門）、積極排煙（加壓排煙、排煙室排煙）"], "calcHint": "", "notes": "火災學筆記第38講五（NFPA 煙定義、防煙區劃）、第12講（煙定義三類組成）、第15講四（防煙對策）；第二部主題二十「防煙區劃與防煙壁」", "tips": "第38講為補充考點（非課程內容），防煙區劃分類名稱各書不一（筆記標 ⚠️）；建議用表格（種類／適用場所／原理）作答。"}, {"id": "E-P105-2", "source": "升官等", "year": 105, "no": "二", "calc": true, "type": "計算", "stem": "假設一侷限密閉空間內，大氣條件為760 mmHg，25℃，現有一瓶甲苯被打破，甲苯蒸氣逸散在室內，當達到平衡後，室內環境中仍有甲苯溶液殘留，試問：此空間甲苯濃度最大為何？有無火災爆炸危險？假設一侷限密閉空間體積為1000 m³之內，體積為100 ml之甲苯被打破，甲苯逸散在室內，當達到平衡後，室內環境中沒有甲苯溶液殘留，試問：此空間甲苯濃度最大為何？有無火災爆炸危險？〔甲苯（C₇H₈），25℃的飽和蒸氣壓為21 mmHg，分子量為92，密度為0.87 g/ml〕〔爆炸下限請依Jone's（鍾斯）理論估算〕（25分）", "outline": ["一、觀念：有液體殘留＝已達飽和蒸氣壓，濃度＝飽和蒸氣壓÷總壓；無液體殘留＝全部蒸發未飽和，濃度由液體重量→莫耳→氣體體積求（液體變蒸氣重量不變）", "二、爆炸範圍：配平 C₇H₈＋9O₂→7CO₂＋4H₂O，求化學計量濃度Co；Jone's LEL＝0.55Co、Lloyd's UEL＝3.5Co", "三、情境一計算並判定：濃度落在範圍內→有火災爆炸危險", "四、情境二計算並判定：濃度遠低於LEL→無火災爆炸危險", "五、結論：同一物質是否危險取決於量與空間；可補實務建議（通風、防火源）"], "calcHint": "【配平與界限】C₇H₈＋9O₂→7CO₂＋4H₂O；Co＝1÷(1＋9/0.21)×100＝2.280%；LEL＝0.55×2.280＝1.254%；UEL＝3.5×2.280＝7.98%。【情境一】濃度＝21/760×100＝2.763%，介於1.254%～7.98% → 有火災爆炸危險。【情境二】甲苯重＝100×0.87＝87 g；n＝87/92＝0.9457 mol；V＝nRT/P＝0.9457×0.082×298＝23.11 L＝0.0231 m³（或 0.9457×24.45 L）；濃度＝0.0231÷(1000＋0.0231)×100＝0.0023% ＜ 1.254% → 無火災爆炸危險。（Python 驗算：2.763、2.280、1.254、7.980、0.00231）", "notes": "火災學筆記第7講（燃燒界限）、第8講（例題四甲苯解答）；第二部主題七；第三部題型10（原題）", "tips": "先寫公式與常數再代入；溫度換K（273＋25）；公升與m³單位一致。本題可用計算機年度，但禁用年份要會手算。", "alsoIn": ["衝刺班 30"]}, {"id": "E-P105-3", "source": "升官等", "year": 105, "no": "三", "calc": false, "type": "名詞＋法規", "stem": "104年1月13日中華民國國家標準（CNS）1387，Z2003修正火災之分類，請說明修正後F類火災為何？若依我國消防法規中公共危險物品，其所屬於易燃性液體中之類別又為何？（25分）", "outline": ["一、CNS 1387（104.1.13修正）五類：A類固體材料（有機、燃燒後產生熾熱餘燼）、B類液體或可液化之固體、C類氣體、D類金屬、F類與炊煮器具所用烹調用介質（植物或動物油或脂肪）有關", "二、F類火災說明：烹調用油脂火災，重點寫定義原文（關鍵字：炊煮器具、烹調用介質、動植物油或脂肪）", "三、第四類公共危險物品＝易燃液體（閃火點93℃以下）及可燃液體（93℃以上未滿250℃），分七種：特殊易燃物、第一石油類、酒精類、第二～第四石油類、動植物油類（可附各類閃火點界線）", "四、對應：特殊易燃物～第四石油類屬B類火災；動植物油類（從動物脂肪、植物種子或果肉抽取、閃火點未滿250℃）屬F類火災", "五、陷阱提醒：CNS 1387的C類是「氣體」，與滅火器認可基準C類（通電中電氣）不同"], "calcHint": "", "notes": "火災學筆記第9講二（火災分類）、第30講（第四類七種＋本題原題例題）；第二部主題九「火災分類」、主題十八「第四類」", "tips": "本題為第30講原題例題（老師：104年消佐班亦考過）。第四類七種及閃火點分界可用表格呈現加分。", "alsoIn": ["衝刺班 31"]}, {"id": "E-P105-4", "source": "升官等", "year": 105, "no": "四", "calc": false, "type": "名詞列舉", "stem": "請敘述引發粉塵爆炸發生之五要素為何？並請列出影響粉塵爆炸之因素為何？（25分）", "outline": ["一、破題：粉塵爆炸定義（浮游可燃性固體微粒子與空氣混合至可燃濃度，遇火焰或放電火花爆炸）＋粉塵二次爆炸（堆積粉塵被揚起）", "二、五要素：可燃性粉塵、氧化劑（氧氣）、點火源＋粉塵懸浮擴散（Dispersion）、侷限空間（Confinement）；說明後兩者為粉塵特有（可畫五邊形示意圖）", "三、影響粉塵爆炸七因素：①化學組成（有機過氧化物、硝化物易爆；含水分灰分者不易，灰分15～30%以上不易爆炸）②粒徑愈小愈易 ③爆炸下限愈小界限愈廣愈易 ④與可燃性氣體共存下限下降 ⑤發火溫度愈低愈易 ⑥最小發火能量愈低愈易 ⑦溫度壓力增高愈易", "四、加分：影響爆炸界限／最小發火能量之環境因素（溫度、壓力、空氣組成）與粉塵自身因素（水分灰分、粒徑、加熱源、濃度）；氣體燃燒界限只受外部條件影響", "五、加分：兩種爆炸機制（揮發分解出可燃氣 vs 木炭焦炭金屬直接氧化）；結論可帶防護對策（耐爆、洩爆、抑爆、爆炸阻隔）"], "calcHint": "", "notes": "火災學筆記第19講第四節（五要素、七因素、界限與MIE影響因素）、第20講（防護對策）；第二部主題十三", "tips": "老師：影響因素「考試常常考」。水分同時降低浮游性、吸熱、稀釋氧，三個理由都寫。", "alsoIn": ["衝刺班 32"]}, {"id": "E-P103-1", "source": "升官等", "year": 103, "no": "一", "calc": false, "type": "名詞＋比較", "stem": "物質於常溫下可分為固態、液態及氣態三種物理狀態，可燃物的型態亦是如此區分。狀態不同，燃燒的過程及狀況也因此產生差異。請依燃燒性質及內容的不同，詳細說明定常燃燒與非定常燃燒、均一系燃燒與非均一系燃燒、混合燃燒與擴散燃燒之差異？並各舉一可燃物例詳細說明。（25分）", "outline": ["一、破題：物質燃燒形式依燃燒性質及定義內容分五大類，本題考其中三組；逐組寫「定義→差異→舉例」", "二、定常燃燒 vs 非定常燃燒：產生之熱與逸散之熱保持平衡、具均衡燃燒溫度（一般火災）vs 產生之熱超過逸散之熱、不能平衡（爆炸）；補非定常→熱蓄積→溫度升高→反應加速之惡性循環（關鍵字：產生熱、逸散熱、均衡燃燒溫度、惡性循環）", "三、均一系 vs 非均一系：可燃物與生成物均為氣體（氫氣、都市瓦斯）vs 可燃物與生成物不同物態（液體→氣體如汽油、固體→氣體如木材）；補燃燒生成物都是氣體，故可燃物為氣體即屬均一系（關鍵字：同一物態、Homogeneous／Heterogeneous）", "四、混合（預混合）燃燒 vs 擴散燃燒：燃燒前先與空氣預混成一定濃度再遇火源（瓦斯洩漏後開燈爆炸）vs 從噴口噴出邊擴散混合邊燃燒、在燃燒範圍處生成擴散火焰（瓦斯爐、管口噴出之都市瓦斯、氫氣）；固體液體表面揮發氣燃燒亦屬擴散燃燒（關鍵字：先混後燒、邊混邊燒、預混合火焰、擴散火焰）", "五、可加分：預混合火焰三區（預熱區、反應區95～98%溫度最高、後火焰區）；擴散火焰依雷諾數分層流（Re＜2100）、紊流（Re＞4000），建築火災屬紊流", "六、結論：可用比較表收尾（項目／定義／熱或混合方式／舉例），三組各舉一可燃物例並說明其燃燒過程"], "calcHint": "", "notes": "火災學筆記第3講（燃燒形式五大類、預混合燃燒）、第4講（擴散燃燒）；第二部主題四", "tips": "老師：燃燒形式五大類與例子配對是常考點；本題「混合燃燒」即預混合燃燒。建議三組畫成一張比較表，每組都要有「舉一可燃物例」否則失分。", "alsoIn": ["衝刺班 37"]}, {"id": "E-P103-2", "source": "升官等", "year": 103, "no": "二", "calc": false, "type": "化學反應式＋名詞", "stem": "禁水性物質中某些物質與水接觸或吸收空氣中水分時會發熱，而使接觸之可燃物發火，某些物質則因與水反應發生可燃性氣體而發火，請寫出下列化合物與水發生化學反應之反應方程式：㈠CaO（氧化鈣，生石灰）；㈡CaO₂；㈢Ba；㈣Zn₃P₂；㈤Mn₃C，並說明其禁水之理由。（25分）", "outline": ["一、破題：準自然發火性物質依與空氣及水份之反應分三類；本題屬②本身發熱使接觸之可燃物發火（CaO、CaO₂）與③與水反應生可燃性氣體而發火（Ba、Zn₃P₂、Mn₃C）；屬第三類公共危險物品禁水性物質（關鍵字：準自然發火、禁水性、發熱、可燃性氣體）", "二、㈠CaO＋H₂O→Ca(OH)₂＋熱：生成熟石灰（消石灰）大量放熱，本身不燃但使接觸之可燃物發火", "三、㈡CaO₂（鹼土金屬過氧化物）：2CaO₂＋2H₂O→2Ca(OH)₂＋O₂＋熱；放熱且放出氧氣助燃（筆記僅有鹼金屬過氧化物 2Na₂O₂＋2H₂O→4NaOH＋O₂，CaO₂ 式為同型類推 ⚠️待確認）", "四、㈢Ba（鹼土金屬）：Ba＋2H₂O→Ba(OH)₂＋H₂＋熱；生成氫氣，反應熱使氫氣發火甚至爆炸（筆記有 Ca＋2H₂O→Ca(OH)₂＋H₂，Ba 為同族類推 ⚠️待確認）", "五、㈣Zn₃P₂（金屬磷化物）：Zn₃P₂＋6H₂O→3Zn(OH)₂＋2PH₃；生成磷化氫（有毒、可燃）（筆記有 Ca₃P₂＋6H₂O→3Ca(OH)₂＋2PH₃，Zn₃P₂ 為同型類推 ⚠️待確認）", "六、㈤Mn₃C（碳化物）：（筆記未涵蓋，需補讀）；常見寫法 Mn₃C＋6H₂O→3Mn(OH)₂＋CH₄＋H₂（已驗原子數平衡，生成甲烷與氫氣）⚠️待確認；可引筆記陷阱「碳化物不一定生乙炔」（CaC₂→乙炔、Al₄C₃→甲烷）", "七、禁水理由總結：①遇水劇烈放熱→使接觸之可燃物達發火溫度 ②生成可燃性氣體（H₂、PH₃、CH₄）同時放熱→起火爆炸 ③過氧化物放出O₂助燃；故儲存須隔絕水分、保持乾燥，滅火用乾砂、膨脹蛭石，禁用水"], "calcHint": "", "notes": "火災學筆記第31講五（準自然發火三類與遇水反應式）、第29講四～五（第三類禁水性物質）；第二部主題十八「禁水性物質」", "tips": "反應式要配平並標生成氣體；老師：哪些產生乙炔／甲烷／氫氣「一定要記」。CaO₂、Ba、Zn₃P₂ 屬筆記同型類推，Mn₃C 筆記未收，考前請對照教材確認。", "alsoIn": ["衝刺班 38"]}, {"id": "E-P103-3", "source": "升官等", "year": 103, "no": "三", "calc": false, "type": "時事＋物質＋對策", "stem": "高雄市於本（103）年7月31日深夜發生傷亡慘重之氣爆案，事後調查多指向丙烯外洩為此案之原凶，因此丙烯亦已於近日被內政部消防署指定為可燃性高壓氣體之一。請就丙烯之外觀、氣味、爆炸界限、蒸氣密度及溶解度等理化性質探討丙烯之洩漏處理方法及滅火措施？（25分）", "outline": ["一、破題：丙烯（C₃H₆）於103年10月22日經內政部指定為可燃性高壓氣體（與丁二烯同列第4款）；可燃性高壓氣體洩漏或噴出常因靜電著火造成大規模火災爆炸（關鍵字：可燃性高壓氣體、高壓氣體爆炸）", "二、理化性質：爆炸界限約 2%～11%（筆記板書）；蒸氣密度＝分子量42÷空氣平均分子量28.84≒1.46，比空氣重、洩漏後沉積低窪處（依第17講比重推算法）；外觀、氣味、溶解度（筆記未涵蓋，需補讀）", "三、危險性推論：下限低、比空氣重易積聚於地下管溝與下水道，遇火源形成蒸氣雲爆炸；戶外爆炸伴隨火球與熱輻射（第18講瓦斯戶外爆炸）", "四、洩漏處理（比照筆記瓦斯洩漏處置）：關閉開關／阻斷洩漏源、熄滅並管制附近火源、勿動任何電氣開關、通風稀釋；早期發現（洩漏警報器）與緊急停止；劃定管制區、疏散（可引 HAZMAT 區域管制，第38講）", "五、滅火措施（比照筆記瓦斯管線起火處置）：無法關斷洩漏時不急於滅火，先冷卻附近設備與容器、移開可燃物再滅火，防止火滅後持續洩漏遇高溫二次爆炸；以水冷卻鋼瓶或儲槽防爆炸", "六、結論：結合高雄氣爆教訓（地下管線洩漏沿管溝擴散）提出管線巡檢與監測建議"], "calcHint": "", "notes": "火災學筆記第7講（燃燒界限板書：丙烯2%～11%）、第17講第二節（可燃性高壓氣體、丙烯指定、比重推算）、第18講（瓦斯爆炸三階段、洩漏處置）、第38講一（HAZMAT）；第二部主題十三", "tips": "筆記對丙烯的外觀、氣味、溶解度未收錄，需補讀（例如 SDS／ERG 資料）；作答時以理化性質→危險性→洩漏處理→滅火的邏輯串起來。", "alsoIn": ["衝刺班 39"]}, {"id": "E-P103-4", "source": "升官等", "year": 103, "no": "四", "calc": false, "type": "名詞＋機制", "stem": "自然發火之意義為何？請說明屬自然發火性物質之還原鎳及油脂類，係因何種化學反應熱之蓄積以致發火，並詳述其發火之機制？（25分）", "outline": ["一、自然發火意義：物質於空氣中常溫下，因化學變化而自然發熱，其反應熱經長期蓄積導致發火；可對比準自然發火（立即發火或因水分發熱）—本質同為化學反應熱，差在發火時間（關鍵字：常溫、化學變化、長期蓄積）", "二、自然發火物質依發熱原因五類：分解熱（賽璐珞、硝化綿）、氧化熱（油脂類、原棉）、吸著熱（活性碳、素灰、還原鎳）、發酵熱（枯草）、聚合熱（醋酸乙烯、丙烯睛）", "三、還原鎳＝吸著熱：粉末於製造或研碎後表面仍屬活性，置於空氣中吸著空氣中氣體而生吸著熱，熱蓄積至發火（關鍵字：表面活性、吸著熱）；還原鎳更細部化學機制（筆記未涵蓋，需補讀）", "四、油脂類＝氧化熱：含多量不飽和脂肪酸（亞麻子油酸、次麻油酸、蓖麻子油酸），常溫下極易受空氣氧化，慢慢蓄積反應熱終至發火；危險性以碘價判斷：100 g 脂肪吸收碘克數，雙鍵愈多碘價愈高，碘價130以上視為危險，亞麻仁油約200", "五、發火機制共通條件：熱之蓄積（熱傳導度小、水分少、粉末大量堆積或薄片重疊形成斷熱狀態、通風不良）＋熱的發生速度（發熱量、溫度—Arrhenius、表面積、觸媒、水分、新舊程度）；熱生成速度＝Q·Ae^(−E/RT)", "六、結論：預防—通風散熱、避免大量堆積含油物（含油抹布、切削屑）、低溫儲存"], "calcHint": "", "notes": "火災學筆記第31講（意義、影響因素、自然發火五類、油脂碘價）；第二部主題十八「自然發火」「碘價」", "tips": "老師：碘價130選擇題必考；五類都要舉例。機制段落用「熱蓄積＋熱生成速度」兩大條件撐起篇幅。", "alsoIn": ["衝刺班 40"]}, {"id": "E-S-01", "source": "衝刺班", "year": null, "no": "一", "calc": false, "type": "比較", "stem": "通風控制燃燒（Ventilation Controlled）與燃料控制燃燒（Fuel Controlled）均係火災達到閃燃之後，影響此一階段之最高溫度與其持續時間，試請說明及分析兩者的差異為何？", "outline": ["一、前言：閃燃後進入最盛期（穩態燃燒），此階段的最高溫度與持續時間決定火災猛烈度（關鍵字：最盛期、火災猛烈度＝溫度－時間曲線下面積、最高溫度＋持續時間二大因素）", "二、定義比較：通風控制＝開口流入空氣量不足，燃燒速度由流入空氣量決定、與可燃物表面積無關；燃料控制＝空氣充足，燃燒速度與通風量無關、由可燃物表面積控制（關鍵字：空氣量 vs 表面積）", "三、判斷方式：Harmathy ρg^½A√H／A_F＜0.235 通風控制、＞0.29 燃料控制；Thomas 及 Hedelden ṁ＞ṁ_air/r 通風控制、ṁ＜ṁ_air/r 燃料控制（關鍵字：通風因子 A√H、化學計量比 r）", "四、燃燒速度差異：R＝K×A√H，K 通風控制 5.5～6.0、燃料控制 0.36～0.40（關鍵字：川越邦雄、關根孝、P.H. Thomas）", "五、對最高溫度的影響：溫度因子 A√H／Aₜ 愈大，溫度曲線愈高；標準溫度曲線溫度因子 0.06（關鍵字：開口大、壁面小 → 溫度高）", "六、對持續時間的影響：T＝W′/R，持續時間因子 A_F／(A√H) 愈大，持續時間愈久；通風控制時開口小→R 小→燒得久（關鍵字：火載量 kg/m²）", "七、結論：可列比較表（控制因子、燃燒速度、K 值、溫度、持續時間）收尾"], "calcHint": "", "notes": "火災學筆記第22講（二、最盛期燃燒特性）；第11講（火災猛烈度）；第二部主題十四（通風控制燃燒／燃料控制燃燒、溫度因子／持續時間因子）", "tips": "老師：燃燒型式「考試最常考，申論 25 分」；最後用比較表收尾。"}, {"id": "E-S-02", "source": "衝刺班", "year": null, "no": "二", "calc": false, "type": "比較", "stem": "請說明「粉塵爆炸」與「一般可燃氣體與空氣混合後之爆炸」，二者之不同點何在？", "outline": ["一、定義：粉塵爆炸＝浮游於空氣中可燃性固體微粒子與空氣混合達可燃濃度，遇火焰或放電火花而爆炸；氣體爆炸＝可燃氣體與空氣混合達燃燒範圍遇火源（關鍵字：浮游粉塵、粉塵雲）", "二、起爆能量：粉塵爆炸所需最小發火能量約為瓦斯爆炸的 10²～10³ 倍", "三、燃燒速度與瞬間壓力：粉塵爆炸的燃燒速度與瞬間爆炸壓力較小", "四、燃燒時間與釋放能量：粉塵爆炸燃燒時間較長、釋放能量（壓力×時間）較大，破壞與燒毀程度較大；因粉塵粒子群單位體積所含碳氫化合物較多", "五、不完全燃燒：粉塵爆炸易不完全燃燒，產生大量 CO，有中毒危險", "六、其他差異（可補）：粉塵有二次爆炸；粉塵爆炸界限除溫度、壓力、空氣組成外，還受粉塵本身條件（水分、灰分、粒徑、加熱源）影響（關鍵字：二次爆炸、堆積粉塵揚起）"], "calcHint": "", "notes": "火災學筆記第20講（十一、粉塵爆炸與氣體爆炸之比較）；第19講（粉塵爆炸意義、影響爆炸界限因素）；第二部主題十三", "tips": "四項比較是骨幹，第六點是加分補充。"}, {"id": "E-S-23", "source": "衝刺班", "year": null, "no": "二三", "calc": true, "type": "計算", "stem": "某一 T-Square 火災成長至 1 MW 的時間為 100 秒，試問此火災自燃燒開始至成長至〔5 MW〕為止（假設火災未受到干預而且火載量亦充足的情況下），計算燃燒放出多少能量？", "outline": ["一、t² 火災理論：燃料釋熱率與時間平方成正比，至燃料燒盡或達最大釋熱率為止", "二、公式：Q＝(t/K)²（Q 用 MW、t 用 s、K 為火災成長常數 sec/MW^½）；成長階段釋放能量 E＝⅓×t×Q（曲線下面積）", "三、步驟：由 1 MW、100 s 求 K → 求到達 5 MW 的時間 t → 代 E＝⅓tQ", "四、可補判斷：K＝100 介於快速（150）與極快速（75）之間；可畫 Q－t 拋物線示意"], "calcHint": "1＝(100/K)² → K＝100 sec/MW^½。5＝(t/100)² → t＝100√5≒223.6 s。E＝⅓×223.6×5≒372.7 MJ。（Python 驗算：K 100、t 223.61、E 372.68）", "notes": "火災學筆記第9講（t² 成長、Q＝(t/K)²、E＝⅓tQ）；第三部題型12 試題2（同題）", "tips": "⚠️ 題目 5 MW 為推定字（〔 〕），與筆記題型12試題2一致。K 型用 MW，別跟 α 型（kW）混。"}, {"id": "E-S-03", "source": "衝刺班", "year": null, "no": "三", "calc": false, "type": "比較", "stem": "閃燃（Flash over）或複燃（Back draft）都是消防人員面對火災搶救時的危險的現象，國外已有諸多研究及成果，請說明及分析這二者的差異為何？", "outline": ["一、定義：閃燃＝可燃氣體蓄積天花板達燃燒範圍與燃點後一舉引火、室內頓成火海（可引 NFPA 921）；爆燃（複燃）＝悶燒缺氧產生大量可燃氣體，開口突然引入空氣而一舉燃燒（NFPA 921：sudden introduction of air）", "二、目測（閃燃）：黑煙急增、中性帶降低、噴出黑煙帶黃色；中性帶下吸氣變強、煙噴出有喘息現象；發生時開口流出的煙急速變成火焰", "三、目測（爆燃）：開口縫隙流出黑煙帶黃褐色、間歇性（push）煙與火焰混雜噴出；縫隙周圍有煤渣粒子、焦油污垢；開口打開時煙被強烈吸入、室內煙成渦卷，數秒至數十秒後噴出火球", "四、溫度：閃燃前數秒離地數十公分處已超過 150～200℃、開口流出煙 500～600℃；發生時中央 600～800℃、地面約 500℃。爆燃：悶燒高溫、開口打開降至 400～500℃、爆燃時 700～800℃", "五、氣體濃度：閃燃時 O₂ 約 1%、CO 5～10%、CO₂ 20% 以上；爆燃開口前 O₂ 2～3%、CO 約 15%、CO₂ 約 20%，開口同時 O₂ 至少 10%、CO 約 5%、CO₂ 約 10%，爆燃後 O₂ 急減、CO／CO₂ 轉增", "六、補充 Dunn（2000）：機率（閃燃較常見）、現象（火勢快速發展 vs 爆炸）、原因（熱 vs 空氣）、時期（成長期 vs 成長期或衰退期）", "七、結論：比較表收尾，並點出搶救意義（閃燃前兆要撤、爆燃要先排煙再開口）（搶救意義句為一般延伸，筆記未明列）"], "calcHint": "", "notes": "火災學筆記第23講（四、閃燃與爆燃差異：(二) 1994 目測／溫度／氣體濃度；(一) Dunn 2000）；第22講（閃燃、爆燃定義）", "tips": "老師解答用 1994 年東京消防廳目測狀態、溫度、氣體濃度三方面比較；老師：「要嘛考申論，一考就 25 分」，三方面都要寫出來。"}, {"id": "E-S-34", "source": "衝刺班", "year": null, "no": "三四", "calc": false, "type": "名詞列舉", "stem": "在都市為有效利用有限之空間，常會興建高樓大廈來符合空間之需求，因此我國高樓林立，請說明當高樓發生火災時，高樓火災具有那些特性？", "outline": ["一、定義：高樓（NFPA：上層樓地板高度超越雲梯車最大高度，須由內部搶救；EFPA：消防車輛無法到達之樓層）；高層建築物（建築技術規則第 227 條：高度 50 m 或 16 層以上）", "二、濃煙密佈：氣密性好、初期空氣不足，不完全燃燒產生大量濃煙", "三、高溫灼熱：密閉式建築、熱不易散失而蓄積", "四、延燒快速：垂直管道與樓梯形成煙囪效應（Stack Effect）", "五、逃生不易：距地面高、縱深大、通路長", "六、搶救困難：超出雲梯車範圍；即使可達，受風力、荷重、噴水反作用力影響穩定性", "七、補充對策收尾：消防安全設計六內容（內裝不燃化、結構耐火、防火區劃、逃生通道出口、排煙通風、消防安全設備）；直覺原則與萬全原則（二方向避難）"], "calcHint": "", "notes": "火災學筆記第23講（第三節 一～五：高樓定義、火災特性、消防安全設計、直覺萬全原則）；第二部主題十四", "tips": "國內法定名稱是「高層建築物」；五特性每項寫原因。"}, {"id": "E-S-04", "source": "衝刺班", "year": null, "no": "四", "calc": false, "type": "名詞＋公式", "stem": "若一定量之可燃物於室內燃燒時，一部分熱量〔會化為〕火焰向窗外噴出，請說明此一燃燒時的熱平衡方程式？另外，說明何謂溫度因子（Temperature factor）？溫度因子與火災溫度曲線的關係為何？", "outline": ["一、熱平衡意義：耐火構造居室最盛期（通風控制），單位時間燃燒產生的熱＝被帶走或吸收的熱，可據以求室內火災溫度（川越邦雄單層模型）", "二、熱平衡方程式：Q_C＝Q_L＋Q_W＋Q_R＋Q_B；Q_C 發熱速度（∝A√H，R＝5.5A√H）、Q_L 開口流出熱氣體帶走＝ṁ_g c_p(T－T₀)、Q_W 周壁吸收、Q_R 開口輻射散失＝εσA(T⁴－T₀⁴)、Q_B 室內氣體升溫所需（可略）⚠️待確認（符號各書不一）", "三、老師板書寫法：可燃物燃燒釋放熱＋室內原有熱（Q_P）－由開口流出之熱＝室內氣體質量×比熱×溫度上升值 ⚠️待確認", "四、溫度因子定義：火災溫度曲線因室內條件而高於或低於標準曲線，此室內條件稱溫度因子；F₀＝A√H／Aₜ（A 開口面積、H 開口高度、Aₜ 室內全表面積）", "五、與火災溫度曲線的關係：由熱平衡式推得室內溫度主要由 A√H／Aₜ 決定；溫度因子愈大溫度曲線愈高、愈小愈低；標準溫度曲線溫度因子為 0.06", "六、可畫溫度－時間曲線示意（F₀＞0.06 在標準曲線之上、＜0.06 在下）"], "calcHint": "", "notes": "火災學筆記第38講（三、室內燃燒熱平衡方程式）；第22講（二、(三) 溫度因子）；第二部主題十四（溫度因子）", "tips": "老師：這題「前面鋪陳很長」，重點在最後問溫度因子與溫度曲線的關係（標準 0.06）。熱平衡式為第38講依通則補，符號各書不一。"}, {"id": "E-S-05", "source": "衝刺班", "year": null, "no": "五", "calc": false, "type": "名詞＋反應式", "stem": "以前大量使用海龍鹵化烷滅火藥劑，現已因蒙特〔婁議〕定書而禁止使用，試問何以這些滅火藥劑會破壞臭氧層，請就其化學反應式說明之？並說明何以現行海龍替代品之鹵化烴滅火藥劑不會造成臭氧層之破壞？", "outline": ["一、背景：鹵化烴（海龍）滅火原理＝Br 在火焰中觸媒作用奪 OH、抑制連鎖反應；但被紫外線分解出鹵素原子破壞臭氧層，依蒙特婁議定書禁產（關鍵字：命名 CₓFᵧClzBrw→Halon xyzw、1301、1211）", "二、反應式①：受熱／紫外線分解產生 Cl·；Cl·＋O₃→ClO·＋O₂", "三、反應式②：ClO·＋O→Cl·＋O₂（氯自由基再生）；兩式相加 O₃＋O→2O₂（Cl· 為催化劑）", "四、說明：鹵素自由基反覆催化，一個自由基可破壞大量臭氧；海龍含溴，產生 Br· 同理（Br 破壞力更強 ⚠️待確認，筆記依一般知識補）", "五、替代品為何不破壞：鹵化烴替代品（FM-200＝HFC-227ea，CF₃CHFCF₃）不含氯、溴，ODP＝0；惰性氣體 IG-541（N₂52%＋Ar40%＋CO₂8%）不含鹵素", "六、補充替代品選擇條件：滅火效能高、ODP／GWP 低、大氣滯留時間短、毒性低、與原系統相容；FM-200 高溫分解會產生 HF"], "calcHint": "", "notes": "火災學筆記第36講（三、(四) 鹵化烴、(五) 海龍替代品：臭氧層反應式〔衝刺班申論1 21:09〕）；第二部主題十九", "tips": "老師：申論考法＝以化學反應式說明海龍為何破壞臭氧層、替代藥劑為何不會。反應式一定要寫。"}, {"id": "E-S-06", "source": "衝刺班", "year": null, "no": "六", "calc": true, "type": "計算", "stem": "若空氣中之氧氣含量為 20%：(一) 請寫出丙烯（C₃H₆）燃燒之化學平衡式？(二) 請計算其當量濃度（stoichiometric concentration）？(三) 請計算其爆炸上下限（lower explosive limit and upper explosive limit）？(四) 請計算其限氧濃度（limiting oxygen concentration）？", "outline": ["一、化學平衡式：C₃H₆＋9/2 O₂→3CO₂＋3H₂O（或 2C₃H₆＋9O₂→6CO₂＋6H₂O）", "二、當量濃度 Co 定義＋公式：Co＝可燃物體積÷(可燃物體積＋空氣體積)×100，空氣體積＝所需 O₂÷氧含量；本題氧含量 20% → ÷0.20（陷阱：不是 0.21）", "三、爆炸下限：Jone's Rule LFL＝0.55Co", "四、爆炸上限：Lloyd's Rule UFL＝3.5Co（可註明 Lloyd 式誤差大，照題目方法算）", "五、限氧濃度：LOC＝LFL×O₂ 莫耳係數（定義：可燃氣在 LFL 時完全燃燒所需氧濃度）"], "calcHint": "(一) C₃H₆＋4.5O₂→3CO₂＋3H₂O。(二) Co＝1÷(1＋4.5/0.20)×100＝1÷23.5×100≒4.26%。(三) LFL＝0.55×4.255≒2.34%；UFL＝3.5×4.255≒14.89%。(四) LOC＝LFL×4.5＝2.34×4.5≒10.53%。（Python 驗算：Co 4.2553、LFL 2.3404、UFL 14.8936、LOC 10.5319）", "notes": "火災學筆記第5講（五、化學平衡式）；第7講；第三部題型9（燃燒界限）、題型32（限氧濃度）；第37講公式6；第二部主題七（化學計量濃度、Jone's／Lloyd's Rule）", "tips": "氧含量題目給 20%，分母用 0.20；每個公式先寫定義再代入。"}, {"id": "E-S-07", "source": "衝刺班", "year": null, "no": "七", "calc": false, "type": "名詞", "stem": "(一) 何謂閃燃（flashover）？(二) 請說明 NFPA 265 之閃燃定義為何（即量化定義）？", "outline": ["一、閃燃定義：室內起火後生成大量可燃性氣體蓄積天花板，與空氣混合達燃燒範圍並達燃點後一舉引火，室內可燃物同時起火、頓成火海", "二、NFPA 921（2017）：區劃空間火災發展的過渡階段，表面暴露熱輻射達燃點幾乎同時，火勢快速蔓延、整個空間陷入火海", "三、NFPA 265（2015）量化定義：下列任兩種達到即視為閃燃：(1) 熱釋放率＞1 MW (2) 地板熱通量＞20 kW/m² (3) 上層煙氣溫度＞600℃（1112℉）(4) 火焰燒至門口外 (5) 地板上紙張自燃", "四、補充量化依據：Waterman 1968 首提地面輻射熱通量 20 kW/m²；Thomas 1981 閃燃公式 Q＝378A√H＋7.8Aₜ（Aₜ 扣開口面積）", "五、可補閃燃前兆（黑煙帶黃色、喘息、蹲低、滾燃）作收尾"], "calcHint": "", "notes": "火災學筆記第22講（一、(二) 閃燃：NFPA 921、NFPA 265、Waterman、Thomas）；第二部主題十四（閃燃）", "tips": "NFPA 265 五條件「任兩種」是得分關鍵；注意單位 kW/m²。"}, {"id": "E-S-08", "source": "衝刺班", "year": null, "no": "八", "calc": true, "type": "計算", "stem": "有一耐火構造之倉庫，該倉庫長為 10 公尺、寬為 10 公尺、高為 5 公尺，內部儲存木材總重 200 公斤，木材總表面積為 50 平方公尺，倉庫內有一開口，寬為 5 公尺、高為 1 公尺。試問：該倉庫若發生火災，比較容易成為何種燃燒型態？該倉庫之火載量為何（公斤／平方公尺）？燃燒速率為何（公斤／分鐘）？火災持續時間為何（分鐘）？（已知：重力加速度 g：9.8 公尺／秒平方，空氣密度：1.2 公斤／立方公尺，通風控制燃燒係數 k 為 5.5，燃料控制燃燒係數 k 為 0.4）", "outline": ["一、燃燒型態判斷：Harmathy ρg^½A√H／A_F（A_F＝可燃物表面積）；＜0.235 通風控制、＞0.29 燃料控制", "二、火載量：W＝W′／樓地板面積（kg/m²）", "三、燃燒速率：R＝K×A√H，依判斷結果選 K（燃料控制 0.4）", "四、持續時間：T＝W′／R（分鐘）", "五、每步先寫公式與符號定義，再代入、寫單位"], "calcHint": "1. ρg^½A√H／A_F＝1.2×√9.8×(5×1)×√1÷50≒0.38＞0.29 → 燃料控制燃燒。2. 火載量 W＝200÷(10×10)＝2 kg/m²。3. R＝0.4×(5×1)×√1＝2 kg/min。4. T＝200÷2＝100 min。（Python 驗算：0.3757、2、2、100）", "notes": "火災學筆記第22講（二、燃燒型式、燃燒速度、持續時間因子、火載量）；第三部題型27 試題1", "tips": "陷阱：Harmathy 式的 A_F 是可燃物表面積（50 m²），火載量才用地板面積。"}, {"id": "E-S-09", "source": "衝刺班", "year": null, "no": "九", "calc": false, "type": "比較", "stem": "沸溢（boilover）與濺溢（spillover or slopover）〔是重質〕油類火災中所常出現的臨界燃燒現象，其出現常造成災害層面擴大，是油類火災中最嚴重的一種行為。試就沸溢與濺溢發生徵兆與發生區別詳細說明。", "outline": ["一、背景：重質油含乳化水（自由水）與槽底水墊層（water sublayer）；法定名詞為溢流（slopover，濺溢）與突沸（boilover，沸溢）", "二、溢流定義：燃燒熱使油中乳化水汽化膨脹約 1700 倍，形成油泡沫使油溢出槽外；或對高溫油層放射泡沫，水與高溫油接觸沸騰使油飛散", "三、突沸定義：熱波（重餾分下沉形成熱層鋒面）向下移動速度大於燃燒速度，遇槽底水墊層大量汽化，蒸氣壓超過上部油層重量時衝破油層猛烈噴出", "四、形成因素：熱的作用（輻射熱回饋、熱波）＋水蒸氣作用", "五、發生前徵兆（6 項）：火焰由深變淺發亮白；煙由濃黑變淡；槽體劇烈顫抖變形；槽口急促嘶嘶聲；微爆噪音加大急促；槽面大量油泡翻湧蠕動", "六、兩者區別（4 項）：發生時間（一般先溢流後突沸）；危害（突沸較大）；不一定都發生（可只發生其一）；水之來源（溢流＝乳化水、突沸＝水墊層）"], "calcHint": "", "notes": "火災學筆記第33講（五、溢流與突沸：(一)～(五)）；第二部主題十八（溢流與突沸、熱波）", "tips": "老師：溢流與突沸差異「申論題很喜歡考」；可附突沸四階段示意圖。"}, {"id": "E-S-10", "source": "衝刺班", "year": null, "no": "十", "calc": true, "type": "名詞＋推導＋計算", "stem": "火災發生時，常伴隨著大量的濃煙產生，濃煙是火災中的第一殺手，請說明煙濃度表示方法中之視覺密度（optical density）表示法與遮光率表示法，並推導此兩者之關係。假設視覺密度為 1，其遮光率為多少？", "outline": ["一、煙濃度表示法總覽：化學濃度（單位體積煙粒子重量、粒子數）與光學濃度（遮光率、光學密度）", "二、遮光率：S＝(I₀－I)/I₀×100＝(1－透光率)×100（I₀ 入射光強度、I 透射光強度）", "三、光學密度（視覺密度）：物質遮光能力，無單位，D＝log(I₀/I)＝log(1/透光率)；Lambert-Beer I＝I₀e^(－KL) → D＝KL/2.3", "四、推導：S/100＝1－I/I₀ → I₀/I＝100/(100－S) → D＝log100－log(100－S)＝2－log(100－S)", "五、代入 D＝1 求遮光率"], "calcHint": "D＝2－log(100－S)；D＝1 → log(100－S)＝1 → 100－S＝10 → S＝90%。（Python 驗算：90）", "notes": "火災學筆記第12講（二、煙濃度表示方法）；第三部題型15、題型17 試題3（普考申論原題）", "tips": "推導過程每一步都要寫，這題就是推導分。"}, {"id": "E-S-11", "source": "衝刺班", "year": null, "no": "十一", "calc": false, "type": "名詞＋對策", "stem": "請詳述何謂二次粉塵爆炸？粉塵爆炸之預防對策有那些？", "outline": ["一、粉塵爆炸定義：浮游空氣中可燃性固體微粒子與空氣混合達可燃濃度，遇火焰或放電火花而爆炸", "二、二次粉塵爆炸：浮游粉塵爆炸時，爆風使堆積粉塵揚起，再被引燃而產生二次爆炸（關鍵字：堆積粉塵＝空氣停止流動後沉降的粉塵）", "三、可補五要素與機制：可燃性粉塵、氧、點火源＋懸浮擴散、侷限空間", "四、預防措施：作業場所密閉防洩漏、內部通風良好不隔間、外壁不燃防爆材料並保持安全距離；清潔、通風、集塵減少堆積；採粉塵少的設備；落實火氣管理", "五、侷限措施：耐爆設計（結構承受最大爆炸壓力）、洩爆設計（預設弱點洩壓）、抑爆設計（壓力偵測→散佈抑制劑破壞連鎖反應）、爆炸阻隔設計（快速遮斷閥阻隔火焰傳播）", "六、補充：測定方法與 Kst 可作危險度評估依據（選寫）"], "calcHint": "", "notes": "火災學筆記第19講（第四節 一、意義：粉塵二次爆炸；二、五要素）；第20講（九、粉塵爆炸防護對策）；第二部主題十三", "tips": "老師：防護對策「考試考過」；二次爆炸的「堆積粉塵揚起」是關鍵句。"}, {"id": "E-S-12", "source": "衝刺班", "year": null, "no": "十二", "calc": false, "type": "名詞＋公式", "stem": "請說明熱傳中傳導、對流及輻射現象，並〔試〕以定常公式表達各個現象傳遞熱量與溫度的關係。", "outline": ["一、熱傳導：物質內部有溫度梯度或兩物接觸，熱由高溫傳向低溫；傅立葉定律 q＝－KA(ΔT/d)＝ΔT÷(d/KA)（K 熱傳導係數 W/m·K，d/KA 為熱阻）；固體以自由電子遷移與晶格振動傳熱", "二、傳導量與溫度關係：與溫度梯度 ΔT/d 成正比；影響因素：熱傳導係數（固＞液＞氣）、截面積、溫度差", "三、熱對流：藉流動介質傳熱，分自然對流與強制對流；牛頓公式 q＝hAΔT（h 對流換熱係數，自然 5～25、強制 10～500 W/m²·K）", "四、對流量與溫度關係：與溫度差成正比；影響自然對流速度因素：通風面積高度（∝A√H）、溫度差、通風口位置", "五、熱輻射：無媒介、以電磁波（光速、0.4～100 μm）傳遞；史帝芬-波茲曼 q＝εσAT⁴（σ＝5.67×10⁻⁸ W/m²K⁴、T 用 K）", "六、輻射量與溫度關係：與絕對溫度四次方成正比；另受距離（∝1/d²）、角度（cosθ）、表面顏色粗糙度影響", "七、補充：熱通量＝q/A（W/m²）；W＝J/s；可列三者比較表收尾"], "calcHint": "", "notes": "火災學筆記第11講（第二節 熱量傳遞 一～三）；第三部題型14；第二部主題十（熱傳導、熱對流、熱輻射）", "tips": "每個現象都寫「定義＋公式＋符號單位＋與溫度的關係」四件事。"}, {"id": "E-S-13", "source": "衝刺班", "year": null, "no": "十三", "calc": false, "type": "名詞＋公式＋繪圖", "stem": "請說明物質燃燒的熱釋放率（heat release rate）及量測計算時所採耗氧法（oxygen consumption method），並請以公式說明火災初期成長期及通風控制型火盛期的熱釋放率與火災經過〔時間的關係〕。", "outline": ["一、熱釋放率定義：可燃物燃燒時單位時間釋放的熱量，Q＝E/t（kW＝kJ/s）；也常用來設計火源大小（影響 F.O.T）", "二、耗氧法原理：Thornton（1917）發現多數有機燃料每消耗 1 kg O₂ 放熱幾乎為定值；Huggett（1980）平均約 13.1 MJ/kg-O₂（±5%），量耗氧量即可推 HRR，不必知燃料成分", "三、耗氧法公式與應用：Q＝E×(ṁ_O₂,∞－ṁ_O₂)，E≒13,100 kJ/kg；錐形量熱儀（ISO 5660）、家具量熱儀、全尺度房間試驗（ISO 9705）；不完全燃燒需以 CO、CO₂ 修正", "四、成長期：t² 火災，Q＝αt²（kW，α＝1055/t²，NFPA 92B 慢／中／快／極快 600／300／150／75 s）或 Q＝(t/K)²（MW）；成長階段釋放能量 E＝⅓tQ", "五、通風控制型火盛期：HRR 趨近定值，由開口通風因子決定，燃燒速度 R＝5.5～6.0×A√H（kg/min），Q≒R×ΔH，與時間無關（穩態）（HRR＝R×ΔH 由筆記公式組合）", "六、繪圖：HRR－時間曲線，成長期拋物線上升→（閃燃）→最盛期水平段（高度由 A√H 決定）→衰退期下降"], "calcHint": "", "notes": "火災學筆記第38講（二、耗氧法）；第22講（F.O.T 火源大小：Q＝E/t；燃燒速度 R＝KA√H）；第9講（t² 成長、NFPA 92B／72）；第三部題型12；第二部主題十四（熱釋放率）、主題二十（耗氧法）", "tips": "要畫 HRR－時間圖；耗氧法為第38講依火災科學通則補（非課程內容）。"}, {"id": "E-S-14", "source": "衝刺班", "year": null, "no": "十四", "calc": false, "type": "對策（法規）", "stem": "建築物中的空調系統常以冰水或空氣來做為傳遞媒介，請問這兩者其所藉以傳遞的管路在貫穿 (一) 防煙區劃 (二) 防火區劃上應有的措施及性能。", "outline": ["一、前言：防煙區劃限制煙水平擴散（防煙壁不燃材料、下垂 50 cm 以上，地下通道 80 cm）；防火區劃限制火勢延燒；空調系統管路貫穿時會破壞區劃性能", "二、共通原則：冰水管、風管貫穿區劃之縫隙應以防火填塞材料填塞，使其具與區劃構造相同之阻煙／防火性能", "三、貫穿防煙區劃：與煙接觸部分（風管等）用不燃材料；貫穿縫隙填塞以維持阻煙性能", "四、貫穿防火區劃：風管貫穿處設防火閘門；風管與貫穿部位合成之構造應具所貫穿構造之防火時效；跨樓層立管應置於防火區劃之管道間", "五、連動：排煙口開啟時連動停止空調及通風設備，避免空調把煙送至他區", "六、冰水管與風管分別之細部規定（建築技術規則原文）：筆記未涵蓋，需補讀"], "calcHint": "", "notes": "火災學筆記第38講（五、(三) 管路貫穿防煙區劃、防火區劃之措施；(二) 防煙壁、排煙口）；第14講（空調系統效應）", "tips": "⚠️待確認：第38講此段依設置標準第188條＋題庫書補，冰水管／風管分項規定筆記未收錄原文。"}, {"id": "E-S-15", "source": "衝刺班", "year": null, "no": "十五", "calc": false, "type": "比較", "stem": "美國學者 Dunn 曾於 2000 年提出閃燃（Flashover）與複燃（Backdraft）現象之差異點，請說明其內容。", "outline": ["一、定義：閃燃（熱蓄積使室內可燃物同時起火、頓成火海）；複燃／爆燃（悶燒缺氧，空氣突然引入而一舉燃燒，NFPA 921 3.3.17）", "二、發生機率：爆燃發生機率較少；閃燃較常發生", "三、現象：爆燃是一種爆炸現象；閃燃是火勢快速發展的一種現象", "四、原因：爆燃的關鍵是空氣；閃燃的關鍵是熱（而不是空氣）", "五、發生時期：爆燃在成長期或衰退期；閃燃在成長期", "六、比較表收尾；可再補 1994 目測／溫度／氣體濃度比較作加分"], "calcHint": "", "notes": "火災學筆記第23講（四、(一) Dunn 2000 機率／現象／原因／時期）；第22講（閃燃、爆燃定義）", "tips": "四項比較一定要用表格呈現。"}, {"id": "E-S-16", "source": "衝刺班", "year": null, "no": "十六", "calc": true, "type": "計算", "stem": "若某一倉庫高 3.5 公尺、寬 10 公尺、長 20 公尺，可燃物（以木材為主）總重 1850 公斤，倉庫內有一開口，寬 1.2 公尺，高 2 公尺，若發生火災，試問其最盛期之燃燒速率和火災持續時間為多少？（已知 √2＝1.4）", "outline": ["一、說明最盛期燃燒速度趨於定值：R＝K×A√H（川越邦雄、Thomas）", "二、判斷燃燒型式：題目未給可燃物表面積，無法以 Harmathy 判斷；以木材為主、單一小開口 → 採通風控制燃燒 K＝5.5（寫出此假設）", "三、燃燒速率：代入 A＝1.2×2、H＝2", "四、持續時間：T＝W′／R（可補持續時間因子 A_F/(A√H)）"], "calcHint": "假設通風控制燃燒（K＝5.5）。A＝1.2×2＝2.4 m²，√H＝√2＝1.4。R＝5.5×2.4×1.4＝18.48 kg/min。T＝1850÷18.48≒100.1 min（約 100 分鐘）。（Python 驗算：18.48、100.11；若用 √2 精確值 R＝18.67、T＝99.1）", "notes": "火災學筆記第22講（二、燃燒速度、持續時間因子）；第三部題型27（試題2 同型）", "tips": "⚠️ 題目沒給木材表面積，要在答案寫出「假設通風控制燃燒」；題型27試題2同一套路。"}, {"id": "E-S-17", "source": "衝刺班", "year": null, "no": "十七", "calc": false, "type": "名詞列舉", "stem": "請說明影響引火之因素。", "outline": ["一、引火點與引火定義：引火點＝可燃性液體產生蒸氣達燃燒下限時之液面溫度；引火＝混合氣達燃燒範圍遇點火源即燃燒", "二、引火點（閃火點）：愈低愈易引火；燃燒界限：下限愈小、範圍愈廣愈易（危險指數 (U－L)/L）", "三、爆轟：混合蒸氣在爆轟範圍，不但易引火且產生爆轟；著（發）火能量：MIE 愈小愈易", "四、蒸發熱（氣化熱）：愈小愈易（水 539 cal/g）；沸點：愈低愈易氣化引火", "五、突沸：突沸前蒸氣少不易引火，突沸後易引火爆炸；熔點：愈低愈易", "六、斷熱變化：可燃氣體經斷熱壓縮溫度上升，可能爆炸", "七、收尾：九因素一覽（引火點、燃燒界限、爆轟、著火能量、蒸發熱、沸點、突沸、熔點、斷熱變化）"], "calcHint": "", "notes": "火災學筆記第32講（二、引火點及引火：影響引火的因素 9 種）；第二部主題十八（引火點與引火）", "tips": "九個因素都要列，每個寫「愈…愈易引火」。"}, {"id": "E-S-18", "source": "衝刺班", "year": null, "no": "十八", "calc": false, "type": "名詞＋對策", "stem": "HAZMAT 是指化學物質災害搶救的程序，請問 Z 所指何意？其又有何注意事項？", "outline": ["一、HAZMAT 定義：消防搶救指揮人員於化學物質、工廠災害搶救過程的安全標準作業程序；六字母 H 危害辨認、A 行動方案、Z 區域管制、M 建立管理系統、A 請求支援、T 善後處理", "二、Z＝區域管制（Zoning）：儘早劃定管制區，減少對大眾之危害", "三、三區：禁區（熱區、紅色區）、除污區（溫區、黃色區）、支援區（冷區、綠色區）；指揮站設於支援區，民眾與記者在支援區以外；隔離距離參考緊急應變指南（ERG）", "四、注意事項：支援區與指揮站設於上風處、高處；人員只能經除污走廊進出熱區、出熱區先除污；熱區人員穿相當等級防護衣與空氣呼吸器、兩人一組、限時管制；依 ERG 查距離並隨風向調整；標示帶劃分、派員管制登記（⚠️待確認：依一般搶救實務補）", "五、收尾：可附三區示意圖；帶一句平時備妥 SDS、ERG、毒化物防救手冊"], "calcHint": "", "notes": "火災學筆記第38講（一、H.A.Z.M.A.T.：Z 區域管制、注意事項）；第二部主題二十", "tips": "要畫熱／溫／冷三區同心圓示意圖並標上風向。第38講為非課程內容（依題庫書補）。"}, {"id": "E-S-19", "source": "衝刺班", "year": null, "no": "十九", "calc": false, "type": "名詞列舉", "stem": "電氣火災之發生，有些是因焦耳熱所產生之結果，何謂焦耳熱？請說明焦耳熱異常發生之原因。", "outline": ["一、電氣火災定義與成因：通電中電氣機械器具及設備引起之火災；電能異常轉變發熱，分異常焦耳熱與放電火花之熱", "二、焦耳熱：電流通過有電阻的導體所生之熱；焦耳定律 H＝I²Rt（熱與電阻、電流平方成正比）；異常只有兩條路：I 異常或 R 異常", "三、正常回路外電流流通—通電導體接觸：短路（異極導體直接接觸，電弧高熱、短路痕）、接地（漏電）", "四、正常回路外電流流通—絕緣破壞：表面附著導電物（積污導電現象、銀離子移動）；絕緣體變質（金原現象、部分放電）", "五、電氣條件改變—電阻值降低（電阻器半導體破壞、電容器絕緣劣化、線圈層間短路）、過負載（導線過負載、電動機過負載）", "六、電氣條件改變—局部電阻值增加（半斷線、接觸電阻增加、氧化亞銅增殖發熱）、配線一線斷線（單相三線中性線斷線、三相單相運轉 I線＝√3 I相）", "七、可畫架構圖收尾（老師：寫到架構圖第二層即可寫滿 25 分）"], "calcHint": "", "notes": "火災學筆記第25講（一、電氣火災定義；(一) 異常焦耳熱發生之原因與現象）；第二部主題十六", "tips": "先畫架構圖再逐項說明；架構不能亂（老師強調）。"}, {"id": "E-S-20", "source": "衝刺班", "year": null, "no": "二十", "calc": false, "type": "名詞＋對策", "stem": "工業配管焊接或切割金屬時經常使用氣焊，一般使用乙炔作為燃料，請說明乙炔的火災危險性及特殊滅火程序。", "outline": ["一、乙炔概述：電石＋水製得 CaC₂＋2H₂O→C₂H₂＋Ca(OH)₂；與氧混合焰 3000℃ 以上，用於燒焊切割；加壓分解爆炸 C₂H₂→2C＋H₂（放熱）", "二、火災危險性：極易燃，濃度超過下限遇靜電即迅速引燃；爆炸界限範圍極寬廣（2.5～81%）；侷限空間內純乙炔隨壓力溫度升高會爆炸；與活潑金屬（銅、銀）生成爆炸性乙醯鹽（Cu₂C₂、Ag₂C₂）", "三、特殊滅火程序：①無危險時將容器移出火場 ②阻止氣體流出，否則讓其燒完 ③隔離現場，噴水霧冷卻周遭儲槽容器 ④大型火災用無人操作水帶架／自動搖擺水瞄，否則撤離任其燒完 ⑤安全閥聲音提高或儲槽褪色立即撤離", "四、預防補充：鋼瓶內矽酸鈣多孔物質＋丙酮溶解乙炔；配管不得用銅或含銅 70% 以上合金；切割完畢先關氧氣、最後關氣瓶（防回火）"], "calcHint": "", "notes": "火災學筆記第19講（二、乙炔：來源、分解爆炸、火災危險性、特殊滅火程序、切割器操作順序）；第二部主題十三（乙炔之分解爆炸與防止）", "tips": "「安全閥聲音提高或褪色立即撤離」是必寫句。"}, {"id": "E-S-21", "source": "衝刺班", "year": null, "no": "二一", "calc": false, "type": "法規＋名詞", "stem": "依據「公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法」，請說明第五類危險物品有何共同之理化特性？TNT 屬第五類危險物品，請寫出其英文及中文全名與結構式。", "outline": ["一、第五類名稱：自反應物質及有機過氧化物；自反應物質＝無氧或空氣參與也能激烈放熱分解的液態或固態物質；有機過氧化物＝含 -O-O- 結構之有機物、熱不穩定、可自加速分解", "二、共同理化特性：固體或液體；可進行放熱分解反應；熱不穩定；吸熱後自加速分解甚至爆炸（自身含氧、不需外部氧）", "三、分型與管制量：A 型（可能引爆或迅速爆燃）、B 型（可能熱爆炸）10 kg；C、D 型 100 kg；圖示 A 炸彈、B 炸彈＋火焰、C／D 火焰", "四、TNT 中文全名：三硝基甲苯（分子式 C₆H₂(CH₃)(NO₂)₃）；性質：爆速爆力較其他硝基炸藥低、與金屬不作用、不溶於水、淡黃色柱狀結晶見光變茶褐色", "五、TNT 英文全名與結構式：筆記未涵蓋，需補讀（結構＝苯環上接一個 -CH₃ 與三個 -NO₂；取代位置 2,4,6、英文 Trinitrotoluene 請對照教材）"], "calcHint": "", "notes": "火災學筆記第30講（5. 自反應物質及有機過氧化物：定義、A～D 型、衝刺班申論3 共通理化特性）；第17講（五、常見爆炸性物質：T.N.T）；第29講（六類分類）", "tips": "⚠️待確認：筆記第30講記老師衝刺班講的是「DNT」英中文全名與結構式，但本題題目是 TNT，請對照投影片。"}, {"id": "E-S-22", "source": "衝刺班", "year": null, "no": "二二", "calc": false, "type": "名詞列舉", "stem": "何謂閃燃？何謂閃燃時間？影響閃燃時間的因素為何？", "outline": ["一、閃燃定義（含 NFPA 921；可補 NFPA 265 任兩條件：1 MW、20 kW/m²、600℃、火焰出門口、地板紙張自燃）", "二、閃燃時間（F.O.T）：火災發生後至到達閃燃為止之時間；閃燃後人在起火居室無法生存，避難對策上延長 F.O.T 至為重要", "三、因素一 內部裝潢材料：位置（天花板＞牆壁＞地板）、燃燒性（難燃者長）、熱傳導率（大者長）、厚度（厚者長）→ 天花板與牆壁上部優先用難燃、厚、熱傳導率高之材料", "四、因素二 火源大小：火源愈小 F.O.T 愈長；以熱釋放率 HRR 設計火源大小，Q＝E/t（kW）", "五、因素三 開口率：開口面積÷牆壁面積；開口率小則空氣不足 F.O.T 較長，1/16 以下不易閃燃；極端擴大時冷空氣冷卻作用亦使 F.O.T 拉長"], "calcHint": "", "notes": "火災學筆記第22講（一、(二) 閃燃、4. 閃燃時間及影響因素）；第二部主題十四（閃燃時間及影響因素）", "tips": "三大因素中裝潢材料有四個子項，都要寫。"}, {"id": "E-S-24", "source": "衝刺班", "year": null, "no": "二四", "calc": true, "type": "計算", "stem": "天花板下方熱氣流的速度常是啟動撒水頭的重要參數，若一穩態火源為 1 MW，水平天花板高度為 3 公尺，室溫為 25℃，則離火源正上方天花板水平 2 公尺處，熱氣流的速度為何？（已知 3^0.5＝1.7；1000^(1/3)＝9.8；2^(5/6)＝1.8）", "outline": ["一、天花板噴射流（ceiling jet）說明：火羽流撞擊天花板後沿天花板水平擴散的熱氣流，其溫度、速度決定撒水頭／探測器動作", "二、Alpert 速度公式：R/H≦0.15 時 U＝0.96(Q/H)^(1/3)；R/H＞0.15 時 U＝0.195Q^(1/3)H^(1/2)/R^(5/6)（Q 用 kW）", "三、判斷：R/H＝2/3≒0.67＞0.15 → 用第二式", "四、代入計算並寫單位 m/s；室溫 25℃ 為求溫度用（本題問速度用不到）"], "calcHint": "R/H＝2/3≒0.67＞0.15。U＝0.195×Q^(1/3)×H^(1/2)÷R^(5/6)＝0.195×9.8×1.7÷1.8≒1.80 m/s（依題目給的近似值）。（Python 驗算：給定值 1.8048；以精確值 1000^(1/3)＝10、√3＝1.732、2^(5/6)＝1.782 計為 1.90 m/s）", "notes": "火災學筆記第16講（二、天花板噴射流）；第三部題型21（Alpert 公式、例題2）", "tips": "⚠️ 題目給 1000^(1/3)＝9.8 與實際值 10 不符（疑投影片誤植），考試照題目給的數字算。先寫 R/H 判斷再選式。"}, {"id": "E-S-25", "source": "衝刺班", "year": null, "no": "二五", "calc": true, "type": "名詞＋計算", "stem": "煙的光學密度（Optical Density）常被用來表示煙的濃度，請說明何謂「單位長度之光學密度」？若某一厚度為 3 公尺之煙層，測得有 50% 之光通過，請計算其「單位長度之光學密度」。（已知 Log 2＝0.3）", "outline": ["一、光學密度定義：物質遮光能力，入射光與透射光強度比的常用對數，D＝log(I₀/I)，無單位；Lambert-Beer D＝KL/2.3", "二、單位長度光學密度：D_L＝D/L＝K/2.3，單位 m⁻¹（L 煙層厚度、K 減光係數）", "三、補充其他表示法：比光學密度 D_S＝D_L×V_c/A_v（無單位）、質量光學密度 D_m＝D_L×V_c/m_f（m²/g）；測量目的是估算減光係數 K 以推能見度（KS＝8／3）", "四、計算：透光 50% → D＝log2 → D_L＝D/3（可再延伸 K＝2.3D_L）"], "calcHint": "D＝log(I₀/I)＝log(1/0.5)＝log2＝0.3。D_L＝D/L＝0.3÷3＝0.1 m⁻¹。（延伸：K＝2.3×0.1＝0.23 m⁻¹）（Python 驗算：0.1；以 log2＝0.30103 計為 0.1003）", "notes": "火災學筆記第12講（二、(二) 光學密度表示法種類）；第三部題型17 試題1（同型，厚度 5 m）", "tips": "單位 m⁻¹ 一定要寫；老師：單位換算不會「會很冤枉」。"}, {"id": "E-S-26", "source": "衝刺班", "year": null, "no": "二六", "calc": false, "type": "名詞＋比較", "stem": "請說明何謂「金原現象」？其與積污導電現象有無不同？", "outline": ["一、背景：兩者都屬異常焦耳熱中「正常回路外電流流通」的絕緣破壞（積污導電＝絕緣物表面附著導電物；金原現象＝絕緣體變質）", "二、金原現象（石墨化現象）：木材、電木等絕緣體絕緣性受破壞而流通電流，即有機物之導電化現象", "三、積污導電現象（Tracking、電痕、沿面洩漏放電）：異極導體間絕緣物表面附著水分灰塵或電解質液體、金屬粉塵，表面流通電流產生焦耳熱、水分蒸發、小規模放電周而復始，形成導電通路；例：插頭積塵受潮", "四、差異點：初期因電解質污染物附著而通電者＝積污導電；絕緣體表面本身形成導電化通路而通電者＝金原現象", "五、相同點：最後皆為有機絕緣體石墨化，日本電氣學會定義二者皆形成「碳化導電通路」，統稱石墨化現象", "六、結論：有不同（初期成因），也有相同（最終結果）；可用比較表收尾"], "calcHint": "", "notes": "火災學筆記第25講（(2) 電氣因素所造成的絕緣破壞；※積污導電現象與金原現象之異同）；第二部主題十六", "tips": "老師：「最常考」積污導電與金原現象有何不同；要寫出「異」與「同」兩面。"}, {"id": "E-S-27", "source": "衝刺班", "year": null, "no": "二七", "calc": false, "type": "比較", "stem": "請比較天然氣與液化石油氣在主要成分、燃燒反應式、蒸氣密度、引火性及儲存安全上有何異同？", "outline": ["一、主要成分：NG 甲烷（少量乙、丙、丁烷），俗稱天然瓦斯、導管瓦斯；LPG 丙烷（約 70%）、丁烷，俗稱桶裝瓦斯", "二、燃燒反應式：CH₄＋2O₂→CO₂＋2H₂O；C₃H₈＋5O₂→3CO₂＋4H₂O（C₄H₁₀＋13/2O₂→4CO₂＋5H₂O）（反應式依第5講配平法自寫）", "三、蒸氣密度：空氣平均分子量 28.84；NG 16/28.84≒0.55 較空氣輕、洩漏往上散；LPG 44/28.84≒1.5 較空氣重、沉積低處不易散", "四、引火性：燃燒範圍 NG 5～15%、LPG 1.8～9.5%；危險指數 NG＝(15－5)/5＝2、LPG＝(9.5－1.8)/1.8≒4.3 → LPG 較危險", "五、儲存安全：NG 需配管線、易受損；LPG 鋼瓶品質不良或接管不當易生危險、載運途中有災害之虞；處置：洩漏時關開關、熄火源、開門窗、勿動電氣開關；鋼瓶起火先以水冷卻", "六、相同點：同屬可燃性氣體（高壓氣體）、洩漏遇火源可生戶外或室內氣爆；結論 LPG 較危險"], "calcHint": "", "notes": "火災學筆記第17講（四、NG 與 LPG 特性比較）；第18講（NG／LPG 危險性、瓦斯洩漏處置）；第5講（化學平衡式）", "tips": "老師：NG vs LPG「高考考過 25 分」；危險指數計算要寫出來。"}, {"id": "E-S-28", "source": "衝刺班", "year": null, "no": "二八", "calc": false, "type": "法規", "stem": "請說明我國對危險物品之分類及 NFPA（National Fire Protection Association）之危險物品標示方法。", "outline": ["一、法源：公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第 3 條", "二、六類：第一類氧化性固體、第二類易燃固體、第三類發火性液體／發火性固體及禁水性物質、第四類易燃液體及可燃液體、第五類自反應物質及有機過氧化物、第六類氧化性液體（口訣：氧固、易固、禁水、易液、自反、氧液）", "三、各類重點一句：如第四類依閃火點分特殊易燃物、第一～四石油類、酒精類、動植物油類（易燃液體 ≦93℃、可燃液體 93～250℃）", "四、NFPA 704M 危害分類：可燃性、反應性、健康危害（毒性）及其他四類；每類 0～4 五級，4 最危險", "五、標示方法：菱形方塊，紅＝可燃性、黃＝反應性、藍＝健康、最下方白＝特殊（W 禁水性加橫槓、OXY 氧化劑）；畫菱形圖", "六、例：金屬鉀下方標 W、過氧化鈉下方標 OXY"], "calcHint": "", "notes": "火災學筆記第29講（一、公共危險物品六類）；第30講（第四～六類；(四) NFPA 704M）；第二部主題十八", "tips": "老師：這題「這幾年考了很多題」，一定要畫 NFPA 菱形。"}, {"id": "E-S-29", "source": "衝刺班", "year": null, "no": "二九", "calc": false, "type": "名詞", "stem": "請說明粉塵爆炸及其危險性之測定方法。", "outline": ["一、粉塵爆炸定義：浮游空氣中可燃性固體微粒子與空氣混合達可燃濃度遇火源而爆炸；可帶二次爆炸", "二、五要素：可燃性粉塵、氧化劑、點火源、懸浮擴散、侷限空間；兩種機制（揮發／分解出可燃氣 vs 木炭焦炭金屬直接氧化）", "三、影響因素（選寫）：化學組成（灰分 15～30% 以上不易爆）、粒徑、爆炸界限、與可燃氣共存、發火溫度、MIE、溫度壓力", "四、測定法一 不活潑性氣體添加法：加 CO₂、N₂ 降氧至不燃，求氧界限濃度；氧界限濃度愈低愈危險（輕金屬粉塵 4～6% 最危險）", "五、測定法二 不活潑性固體添加法：混入燒過的白土至不燃，求添加比率；添加率愈高愈危險；例：煤坑撒岩粉", "六、補充：Kst＝(dP/dt)ₘₐₓ×V^(1/3) let R = null;
function pickDrill(subj){
  const p = pool(subj);
  const unseen = shuffle(p.filter(q => !S.seen[q.id])), wrong = shuffle(p.filter(q => S.seen[q.id] && S.wrong[q.id] > 0)), rest = shuffle(p.filter(q => S.seen[q.id] && !(S.wrong[q.id] > 0)));

function pickMock(subj){

    if (topic === '英文'){ // keep passage groups together
      const groups = {}; all.forEach(q => { const k = q.passage ? q.id.slice(0, q.id.lastIndexOf('-')) + '|' + q.passage.slice(0, 20) : q.id; (groups[k] = groups[k] || []).push(q); });
      const singles = shuffle(Object.values(groups).filter(g => g.length === 1).flat()), multi = shuffle(Object.values(groups).filter(g => g.length > 1));
      const got = []; for (const g of multi){ if (got.length + g.length <= Math.ceil(n / 2)) got.push(...g); }
      got.push(...singles.slice(0, n - got.length)); out.push(...got);

}

const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function record(q, choice){

}

  if (!ET) return;
  if (a === 'tgl'){ if (ET.running){ ET.left = eleft(); ET.running = false; } else { ET.t0 = Date.now(); ET.running = true; } edrawClock(); return; }
  if (a === 'rst'){ if (ET.running && !confirm('重設計時回 30:00？')) return; ET.left = ESSAY_SEC * 1000; ET.running = false; ET.alerted = false; edrawClock(); return; }
  if (a === 'show'){ ET.show = true; essayOpen(ET.id, true); return; }
  if (a === 'mk'){ const m = EM[ET.id] = EM[ET.id] || {}; m[b.dataset.k] = !m[b.dataset.k]; if (!m.ok && !m.weak) delete EM[ET.id]; esave(); essayOpen(ET.id, true); return; }
}
